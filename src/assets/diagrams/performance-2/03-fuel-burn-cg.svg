<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 672" role="img" aria-labelledby="ti de"><title id="ti">Fuel burn moves the CG during the flight</title><desc id="de">Invented four-seat example. Basic empty 1,500 pounds at arm 85.0, front seats 340 pounds at 85.0, baggage 40 pounds at 140.0, and 36 gallons of fuel, 216 pounds, at arm 75.0 give a takeoff weight of 2,096 pounds, moment 178,200 and CG 85.02 inches. After burning 18 gallons, the fuel is 108 pounds at arm 75.0, weight 1,988 pounds, moment 170,100 and CG 85.56 inches, about half an inch aft. Because the fuel is forward of the CG, burning it moves the CG aft. Check the CG at takeoff and at landing weight against the limits in the aircraft's own handbook.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:var(--diagram-text-opacity,.85)}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:var(--diagram-fill-opacity,.6)}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:var(--diagram-fill-opacity,.6)}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:var(--diagram-fill-opacity,.6)}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:var(--diagram-fill-opacity,.6)}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q4{stroke:currentColor;stroke-width:1.5}.q0{font-size:12.5px}.q1{font-size:12px}.q2{stroke-width:1.4;opacity:.7}.q3{stroke-width:1.2;opacity:.5}.q5{font-size:13px}</style><text class="t" x="20" y="28" style="font-size:15px">Fuel burn moves the CG during the flight</text><text class="s q5" x="20" y="50">Invented four-seat example: check the CG at takeoff and again at landing weight.</text><rect class="cl" x="20" y="81.16" width="690" height="252" rx="8"/><text class="t q5" x="32" y="103.16">Loading table: weight x arm = moment</text><text class="t q1" x="32" y="127.16">Item</text><text class="t e q1" x="312" y="127.16">Weight (lb)</text><text class="t e q1" x="412" y="127.16">Arm (in)</text><text class="t e q1" x="692" y="127.16">Moment (in-lb)</text><path d="M32 133.16L698 133.16" class="dk q3"/><text class="s q0" x="32" y="153.16">Basic empty aircraft</text><text class="s e q0" x="312" y="153.16">1,500</text><text class="s e q0" x="412" y="153.16">85.0</text><text class="s e q0" x="692" y="153.16">127,500</text><text class="s q0" x="32" y="174.16">Front seats</text><text class="s e q0" x="312" y="174.16">340</text><text class="s e q0" x="412" y="174.16">85.0</text><text class="s e q0" x="692" y="174.16">28,900</text><text class="s q0" x="32" y="195.16">Baggage</text><text class="s e q0" x="312" y="195.16">40</text><text class="s e q0" x="412" y="195.16">140.0</text><text class="s e q0" x="692" y="195.16">5,600</text><text class="s q0" x="32" y="216.16">Fuel at takeoff, 36 gal</text><text class="s e q0" x="312" y="216.16">216</text><text class="s e q0" x="412" y="216.16">75.0</text><text class="s e q0" x="692" y="216.16">16,200</text><path d="M32 241.16L698 241.16" class="dk q3"/><text class="t q0" x="32" y="259.16">Takeoff total (CG 85.02 in)</text><text class="t e q0" x="312" y="259.16">2,096</text><text class="t e q0" x="692" y="259.16">178,200</text><path d="M32 271.16L698 271.16" class="dk q3"/><text class="s q0" x="32" y="291.16">Burn 18 gal (108 lb) of fuel</text><text class="s e q0" x="312" y="291.16">-108</text><text class="s e q0" x="412" y="291.16">75.0</text><text class="s e q0" x="692" y="291.16">-8,100</text><path d="M32 303.16L698 303.16" class="dk q3"/><text class="t q0" x="32" y="321.16">Landing total (CG 85.56 in)</text><text class="t e q0" x="312" y="321.16">1,988</text><text class="t e q0" x="692" y="321.16">170,100</text><rect class="cl" x="20" y="345.16" width="690" height="134" rx="8"/><text class="t q5" x="32" y="367.16">CG position, inches from the datum</text><path d="M82 423.16L648 423.16" class="dk" style="stroke-width:1.6;opacity:.7"/><path d="M82 423.16L82 429.16" class="dk q2"/><text class="s m q1" x="82" y="445.16">84.5</text><path d="M223.5 423.16L223.5 429.16" class="dk q2"/><text class="s m q1" x="223.5" y="445.16">85.0</text><path d="M365 423.16L365 429.16" class="dk q2"/><text class="s m q1" x="365" y="445.16">85.5</text><path d="M506.5 423.16L506.5 429.16" class="dk q2"/><text class="s m q1" x="506.5" y="445.16">86.0</text><path d="M648 423.16L648 429.16" class="dk q2"/><text class="s m q1" x="648" y="445.16">86.5</text><path d="M229.16 420.16l-8 -15h16z" class="ah"/><text class="t m q1" x="229.16" y="399.16">Takeoff 85.02</text><path d="M381.98 420.16l-8 -15h16z" class="ah"/><text class="t m q1" x="381.98" y="399.16">Landing 85.56</text><path d="M241.16 415.16L369.98 415.16" class="acc" style="stroke-width:2"/><text class="s m q1" x="365" y="467.16">About half an inch aft. Your forward and aft limits come from your own POH, not drawn here.</text><rect class="cl" x="20" y="491.16" width="690" height="108.5" rx="8"/><circle cx="34" cy="511.16" r="2.2" class="ah"/><text class="s q0" x="42" y="515.2">Here the fuel arm (75 in) is forward of the CG (about 85 in), so burning fuel moves the CG</text><text class="s q0" x="42" y="531.7">aft</text><circle cx="34" cy="548.16" r="2.2" class="ah"/><text class="s q0" x="42" y="552.2">Where the tanks sit decides the direction and the size; in most small aircraft they are near</text><text class="s q0" x="42" y="568.7">the CG, so the shift is small</text><circle cx="34" cy="585.16" r="2.2" class="ah"/><text class="s q0" x="42" y="589.2">Check weight and CG for takeoff and again for landing, at the fuel you expect to have left</text><rect class="cl" x="20" y="611.66" width="690" height="45.68" rx="8"/><text class="s q1" x="32" y="635.7">Source: PHAK (FAA-H-8083-25C) ch. 10, Weight and Balance. Weights and arms are invented; use your</text><text class="s q1" x="32" y="651.5">aircraft's records.</text></svg>
