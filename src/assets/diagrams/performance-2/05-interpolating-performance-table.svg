<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 596" role="img" aria-labelledby="ti de"><title id="ti">Between the lines: interpolating a performance table</title><desc id="de">Invented table: at 20 degrees C the ground roll is 800 feet at 2,000 feet pressure altitude and 960 feet at 4,000 feet. To find it at 3,000 feet: the fraction along is 3,000 minus 2,000 divided by 4,000 minus 2,000, which is 0.5; the difference is 160 feet; half of that is 80 feet; the answer is 880 feet. At 2,500 feet, a quarter of the way, it would be 840 feet. Work one variable at a time, round to the more conservative figure, and read the notes under the table.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:var(--diagram-text-opacity,.85)}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:var(--diagram-fill-opacity,.6)}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:var(--diagram-fill-opacity,.6)}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:var(--diagram-fill-opacity,.6)}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:var(--diagram-fill-opacity,.6)}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q4{stroke:currentColor;stroke-width:1.5}.q0{font-size:12px}.q1{font-size:12.5px}.q2{font-size:13px}.q3{fill:var(--diagram-on-fill,#fff);font-size:12px}</style><text class="t" x="20" y="28" style="font-size:15px">Between the lines: interpolating a performance table</text><text class="s q2" x="20" y="50">Your numbers rarely land on a table row. Invented ground roll table for one weight and 20 C.</text><rect class="cl" x="20" y="81.16" width="690" height="130" rx="8"/><text class="t q2" x="32" y="103.16">You need the ground roll at a pressure altitude of 3,000 ft</text><text class="t q0" x="32" y="129.16">Pressure altitude</text><text class="t q0" x="252" y="129.16">Ground roll</text><path d="M32 135.16L392 135.16" class="dk" style="stroke-width:1.2;opacity:.5"/><text class="s q1" x="32" y="155.16">2,000 ft</text><text class="s q1" x="252" y="155.16">800 ft</text><text class="t q1" x="32" y="177.16">3,000 ft</text><text class="t q1" x="252" y="177.16">? (halfway between)</text><text class="s q1" x="32" y="199.16">4,000 ft</text><text class="s q1" x="252" y="199.16">960 ft</text><text class="s q0" x="430" y="129.16">Bars, to scale</text><rect x="432" y="141.16" width="240" height="16" class="sky q4"/><rect x="432" y="163.16" width="264" height="16" class="rose q4"/><rect x="432" y="185.16" width="288" height="16" class="sky q4"/><rect class="cl" x="20" y="223.16" width="690" height="164" rx="8"/><text class="t q2" x="32" y="245.16">Steps</text><rect x="32" y="259.16" width="212" height="88" rx="10" class="sky q4"/><circle cx="48" cy="276.16" r="10" class="ah"/><text class="t m q3" x="48" y="280.16">1</text><text class="t q0" x="64" y="280.16">How far along?</text><text class="s q0" x="42" y="303.2">(3,000 - 2,000) / (4,000 -</text><text class="s q0" x="42" y="319">2,000) = 0.5, halfway</text><rect x="259" y="259.16" width="212" height="88" rx="10" class="lav q4"/><circle cx="275" cy="276.16" r="10" class="ah"/><text class="t m q3" x="275" y="280.16">2</text><text class="t q0" x="291" y="280.16">Table difference</text><text class="s q0" x="269" y="303.2">960 - 800 = 160 ft between</text><text class="s q0" x="269" y="319">the two rows</text><rect x="486" y="259.16" width="212" height="88" rx="10" class="mint q4"/><circle cx="502" cy="276.16" r="10" class="ah"/><text class="t m q3" x="502" y="280.16">3</text><text class="t q0" x="518" y="280.16">Take that share</text><text class="s q0" x="496" y="303.2">0.5 x 160 = 80 ft, so 800 +</text><text class="s q0" x="496" y="319">80 = 880 ft</text><text class="t q1" x="32" y="375.16">Ground roll at 3,000 ft: about 880 ft. At 2,500 ft it would be a quarter of the way: 800 + 40 = 840 ft.</text><rect class="cl" x="20" y="399.16" width="690" height="125" rx="8"/><circle cx="34" cy="419.16" r="2.2" class="ah"/><text class="s q1" x="42" y="423.2">Do one variable at a time: weight, then pressure altitude, then temperature, in the order the</text><text class="s q1" x="42" y="439.7">table is laid out</text><circle cx="34" cy="456.16" r="2.2" class="ah"/><text class="s q1" x="42" y="460.2">Round up to the more conservative (longer) number, then read every note under the table:</text><text class="s q1" x="42" y="476.7">wind, slope, surface</text><circle cx="34" cy="493.16" r="2.2" class="ah"/><text class="s q1" x="42" y="497.2">If your numbers fall outside the table, the book gives no figure: talk it over with your</text><text class="s q1" x="42" y="513.7">instructor</text><rect class="cl" x="20" y="536.16" width="690" height="45.68" rx="8"/><text class="s q0" x="32" y="560.2">Source: PHAK (FAA-H-8083-25C) ch. 11, Performance. Table values are invented; use your aircraft's</text><text class="s q0" x="32" y="576">POH.</text></svg>
