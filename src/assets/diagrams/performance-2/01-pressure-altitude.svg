<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 599" role="img" aria-labelledby="ti de"><title id="ti">Pressure altitude from field elevation and altimeter setting</title><desc id="de">Pressure altitude equals field elevation plus 29.92 minus the altimeter setting, times 1,000 feet, because pressure changes about 1 inch of mercury per 1,000 feet. Examples: elevation 1,500 feet with setting 30.12 gives 1,300 feet; with setting 29.72 gives 1,700 feet; elevation 5,000 feet with setting 29.92 gives 5,000 feet. A setting above 29.92 means a lower pressure altitude, below 29.92 a higher one. You can also set 29.92 and read the altimeter. Pressure altitude is then combined with temperature to get density altitude.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:var(--diagram-text-opacity,.85)}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:var(--diagram-fill-opacity,.6)}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:var(--diagram-fill-opacity,.6)}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:var(--diagram-fill-opacity,.6)}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:var(--diagram-fill-opacity,.6)}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q4{stroke:currentColor;stroke-width:1.5}.q0{font-size:12.5px}.q1{font-size:13px}.q2{font-size:12px}.q3{stroke-width:2}</style><text class="t" x="20" y="28" style="font-size:15px">Pressure altitude from field elevation and altimeter setting</text><text class="s q1" x="20" y="50">Pressure altitude is the altitude shown when the altimeter is set to 29.92. Charts ask for it.</text><rect class="cl" x="20" y="81.16" width="690" height="185.66" rx="8"/><text class="t q1" x="32" y="103.16">The quick way: use the altimeter setting</text><text class="t q1" x="32" y="125.2">Pressure altitude = field elevation + (29.92 - altimeter setting) x 1,000 ft</text><text class="s q0" x="32" y="146.3">Pressure changes about 1 inch of mercury per 1,000 feet, so every 0.01 inch is about 10 feet.</text><path d="M102 206.82L628 206.82" class="dk" style="stroke-width:1.6;opacity:.7"/><path d="M102 200.82L102 212.82" class="dk q3"/><text class="t m q1" x="102" y="230.82">30.12</text><text class="s m q0" x="102" y="192.82">-200 ft</text><path d="M365 200.82L365 212.82" class="dk q3"/><text class="t m q1" x="365" y="230.82">29.92</text><text class="s m q0" x="365" y="192.82">0 ft</text><path d="M628 200.82L628 212.82" class="dk q3"/><text class="t m q1" x="628" y="230.82">29.72</text><text class="s m q0" x="628" y="192.82">+200 ft</text><text class="s m q2" x="365" y="252.82">Altimeter setting, inches of mercury (added to field elevation)</text><rect class="cl" x="20" y="278.82" width="690" height="128" rx="8"/><text class="t q1" x="32" y="300.82">Worked examples (invented numbers)</text><text class="t q2" x="32" y="324.82">Field elevation</text><text class="t q2" x="182" y="324.82">Altimeter setting</text><text class="t q2" x="322" y="324.82">29.92 - setting</text><text class="t q2" x="512" y="324.82">Pressure altitude</text><path d="M32 330.82L698 330.82" class="dk" style="stroke-width:1.2;opacity:.5"/><text class="s q0" x="32" y="350.82">1,500 ft</text><text class="s q0" x="182" y="350.82">30.12</text><text class="s q0" x="322" y="350.82">-0.20 = -200 ft</text><text class="t q0" x="512" y="350.82">1,300 ft</text><text class="s q0" x="32" y="372.82">1,500 ft</text><text class="s q0" x="182" y="372.82">29.72</text><text class="s q0" x="322" y="372.82">+0.20 = +200 ft</text><text class="t q0" x="512" y="372.82">1,700 ft</text><text class="s q0" x="32" y="394.82">5,000 ft</text><text class="s q0" x="182" y="394.82">29.92</text><text class="s q0" x="322" y="394.82">0.00 = 0 ft</text><text class="t q0" x="512" y="394.82">5,000 ft</text><rect class="cl" x="20" y="418.82" width="690" height="108.5" rx="8"/><circle cx="34" cy="438.82" r="2.2" class="ah"/><text class="s q0" x="42" y="442.8">A setting above 29.92 puts pressure altitude below the field elevation; a setting below 29.92</text><text class="s q0" x="42" y="459.3">puts it above</text><circle cx="34" cy="475.82" r="2.2" class="ah"/><text class="s q0" x="42" y="479.8">Another way: set 29.92 in the Kollsman window and read the altimeter, or use it if ATIS or</text><text class="s q0" x="42" y="496.3">AWOS reports it</text><circle cx="34" cy="512.82" r="2.2" class="ah"/><text class="s q0" x="42" y="516.8">Next step: add the temperature to get density altitude (next diagram)</text><rect class="cl" x="20" y="539.32" width="690" height="45.68" rx="8"/><text class="s q2" x="32" y="563.3">Source: PHAK (FAA-H-8083-25C) ch. 11, Performance, and ch. 8, altimeter. Example numbers are</text><text class="s q2" x="32" y="579.2">invented.</text></svg>
