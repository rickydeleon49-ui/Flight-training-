<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 430" role="img" aria-labelledby="ti de"><title id="ti">Warm front cross-section</title><desc id="de">Cross-section of a warm front moving to the right. Warm air slides up over a shallow wedge of cooler air, so the frontal slope is gentle. Cirriform and stratiform clouds form along the front with light to moderate precipitation ahead of it. Three columns describe conditions after, at and before passage.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:17px}.q1{stroke-width:2}.q2{font-size:19px}</style><rect class="rose" x="20" y="20" width="690" height="250"/><path class="o sky" d="M250 270L710 270L710 100z"/><path class="cl" d="M300 252L700 82L700 38L330 195z" style="fill-opacity:.2"/><path class="o q1" d="M560 34L590 48"/><path class="o q1" d="M610 34L640 48"/><path class="o q1" d="M660 34L690 48"/><path class="o q1" d="M330 214L322 256"/><path class="o q1" d="M352 214L344 256"/><path class="o q1" d="M374 214L366 256"/><path class="o q1" d="M396 214L388 256"/><path class="o q1" d="M418 214L410 256"/><path class="o q1" d="M440 214L432 256"/><path class="o q1" d="M462 214L454 256"/><circle class="cl" cx="95" cy="235" r="22"/><circle class="cl" cx="125" cy="225" r="26"/><circle class="cl" cx="160" cy="236" r="22"/><circle class="cl" cx="130" cy="240" r="22"/><path class="o" d="M20 270H710"/><text class="t" x="30" y="60">Warm air</text><text class="s q0" x="30" y="84">Slides up over cooler air</text><text class="s q0" x="30" y="108">Moves 10 to 25 mph</text><text class="t" x="560" y="236">Cold air</text><path class="acc" d="M40 150L188 150"/><path class="ah" d="M200 150L186 159L186 141z"/><text class="s q0" x="30" y="134">Front moves this way</text><text class="t q2" x="20" y="312">After passage</text><text class="s q0" x="20" y="336">Stratocumulus clouds;</text><text class="s q0" x="20" y="358">rain showers possible</text><text class="s q0" x="20" y="380">Visibility improves</text><text class="s q0" x="20" y="402">Wind from south-southwest</text><text class="t q2" x="255" y="312">At the front</text><text class="s q0" x="255" y="336">Stratiform clouds,</text><text class="s q0" x="255" y="358">drizzle possible</text><text class="s q0" x="255" y="380">Poor visibility</text><text class="s q0" x="255" y="402">Temperature rises steadily</text><text class="t q2" x="490" y="312">Before passage</text><text class="s q0" x="490" y="336">Cirriform or stratiform</text><text class="s q0" x="490" y="358">clouds; fog possible</text><text class="s q0" x="490" y="380">Light to moderate rain,</text><text class="s q0" x="490" y="402">sleet, snow, or drizzle</text></svg>
