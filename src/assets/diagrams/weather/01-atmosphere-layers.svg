<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 430" role="img" aria-labelledby="ti de"><title id="ti">Atmosphere layers</title><desc id="de">Side view of the lower atmosphere drawn as stacked bands, not to scale. From the ground up: the troposphere, where most weather occurs, a dashed tropopause line that traps moisture and weather, the stratosphere to about 160,000 feet with little weather, and above it the mesosphere and thermosphere with little influence on weather.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><rect class="lav" x="30" y="16" width="210" height="64"/><rect class="mint" x="30" y="80" width="210" height="116"/><rect class="sky" x="30" y="196" width="210" height="214"/><path class="o" d="M30 16H240V410H30z"/><path class="acc d" d="M18 196H712"/><text class="t" x="262" y="42">Mesosphere, thermosphere</text><text class="s" x="262" y="66">Little influence over weather</text><text class="t" x="262" y="108">Stratosphere</text><text class="s" x="262" y="132">Up to about 160,000 ft (50 km)</text><text class="s" x="262" y="156">Little weather, air stays stable</text><text class="t" x="262" y="224">Tropopause</text><text class="s" x="262" y="248">Traps moisture and weather below</text><text class="s" x="262" y="272">Jet stream, clear air turbulence</text><text class="t" x="262" y="312">Troposphere</text><text class="s" x="262" y="336">Most weather, clouds, storms</text><text class="s" x="262" y="360">Surface to 20,000 to 60,000 ft</text><text class="s" x="262" y="384">Lower at the poles, higher at the equator</text><text class="s" x="262" y="408" style="font-size:17px">Drops 2 C per 1,000 ft, 1 inch per 1,000 ft</text></svg>
