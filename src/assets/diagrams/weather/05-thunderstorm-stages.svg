<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 430" role="img" aria-labelledby="ti de"><title id="ti">Thunderstorm life cycle</title><desc id="de">Three side-by-side cloud drawings. Cumulus stage: updraft arrows only, cloud growing taller. Mature stage: updraft on one side, downdraft with rain or hail on the other, top spreading into an anvil. Dissipating stage: downdraft arrows throughout as downdrafts replace the updrafts.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:17px}.q1{stroke-width:2}.q2{font-size:20px}</style><path class="o" d="M10 290H240"/><path class="o" d="M250 290H480"/><path class="o" d="M490 290H720"/><text class="t m q2" x="125" y="34">1  Cumulus stage</text><circle class="cl" cx="105" cy="215" r="28"/><circle class="cl" cx="135" cy="195" r="34"/><circle class="cl" cx="165" cy="215" r="28"/><circle class="cl" cx="135" cy="235" r="30"/><path class="acc" d="M95 284L95 192"/><path class="ah" d="M95 180L104 194L86 194z"/><path class="acc" d="M135 284L135 162"/><path class="ah" d="M135 150L144 164L126 164z"/><path class="acc" d="M175 284L175 192"/><path class="ah" d="M175 180L184 194L166 194z"/><text class="s e q0" x="238" y="250">Updraft</text><text class="t m q2" x="365" y="34">2  Mature stage</text><circle class="cl" cx="330" cy="200" r="30"/><circle class="cl" cx="370" cy="175" r="34"/><circle class="cl" cx="410" cy="200" r="30"/><circle class="cl" cx="370" cy="225" r="34"/><circle class="cl" cx="360" cy="140" r="34"/><circle class="cl" cx="380" cy="115" r="30"/><ellipse class="cl" cx="370" cy="98" rx="95" ry="16"/><path class="acc" d="M335 284L335 122"/><path class="ah" d="M335 110L344 124L326 124z"/><path class="dk" d="M415 135L415 240"/><path class="dh" d="M415 252L406 238L424 238z"/><path class="o q1" d="M432 236L424 280"/><path class="o q1" d="M444 236L436 280"/><path class="o q1" d="M456 236L448 280"/><path class="o q1" d="M468 236L460 280"/><text class="s m q0" x="305" y="60">Updraft</text><text class="s m q0" x="435" y="60">Downdraft</text><text class="t m q2" x="605" y="34">3  Dissipating stage</text><circle class="cl" cx="610" cy="200" r="30"/><circle class="cl" cx="580" cy="215" r="24"/><circle class="cl" cx="640" cy="215" r="24"/><circle class="cl" cx="610" cy="160" r="28"/><ellipse class="cl" cx="610" cy="105" rx="100" ry="18"/><ellipse class="cl" cx="610" cy="130" rx="40" ry="20"/><path class="dk" d="M560 160L560 260"/><path class="dh" d="M560 272L551 258L569 258z"/><path class="dk" d="M610 140L610 260"/><path class="dh" d="M610 272L601 258L619 258z"/><path class="dk" d="M660 160L660 260"/><path class="dh" d="M660 272L651 258L669 258z"/><text class="s m q0" x="610" y="60">Downdrafts</text><text class="s q0" x="20" y="326">Lifting begins; cloud grows</text><text class="s q0" x="20" y="348">taller. Strong updrafts</text><text class="s q0" x="20" y="370">keep moisture from</text><text class="s q0" x="20" y="392">falling.</text><text class="s q0" x="260" y="326">Within about 15 minutes.</text><text class="s q0" x="260" y="348">Most violent stage. Rain or</text><text class="s q0" x="260" y="370">hail falls, air rushes down:</text><text class="s q0" x="260" y="392">stronger surface winds,</text><text class="s q0" x="260" y="414">lower temperature.</text><text class="s q0" x="500" y="326">Cloud top spreads into</text><text class="s q0" x="500" y="348">an anvil shape. Downdrafts</text><text class="s q0" x="500" y="370">spread out and replace the</text><text class="s q0" x="500" y="392">updrafts.</text></svg>
