<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 430" role="img" aria-labelledby="ti de"><title id="ti">Cold front cross-section</title><desc id="de">Cross-section of a cold front moving to the right. A steep wedge of cold, dense air at the left slides under warmer air and forces it upward, producing towering cumulus or cumulonimbus clouds and heavy showers along the front. Cirriform clouds appear ahead of the front. Behind the front clouds break up into cumulus. Three columns describe conditions after, at and before passage.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style>
<rect class="rose" x="20" y="20" width="690" height="250"/>
<path class="o sky" d="M20 270L300 270L240 130L20 130z"/>
<circle class="cl" cx="250" cy="170" r="34"/><circle class="cl" cx="290" cy="150" r="38"/><circle class="cl" cx="330" cy="120" r="40"/><circle class="cl" cx="300" cy="90" r="36"/><circle class="cl" cx="345" cy="70" r="30"/><circle class="cl" cx="270" cy="115" r="32"/><circle class="cl" cx="335" cy="175" r="34"/>
<circle class="cl" cx="70" cy="100" r="20"/><circle class="cl" cx="100" cy="90" r="26"/><circle class="cl" cx="135" cy="102" r="20"/><circle class="cl" cx="95" cy="108" r="22"/>
<path class="o" style="stroke-width:2" d="M300 200L292 264"/><path class="o" style="stroke-width:2" d="M320 200L312 264"/><path class="o" style="stroke-width:2" d="M340 200L332 264"/><path class="o" style="stroke-width:2" d="M360 200L352 264"/><path class="o" style="stroke-width:2" d="M380 200L372 264"/><path class="o" style="stroke-width:2" d="M400 200L392 264"/>
<path class="o" style="stroke-width:2" d="M540 45L570 59"/><path class="o" style="stroke-width:2" d="M577 45L607 59"/><path class="o" style="stroke-width:2" d="M613 45L643 59"/><path class="o" style="stroke-width:2" d="M650 45L680 59"/><path class="o" style="stroke-width:2" d="M560 70L590 84"/><path class="o" style="stroke-width:2" d="M605 70L635 84"/><path class="o" style="stroke-width:2" d="M650 70L680 84"/>
<path class="o" d="M20 270H710"/>
<text class="t" x="40" y="170">Cold air</text><text class="s" x="40" y="196" style="font-size:17px">Moves 25 to 30 mph</text><path class="acc" d="M40 240L188 240"/><path class="ah" d="M200 240L186 249L186 231z"/>
<text class="t" x="520" y="236">Warm air</text>
<text class="t" x="20" y="312" style="font-size:19px">After passage</text><text class="s" x="20" y="336" style="font-size:17px">Clouds break up to</text><text class="s" x="20" y="358" style="font-size:17px">cumulus; less rain</text><text class="s" x="20" y="380" style="font-size:17px">Good visibility, wind from</text><text class="s" x="20" y="402" style="font-size:17px">west-northwest; cooler</text><text class="t" x="255" y="312" style="font-size:19px">At the front</text><text class="s" x="255" y="336" style="font-size:17px">Towering cumulus or</text><text class="s" x="255" y="358" style="font-size:17px">cumulonimbus; heavy</text><text class="s" x="255" y="380" style="font-size:17px">showers, poor visibility</text><text class="s" x="255" y="402" style="font-size:17px">Gusty winds, temp drops</text><text class="t" x="490" y="312" style="font-size:19px">Before passage</text><text class="s" x="490" y="336" style="font-size:17px">Cirriform or towering</text><text class="s" x="490" y="358" style="font-size:17px">cumulus clouds; showers</text><text class="s" x="490" y="380" style="font-size:17px">may develop. Pressure</text><text class="s" x="490" y="402" style="font-size:17px">falls.</text>
</svg>
