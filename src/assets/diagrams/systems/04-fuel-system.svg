<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 430" role="img" aria-labelledby="ti de"><title id="ti">Gravity-feed fuel system</title><desc id="de">Schematic of a gravity-feed fuel system on a high-wing airplane. Left and right wing tanks sit above the carburetor. Fuel runs down to the fuel selector valve with LEFT, RIGHT, BOTH and OFF positions, then through a strainer with a sump that collects water and sediment, then into the carburetor and the engine. A fuel primer takes fuel from the line and vaporizes it directly into the cylinders before starting.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:14px}.q1{stroke-width:2.5}.q2{stroke-width:3}.q3{font-size:16px}</style><rect class="sky" x="20" y="30" width="215" height="70" rx="8"/><rect class="o q1" x="20" y="30" width="215" height="70" rx="8"/><text class="t m q3" x="127" y="54">Left tank (in wing)</text><text class="s m q0" x="127" y="73">Vented; filler cap on top</text><text class="s m q0" x="127" y="90">of wing; overflow drain</text><rect class="sky" x="495" y="30" width="215" height="70" rx="8"/><rect class="o q1" x="495" y="30" width="215" height="70" rx="8"/><text class="t m q3" x="602" y="54">Right tank (in wing)</text><text class="s m q0" x="602" y="73">Vented; filler cap on top</text><text class="s m q0" x="602" y="90">of wing; overflow drain</text><path class="dk q2" d="M230 100V190H337"/><path class="dh" d="M337 190L325 184V196z"/><path class="dk q2" d="M500 100V190H393"/><path class="dh" d="M393 190L381 184V196z"/><circle class="rose" cx="365" cy="190" r="28"/><circle class="o q1" cx="365" cy="190" r="28"/><path class="dk" style="stroke-width:4" d="M365 190L365 172"/><text class="t m q3" x="365" y="150">Fuel selector</text><text class="s q0" x="20" y="134">High-wing airplane: tanks</text><text class="s q0" x="20" y="152">sit above the carburetor,</text><text class="s q0" x="20" y="170">so fuel flows by gravity.</text><text class="s q0" x="520" y="134">Selector positions:</text><text class="s q0" x="520" y="152">LEFT or RIGHT: that tank</text><text class="s q0" x="520" y="170">BOTH: both tanks</text><text class="s q0" x="520" y="188">OFF</text><path class="dk q2" d="M365 218V262"/><path class="dh" d="M365 262L359 250H371z"/><rect class="mint" x="330" y="262" width="70" height="36" rx="6"/><rect class="o q1" x="330" y="262" width="70" height="36" rx="6"/><text class="t m q0" x="365" y="285">Strainer</text><path class="dk q2" d="M365 298V330"/><path class="dh" d="M365 330L359 318H371z"/><path class="dk q2" d="M365 240H232"/><rect class="lav" x="135" y="222" width="97" height="34" rx="6"/><rect class="o q1" x="135" y="222" width="97" height="34" rx="6"/><text class="t m" x="183" y="244" style="font-size:15px">Primer</text><text class="s q0" x="20" y="282">Primer: fuel is drawn from</text><text class="s q0" x="20" y="299">the tanks and vaporized</text><text class="s q0" x="20" y="316">directly into the cylinders</text><text class="s q0" x="20" y="333">before start. Lock it in</text><text class="s q0" x="20" y="350">place when not in use.</text><text class="s q0" x="414" y="274">Strainer: removes moisture and sediment.</text><text class="s q0" x="414" y="291">Contaminants settle in the sump. Drain</text><text class="s q0" x="414" y="308">the strainer before each flight.</text><rect class="rose" x="310" y="330" width="110" height="40" rx="6"/><rect class="o q1" x="310" y="330" width="110" height="40" rx="6"/><text class="t m" x="365" y="355" style="font-size:15px">Carburetor</text><path class="dk q2" d="M365 370V388"/><path class="dh" d="M365 402L359 390H371z"/><text class="s m q0" x="365" y="420">To the engine</text><text class="s q0" x="440" y="342">Gauges are required to be accurate</text><text class="s q0" x="440" y="359">only at empty: check each tank</text><text class="s q0" x="440" y="376">visually in preflight. A tank run dry</text><text class="s q0" x="440" y="393">can let air in and cause vapor lock.</text></svg>
