<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 430" role="img" aria-labelledby="ti de"><title id="ti">Gravity-feed fuel system</title><desc id="de">Schematic of a gravity-feed fuel system on a high-wing airplane. Left and right wing tanks sit above the carburetor. Fuel runs down to the fuel selector valve with LEFT, RIGHT, BOTH and OFF positions, then through a strainer with a sump that collects water and sediment, then into the carburetor and the engine. A fuel primer takes fuel from the line and vaporizes it directly into the cylinders before starting.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><rect class="sky" x="20" y="30" width="215" height="70" rx="8"/><rect class="o" style="stroke-width:2.5" x="20" y="30" width="215" height="70" rx="8"/><text class="t m" x="127" y="54" style="font-size:16px">Left tank (in wing)</text><text class="s m" x="127" y="73" style="font-size:14px">Vented; filler cap on top</text><text class="s m" x="127" y="90" style="font-size:14px">of wing; overflow drain</text><rect class="sky" x="495" y="30" width="215" height="70" rx="8"/><rect class="o" style="stroke-width:2.5" x="495" y="30" width="215" height="70" rx="8"/><text class="t m" x="602" y="54" style="font-size:16px">Right tank (in wing)</text><text class="s m" x="602" y="73" style="font-size:14px">Vented; filler cap on top</text><text class="s m" x="602" y="90" style="font-size:14px">of wing; overflow drain</text><path class="dk" style="stroke-width:3" d="M230 100V190H337"/><path class="dh" d="M337 190L325 184V196z"/><path class="dk" style="stroke-width:3" d="M500 100V190H393"/><path class="dh" d="M393 190L381 184V196z"/><circle class="rose" cx="365" cy="190" r="28"/><circle class="o" style="stroke-width:2.5" cx="365" cy="190" r="28"/><path class="dk" style="stroke-width:4" d="M365 190L365 172"/><text class="t m" x="365" y="150" style="font-size:16px">Fuel selector</text><text class="s" x="20" y="134" style="font-size:14px">High-wing airplane: tanks</text><text class="s" x="20" y="152" style="font-size:14px">sit above the carburetor,</text><text class="s" x="20" y="170" style="font-size:14px">so fuel flows by gravity.</text><text class="s" x="520" y="134" style="font-size:14px">Selector positions:</text><text class="s" x="520" y="152" style="font-size:14px">LEFT or RIGHT: that tank</text><text class="s" x="520" y="170" style="font-size:14px">BOTH: both tanks</text><text class="s" x="520" y="188" style="font-size:14px">OFF</text><path class="dk" style="stroke-width:3" d="M365 218V262"/><path class="dh" d="M365 262L359 250H371z"/><rect class="mint" x="330" y="262" width="70" height="36" rx="6"/><rect class="o" style="stroke-width:2.5" x="330" y="262" width="70" height="36" rx="6"/><text class="t m" x="365" y="285" style="font-size:14px">Strainer</text><path class="dk" style="stroke-width:3" d="M365 298V330"/><path class="dh" d="M365 330L359 318H371z"/><path class="dk" style="stroke-width:3" d="M365 240H232"/><rect class="lav" x="135" y="222" width="97" height="34" rx="6"/><rect class="o" style="stroke-width:2.5" x="135" y="222" width="97" height="34" rx="6"/><text class="t m" x="183" y="244" style="font-size:15px">Primer</text><text class="s" x="20" y="282" style="font-size:14px">Primer: fuel is drawn from</text><text class="s" x="20" y="299" style="font-size:14px">the tanks and vaporized</text><text class="s" x="20" y="316" style="font-size:14px">directly into the cylinders</text><text class="s" x="20" y="333" style="font-size:14px">before start. Lock it in</text><text class="s" x="20" y="350" style="font-size:14px">place when not in use.</text><text class="s" x="414" y="274" style="font-size:14px">Strainer: removes moisture and sediment.</text><text class="s" x="414" y="291" style="font-size:14px">Contaminants settle in the sump. Drain</text><text class="s" x="414" y="308" style="font-size:14px">the strainer before each flight.</text><rect class="rose" x="310" y="330" width="110" height="40" rx="6"/><rect class="o" style="stroke-width:2.5" x="310" y="330" width="110" height="40" rx="6"/><text class="t m" x="365" y="355" style="font-size:15px">Carburetor</text><path class="dk" style="stroke-width:3" d="M365 370V388"/><path class="dh" d="M365 402L359 390H371z"/><text class="s m" x="365" y="420" style="font-size:14px">To the engine</text><text class="s" x="440" y="342" style="font-size:14px">Gauges are required to be accurate</text><text class="s" x="440" y="359" style="font-size:14px">only at empty: check each tank</text><text class="s" x="440" y="376" style="font-size:14px">visually in preflight. A tank run dry</text><text class="s" x="440" y="393" style="font-size:14px">can let air in and cause vapor lock.</text></svg>
