<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 430" role="img" aria-labelledby="ti de"><title id="ti">Ignition system with dual magnetos</title><desc id="de">Two magnetos, left and right, each wired to one of the two spark plugs in a cylinder. Each magneto uses a permanent magnet and works independently of the aircraft electrical system. If one fails the other is unaffected. The ignition switch has five positions: OFF, R, L, BOTH and START. R or L uses only that magneto and BOTH uses both. In the pretakeoff check switch from BOTH to R and back, then to L, and expect a small rpm drop within the AFM or POH limit. After shutdown set the switch to OFF.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:14.5px}.q1{stroke-width:2.5}.q2{font-size:15px}.q3{font-size:13.5px}.q4{font-size:14px}</style><rect class="sky" x="30" y="36" width="130" height="50" rx="6"/><rect class="o q1" x="30" y="36" width="130" height="50" rx="6"/><text class="t m" x="95" y="58" style="font-size:16px">Left magneto</text><text class="s m" x="95" y="76" style="font-size:13px">permanent magnet</text><rect class="mint" x="240" y="36" width="130" height="50" rx="6"/><rect class="o q1" x="240" y="36" width="130" height="50" rx="6"/><text class="t m" x="305" y="58" style="font-size:16px">Right magneto</text><text class="s m" x="305" y="76" style="font-size:13px">permanent magnet</text><rect class="cl" x="140" y="190" width="120" height="110" rx="6"/><rect class="o q1" x="140" y="190" width="120" height="110" rx="6"/><text class="s m q2" x="200" y="264">One cylinder</text><path class="dk" style="stroke-width:3" d="M95 86V150H165V196"/><path class="dk" style="stroke-width:3" d="M305 86V150H235V196"/><rect class="dh" x="159" y="178" width="12" height="14"/><rect class="dh" x="229" y="178" width="12" height="14"/><path class="ah" d="M165 210L158 224L165 220L172 224z"/><path class="ah" d="M235 210L228 224L235 220L242 224z"/><text class="s e q4" x="150" y="190">Plug</text><text class="s q4" x="250" y="190">Plug</text><text class="s m q4" x="200" y="132">Separate wires</text><text class="s q0" x="20" y="324">Two plugs per cylinder, each fired</text><text class="s q0" x="20" y="342">by its own magneto. Dual ignition adds</text><text class="s q0" x="20" y="360">reliability and slightly more power.</text><text class="s q0" x="20" y="378">If one magneto fails, the other is</text><text class="s q0" x="20" y="396">unaffected.</text><text class="t" x="400" y="34" style="font-size:18px">Ignition switch: five positions</text><rect class="lav" x="400" y="46" width="74" height="26" rx="13"/><rect class="o q1" x="400" y="46" width="74" height="26" rx="13"/><text class="t m q2" x="437" y="65">OFF</text><rect class="lav" x="400" y="80" width="74" height="26" rx="13"/><rect class="o q1" x="400" y="80" width="74" height="26" rx="13"/><text class="t m q2" x="437" y="99">R</text><text class="s q2" x="488" y="99">Right magneto only</text><rect class="lav" x="400" y="114" width="74" height="26" rx="13"/><rect class="o q1" x="400" y="114" width="74" height="26" rx="13"/><text class="t m q2" x="437" y="133">L</text><text class="s q2" x="488" y="133">Left magneto only</text><rect class="lav" x="400" y="148" width="74" height="26" rx="13"/><rect class="o q1" x="400" y="148" width="74" height="26" rx="13"/><text class="t m q2" x="437" y="167">BOTH</text><text class="s q2" x="488" y="167">Both magnetos</text><rect class="lav" x="400" y="182" width="74" height="26" rx="13"/><rect class="o q1" x="400" y="182" width="74" height="26" rx="13"/><text class="t m q2" x="437" y="201">START</text><text class="t" x="400" y="236" style="font-size:17px">Pretakeoff check</text><text class="s q0" x="400" y="256">Switch BOTH to R, then BOTH to L.</text><text class="s q0" x="400" y="273">A small rpm drop is normal; the limit</text><text class="s q0" x="400" y="290">is in the AFM or POH. Do not fly if the</text><text class="s q0" x="400" y="307">engine stops, the drop is too big, or</text><text class="s q0" x="400" y="324">there is no drop at all.</text><rect class="rose" x="395" y="332" width="325" height="92" rx="8"/><rect class="o q1" x="395" y="332" width="325" height="92" rx="8"/><text class="s q3" x="405" y="351">After shutdown, set the switch to OFF.</text><text class="s q3" x="405" y="367">A magneto needs no outside power, so the</text><text class="s q3" x="405" y="383">engine can fire if the propeller is moved</text><text class="s q3" x="405" y="399">with the switch ON, even with the battery</text><text class="s q3" x="405" y="415">and master switches OFF.</text></svg>
