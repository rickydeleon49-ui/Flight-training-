<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 430" role="img" aria-labelledby="ti de"><title id="ti">Ignition system with dual magnetos</title><desc id="de">Two magnetos, left and right, each wired to one of the two spark plugs in a cylinder. Each magneto uses a permanent magnet and works independently of the aircraft electrical system. If one fails the other is unaffected. The ignition switch has five positions: OFF, R, L, BOTH and START. R or L uses only that magneto and BOTH uses both. In the pretakeoff check switch from BOTH to R and back, then to L, and expect a small rpm drop within the AFM or POH limit. After shutdown set the switch to OFF.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style>
<rect class="sky" x="30" y="36" width="130" height="50" rx="6"/><rect class="o" style="stroke-width:2.5" x="30" y="36" width="130" height="50" rx="6"/>
<text class="t m" x="95" y="58" style="font-size:16px">Left magneto</text>
<text class="s m" x="95" y="76" style="font-size:13px">permanent magnet</text>
<rect class="mint" x="240" y="36" width="130" height="50" rx="6"/><rect class="o" style="stroke-width:2.5" x="240" y="36" width="130" height="50" rx="6"/>
<text class="t m" x="305" y="58" style="font-size:16px">Right magneto</text>
<text class="s m" x="305" y="76" style="font-size:13px">permanent magnet</text>
<rect class="cl" x="140" y="190" width="120" height="110" rx="6"/><rect class="o" style="stroke-width:2.5" x="140" y="190" width="120" height="110" rx="6"/>
<text class="s m" x="200" y="264" style="font-size:15px">One cylinder</text>
<path class="dk" style="stroke-width:3" d="M95 86V150H165V196"/>
<path class="dk" style="stroke-width:3" d="M305 86V150H235V196"/>
<rect class="dh" x="159" y="178" width="12" height="14"/><rect class="dh" x="229" y="178" width="12" height="14"/>
<path class="ah" d="M165 210L158 224L165 220L172 224z"/><path class="ah" d="M235 210L228 224L235 220L242 224z"/>
<text class="s e" x="150" y="190" style="font-size:14px">Plug</text>
<text class="s" x="250" y="190" style="font-size:14px">Plug</text>
<text class="s m" x="200" y="132" style="font-size:14px">Separate wires</text>
<text class="s" x="20" y="324" style="font-size:14.5px">Two plugs per cylinder, each fired</text>
<text class="s" x="20" y="342" style="font-size:14.5px">by its own magneto. Dual ignition adds</text>
<text class="s" x="20" y="360" style="font-size:14.5px">reliability and slightly more power.</text>
<text class="s" x="20" y="378" style="font-size:14.5px">If one magneto fails, the other is</text>
<text class="s" x="20" y="396" style="font-size:14.5px">unaffected.</text>
<text class="t" x="400" y="34" style="font-size:18px">Ignition switch: five positions</text>
<rect class="lav" x="400" y="46" width="74" height="26" rx="13"/><rect class="o" style="stroke-width:2.5" x="400" y="46" width="74" height="26" rx="13"/>
<text class="t m" x="437" y="65" style="font-size:15px">OFF</text>
<rect class="lav" x="400" y="80" width="74" height="26" rx="13"/><rect class="o" style="stroke-width:2.5" x="400" y="80" width="74" height="26" rx="13"/>
<text class="t m" x="437" y="99" style="font-size:15px">R</text>
<text class="s" x="488" y="99" style="font-size:15px">Right magneto only</text>
<rect class="lav" x="400" y="114" width="74" height="26" rx="13"/><rect class="o" style="stroke-width:2.5" x="400" y="114" width="74" height="26" rx="13"/>
<text class="t m" x="437" y="133" style="font-size:15px">L</text>
<text class="s" x="488" y="133" style="font-size:15px">Left magneto only</text>
<rect class="lav" x="400" y="148" width="74" height="26" rx="13"/><rect class="o" style="stroke-width:2.5" x="400" y="148" width="74" height="26" rx="13"/>
<text class="t m" x="437" y="167" style="font-size:15px">BOTH</text>
<text class="s" x="488" y="167" style="font-size:15px">Both magnetos</text>
<rect class="lav" x="400" y="182" width="74" height="26" rx="13"/><rect class="o" style="stroke-width:2.5" x="400" y="182" width="74" height="26" rx="13"/>
<text class="t m" x="437" y="201" style="font-size:15px">START</text>
<text class="t" x="400" y="236" style="font-size:17px">Pretakeoff check</text>
<text class="s" x="400" y="256" style="font-size:14.5px">Switch BOTH to R, then BOTH to L.</text>
<text class="s" x="400" y="273" style="font-size:14.5px">A small rpm drop is normal; the limit</text>
<text class="s" x="400" y="290" style="font-size:14.5px">is in the AFM or POH. Do not fly if the</text>
<text class="s" x="400" y="307" style="font-size:14.5px">engine stops, the drop is too big, or</text>
<text class="s" x="400" y="324" style="font-size:14.5px">there is no drop at all.</text>
<rect class="rose" x="395" y="332" width="325" height="92" rx="8"/><rect class="o" style="stroke-width:2.5" x="395" y="332" width="325" height="92" rx="8"/>
<text class="s" x="405" y="351" style="font-size:13.5px">After shutdown, set the switch to OFF.</text>
<text class="s" x="405" y="367" style="font-size:13.5px">A magneto needs no outside power, so the</text>
<text class="s" x="405" y="383" style="font-size:13.5px">engine can fire if the propeller is moved</text>
<text class="s" x="405" y="399" style="font-size:13.5px">with the switch ON, even with the battery</text>
<text class="s" x="405" y="415" style="font-size:13.5px">and master switches OFF.</text>
</svg>
