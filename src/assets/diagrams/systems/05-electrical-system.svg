<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 430" role="img" aria-labelledby="ti de"><title id="ti">Aircraft electrical system</title><desc id="de">Block diagram of a basic aircraft DC electrical system. An engine-driven alternator feeds a voltage regulator and the bus bar, and the battery connects through the master switch to the same bus bar. The bus bar feeds circuit breakers, each protecting equipment such as lights, radios, pitot heat, fuel gauges and the stall warning system. An ammeter dial with zero in the center shows plus when the battery is charging and minus when more current is drawn from the battery than replaced. A loadmeter starts at zero and shows the load on the alternator.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{stroke-width:3}.q1{font-size:13px}.q2{stroke-width:2.5}.q3{font-size:14px}.q4{font-size:15px}.q5{font-size:16px}.q6{font-size:13.5px}</style><text class="t m q5" x="350" y="42">Bus bar</text><rect class="cl" x="343" y="54" width="14" height="250"/><rect class="o q2" x="343" y="54" width="14" height="250"/><rect class="sky" x="20" y="56" width="110" height="46" rx="6"/><rect class="o q2" x="20" y="56" width="110" height="46" rx="6"/><text class="t m q5" x="75" y="84">Alternator</text><rect class="lav" x="170" y="56" width="100" height="46" rx="6"/><rect class="o q2" x="170" y="56" width="100" height="46" rx="6"/><text class="t m q3" x="220" y="76">Voltage</text><text class="t m q3" x="220" y="93">regulator</text><path class="dk q0" d="M130 79H170"/><path class="dh" d="M170 79L158 74V84z"/><path class="dk q0" d="M270 79H343"/><path class="dh" d="M343 79L331 74V84z"/><rect class="mint" x="20" y="190" width="110" height="46" rx="6"/><rect class="o q2" x="20" y="190" width="110" height="46" rx="6"/><text class="t m q5" x="75" y="218">Battery</text><rect class="rose" x="170" y="190" width="100" height="46" rx="6"/><rect class="o q2" x="170" y="190" width="100" height="46" rx="6"/><text class="t m q3" x="220" y="210">Master</text><text class="t m q3" x="220" y="227">switch</text><path class="dk q0" d="M130 213H170"/><path class="dk q0" d="M270 213H343"/><path class="dh" d="M343 213L331 208V218z"/><text class="s q1" x="20" y="118">Engine-driven;</text><text class="s q1" x="20" y="134">supplies current and</text><text class="s q1" x="20" y="150">keeps battery charged</text><text class="s q1" x="170" y="118">Stabilizes output.</text><text class="s q1" x="170" y="134">Example: about 14 V</text><text class="s q1" x="170" y="150">charges a 12 V battery</text><text class="s q1" x="20" y="254">Starts the engine;</text><text class="s q1" x="20" y="270">limited backup if the</text><text class="s q1" x="20" y="286">alternator fails.</text><text class="s q1" x="170" y="254">ON: power to all</text><text class="s q1" x="170" y="270">circuits except the</text><text class="s q1" x="170" y="286">ignition.</text><path class="dk q0" d="M357 70H385"/><rect class="cl" x="385" y="56" width="52" height="28" rx="4"/><rect class="o q2" x="385" y="56" width="52" height="28" rx="4"/><text class="t m q3" x="411" y="75">CB</text><path class="dk q0" d="M437 70H455"/><path class="dh" d="M455 70L443 65V75z"/><text class="s q4" x="464" y="75">Position, landing, interior lights</text><path class="dk q0" d="M357 118H385"/><rect class="cl" x="385" y="104" width="52" height="28" rx="4"/><rect class="o q2" x="385" y="104" width="52" height="28" rx="4"/><text class="t m q3" x="411" y="123">CB</text><path class="dk q0" d="M437 118H455"/><path class="dh" d="M455 118L443 113V123z"/><text class="s q4" x="464" y="123">Radio equipment</text><path class="dk q0" d="M357 166H385"/><rect class="cl" x="385" y="152" width="52" height="28" rx="4"/><rect class="o q2" x="385" y="152" width="52" height="28" rx="4"/><text class="t m q3" x="411" y="171">CB</text><path class="dk q0" d="M437 166H455"/><path class="dh" d="M455 166L443 161V171z"/><text class="s q4" x="464" y="171">Pitot heat</text><path class="dk q0" d="M357 214H385"/><rect class="cl" x="385" y="200" width="52" height="28" rx="4"/><rect class="o q2" x="385" y="200" width="52" height="28" rx="4"/><text class="t m q3" x="411" y="219">CB</text><path class="dk q0" d="M437 214H455"/><path class="dh" d="M455 214L443 209V219z"/><text class="s q4" x="464" y="219">Fuel gauges</text><path class="dk q0" d="M357 262H385"/><rect class="cl" x="385" y="248" width="52" height="28" rx="4"/><rect class="o q2" x="385" y="248" width="52" height="28" rx="4"/><text class="t m q3" x="411" y="267">CB</text><path class="dk q0" d="M437 262H455"/><path class="dh" d="M455 262L443 257V267z"/><text class="s q4" x="464" y="267">Stall warning system</text><text class="s q1" x="464" y="290">CB = circuit breaker or fuse;</text><text class="s q1" x="464" y="306">protects the circuit from overload.</text><text class="t q4" x="20" y="330">Most aircraft: 14 V or 28 V DC system</text><path class="o" d="M30 408A50 50 0 0 1 130 408"/><path class="o" style="stroke-width:2" d="M30 408H130"/><path class="dk q0" d="M80 408L98 370"/><circle class="dh" cx="80" cy="408" r="5"/><text class="t q5" x="36" y="396">–</text><text class="t m q4" x="75" y="366">0</text><text class="t q5" x="118" y="396">+</text><text class="s m q1" x="80" y="424">Ammeter</text><text class="s q6" x="160" y="350">Ammeter: zero in the center. Plus = battery charging;</text><text class="s q6" x="160" y="366">minus = more current drawn from battery than replaced.</text><text class="s q6" x="160" y="382">Full-scale minus: alternator or generator malfunction;</text><text class="s q6" x="160" y="398">full-scale plus: regulator malfunction.</text><text class="s q6" x="160" y="414">Loadmeter: starts at zero; shows load as percent of capacity.</text></svg>
