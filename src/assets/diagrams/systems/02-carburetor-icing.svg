<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 430" role="img" aria-labelledby="ti de"><title id="ti">Carburetor icing and carburetor heat</title><desc id="de">Cross-section of a float-type carburetor. Air enters at the top through the air filter and flows down through a narrow venturi throat where low pressure draws fuel from a float chamber through the main fuel jet, then past a throttle valve toward the intake manifold. Ice forms near the throttle valve and in the venturi throat, restricting the flow and reducing power. Carburetor heat preheats the air before it reaches the carburetor, and full heat is applied until the ice is gone. Icing is most likely below 70 degrees F with humidity above 80 percent.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:15px}.q1{stroke-width:3}.q2{font-size:13.5px}.q3{stroke-width:2}</style><path class="sky" d="M140 70V125L175 168V202L140 245V310H260V245L225 202V168L260 125V70z"/><path class="dk" style="stroke-width:4" d="M140 70V125L175 168V202L140 245V310"/><path class="dk" style="stroke-width:4" d="M260 70V125L225 168V202L260 245V310"/><path class="dk q1" d="M200 14V50"/><path class="dh" d="M200 64L193 52H207z"/><text class="s" x="272" y="36" style="font-size:16px">Air in (through the air filter)</text><rect class="cl" x="20" y="196" width="80" height="64" rx="4"/><rect class="o" style="stroke-width:2.5" x="20" y="196" width="80" height="64" rx="4"/><rect class="rose" x="22" y="224" width="76" height="34"/><rect class="dh" x="52" y="215" width="16" height="9" rx="2"/><text class="s" x="20" y="186" style="font-size:14px">Float chamber</text><path class="dk q1" d="M100 246H150V185H178"/><path class="dh" d="M178 185L166 179V191z"/><text class="s" x="20" y="280" style="font-size:13px">Float and needle</text><text class="s" x="20" y="296" style="font-size:13px">meter the fuel</text><path class="dk" style="stroke-width:7" d="M150 280L250 300"/><circle class="dh" cx="200" cy="290" r="5"/><text class="s q2" x="20" y="326">Throttle valve:</text><text class="s q2" x="20" y="342">regulates mixture</text><text class="s q2" x="20" y="358">flow</text><ellipse class="lav o q3" cx="220" cy="185" rx="5" ry="13"/><ellipse class="lav o q3" cx="160" cy="278" rx="9" ry="5"/><ellipse class="lav o q3" cx="241" cy="297" rx="9" ry="5"/><text class="t q0" x="236" y="208">Ice</text><text class="t q0" x="266" y="312">Ice</text><path class="dk q1" d="M200 316V330"/><path class="dh" d="M200 346L193 334H207z"/><text class="s m" x="200" y="364" style="font-size:14px">To intake manifold</text><text class="s q0" x="278" y="68">Icing is most likely below 70 °F (21 °C)</text><text class="s q0" x="278" y="86">with humidity above 80 percent. It can occur</text><text class="s q0" x="278" y="104">even at 100 °F and 50 percent humidity.</text><text class="t" x="278" y="136" style="font-size:17px">Venturi</text><text class="s q0" x="278" y="155">Narrow throat. Air flowing through it makes</text><text class="s q0" x="278" y="173">low pressure, which forces fuel through the</text><text class="s q0" x="278" y="191">main fuel jet into the airstream.</text><text class="t" x="278" y="236" style="font-size:17px">Where ice forms</text><text class="s q0" x="278" y="255">Near the throttle valve and in the venturi</text><text class="s q0" x="278" y="273">throat. Ice restricts the fuel-air flow and</text><text class="s q0" x="278" y="291">reduces power; enough ice can stop the engine.</text><rect class="cl" x="20" y="374" width="690" height="46" rx="8"/><text class="s q0" x="30" y="393">Carburetor heat preheats the air before the carburetor, to keep it above freezing.</text><text class="s q0" x="30" y="412">If ice is detected, apply full heat until all ice is gone. Heat can cut power up to 15 percent.</text></svg>
