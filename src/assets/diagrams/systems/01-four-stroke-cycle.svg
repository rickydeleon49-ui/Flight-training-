<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 430" role="img" aria-labelledby="ti de"><title id="ti">Four-stroke cycle</title><desc id="de">Four cylinder drawings in order. Intake: the piston moves down, the intake valve opens and the fuel-air mixture is drawn into the cylinder. Compression: the intake valve closes and the piston moves back up the cylinder. Power: the mixture is ignited, pressure forces the piston down and turns the crankshaft. Exhaust: the exhaust valve opens and the piston moves up toward the cylinder head, purging the burned gases. The cycle repeats several hundred times each minute.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{stroke-width:3}.q1{font-size:14.5px}.q2{stroke-width:4}.q3{stroke-width:2;opacity:.5}.q4{font-size:19px}.q5{stroke-width:2.5}.q6{font-size:16px}</style><rect class="o q3" x="20" y="14" width="162" height="324" rx="10"/><text class="t m q4" x="101" y="40">1 Intake</text><rect class="sky" x="63" y="76" width="76" height="36"/><path class="o" d="M61 200V76H141V200"/><rect class="cl" x="63" y="112" width="76" height="22"/><path class="o q5" d="M63 112H139V134H63z"/><path class="dk q0" d="M101 134V214"/><circle class="dh" cx="101" cy="218" r="6"/><path class="dk q0" d="M79 56V84"/><path class="dk q2" d="M70 85H88"/><path class="dk q0" d="M123 56V72"/><path class="dk q2" d="M114 73H132"/><path class="dk q0" d="M101 58V74"/><circle class="dh" cx="101" cy="56" r="4"/><path class="dk q0" d="M157 110V140"/><path class="dh" d="M157 152L151 140H163z"/><text class="s q1" x="30" y="256">Piston moves down.</text><text class="s q1" x="30" y="275">Intake valve opens;</text><text class="s q1" x="30" y="294">fuel-air mixture is</text><text class="s q1" x="30" y="313">drawn into the</text><text class="s q1" x="30" y="332">cylinder.</text><rect class="o q3" x="196" y="14" width="162" height="324" rx="10"/><text class="t m q4" x="277" y="40">2 Compression</text><rect class="sky" x="239" y="76" width="76" height="46"/><path class="o" d="M237 200V76H317V200"/><rect class="cl" x="239" y="122" width="76" height="22"/><path class="o q5" d="M239 122H315V144H239z"/><path class="dk q0" d="M277 144V214"/><circle class="dh" cx="277" cy="218" r="6"/><path class="dk q0" d="M255 56V72"/><path class="dk q2" d="M246 73H264"/><path class="dk q0" d="M299 56V72"/><path class="dk q2" d="M290 73H308"/><path class="dk q0" d="M277 58V74"/><circle class="dh" cx="277" cy="56" r="4"/><path class="dk q0" d="M333 156V126"/><path class="dh" d="M333 112L327 124H339z"/><text class="s q1" x="206" y="256">Intake valve closes;</text><text class="s q1" x="206" y="275">piston moves back up</text><text class="s q1" x="206" y="294">(top of cylinder).</text><text class="s q1" x="206" y="313">Gives much greater</text><text class="s q1" x="206" y="332">power once ignited.</text><rect class="o q3" x="372" y="14" width="162" height="324" rx="10"/><text class="t m q4" x="453" y="40">3 Power</text><rect class="rose" x="415" y="76" width="76" height="20"/><path class="o" d="M413 200V76H493V200"/><rect class="cl" x="415" y="96" width="76" height="22"/><path class="o q5" d="M415 96H491V118H415z"/><path class="dk q0" d="M453 118V214"/><circle class="dh" cx="453" cy="218" r="6"/><path class="dk q0" d="M431 56V72"/><path class="dk q2" d="M422 73H440"/><path class="dk q0" d="M475 56V72"/><path class="dk q2" d="M466 73H484"/><path class="dk q0" d="M453 58V74"/><circle class="dh" cx="453" cy="56" r="4"/><path class="ah" d="M453 82L445 98L453 92L461 98z"/><path class="dk q0" d="M509 110V140"/><path class="dh" d="M509 152L503 140H515z"/><text class="s q1" x="382" y="256">Mixture is ignited.</text><text class="s q1" x="382" y="275">Pressure rises and</text><text class="s q1" x="382" y="294">forces piston down,</text><text class="s q1" x="382" y="313">turning the</text><text class="s q1" x="382" y="332">crankshaft.</text><rect class="o q3" x="548" y="14" width="162" height="324" rx="10"/><text class="t m q4" x="629" y="40">4 Exhaust</text><rect class="lav" x="591" y="76" width="76" height="70"/><path class="o" d="M589 200V76H669V200"/><rect class="cl" x="591" y="146" width="76" height="22"/><path class="o q5" d="M591 146H667V168H591z"/><path class="dk q0" d="M629 168V214"/><circle class="dh" cx="629" cy="218" r="6"/><path class="dk q0" d="M607 56V72"/><path class="dk q2" d="M598 73H616"/><path class="dk q0" d="M651 56V84"/><path class="dk q2" d="M642 85H660"/><path class="dk q0" d="M629 58V74"/><circle class="dh" cx="629" cy="56" r="4"/><path class="dk q0" d="M685 156V126"/><path class="dh" d="M685 112L679 124H691z"/><text class="s q1" x="558" y="256">Exhaust valve opens;</text><text class="s q1" x="558" y="275">piston moves up</text><text class="s q1" x="558" y="294">toward the head,</text><text class="s q1" x="558" y="313">purging burned</text><text class="s q1" x="558" y="332">gases.</text><text class="s q6" x="20" y="366">Spark ignition four-stroke engines are the most common design in GA today.</text><text class="s q6" x="20" y="388">The cycle repeats several hundred times each minute, even at fairly low speed.</text><text class="s q6" x="20" y="410">Four-cylinder engine: each cylinder is on a different stroke. Drawing is schematic.</text></svg>
