<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 515" role="img" aria-labelledby="ti de"><title id="ti">When something goes wrong</title><desc id="de">Six decision steps from detect to evaluate, then the PHAK open cabin door example on a clear day and in IMC, with advice to stop, think and prioritize.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><text class="t" x="20" y="28" style="font-size:15px">When something goes wrong: think first, then act</text><text class="s" x="20" y="50.0" style="font-size:13px">PHAK breaks a decision into six steps. Under pressure, actions taken without forethought can be as</text><text class="s" x="20" y="66.5" style="font-size:13px">dangerous as taking no action at all.</text><rect class="cl" x="20.0" y="91.0" width="220.66666666666666" height="86.0" rx="8"/><rect x="20.0" y="91.0" width="220.66666666666666" height="26" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30.0" y="109.0" style="font-size:13px">1 Detect</text><circle cx="33.0" cy="127.0" r="2.2" class="ah"/><text class="s" x="42.0" y="131.0" style="font-size:11.5px">Notice that a change happened,</text><text class="s" x="42.0" y="146.0" style="font-size:11.5px">or that an expected change did</text><text class="s" x="42.0" y="161.0" style="font-size:11.5px">not.</text><rect class="cl" x="254.66666666666666" y="91.0" width="220.66666666666666" height="86.0" rx="8"/><rect x="254.66666666666666" y="91.0" width="220.66666666666666" height="26" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="264.66666666666663" y="109.0" style="font-size:13px">2 Estimate</text><circle cx="267.66666666666663" cy="127.0" r="2.2" class="ah"/><text class="s" x="276.66666666666663" y="131.0" style="font-size:11.5px">How big is the problem, and how</text><text class="s" x="276.66666666666663" y="146.0" style="font-size:11.5px">fast must you react?</text><rect class="cl" x="489.3333333333333" y="91.0" width="220.66666666666666" height="86.0" rx="8"/><rect x="489.3333333333333" y="91.0" width="220.66666666666666" height="26" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="499.3333333333333" y="109.0" style="font-size:13px">3 Choose</text><circle cx="502.3333333333333" cy="127.0" r="2.2" class="ah"/><text class="s" x="511.3333333333333" y="131.0" style="font-size:11.5px">Decide the outcome you want,</text><text class="s" x="511.3333333333333" y="146.0" style="font-size:11.5px">such as safely landing the</text><text class="s" x="511.3333333333333" y="161.0" style="font-size:11.5px">airplane.</text><rect class="cl" x="20.0" y="191.0" width="220.66666666666666" height="86.0" rx="8"/><rect x="20.0" y="191.0" width="220.66666666666666" height="26" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30.0" y="209.0" style="font-size:13px">4 Identify</text><circle cx="33.0" cy="227.0" r="2.2" class="ah"/><text class="s" x="42.0" y="231.0" style="font-size:11.5px">Make a plan to reach it. Do not</text><text class="s" x="42.0" y="246.0" style="font-size:11.5px">fixate on the process and</text><text class="s" x="42.0" y="261.0" style="font-size:11.5px">forget to decide.</text><rect class="cl" x="254.66666666666666" y="191.0" width="220.66666666666666" height="86.0" rx="8"/><rect x="254.66666666666666" y="191.0" width="220.66666666666666" height="26" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="264.66666666666663" y="209.0" style="font-size:13px">5 Do</text><circle cx="267.66666666666663" cy="227.0" r="2.2" class="ah"/><text class="s" x="276.66666666666663" y="231.0" style="font-size:11.5px">Pick the most suitable path and</text><text class="s" x="276.66666666666663" y="246.0" style="font-size:11.5px">carry it out.</text><rect class="cl" x="489.3333333333333" y="191.0" width="220.66666666666666" height="86.0" rx="8"/><rect x="489.3333333333333" y="191.0" width="220.66666666666666" height="26" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="499.3333333333333" y="209.0" style="font-size:13px">6 Evaluate</text><circle cx="502.3333333333333" cy="227.0" r="2.2" class="ah"/><text class="s" x="511.3333333333333" y="231.0" style="font-size:11.5px">Did it work? If not, repeat the</text><text class="s" x="511.3333333333333" y="246.0" style="font-size:11.5px">process.</text><text class="t" x="20" y="297.0" style="font-size:14px">Example from PHAK: the cabin door opens in flight</text><rect class="cl" x="20.0" y="307.0" width="338.0" height="104.0" rx="8"/><rect x="20.0" y="307.0" width="338.0" height="26" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30.0" y="325.0" style="font-size:13px">Clear day, climbing through 1,500 ft</text><circle cx="33.0" cy="343.0" r="2.2" class="ah"/><text class="s" x="42.0" y="347.0" style="font-size:11.5px">Alarming, but the hazard is quickly judged minor.</text><text class="s" x="42.0" y="362.0" style="font-size:11.5px">It does not affect safe flight.</text><circle cx="33.0" cy="376.0" r="2.2" class="ah"/><text class="s" x="42.0" y="380.0" style="font-size:11.5px">Most likely you return to the airport and secure</text><text class="s" x="42.0" y="395.0" style="font-size:11.5px">the door after landing.</text><rect class="cl" x="372.0" y="307.0" width="338.0" height="104.0" rx="8"/><rect x="372.0" y="307.0" width="338.0" height="26" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="382.0" y="325.0" style="font-size:13px">Same door, in IMC with rain and turbulence</text><circle cx="385.0" cy="343.0" r="2.2" class="ah"/><text class="s" x="394.0" y="347.0" style="font-size:11.5px">The problem has not changed, but the risk you give</text><text class="s" x="394.0" y="362.0" style="font-size:11.5px">it does, because of all the other tasks going on.</text><circle cx="385.0" cy="376.0" r="2.2" class="ah"/><text class="s" x="394.0" y="380.0" style="font-size:11.5px">Stress and workload are much higher.</text><rect class="cl" x="20.0" y="425.0" width="338.0" height="74.0" rx="8"/><rect x="20.0" y="425.0" width="338.0" height="26" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30.0" y="443.0" style="font-size:13px">Stop, think, analyze</text><circle cx="33.0" cy="461.0" r="2.2" class="ah"/><text class="s" x="42.0" y="465.0" style="font-size:11.5px">This is the key to stress management. There is</text><text class="s" x="42.0" y="480.0" style="font-size:11.5px">usually time to think before drawing conclusions.</text><rect class="cl" x="372.0" y="425.0" width="338.0" height="74.0" rx="8"/><rect x="372.0" y="425.0" width="338.0" height="26" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="382.0" y="443.0" style="font-size:13px">If workload piles up</text><circle cx="385.0" cy="461.0" r="2.2" class="ah"/><text class="s" x="394.0" y="465.0" style="font-size:11.5px">Stop, think, slow down and prioritize.</text><circle cx="385.0" cy="479.0" r="2.2" class="ah"/><text class="s" x="394.0" y="483.0" style="font-size:11.5px">Stay calm and think rationally.</text></svg>
