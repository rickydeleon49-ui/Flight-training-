<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 506" role="img" aria-labelledby="ti de"><title id="ti">Lost, or cannot reach your destination</title><desc id="de">Three steps when lost, a card on direction finding help and the emergency call, and cards on planning and flying a diversion.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><text class="t" x="20" y="28" style="font-size:15px">Lost, or cannot reach your destination</text><text class="s" x="20" y="50.0" style="font-size:13px">Getting lost is dangerous, especially when low on fuel. PHAK gives common-sense steps in order.</text><rect class="cl" x="20.0" y="74.5" width="215.33333333333334" height="101.0" rx="8"/><rect x="20.0" y="74.5" width="215.33333333333334" height="26" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30.0" y="92.5" style="font-size:13px">1 Climb</text><circle cx="33.0" cy="110.5" r="2.2" class="ah"/><text class="s" x="42.0" y="114.5" style="font-size:11.5px">If you cannot see a town,</text><text class="s" x="42.0" y="129.5" style="font-size:11.5px">climb, watching traffic and</text><text class="s" x="42.0" y="144.5" style="font-size:11.5px">weather. More radio and nav</text><text class="s" x="42.0" y="159.5" style="font-size:11.5px">range, more radar coverage.</text><path d="M238.33 125.0L246.3 125.0" class="acc" style="stroke-width:2.5"/><path d="M254.33 125.0L246.3 128.6L246.3 121.4Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><rect class="cl" x="257.33333333333337" y="74.5" width="215.33333333333334" height="101.0" rx="8"/><rect x="257.33333333333337" y="74.5" width="215.33333333333334" height="26" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="267.33333333333337" y="92.5" style="font-size:13px">2 Find position</text><circle cx="270.33333333333337" cy="110.5" r="2.2" class="ah"/><text class="s" x="279.33333333333337" y="114.5" style="font-size:11.5px">Read a water tower; plot from</text><text class="s" x="279.33333333333337" y="129.5" style="font-size:11.5px">two navaids; use GPS to find</text><text class="s" x="279.33333333333337" y="144.5" style="font-size:11.5px">position and the nearest</text><text class="s" x="279.33333333333337" y="159.5" style="font-size:11.5px">airport.</text><path d="M475.67 125.0L483.7 125.0" class="acc" style="stroke-width:2.5"/><path d="M491.67 125.0L483.7 128.6L483.7 121.4Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><rect class="cl" x="494.6666666666667" y="74.5" width="215.33333333333334" height="101.0" rx="8"/><rect x="494.6666666666667" y="74.5" width="215.33333333333334" height="26" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="504.6666666666667" y="92.5" style="font-size:13px">3 Call</text><circle cx="507.6666666666667" cy="110.5" r="2.2" class="ah"/><text class="s" x="516.6666666666667" y="114.5" style="font-size:11.5px">Use sectional chart</text><text class="s" x="516.6666666666667" y="129.5" style="font-size:11.5px">frequencies. A controller may</text><text class="s" x="516.6666666666667" y="144.5" style="font-size:11.5px">give radar vectors or</text><text class="s" x="516.6666666666667" y="159.5" style="font-size:11.5px">direction finding help.</text><rect class="cl" x="20.0" y="189.5" width="338.0" height="122.0" rx="8"/><rect x="20.0" y="189.5" width="338.0" height="26" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30.0" y="207.5" style="font-size:13px">Direction finding (DF)</text><circle cx="33.0" cy="225.5" r="2.2" class="ah"/><text class="s" x="42.0" y="229.5" style="font-size:11.5px">The controller asks you to hold down the transmit</text><text class="s" x="42.0" y="244.5" style="font-size:11.5px">button a few seconds, then release it.</text><circle cx="33.0" cy="258.5" r="2.2" class="ah"/><text class="s" x="42.0" y="262.5" style="font-size:11.5px">You may be asked to change direction and repeat.</text><circle cx="33.0" cy="276.5" r="2.2" class="ah"/><text class="s" x="42.0" y="280.5" style="font-size:11.5px">Then the controller can plot you and give vectors</text><text class="s" x="42.0" y="295.5" style="font-size:11.5px">to a suitable landing site.</text><rect class="cl" x="372.0" y="189.5" width="338.0" height="122.0" rx="8"/><rect x="372.0" y="189.5" width="338.0" height="26" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="382.0" y="207.5" style="font-size:13px">If it turns threatening</text><circle cx="385.0" cy="225.5" r="2.2" class="ah"/><text class="s" x="394.0" y="229.5" style="font-size:11.5px">Transmit on emergency frequency 121.5 MHz and set</text><text class="s" x="394.0" y="244.5" style="font-size:11.5px">the transponder to 7700.</text><circle cx="385.0" cy="258.5" r="2.2" class="ah"/><text class="s" x="394.0" y="262.5" style="font-size:11.5px">Most facilities, and even airliners, monitor 121.5.</text><text class="t" x="20" y="331.5" style="font-size:14px">Flight diversion: heading to an alternate</text><rect class="cl" x="20.0" y="341.5" width="220.66666666666666" height="149.0" rx="8"/><rect x="20.0" y="341.5" width="220.66666666666666" height="26" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30.0" y="359.5" style="font-size:13px">Before you go</text><circle cx="33.0" cy="377.5" r="2.2" class="ah"/><text class="s" x="42.0" y="381.5" style="font-size:11.5px">Check charts for airports or</text><text class="s" x="42.0" y="396.5" style="font-size:11.5px">landing areas near the route,</text><text class="s" x="42.0" y="411.5" style="font-size:11.5px">and for navaids you can use.</text><rect class="cl" x="254.66666666666666" y="341.5" width="220.66666666666666" height="149.0" rx="8"/><rect x="254.66666666666666" y="341.5" width="220.66666666666666" height="26" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="264.66666666666663" y="359.5" style="font-size:13px">In the air</text><circle cx="267.66666666666663" cy="377.5" r="2.2" class="ah"/><text class="s" x="276.66666666666663" y="381.5" style="font-size:11.5px">Estimate the course with a</text><text class="s" x="276.66666666666663" y="396.5" style="font-size:11.5px">straightedge and a VOR compass</text><text class="s" x="276.66666666666663" y="411.5" style="font-size:11.5px">rose. Start over a prominent</text><text class="s" x="276.66666666666663" y="426.5" style="font-size:11.5px">ground feature if time permits.</text><circle cx="267.66666666666663" cy="440.5" r="2.2" class="ah"/><text class="s" x="276.66666666666663" y="444.5" style="font-size:11.5px">Note the time, use nearby winds</text><text class="s" x="276.66666666666663" y="459.5" style="font-size:11.5px">aloft for heading and GS, then</text><text class="s" x="276.66666666666663" y="474.5" style="font-size:11.5px">new arrival time and fuel.</text><rect class="cl" x="489.3333333333333" y="341.5" width="220.66666666666666" height="149.0" rx="8"/><rect x="489.3333333333333" y="341.5" width="220.66666666666666" height="26" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="499.3333333333333" y="359.5" style="font-size:13px">In an emergency</text><circle cx="502.3333333333333" cy="377.5" r="2.2" class="ah"/><text class="s" x="511.3333333333333" y="381.5" style="font-size:11.5px">Divert promptly. Doing all the</text><text class="s" x="511.3333333333333" y="396.5" style="font-size:11.5px">plotting first can make it</text><text class="s" x="511.3333333333333" y="411.5" style="font-size:11.5px">worse.</text><circle cx="502.3333333333333" cy="425.5" r="2.2" class="ah"/><text class="s" x="511.3333333333333" y="429.5" style="font-size:11.5px">Give priority to flying the</text><text class="s" x="511.3333333333333" y="444.5" style="font-size:11.5px">aircraft. Pick an altitude with</text><text class="s" x="511.3333333333333" y="459.5" style="font-size:11.5px">cloud heights, winds, terrain</text><text class="s" x="511.3333333333333" y="474.5" style="font-size:11.5px">and radio reception in mind.</text></svg>
