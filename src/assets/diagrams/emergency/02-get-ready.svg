<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 523" role="img" aria-labelledby="ti de"><title id="ti">Get ready before anything happens</title><desc id="de">Cards on the Emergency Procedures section of the airplane manual and on route planning, the SAFETY passenger briefing in six boxes, and a card on the emergency locator transmitter.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><text class="t" x="20" y="28" style="font-size:15px">Get ready before anything happens</text><text class="s" x="20" y="50.0" style="font-size:13px">Much of handling an emergency is preparation done on the ground, in the manual and with your</text><text class="s" x="20" y="66.5" style="font-size:13px">passengers.</text><rect class="cl" x="20.0" y="91.0" width="338.0" height="170.0" rx="8"/><rect x="20.0" y="91.0" width="338.0" height="26" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30.0" y="109.0" style="font-size:13px">The Emergency Procedures section</text><circle cx="33.0" cy="127.0" r="2.2" class="ah"/><text class="s" x="42.0" y="131.0" style="font-size:11.5px">In the AFM/POH, Section 3. Checklists with</text><text class="s" x="42.0" y="146.0" style="font-size:11.5px">recommended procedures and airspeeds.</text><circle cx="33.0" cy="160.0" r="2.2" class="ah"/><text class="s" x="42.0" y="164.0" style="font-size:11.5px">Examples: engine failure, fire, system failure.</text><text class="s" x="42.0" y="179.0" style="font-size:11.5px">Inflight restart and ditching may be included.</text><circle cx="33.0" cy="193.0" r="2.2" class="ah"/><text class="s" x="42.0" y="197.0" style="font-size:11.5px">Memorize the immediate action items, then use the</text><text class="s" x="42.0" y="212.0" style="font-size:11.5px">checklist after they are done.</text><circle cx="33.0" cy="226.0" r="2.2" class="ah"/><text class="s" x="42.0" y="230.0" style="font-size:11.5px">An Abnormal Procedures subsection covers</text><text class="s" x="42.0" y="245.0" style="font-size:11.5px">malfunctions that are not emergencies.</text><rect class="cl" x="372.0" y="91.0" width="338.0" height="170.0" rx="8"/><rect x="372.0" y="91.0" width="338.0" height="26" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="382.0" y="109.0" style="font-size:13px">Plan the route</text><circle cx="385.0" cy="127.0" r="2.2" class="ah"/><text class="s" x="394.0" y="131.0" style="font-size:11.5px">Choose the route wisely: an engine failure gives</text><text class="s" x="394.0" y="146.0" style="font-size:11.5px">nearby airports supreme importance.</text><circle cx="385.0" cy="160.0" r="2.2" class="ah"/><text class="s" x="394.0" y="164.0" style="font-size:11.5px">Over remote areas, carry clothing, water and</text><text class="s" x="394.0" y="179.0" style="font-size:11.5px">survival gear for a forced landing.</text><circle cx="385.0" cy="193.0" r="2.2" class="ah"/><text class="s" x="394.0" y="197.0" style="font-size:11.5px">At night, ask whether conditions allow a safe</text><text class="s" x="394.0" y="212.0" style="font-size:11.5px">emergency landing.</text><circle cx="385.0" cy="226.0" r="2.2" class="ah"/><text class="s" x="394.0" y="230.0" style="font-size:11.5px">Over water or unpopulated areas where you may lose</text><text class="s" x="394.0" y="245.0" style="font-size:11.5px">the horizon, be ready to fly IFR.</text><text class="t" x="20" y="281.0" style="font-size:14px">Brief your passengers with SAFETY</text><rect class="cl" x="20.0" y="291.0" width="220.66666666666666" height="44" rx="8"/><circle cx="38.0" cy="313.0" r="12" class="ah"/><text class="t m" x="38.0" y="317.3333333333333" style="font-size:13px;fill:#fff">S</text><text class="s" x="58.0" y="310.0" style="font-size:11.5px">Seat belts, shoulder</text><text class="s" x="58.0" y="324.0" style="font-size:11.5px">harness, seat position</text><rect class="cl" x="254.66666666666666" y="291.0" width="220.66666666666666" height="44" rx="8"/><circle cx="272.66666666666663" cy="313.0" r="12" class="ah"/><text class="t m" x="272.66666666666663" y="317.3333333333333" style="font-size:13px;fill:#fff">A</text><text class="s" x="292.66666666666663" y="310.0" style="font-size:11.5px">Air vents, controls, action</text><text class="s" x="292.66666666666663" y="324.0" style="font-size:11.5px">if someone feels unwell</text><rect class="cl" x="489.3333333333333" y="291.0" width="220.66666666666666" height="44" rx="8"/><circle cx="507.3333333333333" cy="313.0" r="12" class="ah"/><text class="t m" x="507.3333333333333" y="317.3333333333333" style="font-size:13px;fill:#fff">F</text><text class="s" x="527.3333333333333" y="310.0" style="font-size:11.5px">Fire extinguisher: where and</text><text class="s" x="527.3333333333333" y="324.0" style="font-size:11.5px">how</text><rect class="cl" x="20.0" y="345.0" width="220.66666666666666" height="44" rx="8"/><circle cx="38.0" cy="367.0" r="12" class="ah"/><text class="t m" x="38.0" y="371.3333333333333" style="font-size:13px;fill:#fff">E</text><text class="s" x="58.0" y="364.0" style="font-size:11.5px">Exit doors; evacuation plan;</text><text class="s" x="58.0" y="378.0" style="font-size:11.5px">emergency/survival kit</text><rect class="cl" x="254.66666666666666" y="345.0" width="220.66666666666666" height="44" rx="8"/><circle cx="272.66666666666663" cy="367.0" r="12" class="ah"/><text class="t m" x="272.66666666666663" y="371.3333333333333" style="font-size:13px;fill:#fff">T</text><text class="s" x="292.66666666666663" y="364.0" style="font-size:11.5px">Traffic: scanning and</text><text class="s" x="292.66666666666663" y="378.0" style="font-size:11.5px">spotting</text><rect class="cl" x="489.3333333333333" y="345.0" width="220.66666666666666" height="44" rx="8"/><circle cx="507.3333333333333" cy="367.0" r="12" class="ah"/><text class="t m" x="507.3333333333333" y="371.3333333333333" style="font-size:13px;fill:#fff">Y</text><text class="s" x="527.3333333333333" y="371.0" style="font-size:11.5px">Your questions? Speak up</text><rect class="cl" x="20.0" y="403.0" width="690.0" height="104.0" rx="8"/><rect x="20.0" y="403.0" width="690.0" height="26" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30.0" y="421.0" style="font-size:13px">Emergency locator transmitter (ELT)</text><circle cx="33.0" cy="439.0" r="2.2" class="ah"/><text class="s" x="42.0" y="443.0" style="font-size:11.5px">Required by part 91, section 91.207. Inspect within 12 calendar months: installation, battery corrosion,</text><text class="s" x="42.0" y="458.0" style="font-size:11.5px">controls and crash sensor, and signal from the antenna.</text><circle cx="33.0" cy="472.0" r="2.2" class="ah"/><text class="s" x="42.0" y="476.0" style="font-size:11.5px">Mounted as far aft as practicable. Replace the battery after more than 1 hour of use, or at 50 percent of its</text><text class="s" x="42.0" y="491.0" style="font-size:11.5px">useful life.</text></svg>
