<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 523" role="img" aria-labelledby="ti de"><title id="ti">Get ready before anything happens</title><desc id="de">Cards on the Emergency Procedures section of the airplane manual and on route planning, the SAFETY passenger briefing in six boxes, and a card on the emergency locator transmitter.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11.5px}.q1{font-size:13px;fill:#fff}.q2{font-size:13px}.q3{stroke:currentColor;stroke-width:1.5}</style><text class="t" x="20" y="28" style="font-size:15px">Get ready before anything happens</text><text class="s q2" x="20" y="50">Much of handling an emergency is preparation done on the ground, in the manual and with your</text><text class="s q2" x="20" y="66.5">passengers.</text><rect class="cl" x="20" y="91" width="338" height="170" rx="8"/><rect x="20" y="91" width="338" height="26" rx="10" class="sky q3"/><text class="t q2" x="30" y="109">The Emergency Procedures section</text><circle cx="33" cy="127" r="2.2" class="ah"/><text class="s q0" x="42" y="131">In the AFM/POH, Section 3. Checklists with</text><text class="s q0" x="42" y="146">recommended procedures and airspeeds.</text><circle cx="33" cy="160" r="2.2" class="ah"/><text class="s q0" x="42" y="164">Examples: engine failure, fire, system failure.</text><text class="s q0" x="42" y="179">Inflight restart and ditching may be included.</text><circle cx="33" cy="193" r="2.2" class="ah"/><text class="s q0" x="42" y="197">Memorize the immediate action items, then use the</text><text class="s q0" x="42" y="212">checklist after they are done.</text><circle cx="33" cy="226" r="2.2" class="ah"/><text class="s q0" x="42" y="230">An Abnormal Procedures subsection covers</text><text class="s q0" x="42" y="245">malfunctions that are not emergencies.</text><rect class="cl" x="372" y="91" width="338" height="170" rx="8"/><rect x="372" y="91" width="338" height="26" rx="10" class="lav q3"/><text class="t q2" x="382" y="109">Plan the route</text><circle cx="385" cy="127" r="2.2" class="ah"/><text class="s q0" x="394" y="131">Choose the route wisely: an engine failure gives</text><text class="s q0" x="394" y="146">nearby airports supreme importance.</text><circle cx="385" cy="160" r="2.2" class="ah"/><text class="s q0" x="394" y="164">Over remote areas, carry clothing, water and</text><text class="s q0" x="394" y="179">survival gear for a forced landing.</text><circle cx="385" cy="193" r="2.2" class="ah"/><text class="s q0" x="394" y="197">At night, ask whether conditions allow a safe</text><text class="s q0" x="394" y="212">emergency landing.</text><circle cx="385" cy="226" r="2.2" class="ah"/><text class="s q0" x="394" y="230">Over water or unpopulated areas where you may lose</text><text class="s q0" x="394" y="245">the horizon, be ready to fly IFR.</text><text class="t" x="20" y="281" style="font-size:14px">Brief your passengers with SAFETY</text><rect class="cl" x="20" y="291" width="220.67" height="44" rx="8"/><circle cx="38" cy="313" r="12" class="ah"/><text class="t m q1" x="38" y="317.33">S</text><text class="s q0" x="58" y="310">Seat belts, shoulder</text><text class="s q0" x="58" y="324">harness, seat position</text><rect class="cl" x="254.67" y="291" width="220.67" height="44" rx="8"/><circle cx="272.67" cy="313" r="12" class="ah"/><text class="t m q1" x="272.67" y="317.33">A</text><text class="s q0" x="292.67" y="310">Air vents, controls, action</text><text class="s q0" x="292.67" y="324">if someone feels unwell</text><rect class="cl" x="489.33" y="291" width="220.67" height="44" rx="8"/><circle cx="507.33" cy="313" r="12" class="ah"/><text class="t m q1" x="507.33" y="317.33">F</text><text class="s q0" x="527.33" y="310">Fire extinguisher: where and</text><text class="s q0" x="527.33" y="324">how</text><rect class="cl" x="20" y="345" width="220.67" height="44" rx="8"/><circle cx="38" cy="367" r="12" class="ah"/><text class="t m q1" x="38" y="371.33">E</text><text class="s q0" x="58" y="364">Exit doors; evacuation plan;</text><text class="s q0" x="58" y="378">emergency/survival kit</text><rect class="cl" x="254.67" y="345" width="220.67" height="44" rx="8"/><circle cx="272.67" cy="367" r="12" class="ah"/><text class="t m q1" x="272.67" y="371.33">T</text><text class="s q0" x="292.67" y="364">Traffic: scanning and</text><text class="s q0" x="292.67" y="378">spotting</text><rect class="cl" x="489.33" y="345" width="220.67" height="44" rx="8"/><circle cx="507.33" cy="367" r="12" class="ah"/><text class="t m q1" x="507.33" y="371.33">Y</text><text class="s q0" x="527.33" y="371">Your questions? Speak up</text><rect class="cl" x="20" y="403" width="690" height="104" rx="8"/><rect x="20" y="403" width="690" height="26" rx="10" class="rose q3"/><text class="t q2" x="30" y="421">Emergency locator transmitter (ELT)</text><circle cx="33" cy="439" r="2.2" class="ah"/><text class="s q0" x="42" y="443">Required by part 91, section 91.207. Inspect within 12 calendar months: installation, battery corrosion,</text><text class="s q0" x="42" y="458">controls and crash sensor, and signal from the antenna.</text><circle cx="33" cy="472" r="2.2" class="ah"/><text class="s q0" x="42" y="476">Mounted as far aft as practicable. Replace the battery after more than 1 hour of use, or at 50 percent of its</text><text class="s q0" x="42" y="491">useful life.</text></svg>
