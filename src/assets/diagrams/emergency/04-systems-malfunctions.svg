<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 539" role="img" aria-labelledby="ti de"><title id="ti">Systems that act up</title><desc id="de">Cards on reading the ammeter and handling alternator failure, three kinds of pitot-static blockage, low vacuum, and carbon monoxide warning signs.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><text class="t" x="20" y="28" style="font-size:15px">Systems that act up: electrical, pitot-static, vacuum, exhaust</text><text class="s" x="20" y="50.0" style="font-size:13px">Each system gives you a clue. Know the clue, then follow the AFM/POH.</text><rect class="cl" x="20.0" y="74.5" width="338.0" height="152.0" rx="8"/><rect x="20.0" y="74.5" width="338.0" height="26" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30.0" y="92.5" style="font-size:13px">Electrical: read the ammeter</text><circle cx="33.0" cy="110.5" r="2.2" class="ah"/><text class="s" x="42.0" y="114.5" style="font-size:11.5px">Zero is at the center. Plus side: battery is</text><text class="s" x="42.0" y="129.5" style="font-size:11.5px">charging. Minus: more current is drawn than</text><text class="s" x="42.0" y="144.5" style="font-size:11.5px">replaced.</text><circle cx="33.0" cy="158.5" r="2.2" class="ah"/><text class="s" x="42.0" y="162.5" style="font-size:11.5px">Full-scale minus: alternator/generator malfunction.</text><text class="s" x="42.0" y="177.5" style="font-size:11.5px">Full-scale plus: regulator malfunction.</text><circle cx="33.0" cy="191.5" r="2.2" class="ah"/><text class="s" x="42.0" y="195.5" style="font-size:11.5px">Some airplanes have a warning light instead. In</text><text class="s" x="42.0" y="210.5" style="font-size:11.5px">either case, see the AFM/POH.</text><rect class="cl" x="372.0" y="74.5" width="338.0" height="152.0" rx="8"/><rect x="372.0" y="74.5" width="338.0" height="26" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="382.0" y="92.5" style="font-size:13px">Electrical: alternator failure</text><circle cx="385.0" cy="110.5" r="2.2" class="ah"/><text class="s" x="394.0" y="114.5" style="font-size:11.5px">An alternator switch lets you exclude the</text><text class="s" x="394.0" y="129.5" style="font-size:11.5px">alternator from the system.</text><circle cx="385.0" cy="143.5" r="2.2" class="ah"/><text class="s" x="394.0" y="147.5" style="font-size:11.5px">With it off, the whole load is on the battery: turn</text><text class="s" x="394.0" y="162.5" style="font-size:11.5px">off all nonessential electrical equipment to</text><text class="s" x="394.0" y="177.5" style="font-size:11.5px">conserve it.</text><circle cx="385.0" cy="191.5" r="2.2" class="ah"/><text class="s" x="394.0" y="195.5" style="font-size:11.5px">Circuit breakers can be reset; fuses are replaced,</text><text class="s" x="394.0" y="210.5" style="font-size:11.5px">so carry spares.</text><text class="t" x="20" y="246.5" style="font-size:14px">Pitot-static blockage (moisture, ice, dirt or insects)</text><rect class="cl" x="20.0" y="256.5" width="220.66666666666666" height="134.0" rx="8"/><rect x="20.0" y="256.5" width="220.66666666666666" height="26" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30.0" y="274.5" style="font-size:13px">Pitot blocked, drain clear</text><circle cx="33.0" cy="292.5" r="2.2" class="ah"/><text class="s" x="42.0" y="296.5" style="font-size:11.5px">The airspeed indicator drops to</text><text class="s" x="42.0" y="311.5" style="font-size:11.5px">zero.</text><rect class="cl" x="254.66666666666666" y="256.5" width="220.66666666666666" height="134.0" rx="8"/><rect x="254.66666666666666" y="256.5" width="220.66666666666666" height="26" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="264.66666666666663" y="274.5" style="font-size:13px">Pitot and drain blocked</text><circle cx="267.66666666666663" cy="292.5" r="2.2" class="ah"/><text class="s" x="276.66666666666663" y="296.5" style="font-size:11.5px">Airspeed does not change when</text><text class="s" x="276.66666666666663" y="311.5" style="font-size:11.5px">speed changes, but it does</text><text class="s" x="276.66666666666663" y="326.5" style="font-size:11.5px">change if you climb or descend.</text><rect class="cl" x="489.3333333333333" y="256.5" width="220.66666666666666" height="134.0" rx="8"/><rect x="489.3333333333333" y="256.5" width="220.66666666666666" height="26" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="499.3333333333333" y="274.5" style="font-size:13px">Static port blocked</text><circle cx="502.3333333333333" cy="292.5" r="2.2" class="ah"/><text class="s" x="511.3333333333333" y="296.5" style="font-size:11.5px">Airspeed stays alive but is</text><text class="s" x="511.3333333333333" y="311.5" style="font-size:11.5px">wrong; the altimeter freezes;</text><text class="s" x="511.3333333333333" y="326.5" style="font-size:11.5px">the VSI reads zero.</text><circle cx="502.3333333333333" cy="340.5" r="2.2" class="ah"/><text class="s" x="511.3333333333333" y="344.5" style="font-size:11.5px">Alternate static source, if</text><text class="s" x="511.3333333333333" y="359.5" style="font-size:11.5px">fitted: see the AFM/POH for</text><text class="s" x="511.3333333333333" y="374.5" style="font-size:11.5px">corrections.</text><rect class="cl" x="20.0" y="404.5" width="338.0" height="119.0" rx="8"/><rect x="20.0" y="404.5" width="338.0" height="26" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30.0" y="422.5" style="font-size:13px">Vacuum falls low</text><circle cx="33.0" cy="440.5" r="2.2" class="ah"/><text class="s" x="42.0" y="444.5" style="font-size:11.5px">Heading and attitude gyros slow down and drift</text><text class="s" x="42.0" y="459.5" style="font-size:11.5px">more. Watch for the warning light or the suction</text><text class="s" x="42.0" y="474.5" style="font-size:11.5px">gauge.</text><rect class="cl" x="372.0" y="404.5" width="338.0" height="119.0" rx="8"/><rect x="372.0" y="404.5" width="338.0" height="26" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="382.0" y="422.5" style="font-size:13px">Smell exhaust or feel groggy</text><circle cx="385.0" cy="440.5" r="2.2" class="ah"/><text class="s" x="394.0" y="444.5" style="font-size:11.5px">Carbon monoxide has no color or smell you can count</text><text class="s" x="394.0" y="459.5" style="font-size:11.5px">on. Headache, blurred vision, dizziness or</text><text class="s" x="394.0" y="474.5" style="font-size:11.5px">drowsiness are signs.</text><circle cx="385.0" cy="488.5" r="2.2" class="ah"/><text class="s" x="394.0" y="492.5" style="font-size:11.5px">Turn off the heater, open fresh air vents and</text><text class="s" x="394.0" y="507.5" style="font-size:11.5px">windows, use oxygen if available.</text></svg>
