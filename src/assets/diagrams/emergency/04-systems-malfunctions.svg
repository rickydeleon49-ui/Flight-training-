<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 539" role="img" aria-labelledby="ti de"><title id="ti">Systems that act up</title><desc id="de">Cards on reading the ammeter and handling alternator failure, three kinds of pitot-static blockage, low vacuum, and carbon monoxide warning signs.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11.5px}.q1{font-size:13px}.q2{stroke:currentColor;stroke-width:1.5}</style><text class="t" x="20" y="28" style="font-size:15px">Systems that act up: electrical, pitot-static, vacuum, exhaust</text><text class="s q1" x="20" y="50">Each system gives you a clue. Know the clue, then follow the AFM/POH.</text><rect class="cl" x="20" y="74.5" width="338" height="152" rx="8"/><rect x="20" y="74.5" width="338" height="26" rx="10" class="sky q2"/><text class="t q1" x="30" y="92.5">Electrical: read the ammeter</text><circle cx="33" cy="110.5" r="2.2" class="ah"/><text class="s q0" x="42" y="114.5">Zero is at the center. Plus side: battery is</text><text class="s q0" x="42" y="129.5">charging. Minus: more current is drawn than</text><text class="s q0" x="42" y="144.5">replaced.</text><circle cx="33" cy="158.5" r="2.2" class="ah"/><text class="s q0" x="42" y="162.5">Full-scale minus: alternator/generator malfunction.</text><text class="s q0" x="42" y="177.5">Full-scale plus: regulator malfunction.</text><circle cx="33" cy="191.5" r="2.2" class="ah"/><text class="s q0" x="42" y="195.5">Some airplanes have a warning light instead. In</text><text class="s q0" x="42" y="210.5">either case, see the AFM/POH.</text><rect class="cl" x="372" y="74.5" width="338" height="152" rx="8"/><rect x="372" y="74.5" width="338" height="26" rx="10" class="lav q2"/><text class="t q1" x="382" y="92.5">Electrical: alternator failure</text><circle cx="385" cy="110.5" r="2.2" class="ah"/><text class="s q0" x="394" y="114.5">An alternator switch lets you exclude the</text><text class="s q0" x="394" y="129.5">alternator from the system.</text><circle cx="385" cy="143.5" r="2.2" class="ah"/><text class="s q0" x="394" y="147.5">With it off, the whole load is on the battery: turn</text><text class="s q0" x="394" y="162.5">off all nonessential electrical equipment to</text><text class="s q0" x="394" y="177.5">conserve it.</text><circle cx="385" cy="191.5" r="2.2" class="ah"/><text class="s q0" x="394" y="195.5">Circuit breakers can be reset; fuses are replaced,</text><text class="s q0" x="394" y="210.5">so carry spares.</text><text class="t" x="20" y="246.5" style="font-size:14px">Pitot-static blockage (moisture, ice, dirt or insects)</text><rect class="cl" x="20" y="256.5" width="220.67" height="134" rx="8"/><rect x="20" y="256.5" width="220.67" height="26" rx="10" class="mint q2"/><text class="t q1" x="30" y="274.5">Pitot blocked, drain clear</text><circle cx="33" cy="292.5" r="2.2" class="ah"/><text class="s q0" x="42" y="296.5">The airspeed indicator drops to</text><text class="s q0" x="42" y="311.5">zero.</text><rect class="cl" x="254.67" y="256.5" width="220.67" height="134" rx="8"/><rect x="254.67" y="256.5" width="220.67" height="26" rx="10" class="rose q2"/><text class="t q1" x="264.67" y="274.5">Pitot and drain blocked</text><circle cx="267.67" cy="292.5" r="2.2" class="ah"/><text class="s q0" x="276.67" y="296.5">Airspeed does not change when</text><text class="s q0" x="276.67" y="311.5">speed changes, but it does</text><text class="s q0" x="276.67" y="326.5">change if you climb or descend.</text><rect class="cl" x="489.33" y="256.5" width="220.67" height="134" rx="8"/><rect x="489.33" y="256.5" width="220.67" height="26" rx="10" class="sky q2"/><text class="t q1" x="499.33" y="274.5">Static port blocked</text><circle cx="502.33" cy="292.5" r="2.2" class="ah"/><text class="s q0" x="511.33" y="296.5">Airspeed stays alive but is</text><text class="s q0" x="511.33" y="311.5">wrong; the altimeter freezes;</text><text class="s q0" x="511.33" y="326.5">the VSI reads zero.</text><circle cx="502.33" cy="340.5" r="2.2" class="ah"/><text class="s q0" x="511.33" y="344.5">Alternate static source, if</text><text class="s q0" x="511.33" y="359.5">fitted: see the AFM/POH for</text><text class="s q0" x="511.33" y="374.5">corrections.</text><rect class="cl" x="20" y="404.5" width="338" height="119" rx="8"/><rect x="20" y="404.5" width="338" height="26" rx="10" class="lav q2"/><text class="t q1" x="30" y="422.5">Vacuum falls low</text><circle cx="33" cy="440.5" r="2.2" class="ah"/><text class="s q0" x="42" y="444.5">Heading and attitude gyros slow down and drift</text><text class="s q0" x="42" y="459.5">more. Watch for the warning light or the suction</text><text class="s q0" x="42" y="474.5">gauge.</text><rect class="cl" x="372" y="404.5" width="338" height="119" rx="8"/><rect x="372" y="404.5" width="338" height="26" rx="10" class="rose q2"/><text class="t q1" x="382" y="422.5">Smell exhaust or feel groggy</text><circle cx="385" cy="440.5" r="2.2" class="ah"/><text class="s q0" x="394" y="444.5">Carbon monoxide has no color or smell you can count</text><text class="s q0" x="394" y="459.5">on. Headache, blurred vision, dizziness or</text><text class="s q0" x="394" y="474.5">drowsiness are signs.</text><circle cx="385" cy="488.5" r="2.2" class="ah"/><text class="s q0" x="394" y="492.5">Turn off the heater, open fresh air vents and</text><text class="s q0" x="394" y="507.5">windows, use oxygen if available.</text></svg>
