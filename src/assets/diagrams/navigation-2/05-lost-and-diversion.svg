<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 710" role="img" aria-labelledby="ti de"><title id="ti">Lost procedures and flight diversion</title><desc id="de">Lost procedures in order: climb, navigate by plotting an azimuth from two facilities or by GPS, communicate using sectional chart frequencies, and if threatening use 121.5 megahertz and transponder 7700. Diversion: check charts before flight, pick the alternate and measure the course with a straightedge and compass rose, turn promptly, then use winds aloft to compute heading, groundspeed, arrival time and fuel.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11px}.q1{font-size:12px}.q2{stroke:currentColor;stroke-width:1.5}.q3{font-size:13px}.q4{font-size:12.5px}.q5{font-size:13px;fill:#fff}.q6{stroke-width:2}</style><text class="t" x="20" y="28" style="font-size:15px">Lost and diversion: what to do, in order</text><text class="s q3" x="20" y="50">Two separate situations. Lost: you do not know where you are. Diversion: you know where you are but</text><text class="s q3" x="20" y="66.5">cannot reach the planned destination. Priority in both: fly the aircraft.</text><text class="t" x="20" y="107" style="font-size:14px">If you become lost</text><rect x="20" y="115" width="690" height="63" rx="10" class="sky q2"/><circle cx="42" cy="137" r="11" class="ah"/><text class="t m q5" x="42" y="141.33">1</text><text class="t q3" x="62" y="137">Climb</text><text class="s q1" x="62" y="155">If no town or city can be seen, climb first, watching traffic and weather. More altitude gives more</text><text class="s q1" x="62" y="170.5">radio and navigation range and more radar coverage. Look for a name on a water tower.</text><rect x="20" y="186" width="690" height="63" rx="10" class="mint q2"/><circle cx="42" cy="208" r="11" class="ah"/><text class="t m q5" x="42" y="212.33">2</text><text class="t q3" x="62" y="208">Navigate</text><text class="s q1" x="62" y="226">With a VOR or ADF receiver, plot an azimuth from two or more facilities. With GPS, fix position and</text><text class="s q1" x="62" y="241.5">find the nearest airport.</text><rect x="20" y="257" width="690" height="63" rx="10" class="lav q2"/><circle cx="42" cy="279" r="11" class="ah"/><text class="t m q5" x="42" y="283.33">3</text><text class="t q3" x="62" y="279">Communicate</text><text class="s q1" x="62" y="297">Use frequencies on the sectional. A controller may give radar vectors or direction finding help:</text><text class="s q1" x="62" y="312.5">hold the transmit button a few seconds, release, and repeat when asked.</text><rect x="20" y="328" width="690" height="63" rx="10" class="rose q2"/><circle cx="42" cy="350" r="11" class="ah"/><text class="t m q5" x="42" y="354.33">4</text><text class="t q3" x="62" y="350">Threatening? Declare it</text><text class="s q1" x="62" y="368">Transmit the situation on 121.5 MHz and set the transponder to 7700. Most facilities, and even</text><text class="s q1" x="62" y="383.5">airliners, monitor it.</text><text class="t" x="20" y="419" style="font-size:14px">If you must divert</text><rect x="20" y="427" width="159" height="153.5" rx="10" class="sky q2"/><text class="t m q4" x="99.5" y="446">Before the flight</text><text class="s m q0" x="99.5" y="463">Check charts for</text><text class="s m q0" x="99.5" y="477.5">airports or suitable</text><text class="s m q0" x="99.5" y="492">landing areas along the</text><text class="s m q0" x="99.5" y="506.5">route, and for navaids</text><text class="s m q0" x="99.5" y="521">to use in a diversion.</text><path d="M181 503.75L188 503.8" class="dk q6"/><path d="M195 503.75L188 506.9L188 500.6Z" class="dh" style=""/><rect x="197" y="427" width="159" height="153.5" rx="10" class="mint q2"/><text class="t m q4" x="276.5" y="446">Pick the alternate</text><text class="t m q4" x="276.5" y="461">and the course</text><text class="s m q0" x="276.5" y="478">Measure with a</text><text class="s m q0" x="276.5" y="492.5">straightedge and the</text><text class="s m q0" x="276.5" y="507">compass rose around a</text><text class="s m q0" x="276.5" y="521.5">VOR, or an airway. A</text><text class="s m q0" x="276.5" y="536">radial is outbound: use</text><text class="s m q0" x="276.5" y="550.5">the reciprocal to fly to</text><text class="s m q0" x="276.5" y="565">the station.</text><path d="M358 503.75L365 503.8" class="dk q6"/><path d="M372 503.75L365 506.9L365 500.6Z" class="dh" style=""/><rect x="374" y="427" width="159" height="153.5" rx="10" class="lav q2"/><text class="t m q4" x="453.5" y="446">Turn now</text><text class="s m q0" x="453.5" y="463">If time permits, start</text><text class="s m q0" x="453.5" y="477.5">over a prominent ground</text><text class="s m q0" x="453.5" y="492">feature. In an</text><text class="s m q0" x="453.5" y="506.5">emergency, divert</text><text class="s m q0" x="453.5" y="521">promptly; do not finish</text><text class="s m q0" x="453.5" y="535.5">all the plotting first.</text><path d="M535 503.75L542 503.8" class="dk q6"/><path d="M549 503.75L542 506.9L542 500.6Z" class="dh" style=""/><rect x="551" y="427" width="159" height="153.5" rx="10" class="rose q2"/><text class="t m q4" x="630.5" y="446">Then calculate</text><text class="s m q0" x="630.5" y="463">Once on course, note the</text><text class="s m q0" x="630.5" y="477.5">time. Use winds aloft</text><text class="s m q0" x="630.5" y="492">nearest the diversion</text><text class="s m q0" x="630.5" y="506.5">point for heading and</text><text class="s m q0" x="630.5" y="521">groundspeed, then new</text><text class="s m q0" x="630.5" y="535.5">arrival time and fuel.</text><rect class="cl" x="20" y="594.5" width="690" height="108" rx="8"/><circle cx="35" cy="616.5" r="2.2" class="ah"/><text class="s q1" x="44" y="620.5">An alternate with a VOR or NDB on the field is typically easier to navigate to.</text><circle cx="35" cy="636" r="2.2" class="ah"/><text class="s q1" x="44" y="640">Choose the diversion altitude with cloud heights, winds, terrain and radio reception in mind.</text><circle cx="35" cy="655.5" r="2.2" class="ah"/><text class="s q1" x="44" y="659.5">Divide attention between navigation and planning, with priority on flying the aircraft. Use shortcuts</text><text class="s q1" x="44" y="675">and rules of thumb.</text></svg>
