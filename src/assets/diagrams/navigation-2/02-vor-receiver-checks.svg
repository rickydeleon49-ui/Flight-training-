<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 552" role="img" aria-labelledby="ti de"><title id="ti">Checking a VOR receiver</title><desc id="de">Three ways to check VOR accuracy: the FAA VOR test facility, certified ground checkpoints on airport surfaces, and certified airborne checkpoints. A scale shows the guide tolerances: within 4 degrees on the ground and within 6 degrees in the air. A dual receiver check tunes two receivers to the same VOR and allows a maximum 4 degree difference. Also station identification, the alarm flag, and where checkpoints are listed. The 090 and 093 receiver readings are an example.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><text class="t" x="20" y="28" style="font-size:15px">Checking a VOR receiver: three ways and the tolerances</text><text class="s" x="20" y="50.0" style="font-size:13px">Checks verify that the radials the receiver gets match the radials the station sends. They are not</text><text class="s" x="20" y="66.5" style="font-size:13px">required for VFR flight; the IFR tolerances are a good guide. The 090 and 093 readings are an Example.</text><rect x="20.0" y="93.0" width="220.66666666666666" height="95.0" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="130.33333333333331" y="112.0" style="font-size:12.5px">FAA VOR test facility (VOT)</text><text class="s m" x="130.33333333333331" y="129.0" style="font-size:11px">A ground facility that sends a test</text><text class="s m" x="130.33333333333331" y="143.5" style="font-size:11px">signal. Some VOTs can be used in</text><text class="s m" x="130.33333333333331" y="158.0" style="font-size:11px">the air; others are for ground use</text><text class="s m" x="130.33333333333331" y="172.5" style="font-size:11px">only.</text><rect x="254.66666666666666" y="93.0" width="220.66666666666666" height="95.0" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="365.0" y="112.0" style="font-size:12.5px">Certified ground checkpoint</text><text class="s m" x="365.0" y="129.0" style="font-size:11px">Marked spots on airport surfaces</text><text class="s m" x="365.0" y="143.5" style="font-size:11px">where the receiver can be checked</text><text class="s m" x="365.0" y="158.0" style="font-size:11px">on the ground.</text><rect x="489.3333333333333" y="93.0" width="220.66666666666666" height="95.0" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="599.6666666666666" y="112.0" style="font-size:12.5px">Certified airborne checkpoint</text><text class="s m" x="599.6666666666666" y="129.0" style="font-size:11px">A published point in the air to</text><text class="s m" x="599.6666666666666" y="143.5" style="font-size:11px">check the receiver in flight.</text><rect class="cl" x="20" y="198.0" width="420" height="170" rx="8"/><text class="t" x="32" y="220.0" style="font-size:14px">Tolerance guide, in degrees of error</text><path d="M128 242.0L128 316.0" class="dk" style="stroke-width:1.2;opacity:0.7"/><text class="s m" x="128" y="330.0" style="font-size:11px">-6</text><path d="M162 242.0L162 316.0" class="dk" style="stroke-width:1.2;opacity:0.7"/><text class="s m" x="162" y="330.0" style="font-size:11px">-4</text><path d="M230 242.0L230 316.0" class="dk" style="stroke-width:1.2;opacity:0.7"/><text class="s m" x="230" y="330.0" style="font-size:11px">0</text><path d="M298 242.0L298 316.0" class="dk" style="stroke-width:1.2;opacity:0.7"/><text class="s m" x="298" y="330.0" style="font-size:11px">+4</text><path d="M332 242.0L332 316.0" class="dk" style="stroke-width:1.2;opacity:0.7"/><text class="s m" x="332" y="330.0" style="font-size:11px">+6</text><rect x="162" y="250.0" width="136" height="22" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="230.0" y="264.6666666666667" style="font-size:11px">Ground check: within 4</text><rect x="128" y="280.0" width="204" height="22" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="230.0" y="294.6666666666667" style="font-size:11px">Airborne check: within 6</text><text class="s" x="32" y="330.0" style="font-size:11px">Error</text><text class="t" x="32" y="266.0" style="font-size:12px">Ground</text><text class="t" x="32" y="296.0" style="font-size:12px">Airborne</text><text class="s m" x="230" y="354.0" style="font-size:11px">(IFR tolerances, used as a guide for VFR)</text><rect class="cl" x="456" y="198.0" width="254" height="170" rx="8"/><text class="t" x="468" y="220.0" style="font-size:14px">Dual VOR receiver check</text><path d="M595.0 246.0L589.0 256.4L577.0 256.4L571.0 246.0L577.0 235.6L589.0 235.6Z" class="lav" style="stroke:currentColor;stroke-width:1.8"/><text class="s" x="603" y="250.0" style="font-size:11px">Same VOR station</text><rect x="468" y="294.0" width="106" height="24" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="521.0" y="309.6666666666667" style="font-size:11px">Receiver 1: 090</text><rect x="592" y="294.0" width="106" height="24" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="645.0" y="309.6666666666667" style="font-size:11px">Receiver 2: 093</text><path d="M578 256.0L521 294.0" class="dk" style="stroke-width:1.4;opacity:0.8"/><path d="M588 256.0L645 294.0" class="dk" style="stroke-width:1.4;opacity:0.8"/><text class="t m" x="583" y="336.0" style="font-size:11.5px">Max 4 apart (3 is Example)</text><rect x="20" y="380.0" width="222" height="24" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30" y="397.0" style="font-size:13px">Keep the equipment honest</text><circle cx="31" cy="418.0" r="2.2" class="ah"/><text class="s" x="40" y="422.0" style="font-size:12px">The radial is generally within</text><text class="s" x="40" y="437.5" style="font-size:12px">1 degree of true alignment</text><circle cx="31" cy="453.0" r="2.2" class="ah"/><text class="s" x="40" y="457.0" style="font-size:12px">Accuracy suffers most far from</text><text class="s" x="40" y="472.5" style="font-size:12px">the station</text><circle cx="31" cy="488.0" r="2.2" class="ah"/><text class="s" x="40" y="492.0" style="font-size:12px">Check often; a complete</text><text class="s" x="40" y="507.5" style="font-size:12px">calibration each year</text><rect x="254" y="380.0" width="222" height="24" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="264" y="397.0" style="font-size:13px">Is it the right station?</text><circle cx="265" cy="418.0" r="2.2" class="ah"/><text class="s" x="274" y="422.0" style="font-size:12px">Morse code ID, or a recorded</text><text class="s" x="274" y="437.5" style="font-size:12px">voice naming the station then</text><text class="s" x="274" y="453.0" style="font-size:12px">VOR</text><circle cx="265" cy="468.5" r="2.2" class="ah"/><text class="s" x="274" y="472.5" style="font-size:12px">Voice from a flight service</text><text class="s" x="274" y="488.0" style="font-size:12px">station is not reliable for ID</text><circle cx="265" cy="503.5" r="2.2" class="ah"/><text class="s" x="274" y="507.5" style="font-size:12px">No code on the frequency means</text><text class="s" x="274" y="523.0" style="font-size:12px">out of service</text><rect x="488" y="380.0" width="222" height="24" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="498" y="397.0" style="font-size:13px">When the receiver quits</text><circle cx="499" cy="418.0" r="2.2" class="ah"/><text class="s" x="508" y="422.0" style="font-size:12px">An alarm flag shows when signal</text><text class="s" x="508" y="437.5" style="font-size:12px">strength is inadequate</text><circle cx="499" cy="453.0" r="2.2" class="ah"/><text class="s" x="508" y="457.0" style="font-size:12px">Too far from the VOR, or too</text><text class="s" x="508" y="472.5" style="font-size:12px">low and out of line of sight</text><circle cx="499" cy="488.0" r="2.2" class="ah"/><text class="s" x="508" y="492.0" style="font-size:12px">The airborne and ground</text><text class="s" x="508" y="507.5" style="font-size:12px">checkpoint list is in the Chart</text><text class="s" x="508" y="523.0" style="font-size:12px">Supplement U.S.</text></svg>
