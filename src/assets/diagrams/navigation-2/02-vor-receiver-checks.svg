<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 552" role="img" aria-labelledby="ti de"><title id="ti">Checking a VOR receiver</title><desc id="de">Three ways to check VOR accuracy: the FAA VOR test facility, certified ground checkpoints on airport surfaces, and certified airborne checkpoints. A scale shows the guide tolerances: within 4 degrees on the ground and within 6 degrees in the air. A dual receiver check tunes two receivers to the same VOR and allows a maximum 4 degree difference. Also station identification, the alarm flag, and where checkpoints are listed. The 090 and 093 receiver readings are an example.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:12px}.q1{font-size:11px}.q2{stroke:currentColor;stroke-width:1.5}.q3{font-size:13px}.q4{stroke-width:1.2;opacity:0.7}.q5{font-size:12.5px}.q6{stroke-width:1.4;opacity:0.8}</style><text class="t" x="20" y="28" style="font-size:15px">Checking a VOR receiver: three ways and the tolerances</text><text class="s q3" x="20" y="50">Checks verify that the radials the receiver gets match the radials the station sends. They are not</text><text class="s q3" x="20" y="66.5">required for VFR flight; the IFR tolerances are a good guide. The 090 and 093 readings are an Example.</text><rect x="20" y="93" width="220.67" height="95" rx="10" class="sky q2"/><text class="t m q5" x="130.33" y="112">FAA VOR test facility (VOT)</text><text class="s m q1" x="130.33" y="129">A ground facility that sends a test</text><text class="s m q1" x="130.33" y="143.5">signal. Some VOTs can be used in</text><text class="s m q1" x="130.33" y="158">the air; others are for ground use</text><text class="s m q1" x="130.33" y="172.5">only.</text><rect x="254.67" y="93" width="220.67" height="95" rx="10" class="mint q2"/><text class="t m q5" x="365" y="112">Certified ground checkpoint</text><text class="s m q1" x="365" y="129">Marked spots on airport surfaces</text><text class="s m q1" x="365" y="143.5">where the receiver can be checked</text><text class="s m q1" x="365" y="158">on the ground.</text><rect x="489.33" y="93" width="220.67" height="95" rx="10" class="lav q2"/><text class="t m q5" x="599.67" y="112">Certified airborne checkpoint</text><text class="s m q1" x="599.67" y="129">A published point in the air to</text><text class="s m q1" x="599.67" y="143.5">check the receiver in flight.</text><rect class="cl" x="20" y="198" width="420" height="170" rx="8"/><text class="t" x="32" y="220" style="font-size:14px">Tolerance guide, in degrees of error</text><path d="M128 242L128 316" class="dk q4"/><text class="s m q1" x="128" y="330">-6</text><path d="M162 242L162 316" class="dk q4"/><text class="s m q1" x="162" y="330">-4</text><path d="M230 242L230 316" class="dk q4"/><text class="s m q1" x="230" y="330">0</text><path d="M298 242L298 316" class="dk q4"/><text class="s m q1" x="298" y="330">+4</text><path d="M332 242L332 316" class="dk q4"/><text class="s m q1" x="332" y="330">+6</text><rect x="162" y="250" width="136" height="22" rx="10" class="mint q2"/><text class="t m q1" x="230" y="264.67">Ground check: within 4</text><rect x="128" y="280" width="204" height="22" rx="10" class="sky q2"/><text class="t m q1" x="230" y="294.67">Airborne check: within 6</text><text class="s q1" x="32" y="330">Error</text><text class="t q0" x="32" y="266">Ground</text><text class="t q0" x="32" y="296">Airborne</text><text class="s m q1" x="230" y="354">(IFR tolerances, used as a guide for VFR)</text><rect class="cl" x="456" y="198" width="254" height="170" rx="8"/><text class="t" x="468" y="220" style="font-size:14px">Dual VOR receiver check</text><path d="M595 246L589 256.4L577 256.4L571 246L577 235.6L589 235.6Z" class="lav" style="stroke:currentColor;stroke-width:1.8"/><text class="s q1" x="603" y="250">Same VOR station</text><rect x="468" y="294" width="106" height="24" rx="10" class="sky q2"/><text class="t m q1" x="521" y="309.67">Receiver 1: 090</text><rect x="592" y="294" width="106" height="24" rx="10" class="mint q2"/><text class="t m q1" x="645" y="309.67">Receiver 2: 093</text><path d="M578 256L521 294" class="dk q6"/><path d="M588 256L645 294" class="dk q6"/><text class="t m" x="583" y="336" style="font-size:11.5px">Max 4 apart (3 is Example)</text><rect x="20" y="380" width="222" height="24" rx="10" class="sky q2"/><text class="t q3" x="30" y="397">Keep the equipment honest</text><circle cx="31" cy="418" r="2.2" class="ah"/><text class="s q0" x="40" y="422">The radial is generally within</text><text class="s q0" x="40" y="437.5">1 degree of true alignment</text><circle cx="31" cy="453" r="2.2" class="ah"/><text class="s q0" x="40" y="457">Accuracy suffers most far from</text><text class="s q0" x="40" y="472.5">the station</text><circle cx="31" cy="488" r="2.2" class="ah"/><text class="s q0" x="40" y="492">Check often; a complete</text><text class="s q0" x="40" y="507.5">calibration each year</text><rect x="254" y="380" width="222" height="24" rx="10" class="mint q2"/><text class="t q3" x="264" y="397">Is it the right station?</text><circle cx="265" cy="418" r="2.2" class="ah"/><text class="s q0" x="274" y="422">Morse code ID, or a recorded</text><text class="s q0" x="274" y="437.5">voice naming the station then</text><text class="s q0" x="274" y="453">VOR</text><circle cx="265" cy="468.5" r="2.2" class="ah"/><text class="s q0" x="274" y="472.5">Voice from a flight service</text><text class="s q0" x="274" y="488">station is not reliable for ID</text><circle cx="265" cy="503.5" r="2.2" class="ah"/><text class="s q0" x="274" y="507.5">No code on the frequency means</text><text class="s q0" x="274" y="523">out of service</text><rect x="488" y="380" width="222" height="24" rx="10" class="rose q2"/><text class="t q3" x="498" y="397">When the receiver quits</text><circle cx="499" cy="418" r="2.2" class="ah"/><text class="s q0" x="508" y="422">An alarm flag shows when signal</text><text class="s q0" x="508" y="437.5">strength is inadequate</text><circle cx="499" cy="453" r="2.2" class="ah"/><text class="s q0" x="508" y="457">Too far from the VOR, or too</text><text class="s q0" x="508" y="472.5">low and out of line of sight</text><circle cx="499" cy="488" r="2.2" class="ah"/><text class="s q0" x="508" y="492">The airborne and ground</text><text class="s q0" x="508" y="507.5">checkpoint list is in the Chart</text><text class="s q0" x="508" y="523">Supplement U.S.</text></svg>
