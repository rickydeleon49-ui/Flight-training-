<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 652" role="img" aria-labelledby="ti de"><title id="ti">Fixing position by crossing two VOR radials</title><desc id="de">A chart view with two VOR stations. A line is drawn outward along the radial from each station, and the aircraft position is where the lines cross. Steps: tune and identify, center the needle, read the radial from the dial using the flag, plot the line outward, repeat for the second station. Two small cards show how a FROM flag gives the radial directly and a TO flag gives the reciprocal. All radial numbers are examples.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:12px}.q1{font-size:11.5px}.q2{font-size:12.5px}.q3{font-size:12px;fill:#fff}.q4{font-size:13px}.q5{font-size:11px}.q6{stroke-width:1.2;opacity:0.6;stroke-dasharray:6 5}.q7{fill:var(--palette-berry,#A84C6B)}.q8{stroke:currentColor;stroke-width:1.8}.q9{stroke:currentColor;stroke-width:1.5}</style><text class="t" x="20" y="28" style="font-size:15px">Fixing your position by crossing two VOR radials</text><text class="s q4" x="20" y="50">A radial is a line of magnetic bearing running outward from its station. Where the lines from two</text><text class="s q4" x="20" y="66.5">stations meet is the position. All radial numbers here are an Example.</text><rect class="cl" x="20" y="93" width="430" height="360" rx="8"/><text class="t" x="32" y="115" style="font-size:14px">Chart view (north up)</text><path d="M100 403L273.6 229.4" class="dk" style="stroke-width:2.2"/><path d="M280 223L276.5 232.2L270.8 226.5Z" class="dh" style=""/><path d="M380 403L206.4 229.4" class="dk" style="stroke-width:2.2"/><path d="M200 223L209.2 226.5L203.5 232.2Z" class="dh" style=""/><path d="M100 403L100 313" class="dk q6"/><path d="M380 403L380 313" class="dk q6"/><path d="M100 353A50 50 0 0 1 135.4 367.6" class="acc" style="stroke-width:2"/><path d="M135.4 367.6L126.1 364.1L131.9 358.4Z" class="dh q7"/><path d="M380 353A50 50 0 0 0 344.6 367.6" class="acc" style="stroke-width:2"/><path d="M344.6 367.6L348.1 358.4L353.9 364.1Z" class="dh q7"/><text class="t q0" x="127.35" y="338.56">045</text><text class="t e q0" x="352.65" y="338.56">315</text><text class="s m q5" x="96" y="305">N</text><text class="s m q5" x="384" y="305">N</text><path d="M114 403L107 415.1L93 415.1L86 403L93 390.9L107 390.9Z" class="lav q8"/><path d="M394 403L387 415.1L373 415.1L366 403L373 390.9L387 390.9Z" class="sky q8"/><text class="t m q0" x="100" y="435">VOR A</text><text class="t m q0" x="380" y="435">VOR B</text><path d="M240 252L245.7 269.7L234.3 269.7Z" class="ah"/><text class="t m q2" x="240" y="317">Position</text><text class="s q5" x="290" y="219">Radial 045 from A</text><text class="s e q5" x="190" y="219">Radial 315 from B</text><rect class="cl" x="466" y="93" width="244" height="360" rx="8"/><text class="t" x="478" y="115" style="font-size:14px">Steps</text><circle cx="488" cy="143" r="10" class="ah"/><text class="t m q3" x="488" y="147">1</text><text class="t q2" x="506" y="147">Tune and identify</text><text class="s q1" x="506" y="163">Tune VOR A and confirm the code.</text><circle cx="488" cy="190" r="10" class="ah"/><text class="t m q3" x="488" y="194">2</text><text class="t q2" x="506" y="194">Center the needle</text><text class="s q1" x="506" y="210">Turn the course selector until</text><text class="s q1" x="506" y="225">the needle centers.</text><circle cx="488" cy="252" r="10" class="ah"/><text class="t m q3" x="488" y="256">3</text><text class="t q2" x="506" y="256">Read the radial</text><text class="s q1" x="506" y="272">FROM flag: the dial shows the</text><text class="s q1" x="506" y="287">radial. TO flag: the radial is</text><text class="s q1" x="506" y="302">the reciprocal.</text><circle cx="488" cy="329" r="10" class="ah"/><text class="t m q3" x="488" y="333">4</text><text class="t q2" x="506" y="333">Plot it</text><text class="s q1" x="506" y="349">Draw the line outward from the</text><text class="s q1" x="506" y="364">station, using the compass rose</text><text class="s q1" x="506" y="379">on the chart.</text><circle cx="488" cy="406" r="10" class="ah"/><text class="t m q3" x="488" y="410">5</text><text class="t q2" x="506" y="410">Repeat for VOR B</text><text class="s q1" x="506" y="426">The lines cross at your</text><text class="s q1" x="506" y="441">position.</text><rect x="20" y="465" width="337" height="24" rx="10" class="mint q9"/><text class="t q4" x="30" y="482">Reading the radial: FROM</text><circle cx="31" cy="503" r="2.2" class="ah"/><text class="s q0" x="40" y="507">Example: selector 045, needle centered, flag FROM</text><circle cx="31" cy="522.5" r="2.2" class="ah"/><text class="s q0" x="40" y="526.5">You are on the 045 radial, 045 magnetic outward</text><text class="s q0" x="40" y="542">from the station</text><rect x="373" y="465" width="337" height="24" rx="10" class="sky q9"/><text class="t q4" x="383" y="482">Reading the radial: TO</text><circle cx="384" cy="503" r="2.2" class="ah"/><text class="s q0" x="393" y="507">Example: selector 225, needle centered, flag TO</text><circle cx="384" cy="522.5" r="2.2" class="ah"/><text class="s q0" x="393" y="526.5">The course to the station is 225, so the radial</text><text class="s q0" x="393" y="542">is the reciprocal, 045</text><rect class="cl" x="20" y="571.5" width="690" height="73" rx="8"/><circle cx="35" cy="593.5" r="2.2" class="ah"/><text class="s q0" x="44" y="597.5">Lost in flight: plotting an azimuth from two or more navigational facilities can show position.</text><circle cx="35" cy="613" r="2.2" class="ah"/><text class="s q0" x="44" y="617">Radials are generally within 1 degree, so treat the crossing as a good fix, not an exact point.</text></svg>
