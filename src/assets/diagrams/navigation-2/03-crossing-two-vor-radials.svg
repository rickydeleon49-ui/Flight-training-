<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 652" role="img" aria-labelledby="ti de"><title id="ti">Fixing position by crossing two VOR radials</title><desc id="de">A chart view with two VOR stations. A line is drawn outward along the radial from each station, and the aircraft position is where the lines cross. Steps: tune and identify, center the needle, read the radial from the dial using the flag, plot the line outward, repeat for the second station. Two small cards show how a FROM flag gives the radial directly and a TO flag gives the reciprocal. All radial numbers are examples.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><text class="t" x="20" y="28" style="font-size:15px">Fixing your position by crossing two VOR radials</text><text class="s" x="20" y="50.0" style="font-size:13px">A radial is a line of magnetic bearing running outward from its station. Where the lines from two</text><text class="s" x="20" y="66.5" style="font-size:13px">stations meet is the position. All radial numbers here are an Example.</text><rect class="cl" x="20" y="93.0" width="430" height="360" rx="8"/><text class="t" x="32" y="115.0" style="font-size:14px">Chart view (north up)</text><path d="M100 403.0L273.6 229.4" class="dk" style="stroke-width:2.2"/><path d="M280 223.0L276.5 232.2L270.8 226.5Z" class="dh" style=""/><path d="M380 403.0L206.4 229.4" class="dk" style="stroke-width:2.2"/><path d="M200 223.0L209.2 226.5L203.5 232.2Z" class="dh" style=""/><path d="M100 403.0L100 313.0" class="dk" style="stroke-width:1.2;opacity:0.6;stroke-dasharray:6 5"/><path d="M380 403.0L380 313.0" class="dk" style="stroke-width:1.2;opacity:0.6;stroke-dasharray:6 5"/><path d="M100.0 353.0A50 50 0 0 1 135.4 367.6" class="acc" style="stroke-width:2"/><path d="M135.4 367.6L126.1 364.1L131.9 358.4Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><path d="M380.0 353.0A50 50 0 0 0 344.6 367.6" class="acc" style="stroke-width:2"/><path d="M344.6 367.6L348.1 358.4L353.9 364.1Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><text class="t" x="127.35117899424915" y="338.5646602583292" style="font-size:12px">045</text><text class="t e" x="352.64882100575085" y="338.5646602583292" style="font-size:12px">315</text><text class="s m" x="96" y="305.0" style="font-size:11px">N</text><text class="s m" x="384" y="305.0" style="font-size:11px">N</text><path d="M114.0 403.0L107.0 415.1L93.0 415.1L86.0 403.0L93.0 390.9L107.0 390.9Z" class="lav" style="stroke:currentColor;stroke-width:1.8"/><path d="M394.0 403.0L387.0 415.1L373.0 415.1L366.0 403.0L373.0 390.9L387.0 390.9Z" class="sky" style="stroke:currentColor;stroke-width:1.8"/><text class="t m" x="100" y="435.0" style="font-size:12px">VOR A</text><text class="t m" x="380" y="435.0" style="font-size:12px">VOR B</text><path d="M240.0 252.0L245.7 269.7L234.3 269.7Z" class="ah"/><text class="t m" x="240" y="317.0" style="font-size:12.5px">Position</text><text class="s" x="290" y="219.0" style="font-size:11px">Radial 045 from A</text><text class="s e" x="190" y="219.0" style="font-size:11px">Radial 315 from B</text><rect class="cl" x="466" y="93.0" width="244" height="360" rx="8"/><text class="t" x="478" y="115.0" style="font-size:14px">Steps</text><circle cx="488" cy="143.0" r="10" class="ah"/><text class="t m" x="488" y="147.0" style="font-size:12px;fill:#fff">1</text><text class="t" x="506" y="147.0" style="font-size:12.5px">Tune and identify</text><text class="s" x="506" y="163.0" style="font-size:11.5px">Tune VOR A and confirm the code.</text><circle cx="488" cy="190.0" r="10" class="ah"/><text class="t m" x="488" y="194.0" style="font-size:12px;fill:#fff">2</text><text class="t" x="506" y="194.0" style="font-size:12.5px">Center the needle</text><text class="s" x="506" y="210.0" style="font-size:11.5px">Turn the course selector until</text><text class="s" x="506" y="225.0" style="font-size:11.5px">the needle centers.</text><circle cx="488" cy="252.0" r="10" class="ah"/><text class="t m" x="488" y="256.0" style="font-size:12px;fill:#fff">3</text><text class="t" x="506" y="256.0" style="font-size:12.5px">Read the radial</text><text class="s" x="506" y="272.0" style="font-size:11.5px">FROM flag: the dial shows the</text><text class="s" x="506" y="287.0" style="font-size:11.5px">radial. TO flag: the radial is</text><text class="s" x="506" y="302.0" style="font-size:11.5px">the reciprocal.</text><circle cx="488" cy="329.0" r="10" class="ah"/><text class="t m" x="488" y="333.0" style="font-size:12px;fill:#fff">4</text><text class="t" x="506" y="333.0" style="font-size:12.5px">Plot it</text><text class="s" x="506" y="349.0" style="font-size:11.5px">Draw the line outward from the</text><text class="s" x="506" y="364.0" style="font-size:11.5px">station, using the compass rose</text><text class="s" x="506" y="379.0" style="font-size:11.5px">on the chart.</text><circle cx="488" cy="406.0" r="10" class="ah"/><text class="t m" x="488" y="410.0" style="font-size:12px;fill:#fff">5</text><text class="t" x="506" y="410.0" style="font-size:12.5px">Repeat for VOR B</text><text class="s" x="506" y="426.0" style="font-size:11.5px">The lines cross at your</text><text class="s" x="506" y="441.0" style="font-size:11.5px">position.</text><rect x="20" y="465.0" width="337" height="24" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30" y="482.0" style="font-size:13px">Reading the radial: FROM</text><circle cx="31" cy="503.0" r="2.2" class="ah"/><text class="s" x="40" y="507.0" style="font-size:12px">Example: selector 045, needle centered, flag FROM</text><circle cx="31" cy="522.5" r="2.2" class="ah"/><text class="s" x="40" y="526.5" style="font-size:12px">You are on the 045 radial, 045 magnetic outward</text><text class="s" x="40" y="542.0" style="font-size:12px">from the station</text><rect x="373" y="465.0" width="337" height="24" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="383" y="482.0" style="font-size:13px">Reading the radial: TO</text><circle cx="384" cy="503.0" r="2.2" class="ah"/><text class="s" x="393" y="507.0" style="font-size:12px">Example: selector 225, needle centered, flag TO</text><circle cx="384" cy="522.5" r="2.2" class="ah"/><text class="s" x="393" y="526.5" style="font-size:12px">The course to the station is 225, so the radial</text><text class="s" x="393" y="542.0" style="font-size:12px">is the reciprocal, 045</text><rect class="cl" x="20" y="571.5" width="690" height="73.0" rx="8"/><circle cx="35" cy="593.5" r="2.2" class="ah"/><text class="s" x="44" y="597.5" style="font-size:12px">Lost in flight: plotting an azimuth from two or more navigational facilities can show position.</text><circle cx="35" cy="613.0" r="2.2" class="ah"/><text class="s" x="44" y="617.0" style="font-size:12px">Radials are generally within 1 degree, so treat the crossing as a good fix, not an exact point.</text></svg>
