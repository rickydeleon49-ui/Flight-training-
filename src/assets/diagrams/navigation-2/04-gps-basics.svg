<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 663" role="img" aria-labelledby="ti de"><title id="ti">GPS basics: satellites, RAIM and the database</title><desc id="de">Left: a receiver needs at least four satellites for an accurate three-dimensional position. Right: receiver autonomous integrity monitoring needs five satellites, or four plus a barometric altimeter, to detect a problem, and six, or five plus baro-aiding, to remove a bad satellite. Cards cover the baseline constellation, receivers with no RAIM capability, and database currency for VFR. A strip covers antenna location, integrating other navigation, and planning waypoints before flight.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:12px}.q1{font-size:11px}.q2{stroke:currentColor;stroke-width:1.5}.q3{font-size:13px}.q4{stroke-width:1.3;opacity:0.6;stroke-dasharray:6 5}</style><text class="t" x="20" y="28" style="font-size:15px">GPS basics: satellites, RAIM and the database</text><text class="s q3" x="20" y="50">The receiver listens to satellites and works out position. What matters to a VFR pilot is how many</text><text class="s q3" x="20" y="66.5">satellites it needs, whether it can check itself, and whether its data are current.</text><rect class="cl" x="20" y="93" width="330" height="252" rx="8"/><text class="t" x="32" y="115" style="font-size:14px">Satellites in view</text><text class="t q0" x="32" y="137">4 satellites: accurate 3-D position</text><text class="s q1" x="32" y="152">(pseudorange measured from each)</text><path d="M60 287Q185 249 310 287" class="dk" style="stroke-width:2.5"/><text class="s m q1" x="185" y="305">Receiver in the aircraft</text><path d="M80 195L185 259" class="dk q4"/><rect x="66" y="176" width="28" height="19" rx="10" class="lav q2"/><text class="t m q1" x="80" y="189.17">S</text><path d="M150 183L185 259" class="dk q4"/><rect x="136" y="164" width="28" height="19" rx="10" class="lav q2"/><text class="t m q1" x="150" y="177.17">S</text><path d="M220 189L185 259" class="dk q4"/><rect x="206" y="170" width="28" height="19" rx="10" class="lav q2"/><text class="t m q1" x="220" y="183.17">S</text><path d="M290 203L185 259" class="dk q4"/><rect x="276" y="184" width="28" height="19" rx="10" class="lav q2"/><text class="t m q1" x="290" y="197.17">S</text><text class="s q1" x="32" y="323">Typical: 6 to 8 in view with a clear sky</text><text class="s q1" x="32" y="337">Receiver uses satellites above the mask angle</text><rect class="cl" x="366" y="93" width="344" height="252" rx="8"/><text class="t" x="378" y="115" style="font-size:14px">RAIM: how many satellites it needs</text><rect x="378" y="129" width="322" height="66" rx="10" class="sky q2"/><text class="t m" x="539" y="148" style="font-size:12.5px">Detect a problem</text><text class="s m q1" x="539" y="165">5 satellites in view, or 4 plus a barometric</text><text class="s m q1" x="539" y="179.5">altimeter (baro-aiding)</text><rect x="378" y="203" width="322" height="66" rx="10" class="mint q2"/><text class="t m" x="539" y="222" style="font-size:12.5px">Find and remove the bad satellite</text><text class="s m q1" x="539" y="239">6 satellites in view, or 5 plus baro-aiding; the</text><text class="s m q1" x="539" y="253.5">current altimeter setting must be entered</text><text class="s q1" x="378" y="327">Without RAIM the pilot has no assurance of GPS accuracy.</text><rect x="20" y="357" width="222" height="24" rx="10" class="lav q2"/><text class="t q3" x="30" y="374">Constellation (baseline)</text><circle cx="31" cy="395" r="2.2" class="ah"/><text class="s q0" x="40" y="399">24 satellites, six orbital</text><text class="s q0" x="40" y="414.5">planes</text><circle cx="31" cy="430" r="2.2" class="ah"/><text class="s q0" x="40" y="434">Four satellites plus a spare</text><text class="s q0" x="40" y="449.5">slot in each plane</text><circle cx="31" cy="465" r="2.2" class="ah"/><text class="s q0" x="40" y="469">Orbit about 26,600 km from</text><text class="s q0" x="40" y="484.5">earth center, period 11 h 58</text><text class="s q0" x="40" y="500">min</text><rect x="254" y="357" width="222" height="24" rx="10" class="rose q2"/><text class="t q3" x="264" y="374">RAIM capability</text><circle cx="265" cy="395" r="2.2" class="ah"/><text class="s q0" x="274" y="399">Many VFR receivers and all</text><text class="s q0" x="274" y="414.5">hand-helds have no RAIM alert</text><circle cx="265" cy="430" r="2.2" class="ah"/><text class="s q0" x="274" y="434">No alert if satellites drop or</text><text class="s q0" x="274" y="449.5">the position error grows</text><circle cx="265" cy="465" r="2.2" class="ah"/><text class="s q0" x="274" y="469">Cross-check against other</text><text class="s q0" x="274" y="484.5">navigation</text><rect x="488" y="357" width="222" height="24" rx="10" class="sky q2"/><text class="t q3" x="498" y="374">Database currency</text><circle cx="499" cy="395" r="2.2" class="ah"/><text class="s q0" x="508" y="399">Not required for VFR, required</text><text class="s q0" x="508" y="414.5">for IFR</text><circle cx="499" cy="430" r="2.2" class="ah"/><text class="s q0" x="508" y="434">An old database can make the</text><text class="s q0" x="508" y="449.5">moving map wrong</text><circle cx="499" cy="465" r="2.2" class="ah"/><text class="s q0" x="508" y="469">Verify named waypoints in the</text><text class="s q0" x="508" y="484.5">Chart Supplement U.S. or a</text><text class="s q0" x="508" y="500">sectional</text><rect class="cl" x="20" y="531.5" width="690" height="123.5" rx="8"/><circle cx="35" cy="553.5" r="2.2" class="ah"/><text class="s q0" x="44" y="557.5">Antenna location: a poor spot, such as a suction cup on a window, can block satellites and cause signal</text><text class="s q0" x="44" y="573">loss, possibly without a RAIM warning.</text><circle cx="35" cy="588.5" r="2.2" class="ah"/><text class="s q0" x="44" y="592.5">Never rely on one system: blend GPS with other electronic navigation, pilotage and dead reckoning.</text><circle cx="35" cy="608" r="2.2" class="ah"/><text class="s q0" x="44" y="612">Enter user waypoints before flight, not on the fly. GPS altitude can have a large error and no</text><text class="s q0" x="44" y="627.5">integrity, so do not use it for altitude.</text></svg>
