<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 694" role="img" aria-labelledby="ti de"><title id="ti">Tracking to a VOR with the CDI</title><desc id="de">Four steps with a course deviation indicator: tune and identify the VOR, center the needle with a TO flag, see the needle move toward the desired radial when the wind pushes the aircraft off course, and watch the needle fluctuate and the flag change from TO to FROM at station passage. A strip shows the PHAK example of correcting the heading from 350 to 360 to 355, plus tips on identification, line of sight and needle fluctuations. Example numbers only.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11px}.q1{font-size:12.5px}.q2{stroke:currentColor;stroke-width:1.5}.q3{font-size:12px}.q4{stroke:currentColor;stroke-width:1.8}.q5{stroke-width:3;opacity:1}.q6{stroke-width:2}</style><text class="t" x="20" y="28" style="font-size:15px">Tracking to a VOR with the CDI: what the needle tells you</text><text class="s" x="20" y="50" style="font-size:13px">The needle shows which side of the selected radial the aircraft is on. The 350, 360 and 355 headings</text><text class="s" x="20" y="66.5" style="font-size:13px">are PHAK example numbers; the CDI faces are schematic.</text><rect x="20" y="93" width="162" height="263" rx="10" class="sky q2"/><text class="t m q1" x="101" y="112">1. Tune and identify</text><circle cx="101" cy="177" r="40" class="cl q4"/><circle cx="77" cy="177" r="2.4" class="dh"/><circle cx="89" cy="177" r="2.4" class="dh"/><circle cx="113" cy="177" r="2.4" class="dh"/><circle cx="125" cy="177" r="2.4" class="dh"/><path d="M81 145L81 209" class="dk q5"/><rect x="79" y="223" width="44" height="20" rx="10" class="sky q2"/><text class="t m q3" x="101" y="237">TO</text><text class="s m q0" x="101" y="259">As soon as the VOR is</text><text class="s m q0" x="101" y="273.5">properly tuned, and the</text><text class="s m q0" x="101" y="288">identifier is checked,</text><text class="s m q0" x="101" y="302.5">the needle deflects left</text><text class="s m q0" x="101" y="317">or right.</text><rect x="196" y="93" width="162" height="263" rx="10" class="mint q2"/><text class="t m q1" x="277" y="112">2. Center with TO</text><circle cx="277" cy="177" r="40" class="cl q4"/><circle cx="253" cy="177" r="2.4" class="dh"/><circle cx="265" cy="177" r="2.4" class="dh"/><circle cx="289" cy="177" r="2.4" class="dh"/><circle cx="301" cy="177" r="2.4" class="dh"/><path d="M277 145L277 209" class="dk q5"/><rect x="255" y="223" width="44" height="20" rx="10" class="mint q2"/><text class="t m q3" x="277" y="237">TO</text><text class="s m q0" x="277" y="259">Turn the course selector</text><text class="s m q0" x="277" y="273.5">until the needle centers</text><text class="s m q0" x="277" y="288">with TO showing. If it</text><text class="s m q0" x="277" y="302.5">centers with FROM, turn</text><text class="s m q0" x="277" y="317">the dial 180 degrees.</text><rect x="372" y="93" width="162" height="263" rx="10" class="rose q2"/><text class="t m q1" x="453" y="112">3. Drift left of the</text><text class="t m q1" x="453" y="127">radial</text><circle cx="453" cy="177" r="40" class="cl q4"/><circle cx="429" cy="177" r="2.4" class="dh"/><circle cx="441" cy="177" r="2.4" class="dh"/><circle cx="465" cy="177" r="2.4" class="dh"/><circle cx="477" cy="177" r="2.4" class="dh"/><path d="M475 145L475 209" class="dk q5"/><rect x="431" y="223" width="44" height="20" rx="10" class="rose q2"/><text class="t m q3" x="453" y="237">TO</text><text class="s m q0" x="453" y="259">Heading 350 with a wind</text><text class="s m q0" x="453" y="273.5">from the right: the</text><text class="s m q0" x="453" y="288">aircraft drifts left, so</text><text class="s m q0" x="453" y="302.5">the needle moves right,</text><text class="s m q0" x="453" y="317">toward the desired</text><text class="s m q0" x="453" y="331.5">radial.</text><rect x="548" y="93" width="162" height="263" rx="10" class="lav q2"/><text class="t m q1" x="629" y="112">4. Station passage</text><circle cx="629" cy="177" r="40" class="cl q4"/><circle cx="605" cy="177" r="2.4" class="dh"/><circle cx="617" cy="177" r="2.4" class="dh"/><circle cx="641" cy="177" r="2.4" class="dh"/><circle cx="653" cy="177" r="2.4" class="dh"/><path d="M629 145L629 209" class="dk q5"/><rect x="607" y="223" width="44" height="20" rx="10" class="lav q2"/><text class="t m q3" x="629" y="237">FROM</text><text class="s m q0" x="629" y="259">Passing the station: the</text><text class="s m q0" x="629" y="273.5">needle fluctuates, then</text><text class="s m q0" x="629" y="288">settles, and TO changes</text><text class="s m q0" x="629" y="302.5">to FROM. Abeam, the</text><text class="s m q0" x="629" y="317">needle deflects toward</text><text class="s m q0" x="629" y="331.5">the station.</text><text class="t" x="20" y="384" style="font-size:14px">Fine-tuning the correction (PHAK example)</text><rect x="20" y="394" width="159" height="139" rx="10" class="rose q2"/><text class="t m q1" x="99.5" y="413">Drift: turn toward</text><text class="t m q1" x="99.5" y="428">the needle</text><text class="s m q0" x="99.5" y="445">Needle right of center:</text><text class="s m q0" x="99.5" y="459.5">alter the heading to the</text><text class="s m q0" x="99.5" y="474">right to return to the</text><text class="s m q0" x="99.5" y="488.5">radial. Needle slowly</text><text class="s m q0" x="99.5" y="503">returns to center.</text><path d="M181 463.5L188 463.5" class="dk q6"/><path d="M195 463.5L188 466.6L188 460.4Z" class="dh" style=""/><rect x="197" y="394" width="159" height="139" rx="10" class="sky q2"/><text class="t m q1" x="276.5" y="413">Centered: add drift</text><text class="t m q1" x="276.5" y="428">correction</text><text class="s m q0" x="276.5" y="445">Turn left toward, but</text><text class="s m q0" x="276.5" y="459.5">not to, 350. Try a 10</text><text class="s m q0" x="276.5" y="474">degree correction for a</text><text class="s m q0" x="276.5" y="488.5">heading of 360 (Example</text><text class="s m q0" x="276.5" y="503">from PHAK).</text><path d="M358 463.5L365 463.5" class="dk q6"/><path d="M372 463.5L365 466.6L365 460.4Z" class="dh" style=""/><rect x="374" y="394" width="159" height="139" rx="10" class="lav q2"/><text class="t m q1" x="453.5" y="413">Needle moves left:</text><text class="t m q1" x="453.5" y="428">too much</text><text class="s m q0" x="453.5" y="445">The 10 degree correction</text><text class="s m q0" x="453.5" y="459.5">is too great and the</text><text class="s m q0" x="453.5" y="474">aircraft is right of</text><text class="s m q0" x="453.5" y="488.5">course. A slight left</text><text class="s m q0" x="453.5" y="503">turn returns it.</text><path d="M535 463.5L542 463.5" class="dk q6"/><path d="M549 463.5L542 466.6L542 460.4Z" class="dh" style=""/><rect x="551" y="394" width="159" height="139" rx="10" class="mint q2"/><text class="t m q1" x="630.5" y="413">Settle at a small</text><text class="t m q1" x="630.5" y="428">correction</text><text class="s m q0" x="630.5" y="445">Fly a 5 degree</text><text class="s m q0" x="630.5" y="459.5">correction, heading 355.</text><text class="s m q0" x="630.5" y="474">If not adequate, make</text><text class="s m q0" x="630.5" y="488.5">small heading changes to</text><text class="s m q0" x="630.5" y="503">keep the needle</text><text class="s m q0" x="630.5" y="517.5">centered.</text><rect class="cl" x="20" y="547" width="690" height="139" rx="8"/><circle cx="35" cy="569" r="2.2" class="ah"/><text class="s q3" x="44" y="573">Identify the station by Morse code or voice. VOR signals are line of sight: weak or no signal if too low</text><text class="s q3" x="44" y="588.5">or too far.</text><circle cx="35" cy="604" r="2.2" class="ah"/><text class="s q3" x="44" y="608">Minor needle fluctuations: do not change heading at once. Wait to see if the needle recenters; if not,</text><text class="s q3" x="44" y="623.5">recenter the course to the needle.</text><circle cx="35" cy="639" r="2.2" class="ah"/><text class="s q3" x="44" y="643">Tracking outbound over the station on the reciprocal: leave the course selector alone, correct the same</text><text class="s q3" x="44" y="658.5">way, and the flag reads FROM.</text></svg>
