<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 694" role="img" aria-labelledby="ti de"><title id="ti">Tracking to a VOR with the CDI</title><desc id="de">Four steps with a course deviation indicator: tune and identify the VOR, center the needle with a TO flag, see the needle move toward the desired radial when the wind pushes the aircraft off course, and watch the needle fluctuate and the flag change from TO to FROM at station passage. A strip shows the PHAK example of correcting the heading from 350 to 360 to 355, plus tips on identification, line of sight and needle fluctuations. Example numbers only.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><text class="t" x="20" y="28" style="font-size:15px">Tracking to a VOR with the CDI: what the needle tells you</text><text class="s" x="20" y="50.0" style="font-size:13px">The needle shows which side of the selected radial the aircraft is on. The 350, 360 and 355 headings</text><text class="s" x="20" y="66.5" style="font-size:13px">are PHAK example numbers; the CDI faces are schematic.</text><rect x="20.0" y="93.0" width="162.0" height="263.0" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="101.0" y="112.0" style="font-size:12.5px">1. Tune and identify</text><circle cx="101.0" cy="177.0" r="40" class="cl" style="stroke:currentColor;stroke-width:1.8"/><circle cx="77.0" cy="177.0" r="2.4" class="dh"/><circle cx="89.0" cy="177.0" r="2.4" class="dh"/><circle cx="113.0" cy="177.0" r="2.4" class="dh"/><circle cx="125.0" cy="177.0" r="2.4" class="dh"/><path d="M81.0 145.0L81.0 209.0" class="dk" style="stroke-width:3;opacity:1"/><rect x="79.0" y="223.0" width="44" height="20" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="101.0" y="237.0" style="font-size:12px">TO</text><text class="s m" x="101.0" y="259.0" style="font-size:11px">As soon as the VOR is</text><text class="s m" x="101.0" y="273.5" style="font-size:11px">properly tuned, and the</text><text class="s m" x="101.0" y="288.0" style="font-size:11px">identifier is checked,</text><text class="s m" x="101.0" y="302.5" style="font-size:11px">the needle deflects left</text><text class="s m" x="101.0" y="317.0" style="font-size:11px">or right.</text><rect x="196.0" y="93.0" width="162.0" height="263.0" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="277.0" y="112.0" style="font-size:12.5px">2. Center with TO</text><circle cx="277.0" cy="177.0" r="40" class="cl" style="stroke:currentColor;stroke-width:1.8"/><circle cx="253.0" cy="177.0" r="2.4" class="dh"/><circle cx="265.0" cy="177.0" r="2.4" class="dh"/><circle cx="289.0" cy="177.0" r="2.4" class="dh"/><circle cx="301.0" cy="177.0" r="2.4" class="dh"/><path d="M277.0 145.0L277.0 209.0" class="dk" style="stroke-width:3;opacity:1"/><rect x="255.0" y="223.0" width="44" height="20" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="277.0" y="237.0" style="font-size:12px">TO</text><text class="s m" x="277.0" y="259.0" style="font-size:11px">Turn the course selector</text><text class="s m" x="277.0" y="273.5" style="font-size:11px">until the needle centers</text><text class="s m" x="277.0" y="288.0" style="font-size:11px">with TO showing. If it</text><text class="s m" x="277.0" y="302.5" style="font-size:11px">centers with FROM, turn</text><text class="s m" x="277.0" y="317.0" style="font-size:11px">the dial 180 degrees.</text><rect x="372.0" y="93.0" width="162.0" height="263.0" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="453.0" y="112.0" style="font-size:12.5px">3. Drift left of the</text><text class="t m" x="453.0" y="127.0" style="font-size:12.5px">radial</text><circle cx="453.0" cy="177.0" r="40" class="cl" style="stroke:currentColor;stroke-width:1.8"/><circle cx="429.0" cy="177.0" r="2.4" class="dh"/><circle cx="441.0" cy="177.0" r="2.4" class="dh"/><circle cx="465.0" cy="177.0" r="2.4" class="dh"/><circle cx="477.0" cy="177.0" r="2.4" class="dh"/><path d="M475.0 145.0L475.0 209.0" class="dk" style="stroke-width:3;opacity:1"/><rect x="431.0" y="223.0" width="44" height="20" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="453.0" y="237.0" style="font-size:12px">TO</text><text class="s m" x="453.0" y="259.0" style="font-size:11px">Heading 350 with a wind</text><text class="s m" x="453.0" y="273.5" style="font-size:11px">from the right: the</text><text class="s m" x="453.0" y="288.0" style="font-size:11px">aircraft drifts left, so</text><text class="s m" x="453.0" y="302.5" style="font-size:11px">the needle moves right,</text><text class="s m" x="453.0" y="317.0" style="font-size:11px">toward the desired</text><text class="s m" x="453.0" y="331.5" style="font-size:11px">radial.</text><rect x="548.0" y="93.0" width="162.0" height="263.0" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="629.0" y="112.0" style="font-size:12.5px">4. Station passage</text><circle cx="629.0" cy="177.0" r="40" class="cl" style="stroke:currentColor;stroke-width:1.8"/><circle cx="605.0" cy="177.0" r="2.4" class="dh"/><circle cx="617.0" cy="177.0" r="2.4" class="dh"/><circle cx="641.0" cy="177.0" r="2.4" class="dh"/><circle cx="653.0" cy="177.0" r="2.4" class="dh"/><path d="M629.0 145.0L629.0 209.0" class="dk" style="stroke-width:3;opacity:1"/><rect x="607.0" y="223.0" width="44" height="20" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="629.0" y="237.0" style="font-size:12px">FROM</text><text class="s m" x="629.0" y="259.0" style="font-size:11px">Passing the station: the</text><text class="s m" x="629.0" y="273.5" style="font-size:11px">needle fluctuates, then</text><text class="s m" x="629.0" y="288.0" style="font-size:11px">settles, and TO changes</text><text class="s m" x="629.0" y="302.5" style="font-size:11px">to FROM. Abeam, the</text><text class="s m" x="629.0" y="317.0" style="font-size:11px">needle deflects toward</text><text class="s m" x="629.0" y="331.5" style="font-size:11px">the station.</text><text class="t" x="20" y="384.0" style="font-size:14px">Fine-tuning the correction (PHAK example)</text><rect x="20.0" y="394.0" width="159.0" height="139.0" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="99.5" y="413.0" style="font-size:12.5px">Drift: turn toward</text><text class="t m" x="99.5" y="428.0" style="font-size:12.5px">the needle</text><text class="s m" x="99.5" y="445.0" style="font-size:11px">Needle right of center:</text><text class="s m" x="99.5" y="459.5" style="font-size:11px">alter the heading to the</text><text class="s m" x="99.5" y="474.0" style="font-size:11px">right to return to the</text><text class="s m" x="99.5" y="488.5" style="font-size:11px">radial. Needle slowly</text><text class="s m" x="99.5" y="503.0" style="font-size:11px">returns to center.</text><path d="M181.0 463.5L188.0 463.5" class="dk" style="stroke-width:2"/><path d="M195.0 463.5L188.0 466.6L188.0 460.4Z" class="dh" style=""/><rect x="197.0" y="394.0" width="159.0" height="139.0" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="276.5" y="413.0" style="font-size:12.5px">Centered: add drift</text><text class="t m" x="276.5" y="428.0" style="font-size:12.5px">correction</text><text class="s m" x="276.5" y="445.0" style="font-size:11px">Turn left toward, but</text><text class="s m" x="276.5" y="459.5" style="font-size:11px">not to, 350. Try a 10</text><text class="s m" x="276.5" y="474.0" style="font-size:11px">degree correction for a</text><text class="s m" x="276.5" y="488.5" style="font-size:11px">heading of 360 (Example</text><text class="s m" x="276.5" y="503.0" style="font-size:11px">from PHAK).</text><path d="M358.0 463.5L365.0 463.5" class="dk" style="stroke-width:2"/><path d="M372.0 463.5L365.0 466.6L365.0 460.4Z" class="dh" style=""/><rect x="374.0" y="394.0" width="159.0" height="139.0" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="453.5" y="413.0" style="font-size:12.5px">Needle moves left:</text><text class="t m" x="453.5" y="428.0" style="font-size:12.5px">too much</text><text class="s m" x="453.5" y="445.0" style="font-size:11px">The 10 degree correction</text><text class="s m" x="453.5" y="459.5" style="font-size:11px">is too great and the</text><text class="s m" x="453.5" y="474.0" style="font-size:11px">aircraft is right of</text><text class="s m" x="453.5" y="488.5" style="font-size:11px">course. A slight left</text><text class="s m" x="453.5" y="503.0" style="font-size:11px">turn returns it.</text><path d="M535.0 463.5L542.0 463.5" class="dk" style="stroke-width:2"/><path d="M549.0 463.5L542.0 466.6L542.0 460.4Z" class="dh" style=""/><rect x="551.0" y="394.0" width="159.0" height="139.0" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="630.5" y="413.0" style="font-size:12.5px">Settle at a small</text><text class="t m" x="630.5" y="428.0" style="font-size:12.5px">correction</text><text class="s m" x="630.5" y="445.0" style="font-size:11px">Fly a 5 degree</text><text class="s m" x="630.5" y="459.5" style="font-size:11px">correction, heading 355.</text><text class="s m" x="630.5" y="474.0" style="font-size:11px">If not adequate, make</text><text class="s m" x="630.5" y="488.5" style="font-size:11px">small heading changes to</text><text class="s m" x="630.5" y="503.0" style="font-size:11px">keep the needle</text><text class="s m" x="630.5" y="517.5" style="font-size:11px">centered.</text><rect class="cl" x="20" y="547.0" width="690" height="139.0" rx="8"/><circle cx="35" cy="569.0" r="2.2" class="ah"/><text class="s" x="44" y="573.0" style="font-size:12px">Identify the station by Morse code or voice. VOR signals are line of sight: weak or no signal if too low</text><text class="s" x="44" y="588.5" style="font-size:12px">or too far.</text><circle cx="35" cy="604.0" r="2.2" class="ah"/><text class="s" x="44" y="608.0" style="font-size:12px">Minor needle fluctuations: do not change heading at once. Wait to see if the needle recenters; if not,</text><text class="s" x="44" y="623.5" style="font-size:12px">recenter the course to the needle.</text><circle cx="35" cy="639.0" r="2.2" class="ah"/><text class="s" x="44" y="643.0" style="font-size:12px">Tracking outbound over the station on the reciprocal: leave the course selector alone, correct the same</text><text class="s" x="44" y="658.5" style="font-size:12px">way, and the flag reads FROM.</text></svg>
