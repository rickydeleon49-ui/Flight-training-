<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 667" role="img" aria-labelledby="ti de"><title id="ti">Cabin heating: four kinds</title><desc id="de">Four lanes, one for each heating system, each with three steps from heat source to cabin: exhaust heating, fuel fired heater, combustion heater and bleed air heating. Each lane has a safety note: carbon monoxide risk from a defective exhaust system, leaking vents on fuel fired heaters, the overheat switch on combustion heaters and the safety sensors on bleed air systems.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><style>.PN{fill:#1c2230;stroke:#8b93a7;stroke-width:1.2}.q0{font-size:11.5px}.q1{stroke:currentColor;stroke-width:1.2}.q2{stroke-width:2.5}.q3{fill:var(--palette-berry,#A84C6B)}.q4{font-size:13px}.q5{stroke:currentColor;stroke-width:1.5}</style><text class="t" x="20" y="28" style="font-size:15px">Cabin heating: four kinds</text><text class="s q4" x="20" y="50">Cabin heat comes from different sources depending on the aircraft. Most light aircraft use exhaust</text><text class="s q4" x="20" y="66.5">heat, so a defective one is a carbon monoxide risk.</text><rect class="cl" x="20" y="89" width="690" height="126" rx="8"/><rect x="20" y="89" width="690" height="26" rx="10" class="sky q5"/><text class="t q4" x="30" y="107">Exhaust heating</text><text class="s e q0" x="700" y="107">Most light aircraft</text><rect x="30" y="125" width="206" height="44" rx="6" class="cl q1"/><text class="s m q0" x="133" y="147">Hot exhaust gases</text><path d="M239 147L251 147" class="acc q2"/><path d="M259 147L251 150.6L251 143.4Z" class="dh q3"/><rect x="262" y="125" width="206" height="44" rx="6" class="cl q1"/><text class="s m q0" x="365" y="140">Also a heat source for the cabin</text><text class="s m q0" x="365" y="154">and carburetor</text><path d="M471 147L483 147" class="acc q2"/><path d="M491 147L483 150.6L483 143.4Z" class="dh q3"/><rect x="494" y="125" width="206" height="44" rx="6" class="cl q1"/><text class="s m q0" x="597" y="147">Cabin heat</text><text class="s q0" x="30" y="187">Defective: carbon monoxide poisoning, lower engine performance, more fire risk.</text><rect class="cl" x="20" y="225" width="690" height="126" rx="8"/><rect x="20" y="225" width="690" height="26" rx="10" class="lav q5"/><text class="t q4" x="30" y="243">Fuel fired heater</text><text class="s e q0" x="700" y="243">Small, mounted or portable</text><rect x="30" y="261" width="206" height="44" rx="6" class="cl q1"/><text class="s m q0" x="133" y="276">Fan blows air into a combustion</text><text class="s m q0" x="133" y="290">chamber; spark lights the fuel</text><path d="M239 283L251 283" class="acc q2"/><path d="M259 283L251 286.6L251 279.4Z" class="dh q3"/><rect x="262" y="261" width="206" height="44" rx="6" class="cl q1"/><text class="s m q0" x="365" y="276">Second fan blows air warmed</text><text class="s m q0" x="365" y="290">around the tube</text><path d="M471 283L483 283" class="acc q2"/><path d="M491 283L483 286.6L483 279.4Z" class="dh q3"/><rect x="494" y="261" width="206" height="44" rx="6" class="cl q1"/><text class="s m q0" x="597" y="283">Warm air to the interior</text><text class="s q0" x="30" y="323">5,000 to 50,000 BTU per hour. Needs 12 or 24 volts. Vents must not leak into the cabin. By-products include</text><text class="s q0" x="30" y="338">carbon monoxide.</text><rect class="cl" x="20" y="361" width="690" height="126" rx="8"/><rect x="20" y="361" width="690" height="26" rx="10" class="mint q5"/><text class="t q4" x="30" y="379">Combustion heater</text><text class="s e q0" x="700" y="379">Larger aircraft</text><rect x="30" y="397" width="206" height="44" rx="6" class="cl q1"/><text class="s m q0" x="133" y="412">Burns fuel in an airtight</text><text class="s m q0" x="133" y="426">chamber</text><path d="M239 419L251 419" class="acc q2"/><path d="M259 419L251 422.6L251 415.4Z" class="dh q3"/><rect x="262" y="397" width="206" height="44" rx="6" class="cl q1"/><text class="s m q0" x="365" y="412">Ventilation air passes over the</text><text class="s m q0" x="365" y="426">chamber</text><path d="M471 419L483 419" class="acc q2"/><path d="M491 419L483 422.6L483 415.4Z" class="dh q3"/><rect x="494" y="397" width="206" height="44" rx="6" class="cl q1"/><text class="s m q0" x="597" y="419">Warm air to the cabin</text><text class="s q0" x="30" y="459">Overheat switch shuts off the fuel. Carbon monoxide is unlikely: air pressure outside the chamber is higher than</text><text class="s q0" x="30" y="474">inside, so a leak goes into the chamber and out the exhaust.</text><rect class="cl" x="20" y="497" width="690" height="126" rx="8"/><rect x="20" y="497" width="690" height="26" rx="10" class="rose q5"/><text class="t q4" x="30" y="515">Bleed air heating</text><text class="s e q0" x="700" y="515">Turbine aircraft</text><rect x="30" y="533" width="206" height="44" rx="6" class="cl q1"/><text class="s m q0" x="133" y="548">Extremely hot compressor bleed</text><text class="s m q0" x="133" y="562">air</text><path d="M239 555L251 555" class="acc q2"/><path d="M259 555L251 558.6L251 551.4Z" class="dh q3"/><rect x="262" y="533" width="206" height="44" rx="6" class="cl q1"/><text class="s m q0" x="365" y="548">Mixed with ambient or</text><text class="s m q0" x="365" y="562">recirculated air to cool it</text><path d="M471 555L483 555" class="acc q2"/><path d="M491 555L483 558.6L483 551.4Z" class="dh q3"/><rect x="494" y="533" width="206" height="44" rx="6" class="cl q1"/><text class="s m q0" x="597" y="555">Air to the cabin</text><text class="s q0" x="30" y="595">Safety features: temperature sensors, check valves for engine start and full power, and engine sensors.</text><text class="s" x="20" y="645" style="font-size:12.5px">Always read the heating section of the aircraft manual. Each system has its own inspection criteria.</text></svg>
