<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 649" role="img" aria-labelledby="ti de"><title id="ti">Oxygen equipment: masks, regulators and sensors</title><desc id="de">A bar shows the regulator mix from all cabin air at 8,000 feet or lower to all oxygen at about 34,000 feet. Six cards describe cannulas, masks, diluter-demand, pressure-demand, continuous-flow and pulse-demand systems. A strip describes the pulse oximeter.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><style>.PN{fill:#1c2230;stroke:#8b93a7;stroke-width:1.2}</style>
<text class="t" x="20" y="28" style="font-size:15px">Oxygen equipment: masks, regulators and sensors</text>
<text class="s" x="20" y="50.0" style="font-size:13px">Pick the way oxygen is delivered by who uses it and how high you fly. The regulator decides how much</text>
<text class="s" x="20" y="66.5" style="font-size:13px">oxygen is mixed with cabin air.</text>
<rect class="cl" x="20" y="89.0" width="690" height="116" rx="8"/>
<text class="t" x="30" y="109.0" style="font-size:13px">What the regulator mixes in as you climb</text>
<defs><linearGradient id="gr" x1="0" x2="1"><stop offset="0" style="stop-color:var(--palette-sky,#8EBFDA)"/><stop offset="1" style="stop-color:var(--palette-berry,#A84C6B)"/></linearGradient></defs>
<rect x="60" y="129.0" width="610" height="26" rx="6" fill="url(#gr)" stroke="currentColor" stroke-width="1.4"/>
<text class="t" x="60" y="173.0" style="font-size:11.5px">8,000 ft or lower</text>
<text class="s" x="60" y="187.0" style="font-size:11px">0% cylinder oxygen, 100% cabin air</text>
<text class="t e" x="670" y="173.0" style="font-size:11.5px">About 34,000 ft</text>
<text class="s e" x="670" y="187.0" style="font-size:11px">100% oxygen, 0% cabin air</text>
<text class="s m" x="365.0" y="173.0" style="font-size:11px">Regulators for up to 45,000 ft start at 40% oxygen</text>
<text class="s m" x="365.0" y="187.0" style="font-size:11px">and 60% cabin air, and also end at 100%</text>
<rect class="cl" x="20.0" y="217.0" width="222.0" height="167.0" rx="8"/>
<rect x="20.0" y="217.0" width="222.0" height="26" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="30.0" y="235.0" style="font-size:13px">Cannula</text>
<circle cx="33.0" cy="253.0" r="2.2" class="ah"/>
<text class="s" x="42.0" y="257.0" style="font-size:11.5px">Plastic tube under the nose.</text>
<text class="s" x="42.0" y="272.0" style="font-size:11.5px">Comfortable, but may not give</text>
<text class="s" x="42.0" y="287.0" style="font-size:11.5px">enough flow at high altitude.</text>
<circle cx="33.0" cy="301.0" r="2.2" class="ah"/>
<text class="s" x="42.0" y="305.0" style="font-size:11.5px">Systems certified above 18,000</text>
<text class="s" x="42.0" y="320.0" style="font-size:11.5px">ft need masks.</text>
<circle cx="33.0" cy="334.0" r="2.2" class="ah"/>
<text class="s" x="42.0" y="338.0" style="font-size:11.5px">If there is a green flow</text>
<text class="s" x="42.0" y="353.0" style="font-size:11.5px">detector, scan it.</text>
<rect class="cl" x="254.0" y="217.0" width="222.0" height="167.0" rx="8"/>
<rect x="254.0" y="217.0" width="222.0" height="26" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="264.0" y="235.0" style="font-size:13px">Masks</text>
<circle cx="267.0" cy="253.0" r="2.2" class="ah"/>
<text class="s" x="276.0" y="257.0" style="font-size:11.5px">Crew masks fit the face</text>
<text class="s" x="276.0" y="272.0" style="font-size:11.5px">closely, usually with a</text>
<text class="s" x="276.0" y="287.0" style="font-size:11.5px">microphone. Most cover only</text>
<text class="s" x="276.0" y="302.0" style="font-size:11.5px">mouth and nose.</text>
<circle cx="267.0" cy="316.0" r="2.2" class="ah"/>
<text class="s" x="276.0" y="320.0" style="font-size:11.5px">Passenger masks are simple,</text>
<text class="s" x="276.0" y="335.0" style="font-size:11.5px">cup-shaped moldings.</text>
<circle cx="267.0" cy="349.0" r="2.2" class="ah"/>
<text class="s" x="276.0" y="353.0" style="font-size:11.5px">The mask must match the system.</text>
<text class="s" x="276.0" y="368.0" style="font-size:11.5px">Keep it clean.</text>
<rect class="cl" x="488.0" y="217.0" width="222.0" height="167.0" rx="8"/>
<rect x="488.0" y="217.0" width="222.0" height="26" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="498.0" y="235.0" style="font-size:13px">Diluter-demand</text>
<circle cx="501.0" cy="253.0" r="2.2" class="ah"/>
<text class="s" x="510.0" y="257.0" style="font-size:11.5px">Gives oxygen only when you</text>
<text class="s" x="510.0" y="272.0" style="font-size:11.5px">breathe in.</text>
<circle cx="501.0" cy="286.0" r="2.2" class="ah"/>
<text class="s" x="510.0" y="290.0" style="font-size:11.5px">An automix lever mixes cabin</text>
<text class="s" x="510.0" y="305.0" style="font-size:11.5px">air and oxygen, or gives 100%</text>
<text class="s" x="510.0" y="320.0" style="font-size:11.5px">by altitude.</text>
<circle cx="501.0" cy="334.0" r="2.2" class="ah"/>
<text class="s" x="510.0" y="338.0" style="font-size:11.5px">Tight seal needed, so trim any</text>
<text class="s" x="510.0" y="353.0" style="font-size:11.5px">beard. Safe to 40,000 ft.</text>
<rect class="cl" x="20.0" y="396.0" width="222.0" height="167.0" rx="8"/>
<rect x="20.0" y="396.0" width="222.0" height="26" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="30.0" y="414.0" style="font-size:13px">Pressure-demand</text>
<circle cx="33.0" cy="432.0" r="2.2" class="ah"/>
<text class="s" x="42.0" y="436.0" style="font-size:11.5px">Like diluter-demand, but oxygen</text>
<text class="s" x="42.0" y="451.0" style="font-size:11.5px">is supplied under pressure</text>
<text class="s" x="42.0" y="466.0" style="font-size:11.5px">above 34,000 ft.</text>
<circle cx="33.0" cy="480.0" r="2.2" class="ah"/>
<text class="s" x="42.0" y="484.0" style="font-size:11.5px">Positive pressure fills the</text>
<text class="s" x="42.0" y="499.0" style="font-size:11.5px">lungs, so it is safe above</text>
<text class="s" x="42.0" y="514.0" style="font-size:11.5px">40,000 ft.</text>
<rect class="cl" x="254.0" y="396.0" width="222.0" height="167.0" rx="8"/>
<rect x="254.0" y="396.0" width="222.0" height="26" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="264.0" y="414.0" style="font-size:13px">Continuous-flow</text>
<circle cx="267.0" cy="432.0" r="2.2" class="ah"/>
<text class="s" x="276.0" y="436.0" style="font-size:11.5px">Usually for passengers.</text>
<circle cx="267.0" cy="450.0" r="2.2" class="ah"/>
<text class="s" x="276.0" y="454.0" style="font-size:11.5px">A bag collects oxygen while the</text>
<text class="s" x="276.0" y="469.0" style="font-size:11.5px">user breathes out, so more is</text>
<text class="s" x="276.0" y="484.0" style="font-size:11.5px">ready for the next breath.</text>
<circle cx="267.0" cy="498.0" r="2.2" class="ah"/>
<text class="s" x="276.0" y="502.0" style="font-size:11.5px">Cabin air is added once the bag</text>
<text class="s" x="276.0" y="517.0" style="font-size:11.5px">is empty.</text>
<rect class="cl" x="488.0" y="396.0" width="222.0" height="167.0" rx="8"/>
<rect x="488.0" y="396.0" width="222.0" height="26" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="498.0" y="414.0" style="font-size:13px">Pulse-demand</text>
<circle cx="501.0" cy="432.0" r="2.2" class="ah"/>
<text class="s" x="510.0" y="436.0" style="font-size:11.5px">Portable. Detects the start of</text>
<text class="s" x="510.0" y="451.0" style="font-size:11.5px">a breath and supplies oxygen</text>
<text class="s" x="510.0" y="466.0" style="font-size:11.5px">then only.</text>
<circle cx="501.0" cy="480.0" r="2.2" class="ah"/>
<text class="s" x="510.0" y="484.0" style="font-size:11.5px">Can cut the oxygen needed by 50</text>
<text class="s" x="510.0" y="499.0" style="font-size:11.5px">to 85 percent compared with</text>
<text class="s" x="510.0" y="514.0" style="font-size:11.5px">continuous flow.</text>
<circle cx="501.0" cy="528.0" r="2.2" class="ah"/>
<text class="s" x="510.0" y="532.0" style="font-size:11.5px">Adds more per pulse as altitude</text>
<text class="s" x="510.0" y="547.0" style="font-size:11.5px">rises.</text>
<rect class="cl" x="20" y="575.0" width="690" height="66" rx="8"/>
<text class="s" x="30" y="593.0" style="font-size:12.5px">Pulse oximeter: a fingertip device that reads blood oxygen to within one percent, and heart rate.</text>
<text class="s" x="30" y="609.0" style="font-size:12.5px">Useful above 12,500 ft in an unpressurized aircraft, to judge your real need for oxygen.</text>
</svg>
