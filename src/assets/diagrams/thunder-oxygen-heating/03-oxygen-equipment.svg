<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 649" role="img" aria-labelledby="ti de"><title id="ti">Oxygen equipment: masks, regulators and sensors</title><desc id="de">A bar shows the regulator mix from all cabin air at 8,000 feet or lower to all oxygen at about 34,000 feet. Six cards describe cannulas, masks, diluter-demand, pressure-demand, continuous-flow and pulse-demand systems. A strip describes the pulse oximeter.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><style>.PN{fill:#1c2230;stroke:#8b93a7;stroke-width:1.2}.q0{font-size:11.5px}.q1{font-size:13px}.q2{stroke:currentColor;stroke-width:1.5}.q3{font-size:11px}</style><text class="t" x="20" y="28" style="font-size:15px">Oxygen equipment: masks, regulators and sensors</text><text class="s q1" x="20" y="50">Pick the way oxygen is delivered by who uses it and how high you fly. The regulator decides how much</text><text class="s q1" x="20" y="66.5">oxygen is mixed with cabin air.</text><rect class="cl" x="20" y="89" width="690" height="116" rx="8"/><text class="t q1" x="30" y="109">What the regulator mixes in as you climb</text><defs><linearGradient id="gr" x1="0" x2="1"><stop offset="0" style="stop-color:var(--palette-sky,#8EBFDA)"/><stop offset="1" style="stop-color:var(--palette-berry,#A84C6B)"/></linearGradient></defs><rect x="60" y="129" width="610" height="26" rx="6" fill="url(#gr)" stroke="currentColor" stroke-width="1.4"/><text class="t q0" x="60" y="173">8,000 ft or lower</text><text class="s q3" x="60" y="187">0% cylinder oxygen, 100% cabin air</text><text class="t e q0" x="670" y="173">About 34,000 ft</text><text class="s e q3" x="670" y="187">100% oxygen, 0% cabin air</text><text class="s m q3" x="365" y="173">Regulators for up to 45,000 ft start at 40% oxygen</text><text class="s m q3" x="365" y="187">and 60% cabin air, and also end at 100%</text><rect class="cl" x="20" y="217" width="222" height="167" rx="8"/><rect x="20" y="217" width="222" height="26" rx="10" class="sky q2"/><text class="t q1" x="30" y="235">Cannula</text><circle cx="33" cy="253" r="2.2" class="ah"/><text class="s q0" x="42" y="257">Plastic tube under the nose.</text><text class="s q0" x="42" y="272">Comfortable, but may not give</text><text class="s q0" x="42" y="287">enough flow at high altitude.</text><circle cx="33" cy="301" r="2.2" class="ah"/><text class="s q0" x="42" y="305">Systems certified above 18,000</text><text class="s q0" x="42" y="320">ft need masks.</text><circle cx="33" cy="334" r="2.2" class="ah"/><text class="s q0" x="42" y="338">If there is a green flow</text><text class="s q0" x="42" y="353">detector, scan it.</text><rect class="cl" x="254" y="217" width="222" height="167" rx="8"/><rect x="254" y="217" width="222" height="26" rx="10" class="lav q2"/><text class="t q1" x="264" y="235">Masks</text><circle cx="267" cy="253" r="2.2" class="ah"/><text class="s q0" x="276" y="257">Crew masks fit the face</text><text class="s q0" x="276" y="272">closely, usually with a</text><text class="s q0" x="276" y="287">microphone. Most cover only</text><text class="s q0" x="276" y="302">mouth and nose.</text><circle cx="267" cy="316" r="2.2" class="ah"/><text class="s q0" x="276" y="320">Passenger masks are simple,</text><text class="s q0" x="276" y="335">cup-shaped moldings.</text><circle cx="267" cy="349" r="2.2" class="ah"/><text class="s q0" x="276" y="353">The mask must match the system.</text><text class="s q0" x="276" y="368">Keep it clean.</text><rect class="cl" x="488" y="217" width="222" height="167" rx="8"/><rect x="488" y="217" width="222" height="26" rx="10" class="mint q2"/><text class="t q1" x="498" y="235">Diluter-demand</text><circle cx="501" cy="253" r="2.2" class="ah"/><text class="s q0" x="510" y="257">Gives oxygen only when you</text><text class="s q0" x="510" y="272">breathe in.</text><circle cx="501" cy="286" r="2.2" class="ah"/><text class="s q0" x="510" y="290">An automix lever mixes cabin</text><text class="s q0" x="510" y="305">air and oxygen, or gives 100%</text><text class="s q0" x="510" y="320">by altitude.</text><circle cx="501" cy="334" r="2.2" class="ah"/><text class="s q0" x="510" y="338">Tight seal needed, so trim any</text><text class="s q0" x="510" y="353">beard. Safe to 40,000 ft.</text><rect class="cl" x="20" y="396" width="222" height="167" rx="8"/><rect x="20" y="396" width="222" height="26" rx="10" class="rose q2"/><text class="t q1" x="30" y="414">Pressure-demand</text><circle cx="33" cy="432" r="2.2" class="ah"/><text class="s q0" x="42" y="436">Like diluter-demand, but oxygen</text><text class="s q0" x="42" y="451">is supplied under pressure</text><text class="s q0" x="42" y="466">above 34,000 ft.</text><circle cx="33" cy="480" r="2.2" class="ah"/><text class="s q0" x="42" y="484">Positive pressure fills the</text><text class="s q0" x="42" y="499">lungs, so it is safe above</text><text class="s q0" x="42" y="514">40,000 ft.</text><rect class="cl" x="254" y="396" width="222" height="167" rx="8"/><rect x="254" y="396" width="222" height="26" rx="10" class="sky q2"/><text class="t q1" x="264" y="414">Continuous-flow</text><circle cx="267" cy="432" r="2.2" class="ah"/><text class="s q0" x="276" y="436">Usually for passengers.</text><circle cx="267" cy="450" r="2.2" class="ah"/><text class="s q0" x="276" y="454">A bag collects oxygen while the</text><text class="s q0" x="276" y="469">user breathes out, so more is</text><text class="s q0" x="276" y="484">ready for the next breath.</text><circle cx="267" cy="498" r="2.2" class="ah"/><text class="s q0" x="276" y="502">Cabin air is added once the bag</text><text class="s q0" x="276" y="517">is empty.</text><rect class="cl" x="488" y="396" width="222" height="167" rx="8"/><rect x="488" y="396" width="222" height="26" rx="10" class="lav q2"/><text class="t q1" x="498" y="414">Pulse-demand</text><circle cx="501" cy="432" r="2.2" class="ah"/><text class="s q0" x="510" y="436">Portable. Detects the start of</text><text class="s q0" x="510" y="451">a breath and supplies oxygen</text><text class="s q0" x="510" y="466">then only.</text><circle cx="501" cy="480" r="2.2" class="ah"/><text class="s q0" x="510" y="484">Can cut the oxygen needed by 50</text><text class="s q0" x="510" y="499">to 85 percent compared with</text><text class="s q0" x="510" y="514">continuous flow.</text><circle cx="501" cy="528" r="2.2" class="ah"/><text class="s q0" x="510" y="532">Adds more per pulse as altitude</text><text class="s q0" x="510" y="547">rises.</text><rect class="cl" x="20" y="575" width="690" height="66" rx="8"/><text class="s" x="30" y="593" style="font-size:12.5px">Pulse oximeter: a fingertip device that reads blood oxygen to within one percent, and heart rate.</text><text class="s" x="30" y="609" style="font-size:12.5px">Useful above 12,500 ft in an unpressurized aircraft, to judge your real need for oxygen.</text></svg>
