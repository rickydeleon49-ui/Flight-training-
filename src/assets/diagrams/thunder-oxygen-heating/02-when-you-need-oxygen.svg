<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 610" role="img" aria-labelledby="ti de"><title id="ti">When you need supplemental oxygen</title><desc id="de">A vertical scale of cabin pressure altitude with marks at 5,000, 10,000, 12,500, 14,000 and 15,000 feet. At night oxygen is advised above 5,000 feet and by day above 10,000. For flight crew it is required after 30 minutes between 12,500 and 14,000 feet and immediately above 14,000. Every person on board needs it above 15,000 feet. Three cards cover cold lowering the cylinder gauge, fire danger and the preflight check.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><style>.PN{fill:#1c2230;stroke:#8b93a7;stroke-width:1.2}</style>
<text class="t" x="20" y="28" style="font-size:15px">When you need supplemental oxygen</text>
<text class="s" x="20" y="50.0" style="font-size:13px">Cabin pressure altitude sets the rule. Some of these heights are required by regulation and some are</text>
<text class="s" x="20" y="66.5" style="font-size:13px">advice, because people feel the lack of oxygen at different heights.</text>
<rect class="cl" x="20" y="89.0" width="690" height="330" rx="8"/>
<rect x="60" y="372.8" width="36" height="22.2" class="cl" stroke="currentColor" stroke-width="1.2"/>
<rect x="60" y="262.0" width="36" height="110.8" class="lav" stroke="currentColor" stroke-width="1.2"/>
<rect x="60" y="206.6" width="36" height="55.4" class="sky" stroke="currentColor" stroke-width="1.2"/>
<rect x="60" y="173.3" width="36" height="33.2" class="rose" stroke="currentColor" stroke-width="1.2"/>
<rect x="60" y="151.2" width="36" height="22.2" class="rose" style="fill-opacity:.95" stroke="currentColor" stroke-width="1.2"/>
<rect x="60" y="129.0" width="36" height="22.2" class="ah" style="fill-opacity:.8" stroke="currentColor" stroke-width="1.2"/>
<text class="t" x="30" y="111.0" style="font-size:13px">Cabin pressure altitude, in feet</text>
<path d="M96 372.8L120 372.8" class="o" style="stroke-width:1.6"/>
<text class="t e" x="54" y="376.8333333333333" style="font-size:11.5px">5,000</text>
<text class="t" x="128" y="376.8333333333333" style="font-size:12px">At night: </text>
<text class="s" x="198.0" y="376.8333333333333" style="font-size:11.5px">Advice: use oxygen above 5,000 feet. Tired people may feel the effects as low as this.</text>
<path d="M96 262.0L120 262.0" class="o" style="stroke-width:1.6"/>
<text class="t e" x="54" y="266.0" style="font-size:11.5px">10,000</text>
<text class="t" x="128" y="266.0" style="font-size:12px">By day: </text>
<text class="s" x="184.8" y="266.0" style="font-size:11.5px">Advice: use oxygen above 10,000 feet. Some people become disoriented.</text>
<path d="M96 206.6L120 206.6" class="o" style="stroke-width:1.6"/>
<text class="t e" x="54" y="210.58333333333331" style="font-size:11.5px">12,500</text>
<text class="t" x="128" y="210.58333333333331" style="font-size:12px">Required: </text>
<text class="s" x="198.0" y="210.58333333333331" style="font-size:11.5px">Flight crew: oxygen after 30 minutes between 12,500 and 14,000.</text>
<path d="M96 173.3L120 173.3" class="o" style="stroke-width:1.6"/>
<text class="t e" x="54" y="177.33333333333331" style="font-size:11.5px">14,000</text>
<text class="t" x="128" y="177.33333333333331" style="font-size:12px">Required: </text>
<text class="s" x="198.0" y="177.33333333333331" style="font-size:11.5px">Flight crew: oxygen immediately above 14,000.</text>
<path d="M96 151.2L120 151.2" class="o" style="stroke-width:1.6"/>
<text class="t e" x="54" y="155.16666666666666" style="font-size:11.5px">15,000</text>
<text class="t" x="128" y="155.16666666666666" style="font-size:12px">Required: </text>
<text class="s" x="198.0" y="155.16666666666666" style="font-size:11.5px">Every person on board: oxygen above 15,000.</text>
<rect class="cl" x="20.0" y="431.0" width="222.0" height="167.0" rx="8"/>
<rect x="20.0" y="431.0" width="222.0" height="26" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="30.0" y="449.0" style="font-size:13px">Cold lowers the gauge</text>
<circle cx="33.0" cy="467.0" r="2.2" class="ah"/>
<text class="s" x="42.0" y="471.0" style="font-size:11.5px">Cylinders hold 1,800 to 2,200</text>
<text class="s" x="42.0" y="486.0" style="font-size:11.5px">psi.</text>
<circle cx="33.0" cy="500.0" r="2.2" class="ah"/>
<text class="s" x="42.0" y="504.0" style="font-size:11.5px">Pressure falls as the</text>
<text class="s" x="42.0" y="519.0" style="font-size:11.5px">temperature around the cylinder</text>
<text class="s" x="42.0" y="534.0" style="font-size:11.5px">falls.</text>
<circle cx="33.0" cy="548.0" r="2.2" class="ah"/>
<text class="s" x="42.0" y="552.0" style="font-size:11.5px">A low reading may mean a cold</text>
<text class="s" x="42.0" y="567.0" style="font-size:11.5px">storage place, not an empty</text>
<text class="s" x="42.0" y="582.0" style="font-size:11.5px">supply.</text>
<rect class="cl" x="254.0" y="431.0" width="222.0" height="167.0" rx="8"/>
<rect x="254.0" y="431.0" width="222.0" height="26" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="264.0" y="449.0" style="font-size:13px">Fire danger</text>
<circle cx="267.0" cy="467.0" r="2.2" class="ah"/>
<text class="s" x="276.0" y="471.0" style="font-size:11.5px">Materials that are nearly</text>
<text class="s" x="276.0" y="486.0" style="font-size:11.5px">fireproof in air can burn in</text>
<text class="s" x="276.0" y="501.0" style="font-size:11.5px">oxygen.</text>
<circle cx="267.0" cy="515.0" r="2.2" class="ah"/>
<text class="s" x="276.0" y="519.0" style="font-size:11.5px">Oils and greases may ignite. No</text>
<text class="s" x="276.0" y="534.0" style="font-size:11.5px">smoking while oxygen is in use.</text>
<circle cx="267.0" cy="548.0" r="2.2" class="ah"/>
<text class="s" x="276.0" y="552.0" style="font-size:11.5px">Inspect with clean hands.</text>
<rect class="cl" x="488.0" y="431.0" width="222.0" height="167.0" rx="8"/>
<rect x="488.0" y="431.0" width="222.0" height="26" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="498.0" y="449.0" style="font-size:13px">Before each flight</text>
<circle cx="501.0" cy="467.0" r="2.2" class="ah"/>
<text class="s" x="510.0" y="471.0" style="font-size:11.5px">Look at the mask and tubing for</text>
<text class="s" x="510.0" y="486.0" style="font-size:11.5px">tears and cracks, the</text>
<text class="s" x="510.0" y="501.0" style="font-size:11.5px">regulator, the quantity and the</text>
<text class="s" x="510.0" y="516.0" style="font-size:11.5px">gauges.</text>
<circle cx="501.0" cy="530.0" r="2.2" class="ah"/>
<text class="s" x="510.0" y="534.0" style="font-size:11.5px">Put on the mask and test the</text>
<text class="s" x="510.0" y="549.0" style="font-size:11.5px">system.</text>
<circle cx="501.0" cy="563.0" r="2.2" class="ah"/>
<text class="s" x="510.0" y="567.0" style="font-size:11.5px">Afterward, check that all</text>
<text class="s" x="510.0" y="582.0" style="font-size:11.5px">valves are shut off.</text>
</svg>
