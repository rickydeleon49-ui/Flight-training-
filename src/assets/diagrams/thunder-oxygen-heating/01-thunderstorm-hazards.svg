<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 867" role="img" aria-labelledby="ti de"><title id="ti">Thunderstorm hazards</title><desc id="de">Side view of a mature thunderstorm cloud with an anvil top, an updraft and a downdraft, a dashed freezing level line, hail under the anvil, a lightning bolt, a funnel cloud below the base and a gust front with a roll cloud at the ground. Six numbered hazards match cards for turbulence, icing, hail, tornadoes, gust front and lightning. Three more cards cover the squall line, visibility and altimeter errors, and the rule to stay 20 nautical miles from a severe storm.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><style>.PN{fill:#1c2230;stroke:#8b93a7;stroke-width:1.2}.q0{font-size:11.5px}.q1{font-size:13px}.q2{stroke:currentColor;stroke-width:1.5}.q3{font-size:13px;fill:#fff}.q4{font-size:11px;fill:#fff}.q5{stroke-width:2.5}.q6{fill:var(--palette-berry,#A84C6B)}</style><text class="t" x="20" y="28" style="font-size:15px">Thunderstorm hazards</text><text class="s q1" x="20" y="50">Every thunderstorm has hazards, and you cannot see from the ground which ones it holds. Find each</text><text class="s q1" x="20" y="66.5">numbered hazard in the drawing, then read the card with the same number.</text><rect class="cl" x="20" y="89" width="690" height="262" rx="8"/><path d="M30 329L700 329" class="o" style="stroke-width:2"/><path d="M262 305L268 185Q272 145 312 139Q338 111 372 131Q404 119 424 147L470 145Q566 141 590 165Q530 179 450 181L450 305Z" class="dh" style="fill-opacity:.3;stroke:currentColor;stroke-width:2"/><path d="M30 235L700 235" class="o d" style="stroke-width:1.3;opacity:.7"/><text class="s e" x="698" y="230" style="font-size:10.5px">Freezing level</text><path d="M300 295L300 196" class="acc" style="stroke-width:3"/><path d="M300 187L304.1 196L295.9 196Z" class="dh q6"/><text class="s m" x="300" y="179" style="font-size:11px">Up</text><path d="M412 187L412 286" class="acc" style="stroke-width:3"/><path d="M412 295L407.9 286L416.1 286Z" class="dh q6"/><text class="s e" x="404" y="211" style="font-size:11px">Down</text><path d="M342 305L370 305L358 327Z" class="dh" style="opacity:.8"/><circle cx="480" cy="197" r="3.6" class="ah"/><circle cx="510" cy="197" r="3.6" class="ah"/><circle cx="540" cy="197" r="3.6" class="ah"/><circle cx="489" cy="225" r="3.6" class="ah"/><circle cx="519" cy="225" r="3.6" class="ah"/><circle cx="549" cy="225" r="3.6" class="ah"/><circle cx="498" cy="253" r="3.6" class="ah"/><circle cx="528" cy="253" r="3.6" class="ah"/><circle cx="558" cy="253" r="3.6" class="ah"/><path d="M386 151L376 171L384 171L374 195L394 167L386 167Z" fill="#f5a623" stroke="#0b0f1a" stroke-width="1"/><path d="M546 317L578 317" class="dk q5"/><path d="M586 317L578 320.6L578 313.4Z" class="dh"/><path d="M600 317L632 317" class="dk q5"/><path d="M640 317L632 320.6L632 313.4Z" class="dh"/><path d="M654 317L686 317" class="dk q5"/><path d="M694 317L686 320.6L686 313.4Z" class="dh"/><path d="M610 291q10 -16 22 0q10 -16 22 0q10 -16 22 0" class="o" style="stroke-width:2"/><text class="t q1" x="30" y="111">Side view of a mature storm</text><circle cx="356" cy="269" r="11" class="ah"/><text class="t m q3" x="356" y="273.33">1</text><circle cx="356" cy="211" r="11" class="ah"/><text class="t m q3" x="356" y="215.33">2</text><circle cx="570" cy="219" r="11" class="ah"/><text class="t m q3" x="570" y="223.33">3</text><circle cx="318" cy="315" r="11" class="ah"/><text class="t m q3" x="318" y="319.33">4</text><circle cx="640" cy="267" r="11" class="ah"/><text class="t m q3" x="640" y="271.33">5</text><circle cx="414" cy="161" r="11" class="ah"/><text class="t m q3" x="414" y="165.33">6</text><rect class="cl" x="20" y="363" width="222" height="164" rx="8"/><rect x="20" y="363" width="222" height="26" rx="10" class="lav q2"/><circle cx="35" cy="376" r="9" class="ah"/><text class="t m q4" x="35" y="379.67">1</text><text class="t q1" x="50" y="381">Turbulence</text><circle cx="33" cy="399" r="2.2" class="ah"/><text class="s q0" x="42" y="403">In all thunderstorms. Strongest</text><text class="s q0" x="42" y="418">in the cloud at the shear</text><text class="s q0" x="42" y="433">between updrafts and</text><text class="s q0" x="42" y="448">downdrafts.</text><circle cx="33" cy="462" r="2.2" class="ah"/><text class="s q0" x="42" y="466">Shear turbulence has been met</text><text class="s q0" x="42" y="481">several thousand feet above and</text><text class="s q0" x="42" y="496">20 miles to the side of a</text><text class="s q0" x="42" y="511">severe storm.</text><rect class="cl" x="254" y="363" width="222" height="164" rx="8"/><rect x="254" y="363" width="222" height="26" rx="10" class="sky q2"/><circle cx="269" cy="376" r="9" class="ah"/><text class="t m q4" x="269" y="379.67">2</text><text class="t q1" x="284" y="381">Icing</text><circle cx="267" cy="399" r="2.2" class="ah"/><text class="s q0" x="276" y="403">Supercooled water freezes on</text><text class="s q0" x="276" y="418">impact above the freezing</text><text class="s q0" x="276" y="433">level.</text><circle cx="267" cy="447" r="2.2" class="ah"/><text class="s q0" x="276" y="451">Clear icing is very rapid</text><text class="s q0" x="276" y="466">between 0 and -15 degrees C.</text><rect class="cl" x="488" y="363" width="222" height="164" rx="8"/><rect x="488" y="363" width="222" height="26" rx="10" class="rose q2"/><circle cx="503" cy="376" r="9" class="ah"/><text class="t m q4" x="503" y="379.67">3</text><text class="t q1" x="518" y="381">Hail</text><circle cx="501" cy="399" r="2.2" class="ah"/><text class="s q0" x="510" y="403">Competes with turbulence as the</text><text class="s q0" x="510" y="418">greatest hazard.</text><circle cx="501" cy="432" r="2.2" class="ah"/><text class="s q0" x="510" y="436">May be met in clear air several</text><text class="s q0" x="510" y="451">miles away. Rain at the surface</text><text class="s q0" x="510" y="466">does not mean no hail aloft.</text><circle cx="501" cy="480" r="2.2" class="ah"/><text class="s q0" x="510" y="484">Over one-half inch can damage</text><text class="s q0" x="510" y="499">an aircraft in seconds.</text><rect class="cl" x="20" y="539" width="222" height="152" rx="8"/><rect x="20" y="539" width="222" height="26" rx="10" class="rose q2"/><circle cx="35" cy="552" r="9" class="ah"/><text class="t m q4" x="35" y="555.67">4</text><text class="t q1" x="50" y="557">Tornadoes</text><circle cx="33" cy="575" r="2.2" class="ah"/><text class="s q0" x="42" y="579">Wind in the vortex can exceed</text><text class="s q0" x="42" y="594">200 knots.</text><circle cx="33" cy="608" r="2.2" class="ah"/><text class="s q0" x="42" y="612">Entering one: almost certain</text><text class="s q0" x="42" y="627">loss of control and structural</text><text class="s q0" x="42" y="642">damage.</text><circle cx="33" cy="656" r="2.2" class="ah"/><text class="s q0" x="42" y="660">The vortex can be hidden in the</text><text class="s q0" x="42" y="675">cloud.</text><rect class="cl" x="254" y="539" width="222" height="152" rx="8"/><rect x="254" y="539" width="222" height="26" rx="10" class="lav q2"/><circle cx="269" cy="552" r="9" class="ah"/><text class="t m q4" x="269" y="555.67">5</text><text class="t q1" x="284" y="557">Gust front</text><circle cx="267" cy="575" r="2.2" class="ah"/><text class="s q0" x="276" y="579">A low-level shear zone. A roll</text><text class="s q0" x="276" y="594">cloud on the leading edge marks</text><text class="s q0" x="276" y="609">it.</text><circle cx="267" cy="623" r="2.2" class="ah"/><text class="s q0" x="276" y="627">It can move up to 15 miles</text><text class="s q0" x="276" y="642">ahead of the rain and change</text><text class="s q0" x="276" y="657">the surface wind fast.</text><rect class="cl" x="488" y="539" width="222" height="152" rx="8"/><rect x="488" y="539" width="222" height="26" rx="10" class="sky q2"/><circle cx="503" cy="552" r="9" class="ah"/><text class="t m q4" x="503" y="555.67">6</text><text class="t q1" x="518" y="557">Lightning</text><circle cx="501" cy="575" r="2.2" class="ah"/><text class="s q0" x="510" y="579">Can puncture the skin and</text><text class="s q0" x="510" y="594">damage radios and navigation</text><text class="s q0" x="510" y="609">gear.</text><circle cx="501" cy="623" r="2.2" class="ah"/><text class="s q0" x="510" y="627">Nearby lightning can blind you</text><text class="s q0" x="510" y="642">for a moment and cause</text><text class="s q0" x="510" y="657">permanent compass errors.</text><rect class="cl" x="20" y="703" width="222" height="152" rx="8"/><rect x="20" y="703" width="222" height="26" rx="10" class="mint q2"/><text class="t q1" x="30" y="721">Squall line</text><circle cx="33" cy="739" r="2.2" class="ah"/><text class="s q0" x="42" y="743">A narrow band of active</text><text class="s q0" x="42" y="758">thunderstorms, often on or</text><text class="s q0" x="42" y="773">ahead of a cold front.</text><circle cx="33" cy="787" r="2.2" class="ah"/><text class="s q0" x="42" y="791">Too long to detour, too severe</text><text class="s q0" x="42" y="806">to penetrate.</text><circle cx="33" cy="820" r="2.2" class="ah"/><text class="s q0" x="42" y="824">Strongest in late afternoon and</text><text class="s q0" x="42" y="839">the first hours of darkness.</text><rect class="cl" x="254" y="703" width="222" height="152" rx="8"/><rect x="254" y="703" width="222" height="26" rx="10" class="mint q2"/><text class="t q1" x="264" y="721">Visibility and altimeter</text><circle cx="267" cy="739" r="2.2" class="ah"/><text class="s q0" x="276" y="743">Visibility is near zero inside</text><text class="s q0" x="276" y="758">the cloud.</text><circle cx="267" cy="772" r="2.2" class="ah"/><text class="s q0" x="276" y="776">Pressure drops, jumps at the</text><text class="s q0" x="276" y="791">first gust, then falls back, in</text><text class="s q0" x="276" y="806">about 15 minutes. Without a</text><text class="s q0" x="276" y="821">corrected setting the altimeter</text><text class="s q0" x="276" y="836">may be over 100 feet in error.</text><rect class="cl" x="488" y="703" width="222" height="152" rx="8"/><rect x="488" y="703" width="222" height="26" rx="10" class="lav q2"/><text class="t q1" x="498" y="721">The rule</text><circle cx="501" cy="739" r="2.2" class="ah"/><text class="s q0" x="510" y="743">Stay at least 20 NM away from a</text><text class="s q0" x="510" y="758">severe storm or an extreme</text><text class="s q0" x="510" y="773">radar echo.</text><circle cx="501" cy="787" r="2.2" class="ah"/><text class="s q0" x="510" y="791">You cannot fly over one in a</text><text class="s q0" x="510" y="806">light aircraft.</text><circle cx="501" cy="820" r="2.2" class="ah"/><text class="s q0" x="510" y="824">If you cannot go around, stay</text><text class="s q0" x="510" y="839">on the ground.</text></svg>
