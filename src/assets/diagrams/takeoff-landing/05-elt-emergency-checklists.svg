<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 598" role="img" aria-labelledby="ti de"><title id="ti">ELT and emergency checklists</title><desc id="de">ELT inspection items, mounting and battery rules, and a three-step flow for the Emergency Procedures section of the pilot operating handbook.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11.5px}.q1{font-size:13px}.q2{font-size:12px}.q3{stroke:currentColor;stroke-width:1.5}.q4{font-size:11px;fill:#fff}.q5{fill:var(--palette-berry,#A84C6B)}.q6{stroke:currentColor;stroke-width:1.4;stroke-linejoin:round}</style><text class="t" x="20" y="28" style="font-size:15px">Be ready before trouble: the ELT and the emergency checklists</text><text class="s q1" x="20" y="50">Two things to know ahead of time. The emergency locator transmitter must be kept in working order, and</text><text class="s q1" x="20" y="66.5">the emergency checklists in the POH are for the moments you cannot look things up.</text><rect class="cl" x="20" y="91" width="337" height="266" rx="8"/><rect x="20" y="91" width="337" height="26" rx="10" class="sky q3"/><text class="t q1" x="30" y="109">ELT inspection</text><text class="s q2" x="30" y="137">An emergency locator transmitter (ELT) is required</text><text class="s q2" x="30" y="152.5">by 14 CFR part 91, section 91.207. Inspect it</text><text class="s q2" x="30" y="168">within 12 calendar months after the last</text><text class="s q2" x="30" y="183.5">inspection for:</text><circle cx="42" cy="209" r="10" class="ah"/><text class="t m q4" x="42" y="212.67">1</text><text class="s q2" x="60" y="213">Proper installation</text><circle cx="42" cy="240.5" r="10" class="ah"/><text class="t m q4" x="42" y="244.17">2</text><text class="s q2" x="60" y="244.5">Battery corrosion</text><circle cx="42" cy="272" r="10" class="ah"/><text class="t m q4" x="42" y="275.67">3</text><text class="s q2" x="60" y="276">Operation of the controls and crash sensor</text><circle cx="42" cy="303.5" r="10" class="ah"/><text class="t m q4" x="42" y="307.17">4</text><text class="s q2" x="60" y="307.5">A sufficient signal radiated from its antenna</text><rect class="cl" x="373" y="91" width="337" height="266" rx="8"/><rect x="373" y="91" width="337" height="26" rx="10" class="lav q3"/><text class="t q1" x="383" y="109">Mounting and batteries</text><g transform="translate(463 161) rotate(0) scale(2)"><ellipse cx="0" cy="0" rx="24" ry="5.5" class="sky" style="stroke:currentColor;stroke-width:1.4"/><path d="M-20 -2L-29 -13L-22 -13L-12 -3Z" class="sky q6"/><path d="M0 2L8 2L-4 11L-9 11Z" class="cl q6"/><rect x="-20" y="-4.5" width="8" height="5" rx="1" class="ah" style="stroke:currentColor;stroke-width:.8"/></g><path d="M433 203L433 184" class="acc" style="stroke-width:2"/><path d="M433 177L436.1 184L429.9 184Z" class="dh q5"/><text class="s q0" x="473" y="201">Fixed and deployable automatic types</text><text class="s q0" x="473" y="216">go as far aft as practicable, so a</text><text class="s q0" x="473" y="231">crash is less likely to damage them.</text><text class="t q0" x="383" y="247">Replace the batteries (or recharge them, if</text><text class="t q0" x="383" y="262">rechargeable):</text><circle cx="386" cy="277" r="2.2" class="ah"/><text class="s q0" x="395" y="281">when the transmitter has been in use for more than</text><text class="s q0" x="395" y="296">1 cumulative hour</text><circle cx="386" cy="310" r="2.2" class="ah"/><text class="s q0" x="395" y="314">when 50 percent of the battery useful life (or, for</text><text class="s q0" x="395" y="329">rechargeable, of the charge) has expired</text><text class="t" x="20" y="377" style="font-size:14px">Emergency Procedures, Section 3 of the AFM/POH</text><rect class="cl" x="20" y="391" width="215.33" height="86" rx="8"/><rect x="20" y="391" width="215.33" height="26" rx="10" class="sky q3"/><text class="t q1" x="30" y="409">Memorize</text><circle cx="33" cy="427" r="2.2" class="ah"/><text class="s q0" x="42" y="431">Memorize the immediate action</text><text class="s q0" x="42" y="446">items.</text><path d="M238.33 434L246.3 434" class="acc" style="stroke-width:2.5"/><path d="M254.33 434L246.3 437.6L246.3 430.4Z" class="dh q5"/><rect class="cl" x="257.33" y="391" width="215.33" height="86" rx="8"/><rect x="257.33" y="391" width="215.33" height="26" rx="10" class="lav q3"/><text class="t q1" x="267.33" y="409">Abbreviated first</text><circle cx="270.33" cy="427" r="2.2" class="ah"/><text class="s q0" x="279.33" y="431">Checklists may show an</text><text class="s q0" x="279.33" y="446">abbreviated form first, with</text><text class="s q0" x="279.33" y="461">items in the order of action.</text><path d="M475.67 434L483.7 434" class="acc" style="stroke-width:2.5"/><path d="M491.67 434L483.7 437.6L483.7 430.4Z" class="dh q5"/><rect class="cl" x="494.67" y="391" width="215.33" height="86" rx="8"/><rect x="494.67" y="391" width="215.33" height="26" rx="10" class="mint q3"/><text class="t q1" x="504.67" y="409">Then the checklist</text><circle cx="507.67" cy="427" r="2.2" class="ah"/><text class="s q0" x="516.67" y="431">After those are done, refer to</text><text class="s q0" x="516.67" y="446">the appropriate checklist;</text><text class="s q0" x="516.67" y="461">amplified checklists follow.</text><rect class="cl" x="20" y="491" width="338" height="89" rx="8"/><rect x="20" y="491" width="338" height="26" rx="10" class="rose q3"/><text class="t q1" x="30" y="509">What it covers</text><circle cx="33" cy="527" r="2.2" class="ah"/><text class="s q0" x="42" y="531">Engine failure, fire and system failure.</text><circle cx="33" cy="545" r="2.2" class="ah"/><text class="s q0" x="42" y="549">The procedures for in-flight engine restarting and</text><text class="s q0" x="42" y="564">ditching may also be included.</text><rect class="cl" x="372" y="491" width="338" height="89" rx="8"/><rect x="372" y="491" width="338" height="26" rx="10" class="sky q3"/><text class="t q1" x="382" y="509">Abnormal procedures</text><circle cx="385" cy="527" r="2.2" class="ah"/><text class="s q0" x="394" y="531">An optional subsection of recommended procedures</text><text class="s q0" x="394" y="546">for malfunctions that are not considered</text><text class="s q0" x="394" y="561">emergencies.</text></svg>
