<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 598" role="img" aria-labelledby="ti de"><title id="ti">ELT and emergency checklists</title><desc id="de">ELT inspection items, mounting and battery rules, and a three-step flow for the Emergency Procedures section of the pilot operating handbook.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style>
<text class="t" x="20" y="28" style="font-size:15px">Be ready before trouble: the ELT and the emergency checklists</text>
<text class="s" x="20" y="50.0" style="font-size:13px">Two things to know ahead of time. The emergency locator transmitter must be kept in working order, and</text>
<text class="s" x="20" y="66.5" style="font-size:13px">the emergency checklists in the POH are for the moments you cannot look things up.</text>
<rect class="cl" x="20" y="91.0" width="337" height="266" rx="8"/>
<rect x="20" y="91.0" width="337" height="26" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="30" y="109.0" style="font-size:13px">ELT inspection</text>
<text class="s" x="30" y="137.0" style="font-size:12px">An emergency locator transmitter (ELT) is required</text>
<text class="s" x="30" y="152.5" style="font-size:12px">by 14 CFR part 91, section 91.207. Inspect it</text>
<text class="s" x="30" y="168.0" style="font-size:12px">within 12 calendar months after the last</text>
<text class="s" x="30" y="183.5" style="font-size:12px">inspection for:</text>
<circle cx="42" cy="209.0" r="10" class="ah"/><text class="t m" x="42" y="212.66666666666666" style="font-size:11px;fill:#fff">1</text>
<text class="s" x="60" y="213.0" style="font-size:12px">Proper installation</text>
<circle cx="42" cy="240.5" r="10" class="ah"/><text class="t m" x="42" y="244.16666666666666" style="font-size:11px;fill:#fff">2</text>
<text class="s" x="60" y="244.5" style="font-size:12px">Battery corrosion</text>
<circle cx="42" cy="272.0" r="10" class="ah"/><text class="t m" x="42" y="275.6666666666667" style="font-size:11px;fill:#fff">3</text>
<text class="s" x="60" y="276.0" style="font-size:12px">Operation of the controls and crash sensor</text>
<circle cx="42" cy="303.5" r="10" class="ah"/><text class="t m" x="42" y="307.1666666666667" style="font-size:11px;fill:#fff">4</text>
<text class="s" x="60" y="307.5" style="font-size:12px">A sufficient signal radiated from its antenna</text>
<rect class="cl" x="373" y="91.0" width="337" height="266" rx="8"/>
<rect x="373" y="91.0" width="337" height="26" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="383" y="109.0" style="font-size:13px">Mounting and batteries</text>
<g transform="translate(463 161.0) rotate(0) scale(2.0)"><ellipse cx="0" cy="0" rx="24" ry="5.5" class="sky" style="stroke:currentColor;stroke-width:1.4"/><path d="M-20 -2L-29 -13L-22 -13L-12 -3Z" class="sky" style="stroke:currentColor;stroke-width:1.4;stroke-linejoin:round"/><path d="M0 2L8 2L-4 11L-9 11Z" class="cl" style="stroke:currentColor;stroke-width:1.4;stroke-linejoin:round"/><rect x="-20" y="-4.5" width="8" height="5" rx="1" class="ah" style="stroke:currentColor;stroke-width:.8"/></g>
<path d="M433 203.0L433.0 184.0" class="acc" style="stroke-width:2"/><path d="M433 177.0L436.1 184.0L429.9 184.0Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/>
<text class="s" x="473" y="201.0" style="font-size:11.5px">Fixed and deployable automatic types</text>
<text class="s" x="473" y="216.0" style="font-size:11.5px">go as far aft as practicable, so a</text>
<text class="s" x="473" y="231.0" style="font-size:11.5px">crash is less likely to damage them.</text>
<text class="t" x="383" y="247.0" style="font-size:11.5px">Replace the batteries (or recharge them, if</text>
<text class="t" x="383" y="262.0" style="font-size:11.5px">rechargeable):</text>
<circle cx="386" cy="277.0" r="2.2" class="ah"/>
<text class="s" x="395" y="281.0" style="font-size:11.5px">when the transmitter has been in use for more than</text>
<text class="s" x="395" y="296.0" style="font-size:11.5px">1 cumulative hour</text>
<circle cx="386" cy="310.0" r="2.2" class="ah"/>
<text class="s" x="395" y="314.0" style="font-size:11.5px">when 50 percent of the battery useful life (or, for</text>
<text class="s" x="395" y="329.0" style="font-size:11.5px">rechargeable, of the charge) has expired</text>
<text class="t" x="20" y="377.0" style="font-size:14px">Emergency Procedures, Section 3 of the AFM/POH</text>
<rect class="cl" x="20.0" y="391.0" width="215.33333333333334" height="86.0" rx="8"/>
<rect x="20.0" y="391.0" width="215.33333333333334" height="26" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="30.0" y="409.0" style="font-size:13px">Memorize</text>
<circle cx="33.0" cy="427.0" r="2.2" class="ah"/>
<text class="s" x="42.0" y="431.0" style="font-size:11.5px">Memorize the immediate action</text>
<text class="s" x="42.0" y="446.0" style="font-size:11.5px">items.</text>
<path d="M238.33333333333334 434.0L246.3 434.0" class="acc" style="stroke-width:2.5"/><path d="M254.33333333333334 434.0L246.3 437.6L246.3 430.4Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/>
<rect class="cl" x="257.33333333333337" y="391.0" width="215.33333333333334" height="86.0" rx="8"/>
<rect x="257.33333333333337" y="391.0" width="215.33333333333334" height="26" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="267.33333333333337" y="409.0" style="font-size:13px">Abbreviated first</text>
<circle cx="270.33333333333337" cy="427.0" r="2.2" class="ah"/>
<text class="s" x="279.33333333333337" y="431.0" style="font-size:11.5px">Checklists may show an</text>
<text class="s" x="279.33333333333337" y="446.0" style="font-size:11.5px">abbreviated form first, with</text>
<text class="s" x="279.33333333333337" y="461.0" style="font-size:11.5px">items in the order of action.</text>
<path d="M475.66666666666674 434.0L483.7 434.0" class="acc" style="stroke-width:2.5"/><path d="M491.66666666666674 434.0L483.7 437.6L483.7 430.4Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/>
<rect class="cl" x="494.6666666666667" y="391.0" width="215.33333333333334" height="86.0" rx="8"/>
<rect x="494.6666666666667" y="391.0" width="215.33333333333334" height="26" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="504.6666666666667" y="409.0" style="font-size:13px">Then the checklist</text>
<circle cx="507.6666666666667" cy="427.0" r="2.2" class="ah"/>
<text class="s" x="516.6666666666667" y="431.0" style="font-size:11.5px">After those are done, refer to</text>
<text class="s" x="516.6666666666667" y="446.0" style="font-size:11.5px">the appropriate checklist;</text>
<text class="s" x="516.6666666666667" y="461.0" style="font-size:11.5px">amplified checklists follow.</text>
<rect class="cl" x="20.0" y="491.0" width="338.0" height="89.0" rx="8"/>
<rect x="20.0" y="491.0" width="338.0" height="26" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="30.0" y="509.0" style="font-size:13px">What it covers</text>
<circle cx="33.0" cy="527.0" r="2.2" class="ah"/>
<text class="s" x="42.0" y="531.0" style="font-size:11.5px">Engine failure, fire and system failure.</text>
<circle cx="33.0" cy="545.0" r="2.2" class="ah"/>
<text class="s" x="42.0" y="549.0" style="font-size:11.5px">The procedures for in-flight engine restarting and</text>
<text class="s" x="42.0" y="564.0" style="font-size:11.5px">ditching may also be included.</text>
<rect class="cl" x="372.0" y="491.0" width="338.0" height="89.0" rx="8"/>
<rect x="372.0" y="491.0" width="338.0" height="26" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="382.0" y="509.0" style="font-size:13px">Abnormal procedures</text>
<circle cx="385.0" cy="527.0" r="2.2" class="ah"/>
<text class="s" x="394.0" y="531.0" style="font-size:11.5px">An optional subsection of recommended procedures</text>
<text class="s" x="394.0" y="546.0" style="font-size:11.5px">for malfunctions that are not considered</text>
<text class="s" x="394.0" y="561.0" style="font-size:11.5px">emergencies.</text>
</svg>
