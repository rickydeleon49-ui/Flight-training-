<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 586" role="img" aria-labelledby="ti de"><title id="ti">Runway slope and surface</title><desc id="de">Three panels show what a 3 percent gradient means and how upslope and downslope change takeoff and landing distance, then cards on surface, braking and checking the runway.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11.5px}.q1{font-size:13px}.q2{stroke:currentColor;stroke-width:1.4;stroke-linejoin:round}.q3{stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}.q4{stroke:currentColor;stroke-width:1.5}.q5{stroke:currentColor;stroke-width:1.4}</style><text class="t" x="20" y="28" style="font-size:15px">The runway changes the numbers: slope and surface</text><text class="s q1" x="20" y="50">Performance charts assume a paved, level, smooth, dry runway. No two runways are alike, so check how</text><text class="s q1" x="20" y="66.5">the one you are using differs.</text><rect class="cl" x="20" y="93" width="221" height="216" rx="8"/><rect class="cl" x="254.5" y="93" width="221" height="216" rx="8"/><rect class="cl" x="489" y="93" width="221" height="216" rx="8"/><text class="t q1" x="30" y="115">What a gradient is</text><path d="M42 197L192 197L192 167Z" class="sky q3"/><text class="s m" x="117" y="213" style="font-size:11px">100 ft of runway length</text><text class="s" x="200" y="187" style="font-size:11px">3 ft</text><text class="t m" x="117" y="165" style="font-size:12px">3 percent gradient</text><text class="s q0" x="30" y="237">The gradient is the change in</text><text class="s q0" x="30" y="252">runway height over the length of</text><text class="s q0" x="30" y="267">the runway. A positive gradient</text><text class="s q0" x="30" y="282">means the height increases; a</text><text class="s q0" x="30" y="297">negative one means it decreases.</text><text class="t q1" x="264.5" y="115">Upslope</text><path d="M266.5 191L463.5 153L463.5 197L266.5 197Z" class="mint q3"/><g transform="translate(364.5 161) rotate(-11) scale(1)"><ellipse cx="0" cy="0" rx="24" ry="5.5" class="sky q5"/><path d="M-20 -2L-29 -13L-22 -13L-12 -3Z" class="sky q2"/><path d="M0 2L8 2L-4 11L-9 11Z" class="cl q2"/></g><circle cx="267.5" cy="215" r="2.2" class="ah"/><text class="s q0" x="276.5" y="219">Takeoff: acceleration is</text><text class="s q0" x="276.5" y="234">impeded, so the ground run is</text><text class="s q0" x="276.5" y="249">longer.</text><circle cx="267.5" cy="264" r="2.2" class="ah"/><text class="s q0" x="276.5" y="268">Landing: the landing roll is</text><text class="s q0" x="276.5" y="283">typically shorter.</text><text class="t q1" x="499" y="115">Downslope</text><path d="M501 153L698 191L698 197L501 197Z" class="rose q3"/><g transform="translate(599 161) rotate(11) scale(1)"><ellipse cx="0" cy="0" rx="24" ry="5.5" class="sky q5"/><path d="M-20 -2L-29 -13L-22 -13L-12 -3Z" class="sky q2"/><path d="M0 2L8 2L-4 11L-9 11Z" class="cl q2"/></g><circle cx="502" cy="215" r="2.2" class="ah"/><text class="s q0" x="511" y="219">Takeoff: acceleration is aided,</text><text class="s q0" x="511" y="234">so the takeoff distance is</text><text class="s q0" x="511" y="249">shorter.</text><circle cx="502" cy="264" r="2.2" class="ah"/><text class="s q0" x="511" y="268">Landing: the landing distance</text><text class="s q0" x="511" y="283">is longer.</text><rect class="cl" x="20" y="323" width="220.67" height="245" rx="8"/><rect x="20" y="323" width="220.67" height="26" rx="10" class="lav q4"/><text class="t q1" x="30" y="341">Surface</text><circle cx="33" cy="359" r="2.2" class="ah"/><text class="s q0" x="42" y="363">Concrete, asphalt, gravel, dirt</text><text class="s q0" x="42" y="378">or grass: the Chart Supplement</text><text class="s q0" x="42" y="393">U.S. lists the surface for each</text><text class="s q0" x="42" y="408">airport.</text><circle cx="33" cy="422" r="2.2" class="ah"/><text class="s q0" x="42" y="426">A surface that is not hard and</text><text class="s q0" x="42" y="441">smooth lengthens the takeoff</text><text class="s q0" x="42" y="456">ground roll.</text><circle cx="33" cy="470" r="2.2" class="ah"/><text class="s q0" x="42" y="474">Tires can sink into soft,</text><text class="s q0" x="42" y="489">grassy or muddy runways;</text><text class="s q0" x="42" y="504">potholes and ruts spoil tire</text><text class="s q0" x="42" y="519">roll.</text><circle cx="33" cy="533" r="2.2" class="ah"/><text class="s q0" x="42" y="537">Mud, snow or standing water</text><text class="s q0" x="42" y="552">reduces acceleration.</text><rect class="cl" x="254.67" y="323" width="220.67" height="245" rx="8"/><rect x="254.67" y="323" width="220.67" height="26" rx="10" class="mint q4"/><text class="t q1" x="264.67" y="341">Braking</text><circle cx="267.67" cy="359" r="2.2" class="ah"/><text class="s q0" x="276.67" y="363">Braking effectiveness is the</text><text class="s q0" x="276.67" y="378">amount of power applied to the</text><text class="s q0" x="276.67" y="393">brakes without skidding the</text><text class="s q0" x="276.67" y="408">tires.</text><circle cx="267.67" cy="422" r="2.2" class="ah"/><text class="s q0" x="276.67" y="426">The condition of the surface</text><text class="s q0" x="276.67" y="441">affects braking ability.</text><circle cx="267.67" cy="455" r="2.2" class="ah"/><text class="s q0" x="276.67" y="459">Muddy and wet surfaces can</text><text class="s q0" x="276.67" y="474">reduce friction between the</text><text class="s q0" x="276.67" y="489">runway and the tires.</text><rect class="cl" x="489.33" y="323" width="220.67" height="245" rx="8"/><rect x="489.33" y="323" width="220.67" height="26" rx="10" class="rose q4"/><text class="t q1" x="499.33" y="341">Before you go</text><circle cx="502.33" cy="359" r="2.2" class="ah"/><text class="s q0" x="511.33" y="363">Runway slope is also listed in</text><text class="s q0" x="511.33" y="378">the Chart Supplement U.S.</text><circle cx="502.33" cy="392" r="2.2" class="ah"/><text class="s q0" x="511.33" y="396">When conditions are reported</text><text class="s q0" x="511.33" y="411">less than ideal, make sure the</text><text class="s q0" x="511.33" y="426">runway is long enough for</text><text class="s q0" x="511.33" y="441">takeoff acceleration and</text><text class="s q0" x="511.33" y="456">landing deceleration.</text></svg>
