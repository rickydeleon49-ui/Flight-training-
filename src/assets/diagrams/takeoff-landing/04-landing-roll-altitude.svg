<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 459" role="img" aria-labelledby="ti de"><title id="ti">Landing roll and altitude</title><desc id="de">A speed strip shows aerodynamic drag useful down to 60 to 70 percent of touchdown speed and brakes after; a card on minimum versus ordinary landing; and bars showing 5,000 feet needs 16 percent more landing distance than sea level.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11.5px}.q1{stroke:currentColor;stroke-width:1.2}.q2{font-size:13px}.q3{font-size:11px}.q4{stroke:currentColor;stroke-width:1.5}</style><text class="t" x="20" y="28" style="font-size:15px">The landing roll, and landing at altitude</text><text class="s q2" x="20" y="50">After touchdown the aim is to slow down. Aerodynamic drag costs nothing, but it only helps while the</text><text class="s q2" x="20" y="66.5">airplane is still fast.</text><rect class="cl" x="20" y="91" width="690" height="128" rx="8"/><text class="t q2" x="32" y="113">Slowing down after touchdown</text><rect x="36" y="147" width="197.4" height="34" rx="3" class="mint q1"/><rect x="233.4" y="147" width="65.8" height="34" rx="3" class="lav q1"/><rect x="299.2" y="147" width="394.8" height="34" rx="3" class="rose q1"/><text class="t q0" x="44" y="168">Aerodynamic drag slows you</text><text class="t m q0" x="496.6" y="168">Drag is slight: use the brakes</text><text class="s q3" x="36" y="139">Touchdown speed</text><text class="s e q3" x="694" y="139">Stopped</text><path d="M266.3 181L266.3 197" class="dk" style="stroke-width:1.5"/><text class="s m q3" x="266.3" y="211">At 60 to 70 percent of touchdown speed, drag has become so slight it is of little use</text><rect class="cl" x="20" y="233" width="337" height="212" rx="8"/><rect x="20" y="233" width="337" height="26" rx="10" class="sky q4"/><text class="t q2" x="30" y="251">Minimum distance or ordinary roll</text><circle cx="33" cy="269" r="2.2" class="ah"/><text class="s q0" x="42" y="273">Minimum landing distance comes from continuous peak</text><text class="s q0" x="42" y="288">deceleration: extensive use of the brakes.</text><circle cx="33" cy="302" r="2.2" class="ah"/><text class="s q0" x="42" y="306">An ordinary landing with plenty of runway can use</text><text class="s q0" x="42" y="321">aerodynamic drag early, saving tires and brakes.</text><circle cx="33" cy="335" r="2.2" class="ah"/><text class="s q0" x="42" y="339">For most airplanes braking friction is the main</text><text class="s q0" x="42" y="354">source of deceleration at minimum distance.</text><circle cx="33" cy="368" r="2.2" class="ah"/><text class="s q0" x="42" y="372">Power should be the smallest possible positive</text><text class="s q0" x="42" y="387">value during the roll.</text><rect class="cl" x="373" y="233" width="337" height="212" rx="8"/><rect x="373" y="233" width="337" height="26" rx="10" class="lav q4"/><text class="t q2" x="383" y="251">Landing at altitude</text><text class="s q0" x="385" y="281">Sea level</text><rect x="385" y="287" width="200" height="16" rx="3" class="mint q1"/><text class="s q0" x="385" y="321">5,000 feet</text><rect x="385" y="327" width="200" height="16" rx="3" class="mint q1"/><rect x="585" y="327" width="32" height="16" rx="3" class="rose q1"/><text class="t e" x="698" y="321" style="font-size:12px">16 percent longer</text><circle cx="386" cy="359" r="2.2" class="ah"/><text class="s q0" x="395" y="363">Same indicated airspeed, but a greater true</text><text class="s q0" x="395" y="378">airspeed. Deceleration is the same.</text><circle cx="386" cy="392" r="2.2" class="ah"/><text class="s q0" x="395" y="396">About three and one-half percent more distance for</text><text class="s q0" x="395" y="411">each 1,000 feet.</text></svg>
