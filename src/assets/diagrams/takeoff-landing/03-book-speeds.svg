<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 500" role="img" aria-labelledby="ti de"><title id="ti">Takeoff and landing speed</title><desc id="de">Two bar pairs show that ten percent too much speed adds about 21 percent to takeoff distance and at least 21 percent to landing distance, with cards on slow speeds, kinetic energy and where book speeds come from.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><text class="t" x="20" y="28" style="font-size:15px">Fly the book speed: too fast costs runway, too slow risks a stall</text><text class="s" x="20" y="50.0" style="font-size:13px">The speeds in the AFM/POH are generally the minimum safe speeds for taking off and landing. Straying</text><text class="s" x="20" y="66.5" style="font-size:13px">from them changes the distance you need.</text><rect class="cl" x="20" y="91.0" width="337" height="150" rx="8"/><text class="t" x="32" y="113.0" style="font-size:13px">Takeoff</text><text class="s" x="32" y="135.0" style="font-size:11.5px">At the book speed</text><rect x="32" y="141.0" width="200.0" height="16" rx="3" class="mint" style="stroke:currentColor;stroke-width:1.2"/><text class="s" x="32" y="175.0" style="font-size:11.5px">Ten percent too fast</text><rect x="32" y="181.0" width="200.0" height="16" rx="3" class="mint" style="stroke:currentColor;stroke-width:1.2"/><rect x="232.0" y="181.0" width="42.0" height="16" rx="3" class="rose" style="stroke:currentColor;stroke-width:1.2"/><text class="t e" x="345" y="175.0" style="font-size:12px">+21 percent</text><text class="s" x="32" y="215.0" style="font-size:11.5px">Ten percent excess airspeed would increase takeoff</text><text class="s" x="32" y="230.0" style="font-size:11.5px">distance 21 percent.</text><rect class="cl" x="373" y="91.0" width="337" height="150" rx="8"/><text class="t" x="385" y="113.0" style="font-size:13px">Landing</text><text class="s" x="385" y="135.0" style="font-size:11.5px">At the book speed</text><rect x="385" y="141.0" width="200.0" height="16" rx="3" class="mint" style="stroke:currentColor;stroke-width:1.2"/><text class="s" x="385" y="175.0" style="font-size:11.5px">Ten percent too fast</text><rect x="385" y="181.0" width="200.0" height="16" rx="3" class="mint" style="stroke:currentColor;stroke-width:1.2"/><rect x="585.0" y="181.0" width="42.0" height="16" rx="3" class="rose" style="stroke:currentColor;stroke-width:1.2"/><text class="t e" x="698" y="175.0" style="font-size:12px">+21 percent or more</text><text class="s" x="385" y="215.0" style="font-size:11.5px">Ten percent excess landing speed causes at least a</text><text class="s" x="385" y="230.0" style="font-size:11.5px">21 percent increase in landing distance.</text><rect class="cl" x="20.0" y="255.0" width="220.66666666666666" height="227.0" rx="8"/><rect x="20.0" y="255.0" width="220.66666666666666" height="26" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30.0" y="273.0" style="font-size:13px">Too slow</text><circle cx="33.0" cy="291.0" r="2.2" class="ah"/><text class="s" x="42.0" y="295.0" style="font-size:11.5px">Taking off below the</text><text class="s" x="42.0" y="310.0" style="font-size:11.5px">recommended speed: the airplane</text><text class="s" x="42.0" y="325.0" style="font-size:11.5px">could stall, be difficult to</text><text class="s" x="42.0" y="340.0" style="font-size:11.5px">control, or have a very low</text><text class="s" x="42.0" y="355.0" style="font-size:11.5px">initial rate of climb.</text><circle cx="33.0" cy="369.0" r="2.2" class="ah"/><text class="s" x="42.0" y="373.0" style="font-size:11.5px">Landing below the specified</text><text class="s" x="42.0" y="388.0" style="font-size:11.5px">speed: it may stall, be</text><text class="s" x="42.0" y="403.0" style="font-size:11.5px">difficult to control, or</text><text class="s" x="42.0" y="418.0" style="font-size:11.5px">develop high rates of descent.</text><rect class="cl" x="254.66666666666666" y="255.0" width="220.66666666666666" height="227.0" rx="8"/><rect x="254.66666666666666" y="255.0" width="220.66666666666666" height="26" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="264.66666666666663" y="273.0" style="font-size:13px">Why fast costs distance</text><circle cx="267.66666666666663" cy="291.0" r="2.2" class="ah"/><text class="s" x="276.66666666666663" y="295.0" style="font-size:11.5px">At 75 knots an airplane has</text><text class="s" x="276.66666666666663" y="310.0" style="font-size:11.5px">four times the energy it has at</text><text class="s" x="276.66666666666663" y="325.0" style="font-size:11.5px">37 knots, and needs four times</text><text class="s" x="276.66666666666663" y="340.0" style="font-size:11.5px">as much distance to stop.</text><circle cx="267.66666666666663" cy="354.0" r="2.2" class="ah"/><text class="s" x="276.66666666666663" y="358.0" style="font-size:11.5px">Extra landing speed adds drag</text><text class="s" x="276.66666666666663" y="373.0" style="font-size:11.5px">and lift in the normal ground</text><text class="s" x="276.66666666666663" y="388.0" style="font-size:11.5px">attitude; the added lift</text><text class="s" x="276.66666666666663" y="403.0" style="font-size:11.5px">reduces the force on the</text><text class="s" x="276.66666666666663" y="418.0" style="font-size:11.5px">brakes.</text><circle cx="267.66666666666663" cy="432.0" r="2.2" class="ah"/><text class="s" x="276.66666666666663" y="436.0" style="font-size:11.5px">A tire is more likely to blow</text><text class="s" x="276.66666666666663" y="451.0" style="font-size:11.5px">out from braking right after</text><text class="s" x="276.66666666666663" y="466.0" style="font-size:11.5px">touchdown.</text><rect class="cl" x="489.3333333333333" y="255.0" width="220.66666666666666" height="227.0" rx="8"/><rect x="489.3333333333333" y="255.0" width="220.66666666666666" height="26" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="499.3333333333333" y="273.0" style="font-size:13px">Where the speeds come from</text><circle cx="502.3333333333333" cy="291.0" r="2.2" class="ah"/><text class="s" x="511.3333333333333" y="295.0" style="font-size:11.5px">Lift-off speed is anywhere from</text><text class="s" x="511.3333333333333" y="310.0" style="font-size:11.5px">1.05 to 1.25 times the stall</text><text class="s" x="511.3333333333333" y="325.0" style="font-size:11.5px">speed or minimum control speed,</text><text class="s" x="511.3333333333333" y="340.0" style="font-size:11.5px">depending on the airplane.</text><circle cx="502.3333333333333" cy="354.0" r="2.2" class="ah"/><text class="s" x="511.3333333333333" y="358.0" style="font-size:11.5px">More speed at landing may</text><text class="s" x="511.3333333333333" y="373.0" style="font-size:11.5px">improve control slightly,</text><text class="s" x="511.3333333333333" y="388.0" style="font-size:11.5px">especially in crosswinds, but</text><text class="s" x="511.3333333333333" y="403.0" style="font-size:11.5px">it lengthens the roll.</text></svg>
