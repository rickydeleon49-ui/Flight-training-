<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 627" role="img" aria-labelledby="ti de"><title id="ti">Dynamic hydroplaning</title><desc id="de">Two side views of a tire, one on the runway and one riding on water, then the 9 times square root of tire pressure formula with a 36 psi, 54 knot example, and tips for wet runways.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><text class="t" x="20" y="28" style="font-size:15px">Hydroplaning: tires riding on water, not on the runway</text><text class="s" x="20" y="50.0" style="font-size:13px">Water on a runway lowers the friction between tires and ground. When the tires ride on a thin sheet of</text><text class="s" x="20" y="66.5" style="font-size:13px">water, braking and directional control are almost nil.</text><rect class="cl" x="20" y="91.0" width="337" height="140" rx="8"/><rect class="cl" x="373" y="91.0" width="337" height="140" rx="8"/><text class="t" x="32" y="113.0" style="font-size:13px">Tire on the runway surface</text><path d="M32 175.0L345 175.0" class="dk" style="stroke-width:3"/><circle cx="140" cy="151.0" r="24" class="cl" style="stroke:currentColor;stroke-width:2.5"/><circle cx="140" cy="151.0" r="9.1" class="dh" style="opacity:.5"/><path d="M190 151.0L261.0 151.0" class="acc" style="stroke-width:2.5"/><path d="M270 151.0L261.0 155.1L261.0 146.9Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><text class="s" x="32" y="203.0" style="font-size:11.5px">The tire touches the runway.</text><text class="t" x="385" y="113.0" style="font-size:13px">Dynamic hydroplaning</text><rect x="385" y="167.0" width="313" height="8" rx="2" class="sky" style="stroke:currentColor;stroke-width:1.2"/><path d="M385 175.0L698 175.0" class="dk" style="stroke-width:3"/><circle cx="493" cy="143.0" r="24" class="cl" style="stroke:currentColor;stroke-width:2.5"/><circle cx="493" cy="143.0" r="9.1" class="dh" style="opacity:.5"/><path d="M543 143.0L614.0 143.0" class="acc" style="stroke-width:2.5"/><path d="M623 143.0L614.0 147.1L614.0 138.9Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><text class="s e" x="686" y="163.0" style="font-size:11px">water</text><text class="s" x="385" y="203.0" style="font-size:11.5px">The tire rides on a thin sheet of water.</text><rect class="cl" x="20" y="245.0" width="690" height="150" rx="8"/><text class="t" x="32" y="267.0" style="font-size:13px">When can it start? A simple formula</text><text class="s" x="32" y="289.0" style="font-size:12.5px">Minimum hydroplaning speed (knots) = 9 x square root of main gear tire pressure (psi)</text><rect x="32" y="301.0" width="110" height="28" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="87.0" y="320.0" style="font-size:12px">36 psi</text><path d="M146 315.0L155.0 315.0" class="acc" style="stroke-width:2.2"/><path d="M162 315.0L155.0 318.1L155.0 311.9Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><rect x="166" y="301.0" width="190" height="28" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="261.0" y="320.0" style="font-size:12px">square root of 36 = 6</text><path d="M360 315.0L369.0 315.0" class="acc" style="stroke-width:2.2"/><path d="M376 315.0L369.0 318.1L369.0 311.9Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><rect x="380" y="301.0" width="150" height="28" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="455.0" y="320.0" style="font-size:12px">6 x 9 = 54 knots</text><text class="s" x="564" y="320.0" style="font-size:11px">(the PHAK example)</text><path d="M70 349.0L690 349.0" class="dk" style="stroke-width:1.5;opacity:.6"/><text class="s" x="42" y="365.0" style="font-size:10.5px">slower</text><text class="s e" x="688" y="341.0" style="font-size:10.5px">faster</text><circle cx="420" cy="349.0" r="6" class="ah"/><text class="s m" x="420" y="365.0" style="font-size:11.5px">starts at the minimum speed (54 knots here)</text><path d="M412 349.0L268.0 349.0" class="acc" style="stroke-width:2.5"/><path d="M260 349.0L268.0 345.4L268.0 352.6Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><text class="s m" x="320" y="341.0" style="font-size:11px">can continue well below</text><rect class="cl" x="20.0" y="409.0" width="220.66666666666666" height="200.0" rx="8"/><rect x="20.0" y="409.0" width="220.66666666666666" height="26" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30.0" y="427.0" style="font-size:13px">On a wet runway</text><circle cx="33.0" cy="445.0" r="2.2" class="ah"/><text class="s" x="42.0" y="449.0" style="font-size:11.5px">Land into the wind for the best</text><text class="s" x="42.0" y="464.0" style="font-size:11.5px">directional control; pick the</text><text class="s" x="42.0" y="479.0" style="font-size:11.5px">runway most aligned with the</text><text class="s" x="42.0" y="494.0" style="font-size:11.5px">wind.</text><circle cx="33.0" cy="508.0" r="2.2" class="ah"/><text class="s" x="42.0" y="512.0" style="font-size:11.5px">Avoid abrupt control inputs.</text><circle cx="33.0" cy="526.0" r="2.2" class="ah"/><text class="s" x="42.0" y="530.0" style="font-size:11.5px">Think about braking problems</text><text class="s" x="42.0" y="545.0" style="font-size:11.5px">well before landing.</text><circle cx="33.0" cy="559.0" r="2.2" class="ah"/><text class="s" x="42.0" y="563.0" style="font-size:11.5px">Mechanical braking may not</text><text class="s" x="42.0" y="578.0" style="font-size:11.5px">work, so use aerodynamic</text><text class="s" x="42.0" y="593.0" style="font-size:11.5px">braking fully.</text><rect class="cl" x="254.66666666666666" y="409.0" width="220.66666666666666" height="200.0" rx="8"/><rect x="254.66666666666666" y="409.0" width="220.66666666666666" height="26" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="264.66666666666663" y="427.0" style="font-size:13px">Make it less likely</text><circle cx="267.66666666666663" cy="445.0" r="2.2" class="ah"/><text class="s" x="276.66666666666663" y="449.0" style="font-size:11.5px">Landing faster than recommended</text><text class="s" x="276.66666666666663" y="464.0" style="font-size:11.5px">raises the chance of</text><text class="s" x="276.66666666666663" y="479.0" style="font-size:11.5px">hydroplaning.</text><circle cx="267.66666666666663" cy="493.0" r="2.2" class="ah"/><text class="s" x="276.66666666666663" y="497.0" style="font-size:11.5px">Some runways are grooved to</text><text class="s" x="276.66666666666663" y="512.0" style="font-size:11.5px">drain off water; most are not.</text><circle cx="267.66666666666663" cy="526.0" r="2.2" class="ah"/><text class="s" x="276.66666666666663" y="530.0" style="font-size:11.5px">Runways covered in ice cut</text><text class="s" x="276.66666666666663" y="545.0" style="font-size:11.5px">braking effectiveness too.</text><rect class="cl" x="489.3333333333333" y="409.0" width="220.66666666666666" height="200.0" rx="8"/><rect x="489.3333333333333" y="409.0" width="220.66666666666666" height="26" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="499.3333333333333" y="427.0" style="font-size:13px">A true story</text><circle cx="502.3333333333333" cy="445.0" r="2.2" class="ah"/><text class="s" x="511.3333333333333" y="449.0" style="font-size:11.5px">A pilot braked hard, the brakes</text><text class="s" x="511.3333333333333" y="464.0" style="font-size:11.5px">locked, and the airplane</text><text class="s" x="511.3333333333333" y="479.0" style="font-size:11.5px">hydroplaned until speed fell to</text><text class="s" x="511.3333333333333" y="494.0" style="font-size:11.5px">about 54 knots.</text><circle cx="502.3333333333333" cy="508.0" r="2.2" class="ah"/><text class="s" x="511.3333333333333" y="512.0" style="font-size:11.5px">It hydroplaned the first 300 to</text><text class="s" x="511.3333333333333" y="527.0" style="font-size:11.5px">500 feet, and the 260 feet</text><text class="s" x="511.3333333333333" y="542.0" style="font-size:11.5px">thought to be spare was gone.</text><circle cx="502.3333333333333" cy="556.0" r="2.2" class="ah"/><text class="s" x="511.3333333333333" y="560.0" style="font-size:11.5px">Braking is ineffective when</text><text class="s" x="511.3333333333333" y="575.0" style="font-size:11.5px">hydroplaning.</text></svg>
