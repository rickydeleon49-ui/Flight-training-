<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 627" role="img" aria-labelledby="ti de"><title id="ti">Dynamic hydroplaning</title><desc id="de">Two side views of a tire, one on the runway and one riding on water, then the 9 times square root of tire pressure formula with a 36 psi, 54 knot example, and tips for wet runways.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11.5px}.q1{font-size:13px}.q2{stroke:currentColor;stroke-width:1.5}.q3{fill:var(--palette-berry,#A84C6B)}.q4{stroke-width:2.5}.q5{font-size:11px}.q6{font-size:12px}.q7{stroke:currentColor;stroke-width:2.5}</style><text class="t" x="20" y="28" style="font-size:15px">Hydroplaning: tires riding on water, not on the runway</text><text class="s q1" x="20" y="50">Water on a runway lowers the friction between tires and ground. When the tires ride on a thin sheet of</text><text class="s q1" x="20" y="66.5">water, braking and directional control are almost nil.</text><rect class="cl" x="20" y="91" width="337" height="140" rx="8"/><rect class="cl" x="373" y="91" width="337" height="140" rx="8"/><text class="t q1" x="32" y="113">Tire on the runway surface</text><path d="M32 175L345 175" class="dk" style="stroke-width:3"/><circle cx="140" cy="151" r="24" class="cl q7"/><circle cx="140" cy="151" r="9.1" class="dh" style="opacity:.5"/><path d="M190 151L261 151" class="acc q4"/><path d="M270 151L261 155.1L261 146.9Z" class="dh q3"/><text class="s q0" x="32" y="203">The tire touches the runway.</text><text class="t q1" x="385" y="113">Dynamic hydroplaning</text><rect x="385" y="167" width="313" height="8" rx="2" class="sky" style="stroke:currentColor;stroke-width:1.2"/><path d="M385 175L698 175" class="dk" style="stroke-width:3"/><circle cx="493" cy="143" r="24" class="cl q7"/><circle cx="493" cy="143" r="9.1" class="dh" style="opacity:.5"/><path d="M543 143L614 143" class="acc q4"/><path d="M623 143L614 147.1L614 138.9Z" class="dh q3"/><text class="s e q5" x="686" y="163">water</text><text class="s q0" x="385" y="203">The tire rides on a thin sheet of water.</text><rect class="cl" x="20" y="245" width="690" height="150" rx="8"/><text class="t q1" x="32" y="267">When can it start? A simple formula</text><text class="s" x="32" y="289" style="font-size:12.5px">Minimum hydroplaning speed (knots) = 9 x square root of main gear tire pressure (psi)</text><rect x="32" y="301" width="110" height="28" rx="10" class="sky q2"/><text class="t m q6" x="87" y="320">36 psi</text><path d="M146 315L155 315" class="acc" style="stroke-width:2.2"/><path d="M162 315L155 318.1L155 311.9Z" class="dh q3"/><rect x="166" y="301" width="190" height="28" rx="10" class="lav q2"/><text class="t m q6" x="261" y="320">square root of 36 = 6</text><path d="M360 315L369 315" class="acc" style="stroke-width:2.2"/><path d="M376 315L369 318.1L369 311.9Z" class="dh q3"/><rect x="380" y="301" width="150" height="28" rx="10" class="mint q2"/><text class="t m q6" x="455" y="320">6 x 9 = 54 knots</text><text class="s q5" x="564" y="320">(the PHAK example)</text><path d="M70 349L690 349" class="dk" style="stroke-width:1.5;opacity:.6"/><text class="s" x="42" y="365" style="font-size:10.5px">slower</text><text class="s e" x="688" y="341" style="font-size:10.5px">faster</text><circle cx="420" cy="349" r="6" class="ah"/><text class="s m q0" x="420" y="365">starts at the minimum speed (54 knots here)</text><path d="M412 349L268 349" class="acc q4"/><path d="M260 349L268 345.4L268 352.6Z" class="dh q3"/><text class="s m q5" x="320" y="341">can continue well below</text><rect class="cl" x="20" y="409" width="220.67" height="200" rx="8"/><rect x="20" y="409" width="220.67" height="26" rx="10" class="sky q2"/><text class="t q1" x="30" y="427">On a wet runway</text><circle cx="33" cy="445" r="2.2" class="ah"/><text class="s q0" x="42" y="449">Land into the wind for the best</text><text class="s q0" x="42" y="464">directional control; pick the</text><text class="s q0" x="42" y="479">runway most aligned with the</text><text class="s q0" x="42" y="494">wind.</text><circle cx="33" cy="508" r="2.2" class="ah"/><text class="s q0" x="42" y="512">Avoid abrupt control inputs.</text><circle cx="33" cy="526" r="2.2" class="ah"/><text class="s q0" x="42" y="530">Think about braking problems</text><text class="s q0" x="42" y="545">well before landing.</text><circle cx="33" cy="559" r="2.2" class="ah"/><text class="s q0" x="42" y="563">Mechanical braking may not</text><text class="s q0" x="42" y="578">work, so use aerodynamic</text><text class="s q0" x="42" y="593">braking fully.</text><rect class="cl" x="254.67" y="409" width="220.67" height="200" rx="8"/><rect x="254.67" y="409" width="220.67" height="26" rx="10" class="mint q2"/><text class="t q1" x="264.67" y="427">Make it less likely</text><circle cx="267.67" cy="445" r="2.2" class="ah"/><text class="s q0" x="276.67" y="449">Landing faster than recommended</text><text class="s q0" x="276.67" y="464">raises the chance of</text><text class="s q0" x="276.67" y="479">hydroplaning.</text><circle cx="267.67" cy="493" r="2.2" class="ah"/><text class="s q0" x="276.67" y="497">Some runways are grooved to</text><text class="s q0" x="276.67" y="512">drain off water; most are not.</text><circle cx="267.67" cy="526" r="2.2" class="ah"/><text class="s q0" x="276.67" y="530">Runways covered in ice cut</text><text class="s q0" x="276.67" y="545">braking effectiveness too.</text><rect class="cl" x="489.33" y="409" width="220.67" height="200" rx="8"/><rect x="489.33" y="409" width="220.67" height="26" rx="10" class="rose q2"/><text class="t q1" x="499.33" y="427">A true story</text><circle cx="502.33" cy="445" r="2.2" class="ah"/><text class="s q0" x="511.33" y="449">A pilot braked hard, the brakes</text><text class="s q0" x="511.33" y="464">locked, and the airplane</text><text class="s q0" x="511.33" y="479">hydroplaned until speed fell to</text><text class="s q0" x="511.33" y="494">about 54 knots.</text><circle cx="502.33" cy="508" r="2.2" class="ah"/><text class="s q0" x="511.33" y="512">It hydroplaned the first 300 to</text><text class="s q0" x="511.33" y="527">500 feet, and the 260 feet</text><text class="s q0" x="511.33" y="542">thought to be spare was gone.</text><circle cx="502.33" cy="556" r="2.2" class="ah"/><text class="s q0" x="511.33" y="560">Braking is ineffective when</text><text class="s q0" x="511.33" y="575">hydroplaning.</text></svg>
