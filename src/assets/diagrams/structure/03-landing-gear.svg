<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 626" role="img" aria-labelledby="ti de"><title id="ti">Landing gear: the principal support</title><desc id="de">Landing gear supports the airplane when parked, taxiing, taking off or landing. Wheels are most common; floats are for water and skis for snow. Wheeled gear has two main wheels and a third wheel: a nosewheel makes it tricycle gear, a rear wheel makes it conventional or tailwheel gear. Steering is by rudder pedals or differential braking. Brakes squeeze caliper pads against a rotating rotor and their life is measured in landings.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:12px}.q1{font-size:11.5px}.q2{font-size:13px}.q3{stroke-width:2.5;opacity:0.9}.q4{stroke:currentColor;stroke-width:1.5}.q5{stroke:currentColor;stroke-width:1.8}.q6{stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}.q7{stroke-width:1.2;opacity:0.75}.q8{stroke:currentColor;stroke-width:1.6}.q9{stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}.q10{stroke:currentColor;stroke-width:1.5;stroke-linejoin:round}.q11{stroke:currentColor;stroke-width:1.4}.q12{stroke-width:1.5;opacity:0.5}</style><text class="t" x="20" y="28" style="font-size:15px">Landing gear: the principal support</text><text class="s q2" x="20" y="50">The landing gear supports the airplane when it is parked, taxiing, taking off or landing. The most</text><text class="s q2" x="20" y="66.5">common type consists of wheels.</text><rect x="20" y="93" width="220" height="107" rx="10" class="sky q4"/><text class="t m q2" x="130" y="112">Wheels</text><circle cx="130" cy="149" r="20" class="cl q5"/><circle cx="130" cy="149" r="6" class="ah"/><text class="s m q1" x="130" y="189">The most common type</text><rect x="255" y="93" width="220" height="107" rx="10" class="mint q4"/><text class="t m q2" x="365" y="112">Floats</text><rect x="309" y="155" width="52" height="14" rx="7" class="sky q6"/><path d="M335 155L335 131" class="dk q3"/><rect x="369" y="155" width="52" height="14" rx="7" class="sky q6"/><path d="M395 155L395 131" class="dk q3"/><text class="s m q1" x="365" y="189">For water operations</text><rect x="490" y="93" width="220" height="107" rx="10" class="lav q4"/><text class="t m q2" x="600" y="112">Skis</text><rect x="532" y="159" width="60" height="7" rx="3" class="mint q6"/><path d="M562 159L562 133" class="dk q3"/><rect x="608" y="159" width="60" height="7" rx="3" class="mint q6"/><path d="M638 159L638 133" class="dk q3"/><text class="s m q1" x="600" y="189">For landing on snow</text><rect x="20" y="210" width="337" height="195" rx="10" class="sky q4"/><text class="t m q2" x="188.5" y="229">Tricycle gear</text><ellipse cx="175" cy="278" rx="100" ry="16" class="cl q8"/><path d="M245 272L271 246L283 246L275 274Z" class="rose q9"/><rect x="145" y="269" width="54" height="5" rx="2" class="lav q10"/><ellipse cx="74" cy="278" rx="3" ry="16" class="lav q11"/><path d="M45 320L305 320" class="dk q12"/><path d="M103 292L103 313" class="dk q3"/><circle cx="103" cy="313" r="7" class="cl q5"/><path d="M179 292L179 313" class="dk q3"/><circle cx="179" cy="313" r="7" class="cl q5"/><text class="t m q1" x="103" y="344">Nosewheel</text><path d="M103 332L103 326" class="dk q7"/><text class="t m q1" x="191" y="344">Main wheels</text><path d="M179 332L179 326" class="dk q7"/><text class="s m q1" x="188.5" y="379">Two main wheels and a third wheel on the nose, called</text><text class="s m q1" x="188.5" y="394">a nosewheel</text><rect x="373" y="210" width="337" height="210" rx="10" class="rose q4"/><text class="t m q2" x="541.5" y="229">Conventional gear (tailwheel)</text><ellipse cx="528" cy="278" rx="100" ry="16" class="cl q8"/><path d="M598 272L624 246L636 246L628 274Z" class="rose q9"/><rect x="498" y="269" width="54" height="5" rx="2" class="lav q10"/><ellipse cx="427" cy="278" rx="3" ry="16" class="lav q11"/><path d="M398 320L658 320" class="dk q12"/><path d="M490 292L490 313" class="dk q3"/><circle cx="490" cy="313" r="7" class="cl q5"/><path d="M620 284L620 316" class="dk q3"/><circle cx="620" cy="316" r="4" class="cl q5"/><text class="t m q1" x="490" y="344">Main wheels</text><path d="M490 332L490 326" class="dk q7"/><text class="t m q1" x="620" y="344">Tailwheel</text><path d="M620 332L620 323" class="dk q7"/><text class="s m q1" x="541.5" y="379">Two main wheels and a third wheel at the rear.</text><text class="s m q1" x="541.5" y="394">Airplanes with it are sometimes called tailwheel</text><text class="s m q1" x="541.5" y="409">airplanes</text><rect x="20" y="430" width="337" height="24" rx="10" class="mint q4"/><text class="t q2" x="30" y="447">Steering</text><circle cx="31" cy="468" r="2.2" class="ah"/><text class="s q0" x="40" y="472">A steerable nosewheel or tailwheel lets the pilot</text><text class="s q0" x="40" y="487.5">control the airplane throughout all ground</text><text class="s q0" x="40" y="503">operations</text><circle cx="31" cy="518.5" r="2.2" class="ah"/><text class="s q0" x="40" y="522.5">Most aircraft are steered by moving the rudder</text><text class="s q0" x="40" y="538">pedals, nosewheel or tailwheel</text><circle cx="31" cy="553.5" r="2.2" class="ah"/><text class="s q0" x="40" y="557.5">Some aircraft are also steered by differential</text><text class="s q0" x="40" y="573">braking</text><rect x="373" y="430" width="337" height="24" rx="10" class="lav q4"/><text class="t q2" x="383" y="447">Brakes</text><circle cx="384" cy="468" r="2.2" class="ah"/><text class="s q0" x="393" y="472">Most modern airplane brakes: caliper pads</text><text class="s q0" x="393" y="487.5">hydraulically squeezed toward each other, with a</text><text class="s q0" x="393" y="503">rotating disk (the rotor) between them</text><circle cx="384" cy="518.5" r="2.2" class="ah"/><text class="s q0" x="393" y="522.5">Pad pressure on the rotor, turning with the</text><text class="s q0" x="393" y="538">wheel, adds friction and slows the wheel</text><circle cx="384" cy="553.5" r="2.2" class="ah"/><text class="s q0" x="393" y="557.5">Disks and pads are steel, or carbon that weighs</text><text class="s q0" x="393" y="573">less and absorbs more energy</text><circle cx="384" cy="588.5" r="2.2" class="ah"/><text class="s q0" x="393" y="592.5">Brake life is measured in landings, not miles</text></svg>
