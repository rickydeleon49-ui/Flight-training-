<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 695" role="img" aria-labelledby="ti de"><title id="ti">Empennage: the tail group</title><desc id="de">The empennage is the tail group. Fixed surfaces are the vertical and horizontal stabilizers. Movable surfaces are the rudder, which moves the nose left and right, the elevator, which moves the nose up and down, and trim tabs, which reduce control pressures. A stabilator is a one-piece horizontal stabilizer pivoting from a central hinge, moved with the control wheel; pulling back raises the trailing edge, raising tail load and the nose. Its antiservo tab makes it less sensitive and also works as a trim tab.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style>
<text class="t" x="20" y="28" style="font-size:15px">Empennage: the tail group</text>
<text class="s" x="20" y="50.0" style="font-size:13px">The empennage includes the entire tail group. Fixed surfaces: the vertical stabilizer and the</text>
<text class="s" x="20" y="66.5" style="font-size:13px">horizontal stabilizer. Movable surfaces: the rudder, the elevator and one or more trim tabs.</text>
<rect x="20" y="93.0" width="400" height="235.0" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="220.0" y="112.0" style="font-size:13px">Rudder and vertical stabilizer</text>
<path d="M132 195.0L302 211.0 344 221.0 302 233.0 132 253.0Z" class="cl" style="stroke:currentColor;stroke-width:1.6;stroke-linejoin:round"/>
<path d="M257 209.0L300 157.0 308 157.0 308 217.0Z" class="sky" style="stroke:currentColor;stroke-width:1.8;stroke-linejoin:round"/>
<path d="M308 157.0L336 159.0 344 221.0 308 217.0Z" class="rose" style="stroke:currentColor;stroke-width:1.8;stroke-linejoin:round"/>
<rect x="341" y="181.0" width="9" height="16" class="mint" style="stroke:currentColor;stroke-width:1.5;stroke-linejoin:round"/>
<text class="t m" x="322" y="150.0" style="font-size:11.5px">Rudder (moves)</text>
<path d="M324 154.0L324 163.0" class="dk" style="stroke-width:1.2;opacity:0.75"/>
<text class="t" x="30" y="169.0" style="font-size:11.5px">Vertical</text>
<text class="t" x="30" y="184.0" style="font-size:11.5px">stabilizer</text>
<text class="t" x="30" y="199.0" style="font-size:11.5px">(fixed)</text>
<path d="M100 181.0L282 187.0" class="dk" style="stroke-width:1.2;opacity:0.75"/>
<text class="s" x="30" y="269.0" style="font-size:11px">Side view, nose to the left</text>
<text class="t" x="358" y="193.0" style="font-size:11.5px">Trim</text>
<text class="t" x="358" y="207.0" style="font-size:11.5px">tab</text>
<path d="M356 189.0L351 189.0" class="dk" style="stroke-width:1.2;opacity:0.75"/>
<text class="s m" x="220.0" y="302.0" style="font-size:11.5px">The rudder is attached to the back of the vertical stabilizer.</text>
<text class="s m" x="220.0" y="317.0" style="font-size:11.5px">In flight it moves the nose left and right.</text>
<rect x="436" y="93.0" width="274" height="250.0" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="573.0" y="112.0" style="font-size:13px">Elevator and horizontal stabilizer</text>
<path d="M557.0 131.0L589.0 131.0L579.0 243.0L567.0 243.0Z" class="cl" style="stroke:currentColor;stroke-width:1.6;stroke-linejoin:round"/>
<path d="M565.0 193.0L468.0 213.0L468.0 229.0L565.0 229.0Z" class="sky" style="stroke:currentColor;stroke-width:1.8;stroke-linejoin:round"/>
<rect x="468.0" y="229.0" width="97" height="22" class="rose" style="stroke:currentColor;stroke-width:1.8;stroke-linejoin:round"/>
<path d="M581.0 193.0L678.0 213.0L678.0 229.0L581.0 229.0Z" class="sky" style="stroke:currentColor;stroke-width:1.8;stroke-linejoin:round"/>
<rect x="581.0" y="229.0" width="97" height="22" class="rose" style="stroke:currentColor;stroke-width:1.8;stroke-linejoin:round"/>
<rect x="503.0" y="251.0" width="30" height="8" class="mint" style="stroke:currentColor;stroke-width:1.5;stroke-linejoin:round"/>
<text class="t m" x="498.0" y="281.0" style="font-size:11.5px">Trim tab</text>
<path d="M518.0 270.0L518.0 261.0" class="dk" style="stroke-width:1.2;opacity:0.75"/>
<text class="t m" x="641.0" y="281.0" style="font-size:11.5px">Elevator (moves)</text>
<path d="M641.0 270.0L641.0 253.0" class="dk" style="stroke-width:1.2;opacity:0.75"/>
<text class="t" x="444" y="167.0" style="font-size:11.5px">Horizontal</text>
<text class="t" x="444" y="182.0" style="font-size:11.5px">stabilizer (fixed)</text>
<path d="M496 187.0L513.0 209.0" class="dk" style="stroke-width:1.2;opacity:0.75"/>
<text class="s" x="446" y="141.0" style="font-size:11px">Top view</text>
<text class="s m" x="573.0" y="302.0" style="font-size:11.5px">The elevator is attached to the back of</text>
<text class="s m" x="573.0" y="317.0" style="font-size:11.5px">the horizontal stabilizer and moves the</text>
<text class="s m" x="573.0" y="332.0" style="font-size:11.5px">nose up and down.</text>
<rect class="cl" x="20" y="353.0" width="690" height="88.5" rx="8"/>
<circle cx="35" cy="375.0" r="2.2" class="ah"/>
<text class="s" x="44" y="379.0" style="font-size:12px">Trim tabs are small, movable portions of the trailing edge of a control surface. Controlled from the</text>
<text class="s" x="44" y="394.5" style="font-size:12px">flight deck, they reduce control pressures.</text>
<circle cx="35" cy="410.0" r="2.2" class="ah"/>
<text class="s" x="44" y="414.0" style="font-size:12px">Trim tabs may be installed on the ailerons, the rudder and/or the elevator.</text>
<text class="t" x="20" y="471.5" style="font-size:13.5px">A second tail design: the stabilator (no elevator)</text>
<rect x="20" y="481.5" width="690" height="202.0" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/>
<g transform="translate(112 551.5) rotate(-14)"><path d="M-62 0C-50 -9 20 -10 62 -2L62 3C20 6 -50 6 -62 0Z" class="sky" style="stroke:currentColor;stroke-width:1.8;stroke-linejoin:round"/><g transform="translate(62 0) rotate(-14)"><rect x="0" y="-3" width="26" height="5" class="mint" style="stroke:currentColor;stroke-width:1.5"/></g></g>
<circle cx="112" cy="551.5" r="5" class="ah"/>
<text class="s m" x="87" y="591.5" style="font-size:11.5px">Central hinge point</text>
<path d="M92 581.5L109 559.5" class="dk" style="stroke-width:1.2;opacity:0.75"/>
<path d="M174 579.5L174.0 557.5" class="acc" style="stroke-width:2.5"/><path d="M174 549.5L177.6 557.5L170.4 557.5Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/>
<text class="t m" x="190" y="595.5" style="font-size:11.5px">Trailing edge up</text>
<text class="t m" x="188" y="505.5" style="font-size:11.5px">Antiservo tab</text>
<path d="M192 511.5L198 533.5" class="dk" style="stroke-width:1.2;opacity:0.75"/>
<circle cx="262" cy="507.5" r="10" class="ah"/><text class="t m" x="262" y="511.5" style="font-size:12px;fill:#fff">1</text>
<text class="s" x="282" y="511.5" style="font-size:12px">Pilot pulls back on the</text>
<text class="s" x="282" y="527.0" style="font-size:12px">control wheel</text>
<circle cx="262" cy="544.5" r="10" class="ah"/><text class="t m" x="262" y="548.5" style="font-size:12px;fill:#fff">2</text>
<text class="s" x="282" y="548.5" style="font-size:12px">The one-piece stabilizer</text>
<text class="s" x="282" y="564.0" style="font-size:12px">pivots so the trailing edge</text>
<text class="s" x="282" y="579.5" style="font-size:12px">moves up</text>
<circle cx="262" cy="597.0" r="10" class="ah"/><text class="t m" x="262" y="601.0" style="font-size:12px;fill:#fff">3</text>
<text class="s" x="282" y="601.0" style="font-size:12px">Aerodynamic tail load</text>
<text class="s" x="282" y="616.5" style="font-size:12px">increases</text>
<circle cx="262" cy="634.0" r="10" class="ah"/><text class="t m" x="262" y="638.0" style="font-size:12px;fill:#fff">4</text>
<text class="s" x="282" y="638.0" style="font-size:12px">The nose of the airplane</text>
<text class="s" x="282" y="653.5" style="font-size:12px">moves up</text>
<circle cx="483" cy="507.5" r="2.2" class="ah"/>
<text class="s" x="492" y="511.5" style="font-size:11.5px">One-piece horizontal stabilizer</text>
<text class="s" x="492" y="526.5" style="font-size:11.5px">pivoting from a central hinge point</text>
<circle cx="483" cy="541.5" r="2.2" class="ah"/>
<text class="s" x="492" y="545.5" style="font-size:11.5px">Moved with the control wheel, just</text>
<text class="s" x="492" y="560.5" style="font-size:11.5px">as the elevator is</text>
<circle cx="483" cy="575.5" r="2.2" class="ah"/>
<text class="s" x="492" y="579.5" style="font-size:11.5px">Antiservo tab moves the same way as</text>
<text class="s" x="492" y="594.5" style="font-size:11.5px">the trailing edge, making it less</text>
<text class="s" x="492" y="609.5" style="font-size:11.5px">sensitive</text>
<circle cx="483" cy="624.5" r="2.2" class="ah"/>
<text class="s" x="492" y="628.5" style="font-size:11.5px">The tab also works as a trim tab:</text>
<text class="s" x="492" y="643.5" style="font-size:11.5px">relieves control pressure and holds</text>
<text class="s" x="492" y="658.5" style="font-size:11.5px">the position</text>
</svg>
