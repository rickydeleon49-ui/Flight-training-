<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 695" role="img" aria-labelledby="ti de"><title id="ti">Empennage: the tail group</title><desc id="de">The empennage is the tail group. Fixed surfaces are the vertical and horizontal stabilizers. Movable surfaces are the rudder, which moves the nose left and right, the elevator, which moves the nose up and down, and trim tabs, which reduce control pressures. A stabilator is a one-piece horizontal stabilizer pivoting from a central hinge, moved with the control wheel; pulling back raises the trailing edge, raising tail load and the nose. Its antiservo tab makes it less sensitive and also works as a trim tab.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11.5px}.q1{font-size:12px}.q2{stroke-width:1.2;opacity:0.75}.q3{stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}.q4{font-size:13px}.q5{stroke:currentColor;stroke-width:1.5}.q6{font-size:12px;fill:#fff}.q7{stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}.q8{stroke:currentColor;stroke-width:1.5;stroke-linejoin:round}</style><text class="t" x="20" y="28" style="font-size:15px">Empennage: the tail group</text><text class="s q4" x="20" y="50">The empennage includes the entire tail group. Fixed surfaces: the vertical stabilizer and the</text><text class="s q4" x="20" y="66.5">horizontal stabilizer. Movable surfaces: the rudder, the elevator and one or more trim tabs.</text><rect x="20" y="93" width="400" height="235" rx="10" class="sky q5"/><text class="t m q4" x="220" y="112">Rudder and vertical stabilizer</text><path d="M132 195L302 211 344 221 302 233 132 253Z" class="cl q7"/><path d="M257 209L300 157 308 157 308 217Z" class="sky q3"/><path d="M308 157L336 159 344 221 308 217Z" class="rose q3"/><rect x="341" y="181" width="9" height="16" class="mint q8"/><text class="t m q0" x="322" y="150">Rudder (moves)</text><path d="M324 154L324 163" class="dk q2"/><text class="t q0" x="30" y="169">Vertical</text><text class="t q0" x="30" y="184">stabilizer</text><text class="t q0" x="30" y="199">(fixed)</text><path d="M100 181L282 187" class="dk q2"/><text class="s" x="30" y="269" style="font-size:11px">Side view, nose to the left</text><text class="t q0" x="358" y="193">Trim</text><text class="t q0" x="358" y="207">tab</text><path d="M356 189L351 189" class="dk q2"/><text class="s m q0" x="220" y="302">The rudder is attached to the back of the vertical stabilizer.</text><text class="s m q0" x="220" y="317">In flight it moves the nose left and right.</text><rect x="436" y="93" width="274" height="250" rx="10" class="mint q5"/><text class="t m q4" x="573" y="112">Elevator and horizontal stabilizer</text><path d="M557 131L589 131L579 243L567 243Z" class="cl q7"/><path d="M565 193L468 213L468 229L565 229Z" class="sky q3"/><rect x="468" y="229" width="97" height="22" class="rose q3"/><path d="M581 193L678 213L678 229L581 229Z" class="sky q3"/><rect x="581" y="229" width="97" height="22" class="rose q3"/><rect x="503" y="251" width="30" height="8" class="mint q8"/><text class="t m q0" x="498" y="281">Trim tab</text><path d="M518 270L518 261" class="dk q2"/><text class="t m q0" x="641" y="281">Elevator (moves)</text><path d="M641 270L641 253" class="dk q2"/><text class="t q0" x="444" y="167">Horizontal</text><text class="t q0" x="444" y="182">stabilizer (fixed)</text><path d="M496 187L513 209" class="dk q2"/><text class="s" x="446" y="141" style="font-size:11px">Top view</text><text class="s m q0" x="573" y="302">The elevator is attached to the back of</text><text class="s m q0" x="573" y="317">the horizontal stabilizer and moves the</text><text class="s m q0" x="573" y="332">nose up and down.</text><rect class="cl" x="20" y="353" width="690" height="88.5" rx="8"/><circle cx="35" cy="375" r="2.2" class="ah"/><text class="s q1" x="44" y="379">Trim tabs are small, movable portions of the trailing edge of a control surface. Controlled from the</text><text class="s q1" x="44" y="394.5">flight deck, they reduce control pressures.</text><circle cx="35" cy="410" r="2.2" class="ah"/><text class="s q1" x="44" y="414">Trim tabs may be installed on the ailerons, the rudder and/or the elevator.</text><text class="t" x="20" y="471.5" style="font-size:13.5px">A second tail design: the stabilator (no elevator)</text><rect x="20" y="481.5" width="690" height="202" rx="10" class="lav q5"/><g transform="translate(112 551.5) rotate(-14)"><path d="M-62 0C-50 -9 20 -10 62 -2L62 3C20 6 -50 6 -62 0Z" class="sky q3"/><g transform="translate(62 0) rotate(-14)"><rect x="0" y="-3" width="26" height="5" class="mint q5"/></g></g><circle cx="112" cy="551.5" r="5" class="ah"/><text class="s m q0" x="87" y="591.5">Central hinge point</text><path d="M92 581.5L109 559.5" class="dk q2"/><path d="M174 579.5L174 557.5" class="acc" style="stroke-width:2.5"/><path d="M174 549.5L177.6 557.5L170.4 557.5Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><text class="t m q0" x="190" y="595.5">Trailing edge up</text><text class="t m q0" x="188" y="505.5">Antiservo tab</text><path d="M192 511.5L198 533.5" class="dk q2"/><circle cx="262" cy="507.5" r="10" class="ah"/><text class="t m q6" x="262" y="511.5">1</text><text class="s q1" x="282" y="511.5">Pilot pulls back on the</text><text class="s q1" x="282" y="527">control wheel</text><circle cx="262" cy="544.5" r="10" class="ah"/><text class="t m q6" x="262" y="548.5">2</text><text class="s q1" x="282" y="548.5">The one-piece stabilizer</text><text class="s q1" x="282" y="564">pivots so the trailing edge</text><text class="s q1" x="282" y="579.5">moves up</text><circle cx="262" cy="597" r="10" class="ah"/><text class="t m q6" x="262" y="601">3</text><text class="s q1" x="282" y="601">Aerodynamic tail load</text><text class="s q1" x="282" y="616.5">increases</text><circle cx="262" cy="634" r="10" class="ah"/><text class="t m q6" x="262" y="638">4</text><text class="s q1" x="282" y="638">The nose of the airplane</text><text class="s q1" x="282" y="653.5">moves up</text><circle cx="483" cy="507.5" r="2.2" class="ah"/><text class="s q0" x="492" y="511.5">One-piece horizontal stabilizer</text><text class="s q0" x="492" y="526.5">pivoting from a central hinge point</text><circle cx="483" cy="541.5" r="2.2" class="ah"/><text class="s q0" x="492" y="545.5">Moved with the control wheel, just</text><text class="s q0" x="492" y="560.5">as the elevator is</text><circle cx="483" cy="575.5" r="2.2" class="ah"/><text class="s q0" x="492" y="579.5">Antiservo tab moves the same way as</text><text class="s q0" x="492" y="594.5">the trailing edge, making it less</text><text class="s q0" x="492" y="609.5">sensitive</text><circle cx="483" cy="624.5" r="2.2" class="ah"/><text class="s q0" x="492" y="628.5">The tab also works as a trim tab:</text><text class="s q0" x="492" y="643.5">relieves control pressure and holds</text><text class="s q0" x="492" y="658.5">the position</text></svg>
