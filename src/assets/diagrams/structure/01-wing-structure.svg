<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 938" role="img" aria-labelledby="ti de"><title id="ti">Wings: where they attach, how many, how they are held</title><desc id="de">High-wing, mid-wing and low-wing mean the wing is attached at the top, middle or lower fuselage. A monoplane has one set of wings, a biplane two. Semi-cantilever high wings use external wing struts attached about halfway out; full cantilever wings carry loads without struts. Spars, ribs and stringers are the principal wing structure and the ribs set the airfoil shape. Flaps run from the fuselage to near the midpoint of the wing and move down together; ailerons run from about the midpoint to the tip and move in opposite directions.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:12px}.q1{font-size:11.5px}.q2{stroke-width:1.4;opacity:0.7}.q3{font-size:13px}.q4{stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}.q5{stroke:currentColor;stroke-width:1.5}.q6{stroke:currentColor;stroke-width:1.6}.q7{stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}.q8{stroke-width:1;opacity:0.55}.q9{stroke-width:1.2;opacity:0.75}.q10{stroke-width:2;opacity:0.9}.q11{stroke-width:2.5;opacity:0.95}.q12{stroke-width:3;opacity:0.9}</style><text class="t" x="20" y="28" style="font-size:15px">Wings: where they attach, how many, how they are held</text><text class="s q3" x="20" y="50">The wings are airfoils attached to each side of the fuselage and are the main lifting surfaces that</text><text class="s q3" x="20" y="66.5">support the airplane in flight. Front views below are schematic.</text><rect x="20" y="93" width="220" height="140" rx="10" class="sky q5"/><text class="t m q3" x="130" y="112">High-wing</text><ellipse cx="130" cy="158" rx="15" ry="26" class="cl q6"/><rect x="40" y="128.5" width="180" height="7" rx="3" class="lav q4"/><text class="s m q1" x="130" y="207">Wing attached at the top of the</text><text class="s m q1" x="130" y="222">fuselage</text><rect x="255" y="93" width="220" height="140" rx="10" class="mint q5"/><text class="t m q3" x="365" y="112">Mid-wing</text><ellipse cx="365" cy="158" rx="15" ry="26" class="cl q6"/><rect x="275" y="154.5" width="180" height="7" rx="3" class="lav q4"/><text class="s m q1" x="365" y="207">Wing attached at the middle of</text><text class="s m q1" x="365" y="222">the fuselage</text><rect x="490" y="93" width="220" height="140" rx="10" class="lav q5"/><text class="t m q3" x="600" y="112">Low-wing</text><ellipse cx="600" cy="158" rx="15" ry="26" class="cl q6"/><rect x="510" y="178.5" width="180" height="7" rx="3" class="lav q4"/><text class="s m q1" x="600" y="207">Wing attached at the lower</text><text class="s m q1" x="600" y="222">portion of the fuselage</text><rect x="20" y="243" width="337" height="125" rx="10" class="rose q5"/><text class="t m q3" x="188.5" y="262">Monoplane</text><ellipse cx="188.5" cy="308" rx="15" ry="26" class="cl q6"/><rect x="88.5" y="304.5" width="200" height="7" rx="3" class="lav q4"/><text class="s m q1" x="188.5" y="357">A single set of wings</text><rect x="373" y="243" width="337" height="125" rx="10" class="sky q5"/><text class="t m q3" x="541.5" y="262">Biplane</text><ellipse cx="541.5" cy="308" rx="15" ry="26" class="cl q6"/><rect x="441.5" y="280.5" width="200" height="7" rx="3" class="lav q4"/><rect x="441.5" y="328.5" width="200" height="7" rx="3" class="lav q4"/><path d="M481.5 284L481.5 332" class="dk q10"/><path d="M601.5 284L601.5 332" class="dk q10"/><text class="s m q1" x="541.5" y="357">Two sets of wings</text><rect x="20" y="378" width="337" height="155" rx="10" class="mint q5"/><text class="t m q3" x="188.5" y="397">Semi-cantilever (high wing with struts)</text><ellipse cx="188.5" cy="443" rx="15" ry="26" class="cl q6"/><rect x="88.5" y="413.5" width="200" height="7" rx="3" class="lav q4"/><path d="M178.5 459L133.5 419" class="dk q11"/><path d="M198.5 459L243.5 419" class="dk q11"/><text class="s q1" x="250.5" y="439">strut</text><text class="s m q1" x="188.5" y="492">External braces called wing struts carry flight and</text><text class="s m q1" x="188.5" y="507">landing loads to the main fuselage structure; usually</text><text class="s m q1" x="188.5" y="522">attached about halfway out on the wing</text><rect x="373" y="378" width="337" height="140" rx="10" class="lav q5"/><text class="t m q3" x="541.5" y="397">Full cantilever</text><ellipse cx="541.5" cy="443" rx="15" ry="26" class="cl q6"/><rect x="441.5" y="463.5" width="200" height="7" rx="3" class="lav q4"/><text class="s q1" x="653.5" y="470">no struts</text><text class="s m q1" x="541.5" y="492">Designed to carry the loads without external struts;</text><text class="s m q1" x="541.5" y="507">a few high-wing and most low-wing airplanes</text><text class="t" x="20" y="551" style="font-size:13.5px">Inside and along the wing (top view of the right wing, schematic)</text><rect x="26" y="581" width="38" height="116" rx="14" class="cl q4"/><text class="s m" x="45" y="711" style="font-size:11px">Fuselage</text><path d="M64 591L690 595L690 675L64 677Z" class="sky q7"/><path d="M90 593L90 676" class="dk q2"/><path d="M145 593L145 676" class="dk q2"/><path d="M200 593L200 676" class="dk q2"/><path d="M255 593L255 676" class="dk q2"/><path d="M310 593L310 676" class="dk q2"/><path d="M365 593L365 676" class="dk q2"/><path d="M420 593L420 676" class="dk q2"/><path d="M475 593L475 676" class="dk q2"/><path d="M530 593L530 676" class="dk q2"/><path d="M585 593L585 676" class="dk q2"/><path d="M640 593L640 676" class="dk q2"/><path d="M64 616.8L690 619" class="dk q12"/><path d="M64 651.2L690 651" class="dk q12"/><path d="M64 603.04L690 606.2" class="dk q8"/><path d="M64 634L690 635" class="dk q8"/><path d="M64 664.96L690 663.8" class="dk q8"/><rect x="70" y="653" width="296" height="22" rx="3" class="mint q7"/><text class="t m q0" x="218" y="668">Flap</text><rect x="380" y="653" width="304" height="22" rx="3" class="rose q7"/><text class="t m q0" x="532" y="668">Aileron</text><text class="t m q0" x="190" y="569">Ribs</text><path d="M190 573L200 611" class="dk q9"/><text class="t m q0" x="330" y="569">Spars</text><path d="M330 573L330 614.8" class="dk q9"/><text class="t m q0" x="480" y="569">Stringers</text><path d="M480 573L480 605.04" class="dk q9"/><text class="s q0" x="20" y="731">Flaps: extend outward from the fuselage to near the</text><text class="s q0" x="20" y="746.5">midpoint of each wing. Flush with the wing in</text><text class="s q0" x="20" y="762">cruise; when extended they move down together to add</text><text class="s q0" x="20" y="777.5">lifting force for takeoffs and landings.</text><text class="s q0" x="380" y="731">Ailerons: extend from about the midpoint of each</text><text class="s q0" x="380" y="746.5">wing out toward the tip. They move in opposite</text><text class="s q0" x="380" y="762">directions to create the aerodynamic forces that</text><text class="s q0" x="380" y="777.5">make the airplane roll.</text><rect class="cl" x="20" y="801" width="690" height="123.5" rx="8"/><circle cx="35" cy="823" r="2.2" class="ah"/><text class="s q0" x="44" y="827">Principal structural parts of the wing: spars, ribs and stringers, reinforced by trusses, I-beams,</text><text class="s q0" x="44" y="842.5">tubing or other devices, including the skin</text><circle cx="35" cy="858" r="2.2" class="ah"/><text class="s q0" x="44" y="862">The wing ribs determine the shape and thickness of the wing (airfoil)</text><circle cx="35" cy="877.5" r="2.2" class="ah"/><text class="s q0" x="44" y="881.5">In most modern airplanes the fuel tanks are an integral part of the wing structure or flexible</text><text class="s q0" x="44" y="897">containers mounted inside the wing</text></svg>
