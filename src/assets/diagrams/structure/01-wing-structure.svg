<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 938" role="img" aria-labelledby="ti de"><title id="ti">Wings: where they attach, how many, how they are held</title><desc id="de">High-wing, mid-wing and low-wing mean the wing is attached at the top, middle or lower fuselage. A monoplane has one set of wings, a biplane two. Semi-cantilever high wings use external wing struts attached about halfway out; full cantilever wings carry loads without struts. Spars, ribs and stringers are the principal wing structure and the ribs set the airfoil shape. Flaps run from the fuselage to near the midpoint of the wing and move down together; ailerons run from about the midpoint to the tip and move in opposite directions.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><text class="t" x="20" y="28" style="font-size:15px">Wings: where they attach, how many, how they are held</text><text class="s" x="20" y="50.0" style="font-size:13px">The wings are airfoils attached to each side of the fuselage and are the main lifting surfaces that</text><text class="s" x="20" y="66.5" style="font-size:13px">support the airplane in flight. Front views below are schematic.</text><rect x="20" y="93.0" width="220" height="140.0" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="130.0" y="112.0" style="font-size:13px">High-wing</text><ellipse cx="130.0" cy="158.0" rx="15" ry="26" class="cl" style="stroke:currentColor;stroke-width:1.6"/><rect x="40.0" y="128.5" width="180" height="7" rx="3" class="lav" style="stroke:currentColor;stroke-width:1.6;stroke-linejoin:round"/><text class="s m" x="130.0" y="207.0" style="font-size:11.5px">Wing attached at the top of the</text><text class="s m" x="130.0" y="222.0" style="font-size:11.5px">fuselage</text><rect x="255" y="93.0" width="220" height="140.0" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="365.0" y="112.0" style="font-size:13px">Mid-wing</text><ellipse cx="365.0" cy="158.0" rx="15" ry="26" class="cl" style="stroke:currentColor;stroke-width:1.6"/><rect x="275.0" y="154.5" width="180" height="7" rx="3" class="lav" style="stroke:currentColor;stroke-width:1.6;stroke-linejoin:round"/><text class="s m" x="365.0" y="207.0" style="font-size:11.5px">Wing attached at the middle of</text><text class="s m" x="365.0" y="222.0" style="font-size:11.5px">the fuselage</text><rect x="490" y="93.0" width="220" height="140.0" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="600.0" y="112.0" style="font-size:13px">Low-wing</text><ellipse cx="600.0" cy="158.0" rx="15" ry="26" class="cl" style="stroke:currentColor;stroke-width:1.6"/><rect x="510.0" y="178.5" width="180" height="7" rx="3" class="lav" style="stroke:currentColor;stroke-width:1.6;stroke-linejoin:round"/><text class="s m" x="600.0" y="207.0" style="font-size:11.5px">Wing attached at the lower</text><text class="s m" x="600.0" y="222.0" style="font-size:11.5px">portion of the fuselage</text><rect x="20" y="243.0" width="337" height="125.0" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="188.5" y="262.0" style="font-size:13px">Monoplane</text><ellipse cx="188.5" cy="308.0" rx="15" ry="26" class="cl" style="stroke:currentColor;stroke-width:1.6"/><rect x="88.5" y="304.5" width="200" height="7" rx="3" class="lav" style="stroke:currentColor;stroke-width:1.6;stroke-linejoin:round"/><text class="s m" x="188.5" y="357.0" style="font-size:11.5px">A single set of wings</text><rect x="373" y="243.0" width="337" height="125.0" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="541.5" y="262.0" style="font-size:13px">Biplane</text><ellipse cx="541.5" cy="308.0" rx="15" ry="26" class="cl" style="stroke:currentColor;stroke-width:1.6"/><rect x="441.5" y="280.5" width="200" height="7" rx="3" class="lav" style="stroke:currentColor;stroke-width:1.6;stroke-linejoin:round"/><rect x="441.5" y="328.5" width="200" height="7" rx="3" class="lav" style="stroke:currentColor;stroke-width:1.6;stroke-linejoin:round"/><path d="M481.5 284.0L481.5 332.0" class="dk" style="stroke-width:2;opacity:0.9"/><path d="M601.5 284.0L601.5 332.0" class="dk" style="stroke-width:2;opacity:0.9"/><text class="s m" x="541.5" y="357.0" style="font-size:11.5px">Two sets of wings</text><rect x="20" y="378.0" width="337" height="155.0" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="188.5" y="397.0" style="font-size:13px">Semi-cantilever (high wing with struts)</text><ellipse cx="188.5" cy="443.0" rx="15" ry="26" class="cl" style="stroke:currentColor;stroke-width:1.6"/><rect x="88.5" y="413.5" width="200" height="7" rx="3" class="lav" style="stroke:currentColor;stroke-width:1.6;stroke-linejoin:round"/><path d="M178.5 459.0L133.5 419.0" class="dk" style="stroke-width:2.5;opacity:0.95"/><path d="M198.5 459.0L243.5 419.0" class="dk" style="stroke-width:2.5;opacity:0.95"/><text class="s" x="250.5" y="439.0" style="font-size:11.5px">strut</text><text class="s m" x="188.5" y="492.0" style="font-size:11.5px">External braces called wing struts carry flight and</text><text class="s m" x="188.5" y="507.0" style="font-size:11.5px">landing loads to the main fuselage structure; usually</text><text class="s m" x="188.5" y="522.0" style="font-size:11.5px">attached about halfway out on the wing</text><rect x="373" y="378.0" width="337" height="140.0" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="541.5" y="397.0" style="font-size:13px">Full cantilever</text><ellipse cx="541.5" cy="443.0" rx="15" ry="26" class="cl" style="stroke:currentColor;stroke-width:1.6"/><rect x="441.5" y="463.5" width="200" height="7" rx="3" class="lav" style="stroke:currentColor;stroke-width:1.6;stroke-linejoin:round"/><text class="s" x="653.5" y="470.0" style="font-size:11.5px">no struts</text><text class="s m" x="541.5" y="492.0" style="font-size:11.5px">Designed to carry the loads without external struts;</text><text class="s m" x="541.5" y="507.0" style="font-size:11.5px">a few high-wing and most low-wing airplanes</text><text class="t" x="20" y="551.0" style="font-size:13.5px">Inside and along the wing (top view of the right wing, schematic)</text><rect x="26" y="581.0" width="38" height="116.0" rx="14" class="cl" style="stroke:currentColor;stroke-width:1.6;stroke-linejoin:round"/><text class="s m" x="45" y="711.0" style="font-size:11px">Fuselage</text><path d="M64 591.0L690 595.0L690 675.0L64 677.0Z" class="sky" style="stroke:currentColor;stroke-width:1.8;stroke-linejoin:round"/><path d="M90 593.0L90 676.0" class="dk" style="stroke-width:1.4;opacity:0.7"/><path d="M145 593.0L145 676.0" class="dk" style="stroke-width:1.4;opacity:0.7"/><path d="M200 593.0L200 676.0" class="dk" style="stroke-width:1.4;opacity:0.7"/><path d="M255 593.0L255 676.0" class="dk" style="stroke-width:1.4;opacity:0.7"/><path d="M310 593.0L310 676.0" class="dk" style="stroke-width:1.4;opacity:0.7"/><path d="M365 593.0L365 676.0" class="dk" style="stroke-width:1.4;opacity:0.7"/><path d="M420 593.0L420 676.0" class="dk" style="stroke-width:1.4;opacity:0.7"/><path d="M475 593.0L475 676.0" class="dk" style="stroke-width:1.4;opacity:0.7"/><path d="M530 593.0L530 676.0" class="dk" style="stroke-width:1.4;opacity:0.7"/><path d="M585 593.0L585 676.0" class="dk" style="stroke-width:1.4;opacity:0.7"/><path d="M640 593.0L640 676.0" class="dk" style="stroke-width:1.4;opacity:0.7"/><path d="M64 616.8L690 619.0" class="dk" style="stroke-width:3;opacity:0.9"/><path d="M64 651.2L690 651.0" class="dk" style="stroke-width:3;opacity:0.9"/><path d="M64 603.04L690 606.2" class="dk" style="stroke-width:1;opacity:0.55"/><path d="M64 634.0L690 635.0" class="dk" style="stroke-width:1;opacity:0.55"/><path d="M64 664.96L690 663.8" class="dk" style="stroke-width:1;opacity:0.55"/><rect x="70" y="653.0" width="296" height="22" rx="3" class="mint" style="stroke:currentColor;stroke-width:1.8;stroke-linejoin:round"/><text class="t m" x="218" y="668.0" style="font-size:12px">Flap</text><rect x="380" y="653.0" width="304" height="22" rx="3" class="rose" style="stroke:currentColor;stroke-width:1.8;stroke-linejoin:round"/><text class="t m" x="532" y="668.0" style="font-size:12px">Aileron</text><text class="t m" x="190" y="569.0" style="font-size:12px">Ribs</text><path d="M190 573.0L200 611.0" class="dk" style="stroke-width:1.2;opacity:0.75"/><text class="t m" x="330" y="569.0" style="font-size:12px">Spars</text><path d="M330 573.0L330 614.8" class="dk" style="stroke-width:1.2;opacity:0.75"/><text class="t m" x="480" y="569.0" style="font-size:12px">Stringers</text><path d="M480 573.0L480 605.04" class="dk" style="stroke-width:1.2;opacity:0.75"/><text class="s" x="20" y="731.0" style="font-size:12px">Flaps: extend outward from the fuselage to near the</text><text class="s" x="20" y="746.5" style="font-size:12px">midpoint of each wing. Flush with the wing in</text><text class="s" x="20" y="762.0" style="font-size:12px">cruise; when extended they move down together to add</text><text class="s" x="20" y="777.5" style="font-size:12px">lifting force for takeoffs and landings.</text><text class="s" x="380" y="731.0" style="font-size:12px">Ailerons: extend from about the midpoint of each</text><text class="s" x="380" y="746.5" style="font-size:12px">wing out toward the tip. They move in opposite</text><text class="s" x="380" y="762.0" style="font-size:12px">directions to create the aerodynamic forces that</text><text class="s" x="380" y="777.5" style="font-size:12px">make the airplane roll.</text><rect class="cl" x="20" y="801.0" width="690" height="123.5" rx="8"/><circle cx="35" cy="823.0" r="2.2" class="ah"/><text class="s" x="44" y="827.0" style="font-size:12px">Principal structural parts of the wing: spars, ribs and stringers, reinforced by trusses, I-beams,</text><text class="s" x="44" y="842.5" style="font-size:12px">tubing or other devices, including the skin</text><circle cx="35" cy="858.0" r="2.2" class="ah"/><text class="s" x="44" y="862.0" style="font-size:12px">The wing ribs determine the shape and thickness of the wing (airfoil)</text><circle cx="35" cy="877.5" r="2.2" class="ah"/><text class="s" x="44" y="881.5" style="font-size:12px">In most modern airplanes the fuel tanks are an integral part of the wing structure or flexible</text><text class="s" x="44" y="897.0" style="font-size:12px">containers mounted inside the wing</text></svg>
