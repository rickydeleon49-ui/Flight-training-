<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 599" role="img" aria-labelledby="ti de"><title id="ti">Powerplant: engine, propeller and cowling</title><desc id="de">The powerplant usually includes the engine and the propeller. The engine turns the propeller, makes electrical power, gives a vacuum source for some instruments and heat for the cabin in most single-engine airplanes, and is covered by a cowling or nacelle that streamlines airflow and cools the cylinders. The propeller is a rotating airfoil: low pressure at its face and high pressure at its back produce thrust. Blade angle keeps the angle of attack relatively constant; pitch is the distance travelled per revolution in a solid.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><text class="t" x="20" y="28" style="font-size:15px">Powerplant: engine, propeller and cowling</text><text class="s" x="20" y="50.0" style="font-size:13px">The powerplant usually includes both the engine and the propeller.</text><rect x="20" y="76.5" width="337" height="220.0" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="188.5" y="95.5" style="font-size:13px">Where the pieces sit</text><path d="M66 164.5C94 150.5 164 148.5 204 150.5L204 210.5C164 212.5 94 210.5 66 196.5Z" class="sky" style="stroke:currentColor;stroke-width:1.8;stroke-linejoin:round"/><rect x="106" y="162.5" width="88" height="36" rx="4" class="cl" style="stroke:currentColor;stroke-width:1.5;stroke-linejoin:round"/><path d="M120 162.5L120 154.5" class="dk" style="stroke-width:3;opacity:0.9"/><path d="M142 162.5L142 154.5" class="dk" style="stroke-width:3;opacity:0.9"/><path d="M164 162.5L164 154.5" class="dk" style="stroke-width:3;opacity:0.9"/><path d="M186 162.5L186 154.5" class="dk" style="stroke-width:3;opacity:0.9"/><text class="t m" x="150" y="184.5" style="font-size:12px">Engine</text><path d="M204 150.5L344 156.5" class="dk" style="stroke-width:1.8;opacity:0.8"/><path d="M204 210.5L344 204.5" class="dk" style="stroke-width:1.8;opacity:0.8"/><ellipse cx="54" cy="180.5" rx="6" ry="55" class="lav" style="stroke:currentColor;stroke-width:1.8"/><circle cx="54" cy="180.5" r="7" class="ah"/><path d="M68 160.5L93.0 160.5" class="dk" style="stroke-width:2"/><path d="M100 160.5L93.0 163.7L93.0 157.3Z" class="dh" style=""/><path d="M68 200.5L93.0 200.5" class="dk" style="stroke-width:2"/><path d="M100 200.5L93.0 203.7L93.0 197.3Z" class="dh" style=""/><path d="M174 126.5L93.0 126.5" class="acc" style="stroke-width:3"/><path d="M84 126.5L93.0 122.5L93.0 130.6Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><text class="t m" x="129" y="118.5" style="font-size:11.5px">Thrust (forward)</text><text class="t m" x="54" y="250.5" style="font-size:11.5px">Propeller</text><path d="M54 240.5L54 236.5" class="dk" style="stroke-width:1.2;opacity:0.75"/><text class="t m" x="159" y="250.5" style="font-size:11.5px">Cowling or nacelle</text><path d="M159 240.5L159 212.5" class="dk" style="stroke-width:1.2;opacity:0.75"/><text class="s m" x="188.5" y="270.5" style="font-size:11.5px">Engine turns the propeller; the cowling covers the</text><text class="s m" x="188.5" y="285.5" style="font-size:11.5px">engine</text><rect x="373" y="76.5" width="337" height="235.0" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="541.5" y="95.5" style="font-size:13px">How the propeller makes thrust</text><ellipse cx="551.5" cy="172.5" rx="10" ry="52" transform="rotate(-12 551.5 172.5)" class="lav" style="stroke:currentColor;stroke-width:1.8"/><text class="t e" x="521.5" y="138.5" style="font-size:11.5px">Low pressure</text><text class="t e" x="521.5" y="152.5" style="font-size:11.5px">at the face</text><text class="t" x="581.5" y="206.5" style="font-size:11.5px">High pressure</text><text class="t" x="581.5" y="220.5" style="font-size:11.5px">at the back</text><path d="M531.5 232.5L460.5 232.5" class="acc" style="stroke-width:3"/><path d="M451.5 232.5L460.5 228.4L460.5 236.6Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><text class="t m" x="491.5" y="248.5" style="font-size:11.5px">Thrust</text><text class="s m" x="541.5" y="270.5" style="font-size:11.5px">A propeller is a rotating airfoil. The pressure</text><text class="s m" x="541.5" y="285.5" style="font-size:11.5px">difference between face and back produces thrust,</text><text class="s m" x="541.5" y="300.5" style="font-size:11.5px">which pulls the airplane forward</text><rect x="20" y="321.5" width="337" height="24" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30" y="338.5" style="font-size:13px">Engine</text><circle cx="31" cy="359.5" r="2.2" class="ah"/><text class="s" x="40" y="363.5" style="font-size:12px">Primary function: provide the power to turn the</text><text class="s" x="40" y="379.0" style="font-size:12px">propeller</text><circle cx="31" cy="394.5" r="2.2" class="ah"/><text class="s" x="40" y="398.5" style="font-size:12px">Also generates electrical power</text><circle cx="31" cy="414.0" r="2.2" class="ah"/><text class="s" x="40" y="418.0" style="font-size:12px">Provides a vacuum source for some flight</text><text class="s" x="40" y="433.5" style="font-size:12px">instruments</text><circle cx="31" cy="449.0" r="2.2" class="ah"/><text class="s" x="40" y="453.0" style="font-size:12px">In most single-engine airplanes, provides heat</text><text class="s" x="40" y="468.5" style="font-size:12px">for the pilot and passengers</text><circle cx="31" cy="484.0" r="2.2" class="ah"/><text class="s" x="40" y="488.0" style="font-size:12px">Covered by a cowling or a nacelle: streamlines</text><text class="s" x="40" y="503.5" style="font-size:12px">the airflow around the engine and helps cool it</text><text class="s" x="40" y="519.0" style="font-size:12px">by ducting air around the cylinders</text><rect x="373" y="321.5" width="337" height="24" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="383" y="338.5" style="font-size:13px">Propeller</text><circle cx="384" cy="359.5" r="2.2" class="ah"/><text class="s" x="393" y="363.5" style="font-size:12px">Mounted on the front of the engine; turns its</text><text class="s" x="393" y="379.0" style="font-size:12px">rotating force into thrust, a forward-acting</text><text class="s" x="393" y="394.5" style="font-size:12px">force</text><circle cx="384" cy="410.0" r="2.2" class="ah"/><text class="s" x="393" y="414.0" style="font-size:12px">Engines may be turned around to be pushers, with</text><text class="s" x="393" y="429.5" style="font-size:12px">the propeller at the rear</text><circle cx="384" cy="445.0" r="2.2" class="ah"/><text class="s" x="393" y="449.0" style="font-size:12px">Blade angle, measured against the hub, keeps the</text><text class="s" x="393" y="464.5" style="font-size:12px">angle of attack relatively constant along the</text><text class="s" x="393" y="480.0" style="font-size:12px">blade and reduces or eliminates the chance of a</text><text class="s" x="393" y="495.5" style="font-size:12px">stall</text><circle cx="384" cy="511.0" r="2.2" class="ah"/><text class="s" x="393" y="515.0" style="font-size:12px">Pitch: the distance a propeller would travel in</text><text class="s" x="393" y="530.5" style="font-size:12px">one revolution if turning in a solid</text><circle cx="384" cy="546.0" r="2.2" class="ah"/><text class="s" x="393" y="550.0" style="font-size:12px">Matched to a specific aircraft and powerplant for</text><text class="s" x="393" y="565.5" style="font-size:12px">best efficiency at a particular power setting</text></svg>
