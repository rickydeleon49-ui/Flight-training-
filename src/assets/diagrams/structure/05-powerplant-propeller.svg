<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 599" role="img" aria-labelledby="ti de"><title id="ti">Powerplant: engine, propeller and cowling</title><desc id="de">The powerplant usually includes the engine and the propeller. The engine turns the propeller, makes electrical power, gives a vacuum source for some instruments and heat for the cabin in most single-engine airplanes, and is covered by a cowling or nacelle that streamlines airflow and cools the cylinders. The propeller is a rotating airfoil: low pressure at its face and high pressure at its back produce thrust. Blade angle keeps the angle of attack relatively constant; pitch is the distance travelled per revolution in a solid.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:12px}.q1{font-size:11.5px}.q2{font-size:13px}.q3{stroke:currentColor;stroke-width:1.5}.q4{stroke-width:3;opacity:0.9}.q5{stroke-width:1.8;opacity:0.8}.q6{stroke:currentColor;stroke-width:1.8}.q7{fill:var(--palette-berry,#A84C6B)}.q8{stroke-width:1.2;opacity:0.75}</style><text class="t" x="20" y="28" style="font-size:15px">Powerplant: engine, propeller and cowling</text><text class="s q2" x="20" y="50">The powerplant usually includes both the engine and the propeller.</text><rect x="20" y="76.5" width="337" height="220" rx="10" class="sky q3"/><text class="t m q2" x="188.5" y="95.5">Where the pieces sit</text><path d="M66 164.5C94 150.5 164 148.5 204 150.5L204 210.5C164 212.5 94 210.5 66 196.5Z" class="sky" style="stroke:currentColor;stroke-width:1.8;stroke-linejoin:round"/><rect x="106" y="162.5" width="88" height="36" rx="4" class="cl" style="stroke:currentColor;stroke-width:1.5;stroke-linejoin:round"/><path d="M120 162.5L120 154.5" class="dk q4"/><path d="M142 162.5L142 154.5" class="dk q4"/><path d="M164 162.5L164 154.5" class="dk q4"/><path d="M186 162.5L186 154.5" class="dk q4"/><text class="t m q0" x="150" y="184.5">Engine</text><path d="M204 150.5L344 156.5" class="dk q5"/><path d="M204 210.5L344 204.5" class="dk q5"/><ellipse cx="54" cy="180.5" rx="6" ry="55" class="lav q6"/><circle cx="54" cy="180.5" r="7" class="ah"/><path d="M68 160.5L93 160.5" class="dk" style="stroke-width:2"/><path d="M100 160.5L93 163.7L93 157.3Z" class="dh" style=""/><path d="M68 200.5L93 200.5" class="dk" style="stroke-width:2"/><path d="M100 200.5L93 203.7L93 197.3Z" class="dh" style=""/><path d="M174 126.5L93 126.5" class="acc" style="stroke-width:3"/><path d="M84 126.5L93 122.5L93 130.6Z" class="dh q7"/><text class="t m q1" x="129" y="118.5">Thrust (forward)</text><text class="t m q1" x="54" y="250.5">Propeller</text><path d="M54 240.5L54 236.5" class="dk q8"/><text class="t m q1" x="159" y="250.5">Cowling or nacelle</text><path d="M159 240.5L159 212.5" class="dk q8"/><text class="s m q1" x="188.5" y="270.5">Engine turns the propeller; the cowling covers the</text><text class="s m q1" x="188.5" y="285.5">engine</text><rect x="373" y="76.5" width="337" height="235" rx="10" class="mint q3"/><text class="t m q2" x="541.5" y="95.5">How the propeller makes thrust</text><ellipse cx="551.5" cy="172.5" rx="10" ry="52" transform="rotate(-12 551.5 172.5)" class="lav q6"/><text class="t e q1" x="521.5" y="138.5">Low pressure</text><text class="t e q1" x="521.5" y="152.5">at the face</text><text class="t q1" x="581.5" y="206.5">High pressure</text><text class="t q1" x="581.5" y="220.5">at the back</text><path d="M531.5 232.5L460.5 232.5" class="acc" style="stroke-width:3"/><path d="M451.5 232.5L460.5 228.4L460.5 236.6Z" class="dh q7"/><text class="t m q1" x="491.5" y="248.5">Thrust</text><text class="s m q1" x="541.5" y="270.5">A propeller is a rotating airfoil. The pressure</text><text class="s m q1" x="541.5" y="285.5">difference between face and back produces thrust,</text><text class="s m q1" x="541.5" y="300.5">which pulls the airplane forward</text><rect x="20" y="321.5" width="337" height="24" rx="10" class="lav q3"/><text class="t q2" x="30" y="338.5">Engine</text><circle cx="31" cy="359.5" r="2.2" class="ah"/><text class="s q0" x="40" y="363.5">Primary function: provide the power to turn the</text><text class="s q0" x="40" y="379">propeller</text><circle cx="31" cy="394.5" r="2.2" class="ah"/><text class="s q0" x="40" y="398.5">Also generates electrical power</text><circle cx="31" cy="414" r="2.2" class="ah"/><text class="s q0" x="40" y="418">Provides a vacuum source for some flight</text><text class="s q0" x="40" y="433.5">instruments</text><circle cx="31" cy="449" r="2.2" class="ah"/><text class="s q0" x="40" y="453">In most single-engine airplanes, provides heat</text><text class="s q0" x="40" y="468.5">for the pilot and passengers</text><circle cx="31" cy="484" r="2.2" class="ah"/><text class="s q0" x="40" y="488">Covered by a cowling or a nacelle: streamlines</text><text class="s q0" x="40" y="503.5">the airflow around the engine and helps cool it</text><text class="s q0" x="40" y="519">by ducting air around the cylinders</text><rect x="373" y="321.5" width="337" height="24" rx="10" class="rose q3"/><text class="t q2" x="383" y="338.5">Propeller</text><circle cx="384" cy="359.5" r="2.2" class="ah"/><text class="s q0" x="393" y="363.5">Mounted on the front of the engine; turns its</text><text class="s q0" x="393" y="379">rotating force into thrust, a forward-acting</text><text class="s q0" x="393" y="394.5">force</text><circle cx="384" cy="410" r="2.2" class="ah"/><text class="s q0" x="393" y="414">Engines may be turned around to be pushers, with</text><text class="s q0" x="393" y="429.5">the propeller at the rear</text><circle cx="384" cy="445" r="2.2" class="ah"/><text class="s q0" x="393" y="449">Blade angle, measured against the hub, keeps the</text><text class="s q0" x="393" y="464.5">angle of attack relatively constant along the</text><text class="s q0" x="393" y="480">blade and reduces or eliminates the chance of a</text><text class="s q0" x="393" y="495.5">stall</text><circle cx="384" cy="511" r="2.2" class="ah"/><text class="s q0" x="393" y="515">Pitch: the distance a propeller would travel in</text><text class="s q0" x="393" y="530.5">one revolution if turning in a solid</text><circle cx="384" cy="546" r="2.2" class="ah"/><text class="s q0" x="393" y="550">Matched to a specific aircraft and powerplant for</text><text class="s q0" x="393" y="565.5">best efficiency at a particular power setting</text></svg>
