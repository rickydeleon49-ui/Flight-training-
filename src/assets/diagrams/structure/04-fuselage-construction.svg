<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 644" role="img" aria-labelledby="ti de"><title id="ti">Fuselage construction: truss, monocoque, semimonocoque</title><desc id="de">Fuselage construction evolved from wood truss structures to monocoque shells to today's semimonocoque shells. A truss uses welded tubing longerons and struts and lacks a streamlined shape. A monocoque stressed skin carries almost all loads like a beverage can, but tolerates surface dents poorly. A semimonocoque adds bulkheads, formers and stringers under the stressed skin to take some bending stress. The main fuselage section has the wing attachment points and a firewall.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style>
<text class="t" x="20" y="28" style="font-size:15px">Fuselage construction: truss, monocoque, semimonocoque</text>
<text class="s" x="20" y="50.0" style="font-size:13px">The fuselage is the central body of the airplane. It holds the crew, passengers and cargo and is the</text>
<text class="s" x="20" y="66.5" style="font-size:13px">structural connection for the wings and tail. Cross-sections below are schematic.</text>
<text class="t" x="20" y="97.0" style="font-size:13.5px">How construction evolved</text>
<rect x="20" y="107.0" width="190" height="34" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="115.0" y="128.0" style="font-size:12px">Wood truss structures</text>
<path d="M214 124.0L258.0 124.0" class="dk" style="stroke-width:2"/><path d="M266 124.0L258.0 127.6L258.0 120.4Z" class="dh" style=""/>
<rect x="270" y="107.0" width="190" height="34" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="365.0" y="128.0" style="font-size:12px">Monocoque shell structures</text>
<path d="M464 124.0L508.0 124.0" class="dk" style="stroke-width:2"/><path d="M516 124.0L508.0 127.6L508.0 120.4Z" class="dh" style=""/>
<rect x="520" y="107.0" width="190" height="34" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="615.0" y="128.0" style="font-size:12px">Semimonocoque (current)</text>
<rect x="20" y="155.0" width="220" height="268.0" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="130.0" y="174.0" style="font-size:13px">Truss</text>
<rect x="90.0" y="195.0" width="80" height="80" class="cl" style="stroke:currentColor;stroke-width:2.2;stroke-linejoin:round"/>
<path d="M90.0 195.0L170.0 275.0" class="dk" style="stroke-width:1.5;opacity:0.8"/>
<path d="M170.0 195.0L90.0 275.0" class="dk" style="stroke-width:1.5;opacity:0.8"/>
<circle cx="90.0" cy="195.0" r="4.5" class="ah"/>
<circle cx="170.0" cy="195.0" r="4.5" class="ah"/>
<circle cx="90.0" cy="275.0" r="4.5" class="ah"/>
<circle cx="170.0" cy="275.0" r="4.5" class="ah"/>
<text class="t" x="28" y="215.0" style="font-size:11.5px">Strut</text>
<path d="M56 227.0L92.0 235.0" class="dk" style="stroke-width:1.2;opacity:0.75"/>
<text class="t" x="178.0" y="199.0" style="font-size:11.5px">Longeron</text>
<text class="s m" x="130.0" y="311.0" style="font-size:11px">Lengths of tubing called longerons</text>
<text class="s m" x="130.0" y="325.5" style="font-size:11px">are welded in place into a braced</text>
<text class="s m" x="130.0" y="340.0" style="font-size:11px">framework. Vertical and horizontal</text>
<text class="s m" x="130.0" y="354.5" style="font-size:11px">struts give a square or</text>
<text class="s m" x="130.0" y="369.0" style="font-size:11px">rectangular shape from the end;</text>
<text class="s m" x="130.0" y="383.5" style="font-size:11px">more struts resist stress from any</text>
<text class="s m" x="130.0" y="398.0" style="font-size:11px">direction. Drawback: it lacks a</text>
<text class="s m" x="130.0" y="412.5" style="font-size:11px">streamlined shape.</text>
<rect x="255" y="155.0" width="220" height="253.5" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="365.0" y="174.0" style="font-size:13px">Monocoque</text>
<circle cx="365.0" cy="235.0" r="42" class="cl" style="stroke:currentColor;stroke-width:6"/>
<text class="t" x="415.0" y="231.0" style="font-size:11.5px">Stressed</text>
<text class="t" x="415.0" y="245.0" style="font-size:11.5px">skin</text>
<text class="s m" x="365.0" y="311.0" style="font-size:11px">Stressed skin supports almost all</text>
<text class="s m" x="365.0" y="325.5" style="font-size:11px">loads, much like an aluminum</text>
<text class="s m" x="365.0" y="340.0" style="font-size:11px">beverage can. Very strong, but not</text>
<text class="s m" x="365.0" y="354.5" style="font-size:11px">tolerant of surface deformation.</text>
<text class="s m" x="365.0" y="369.0" style="font-size:11px">Skin carries most twisting and</text>
<text class="s m" x="365.0" y="383.5" style="font-size:11px">bending, so internal bracing is</text>
<text class="s m" x="365.0" y="398.0" style="font-size:11px">reduced, saving weight and space.</text>
<rect x="490" y="155.0" width="220" height="224.5" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="600.0" y="174.0" style="font-size:13px">Semimonocoque</text>
<circle cx="600.0" cy="235.0" r="42" class="cl" style="stroke:currentColor;stroke-width:3"/>
<circle cx="600.0" cy="235.0" r="34" class="dk" style="stroke-width:3;opacity:.8"/>
<circle cx="637.0" cy="235.0" r="2.4" class="ah"/>
<circle cx="632.0" cy="253.5" r="2.4" class="ah"/>
<circle cx="618.5" cy="267.0" r="2.4" class="ah"/>
<circle cx="600.0" cy="272.0" r="2.4" class="ah"/>
<circle cx="581.5" cy="267.0" r="2.4" class="ah"/>
<circle cx="568.0" cy="253.5" r="2.4" class="ah"/>
<circle cx="563.0" cy="235.0" r="2.4" class="ah"/>
<circle cx="568.0" cy="216.5" r="2.4" class="ah"/>
<circle cx="581.5" cy="203.0" r="2.4" class="ah"/>
<circle cx="600.0" cy="198.0" r="2.4" class="ah"/>
<circle cx="618.5" cy="203.0" r="2.4" class="ah"/>
<circle cx="632.0" cy="216.5" r="2.4" class="ah"/>
<text class="t" x="496" y="205.0" style="font-size:11.5px">Bulkhead</text>
<text class="t" x="496" y="218.0" style="font-size:11.5px">or former</text>
<path d="M550 223.0L570.0 229.0" class="dk" style="stroke-width:1.2;opacity:0.75"/>
<text class="t" x="650.0" y="205.0" style="font-size:11.5px">Stringers</text>
<path d="M660.0 209.0L633.0 215.0" class="dk" style="stroke-width:1.2;opacity:0.75"/>
<text class="t" x="650.0" y="265.0" style="font-size:11.5px">Skin</text>
<text class="s m" x="600.0" y="311.0" style="font-size:11px">Partial or one-half monocoque: a</text>
<text class="s m" x="600.0" y="325.5" style="font-size:11px">substructure of bulkheads or</text>
<text class="s m" x="600.0" y="340.0" style="font-size:11px">formers and stringers reinforces</text>
<text class="s m" x="600.0" y="354.5" style="font-size:11px">the stressed skin and takes some</text>
<text class="s m" x="600.0" y="369.0" style="font-size:11px">of the bending stress.</text>
<rect x="20" y="433.0" width="337" height="24" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="30" y="450.0" style="font-size:13px">From truss to stressed skin</text>
<circle cx="31" cy="471.0" r="2.2" class="ah"/>
<text class="s" x="40" y="475.0" style="font-size:12px">Designers began to enclose the truss members to</text>
<text class="s" x="40" y="490.5" style="font-size:12px">streamline the airplane and improve performance</text>
<circle cx="31" cy="506.0" r="2.2" class="ah"/>
<text class="s" x="40" y="510.0" style="font-size:12px">First with cloth fabric, later lightweight metals</text>
<text class="s" x="40" y="525.5" style="font-size:12px">such as aluminum</text>
<circle cx="31" cy="541.0" r="2.2" class="ah"/>
<text class="s" x="40" y="545.0" style="font-size:12px">In some cases the outside skin supports all or a</text>
<text class="s" x="40" y="560.5" style="font-size:12px">major part of the flight loads</text>
<circle cx="31" cy="576.0" r="2.2" class="ah"/>
<text class="s" x="40" y="580.0" style="font-size:12px">Most modern aircraft use a form of this stressed</text>
<text class="s" x="40" y="595.5" style="font-size:12px">skin structure: monocoque or semimonocoque</text>
<rect x="373" y="433.0" width="337" height="24" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="383" y="450.0" style="font-size:13px">Main fuselage section (semimonocoque)</text>
<circle cx="384" cy="471.0" r="2.2" class="ah"/>
<text class="s" x="393" y="475.0" style="font-size:12px">Includes wing attachment points and a firewall</text>
<circle cx="384" cy="490.5" r="2.2" class="ah"/>
<text class="s" x="393" y="494.5" style="font-size:12px">On single-engine airplanes the engine is usually</text>
<text class="s" x="393" y="510.0" style="font-size:12px">attached to the front of the fuselage</text>
<circle cx="384" cy="525.5" r="2.2" class="ah"/>
<text class="s" x="393" y="529.5" style="font-size:12px">Firewall: a fireproof partition between the rear</text>
<text class="s" x="393" y="545.0" style="font-size:12px">of the engine and the flight deck or cabin, to</text>
<text class="s" x="393" y="560.5" style="font-size:12px">protect the people aboard from accidental engine</text>
<text class="s" x="393" y="576.0" style="font-size:12px">fires</text>
<circle cx="384" cy="591.5" r="2.2" class="ah"/>
<text class="s" x="393" y="595.5" style="font-size:12px">Usually made of heat-resistant material such as</text>
<text class="s" x="393" y="611.0" style="font-size:12px">stainless steel</text>
</svg>
