<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 644" role="img" aria-labelledby="ti de"><title id="ti">Fuselage construction: truss, monocoque, semimonocoque</title><desc id="de">Fuselage construction evolved from wood truss structures to monocoque shells to today's semimonocoque shells. A truss uses welded tubing longerons and struts and lacks a streamlined shape. A monocoque stressed skin carries almost all loads like a beverage can, but tolerates surface dents poorly. A semimonocoque adds bulkheads, formers and stringers under the stressed skin to take some bending stress. The main fuselage section has the wing attachment points and a firewall.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:12px}.q1{font-size:11px}.q2{stroke:currentColor;stroke-width:1.5}.q3{font-size:11.5px}.q4{font-size:13px}.q5{stroke-width:1.2;opacity:0.75}.q6{stroke-width:1.5;opacity:0.8}</style><text class="t" x="20" y="28" style="font-size:15px">Fuselage construction: truss, monocoque, semimonocoque</text><text class="s q4" x="20" y="50">The fuselage is the central body of the airplane. It holds the crew, passengers and cargo and is the</text><text class="s q4" x="20" y="66.5">structural connection for the wings and tail. Cross-sections below are schematic.</text><text class="t" x="20" y="97" style="font-size:13.5px">How construction evolved</text><rect x="20" y="107" width="190" height="34" rx="10" class="sky q2"/><text class="t m q0" x="115" y="128">Wood truss structures</text><path d="M214 124L258 124" class="dk" style="stroke-width:2"/><path d="M266 124L258 127.6L258 120.4Z" class="dh" style=""/><rect x="270" y="107" width="190" height="34" rx="10" class="mint q2"/><text class="t m q0" x="365" y="128">Monocoque shell structures</text><path d="M464 124L508 124" class="dk" style="stroke-width:2"/><path d="M516 124L508 127.6L508 120.4Z" class="dh" style=""/><rect x="520" y="107" width="190" height="34" rx="10" class="lav q2"/><text class="t m q0" x="615" y="128">Semimonocoque (current)</text><rect x="20" y="155" width="220" height="268" rx="10" class="sky q2"/><text class="t m q4" x="130" y="174">Truss</text><rect x="90" y="195" width="80" height="80" class="cl" style="stroke:currentColor;stroke-width:2.2;stroke-linejoin:round"/><path d="M90 195L170 275" class="dk q6"/><path d="M170 195L90 275" class="dk q6"/><circle cx="90" cy="195" r="4.5" class="ah"/><circle cx="170" cy="195" r="4.5" class="ah"/><circle cx="90" cy="275" r="4.5" class="ah"/><circle cx="170" cy="275" r="4.5" class="ah"/><text class="t q3" x="28" y="215">Strut</text><path d="M56 227L92 235" class="dk q5"/><text class="t q3" x="178" y="199">Longeron</text><text class="s m q1" x="130" y="311">Lengths of tubing called longerons</text><text class="s m q1" x="130" y="325.5">are welded in place into a braced</text><text class="s m q1" x="130" y="340">framework. Vertical and horizontal</text><text class="s m q1" x="130" y="354.5">struts give a square or</text><text class="s m q1" x="130" y="369">rectangular shape from the end;</text><text class="s m q1" x="130" y="383.5">more struts resist stress from any</text><text class="s m q1" x="130" y="398">direction. Drawback: it lacks a</text><text class="s m q1" x="130" y="412.5">streamlined shape.</text><rect x="255" y="155" width="220" height="253.5" rx="10" class="mint q2"/><text class="t m q4" x="365" y="174">Monocoque</text><circle cx="365" cy="235" r="42" class="cl" style="stroke:currentColor;stroke-width:6"/><text class="t q3" x="415" y="231">Stressed</text><text class="t q3" x="415" y="245">skin</text><text class="s m q1" x="365" y="311">Stressed skin supports almost all</text><text class="s m q1" x="365" y="325.5">loads, much like an aluminum</text><text class="s m q1" x="365" y="340">beverage can. Very strong, but not</text><text class="s m q1" x="365" y="354.5">tolerant of surface deformation.</text><text class="s m q1" x="365" y="369">Skin carries most twisting and</text><text class="s m q1" x="365" y="383.5">bending, so internal bracing is</text><text class="s m q1" x="365" y="398">reduced, saving weight and space.</text><rect x="490" y="155" width="220" height="224.5" rx="10" class="lav q2"/><text class="t m q4" x="600" y="174">Semimonocoque</text><circle cx="600" cy="235" r="42" class="cl" style="stroke:currentColor;stroke-width:3"/><circle cx="600" cy="235" r="34" class="dk" style="stroke-width:3;opacity:.8"/><circle cx="637" cy="235" r="2.4" class="ah"/><circle cx="632" cy="253.5" r="2.4" class="ah"/><circle cx="618.5" cy="267" r="2.4" class="ah"/><circle cx="600" cy="272" r="2.4" class="ah"/><circle cx="581.5" cy="267" r="2.4" class="ah"/><circle cx="568" cy="253.5" r="2.4" class="ah"/><circle cx="563" cy="235" r="2.4" class="ah"/><circle cx="568" cy="216.5" r="2.4" class="ah"/><circle cx="581.5" cy="203" r="2.4" class="ah"/><circle cx="600" cy="198" r="2.4" class="ah"/><circle cx="618.5" cy="203" r="2.4" class="ah"/><circle cx="632" cy="216.5" r="2.4" class="ah"/><text class="t q3" x="496" y="205">Bulkhead</text><text class="t q3" x="496" y="218">or former</text><path d="M550 223L570 229" class="dk q5"/><text class="t q3" x="650" y="205">Stringers</text><path d="M660 209L633 215" class="dk q5"/><text class="t q3" x="650" y="265">Skin</text><text class="s m q1" x="600" y="311">Partial or one-half monocoque: a</text><text class="s m q1" x="600" y="325.5">substructure of bulkheads or</text><text class="s m q1" x="600" y="340">formers and stringers reinforces</text><text class="s m q1" x="600" y="354.5">the stressed skin and takes some</text><text class="s m q1" x="600" y="369">of the bending stress.</text><rect x="20" y="433" width="337" height="24" rx="10" class="sky q2"/><text class="t q4" x="30" y="450">From truss to stressed skin</text><circle cx="31" cy="471" r="2.2" class="ah"/><text class="s q0" x="40" y="475">Designers began to enclose the truss members to</text><text class="s q0" x="40" y="490.5">streamline the airplane and improve performance</text><circle cx="31" cy="506" r="2.2" class="ah"/><text class="s q0" x="40" y="510">First with cloth fabric, later lightweight metals</text><text class="s q0" x="40" y="525.5">such as aluminum</text><circle cx="31" cy="541" r="2.2" class="ah"/><text class="s q0" x="40" y="545">In some cases the outside skin supports all or a</text><text class="s q0" x="40" y="560.5">major part of the flight loads</text><circle cx="31" cy="576" r="2.2" class="ah"/><text class="s q0" x="40" y="580">Most modern aircraft use a form of this stressed</text><text class="s q0" x="40" y="595.5">skin structure: monocoque or semimonocoque</text><rect x="373" y="433" width="337" height="24" rx="10" class="rose q2"/><text class="t q4" x="383" y="450">Main fuselage section (semimonocoque)</text><circle cx="384" cy="471" r="2.2" class="ah"/><text class="s q0" x="393" y="475">Includes wing attachment points and a firewall</text><circle cx="384" cy="490.5" r="2.2" class="ah"/><text class="s q0" x="393" y="494.5">On single-engine airplanes the engine is usually</text><text class="s q0" x="393" y="510">attached to the front of the fuselage</text><circle cx="384" cy="525.5" r="2.2" class="ah"/><text class="s q0" x="393" y="529.5">Firewall: a fireproof partition between the rear</text><text class="s q0" x="393" y="545">of the engine and the flight deck or cabin, to</text><text class="s q0" x="393" y="560.5">protect the people aboard from accidental engine</text><text class="s q0" x="393" y="576">fires</text><circle cx="384" cy="591.5" r="2.2" class="ah"/><text class="s q0" x="393" y="595.5">Usually made of heat-resistant material such as</text><text class="s q0" x="393" y="611">stainless steel</text></svg>
