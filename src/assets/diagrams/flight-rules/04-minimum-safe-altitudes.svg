<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 592" role="img" aria-labelledby="ti de"><title id="ti">Minimum safe altitudes: anywhere, congested, other, and open water</title><desc id="de">Four side views of the minimum safe altitude rules. Anywhere: high enough to make an emergency landing without undue hazard to people or property on the surface. Over a congested area: 1,000 feet above the highest obstacle within 2,000 feet horizontally of the airplane. Other than a congested area: at least 500 feet above the surface. Over open water or sparsely populated areas: not closer than 500 feet to any person, vessel, vehicle or structure.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.h{font-size:15px}.c{font-size:17px}.n{font-size:14.5px}.sm{font-size:13.5px}.ln{stroke:currentColor;stroke-width:1.6;fill:none;stroke-linecap:round}.pl{stroke:currentColor;stroke-width:1.4;stroke-linejoin:round}.ds{stroke-dasharray:7 6}</style><text class="t" x="20" y="28" style="font-size:15px">Minimum safe altitudes</text><text class="s sm" x="20" y="50">Never lower than the rule for where you are. These are minimums, not targets.</text><rect class="cl" x="20" y="76" width="335" height="232" rx="8"/><text class="t c" x="32" y="102">Anywhere</text><path d="M30 226L345 226" class="ln"/><rect class="mint" x="30" y="226" width="315" height="14" rx="3"/><g transform="translate(110 146) scale(1.4)"><path d="M-16 -3L-24 -13L-19 -13L-10 -3Z" class="sky pl"/><ellipse cx="0" cy="0" rx="18" ry="5" class="sky pl"/><path d="M-3 0L2 7L6 7L4 0Z" class="sky pl"/><path d="M12 -5L12 -10" class="ln"/></g><path d="M135 154 C180 171 220 196 258 219" class="acc" style="stroke-width:3;stroke-dasharray:7 6"/><path d="M-6 -5L7 0L-6 5Z" class="ah" transform="translate(258 219) rotate(40)"/><rect class="rose" x="235" y="222" width="95" height="4" rx="2"/><text class="s sm m" x="300" y="198">Landing spot</text><text class="s n" x="32" y="264">High enough to land without undue</text><text class="s n" x="32" y="284">hazard to people or property if the engine quits.</text><rect class="cl" x="375" y="76" width="335" height="232" rx="8"/><text class="t c" x="387" y="102">Over a congested area</text><path d="M385 226L700 226" class="ln"/><rect class="mint" x="385" y="226" width="315" height="14" rx="3"/><rect class="lav pl" x="505" y="158" width="34" height="68"/><rect class="lav pl" x="435" y="194" width="40" height="32"/><rect class="lav pl" x="605" y="202" width="44" height="24"/><g transform="translate(522 130) scale(1.2)"><path d="M-16 -3L-24 -13L-19 -13L-10 -3Z" class="sky pl"/><ellipse cx="0" cy="0" rx="18" ry="5" class="sky pl"/><path d="M-3 0L2 7L6 7L4 0Z" class="sky pl"/><path d="M12 -5L12 -10" class="ln"/></g><path d="M522 142L522 156" class="ln ds"/><text class="t sm" x="535" y="154">1,000 ft</text><path d="M435 218L522 218M522 218L611 218" class="ln" style="display:none"/><text class="s n" x="387" y="264">1,000 ft above the highest obstacle within</text><text class="s n" x="387" y="284">2,000 ft horizontally of the airplane.</text><rect class="cl" x="20" y="320" width="335" height="232" rx="8"/><text class="t c" x="32" y="346">Other than a congested area</text><path d="M30 470L345 470" class="ln"/><rect class="mint" x="30" y="470" width="315" height="14" rx="3"/><path d="M30 470L140 470L190 448L250 470Z" class="mint pl" style="display:none"/><g transform="translate(188 372) scale(1.4)"><path d="M-16 -3L-24 -13L-19 -13L-10 -3Z" class="sky pl"/><ellipse cx="0" cy="0" rx="18" ry="5" class="sky pl"/><path d="M-3 0L2 7L6 7L4 0Z" class="sky pl"/><path d="M12 -5L12 -10" class="ln"/></g><path d="M188 386L188 466" class="ln ds"/><path d="M180 388L188 382L196 388M180 464L188 470L196 464" class="ln"/><text class="t sm" x="204" y="432">500 ft</text><text class="s n" x="32" y="508">At least 500 ft above the surface.</text><rect class="cl" x="375" y="320" width="335" height="232" rx="8"/><text class="t c" x="387" y="346">Open water or sparsely populated</text><path d="M385 470L700 470" class="ln"/><rect class="mint" x="385" y="470" width="315" height="14" rx="3"/><path d="M400 470A60 60 0 0 1 520 470" class="acc ds" style="stroke-width:2.5"/><rect class="lav pl" x="445" y="442" width="30" height="28"/><path d="M443 442L460 428L477 442Z" class="rose pl"/><g transform="translate(625 400) scale(1.4)"><path d="M-16 -3L-24 -13L-19 -13L-10 -3Z" class="sky pl"/><ellipse cx="0" cy="0" rx="18" ry="5" class="sky pl"/><path d="M-3 0L2 7L6 7L4 0Z" class="sky pl"/><path d="M12 -5L12 -10" class="ln"/></g><path d="M607 408L485 455" class="ln ds"/><text class="t sm" x="585" y="450">500 ft or more</text><text class="s n" x="387" y="508">Not closer than 500 ft to any person,</text><text class="s n" x="387" y="528">vessel, vehicle or structure.</text><text class="s sm" x="20" y="580">Source: 14 CFR 91.119</text></svg>