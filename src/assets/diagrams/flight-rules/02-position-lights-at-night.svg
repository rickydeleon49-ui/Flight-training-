<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 670" role="img" aria-labelledby="ti de"><title id="ti">Position lights at night: what red, green and white tell you</title><desc id="de">A top view of an airplane shows a red light on the left wingtip, a green light on the right wingtip and a white light on the tail. Four small views explain what you see at night. Red on your right with green on your left: the aircraft is coming toward you. Red only: it is crossing from your right to your left. Green only: it is crossing from your left to your right. White only: it is moving away from you or you are overtaking it.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.h{font-size:15px}.c{font-size:17px}.n{font-size:14.5px}.sm{font-size:13.5px}.ln{stroke:currentColor;stroke-width:1.6;fill:none;stroke-linecap:round}.pl{stroke:currentColor;stroke-width:1.4;stroke-linejoin:round}.ds{stroke-dasharray:7 6}</style><text class="t" x="20" y="28" style="font-size:15px">Position lights at night: reading what you see</text><text class="s sm" x="20" y="50">Red on the left wingtip, green on the right wingtip, white at the tail.</text><rect class="cl" x="20" y="70" width="690" height="190" rx="8"/><text class="t n" x="34" y="96">The lights on an airplane (top view, nose up)</text><path d="M365 126L374 144L374 198L390 218L390 226L365 221L340 226L340 218L356 198L356 144Z" class="sky pl"/><path d="M356 151L245 171L245 189L356 182ZM374 151L485 171L485 189L374 182Z" class="sky pl"/><circle cx="245" cy="180" r="9" fill="#D13B3B" class="pl"/><circle cx="485" cy="180" r="9" fill="#2E9E4F" class="pl"/><circle cx="365" cy="224" r="7" fill="#FFFFFF" class="pl"/><text class="t n e" x="229" y="185">Red: left wingtip</text><text class="t n" x="501" y="185">Green: right wingtip</text><text class="t n" x="385" y="244">White: tail</text><rect class="cl" x="20" y="272" width="690" height="84" rx="8"/><rect x="30" y="282" width="150" height="64" rx="6" fill="#10172b"/><circle cx="75" cy="308" r="7" fill="#2E9E4F"/><circle cx="135" cy="308" r="7" fill="#D13B3B"/><text class="t n" x="196" y="300">Red on the right, green on the left</text><text class="s n" x="196" y="322">It is coming toward you.</text><text class="s sm" x="196" y="342">You see its nose: its left wing (red) is on your right.</text><rect class="cl" x="20" y="364" width="690" height="84" rx="8"/><rect x="30" y="374" width="150" height="64" rx="6" fill="#10172b"/><circle cx="105" cy="400" r="7" fill="#D13B3B"/><path d="M150 422L60 422" stroke="#E8ECF5" stroke-width="2.5" stroke-linecap="round"/><path d="M56 422L66 417L66 427Z" fill="#E8ECF5"/><text class="t n" x="196" y="392">Red only</text><text class="s n" x="196" y="414">It is crossing in front of you, right to left.</text><text class="s sm" x="196" y="434">You see its left side.</text><rect class="cl" x="20" y="456" width="690" height="84" rx="8"/><rect x="30" y="466" width="150" height="64" rx="6" fill="#10172b"/><circle cx="105" cy="492" r="7" fill="#2E9E4F"/><path d="M60 514L150 514" stroke="#E8ECF5" stroke-width="2.5" stroke-linecap="round"/><path d="M154 514L144 509L144 519Z" fill="#E8ECF5"/><text class="t n" x="196" y="484">Green only</text><text class="s n" x="196" y="506">It is crossing in front of you, left to right.</text><text class="s sm" x="196" y="526">You see its right side.</text><rect class="cl" x="20" y="548" width="690" height="84" rx="8"/><rect x="30" y="558" width="150" height="64" rx="6" fill="#10172b"/><circle cx="105" cy="584" r="7" fill="#FFFFFF"/><text class="t n" x="196" y="576">White only</text><text class="s n" x="196" y="598">It is moving away, or you are catching up to it.</text><text class="s sm" x="196" y="618">You see its tail. If you overtake it, pass on the right.</text><text class="s sm" x="20" y="658">Source: Airplane Flying Handbook ch. 11</text></svg>