<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 632" role="img" aria-labelledby="ti de"><title id="ti">Taxiing in the wind: control positions for a tricycle-gear airplane</title><desc id="de">Four top views of a tricycle-gear airplane show where to hold the controls while taxiing. Quartering headwind from the left: left aileron up, right aileron down, elevator neutral. Quartering headwind from the right: right aileron up, left aileron down, elevator neutral. Quartering tailwind from the left: left aileron down, right aileron up, elevator down. Quartering tailwind from the right: right aileron down, left aileron up, elevator down.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.h{font-size:15px}.c{font-size:17px}.n{font-size:14.5px}.sm{font-size:13.5px}.ln{stroke:currentColor;stroke-width:1.6;fill:none;stroke-linecap:round}.pl{stroke:currentColor;stroke-width:1.4;stroke-linejoin:round}.ds{stroke-dasharray:7 6}</style><text class="t" x="20" y="28" style="font-size:15px">Taxiing a tricycle-gear airplane in the wind</text><text class="s sm" x="20" y="50">Set the controls for where the wind is coming from, and keep them there as you turn.</text><text class="s sm" x="20" y="69">Climb into a headwind. Dive away from a tailwind.</text><rect class="cl" x="20" y="90" width="335" height="232" rx="8"/><text class="t n" x="32" y="114">Quartering headwind from the left</text><text class="s sm" x="32" y="134">Left aileron up, elevator neutral</text><path d="M188 160L196 178L196 228L210 246L210 252L188 248L166 252L166 246L180 228L180 178Z" class="sky pl"/><path d="M180 186L98 204L98 220L180 214ZM196 186L278 204L278 220L196 214Z" class="sky pl"/><rect x="98" y="216" width="35" height="8" class="mint pl"/><text class="t sm m" x="115" y="240">Up</text><rect x="243" y="216" width="35" height="8" class="rose pl"/><text class="t sm m" x="260" y="240">Down</text><rect x="168" y="248" width="40" height="9" class="cl pl"/><text class="t sm m" x="188" y="274">Elevator neutral</text><path d="M44 160L92 200" class="acc" style="stroke-width:3"/><path d="M-6 -5L7 0L-6 5Z" class="ah" transform="translate(92 200) rotate(40)"/><text class="t sm" x="44" y="152">Wind</text><rect class="cl" x="375" y="90" width="335" height="232" rx="8"/><text class="t n" x="387" y="114">Quartering headwind from the right</text><text class="s sm" x="387" y="134">Right aileron up, elevator neutral</text><path d="M543 160L551 178L551 228L565 246L565 252L543 248L521 252L521 246L535 228L535 178Z" class="sky pl"/><path d="M535 186L453 204L453 220L535 214ZM551 186L633 204L633 220L551 214Z" class="sky pl"/><rect x="453" y="216" width="35" height="8" class="rose pl"/><text class="t sm m" x="470" y="240">Down</text><rect x="598" y="216" width="35" height="8" class="mint pl"/><text class="t sm m" x="615" y="240">Up</text><rect x="523" y="248" width="40" height="9" class="cl pl"/><text class="t sm m" x="543" y="274">Elevator neutral</text><path d="M686 160L638 200" class="acc" style="stroke-width:3"/><path d="M-6 -5L7 0L-6 5Z" class="ah" transform="translate(638 200) rotate(140)"/><text class="t sm e" x="686" y="152">Wind</text><rect class="cl" x="20" y="334" width="335" height="232" rx="8"/><text class="t n" x="32" y="358">Quartering tailwind from the left</text><text class="s sm" x="32" y="378">Left aileron down, elevator down</text><path d="M188 404L196 422L196 472L210 490L210 496L188 492L166 496L166 490L180 472L180 422Z" class="sky pl"/><path d="M180 430L98 448L98 464L180 458ZM196 430L278 448L278 464L196 458Z" class="sky pl"/><rect x="98" y="460" width="35" height="8" class="rose pl"/><text class="t sm m" x="115" y="484">Down</text><rect x="243" y="460" width="35" height="8" class="mint pl"/><text class="t sm m" x="260" y="484">Up</text><rect x="168" y="492" width="40" height="9" class="rose pl"/><text class="t sm m" x="188" y="518">Elevator down</text><path d="M44 530L92 490" class="acc" style="stroke-width:3"/><path d="M-6 -5L7 0L-6 5Z" class="ah" transform="translate(92 490) rotate(-40)"/><text class="t sm" x="44" y="550">Wind</text><rect class="cl" x="375" y="334" width="335" height="232" rx="8"/><text class="t n" x="387" y="358">Quartering tailwind from the right</text><text class="s sm" x="387" y="378">Right aileron down, elevator down</text><path d="M543 404L551 422L551 472L565 490L565 496L543 492L521 496L521 490L535 472L535 422Z" class="sky pl"/><path d="M535 430L453 448L453 464L535 458ZM551 430L633 448L633 464L551 458Z" class="sky pl"/><rect x="453" y="460" width="35" height="8" class="mint pl"/><text class="t sm m" x="470" y="484">Up</text><rect x="598" y="460" width="35" height="8" class="rose pl"/><text class="t sm m" x="615" y="484">Down</text><rect x="523" y="492" width="40" height="9" class="rose pl"/><text class="t sm m" x="543" y="518">Elevator down</text><path d="M686 530L638 490" class="acc" style="stroke-width:3"/><path d="M-6 -5L7 0L-6 5Z" class="ah" transform="translate(638 490) rotate(-140)"/><text class="t sm e" x="686" y="550">Wind</text><text class="s sm" x="20" y="590">Aileron up on the side the wind comes from for a headwind; aileron down on that side for a tailwind.</text><text class="s sm" x="20" y="620">Source: Airplane Flying Handbook ch. 2</text></svg>