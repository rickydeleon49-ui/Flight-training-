<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 578" role="img" aria-labelledby="ti de"><title id="ti">Basic VFR weather minimums for a private pilot</title><desc id="de">A table of flight visibility and cloud clearance. Class B: 3 statute miles, clear of clouds. Class C, D and E below 10,000 feet MSL: 3 miles, 500 feet below, 1,000 above, 2,000 horizontal. Class E at or above 10,000 feet MSL: 5 miles, 1,000 below, 1,000 above, 1 mile horizontal. Class G at or below 1,200 feet AGL: day 1 mile clear of clouds, night 3 miles with 500, 1,000 and 2,000. Class G above 1,200 feet AGL and below 10,000 MSL: day 1 mile, night 3 miles, with 500, 1,000 and 2,000. Class G above 1,200 AGL at or above 10,000 MSL: 5 miles, 1,000, 1,000 and 1 mile.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.h{font-size:15px}.c{font-size:17px}.n{font-size:14.5px}.sm{font-size:13.5px}.ln{stroke:currentColor;stroke-width:1.6;fill:none;stroke-linecap:round}.pl{stroke:currentColor;stroke-width:1.4;stroke-linejoin:round}.ds{stroke-dasharray:7 6}</style><text class="t" x="20" y="28" style="font-size:15px">Basic VFR weather minimums (private pilot)</text><text class="s sm" x="20" y="50">Flight visibility in statute miles (SM) and distance from clouds. Altitudes are MSL unless marked AGL.</text><rect class="cl" x="20" y="64" width="690" height="34" rx="8"/><text class="t n" x="34" y="87">Where you are</text><text class="t n" x="372" y="87">Visibility</text><text class="t n" x="470" y="87">Distance from clouds</text><rect class="lav" x="20" y="106" width="8" height="48" rx="3"/><rect class="cl" x="32" y="106" width="678" height="48" rx="6" style="fill-opacity:.12"/><text class="t n" x="44" y="136">Class B</text><text class="t c" x="372" y="136">3 SM</text><text class="s n" x="470" y="136">Clear of clouds</text><rect class="sky" x="20" y="160" width="8" height="48" rx="3"/><rect class="cl" x="32" y="160" width="678" height="48" rx="6" style="fill-opacity:.12"/><text class="t n" x="44" y="180">Class C, D, E</text><text class="s sm" x="44" y="199">below 10,000 ft</text><text class="t c" x="372" y="190">3 SM</text><text class="s n" x="470" y="180">500 ft below, 1,000 ft above,</text><text class="s n" x="470" y="199">2,000 ft horizontal</text><rect class="rose" x="20" y="214" width="8" height="48" rx="3"/><rect class="cl" x="32" y="214" width="678" height="48" rx="6" style="fill-opacity:.12"/><text class="t n" x="44" y="234">Class E</text><text class="s sm" x="44" y="253">10,000 ft and above</text><text class="t c" x="372" y="244">5 SM</text><text class="s n" x="470" y="234">1,000 ft below, 1,000 ft above,</text><text class="s n" x="470" y="253">1 SM horizontal</text><rect class="mint" x="20" y="268" width="8" height="48" rx="3"/><rect class="cl" x="32" y="268" width="678" height="48" rx="6" style="fill-opacity:.12"/><text class="t n" x="44" y="288">Class G, 1,200 ft AGL or less</text><text class="s sm" x="44" y="307">Day</text><text class="t c" x="372" y="298">1 SM</text><text class="s n" x="470" y="298">Clear of clouds</text><rect class="mint" x="20" y="322" width="8" height="48" rx="3"/><rect class="cl" x="32" y="322" width="678" height="48" rx="6" style="fill-opacity:.12"/><text class="t n" x="44" y="342">Class G, 1,200 ft AGL or less</text><text class="s sm" x="44" y="361">Night</text><text class="t c" x="372" y="352">3 SM</text><text class="s n" x="470" y="342">500 ft below, 1,000 ft above,</text><text class="s n" x="470" y="361">2,000 ft horizontal</text><rect class="mint" x="20" y="376" width="8" height="48" rx="3"/><rect class="cl" x="32" y="376" width="678" height="48" rx="6" style="fill-opacity:.12"/><text class="t n" x="44" y="396">Class G, over 1,200 ft AGL</text><text class="s sm" x="44" y="415">Below 10,000 ft, day</text><text class="t c" x="372" y="406">1 SM</text><text class="s n" x="470" y="396">500 ft below, 1,000 ft above,</text><text class="s n" x="470" y="415">2,000 ft horizontal</text><rect class="mint" x="20" y="430" width="8" height="48" rx="3"/><rect class="cl" x="32" y="430" width="678" height="48" rx="6" style="fill-opacity:.12"/><text class="t n" x="44" y="450">Class G, over 1,200 ft AGL</text><text class="s sm" x="44" y="469">Below 10,000 ft, night</text><text class="t c" x="372" y="460">3 SM</text><text class="s n" x="470" y="450">500 ft below, 1,000 ft above,</text><text class="s n" x="470" y="469">2,000 ft horizontal</text><rect class="mint" x="20" y="484" width="8" height="48" rx="3"/><rect class="cl" x="32" y="484" width="678" height="48" rx="6" style="fill-opacity:.12"/><text class="t n" x="44" y="504">Class G, over 1,200 ft AGL</text><text class="s sm" x="44" y="523">10,000 ft and above</text><text class="t c" x="372" y="514">5 SM</text><text class="s n" x="470" y="504">1,000 ft below, 1,000 ft above,</text><text class="s n" x="470" y="523">1 SM horizontal</text><text class="s sm" x="20" y="548">Class A needs an IFR clearance, so it is not on this chart.</text><text class="s sm" x="20" y="566">Source: 14 CFR 91.155</text></svg>