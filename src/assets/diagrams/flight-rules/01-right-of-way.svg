<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 694" role="img" aria-labelledby="ti de"><title id="ti">Right-of-way rules: who gives way to whom</title><desc id="de">Five right-of-way rules. An aircraft in distress goes first. Converging: the aircraft on the right has the right-of-way. Head-on: both turn right. Overtaking: pass on the right and the aircraft being overtaken has the right-of-way. Landing: the lower aircraft has the right-of-way but you must not cut in. Priority by kind: balloon, glider, airship, then airplane and rotorcraft; a towing or refueling aircraft is ahead of all other engine-driven aircraft.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.h{font-size:15px}.c{font-size:17px}.n{font-size:14.5px}.sm{font-size:13.5px}.ln{stroke:currentColor;stroke-width:1.6;fill:none;stroke-linecap:round}.pl{stroke:currentColor;stroke-width:1.4;stroke-linejoin:round}.ds{stroke-dasharray:7 6}</style><text class="t" x="20" y="28" style="font-size:15px">Right-of-way: who gives way to whom</text><text class="s sm" x="20" y="50">Everyone must still watch for other aircraft. Right-of-way does not replace looking.</text><rect class="cl" x="20" y="70" width="690" height="44" rx="8"/><text class="t c" x="34" y="98">Distress first:</text><text class="s n" x="180" y="98">an aircraft in distress has the right-of-way over all other traffic.</text><rect class="cl" x="20" y="126" width="335" height="196" rx="8"/><text class="t n" x="32" y="152">Converging: the one on the right goes first</text><path d="M80 206 L210 206" class="ln ds"/><path d="M210 266 L210 206" class="ln ds"/><g transform="translate(80 206) rotate(0) scale(1)"><path d="M-12 0L-20 -7L-22 -7L-19 0L-22 7L-20 7Z" class="sky pl"/><path d="M3 0L-6 -19L-11 -19L-6 0L-11 19L-6 19Z" class="sky pl"/><ellipse cx="0" cy="0" rx="17" ry="4" class="sky pl"/></g><g transform="translate(210 266) rotate(-90) scale(1)"><path d="M-12 0L-20 -7L-22 -7L-19 0L-22 7L-20 7Z" class="mint pl"/><path d="M3 0L-6 -19L-11 -19L-6 0L-11 19L-6 19Z" class="mint pl"/><ellipse cx="0" cy="0" rx="17" ry="4" class="mint pl"/></g><text class="s n m" x="80" y="184">You</text><text class="s sm" x="242" y="268">On your right:</text><text class="t sm" x="242" y="285">right-of-way</text><text class="s n" x="32" y="308">You give way and pass behind it.</text><rect class="cl" x="375" y="126" width="335" height="196" rx="8"/><text class="t n" x="387" y="152">Head-on: both turn right</text><g transform="translate(445 216) rotate(0) scale(1)"><path d="M-12 0L-20 -7L-22 -7L-19 0L-22 7L-20 7Z" class="sky pl"/><path d="M3 0L-6 -19L-11 -19L-6 0L-11 19L-6 19Z" class="sky pl"/><ellipse cx="0" cy="0" rx="17" ry="4" class="sky pl"/></g><g transform="translate(640 216) rotate(180) scale(1)"><path d="M-12 0L-20 -7L-22 -7L-19 0L-22 7L-20 7Z" class="sky pl"/><path d="M3 0L-6 -19L-11 -19L-6 0L-11 19L-6 19Z" class="sky pl"/><ellipse cx="0" cy="0" rx="17" ry="4" class="sky pl"/></g><path d="M475 216 C500 216 510 231 525 251" class="acc" style="stroke-width:3;stroke-dasharray:7 6"/><path d="M-6 -5L7 0L-6 5Z" class="ah" transform="translate(525 251) rotate(60)"/><path d="M610 216 C585 216 575 201 560 181" class="acc" style="stroke-width:3;stroke-dasharray:7 6"/><path d="M-6 -5L7 0L-6 5Z" class="ah" transform="translate(560 181) rotate(-120)"/><text class="s n" x="387" y="308">Each pilot alters course to the right.</text><rect class="cl" x="20" y="334" width="335" height="196" rx="8"/><text class="t n" x="32" y="360">Overtaking: pass on the right</text><g transform="translate(250 414) rotate(0) scale(1)"><path d="M-12 0L-20 -7L-22 -7L-19 0L-22 7L-20 7Z" class="mint pl"/><path d="M3 0L-6 -19L-11 -19L-6 0L-11 19L-6 19Z" class="mint pl"/><ellipse cx="0" cy="0" rx="17" ry="4" class="mint pl"/></g><g transform="translate(90 414) rotate(0) scale(1)"><path d="M-12 0L-20 -7L-22 -7L-19 0L-22 7L-20 7Z" class="sky pl"/><path d="M3 0L-6 -19L-11 -19L-6 0L-11 19L-6 19Z" class="sky pl"/><ellipse cx="0" cy="0" rx="17" ry="4" class="sky pl"/></g><path d="M120 414 C150 414 170 459 210 459" class="acc" style="stroke-width:3;stroke-dasharray:7 6"/><path d="M210 459 L300 459" class="acc" style="stroke-width:3;stroke-dasharray:7 6"/><path d="M-6 -5L7 0L-6 5Z" class="ah" transform="translate(300 459) rotate(0)"/><text class="s sm m" x="90" y="389">Faster</text><text class="s sm m" x="250" y="389">Slower: has it</text><text class="s n" x="32" y="502">The aircraft being overtaken has the</text><text class="s n" x="32" y="520">right-of-way. The overtaker goes right.</text><rect class="cl" x="375" y="334" width="335" height="196" rx="8"/><text class="t n" x="387" y="360">Landing: the lower aircraft goes first</text><rect class="mint" x="395" y="458" width="295" height="10" rx="3"/><path d="M395 458L690 458" class="ln"/><path d="M405 394 L590 455" class="ln ds"/><g transform="translate(550 435) scale(1)"><path d="M-16 -3L-24 -13L-19 -13L-10 -3Z" class="sky pl"/><ellipse cx="0" cy="0" rx="18" ry="5" class="sky pl"/><path d="M-3 0L2 7L6 7L4 0Z" class="sky pl"/><path d="M12 -5L12 -10" class="ln"/></g><g transform="translate(470 400) scale(1)"><path d="M-16 -3L-24 -13L-19 -13L-10 -3Z" class="sky pl"/><ellipse cx="0" cy="0" rx="18" ry="5" class="sky pl"/><path d="M-3 0L2 7L6 7L4 0Z" class="sky pl"/><path d="M12 -5L12 -10" class="ln"/></g><text class="t sm e" x="515" y="446">Landing</text><text class="s sm m" x="470" y="377">Higher: give way</text><text class="s n" x="387" y="492">Do not cut in front of a lower aircraft</text><text class="s n" x="387" y="510">or overtake it on final.</text><rect class="cl" x="20" y="542" width="690" height="126" rx="8"/><text class="t n" x="34" y="568">Between kinds of aircraft: highest right-of-way first</text><rect class="lav pl" x="34" y="582" width="118" height="34" rx="6"/><text class="t sm m" x="93.0" y="604">1 Balloon</text><rect class="sky pl" x="164" y="582" width="118" height="34" rx="6"/><text class="t sm m" x="223.0" y="604">2 Glider</text><rect class="mint pl" x="294" y="582" width="118" height="34" rx="6"/><text class="t sm m" x="353.0" y="604">3 Airship</text><rect class="rose pl" x="424" y="582" width="200" height="34" rx="6"/><text class="t sm m" x="524.0" y="604">4 Airplane, rotorcraft</text><text class="t c m" x="158" y="605">&gt;</text><text class="t c m" x="288" y="605">&gt;</text><text class="t c m" x="418" y="605">&gt;</text><text class="s n" x="34" y="638">Each one gives way to those listed before it.</text><text class="s n" x="34" y="658">A towing or refueling aircraft has right-of-way over all other engine-driven aircraft.</text><text class="s sm" x="20" y="682">Source: 14 CFR 91.113</text></svg>