<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 555" role="img" aria-labelledby="ti de"><title id="ti">ATIS: listen before you call the tower</title><desc id="de">Four steps: tune the ATIS frequency and listen before calling ATC; note the ATIS code given at the end, for example information Bravo; state on first contact with the tower that you have that information; the controller can then verify you have the current weather and airport information. The ATIS code changes with every update: Alpha, Bravo, Charlie, Delta and on down the alphabet. ATIS covers weather, runways in use, specific ATC procedures and airport construction affecting taxi planning.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style>
<text class="t" x="20" y="28" style="font-size:15px">ATIS: listen before you call the tower</text>
<text class="s" x="20" y="50.0" style="font-size:13px">The Automated Terminal Information Service (ATIS) is a recording of local weather and other pertinent</text>
<text class="s" x="20" y="66.5" style="font-size:13px">non-control information, broadcast on a local frequency in a looped format.</text>
<rect x="20" y="89.0" width="162" height="150" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/>
<circle cx="38" cy="109.0" r="10" class="ah"/><text class="t m" x="38" y="113.0" style="font-size:12px;fill:#fff">1</text>
<text class="s" x="30" y="135.0" style="font-size:11.5px">Tune the ATIS frequency</text>
<text class="s" x="30" y="150.0" style="font-size:11.5px">before calling ATC and</text>
<text class="s" x="30" y="165.0" style="font-size:11.5px">listen to the recorded</text>
<text class="s" x="30" y="180.0" style="font-size:11.5px">broadcast</text>
<path d="M183 153.0L189.0 153.0" class="dk" style="stroke-width:2"/><path d="M195 153.0L189.0 155.7L189.0 150.3Z" class="dh" style=""/>
<rect x="196" y="89.0" width="162" height="150" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/>
<circle cx="214" cy="109.0" r="10" class="ah"/><text class="t m" x="214" y="113.0" style="font-size:12px;fill:#fff">2</text>
<text class="s" x="206" y="135.0" style="font-size:11.5px">The broadcast ends with</text>
<text class="s" x="206" y="150.0" style="font-size:11.5px">a statement containing</text>
<text class="s" x="206" y="165.0" style="font-size:11.5px">the ATIS code, for</text>
<text class="s" x="206" y="180.0" style="font-size:11.5px">example: "Advise on</text>
<text class="s" x="206" y="195.0" style="font-size:11.5px">initial contact, you</text>
<text class="s" x="206" y="210.0" style="font-size:11.5px">have information</text>
<text class="s" x="206" y="225.0" style="font-size:11.5px">Bravo."</text>
<path d="M359 153.0L365.0 153.0" class="dk" style="stroke-width:2"/><path d="M371 153.0L365.0 155.7L365.0 150.3Z" class="dh" style=""/>
<rect x="372" y="89.0" width="162" height="150" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/>
<circle cx="390" cy="109.0" r="10" class="ah"/><text class="t m" x="390" y="113.0" style="font-size:12px;fill:#fff">3</text>
<text class="s" x="382" y="135.0" style="font-size:11.5px">On contacting the tower</text>
<text class="s" x="382" y="150.0" style="font-size:11.5px">controller, state that</text>
<text class="s" x="382" y="165.0" style="font-size:11.5px">you received</text>
<text class="s" x="382" y="180.0" style="font-size:11.5px">information Bravo</text>
<path d="M535 153.0L541.0 153.0" class="dk" style="stroke-width:2"/><path d="M547 153.0L541.0 155.7L541.0 150.3Z" class="dh" style=""/>
<rect x="548" y="89.0" width="162" height="150" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/>
<circle cx="566" cy="109.0" r="10" class="ah"/><text class="t m" x="566" y="113.0" style="font-size:12px;fill:#fff">4</text>
<text class="s" x="558" y="135.0" style="font-size:11.5px">The controller can</text>
<text class="s" x="558" y="150.0" style="font-size:11.5px">verify you have the</text>
<text class="s" x="558" y="165.0" style="font-size:11.5px">current local weather</text>
<text class="s" x="558" y="180.0" style="font-size:11.5px">and airport information</text>
<text class="s" x="558" y="195.0" style="font-size:11.5px">without stating it all</text>
<text class="s" x="558" y="210.0" style="font-size:11.5px">to each pilot</text>
<rect x="20" y="255.0" width="337" height="24" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="30" y="272.0" style="font-size:13px">What the broadcast contains</text>
<circle cx="31" cy="293.0" r="2.2" class="ah"/>
<text class="s" x="40" y="297.0" style="font-size:12px">Weather</text>
<circle cx="31" cy="312.5" r="2.2" class="ah"/>
<text class="s" x="40" y="316.5" style="font-size:12px">Runways in use</text>
<circle cx="31" cy="332.0" r="2.2" class="ah"/>
<text class="s" x="40" y="336.0" style="font-size:12px">Specific ATC procedures</text>
<circle cx="31" cy="351.5" r="2.2" class="ah"/>
<text class="s" x="40" y="355.5" style="font-size:12px">Any airport construction activity that could</text>
<text class="s" x="40" y="371.0" style="font-size:12px">affect taxi planning</text>
<circle cx="31" cy="386.5" r="2.2" class="ah"/>
<text class="s" x="40" y="390.5" style="font-size:12px">Normally updated once per hour, more often when</text>
<text class="s" x="40" y="406.0" style="font-size:12px">changing local conditions warrant</text>
<rect x="373" y="255.0" width="337" height="24" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="383" y="272.0" style="font-size:13px">Why it helps</text>
<circle cx="384" cy="293.0" r="2.2" class="ah"/>
<text class="s" x="393" y="297.0" style="font-size:12px">The tower does not have to state the same</text>
<text class="s" x="393" y="312.5" style="font-size:12px">information to every pilot who calls</text>
<circle cx="384" cy="328.0" r="2.2" class="ah"/>
<text class="s" x="393" y="332.0" style="font-size:12px">It keeps the tower frequency from being overtaken</text>
<text class="s" x="393" y="347.5" style="font-size:12px">by the constant relay of the same information</text>
<circle cx="384" cy="363.0" r="2.2" class="ah"/>
<text class="s" x="393" y="367.0" style="font-size:12px">Using ATIS at departure and arrival airports is</text>
<text class="s" x="393" y="382.5" style="font-size:12px">not only a sound practice but a wise decision</text>
<rect class="cl" x="20" y="431.5" width="690" height="112" rx="8"/>
<text class="t" x="32" y="453.5" style="font-size:13px">The ATIS code changes with every update</text>
<rect x="32" y="465.5" width="100" height="34" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="82.0" y="486.6666666666667" style="font-size:12.5px">ATIS Alpha</text>
<path d="M134 482.5L142.0 482.5" class="dk" style="stroke-width:2"/><path d="M148 482.5L142.0 485.2L142.0 479.8Z" class="dh" style=""/>
<rect x="150" y="465.5" width="100" height="34" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="200.0" y="486.6666666666667" style="font-size:12.5px">ATIS Bravo</text>
<path d="M252 482.5L260.0 482.5" class="dk" style="stroke-width:2"/><path d="M266 482.5L260.0 485.2L260.0 479.8Z" class="dh" style=""/>
<rect x="268" y="465.5" width="100" height="34" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="318.0" y="486.6666666666667" style="font-size:12.5px">ATIS Charlie</text>
<path d="M370 482.5L378.0 482.5" class="dk" style="stroke-width:2"/><path d="M384 482.5L378.0 485.2L378.0 479.8Z" class="dh" style=""/>
<rect x="386" y="465.5" width="100" height="34" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="436.0" y="486.6666666666667" style="font-size:12.5px">ATIS Delta</text>
<text class="s" x="504" y="488.5" style="font-size:11.5px">... and so on down the alphabet</text>
<text class="s" x="32" y="519.5" style="font-size:11.5px">ICAO has adopted a phonetic alphabet that should be used in radio communications. When communicating with ATC,</text>
<text class="s" x="32" y="534.5" style="font-size:11.5px">pilots should use it to identify their aircraft.</text>
</svg>
