<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 670" role="img" aria-labelledby="ti de"><title id="ti">Radar traffic advisories: how traffic is called by clock position</title><desc id="de">Radar-equipped ATC facilities provide traffic advisories to VFR and IFR aircraft within radar coverage that can communicate with the facility. Traffic is referenced by azimuth in terms of the 12-hour clock, with distance in nautical miles, direction of movement, aircraft type and altitude if known. Example: Traffic 10 o’clock 5 miles east bound, Cessna 152, 3,000 feet. Wind correction can change the clock position at which you see the traffic, and the pilot must still see and avoid. TRSA service is also described.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:12px}.q1{font-size:12.5px}.q2{font-size:13px}.q3{font-size:12px;fill:#fff}.q4{stroke:currentColor;stroke-width:1.5}</style><text class="t" x="20" y="28" style="font-size:15px">Radar traffic advisories: how traffic is called by clock position</text><text class="s q2" x="20" y="50">Radar-equipped ATC facilities give radar assistance to aircraft on instrument flight plans and to VFR</text><text class="s q2" x="20" y="66.5">aircraft, provided the aircraft can communicate with the facility and are within radar coverage.</text><rect class="cl" x="20" y="89" width="690" height="236" rx="8"/><circle cx="130" cy="207" r="72" class="cl" style="stroke:currentColor;stroke-width:1.6"/><text class="t m q0" x="172.5" y="137.39">1</text><text class="t m q0" x="203.61" y="168.5">2</text><text class="t m q0" x="215" y="211">3</text><text class="t m q0" x="203.61" y="253.5">4</text><text class="t m q0" x="172.5" y="284.61">5</text><text class="t m q0" x="130" y="296">6</text><text class="t m q0" x="87.5" y="284.61">7</text><text class="t m q0" x="56.39" y="253.5">8</text><text class="t m q0" x="45" y="211">9</text><text class="t m q0" x="56.39" y="168.5">10</text><text class="t m q0" x="87.5" y="137.39">11</text><text class="t m q0" x="130" y="126">12</text><path d="M130 195L136.2 214.4L123.8 214.4Z" class="ah"/><text class="s m" x="130" y="237" style="font-size:11px">your aircraft</text><path d="M130 207L90.16 184" class="dk" style="stroke-width:1.5;opacity:0.8;stroke-dasharray:6 5"/><circle cx="90.2" cy="184" r="6" class="ah"/><text class="s m" x="130" y="315" style="font-size:11.5px">12-hour clock around your aircraft</text><text class="t q2" x="262" y="115">Example call from PHAK</text><rect x="262" y="125" width="434" height="40" rx="10" class="sky q4"/><text class="t m q1" x="479" y="149.17">"Traffic 10 o’clock 5 miles east bound, Cessna 152, 3,000 feet."</text><circle cx="278" cy="187" r="10" class="ah"/><text class="t m q3" x="278" y="191">1</text><text class="t q1" x="298" y="191">10 o’clock</text><text class="s q0" x="398" y="191">azimuth, by the 12-hour clock</text><circle cx="278" cy="211" r="10" class="ah"/><text class="t m q3" x="278" y="215">2</text><text class="t q1" x="298" y="215">5 miles</text><text class="s q0" x="398" y="215">distance in nautical miles</text><circle cx="278" cy="235" r="10" class="ah"/><text class="t m q3" x="278" y="239">3</text><text class="t q1" x="298" y="239">east bound</text><text class="s q0" x="398" y="239">direction in which the target is moving</text><circle cx="278" cy="259" r="10" class="ah"/><text class="t m q3" x="278" y="263">4</text><text class="t q1" x="298" y="263">Cessna 152</text><text class="s q0" x="398" y="263">type of aircraft, if known</text><circle cx="278" cy="283" r="10" class="ah"/><text class="t m q3" x="278" y="287">5</text><text class="t q1" x="298" y="287">3,000 feet</text><text class="s q0" x="398" y="287">altitude, if known</text><text class="s q0" x="262" y="313">ATC issues these advisories based on observed radar targets.</text><rect x="20" y="335" width="337" height="24" rx="10" class="mint q4"/><text class="t q2" x="30" y="352">Basic radar service</text><circle cx="31" cy="373" r="2.2" class="ah"/><text class="s q0" x="40" y="377">Safety alerts</text><circle cx="31" cy="392.5" r="2.2" class="ah"/><text class="s q0" x="40" y="396.5">Traffic advisories</text><circle cx="31" cy="412" r="2.2" class="ah"/><text class="s q0" x="40" y="416">Limited vectoring when requested</text><circle cx="31" cy="431.5" r="2.2" class="ah"/><text class="s q0" x="40" y="435.5">Sequencing at locations where the procedure has</text><text class="s q0" x="40" y="451">been established</text><rect x="373" y="335" width="337" height="24" rx="10" class="rose q4"/><text class="t q2" x="383" y="352">Keep in mind</text><circle cx="384" cy="373" r="2.2" class="ah"/><text class="s q0" x="393" y="377">Traffic position is based on the aircraft track;</text><text class="s q0" x="393" y="392.5">wind correction can affect the clock position at</text><text class="s q0" x="393" y="408">which you locate the traffic</text><circle cx="384" cy="423.5" r="2.2" class="ah"/><text class="s q0" x="393" y="427.5">The service is not intended to relieve the pilot</text><text class="s q0" x="393" y="443">of the responsibility to see and avoid other</text><text class="s q0" x="393" y="458.5">aircraft</text><rect class="cl" x="20" y="482" width="690" height="174" rx="8"/><circle cx="35" cy="504" r="2.2" class="ah"/><text class="s q0" x="44" y="508">Terminal radar service area (TRSA) service has been implemented at certain terminal locations; TRSAs are</text><text class="s q0" x="44" y="523.5">depicted on sectional charts and listed in the Chart Supplement U.S.</text><circle cx="35" cy="539" r="2.2" class="ah"/><text class="s q0" x="44" y="543">Purpose: separation between all participating VFR aircraft and all IFR aircraft operating within the</text><text class="s q0" x="44" y="558.5">TRSA</text><circle cx="35" cy="574" r="2.2" class="ah"/><text class="s q0" x="44" y="578">Class C service: approved separation between IFR and VFR aircraft and sequencing of VFR aircraft to the</text><text class="s q0" x="44" y="593.5">primary airport</text><circle cx="35" cy="609" r="2.2" class="ah"/><text class="s q0" x="44" y="613">Class B service: approved separation of aircraft based on IFR, VFR, and/or weight, and sequencing of VFR</text><text class="s q0" x="44" y="628.5">arrivals to the primary airport(s)</text></svg>
