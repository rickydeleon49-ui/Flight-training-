<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 651" role="img" aria-labelledby="ti de"><title id="ti">Lost communication: what to do when the radio fails</title><desc id="de">With an inoperative receiver at a towered airport, stay outside or above Class D airspace, then advise the tower of aircraft type, position, altitude and intention to land, enter the pattern and watch for light signals. With an inoperative transmitter, also monitor the ATC frequency; acknowledge by rocking the wings in daylight or blinking the landing light at night. With both inoperative, stay outside Class D until the flow of traffic is known, then enter the pattern and watch for light signals. Repair radio malfunctions before further flight.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style>
<text class="t" x="20" y="28" style="font-size:15px">Lost communication: what to do when the radio fails</text>
<text class="s" x="20" y="50.0" style="font-size:13px">A radio malfunction can make the transmitter, the receiver, or both inoperative.</text>
<rect x="20" y="72.5" width="218" height="24" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="30" y="89.5" style="font-size:13px">Receiver inoperative</text>
<circle cx="31" cy="110.5" r="2.2" class="ah"/>
<text class="s" x="40" y="114.5" style="font-size:12px">To land at a towered airport,</text>
<text class="s" x="40" y="130.0" style="font-size:12px">stay outside or above Class D</text>
<text class="s" x="40" y="145.5" style="font-size:12px">airspace until the direction</text>
<text class="s" x="40" y="161.0" style="font-size:12px">and flow of traffic is</text>
<text class="s" x="40" y="176.5" style="font-size:12px">determined</text>
<circle cx="31" cy="192.0" r="2.2" class="ah"/>
<text class="s" x="40" y="196.0" style="font-size:12px">Then advise the tower of</text>
<text class="s" x="40" y="211.5" style="font-size:12px">aircraft type, position,</text>
<text class="s" x="40" y="227.0" style="font-size:12px">altitude, and intention to</text>
<text class="s" x="40" y="242.5" style="font-size:12px">land</text>
<circle cx="31" cy="258.0" r="2.2" class="ah"/>
<text class="s" x="40" y="262.0" style="font-size:12px">Continue, enter the pattern,</text>
<text class="s" x="40" y="277.5" style="font-size:12px">report a position as</text>
<text class="s" x="40" y="293.0" style="font-size:12px">appropriate, and watch for</text>
<text class="s" x="40" y="308.5" style="font-size:12px">light signals from the tower</text>
<rect x="256" y="72.5" width="218" height="24" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="266" y="89.5" style="font-size:13px">Transmitter inoperative</text>
<circle cx="267" cy="110.5" r="2.2" class="ah"/>
<text class="s" x="276" y="114.5" style="font-size:12px">Follow the same procedures as</text>
<text class="s" x="276" y="130.0" style="font-size:12px">for an inoperative receiver</text>
<circle cx="267" cy="145.5" r="2.2" class="ah"/>
<text class="s" x="276" y="149.5" style="font-size:12px">Also monitor the appropriate</text>
<text class="s" x="276" y="165.0" style="font-size:12px">ATC frequency</text>
<circle cx="267" cy="180.5" r="2.2" class="ah"/>
<text class="s" x="276" y="184.5" style="font-size:12px">Daylight: acknowledge ATC</text>
<text class="s" x="276" y="200.0" style="font-size:12px">transmissions by rocking the</text>
<text class="s" x="276" y="215.5" style="font-size:12px">wings</text>
<circle cx="267" cy="231.0" r="2.2" class="ah"/>
<text class="s" x="276" y="235.0" style="font-size:12px">Night: acknowledge by blinking</text>
<text class="s" x="276" y="250.5" style="font-size:12px">the landing light</text>
<rect x="492" y="72.5" width="218" height="24" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="502" y="89.5" style="font-size:13px">Both inoperative</text>
<circle cx="503" cy="110.5" r="2.2" class="ah"/>
<text class="s" x="512" y="114.5" style="font-size:12px">Remain outside Class D</text>
<text class="s" x="512" y="130.0" style="font-size:12px">airspace until the flow of</text>
<text class="s" x="512" y="145.5" style="font-size:12px">traffic has been determined</text>
<circle cx="503" cy="161.0" r="2.2" class="ah"/>
<text class="s" x="512" y="165.0" style="font-size:12px">Then enter the pattern and</text>
<text class="s" x="512" y="180.5" style="font-size:12px">watch for light signals</text>
<rect class="cl" x="20" y="332.0" width="690" height="178.0" rx="8"/>
<circle cx="35" cy="354.0" r="2.2" class="ah"/>
<text class="s" x="44" y="358.0" style="font-size:12px">Light signal colors and their meanings are in PHAK Figure 14-42 (the colors are not in the text, so they</text>
<text class="s" x="44" y="373.5" style="font-size:12px">are not shown here)</text>
<circle cx="35" cy="389.0" r="2.2" class="ah"/>
<text class="s" x="44" y="393.0" style="font-size:12px">Radio malfunctions should be repaired before further flight</text>
<circle cx="35" cy="408.5" r="2.2" class="ah"/>
<text class="s" x="44" y="412.5" style="font-size:12px">If that is not possible, ATC may be contacted by telephone to request a VFR departure without two-way</text>
<text class="s" x="44" y="428.0" style="font-size:12px">radio communications</text>
<circle cx="35" cy="443.5" r="2.2" class="ah"/>
<text class="s" x="44" y="447.5" style="font-size:12px">No radio (NORDO) procedure arrivals are not accepted at busy airports</text>
<circle cx="35" cy="463.0" r="2.2" class="ah"/>
<text class="s" x="44" y="467.0" style="font-size:12px">If authorization is given to depart, monitor the appropriate frequency and/or watch for light signals as</text>
<text class="s" x="44" y="482.5" style="font-size:12px">appropriate</text>
<rect class="cl" x="20" y="518.0" width="690" height="119.5" rx="8"/>
<circle cx="35" cy="540.0" r="2.2" class="ah"/>
<text class="s" x="44" y="544.0" style="font-size:12px">If radio communication is lost, it may be a prudent decision to land at a non-towered airport with lower</text>
<text class="s" x="44" y="559.5" style="font-size:12px">traffic volume, if practical</text>
<circle cx="35" cy="575.0" r="2.2" class="ah"/>
<text class="s" x="44" y="579.0" style="font-size:12px">At a non-towered airport no radio communication is necessary, but pilots should be extra vigilant when</text>
<text class="s" x="44" y="594.5" style="font-size:12px">not using the radio: other traffic may not be aware of your presence when they expect the standard radio</text>
<text class="s" x="44" y="610.0" style="font-size:12px">calls</text>
</svg>
