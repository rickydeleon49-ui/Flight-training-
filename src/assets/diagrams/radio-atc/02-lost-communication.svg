<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 651" role="img" aria-labelledby="ti de"><title id="ti">Lost communication: what to do when the radio fails</title><desc id="de">With an inoperative receiver at a towered airport, stay outside or above Class D airspace, then advise the tower of aircraft type, position, altitude and intention to land, enter the pattern and watch for light signals. With an inoperative transmitter, also monitor the ATC frequency; acknowledge by rocking the wings in daylight or blinking the landing light at night. With both inoperative, stay outside Class D until the flow of traffic is known, then enter the pattern and watch for light signals. Repair radio malfunctions before further flight.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:12px}.q1{font-size:13px}.q2{stroke:currentColor;stroke-width:1.5}</style><text class="t" x="20" y="28" style="font-size:15px">Lost communication: what to do when the radio fails</text><text class="s q1" x="20" y="50">A radio malfunction can make the transmitter, the receiver, or both inoperative.</text><rect x="20" y="72.5" width="218" height="24" rx="10" class="sky q2"/><text class="t q1" x="30" y="89.5">Receiver inoperative</text><circle cx="31" cy="110.5" r="2.2" class="ah"/><text class="s q0" x="40" y="114.5">To land at a towered airport,</text><text class="s q0" x="40" y="130">stay outside or above Class D</text><text class="s q0" x="40" y="145.5">airspace until the direction</text><text class="s q0" x="40" y="161">and flow of traffic is</text><text class="s q0" x="40" y="176.5">determined</text><circle cx="31" cy="192" r="2.2" class="ah"/><text class="s q0" x="40" y="196">Then advise the tower of</text><text class="s q0" x="40" y="211.5">aircraft type, position,</text><text class="s q0" x="40" y="227">altitude, and intention to</text><text class="s q0" x="40" y="242.5">land</text><circle cx="31" cy="258" r="2.2" class="ah"/><text class="s q0" x="40" y="262">Continue, enter the pattern,</text><text class="s q0" x="40" y="277.5">report a position as</text><text class="s q0" x="40" y="293">appropriate, and watch for</text><text class="s q0" x="40" y="308.5">light signals from the tower</text><rect x="256" y="72.5" width="218" height="24" rx="10" class="mint q2"/><text class="t q1" x="266" y="89.5">Transmitter inoperative</text><circle cx="267" cy="110.5" r="2.2" class="ah"/><text class="s q0" x="276" y="114.5">Follow the same procedures as</text><text class="s q0" x="276" y="130">for an inoperative receiver</text><circle cx="267" cy="145.5" r="2.2" class="ah"/><text class="s q0" x="276" y="149.5">Also monitor the appropriate</text><text class="s q0" x="276" y="165">ATC frequency</text><circle cx="267" cy="180.5" r="2.2" class="ah"/><text class="s q0" x="276" y="184.5">Daylight: acknowledge ATC</text><text class="s q0" x="276" y="200">transmissions by rocking the</text><text class="s q0" x="276" y="215.5">wings</text><circle cx="267" cy="231" r="2.2" class="ah"/><text class="s q0" x="276" y="235">Night: acknowledge by blinking</text><text class="s q0" x="276" y="250.5">the landing light</text><rect x="492" y="72.5" width="218" height="24" rx="10" class="lav q2"/><text class="t q1" x="502" y="89.5">Both inoperative</text><circle cx="503" cy="110.5" r="2.2" class="ah"/><text class="s q0" x="512" y="114.5">Remain outside Class D</text><text class="s q0" x="512" y="130">airspace until the flow of</text><text class="s q0" x="512" y="145.5">traffic has been determined</text><circle cx="503" cy="161" r="2.2" class="ah"/><text class="s q0" x="512" y="165">Then enter the pattern and</text><text class="s q0" x="512" y="180.5">watch for light signals</text><rect class="cl" x="20" y="332" width="690" height="178" rx="8"/><circle cx="35" cy="354" r="2.2" class="ah"/><text class="s q0" x="44" y="358">Light signal colors and their meanings are in PHAK Figure 14-42 (the colors are not in the text, so they</text><text class="s q0" x="44" y="373.5">are not shown here)</text><circle cx="35" cy="389" r="2.2" class="ah"/><text class="s q0" x="44" y="393">Radio malfunctions should be repaired before further flight</text><circle cx="35" cy="408.5" r="2.2" class="ah"/><text class="s q0" x="44" y="412.5">If that is not possible, ATC may be contacted by telephone to request a VFR departure without two-way</text><text class="s q0" x="44" y="428">radio communications</text><circle cx="35" cy="443.5" r="2.2" class="ah"/><text class="s q0" x="44" y="447.5">No radio (NORDO) procedure arrivals are not accepted at busy airports</text><circle cx="35" cy="463" r="2.2" class="ah"/><text class="s q0" x="44" y="467">If authorization is given to depart, monitor the appropriate frequency and/or watch for light signals as</text><text class="s q0" x="44" y="482.5">appropriate</text><rect class="cl" x="20" y="518" width="690" height="119.5" rx="8"/><circle cx="35" cy="540" r="2.2" class="ah"/><text class="s q0" x="44" y="544">If radio communication is lost, it may be a prudent decision to land at a non-towered airport with lower</text><text class="s q0" x="44" y="559.5">traffic volume, if practical</text><circle cx="35" cy="575" r="2.2" class="ah"/><text class="s q0" x="44" y="579">At a non-towered airport no radio communication is necessary, but pilots should be extra vigilant when</text><text class="s q0" x="44" y="594.5">not using the radio: other traffic may not be aware of your presence when they expect the standard radio</text><text class="s q0" x="44" y="610">calls</text></svg>
