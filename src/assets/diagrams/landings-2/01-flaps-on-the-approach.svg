<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 700" role="img" aria-labelledby="ti de"><title id="ti">Flaps on the approach</title><desc id="de">A pair of wing side views showing more lift and much more drag with flaps down at the same angle of attack, an airspeed indicator strip with the white arc from VS0 to VFE, and cards on pitch change, flap travel and climbing away.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><text class="t" x="20" y="28" style="font-size:15px">Flaps on the approach: what they change</text><text class="s" x="20" y="50.0" style="font-size:13px">Flaps increase both lift and induced drag at any given AOA. They are a compromise between a high</text><text class="s" x="20" y="66.5" style="font-size:13px">cruising speed and a low landing speed: out when you need them, retracted when you do not.</text><text class="t" x="20" y="99.0" style="font-size:14px">The same wing at the same AOA (schematic, arrows not to scale)</text><rect class="cl" x="20" y="125.0" width="330" height="214" rx="8"/><text class="t" x="35" y="147.0" style="font-size:13px">Flaps up</text><path d="M26 209.0L59.0 209.0" class="dk" style="stroke-width:2"/><path d="M66 209.0L59.0 212.2L59.0 205.8Z" class="dh"/><text class="s" x="26" y="229.0" style="font-size:11px">relative wind</text><path d="M70 207.0 C90 183.0 150 183.0 210 198.0 L210 211.0 C150 217.0 95 219.0 70 207.0Z" class="lav" style="stroke:currentColor;stroke-width:1.5"/><g transform="translate(210 204.0) rotate(0)"><path d="M0 -6L56 -3L56 3L0 5Z" class="sky" style="stroke:currentColor;stroke-width:1.5;stroke-linejoin:round"/></g><path d="M150 187.0L150.0 170.0" class="dk" style="stroke-width:3"/><path d="M150 161.0L154.1 170.0L145.9 170.0Z" class="dh"/><text class="s" x="160" y="165.0" style="font-size:12px">Lift</text><path d="M150 257.0L157.0 257.0" class="acc" style="stroke-width:3"/><path d="M166 257.0L157.0 261.1L157.0 252.9Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><text class="s" x="150" y="279.0" style="font-size:12px">Drag</text><text class="s" x="35" y="299.0" style="font-size:11.5px">Cruise: low drag. The wing needs a higher speed to</text><text class="s" x="35" y="314.0" style="font-size:11.5px">carry the airplane.</text><rect class="cl" x="370" y="125.0" width="330" height="214" rx="8"/><text class="t" x="385" y="147.0" style="font-size:13px">Flaps down</text><path d="M376 209.0L409.0 209.0" class="dk" style="stroke-width:2"/><path d="M416 209.0L409.0 212.2L409.0 205.8Z" class="dh"/><text class="s" x="376" y="229.0" style="font-size:11px">relative wind</text><path d="M420 207.0 C440 183.0 500 183.0 560 198.0 L560 211.0 C500 217.0 445 219.0 420 207.0Z" class="lav" style="stroke:currentColor;stroke-width:1.5"/><g transform="translate(560 204.0) rotate(28)"><path d="M0 -6L56 -3L56 3L0 5Z" class="sky" style="stroke:currentColor;stroke-width:1.5;stroke-linejoin:round"/></g><path d="M500 187.0L500.0 152.0" class="dk" style="stroke-width:3"/><path d="M500 143.0L504.1 152.0L495.9 152.0Z" class="dh"/><text class="s" x="510" y="147.0" style="font-size:12px">Lift</text><path d="M500 257.0L537.0 257.0" class="acc" style="stroke-width:3"/><path d="M546 257.0L537.0 261.1L537.0 252.9Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><text class="s" x="500" y="279.0" style="font-size:12px">Drag</text><text class="s" x="385" y="299.0" style="font-size:11.5px">More lift, but much more drag. The wing can carry</text><text class="s" x="385" y="314.0" style="font-size:11.5px">the airplane at a lower speed.</text><text class="t" x="20" y="365.0" style="font-size:14px">Speeds on the airspeed indicator (schematic, not to scale)</text><rect x="60" y="397.0" width="330" height="17" rx="2" class="cl" style="stroke:currentColor;stroke-width:1.4"/><rect x="140" y="423.0" width="470" height="17" rx="2" class="mint" style="stroke:currentColor;stroke-width:1.4"/><text class="t m" x="60" y="391.0" style="font-size:12px">VS0</text><text class="t m" x="390" y="391.0" style="font-size:12px">VFE</text><text class="t m" x="140" y="457.0" style="font-size:12px">VS1</text><text class="t m" x="610" y="457.0" style="font-size:12px">VNO</text><text class="s m" x="225" y="410.0" style="font-size:11.5px">White arc</text><text class="s m" x="375" y="436.0" style="font-size:11.5px">Green arc</text><text class="s" x="400" y="391.0"></text><text class="s" x="20" y="479.0" style="font-size:12px">VS0 is the stalling speed or minimum steady flight speed in the landing configuration, gear and flaps down.</text><text class="s" x="20" y="494.5" style="font-size:12px">The white arc runs from VS0 up to VFE, the highest speed with the flaps extended. Approaches and landings are</text><text class="s" x="20" y="510.0" style="font-size:12px">usually flown within it. VS1 is the same for the clean configuration, so VS0 sits lower than VS1.</text><rect class="cl" x="20.0" y="535.5" width="220.66666666666666" height="149.0" rx="8"/><rect x="20.0" y="535.5" width="220.66666666666666" height="26" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30.0" y="553.5" style="font-size:13px">What the flaps do to the pitch</text><circle cx="33.0" cy="571.5" r="2.2" class="ah"/><text class="s" x="42.0" y="575.5" style="font-size:11.5px">A plain flap moves the center</text><text class="s" x="42.0" y="590.5" style="font-size:11.5px">of pressure aft, a nose-down</text><text class="s" x="42.0" y="605.5" style="font-size:11.5px">pitching moment.</text><circle cx="33.0" cy="619.5" r="2.2" class="ah"/><text class="s" x="42.0" y="623.5" style="font-size:11.5px">Depending on the airplane, flap</text><text class="s" x="42.0" y="638.5" style="font-size:11.5px">extension may pitch the nose up</text><text class="s" x="42.0" y="653.5" style="font-size:11.5px">or down. Compensate, usually</text><text class="s" x="42.0" y="668.5" style="font-size:11.5px">with a trim change.</text><rect class="cl" x="254.66666666666666" y="535.5" width="220.66666666666666" height="149.0" rx="8"/><rect x="254.66666666666666" y="535.5" width="220.66666666666666" height="26" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="264.66666666666663" y="553.5" style="font-size:13px">Early travel, late travel</text><circle cx="267.66666666666663" cy="571.5" r="2.2" class="ah"/><text class="s" x="276.66666666666663" y="575.5" style="font-size:11.5px">A Fowler flap adds area and</text><text class="s" x="276.66666666666663" y="590.5" style="font-size:11.5px">camber: early in its travel it</text><text class="s" x="276.66666666666663" y="605.5" style="font-size:11.5px">gives a great deal of lift and</text><text class="s" x="276.66666666666663" y="620.5" style="font-size:11.5px">little drag.</text><circle cx="267.66666666666663" cy="634.5" r="2.2" class="ah"/><text class="s" x="276.66666666666663" y="638.5" style="font-size:11.5px">In the last part of its travel</text><text class="s" x="276.66666666666663" y="653.5" style="font-size:11.5px">the flap adds drag with little</text><text class="s" x="276.66666666666663" y="668.5" style="font-size:11.5px">more lift.</text><rect class="cl" x="489.3333333333333" y="535.5" width="220.66666666666666" height="149.0" rx="8"/><rect x="489.3333333333333" y="535.5" width="220.66666666666666" height="26" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="499.3333333333333" y="553.5" style="font-size:13px">If you must climb away</text><circle cx="502.3333333333333" cy="571.5" r="2.2" class="ah"/><text class="s" x="511.3333333333333" y="575.5" style="font-size:11.5px">Lowering the gear or the flaps</text><text class="s" x="511.3333333333333" y="590.5" style="font-size:11.5px">decreases both excess thrust</text><text class="s" x="511.3333333333333" y="605.5" style="font-size:11.5px">and excess power, so climb</text><text class="s" x="511.3333333333333" y="620.5" style="font-size:11.5px">performance decreases.</text><circle cx="502.3333333333333" cy="634.5" r="2.2" class="ah"/><text class="s" x="511.3333333333333" y="638.5" style="font-size:11.5px">Minimum landing speed is chosen</text><text class="s" x="511.3333333333333" y="653.5" style="font-size:11.5px">with a margin above stall and</text><text class="s" x="511.3333333333333" y="668.5" style="font-size:11.5px">the capability for a go-around.</text></svg>
