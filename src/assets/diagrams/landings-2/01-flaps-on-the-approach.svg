<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 700" role="img" aria-labelledby="ti de"><title id="ti">Flaps on the approach</title><desc id="de">A pair of wing side views showing more lift and much more drag with flaps down at the same angle of attack, an airspeed indicator strip with the white arc from VS0 to VFE, and cards on pitch change, flap travel and climbing away.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11.5px}.q1{font-size:12px}.q2{font-size:13px}.q3{stroke:currentColor;stroke-width:1.5}.q4{stroke-width:3}.q5{stroke:currentColor;stroke-width:1.5;stroke-linejoin:round}.q6{fill:var(--palette-berry,#A84C6B)}.q7{stroke:currentColor;stroke-width:1.4}</style><text class="t" x="20" y="28" style="font-size:15px">Flaps on the approach: what they change</text><text class="s q2" x="20" y="50">Flaps increase both lift and induced drag at any given AOA. They are a compromise between a high</text><text class="s q2" x="20" y="66.5">cruising speed and a low landing speed: out when you need them, retracted when you do not.</text><text class="t" x="20" y="99" style="font-size:14px">The same wing at the same AOA (schematic, arrows not to scale)</text><rect class="cl" x="20" y="125" width="330" height="214" rx="8"/><text class="t q2" x="35" y="147">Flaps up</text><path d="M26 209L59 209" class="dk" style="stroke-width:2"/><path d="M66 209L59 212.2L59 205.8Z" class="dh"/><text class="s" x="26" y="229" style="font-size:11px">relative wind</text><path d="M70 207 C90 183 150 183 210 198 L210 211 C150 217 95 219 70 207Z" class="lav q3"/><g transform="translate(210 204) rotate(0)"><path d="M0 -6L56 -3L56 3L0 5Z" class="sky q5"/></g><path d="M150 187L150 170" class="dk q4"/><path d="M150 161L154.1 170L145.9 170Z" class="dh"/><text class="s q1" x="160" y="165">Lift</text><path d="M150 257L157 257" class="acc q4"/><path d="M166 257L157 261.1L157 252.9Z" class="dh q6"/><text class="s q1" x="150" y="279">Drag</text><text class="s q0" x="35" y="299">Cruise: low drag. The wing needs a higher speed to</text><text class="s q0" x="35" y="314">carry the airplane.</text><rect class="cl" x="370" y="125" width="330" height="214" rx="8"/><text class="t q2" x="385" y="147">Flaps down</text><path d="M376 209L409 209" class="dk" style="stroke-width:2"/><path d="M416 209L409 212.2L409 205.8Z" class="dh"/><text class="s" x="376" y="229" style="font-size:11px">relative wind</text><path d="M420 207 C440 183 500 183 560 198 L560 211 C500 217 445 219 420 207Z" class="lav q3"/><g transform="translate(560 204) rotate(28)"><path d="M0 -6L56 -3L56 3L0 5Z" class="sky q5"/></g><path d="M500 187L500 152" class="dk q4"/><path d="M500 143L504.1 152L495.9 152Z" class="dh"/><text class="s q1" x="510" y="147">Lift</text><path d="M500 257L537 257" class="acc q4"/><path d="M546 257L537 261.1L537 252.9Z" class="dh q6"/><text class="s q1" x="500" y="279">Drag</text><text class="s q0" x="385" y="299">More lift, but much more drag. The wing can carry</text><text class="s q0" x="385" y="314">the airplane at a lower speed.</text><text class="t" x="20" y="365" style="font-size:14px">Speeds on the airspeed indicator (schematic, not to scale)</text><rect x="60" y="397" width="330" height="17" rx="2" class="cl q7"/><rect x="140" y="423" width="470" height="17" rx="2" class="mint q7"/><text class="t m q1" x="60" y="391">VS0</text><text class="t m q1" x="390" y="391">VFE</text><text class="t m q1" x="140" y="457">VS1</text><text class="t m q1" x="610" y="457">VNO</text><text class="s m q0" x="225" y="410">White arc</text><text class="s m q0" x="375" y="436">Green arc</text><text class="s" x="400" y="391"></text><text class="s q1" x="20" y="479">VS0 is the stalling speed or minimum steady flight speed in the landing configuration, gear and flaps down.</text><text class="s q1" x="20" y="494.5">The white arc runs from VS0 up to VFE, the highest speed with the flaps extended. Approaches and landings are</text><text class="s q1" x="20" y="510">usually flown within it. VS1 is the same for the clean configuration, so VS0 sits lower than VS1.</text><rect class="cl" x="20" y="535.5" width="220.67" height="149" rx="8"/><rect x="20" y="535.5" width="220.67" height="26" rx="10" class="sky q3"/><text class="t q2" x="30" y="553.5">What the flaps do to the pitch</text><circle cx="33" cy="571.5" r="2.2" class="ah"/><text class="s q0" x="42" y="575.5">A plain flap moves the center</text><text class="s q0" x="42" y="590.5">of pressure aft, a nose-down</text><text class="s q0" x="42" y="605.5">pitching moment.</text><circle cx="33" cy="619.5" r="2.2" class="ah"/><text class="s q0" x="42" y="623.5">Depending on the airplane, flap</text><text class="s q0" x="42" y="638.5">extension may pitch the nose up</text><text class="s q0" x="42" y="653.5">or down. Compensate, usually</text><text class="s q0" x="42" y="668.5">with a trim change.</text><rect class="cl" x="254.67" y="535.5" width="220.67" height="149" rx="8"/><rect x="254.67" y="535.5" width="220.67" height="26" rx="10" class="lav q3"/><text class="t q2" x="264.67" y="553.5">Early travel, late travel</text><circle cx="267.67" cy="571.5" r="2.2" class="ah"/><text class="s q0" x="276.67" y="575.5">A Fowler flap adds area and</text><text class="s q0" x="276.67" y="590.5">camber: early in its travel it</text><text class="s q0" x="276.67" y="605.5">gives a great deal of lift and</text><text class="s q0" x="276.67" y="620.5">little drag.</text><circle cx="267.67" cy="634.5" r="2.2" class="ah"/><text class="s q0" x="276.67" y="638.5">In the last part of its travel</text><text class="s q0" x="276.67" y="653.5">the flap adds drag with little</text><text class="s q0" x="276.67" y="668.5">more lift.</text><rect class="cl" x="489.33" y="535.5" width="220.67" height="149" rx="8"/><rect x="489.33" y="535.5" width="220.67" height="26" rx="10" class="rose q3"/><text class="t q2" x="499.33" y="553.5">If you must climb away</text><circle cx="502.33" cy="571.5" r="2.2" class="ah"/><text class="s q0" x="511.33" y="575.5">Lowering the gear or the flaps</text><text class="s q0" x="511.33" y="590.5">decreases both excess thrust</text><text class="s q0" x="511.33" y="605.5">and excess power, so climb</text><text class="s q0" x="511.33" y="620.5">performance decreases.</text><circle cx="502.33" cy="634.5" r="2.2" class="ah"/><text class="s q0" x="511.33" y="638.5">Minimum landing speed is chosen</text><text class="s q0" x="511.33" y="653.5">with a margin above stall and</text><text class="s q0" x="511.33" y="668.5">the capability for a go-around.</text></svg>
