<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 677" role="img" aria-labelledby="ti de"><title id="ti">When the radio fails: watch the tower for light signals</title><desc id="de">Four steps for a towered airport when the radio fails: stay outside or above Class D airspace, advise the tower, enter the pattern, and watch for light signals from the tower. Then how to acknowledge ATC with a wing rock by day or a landing light blink at night when only the transmitter is out, and what to do before flying and at non-towered airports.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11.5px}.q1{font-size:13px}.q2{font-size:12px}.q3{stroke:#e8b923;stroke-width:2;stroke-linecap:round}.q4{stroke:currentColor;stroke-width:1.5}.q5{stroke-width:2.5}.q6{fill:var(--palette-berry,#A84C6B)}.q7{fill:#e8b923;stroke:currentColor;stroke-width:1.2}.q8{stroke:currentColor;stroke-width:1.6}</style><text class="t" x="20" y="28" style="font-size:15px">When the radio fails: watch the tower for light signals</text><text class="s q1" x="20" y="50">At a towered airport, a pilot with a radio problem stays clear of Class D airspace until the flow of</text><text class="s q1" x="20" y="66.5">traffic is known, then enters the pattern and watches for light signals from the tower.</text><rect class="cl" x="20" y="91" width="156" height="135" rx="8"/><rect x="20" y="91" width="156" height="26" rx="10" class="sky q4"/><text class="t q1" x="30" y="109">Stay out</text><circle cx="33" cy="127" r="2.2" class="ah"/><text class="s q0" x="42" y="131">Remain outside or</text><text class="s q0" x="42" y="146">above Class D</text><text class="s q0" x="42" y="161">airspace until the</text><text class="s q0" x="42" y="176">direction and flow</text><text class="s q0" x="42" y="191">of traffic is</text><text class="s q0" x="42" y="206">determined.</text><path d="M179 158.5L187 158.5" class="acc q5"/><path d="M195 158.5L187 162.1L187 154.9Z" class="dh q6"/><rect class="cl" x="198" y="91" width="156" height="135" rx="8"/><rect x="198" y="91" width="156" height="26" rx="10" class="lav q4"/><text class="t q1" x="208" y="109">Tell the tower</text><circle cx="211" cy="127" r="2.2" class="ah"/><text class="s q0" x="220" y="131">Advise the tower of</text><text class="s q0" x="220" y="146">aircraft type,</text><text class="s q0" x="220" y="161">position, altitude</text><text class="s q0" x="220" y="176">and intention to</text><text class="s q0" x="220" y="191">land (receiver out).</text><path d="M357 158.5L365 158.5" class="acc q5"/><path d="M373 158.5L365 162.1L365 154.9Z" class="dh q6"/><rect class="cl" x="376" y="91" width="156" height="135" rx="8"/><rect x="376" y="91" width="156" height="26" rx="10" class="mint q4"/><text class="t q1" x="386" y="109">Enter the pattern</text><circle cx="389" cy="127" r="2.2" class="ah"/><text class="s q0" x="398" y="131">Continue, enter the</text><text class="s q0" x="398" y="146">pattern and report a</text><text class="s q0" x="398" y="161">position as</text><text class="s q0" x="398" y="176">appropriate.</text><path d="M535 158.5L543 158.5" class="acc q5"/><path d="M551 158.5L543 162.1L543 154.9Z" class="dh q6"/><rect class="cl" x="554" y="91" width="156" height="135" rx="8"/><rect x="554" y="91" width="156" height="26" rx="10" class="rose q4"/><text class="t q1" x="564" y="109">Watch the tower</text><circle cx="567" cy="127" r="2.2" class="ah"/><text class="s q0" x="576" y="131">Watch for light</text><text class="s q0" x="576" y="146">signals from the</text><text class="s q0" x="576" y="161">tower. Light signal</text><text class="s q0" x="576" y="176">colors and their</text><text class="s q0" x="576" y="191">meanings are in</text><text class="s q0" x="576" y="206">Figure 14-42.</text><text class="t" x="20" y="248" style="font-size:14px">If only the transmitter is out</text><rect class="cl" x="20" y="258" width="337" height="118" rx="8"/><rect class="cl" x="373" y="258" width="337" height="118" rx="8"/><text class="t q1" x="34" y="282">In daylight</text><text class="s q2" x="34" y="302">Rock the wings to acknowledge</text><text class="s q2" x="34" y="317.5">ATC transmissions.</text><circle cx="329" cy="282" r="9" class="q7"/><path d="M251 336L339 304" class="dk" style="stroke-width:6"/><path d="M251 304L339 336" class="dk" style="stroke-width:6;opacity:.25"/><ellipse cx="295" cy="320" rx="8" ry="12" class="sky q8"/><text class="t q1" x="387" y="282">At night</text><text class="s q2" x="387" y="302">Blink the landing light to</text><text class="s q2" x="387" y="317.5">acknowledge ATC</text><text class="s q2" x="387" y="333">transmissions.</text><path d="M678 274a11 11 0 1 0 8 19a9 9 0 0 1 -8 -19Z" class="q7"/><path d="M604 320L692 320" class="dk" style="stroke-width:6"/><ellipse cx="648" cy="320" rx="8" ry="12" class="sky q8"/><path d="M655.1 350L661 350" class="q3"/><path d="M653.1 355.1L657.2 359.2" class="q3"/><path d="M648 357.1L648 363" class="q3"/><path d="M642.9 355.1L638.8 359.2" class="q3"/><path d="M640.9 350L635 350" class="q3"/><path d="M642.9 344.9L638.8 340.8" class="q3"/><path d="M648 342.9L648 337" class="q3"/><path d="M653.1 344.9L657.2 340.8" class="q3"/><circle cx="648" cy="350" r="4" class="q7"/><path d="M648 332L648 337" class="dk" style="stroke-width:2"/><rect class="cl" x="20" y="384" width="690" height="64" rx="8"/><text class="s q2" x="32" y="404">Also monitor the appropriate ATC frequency. If both receiver and transmitter are out, stay outside Class D</text><text class="s q2" x="32" y="419.5">airspace until the flow of traffic has been determined, then enter the pattern and watch for light</text><text class="s q2" x="32" y="435">signals.</text><text class="t" x="20" y="468" style="font-size:14px">Before and after</text><rect class="cl" x="20" y="478" width="338" height="185" rx="8"/><rect x="20" y="478" width="338" height="26" rx="10" class="sky q4"/><text class="t q1" x="30" y="496">Fix it first</text><circle cx="33" cy="514" r="2.2" class="ah"/><text class="s q0" x="42" y="518">Radio malfunctions should be repaired before</text><text class="s q0" x="42" y="533">further flight.</text><circle cx="33" cy="547" r="2.2" class="ah"/><text class="s q0" x="42" y="551">If that is not possible, ATC may be contacted by</text><text class="s q0" x="42" y="566">telephone to request a VFR departure without</text><text class="s q0" x="42" y="581">two-way radio.</text><circle cx="33" cy="595" r="2.2" class="ah"/><text class="s q0" x="42" y="599">NORDO (no radio) arrivals are not accepted at busy</text><text class="s q0" x="42" y="614">airports.</text><circle cx="33" cy="628" r="2.2" class="ah"/><text class="s q0" x="42" y="632">If authorized to depart, monitor the appropriate</text><text class="s q0" x="42" y="647">frequency and/or watch for light signals.</text><rect class="cl" x="372" y="478" width="338" height="185" rx="8"/><rect x="372" y="478" width="338" height="26" rx="10" class="mint q4"/><text class="t q1" x="382" y="496">Consider a quieter airport</text><circle cx="385" cy="514" r="2.2" class="ah"/><text class="s q0" x="394" y="518">If radio communication is lost, it may be a prudent</text><text class="s q0" x="394" y="533">decision to land at a non-towered airport with</text><text class="s q0" x="394" y="548">lower traffic volume, if practical.</text><circle cx="385" cy="562" r="2.2" class="ah"/><text class="s q0" x="394" y="566">At a non-towered airport no radio communication is</text><text class="s q0" x="394" y="581">necessary, but be extra vigilant when not using the</text><text class="s q0" x="394" y="596">radio. Other traffic may not be aware of you if</text><text class="s q0" x="394" y="611">they are expecting the standard radio calls.</text></svg>
