<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 829" role="img" aria-labelledby="ti de"><title id="ti">Airport lighting at night</title><desc id="de">Four rotating beacon color combinations for civilian land airports, water airports, heliports and military airports, notes on when the beacon operates, a plan view of a runway with white, amber and red edge lights, REIL flashing lights and a taxiway with blue edge and green centerline lights, and who controls airport lighting at towered and non-towered airports.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{stroke:#ffffff;stroke-width:2;stroke-linecap:round}.q1{fill:#ffffff;stroke:currentColor;stroke-width:1.2}.q2{stroke:#3a9d5d;stroke-width:2;stroke-linecap:round}.q3{font-size:11.5px}.q4{fill:#f0a020;stroke:currentColor;stroke-width:1.2}.q5{stroke:#e8b923;stroke-width:2;stroke-linecap:round}.q6{font-size:11px}.q7{fill:#3b82d6;stroke:currentColor;stroke-width:1.2}.q8{fill:#3a9d5d;stroke:currentColor;stroke-width:1.2}.q9{font-size:13px}.q10{font-size:12.5px}.q11{fill:#d9423a;stroke:currentColor;stroke-width:1.2}.q12{font-size:14px}.q13{stroke:currentColor;stroke-width:1.5}.q14{fill:#e8b923;stroke:currentColor;stroke-width:1.2}.q15{stroke:none;fill-opacity:.35}</style><text class="t" x="20" y="28" style="font-size:15px">Airport lighting at night</text><text class="s q9" x="20" y="50">Airport lighting is standardized, so every airport uses the same light colors for runways and</text><text class="s q9" x="20" y="66.5">taxiways. The type of lighting depends on how busy and complex the airport is.</text><text class="t q12" x="20" y="95">Rotating beacon: the colors tell you the type of airport</text><rect class="cl" x="20" y="105" width="165" height="92" rx="8"/><text class="t m q10" x="102.5" y="127">Civilian land airport</text><path d="M93.5 153L98.5 153" class="q0"/><path d="M91.8 157.3L95.3 160.8" class="q0"/><path d="M87.5 159.1L87.5 164" class="q0"/><path d="M83.2 157.3L79.7 160.8" class="q0"/><path d="M81.5 153L76.5 153" class="q0"/><path d="M83.2 148.7L79.7 145.2" class="q0"/><path d="M87.5 146.9L87.5 142" class="q0"/><path d="M91.8 148.7L95.3 145.2" class="q0"/><circle cx="87.5" cy="153" r="4" class="q1"/><path d="M123.5 153L128.5 153" class="q2"/><path d="M121.8 157.3L125.3 160.8" class="q2"/><path d="M117.5 159.1L117.5 164" class="q2"/><path d="M113.2 157.3L109.7 160.8" class="q2"/><path d="M111.5 153L106.5 153" class="q2"/><path d="M113.2 148.7L109.7 145.2" class="q2"/><path d="M117.5 146.9L117.5 142" class="q2"/><path d="M121.8 148.7L125.3 145.2" class="q2"/><circle cx="117.5" cy="153" r="4" class="q8"/><text class="s m q6" x="102.5" y="177">White, green</text><rect class="cl" x="195" y="105" width="165" height="92" rx="8"/><text class="t m q10" x="277.5" y="127">Water airport</text><path d="M268.6 153L273.5 153" class="q0"/><path d="M266.8 157.3L270.3 160.8" class="q0"/><path d="M262.5 159.1L262.5 164" class="q0"/><path d="M258.2 157.3L254.7 160.8" class="q0"/><path d="M256.4 153L251.5 153" class="q0"/><path d="M258.2 148.7L254.7 145.2" class="q0"/><path d="M262.5 146.9L262.5 142" class="q0"/><path d="M266.8 148.7L270.3 145.2" class="q0"/><circle cx="262.5" cy="153" r="4" class="q1"/><path d="M298.6 153L303.5 153" class="q5"/><path d="M296.8 157.3L300.3 160.8" class="q5"/><path d="M292.5 159.1L292.5 164" class="q5"/><path d="M288.2 157.3L284.7 160.8" class="q5"/><path d="M286.4 153L281.5 153" class="q5"/><path d="M288.2 148.7L284.7 145.2" class="q5"/><path d="M292.5 146.9L292.5 142" class="q5"/><path d="M296.8 148.7L300.3 145.2" class="q5"/><circle cx="292.5" cy="153" r="4" class="q14"/><text class="s m q6" x="277.5" y="177">White, yellow</text><rect class="cl" x="370" y="105" width="165" height="92" rx="8"/><text class="t m q10" x="452.5" y="127">Heliport</text><path d="M428.6 153L433.5 153" class="q0"/><path d="M426.8 157.3L430.3 160.8" class="q0"/><path d="M422.5 159.1L422.5 164" class="q0"/><path d="M418.2 157.3L414.7 160.8" class="q0"/><path d="M416.4 153L411.5 153" class="q0"/><path d="M418.2 148.7L414.7 145.2" class="q0"/><path d="M422.5 146.9L422.5 142" class="q0"/><path d="M426.8 148.7L430.3 145.2" class="q0"/><circle cx="422.5" cy="153" r="4" class="q1"/><path d="M458.6 153L463.5 153" class="q5"/><path d="M456.8 157.3L460.3 160.8" class="q5"/><path d="M452.5 159.1L452.5 164" class="q5"/><path d="M448.2 157.3L444.7 160.8" class="q5"/><path d="M446.4 153L441.5 153" class="q5"/><path d="M448.2 148.7L444.7 145.2" class="q5"/><path d="M452.5 146.9L452.5 142" class="q5"/><path d="M456.8 148.7L460.3 145.2" class="q5"/><circle cx="452.5" cy="153" r="4" class="q14"/><path d="M488.6 153L493.5 153" class="q2"/><path d="M486.8 157.3L490.3 160.8" class="q2"/><path d="M482.5 159.1L482.5 164" class="q2"/><path d="M478.2 157.3L474.7 160.8" class="q2"/><path d="M476.4 153L471.5 153" class="q2"/><path d="M478.2 148.7L474.7 145.2" class="q2"/><path d="M482.5 146.9L482.5 142" class="q2"/><path d="M486.8 148.7L490.3 145.2" class="q2"/><circle cx="482.5" cy="153" r="4" class="q8"/><text class="s m q6" x="452.5" y="177">White, yellow, green</text><rect class="cl" x="545" y="105" width="165" height="92" rx="8"/><text class="t m q10" x="627.5" y="127">Military airport</text><path d="M603.5 153L608.5 153" class="q0"/><path d="M601.8 157.3L605.3 160.8" class="q0"/><path d="M597.5 159.1L597.5 164" class="q0"/><path d="M593.2 157.3L589.7 160.8" class="q0"/><path d="M591.5 153L586.5 153" class="q0"/><path d="M593.2 148.7L589.7 145.2" class="q0"/><path d="M597.5 146.9L597.5 142" class="q0"/><path d="M601.8 148.7L605.3 145.2" class="q0"/><circle cx="597.5" cy="153" r="4" class="q1"/><path d="M633.5 153L638.5 153" class="q0"/><path d="M631.8 157.3L635.3 160.8" class="q0"/><path d="M627.5 159.1L627.5 164" class="q0"/><path d="M623.2 157.3L619.7 160.8" class="q0"/><path d="M621.5 153L616.5 153" class="q0"/><path d="M623.2 148.7L619.7 145.2" class="q0"/><path d="M627.5 146.9L627.5 142" class="q0"/><path d="M631.8 148.7L635.3 145.2" class="q0"/><circle cx="627.5" cy="153" r="4" class="q1"/><path d="M663.5 153L668.5 153" class="q2"/><path d="M661.8 157.3L665.3 160.8" class="q2"/><path d="M657.5 159.1L657.5 164" class="q2"/><path d="M653.2 157.3L649.7 160.8" class="q2"/><path d="M651.5 153L646.5 153" class="q2"/><path d="M653.2 148.7L649.7 145.2" class="q2"/><path d="M657.5 146.9L657.5 142" class="q2"/><path d="M661.8 148.7L665.3 145.2" class="q2"/><circle cx="657.5" cy="153" r="4" class="q8"/><text class="s m q6" x="627.5" y="177">Two quick white flashes,</text><text class="s m q6" x="627.5" y="191.5">then a green flash</text><rect class="cl" x="20" y="207" width="690" height="82" rx="8"/><circle cx="35" cy="223" r="2.2" class="ah"/><text class="s q3" x="44" y="227">Beacons help a pilot identify an airport at night and are normally operated from dusk until dawn.</text><circle cx="35" cy="241" r="2.2" class="ah"/><text class="s q3" x="44" y="245">Sometimes they are on when the ceiling is less than 1,000 feet and/or ground visibility is less than 3</text><text class="s q3" x="44" y="260">statute miles, but there is no requirement, so the pilot must decide whether the weather meets VFR minimums.</text><circle cx="35" cy="274" r="2.2" class="ah"/><text class="s q3" x="44" y="278">The beam is most effective from 1 to 10 degrees above the horizon, though it can be seen well above or below.</text><text class="t q12" x="20" y="309">Runway and taxiway lights</text><rect class="cl" x="20" y="319" width="690" height="150" rx="8"/><rect x="60" y="359" width="540" height="40" class="cl q15"/><text class="t m q9" x="120" y="384">Runway</text><rect x="170" y="399" width="44" height="50" class="cl q15"/><circle cx="170" cy="405" r="3.6" class="q7"/><circle cx="214" cy="405" r="3.6" class="q7"/><circle cx="170" cy="419" r="3.6" class="q7"/><circle cx="214" cy="419" r="3.6" class="q7"/><circle cx="170" cy="433" r="3.6" class="q7"/><circle cx="214" cy="433" r="3.6" class="q7"/><circle cx="170" cy="447" r="3.6" class="q7"/><circle cx="214" cy="447" r="3.6" class="q7"/><circle cx="192" cy="409" r="3.6" class="q8"/><circle cx="192" cy="425" r="3.6" class="q8"/><circle cx="192" cy="441" r="3.6" class="q8"/><text class="t q10" x="228" y="433">Taxiway</text><circle cx="70" cy="359" r="3.8" class="q1"/><circle cx="70" cy="399" r="3.8" class="q1"/><circle cx="90" cy="359" r="3.8" class="q1"/><circle cx="90" cy="399" r="3.8" class="q1"/><circle cx="110" cy="359" r="3.8" class="q1"/><circle cx="110" cy="399" r="3.8" class="q1"/><circle cx="130" cy="359" r="3.8" class="q1"/><circle cx="130" cy="399" r="3.8" class="q1"/><circle cx="150" cy="359" r="3.8" class="q1"/><circle cx="150" cy="399" r="3.8" class="q1"/><circle cx="170" cy="359" r="3.8" class="q1"/><circle cx="190" cy="359" r="3.8" class="q1"/><circle cx="210" cy="359" r="3.8" class="q1"/><circle cx="230" cy="359" r="3.8" class="q1"/><circle cx="230" cy="399" r="3.8" class="q1"/><circle cx="250" cy="359" r="3.8" class="q1"/><circle cx="250" cy="399" r="3.8" class="q1"/><circle cx="270" cy="359" r="3.8" class="q1"/><circle cx="270" cy="399" r="3.8" class="q1"/><circle cx="290" cy="359" r="3.8" class="q1"/><circle cx="290" cy="399" r="3.8" class="q1"/><circle cx="310" cy="359" r="3.8" class="q1"/><circle cx="310" cy="399" r="3.8" class="q1"/><circle cx="330" cy="359" r="3.8" class="q1"/><circle cx="330" cy="399" r="3.8" class="q1"/><circle cx="350" cy="359" r="3.8" class="q1"/><circle cx="350" cy="399" r="3.8" class="q1"/><circle cx="370" cy="359" r="3.8" class="q1"/><circle cx="370" cy="399" r="3.8" class="q1"/><circle cx="390" cy="359" r="3.8" class="q4"/><circle cx="390" cy="399" r="3.8" class="q4"/><circle cx="410" cy="359" r="3.8" class="q4"/><circle cx="410" cy="399" r="3.8" class="q4"/><circle cx="430" cy="359" r="3.8" class="q4"/><circle cx="430" cy="399" r="3.8" class="q4"/><circle cx="450" cy="359" r="3.8" class="q4"/><circle cx="450" cy="399" r="3.8" class="q4"/><circle cx="470" cy="359" r="3.8" class="q4"/><circle cx="470" cy="399" r="3.8" class="q4"/><circle cx="490" cy="359" r="3.8" class="q4"/><circle cx="490" cy="399" r="3.8" class="q4"/><circle cx="510" cy="359" r="3.8" class="q4"/><circle cx="510" cy="399" r="3.8" class="q4"/><circle cx="530" cy="359" r="3.8" class="q4"/><circle cx="530" cy="399" r="3.8" class="q4"/><circle cx="550" cy="359" r="3.8" class="q4"/><circle cx="550" cy="399" r="3.8" class="q4"/><circle cx="570" cy="359" r="3.8" class="q4"/><circle cx="570" cy="399" r="3.8" class="q4"/><circle cx="590" cy="359" r="3.8" class="q4"/><circle cx="590" cy="399" r="3.8" class="q4"/><circle cx="604" cy="359" r="3.6" class="q11"/><circle cx="604" cy="369" r="3.6" class="q11"/><circle cx="604" cy="379" r="3.6" class="q11"/><circle cx="604" cy="389" r="3.6" class="q11"/><circle cx="604" cy="399" r="3.6" class="q11"/><path d="M54 359L54 399" style="stroke:currentColor;stroke-width:1;opacity:.4;stroke-dasharray:3 3"/><path d="M46.4 357L50 357" class="q0"/><path d="M45.1 360.1L47.7 362.7" class="q0"/><path d="M42 361.4L42 365" class="q0"/><path d="M38.9 360.1L36.3 362.7" class="q0"/><path d="M37.6 357L34 357" class="q0"/><path d="M38.9 353.9L36.3 351.3" class="q0"/><path d="M42 352.6L42 349" class="q0"/><path d="M45.1 353.9L47.7 351.3" class="q0"/><circle cx="42" cy="357" r="4" class="q1"/><path d="M46.4 401L50 401" class="q0"/><path d="M45.1 404.1L47.7 406.7" class="q0"/><path d="M42 405.4L42 409" class="q0"/><path d="M38.9 404.1L36.3 406.7" class="q0"/><path d="M37.6 401L34 401" class="q0"/><path d="M38.9 397.9L36.3 395.3" class="q0"/><path d="M42 396.6L42 393" class="q0"/><path d="M45.1 397.9L47.7 395.3" class="q0"/><circle cx="42" cy="401" r="4" class="q1"/><text class="s q6" x="56" y="341">REIL pair at the threshold (flashing)</text><text class="s q6" x="614" y="384">End: red</text><text class="s q6" x="390" y="341">Amber on instrument runways</text><path d="M390 347L600 347" class="q13"/><text class="s m q6" x="495" y="345"></text><rect class="cl" x="20" y="479" width="690" height="154" rx="8"/><circle cx="35" cy="495" r="2.2" class="ah"/><text class="s q3" x="44" y="499">Runway edge lights outline the runway at night or in low visibility: HIRL (high), MIRL (medium) and LIRL (low</text><text class="s q3" x="44" y="514">intensity). HIRL and MIRL have variable intensity settings.</text><circle cx="35" cy="528" r="2.2" class="ah"/><text class="s q3" x="44" y="532">They are white, except on instrument runways, where amber lights mark the last 2,000 feet or half the runway,</text><text class="s q3" x="44" y="547">whichever is less. The lights marking the end of the runway are red.</text><circle cx="35" cy="561" r="2.2" class="ah"/><text class="s q3" x="44" y="565">REIL: a pair of synchronized flashing lights on each side of the runway threshold, for rapid and positive</text><text class="s q3" x="44" y="580">identification of the approach end.</text><circle cx="35" cy="594" r="2.2" class="ah"/><text class="s q3" x="44" y="598">Taxiway edge lights are blue and outline the taxiway. Some airports also have green taxiway centerline</text><text class="s q3" x="44" y="613">lights. Edge lights may have variable intensity, adjusted by ATC when needed or on request.</text><text class="t q12" x="20" y="653">Who controls the lights</text><rect class="cl" x="20" y="663" width="338" height="152" rx="8"/><rect x="20" y="663" width="338" height="26" rx="10" class="sky q13"/><text class="t q9" x="30" y="681">Towered airport</text><circle cx="33" cy="699" r="2.2" class="ah"/><text class="s q3" x="42" y="703">Airport lighting is controlled by ATC.</text><circle cx="33" cy="717" r="2.2" class="ah"/><text class="s q3" x="42" y="721">A pilot may ask ATC or FSS to turn light systems on</text><text class="s q3" x="42" y="736">or off and to set a specified intensity, if</text><text class="s q3" x="42" y="751">available.</text><rect class="cl" x="372" y="663" width="338" height="152" rx="8"/><rect x="372" y="663" width="338" height="26" rx="10" class="mint q13"/><text class="t q9" x="382" y="681">Non-towered airport</text><circle cx="385" cy="699" r="2.2" class="ah"/><text class="s q3" x="394" y="703">The lights may be on a timer, or FSS staff may</text><text class="s q3" x="394" y="718">control them where an FSS is on the airport.</text><circle cx="385" cy="732" r="2.2" class="ah"/><text class="s q3" x="394" y="736">At selected airports the pilot controls the lights</text><text class="s q3" x="394" y="751">by selecting a specified frequency and clicking the</text><text class="s q3" x="394" y="766">radio microphone.</text><circle cx="385" cy="780" r="2.2" class="ah"/><text class="s q3" x="394" y="784">The Chart Supplement U.S. lists pilot controlled</text><text class="s q3" x="394" y="799">lighting at various airports.</text></svg>
