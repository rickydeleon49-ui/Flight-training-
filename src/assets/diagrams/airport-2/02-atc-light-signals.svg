<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 524" role="img" aria-labelledby="ti de"><title id="ti">ATC light gun signals: what each color means</title><desc id="de">A table of six tower light gun signals with what each means on the ground and in the air. Steady green: cleared for takeoff, cleared to land. Flashing green: cleared to taxi, return for landing. Steady red: stop, give way and continue circling. Flashing red: taxi clear of the runway, airport unsafe do not land. Flashing white: return to starting point on airport, not applicable. Alternating red and green: exercise extreme caution.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11.5px}.q1{font-size:13px}.q2{font-size:12px}.q3{stroke:#e8b923;stroke-width:2;stroke-linecap:round}.q4{stroke:currentColor;stroke-width:1.5}.q5{stroke-width:2.5}.q6{fill:var(--palette-berry,#A84C6B)}.q7{fill:#e8b923;stroke:currentColor;stroke-width:1.2}.q8{stroke:currentColor;stroke-width:1.6}</style><text class="t" x="20" y="28" style="font-size:15px">ATC light gun signals: what each color means</text><text class="s q1" x="20" y="50">The tower uses a light gun when it cannot talk to you by radio.</text><rect class="cl" x="20" y="64" width="690" height="38" rx="8"/><text class="t q1" x="30" y="88">Light</text><text class="t q1" x="242" y="88">On the ground</text><text class="t q1" x="484" y="88">In the air</text><rect class="cl" x="20" y="118" width="690" height="58" rx="8"/><circle cx="56" cy="147.0" r="15" class="o" style="stroke-width:2;fill:#2E9E4F"/><text class="t q1" x="88" y="151.0">Steady green</text><text class="s q1" x="242" y="151.0">Cleared for takeoff</text><text class="s q1" x="484" y="151.0">Cleared to land</text><rect class="cl" x="20" y="182" width="690" height="58" rx="8"/><circle cx="56" cy="211.0" r="21" class="o d" style="stroke-width:2"/><circle cx="56" cy="211.0" r="15" class="o" style="stroke-width:2;fill:#2E9E4F"/><text class="t q1" x="88" y="207.0">Flashing</text><text class="t q1" x="88" y="223.0">green</text><text class="s q1" x="242" y="215.0">Cleared to taxi</text><text class="s q1" x="484" y="199.0">Return for landing (to be</text><text class="s q1" x="484" y="215.0">followed by steady green at the</text><text class="s q1" x="484" y="231.0">proper time)</text><rect class="cl" x="20" y="246" width="690" height="58" rx="8"/><circle cx="56" cy="275.0" r="15" class="o" style="stroke-width:2;fill:#D13B3B"/><text class="t q1" x="88" y="279.0">Steady red</text><text class="s q1" x="242" y="279.0">Stop</text><text class="s q1" x="484" y="271.0">Give way to other aircraft and</text><text class="s q1" x="484" y="287.0">continue circling</text><rect class="cl" x="20" y="310" width="690" height="58" rx="8"/><circle cx="56" cy="339.0" r="21" class="o d" style="stroke-width:2"/><circle cx="56" cy="339.0" r="15" class="o" style="stroke-width:2;fill:#D13B3B"/><text class="t q1" x="88" y="335.0">Flashing</text><text class="t q1" x="88" y="351.0">red</text><text class="s q1" x="242" y="343.0">Taxi clear of the runway in use</text><text class="s q1" x="484" y="343.0">Airport unsafe, do not land</text><rect class="cl" x="20" y="374" width="690" height="58" rx="8"/><circle cx="56" cy="403.0" r="21" class="o d" style="stroke-width:2"/><circle cx="56" cy="403.0" r="15" class="o" style="stroke-width:2;fill:#FFFFFF"/><text class="t q1" x="88" y="399.0">Flashing</text><text class="t q1" x="88" y="415.0">white</text><text class="s q1" x="242" y="399.0">Return to starting point on</text><text class="s q1" x="242" y="415.0">airport</text><text class="s q1" x="484" y="407.0">Not applicable</text><rect class="cl" x="20" y="438" width="690" height="58" rx="8"/><path d="M56 452.0A15 15 0 0 0 56 482.0Z" style="fill:#D13B3B"/><path d="M56 452.0A15 15 0 0 1 56 482.0Z" style="fill:#2E9E4F"/><circle cx="56" cy="467.0" r="15" class="o" style="stroke-width:2"/><text class="t q1" x="88" y="463.0">Alternating</text><text class="t q1" x="88" y="479.0">red and green</text><text class="s q1" x="242" y="471.0">Exercise extreme caution</text><text class="s q1" x="484" y="471.0">Exercise extreme caution</text><text class="s q2" x="20" y="510">Source: PHAK ch. 14 (Figure 14-42) and AIM 4-3-13</text></svg>