<circle cx="323.0" cy="151.0" r="4" style="fill:#ffffff;stroke:currentColor;stroke-width:1.2"/>
<circle cx="337.0" cy="151.0" r="4" style="fill:#ffffff;stroke:currentColor;stroke-width:1.2"/>
<circle cx="351.0" cy="151.0" r="4" style="fill:#ffffff;stroke:currentColor;stroke-width:1.2"/>
<circle cx="372.0" cy="151.0" r="4" style="fill:#ffffff;stroke:currentColor;stroke-width:1.2"/>
