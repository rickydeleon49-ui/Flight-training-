<text class="t m" x="207.5" y="183.0" style="font-size:11.5px">White until the last 3,000 ft</text>
<text class="t m" x="470.0" y="183.0" style="font-size:11.5px">Alternating, 2,000 ft</text>
<text class="t m" x="627.5" y="183.0" style="font-size:11.5px">All red, 1,000 ft</text>
<text class="s" x="40" y="127.0" style="font-size:11px">Runway continues, last 6,000 ft shown</text>
<text class="s e" x="690" y="127.0" style="font-size:11px">Runway end</text>
<text class="s" x="34" y="203.0" style="font-size:11px">Spaced at 50-foot intervals along the runway centerline, to help landing in poor visibility.</text>
<rect class="cl" x="20.0" y="225.0" width="338.0" height="152.0" rx="8"/>
<rect x="20.0" y="225.0" width="338.0" height="26" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="30.0" y="243.0" style="font-size:13px">Touchdown zone lights</text>
<circle cx="33.0" cy="261.0" r="2.2" class="ah"/>
<text class="s" x="42.0" y="265.0" style="font-size:11.5px">On some precision approach runways, to show the</text>
<text class="s" x="42.0" y="280.0" style="font-size:11.5px">touchdown zone in poor visibility.</text>
<circle cx="33.0" cy="294.0" r="2.2" class="ah"/>
<text class="s" x="42.0" y="298.0" style="font-size:11.5px">Two rows of transverse light bars either side of</text>
<text class="s" x="42.0" y="313.0" style="font-size:11.5px">the centerline, steady white.</text>
<circle cx="33.0" cy="327.0" r="2.2" class="ah"/>
<text class="s" x="42.0" y="331.0" style="font-size:11.5px">Start 100 feet beyond the landing threshold and run</text>
<text class="s" x="42.0" y="346.0" style="font-size:11.5px">to 3,000 feet beyond it or the runway midpoint,</text>
<text class="s" x="42.0" y="361.0" style="font-size:11.5px">whichever is less.</text>
<rect class="cl" x="372.0" y="225.0" width="338.0" height="152.0" rx="8"/>
<rect x="372.0" y="225.0" width="338.0" height="26" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="382.0" y="243.0" style="font-size:13px">Land and hold short lights</text>
<circle cx="385.0" cy="261.0" r="2.2" class="ah"/>
<text class="s" x="394.0" y="265.0" style="font-size:11.5px">Mark the hold short point on runways approved for</text>
<text class="s" x="394.0" y="280.0" style="font-size:11.5px">LAHSO.</text>
<circle cx="385.0" cy="294.0" r="2.2" class="ah"/>
<text class="s" x="394.0" y="298.0" style="font-size:11.5px">A row of pulsing white lights across the runway.</text>
<circle cx="385.0" cy="312.0" r="2.2" class="ah"/>
<text class="s" x="394.0" y="316.0" style="font-size:11.5px">On whenever LAHSO is in effect; off when it is not.</text>
<text class="t" x="20" y="397.0" style="font-size:14px">Leaving or entering the runway</text>
<rect class="cl" x="20" y="407" width="690" height="206" rx="8"/>
<rect x="30" y="421" width="330" height="40" class="cl" style="stroke:none;fill-opacity:.35"/>
<text class="t m" x="195" y="446" style="font-size:12.5px">Runway</text>
<rect x="150" y="461" width="80" height="122" class="cl" style="stroke:none;fill-opacity:.35"/>
<path d="M150 495L230 495" style="stroke:#e8b923;stroke-width:3"/>
<circle cx="154.0" cy="505.0" r="3.3" style="fill:#d9423a;stroke:currentColor;stroke-width:1.2"/>
<circle cx="166.0" cy="505.0" r="3.3" style="fill:#d9423a;stroke:currentColor;stroke-width:1.2"/>
<circle cx="178.0" cy="505.0" r="3.3" style="fill:#d9423a;stroke:currentColor;stroke-width:1.2"/>
<circle cx="190.0" cy="505.0" r="3.3" style="fill:#d9423a;stroke:currentColor;stroke-width:1.2"/>
<circle cx="202.0" cy="505.0" r="3.3" style="fill:#d9423a;stroke:currentColor;stroke-width:1.2"/>
<circle cx="214.0" cy="505.0" r="3.3" style="fill:#d9423a;stroke:currentColor;stroke-width:1.2"/>
<circle cx="226.0" cy="505.0" r="3.3" style="fill:#d9423a;stroke:currentColor;stroke-width:1.2"/>
<circle cx="142.0" cy="505.0" r="4.4" style="fill:#d9423a;stroke:currentColor;stroke-width:1.2"/>
<circle cx="238.0" cy="505.0" r="4.4" style="fill:#d9423a;stroke:currentColor;stroke-width:1.2"/>
<circle cx="190.0" cy="487.0" r="3.6" style="fill:#3a9d5d;stroke:currentColor;stroke-width:1.2"/>
<circle cx="190.0" cy="476.0" r="3.6" style="fill:#e8b923;stroke:currentColor;stroke-width:1.2"/>
<circle cx="190.0" cy="465.0" r="3.6" style="fill:#3a9d5d;stroke:currentColor;stroke-width:1.2"/>
<text class="t m" x="190.0" y="579" style="font-size:12px">Taxiway</text>
<text class="s e" x="136" y="509" style="font-size:11px">Stop bar</text>
<text class="s e" x="136" y="477" style="font-size:11px">Lead-on lights</text>

<circle cx="383" cy="431" r="2.2" class="ah"/>
<text class="s" x="392" y="435.0" style="font-size:11px">Stop bar (red): in-pavement steady red lights across</text>
<text class="s" x="392" y="449.5" style="font-size:11px">the taxiway at the runway holding position, plus</text>
<text class="s" x="392" y="464.0" style="font-size:11px">elevated red lights each side. Confirms the ATC</text>
<text class="s" x="392" y="478.5" style="font-size:11px">clearance to enter or cross in low visibility (below</text>
<text class="s" x="392" y="493.0" style="font-size:11px">1,200 ft RVR).</text>
<circle cx="383" cy="507.5" r="2.2" class="ah"/>
<text class="s" x="392" y="511.5" style="font-size:11px">After the clearance, the stop bar goes off and the</text>
<text class="s" x="392" y="526.0" style="font-size:11px">lead-on lights come on. They reset automatically.</text>
<circle cx="383" cy="540.5" r="2.2" class="ah"/>
<text class="s" x="392" y="544.5" style="font-size:11px">Lead-off and lead-on lights: alternate green and</text>
<text class="s" x="392" y="559.0" style="font-size:11px">yellow, starting with green at the runway centerline,</text>
<text class="s" x="392" y="573.5" style="font-size:11px">to one light past the holding position. They warn</text>
<text class="s" x="392" y="588.0" style="font-size:11px">that you are in the runway environment or ILS</text>
<text class="s" x="392" y="602.5" style="font-size:11px">critical area.</text>
<rect class="cl" x="20.0" y="625" width="220.66666666666666" height="197.0" rx="8"/>
<rect x="20.0" y="625" width="220.66666666666666" height="26" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="30.0" y="643" style="font-size:13px">Clearance bar lights</text>
<circle cx="33.0" cy="661" r="2.2" class="ah"/>
<text class="s" x="42.0" y="665.0" style="font-size:11.5px">At taxiway holding positions to</text>
<text class="s" x="42.0" y="680.0" style="font-size:11.5px">make them easier to see in low</text>
<text class="s" x="42.0" y="695.0" style="font-size:11.5px">visibility.</text>
<circle cx="33.0" cy="709.0" r="2.2" class="ah"/>
<text class="s" x="42.0" y="713.0" style="font-size:11.5px">May also mark an intersecting</text>
<text class="s" x="42.0" y="728.0" style="font-size:11.5px">taxiway in darkness.</text>
<circle cx="33.0" cy="742.0" r="2.2" class="ah"/>
<text class="s" x="42.0" y="746.0" style="font-size:11.5px">Three in-pavement steady yellow</text>
<text class="s" x="42.0" y="761.0" style="font-size:11.5px">lights.</text>
<rect class="cl" x="254.66666666666666" y="625" width="220.66666666666666" height="197.0" rx="8"/>
<rect x="254.66666666666666" y="625" width="220.66666666666666" height="26" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="264.66666666666663" y="643" style="font-size:13px">Runway guard lights</text>
<circle cx="267.66666666666663" cy="661" r="2.2" class="ah"/>
<text class="s" x="276.66666666666663" y="665.0" style="font-size:11.5px">At taxiway and runway</text>
<text class="s" x="276.66666666666663" y="680.0" style="font-size:11.5px">intersections, mainly in low</text>
<text class="s" x="276.66666666666663" y="695.0" style="font-size:11.5px">visibility, but may be used in</text>
<text class="s" x="276.66666666666663" y="710.0" style="font-size:11.5px">any weather.</text>
<circle cx="267.66666666666663" cy="724.0" r="2.2" class="ah"/>
<text class="s" x="276.66666666666663" y="728.0" style="font-size:11.5px">A pair of elevated flashing</text>
<text class="s" x="276.66666666666663" y="743.0" style="font-size:11.5px">yellow lights each side of the</text>
<text class="s" x="276.66666666666663" y="758.0" style="font-size:11.5px">taxiway, or a row of</text>
<text class="s" x="276.66666666666663" y="773.0" style="font-size:11.5px">in-pavement yellow lights</text>
<text class="s" x="276.66666666666663" y="788.0" style="font-size:11.5px">across the taxiway, at the</text>
<text class="s" x="276.66666666666663" y="803.0" style="font-size:11.5px">holding position marking.</text>
<rect class="cl" x="489.3333333333333" y="625" width="220.66666666666666" height="197.0" rx="8"/>
<rect x="489.3333333333333" y="625" width="220.66666666666666" height="26" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="499.3333333333333" y="643" style="font-size:13px">Runway status lights</text>
<circle cx="502.3333333333333" cy="661" r="2.2" class="ah"/>
<text class="s" x="511.3333333333333" y="665.0" style="font-size:11.5px">Red lights that show only</text>
<text class="s" x="511.3333333333333" y="680.0" style="font-size:11.5px">runway status, not clearance to</text>
<text class="s" x="511.3333333333333" y="695.0" style="font-size:11.5px">enter or take off.</text>
<circle cx="502.3333333333333" cy="709.0" r="2.2" class="ah"/>
<text class="s" x="511.3333333333333" y="713.0" style="font-size:11.5px">Runway Entrance Lights warn of</text>
<text class="s" x="511.3333333333333" y="728.0" style="font-size:11.5px">conflicting traffic when</text>
<text class="s" x="511.3333333333333" y="743.0" style="font-size:11.5px">entering or crossing.</text>
<circle cx="502.3333333333333" cy="757.0" r="2.2" class="ah"/>
<text class="s" x="511.3333333333333" y="761.0" style="font-size:11.5px">Takeoff Hold Lights warn</text>
<text class="s" x="511.3333333333333" y="776.0" style="font-size:11.5px">aircraft in position for</text>
<text class="s" x="511.3333333333333" y="791.0" style="font-size:11.5px">takeoff that the runway is</text>
<text class="s" x="511.3333333333333" y="806.0" style="font-size:11.5px">occupied.</text>
</svg>
