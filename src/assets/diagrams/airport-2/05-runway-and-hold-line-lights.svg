<circle cx="624.0" cy="151.0" r="4" style="fill:#d9423a;stroke:currentColor;stroke-width:1.2"/>
<circle cx="638.0" cy="151.0" r="4" style="fill:#d9423a;stroke:currentColor;stroke-width:1.2"/>
<circle cx="652.0" cy="151.0" r="4" style="fill:#d9423a;stroke:currentColor;stroke-width:1.2"/>
