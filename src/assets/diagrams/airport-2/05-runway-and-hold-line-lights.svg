<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 836.0" role="img" aria-labelledby="ti de"><title id="ti">Lights on the runway and at the hold line</title><desc id="de">A runway centerline light strip showing the last 6,000 feet: white, then alternating white and red, then all red. Cards for touchdown zone lights and land and hold short lights, a taxiway meeting a runway with a red stop bar and green and yellow lead-on lights, and cards for clearance bar lights, runway guard lights and runway status lights.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style>
<text class="t" x="20" y="28" style="font-size:15px">Lights on the runway and at the hold line</text>
<text class="s" x="20" y="50.0" style="font-size:13px">Some runways and taxiway holding positions have extra lights that tell you where you are on the runway</text>
<text class="s" x="20" y="66.5" style="font-size:13px">and whether it is safe to go.</text>
<text class="t" x="20" y="97.0" style="font-size:14px">Runway centerline lights (some precision approach runways), seen from the landing threshold</text>
<rect class="cl" x="20" y="107.0" width="690" height="104" rx="8"/>
<rect x="40" y="137.0" width="650" height="28" class="cl" style="stroke:none;fill-opacity:.35"/>
<circle cx="57.0" cy="151.0" r="4" style="fill:#ffffff;stroke:currentColor;stroke-width:1.2"/>
