<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 836" role="img" aria-labelledby="ti de"><title id="ti">Lights on the runway and at the hold line</title><desc id="de">A runway centerline light strip showing the last 6,000 feet: white, then alternating white and red, then all red. Cards for touchdown zone lights and land and hold short lights, a taxiway meeting a runway with a red stop bar and green and yellow lead-on lights, and cards for clearance bar lights, runway guard lights and runway status lights.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11.5px}.q1{fill:#ffffff;stroke:currentColor;stroke-width:1.2}.q2{fill:#d9423a;stroke:currentColor;stroke-width:1.2}.q3{font-size:11px}.q4{font-size:13px}.q5{stroke:currentColor;stroke-width:1.5}.q6{stroke:none;fill-opacity:.35}.q7{fill:#3a9d5d;stroke:currentColor;stroke-width:1.2}</style><text class="t" x="20" y="28" style="font-size:15px">Lights on the runway and at the hold line</text><text class="s q4" x="20" y="50">Some runways and taxiway holding positions have extra lights that tell you where you are on the runway</text><text class="s q4" x="20" y="66.5">and whether it is safe to go.</text><text class="t" x="20" y="97" style="font-size:14px">Runway centerline lights (some precision approach runways), seen from the landing threshold</text><rect class="cl" x="20" y="107" width="690" height="104" rx="8"/><rect x="40" y="137" width="650" height="28" class="cl q6"/><circle cx="57" cy="151" r="4" class="q1"/><circle cx="71" cy="151" r="4" class="q1"/><circle cx="85" cy="151" r="4" class="q1"/><circle cx="99" cy="151" r="4" class="q1"/><circle cx="113" cy="151" r="4" class="q1"/><circle cx="127" cy="151" r="4" class="q1"/><circle cx="141" cy="151" r="4" class="q1"/><circle cx="155" cy="151" r="4" class="q1"/><circle cx="169" cy="151" r="4" class="q1"/><circle cx="183" cy="151" r="4" class="q1"/><circle cx="197" cy="151" r="4" class="q1"/><circle cx="211" cy="151" r="4" class="q1"/><circle cx="225" cy="151" r="4" class="q1"/><circle cx="239" cy="151" r="4" class="q1"/><circle cx="253" cy="151" r="4" class="q1"/><circle cx="267" cy="151" r="4" class="q1"/><circle cx="281" cy="151" r="4" class="q1"/><circle cx="295" cy="151" r="4" class="q1"/><circle cx="309" cy="151" r="4" class="q1"/><circle cx="323" cy="151" r="4" class="q1"/><circle cx="337" cy="151" r="4" class="q1"/><circle cx="351" cy="151" r="4" class="q1"/><circle cx="372" cy="151" r="4" class="q1"/><circle cx="386" cy="151" r="4" class="q2"/><circle cx="400" cy="151" r="4" class="q1"/><circle cx="414" cy="151" r="4" class="q2"/><circle cx="428" cy="151" r="4" class="q1"/><circle cx="442" cy="151" r="4" class="q2"/><circle cx="456" cy="151" r="4" class="q1"/><circle cx="470" cy="151" r="4" class="q2"/><circle cx="484" cy="151" r="4" class="q1"/><circle cx="498" cy="151" r="4" class="q2"/><circle cx="512" cy="151" r="4" class="q1"/><circle cx="526" cy="151" r="4" class="q2"/><circle cx="540" cy="151" r="4" class="q1"/><circle cx="554" cy="151" r="4" class="q2"/><circle cx="568" cy="151" r="4" class="q1"/><circle cx="582" cy="151" r="4" class="q2"/><circle cx="596" cy="151" r="4" class="q2"/><circle cx="610" cy="151" r="4" class="q2"/><circle cx="624" cy="151" r="4" class="q2"/><circle cx="638" cy="151" r="4" class="q2"/><circle cx="652" cy="151" r="4" class="q2"/><circle cx="666" cy="151" r="4" class="q2"/><text class="t m q0" x="207.5" y="183">White until the last 3,000 ft</text><text class="t m q0" x="470" y="183">Alternating, 2,000 ft</text><text class="t m q0" x="627.5" y="183">All red, 1,000 ft</text><text class="s q3" x="40" y="127">Runway continues, last 6,000 ft shown</text><text class="s e q3" x="690" y="127">Runway end</text><text class="s q3" x="34" y="203">Spaced at 50-foot intervals along the runway centerline, to help landing in poor visibility.</text><rect class="cl" x="20" y="225" width="338" height="152" rx="8"/><rect x="20" y="225" width="338" height="26" rx="10" class="sky q5"/><text class="t q4" x="30" y="243">Touchdown zone lights</text><circle cx="33" cy="261" r="2.2" class="ah"/><text class="s q0" x="42" y="265">On some precision approach runways, to show the</text><text class="s q0" x="42" y="280">touchdown zone in poor visibility.</text><circle cx="33" cy="294" r="2.2" class="ah"/><text class="s q0" x="42" y="298">Two rows of transverse light bars either side of</text><text class="s q0" x="42" y="313">the centerline, steady white.</text><circle cx="33" cy="327" r="2.2" class="ah"/><text class="s q0" x="42" y="331">Start 100 feet beyond the landing threshold and run</text><text class="s q0" x="42" y="346">to 3,000 feet beyond it or the runway midpoint,</text><text class="s q0" x="42" y="361">whichever is less.</text><rect class="cl" x="372" y="225" width="338" height="152" rx="8"/><rect x="372" y="225" width="338" height="26" rx="10" class="lav q5"/><text class="t q4" x="382" y="243">Land and hold short lights</text><circle cx="385" cy="261" r="2.2" class="ah"/><text class="s q0" x="394" y="265">Mark the hold short point on runways approved for</text><text class="s q0" x="394" y="280">LAHSO.</text><circle cx="385" cy="294" r="2.2" class="ah"/><text class="s q0" x="394" y="298">A row of pulsing white lights across the runway.</text><circle cx="385" cy="312" r="2.2" class="ah"/><text class="s q0" x="394" y="316">On whenever LAHSO is in effect; off when it is not.</text><text class="t" x="20" y="397" style="font-size:14px">Leaving or entering the runway</text><rect class="cl" x="20" y="407" width="690" height="206" rx="8"/><rect x="30" y="421" width="330" height="40" class="cl q6"/><text class="t m" x="195" y="446" style="font-size:12.5px">Runway</text><rect x="150" y="461" width="80" height="122" class="cl q6"/><path d="M150 495L230 495" style="stroke:#e8b923;stroke-width:3"/><circle cx="154" cy="505" r="3.3" class="q2"/><circle cx="166" cy="505" r="3.3" class="q2"/><circle cx="178" cy="505" r="3.3" class="q2"/><circle cx="190" cy="505" r="3.3" class="q2"/><circle cx="202" cy="505" r="3.3" class="q2"/><circle cx="214" cy="505" r="3.3" class="q2"/><circle cx="226" cy="505" r="3.3" class="q2"/><circle cx="142" cy="505" r="4.4" class="q2"/><circle cx="238" cy="505" r="4.4" class="q2"/><circle cx="190" cy="487" r="3.6" class="q7"/><circle cx="190" cy="476" r="3.6" style="fill:#e8b923;stroke:currentColor;stroke-width:1.2"/><circle cx="190" cy="465" r="3.6" class="q7"/><text class="t m" x="190" y="579" style="font-size:12px">Taxiway</text><text class="s e q3" x="136" y="509">Stop bar</text><text class="s e q3" x="136" y="477">Lead-on lights</text><circle cx="383" cy="431" r="2.2" class="ah"/><text class="s q3" x="392" y="435">Stop bar (red): in-pavement steady red lights across</text><text class="s q3" x="392" y="449.5">the taxiway at the runway holding position, plus</text><text class="s q3" x="392" y="464">elevated red lights each side. Confirms the ATC</text><text class="s q3" x="392" y="478.5">clearance to enter or cross in low visibility (below</text><text class="s q3" x="392" y="493">1,200 ft RVR).</text><circle cx="383" cy="507.5" r="2.2" class="ah"/><text class="s q3" x="392" y="511.5">After the clearance, the stop bar goes off and the</text><text class="s q3" x="392" y="526">lead-on lights come on. They reset automatically.</text><circle cx="383" cy="540.5" r="2.2" class="ah"/><text class="s q3" x="392" y="544.5">Lead-off and lead-on lights: alternate green and</text><text class="s q3" x="392" y="559">yellow, starting with green at the runway centerline,</text><text class="s q3" x="392" y="573.5">to one light past the holding position. They warn</text><text class="s q3" x="392" y="588">that you are in the runway environment or ILS</text><text class="s q3" x="392" y="602.5">critical area.</text><rect class="cl" x="20" y="625" width="220.67" height="197" rx="8"/><rect x="20" y="625" width="220.67" height="26" rx="10" class="mint q5"/><text class="t q4" x="30" y="643">Clearance bar lights</text><circle cx="33" cy="661" r="2.2" class="ah"/><text class="s q0" x="42" y="665">At taxiway holding positions to</text><text class="s q0" x="42" y="680">make them easier to see in low</text><text class="s q0" x="42" y="695">visibility.</text><circle cx="33" cy="709" r="2.2" class="ah"/><text class="s q0" x="42" y="713">May also mark an intersecting</text><text class="s q0" x="42" y="728">taxiway in darkness.</text><circle cx="33" cy="742" r="2.2" class="ah"/><text class="s q0" x="42" y="746">Three in-pavement steady yellow</text><text class="s q0" x="42" y="761">lights.</text><rect class="cl" x="254.67" y="625" width="220.67" height="197" rx="8"/><rect x="254.67" y="625" width="220.67" height="26" rx="10" class="rose q5"/><text class="t q4" x="264.67" y="643">Runway guard lights</text><circle cx="267.67" cy="661" r="2.2" class="ah"/><text class="s q0" x="276.67" y="665">At taxiway and runway</text><text class="s q0" x="276.67" y="680">intersections, mainly in low</text><text class="s q0" x="276.67" y="695">visibility, but may be used in</text><text class="s q0" x="276.67" y="710">any weather.</text><circle cx="267.67" cy="724" r="2.2" class="ah"/><text class="s q0" x="276.67" y="728">A pair of elevated flashing</text><text class="s q0" x="276.67" y="743">yellow lights each side of the</text><text class="s q0" x="276.67" y="758">taxiway, or a row of</text><text class="s q0" x="276.67" y="773">in-pavement yellow lights</text><text class="s q0" x="276.67" y="788">across the taxiway, at the</text><text class="s q0" x="276.67" y="803">holding position marking.</text><rect class="cl" x="489.33" y="625" width="220.67" height="197" rx="8"/><rect x="489.33" y="625" width="220.67" height="26" rx="10" class="sky q5"/><text class="t q4" x="499.33" y="643">Runway status lights</text><circle cx="502.33" cy="661" r="2.2" class="ah"/><text class="s q0" x="511.33" y="665">Red lights that show only</text><text class="s q0" x="511.33" y="680">runway status, not clearance to</text><text class="s q0" x="511.33" y="695">enter or take off.</text><circle cx="502.33" cy="709" r="2.2" class="ah"/><text class="s q0" x="511.33" y="713">Runway Entrance Lights warn of</text><text class="s q0" x="511.33" y="728">conflicting traffic when</text><text class="s q0" x="511.33" y="743">entering or crossing.</text><circle cx="502.33" cy="757" r="2.2" class="ah"/><text class="s q0" x="511.33" y="761">Takeoff Hold Lights warn</text><text class="s q0" x="511.33" y="776">aircraft in position for</text><text class="s q0" x="511.33" y="791">takeoff that the runway is</text><text class="s q0" x="511.33" y="806">occupied.</text></svg>
