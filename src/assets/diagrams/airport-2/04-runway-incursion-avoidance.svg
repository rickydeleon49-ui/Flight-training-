<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 959.5" role="img" aria-labelledby="ti de"><title id="ti">Avoiding a runway incursion</title><desc id="de">What a runway incursion is, then three groups of habits: plan with the airport diagram, signs and NOTAMs; hear it right by reading back, writing down and saying unable; and look with eyes outside. Extra care with hold short, line up and wait, and runway crossing instructions, the numbers from the FAA data, and runway confusion.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11.5px}.q1{font-size:13px}.q2{stroke:currentColor;stroke-width:1.5}.q3{font-size:16px}</style><text class="t" x="20" y="28" style="font-size:15px">Avoiding a runway incursion</text><text class="s q1" x="20" y="50">A runway incursion is any occurrence in the airport runway environment involving an aircraft, vehicle,</text><text class="s q1" x="20" y="66.5">person or object on the ground that creates a collision hazard or a loss of required separation with</text><text class="s q1" x="20" y="83">an aircraft taking off, intending to take off, landing or intending to land.</text><rect class="cl" x="20" y="107.5" width="220.67" height="245" rx="8"/><rect x="20" y="107.5" width="220.67" height="26" rx="10" class="sky q2"/><text class="t q1" x="30" y="125.5">Plan</text><circle cx="33" cy="143.5" r="2.2" class="ah"/><text class="s q0" x="42" y="147.5">Review the airport layout in</text><text class="s q0" x="42" y="162.5">preflight planning, before</text><text class="s q0" x="42" y="177.5">descending to land and while</text><text class="s q0" x="42" y="192.5">taxiing.</text><circle cx="33" cy="206.5" r="2.2" class="ah"/><text class="s q0" x="42" y="210.5">Know airport signage.</text><circle cx="33" cy="224.5" r="2.2" class="ah"/><text class="s q0" x="42" y="228.5">Review NOTAMs for runway and</text><text class="s q0" x="42" y="243.5">taxiway closures and</text><text class="s q0" x="42" y="258.5">construction.</text><circle cx="33" cy="272.5" r="2.2" class="ah"/><text class="s q0" x="42" y="276.5">Keep a current airport diagram</text><text class="s q0" x="42" y="291.5">and trace your taxi route.</text><rect class="cl" x="254.67" y="107.5" width="220.67" height="245" rx="8"/><rect x="254.67" y="107.5" width="220.67" height="26" rx="10" class="lav q2"/><text class="t q1" x="264.67" y="125.5">Hear it right</text><circle cx="267.67" cy="143.5" r="2.2" class="ah"/><text class="s q0" x="276.67" y="147.5">Read back all runway crossing</text><text class="s q0" x="276.67" y="162.5">and hold instructions,</text><text class="s q0" x="276.67" y="177.5">including the runway and your</text><text class="s q0" x="276.67" y="192.5">call sign.</text><circle cx="267.67" cy="206.5" r="2.2" class="ah"/><text class="s q0" x="276.67" y="210.5">Write down complex taxi</text><text class="s q0" x="276.67" y="225.5">instructions, especially at</text><text class="s q0" x="276.67" y="240.5">unfamiliar airports.</text><circle cx="267.67" cy="254.5" r="2.2" class="ah"/><text class="s q0" x="276.67" y="258.5">Ask for "progressive taxi" if</text><text class="s q0" x="276.67" y="273.5">unsure of the route, or "say</text><text class="s q0" x="276.67" y="288.5">again".</text><circle cx="267.67" cy="302.5" r="2.2" class="ah"/><text class="s q0" x="276.67" y="306.5">Say "UNABLE" if you cannot</text><text class="s q0" x="276.67" y="321.5">safely comply.</text><rect class="cl" x="489.33" y="107.5" width="220.67" height="245" rx="8"/><rect x="489.33" y="107.5" width="220.67" height="26" rx="10" class="mint q2"/><text class="t q1" x="499.33" y="125.5">Look</text><circle cx="502.33" cy="143.5" r="2.2" class="ah"/><text class="s q0" x="511.33" y="147.5">Heads-up, eyes outside; give</text><text class="s q0" x="511.33" y="162.5">your full attention to surface</text><text class="s q0" x="511.33" y="177.5">navigation.</text><circle cx="502.33" cy="191.5" r="2.2" class="ah"/><text class="s q0" x="511.33" y="195.5">Check for traffic before</text><text class="s q0" x="511.33" y="210.5">crossing a hold line or</text><text class="s q0" x="511.33" y="225.5">entering a taxiway.</text><circle cx="502.33" cy="239.5" r="2.2" class="ah"/><text class="s q0" x="511.33" y="243.5">Scan the full length of the</text><text class="s q0" x="511.33" y="258.5">runway and the final</text><text class="s q0" x="511.33" y="273.5">approaches, even with a</text><text class="s q0" x="511.33" y="288.5">clearance.</text><circle cx="502.33" cy="302.5" r="2.2" class="ah"/><text class="s q0" x="511.33" y="306.5">Turn on aircraft lights and the</text><text class="s q0" x="511.33" y="321.5">rotating beacon or strobe</text><text class="s q0" x="511.33" y="336.5">lights while taxiing.</text><text class="t" x="20" y="372.5" style="font-size:14px">Instructions that need extra care</text><rect class="cl" x="20" y="382.5" width="220.67" height="242" rx="8"/><rect x="20" y="382.5" width="220.67" height="26" rx="10" class="rose q2"/><text class="t q1" x="30" y="400.5">Hold short</text><circle cx="33" cy="418.5" r="2.2" class="ah"/><text class="s q0" x="42" y="422.5">Taxi up to, but do not cross,</text><text class="s q0" x="42" y="437.5">any part of the runway holding</text><text class="s q0" x="42" y="452.5">marking.</text><circle cx="33" cy="466.5" r="2.2" class="ah"/><text class="s q0" x="42" y="470.5">At a towered airport, never</text><text class="s q0" x="42" y="485.5">cross a hold marking or enter a</text><text class="s q0" x="42" y="500.5">runway without explicit ATC</text><text class="s q0" x="42" y="515.5">instructions to cross, take off</text><text class="s q0" x="42" y="530.5">or "line up and wait" on that</text><text class="s q0" x="42" y="545.5">runway.</text><circle cx="33" cy="559.5" r="2.2" class="ah"/><text class="s q0" x="42" y="563.5">Read back the whole clearance</text><text class="s q0" x="42" y="578.5">and the hold short instruction,</text><text class="s q0" x="42" y="593.5">with runway and call sign. This</text><text class="s q0" x="42" y="608.5">is mandatory, verbatim.</text><rect class="cl" x="254.67" y="382.5" width="220.67" height="242" rx="8"/><rect x="254.67" y="382.5" width="220.67" height="26" rx="10" class="sky q2"/><text class="t q1" x="264.67" y="400.5">Line up and wait</text><circle cx="267.67" cy="418.5" r="2.2" class="ah"/><text class="s q0" x="276.67" y="422.5">It is not a takeoff clearance,</text><text class="s q0" x="276.67" y="437.5">only a clearance to enter the</text><text class="s q0" x="276.67" y="452.5">runway and hold in position.</text><circle cx="267.67" cy="466.5" r="2.2" class="ah"/><text class="s q0" x="276.67" y="470.5">Pay close attention at night or</text><text class="s q0" x="276.67" y="485.5">in low visibility.</text><circle cx="267.67" cy="499.5" r="2.2" class="ah"/><text class="s q0" x="276.67" y="503.5">Scan the full length of the</text><text class="s q0" x="276.67" y="518.5">runway and its approach end</text><text class="s q0" x="276.67" y="533.5">before entering.</text><rect class="cl" x="489.33" y="382.5" width="220.67" height="242" rx="8"/><rect x="489.33" y="382.5" width="220.67" height="26" rx="10" class="lav q2"/><text class="t q1" x="499.33" y="400.5">Crossing runways</text><circle cx="502.33" cy="418.5" r="2.2" class="ah"/><text class="s q0" x="511.33" y="422.5">ATC must issue explicit "cross"</text><text class="s q0" x="511.33" y="437.5">or "hold short" instructions</text><text class="s q0" x="511.33" y="452.5">for each runway, active,</text><text class="s q0" x="511.33" y="467.5">inactive or closed.</text><circle cx="502.33" cy="481.5" r="2.2" class="ah"/><text class="s q0" x="511.33" y="485.5">Crossings are normally issued</text><text class="s q0" x="511.33" y="500.5">one at a time.</text><circle cx="502.33" cy="514.5" r="2.2" class="ah"/><text class="s q0" x="511.33" y="518.5">Use extra caution at night and</text><text class="s q0" x="511.33" y="533.5">in reduced visibility.</text><text class="t" x="20" y="644.5" style="font-size:14px">Why it matters</text><rect class="cl" x="20" y="654.5" width="220.67" height="112" rx="8"/><rect x="20" y="654.5" width="220.67" height="34" rx="10" class="rose q2"/><text class="t m q3" x="130.33" y="677.5">About 3 a day</text><text class="s q0" x="30" y="708.5">Runway incursions at towered</text><text class="s q0" x="30" y="723.5">airports in the United States.</text><rect class="cl" x="254.67" y="654.5" width="220.67" height="112" rx="8"/><rect x="254.67" y="654.5" width="220.67" height="34" rx="10" class="sky q2"/><text class="t m q3" x="365" y="677.5">About 65%</text><text class="s q0" x="264.67" y="708.5">of runway incursions are caused</text><text class="s q0" x="264.67" y="723.5">by pilots; of those, almost half</text><text class="s q0" x="264.67" y="738.5">by general aviation pilots.</text><rect class="cl" x="489.33" y="654.5" width="220.67" height="112" rx="8"/><rect x="489.33" y="654.5" width="220.67" height="34" rx="10" class="lav q2"/><text class="t m q3" x="599.67" y="677.5">3 causes</text><text class="s q0" x="499.33" y="708.5">Failure to comply with ATC</text><text class="s q0" x="499.33" y="723.5">instructions, lack of airport</text><text class="s q0" x="499.33" y="738.5">familiarity, nonconformance with</text><text class="s q0" x="499.33" y="753.5">standard operating procedures.</text><rect class="cl" x="20" y="778.5" width="338" height="167" rx="8"/><rect x="20" y="778.5" width="338" height="26" rx="10" class="mint q2"/><text class="t q1" x="30" y="796.5">Taxiing at an unfamiliar airport</text><circle cx="33" cy="814.5" r="2.2" class="ah"/><text class="s q0" x="42" y="818.5">Can be very challenging, especially in darkness or</text><text class="s q0" x="42" y="833.5">low visibility.</text><circle cx="33" cy="847.5" r="2.2" class="ah"/><text class="s q0" x="42" y="851.5">Complete all checklists while the aircraft is</text><text class="s q0" x="42" y="866.5">stopped.</text><circle cx="33" cy="880.5" r="2.2" class="ah"/><text class="s q0" x="42" y="884.5">No non-essential chatter or other activities during</text><text class="s q0" x="42" y="899.5">taxi.</text><rect class="cl" x="372" y="778.5" width="338" height="167" rx="8"/><rect x="372" y="778.5" width="338" height="26" rx="10" class="rose q2"/><text class="t q1" x="382" y="796.5">Runway confusion</text><circle cx="385" cy="814.5" r="2.2" class="ah"/><text class="s q0" x="394" y="818.5">Often means unintentionally taking off or landing</text><text class="s q0" x="394" y="833.5">on a taxiway or the wrong runway, usually without</text><text class="s q0" x="394" y="848.5">knowing until afterwards.</text><circle cx="385" cy="862.5" r="2.2" class="ah"/><text class="s q0" x="394" y="866.5">Risk grows with airport complexity, runway</text><text class="s q0" x="394" y="881.5">thresholds close together, and using a runway as a</text><text class="s q0" x="394" y="896.5">taxiway.</text><circle cx="385" cy="910.5" r="2.2" class="ah"/><text class="s q0" x="394" y="914.5">Before adding power, check that your heading and</text><text class="s q0" x="394" y="929.5">the runway heading are aligned.</text></svg>
