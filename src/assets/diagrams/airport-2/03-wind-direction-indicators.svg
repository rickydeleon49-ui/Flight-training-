<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 757" role="img" aria-labelledby="ti de"><title id="ti">Wind direction indicators</title><desc id="de">Small drawings of a wind sock, a wind tee, a tetrahedron and a segmented circle, followed by what each tells the pilot: sock for direction and strength, tee and tetrahedron that swing freely or are set to the runway in use, the tetrahedron small end pointing in the landing direction, and the four parts of a segmented circle.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11.5px}.q1{font-size:13px}.q2{stroke:currentColor;stroke-width:1.5}.q3{font-size:10.5px}.q4{stroke-width:3}.q5{stroke:#ffffff;stroke-width:7}.q6{stroke-width:2.5}.q7{fill:var(--palette-berry,#A84C6B)}</style><text class="t" x="20" y="28" style="font-size:15px">Wind direction indicators</text><text class="s q1" x="20" y="50">The indicator is usually near the runway and may sit in the center of a segmented circle. It can be a</text><text class="s q1" x="20" y="66.5">wind cone, wind sock, tetrahedron or wind tee.</text><rect class="cl" x="20" y="91" width="165" height="186" rx="8"/><rect x="20" y="91" width="165" height="26" rx="10" class="sky q2"/><text class="t q1" x="30" y="109">Wind sock</text><rect class="cl" x="195" y="91" width="165" height="186" rx="8"/><rect x="195" y="91" width="165" height="26" rx="10" class="lav q2"/><text class="t q1" x="205" y="109">Wind tee</text><rect class="cl" x="370" y="91" width="165" height="186" rx="8"/><rect x="370" y="91" width="165" height="26" rx="10" class="mint q2"/><text class="t q1" x="380" y="109">Tetrahedron</text><rect class="cl" x="545" y="91" width="165" height="186" rx="8"/><rect x="545" y="91" width="165" height="26" rx="10" class="rose q2"/><text class="t q1" x="555" y="109">Segmented circle</text><path d="M44 229L44 143" class="dk q4"/><path d="M44 145L132 153L132 167L44 175Z" style="fill:#f0a020;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round"/><path d="M70 150.34L70 169.66" class="q5"/><path d="M96 152.68L96 167.32" class="q5"/><path d="M120 154.84L120 165.16" class="q5"/><path d="M44 145L44 175" class="dk q4"/><path d="M76 203L122 203" class="acc q6"/><path d="M130 203L122 206.6L122 199.4Z" class="dh q7"/><text class="s q3" x="80" y="195">Wind</text><text class="s q3" x="30" y="243">Points downwind.</text><path d="M277.5 219L277.5 141" class="dk" style="stroke-width:5"/><path d="M255.5 219L299.5 219" class="dk" style="stroke-width:5"/><circle cx="277.5" cy="179" r="4" class="ah"/><path d="M259.5 141L295.5 141" style="stroke:#ffffff;stroke-width:0"/><path d="M301.5 179a24 24 0 0 0 -16 -22" class="acc q6"/><text class="s q3" x="205" y="243">Swings freely; can be set</text><text class="s q3" x="205" y="257">to the runway in use.</text><path d="M418.5 169L482.5 153L482.5 185Z" style="fill:#ffffff;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;fill-opacity:.9"/><path d="M418.5 169L482.5 169" style="stroke:currentColor;stroke-width:1;opacity:.5"/><path d="M482.5 169L496.5 169" class="dk q4"/><path d="M444.5 203L410.5 203" class="acc q6"/><path d="M402.5 203L410.5 199.4L410.5 206.6Z" class="dh q7"/><text class="s q3" x="380" y="243">Small end points in the</text><text class="s q3" x="380" y="257">landing direction.</text><circle cx="627.5" cy="187" r="38" style="fill:none;stroke:currentColor;stroke-width:6;stroke-dasharray:14 6;opacity:.85"/><path d="M619.5 195L635.5 179" class="dk q4"/><circle cx="627.5" cy="187" r="3" style="fill:#e8b923;stroke:currentColor;stroke-width:1.2"/><text class="s q3" x="555" y="243">Shows traffic pattern</text><text class="s q3" x="555" y="257">information.</text><text class="t" x="20" y="295" style="font-size:14px">What each one tells you</text><rect class="cl" x="20" y="305" width="338" height="122" rx="8"/><rect x="20" y="305" width="338" height="26" rx="10" class="sky q2"/><text class="t q1" x="30" y="323">Wind sock</text><circle cx="33" cy="341" r="2.2" class="ah"/><text class="s q0" x="42" y="345">Shows wind direction and lets the pilot estimate</text><text class="s q0" x="42" y="360">wind velocity and/or gust factor.</text><circle cx="33" cy="374" r="2.2" class="ah"/><text class="s q0" x="42" y="378">Extends out straighter in strong winds.</text><circle cx="33" cy="392" r="2.2" class="ah"/><text class="s q0" x="42" y="396">Tends to move back and forth when the wind is</text><text class="s q0" x="42" y="411">gusting.</text><rect class="cl" x="372" y="305" width="338" height="122" rx="8"/><rect x="372" y="305" width="338" height="26" rx="10" class="lav q2"/><text class="t q1" x="382" y="323">Wind tee and tetrahedron</text><circle cx="385" cy="341" r="2.2" class="ah"/><text class="s q0" x="394" y="345">Both can swing freely and align with the wind</text><text class="s q0" x="394" y="360">direction.</text><circle cx="385" cy="374" r="2.2" class="ah"/><text class="s q0" x="394" y="378">Either can also be manually set to align with the</text><text class="s q0" x="394" y="393">runway in use, so look at the wind sock too, if</text><text class="s q0" x="394" y="408">there is one.</text><text class="t" x="20" y="447" style="font-size:14px">The tetrahedron and the segmented circle</text><rect class="cl" x="20" y="457" width="338" height="230" rx="8"/><rect x="20" y="457" width="338" height="26" rx="10" class="mint q2"/><text class="t q1" x="30" y="475">Tetrahedron</text><circle cx="33" cy="493" r="2.2" class="ah"/><text class="s q0" x="42" y="497">Installed to indicate the direction of landings and</text><text class="s q0" x="42" y="512">takeoffs when conditions at the airport warrant it.</text><circle cx="33" cy="526" r="2.2" class="ah"/><text class="s q0" x="42" y="530">May be at the center of a segmented circle and may</text><text class="s q0" x="42" y="545">be lighted for night operations.</text><circle cx="33" cy="559" r="2.2" class="ah"/><text class="s q0" x="42" y="563">The small end points in the direction of landing.</text><text class="s q0" x="42" y="578">Use it only as a landing direction indicator.</text><circle cx="33" cy="592" r="2.2" class="ah"/><text class="s q0" x="42" y="596">At a towered airport, refer to it only when the</text><text class="s q0" x="42" y="611">tower is not operating. Tower instructions</text><text class="s q0" x="42" y="626">supersede it.</text><rect class="cl" x="372" y="457" width="338" height="230" rx="8"/><rect x="372" y="457" width="338" height="26" rx="10" class="rose q2"/><text class="t q1" x="382" y="475">Segmented circle</text><circle cx="385" cy="493" r="2.2" class="ah"/><text class="s q0" x="394" y="497">At airports without an operating control tower, a</text><text class="s q0" x="394" y="512">segmented circle visual indicator system, if</text><text class="s q0" x="394" y="527">installed, gives traffic pattern information.</text><circle cx="385" cy="541" r="2.2" class="ah"/><text class="s q0" x="394" y="545">It sits where pilots in the air and on the ground</text><text class="s q0" x="394" y="560">can see it best.</text><circle cx="385" cy="574" r="2.2" class="ah"/><text class="s q0" x="394" y="578">Its parts: wind direction indicators, landing</text><text class="s q0" x="394" y="593">direction indicators, landing strip indicators and</text><text class="s q0" x="394" y="608">traffic pattern indicators.</text><circle cx="385" cy="622" r="2.2" class="ah"/><text class="s q0" x="394" y="626">Traffic pattern indicators come in pairs, with</text><text class="s q0" x="394" y="641">landing strip indicators, and show the direction of</text><text class="s q0" x="394" y="656">turns when the pattern is not the normal left</text><text class="s q0" x="394" y="671">traffic pattern.</text><rect class="cl" x="20" y="701" width="690" height="48" rx="8"/><text class="s" x="32" y="720" style="font-size:12px">If there is no segmented circle, traffic pattern indicators may be installed on or near the end of the</text><text class="s" x="32" y="735.5" style="font-size:12px">runway.</text></svg>
