<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 430" role="img" aria-labelledby="ti de"><title id="ti">Obstructions and elevation figures</title><desc id="de">Obstruction symbols for obstacles 200 to 1000 feet AGL, 1000 feet AGL and higher, under construction, group obstruction, wind turbine and high-intensity lights. An example tower labeled 1473 over (394) shows the top elevation above mean sea level with the height above ground in parentheses. The maximum elevation figure is the highest elevation in a quadrant rounded up to the next 100 feet, with the last two digits dropped; examples are 2649 plus 100 giving 28, and 13161 plus 100 plus 200 giving 135.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><text class="t" x="20" y="30" style="font-size:16px">Obstruction symbols</text><path d="M37 68L44 46L51 68M40.5 58.1H47.5" style="fill:none;stroke:currentColor;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round"/><text class="t" x="82" y="58" style="font-size:13.5px">Above 200' and below 1000' AGL</text><text class="s" x="82" y="74" style="font-size:12px">(above 299' AGL in an urban area)</text><path d="M36 118L44 86L52 118M40.0 103.6H48.0" style="fill:none;stroke:currentColor;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round"/><text class="t" x="82" y="108" style="font-size:13.5px">1000' AGL and higher</text><text class="s" x="82" y="124" style="font-size:12px">Taller symbol</text><path d="M37 168L44 146L51 168M40.5 158.1H47.5" style="fill:none;stroke:currentColor;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round"/><text class="t" x="82" y="158" style="font-size:13.5px">UC: under construction</text><text class="s" x="82" y="174" style="font-size:12px">Or reported, position or elevation unverified</text><path d="M30 218L36 194L42 218M33.0 207.2H39.0" style="fill:none;stroke:currentColor;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round"/><path d="M46 218L52 191.6L58 218M49.0 206.12H55.0" style="fill:none;stroke:currentColor;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round"/><text class="t" x="82" y="208" style="font-size:13.5px">Group obstruction</text><text class="s" x="82" y="224" style="font-size:12px">Only the highest in a high-density area</text><path d="M44 268V246M44 246L34 238M44 246L54 238M44 246V234" style="fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round"/><circle cx="44" cy="246" r="2.5" class="dh"/><text class="t" x="82" y="258" style="font-size:13.5px">Wind turbine</text><text class="s" x="82" y="274" style="font-size:12px">Blade tips are not lighted</text><path d="M35.3 289.0L29.3 285.5" style="stroke:currentColor;stroke-width:2;stroke-linecap:round"/><path d="M39.0 285.3L35.5 279.3" style="stroke:currentColor;stroke-width:2;stroke-linecap:round"/><path d="M44.0 284.0L44.0 277.0" style="stroke:currentColor;stroke-width:2;stroke-linecap:round"/><path d="M49.0 285.3L52.5 279.3" style="stroke:currentColor;stroke-width:2;stroke-linecap:round"/><path d="M52.7 289.0L58.7 285.5" style="stroke:currentColor;stroke-width:2;stroke-linecap:round"/><path d="M37 318L44 292L51 318M40.5 306.3H47.5" style="fill:none;stroke:currentColor;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round"/><text class="t" x="82" y="308" style="font-size:13.5px">High-intensity lights</text><text class="s" x="82" y="324" style="font-size:12px">May run part-time or on proximity</text><text class="t" x="395" y="30" style="font-size:16px">MSL and AGL numbers</text><rect class="cl" x="390" y="38" width="325" height="168" rx="8"/><path d="M395 170Q455 156 525 162T705 170" style="fill:none;stroke:currentColor;stroke-width:2.5;opacity:.8"/><path d="M395 186H710" class="o d" style="stroke-width:1.5;opacity:.5"/><text class="s" x="399" y="198" style="font-size:11.5px">Mean sea level (MSL)</text><path d="M527 162V70" style="stroke:currentColor;stroke-width:5;stroke-linecap:round"/><path d="M519 166L527 166L535 166M523.0 166.0H531.0" style="fill:none;stroke:currentColor;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round"/><path d="M553 162V70M549 162H557M549 70H557" class="o" style="stroke-width:1.5"/><text class="t" x="563" y="128" style="font-size:12px">AGL height</text><text class="s" x="563" y="143" style="font-size:11.5px">(394): in parentheses,</text><text class="s" x="563" y="157" style="font-size:11.5px">below the MSL figure</text><path d="M501 70V186M497 70H505M497 186H505" class="o" style="stroke-width:1.5"/><text class="t e" x="497" y="105" style="font-size:12px">MSL</text><text class="t e" x="497" y="120" style="font-size:14px">1473</text><text class="s e" x="497" y="135" style="font-size:11.5px">top above</text><text class="s e" x="497" y="148" style="font-size:11.5px">sea level</text><text class="t" x="399" y="56" style="font-size:13px">Example tower: 1473 (394)</text><text class="t" x="395" y="222" style="font-size:16px">Maximum Elevation Figure (MEF)</text><rect x="395" y="234" width="96" height="70" class="mint o" style="stroke-width:2.5"/><path d="M427 234v6M427 298v6" class="o" style="stroke-width:1.5"/><path d="M459 234v6M459 298v6" class="o" style="stroke-width:1.5"/><path d="M443 234V304M395 269H491" class="o d" style="stroke-width:1.2;opacity:.6"/><text class="t m" x="419" y="257" style="font-size:20px">135</text><text class="t m" x="467" y="298" style="font-size:17px">28</text><text class="s" x="503" y="248" style="font-size:12.5px">Highest elevation in a quadrant</text><text class="s" x="503" y="264" style="font-size:12.5px">(30 min lat x 30 min long, ticked lines):</text><text class="s" x="503" y="280" style="font-size:12.5px">terrain and obstacles, rounded up to</text><text class="s" x="503" y="296" style="font-size:12.5px">100 ft; last two digits not shown.</text><rect class="cl" x="20" y="334" width="690" height="86" rx="8"/><text class="s" x="32" y="354" style="font-size:12px">Charted obstacles are generally over 200 ft AGL (299 ft AGL in yellow city tint).</text><text class="s" x="32" y="373" style="font-size:12px">MEF, man-made: 2649 + 100 = 2749, to 2800, shown 28. Natural: 13161 + 100 + 200 = 13461, to 13500: 135</text><text class="s" x="32" y="392" style="font-size:12px">Obstacle elevation = top above MSL; AGL height in parentheses beneath it (may be omitted in congested areas).</text><text class="s" x="32" y="411" style="font-size:12px">Wind turbine farm: hatched area, dotted outline, boxed MSL elevation of the highest turbine (UC if unverified).</text></svg>
