<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 430" role="img" aria-labelledby="ti de"><title id="ti">Airport data block</title><desc id="de">An example towered airport data block in blue with made-up values. Lines: FSS and NO SVFR; boxed name with location and ICAO identifiers; control tower frequency, part-time star, CTAF, and ATIS; elevation 285, lighting L, longest runway 72 hundred feet, advisory frequency; right traffic runways; VFR advisory frequency; airport of entry. Lighting and runway length rules are noted.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:12px}.q1{font-size:16px}.q2{stroke:currentColor;stroke-width:1.5;opacity:.5}.q3{font-size:13px}</style><text class="t q1" x="20" y="36">Example airport (made-up data)</text><rect class="sky" x="20" y="46" width="330" height="290" rx="8"/><text class="t q1" x="34" y="75">FSS  NO SVFR</text><text class="s q0" x="366" y="73">FSS: Flight Service Station on field</text><text class="s q0" x="366" y="87">NO SVFR: fixed wing special VFR prohibited (FAR 91)</text><path d="M345 70H360" class="q2"/><text class="t q1" x="34" y="109">[EXAMPLE] (EXM) (KEXM)</text><text class="s q0" x="366" y="107">Boxed name: FAR 93 special traffic rules / pattern</text><text class="s q0" x="366" y="121">(EXM) location identifier; (KEXM) ICAO identifier</text><path d="M345 104H360" class="q2"/><text class="t q1" x="34" y="143">CT - 118.3 ★ Ⓒ  ATIS 123.8</text><text class="s q0" x="366" y="141">CT - 118.3: control tower, primary frequency</text><text class="s q0" x="366" y="155">★ part-time operation (see tower tabulation)</text><text class="s q0" x="366" y="169">Ⓒ follows the CTAF.  ATIS: weather broadcast</text><path d="M345 138H360" class="q2"/><text class="t q1" x="34" y="191">285  L  72  122.95</text><text class="s q0" x="366" y="189">285: airport elevation in feet (highest usable point)</text><text class="s q0" x="366" y="203">L: lighting sunset to sunrise (*L: see Chart Supplement)</text><text class="s q0" x="366" y="217">72: longest runway, hundreds of feet (usable may be less)</text><text class="s q0" x="366" y="231">122.95: aeronautical advisory station</text><path d="M345 186H360" class="q2"/><text class="t q1" x="34" y="253">RP 23, 34</text><text class="s q0" x="366" y="251">Right traffic: runways 23, 34 (*RP: see Supplement)</text><path d="M345 248H360" class="q2"/><text class="t q1" x="34" y="273">VFR Advsy 125.0</text><text class="s q0" x="366" y="271">VFR advisory: shown when ATIS is not available and</text><text class="s q0" x="366" y="285">frequency is other than the primary CT frequency</text><path d="M345 268H360" class="q2"/><text class="t q1" x="34" y="307">AOE</text><text class="s q0" x="366" y="305">Airport of Entry</text><path d="M345 302H360" class="q2"/><rect class="cl" x="20" y="348" width="690" height="72" rx="8"/><text class="s q3" x="32" y="368">Blue: towered airport (CT). All other airports and data are magenta.  A dash replaces any missing item.</text><text class="s q3" x="32" y="387">Lighting codes refer to runway edge lights and may not match the longest runway.</text><text class="s q3" x="32" y="406">Runway length is charted to the nearest 100 ft, rounding at 70: 8070 ft shows 81, 8069 ft shows 80.</text><text class="s e q0" x="710" y="36">Example data only, not a real airport.</text></svg>
