<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 430" role="img" aria-labelledby="ti de"><title id="ti">Sectional airport symbols</title><desc id="de">Chart symbols for airports. Airports with control towers and their data are blue; all other airports are magenta. Hard-surfaced runways over 8069 feet or some multiple runways under 8069 feet, hard-surfaced runways 1500 to 8069 feet, other than hard-surfaced runways shown as an open circle, seaplane bases shown as an anchor, fuel shown by tick marks, military airports, foreign airports, and the rotating beacon star.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><rect class="cl" x="20" y="16" width="690" height="70" rx="8"/><circle cx="52" cy="51" r="14" style="fill:var(--palette-sky,#8EBFDA);stroke:var(--palette-sky,#8EBFDA);stroke-width:2"/><path d="M44.3 43.3L59.7 58.7M59.7 43.3L44.3 58.7" style="stroke:#17233c;stroke-width:2.5;stroke-linecap:round"/><text class="t" x="78" y="45" style="font-size:15px">Control tower (CT): blue</text><text class="s" x="78" y="65" style="font-size:13px">Airport and its data are blue</text><circle cx="392" cy="51" r="14" style="fill:var(--palette-berry,#A84C6B);stroke:var(--palette-berry,#A84C6B);stroke-width:2"/><path d="M384.3 43.3L399.7 58.7M399.7 43.3L384.3 58.7" style="stroke:#ffffff;stroke-width:2.5;stroke-linecap:round"/><text class="t" x="418" y="45" style="font-size:15px">No control tower: magenta</text><text class="s" x="418" y="65" style="font-size:13px">All other airports and data are magenta</text><g style="stroke:var(--palette-berry,#A84C6B);stroke-width:3;fill:none;stroke-linejoin:round"><path d="M37.3 113.8H66.7M37.3 122.2H66.7M47.8 101.2V134.8M56.2 101.2V134.8" style="stroke-width:2.5"/></g><circle cx="52" cy="118" r="17" style="fill:none;stroke:var(--palette-berry,#A84C6B);stroke-width:2"/><text class="t" x="86" y="115" style="font-size:14px">Hard-surfaced runway over 8069'</text><text class="s" x="86" y="132" style="font-size:12.5px">or some multiple runways under 8069'</text><circle cx="52" cy="168" r="15" style="fill:var(--palette-berry,#A84C6B);stroke:var(--palette-berry,#A84C6B);stroke-width:2"/><path d="M43.8 159.8L60.2 176.2M60.2 159.8L43.8 176.2" style="stroke:#ffffff;stroke-width:2.5;stroke-linecap:round"/><text class="t" x="86" y="165" style="font-size:14px">Hard-surfaced runway 1500' to 8069'</text><text class="s" x="86" y="182" style="font-size:12.5px">Runway pattern shown if hard-surfaced 1500'+</text><circle cx="52" cy="218" r="13" style="fill:none;stroke:var(--palette-berry,#A84C6B);stroke-width:3"/><text class="t" x="86" y="215" style="font-size:14px">Other than hard-surfaced runways</text><text class="s" x="86" y="232" style="font-size:12.5px">Soft-surfaced; public use</text><g style="stroke:var(--palette-berry,#A84C6B);stroke-width:3;fill:none;stroke-linecap:round"><circle cx="52" cy="257" r="3.5"/><path d="M52 261V279M46 266H58M42 271Q44 280 52 280Q60 280 62 271"/></g><text class="t" x="86" y="265" style="font-size:14px">Seaplane base</text><text class="s" x="86" y="282" style="font-size:12.5px">Anchor eye drawn near the docking area</text><circle cx="412" cy="118" r="13" style="fill:var(--palette-berry,#A84C6B);stroke:var(--palette-berry,#A84C6B);stroke-width:2"/><path d="M404.9 110.8L419.1 125.2M419.1 110.8L404.9 125.2" style="stroke:#ffffff;stroke-width:2.5;stroke-linecap:round"/><path d="M425.0 118.0L430.0 118.0" style="stroke:var(--palette-berry,#A84C6B);stroke-width:3;stroke-linecap:round"/><path d="M421.2 127.2L424.7 130.7" style="stroke:var(--palette-berry,#A84C6B);stroke-width:3;stroke-linecap:round"/><path d="M412.0 131.0L412.0 136.0" style="stroke:var(--palette-berry,#A84C6B);stroke-width:3;stroke-linecap:round"/><path d="M402.8 127.2L399.3 130.7" style="stroke:var(--palette-berry,#A84C6B);stroke-width:3;stroke-linecap:round"/><path d="M399.0 118.0L394.0 118.0" style="stroke:var(--palette-berry,#A84C6B);stroke-width:3;stroke-linecap:round"/><path d="M402.8 108.8L399.3 105.3" style="stroke:var(--palette-berry,#A84C6B);stroke-width:3;stroke-linecap:round"/><path d="M412.0 105.0L412.0 100.0" style="stroke:var(--palette-berry,#A84C6B);stroke-width:3;stroke-linecap:round"/><path d="M421.2 108.8L424.7 105.3" style="stroke:var(--palette-berry,#A84C6B);stroke-width:3;stroke-linecap:round"/><text class="t" x="446" y="115" style="font-size:14px">Fuel available</text><text class="s" x="446" y="132" style="font-size:12.5px">Tick marks around the airport symbol</text><circle cx="412" cy="168" r="15" style="fill:none;stroke:var(--palette-berry,#A84C6B);stroke-width:3"/><circle cx="412" cy="168" r="7" style="fill:none;stroke:var(--palette-berry,#A84C6B);stroke-width:3"/><text class="t" x="446" y="165" style="font-size:14px">Military: other than hard-surfaced</text><text class="s" x="446" y="182" style="font-size:12.5px">AAF, AFB, MCAS, NAS, NAV, NAAS in name</text><circle cx="412" cy="218" r="13" style="fill:none;stroke:currentColor;stroke-width:3"/><text class="t" x="446" y="215" style="font-size:14px">Foreign airports</text><text class="s" x="446" y="232" style="font-size:12.5px">Hard-surfaced shown like public-use</text><polygon points="412.0,256.0 415.2,263.6 423.4,264.3 417.1,269.7 419.1,277.7 412.0,273.4 404.9,277.7 406.9,269.7 400.6,264.3 408.8,263.6" style="fill:none;stroke:var(--palette-berry,#A84C6B);stroke-width:2;stroke-linejoin:round"/><text class="t" x="446" y="265" style="font-size:14px">Rotating or flashing beacon</text><text class="s" x="446" y="282" style="font-size:12.5px">Operates dusk to dawn</text><rect class="cl" x="20" y="300" width="690" height="120" rx="8"/><text class="s" x="32" y="324" style="font-size:13px">Public-use symbols show the runway surface and size. Military and foreign airports have their own.</text><text class="s" x="32" y="344" style="font-size:13px">Consult the Chart Supplement for fuel details and availability.</text><text class="s" x="32" y="364" style="font-size:13px">Airports sit at their true position unless a NAVAID is at the same spot; then the airport is displaced.</text><text class="s" x="32" y="384" style="font-size:13px">Every recognizable runway is shown, even ones that may be closed. Names are official FAA names.</text><text class="s" x="32" y="410" style="font-size:12px">Symbols redrawn in app colours; the guide shows blue for towered and magenta for all other airports.</text></svg>
