<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 430" role="img" aria-labelledby="ti de"><title id="ti">Navaids and routes</title><desc id="de">Navaid symbols on a sectional: VOR hexagon, VORTAC hexagon with tabs, VOR-DME hexagon inside a square, DME square shown without the compass rose, and NDB dotted circle. A compass rose oriented to magnetic north surrounds a VOR. A Victor airway, V12 as an example, joins two VORs; VOR airways are black and named V plus the route number on IFR enroute low charts.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{stroke:var(--palette-sky,#8EBFDA);stroke-width:2}.q1{font-size:12.5px}.q2{font-size:15px}.q3{font-size:12px}.q4{font-size:13px}.q5{fill:none;stroke:var(--palette-sky,#8EBFDA);stroke-width:2.5;stroke-linejoin:round}.q6{stroke:var(--palette-sky,#8EBFDA);stroke-width:5;stroke-linecap:round}.q7{fill:none;stroke:var(--palette-sky,#8EBFDA);stroke-width:2.5}</style><text class="t" x="20" y="30" style="font-size:16px">Radio aids to navigation (NAVAIDs)</text><polygon points="53.5,69.5 44,75 34.5,69.5 34.5,58.5 44,53 53.5,58.5" class="q5"/><text class="t q2" x="80" y="62">VOR</text><text class="s q1" x="80" y="79">Hexagon; "VOR" breaks the top line of the box</text><polygon points="52.7,123 44,128 35.3,123 35.3,113 44,108 52.7,113" class="q5"/><path d="M48.3 125.4L52.5 132.7" class="q6"/><path d="M35.4 118L27 118" class="q6"/><path d="M48.3 110.6L52.5 103.3" class="q6"/><text class="t q2" x="80" y="116">VORTAC</text><text class="s q1" x="80" y="133">VOR + TACAN; tabs on the symbol</text><rect x="28" y="156" width="32" height="32" class="q7"/><polygon points="51.8,176.5 44,181 36.2,176.5 36.2,167.5 44,163 51.8,167.5" style="fill:none;stroke:var(--palette-sky,#8EBFDA);stroke-width:2;stroke-linejoin:round"/><text class="t q2" x="80" y="170">VOR-DME</text><text class="s q1" x="80" y="187">Hexagon inside a square</text><rect x="33" y="215" width="22" height="22" class="q7"/><text class="t q2" x="80" y="224">DME</text><text class="s q1" x="80" y="241">Square; shown without the compass rose</text><circle cx="44" cy="280" r="16" style="fill:none;stroke:var(--palette-berry,#A84C6B);stroke-width:2;stroke-dasharray:2 3"/><circle cx="44" cy="280" r="3" style="fill:none;stroke:var(--palette-berry,#A84C6B);stroke-width:2"/><text class="t q2" x="80" y="278">NDB</text><text class="s q1" x="80" y="295">Non-directional radio beacon (dotted circle)</text><circle cx="520" cy="142" r="74" style="fill:var(--palette-sky,#8EBFDA);fill-opacity:.18;stroke:var(--palette-sky,#8EBFDA);stroke-width:3"/><path d="M520 68L520 77" class="q0"/><path d="M532.8 69.1L532 74" class="q0"/><path d="M545.3 72.5L543.6 77.2" class="q0"/><path d="M557 77.9L552.5 85.7" class="q0"/><path d="M567.6 85.3L564.4 89.1" class="q0"/><path d="M576.7 94.4L572.9 97.6" class="q0"/><path d="M584.1 105L576.3 109.5" class="q0"/><path d="M589.5 116.7L584.8 118.4" class="q0"/><path d="M592.9 129.2L588 130" class="q0"/><path d="M594 142L585 142" class="q0"/><path d="M592.9 154.8L588 154" class="q0"/><path d="M589.5 167.3L584.8 165.6" class="q0"/><path d="M584.1 179L576.3 174.5" class="q0"/><path d="M576.7 189.6L572.9 186.4" class="q0"/><path d="M567.6 198.7L564.4 194.9" class="q0"/><path d="M557 206.1L552.5 198.3" class="q0"/><path d="M545.3 211.5L543.6 206.8" class="q0"/><path d="M532.8 214.9L532 210" class="q0"/><path d="M520 216L520 207" class="q0"/><path d="M507.2 214.9L508 210" class="q0"/><path d="M494.7 211.5L496.4 206.8" class="q0"/><path d="M483 206.1L487.5 198.3" class="q0"/><path d="M472.4 198.7L475.6 194.9" class="q0"/><path d="M463.3 189.6L467.1 186.4" class="q0"/><path d="M455.9 179L463.7 174.5" class="q0"/><path d="M450.5 167.3L455.2 165.6" class="q0"/><path d="M447.1 154.8L452 154" class="q0"/><path d="M446 142L455 142" class="q0"/><path d="M447.1 129.2L452 130" class="q0"/><path d="M450.5 116.7L455.2 118.4" class="q0"/><path d="M455.9 105L463.7 109.5" class="q0"/><path d="M463.3 94.4L467.1 97.6" class="q0"/><path d="M472.4 85.3L475.6 89.1" class="q0"/><path d="M483 77.9L487.5 85.7" class="q0"/><path d="M494.7 72.5L496.4 77.2" class="q0"/><path d="M507.2 69.1L508 74" class="q0"/><text class="t m q4" x="520" y="95">0</text><text class="t m q4" x="572" y="147">90</text><text class="t m q4" x="520" y="199">180</text><text class="t m q4" x="468" y="147">270</text><path d="M520 78V54" style="stroke:var(--palette-berry,#A84C6B);stroke-width:3;stroke-linecap:round"/><text class="t m q3" x="520" y="50">MN</text><polygon points="528.7,147 520,152 511.3,147 511.3,137 520,132 528.7,137" style="fill:none;stroke:currentColor;stroke-width:2.5;stroke-linejoin:round"/><circle cx="520" cy="142" r="2.5" class="dh"/><text class="t m q3" x="520" y="182">VOR</text><text class="s m q1" x="520" y="232">Compass rose: reference, oriented to</text><text class="s m q1" x="520" y="247">magnetic north</text><rect class="cl" x="380" y="254" width="330" height="76" rx="8"/><polygon points="419.8,300.5 412,305 404.2,300.5 404.2,291.5 412,287 419.8,291.5" class="q5"/><polygon points="683.8,300.5 676,305 668.2,300.5 668.2,291.5 676,287 683.8,291.5" class="q5"/><path d="M423 296H665" style="stroke:currentColor;stroke-width:3.5"/><text class="t m q2" x="544" y="288">V12 (example)</text><text class="s m q3" x="544" y="322">VOR airway: black line, "V" (Victor) + route number</text><text class="t q4" x="388" y="270">Victor airway (IFR Enroute Low chart)</text><rect class="cl" x="20" y="344" width="690" height="76" rx="8"/><text class="s q3" x="32" y="364">NAVAID names and boxes in blue (VHF/UHF) take precedence; the type sits on the top line of the box.</text><text class="s q3" x="32" y="383">Crosshatched frequency/channel: shutdown. Small open circle: NAVAID on an airport, type in the box.</text><text class="s q3" x="32" y="402">Compass rosette (no VOR rose in the area): five-year epoch magnetic variation. Schematic, not to scale.</text></svg>
