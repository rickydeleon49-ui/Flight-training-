<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 430" role="img" aria-labelledby="ti de"><title id="ti">Airspace boundaries on a sectional</title><desc id="de">Boundary styles on a sectional chart. Class B altitudes appear in solid blue figures with a plus before floors extending upward. Class C altitudes appear in solid magenta figures. Class D has a blue dashed line, and a minus in front of the altitude means from the surface to but not including. Class E surface area has a magenta dashed line. Class E vignettes: magenta for a 700 foot floor, blue for other floors that abut Class G. Mode C airspace is a solid magenta line at 30 nautical miles. Class A is not depicted.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style>
<circle cx="52" cy="62" r="26" style="fill:none;stroke:var(--palette-sky,#8EBFDA);stroke-width:4"/><circle cx="52" cy="62" r="15" style="fill:none;stroke:var(--palette-sky,#8EBFDA);stroke-width:4"/>
<text class="t" x="100" y="50" style="font-size:15px">Class B</text>
<text class="s" x="100" y="67" style="font-size:12.5px">Altitudes in solid blue figures,</text>
<text class="s" x="100" y="82" style="font-size:12.5px">last two zeros omitted.</text>
<text class="s" x="100" y="97" style="font-size:12.5px">(+) before a floor: at or below that</text>
<text class="s" x="100" y="112" style="font-size:12.5px">altitude is outside Class B.</text>
<circle cx="52" cy="150" r="22" style="fill:none;stroke:var(--palette-berry,#A84C6B);stroke-width:4"/>
<text class="t" x="100" y="138" style="font-size:15px">Class C</text>
<text class="s" x="100" y="155" style="font-size:12.5px">Altitudes in solid magenta figures,</text>
<text class="s" x="100" y="170" style="font-size:12.5px">last two zeros omitted.</text>
<text class="s" x="100" y="185" style="font-size:12.5px">Ceiling "T": to, not including, the</text>
<text class="s" x="100" y="200" style="font-size:12.5px">floor of the overlying Class B.</text>
<circle cx="52" cy="238" r="22" style="fill:none;stroke:var(--palette-sky,#8EBFDA);stroke-width:4;stroke-dasharray:9 6"/>
<text class="t" x="100" y="226" style="font-size:15px">Class D</text>
<text class="s" x="100" y="243" style="font-size:12.5px">Blue dashed line; altitude in hundreds</text>
<text class="s" x="100" y="258" style="font-size:12.5px">of feet MSL.  Example "-27": minus =</text>
<text class="s" x="100" y="273" style="font-size:12.5px">from the surface to, not including,</text>
<text class="s" x="100" y="288" style="font-size:12.5px">2700 ft.</text>
<circle cx="52" cy="326" r="22" style="fill:none;stroke:var(--palette-berry,#A84C6B);stroke-width:4;stroke-dasharray:9 6"/>
<text class="t" x="100" y="314" style="font-size:15px">Class E surface (SFC)</text>
<text class="s" x="100" y="331" style="font-size:12.5px">Magenta dashed line.</text>
<text class="s" x="100" y="346" style="font-size:12.5px">Airspace beginning at the surface.</text>
<text class="t" x="420" y="34" style="font-size:15px">Class E vignettes (narrow bands)</text>
<rect x="420" y="46" width="64" height="4" style="fill:var(--palette-berry,#A84C6B);opacity:0.85"/><rect x="420" y="50" width="64" height="4" style="fill:var(--palette-berry,#A84C6B);opacity:0.70"/><rect x="420" y="54" width="64" height="4" style="fill:var(--palette-berry,#A84C6B);opacity:0.55"/><rect x="420" y="58" width="64" height="4" style="fill:var(--palette-berry,#A84C6B);opacity:0.40"/><rect x="420" y="62" width="64" height="4" style="fill:var(--palette-berry,#A84C6B);opacity:0.25"/>
<text class="t" x="498" y="58" style="font-size:13px">Magenta: floor 700 ft AGL</text>
<rect x="420" y="92" width="64" height="4" style="fill:var(--palette-sky,#8EBFDA);opacity:0.85"/><rect x="420" y="96" width="64" height="4" style="fill:var(--palette-sky,#8EBFDA);opacity:0.70"/><rect x="420" y="100" width="64" height="4" style="fill:var(--palette-sky,#8EBFDA);opacity:0.55"/><rect x="420" y="104" width="64" height="4" style="fill:var(--palette-sky,#8EBFDA);opacity:0.40"/><rect x="420" y="108" width="64" height="4" style="fill:var(--palette-sky,#8EBFDA);opacity:0.25"/>
<text class="t" x="498" y="104" style="font-size:13px">Blue: floor other than 700 ft</text>
<text class="s" x="498" y="120" style="font-size:12px">abutting Class G (uncontrolled)</text>
<text class="s" x="420" y="152" style="font-size:12.5px">Class E exists at 1200 ft AGL unless</text>
<text class="s" x="420" y="168" style="font-size:12.5px">designated otherwise.</text>
<text class="s" x="420" y="184" style="font-size:12.5px">Floors above 700 ft: a symbol and number.</text>
<text class="s" x="420" y="200" style="font-size:12.5px">Ceiling under 18,000 ft MSL: "CEILING".</text>
<rect class="cl" x="410" y="226" width="300" height="100" rx="8"/>
<path d="M422 252H454" style="stroke:var(--palette-berry,#A84C6B);stroke-width:4;stroke-linecap:round"/>
<text class="t" x="464" y="256" style="font-size:13px">Mode C required airspace</text>
<text class="s" x="420" y="278" style="font-size:12px">Solid magenta line: 30 NM radius of the</text>
<text class="s" x="420" y="293" style="font-size:12px">Class B primary airport, surface to</text>
<text class="s" x="420" y="308" style="font-size:12px">10,000 ft MSL. Mode C within and above</text>
<text class="s" x="420" y="323" style="font-size:12px">Class C is required but not depicted.</text>
<rect class="cl" x="20" y="360" width="690" height="60" rx="8"/>
<text class="s" x="32" y="378" style="font-size:12.5px">Class A (18,000 ft to FL600) is not depicted on visual charts.</text>
<text class="s" x="32" y="395" style="font-size:12.5px">Class G reaches up to 14,500 ft MSL; at and above that altitude is Class E.</text>
<text class="s" x="32" y="412" style="font-size:12.5px">Only controlled airspace below 18,000 ft MSL is shown. Schematic, not to scale.</text>
</svg>
