<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 430" role="img" aria-labelledby="ti de"><title id="ti">Airspace boundaries on a sectional</title><desc id="de">Boundary styles on a sectional chart. Class B altitudes appear in solid blue figures with a plus before floors extending upward. Class C altitudes appear in solid magenta figures. Class D has a blue dashed line, and a minus in front of the altitude means from the surface to but not including. Class E surface area has a magenta dashed line. Class E vignettes: magenta for a 700 foot floor, blue for other floors that abut Class G. Mode C airspace is a solid magenta line at 30 nautical miles. Class A is not depicted.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:12.5px}.q1{font-size:15px}.q2{font-size:12px}.q3{font-size:13px}.q4{fill:none;stroke:var(--palette-sky,#8EBFDA);stroke-width:4}</style><circle cx="52" cy="62" r="26" class="q4"/><circle cx="52" cy="62" r="15" class="q4"/><text class="t q1" x="100" y="50">Class B</text><text class="s q0" x="100" y="67">Altitudes in solid blue figures,</text><text class="s q0" x="100" y="82">last two zeros omitted.</text><text class="s q0" x="100" y="97">(+) before a floor: at or below that</text><text class="s q0" x="100" y="112">altitude is outside Class B.</text><circle cx="52" cy="150" r="22" style="fill:none;stroke:var(--palette-berry,#A84C6B);stroke-width:4"/><text class="t q1" x="100" y="138">Class C</text><text class="s q0" x="100" y="155">Altitudes in solid magenta figures,</text><text class="s q0" x="100" y="170">last two zeros omitted.</text><text class="s q0" x="100" y="185">Ceiling "T": to, not including, the</text><text class="s q0" x="100" y="200">floor of the overlying Class B.</text><circle cx="52" cy="238" r="22" style="fill:none;stroke:var(--palette-sky,#8EBFDA);stroke-width:4;stroke-dasharray:9 6"/><text class="t q1" x="100" y="226">Class D</text><text class="s q0" x="100" y="243">Blue dashed line; altitude in hundreds</text><text class="s q0" x="100" y="258">of feet MSL.  Example "-27": minus =</text><text class="s q0" x="100" y="273">from the surface to, not including,</text><text class="s q0" x="100" y="288">2700 ft.</text><circle cx="52" cy="326" r="22" style="fill:none;stroke:var(--palette-berry,#A84C6B);stroke-width:4;stroke-dasharray:9 6"/><text class="t q1" x="100" y="314">Class E surface (SFC)</text><text class="s q0" x="100" y="331">Magenta dashed line.</text><text class="s q0" x="100" y="346">Airspace beginning at the surface.</text><text class="t q1" x="420" y="34">Class E vignettes (narrow bands)</text><rect x="420" y="46" width="64" height="4" style="fill:var(--palette-berry,#A84C6B);opacity:0.85"/><rect x="420" y="50" width="64" height="4" style="fill:var(--palette-berry,#A84C6B);opacity:0.70"/><rect x="420" y="54" width="64" height="4" style="fill:var(--palette-berry,#A84C6B);opacity:0.55"/><rect x="420" y="58" width="64" height="4" style="fill:var(--palette-berry,#A84C6B);opacity:0.40"/><rect x="420" y="62" width="64" height="4" style="fill:var(--palette-berry,#A84C6B);opacity:0.25"/><text class="t q3" x="498" y="58">Magenta: floor 700 ft AGL</text><rect x="420" y="92" width="64" height="4" style="fill:var(--palette-sky,#8EBFDA);opacity:0.85"/><rect x="420" y="96" width="64" height="4" style="fill:var(--palette-sky,#8EBFDA);opacity:0.70"/><rect x="420" y="100" width="64" height="4" style="fill:var(--palette-sky,#8EBFDA);opacity:0.55"/><rect x="420" y="104" width="64" height="4" style="fill:var(--palette-sky,#8EBFDA);opacity:0.40"/><rect x="420" y="108" width="64" height="4" style="fill:var(--palette-sky,#8EBFDA);opacity:0.25"/><text class="t q3" x="498" y="104">Blue: floor other than 700 ft</text><text class="s q2" x="498" y="120">abutting Class G (uncontrolled)</text><text class="s q0" x="420" y="152">Class E exists at 1200 ft AGL unless</text><text class="s q0" x="420" y="168">designated otherwise.</text><text class="s q0" x="420" y="184">Floors above 700 ft: a symbol and number.</text><text class="s q0" x="420" y="200">Ceiling under 18,000 ft MSL: "CEILING".</text><rect class="cl" x="410" y="226" width="300" height="100" rx="8"/><path d="M422 252H454" style="stroke:var(--palette-berry,#A84C6B);stroke-width:4;stroke-linecap:round"/><text class="t q3" x="464" y="256">Mode C required airspace</text><text class="s q2" x="420" y="278">Solid magenta line: 30 NM radius of the</text><text class="s q2" x="420" y="293">Class B primary airport, surface to</text><text class="s q2" x="420" y="308">10,000 ft MSL. Mode C within and above</text><text class="s q2" x="420" y="323">Class C is required but not depicted.</text><rect class="cl" x="20" y="360" width="690" height="60" rx="8"/><text class="s q0" x="32" y="378">Class A (18,000 ft to FL600) is not depicted on visual charts.</text><text class="s q0" x="32" y="395">Class G reaches up to 14,500 ft MSL; at and above that altitude is Class E.</text><text class="s q0" x="32" y="412">Only controlled airspace below 18,000 ft MSL is shown. Schematic, not to scale.</text></svg>
