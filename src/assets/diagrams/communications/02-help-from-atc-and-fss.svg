<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 574" role="img" aria-labelledby="ti de"><title id="ti">Help from ATC and FSS</title><desc id="de">Cards on what ATC and a Flight Service Station can provide, how to reach flight service by phone, TIBS and in the air, and Local Airport Advisory.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11.5px}.q1{font-size:13px}.q2{stroke:currentColor;stroke-width:1.5}</style><text class="t" x="20" y="28" style="font-size:15px">Who can help you on the radio: ATC and FSS</text><text class="s q1" x="20" y="50">Pilot in command responsibility stays with you, but a pilot with a problem can ask for help. ATC and</text><text class="s q1" x="20" y="66.5">flight service specialists are the best outside resources in flight.</text><rect class="cl" x="20" y="91" width="338" height="158" rx="8"/><rect x="20" y="91" width="338" height="26" rx="10" class="sky q2"/><text class="t q1" x="30" y="109">ATC can give you</text><circle cx="33" cy="127" r="2.2" class="ah"/><text class="s q0" x="42" y="131">Traffic advisories.</text><circle cx="33" cy="145" r="2.2" class="ah"/><text class="s q0" x="42" y="149">Radar vectors.</text><circle cx="33" cy="163" r="2.2" class="ah"/><text class="s q0" x="42" y="167">Help in an emergency.</text><circle cx="33" cy="181" r="2.2" class="ah"/><text class="s q0" x="42" y="185">Example: if you need to level off, get a vector or</text><text class="s q0" x="42" y="200">slow down, ATC helps and becomes part of the crew.</text><rect class="cl" x="372" y="91" width="338" height="158" rx="8"/><rect x="372" y="91" width="338" height="26" rx="10" class="mint q2"/><text class="t q1" x="382" y="109">Flight Service Station (FSS)</text><circle cx="385" cy="127" r="2.2" class="ah"/><text class="s q0" x="394" y="131">Pilot briefings and en route communications.</text><circle cx="385" cy="145" r="2.2" class="ah"/><text class="s q0" x="394" y="149">VFR search and rescue, help for lost aircraft and</text><text class="s q0" x="394" y="164">aircraft in emergencies.</text><circle cx="385" cy="178" r="2.2" class="ah"/><text class="s q0" x="394" y="182">Relays ATC clearances; originates NOTAMs.</text><circle cx="385" cy="196" r="2.2" class="ah"/><text class="s q0" x="394" y="200">Broadcasts weather and NAS information.</text><circle cx="385" cy="214" r="2.2" class="ah"/><text class="s q0" x="394" y="218">At selected locations: Flight Watch (EFAS) and</text><text class="s q0" x="394" y="233">airport advisories.</text><text class="t" x="20" y="269" style="font-size:14px">Reaching flight service</text><rect class="cl" x="20" y="279" width="220.67" height="182" rx="8"/><rect x="20" y="279" width="220.67" height="26" rx="10" class="lav q2"/><text class="t q1" x="30" y="297">By phone</text><circle cx="33" cy="315" r="2.2" class="ah"/><text class="s q0" x="42" y="319">Preflight weather briefing, 24</text><text class="s q0" x="42" y="334">hours a day: 1-800-WX BRIEF</text><text class="s q0" x="42" y="349">from anywhere in the U.S. and</text><text class="s q0" x="42" y="364">Puerto Rico.</text><circle cx="33" cy="378" r="2.2" class="ah"/><text class="s q0" x="42" y="382">Other FSS numbers are in the</text><text class="s q0" x="42" y="397">Chart Supplement U.S.</text><rect class="cl" x="254.67" y="279" width="220.67" height="182" rx="8"/><rect x="254.67" y="279" width="220.67" height="26" rx="10" class="rose q2"/><text class="t q1" x="264.67" y="297">TIBS</text><circle cx="267.67" cy="315" r="2.2" class="ah"/><text class="s q0" x="276.67" y="319">Telephone Information Briefing</text><text class="s q0" x="276.67" y="334">Service: automated recordings.</text><circle cx="267.67" cy="348" r="2.2" class="ah"/><text class="s q0" x="276.67" y="352">Area and route briefings,</text><text class="s q0" x="276.67" y="367">airspace procedures, special</text><text class="s q0" x="276.67" y="382">announcements.</text><circle cx="267.67" cy="396" r="2.2" class="ah"/><text class="s q0" x="276.67" y="400">Touchtone phone only. A first</text><text class="s q0" x="276.67" y="415">look, not a replacement for a</text><text class="s q0" x="276.67" y="430">specialist briefing.</text><rect class="cl" x="489.33" y="279" width="220.67" height="182" rx="8"/><rect x="489.33" y="279" width="220.67" height="26" rx="10" class="sky q2"/><text class="t q1" x="499.33" y="297">In the air</text><circle cx="502.33" cy="315" r="2.2" class="ah"/><text class="s q0" x="511.33" y="319">FSS gives inflight weather</text><text class="s q0" x="511.33" y="334">briefing services and</text><text class="s q0" x="511.33" y="349">advisories within its area.</text><circle cx="502.33" cy="363" r="2.2" class="ah"/><text class="s q0" x="511.33" y="367">HIWAS: continuous broadcast of</text><text class="s q0" x="511.33" y="382">hazardous weather on selected</text><text class="s q0" x="511.33" y="397">VORs, marked with an H on the</text><text class="s q0" x="511.33" y="412">chart.</text><circle cx="502.33" cy="426" r="2.2" class="ah"/><text class="s q0" x="511.33" y="430">Contact an FSS or EFAS for</text><text class="s q0" x="511.33" y="445">more.</text><rect class="cl" x="20" y="475" width="690" height="93" rx="8"/><rect x="20" y="475" width="690" height="26" rx="10" class="mint q2"/><text class="t q1" x="30" y="493">Local Airport Advisory (LAA)</text><text class="s q0" x="30" y="521">Given by an FSS located on the landing airport, on a discrete ground-to-air frequency, or on the tower frequency</text><text class="s q0" x="30" y="536">when the tower is closed. It includes local airport advisories and automated weather reporting with voice</text><text class="s q0" x="30" y="551">broadcasting.</text></svg>
