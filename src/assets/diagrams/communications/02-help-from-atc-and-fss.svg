<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 574" role="img" aria-labelledby="ti de"><title id="ti">Help from ATC and FSS</title><desc id="de">Cards on what ATC and a Flight Service Station can provide, how to reach flight service by phone, TIBS and in the air, and Local Airport Advisory.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><text class="t" x="20" y="28" style="font-size:15px">Who can help you on the radio: ATC and FSS</text><text class="s" x="20" y="50.0" style="font-size:13px">Pilot in command responsibility stays with you, but a pilot with a problem can ask for help. ATC and</text><text class="s" x="20" y="66.5" style="font-size:13px">flight service specialists are the best outside resources in flight.</text><rect class="cl" x="20.0" y="91.0" width="338.0" height="158.0" rx="8"/><rect x="20.0" y="91.0" width="338.0" height="26" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30.0" y="109.0" style="font-size:13px">ATC can give you</text><circle cx="33.0" cy="127.0" r="2.2" class="ah"/><text class="s" x="42.0" y="131.0" style="font-size:11.5px">Traffic advisories.</text><circle cx="33.0" cy="145.0" r="2.2" class="ah"/><text class="s" x="42.0" y="149.0" style="font-size:11.5px">Radar vectors.</text><circle cx="33.0" cy="163.0" r="2.2" class="ah"/><text class="s" x="42.0" y="167.0" style="font-size:11.5px">Help in an emergency.</text><circle cx="33.0" cy="181.0" r="2.2" class="ah"/><text class="s" x="42.0" y="185.0" style="font-size:11.5px">Example: if you need to level off, get a vector or</text><text class="s" x="42.0" y="200.0" style="font-size:11.5px">slow down, ATC helps and becomes part of the crew.</text><rect class="cl" x="372.0" y="91.0" width="338.0" height="158.0" rx="8"/><rect x="372.0" y="91.0" width="338.0" height="26" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="382.0" y="109.0" style="font-size:13px">Flight Service Station (FSS)</text><circle cx="385.0" cy="127.0" r="2.2" class="ah"/><text class="s" x="394.0" y="131.0" style="font-size:11.5px">Pilot briefings and en route communications.</text><circle cx="385.0" cy="145.0" r="2.2" class="ah"/><text class="s" x="394.0" y="149.0" style="font-size:11.5px">VFR search and rescue, help for lost aircraft and</text><text class="s" x="394.0" y="164.0" style="font-size:11.5px">aircraft in emergencies.</text><circle cx="385.0" cy="178.0" r="2.2" class="ah"/><text class="s" x="394.0" y="182.0" style="font-size:11.5px">Relays ATC clearances; originates NOTAMs.</text><circle cx="385.0" cy="196.0" r="2.2" class="ah"/><text class="s" x="394.0" y="200.0" style="font-size:11.5px">Broadcasts weather and NAS information.</text><circle cx="385.0" cy="214.0" r="2.2" class="ah"/><text class="s" x="394.0" y="218.0" style="font-size:11.5px">At selected locations: Flight Watch (EFAS) and</text><text class="s" x="394.0" y="233.0" style="font-size:11.5px">airport advisories.</text><text class="t" x="20" y="269.0" style="font-size:14px">Reaching flight service</text><rect class="cl" x="20.0" y="279.0" width="220.66666666666666" height="182.0" rx="8"/><rect x="20.0" y="279.0" width="220.66666666666666" height="26" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30.0" y="297.0" style="font-size:13px">By phone</text><circle cx="33.0" cy="315.0" r="2.2" class="ah"/><text class="s" x="42.0" y="319.0" style="font-size:11.5px">Preflight weather briefing, 24</text><text class="s" x="42.0" y="334.0" style="font-size:11.5px">hours a day: 1-800-WX BRIEF</text><text class="s" x="42.0" y="349.0" style="font-size:11.5px">from anywhere in the U.S. and</text><text class="s" x="42.0" y="364.0" style="font-size:11.5px">Puerto Rico.</text><circle cx="33.0" cy="378.0" r="2.2" class="ah"/><text class="s" x="42.0" y="382.0" style="font-size:11.5px">Other FSS numbers are in the</text><text class="s" x="42.0" y="397.0" style="font-size:11.5px">Chart Supplement U.S.</text><rect class="cl" x="254.66666666666666" y="279.0" width="220.66666666666666" height="182.0" rx="8"/><rect x="254.66666666666666" y="279.0" width="220.66666666666666" height="26" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="264.66666666666663" y="297.0" style="font-size:13px">TIBS</text><circle cx="267.66666666666663" cy="315.0" r="2.2" class="ah"/><text class="s" x="276.66666666666663" y="319.0" style="font-size:11.5px">Telephone Information Briefing</text><text class="s" x="276.66666666666663" y="334.0" style="font-size:11.5px">Service: automated recordings.</text><circle cx="267.66666666666663" cy="348.0" r="2.2" class="ah"/><text class="s" x="276.66666666666663" y="352.0" style="font-size:11.5px">Area and route briefings,</text><text class="s" x="276.66666666666663" y="367.0" style="font-size:11.5px">airspace procedures, special</text><text class="s" x="276.66666666666663" y="382.0" style="font-size:11.5px">announcements.</text><circle cx="267.66666666666663" cy="396.0" r="2.2" class="ah"/><text class="s" x="276.66666666666663" y="400.0" style="font-size:11.5px">Touchtone phone only. A first</text><text class="s" x="276.66666666666663" y="415.0" style="font-size:11.5px">look, not a replacement for a</text><text class="s" x="276.66666666666663" y="430.0" style="font-size:11.5px">specialist briefing.</text><rect class="cl" x="489.3333333333333" y="279.0" width="220.66666666666666" height="182.0" rx="8"/><rect x="489.3333333333333" y="279.0" width="220.66666666666666" height="26" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="499.3333333333333" y="297.0" style="font-size:13px">In the air</text><circle cx="502.3333333333333" cy="315.0" r="2.2" class="ah"/><text class="s" x="511.3333333333333" y="319.0" style="font-size:11.5px">FSS gives inflight weather</text><text class="s" x="511.3333333333333" y="334.0" style="font-size:11.5px">briefing services and</text><text class="s" x="511.3333333333333" y="349.0" style="font-size:11.5px">advisories within its area.</text><circle cx="502.3333333333333" cy="363.0" r="2.2" class="ah"/><text class="s" x="511.3333333333333" y="367.0" style="font-size:11.5px">HIWAS: continuous broadcast of</text><text class="s" x="511.3333333333333" y="382.0" style="font-size:11.5px">hazardous weather on selected</text><text class="s" x="511.3333333333333" y="397.0" style="font-size:11.5px">VORs, marked with an H on the</text><text class="s" x="511.3333333333333" y="412.0" style="font-size:11.5px">chart.</text><circle cx="502.3333333333333" cy="426.0" r="2.2" class="ah"/><text class="s" x="511.3333333333333" y="430.0" style="font-size:11.5px">Contact an FSS or EFAS for</text><text class="s" x="511.3333333333333" y="445.0" style="font-size:11.5px">more.</text><rect class="cl" x="20" y="475.0" width="690" height="93.0" rx="8"/><rect x="20" y="475.0" width="690" height="26" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30" y="493.0" style="font-size:13px">Local Airport Advisory (LAA)</text><text class="s" x="30" y="521.0" style="font-size:11.5px">Given by an FSS located on the landing airport, on a discrete ground-to-air frequency, or on the tower frequency</text><text class="s" x="30" y="536.0" style="font-size:11.5px">when the tower is closed. It includes local airport advisories and automated weather reporting with voice</text><text class="s" x="30" y="551.0" style="font-size:11.5px">broadcasting.</text></svg>
