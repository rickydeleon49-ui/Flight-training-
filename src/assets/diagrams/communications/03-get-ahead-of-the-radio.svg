<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 585" role="img" aria-labelledby="ti de"><title id="ti">Get ahead of the radio</title><desc id="de">Four steps from setting frequencies early to checklists, then cards on listening, talk and squawk, phraseology, taxi instructions and telling ATC about a deviation.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11.5px}.q1{font-size:13px}.q2{stroke:currentColor;stroke-width:1.5}.q3{stroke-width:2.5}.q4{fill:var(--palette-berry,#A84C6B)}</style><text class="t" x="20" y="28" style="font-size:15px">Get ahead of the radio</text><text class="s q1" x="20" y="50">Reviewing the chart and setting radio frequencies well before they are needed reduces workload as the</text><text class="s q1" x="20" y="66.5">flight nears the airport.</text><rect class="cl" x="20" y="91" width="156" height="116" rx="8"/><rect x="20" y="91" width="156" height="26" rx="10" class="sky q2"/><text class="t q1" x="30" y="109">1 Chart and radios</text><circle cx="33" cy="127" r="2.2" class="ah"/><text class="s q0" x="42" y="131">Review the chart and</text><text class="s q0" x="42" y="146">set the frequencies</text><text class="s q0" x="42" y="161">you will need early.</text><path d="M179 149L187 149" class="acc q3"/><path d="M195 149L187 152.6L187 145.4Z" class="dh q4"/><rect class="cl" x="198" y="91" width="156" height="116" rx="8"/><rect x="198" y="91" width="156" height="26" rx="10" class="lav q2"/><text class="t q1" x="208" y="109">2 Listen</text><circle cx="211" cy="127" r="2.2" class="ah"/><text class="s q0" x="220" y="131">Listen to ATIS, ASOS</text><text class="s q0" x="220" y="146">or AWOS, if</text><text class="s q0" x="220" y="161">available.</text><path d="M357 149L365 149" class="acc q3"/><path d="M373 149L365 152.6L365 145.4Z" class="dh q4"/><rect class="cl" x="376" y="91" width="156" height="116" rx="8"/><rect x="376" y="91" width="156" height="26" rx="10" class="mint q2"/><text class="t q1" x="386" y="109">3 Monitor</text><circle cx="389" cy="127" r="2.2" class="ah"/><text class="s q0" x="398" y="131">Then monitor the</text><text class="s q0" x="398" y="146">tower frequency or</text><text class="s q0" x="398" y="161">CTAF to get a good</text><text class="s q0" x="398" y="176">idea of the traffic</text><text class="s q0" x="398" y="191">to expect.</text><path d="M535 149L543 149" class="acc q3"/><path d="M551 149L543 152.6L543 145.4Z" class="dh q4"/><rect class="cl" x="554" y="91" width="156" height="116" rx="8"/><rect x="554" y="91" width="156" height="26" rx="10" class="rose q2"/><text class="t q1" x="564" y="109">4 Checklists</text><circle cx="567" cy="127" r="2.2" class="ah"/><text class="s q0" x="576" y="131">Do them well in</text><text class="s q0" x="576" y="146">advance, so there is</text><text class="s q0" x="576" y="161">time to focus on</text><text class="s q0" x="576" y="176">traffic and ATC</text><text class="s q0" x="576" y="191">instructions.</text><rect class="cl" x="20" y="221" width="690" height="34" rx="8"/><text class="s" x="30" y="243" style="font-size:12px">These steps matter most before entering a high-density traffic area, such as Class B airspace.</text><rect class="cl" x="20" y="269" width="220.67" height="149" rx="8"/><rect x="20" y="269" width="220.67" height="26" rx="10" class="sky q2"/><text class="t q1" x="30" y="287">Listening builds the picture</text><circle cx="33" cy="305" r="2.2" class="ah"/><text class="s q0" x="42" y="309">Monitoring the radio for</text><text class="s q0" x="42" y="324">traffic, weather talk and ATC</text><text class="s q0" x="42" y="339">communication helps you build a</text><text class="s q0" x="42" y="354">mental picture of what is</text><text class="s q0" x="42" y="369">happening.</text><circle cx="33" cy="383" r="2.2" class="ah"/><text class="s q0" x="42" y="387">That is part of situational</text><text class="s q0" x="42" y="402">awareness.</text><rect class="cl" x="254.67" y="269" width="220.67" height="149" rx="8"/><rect x="254.67" y="269" width="220.67" height="26" rx="10" class="mint q2"/><text class="t q1" x="264.67" y="287">Talk and squawk</text><circle cx="267.67" cy="305" r="2.2" class="ah"/><text class="s q0" x="276.67" y="309">Good communication with ATC has</text><text class="s q0" x="276.67" y="324">benefits.</text><circle cx="267.67" cy="338" r="2.2" class="ah"/><text class="s q0" x="276.67" y="342">Flight following often makes</text><text class="s q0" x="276.67" y="357">the controller job easier,</text><text class="s q0" x="276.67" y="372">because they can better fit VFR</text><text class="s q0" x="276.67" y="387">and IFR traffic together.</text><rect class="cl" x="489.33" y="269" width="220.67" height="149" rx="8"/><rect x="489.33" y="269" width="220.67" height="26" rx="10" class="lav q2"/><text class="t q1" x="499.33" y="287">Phraseology</text><circle cx="502.33" cy="305" r="2.2" class="ah"/><text class="s q0" x="511.33" y="309">The AIM has a Pilot/Controller</text><text class="s q0" x="511.33" y="324">Glossary and many examples of</text><text class="s q0" x="511.33" y="339">radio calls.</text><circle cx="502.33" cy="353" r="2.2" class="ah"/><text class="s q0" x="511.33" y="357">ICAO has a phonetic alphabet</text><text class="s q0" x="511.33" y="372">that pilots should use to</text><text class="s q0" x="511.33" y="387">identify their aircraft when</text><text class="s q0" x="511.33" y="402">talking with ATC.</text><rect class="cl" x="20" y="432" width="338" height="137" rx="8"/><rect x="20" y="432" width="338" height="26" rx="10" class="rose q2"/><text class="t q1" x="30" y="450">Taxi instructions</text><circle cx="33" cy="468" r="2.2" class="ah"/><text class="s q0" x="42" y="472">Study and use proper phraseology, to understand and</text><text class="s q0" x="42" y="487">answer ground control instructions.</text><circle cx="33" cy="501" r="2.2" class="ah"/><text class="s q0" x="42" y="505">Write down complex taxi instructions at an</text><text class="s q0" x="42" y="520">unfamiliar airport.</text><circle cx="33" cy="534" r="2.2" class="ah"/><text class="s q0" x="42" y="538">After landing, clear the active runway as soon as</text><text class="s q0" x="42" y="553">possible, then wait for taxi instructions.</text><rect class="cl" x="372" y="432" width="338" height="137" rx="8"/><rect x="372" y="432" width="338" height="26" rx="10" class="sky q2"/><text class="t q1" x="382" y="450">If you deviate</text><circle cx="385" cy="468" r="2.2" class="ah"/><text class="s q0" x="394" y="472">You must tell ATC as soon as possible after a</text><text class="s q0" x="394" y="487">deviation from a clearance.</text><circle cx="385" cy="501" r="2.2" class="ah"/><text class="s q0" x="394" y="505">Pilots can deviate from an instruction in an</text><text class="s q0" x="394" y="520">emergency, but must tell ATC.</text></svg>
