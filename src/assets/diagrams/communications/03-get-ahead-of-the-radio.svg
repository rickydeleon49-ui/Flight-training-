<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 585" role="img" aria-labelledby="ti de"><title id="ti">Get ahead of the radio</title><desc id="de">Four steps from setting frequencies early to checklists, then cards on listening, talk and squawk, phraseology, taxi instructions and telling ATC about a deviation.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><text class="t" x="20" y="28" style="font-size:15px">Get ahead of the radio</text><text class="s" x="20" y="50.0" style="font-size:13px">Reviewing the chart and setting radio frequencies well before they are needed reduces workload as the</text><text class="s" x="20" y="66.5" style="font-size:13px">flight nears the airport.</text><rect class="cl" x="20.0" y="91.0" width="156.0" height="116.0" rx="8"/><rect x="20.0" y="91.0" width="156.0" height="26" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30.0" y="109.0" style="font-size:13px">1 Chart and radios</text><circle cx="33.0" cy="127.0" r="2.2" class="ah"/><text class="s" x="42.0" y="131.0" style="font-size:11.5px">Review the chart and</text><text class="s" x="42.0" y="146.0" style="font-size:11.5px">set the frequencies</text><text class="s" x="42.0" y="161.0" style="font-size:11.5px">you will need early.</text><path d="M179.0 149.0L187.0 149.0" class="acc" style="stroke-width:2.5"/><path d="M195.0 149.0L187.0 152.6L187.0 145.4Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><rect class="cl" x="198.0" y="91.0" width="156.0" height="116.0" rx="8"/><rect x="198.0" y="91.0" width="156.0" height="26" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="208.0" y="109.0" style="font-size:13px">2 Listen</text><circle cx="211.0" cy="127.0" r="2.2" class="ah"/><text class="s" x="220.0" y="131.0" style="font-size:11.5px">Listen to ATIS, ASOS</text><text class="s" x="220.0" y="146.0" style="font-size:11.5px">or AWOS, if</text><text class="s" x="220.0" y="161.0" style="font-size:11.5px">available.</text><path d="M357.0 149.0L365.0 149.0" class="acc" style="stroke-width:2.5"/><path d="M373.0 149.0L365.0 152.6L365.0 145.4Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><rect class="cl" x="376.0" y="91.0" width="156.0" height="116.0" rx="8"/><rect x="376.0" y="91.0" width="156.0" height="26" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="386.0" y="109.0" style="font-size:13px">3 Monitor</text><circle cx="389.0" cy="127.0" r="2.2" class="ah"/><text class="s" x="398.0" y="131.0" style="font-size:11.5px">Then monitor the</text><text class="s" x="398.0" y="146.0" style="font-size:11.5px">tower frequency or</text><text class="s" x="398.0" y="161.0" style="font-size:11.5px">CTAF to get a good</text><text class="s" x="398.0" y="176.0" style="font-size:11.5px">idea of the traffic</text><text class="s" x="398.0" y="191.0" style="font-size:11.5px">to expect.</text><path d="M535.0 149.0L543.0 149.0" class="acc" style="stroke-width:2.5"/><path d="M551.0 149.0L543.0 152.6L543.0 145.4Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><rect class="cl" x="554.0" y="91.0" width="156.0" height="116.0" rx="8"/><rect x="554.0" y="91.0" width="156.0" height="26" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="564.0" y="109.0" style="font-size:13px">4 Checklists</text><circle cx="567.0" cy="127.0" r="2.2" class="ah"/><text class="s" x="576.0" y="131.0" style="font-size:11.5px">Do them well in</text><text class="s" x="576.0" y="146.0" style="font-size:11.5px">advance, so there is</text><text class="s" x="576.0" y="161.0" style="font-size:11.5px">time to focus on</text><text class="s" x="576.0" y="176.0" style="font-size:11.5px">traffic and ATC</text><text class="s" x="576.0" y="191.0" style="font-size:11.5px">instructions.</text><rect class="cl" x="20" y="221.0" width="690" height="34" rx="8"/><text class="s" x="30" y="243.0" style="font-size:12px">These steps matter most before entering a high-density traffic area, such as Class B airspace.</text><rect class="cl" x="20.0" y="269.0" width="220.66666666666666" height="149.0" rx="8"/><rect x="20.0" y="269.0" width="220.66666666666666" height="26" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30.0" y="287.0" style="font-size:13px">Listening builds the picture</text><circle cx="33.0" cy="305.0" r="2.2" class="ah"/><text class="s" x="42.0" y="309.0" style="font-size:11.5px">Monitoring the radio for</text><text class="s" x="42.0" y="324.0" style="font-size:11.5px">traffic, weather talk and ATC</text><text class="s" x="42.0" y="339.0" style="font-size:11.5px">communication helps you build a</text><text class="s" x="42.0" y="354.0" style="font-size:11.5px">mental picture of what is</text><text class="s" x="42.0" y="369.0" style="font-size:11.5px">happening.</text><circle cx="33.0" cy="383.0" r="2.2" class="ah"/><text class="s" x="42.0" y="387.0" style="font-size:11.5px">That is part of situational</text><text class="s" x="42.0" y="402.0" style="font-size:11.5px">awareness.</text><rect class="cl" x="254.66666666666666" y="269.0" width="220.66666666666666" height="149.0" rx="8"/><rect x="254.66666666666666" y="269.0" width="220.66666666666666" height="26" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="264.66666666666663" y="287.0" style="font-size:13px">Talk and squawk</text><circle cx="267.66666666666663" cy="305.0" r="2.2" class="ah"/><text class="s" x="276.66666666666663" y="309.0" style="font-size:11.5px">Good communication with ATC has</text><text class="s" x="276.66666666666663" y="324.0" style="font-size:11.5px">benefits.</text><circle cx="267.66666666666663" cy="338.0" r="2.2" class="ah"/><text class="s" x="276.66666666666663" y="342.0" style="font-size:11.5px">Flight following often makes</text><text class="s" x="276.66666666666663" y="357.0" style="font-size:11.5px">the controller job easier,</text><text class="s" x="276.66666666666663" y="372.0" style="font-size:11.5px">because they can better fit VFR</text><text class="s" x="276.66666666666663" y="387.0" style="font-size:11.5px">and IFR traffic together.</text><rect class="cl" x="489.3333333333333" y="269.0" width="220.66666666666666" height="149.0" rx="8"/><rect x="489.3333333333333" y="269.0" width="220.66666666666666" height="26" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="499.3333333333333" y="287.0" style="font-size:13px">Phraseology</text><circle cx="502.3333333333333" cy="305.0" r="2.2" class="ah"/><text class="s" x="511.3333333333333" y="309.0" style="font-size:11.5px">The AIM has a Pilot/Controller</text><text class="s" x="511.3333333333333" y="324.0" style="font-size:11.5px">Glossary and many examples of</text><text class="s" x="511.3333333333333" y="339.0" style="font-size:11.5px">radio calls.</text><circle cx="502.3333333333333" cy="353.0" r="2.2" class="ah"/><text class="s" x="511.3333333333333" y="357.0" style="font-size:11.5px">ICAO has a phonetic alphabet</text><text class="s" x="511.3333333333333" y="372.0" style="font-size:11.5px">that pilots should use to</text><text class="s" x="511.3333333333333" y="387.0" style="font-size:11.5px">identify their aircraft when</text><text class="s" x="511.3333333333333" y="402.0" style="font-size:11.5px">talking with ATC.</text><rect class="cl" x="20.0" y="432.0" width="338.0" height="137.0" rx="8"/><rect x="20.0" y="432.0" width="338.0" height="26" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30.0" y="450.0" style="font-size:13px">Taxi instructions</text><circle cx="33.0" cy="468.0" r="2.2" class="ah"/><text class="s" x="42.0" y="472.0" style="font-size:11.5px">Study and use proper phraseology, to understand and</text><text class="s" x="42.0" y="487.0" style="font-size:11.5px">answer ground control instructions.</text><circle cx="33.0" cy="501.0" r="2.2" class="ah"/><text class="s" x="42.0" y="505.0" style="font-size:11.5px">Write down complex taxi instructions at an</text><text class="s" x="42.0" y="520.0" style="font-size:11.5px">unfamiliar airport.</text><circle cx="33.0" cy="534.0" r="2.2" class="ah"/><text class="s" x="42.0" y="538.0" style="font-size:11.5px">After landing, clear the active runway as soon as</text><text class="s" x="42.0" y="553.0" style="font-size:11.5px">possible, then wait for taxi instructions.</text><rect class="cl" x="372.0" y="432.0" width="338.0" height="137.0" rx="8"/><rect x="372.0" y="432.0" width="338.0" height="26" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="382.0" y="450.0" style="font-size:13px">If you deviate</text><circle cx="385.0" cy="468.0" r="2.2" class="ah"/><text class="s" x="394.0" y="472.0" style="font-size:11.5px">You must tell ATC as soon as possible after a</text><text class="s" x="394.0" y="487.0" style="font-size:11.5px">deviation from a clearance.</text><circle cx="385.0" cy="501.0" r="2.2" class="ah"/><text class="s" x="394.0" y="505.0" style="font-size:11.5px">Pilots can deviate from an instruction in an</text><text class="s" x="394.0" y="520.0" style="font-size:11.5px">emergency, but must tell ATC.</text></svg>
