<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 523" role="img" aria-labelledby="ti de"><title id="ti">Towered or nontowered: radio use</title><desc id="de">Two cards compare radio duties at towered and nontowered airports, then a CTAF panel naming UNICOM, MULTICOM, FSS and tower frequency, and cards on UNICOM and finding the frequency.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11.5px}.q1{stroke:currentColor;stroke-width:1.5}.q2{font-size:13px}.q3{font-size:12px}</style><text class="t" x="20" y="28" style="font-size:15px">Towered or not: how you use the radio</text><text class="s q2" x="20" y="50">There are two types of airports, towered and nontowered. What the radio asks of you is different at</text><text class="s q2" x="20" y="66.5">each.</text><rect class="cl" x="20" y="91" width="338" height="173" rx="8"/><rect x="20" y="91" width="338" height="26" rx="10" class="sky q1"/><text class="t q2" x="30" y="109">Towered airport</text><circle cx="33" cy="127" r="2.2" class="ah"/><text class="s q0" x="42" y="131">Has an operating control tower. ATC provides a</text><text class="s q0" x="42" y="146">safe, orderly and quick flow of traffic.</text><circle cx="33" cy="160" r="2.2" class="ah"/><text class="s q0" x="42" y="164">Two-way radio contact with ATC is required.</text><circle cx="33" cy="178" r="2.2" class="ah"/><text class="s q0" x="42" y="182">Acknowledge and comply with instructions.</text><circle cx="33" cy="196" r="2.2" class="ah"/><text class="s q0" x="42" y="200">If you cannot comply, tell ATC and ask for amended</text><text class="s q0" x="42" y="215">instructions.</text><circle cx="33" cy="229" r="2.2" class="ah"/><text class="s q0" x="42" y="233">In an emergency you may deviate from an</text><text class="s q0" x="42" y="248">instruction, but tell ATC as soon as possible.</text><rect class="cl" x="372" y="91" width="338" height="173" rx="8"/><rect x="372" y="91" width="338" height="26" rx="10" class="mint q1"/><text class="t q2" x="382" y="109">Nontowered airport</text><circle cx="385" cy="127" r="2.2" class="ah"/><text class="s q0" x="394" y="131">No operating control tower. Two-way radio is not</text><text class="s q0" x="394" y="146">required.</text><circle cx="385" cy="160" r="2.2" class="ah"/><text class="s q0" x="394" y="164">It is still good practice to transmit your</text><text class="s q0" x="394" y="179">intentions on the specified frequency, for the</text><text class="s q0" x="394" y="194">benefit of other traffic.</text><circle cx="385" cy="208" r="2.2" class="ah"/><text class="s q0" x="394" y="212">The key is to pick the correct common frequency.</text><circle cx="385" cy="226" r="2.2" class="ah"/><text class="s q0" x="394" y="230">Enter the traffic pattern at pattern altitude.</text><text class="t" x="20" y="284" style="font-size:14px">CTAF: Common Traffic Advisory Frequency</text><rect class="cl" x="20" y="294" width="690" height="80" rx="8"/><rect x="20" y="294" width="690" height="26" rx="10" class="lav q1"/><text class="t" x="30" y="312" style="font-size:12.5px">A CTAF is a frequency for airport advisory practices at an airport without an operating tower.</text><rect x="30" y="332" width="156" height="30" rx="10" class="sky q1"/><text class="t m q3" x="108" y="351">UNICOM</text><rect x="200" y="332" width="156" height="30" rx="10" class="sky q1"/><text class="t m q3" x="278" y="351">MULTICOM</text><rect x="370" y="332" width="156" height="30" rx="10" class="sky q1"/><text class="t m q3" x="448" y="351">FSS</text><rect x="540" y="332" width="156" height="30" rx="10" class="sky q1"/><text class="t m q3" x="618" y="351">Tower frequency</text><rect class="cl" x="20" y="388" width="338" height="119" rx="8"/><rect x="20" y="388" width="338" height="26" rx="10" class="rose q1"/><text class="t q2" x="30" y="406">UNICOM</text><circle cx="33" cy="424" r="2.2" class="ah"/><text class="s q0" x="42" y="428">A nongovernment air/ground radio station at public</text><text class="s q0" x="42" y="443">use airports with no tower or FSS.</text><circle cx="33" cy="457" r="2.2" class="ah"/><text class="s q0" x="42" y="461">On request it may give weather, wind direction, the</text><text class="s q0" x="42" y="476">recommended runway or other information.</text><rect class="cl" x="372" y="388" width="338" height="119" rx="8"/><rect x="372" y="388" width="338" height="26" rx="10" class="lav q1"/><text class="t q2" x="382" y="406">Find the frequency</text><circle cx="385" cy="424" r="2.2" class="ah"/><text class="s q0" x="394" y="428">The CTAF is identified in aeronautical</text><text class="s q0" x="394" y="443">publications.</text><circle cx="385" cy="457" r="2.2" class="ah"/><text class="s q0" x="394" y="461">The Chart Supplement U.S. lists the UNICOM</text><text class="s q0" x="394" y="476">frequency, if there is one, along with tower and</text><text class="s q0" x="394" y="491">ground control frequencies.</text></svg>
