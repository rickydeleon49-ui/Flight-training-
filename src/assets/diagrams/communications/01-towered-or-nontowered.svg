<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 523" role="img" aria-labelledby="ti de"><title id="ti">Towered or nontowered: radio use</title><desc id="de">Two cards compare radio duties at towered and nontowered airports, then a CTAF panel naming UNICOM, MULTICOM, FSS and tower frequency, and cards on UNICOM and finding the frequency.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><text class="t" x="20" y="28" style="font-size:15px">Towered or not: how you use the radio</text><text class="s" x="20" y="50.0" style="font-size:13px">There are two types of airports, towered and nontowered. What the radio asks of you is different at</text><text class="s" x="20" y="66.5" style="font-size:13px">each.</text><rect class="cl" x="20.0" y="91.0" width="338.0" height="173.0" rx="8"/><rect x="20.0" y="91.0" width="338.0" height="26" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30.0" y="109.0" style="font-size:13px">Towered airport</text><circle cx="33.0" cy="127.0" r="2.2" class="ah"/><text class="s" x="42.0" y="131.0" style="font-size:11.5px">Has an operating control tower. ATC provides a</text><text class="s" x="42.0" y="146.0" style="font-size:11.5px">safe, orderly and quick flow of traffic.</text><circle cx="33.0" cy="160.0" r="2.2" class="ah"/><text class="s" x="42.0" y="164.0" style="font-size:11.5px">Two-way radio contact with ATC is required.</text><circle cx="33.0" cy="178.0" r="2.2" class="ah"/><text class="s" x="42.0" y="182.0" style="font-size:11.5px">Acknowledge and comply with instructions.</text><circle cx="33.0" cy="196.0" r="2.2" class="ah"/><text class="s" x="42.0" y="200.0" style="font-size:11.5px">If you cannot comply, tell ATC and ask for amended</text><text class="s" x="42.0" y="215.0" style="font-size:11.5px">instructions.</text><circle cx="33.0" cy="229.0" r="2.2" class="ah"/><text class="s" x="42.0" y="233.0" style="font-size:11.5px">In an emergency you may deviate from an</text><text class="s" x="42.0" y="248.0" style="font-size:11.5px">instruction, but tell ATC as soon as possible.</text><rect class="cl" x="372.0" y="91.0" width="338.0" height="173.0" rx="8"/><rect x="372.0" y="91.0" width="338.0" height="26" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="382.0" y="109.0" style="font-size:13px">Nontowered airport</text><circle cx="385.0" cy="127.0" r="2.2" class="ah"/><text class="s" x="394.0" y="131.0" style="font-size:11.5px">No operating control tower. Two-way radio is not</text><text class="s" x="394.0" y="146.0" style="font-size:11.5px">required.</text><circle cx="385.0" cy="160.0" r="2.2" class="ah"/><text class="s" x="394.0" y="164.0" style="font-size:11.5px">It is still good practice to transmit your</text><text class="s" x="394.0" y="179.0" style="font-size:11.5px">intentions on the specified frequency, for the</text><text class="s" x="394.0" y="194.0" style="font-size:11.5px">benefit of other traffic.</text><circle cx="385.0" cy="208.0" r="2.2" class="ah"/><text class="s" x="394.0" y="212.0" style="font-size:11.5px">The key is to pick the correct common frequency.</text><circle cx="385.0" cy="226.0" r="2.2" class="ah"/><text class="s" x="394.0" y="230.0" style="font-size:11.5px">Enter the traffic pattern at pattern altitude.</text><text class="t" x="20" y="284.0" style="font-size:14px">CTAF: Common Traffic Advisory Frequency</text><rect class="cl" x="20" y="294.0" width="690" height="80" rx="8"/><rect x="20" y="294.0" width="690" height="26" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30" y="312.0" style="font-size:12.5px">A CTAF is a frequency for airport advisory practices at an airport without an operating tower.</text><rect x="30" y="332.0" width="156" height="30" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="108.0" y="351.0" style="font-size:12px">UNICOM</text><rect x="200" y="332.0" width="156" height="30" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="278.0" y="351.0" style="font-size:12px">MULTICOM</text><rect x="370" y="332.0" width="156" height="30" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="448.0" y="351.0" style="font-size:12px">FSS</text><rect x="540" y="332.0" width="156" height="30" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="618.0" y="351.0" style="font-size:12px">Tower frequency</text><rect class="cl" x="20.0" y="388.0" width="338.0" height="119.0" rx="8"/><rect x="20.0" y="388.0" width="338.0" height="26" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30.0" y="406.0" style="font-size:13px">UNICOM</text><circle cx="33.0" cy="424.0" r="2.2" class="ah"/><text class="s" x="42.0" y="428.0" style="font-size:11.5px">A nongovernment air/ground radio station at public</text><text class="s" x="42.0" y="443.0" style="font-size:11.5px">use airports with no tower or FSS.</text><circle cx="33.0" cy="457.0" r="2.2" class="ah"/><text class="s" x="42.0" y="461.0" style="font-size:11.5px">On request it may give weather, wind direction, the</text><text class="s" x="42.0" y="476.0" style="font-size:11.5px">recommended runway or other information.</text><rect class="cl" x="372.0" y="388.0" width="338.0" height="119.0" rx="8"/><rect x="372.0" y="388.0" width="338.0" height="26" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="382.0" y="406.0" style="font-size:13px">Find the frequency</text><circle cx="385.0" cy="424.0" r="2.2" class="ah"/><text class="s" x="394.0" y="428.0" style="font-size:11.5px">The CTAF is identified in aeronautical</text><text class="s" x="394.0" y="443.0" style="font-size:11.5px">publications.</text><circle cx="385.0" cy="457.0" r="2.2" class="ah"/><text class="s" x="394.0" y="461.0" style="font-size:11.5px">The Chart Supplement U.S. lists the UNICOM</text><text class="s" x="394.0" y="476.0" style="font-size:11.5px">frequency, if there is one, along with tower and</text><text class="s" x="394.0" y="491.0" style="font-size:11.5px">ground control frequencies.</text></svg>
