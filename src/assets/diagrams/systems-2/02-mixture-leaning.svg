<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 560" role="img" aria-labelledby="ti de"><title id="ti">Mixture control and leaning with altitude</title><desc id="de">The carburetor is calibrated at sea level with the mixture full rich. As altitude increases air density drops while fuel density stays the same, so the mixture becomes richer, causing roughness from plug fouling and power loss. Lean the mixture to cut fuel flow. On descent enrich it, because a too-lean mixture causes detonation. An EGT gauge helps; follow the AFM or POH.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:12px}.q1{font-size:11.5px}.q2{font-size:13px}.q3{stroke:currentColor;stroke-width:1.5}.q4{font-size:11px}.q5{stroke-width:2;opacity:1}.q6{stroke-width:3;opacity:1}</style><text class="t" x="20" y="28" style="font-size:15px">Mixture control: leaning as you climb</text><text class="s q2" x="20" y="50">Carburetors are calibrated at sea level with the mixture FULL RICH. Climbing thins the air but not the</text><text class="s q2" x="20" y="66.5">fuel, so the mixture gets richer unless you lean it. Curves below are a schematic, not data.</text><rect class="cl" x="20" y="91" width="430" height="320" rx="8"/><path d="M70 327L70 121" class="dk q5"/><path d="M70 327L420 327" class="dk q5"/><text class="t q1" x="74" y="113">Fuel-air mixture (schematic)</text><text class="t e q1" x="420" y="345">Altitude</text><text class="t q4" x="70" y="345">Sea level</text><path d="M64 221L420 221" class="dk" style="stroke-width:1.2;opacity:0.5;stroke-dasharray:6 5"/><text class="s e q4" x="420" y="239">Correct mixture</text><path d="M70 221L400 143" class="acc q6"/><text class="t e q1" x="396" y="135">FULL RICH: grows richer</text><path d="M70 221L400 221" class="dk q6"/><text class="t q1" x="84" y="251">Leaned: less fuel flow keeps it correct</text><text class="s q4" x="368" y="183">lean</text><path d="M70 287L400 287" class="dk" style="stroke-width:1.5;opacity:0.0"/><path d="M360 151L360 202" class="dk" style="stroke-width:1.8"/><path d="M360 209L356.9 202L363.1 202Z" class="dh" style=""/><text class="s q1" x="70" y="367">Rich mixture cools the cylinder and blocks full burning,</text><text class="s q1" x="70" y="382">so carbon builds on the spark plugs and the engine runs</text><text class="s q1" x="70" y="397">rough and loses power.</text><rect x="466" y="91" width="244" height="24" rx="10" class="sky q3"/><text class="t q2" x="476" y="108">Climbing</text><circle cx="477" cy="129" r="2.2" class="ah"/><text class="s q0" x="486" y="133">Air entering the carburetor gets</text><text class="s q0" x="486" y="148.5">less dense; fuel density is</text><text class="s q0" x="486" y="164">unchanged</text><circle cx="477" cy="179.5" r="2.2" class="ah"/><text class="s q0" x="486" y="183.5">Lean the mixture: less fuel flow</text><text class="s q0" x="486" y="199">offsets the thinner air</text><circle cx="477" cy="214.5" r="2.2" class="ah"/><text class="s q0" x="486" y="218.5">Roughness at high-elevation runups</text><text class="s q0" x="486" y="234">or high cruise can be a too-rich</text><text class="s q0" x="486" y="249.5">mixture</text><rect x="466" y="277" width="244" height="24" rx="10" class="rose q3"/><text class="t q2" x="476" y="294">Descending</text><circle cx="477" cy="315" r="2.2" class="ah"/><text class="s q0" x="486" y="319">Enrich the mixture on the way down</text><circle cx="477" cy="334.5" r="2.2" class="ah"/><text class="s q0" x="486" y="338.5">An overly lean mixture causes</text><text class="s q0" x="486" y="354">detonation: roughness,</text><text class="s q0" x="486" y="369.5">overheating, loss of power</text><circle cx="477" cy="385" r="2.2" class="ah"/><text class="s q0" x="486" y="389">Watch engine temperature and</text><text class="s q0" x="486" y="404.5">enrich as needed</text><rect x="20" y="438" width="337" height="24" rx="10" class="mint q3"/><text class="t q2" x="30" y="455">Exhaust gas temperature gauge</text><circle cx="31" cy="476" r="2.2" class="ah"/><text class="s q0" x="40" y="480">An EGT gauge helps set the mixture, especially on</text><text class="s q0" x="40" y="495.5">fuel-injected engines</text><circle cx="31" cy="511" r="2.2" class="ah"/><text class="s q0" x="40" y="515">Procedure differs by airplane, so follow the</text><text class="s q0" x="40" y="530.5">AFM/POH</text><rect x="373" y="438" width="337" height="24" rx="10" class="lav q3"/><text class="t q2" x="383" y="455">Leaning in one line</text><circle cx="384" cy="476" r="2.2" class="ah"/><text class="s q0" x="393" y="480">Leaning with the mixture control decreases fuel</text><text class="s q0" x="393" y="495.5">flow to match the thinner air</text><circle cx="384" cy="511" r="2.2" class="ah"/><text class="s q0" x="393" y="515">Sea-level calibration is the FULL RICH position</text></svg>
