<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 565" role="img" aria-labelledby="ti de"><title id="ti">Oil system and engine cooling</title><desc id="de">Oil lubricates, cools, seals and cleans. A wet-sump engine keeps oil in an integral sump with a pump; a dry-sump engine uses a separate tank and scavenge pumps. Air cooling brings outside air through an inlet, over baffles and cylinder fins, and out the lower aft cowling; cowl flaps control the flow. Cylinder head temperature is the direct gauge; to cool, raise airspeed, enrich the mixture or reduce power.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:12px}.q1{font-size:11px}.q2{stroke:currentColor;stroke-width:1.5}.q3{font-size:12.5px}.q4{stroke-width:2}.q5{font-size:13px}</style><text class="t" x="20" y="28" style="font-size:15px">Oil system and engine cooling</text><text class="s q5" x="20" y="50">Oil lubricates and also carries heat out of the cylinders. Outside air, steered by baffles, cools the</text><text class="s q5" x="20" y="66.5">outside of an air-cooled engine. Pictures are schematic.</text><rect class="cl" x="20" y="91" width="336" height="268" rx="8"/><rect class="cl" x="374" y="91" width="336" height="268" rx="8"/><text class="t" x="32" y="113" style="font-size:14px">Wet-sump oil flow</text><text class="t" x="386" y="113" style="font-size:14px">Air cooling</text><rect x="32" y="127" width="142" height="56" rx="10" class="sky q2"/><text class="t m q3" x="103" y="146">Sump</text><text class="s m q1" x="103" y="163">Oil sits in the engine</text><text class="s m q1" x="103" y="177.5">itself.</text><rect x="196" y="127" width="148" height="56" rx="10" class="lav q2"/><text class="t m q3" x="270" y="146">Oil pump</text><text class="s m q1" x="270" y="163">Draws oil from the</text><text class="s m q1" x="270" y="177.5">sump.</text><path d="M176 155L187 155" class="dk q4"/><path d="M194 155L187 158.2L187 151.8Z" class="dh" style=""/><rect x="196" y="211" width="148" height="56" rx="10" class="rose q2"/><text class="t m q3" x="270" y="230">Engine</text><text class="s m q1" x="270" y="247">Oil passes through</text><text class="s m q1" x="270" y="261.5">moving parts.</text><path d="M270 185L270 202" class="dk q4"/><path d="M270 209L266.9 202L273.1 202Z" class="dh" style=""/><path d="M196 239L103 239L103 185" class="dk" style="stroke-width:2.5;opacity:1"/><path d="M103 195L103 191" class="dk q4"/><path d="M103 184L106.2 191L99.8 191Z" class="dh" style=""/><text class="s q1" x="32" y="287">Dry sump: oil in a separate tank, scavenge pumps</text><text class="s q1" x="32" y="301.5">return it.</text><text class="s q1" x="32" y="317">Crankshaft may also splash oil on parts of the engine.</text><rect x="386" y="127" width="150" height="72" rx="10" class="sky q2"/><text class="t m q3" x="461" y="146">Inlet</text><text class="s m q1" x="461" y="163">Air enters through</text><text class="s m q1" x="461" y="177.5">openings in front of</text><text class="s m q1" x="461" y="192">the cowling.</text><rect x="560" y="127" width="138" height="72" rx="10" class="mint q2"/><text class="t m q3" x="629" y="146">Baffles</text><text class="s m q1" x="629" y="163">Steer air to the</text><text class="s m q1" x="629" y="177.5">hottest parts.</text><path d="M538 159L551 159" class="dk q4"/><path d="M558 159L551 162.2L551 155.8Z" class="dh" style=""/><rect x="386" y="217" width="150" height="72" rx="10" class="rose q2"/><text class="t m q3" x="461" y="236">Cylinder fins</text><text class="s m q1" x="461" y="253">More surface for the</text><text class="s m q1" x="461" y="267.5">air to take heat from.</text><rect x="560" y="217" width="138" height="72" rx="10" class="lav q2"/><text class="t m q3" x="629" y="236">Outlet</text><text class="s m q1" x="629" y="253">Hot air leaves the</text><text class="s m q1" x="629" y="267.5">lower aft cowling.</text><path d="M538 249L551 249" class="dk q4"/><path d="M558 249L551 252.2L551 245.8Z" class="dh" style=""/><path d="M629 201L629 208" class="dk q4"/><path d="M629 215L625.9 208L632.1 208Z" class="dh" style=""/><text class="s q1" x="386" y="313">Cowl flaps open: more air out, cooler engine. Closed:</text><text class="s q1" x="386" y="327.5">warmer.</text><rect x="20" y="373" width="222" height="24" rx="10" class="sky q2"/><text class="t q5" x="30" y="390">What oil does</text><circle cx="31" cy="411" r="2.2" class="ah"/><text class="s q0" x="40" y="415">Lubricates moving parts</text><circle cx="31" cy="430.5" r="2.2" class="ah"/><text class="s q0" x="40" y="434.5">Cools by cutting friction and</text><text class="s q0" x="40" y="450">removing cylinder heat</text><circle cx="31" cy="465.5" r="2.2" class="ah"/><text class="s q0" x="40" y="469.5">Seals piston to cylinder wall</text><circle cx="31" cy="485" r="2.2" class="ah"/><text class="s q0" x="40" y="489">Carries contaminants away</text><rect x="254" y="373" width="222" height="24" rx="10" class="mint q2"/><text class="t q5" x="264" y="390">Oil gauges</text><circle cx="265" cy="411" r="2.2" class="ah"/><text class="s q0" x="274" y="415">Pressure: green normal, red</text><text class="s q0" x="274" y="430.5">lines min and max; expect a</text><text class="s q0" x="274" y="446">reading at engine start</text><circle cx="265" cy="461.5" r="2.2" class="ah"/><text class="s q0" x="274" y="465.5">Temperature: slow to move,</text><text class="s q0" x="274" y="481">minutes on a cold engine</text><circle cx="265" cy="496.5" r="2.2" class="ah"/><text class="s q0" x="274" y="500.5">High oil temperature: plugged</text><text class="s q0" x="274" y="516">line, low quantity, blocked</text><text class="s q0" x="274" y="531.5">cooler or bad gauge</text><rect x="488" y="373" width="222" height="24" rx="10" class="rose q2"/><text class="t q5" x="498" y="390">Fix a hot engine</text><circle cx="499" cy="411" r="2.2" class="ah"/><text class="s q0" x="508" y="415">Check cylinder head temperature</text><text class="s q0" x="508" y="430.5">(direct and immediate)</text><circle cx="499" cy="446" r="2.2" class="ah"/><text class="s q0" x="508" y="450">Raise airspeed, enrich the</text><text class="s q0" x="508" y="465.5">mixture, or reduce power</text><circle cx="499" cy="481" r="2.2" class="ah"/><text class="s q0" x="508" y="485">Hot cylinders: loss of power,</text><text class="s q0" x="508" y="500.5">oil use, detonation, damage</text><circle cx="499" cy="516" r="2.2" class="ah"/><text class="s q0" x="508" y="520">Ground, takeoff and high-power</text><text class="s q0" x="508" y="535.5">slow flight: cooling is weakest</text></svg>
