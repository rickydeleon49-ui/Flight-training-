<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 565" role="img" aria-labelledby="ti de"><title id="ti">Oil system and engine cooling</title><desc id="de">Oil lubricates, cools, seals and cleans. A wet-sump engine keeps oil in an integral sump with a pump; a dry-sump engine uses a separate tank and scavenge pumps. Air cooling brings outside air through an inlet, over baffles and cylinder fins, and out the lower aft cowling; cowl flaps control the flow. Cylinder head temperature is the direct gauge; to cool, raise airspeed, enrich the mixture or reduce power.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style>
<text class="t" x="20" y="28" style="font-size:15px">Oil system and engine cooling</text>
<text class="s" x="20" y="50.0" style="font-size:13px">Oil lubricates and also carries heat out of the cylinders. Outside air, steered by baffles, cools the</text>
<text class="s" x="20" y="66.5" style="font-size:13px">outside of an air-cooled engine. Pictures are schematic.</text>
<rect class="cl" x="20" y="91.0" width="336" height="268" rx="8"/>
<rect class="cl" x="374" y="91.0" width="336" height="268" rx="8"/>
<text class="t" x="32" y="113.0" style="font-size:14px">Wet-sump oil flow</text>
<text class="t" x="386" y="113.0" style="font-size:14px">Air cooling</text>
<rect x="32" y="127.0" width="142" height="56" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="103.0" y="146.0" style="font-size:12.5px">Sump</text>
<text class="s m" x="103.0" y="163.0" style="font-size:11px">Oil sits in the engine</text>
<text class="s m" x="103.0" y="177.5" style="font-size:11px">itself.</text>
<rect x="196" y="127.0" width="148" height="56" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="270.0" y="146.0" style="font-size:12.5px">Oil pump</text>
<text class="s m" x="270.0" y="163.0" style="font-size:11px">Draws oil from the</text>
<text class="s m" x="270.0" y="177.5" style="font-size:11px">sump.</text>
<path d="M176 155.0L187.0 155.0" class="dk" style="stroke-width:2"/><path d="M194 155.0L187.0 158.2L187.0 151.8Z" class="dh" style=""/>
<rect x="196" y="211.0" width="148" height="56" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="270.0" y="230.0" style="font-size:12.5px">Engine</text>
<text class="s m" x="270.0" y="247.0" style="font-size:11px">Oil passes through</text>
<text class="s m" x="270.0" y="261.5" style="font-size:11px">moving parts.</text>
<path d="M270 185.0L270.0 202.0" class="dk" style="stroke-width:2"/><path d="M270 209.0L266.9 202.0L273.1 202.0Z" class="dh" style=""/>
<path d="M196.0 239.0L103.0 239.0L103.0 185.0" class="dk" style="stroke-width:2.5;opacity:1"/>
<path d="M103 195.0L103.0 191.0" class="dk" style="stroke-width:2"/><path d="M103 184.0L106.2 191.0L99.8 191.0Z" class="dh" style=""/>
<text class="s" x="32" y="287.0" style="font-size:11px">Dry sump: oil in a separate tank, scavenge pumps</text>
<text class="s" x="32" y="301.5" style="font-size:11px">return it.</text>
<text class="s" x="32" y="317.0" style="font-size:11px">Crankshaft may also splash oil on parts of the engine.</text>
<rect x="386" y="127.0" width="150" height="72" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="461.0" y="146.0" style="font-size:12.5px">Inlet</text>
<text class="s m" x="461.0" y="163.0" style="font-size:11px">Air enters through</text>
<text class="s m" x="461.0" y="177.5" style="font-size:11px">openings in front of</text>
<text class="s m" x="461.0" y="192.0" style="font-size:11px">the cowling.</text>
<rect x="560" y="127.0" width="138" height="72" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="629.0" y="146.0" style="font-size:12.5px">Baffles</text>
<text class="s m" x="629.0" y="163.0" style="font-size:11px">Steer air to the</text>
<text class="s m" x="629.0" y="177.5" style="font-size:11px">hottest parts.</text>
<path d="M538 159.0L551.0 159.0" class="dk" style="stroke-width:2"/><path d="M558 159.0L551.0 162.2L551.0 155.8Z" class="dh" style=""/>
<rect x="386" y="217.0" width="150" height="72" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="461.0" y="236.0" style="font-size:12.5px">Cylinder fins</text>
<text class="s m" x="461.0" y="253.0" style="font-size:11px">More surface for the</text>
<text class="s m" x="461.0" y="267.5" style="font-size:11px">air to take heat from.</text>
<rect x="560" y="217.0" width="138" height="72" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="629.0" y="236.0" style="font-size:12.5px">Outlet</text>
<text class="s m" x="629.0" y="253.0" style="font-size:11px">Hot air leaves the</text>
<text class="s m" x="629.0" y="267.5" style="font-size:11px">lower aft cowling.</text>
<path d="M538 249.0L551.0 249.0" class="dk" style="stroke-width:2"/><path d="M558 249.0L551.0 252.2L551.0 245.8Z" class="dh" style=""/>
<path d="M629 201.0L629.0 208.0" class="dk" style="stroke-width:2"/><path d="M629 215.0L625.9 208.0L632.1 208.0Z" class="dh" style=""/>
<text class="s" x="386" y="313.0" style="font-size:11px">Cowl flaps open: more air out, cooler engine. Closed:</text>
<text class="s" x="386" y="327.5" style="font-size:11px">warmer.</text>
<rect x="20" y="373.0" width="222" height="24" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="30" y="390.0" style="font-size:13px">What oil does</text>
<circle cx="31" cy="411.0" r="2.2" class="ah"/>
<text class="s" x="40" y="415.0" style="font-size:12px">Lubricates moving parts</text>
<circle cx="31" cy="430.5" r="2.2" class="ah"/>
<text class="s" x="40" y="434.5" style="font-size:12px">Cools by cutting friction and</text>
<text class="s" x="40" y="450.0" style="font-size:12px">removing cylinder heat</text>
<circle cx="31" cy="465.5" r="2.2" class="ah"/>
<text class="s" x="40" y="469.5" style="font-size:12px">Seals piston to cylinder wall</text>
<circle cx="31" cy="485.0" r="2.2" class="ah"/>
<text class="s" x="40" y="489.0" style="font-size:12px">Carries contaminants away</text>
<rect x="254" y="373.0" width="222" height="24" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="264" y="390.0" style="font-size:13px">Oil gauges</text>
<circle cx="265" cy="411.0" r="2.2" class="ah"/>
<text class="s" x="274" y="415.0" style="font-size:12px">Pressure: green normal, red</text>
<text class="s" x="274" y="430.5" style="font-size:12px">lines min and max; expect a</text>
<text class="s" x="274" y="446.0" style="font-size:12px">reading at engine start</text>
<circle cx="265" cy="461.5" r="2.2" class="ah"/>
<text class="s" x="274" y="465.5" style="font-size:12px">Temperature: slow to move,</text>
<text class="s" x="274" y="481.0" style="font-size:12px">minutes on a cold engine</text>
<circle cx="265" cy="496.5" r="2.2" class="ah"/>
<text class="s" x="274" y="500.5" style="font-size:12px">High oil temperature: plugged</text>
<text class="s" x="274" y="516.0" style="font-size:12px">line, low quantity, blocked</text>
<text class="s" x="274" y="531.5" style="font-size:12px">cooler or bad gauge</text>
<rect x="488" y="373.0" width="222" height="24" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="498" y="390.0" style="font-size:13px">Fix a hot engine</text>
<circle cx="499" cy="411.0" r="2.2" class="ah"/>
<text class="s" x="508" y="415.0" style="font-size:12px">Check cylinder head temperature</text>
<text class="s" x="508" y="430.5" style="font-size:12px">(direct and immediate)</text>
<circle cx="499" cy="446.0" r="2.2" class="ah"/>
<text class="s" x="508" y="450.0" style="font-size:12px">Raise airspeed, enrich the</text>
<text class="s" x="508" y="465.5" style="font-size:12px">mixture, or reduce power</text>
<circle cx="499" cy="481.0" r="2.2" class="ah"/>
<text class="s" x="508" y="485.0" style="font-size:12px">Hot cylinders: loss of power,</text>
<text class="s" x="508" y="500.5" style="font-size:12px">oil use, detonation, damage</text>
<circle cx="499" cy="516.0" r="2.2" class="ah"/>
<text class="s" x="508" y="520.0" style="font-size:12px">Ground, takeoff and high-power</text>
<text class="s" x="508" y="535.5" style="font-size:12px">slow flight: cooling is weakest</text>
</svg>
