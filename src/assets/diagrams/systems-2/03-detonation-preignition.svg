<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 701" role="img" aria-labelledby="ti de"><title id="ti">Detonation versus preignition</title><desc id="de">Detonation is an uncontrolled explosive burn of the fuel-air mixture, usually at high power with high head temperature; causes are wrong fuel grade, high manifold pressure with low rpm, high power with a lean mixture, and poor cooling. Preignition is ignition before the normal event, caused by a hot spot such as carbon on a plug. Either may cause the other; avoid both with correct fuel and cooling.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:12px}.q1{font-size:13px}.q2{font-size:11.5px}.q3{stroke:currentColor;stroke-width:1.5}.q4{stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}.q5{stroke-width:2;opacity:1}</style><text class="t" x="20" y="28" style="font-size:15px">Detonation versus preignition</text><text class="s q1" x="20" y="50">Both give high temperatures and lost power, and either can cause the other. They differ in what lights</text><text class="s q1" x="20" y="66.5">the mixture and when. Cylinder pictures are schematic.</text><rect class="cl" x="20" y="91" width="336" height="150" rx="8"/><rect class="cl" x="374" y="91" width="336" height="150" rx="8"/><rect x="66" y="125" width="68" height="84" class="cl q4"/><rect x="70" y="165" width="60" height="22" class="sky q4"/><path d="M100 125L100 113" class="dk q5"/><circle cx="100" cy="111" r="3.5" class="ah"/><path d="M120 133l5 11 11 1 -9 7 3 11 -10 -6 -10 6 3 -11 -9 -7 11 -1z" class="ah"/><text class="t m q2" x="100" y="229">Explosive burn</text><rect x="420" y="125" width="68" height="84" class="cl q4"/><rect x="424" y="165" width="60" height="22" class="sky q4"/><path d="M454 125L454 113" class="dk q5"/><circle cx="454" cy="111" r="3.5" class="ah"/><path d="M432 131l4 9 9 1 -7 6 3 9 -9 -5 -9 5 3 -9 -7 -6 9 -1z" class="ah"/><text class="t m q2" x="454" y="229">Hot spot fires it early</text><text class="s q2" x="150" y="145">Uncontrolled, explosive burn of</text><text class="s q2" x="150" y="160">the mixture in the combustion</text><text class="s q2" x="150" y="175">chamber.</text><text class="s q2" x="504" y="145">Mixture ignites before the</text><text class="s q2" x="504" y="160">normal ignition event.</text><rect x="20" y="253" width="337" height="24" rx="10" class="rose q3"/><text class="t q1" x="30" y="270">Detonation: causes</text><circle cx="31" cy="291" r="2.2" class="ah"/><text class="s q0" x="40" y="295">Fuel grade lower than the manufacturer specifies</text><circle cx="31" cy="310.5" r="2.2" class="ah"/><text class="s q0" x="40" y="314.5">Very high manifold pressure with low rpm</text><circle cx="31" cy="330" r="2.2" class="ah"/><text class="s q0" x="40" y="334">High power with an excessively lean mixture</text><circle cx="31" cy="349.5" r="2.2" class="ah"/><text class="s q0" x="40" y="353.5">Long ground running or steep climbs, so cooling</text><text class="s q0" x="40" y="369">is reduced</text><rect x="373" y="253" width="337" height="24" rx="10" class="lav q3"/><text class="t q1" x="383" y="270">Preignition: causes</text><circle cx="384" cy="291" r="2.2" class="ah"/><text class="s q0" x="393" y="295">A residual hot spot in the chamber</text><circle cx="384" cy="310.5" r="2.2" class="ah"/><text class="s q0" x="393" y="314.5">A small carbon deposit on a spark plug</text><circle cx="384" cy="330" r="2.2" class="ah"/><text class="s q0" x="393" y="334">A cracked spark plug insulator, or other damage</text><text class="s q0" x="393" y="349.5">that heats a part</text><rect x="20" y="396.5" width="337" height="24" rx="10" class="rose q3"/><text class="t q1" x="30" y="413.5">Detonation: signs and harm</text><circle cx="31" cy="434.5" r="2.2" class="ah"/><text class="s q0" x="40" y="438.5">High cylinder head temperatures, most likely at</text><text class="s q0" x="40" y="454">high power</text><circle cx="31" cy="469.5" r="2.2" class="ah"/><text class="s q0" x="40" y="473.5">Milder: overheating, roughness, loss of power</text><circle cx="31" cy="489" r="2.2" class="ah"/><text class="s q0" x="40" y="493">Severe: can quickly fail piston, cylinder or</text><text class="s q0" x="40" y="508.5">valves</text><rect x="373" y="396.5" width="337" height="24" rx="10" class="lav q3"/><text class="t q1" x="383" y="413.5">Preignition: signs and harm</text><circle cx="384" cy="434.5" r="2.2" class="ah"/><text class="s q0" x="393" y="438.5">Power loss and high operating temperature</text><circle cx="384" cy="454" r="2.2" class="ah"/><text class="s q0" x="393" y="458">Expanding gas pushes on the piston while still on</text><text class="s q0" x="393" y="473.5">its compression stroke, which can cause severe</text><text class="s q0" x="393" y="489">damage</text><rect x="20" y="536" width="337" height="24" rx="10" class="mint q3"/><text class="t q1" x="30" y="553">Avoiding detonation</text><circle cx="31" cy="574" r="2.2" class="ah"/><text class="s q0" x="40" y="578">Use the proper fuel grade</text><circle cx="31" cy="593.5" r="2.2" class="ah"/><text class="s q0" x="40" y="597.5">Cowl flaps full open on the ground</text><circle cx="31" cy="613" r="2.2" class="ah"/><text class="s q0" x="40" y="617">Enriched mixture and shallow climb for takeoff</text><text class="s q0" x="40" y="632.5">and initial climb</text><circle cx="31" cy="648" r="2.2" class="ah"/><text class="s q0" x="40" y="652">Avoid long high-power steep climbs</text><circle cx="31" cy="667.5" r="2.2" class="ah"/><text class="s q0" x="40" y="671.5">Monitor engine instruments</text><rect x="373" y="536" width="337" height="24" rx="10" class="sky q3"/><text class="t q1" x="383" y="553">Telling them apart</text><circle cx="384" cy="574" r="2.2" class="ah"/><text class="s q0" x="393" y="578">Both bring high engine temperature and less</text><text class="s q0" x="393" y="593.5">performance, so they are hard to separate</text><circle cx="384" cy="609" r="2.2" class="ah"/><text class="s q0" x="393" y="613">Right fuel grade and staying in the proper</text><text class="s q0" x="393" y="628.5">temperature, pressure and rpm ranges lowers the</text><text class="s q0" x="393" y="644">chance of either</text></svg>
