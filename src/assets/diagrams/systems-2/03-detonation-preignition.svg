<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 701" role="img" aria-labelledby="ti de"><title id="ti">Detonation versus preignition</title><desc id="de">Detonation is an uncontrolled explosive burn of the fuel-air mixture, usually at high power with high head temperature; causes are wrong fuel grade, high manifold pressure with low rpm, high power with a lean mixture, and poor cooling. Preignition is ignition before the normal event, caused by a hot spot such as carbon on a plug. Either may cause the other; avoid both with correct fuel and cooling.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style>
<text class="t" x="20" y="28" style="font-size:15px">Detonation versus preignition</text>
<text class="s" x="20" y="50.0" style="font-size:13px">Both give high temperatures and lost power, and either can cause the other. They differ in what lights</text>
<text class="s" x="20" y="66.5" style="font-size:13px">the mixture and when. Cylinder pictures are schematic.</text>
<rect class="cl" x="20" y="91.0" width="336" height="150" rx="8"/>
<rect class="cl" x="374" y="91.0" width="336" height="150" rx="8"/>
<rect x="66" y="125.0" width="68" height="84" class="cl" style="stroke:currentColor;stroke-width:1.6;stroke-linejoin:round"/>
<rect x="70" y="165.0" width="60" height="22" class="sky" style="stroke:currentColor;stroke-width:1.6;stroke-linejoin:round"/>
<path d="M100 125.0L100 113.0" class="dk" style="stroke-width:2;opacity:1"/>
<circle cx="100" cy="111.0" r="3.5" class="ah"/>
<path d="M120 133.0l5 11 11 1 -9 7 3 11 -10 -6 -10 6 3 -11 -9 -7 11 -1z" class="ah"/>
<text class="t m" x="100" y="229.0" style="font-size:11.5px">Explosive burn</text>
<rect x="420" y="125.0" width="68" height="84" class="cl" style="stroke:currentColor;stroke-width:1.6;stroke-linejoin:round"/>
<rect x="424" y="165.0" width="60" height="22" class="sky" style="stroke:currentColor;stroke-width:1.6;stroke-linejoin:round"/>
<path d="M454 125.0L454 113.0" class="dk" style="stroke-width:2;opacity:1"/>
<circle cx="454" cy="111.0" r="3.5" class="ah"/>
<path d="M432 131.0l4 9 9 1 -7 6 3 9 -9 -5 -9 5 3 -9 -7 -6 9 -1z" class="ah"/>
<text class="t m" x="454" y="229.0" style="font-size:11.5px">Hot spot fires it early</text>
<text class="s" x="150" y="145.0" style="font-size:11.5px">Uncontrolled, explosive burn of</text>
<text class="s" x="150" y="160.0" style="font-size:11.5px">the mixture in the combustion</text>
<text class="s" x="150" y="175.0" style="font-size:11.5px">chamber.</text>
<text class="s" x="504" y="145.0" style="font-size:11.5px">Mixture ignites before the</text>
<text class="s" x="504" y="160.0" style="font-size:11.5px">normal ignition event.</text>
<rect x="20" y="253.0" width="337" height="24" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="30" y="270.0" style="font-size:13px">Detonation: causes</text>
<circle cx="31" cy="291.0" r="2.2" class="ah"/>
<text class="s" x="40" y="295.0" style="font-size:12px">Fuel grade lower than the manufacturer specifies</text>
<circle cx="31" cy="310.5" r="2.2" class="ah"/>
<text class="s" x="40" y="314.5" style="font-size:12px">Very high manifold pressure with low rpm</text>
<circle cx="31" cy="330.0" r="2.2" class="ah"/>
<text class="s" x="40" y="334.0" style="font-size:12px">High power with an excessively lean mixture</text>
<circle cx="31" cy="349.5" r="2.2" class="ah"/>
<text class="s" x="40" y="353.5" style="font-size:12px">Long ground running or steep climbs, so cooling</text>
<text class="s" x="40" y="369.0" style="font-size:12px">is reduced</text>
<rect x="373" y="253.0" width="337" height="24" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="383" y="270.0" style="font-size:13px">Preignition: causes</text>
<circle cx="384" cy="291.0" r="2.2" class="ah"/>
<text class="s" x="393" y="295.0" style="font-size:12px">A residual hot spot in the chamber</text>
<circle cx="384" cy="310.5" r="2.2" class="ah"/>
<text class="s" x="393" y="314.5" style="font-size:12px">A small carbon deposit on a spark plug</text>
<circle cx="384" cy="330.0" r="2.2" class="ah"/>
<text class="s" x="393" y="334.0" style="font-size:12px">A cracked spark plug insulator, or other damage</text>
<text class="s" x="393" y="349.5" style="font-size:12px">that heats a part</text>
<rect x="20" y="396.5" width="337" height="24" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="30" y="413.5" style="font-size:13px">Detonation: signs and harm</text>
<circle cx="31" cy="434.5" r="2.2" class="ah"/>
<text class="s" x="40" y="438.5" style="font-size:12px">High cylinder head temperatures, most likely at</text>
<text class="s" x="40" y="454.0" style="font-size:12px">high power</text>
<circle cx="31" cy="469.5" r="2.2" class="ah"/>
<text class="s" x="40" y="473.5" style="font-size:12px">Milder: overheating, roughness, loss of power</text>
<circle cx="31" cy="489.0" r="2.2" class="ah"/>
<text class="s" x="40" y="493.0" style="font-size:12px">Severe: can quickly fail piston, cylinder or</text>
<text class="s" x="40" y="508.5" style="font-size:12px">valves</text>
<rect x="373" y="396.5" width="337" height="24" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="383" y="413.5" style="font-size:13px">Preignition: signs and harm</text>
<circle cx="384" cy="434.5" r="2.2" class="ah"/>
<text class="s" x="393" y="438.5" style="font-size:12px">Power loss and high operating temperature</text>
<circle cx="384" cy="454.0" r="2.2" class="ah"/>
<text class="s" x="393" y="458.0" style="font-size:12px">Expanding gas pushes on the piston while still on</text>
<text class="s" x="393" y="473.5" style="font-size:12px">its compression stroke, which can cause severe</text>
<text class="s" x="393" y="489.0" style="font-size:12px">damage</text>
<rect x="20" y="536.0" width="337" height="24" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="30" y="553.0" style="font-size:13px">Avoiding detonation</text>
<circle cx="31" cy="574.0" r="2.2" class="ah"/>
<text class="s" x="40" y="578.0" style="font-size:12px">Use the proper fuel grade</text>
<circle cx="31" cy="593.5" r="2.2" class="ah"/>
<text class="s" x="40" y="597.5" style="font-size:12px">Cowl flaps full open on the ground</text>
<circle cx="31" cy="613.0" r="2.2" class="ah"/>
<text class="s" x="40" y="617.0" style="font-size:12px">Enriched mixture and shallow climb for takeoff</text>
<text class="s" x="40" y="632.5" style="font-size:12px">and initial climb</text>
<circle cx="31" cy="648.0" r="2.2" class="ah"/>
<text class="s" x="40" y="652.0" style="font-size:12px">Avoid long high-power steep climbs</text>
<circle cx="31" cy="667.5" r="2.2" class="ah"/>
<text class="s" x="40" y="671.5" style="font-size:12px">Monitor engine instruments</text>
<rect x="373" y="536.0" width="337" height="24" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="383" y="553.0" style="font-size:13px">Telling them apart</text>
<circle cx="384" cy="574.0" r="2.2" class="ah"/>
<text class="s" x="393" y="578.0" style="font-size:12px">Both bring high engine temperature and less</text>
<text class="s" x="393" y="593.5" style="font-size:12px">performance, so they are hard to separate</text>
<circle cx="384" cy="609.0" r="2.2" class="ah"/>
<text class="s" x="393" y="613.0" style="font-size:12px">Right fuel grade and staying in the proper</text>
<text class="s" x="393" y="628.5" style="font-size:12px">temperature, pressure and rpm ranges lowers the</text>
<text class="s" x="393" y="644.0" style="font-size:12px">chance of either</text>
</svg>
