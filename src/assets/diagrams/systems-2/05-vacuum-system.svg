<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 523" role="img" aria-labelledby="ti de"><title id="ti">Vacuum system for gyro instruments</title><desc id="de">An engine-driven vacuum pump draws air through a filter, then through the attitude and heading indicators where it spins the gyros, past a relief valve that limits suction, then overboard or to other systems. A gauge, sometimes a warning light, shows suction; typical need is 4.5 to 5.5 inches of mercury. Low suction makes the gyro instruments unreliable.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:12px}.q1{font-size:11px}.q2{stroke:currentColor;stroke-width:1.5}.q3{font-size:12.5px}.q4{font-size:13px}.q5{stroke-width:2}</style><text class="t" x="20" y="28" style="font-size:15px">Vacuum (suction) system for the gyro instruments</text><text class="s q4" x="20" y="50">Many airplanes spin their gyros with a stream of air. An engine-driven pump creates suction, and air</text><text class="s q4" x="20" y="66.5">is pulled through the instruments. Layout is schematic.</text><rect class="cl" x="20" y="91" width="690" height="250" rx="8"/><rect x="34" y="111" width="149" height="81" rx="10" class="sky q2"/><text class="t m q3" x="108.5" y="130">Air filter</text><text class="s m q1" x="108.5" y="147">Keeps foreign matter</text><text class="s m q1" x="108.5" y="161.5">out of the system.</text><path d="M185 151.5L196 151.5" class="dk q5"/><path d="M203 151.5L196 154.7L196 148.3Z" class="dh" style=""/><rect x="205" y="111" width="149" height="81" rx="10" class="mint q2"/><text class="t m q3" x="279.5" y="130">Attitude and</text><text class="t m q3" x="279.5" y="145">heading indicators</text><text class="s m q1" x="279.5" y="162">Air hits rotor vanes</text><text class="s m q1" x="279.5" y="176.5">and spins the gyros.</text><path d="M356 151.5L367 151.5" class="dk q5"/><path d="M374 151.5L367 154.7L367 148.3Z" class="dh" style=""/><rect x="376" y="111" width="149" height="81" rx="10" class="lav q2"/><text class="t m q3" x="450.5" y="130">Relief valve</text><text class="s m q1" x="450.5" y="147">Holds suction under the</text><text class="s m q1" x="450.5" y="161.5">prescribed limit.</text><path d="M527 151.5L538 151.5" class="dk q5"/><path d="M545 151.5L538 154.7L538 148.3Z" class="dh" style=""/><rect x="547" y="111" width="149" height="81" rx="10" class="rose q2"/><text class="t m q3" x="621.5" y="130">Exhaust</text><text class="s m q1" x="621.5" y="147">Air goes overboard or</text><text class="s m q1" x="621.5" y="161.5">to other uses, such as</text><text class="s m q1" x="621.5" y="176">deicing boots.</text><rect x="34" y="226" width="200" height="72" rx="10" class="lav q2"/><text class="t m q3" x="134" y="245">Engine-driven vacuum pump</text><text class="s m q1" x="134" y="262">Vane type, on the accessory</text><text class="s m q1" x="134" y="276.5">case; draws the air through.</text><rect x="260" y="226" width="200" height="72" rx="10" class="mint q2"/><text class="t m q3" x="360" y="245">Suction gauge</text><text class="s m q1" x="360" y="262">Panel gauge shows system</text><text class="s m q1" x="360" y="276.5">pressure in inches of mercury</text><text class="s m q1" x="360" y="291">below ambient.</text><rect x="486" y="226" width="210" height="72" rx="10" class="rose q2"/><text class="t m q3" x="591" y="245">Warning light (some</text><text class="t m q3" x="591" y="260">airplanes)</text><text class="s m q1" x="591" y="277">Lights when vacuum falls below an</text><text class="s m q1" x="591" y="291.5">acceptable level.</text><text class="s" x="34" y="322" style="font-size:11.5px">Typical instrument pressure is about 4.5 to 5.5 "Hg.</text><rect x="20" y="355" width="222" height="24" rx="10" class="rose q2"/><text class="t q4" x="30" y="372">Why monitor it</text><circle cx="31" cy="393" r="2.2" class="ah"/><text class="s q0" x="40" y="397">Low suction can make the</text><text class="s q0" x="40" y="412.5">attitude and heading indicators</text><text class="s q0" x="40" y="428">unreliable</text><circle cx="31" cy="443.5" r="2.2" class="ah"/><text class="s q0" x="40" y="447.5">Low vacuum lets gyros slow</text><text class="s q0" x="40" y="463">down, so they drift more</text><rect x="254" y="355" width="222" height="24" rx="10" class="sky q2"/><text class="t q4" x="264" y="372">Backup power</text><circle cx="265" cy="393" r="2.2" class="ah"/><text class="s q0" x="274" y="397">Most airplanes have at least</text><text class="s q0" x="274" y="412.5">two power sources so bank</text><text class="s q0" x="274" y="428">information survives one</text><text class="s q0" x="274" y="443.5">failure</text><circle cx="265" cy="459" r="2.2" class="ah"/><text class="s q0" x="274" y="463">In some airplanes the</text><text class="s q0" x="274" y="478.5">electrical system powers the</text><text class="s q0" x="274" y="494">turn coordinator</text><rect x="488" y="355" width="222" height="24" rx="10" class="mint q2"/><text class="t q4" x="498" y="372">Routine</text><circle cx="499" cy="393" r="2.2" class="ah"/><text class="s q0" x="508" y="397">Cross-check the instruments</text><text class="s q0" x="508" y="412.5">often</text><circle cx="499" cy="428" r="2.2" class="ah"/><text class="s q0" x="508" y="432">At idle the gyros may not be at</text><text class="s q0" x="508" y="447.5">full speed, so precession can</text><text class="s q0" x="508" y="463">be faster on the ground</text></svg>
