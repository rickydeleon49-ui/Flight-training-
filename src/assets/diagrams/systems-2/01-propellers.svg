<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 589" role="img" aria-labelledby="ti de"><title id="ti">Fixed-pitch versus constant-speed propeller</title><desc id="de">Fixed pitch: blade angle cannot change, the tachometer indicates power, and the throttle sets rpm. Constant speed: the throttle sets power shown on the manifold pressure gauge, the propeller control selects rpm, and a governor changes blade angle to hold that rpm between the pitch stops. When reducing power, reduce manifold pressure before rpm; when increasing, rpm first.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11px}.q1{font-size:12px}.q2{stroke:currentColor;stroke-width:1.5}.q3{font-size:12.5px}.q4{font-size:13px}.q5{stroke-width:2}</style><text class="t" x="20" y="28" style="font-size:15px">Fixed-pitch and constant-speed propellers: what each control does</text><text class="s q4" x="20" y="50">A fixed-pitch propeller has one blade angle and one gauge for power. A constant-speed propeller adds a</text><text class="s q4" x="20" y="66.5">governor and a second control, so throttle and propeller control do different jobs.</text><rect class="cl" x="20" y="91" width="336" height="312" rx="8"/><rect class="cl" x="374" y="91" width="336" height="312" rx="8"/><text class="t" x="32" y="113" style="font-size:14px">Fixed pitch</text><text class="t" x="386" y="113" style="font-size:14px">Constant speed</text><g transform="translate(50 181) rotate(-14)"><path d="M0 0C10 -26 60 -30 150 0C80 9 20 9 0 0Z" class="sky" style="stroke:currentColor;stroke-width:1.8;stroke-linejoin:round"/><path d="M0 0L150 0" class="dk" style="stroke-width:1;opacity:.5;stroke-dasharray:4 3"/></g><text class="s q0" x="50" y="203">Blade angle: set by the</text><text class="s q0" x="50" y="217.5">manufacturer, cannot change.</text><circle cx="290" cy="157" r="30" class="cl" style="stroke:currentColor;stroke-width:1.6"/><path d="M268.3 144.5A25 25 0 0 1 311.7 144.5" class="dk" style="stroke-width:3"/><path d="M290 157L305.43 138.61" class="dk" style="stroke-width:2.2;opacity:1"/><circle cx="290" cy="157" r="3" class="dh"/><text class="t m" x="290" y="201" style="font-size:11.5px"></text><text class="s q0" x="246" y="203">Rpm needle</text><rect x="32" y="241" width="150" height="80" rx="10" class="lav q2"/><text class="t m q3" x="107" y="260">Throttle</text><text class="s m q0" x="107" y="277">Controls fuel-air flow,</text><text class="s m q0" x="107" y="291.5">so it sets rpm.</text><rect x="194" y="241" width="150" height="80" rx="10" class="rose q2"/><text class="t m q3" x="269" y="260">Tachometer = power</text><text class="s m q0" x="269" y="277">Direct indication of</text><text class="s m q0" x="269" y="291.5">engine power at a given</text><text class="s m q0" x="269" y="306">altitude.</text><text class="s q0" x="32" y="347">Same rpm gives less power at 5,000 ft than at sea</text><text class="s q0" x="32" y="361.5">level.</text><rect x="386" y="125" width="140" height="70" rx="10" class="lav q2"/><text class="t m q3" x="456" y="144">Throttle</text><text class="s m q0" x="456" y="161">Controls power</text><text class="s m q0" x="456" y="175.5">output.</text><rect x="548" y="125" width="162" height="70" rx="10" class="rose q2"/><text class="t m q3" x="629" y="144">Manifold pressure</text><text class="t m q3" x="629" y="159">gauge</text><text class="s m q0" x="629" y="176">Shows power; reads MAP.</text><path d="M528 160L539 160" class="dk q5"/><path d="M546 160L539 163.2L539 156.8Z" class="dh" style=""/><rect x="386" y="209" width="96" height="78" rx="10" class="sky q2"/><text class="t m q3" x="434" y="228">Prop</text><text class="t m q3" x="434" y="243">control</text><text class="s m q0" x="434" y="260">Selects rpm.</text><rect x="500" y="209" width="96" height="78" rx="10" class="mint q2"/><text class="t m q3" x="548" y="228">Governor</text><text class="s m q0" x="548" y="245">Changes blade</text><text class="s m q0" x="548" y="259.5">angle to hold</text><text class="s m q0" x="548" y="274">rpm.</text><rect x="614" y="209" width="96" height="78" rx="10" class="rose q2"/><text class="t m q3" x="662" y="228">Blade angle</text><text class="s m q0" x="662" y="245">Up with</text><text class="s m q0" x="662" y="259.5">speed, down</text><text class="s m q0" x="662" y="274">at low speed.</text><path d="M484 248L491 248" class="dk q5"/><path d="M498 248L491 251.2L491 244.8Z" class="dh" style=""/><path d="M598 248L605 248" class="dk q5"/><path d="M612 248L605 251.2L605 244.8Z" class="dh" style=""/><rect x="386" y="301" width="324" height="56" rx="10" class="lav q2"/><text class="t m q3" x="548" y="320">Tachometer = propeller rpm</text><text class="s m q0" x="548" y="337">Registers the rpm the propeller control selected.</text><text class="s q0" x="386" y="379">Inside the pitch stops, rpm stays put; at a stop it acts</text><text class="s q0" x="386" y="393.5">like fixed pitch.</text><rect x="20" y="417" width="222" height="24" rx="10" class="sky q2"/><text class="t q4" x="30" y="434">Fixed pitch: climb or cruise</text><circle cx="31" cy="455" r="2.2" class="ah"/><text class="s q1" x="40" y="459">Climb propeller: lower pitch,</text><text class="s q1" x="40" y="474.5">less drag, higher rpm, better</text><text class="s q1" x="40" y="490">takeoff and climb, worse cruise</text><circle cx="31" cy="505.5" r="2.2" class="ah"/><text class="s q1" x="40" y="509.5">Cruise propeller: higher pitch,</text><text class="s q1" x="40" y="525">more drag, lower rpm, better</text><text class="s q1" x="40" y="540.5">cruise, worse climb</text><rect x="254" y="417" width="222" height="24" rx="10" class="mint q2"/><text class="t q4" x="264" y="434">Pitch stops</text><circle cx="265" cy="455" r="2.2" class="ah"/><text class="s q1" x="274" y="459">Constant-speed range lies</text><text class="s q1" x="274" y="474.5">between the high and low pitch</text><text class="s q1" x="274" y="490">stops</text><circle cx="265" cy="505.5" r="2.2" class="ah"/><text class="s q1" x="274" y="509.5">Low stop reached: rpm falls</text><text class="s q1" x="274" y="525">like a fixed-pitch propeller</text><circle cx="265" cy="540.5" r="2.2" class="ah"/><text class="s q1" x="274" y="544.5">High stop reached while</text><text class="s q1" x="274" y="560">accelerating: rpm rises</text><rect x="488" y="417" width="222" height="24" rx="10" class="lav q2"/><text class="t q4" x="498" y="434">Changing power</text><circle cx="499" cy="455" r="2.2" class="ah"/><text class="s q1" x="508" y="459">Decrease: reduce manifold</text><text class="s q1" x="508" y="474.5">pressure first, then rpm</text><circle cx="499" cy="490" r="2.2" class="ah"/><text class="s q1" x="508" y="494">Increase: raise rpm first, then</text><text class="s q1" x="508" y="509.5">manifold pressure</text><circle cx="499" cy="525" r="2.2" class="ah"/><text class="s q1" x="508" y="529">Reason: rpm cut first makes</text><text class="s q1" x="508" y="544.5">manifold pressure rise and may</text><text class="s q1" x="508" y="560">exceed limits</text></svg>
