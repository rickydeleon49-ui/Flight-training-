<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 589" role="img" aria-labelledby="ti de"><title id="ti">Fixed-pitch versus constant-speed propeller</title><desc id="de">Fixed pitch: blade angle cannot change, the tachometer indicates power, and the throttle sets rpm. Constant speed: the throttle sets power shown on the manifold pressure gauge, the propeller control selects rpm, and a governor changes blade angle to hold that rpm between the pitch stops. When reducing power, reduce manifold pressure before rpm; when increasing, rpm first.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><text class="t" x="20" y="28" style="font-size:15px">Fixed-pitch and constant-speed propellers: what each control does</text><text class="s" x="20" y="50.0" style="font-size:13px">A fixed-pitch propeller has one blade angle and one gauge for power. A constant-speed propeller adds a</text><text class="s" x="20" y="66.5" style="font-size:13px">governor and a second control, so throttle and propeller control do different jobs.</text><rect class="cl" x="20" y="91.0" width="336" height="312" rx="8"/><rect class="cl" x="374" y="91.0" width="336" height="312" rx="8"/><text class="t" x="32" y="113.0" style="font-size:14px">Fixed pitch</text><text class="t" x="386" y="113.0" style="font-size:14px">Constant speed</text><g transform="translate(50 181.0) rotate(-14)"><path d="M0 0C10 -26 60 -30 150 0C80 9 20 9 0 0Z" class="sky" style="stroke:currentColor;stroke-width:1.8;stroke-linejoin:round"/><path d="M0 0L150 0" class="dk" style="stroke-width:1;opacity:.5;stroke-dasharray:4 3"/></g><text class="s" x="50" y="203.0" style="font-size:11px">Blade angle: set by the</text><text class="s" x="50" y="217.5" style="font-size:11px">manufacturer, cannot change.</text><circle cx="290" cy="157.0" r="30" class="cl" style="stroke:currentColor;stroke-width:1.6"/><path d="M268.3 144.5A25 25 0 0 1 311.7 144.5" class="dk" style="stroke-width:3"/><path d="M290 157.0L305.43 138.61" class="dk" style="stroke-width:2.2;opacity:1"/><circle cx="290" cy="157.0" r="3" class="dh"/><text class="t m" x="290" y="201.0" style="font-size:11.5px"></text><text class="s" x="246" y="203.0" style="font-size:11px">Rpm needle</text><rect x="32" y="241.0" width="150" height="80" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="107.0" y="260.0" style="font-size:12.5px">Throttle</text><text class="s m" x="107.0" y="277.0" style="font-size:11px">Controls fuel-air flow,</text><text class="s m" x="107.0" y="291.5" style="font-size:11px">so it sets rpm.</text><rect x="194" y="241.0" width="150" height="80" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="269.0" y="260.0" style="font-size:12.5px">Tachometer = power</text><text class="s m" x="269.0" y="277.0" style="font-size:11px">Direct indication of</text><text class="s m" x="269.0" y="291.5" style="font-size:11px">engine power at a given</text><text class="s m" x="269.0" y="306.0" style="font-size:11px">altitude.</text><text class="s" x="32" y="347.0" style="font-size:11px">Same rpm gives less power at 5,000 ft than at sea</text><text class="s" x="32" y="361.5" style="font-size:11px">level.</text><rect x="386" y="125.0" width="140" height="70" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="456.0" y="144.0" style="font-size:12.5px">Throttle</text><text class="s m" x="456.0" y="161.0" style="font-size:11px">Controls power</text><text class="s m" x="456.0" y="175.5" style="font-size:11px">output.</text><rect x="548" y="125.0" width="162" height="70" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="629.0" y="144.0" style="font-size:12.5px">Manifold pressure</text><text class="t m" x="629.0" y="159.0" style="font-size:12.5px">gauge</text><text class="s m" x="629.0" y="176.0" style="font-size:11px">Shows power; reads MAP.</text><path d="M528 160.0L539.0 160.0" class="dk" style="stroke-width:2"/><path d="M546 160.0L539.0 163.2L539.0 156.8Z" class="dh" style=""/><rect x="386" y="209.0" width="96" height="78" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="434.0" y="228.0" style="font-size:12.5px">Prop</text><text class="t m" x="434.0" y="243.0" style="font-size:12.5px">control</text><text class="s m" x="434.0" y="260.0" style="font-size:11px">Selects rpm.</text><rect x="500" y="209.0" width="96" height="78" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="548.0" y="228.0" style="font-size:12.5px">Governor</text><text class="s m" x="548.0" y="245.0" style="font-size:11px">Changes blade</text><text class="s m" x="548.0" y="259.5" style="font-size:11px">angle to hold</text><text class="s m" x="548.0" y="274.0" style="font-size:11px">rpm.</text><rect x="614" y="209.0" width="96" height="78" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="662.0" y="228.0" style="font-size:12.5px">Blade angle</text><text class="s m" x="662.0" y="245.0" style="font-size:11px">Up with</text><text class="s m" x="662.0" y="259.5" style="font-size:11px">speed, down</text><text class="s m" x="662.0" y="274.0" style="font-size:11px">at low speed.</text><path d="M484 248.0L491.0 248.0" class="dk" style="stroke-width:2"/><path d="M498 248.0L491.0 251.2L491.0 244.8Z" class="dh" style=""/><path d="M598 248.0L605.0 248.0" class="dk" style="stroke-width:2"/><path d="M612 248.0L605.0 251.2L605.0 244.8Z" class="dh" style=""/><rect x="386" y="301.0" width="324" height="56" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="548.0" y="320.0" style="font-size:12.5px">Tachometer = propeller rpm</text><text class="s m" x="548.0" y="337.0" style="font-size:11px">Registers the rpm the propeller control selected.</text><text class="s" x="386" y="379.0" style="font-size:11px">Inside the pitch stops, rpm stays put; at a stop it acts</text><text class="s" x="386" y="393.5" style="font-size:11px">like fixed pitch.</text><rect x="20" y="417.0" width="222" height="24" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30" y="434.0" style="font-size:13px">Fixed pitch: climb or cruise</text><circle cx="31" cy="455.0" r="2.2" class="ah"/><text class="s" x="40" y="459.0" style="font-size:12px">Climb propeller: lower pitch,</text><text class="s" x="40" y="474.5" style="font-size:12px">less drag, higher rpm, better</text><text class="s" x="40" y="490.0" style="font-size:12px">takeoff and climb, worse cruise</text><circle cx="31" cy="505.5" r="2.2" class="ah"/><text class="s" x="40" y="509.5" style="font-size:12px">Cruise propeller: higher pitch,</text><text class="s" x="40" y="525.0" style="font-size:12px">more drag, lower rpm, better</text><text class="s" x="40" y="540.5" style="font-size:12px">cruise, worse climb</text><rect x="254" y="417.0" width="222" height="24" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="264" y="434.0" style="font-size:13px">Pitch stops</text><circle cx="265" cy="455.0" r="2.2" class="ah"/><text class="s" x="274" y="459.0" style="font-size:12px">Constant-speed range lies</text><text class="s" x="274" y="474.5" style="font-size:12px">between the high and low pitch</text><text class="s" x="274" y="490.0" style="font-size:12px">stops</text><circle cx="265" cy="505.5" r="2.2" class="ah"/><text class="s" x="274" y="509.5" style="font-size:12px">Low stop reached: rpm falls</text><text class="s" x="274" y="525.0" style="font-size:12px">like a fixed-pitch propeller</text><circle cx="265" cy="540.5" r="2.2" class="ah"/><text class="s" x="274" y="544.5" style="font-size:12px">High stop reached while</text><text class="s" x="274" y="560.0" style="font-size:12px">accelerating: rpm rises</text><rect x="488" y="417.0" width="222" height="24" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="498" y="434.0" style="font-size:13px">Changing power</text><circle cx="499" cy="455.0" r="2.2" class="ah"/><text class="s" x="508" y="459.0" style="font-size:12px">Decrease: reduce manifold</text><text class="s" x="508" y="474.5" style="font-size:12px">pressure first, then rpm</text><circle cx="499" cy="490.0" r="2.2" class="ah"/><text class="s" x="508" y="494.0" style="font-size:12px">Increase: raise rpm first, then</text><text class="s" x="508" y="509.5" style="font-size:12px">manifold pressure</text><circle cx="499" cy="525.0" r="2.2" class="ah"/><text class="s" x="508" y="529.0" style="font-size:12px">Reason: rpm cut first makes</text><text class="s" x="508" y="544.5" style="font-size:12px">manifold pressure rise and may</text><text class="s" x="508" y="560.0" style="font-size:12px">exceed limits</text></svg>
