<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 694" role="img" aria-labelledby="ti de"><title id="ti">Situational awareness, stress and workload</title><desc id="de">Two simple graphs and six cards. Left graph: performance rises with stress, peaks, then falls off rapidly. Right graph: a rising line of tasks crosses a dashed capacity line, and past it tasks are done badly or not at all. Cards cover situational awareness, what takes it away, workload management, overload warning signs, what to do when overloaded and stress management.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><style>.PN{fill:#1c2230;stroke:#8b93a7;stroke-width:1.2}.q0{font-size:11.5px}.q1{font-size:13px}.q2{font-size:11px}.q3{stroke:currentColor;stroke-width:1.5}.q4{font-size:10.5px}</style><text class="t" x="20" y="28" style="font-size:15px">Situational awareness, stress and workload</text><text class="s q1" x="20" y="50">Situational awareness means accurately seeing and understanding what affects safety. Stress and too</text><text class="s q1" x="20" y="66.5">many tasks both shrink it.</text><rect class="cl" x="20" y="89" width="690" height="190" rx="8"/><text class="t q1" x="30" y="111">Stress and performance</text><path d="M50 129L50 249L340 249" class="dk" style="stroke-width:2"/><path d="M56 237Q130 123 190 135Q250 147 320 239" class="acc"/><text class="s q4" x="54" y="127">Performance</text><text class="s e q4" x="338" y="263">Stress</text><text class="s m q2" x="186" y="153">Peaks, then</text><text class="s m q2" x="186" y="167">falls off rapidly</text><text class="s m q2" x="190" y="215">Some stress keeps</text><text class="s m q2" x="190" y="229">you alert</text><text class="t q1" x="380" y="111">Workload and your capacity</text><path d="M392 129L392 249L700 249" class="dk" style="stroke-width:2"/><path d="M392 173L700 173" class="o d" style="stroke-width:1.5"/><text class="s e q4" x="698" y="167">Your capacity</text><path d="M398 237L640 133" class="acc"/><text class="s q4" x="396" y="127">Tasks</text><text class="s e q4" x="698" y="263">Time</text><text class="s m q2" x="560" y="215">Past the line, tasks are</text><text class="s m q2" x="560" y="229">done badly or not at all</text><rect class="cl" x="20" y="291" width="222" height="197" rx="8"/><rect x="20" y="291" width="222" height="26" rx="10" class="sky q3"/><text class="t q1" x="30" y="309">Situational awareness</text><circle cx="33" cy="327" r="2.2" class="ah"/><text class="s q0" x="42" y="331">Seeing and understanding all</text><text class="s q0" x="42" y="346">factors in the five risk</text><text class="s q0" x="42" y="361">elements: flight, pilot,</text><text class="s q0" x="42" y="376">aircraft, environment, type of</text><text class="s q0" x="42" y="391">operation.</text><circle cx="33" cy="405" r="2.2" class="ah"/><text class="s q0" x="42" y="409">Monitoring radio traffic,</text><text class="s q0" x="42" y="424">weather talk and ATC helps</text><text class="s q0" x="42" y="439">build a mental picture.</text><circle cx="33" cy="453" r="2.2" class="ah"/><text class="s q0" x="42" y="457">Know where you are and why you</text><text class="s q0" x="42" y="472">are being vectored.</text><rect class="cl" x="254" y="291" width="222" height="197" rx="8"/><rect x="254" y="291" width="222" height="26" rx="10" class="lav q3"/><text class="t q1" x="264" y="309">What takes it away</text><circle cx="267" cy="327" r="2.2" class="ah"/><text class="s q0" x="276" y="331">Fatigue, stress and work</text><text class="s q0" x="276" y="346">overload make you fixate on one</text><text class="s q0" x="276" y="361">item.</text><circle cx="267" cy="375" r="2.2" class="ah"/><text class="s q0" x="276" y="379">Distractions divert attention</text><text class="s q0" x="276" y="394">from the instruments and from</text><text class="s q0" x="276" y="409">scanning outside. Many begin</text><text class="s q0" x="276" y="424">small, such as a gauge that</text><text class="s q0" x="276" y="439">reads wrong.</text><rect class="cl" x="488" y="291" width="222" height="197" rx="8"/><rect x="488" y="291" width="222" height="26" rx="10" class="mint q3"/><text class="t q1" x="498" y="309">Workload management</text><circle cx="501" cy="327" r="2.2" class="ah"/><text class="s q0" x="510" y="331">Plan, prioritize and sequence</text><text class="s q0" x="510" y="346">tasks.</text><circle cx="501" cy="360" r="2.2" class="ah"/><text class="s q0" x="510" y="364">Use quiet periods to prepare:</text><text class="s q0" x="510" y="379">review the chart, set</text><text class="s q0" x="510" y="394">frequencies, listen to ATIS,</text><text class="s q0" x="510" y="409">ASOS or AWOS, monitor tower or</text><text class="s q0" x="510" y="424">CTAF.</text><circle cx="501" cy="438" r="2.2" class="ah"/><text class="s q0" x="510" y="442">Do checklists early, before</text><text class="s q0" x="510" y="457">busy airspace such as Class B.</text><rect class="cl" x="20" y="500" width="222" height="182" rx="8"/><rect x="20" y="500" width="222" height="26" rx="10" class="rose q3"/><text class="t q1" x="30" y="518">Overload warning signs</text><circle cx="33" cy="536" r="2.2" class="ah"/><text class="s q0" x="42" y="540">First sign: working harder but</text><text class="s q0" x="42" y="555">doing less.</text><circle cx="33" cy="569" r="2.2" class="ah"/><text class="s q0" x="42" y="573">You focus on one item. Task</text><text class="s q0" x="42" y="588">saturated: you miss input and</text><text class="s q0" x="42" y="603">decide on incomplete</text><text class="s q0" x="42" y="618">information.</text><rect class="cl" x="254" y="500" width="222" height="182" rx="8"/><rect x="254" y="500" width="222" height="26" rx="10" class="mint q3"/><text class="t q1" x="264" y="518">When overloaded</text><circle cx="267" cy="536" r="2.2" class="ah"/><text class="s q0" x="276" y="540">Stop, think, slow down and</text><text class="s q0" x="276" y="555">prioritize.</text><circle cx="267" cy="569" r="2.2" class="ah"/><text class="s q0" x="276" y="573">Keep the problem in</text><text class="s q0" x="276" y="588">perspective, stay calm and</text><text class="s q0" x="276" y="603">think rationally.</text><circle cx="267" cy="617" r="2.2" class="ah"/><text class="s q0" x="276" y="621">A cabin door opening is minor</text><text class="s q0" x="276" y="636">in VFR but a bigger load in</text><text class="s q0" x="276" y="651">IFR.</text><rect class="cl" x="488" y="500" width="222" height="182" rx="8"/><rect x="488" y="500" width="222" height="26" rx="10" class="sky q3"/><text class="t q1" x="498" y="518">Stress management</text><circle cx="501" cy="536" r="2.2" class="ah"/><text class="s q0" x="510" y="540">Everyone has some stress almost</text><text class="s q0" x="510" y="555">all the time. Effects are</text><text class="s q0" x="510" y="570">cumulative.</text><circle cx="501" cy="584" r="2.2" class="ah"/><text class="s q0" x="510" y="588">Stop, think and analyze before</text><text class="s q0" x="510" y="603">jumping to a conclusion. There</text><text class="s q0" x="510" y="618">is usually time.</text><circle cx="501" cy="632" r="2.2" class="ah"/><text class="s q0" x="510" y="636">Make time to relax, keep fit</text><text class="s q0" x="510" y="651">and manage your time to avoid</text><text class="s q0" x="510" y="666">being behind schedule.</text></svg>
