<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 815" role="img" aria-labelledby="ti de"><title id="ti">Night vision illusions</title><desc id="de">Two night scenes: a single amber light in the dark that seems to drift after about 8 to 10 seconds, and a row of shore lights above dark water that look like stars. Below them, seven numbered cards for autokinesis, false horizon, reversible perspective, size-distance, fascination, flicker vertigo and night landing illusions, plus two cards on planning ahead and oxygen at night.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><style>.PN{fill:#1c2230;stroke:#8b93a7;stroke-width:1.2}.q0{font-size:11.5px}.q1{font-size:13px}.q2{stroke:currentColor;stroke-width:1.5}.q3{font-size:11px;fill:#fff}.q4{font-size:11px;fill:#e8ecf5}</style><text class="t" x="20" y="28" style="font-size:15px">Night vision illusions</text><text class="s q1" x="20" y="50">The eyes can be fooled at night. Knowing the illusions ahead of time is usually the best way to avoid</text><text class="s q1" x="20" y="66.5">them. Cards 1 to 7 are the illusions; the last two are ways to prepare.</text><rect class="cl" x="20" y="89" width="690" height="150" rx="8"/><rect x="34" y="123" width="300" height="102" rx="6" class="PN"/><text class="t q1" x="30" y="111">1. One light in the dark</text><circle cx="150" cy="179" r="6" fill="#f5a623"/><circle cx="200" cy="172.75" r="6" fill="#f5a623" style="opacity:0.55"/><circle cx="250" cy="166.5" r="6" fill="#f5a623" style="opacity:0.3"/><path d="M162 177L238 167" class="o d" style="stroke:#f5a623;stroke-width:1.5"/><text class="s m q4" x="184" y="151">seems to move on its own</text><text class="s m q4" x="184" y="213">after about 8 to 10 seconds</text><text class="t q1" x="380" y="111">2. Shore lights over dark water</text><rect x="380" y="123" width="320" height="102" rx="6" class="PN"/><circle cx="410" cy="181" r="2.6" fill="#f5a623"/><circle cx="452" cy="181" r="2.6" fill="#f5a623"/><circle cx="494" cy="181" r="2.6" fill="#f5a623"/><circle cx="536" cy="181" r="2.6" fill="#f5a623"/><circle cx="578" cy="181" r="2.6" fill="#f5a623"/><circle cx="620" cy="181" r="2.6" fill="#f5a623"/><circle cx="662" cy="181" r="2.6" fill="#f5a623"/><circle cx="420" cy="141" r="1.8" fill="#e8ecf5"/><circle cx="500" cy="149" r="1.8" fill="#e8ecf5"/><circle cx="590" cy="139" r="1.8" fill="#e8ecf5"/><circle cx="660" cy="153" r="1.8" fill="#e8ecf5"/><rect x="380" y="187" width="320" height="38" rx="4" fill="#0b0f1a" fill-opacity=".7"/><text class="s m q4" x="540" y="211">Dark water: no horizon visible</text><text class="s m q4" x="540" y="171">Shore lights can look like stars</text><rect class="cl" x="20" y="251" width="222" height="182" rx="8"/><rect x="20" y="251" width="222" height="26" rx="10" class="sky q2"/><circle cx="35" cy="264" r="9" class="ah"/><text class="t m q3" x="35" y="267.67">1</text><text class="t q1" x="50" y="269">Autokinesis</text><circle cx="33" cy="287" r="2.2" class="ah"/><text class="s q0" x="42" y="291">Staring at one light against a</text><text class="s q0" x="42" y="306">dark background for more than a</text><text class="s q0" x="42" y="321">few seconds.</text><circle cx="33" cy="335" r="2.2" class="ah"/><text class="s q0" x="42" y="339">The light seems to move on its</text><text class="s q0" x="42" y="354">own, in about 8 to 10 seconds.</text><circle cx="33" cy="368" r="2.2" class="ah"/><text class="s q0" x="42" y="372">Scan, and look at objects at</text><text class="s q0" x="42" y="387">varying distances. Never stare</text><text class="s q0" x="42" y="402">at a light for more than 10</text><text class="s q0" x="42" y="417">seconds.</text><rect class="cl" x="254" y="251" width="222" height="182" rx="8"/><rect x="254" y="251" width="222" height="26" rx="10" class="lav q2"/><circle cx="269" cy="264" r="9" class="ah"/><text class="t m q3" x="269" y="267.67">2</text><text class="t q1" x="284" y="269">False horizon</text><circle cx="267" cy="287" r="2.2" class="ah"/><text class="s q0" x="276" y="291">The natural horizon is hidden</text><text class="s q0" x="276" y="306">or hard to see.</text><circle cx="267" cy="320" r="2.2" class="ah"/><text class="s q0" x="276" y="324">Bright stars and city lights</text><text class="s q0" x="276" y="339">can be confused.</text><circle cx="267" cy="353" r="2.2" class="ah"/><text class="s q0" x="276" y="357">Flying toward a shore, lights</text><text class="s q0" x="276" y="372">along it can be mistaken for</text><text class="s q0" x="276" y="387">stars.</text><rect class="cl" x="488" y="251" width="222" height="182" rx="8"/><rect x="488" y="251" width="222" height="26" rx="10" class="mint q2"/><circle cx="503" cy="264" r="9" class="ah"/><text class="t m q3" x="503" y="267.67">3</text><text class="t q1" x="518" y="269">Reversible perspective</text><circle cx="501" cy="287" r="2.2" class="ah"/><text class="s q0" x="510" y="291">An aircraft seems to move away</text><text class="s q0" x="510" y="306">when it is really approaching.</text><text class="s q0" x="510" y="321">Often when flying parallel to</text><text class="s q0" x="510" y="336">another course.</text><circle cx="501" cy="350" r="2.2" class="ah"/><text class="s q0" x="510" y="354">Watch its lights against the</text><text class="s q0" x="510" y="369">horizon. Brighter means</text><text class="s q0" x="510" y="384">approaching; dimmer means</text><text class="s q0" x="510" y="399">moving away.</text><rect class="cl" x="20" y="445" width="222" height="149" rx="8"/><rect x="20" y="445" width="222" height="26" rx="10" class="rose q2"/><circle cx="35" cy="458" r="9" class="ah"/><text class="t m q3" x="35" y="461.67">4</text><text class="t q1" x="50" y="463">Size-distance</text><circle cx="33" cy="481" r="2.2" class="ah"/><text class="s q0" x="42" y="485">A light that gets brighter or</text><text class="s q0" x="42" y="500">dimmer.</text><circle cx="33" cy="514" r="2.2" class="ah"/><text class="s q0" x="42" y="518">You may read it as approaching</text><text class="s q0" x="42" y="533">or retreating.</text><rect class="cl" x="254" y="445" width="222" height="149" rx="8"/><rect x="254" y="445" width="222" height="26" rx="10" class="sky q2"/><circle cx="269" cy="458" r="9" class="ah"/><text class="t m q3" x="269" y="461.67">5</text><text class="t q1" x="284" y="463">Fascination (fixation)</text><circle cx="267" cy="481" r="2.2" class="ah"/><text class="s q0" x="276" y="485">You ignore orientation cues and</text><text class="s q0" x="276" y="500">fix on a goal or an object,</text><text class="s q0" x="276" y="515">such as the instruments or the</text><text class="s q0" x="276" y="530">landing.</text><circle cx="267" cy="544" r="2.2" class="ah"/><text class="s q0" x="276" y="548">At night, closure rates are</text><text class="s q0" x="276" y="563">hard to judge and there may be</text><text class="s q0" x="276" y="578">little time to correct.</text><rect class="cl" x="488" y="445" width="222" height="149" rx="8"/><rect x="488" y="445" width="222" height="26" rx="10" class="lav q2"/><circle cx="503" cy="458" r="9" class="ah"/><text class="t m q3" x="503" y="461.67">6</text><text class="t q1" x="518" y="463">Flicker vertigo</text><circle cx="501" cy="481" r="2.2" class="ah"/><text class="s q0" x="510" y="485">A light flickering at 4 to 20</text><text class="s q0" x="510" y="500">cycles per second.</text><circle cx="501" cy="514" r="2.2" class="ah"/><text class="s q0" x="510" y="518">Nausea, vomiting and vertigo</text><text class="s q0" x="510" y="533">may occur. Rarely: convulsions</text><text class="s q0" x="510" y="548">and unconsciousness.</text><circle cx="501" cy="562" r="2.2" class="ah"/><text class="s q0" x="510" y="566">Proper scanning prevents it.</text><rect class="cl" x="20" y="606" width="222" height="197" rx="8"/><rect x="20" y="606" width="222" height="26" rx="10" class="rose q2"/><circle cx="35" cy="619" r="9" class="ah"/><text class="t m q3" x="35" y="622.67">7</text><text class="t q1" x="50" y="624">Night landing illusions</text><circle cx="33" cy="642" r="2.2" class="ah"/><text class="s q0" x="42" y="646">Too low: featureless terrain,</text><text class="s q0" x="42" y="661">rain, haze or a dark runway</text><text class="s q0" x="42" y="676">area push you to fly lower than</text><text class="s q0" x="42" y="691">normal.</text><circle cx="33" cy="705" r="2.2" class="ah"/><text class="s q0" x="42" y="709">Too high: bright lights, steep</text><text class="s q0" x="42" y="724">terrain or a wide runway give a</text><text class="s q0" x="42" y="739">feeling of being too low, so</text><text class="s q0" x="42" y="754">you fly higher.</text><circle cx="33" cy="768" r="2.2" class="ah"/><text class="s q0" x="42" y="772">Road lights or train lights can</text><text class="s q0" x="42" y="787">look like runway lights.</text><rect class="cl" x="254" y="606" width="222" height="197" rx="8"/><rect x="254" y="606" width="222" height="26" rx="10" class="mint q2"/><text class="t q1" x="264" y="624">Plan before you go</text><circle cx="267" cy="642" r="2.2" class="ah"/><text class="s q0" x="276" y="646">Fly your routes by day. Set the</text><text class="s q0" x="276" y="661">minimum altitude you will</text><text class="s q0" x="276" y="676">accept at night.</text><circle cx="267" cy="690" r="2.2" class="ah"/><text class="s q0" x="276" y="694">If weather stops you keeping</text><text class="s q0" x="276" y="709">it, decide early to turn 180</text><text class="s q0" x="276" y="724">degrees and land at an</text><text class="s q0" x="276" y="739">alternate.</text><rect class="cl" x="488" y="606" width="222" height="197" rx="8"/><rect x="488" y="606" width="222" height="26" rx="10" class="mint q2"/><text class="t q1" x="498" y="624">Oxygen at night</text><circle cx="501" cy="642" r="2.2" class="ah"/><text class="s q0" x="510" y="646">Think about oxygen at altitudes</text><text class="s q0" x="510" y="661">and times the FAA does not</text><text class="s q0" x="510" y="676">require, when judgment and</text><text class="s q0" x="510" y="691">hand-eye coordination matter</text><text class="s q0" x="510" y="706">(for example IFR).</text><circle cx="501" cy="720" r="2.2" class="ah"/><text class="s q0" x="510" y="724">Also if you smoke or are not</text><text class="s q0" x="510" y="739">perfectly healthy.</text></svg>
