<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 580" role="img" aria-labelledby="ti de"><title id="ti">Glass cockpit and automation: three skills</title><desc id="de">Two bars show that almost 40 percent of general aviation accidents happen in landing and another 15 percent in takeoff and initial climb. Three cards cover the skills of information, automation and risk management. Two more cards give checks before relying on automation, and the 1999 Colombia accident caused by a waypoint entered one degree wrong.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><style>.PN{fill:#1c2230;stroke:#8b93a7;stroke-width:1.2}.q0{font-size:11.5px}.q1{font-size:13px}.q2{stroke:currentColor;stroke-width:1.5}.q3{font-size:11px;fill:#fff}</style><text class="t" x="20" y="28" style="font-size:15px">Glass cockpit and automation: three skills</text><text class="s q1" x="20" y="50">Advanced avionics add information, but they do not replace basic flying. Learn to fly the airplane</text><text class="s q1" x="20" y="66.5">first, then manage the screens.</text><rect class="cl" x="20" y="89" width="690" height="96" rx="8"/><text class="t q1" x="30" y="111">Where general aviation accidents happen</text><rect x="30" y="129" width="320" height="16" rx="3" class="ah"/><text class="s q0" x="360" y="142">Landing phase: almost 40 percent</text><rect x="30" y="155" width="120" height="16" rx="3" class="ah"/><text class="s q0" x="160" y="168">Takeoff and initial climb: another 15 percent</text><rect class="cl" x="20" y="197" width="222" height="182" rx="8"/><rect x="20" y="197" width="222" height="26" rx="10" class="sky q2"/><circle cx="35" cy="210" r="9" class="ah"/><text class="t m q3" x="35" y="213.67">1</text><text class="t q1" x="50" y="215">Information</text><circle cx="33" cy="233" r="2.2" class="ah"/><text class="s q0" x="42" y="237">Learn how the system is</text><text class="s q0" x="42" y="252">organized, not only which knobs</text><text class="s q0" x="42" y="267">to turn. Expect surprises.</text><circle cx="33" cy="281" r="2.2" class="ah"/><text class="s q0" x="42" y="285">Stop, look and read before you</text><text class="s q0" x="42" y="300">push, pull or twist.</text><circle cx="33" cy="314" r="2.2" class="ah"/><text class="s q0" x="42" y="318">Set up the screens: map</text><text class="s q0" x="42" y="333">orientation, how much to show,</text><text class="s q0" x="42" y="348">map scale for en route versus</text><text class="s q0" x="42" y="363">terminal.</text><rect class="cl" x="254" y="197" width="222" height="182" rx="8"/><rect x="254" y="197" width="222" height="26" rx="10" class="lav q2"/><circle cx="269" cy="210" r="9" class="ah"/><text class="t m q3" x="269" y="213.67">2</text><text class="t q1" x="284" y="215">Automation</text><circle cx="267" cy="233" r="2.2" class="ah"/><text class="s q0" x="276" y="237">Know which autopilot modes are</text><text class="s q0" x="276" y="252">engaged and which are armed,</text><text class="s q0" x="276" y="267">and check armed modes engage on</text><text class="s q0" x="276" y="282">time.</text><circle cx="267" cy="296" r="2.2" class="ah"/><text class="s q0" x="276" y="300">Use callouts, even when alone.</text><circle cx="267" cy="314" r="2.2" class="ah"/><text class="s q0" x="276" y="318">Know how the autopilot reacts</text><text class="s q0" x="276" y="333">to other changes. Some drop to</text><text class="s q0" x="276" y="348">wing level if you switch the</text><text class="s q0" x="276" y="363">navigation source.</text><rect class="cl" x="488" y="197" width="222" height="182" rx="8"/><rect x="488" y="197" width="222" height="26" rx="10" class="rose q2"/><circle cx="503" cy="210" r="9" class="ah"/><text class="t m q3" x="503" y="213.67">3</text><text class="t q1" x="518" y="215">Risk</text><circle cx="501" cy="233" r="2.2" class="ah"/><text class="s q0" x="510" y="237">People are poor monitors of</text><text class="s q0" x="510" y="252">automated systems, and the more</text><text class="s q0" x="510" y="267">reliable it is, the worse they</text><text class="s q0" x="510" y="282">do.</text><circle cx="501" cy="296" r="2.2" class="ah"/><text class="s q0" x="510" y="300">Do not let the equipment make</text><text class="s q0" x="510" y="315">you the passenger in command.</text><circle cx="501" cy="329" r="2.2" class="ah"/><text class="s q0" x="510" y="333">Sometimes good judgment means</text><text class="s q0" x="510" y="348">saying no to a flight.</text><rect class="cl" x="20" y="395" width="335" height="132" rx="8"/><rect x="20" y="395" width="335" height="26" rx="10" class="mint q2"/><text class="t q1" x="30" y="413">Before you rely on it</text><circle cx="33" cy="435" r="2.2" class="ah"/><text class="s q0" x="42" y="439">Verify everything programmed on the ground.</text><circle cx="33" cy="453" r="2.2" class="ah"/><text class="s q0" x="42" y="457">Match the route to a paper log. If they differ, do</text><text class="s q0" x="42" y="472">not assume the computer is right.</text><circle cx="33" cy="486" r="2.2" class="ah"/><text class="s q0" x="42" y="490">Verify waypoints. Back up GPS with VOR.</text><circle cx="33" cy="504" r="2.2" class="ah"/><text class="s q0" x="42" y="508">Stay within your own limits.</text><rect class="cl" x="375" y="395" width="335" height="132" rx="8"/><rect x="375" y="395" width="335" height="26" rx="10" class="rose q2"/><text class="t q1" x="385" y="413">A one degree mistake</text><text class="s q0" x="385" y="439">In 1999 a crew in Colombia entered one waypoint</text><text class="s q0" x="385" y="454">wrong by one degree. The flight path ran 60 NM off</text><text class="s q0" x="385" y="469">course and into the Andes. They had charts and a</text><text class="s q0" x="385" y="484">paper log but let the automation fly itself.</text><text class="s" x="20" y="545" style="font-size:12px">Electronic flight displays are a tool for safety. They do not replace basic flight knowledge and skills. The</text><text class="s" x="20" y="560.5" style="font-size:12px">most common theme in fatal advanced-avionics accidents: continued VFR flight into IMC.</text></svg>
