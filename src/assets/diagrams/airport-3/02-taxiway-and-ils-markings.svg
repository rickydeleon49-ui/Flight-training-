<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 630" role="img" aria-labelledby="ti de"><title id="ti">Taxiway markings: yellow lines and spots</title><desc id="de">Plan view of a taxiway with four numbered markings: a continuous yellow centerline, solid double yellow edge lines with a dashed edge beside a paved apron, a pink position circle inside white and black rings, and a ladder of yellow lines across the taxiway marking the ILS critical area holding position. Four cards explain each marking.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:var(--diagram-text-opacity,.85)}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:var(--diagram-fill-opacity,.6)}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:var(--diagram-fill-opacity,.6)}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:var(--diagram-fill-opacity,.6)}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:var(--diagram-fill-opacity,.6)}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:13px}.q1{font-size:12px}.q2{stroke:currentColor;stroke-width:1.5}.q3{font-size:15px}.q4{font-size:11.5px}.pv{fill:#3a3d42}.wh{fill:#fff}.ye{fill:#f5c518}.yl{stroke:#f5c518;fill:none;stroke-width:3}.wl{stroke:#fff;fill:none;stroke-width:3}.hb{font-weight:700}</style><text class="t q3" x="20" y="28">Taxiway markings: yellow lines and spots</text><text class="s q1" x="20" y="50.0">Taxiway markings are yellow, so they stand apart from the white runway markings.</text><text class="s q1" x="20" y="66.5">Here are four you will meet while taxiing, shown on one stretch of taxiway.</text><rect class="cl" x="20" y="88" width="690" height="206" rx="8"/><rect x="20" y="88" width="690" height="26" rx="10" class="sky q2"/><text class="t q0" x="30" y="106">One stretch of taxiway, seen from above</text><rect x="30" y="122" width="670" height="36" class="mint"/><rect x="30" y="158" width="670" height="72" class="pv"/><rect x="270" y="230" width="180" height="40" class="pv" style="fill:#4d5157"/><path d="M30 164L700 164M30 171L700 171" class="yl"/><path d="M30 217L270 217M30 224L270 224" class="yl"/><path d="M450 217L700 217M450 224L700 224" class="yl"/><path d="M270 224L450 224" class="yl" style="stroke-dasharray:14 10"/><path d="M30 194L700 194" class="yl" style="stroke-width:4"/><circle cx="520" cy="182" r="12" style="fill:#fff;stroke:#000;stroke-width:3"/><circle cx="520" cy="182" r="8" style="fill:#f4a6c0"/><path d="M612 160L612 228M628 160L628 228" class="yl" style="stroke-width:2.5"/><path d="M612 166L628 166" class="yl" style="stroke-width:2.5"/><path d="M612 180L628 180" class="yl" style="stroke-width:2.5"/><path d="M612 194L628 194" class="yl" style="stroke-width:2.5"/><path d="M612 208L628 208" class="yl" style="stroke-width:2.5"/><path d="M612 222L628 222" class="yl" style="stroke-width:2.5"/><path d="M150 236L150 198M520 236L520 195M360 154L360 163M620 154L620 159" style="stroke:var(--palette-berry,#A84C6B);stroke-width:2.5;fill:none"/><circle cx="150" cy="247" r="11" style="fill:#8a2f52"/><text class="t q1 m" x="150" y="251.5" style="fill:#fff">1</text><circle cx="360" cy="143" r="11" style="fill:#8a2f52"/><text class="t q1 m" x="360" y="147.5" style="fill:#fff">2</text><circle cx="520" cy="247" r="11" style="fill:#8a2f52"/><text class="t q1 m" x="520" y="251.5" style="fill:#fff">3</text><circle cx="620" cy="143" r="11" style="fill:#8a2f52"/><text class="t q1 m" x="620" y="147.5" style="fill:#fff">4</text><text class="s q1" x="163" y="251">Centerline</text><text class="s q1" x="375" y="147">Edge lines</text><text class="s q1" x="535" y="251">Position spot</text><text class="s q1" x="635" y="147">ILS hold</text><text class="s q4 m" x="360" y="262" style="fill:#fff">Paved apron</text><text class="s q4" x="60" y="148">Grass or shoulder</text><rect class="cl" x="20" y="308" width="340" height="142" rx="8"/><rect x="20" y="308" width="340" height="26" rx="10" class="sky q2"/><text class="t q0" x="30" y="326">1  Centerline</text><circle cx="32" cy="348" r="2.2" class="ah"/><text class="s q0" x="41" y="352.0">A single continuous yellow line down</text><text class="s q0" x="41" y="367.5">the middle of the taxiway.</text><circle cx="32" cy="387.0" r="2.2" class="ah"/><text class="s q0" x="41" y="391.0">Taxi with the nose wheel on it, unless</text><text class="s q0" x="41" y="406.5">ATC tells you otherwise.</text><rect class="cl" x="370" y="308" width="340" height="142" rx="8"/><rect x="370" y="308" width="340" height="26" rx="10" class="lav q2"/><text class="t q0" x="380" y="326">2  Edge lines</text><circle cx="382" cy="348" r="2.2" class="ah"/><text class="s q0" x="391" y="352.0">Solid double yellow: the pavement</text><text class="s q0" x="391" y="367.5">beyond is not meant for aircraft.</text><circle cx="382" cy="387.0" r="2.2" class="ah"/><text class="s q0" x="391" y="391.0">Dashed yellow: the taxiway edge, but</text><text class="s q0" x="391" y="406.5">the pavement beyond is for aircraft too,</text><text class="s q0" x="391" y="422.0">such as an apron.</text><rect class="cl" x="20" y="462" width="340" height="142" rx="8"/><rect x="20" y="462" width="340" height="26" rx="10" class="rose q2"/><text class="t q0" x="30" y="480">3  Position spot</text><circle cx="32" cy="502" r="2.2" class="ah"/><text class="s q0" x="41" y="506.0">A pink circle inside a white ring and</text><text class="s q0" x="41" y="521.5">a black ring, painted beside the centerline.</text><circle cx="32" cy="541.0" r="2.2" class="ah"/><text class="s q0" x="41" y="545.0">ATC uses it to say where you are when</text><text class="s q0" x="41" y="560.5">taxiing in low visibility, such as fog.</text><rect class="cl" x="370" y="462" width="340" height="142" rx="8"/><rect x="370" y="462" width="340" height="26" rx="10" class="mint q2"/><text class="t q0" x="380" y="480">4  ILS critical area</text><circle cx="382" cy="502" r="2.2" class="ah"/><text class="s q0" x="391" y="506.0">A ladder of yellow lines across the</text><text class="s q0" x="391" y="521.5">taxiway marks the hold position.</text><circle cx="382" cy="541.0" r="2.2" class="ah"/><text class="s q0" x="391" y="545.0">It keeps you out of the area that is</text><text class="s q0" x="391" y="560.5">kept clear for the ILS signals.</text><circle cx="382" cy="580.0" r="2.2" class="ah"/><text class="s q0" x="391" y="584.0">Do not cross it without ATC clearance.</text><text class="s q1" x="20" y="618">Source: AIM 2-3-4 through 2-3-6, PHAK ch. 14</text></svg>