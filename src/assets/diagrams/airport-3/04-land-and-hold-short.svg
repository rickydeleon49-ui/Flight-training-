<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 560" role="img" aria-labelledby="ti de"><title id="ti">Land and hold short: what ATC is asking</title><desc id="de">Plan view of a landing runway crossed by a second runway. The aircraft lands from the left, and a hold-short bar sits just before the crossing runway. A double arrow shows the available landing distance from the threshold to the hold-short point. Two cards explain that the pilot may accept or decline, and what to do if accepting.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:var(--diagram-text-opacity,.85)}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:var(--diagram-fill-opacity,.6)}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:var(--diagram-fill-opacity,.6)}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:var(--diagram-fill-opacity,.6)}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:var(--diagram-fill-opacity,.6)}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:13px}.q1{font-size:12px}.q2{stroke:currentColor;stroke-width:1.5}.q3{font-size:15px}.q4{font-size:11.5px}.pv{fill:#3a3d42}.wh{fill:#fff}.ye{fill:#f5c518}.yl{stroke:#f5c518;fill:none;stroke-width:3}.wl{stroke:#fff;fill:none;stroke-width:3}.hb{font-weight:700}</style><text class="t q3" x="20" y="28">Land and hold short: what ATC is asking</text><text class="s q1" x="20" y="50.0">At a towered airport, ATC may clear you to land and stop before a point on the runway, such as</text><text class="s q1" x="20" y="66.5">a crossing runway, so that two runways can be used at the same time. It is called LAHSO.</text><rect class="cl" x="20" y="88" width="690" height="232" rx="8"/><rect x="20" y="88" width="690" height="26" rx="10" class="sky q2"/><text class="t q0" x="30" y="106">The idea, seen from above</text><rect x="50" y="160" width="640" height="34" class="pv"/><rect x="540" y="110" width="34" height="176" class="pv"/><path d="M70 177L520 177" style="stroke:#fff;stroke-width:1.5;stroke-dasharray:9 7;fill:none"/><rect x="50" y="160" width="6" height="34" class="wh"/><rect x="525" y="160" width="8" height="34" class="wh"/><circle cx="518" cy="166" r="2.5" style="fill:#fff"/><circle cx="518" cy="173" r="2.5" style="fill:#fff"/><circle cx="518" cy="180" r="2.5" style="fill:#fff"/><circle cx="518" cy="187" r="2.5" style="fill:#fff"/><path d="M36 177L92 177" class="acc"/><path d="M92 177L82.1 181.8L82.1 172.2Z" class="ah"/><text class="s q1" x="60" y="150">You land here</text><text class="s q1 e" x="515" y="150">Hold-short point</text><text class="s q1 m" x="557" y="304">Crossing runway</text><path d="M53 226L525 226M53 216L53 236M525 216L525 236" style="stroke:currentColor;stroke-width:2.5;fill:none"/><path d="M53 226l12 -6v12zM525 226l-12 -6v12z" class="dh"/><text class="t q0 m" x="289" y="250">Available landing distance (ALD)</text><text class="s q1 m" x="289" y="267">Touch down and stop within this length</text><text class="s q1" x="36" y="296">You stop before the crossing runway.</text><rect class="cl" x="20" y="336" width="340" height="200" rx="8"/><rect x="20" y="336" width="340" height="26" rx="10" class="mint q2"/><text class="t q0" x="30" y="354">Your choice</text><circle cx="32" cy="376" r="2.2" class="ah"/><text class="s q0" x="41" y="380.0">It is only an offer. The pilot in command</text><text class="s q0" x="41" y="395.5">decides, and "unable" is an acceptable</text><text class="s q0" x="41" y="411.0">answer. Once you accept, follow it.</text><circle cx="32" cy="432.5" r="2.2" class="ah"/><text class="s q0" x="41" y="436.5">Student pilots, and pilots who are not</text><text class="s q0" x="41" y="452.0">familiar with LAHSO, should not take part.</text><circle cx="32" cy="473.5" r="2.2" class="ah"/><text class="s q0" x="41" y="477.5">Your landing distance must fit inside</text><text class="s q0" x="41" y="493.0">the ALD for your weight, wind and runway.</text><rect class="cl" x="370" y="336" width="340" height="200" rx="8"/><rect x="370" y="336" width="340" height="26" rx="10" class="rose q2"/><text class="t q0" x="380" y="354">If you accept</text><circle cx="382" cy="376" r="2.2" class="ah"/><text class="s q0" x="391" y="380.0">Read back the clearance and say "hold</text><text class="s q0" x="391" y="395.5">short" with the runway or point.</text><circle cx="382" cy="417.0" r="2.2" class="ah"/><text class="s q0" x="391" y="421.0">Look up the ALD in the Chart Supplement,</text><text class="s q0" x="391" y="436.5">or ask ATC. Compare it with your landing</text><text class="s q0" x="391" y="452.0">distance for the weight and wind.</text><circle cx="382" cy="473.5" r="2.2" class="ah"/><text class="s q0" x="391" y="477.5">Plan to touch down near the start. If you</text><text class="s q0" x="391" y="493.0">cannot stop in time, go around and tell ATC.</text><text class="s q1" x="20" y="548">Source: AIM 4-3-11, PHAK ch. 14</text></svg>