<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 676" role="img" aria-labelledby="ti de"><title id="ti">Leaving the traffic pattern at a non-towered airport</title><desc id="de">Plan view of a left-hand traffic pattern with the runway and its legs. The two standard ways to leave after takeoff are marked: straight out, or a 45-degree turn to the left beyond the departure end, both after reaching pattern altitude. The 45-degree entry at midfield is drawn faded as context only. Two cards explain the two ways to leave and the radio call on the CTAF.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:var(--diagram-text-opacity,.85)}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:var(--diagram-fill-opacity,.6)}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:var(--diagram-fill-opacity,.6)}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:var(--diagram-fill-opacity,.6)}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:var(--diagram-fill-opacity,.6)}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:13px}.q1{font-size:12px}.q2{stroke:currentColor;stroke-width:1.5}.q3{font-size:15px}.q4{font-size:11.5px}.pv{fill:#3a3d42}.wh{fill:#fff}.ye{fill:#f5c518}.yl{stroke:#f5c518;fill:none;stroke-width:3}.wl{stroke:#fff;fill:none;stroke-width:3}.hb{font-weight:700}</style><text class="t q3" x="20" y="28">Leaving the traffic pattern at a non-towered airport</text><text class="s q1" x="20" y="50.0">With no tower, other pilots count on you to leave the pattern in one of two standard ways, and to say so on the radio.</text><text class="s q1" x="20" y="66.5">Left-hand pattern shown; a right-hand pattern is the same picture turned over.</text><rect class="cl" x="20" y="88" width="690" height="306" rx="8"/><rect x="20" y="88" width="690" height="26" rx="10" class="sky q2"/><text class="t q0" x="30" y="106">Left-hand pattern, seen from above</text><g transform="translate(0,26)"><rect x="270" y="300" width="230" height="16" class="pv"/><path d="M285 308L485 308" style="stroke:#fff;stroke-width:1.5;stroke-dasharray:9 7;fill:none"/><text class="s q4 m" x="385" y="344">Runway</text><path d="M545 308L545 170" class="acc"/><path d="M545 250L545 236" class="acc"/><path d="M545 236L549.8 245.9L540.2 245.9Z" class="ah"/><path d="M545 170L150 170" class="acc"/><path d="M300 170L280 170" class="acc"/><path d="M280 170L289.9 165.2L289.9 174.8Z" class="ah"/><path d="M150 170L150 308" class="acc"/><path d="M150 236L150 250" class="acc"/><path d="M150 250L145.2 240.1L154.8 240.1Z" class="ah"/><path d="M150 308L270 308" class="acc"/><path d="M200 308L222 308" class="acc"/><path d="M222 308L212.1 312.8L212.1 303.2Z" class="ah"/><path d="M500 308L545 308" class="acc"/><text class="s q1 e" x="535" y="240">Crosswind</text><text class="s q1" x="163" y="242">Base</text><text class="s q1 m" x="260" y="158">Downwind</text><text class="s q1 m" x="210" y="297">Final</text><text class="s q1 m" x="522" y="330">Upwind</text><path d="M385 176L385 296" style="stroke:currentColor;stroke-width:1.5;stroke-dasharray:4 5;opacity:.6;fill:none"/><text class="s q4" x="392" y="243">Midpoint</text><g opacity=".4"><path d="M455 118L398 164" class="dk"/><path d="M398 164L402.7 154.1L408.7 161.5Z" class="ah"/></g><g><text class="s q1" x="36" y="128">The 45-degree entry (faded arrow) at midfield</text><text class="s q1" x="36" y="144">(see the traffic pattern diagram)</text></g><path d="M552 308L696 308" class="dk"/><path d="M696 308L686.1 312.8L686.1 303.2Z" class="ah"/><text class="s q1 m" x="645" y="331">Straight out</text><path d="M552 304L650 214" class="dk"/><path d="M650 214L645.9 224.2L639.5 217.2Z" class="ah"/><text class="s q1 e" x="702" y="198">Or turn 45 degrees (left here)</text><text class="s q1" x="36" y="360">Climb to pattern altitude first (1,000 ft above the ground unless the airport says otherwise).</text></g><rect class="cl" x="20" y="412" width="340" height="228" rx="8"/><rect x="20" y="412" width="340" height="26" rx="10" class="mint q2"/><text class="t q0" x="30" y="430">Two ways to leave</text><circle cx="32" cy="452" r="2.2" class="ah"/><text class="s q0" x="41" y="456">Straight out: climb to pattern altitude,</text><text class="s q0" x="41" y="471.5">then keep going straight ahead past</text><text class="s q0" x="41" y="487">the end of the runway.</text><circle cx="32" cy="508.5" r="2.2" class="ah"/><text class="s q0" x="41" y="512.5">Or 45-degree turn: after you reach</text><text class="s q0" x="41" y="528">pattern altitude and are past the end,</text><text class="s q0" x="41" y="543.5">turn left in a left-hand pattern, right</text><text class="s q0" x="41" y="559">in a right-hand pattern.</text><circle cx="32" cy="580" r="2.2" class="ah"/><text class="s q0" x="41" y="584">Do not turn across the pattern early.</text><rect class="cl" x="370" y="412" width="340" height="228" rx="8"/><rect x="370" y="412" width="340" height="26" rx="10" class="rose q2"/><text class="t q0" x="380" y="430">Say it on the CTAF</text><circle cx="382" cy="452" r="2.2" class="ah"/><text class="s q0" x="391" y="456">Before you leave, call on the airport</text><text class="s q0" x="391" y="471.5">frequency: your aircraft, the runway,</text><text class="s q0" x="391" y="487">and which way you are leaving.</text><circle cx="382" cy="508.5" r="2.2" class="ah"/><text class="s q0" x="391" y="512.5">For example: "Podunk traffic, Cessna</text><text class="s q0" x="391" y="528">1234, departing runway 26, straight</text><text class="s q0" x="391" y="543.5">out to the west, Podunk."</text><circle cx="382" cy="565" r="2.2" class="ah"/><text class="s q0" x="391" y="569">Listen first, then look. Others use the</text><text class="s q0" x="391" y="584.5">same call to know where you will be.</text><text class="s q1" x="20" y="664">Source: AIM 4-3-3, AC 90-66C</text></svg>