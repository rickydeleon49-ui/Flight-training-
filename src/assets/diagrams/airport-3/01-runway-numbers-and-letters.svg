<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 655" role="img" aria-labelledby="ti de"><title id="ti">Runway numbers and letters: where they come from</title><desc id="de">A compass circle with a runway drawn nearly east-west. Landing toward the east on magnetic heading 087 degrees gives runway 9, and landing toward the west on 267 degrees gives runway 27, so the two ends differ by 18. Steps for making the number, and three parallel runways labelled L, C and R as seen on approach.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:var(--diagram-text-opacity,.85)}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:var(--diagram-fill-opacity,.6)}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:var(--diagram-fill-opacity,.6)}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:var(--diagram-fill-opacity,.6)}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:var(--diagram-fill-opacity,.6)}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:13px}.q1{font-size:12px}.q2{stroke:currentColor;stroke-width:1.5}.q3{font-size:15px}.q4{font-size:11.5px}.pv{fill:#3a3d42}.wh{fill:#fff}.ye{fill:#f5c518}.yl{stroke:#f5c518;fill:none;stroke-width:3}.wl{stroke:#fff;fill:none;stroke-width:3}.hb{font-weight:700}</style><text class="t q3" x="20" y="28">Runway numbers and letters: where they come from</text><text class="s q1" x="20" y="50.0">The number painted on the runway is its magnetic direction, shortened to one or two digits. Each end</text><text class="s q1" x="20" y="66.5">has its own number, read from the direction you are flying when you land on it.</text><rect class="cl" x="20" y="88" width="340" height="318" rx="8"/><rect x="20" y="88" width="340" height="26" rx="10" class="sky q2"/><text class="t q0" x="30" y="106">The two ends of one runway</text><circle cx="190" cy="243" r="98" class="o" style="stroke-width:2;opacity:.6"/><text class="s q4 m" x="190" y="137">N 0</text><text class="s q4 m" x="190" y="360">S 180</text><text class="s q4" x="296" y="247">E 90</text><text class="s q4 e" x="84" y="247">W 270</text><path d="M100.7 258.7L280.5 249.3L279.3 227.3L99.5 236.7Z" class="pv"/><path d="M130.1 246.1L249.9 239.9" style="stroke:#fff;stroke-width:1.5;stroke-dasharray:9 7;fill:none"/><text class="t q1 m" x="262" y="242" style="fill:#fff">27</text><text class="t q1 m" x="118" y="252" style="fill:#fff">9</text><path d="M128 212L248 206" class="acc"/><path d="M248 206L238.3 211.3L237.9 201.7Z" class="ah"/><path d="M252 274L132 280" class="acc"/><path d="M132 280L141.7 274.7L142.1 284.3Z" class="ah"/><text class="s q4 m" x="193" y="188">Landing toward east</text><text class="s q4 m" x="193" y="311">Landing toward west</text><text class="t q1" x="36" y="384">Landing toward east, heading 087: you read 9.</text><text class="t q1" x="36" y="401">Landing toward west, heading 267: you read 27.</text><rect class="cl" x="375" y="88" width="335" height="318" rx="8"/><rect x="375" y="88" width="335" height="26" rx="10" class="mint q2"/><text class="t q0" x="385" y="106">How the number is made</text><circle cx="386" cy="126" r="2.2" class="ah"/><text class="s q0" x="395" y="130.0">Take the runway's magnetic heading</text><text class="s q0" x="395" y="145.5">as you approach to land on it.</text><circle cx="386" cy="164.0" r="2.2" class="ah"/><text class="s q0" x="395" y="168.0">Divide by 10 and round to the</text><text class="s q0" x="395" y="183.5">nearest whole number.</text><circle cx="386" cy="202.0" r="2.2" class="ah"/><text class="s q0" x="395" y="206.0">In the US a single digit has no zero</text><text class="s q0" x="395" y="221.5">in front: runway 8, not 08.</text><text class="t q0" x="386" y="250.0">Worked examples</text><text class="s q0" x="386" y="270.0">087 degrees: 8.7 rounds to 9, so 9</text><text class="s q0" x="386" y="289.0">267 degrees: 26.7 rounds to 27, so 27</text><text class="s q0" x="386" y="308.0">360 degrees (north): written as 36</text><text class="s q0" x="386" y="340.0">Opposite ends differ by 180 degrees,</text><text class="s q0" x="386" y="356.0">so their numbers differ by 18.</text><rect class="cl" x="20" y="420" width="690" height="200" rx="8"/><rect x="20" y="420" width="690" height="26" rx="10" class="lav q2"/><text class="t q0" x="30" y="438">Parallel runways add a letter</text><rect x="60" y="452" width="34" height="100" class="pv"/><path d="M77 456L77 466M77 524L77 548" style="stroke:#fff;stroke-width:1.5;stroke-dasharray:8 6;fill:none"/><text class="t q0 m" x="77" y="490" style="fill:#fff">27</text><text class="t q0 m" x="77" y="512" style="fill:#fff">L</text><rect x="120" y="452" width="34" height="100" class="pv"/><path d="M137 456L137 466M137 524L137 548" style="stroke:#fff;stroke-width:1.5;stroke-dasharray:8 6;fill:none"/><text class="t q0 m" x="137" y="490" style="fill:#fff">27</text><text class="t q0 m" x="137" y="512" style="fill:#fff">C</text><rect x="180" y="452" width="34" height="100" class="pv"/><path d="M197 456L197 466M197 524L197 548" style="stroke:#fff;stroke-width:1.5;stroke-dasharray:8 6;fill:none"/><text class="t q0 m" x="197" y="490" style="fill:#fff">27</text><text class="t q0 m" x="197" y="512" style="fill:#fff">R</text><path d="M120 590L120 566" class="acc"/><path d="M120 566L124.8 575.9L115.2 575.9Z" class="ah"/><text class="s q4 m" x="120" y="606">You, approaching</text><text class="s q0" x="260" y="462">Where two or three runways run side by side with</text><text class="s q0" x="260" y="480">the same heading, the letters tell them apart.</text><text class="s q0" x="260" y="498">As you approach, L is on your left, C in the</text><text class="s q0" x="260" y="516">middle and R on your right.</text><text class="s q0" x="260" y="545">Two parallel runways use L and R; three use</text><text class="s q0" x="260" y="563">L, C and R. The letter is painted below the number.</text><text class="t q0" x="260" y="590">Example: 27L, 27C and 27R.</text><text class="s q1" x="20" y="643">Source: PHAK ch. 14, AIM 2-3-3 and AC 150/5340-1</text></svg>