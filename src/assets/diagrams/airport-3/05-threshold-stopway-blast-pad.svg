<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 556" role="img" aria-labelledby="ti de"><title id="ti">The runway end: threshold stripes and yellow chevrons</title><desc id="de">Plan view of one runway. At the landing end, white threshold stripes run along the runway, eight in this picture. At the far end, pavement beyond the runway carries yellow chevrons, marking a blast pad or stopway that is not for landing, takeoff or taxiing. Three cards explain the threshold, the stopway and the blast pad.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:var(--diagram-text-opacity,.85)}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:var(--diagram-fill-opacity,.6)}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:var(--diagram-fill-opacity,.6)}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:var(--diagram-fill-opacity,.6)}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:var(--diagram-fill-opacity,.6)}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:13px}.q1{font-size:12px}.q2{stroke:currentColor;stroke-width:1.5}.q3{font-size:15px}.q4{font-size:11.5px}.pv{fill:#3a3d42}.wh{fill:#fff}.ye{fill:#f5c518}.yl{stroke:#f5c518;fill:none;stroke-width:3}.wl{stroke:#fff;fill:none;stroke-width:3}.hb{font-weight:700}</style><text class="t q3" x="20" y="28">The runway end: threshold stripes and yellow chevrons</text><text class="s q1" x="20" y="50.0">White marks show where the runway starts for landing. Yellow chevrons beyond the end mark</text><text class="s q1" x="20" y="66.5">pavement that is not part of the runway: do not land, take off or taxi on it.</text><rect class="cl" x="20" y="88" width="690" height="226" rx="8"/><rect x="20" y="88" width="690" height="26" rx="10" class="sky q2"/><text class="t q0" x="30" y="106">One runway, seen from above</text><rect x="40" y="140" width="360" height="90" class="pv"/><rect x="400" y="140" width="110" height="90" class="pv" style="fill:#4d5157"/><rect x="515" y="140" width="0" height="0" class="pv"/><rect x="58" y="145" width="44" height="5" class="wh"/><rect x="58" y="154" width="44" height="5" class="wh"/><rect x="58" y="163" width="44" height="5" class="wh"/><rect x="58" y="172" width="44" height="5" class="wh"/><rect x="58" y="193" width="44" height="5" class="wh"/><rect x="58" y="202" width="44" height="5" class="wh"/><rect x="58" y="211" width="44" height="5" class="wh"/><rect x="58" y="220" width="44" height="5" class="wh"/><path d="M120 187L385 187" style="stroke:#fff;stroke-width:1.5;stroke-dasharray:9 7;fill:none"/><path d="M434 152L420 185L434 218" class="yl" style="stroke-width:4"/><path d="M464 152L450 185L464 218" class="yl" style="stroke-width:4"/><path d="M494 152L480 185L494 218" class="yl" style="stroke-width:4"/><path d="M24 187L48 187" class="acc"/><path d="M48 187L38.1 191.8L38.1 182.2Z" class="ah"/><text class="s q0 m" x="80" y="276">Threshold stripes</text><text class="s q4 m" x="80" y="292">(landing end)</text><text class="s q0 m" x="455" y="276">Yellow chevrons</text><text class="s q4 m" x="455" y="292">(stopway or blast pad)</text><path d="M40 238L400 238M455 238L455 238" style="stroke:currentColor;stroke-width:2;opacity:.5;fill:none"/><text class="s q1 m" x="250" y="258">Runway: the part you land on</text><text class="s q0" x="590" y="176">Not for landing,</text><text class="s q0" x="590" y="194">takeoff or taxiing</text><path d="M514 185L584 185" style="stroke:var(--palette-berry,#A84C6B);stroke-width:2.5;fill:none"/><path d="M40 238L400 238" style="stroke:currentColor;stroke-width:2;opacity:.5;fill:none"/><rect class="cl" x="20" y="330" width="222" height="180" rx="8"/><rect x="20" y="330" width="222" height="26" rx="10" class="mint q2"/><text class="t q0" x="30" y="348">Threshold</text><circle cx="30" cy="372" r="2.2" class="ah"/><text class="s q0" x="39" y="376.0">White stripes along the</text><text class="s q0" x="39" y="391.5">landing end of the runway.</text><circle cx="30" cy="412.0" r="2.2" class="ah"/><text class="s q0" x="39" y="416.0">They show where the runway</text><text class="s q0" x="39" y="431.5">begins for landing.</text><circle cx="30" cy="452.0" r="2.2" class="ah"/><text class="s q0" x="39" y="456.0">Wider runways get more</text><text class="s q0" x="39" y="471.5">stripes.</text><rect class="cl" x="254" y="330" width="222" height="180" rx="8"/><rect x="254" y="330" width="222" height="26" rx="10" class="lav q2"/><text class="t q0" x="264" y="348">Stopway</text><circle cx="264" cy="372" r="2.2" class="ah"/><text class="s q0" x="273" y="376.0">Pavement past the end, built</text><text class="s q0" x="273" y="391.5">to hold an airplane that</text><text class="s q0" x="273" y="407.0">stops after an aborted</text><text class="s q0" x="273" y="422.5">takeoff.</text><circle cx="264" cy="443.0" r="2.2" class="ah"/><text class="s q0" x="273" y="447.0">Marked with yellow</text><text class="s q0" x="273" y="462.5">chevrons.</text><rect class="cl" x="488" y="330" width="222" height="180" rx="8"/><rect x="488" y="330" width="222" height="26" rx="10" class="rose q2"/><text class="t q0" x="498" y="348">Blast pad</text><circle cx="498" cy="372" r="2.2" class="ah"/><text class="s q0" x="507" y="376.0">Pavement past the end that</text><text class="s q0" x="507" y="391.5">protects the ground from</text><text class="s q0" x="507" y="407.0">jet blast and propeller</text><text class="s q0" x="507" y="422.5">wash.</text><circle cx="498" cy="443.0" r="2.2" class="ah"/><text class="s q0" x="507" y="447.0">Also marked with yellow</text><text class="s q0" x="507" y="462.5">chevrons.</text><text class="s q1" x="20" y="544">Source: AIM 2-3-3, PHAK ch. 14</text></svg>