<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 538" role="img" aria-labelledby="ti de"><title id="ti">VFR flight plan</title><desc id="de">Three steps to file, open and close a VFR flight plan, a card on when an unopened plan is canceled, and cards on the form items that may need explaining.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><text class="t" x="20" y="28" style="font-size:15px">A VFR flight plan: file, open, close</text><text class="s" x="20" y="50.0" style="font-size:13px">Filing is not required by regulations, but it is good practice: the information can be used in search</text><text class="s" x="20" y="66.5" style="font-size:13px">and rescue in an emergency.</text><rect class="cl" x="20.0" y="91.0" width="215.33333333333334" height="101.0" rx="8"/><rect x="20.0" y="91.0" width="215.33333333333334" height="26" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30.0" y="109.0" style="font-size:13px">1 File</text><circle cx="33.0" cy="127.0" r="2.2" class="ah"/><text class="s" x="42.0" y="131.0" style="font-size:11.5px">Best by phone, just before</text><text class="s" x="42.0" y="146.0" style="font-size:11.5px">departing. In the air by radio</text><text class="s" x="42.0" y="161.0" style="font-size:11.5px">is possible too.</text><path d="M238.33 141.5L246.3 141.5" class="acc" style="stroke-width:2.5"/><path d="M254.33 141.5L246.3 145.1L246.3 137.9Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><rect class="cl" x="257.33333333333337" y="91.0" width="215.33333333333334" height="101.0" rx="8"/><rect x="257.33333333333337" y="91.0" width="215.33333333333334" height="26" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="267.33333333333337" y="109.0" style="font-size:13px">2 Open</text><circle cx="270.33333333333337" cy="127.0" r="2.2" class="ah"/><text class="s" x="279.33333333333337" y="131.0" style="font-size:11.5px">After takeoff, call the FSS by</text><text class="s" x="279.33333333333337" y="146.0" style="font-size:11.5px">radio and give the takeoff</text><text class="s" x="279.33333333333337" y="161.0" style="font-size:11.5px">time so the plan can be</text><text class="s" x="279.33333333333337" y="176.0" style="font-size:11.5px">activated.</text><path d="M475.67 141.5L483.7 141.5" class="acc" style="stroke-width:2.5"/><path d="M491.67 141.5L483.7 145.1L483.7 137.9Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><rect class="cl" x="494.6666666666667" y="91.0" width="215.33333333333334" height="101.0" rx="8"/><rect x="494.6666666666667" y="91.0" width="215.33333333333334" height="26" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="504.6666666666667" y="109.0" style="font-size:13px">3 Close</text><circle cx="507.6666666666667" cy="127.0" r="2.2" class="ah"/><text class="s" x="516.6666666666667" y="131.0" style="font-size:11.5px">On arrival, by telephone to</text><text class="s" x="516.6666666666667" y="146.0" style="font-size:11.5px">avoid radio congestion. Do not</text><text class="s" x="516.6666666666667" y="161.0" style="font-size:11.5px">forget.</text><rect class="cl" x="20" y="206.0" width="690" height="70" rx="8"/><rect x="20" y="206.0" width="690" height="26" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30" y="224.0" style="font-size:13px">If no departure time reaches the FSS</text><text class="s" x="30" y="252.0" style="font-size:11.5px">The plan is held until 1 hour after the proposed departure time, then canceled, unless the actual or a revised</text><text class="s" x="30" y="267.0" style="font-size:11.5px">departure time arrives, or you said at filing that the time is met but cannot be given.</text><text class="t" x="20" y="308.0" style="font-size:14px">Fields that may need explaining (Domestic flight plan form)</text><rect class="cl" x="20.0" y="318.0" width="220.66666666666666" height="86.0" rx="8"/><rect x="20.0" y="318.0" width="220.66666666666666" height="26" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30.0" y="336.0" style="font-size:13px">Item 3: aircraft</text><circle cx="33.0" cy="354.0" r="2.2" class="ah"/><text class="s" x="42.0" y="358.0" style="font-size:11.5px">Aircraft type and special</text><text class="s" x="42.0" y="373.0" style="font-size:11.5px">equipment, such as C-150/X for</text><text class="s" x="42.0" y="388.0" style="font-size:11.5px">no transponder.</text><rect class="cl" x="254.66666666666666" y="318.0" width="220.66666666666666" height="86.0" rx="8"/><rect x="254.66666666666666" y="318.0" width="220.66666666666666" height="26" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="264.66666666666663" y="336.0" style="font-size:13px">Item 6: departure</text><circle cx="267.66666666666663" cy="354.0" r="2.2" class="ah"/><text class="s" x="276.66666666666663" y="358.0" style="font-size:11.5px">Proposed departure time in UTC,</text><text class="s" x="276.66666666666663" y="373.0" style="font-size:11.5px">shown by the Z.</text><rect class="cl" x="489.3333333333333" y="318.0" width="220.66666666666666" height="86.0" rx="8"/><rect x="489.3333333333333" y="318.0" width="220.66666666666666" height="26" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="499.3333333333333" y="336.0" style="font-size:13px">Item 7: altitude</text><circle cx="502.3333333333333" cy="354.0" r="2.2" class="ah"/><text class="s" x="511.3333333333333" y="358.0" style="font-size:11.5px">Normally enter VFR, since you</text><text class="s" x="511.3333333333333" y="373.0" style="font-size:11.5px">choose an altitude that follows</text><text class="s" x="511.3333333333333" y="388.0" style="font-size:11.5px">FAA regulations.</text><rect class="cl" x="20.0" y="418.0" width="220.66666666666666" height="86.0" rx="8"/><rect x="20.0" y="418.0" width="220.66666666666666" height="26" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30.0" y="436.0" style="font-size:13px">Item 8: route</text><circle cx="33.0" cy="454.0" r="2.2" class="ah"/><text class="s" x="42.0" y="458.0" style="font-size:11.5px">Write direct, or the actual</text><text class="s" x="42.0" y="473.0" style="font-size:11.5px">route, such as via towns or</text><text class="s" x="42.0" y="488.0" style="font-size:11.5px">navigation aids.</text><rect class="cl" x="254.66666666666666" y="418.0" width="220.66666666666666" height="86.0" rx="8"/><rect x="254.66666666666666" y="418.0" width="220.66666666666666" height="26" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="264.66666666666663" y="436.0" style="font-size:13px">Item 10: time en route</text><circle cx="267.66666666666663" cy="454.0" r="2.2" class="ah"/><text class="s" x="276.66666666666663" y="458.0" style="font-size:11.5px">The PHAK sample added 5 minutes</text><text class="s" x="276.66666666666663" y="473.0" style="font-size:11.5px">for the climb.</text><rect class="cl" x="489.3333333333333" y="418.0" width="220.66666666666666" height="86.0" rx="8"/><rect x="489.3333333333333" y="418.0" width="220.66666666666666" height="26" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="499.3333333333333" y="436.0" style="font-size:13px">Item 12: fuel on board</text><circle cx="502.3333333333333" cy="454.0" r="2.2" class="ah"/><text class="s" x="511.3333333333333" y="458.0" style="font-size:11.5px">In hours and minutes: usable</text><text class="s" x="511.3333333333333" y="473.0" style="font-size:11.5px">fuel in gallons divided by the</text><text class="s" x="511.3333333333333" y="488.0" style="font-size:11.5px">rate of consumption.</text><text class="s" x="20" y="526.0" style="font-size:12px">Filing by phone or radio: give the information in the order of the numbered spaces.</text></svg>
