<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 538" role="img" aria-labelledby="ti de"><title id="ti">VFR flight plan</title><desc id="de">Three steps to file, open and close a VFR flight plan, a card on when an unopened plan is canceled, and cards on the form items that may need explaining.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11.5px}.q1{font-size:13px}.q2{stroke:currentColor;stroke-width:1.5}.q3{fill:var(--palette-berry,#A84C6B)}</style><text class="t" x="20" y="28" style="font-size:15px">A VFR flight plan: file, open, close</text><text class="s q1" x="20" y="50">Filing is not required by regulations, but it is good practice: the information can be used in search</text><text class="s q1" x="20" y="66.5">and rescue in an emergency.</text><rect class="cl" x="20" y="91" width="215.33" height="101" rx="8"/><rect x="20" y="91" width="215.33" height="26" rx="10" class="sky q2"/><text class="t q1" x="30" y="109">1 File</text><circle cx="33" cy="127" r="2.2" class="ah"/><text class="s q0" x="42" y="131">Best by phone, just before</text><text class="s q0" x="42" y="146">departing. In the air by radio</text><text class="s q0" x="42" y="161">is possible too.</text><path d="M238.33 141.5L246.3 141.5" class="acc" style="stroke-width:2.5"/><path d="M254.33 141.5L246.3 145.1L246.3 137.9Z" class="dh q3"/><rect class="cl" x="257.33" y="91" width="215.33" height="101" rx="8"/><rect x="257.33" y="91" width="215.33" height="26" rx="10" class="lav q2"/><text class="t q1" x="267.33" y="109">2 Open</text><circle cx="270.33" cy="127" r="2.2" class="ah"/><text class="s q0" x="279.33" y="131">After takeoff, call the FSS by</text><text class="s q0" x="279.33" y="146">radio and give the takeoff</text><text class="s q0" x="279.33" y="161">time so the plan can be</text><text class="s q0" x="279.33" y="176">activated.</text><path d="M475.67 141.5L483.7 141.5" class="acc" style="stroke-width:2.5"/><path d="M491.67 141.5L483.7 145.1L483.7 137.9Z" class="dh q3"/><rect class="cl" x="494.67" y="91" width="215.33" height="101" rx="8"/><rect x="494.67" y="91" width="215.33" height="26" rx="10" class="mint q2"/><text class="t q1" x="504.67" y="109">3 Close</text><circle cx="507.67" cy="127" r="2.2" class="ah"/><text class="s q0" x="516.67" y="131">On arrival, by telephone to</text><text class="s q0" x="516.67" y="146">avoid radio congestion. Do not</text><text class="s q0" x="516.67" y="161">forget.</text><rect class="cl" x="20" y="206" width="690" height="70" rx="8"/><rect x="20" y="206" width="690" height="26" rx="10" class="rose q2"/><text class="t q1" x="30" y="224">If no departure time reaches the FSS</text><text class="s q0" x="30" y="252">The plan is held until 1 hour after the proposed departure time, then canceled, unless the actual or a revised</text><text class="s q0" x="30" y="267">departure time arrives, or you said at filing that the time is met but cannot be given.</text><text class="t" x="20" y="308" style="font-size:14px">Fields that may need explaining (Domestic flight plan form)</text><rect class="cl" x="20" y="318" width="220.67" height="86" rx="8"/><rect x="20" y="318" width="220.67" height="26" rx="10" class="sky q2"/><text class="t q1" x="30" y="336">Item 3: aircraft</text><circle cx="33" cy="354" r="2.2" class="ah"/><text class="s q0" x="42" y="358">Aircraft type and special</text><text class="s q0" x="42" y="373">equipment, such as C-150/X for</text><text class="s q0" x="42" y="388">no transponder.</text><rect class="cl" x="254.67" y="318" width="220.67" height="86" rx="8"/><rect x="254.67" y="318" width="220.67" height="26" rx="10" class="lav q2"/><text class="t q1" x="264.67" y="336">Item 6: departure</text><circle cx="267.67" cy="354" r="2.2" class="ah"/><text class="s q0" x="276.67" y="358">Proposed departure time in UTC,</text><text class="s q0" x="276.67" y="373">shown by the Z.</text><rect class="cl" x="489.33" y="318" width="220.67" height="86" rx="8"/><rect x="489.33" y="318" width="220.67" height="26" rx="10" class="mint q2"/><text class="t q1" x="499.33" y="336">Item 7: altitude</text><circle cx="502.33" cy="354" r="2.2" class="ah"/><text class="s q0" x="511.33" y="358">Normally enter VFR, since you</text><text class="s q0" x="511.33" y="373">choose an altitude that follows</text><text class="s q0" x="511.33" y="388">FAA regulations.</text><rect class="cl" x="20" y="418" width="220.67" height="86" rx="8"/><rect x="20" y="418" width="220.67" height="26" rx="10" class="rose q2"/><text class="t q1" x="30" y="436">Item 8: route</text><circle cx="33" cy="454" r="2.2" class="ah"/><text class="s q0" x="42" y="458">Write direct, or the actual</text><text class="s q0" x="42" y="473">route, such as via towns or</text><text class="s q0" x="42" y="488">navigation aids.</text><rect class="cl" x="254.67" y="418" width="220.67" height="86" rx="8"/><rect x="254.67" y="418" width="220.67" height="26" rx="10" class="sky q2"/><text class="t q1" x="264.67" y="436">Item 10: time en route</text><circle cx="267.67" cy="454" r="2.2" class="ah"/><text class="s q0" x="276.67" y="458">The PHAK sample added 5 minutes</text><text class="s q0" x="276.67" y="473">for the climb.</text><rect class="cl" x="489.33" y="418" width="220.67" height="86" rx="8"/><rect x="489.33" y="418" width="220.67" height="26" rx="10" class="lav q2"/><text class="t q1" x="499.33" y="436">Item 12: fuel on board</text><circle cx="502.33" cy="454" r="2.2" class="ah"/><text class="s q0" x="511.33" y="458">In hours and minutes: usable</text><text class="s q0" x="511.33" y="473">fuel in gallons divided by the</text><text class="s q0" x="511.33" y="488">rate of consumption.</text><text class="s" x="20" y="526" style="font-size:12px">Filing by phone or radio: give the information in the order of the numbered spaces.</text></svg>
