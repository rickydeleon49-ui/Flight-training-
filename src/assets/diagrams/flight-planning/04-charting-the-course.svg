<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 551" role="img" aria-labelledby="ti de"><title id="ti">Charting the course</title><desc id="de">Six numbered steps for charting a course, the heading chain from true course to compass heading with the PHAK example numbers, and the result of altitude, distance, time and fuel.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11.5px}.q1{stroke:currentColor;stroke-width:1.5}.q2{font-size:13px}.q3{stroke-width:2.2}.q4{fill:var(--palette-berry,#A84C6B)}</style><text class="t" x="20" y="28" style="font-size:15px">Charting the course, step by step</text><text class="s q2" x="20" y="50">PHAK plans a trip from Chickasha Airport direct to Guthrie Airport: TAS 115 knots, winds aloft 360 at</text><text class="s q2" x="20" y="66.5">10 knots, 38 gallons usable, 8 GPH, deviation +2.</text><rect class="cl" x="20" y="91" width="220.67" height="116" rx="8"/><rect x="20" y="91" width="220.67" height="26" rx="10" class="sky q1"/><text class="t q2" x="30" y="109">1  Draw the course</text><circle cx="33" cy="127" r="2.2" class="ah"/><text class="s q0" x="42" y="131">Center of the departure airport</text><text class="s q0" x="42" y="146">to the center of the</text><text class="s q0" x="42" y="161">destination. Not direct: two or</text><text class="s q0" x="42" y="176">more straight segments, perhaps</text><text class="s q0" x="42" y="191">via a VOR.</text><rect class="cl" x="254.67" y="91" width="220.67" height="116" rx="8"/><rect x="254.67" y="91" width="220.67" height="26" rx="10" class="lav q1"/><text class="t q2" x="264.67" y="109">2  Pick checkpoints</text><circle cx="267.67" cy="127" r="2.2" class="ah"/><text class="s q0" x="276.67" y="131">Easy to find: large towns,</text><text class="s q0" x="276.67" y="146">lakes, rivers, towns with an</text><text class="s q0" x="276.67" y="161">airport, highways and</text><text class="s q0" x="276.67" y="176">railroads. Choose towns shown</text><text class="s q0" x="276.67" y="191">in yellow, not tiny circles.</text><rect class="cl" x="489.33" y="91" width="220.67" height="116" rx="8"/><rect x="489.33" y="91" width="220.67" height="26" rx="10" class="mint q1"/><text class="t q2" x="499.33" y="109">3  Check airspace</text><circle cx="502.33" cy="127" r="2.2" class="ah"/><text class="s q0" x="511.33" y="131">Look on both sides of the route</text><text class="s q0" x="511.33" y="146">for special operating</text><text class="s q0" x="511.33" y="161">requirements.</text><rect class="cl" x="20" y="221" width="220.67" height="116" rx="8"/><rect x="20" y="221" width="220.67" height="26" rx="10" class="rose q1"/><text class="t q2" x="30" y="239">4  Study terrain</text><circle cx="33" cy="257" r="2.2" class="ah"/><text class="s q0" x="42" y="261">Find the highest and lowest</text><text class="s q0" x="42" y="276">elevations and the tallest</text><text class="s q0" x="42" y="291">obstruction, then choose an</text><text class="s q0" x="42" y="306">altitude that follows part 91.</text><rect class="cl" x="254.67" y="221" width="220.67" height="116" rx="8"/><rect x="254.67" y="221" width="220.67" height="26" rx="10" class="sky q1"/><text class="t q2" x="264.67" y="239">5  Measure distance</text><circle cx="267.67" cy="257" r="2.2" class="ah"/><text class="s q0" x="276.67" y="261">Total distance, and the</text><text class="s q0" x="276.67" y="276">distance between checkpoints.</text><rect class="cl" x="489.33" y="221" width="220.67" height="116" rx="8"/><rect x="489.33" y="221" width="220.67" height="26" rx="10" class="lav q1"/><text class="t q2" x="499.33" y="239">6  Measure TC</text><circle cx="502.33" cy="257" r="2.2" class="ah"/><text class="s q0" x="511.33" y="261">Then work out heading and time.</text><text class="t" x="20" y="357" style="font-size:14px">The heading chain, with the PHAK numbers</text><rect x="20" y="367" width="80" height="32" rx="10" class="sky q1"/><text class="t m q0" x="60" y="387">TC 031</text><path d="M103 383L124 383" class="acc q3"/><path d="M131 383L124 386.1L124 379.9Z" class="dh q4"/><rect x="134" y="367" width="150" height="32" rx="10" class="lav q1"/><text class="t m q0" x="209" y="387">WCA 3 left: TH 028</text><path d="M287 383L308 383" class="acc q3"/><path d="M315 383L308 386.1L308 379.9Z" class="dh q4"/><rect x="318" y="367" width="150" height="32" rx="10" class="mint q1"/><text class="t m q0" x="393" y="387">Variation 7 E: MH 021</text><path d="M471 383L492 383" class="acc q3"/><path d="M499 383L492 386.1L492 379.9Z" class="dh q4"/><rect x="502" y="367" width="150" height="32" rx="10" class="rose q1"/><text class="t m q0" x="577" y="387">Deviation +2: CH 023</text><rect class="cl" x="20" y="413" width="338" height="122" rx="8"/><rect x="20" y="413" width="338" height="26" rx="10" class="mint q1"/><text class="t q2" x="30" y="431">Altitude</text><circle cx="33" cy="449" r="2.2" class="ah"/><text class="s q0" x="42" y="453">5,500 feet MSL clears the Class C and D airspace</text><text class="s q0" x="42" y="468">and all obstructions.</text><circle cx="33" cy="482" r="2.2" class="ah"/><text class="s q0" x="42" y="486">It follows the odd thousand plus 500 feet rule for</text><text class="s q0" x="42" y="501">a magnetic course of 0 to 179.</text><rect class="cl" x="372" y="413" width="338" height="122" rx="8"/><rect x="372" y="413" width="338" height="26" rx="10" class="rose q1"/><text class="t q2" x="382" y="431">The result</text><circle cx="385" cy="449" r="2.2" class="ah"/><text class="s q0" x="394" y="453">Total distance 53 NM; GS 106 knots.</text><circle cx="385" cy="467" r="2.2" class="ah"/><text class="s q0" x="394" y="471">Time 35 minutes (30 plus 5 for climb); fuel burn</text><text class="s q0" x="394" y="486">4.7 gallons.</text><circle cx="385" cy="500" r="2.2" class="ah"/><text class="s q0" x="394" y="504">Note headings and time in flight and adjust</text><text class="s q0" x="394" y="519">heading, GS and time.</text></svg>
