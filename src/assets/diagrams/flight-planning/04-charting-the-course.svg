<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 551" role="img" aria-labelledby="ti de"><title id="ti">Charting the course</title><desc id="de">Six numbered steps for charting a course, the heading chain from true course to compass heading with the PHAK example numbers, and the result of altitude, distance, time and fuel.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><text class="t" x="20" y="28" style="font-size:15px">Charting the course, step by step</text><text class="s" x="20" y="50.0" style="font-size:13px">PHAK plans a trip from Chickasha Airport direct to Guthrie Airport: TAS 115 knots, winds aloft 360 at</text><text class="s" x="20" y="66.5" style="font-size:13px">10 knots, 38 gallons usable, 8 GPH, deviation +2.</text><rect class="cl" x="20.0" y="91.0" width="220.66666666666666" height="116.0" rx="8"/><rect x="20.0" y="91.0" width="220.66666666666666" height="26" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30.0" y="109.0" style="font-size:13px">1  Draw the course</text><circle cx="33.0" cy="127.0" r="2.2" class="ah"/><text class="s" x="42.0" y="131.0" style="font-size:11.5px">Center of the departure airport</text><text class="s" x="42.0" y="146.0" style="font-size:11.5px">to the center of the</text><text class="s" x="42.0" y="161.0" style="font-size:11.5px">destination. Not direct: two or</text><text class="s" x="42.0" y="176.0" style="font-size:11.5px">more straight segments, perhaps</text><text class="s" x="42.0" y="191.0" style="font-size:11.5px">via a VOR.</text><rect class="cl" x="254.66666666666666" y="91.0" width="220.66666666666666" height="116.0" rx="8"/><rect x="254.66666666666666" y="91.0" width="220.66666666666666" height="26" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="264.66666666666663" y="109.0" style="font-size:13px">2  Pick checkpoints</text><circle cx="267.66666666666663" cy="127.0" r="2.2" class="ah"/><text class="s" x="276.66666666666663" y="131.0" style="font-size:11.5px">Easy to find: large towns,</text><text class="s" x="276.66666666666663" y="146.0" style="font-size:11.5px">lakes, rivers, towns with an</text><text class="s" x="276.66666666666663" y="161.0" style="font-size:11.5px">airport, highways and</text><text class="s" x="276.66666666666663" y="176.0" style="font-size:11.5px">railroads. Choose towns shown</text><text class="s" x="276.66666666666663" y="191.0" style="font-size:11.5px">in yellow, not tiny circles.</text><rect class="cl" x="489.3333333333333" y="91.0" width="220.66666666666666" height="116.0" rx="8"/><rect x="489.3333333333333" y="91.0" width="220.66666666666666" height="26" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="499.3333333333333" y="109.0" style="font-size:13px">3  Check airspace</text><circle cx="502.3333333333333" cy="127.0" r="2.2" class="ah"/><text class="s" x="511.3333333333333" y="131.0" style="font-size:11.5px">Look on both sides of the route</text><text class="s" x="511.3333333333333" y="146.0" style="font-size:11.5px">for special operating</text><text class="s" x="511.3333333333333" y="161.0" style="font-size:11.5px">requirements.</text><rect class="cl" x="20.0" y="221.0" width="220.66666666666666" height="116.0" rx="8"/><rect x="20.0" y="221.0" width="220.66666666666666" height="26" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30.0" y="239.0" style="font-size:13px">4  Study terrain</text><circle cx="33.0" cy="257.0" r="2.2" class="ah"/><text class="s" x="42.0" y="261.0" style="font-size:11.5px">Find the highest and lowest</text><text class="s" x="42.0" y="276.0" style="font-size:11.5px">elevations and the tallest</text><text class="s" x="42.0" y="291.0" style="font-size:11.5px">obstruction, then choose an</text><text class="s" x="42.0" y="306.0" style="font-size:11.5px">altitude that follows part 91.</text><rect class="cl" x="254.66666666666666" y="221.0" width="220.66666666666666" height="116.0" rx="8"/><rect x="254.66666666666666" y="221.0" width="220.66666666666666" height="26" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="264.66666666666663" y="239.0" style="font-size:13px">5  Measure distance</text><circle cx="267.66666666666663" cy="257.0" r="2.2" class="ah"/><text class="s" x="276.66666666666663" y="261.0" style="font-size:11.5px">Total distance, and the</text><text class="s" x="276.66666666666663" y="276.0" style="font-size:11.5px">distance between checkpoints.</text><rect class="cl" x="489.3333333333333" y="221.0" width="220.66666666666666" height="116.0" rx="8"/><rect x="489.3333333333333" y="221.0" width="220.66666666666666" height="26" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="499.3333333333333" y="239.0" style="font-size:13px">6  Measure TC</text><circle cx="502.3333333333333" cy="257.0" r="2.2" class="ah"/><text class="s" x="511.3333333333333" y="261.0" style="font-size:11.5px">Then work out heading and time.</text><text class="t" x="20" y="357.0" style="font-size:14px">The heading chain, with the PHAK numbers</text><rect x="20" y="367.0" width="80" height="32" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="60.0" y="387.0" style="font-size:11.5px">TC 031</text><path d="M103 383.0L124.0 383.0" class="acc" style="stroke-width:2.2"/><path d="M131 383.0L124.0 386.1L124.0 379.9Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><rect x="134" y="367.0" width="150" height="32" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="209.0" y="387.0" style="font-size:11.5px">WCA 3 left: TH 028</text><path d="M287 383.0L308.0 383.0" class="acc" style="stroke-width:2.2"/><path d="M315 383.0L308.0 386.1L308.0 379.9Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><rect x="318" y="367.0" width="150" height="32" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="393.0" y="387.0" style="font-size:11.5px">Variation 7 E: MH 021</text><path d="M471 383.0L492.0 383.0" class="acc" style="stroke-width:2.2"/><path d="M499 383.0L492.0 386.1L492.0 379.9Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><rect x="502" y="367.0" width="150" height="32" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="577.0" y="387.0" style="font-size:11.5px">Deviation +2: CH 023</text><rect class="cl" x="20.0" y="413.0" width="338.0" height="122.0" rx="8"/><rect x="20.0" y="413.0" width="338.0" height="26" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30.0" y="431.0" style="font-size:13px">Altitude</text><circle cx="33.0" cy="449.0" r="2.2" class="ah"/><text class="s" x="42.0" y="453.0" style="font-size:11.5px">5,500 feet MSL clears the Class C and D airspace</text><text class="s" x="42.0" y="468.0" style="font-size:11.5px">and all obstructions.</text><circle cx="33.0" cy="482.0" r="2.2" class="ah"/><text class="s" x="42.0" y="486.0" style="font-size:11.5px">It follows the odd thousand plus 500 feet rule for</text><text class="s" x="42.0" y="501.0" style="font-size:11.5px">a magnetic course of 0 to 179.</text><rect class="cl" x="372.0" y="413.0" width="338.0" height="122.0" rx="8"/><rect x="372.0" y="413.0" width="338.0" height="26" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="382.0" y="431.0" style="font-size:13px">The result</text><circle cx="385.0" cy="449.0" r="2.2" class="ah"/><text class="s" x="394.0" y="453.0" style="font-size:11.5px">Total distance 53 NM; GS 106 knots.</text><circle cx="385.0" cy="467.0" r="2.2" class="ah"/><text class="s" x="394.0" y="471.0" style="font-size:11.5px">Time 35 minutes (30 plus 5 for climb); fuel burn</text><text class="s" x="394.0" y="486.0" style="font-size:11.5px">4.7 gallons.</text><circle cx="385.0" cy="500.0" r="2.2" class="ah"/><text class="s" x="394.0" y="504.0" style="font-size:11.5px">Note headings and time in flight and adjust</text><text class="s" x="394.0" y="519.0" style="font-size:11.5px">heading, GS and time.</text></svg>
