<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 441" role="img" aria-labelledby="ti de"><title id="ti">Using the Chart Supplement U.S.</title><desc id="de">A numbered list of what the Chart Supplement U.S. gives for an airport, then cards on NOTAMs, the sectional chart bulletin and which source wins.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><text class="t" x="20" y="28" style="font-size:15px">Know your destination: the Chart Supplement U.S.</text><text class="s" x="20" y="50.0" style="font-size:13px">Study each airport where you intend to land. Use the Chart Supplement U.S. (formerly Airport/Facility</text><text class="s" x="20" y="66.5" style="font-size:13px">Directory) together with NOTAMs.</text><rect class="cl" x="20" y="91.0" width="690" height="186" rx="8"/><rect x="20" y="91.0" width="690" height="26" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30" y="109.0" style="font-size:13px">What the Chart Supplement U.S. tells you about an airport</text><circle cx="34" cy="139.0" r="10" class="ah"/><text class="t m" x="34" y="142.66666666666666" style="font-size:11px;fill:#fff">1</text><text class="s" x="52" y="143.0" style="font-size:12px">Location and elevation</text><circle cx="34" cy="177.0" r="10" class="ah"/><text class="t m" x="34" y="180.66666666666666" style="font-size:11px;fill:#fff">2</text><text class="s" x="52" y="181.0" style="font-size:12px">Runway and lighting facilities</text><circle cx="34" cy="215.0" r="10" class="ah"/><text class="t m" x="34" y="218.66666666666666" style="font-size:11px;fill:#fff">3</text><text class="s" x="52" y="219.0" style="font-size:12px">Available services</text><circle cx="34" cy="253.0" r="10" class="ah"/><text class="t m" x="34" y="256.6666666666667" style="font-size:11px;fill:#fff">4</text><text class="s" x="52" y="257.0" style="font-size:12px">UNICOM frequency, if there is an aeronautical</text><text class="s" x="52" y="271.0" style="font-size:12px">advisory station</text><circle cx="379" cy="139.0" r="10" class="ah"/><text class="t m" x="379" y="142.66666666666666" style="font-size:11px;fill:#fff">5</text><text class="s" x="397" y="143.0" style="font-size:12px">Types of fuel available, to decide on</text><text class="s" x="397" y="157.0" style="font-size:12px">refueling stops</text><circle cx="379" cy="177.0" r="10" class="ah"/><text class="t m" x="379" y="180.66666666666666" style="font-size:11px;fill:#fff">6</text><text class="s" x="397" y="181.0" style="font-size:12px">FSS on the airport</text><circle cx="379" cy="215.0" r="10" class="ah"/><text class="t m" x="379" y="218.66666666666666" style="font-size:11px;fill:#fff">7</text><text class="s" x="397" y="219.0" style="font-size:12px">Control tower and ground control frequencies</text><circle cx="379" cy="253.0" r="10" class="ah"/><text class="t m" x="379" y="256.6666666666667" style="font-size:11px;fill:#fff">8</text><text class="s" x="397" y="257.0" style="font-size:12px">Traffic information and remarks</text><rect class="cl" x="20.0" y="291.0" width="220.66666666666666" height="134.0" rx="8"/><rect x="20.0" y="291.0" width="220.66666666666666" height="26" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30.0" y="309.0" style="font-size:13px">NOTAMs</text><circle cx="33.0" cy="327.0" r="2.2" class="ah"/><text class="s" x="42.0" y="331.0" style="font-size:11.5px">Issued every 28 days.</text><circle cx="33.0" cy="345.0" r="2.2" class="ah"/><text class="s" x="42.0" y="349.0" style="font-size:11.5px">Check them for hazardous</text><text class="s" x="42.0" y="364.0" style="font-size:11.5px">conditions, or changes made</text><text class="s" x="42.0" y="379.0" style="font-size:11.5px">since the Chart Supplement U.S.</text><text class="s" x="42.0" y="394.0" style="font-size:11.5px">was issued.</text><rect class="cl" x="254.66666666666666" y="291.0" width="220.66666666666666" height="134.0" rx="8"/><rect x="254.66666666666666" y="291.0" width="220.66666666666666" height="26" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="264.66666666666663" y="309.0" style="font-size:13px">Sectional chart bulletin</text><circle cx="267.66666666666663" cy="327.0" r="2.2" class="ah"/><text class="s" x="276.66666666666663" y="331.0" style="font-size:11.5px">Check the bulletin subsection</text><text class="s" x="276.66666666666663" y="346.0" style="font-size:11.5px">for major changes since the</text><text class="s" x="276.66666666666663" y="361.0" style="font-size:11.5px">chart was published.</text><circle cx="267.66666666666663" cy="375.0" r="2.2" class="ah"/><text class="s" x="276.66666666666663" y="379.0" style="font-size:11.5px">The chart may be up to 6 months</text><text class="s" x="276.66666666666663" y="394.0" style="font-size:11.5px">old; its effective date is at</text><text class="s" x="276.66666666666663" y="409.0" style="font-size:11.5px">the top of the front.</text><rect class="cl" x="489.3333333333333" y="291.0" width="220.66666666666666" height="134.0" rx="8"/><rect x="489.3333333333333" y="291.0" width="220.66666666666666" height="26" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="499.3333333333333" y="309.0" style="font-size:13px">If they differ</text><circle cx="502.3333333333333" cy="327.0" r="2.2" class="ah"/><text class="s" x="511.3333333333333" y="331.0" style="font-size:11.5px">The Chart Supplement U.S.</text><text class="s" x="511.3333333333333" y="346.0" style="font-size:11.5px">generally has the latest</text><text class="s" x="511.3333333333333" y="361.0" style="font-size:11.5px">information.</text><circle cx="502.3333333333333" cy="375.0" r="2.2" class="ah"/><text class="s" x="511.3333333333333" y="379.0" style="font-size:11.5px">Use it in preference to the</text><text class="s" x="511.3333333333333" y="394.0" style="font-size:11.5px">information on the back of the</text><text class="s" x="511.3333333333333" y="409.0" style="font-size:11.5px">chart.</text></svg>
