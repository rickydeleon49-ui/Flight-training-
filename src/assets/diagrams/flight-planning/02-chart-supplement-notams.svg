<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 441" role="img" aria-labelledby="ti de"><title id="ti">Using the Chart Supplement U.S.</title><desc id="de">A numbered list of what the Chart Supplement U.S. gives for an airport, then cards on NOTAMs, the sectional chart bulletin and which source wins.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11.5px}.q1{font-size:12px}.q2{font-size:11px;fill:#fff}.q3{font-size:13px}.q4{stroke:currentColor;stroke-width:1.5}</style><text class="t" x="20" y="28" style="font-size:15px">Know your destination: the Chart Supplement U.S.</text><text class="s q3" x="20" y="50">Study each airport where you intend to land. Use the Chart Supplement U.S. (formerly Airport/Facility</text><text class="s q3" x="20" y="66.5">Directory) together with NOTAMs.</text><rect class="cl" x="20" y="91" width="690" height="186" rx="8"/><rect x="20" y="91" width="690" height="26" rx="10" class="sky q4"/><text class="t q3" x="30" y="109">What the Chart Supplement U.S. tells you about an airport</text><circle cx="34" cy="139" r="10" class="ah"/><text class="t m q2" x="34" y="142.67">1</text><text class="s q1" x="52" y="143">Location and elevation</text><circle cx="34" cy="177" r="10" class="ah"/><text class="t m q2" x="34" y="180.67">2</text><text class="s q1" x="52" y="181">Runway and lighting facilities</text><circle cx="34" cy="215" r="10" class="ah"/><text class="t m q2" x="34" y="218.67">3</text><text class="s q1" x="52" y="219">Available services</text><circle cx="34" cy="253" r="10" class="ah"/><text class="t m q2" x="34" y="256.67">4</text><text class="s q1" x="52" y="257">UNICOM frequency, if there is an aeronautical</text><text class="s q1" x="52" y="271">advisory station</text><circle cx="379" cy="139" r="10" class="ah"/><text class="t m q2" x="379" y="142.67">5</text><text class="s q1" x="397" y="143">Types of fuel available, to decide on</text><text class="s q1" x="397" y="157">refueling stops</text><circle cx="379" cy="177" r="10" class="ah"/><text class="t m q2" x="379" y="180.67">6</text><text class="s q1" x="397" y="181">FSS on the airport</text><circle cx="379" cy="215" r="10" class="ah"/><text class="t m q2" x="379" y="218.67">7</text><text class="s q1" x="397" y="219">Control tower and ground control frequencies</text><circle cx="379" cy="253" r="10" class="ah"/><text class="t m q2" x="379" y="256.67">8</text><text class="s q1" x="397" y="257">Traffic information and remarks</text><rect class="cl" x="20" y="291" width="220.67" height="134" rx="8"/><rect x="20" y="291" width="220.67" height="26" rx="10" class="rose q4"/><text class="t q3" x="30" y="309">NOTAMs</text><circle cx="33" cy="327" r="2.2" class="ah"/><text class="s q0" x="42" y="331">Issued every 28 days.</text><circle cx="33" cy="345" r="2.2" class="ah"/><text class="s q0" x="42" y="349">Check them for hazardous</text><text class="s q0" x="42" y="364">conditions, or changes made</text><text class="s q0" x="42" y="379">since the Chart Supplement U.S.</text><text class="s q0" x="42" y="394">was issued.</text><rect class="cl" x="254.67" y="291" width="220.67" height="134" rx="8"/><rect x="254.67" y="291" width="220.67" height="26" rx="10" class="lav q4"/><text class="t q3" x="264.67" y="309">Sectional chart bulletin</text><circle cx="267.67" cy="327" r="2.2" class="ah"/><text class="s q0" x="276.67" y="331">Check the bulletin subsection</text><text class="s q0" x="276.67" y="346">for major changes since the</text><text class="s q0" x="276.67" y="361">chart was published.</text><circle cx="267.67" cy="375" r="2.2" class="ah"/><text class="s q0" x="276.67" y="379">The chart may be up to 6 months</text><text class="s q0" x="276.67" y="394">old; its effective date is at</text><text class="s q0" x="276.67" y="409">the top of the front.</text><rect class="cl" x="489.33" y="291" width="220.67" height="134" rx="8"/><rect x="489.33" y="291" width="220.67" height="26" rx="10" class="mint q4"/><text class="t q3" x="499.33" y="309">If they differ</text><circle cx="502.33" cy="327" r="2.2" class="ah"/><text class="s q0" x="511.33" y="331">The Chart Supplement U.S.</text><text class="s q0" x="511.33" y="346">generally has the latest</text><text class="s q0" x="511.33" y="361">information.</text><circle cx="502.33" cy="375" r="2.2" class="ah"/><text class="s q0" x="511.33" y="379">Use it in preference to the</text><text class="s q0" x="511.33" y="394">information on the back of the</text><text class="s q0" x="511.33" y="409">chart.</text></svg>
