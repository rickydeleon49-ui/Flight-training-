<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 485" role="img" aria-labelledby="ti de"><title id="ti">Fuel planning</title><desc id="de">A worked fuel example of 400 nautical miles at 100 knots needing 20 gallons, then cards on ground speed, climb and taxi, reserve, burn rate and when to be on the ground.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><text class="t" x="20" y="28" style="font-size:15px">Fuel planning: how much do you need?</text><text class="s" x="20" y="50.0" style="font-size:13px">Work out the fuel the flight needs, then make sure that amount plus an adequate reserve is on board.</text><rect class="cl" x="20" y="74.5" width="690" height="96" rx="8"/><text class="t" x="32" y="96.5" style="font-size:13px">Fuel = flight time x rate of consumption (the PHAK example, no wind)</text><rect x="32" y="114.5" width="170" height="34" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="117.0" y="136.5" style="font-size:12px">400 NM at 100 kt GS</text><path d="M205 131.5L215.0 131.5" class="acc" style="stroke-width:2.2"/><path d="M222 131.5L215.0 134.7L215.0 128.3Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><rect x="225" y="114.5" width="90" height="34" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="270.0" y="136.5" style="font-size:12px">4 hours</text><path d="M318 131.5L328.0 131.5" class="acc" style="stroke-width:2.2"/><path d="M335 131.5L328.0 134.7L328.0 128.3Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><rect x="338" y="114.5" width="140" height="34" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="408.0" y="136.5" style="font-size:12px">x 5 gal per hour</text><path d="M481 131.5L491.0 131.5" class="acc" style="stroke-width:2.2"/><path d="M498 131.5L491.0 134.7L491.0 128.3Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><rect x="501" y="114.5" width="110" height="34" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="556.0" y="136.5" style="font-size:12px">20 gallons</text><rect class="cl" x="20.0" y="184.5" width="220.66666666666666" height="134.0" rx="8"/><rect x="20.0" y="184.5" width="220.66666666666666" height="26" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30.0" y="202.5" style="font-size:13px">Use ground speed</text><circle cx="33.0" cy="220.5" r="2.2" class="ah"/><text class="s" x="42.0" y="224.5" style="font-size:11.5px">GS sets how long the flight</text><text class="s" x="42.0" y="239.5" style="font-size:11.5px">takes.</text><circle cx="33.0" cy="253.5" r="2.2" class="ah"/><text class="s" x="42.0" y="257.5" style="font-size:11.5px">Fuel burn stays about the same</text><text class="s" x="42.0" y="272.5" style="font-size:11.5px">at a given TAS, so with wind</text><text class="s" x="42.0" y="287.5" style="font-size:11.5px">use GS to work out the fuel.</text><rect class="cl" x="254.66666666666666" y="184.5" width="220.66666666666666" height="134.0" rx="8"/><rect x="254.66666666666666" y="184.5" width="220.66666666666666" height="26" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="264.66666666666663" y="202.5" style="font-size:13px">Plan for all of it</text><circle cx="267.66666666666663" cy="220.5" r="2.2" class="ah"/><text class="s" x="276.66666666666663" y="224.5" style="font-size:11.5px">Startup and taxi, cruise, and</text><text class="s" x="276.66666666666663" y="239.5" style="font-size:11.5px">the higher fuel burn during</text><text class="s" x="276.66666666666663" y="254.5" style="font-size:11.5px">climb.</text><circle cx="267.66666666666663" cy="268.5" r="2.2" class="ah"/><text class="s" x="276.66666666666663" y="272.5" style="font-size:11.5px">Ground speed during climb is</text><text class="s" x="276.66666666666663" y="287.5" style="font-size:11.5px">less than in cruise at the same</text><text class="s" x="276.66666666666663" y="302.5" style="font-size:11.5px">airspeed.</text><rect class="cl" x="489.3333333333333" y="184.5" width="220.66666666666666" height="134.0" rx="8"/><rect x="489.3333333333333" y="184.5" width="220.66666666666666" height="26" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="499.3333333333333" y="202.5" style="font-size:13px">Add a reserve</text><circle cx="502.3333333333333" cy="220.5" r="2.2" class="ah"/><text class="s" x="511.3333333333333" y="224.5" style="font-size:11.5px">Plan for fuel to spare on top</text><text class="s" x="511.3333333333333" y="239.5" style="font-size:11.5px">of what the trip needs.</text><circle cx="502.3333333333333" cy="253.5" r="2.2" class="ah"/><text class="s" x="511.3333333333333" y="257.5" style="font-size:11.5px">Extra fuel for adequate reserve</text><text class="s" x="511.3333333333333" y="272.5" style="font-size:11.5px">is a safety measure.</text><rect class="cl" x="20.0" y="332.5" width="338.0" height="137.0" rx="8"/><rect x="20.0" y="332.5" width="338.0" height="26" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30.0" y="350.5" style="font-size:13px">Find your burn rate</text><circle cx="33.0" cy="368.5" r="2.2" class="ah"/><text class="s" x="42.0" y="372.5" style="font-size:11.5px">Reciprocating engines: the AFM/POH gives gallons</text><text class="s" x="42.0" y="387.5" style="font-size:11.5px">per hour.</text><circle cx="33.0" cy="401.5" r="2.2" class="ah"/><text class="s" x="42.0" y="405.5" style="font-size:11.5px">Rate depends on engine condition, propeller pitch</text><text class="s" x="42.0" y="420.5" style="font-size:11.5px">and rpm, mixture and percent of power.</text><circle cx="33.0" cy="434.5" r="2.2" class="ah"/><text class="s" x="42.0" y="438.5" style="font-size:11.5px">Know it from the cruise performance charts or from</text><text class="s" x="42.0" y="453.5" style="font-size:11.5px">experience.</text><rect class="cl" x="372.0" y="332.5" width="338.0" height="137.0" rx="8"/><rect x="372.0" y="332.5" width="338.0" height="26" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="382.0" y="350.5" style="font-size:13px">Be on the ground before</text><circle cx="385.0" cy="368.5" r="2.2" class="ah"/><text class="s" x="394.0" y="372.5" style="font-size:11.5px">Your flight time exceeds the time you calculated</text><text class="s" x="394.0" y="387.5" style="font-size:11.5px">for your preflight fuel.</text><circle cx="385.0" cy="401.5" r="2.2" class="ah"/><text class="s" x="394.0" y="405.5" style="font-size:11.5px">Your fuel gauge indicates low fuel.</text></svg>
