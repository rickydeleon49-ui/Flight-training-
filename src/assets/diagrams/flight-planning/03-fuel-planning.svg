<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 485" role="img" aria-labelledby="ti de"><title id="ti">Fuel planning</title><desc id="de">A worked fuel example of 400 nautical miles at 100 knots needing 20 gallons, then cards on ground speed, climb and taxi, reserve, burn rate and when to be on the ground.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11.5px}.q1{stroke:currentColor;stroke-width:1.5}.q2{font-size:13px}.q3{font-size:12px}.q4{stroke-width:2.2}.q5{fill:var(--palette-berry,#A84C6B)}</style><text class="t" x="20" y="28" style="font-size:15px">Fuel planning: how much do you need?</text><text class="s q2" x="20" y="50">Work out the fuel the flight needs, then make sure that amount plus an adequate reserve is on board.</text><rect class="cl" x="20" y="74.5" width="690" height="96" rx="8"/><text class="t q2" x="32" y="96.5">Fuel = flight time x rate of consumption (the PHAK example, no wind)</text><rect x="32" y="114.5" width="170" height="34" rx="10" class="sky q1"/><text class="t m q3" x="117" y="136.5">400 NM at 100 kt GS</text><path d="M205 131.5L215 131.5" class="acc q4"/><path d="M222 131.5L215 134.7L215 128.3Z" class="dh q5"/><rect x="225" y="114.5" width="90" height="34" rx="10" class="lav q1"/><text class="t m q3" x="270" y="136.5">4 hours</text><path d="M318 131.5L328 131.5" class="acc q4"/><path d="M335 131.5L328 134.7L328 128.3Z" class="dh q5"/><rect x="338" y="114.5" width="140" height="34" rx="10" class="mint q1"/><text class="t m q3" x="408" y="136.5">x 5 gal per hour</text><path d="M481 131.5L491 131.5" class="acc q4"/><path d="M498 131.5L491 134.7L491 128.3Z" class="dh q5"/><rect x="501" y="114.5" width="110" height="34" rx="10" class="rose q1"/><text class="t m q3" x="556" y="136.5">20 gallons</text><rect class="cl" x="20" y="184.5" width="220.67" height="134" rx="8"/><rect x="20" y="184.5" width="220.67" height="26" rx="10" class="sky q1"/><text class="t q2" x="30" y="202.5">Use ground speed</text><circle cx="33" cy="220.5" r="2.2" class="ah"/><text class="s q0" x="42" y="224.5">GS sets how long the flight</text><text class="s q0" x="42" y="239.5">takes.</text><circle cx="33" cy="253.5" r="2.2" class="ah"/><text class="s q0" x="42" y="257.5">Fuel burn stays about the same</text><text class="s q0" x="42" y="272.5">at a given TAS, so with wind</text><text class="s q0" x="42" y="287.5">use GS to work out the fuel.</text><rect class="cl" x="254.67" y="184.5" width="220.67" height="134" rx="8"/><rect x="254.67" y="184.5" width="220.67" height="26" rx="10" class="lav q1"/><text class="t q2" x="264.67" y="202.5">Plan for all of it</text><circle cx="267.67" cy="220.5" r="2.2" class="ah"/><text class="s q0" x="276.67" y="224.5">Startup and taxi, cruise, and</text><text class="s q0" x="276.67" y="239.5">the higher fuel burn during</text><text class="s q0" x="276.67" y="254.5">climb.</text><circle cx="267.67" cy="268.5" r="2.2" class="ah"/><text class="s q0" x="276.67" y="272.5">Ground speed during climb is</text><text class="s q0" x="276.67" y="287.5">less than in cruise at the same</text><text class="s q0" x="276.67" y="302.5">airspeed.</text><rect class="cl" x="489.33" y="184.5" width="220.67" height="134" rx="8"/><rect x="489.33" y="184.5" width="220.67" height="26" rx="10" class="mint q1"/><text class="t q2" x="499.33" y="202.5">Add a reserve</text><circle cx="502.33" cy="220.5" r="2.2" class="ah"/><text class="s q0" x="511.33" y="224.5">Plan for fuel to spare on top</text><text class="s q0" x="511.33" y="239.5">of what the trip needs.</text><circle cx="502.33" cy="253.5" r="2.2" class="ah"/><text class="s q0" x="511.33" y="257.5">Extra fuel for adequate reserve</text><text class="s q0" x="511.33" y="272.5">is a safety measure.</text><rect class="cl" x="20" y="332.5" width="338" height="137" rx="8"/><rect x="20" y="332.5" width="338" height="26" rx="10" class="rose q1"/><text class="t q2" x="30" y="350.5">Find your burn rate</text><circle cx="33" cy="368.5" r="2.2" class="ah"/><text class="s q0" x="42" y="372.5">Reciprocating engines: the AFM/POH gives gallons</text><text class="s q0" x="42" y="387.5">per hour.</text><circle cx="33" cy="401.5" r="2.2" class="ah"/><text class="s q0" x="42" y="405.5">Rate depends on engine condition, propeller pitch</text><text class="s q0" x="42" y="420.5">and rpm, mixture and percent of power.</text><circle cx="33" cy="434.5" r="2.2" class="ah"/><text class="s q0" x="42" y="438.5">Know it from the cruise performance charts or from</text><text class="s q0" x="42" y="453.5">experience.</text><rect class="cl" x="372" y="332.5" width="338" height="137" rx="8"/><rect x="372" y="332.5" width="338" height="26" rx="10" class="lav q1"/><text class="t q2" x="382" y="350.5">Be on the ground before</text><circle cx="385" cy="368.5" r="2.2" class="ah"/><text class="s q0" x="394" y="372.5">Your flight time exceeds the time you calculated</text><text class="s q0" x="394" y="387.5">for your preflight fuel.</text><circle cx="385" cy="401.5" r="2.2" class="ah"/><text class="s q0" x="394" y="405.5">Your fuel gauge indicates low fuel.</text></svg>
