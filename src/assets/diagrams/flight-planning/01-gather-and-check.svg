<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 529" role="img" aria-labelledby="ti de"><title id="ti">Gather and check before planning</title><desc id="de">Cards on what the pilot in command must know, the materials to collect, and a three-step order of weather, airports and the airplane manual.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><text class="t" x="20" y="28" style="font-size:15px">Before you plan the route: gather, check, then plan</text><text class="s" x="20" y="50.0" style="font-size:13px">The pilot in command must become familiar with all available information about the flight before it</text><text class="s" x="20" y="66.5" style="font-size:13px">begins. Collect what you need well before you go.</text><rect class="cl" x="20.0" y="91.0" width="338.0" height="140.0" rx="8"/><rect x="20.0" y="91.0" width="338.0" height="26" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30.0" y="109.0" style="font-size:13px">Know before you go</text><circle cx="33.0" cy="127.0" r="2.2" class="ah"/><text class="s" x="42.0" y="131.0" style="font-size:11.5px">For flights not in the vicinity of an airport:</text><text class="s" x="42.0" y="146.0" style="font-size:11.5px">current weather reports and forecasts.</text><circle cx="33.0" cy="160.0" r="2.2" class="ah"/><text class="s" x="42.0" y="164.0" style="font-size:11.5px">Fuel requirements.</text><circle cx="33.0" cy="178.0" r="2.2" class="ah"/><text class="s" x="42.0" y="182.0" style="font-size:11.5px">Alternatives if the flight cannot be completed.</text><circle cx="33.0" cy="196.0" r="2.2" class="ah"/><text class="s" x="42.0" y="200.0" style="font-size:11.5px">Any known traffic delays the PIC has been told</text><text class="s" x="42.0" y="215.0" style="font-size:11.5px">about by ATC.</text><rect class="cl" x="372.0" y="91.0" width="338.0" height="140.0" rx="8"/><rect x="372.0" y="91.0" width="338.0" height="26" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="382.0" y="109.0" style="font-size:13px">Materials to collect</text><circle cx="385.0" cy="127.0" r="2.2" class="ah"/><text class="s" x="394.0" y="131.0" style="font-size:11.5px">A current sectional chart, plus charts for areas</text><text class="s" x="394.0" y="146.0" style="font-size:11.5px">next to the route if it runs near a chart border.</text><circle cx="385.0" cy="160.0" r="2.2" class="ah"/><text class="s" x="394.0" y="164.0" style="font-size:11.5px">A flight computer or electronic calculator, and a</text><text class="s" x="394.0" y="179.0" style="font-size:11.5px">plotter.</text><circle cx="385.0" cy="193.0" r="2.2" class="ah"/><text class="s" x="394.0" y="197.0" style="font-size:11.5px">Anything that suits this flight: a flashlight for</text><text class="s" x="394.0" y="212.0" style="font-size:11.5px">night, water for desert country.</text><text class="t" x="20" y="251.0" style="font-size:14px">Then, in this order</text><rect class="cl" x="20.0" y="261.0" width="215.33333333333334" height="86.0" rx="8"/><rect x="20.0" y="261.0" width="215.33333333333334" height="26" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30.0" y="279.0" style="font-size:13px">1 Weather</text><circle cx="33.0" cy="297.0" r="2.2" class="ah"/><text class="s" x="42.0" y="301.0" style="font-size:11.5px">Check it first, to see if the</text><text class="s" x="42.0" y="316.0" style="font-size:11.5px">flight is feasible and which</text><text class="s" x="42.0" y="331.0" style="font-size:11.5px">route is best.</text><path d="M238.33 304.0L246.3 304.0" class="acc" style="stroke-width:2.5"/><path d="M254.33 304.0L246.3 307.6L246.3 300.4Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><rect class="cl" x="257.33333333333337" y="261.0" width="215.33333333333334" height="86.0" rx="8"/><rect x="257.33333333333337" y="261.0" width="215.33333333333334" height="26" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="267.33333333333337" y="279.0" style="font-size:13px">2 Airports</text><circle cx="270.33333333333337" cy="297.0" r="2.2" class="ah"/><text class="s" x="279.33333333333337" y="301.0" style="font-size:11.5px">Study each airport where you</text><text class="s" x="279.33333333333337" y="316.0" style="font-size:11.5px">intend to land.</text><path d="M475.67 304.0L483.7 304.0" class="acc" style="stroke-width:2.5"/><path d="M491.67 304.0L483.7 307.6L483.7 300.4Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><rect class="cl" x="494.6666666666667" y="261.0" width="215.33333333333334" height="86.0" rx="8"/><rect x="494.6666666666667" y="261.0" width="215.33333333333334" height="26" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="504.6666666666667" y="279.0" style="font-size:13px">3 AFM/POH</text><circle cx="507.6666666666667" cy="297.0" r="2.2" class="ah"/><text class="s" x="516.6666666666667" y="301.0" style="font-size:11.5px">Check loading, runway</text><text class="s" x="516.6666666666667" y="316.0" style="font-size:11.5px">distances and fuel burn.</text><rect class="cl" x="20.0" y="361.0" width="338.0" height="152.0" rx="8"/><rect x="20.0" y="361.0" width="338.0" height="26" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30.0" y="379.0" style="font-size:13px">Loading</text><circle cx="33.0" cy="397.0" r="2.2" class="ah"/><text class="s" x="42.0" y="401.0" style="font-size:11.5px">Know the weight of usable fuel and drainable oil,</text><text class="s" x="42.0" y="416.0" style="font-size:11.5px">passengers, baggage and the empty aircraft.</text><circle cx="33.0" cy="430.0" r="2.2" class="ah"/><text class="s" x="42.0" y="434.0" style="font-size:11.5px">The total must not exceed the maximum allowable</text><text class="s" x="42.0" y="449.0" style="font-size:11.5px">weight, and the CG must be within limits.</text><circle cx="33.0" cy="463.0" r="2.2" class="ah"/><text class="s" x="42.0" y="467.0" style="font-size:11.5px">Use the latest weight and balance information.</text><rect class="cl" x="372.0" y="361.0" width="338.0" height="152.0" rx="8"/><rect x="372.0" y="361.0" width="338.0" height="26" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="382.0" y="379.0" style="font-size:13px">Distances and fuel</text><circle cx="385.0" cy="397.0" r="2.2" class="ah"/><text class="s" x="394.0" y="401.0" style="font-size:11.5px">Find takeoff and landing distances for your load,</text><text class="s" x="394.0" y="416.0" style="font-size:11.5px">airport elevation and temperature, then compare</text><text class="s" x="394.0" y="431.0" style="font-size:11.5px">them with the runway available.</text><circle cx="385.0" cy="445.0" r="2.2" class="ah"/><text class="s" x="394.0" y="449.0" style="font-size:11.5px">More load, elevation, temperature or humidity means</text><text class="s" x="394.0" y="464.0" style="font-size:11.5px">a longer roll and a lower rate of climb.</text><circle cx="385.0" cy="478.0" r="2.2" class="ah"/><text class="s" x="394.0" y="482.0" style="font-size:11.5px">Use the fuel consumption charts so refueling points</text><text class="s" x="394.0" y="497.0" style="font-size:11.5px">can be planned.</text></svg>
