<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 529" role="img" aria-labelledby="ti de"><title id="ti">Gather and check before planning</title><desc id="de">Cards on what the pilot in command must know, the materials to collect, and a three-step order of weather, airports and the airplane manual.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11.5px}.q1{font-size:13px}.q2{stroke:currentColor;stroke-width:1.5}.q3{fill:var(--palette-berry,#A84C6B)}</style><text class="t" x="20" y="28" style="font-size:15px">Before you plan the route: gather, check, then plan</text><text class="s q1" x="20" y="50">The pilot in command must become familiar with all available information about the flight before it</text><text class="s q1" x="20" y="66.5">begins. Collect what you need well before you go.</text><rect class="cl" x="20" y="91" width="338" height="140" rx="8"/><rect x="20" y="91" width="338" height="26" rx="10" class="sky q2"/><text class="t q1" x="30" y="109">Know before you go</text><circle cx="33" cy="127" r="2.2" class="ah"/><text class="s q0" x="42" y="131">For flights not in the vicinity of an airport:</text><text class="s q0" x="42" y="146">current weather reports and forecasts.</text><circle cx="33" cy="160" r="2.2" class="ah"/><text class="s q0" x="42" y="164">Fuel requirements.</text><circle cx="33" cy="178" r="2.2" class="ah"/><text class="s q0" x="42" y="182">Alternatives if the flight cannot be completed.</text><circle cx="33" cy="196" r="2.2" class="ah"/><text class="s q0" x="42" y="200">Any known traffic delays the PIC has been told</text><text class="s q0" x="42" y="215">about by ATC.</text><rect class="cl" x="372" y="91" width="338" height="140" rx="8"/><rect x="372" y="91" width="338" height="26" rx="10" class="lav q2"/><text class="t q1" x="382" y="109">Materials to collect</text><circle cx="385" cy="127" r="2.2" class="ah"/><text class="s q0" x="394" y="131">A current sectional chart, plus charts for areas</text><text class="s q0" x="394" y="146">next to the route if it runs near a chart border.</text><circle cx="385" cy="160" r="2.2" class="ah"/><text class="s q0" x="394" y="164">A flight computer or electronic calculator, and a</text><text class="s q0" x="394" y="179">plotter.</text><circle cx="385" cy="193" r="2.2" class="ah"/><text class="s q0" x="394" y="197">Anything that suits this flight: a flashlight for</text><text class="s q0" x="394" y="212">night, water for desert country.</text><text class="t" x="20" y="251" style="font-size:14px">Then, in this order</text><rect class="cl" x="20" y="261" width="215.33" height="86" rx="8"/><rect x="20" y="261" width="215.33" height="26" rx="10" class="mint q2"/><text class="t q1" x="30" y="279">1 Weather</text><circle cx="33" cy="297" r="2.2" class="ah"/><text class="s q0" x="42" y="301">Check it first, to see if the</text><text class="s q0" x="42" y="316">flight is feasible and which</text><text class="s q0" x="42" y="331">route is best.</text><path d="M238.33 304L246.3 304" class="acc" style="stroke-width:2.5"/><path d="M254.33 304L246.3 307.6L246.3 300.4Z" class="dh q3"/><rect class="cl" x="257.33" y="261" width="215.33" height="86" rx="8"/><rect x="257.33" y="261" width="215.33" height="26" rx="10" class="sky q2"/><text class="t q1" x="267.33" y="279">2 Airports</text><circle cx="270.33" cy="297" r="2.2" class="ah"/><text class="s q0" x="279.33" y="301">Study each airport where you</text><text class="s q0" x="279.33" y="316">intend to land.</text><path d="M475.67 304L483.7 304" class="acc" style="stroke-width:2.5"/><path d="M491.67 304L483.7 307.6L483.7 300.4Z" class="dh q3"/><rect class="cl" x="494.67" y="261" width="215.33" height="86" rx="8"/><rect x="494.67" y="261" width="215.33" height="26" rx="10" class="rose q2"/><text class="t q1" x="504.67" y="279">3 AFM/POH</text><circle cx="507.67" cy="297" r="2.2" class="ah"/><text class="s q0" x="516.67" y="301">Check loading, runway</text><text class="s q0" x="516.67" y="316">distances and fuel burn.</text><rect class="cl" x="20" y="361" width="338" height="152" rx="8"/><rect x="20" y="361" width="338" height="26" rx="10" class="lav q2"/><text class="t q1" x="30" y="379">Loading</text><circle cx="33" cy="397" r="2.2" class="ah"/><text class="s q0" x="42" y="401">Know the weight of usable fuel and drainable oil,</text><text class="s q0" x="42" y="416">passengers, baggage and the empty aircraft.</text><circle cx="33" cy="430" r="2.2" class="ah"/><text class="s q0" x="42" y="434">The total must not exceed the maximum allowable</text><text class="s q0" x="42" y="449">weight, and the CG must be within limits.</text><circle cx="33" cy="463" r="2.2" class="ah"/><text class="s q0" x="42" y="467">Use the latest weight and balance information.</text><rect class="cl" x="372" y="361" width="338" height="152" rx="8"/><rect x="372" y="361" width="338" height="26" rx="10" class="mint q2"/><text class="t q1" x="382" y="379">Distances and fuel</text><circle cx="385" cy="397" r="2.2" class="ah"/><text class="s q0" x="394" y="401">Find takeoff and landing distances for your load,</text><text class="s q0" x="394" y="416">airport elevation and temperature, then compare</text><text class="s q0" x="394" y="431">them with the runway available.</text><circle cx="385" cy="445" r="2.2" class="ah"/><text class="s q0" x="394" y="449">More load, elevation, temperature or humidity means</text><text class="s q0" x="394" y="464">a longer roll and a lower rate of climb.</text><circle cx="385" cy="478" r="2.2" class="ah"/><text class="s q0" x="394" y="482">Use the fuel consumption charts so refueling points</text><text class="s q0" x="394" y="497">can be planned.</text></svg>
