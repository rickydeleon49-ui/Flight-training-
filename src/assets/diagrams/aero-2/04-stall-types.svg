<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 552" role="img" aria-labelledby="ti de"><title id="ti">Six kinds of stall and where each one finds you</title><desc id="de">Six cards on kinds of stall. Power-off: idle power in a landing setup, like the turn from base to final. Power-on: takeoff or climb power with a high nose, like a climb after takeoff. Accelerated: a stall above the normal stalling speed caused by added load factor, like a steep turn. Cross-control: rudder one way and aileron the other, usually a skid near the stall, which can lead to a spin. Elevator trim: nose-up trim then full power in a go-around makes the nose rise sharply. Secondary: a second stall just after recovery from pulling back too soon or too hard.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:var(--diagram-text-opacity,.85)}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:var(--diagram-fill-opacity,.6)}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:var(--diagram-fill-opacity,.6)}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:var(--diagram-fill-opacity,.6)}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:var(--diagram-fill-opacity,.6)}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11.5px}.q1{font-size:13px}.q2{stroke:currentColor;stroke-width:1.5}.q3{stroke:currentColor;stroke-width:1.6}</style><text class="t" x="20" y="28" style="font-size:15px">Six kinds of stall and where each one finds you</text><text class="s q1" x="20" y="50">A stall is always a wing past its critical angle of attack. What changes is how you get there, so the</text><text class="s q1" x="20" y="66.5">picture in your head matters: practice stalls match real situations.</text><rect class="cl" x="20" y="88" width="223" height="172" rx="8"/><rect class="sky q2" x="30" y="98" width="203" height="24" rx="10"/><text class="t q1" x="40" y="115">Power-off</text><circle cx="43" cy="138" r="2.2" class="ah"/><text class="s q0" x="52" y="142">Idle power, landing setup, nose</text><text class="s q0" x="52" y="157">raised until the stall.</text><circle cx="43" cy="168" r="2.2" class="ah"/><text class="s q0" x="52" y="172">Like the turn from base to</text><text class="s q0" x="52" y="187">final, or a flare that is too</text><text class="s q0" x="52" y="202">slow.</text><rect class="cl" x="253.5" y="88" width="223" height="172" rx="8"/><rect class="lav q2" x="263.5" y="98" width="203" height="24" rx="10"/><text class="t q1" x="273.5" y="115">Power-on</text><circle cx="276.5" cy="138" r="2.2" class="ah"/><text class="s q0" x="285.5" y="142">Takeoff or climb power with the</text><text class="s q0" x="285.5" y="157">nose raised high.</text><circle cx="276.5" cy="168" r="2.2" class="ah"/><text class="s q0" x="285.5" y="172">Like a climb out after takeoff,</text><text class="s q0" x="285.5" y="187">with the nose held too high.</text><rect class="cl" x="487" y="88" width="223" height="172" rx="8"/><rect class="mint q2" x="497" y="98" width="203" height="24" rx="10"/><text class="t q1" x="507" y="115">Accelerated</text><circle cx="510" cy="138" r="2.2" class="ah"/><text class="s q0" x="519" y="142">Stalls above the normal</text><text class="s q0" x="519" y="157">stalling speed because load</text><text class="s q0" x="519" y="172">factor is added.</text><circle cx="510" cy="183" r="2.2" class="ah"/><text class="s q0" x="519" y="187">Like a steep turn or a sharp</text><text class="s q0" x="519" y="202">pull up.</text><rect class="cl" x="20" y="272" width="223" height="172" rx="8"/><rect class="rose q2" x="30" y="282" width="203" height="24" rx="10"/><text class="t q1" x="40" y="299">Cross-control</text><circle cx="43" cy="322" r="2.2" class="ah"/><text class="s q0" x="52" y="326">Rudder one way and aileron the</text><text class="s q0" x="52" y="341">other, usually a skid with the</text><text class="s q0" x="52" y="356">airplane near the stall.</text><circle cx="43" cy="367" r="2.2" class="ah"/><text class="s q0" x="52" y="371">Can drop a wing and lead to a</text><text class="s q0" x="52" y="386">spin.</text><rect class="cl" x="253.5" y="272" width="223" height="172" rx="8"/><rect class="sky q2" x="263.5" y="282" width="203" height="24" rx="10"/><text class="t q1" x="273.5" y="299">Elevator trim</text><circle cx="276.5" cy="322" r="2.2" class="ah"/><text class="s q0" x="285.5" y="326">Nose-up trim set for a slow</text><text class="s q0" x="285.5" y="341">approach, then full power</text><text class="s q0" x="285.5" y="356">added.</text><circle cx="276.5" cy="367" r="2.2" class="ah"/><text class="s q0" x="285.5" y="371">Like a go-around: the nose</text><text class="s q0" x="285.5" y="386">rises sharply unless you hold</text><text class="s q0" x="285.5" y="401">forward pressure.</text><rect class="cl" x="487" y="272" width="223" height="172" rx="8"/><rect class="lav q2" x="497" y="282" width="203" height="24" rx="10"/><text class="t q1" x="507" y="299">Secondary</text><circle cx="510" cy="322" r="2.2" class="ah"/><text class="s q0" x="519" y="326">A second stall just after</text><text class="s q0" x="519" y="341">recovering from the first.</text><circle cx="510" cy="352" r="2.2" class="ah"/><text class="s q0" x="519" y="356">Comes from pulling back too</text><text class="s q0" x="519" y="371">soon or too hard.</text><rect class="cl" x="20" y="462" width="690" height="52" rx="8"/><text class="s" x="32" y="482" style="font-size:12px">Whatever the type, the recovery is the same first step: reduce the angle of attack. See the recovery steps.</text><text class="s" x="32" y="497.5" style="font-size:12px">Your instructor will show which of these your airplane and your course use.</text><text class="s" x="20" y="536" style="font-size:11px">Source: Airplane Flying Handbook ch. 5 (stalls and spins).</text></svg>