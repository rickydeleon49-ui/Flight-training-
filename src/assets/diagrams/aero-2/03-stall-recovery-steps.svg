<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 572" role="img" aria-labelledby="ti de"><title id="ti">Stall recovery: four steps in order</title><desc id="de">Four numbered steps in order. One: reduce the angle of attack by moving the elevator forward. Two: level the wings, using rudder to keep the nose straight. Three: add power as needed. Four: return to the flight path with smooth back pressure, avoiding a secondary stall. Side cards list signs a stall is near: warning horn, buffet, mushy controls, quieter airflow, nose high attitude. And slip-ups to avoid: pulling hard to climb away, using only aileron to lift a dropped wing, waiting for the nose to drop.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:var(--diagram-text-opacity,.85)}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:var(--diagram-fill-opacity,.6)}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:var(--diagram-fill-opacity,.6)}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:var(--diagram-fill-opacity,.6)}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:var(--diagram-fill-opacity,.6)}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11.5px}.q1{font-size:13px}.q2{stroke:currentColor;stroke-width:1.5}.q3{stroke:currentColor;stroke-width:1.6}</style><text class="t" x="20" y="28" style="font-size:15px">Stall recovery: four steps in order</text><text class="s q1" x="20" y="50">Recover at the first clear sign of a stall, not after the nose has dropped. The cure is always</text><text class="s q1" x="20" y="66.5">the same: make the wing fly again by reducing the angle of attack.</text><rect class="cl" x="20" y="92" width="420" height="74" rx="8"/><circle cx="52" cy="129" r="17" class="sky q3"/><text class="t q1" x="52" y="135" style="text-anchor:middle">1</text><text class="t q1" x="84" y="122">Reduce the angle of attack</text><text class="s q0" x="84" y="142">Move the elevator forward, easing back pressure, to</text><text class="s q0" x="84" y="157">break the stall.</text><path class="acc" d="M52 168V180" style="stroke-width:3"/><path class="ah" d="M46 178L52 186L58 178Z"/><rect class="cl" x="20" y="188" width="420" height="74" rx="8"/><circle cx="52" cy="225" r="17" class="lav q3"/><text class="t q1" x="52" y="231" style="text-anchor:middle">2</text><text class="t q1" x="84" y="218">Level the wings</text><text class="s q0" x="84" y="238">Use rudder to keep the nose straight while the wings</text><text class="s q0" x="84" y="253">come level.</text><path class="acc" d="M52 264V276" style="stroke-width:3"/><path class="ah" d="M46 274L52 282L58 274Z"/><rect class="cl" x="20" y="284" width="420" height="74" rx="8"/><circle cx="52" cy="321" r="17" class="mint q3"/><text class="t q1" x="52" y="327" style="text-anchor:middle">3</text><text class="t q1" x="84" y="314">Add power as needed</text><text class="s q0" x="84" y="334">Power cuts the height you lose. In a power-on stall it</text><text class="s q0" x="84" y="349">is already in.</text><path class="acc" d="M52 360V372" style="stroke-width:3"/><path class="ah" d="M46 370L52 378L58 370Z"/><rect class="cl" x="20" y="380" width="420" height="74" rx="8"/><circle cx="52" cy="417" r="17" class="rose q3"/><text class="t q1" x="52" y="423" style="text-anchor:middle">4</text><text class="t q1" x="84" y="410">Return to the flight path</text><text class="s q0" x="84" y="430">Ease back smoothly. A hard pull can start a second</text><text class="s q0" x="84" y="445">stall.</text><rect class="cl" x="460" y="92" width="250" height="170" rx="8"/><rect class="sky q2" x="470" y="102" width="230" height="24" rx="10"/><text class="t q1" x="480" y="119">Signs a stall is near</text><circle cx="479" cy="134" r="2.2" class="ah"/><text class="s q0" x="488" y="138">Stall warning horn or light</text><circle cx="479" cy="149" r="2.2" class="ah"/><text class="s q0" x="488" y="153">Buffeting or shaking</text><circle cx="479" cy="164" r="2.2" class="ah"/><text class="s q0" x="488" y="168">Soft, mushy controls</text><circle cx="479" cy="179" r="2.2" class="ah"/><text class="s q0" x="488" y="183">Quieter airflow noise</text><circle cx="479" cy="194" r="2.2" class="ah"/><text class="s q0" x="488" y="198">Nose high attitude and slowing</text><text class="s q0" x="488" y="213">speed</text><rect class="cl" x="460" y="278" width="250" height="198" rx="8"/><rect class="rose q2" x="470" y="288" width="230" height="24" rx="10"/><text class="t q1" x="480" y="305">Slip-ups to avoid</text><circle cx="479" cy="320" r="2.2" class="ah"/><text class="s q0" x="488" y="324">Pulling hard to climb away,</text><text class="s q0" x="488" y="339">which can bring a secondary</text><text class="s q0" x="488" y="354">stall</text><circle cx="479" cy="365" r="2.2" class="ah"/><text class="s q0" x="488" y="369">Using only aileron to lift a</text><text class="s q0" x="488" y="384">dropped wing; use rudder too</text><circle cx="479" cy="395" r="2.2" class="ah"/><text class="s q0" x="488" y="399">Waiting for the nose to drop</text><text class="s q0" x="488" y="414">before you react</text><rect class="cl" x="20" y="484" width="690" height="50" rx="8"/><text class="s" x="32" y="504" style="font-size:12px">A stall happens at the critical angle of attack, at any speed or pitch attitude, so step 1 is always the same.</text><text class="s" x="32" y="519.5" style="font-size:12px">Practice with an instructor, well above the ground. Your AFM/POH has the recovery notes for your airplane.</text><text class="s" x="20" y="556" style="font-size:11px">Source: Airplane Flying Handbook ch. 5 (stall recognition and recovery).</text></svg>