<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 520" role="img" aria-labelledby="ti de"><title id="ti">Front and back of the power curve</title><desc id="de">A schematic graph of power required against airspeed. The curve falls from the stall speed to a lowest point and rises again at higher speed. Left of the lowest point is the back of the power curve, where slower speed needs more power. Right of it is the front side, where faster speed needs more power. Cards: on the back side, slower speed needs more power, pulling back to hold height slows the airplane more and can bring a stall, so add power and ease the nose forward. On the front side, power and pitch behave as expected. The drawing shows the idea, not real numbers.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:var(--diagram-text-opacity,.85)}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:var(--diagram-fill-opacity,.6)}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:var(--diagram-fill-opacity,.6)}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:var(--diagram-fill-opacity,.6)}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:var(--diagram-fill-opacity,.6)}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11.5px}.q1{font-size:13px}.q2{stroke:currentColor;stroke-width:1.5}.q3{stroke:currentColor;stroke-width:1.6}</style><text class="t" x="20" y="28" style="font-size:15px">Front and back of the power curve</text><text class="s q1" x="20" y="50">Power required is lowest at one speed. Slower than that, the airplane needs more power to keep flying,</text><text class="s q1" x="20" y="66.5">which turns the usual speed habits around.</text><rect class="rose" x="70" y="104" width="210" height="196" style="opacity:.4"/><rect class="mint" x="280" y="104" width="410" height="196" style="opacity:.4"/><path class="dk q2" d="M70 300H690M70 300V104" style="stroke-width:1.8"/><path class="acc" d="M112 128C150 250 215 274 280 274C400 274 560 220 668 122"/><path class="o d q2" d="M112 128V300M280 274V300" style="stroke-width:1.6"/><circle cx="280" cy="274" r="5" class="ah"/><text class="t q1" x="76" y="98">Power required</text><text class="t q1" x="690" y="322" style="text-anchor:end">Airspeed</text><text class="s q0" x="112" y="318" style="text-anchor:middle">Stall speed</text><text class="s q0" x="280" y="318" style="text-anchor:middle">Lowest power</text><text class="t q1" x="205" y="130" style="text-anchor:middle">Back of the power curve</text><text class="s q0" x="205" y="148" style="text-anchor:middle">slower needs more power</text><text class="t q1" x="500" y="130" style="text-anchor:middle">Front of the power curve</text><text class="s q0" x="500" y="148" style="text-anchor:middle">faster needs more power</text><rect class="cl" x="20" y="340" width="335" height="120" rx="8"/><rect class="rose q2" x="30" y="350" width="315" height="24" rx="10"/><text class="t q1" x="40" y="367">Back side: slow flight</text><circle cx="43" cy="384" r="2.2" class="ah"/><text class="s q0" x="52" y="388">Slower speed needs more power, not less.</text><circle cx="43" cy="399" r="2.2" class="ah"/><text class="s q0" x="52" y="403">Pulling back to hold height slows you more and</text><text class="s q0" x="52" y="418">can bring a stall.</text><circle cx="43" cy="429" r="2.2" class="ah"/><text class="s q0" x="52" y="433">Add power and ease the nose forward.</text><rect class="cl" x="375" y="340" width="335" height="120" rx="8"/><rect class="mint q2" x="385" y="350" width="315" height="24" rx="10"/><text class="t q1" x="395" y="367">Front side: normal flight</text><circle cx="398" cy="384" r="2.2" class="ah"/><text class="s q0" x="407" y="388">Faster speed needs more power, so power and</text><text class="s q0" x="407" y="403">pitch behave as you expect.</text><circle cx="398" cy="414" r="2.2" class="ah"/><text class="s q0" x="407" y="418">Slow flight and the final approach can bring you</text><text class="s q0" x="407" y="433">toward the back side, so watch your speed there.</text><text class="s" x="20" y="480" style="font-size:12px">The lowest point is different for every airplane and weight. The drawing shows the idea, not real numbers.</text><text class="s" x="20" y="504" style="font-size:11px">Source: Airplane Flying Handbook ch. 4 (power curve); PHAK ch. 11.</text></svg>