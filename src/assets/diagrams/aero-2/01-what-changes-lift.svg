<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 648" role="img" aria-labelledby="ti de"><title id="ti">What changes how much lift a wing makes</title><desc id="de">Four panels on what changes lift. Airspeed: with the angle of attack held, doubling speed from 50 to 100 knots gives four times the lift. Air density: thinner air gives less lift at the same speed. Wing area and shape: flaps add curve, and Fowler flaps also add area, so the wing makes more lift. Angle of attack: lift rises up to the critical angle and falls past it. A note names the pilot tools: elevator for angle of attack, power and pitch for speed, flaps for area and shape.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:var(--diagram-text-opacity,.85)}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:var(--diagram-fill-opacity,.6)}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:var(--diagram-fill-opacity,.6)}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:var(--diagram-fill-opacity,.6)}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:var(--diagram-fill-opacity,.6)}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11.5px}.q1{font-size:13px}.q2{stroke:currentColor;stroke-width:1.5}.q3{stroke:currentColor;stroke-width:1.6}</style><text class="t" x="20" y="28" style="font-size:15px">What changes how much lift a wing makes</text><text class="s q1" x="20" y="50">Lift depends on the shape of the wing, its angle of attack, the speed of the air over it, the</text><text class="s q1" x="20" y="66.5">air density and the wing area. The pilot can change some of these and has to plan for the rest.</text><rect class="cl" x="20" y="88" width="335" height="214" rx="8"/><rect class="sky q2" x="30" y="98" width="315" height="24" rx="10"/><text class="t q1" x="40" y="115">Airspeed</text><text class="s q0" x="36" y="142">Lift changes with the square of the speed, with the</text><text class="s q0" x="36" y="157">angle of attack held the same.</text><text class="t q1" x="36" y="206">50 knots</text><rect class="sky q3" x="120" y="190" width="40" height="22" rx="5"/><text class="s q0" x="170" y="206">1 unit of lift</text><text class="t q1" x="36" y="240">100 knots</text><rect class="lav q3" x="120" y="224" width="160" height="22" rx="5"/><text class="s q0" x="290" y="240">4 units</text><text class="t q1" x="36" y="278">Twice the speed, four times the lift (to scale).</text><rect class="cl" x="375" y="88" width="335" height="214" rx="8"/><rect class="mint q2" x="385" y="98" width="315" height="24" rx="10"/><text class="t q1" x="395" y="115">Air density</text><text class="s q0" x="391" y="142">Thinner air gives less lift. High, hot or humid air</text><text class="s q0" x="391" y="157">is less dense.</text><text class="t q1" x="391" y="206">Dense air</text><rect class="mint q3" x="485" y="190" width="160" height="22" rx="5"/><text class="t q1" x="391" y="240">Thin air</text><rect class="rose q3" x="485" y="224" width="100" height="22" rx="5"/><text class="s q0" x="655" y="206">more lift</text><text class="s q0" x="595" y="240">less lift</text><text class="s q0" x="391" y="271">Bar lengths only show the idea, not real</text><text class="s q0" x="391" y="286">numbers. Thin air asks for more speed.</text><rect class="cl" x="20" y="312" width="335" height="214" rx="8"/><rect class="lav q2" x="30" y="322" width="315" height="24" rx="10"/><text class="t q1" x="40" y="339">Wing area</text><text class="s q0" x="36" y="366">A larger wing area gives more lift at the same</text><text class="s q0" x="36" y="381">speed. Flaps add curve, and some add area.</text><rect class="lav q3" x="80" y="430" width="90" height="16" rx="4"/><text class="s q0" x="36" y="470">Wing with flaps up</text><rect class="lav q3" x="210" y="430" width="90" height="16" rx="4"/><rect class="sky q3" x="300" y="430" width="28" height="16" rx="3"/><text class="s q0" x="210" y="470">Wing with flaps out</text><text class="s q0" x="36" y="502">Fowler flaps slide back and add the most area.</text><rect class="cl" x="375" y="312" width="335" height="214" rx="8"/><rect class="rose q2" x="385" y="322" width="315" height="24" rx="10"/><text class="t q1" x="395" y="339">Angle of attack</text><text class="s q0" x="391" y="366">Lift rises as the angle of attack increases, up to</text><text class="s q0" x="391" y="381">the critical angle. Past it, lift falls.</text><path class="dk q2" d="M425 502H675M425 502V424" style="stroke-width:1.6"/><path class="acc" d="M425 490C515 462 565 424 605 424C635 424 640 462 665 484"/><path class="o d q2" d="M605 424V502"/><text class="s q0" x="391" y="447">Lift</text><text class="s q0" x="505" y="517">Angle of attack</text><text class="s q0" x="545" y="418">critical angle</text><rect class="cl" x="20" y="544" width="690" height="70" rx="8"/><text class="s" x="32" y="564" style="font-size:12px">Pilot tools: the elevator changes the angle of attack, power and pitch change the speed, and flaps change the wing</text><text class="s" x="32" y="579.5" style="font-size:12px">area and shape. Density changes with altitude and temperature, so the same airplane flies and stalls differently</text><text class="s" x="32" y="595" style="font-size:12px">on a hot, high day. Always use the numbers in your AFM/POH.</text><text class="s" x="20" y="632" style="font-size:11px">Source: PHAK ch. 5 (lift) and ch. 6 (flaps).</text></svg>