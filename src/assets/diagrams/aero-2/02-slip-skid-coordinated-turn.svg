<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 548" role="img" aria-labelledby="ti de"><title id="ti">Coordinated, slipping and skidding turns: read the ball</title><desc id="de">Three left-turn panels seen from behind, each with a ball in a slip and skid indicator. Coordinated: the ball is centered and turn rate matches bank. Slipping: the bank is too steep for the turn rate, the airplane slides toward the inside and the ball sits toward the low wing; ease the bank or press the rudder on the ball side. Skidding: the turn rate is too fast for the bank, the airplane skids toward the outside and the ball sits toward the high wing; ease the rudder or press the rudder on the ball side. A note says to step on the ball and warns about skids near the ground at low speed.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:var(--diagram-text-opacity,.85)}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:var(--diagram-fill-opacity,.6)}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:var(--diagram-fill-opacity,.6)}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:var(--diagram-fill-opacity,.6)}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:var(--diagram-fill-opacity,.6)}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11.5px}.q1{font-size:13px}.q2{stroke:currentColor;stroke-width:1.5}.q3{stroke:currentColor;stroke-width:1.6}</style><text class="t" x="20" y="28" style="font-size:15px">Coordinated, slipping and skidding turns: read the ball</text><text class="s q1" x="20" y="50">In a turn the ball in the slip/skid indicator shows whether turn rate and bank match. All three</text><text class="s q1" x="20" y="66.5">panels show a left turn seen from behind; the ball rolls toward the side the airplane slides.</text><rect class="cl" x="20" y="88" width="220" height="322" rx="8"/><rect class="mint q2" x="30" y="98" width="200" height="24" rx="10"/><text class="t q1" x="40" y="115">Coordinated</text><path class="dk" d="M50 194L210 146"/><circle cx="130" cy="170" r="10" class="mint q3"/><rect class="o" x="80" y="222" width="100" height="22" rx="11" style="stroke-width:2"/><path class="o" d="M121 222V244M139 222V244" style="stroke-width:1.5"/><circle cx="130" cy="233" r="8" class="ah"/><text class="s q0 e" x="122" y="262">low wing</text><text class="s q0" x="138" y="262">high wing</text><circle cx="37" cy="286" r="2.2" class="ah"/><text class="s q0" x="46" y="290">Turn rate matches the bank</text><text class="s q0" x="46" y="305">angle.</text><circle cx="37" cy="316" r="2.2" class="ah"/><text class="s q0" x="46" y="320">Ball stays centered; the</text><text class="s q0" x="46" y="335">airplane follows its curved</text><text class="s q0" x="46" y="350">path.</text><circle cx="37" cy="361" r="2.2" class="ah"/><text class="s q0" x="46" y="365">Keep it here with rudder.</text><rect class="cl" x="255" y="88" width="220" height="322" rx="8"/><rect class="sky q2" x="265" y="98" width="200" height="24" rx="10"/><text class="t q1" x="275" y="115">Slipping</text><path class="dk" d="M285 194L445 146"/><circle cx="365" cy="170" r="10" class="sky q3"/><rect class="o" x="315" y="222" width="100" height="22" rx="11" style="stroke-width:2"/><path class="o" d="M356 222V244M374 222V244" style="stroke-width:1.5"/><circle cx="335" cy="233" r="8" class="ah"/><text class="s q0 e" x="357" y="262">low wing</text><text class="s q0" x="373" y="262">high wing</text><circle cx="272" cy="286" r="2.2" class="ah"/><text class="s q0" x="281" y="290">Bank is too steep for the turn</text><text class="s q0" x="281" y="305">rate.</text><circle cx="272" cy="316" r="2.2" class="ah"/><text class="s q0" x="281" y="320">The airplane slides toward the</text><text class="s q0" x="281" y="335">inside of the turn; the ball</text><text class="s q0" x="281" y="350">sits on the low-wing side.</text><circle cx="272" cy="361" r="2.2" class="ah"/><text class="s q0" x="281" y="365">Fix: ease the bank, or press</text><text class="s q0" x="281" y="380">the rudder on the ball side.</text><rect class="cl" x="490" y="88" width="220" height="322" rx="8"/><rect class="rose q2" x="500" y="98" width="200" height="24" rx="10"/><text class="t q1" x="510" y="115">Skidding</text><path class="dk" d="M520 194L680 146"/><circle cx="600" cy="170" r="10" class="rose q3"/><rect class="o" x="550" y="222" width="100" height="22" rx="11" style="stroke-width:2"/><path class="o" d="M591 222V244M609 222V244" style="stroke-width:1.5"/><circle cx="630" cy="233" r="8" class="ah"/><text class="s q0 e" x="592" y="262">low wing</text><text class="s q0" x="608" y="262">high wing</text><circle cx="507" cy="286" r="2.2" class="ah"/><text class="s q0" x="516" y="290">Turn rate is too fast for the</text><text class="s q0" x="516" y="305">bank.</text><circle cx="507" cy="316" r="2.2" class="ah"/><text class="s q0" x="516" y="320">The airplane skids toward the</text><text class="s q0" x="516" y="335">outside; the ball sits on the</text><text class="s q0" x="516" y="350">high-wing side.</text><circle cx="507" cy="361" r="2.2" class="ah"/><text class="s q0" x="516" y="365">Fix: ease the rudder, or press</text><text class="s q0" x="516" y="380">the rudder on the ball side.</text><rect class="cl" x="20" y="424" width="690" height="84" rx="8"/><text class="s" x="32" y="446" style="font-size:12px">Step on the ball: press the rudder on the side the ball is on. Slips and skids are both uncoordinated flight.</text><text class="s" x="32" y="461.5" style="font-size:12px">A skid at low speed, close to the stall, can end in a spin, so watch the ball most near the ground.</text><text class="s" x="32" y="477" style="font-size:12px">A deliberate slip with opposite rudder and aileron is a different maneuver for losing height; the forward</text><text class="s" x="32" y="492.5" style="font-size:12px">slip has its own diagram.</text><text class="s" x="20" y="532" style="font-size:11px">Source: Airplane Flying Handbook ch. 3 (turns and coordination); PHAK ch. 5.</text></svg>