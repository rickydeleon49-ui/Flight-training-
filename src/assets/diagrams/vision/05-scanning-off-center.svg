<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 563" role="img" aria-labelledby="ti de"><title id="ti">Night scanning, off-center viewing, empty-field myopia</title><desc id="de">Scan from right to left or left to right, starting at the greatest distance (top) and moving inward toward the aircraft (bottom). Each stop covers about 30 degrees, lasts no longer than 2 to 3 seconds, and overlaps the previous view by 10 degrees. Off-center viewing: look 10 degrees above, below or to either side of an object, so peripheral vision keeps contact; an object viewed longer than 2 to 3 seconds disappears. Empty-field myopia: above clouds or haze the eyes relax to a focal distance of 10 to 30 feet; focus on distant light sources.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><text class="t" x="20" y="28" style="font-size:15px">Night scanning, off-center viewing, empty-field myopia</text><text class="s" x="20" y="50.0" style="font-size:13px">Scanning is very important in identifying objects at night. The rods in the peripheral field must be</text><text class="s" x="20" y="66.5" style="font-size:13px">exposed to the image, and the eyes need something to focus on.</text><rect class="cl" x="20" y="89.0" width="400" height="276" rx="8"/><text class="t" x="32" y="111.0" style="font-size:13px">Scan pattern</text><text class="s" x="32" y="129.0" style="font-size:11.5px">Right to left or left to right</text><rect x="110" y="149.0" width="90" height="30" rx="6" class="sky" style="stroke:currentColor;stroke-width:1.8;stroke-linejoin:round"/><rect x="170" y="155.0" width="90" height="30" rx="6" class="sky" style="stroke:currentColor;stroke-width:1.8;stroke-linejoin:round"/><rect x="230" y="161.0" width="90" height="30" rx="6" class="sky" style="stroke:currentColor;stroke-width:1.8;stroke-linejoin:round"/><rect x="170" y="155.0" width="30" height="24" class="ah" style="fill-opacity:.5"/><rect x="230" y="161.0" width="30" height="24" class="ah" style="fill-opacity:.5"/><text class="t m" x="132" y="168.0" style="font-size:11.5px">30°</text><rect x="110" y="211.0" width="90" height="30" rx="6" class="sky" style="stroke:currentColor;stroke-width:1.8;stroke-linejoin:round"/><rect x="170" y="217.0" width="90" height="30" rx="6" class="sky" style="stroke:currentColor;stroke-width:1.8;stroke-linejoin:round"/><rect x="230" y="223.0" width="90" height="30" rx="6" class="sky" style="stroke:currentColor;stroke-width:1.8;stroke-linejoin:round"/><rect x="170" y="217.0" width="30" height="24" class="ah" style="fill-opacity:.5"/><rect x="230" y="223.0" width="30" height="24" class="ah" style="fill-opacity:.5"/><text class="t m" x="132" y="230.0" style="font-size:11.5px">30°</text><rect x="110" y="273.0" width="90" height="30" rx="6" class="sky" style="stroke:currentColor;stroke-width:1.8;stroke-linejoin:round"/><rect x="170" y="279.0" width="90" height="30" rx="6" class="sky" style="stroke:currentColor;stroke-width:1.8;stroke-linejoin:round"/><rect x="230" y="285.0" width="90" height="30" rx="6" class="sky" style="stroke:currentColor;stroke-width:1.8;stroke-linejoin:round"/><rect x="170" y="279.0" width="30" height="24" class="ah" style="fill-opacity:.5"/><rect x="230" y="285.0" width="30" height="24" class="ah" style="fill-opacity:.5"/><text class="t m" x="132" y="292.0" style="font-size:11.5px">30°</text><text class="s" x="32" y="175.0" style="font-size:11px">Start at the</text><text class="s" x="32" y="189.0" style="font-size:11px">greatest</text><text class="s" x="32" y="203.0" style="font-size:11px">distance</text><text class="s" x="32" y="299.0" style="font-size:11px">Move inward</text><text class="s" x="32" y="313.0" style="font-size:11px">toward the</text><text class="s" x="32" y="327.0" style="font-size:11px">aircraft</text><path d="M70 211.0L70.0 279.0" class="dk" style="stroke-width:2.5"/><path d="M70 287.0L66.4 279.0L73.6 279.0Z" class="dh" style=""/><text class="s" x="110" y="339.0" style="font-size:11px">Each stop: about 30° wide. Berry = 10° overlap</text><text class="s" x="110" y="353.0" style="font-size:11px">with the previous field of view.</text><rect class="cl" x="436" y="89.0" width="274" height="276" rx="8"/><text class="t" x="448" y="111.0" style="font-size:13px">Off-center viewing</text><circle cx="573" cy="197.0" r="12" class="rose" style="stroke:currentColor;stroke-width:1.8;stroke-linejoin:round"/><circle cx="573" cy="151.0" r="6" class="cl" style="stroke:currentColor;stroke-width:1.5;stroke-linejoin:round"/><path d="M573.0 183.2L573.0 157.9" class="dk" style="stroke-width:1.2;opacity:0.6;stroke-dasharray:6 5"/><circle cx="573" cy="243.0" r="6" class="cl" style="stroke:currentColor;stroke-width:1.5;stroke-linejoin:round"/><path d="M573.0 210.8L573.0 236.1" class="dk" style="stroke-width:1.2;opacity:0.6;stroke-dasharray:6 5"/><circle cx="521" cy="197.0" r="6" class="cl" style="stroke:currentColor;stroke-width:1.5;stroke-linejoin:round"/><path d="M557.4 197.0L528.8 197.0" class="dk" style="stroke-width:1.2;opacity:0.6;stroke-dasharray:6 5"/><circle cx="625" cy="197.0" r="6" class="cl" style="stroke:currentColor;stroke-width:1.5;stroke-linejoin:round"/><path d="M588.6 197.0L617.2 197.0" class="dk" style="stroke-width:1.2;opacity:0.6;stroke-dasharray:6 5"/><text class="s" x="589" y="183.0" style="font-size:11px">object</text><text class="s" x="581" y="145.0" style="font-size:10.5px">10° above</text><text class="s" x="581" y="259.0" style="font-size:10.5px">10° below</text><text class="s e" x="511" y="189.0" style="font-size:10.5px">10°</text><text class="s" x="635" y="189.0" style="font-size:10.5px">10°</text><text class="s" x="448" y="287.0" style="font-size:11.5px">Look 5° to 10° off center so the image</text><text class="s" x="448" y="302.0" style="font-size:11.5px">falls on the rods. Peripheral vision</text><text class="s" x="448" y="317.0" style="font-size:11.5px">keeps contact with the object. Do not</text><text class="s" x="448" y="332.0" style="font-size:11.5px">view an object longer than 2 to 3</text><text class="s" x="448" y="347.0" style="font-size:11.5px">seconds: it can disappear.</text><rect x="20" y="377.0" width="335" height="24" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30" y="394.0" style="font-size:13px">Empty-field myopia</text><circle cx="31" cy="415.0" r="2.2" class="ah"/><text class="s" x="40" y="419.0" style="font-size:11.5px">Occurs above the clouds or in a haze layer with</text><text class="s" x="40" y="434.0" style="font-size:11.5px">nothing specific to focus on outside</text><circle cx="31" cy="449.0" r="2.2" class="ah"/><text class="s" x="40" y="453.0" style="font-size:11.5px">The eyes relax and seek a comfortable focal</text><text class="s" x="40" y="468.0" style="font-size:11.5px">distance that may range from 10 to 30 feet: looking</text><text class="s" x="40" y="483.0" style="font-size:11.5px">without seeing, which is dangerous</text><circle cx="31" cy="498.0" r="2.2" class="ah"/><text class="s" x="40" y="502.0" style="font-size:11.5px">Search out and focus on distant light sources, no</text><text class="s" x="40" y="517.0" style="font-size:11.5px">matter how dim</text><rect x="375" y="377.0" width="335" height="24" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="385" y="394.0" style="font-size:13px">Rules from the text</text><circle cx="386" cy="415.0" r="2.2" class="ah"/><text class="s" x="395" y="419.0" style="font-size:11.5px">No stop should last longer than 2 to 3 seconds;</text><text class="s" x="395" y="434.0" style="font-size:11.5px">stop length depends on the detail required</text><circle cx="386" cy="449.0" r="2.2" class="ah"/><text class="s" x="395" y="453.0" style="font-size:11.5px">With off-center vision, an object viewed longer</text><text class="s" x="395" y="468.0" style="font-size:11.5px">than 2 to 3 seconds disappears (rods reach</text><text class="s" x="395" y="483.0" style="font-size:11.5px">photochemical equilibrium); shift from one</text><text class="s" x="395" y="498.0" style="font-size:11.5px">off-center point to another</text><circle cx="386" cy="513.0" r="2.2" class="ah"/><text class="s" x="395" y="517.0" style="font-size:11.5px">Fatigue, alcohol and drugs lead to staring and</text><text class="s" x="395" y="532.0" style="font-size:11.5px">neglecting scanning</text></svg>
