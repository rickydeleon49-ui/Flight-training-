<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 563" role="img" aria-labelledby="ti de"><title id="ti">Night scanning, off-center viewing, empty-field myopia</title><desc id="de">Scan from right to left or left to right, starting at the greatest distance (top) and moving inward toward the aircraft (bottom). Each stop covers about 30 degrees, lasts no longer than 2 to 3 seconds, and overlaps the previous view by 10 degrees. Off-center viewing: look 10 degrees above, below or to either side of an object, so peripheral vision keeps contact; an object viewed longer than 2 to 3 seconds disappears. Empty-field myopia: above clouds or haze the eyes relax to a focal distance of 10 to 30 feet; focus on distant light sources.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11.5px}.q1{stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}.q2{font-size:11px}.q3{font-size:13px}.q4{fill-opacity:.5}.q5{stroke:currentColor;stroke-width:1.5;stroke-linejoin:round}.q6{stroke-width:1.2;opacity:0.6;stroke-dasharray:6 5}.q7{font-size:10.5px}.q8{stroke:currentColor;stroke-width:1.5}</style><text class="t" x="20" y="28" style="font-size:15px">Night scanning, off-center viewing, empty-field myopia</text><text class="s q3" x="20" y="50">Scanning is very important in identifying objects at night. The rods in the peripheral field must be</text><text class="s q3" x="20" y="66.5">exposed to the image, and the eyes need something to focus on.</text><rect class="cl" x="20" y="89" width="400" height="276" rx="8"/><text class="t q3" x="32" y="111">Scan pattern</text><text class="s q0" x="32" y="129">Right to left or left to right</text><rect x="110" y="149" width="90" height="30" rx="6" class="sky q1"/><rect x="170" y="155" width="90" height="30" rx="6" class="sky q1"/><rect x="230" y="161" width="90" height="30" rx="6" class="sky q1"/><rect x="170" y="155" width="30" height="24" class="ah q4"/><rect x="230" y="161" width="30" height="24" class="ah q4"/><text class="t m q0" x="132" y="168">30°</text><rect x="110" y="211" width="90" height="30" rx="6" class="sky q1"/><rect x="170" y="217" width="90" height="30" rx="6" class="sky q1"/><rect x="230" y="223" width="90" height="30" rx="6" class="sky q1"/><rect x="170" y="217" width="30" height="24" class="ah q4"/><rect x="230" y="223" width="30" height="24" class="ah q4"/><text class="t m q0" x="132" y="230">30°</text><rect x="110" y="273" width="90" height="30" rx="6" class="sky q1"/><rect x="170" y="279" width="90" height="30" rx="6" class="sky q1"/><rect x="230" y="285" width="90" height="30" rx="6" class="sky q1"/><rect x="170" y="279" width="30" height="24" class="ah q4"/><rect x="230" y="285" width="30" height="24" class="ah q4"/><text class="t m q0" x="132" y="292">30°</text><text class="s q2" x="32" y="175">Start at the</text><text class="s q2" x="32" y="189">greatest</text><text class="s q2" x="32" y="203">distance</text><text class="s q2" x="32" y="299">Move inward</text><text class="s q2" x="32" y="313">toward the</text><text class="s q2" x="32" y="327">aircraft</text><path d="M70 211L70 279" class="dk" style="stroke-width:2.5"/><path d="M70 287L66.4 279L73.6 279Z" class="dh" style=""/><text class="s q2" x="110" y="339">Each stop: about 30° wide. Berry = 10° overlap</text><text class="s q2" x="110" y="353">with the previous field of view.</text><rect class="cl" x="436" y="89" width="274" height="276" rx="8"/><text class="t q3" x="448" y="111">Off-center viewing</text><circle cx="573" cy="197" r="12" class="rose q1"/><circle cx="573" cy="151" r="6" class="cl q5"/><path d="M573 183.2L573 157.9" class="dk q6"/><circle cx="573" cy="243" r="6" class="cl q5"/><path d="M573 210.8L573 236.1" class="dk q6"/><circle cx="521" cy="197" r="6" class="cl q5"/><path d="M557.4 197L528.8 197" class="dk q6"/><circle cx="625" cy="197" r="6" class="cl q5"/><path d="M588.6 197L617.2 197" class="dk q6"/><text class="s q2" x="589" y="183">object</text><text class="s q7" x="581" y="145">10° above</text><text class="s q7" x="581" y="259">10° below</text><text class="s e q7" x="511" y="189">10°</text><text class="s q7" x="635" y="189">10°</text><text class="s q0" x="448" y="287">Look 5° to 10° off center so the image</text><text class="s q0" x="448" y="302">falls on the rods. Peripheral vision</text><text class="s q0" x="448" y="317">keeps contact with the object. Do not</text><text class="s q0" x="448" y="332">view an object longer than 2 to 3</text><text class="s q0" x="448" y="347">seconds: it can disappear.</text><rect x="20" y="377" width="335" height="24" rx="10" class="lav q8"/><text class="t q3" x="30" y="394">Empty-field myopia</text><circle cx="31" cy="415" r="2.2" class="ah"/><text class="s q0" x="40" y="419">Occurs above the clouds or in a haze layer with</text><text class="s q0" x="40" y="434">nothing specific to focus on outside</text><circle cx="31" cy="449" r="2.2" class="ah"/><text class="s q0" x="40" y="453">The eyes relax and seek a comfortable focal</text><text class="s q0" x="40" y="468">distance that may range from 10 to 30 feet: looking</text><text class="s q0" x="40" y="483">without seeing, which is dangerous</text><circle cx="31" cy="498" r="2.2" class="ah"/><text class="s q0" x="40" y="502">Search out and focus on distant light sources, no</text><text class="s q0" x="40" y="517">matter how dim</text><rect x="375" y="377" width="335" height="24" rx="10" class="mint q8"/><text class="t q3" x="385" y="394">Rules from the text</text><circle cx="386" cy="415" r="2.2" class="ah"/><text class="s q0" x="395" y="419">No stop should last longer than 2 to 3 seconds;</text><text class="s q0" x="395" y="434">stop length depends on the detail required</text><circle cx="386" cy="449" r="2.2" class="ah"/><text class="s q0" x="395" y="453">With off-center vision, an object viewed longer</text><text class="s q0" x="395" y="468">than 2 to 3 seconds disappears (rods reach</text><text class="s q0" x="395" y="483">photochemical equilibrium); shift from one</text><text class="s q0" x="395" y="498">off-center point to another</text><circle cx="386" cy="513" r="2.2" class="ah"/><text class="s q0" x="395" y="517">Fatigue, alcohol and drugs lead to staring and</text><text class="s q0" x="395" y="532">neglecting scanning</text></svg>
