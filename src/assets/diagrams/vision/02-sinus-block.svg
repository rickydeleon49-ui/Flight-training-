<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 596" role="img" aria-labelledby="ti de"><title id="ti">Sinus block</title><desc id="de">Front view of a face with the frontal sinuses above each eyebrow and the maxillary sinuses in each upper cheek. Sinus pressure equalizes through small openings to the nasal passages; a cold, sinusitis or nasal allergy can plug the opening. A sinus block occurs most frequently during descent and gives excruciating pain over the sinus area, possibly aching upper teeth and bloody mucus. Slow descent rates reduce pain. Do not fly with an upper respiratory infection or nasal allergy; decongestants are not adequate protection. See a physician if it does not clear after landing.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:12px}.q1{stroke:currentColor;stroke-width:1.4;stroke-linejoin:round}.q2{font-size:13px}.q3{font-size:11.5px}.q4{stroke:currentColor;stroke-width:1.5}.q5{stroke-width:1;opacity:0.7}.q6{stroke-width:3;opacity:1}.q7{stroke-width:2.5;opacity:0.9}</style><text class="t" x="20" y="28" style="font-size:15px">Sinus block</text><text class="s q2" x="20" y="50">Air pressure in the sinuses equalizes with the pressure in the flight deck through small openings that</text><text class="s q2" x="20" y="66.5">connect the sinuses to the nasal passages.</text><rect class="cl" x="20" y="89" width="300" height="306" rx="8"/><ellipse cx="170" cy="239" rx="82" ry="108" class="cl" style="stroke:currentColor;stroke-width:1.8;stroke-linejoin:round"/><ellipse cx="136" cy="227" rx="12" ry="7" class="cl q1"/><path d="M114 207L158 207" class="dk q6"/><path d="M106 187Q136 173 166 187L164 201L108 201Z" class="mint q1"/><path d="M102 259Q136 249 166 265Q136 299 102 285Z" class="rose q1"/><ellipse cx="204" cy="227" rx="12" ry="7" class="cl q1"/><path d="M182 207L226 207" class="dk q6"/><path d="M174 187Q204 173 234 187L232 201L176 201Z" class="mint q1"/><path d="M170 259Q204 249 234 265Q204 299 170 285Z" class="rose q1"/><path d="M170 227L162 271" class="dk q7"/><path d="M162 271L178 271" class="dk q7"/><path d="M144 321Q170 337 196 321" class="dk" style="stroke-width:2.5;opacity:.8"/><text class="t m q3" x="170" y="119">Frontal sinus (above each eyebrow)</text><path d="M136 125L136 179" class="dk q5"/><path d="M204 125L204 179" class="dk q5"/><text class="t m q3" x="170" y="367">Maxillary sinus (each upper cheek)</text><path d="M110 353L122 295" class="dk q5"/><path d="M230 353L218 295" class="dk q5"/><text class="s m" x="170" y="383" style="font-size:10.5px">Front view, schematic</text><text class="t q2" x="340" y="105">Why the block forms</text><rect x="340" y="117" width="120" height="30" rx="10" class="lav q4"/><text class="t m q3" x="400" y="137">Sinus</text><rect x="478" y="117" width="100" height="30" rx="10" class="rose q4"/><text class="t m q3" x="528" y="137">Small opening</text><rect x="590" y="117" width="120" height="30" rx="10" class="sky q4"/><text class="t m q3" x="650" y="137">Nasal passages</text><path d="M462 132L470 132" class="dk" style="stroke-width:2"/><path d="M476 132L470 134.7L470 129.3Z" class="dh" style=""/><path d="M580 132L582 132" class="dk" style="stroke-width:2"/><path d="M588 132L582 134.7L582 129.3Z" class="dh" style=""/><text class="s q0" x="340" y="169">An upper respiratory infection (cold or sinusitis) or a</text><text class="s q0" x="340" y="184.5">nasal allergic condition can produce enough congestion</text><text class="s q0" x="340" y="200">around an opening to slow equalization. As the pressure</text><text class="s q0" x="340" y="215.5">difference grows, congestion may plug the opening. This is</text><text class="s q0" x="340" y="231">a "sinus block".</text><rect x="340" y="254.5" width="370" height="24" rx="10" class="rose q4"/><text class="t q2" x="350" y="271.5">Signs</text><circle cx="351" cy="292.5" r="2.2" class="ah"/><text class="s q0" x="360" y="296.5">Occurs most frequently during descent</text><circle cx="351" cy="312" r="2.2" class="ah"/><text class="s q0" x="360" y="316">Usually excruciating pain over the sinus area</text><circle cx="351" cy="331.5" r="2.2" class="ah"/><text class="s q0" x="360" y="335.5">A maxillary sinus block can also make the upper teeth</text><text class="s q0" x="360" y="351">ache</text><circle cx="351" cy="366.5" r="2.2" class="ah"/><text class="s q0" x="360" y="370.5">Bloody mucus may discharge from the nasal passages</text><rect x="340" y="398" width="370" height="24" rx="10" class="mint q4"/><text class="t q2" x="350" y="415">What the text says</text><circle cx="351" cy="436" r="2.2" class="ah"/><text class="s q0" x="360" y="440">Slow descent rates can reduce the associated pain</text><circle cx="351" cy="455.5" r="2.2" class="ah"/><text class="s q0" x="360" y="459.5">Avoid by not flying with an upper respiratory</text><text class="s q0" x="360" y="475">infection or nasal allergic condition</text><circle cx="351" cy="490.5" r="2.2" class="ah"/><text class="s q0" x="360" y="494.5">Decongestant sprays or drops usually do not give</text><text class="s q0" x="360" y="510">adequate protection; oral decongestants have side</text><text class="s q0" x="360" y="525.5">effects that can impair pilot performance</text><circle cx="351" cy="541" r="2.2" class="ah"/><text class="s q0" x="360" y="545">If a block does not clear shortly after landing,</text><text class="s q0" x="360" y="560.5">consult a physician</text></svg>
