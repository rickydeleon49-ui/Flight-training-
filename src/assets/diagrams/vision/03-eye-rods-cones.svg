<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 667" role="img" aria-labelledby="ti de"><title id="ti">The eye: rods, cones and the blind spot</title><desc id="de">Cross section of the eye showing the cornea, lens, retina, fovea and the optic disk where the optic nerve leaves. Cones give all color vision and fine detail in bright light and are concentrated at the fovea; rods detect movement and give dim-light vision but cannot see color and take longer to adapt to the dark. The three types of vision are photopic, mesopic and scotopic (20/200 or less). The optic disk has no cones or rods and is each eye's blind spot; an obstruction such as a windshield divider could hide a target.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><text class="t" x="20" y="28" style="font-size:15px">The eye: rods, cones and the blind spot</text><text class="s" x="20" y="50.0" style="font-size:13px">The eye functions much like a camera: light enters through the cornea at the front, travels through</text><text class="s" x="20" y="66.5" style="font-size:13px">the lens, and falls on the retina. Light sensitive cells there turn light energy into electrical</text><text class="s" x="20" y="83.0" style="font-size:13px">impulses that travel through nerves to the brain.</text><rect class="cl" x="20" y="103.5" width="330" height="260" rx="8"/><circle cx="178" cy="233.5" r="92" class="cl" style="stroke:currentColor;stroke-width:2;stroke-linejoin:round"/><path d="M80 203.5Q60 233.5 80 263.5" class="dk" style="stroke-width:3"/><ellipse cx="126" cy="233.5" rx="10" ry="26" class="lav" style="stroke:currentColor;stroke-width:1.8;stroke-linejoin:round"/><path d="M224 154A92 92 0 0 1 224 313" class="acc" style="stroke-width:5"/><path d="M126 233.5L268 233.5" class="dk" style="stroke-width:1.2;opacity:0.6;stroke-dasharray:6 5"/><circle cx="268" cy="233.5" r="6" class="ah"/><circle cx="266" cy="269.5" r="8" class="mint" style="stroke:currentColor;stroke-width:1.8;stroke-linejoin:round"/><path d="M273 269.5L292 273.5" class="dk" style="stroke-width:7;opacity:.5"/><text class="t m" x="52" y="181.5" style="font-size:11.5px">Cornea</text><path d="M52 189.5L70 215.5" class="dk" style="stroke-width:1;opacity:0.7"/><text class="t m" x="126" y="181.5" style="font-size:11.5px">Lens</text><path d="M126 188.5L126 203.5" class="dk" style="stroke-width:1;opacity:0.7"/><text class="t" x="278" y="171.5" style="font-size:11.5px">Retina</text><path d="M276 167.5L243.05 168.45" class="dk" style="stroke-width:1;opacity:0.7"/><text class="t" x="192" y="225.5" style="font-size:11.5px">Fovea</text><path d="M224 229.5L262 232.5" class="dk" style="stroke-width:1;opacity:0.7"/><text class="t" x="278" y="301.5" style="font-size:11.5px">Optic disk</text><path d="M276 297.5L266 277.5" class="dk" style="stroke-width:1;opacity:0.7"/><text class="s" x="278" y="317.5" style="font-size:10.5px">(to the brain)</text><text class="s" x="32" y="351.5" style="font-size:10.5px">Schematic cross section; berry arc = retina</text><rect x="366" y="103.5" width="167" height="24" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="449" y="120.5" style="font-size:13px">Cones</text><rect x="543" y="103.5" width="167" height="24" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="626" y="120.5" style="font-size:13px">Rods</text><circle cx="373" cy="143.5" r="2.2" class="ah"/><text class="s" x="382" y="147.5" style="font-size:11.5px">All color vision</text><circle cx="373" cy="162.5" r="2.2" class="ah"/><text class="s" x="382" y="166.5" style="font-size:11.5px">Best for fine detail and</text><text class="s" x="382" y="181.5" style="font-size:11.5px">color in high light</text><text class="s" x="382" y="196.5" style="font-size:11.5px">levels</text><circle cx="373" cy="211.5" r="2.2" class="ah"/><text class="s" x="382" y="215.5" style="font-size:11.5px">Concentrated toward the</text><text class="s" x="382" y="230.5" style="font-size:11.5px">center of the field of</text><text class="s" x="382" y="245.5" style="font-size:11.5px">vision; in the fovea</text><text class="s" x="382" y="260.5" style="font-size:11.5px">almost all the light</text><text class="s" x="382" y="275.5" style="font-size:11.5px">sensing cells are cones</text><circle cx="373" cy="290.5" r="2.2" class="ah"/><text class="s" x="382" y="294.5" style="font-size:11.5px">Adapt rapidly to changes</text><text class="s" x="382" y="309.5" style="font-size:11.5px">in light intensity</text><circle cx="550" cy="143.5" r="2.2" class="ah"/><text class="s" x="559" y="147.5" style="font-size:11.5px">Better able to detect</text><text class="s" x="559" y="162.5" style="font-size:11.5px">movement and give vision</text><text class="s" x="559" y="177.5" style="font-size:11.5px">in dim light</text><circle cx="550" cy="192.5" r="2.2" class="ah"/><text class="s" x="559" y="196.5" style="font-size:11.5px">Cannot discern color,</text><text class="s" x="559" y="211.5" style="font-size:11.5px">but very sensitive at</text><text class="s" x="559" y="226.5" style="font-size:11.5px">low light levels</text><circle cx="550" cy="241.5" r="2.2" class="ah"/><text class="s" x="559" y="245.5" style="font-size:11.5px">A large amount of light</text><text class="s" x="559" y="260.5" style="font-size:11.5px">overwhelms them; they</text><text class="s" x="559" y="275.5" style="font-size:11.5px">take longer to "reset"</text><text class="s" x="559" y="290.5" style="font-size:11.5px">and adapt to the dark</text><text class="s" x="559" y="305.5" style="font-size:11.5px">again</text><circle cx="550" cy="320.5" r="2.2" class="ah"/><text class="s" x="559" y="324.5" style="font-size:11.5px">Farther from the fovea</text><text class="s" x="559" y="339.5" style="font-size:11.5px">they are more numerous</text><text class="s" x="559" y="354.5" style="font-size:11.5px">and give the major</text><text class="s" x="559" y="369.5" style="font-size:11.5px">portion of night vision</text><text class="t" x="20" y="410.5" style="font-size:14px">Three types of vision</text><rect x="20" y="420.5" width="226" height="24" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="133" y="437.5" style="font-size:13px">Photopic</text><text class="s" x="24" y="460.5" style="font-size:11.5px">Color and fine detail (20/20 or</text><text class="s" x="24" y="475.5" style="font-size:11.5px">better); only in good illumination,</text><text class="s" x="24" y="490.5" style="font-size:11.5px">daylight or high artificial light.</text><text class="s" x="24" y="505.5" style="font-size:11.5px">Cones in the fovea; the high light</text><text class="s" x="24" y="520.5" style="font-size:11.5px">level bleaches rhodopsin so rods are</text><text class="s" x="24" y="535.5" style="font-size:11.5px">less effective.</text><rect x="252" y="420.5" width="226" height="24" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="365" y="437.5" style="font-size:13px">Mesopic</text><text class="s" x="256" y="460.5" style="font-size:11.5px">Rods and cones together, at dawn,</text><text class="s" x="256" y="475.5" style="font-size:11.5px">dusk and full moonlight. Acuity</text><text class="s" x="256" y="490.5" style="font-size:11.5px">steadily decreases and color</text><text class="s" x="256" y="505.5" style="font-size:11.5px">perception changes. Considered the</text><text class="s" x="256" y="520.5" style="font-size:11.5px">most dangerous period for viewing:</text><text class="s" x="256" y="535.5" style="font-size:11.5px">use off-center vision and proper</text><text class="s" x="256" y="550.5" style="font-size:11.5px">scanning.</text><rect x="484" y="420.5" width="226" height="24" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="597" y="437.5" style="font-size:13px">Scotopic</text><text class="s" x="488" y="460.5" style="font-size:11.5px">Low light; cones become ineffective,</text><text class="s" x="488" y="475.5" style="font-size:11.5px">so poor resolution of detail. Acuity</text><text class="s" x="488" y="490.5" style="font-size:11.5px">20/200 or less (stand at 20 feet to</text><text class="s" x="488" y="505.5" style="font-size:11.5px">see what is normally seen at 200</text><text class="s" x="488" y="520.5" style="font-size:11.5px">feet). Color is lost and a night</text><text class="s" x="488" y="535.5" style="font-size:11.5px">blind spot appears in the central</text><text class="s" x="488" y="550.5" style="font-size:11.5px">field of view.</text><rect class="cl" x="20" y="571.5" width="690" height="70" rx="8"/><text class="s" x="32" y="591.5" style="font-size:12px">Central blind spot: the optic disk, where the optic nerve joins the retina, has a total absence of cones</text><text class="s" x="32" y="607.0" style="font-size:12px">and rods, so each eye is completely blind there. With both eyes it is not a problem, since an object</text><text class="s" x="32" y="622.5" style="font-size:12px">cannot be in the blind spot of both eyes at the same time. But if one eye's view is obstructed (windshield</text><text class="s" x="32" y="638.0" style="font-size:12px">divider or another aircraft), a target could fall in the blind spot of the other eye and go undetected.</text></svg>
