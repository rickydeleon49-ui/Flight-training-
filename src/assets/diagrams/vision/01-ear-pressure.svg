<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 636" role="img" aria-labelledby="ti de"><title id="ti">Ears and pressure: climb versus descent</title><desc id="de">Two cross-section sketches of the ear. Climb: middle ear pressure may exceed the pressure in the external ear canal and the eardrum bulges outward, with alternating fullness and clearing. Descent: the middle ear is at lower pressure than the external canal and the eardrum bulges inward, which is harder to relieve because the partial vacuum constricts the Eustachian tube. Remedy: pinch the nostrils shut, close the mouth and lips, and blow slowly and gently. It may not be possible to equalize with a cold, ear infection or sore throat.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><text class="t" x="20" y="28" style="font-size:15px">Ears and pressure: climb versus descent</text><text class="s" x="20" y="50.0" style="font-size:13px">The eardrum closes the middle ear off from the external ear canal. The Eustachian tube, from each ear</text><text class="s" x="20" y="66.5" style="font-size:13px">to the back of the throat, is usually closed but opens during chewing, yawning, or swallowing to</text><text class="s" x="20" y="83.0" style="font-size:13px">equalize pressure.</text><rect class="cl" x="20" y="105.5" width="335" height="282" rx="8"/><rect x="34" y="165.5" width="100" height="46" class="sky" style="stroke:currentColor;stroke-width:1.8;stroke-linejoin:round"/><text class="t" x="34" y="145.5" style="font-size:11px">External ear canal</text><rect x="134" y="155.5" width="170" height="68" rx="16" class="lav" style="stroke:currentColor;stroke-width:1.8;stroke-linejoin:round"/><text class="t m" x="230" y="145.5" style="font-size:11.5px">Middle ear</text><path d="M134 161.5Q118 188.5 134 215.5" class="acc"/><text class="t m" x="134" y="243.5" style="font-size:11.5px">Eardrum</text><path d="M134 223.5L134 231.5" class="dk" style="stroke-width:1;opacity:0.7"/><path d="M270 223.5L290 281.5" class="dk" style="stroke-width:9;opacity:.45"/><text class="s m" x="282" y="301.5" style="font-size:11px">Eustachian tube</text><text class="s m" x="282" y="314.5" style="font-size:11px">to the throat</text><path d="M210 189.5L159.0 189.5" class="acc" style="stroke-width:3"/><path d="M150 189.5L159.0 185.4L159.0 193.6Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><text class="s m" x="219" y="209.5" style="font-size:11px">higher pressure</text><rect class="cl" x="375" y="105.5" width="335" height="282" rx="8"/><rect x="389" y="165.5" width="100" height="46" class="sky" style="stroke:currentColor;stroke-width:1.8;stroke-linejoin:round"/><text class="t" x="389" y="145.5" style="font-size:11px">External ear canal</text><rect x="489" y="155.5" width="170" height="68" rx="16" class="lav" style="stroke:currentColor;stroke-width:1.8;stroke-linejoin:round"/><text class="t m" x="585" y="145.5" style="font-size:11.5px">Middle ear</text><path d="M489 161.5Q505 188.5 489 215.5" class="acc"/><text class="t m" x="489" y="243.5" style="font-size:11.5px">Eardrum</text><path d="M489 223.5L489 231.5" class="dk" style="stroke-width:1;opacity:0.7"/><path d="M625 223.5L645 281.5" class="dk" style="stroke-width:9;opacity:.45"/><text class="s m" x="637" y="301.5" style="font-size:11px">Eustachian tube</text><text class="s m" x="637" y="314.5" style="font-size:11px">to the throat</text><path d="M405 189.5L454.0 189.5" class="acc" style="stroke-width:3"/><path d="M463 189.5L454.0 193.6L454.0 185.4Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><text class="s m" x="439" y="205.5" style="font-size:10.5px">higher pressure</text><text class="s m" x="574" y="209.5" style="font-size:11px">lower pressure</text><text class="t" x="32" y="337.5" style="font-size:13px">CLIMB</text><text class="t" x="387" y="337.5" style="font-size:13px">DESCENT</text><text class="s" x="32" y="351.5" style="font-size:11.5px">Middle ear pressure may exceed the pressure in the</text><text class="s" x="32" y="366.5" style="font-size:11.5px">external ear canal, so the eardrum bulges outward.</text><text class="s" x="387" y="351.5" style="font-size:11.5px">The middle ear (equalized at altitude) is at lower</text><text class="s" x="387" y="366.5" style="font-size:11.5px">pressure than the external canal, so the eardrum</text><text class="s" x="387" y="381.5" style="font-size:11.5px">bulges inward.</text><rect x="20" y="405.5" width="335" height="24" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30" y="422.5" style="font-size:13px">What you feel</text><circle cx="31" cy="443.5" r="2.2" class="ah"/><text class="s" x="40" y="447.5" style="font-size:12px">Climb: alternate sensations of "fullness" and</text><text class="s" x="40" y="463.0" style="font-size:12px">"clearing"</text><circle cx="31" cy="478.5" r="2.2" class="ah"/><text class="s" x="40" y="482.5" style="font-size:12px">Descent: often painful and harder to relieve; the</text><text class="s" x="40" y="498.0" style="font-size:12px">partial vacuum tends to constrict the walls of</text><text class="s" x="40" y="513.5" style="font-size:12px">the Eustachian tube</text><circle cx="31" cy="529.0" r="2.2" class="ah"/><text class="s" x="40" y="533.0" style="font-size:12px">A temporary reduction in the ability to hear</text><rect x="375" y="405.5" width="335" height="24" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="385" y="422.5" style="font-size:13px">What the text says to do</text><circle cx="386" cy="443.5" r="2.2" class="ah"/><text class="s" x="395" y="447.5" style="font-size:12px">Pinch the nostrils shut, close the mouth and</text><text class="s" x="395" y="463.0" style="font-size:12px">lips, and blow slowly and gently into the mouth</text><text class="s" x="395" y="478.5" style="font-size:12px">and nose; this forces air through the Eustachian</text><text class="s" x="395" y="494.0" style="font-size:12px">tube into the middle ear</text><circle cx="386" cy="509.5" r="2.2" class="ah"/><text class="s" x="395" y="513.5" style="font-size:12px">Minor congestion: nose drops or nasal sprays may</text><text class="s" x="395" y="529.0" style="font-size:12px">reduce the risk; check with an AME before using</text><text class="s" x="395" y="544.5" style="font-size:12px">any medication</text><rect class="cl" x="20" y="568.0" width="690" height="54" rx="8"/><text class="s" x="32" y="588.0" style="font-size:12.5px">It may not be possible to equalize the ears with a cold, an ear infection, or sore throat. A flight in</text><text class="s" x="32" y="604.0" style="font-size:12.5px">this condition can be extremely painful, as well as damaging to the eardrums.</text></svg>
