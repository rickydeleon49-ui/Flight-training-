<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 512" role="img" aria-labelledby="ti de"><title id="ti">Reading TO or FROM from where you are</title><desc id="de">Top view of a VOR station with the omni-bearing selector set to course 360. An aircraft south of the station sees a TO flag, because flying course 360 would take it toward the station. An aircraft north of the station sees a FROM flag. Abeam the station, to the east or west, the flag changes between TO and FROM. The flag depends on the course set and the position of the aircraft, not on its heading. Example numbers only.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:var(--diagram-text-opacity,.85)}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:var(--diagram-fill-opacity,.6)}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:var(--diagram-fill-opacity,.6)}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:var(--diagram-fill-opacity,.6)}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:var(--diagram-fill-opacity,.6)}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:12px}.q1{font-size:11px}.q2{stroke:currentColor;stroke-width:1.5}.q3{font-size:13px}.q4{stroke-width:1.2;opacity:0.7}.q5{font-size:12.5px}.q6{stroke-width:1.4;opacity:0.8}.x1{font-size:12.5px}.x2{font-size:13px}.x3{stroke:currentColor;stroke-width:1.5}.th{fill:currentColor;fill-opacity:.12}.big{font-size:20px}.q7{stroke-width:1.8;opacity:.6}</style><text class="t" x="20" y="28" style="font-size:15px">Reading TO or FROM from where you are</text><text class="s x2" x="20" y="50">VOR receiver. Your position decides TO or FROM for the course you set.</text><rect x="20" y="70" width="340" height="360" rx="10" class="sky x3"/><path d="M190 105L190 395" class="o d q7"/><path d="M50 250L330 250" class="o d q7"/><text class="t x1 m" x="190" y="92">Course set on the selector: 360</text><path d="M175 250L182 238L198 238L205 250L198 262L182 262Z" class="th x3"/><circle cx="190" cy="250" r="3" class="dh"/><text class="t x1" x="210" y="236">Station</text><circle cx="190" cy="340" r="7" class="dh"/><text class="t x1" x="206" y="336">A: south</text><text class="s x1" x="206" y="354">flag shows TO</text><circle cx="190" cy="160" r="7" class="dh"/><text class="t x1" x="206" y="156">B: north</text><text class="s x1" x="206" y="174">flag shows FROM</text><circle cx="75" cy="250" r="7" class="dh"/><text class="t x1 m" x="75" y="280">C: west</text><circle cx="305" cy="250" r="7" class="dh"/><text class="t x1 m" x="305" y="280">D: east</text><text class="s x1 m" x="190" y="418">Abeam (C or D): the flag changes</text><path d="M335 380L335 140" class="acc"/><path d="M335 124L326 146L344 146Z" class="ah"/><text class="t x1 m" x="335" y="114">360</text><rect x="380" y="70" width="330" height="82" rx="10" class="mint x3"/><text class="t x2" x="395" y="92">1. Set the course (OBS)</text><text class="s x1" x="395" y="112">Turn the omni-bearing selector to the</text><text class="s x1" x="395" y="128">course you want, here 360 (north).</text><rect x="380" y="162" width="330" height="82" rx="10" class="sky x3"/><text class="t x2" x="395" y="184">2. South of the station: TO</text><text class="s x1" x="395" y="204">Flying course 360 from here would</text><text class="s x1" x="395" y="220">take you toward the station.</text><rect x="380" y="254" width="330" height="82" rx="10" class="lav x3"/><text class="t x2" x="395" y="276">3. North of the station: FROM</text><text class="s x1" x="395" y="296">Flying course 360 from here would</text><text class="s x1" x="395" y="312">take you away from the station.</text><rect x="380" y="346" width="330" height="84" rx="10" class="rose x3"/><text class="t x2" x="395" y="368">4. Abeam the station</text><text class="s x1" x="395" y="388">Near the dashed line the flag changes</text><text class="s x1" x="395" y="404">between TO and FROM.</text><rect class="cl" x="20" y="446" width="690" height="70" rx="8"/><circle cx="35" cy="468" r="2.2" class="ah"/><text class="s x2" x="44" y="472">TO or FROM depends on the course you set and where you are, not on heading.</text><circle cx="35" cy="500" r="2.2" class="ah"/><text class="s x2" x="44" y="504">Turn the selector to the opposite course and TO and FROM swap.</text></svg>
