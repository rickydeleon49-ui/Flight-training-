<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 512" role="img" aria-labelledby="ti de"><title id="ti">DME shows slant range, not ground distance</title><desc id="de">A side view with a VOR-DME station on the ground and an aircraft above it. A dashed line along the ground is the ground distance and a dashed vertical line is the height above the station. The solid slanted line is the slant range, which is what the DME shows. The error is largest when close to the station and high up, and negligible when one mile or more from the station for each 1,000 feet above it. DME groundspeed is only right when flying directly to or from the station. Example numbers only.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:var(--diagram-text-opacity,.85)}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:var(--diagram-fill-opacity,.6)}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:var(--diagram-fill-opacity,.6)}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:var(--diagram-fill-opacity,.6)}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:var(--diagram-fill-opacity,.6)}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:12px}.q1{font-size:11px}.q2{stroke:currentColor;stroke-width:1.5}.q3{font-size:13px}.q4{stroke-width:1.2;opacity:0.7}.q5{font-size:12.5px}.q6{stroke-width:1.4;opacity:0.8}.x1{font-size:12.5px}.x2{font-size:13px}.x3{stroke:currentColor;stroke-width:1.5}.th{fill:currentColor;fill-opacity:.12}.big{font-size:20px}.q7{stroke-width:1.8;opacity:.6}</style><text class="t" x="20" y="28" style="font-size:15px">DME shows slant range, not ground distance</text><text class="s x2" x="20" y="50">DME measures in a straight line from you to the station, in nautical miles.</text><rect x="20" y="70" width="340" height="360" rx="10" class="sky x3"/><path d="M40 330L340 330" class="dk"/><path d="M55 318L62 306L78 306L85 318L78 330L62 330Z" class="th x3"/><circle cx="70" cy="318" r="3" class="dh"/><path d="M70 318L290 140" class="acc"/><path d="M276 140L304 140M290 132L290 148M284 148L296 148" class="dk"/><path d="M290 150L290 330" class="o d q7"/><path d="M70 330L290 330" class="o d q7"/><text class="t x1 m" x="70" y="356">Station</text><text class="s x1 m" x="180" y="356">Ground distance</text><text class="s x1" x="298" y="246">Height</text><text class="s x1" x="298" y="262">above the</text><text class="s x1" x="298" y="278">station</text><text class="t x1" x="60" y="150">Slant range:</text><text class="s x1" x="60" y="166">what DME shows</text><text class="t x1 m" x="190" y="92">Side view</text><rect x="380" y="70" width="330" height="82" rx="10" class="mint x3"/><text class="t x2" x="395" y="92">DME shows slant range</text><text class="s x1" x="395" y="112">It is the straight-line distance to the</text><text class="s x1" x="395" y="128">station, not the distance over the ground.</text><rect x="380" y="162" width="330" height="82" rx="10" class="sky x3"/><text class="t x2" x="395" y="184">Error is largest close and high</text><text class="s x1" x="395" y="204">Directly over a station the display shows</text><text class="s x1" x="395" y="220">your height in miles, not zero.</text><rect x="380" y="254" width="330" height="82" rx="10" class="lav x3"/><text class="t x2" x="395" y="276">Small error when you are farther out</text><text class="s x1" x="395" y="296">Negligible when you are 1 mile or more</text><text class="s x1" x="395" y="312">away for each 1,000 feet above the station.</text><rect x="380" y="346" width="330" height="84" rx="10" class="rose x3"/><text class="t x2" x="395" y="368">Groundspeed on the DME</text><text class="s x1" x="395" y="388">It is only right when you fly directly to</text><text class="s x1" x="395" y="404">or from the station.</text><rect class="cl" x="20" y="446" width="690" height="70" rx="8"/><circle cx="35" cy="468" r="2.2" class="ah"/><text class="s x2" x="44" y="472">Example: at 6,000 feet above a station, overhead the DME reads about 1 NM.</text><circle cx="35" cy="500" r="2.2" class="ah"/><text class="s x2" x="44" y="504">Far from the station, slant range and ground distance are nearly the same.</text></svg>
