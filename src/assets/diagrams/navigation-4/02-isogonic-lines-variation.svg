<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 512" role="img" aria-labelledby="ti de"><title id="ti">Isogonic lines: variation on the chart</title><desc id="de">A schematic chart with dashed isogonic lines, each joining places with the same magnetic variation. The agonic line, shown solid, has zero variation, so true north and magnetic north agree. West of the agonic line the variation is east, with magnetic north east of true north, so from true to magnetic you subtract. East of the line the variation is west, so you add. Variation changes from place to place and slowly over the years. Example numbers only.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:var(--diagram-text-opacity,.85)}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:var(--diagram-fill-opacity,.6)}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:var(--diagram-fill-opacity,.6)}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:var(--diagram-fill-opacity,.6)}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:var(--diagram-fill-opacity,.6)}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:12px}.q1{font-size:11px}.q2{stroke:currentColor;stroke-width:1.5}.q3{font-size:13px}.q4{stroke-width:1.2;opacity:0.7}.q5{font-size:12.5px}.q6{stroke-width:1.4;opacity:0.8}.x1{font-size:12.5px}.x2{font-size:13px}.x3{stroke:currentColor;stroke-width:1.5}.th{fill:currentColor;fill-opacity:.12}.big{font-size:20px}.q7{stroke-width:1.8;opacity:.6}.q8{stroke-dasharray:10 8}</style><text class="t" x="20" y="28" style="font-size:15px">Isogonic lines: variation on the chart</text><text class="s x2" x="20" y="50">Variation is not the same everywhere. Read it near your route.</text><rect x="20" y="70" width="340" height="360" rx="10" class="sky x3"/><path d="M80 100C70 190 90 270 75 400" class="acc q8"/><path d="M140 100C130 190 150 270 135 400" class="acc q8"/><path d="M200 100C190 190 210 270 195 400" class="dk"/><path d="M260 100C250 190 270 270 255 400" class="acc q8"/><path d="M320 100C310 190 330 270 315 400" class="acc q8"/><text class="t x1 m" x="80" y="92">10°E</text><text class="t x1 m" x="140" y="92">5°E</text><text class="t x1 m" x="200" y="92">0° agonic</text><text class="t x1 m" x="260" y="92">5°W</text><text class="t x1 m" x="320" y="92">10°W</text><text class="s x1 m" x="190" y="416">Example numbers, not a real map</text><text class="s x1" x="36" y="416">West</text><text class="s x1 e" x="344" y="416">East</text><rect x="380" y="70" width="330" height="82" rx="10" class="mint x3"/><text class="t x2" x="395" y="92">Isogonic lines</text><text class="s x1" x="395" y="112">Each line joins places with the same</text><text class="s x1" x="395" y="128">variation. They are printed on the chart.</text><rect x="380" y="162" width="330" height="82" rx="10" class="lav x3"/><text class="t x2" x="395" y="184">The agonic line</text><text class="s x1" x="395" y="204">Variation is zero on this line: true north</text><text class="s x1" x="395" y="220">and magnetic north point the same way.</text><rect x="380" y="254" width="330" height="82" rx="10" class="sky x3"/><text class="t x2" x="395" y="276">West of it: east variation</text><text class="s x1" x="395" y="296">Magnetic north is east of true north.</text><text class="s x1" x="395" y="312">From true to magnetic, subtract.</text><rect x="380" y="346" width="330" height="84" rx="10" class="rose x3"/><text class="t x2" x="395" y="368">East of it: west variation</text><text class="s x1" x="395" y="388">Magnetic north is west of true north.</text><text class="s x1" x="395" y="404">From true to magnetic, add.</text><rect class="cl" x="20" y="446" width="690" height="70" rx="8"/><circle cx="35" cy="468" r="2.2" class="ah"/><text class="s x2" x="44" y="472">Read the variation from the line nearest your route. It changes from place to place.</text><circle cx="35" cy="500" r="2.2" class="ah"/><text class="s x2" x="44" y="504">Charts are updated because variation slowly changes over the years.</text></svg>
