<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 512" role="img" aria-labelledby="ti de"><title id="ti">From true course to compass heading: worked example</title><desc id="de">A worked example in four steps. True course 270 degrees. Wind from 330 degrees at 20 knots and true airspeed 100 knots give a wind correction angle of about 10 degrees to the right, added, so true heading is 280 degrees. West variation of 10 degrees is added, so magnetic heading is 290 degrees. Deviation of minus 2 degrees from the compass card gives a compass heading of 288 degrees. Example numbers only.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:var(--diagram-text-opacity,.85)}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:var(--diagram-fill-opacity,.6)}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:var(--diagram-fill-opacity,.6)}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:var(--diagram-fill-opacity,.6)}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:var(--diagram-fill-opacity,.6)}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:12px}.q1{font-size:11px}.q2{stroke:currentColor;stroke-width:1.5}.q3{font-size:13px}.q4{stroke-width:1.2;opacity:0.7}.q5{font-size:12.5px}.q6{stroke-width:1.4;opacity:0.8}.x1{font-size:12.5px}.x2{font-size:13px}.x3{stroke:currentColor;stroke-width:1.5}.th{fill:currentColor;fill-opacity:.12}.big{font-size:20px}.q7{stroke-width:1.8;opacity:.6}</style><text class="t" x="20" y="28" style="font-size:15px">From true course to compass heading: worked example</text><text class="s x2" x="20" y="50">Wind first, then variation, then deviation. Example numbers only.</text><rect x="20" y="70" width="430" height="52" rx="10" class="cl x3"/><text class="t x1" x="35" y="92">Given: TC 270°, wind 330° at 20 kt, TAS 100 kt</text><text class="s x1" x="35" y="111">WCA about 10° right. Groundspeed about 88 kt.</text><rect x="20" y="134" width="430" height="56" rx="10" class="sky x3"/><text class="t x2" x="35" y="158">TC  True course 270°</text><text class="s x1" x="35" y="178">Measured on the chart</text><path d="M235 191L235 200" class="acc"/><rect x="20" y="200" width="430" height="56" rx="10" class="mint x3"/><text class="t x2" x="35" y="224">TH  True heading 280°</text><text class="s x1" x="35" y="244">TC + 10° (WCA): wind from the right, add</text><path d="M235 257L235 266" class="acc"/><rect x="20" y="266" width="430" height="56" rx="10" class="lav x3"/><text class="t x2" x="35" y="290">MH  Magnetic heading 290°</text><text class="s x1" x="35" y="310">TH + 10° west variation: west, add</text><path d="M235 323L235 332" class="acc"/><rect x="20" y="332" width="430" height="56" rx="10" class="rose x3"/><text class="t x2" x="35" y="356">CH  Compass heading 288°</text><text class="s x1" x="35" y="376">MH − 2° deviation (compass card)</text><rect x="470" y="70" width="240" height="84" rx="10" class="sky x3"/><text class="t x2" x="485" y="92">Wind from the right</text><text class="s x1" x="485" y="112">Add the WCA to the course.</text><text class="s x1" x="485" y="128">From the left, subtract it.</text><rect x="470" y="164" width="240" height="84" rx="10" class="mint x3"/><text class="t x2" x="485" y="186">Variation</text><text class="s x1" x="485" y="206">West: add, from true to</text><text class="s x1" x="485" y="222">magnetic. East: subtract.</text><rect x="470" y="258" width="240" height="84" rx="10" class="lav x3"/><text class="t x2" x="485" y="280">Steer the compass</text><text class="s x1" x="485" y="300">Hold the compass heading</text><text class="s x1" x="485" y="316">(288°), not the course.</text><rect class="cl" x="20" y="408" width="690" height="70" rx="8"/><circle cx="35" cy="430" r="2.2" class="ah"/><text class="s x2" x="44" y="434">Work down the list in order: TC, TH, MH, then CH.</text><circle cx="35" cy="462" r="2.2" class="ah"/><text class="s x2" x="44" y="466">Real numbers come from your plotter, winds aloft and the compass card in your airplane.</text></svg>
