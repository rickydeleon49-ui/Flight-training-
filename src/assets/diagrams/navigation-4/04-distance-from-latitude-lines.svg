<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 512" role="img" aria-labelledby="ti de"><title id="ti">Estimating distance with the latitude lines</title><desc id="de">A schematic with parallels of latitude one half degree apart. One minute of latitude is one nautical mile and one degree is 60 nautical miles, so 30 minutes of latitude is 30 nautical miles. Measure along a meridian, because degrees of longitude get closer together toward the poles. A sectional chart is 1 to 500,000, about 6.86 nautical miles to the inch. Example: 30 nautical miles at 120 knots takes 15 minutes. Example numbers only.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:var(--diagram-text-opacity,.85)}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:var(--diagram-fill-opacity,.6)}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:var(--diagram-fill-opacity,.6)}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:var(--diagram-fill-opacity,.6)}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:var(--diagram-fill-opacity,.6)}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:12px}.q1{font-size:11px}.q2{stroke:currentColor;stroke-width:1.5}.q3{font-size:13px}.q4{stroke-width:1.2;opacity:0.7}.q5{font-size:12.5px}.q6{stroke-width:1.4;opacity:0.8}.x1{font-size:12.5px}.x2{font-size:13px}.x3{stroke:currentColor;stroke-width:1.5}.th{fill:currentColor;fill-opacity:.12}.big{font-size:20px}.q7{stroke-width:1.8;opacity:.6}</style><text class="t" x="20" y="28" style="font-size:15px">Estimating distance with the latitude lines</text><text class="s x2" x="20" y="50">A quick check of how far it is, using the lines already printed on the chart.</text><rect x="20" y="70" width="340" height="360" rx="10" class="sky x3"/><path d="M50 120L330 120M50 225L330 225M50 330L330 330" class="o d q7"/><path d="M190 100L190 350" class="dk"/><text class="t x1" x="54" y="112">40°N</text><text class="t x1" x="54" y="217">39°30′N</text><text class="t x1" x="54" y="322">39°N</text><path d="M250 120L250 330M242 120L258 120M242 330L258 330M242 225L258 225" class="o q2"/><text class="t x1" x="262" y="176">30 NM</text><text class="t x1" x="262" y="282">30 NM</text><text class="t x1 m" x="190" y="92">Measure along a meridian</text><text class="t x1 m" x="190" y="380">60 NM from 40°N to 39°N</text><text class="s x1 m" x="190" y="398">Example numbers, not a real chart</text><rect x="380" y="70" width="330" height="82" rx="10" class="mint x3"/><text class="t x2" x="395" y="92">1. Latitude is a ruler</text><text class="s x1" x="395" y="112">1 minute of latitude is 1 nautical mile.</text><text class="s x1" x="395" y="128">1 degree is 60 minutes, so 60 NM.</text><rect x="380" y="162" width="330" height="82" rx="10" class="sky x3"/><text class="t x2" x="395" y="184">2. Use a meridian</text><text class="s x1" x="395" y="204">Meridians run north and south. Measure</text><text class="s x1" x="395" y="220">along one, not along a parallel.</text><rect x="380" y="254" width="330" height="82" rx="10" class="lav x3"/><text class="t x2" x="395" y="276">3. Or use the chart scale</text><text class="s x1" x="395" y="296">The chart gives a scale. A sectional is</text><text class="s x1" x="395" y="312">1:500,000, about 1 inch to 6.86 NM.</text><rect x="380" y="346" width="330" height="84" rx="10" class="rose x3"/><text class="t x2" x="395" y="368">4. Then work out the time</text><text class="s x1" x="395" y="388">30 NM at 120 knots groundspeed is</text><text class="s x1" x="395" y="404">15 minutes. Time = distance ÷ speed.</text><rect class="cl" x="20" y="446" width="690" height="70" rx="8"/><circle cx="35" cy="468" r="2.2" class="ah"/><text class="s x2" x="44" y="472">Degrees of longitude get closer toward the poles, so do not use them as a distance ruler.</text><circle cx="35" cy="500" r="2.2" class="ah"/><text class="s x2" x="44" y="504">Check your plotter scale against the scale on the chart you are using.</text></svg>
