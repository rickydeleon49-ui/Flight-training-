<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 515" role="img" aria-labelledby="ti de"><title id="ti">The standard atmosphere (ISA): temperature and pressure by altitude</title><desc id="de">Chart of ISA temperature against altitude: 15 degrees C at sea level, 5 at 5,000 feet, minus 5 at 10,000, minus 21 at 18,000, falling 2 degrees C per 1,000 feet to minus 56.5 at 36,000 feet, then constant. Side panel: sea level standard is 15 C, 29.92 inHg; pressure falls about 1 inHg per 1,000 feet in the lower levels, about 24.9 at 5,000, 20.6 at 10,000 and 14.9 at 18,000, about half of sea level. A warmer than standard day means a higher density altitude.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.th{stroke-width:1.5}.dsh{stroke-dasharray:6 5}.f{fill:currentColor}.b{font-weight:600;opacity:1}.q3{fill:var(--palette-berry,#A84C6B)}.n{font-size:12.5px}.k{font-size:11.5px}.h{font-size:13px}.q0{opacity:.3}</style><text class="t" style="font-size:15px" x="20" y="28">The standard atmosphere (ISA): temperature and pressure by altitude</text><text class="s h" x="20" y="50">The standard atmosphere (ISA) is the yardstick for altimeters and aircraft performance.</text><text class="s h" x="20" y="66.5">Real air is rarely standard, so pilots compare the actual temperature with it.</text><rect class="cl" x="20" y="85" width="410" height="420" rx="8"/><text class="t h" x="32" y="106">Standard temperature by altitude</text><path d="M100 470L420 470" class="dk th dsh q0"/><text class="s k e" x="92" y="474">0</text><path d="M100 385L420 385" class="dk th dsh q0"/><text class="s k e" x="92" y="389">10,000</text><path d="M100 300L420 300" class="dk th dsh q0"/><text class="s k e" x="92" y="304">20,000</text><path d="M100 215L420 215" class="dk th dsh q0"/><text class="s k e" x="92" y="219">30,000</text><text class="s k m" x="100" y="488">-60</text><text class="s k m" x="180" y="488">-40</text><text class="s k m" x="260" y="488">-20</text><text class="s k m" x="340" y="488">0</text><text class="s k m" x="420" y="488">20</text><text class="s k m" x="260" y="504">Temperature (°C)</text><text class="s k" x="32" y="125">Altitude (ft)</text><path d="M100 470L420 470M100 470L100 138.5" class="dk"/><path d="M400 470L114 164L114 138.5" class="acc"/><circle cx="400" cy="470" r="4.5" class="ah"/><text class="s n b" x="410" y="464">15°C</text><circle cx="360" cy="427.5" r="4.5" class="ah"/><text class="s n b" x="370" y="421.5">5°C</text><circle cx="320" cy="385" r="4.5" class="ah"/><text class="s n b" x="330" y="379">-5°C</text><circle cx="256" cy="317" r="4.5" class="ah"/><text class="s n b" x="266" y="311">-21°C</text><circle cx="114" cy="164" r="4.5" class="ah"/><text class="s n b" x="124" y="162">-56.5°C at 36,000 ft</text><path d="M100 164L110 164" class="dk th" style="opacity:.6"/><text class="s k" x="126" y="144.2">Constant above: tropopause</text><text class="s n b" x="300" y="257.5">Falls 2°C (3.5°F)</text><text class="s n b" x="300" y="272.5">for every 1,000 ft</text><rect class="cl" x="445" y="85" width="265" height="420" rx="8"/><text class="t h" x="457" y="107">Standard values</text><text class="s n b" x="457" y="130">At sea level:</text><text class="s n" x="457" y="147">Temperature 15°C (59°F)</text><text class="s n" x="457" y="164">Pressure 29.92 inHg</text><text class="s n" x="457" y="181">(1013.2 hPa)</text><text class="s n" x="457" y="215">Pressure falls about 1 inHg</text><text class="s n" x="457" y="232">per 1,000 ft in the lower</text><text class="s n" x="457" y="249">levels:</text><text class="s n" x="457" y="280">5,000 ft   about 24.9 inHg</text><text class="s n" x="457" y="297">10,000 ft  about 20.6 inHg</text><text class="s n" x="457" y="314">18,000 ft  about 14.9 inHg</text><text class="s n" x="457" y="331">(roughly half of sea level)</text><path d="M457 365L698 365" class="dk th" style="opacity:.4"/><text class="s n b" x="457" y="386">Not standard? Compare it:</text><text class="s n" x="457" y="404">ISA deviation = actual</text><text class="s n" x="457" y="420">temperature minus the</text><text class="s n" x="457" y="436">standard for that altitude.</text><text class="s n" x="457" y="452">Warmer than standard means</text><text class="s n" x="457" y="468">thinner air: higher density</text><text class="s n" x="457" y="484">altitude, weaker performance.</text></svg>
