<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 507" role="img" aria-labelledby="ti de"><title id="ti">Mountain wave, lenticular clouds and rotor</title><desc id="de">Cross-section of wind blowing from left to right over a ridge. Stable air forms a standing wave downwind: an updraft on the windward side, a strong downdraft on the lee side, a cap cloud over the ridge, lenticular clouds at the wave crests, and a rotor with severe turbulence beneath a wave crest. Cross a ridge at a 45 degree angle so you can turn away. Smooth air does not mean safe air.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.th{stroke-width:1.5}.dsh{stroke-dasharray:6 5}.f{fill:currentColor}.b{font-weight:600;opacity:1}.q3{fill:var(--palette-berry,#A84C6B)}.n{font-size:12.5px}.k{font-size:11.5px}.h{font-size:13px}</style><text class="t" style="font-size:15px" x="20" y="28">Mountain wave, lenticular clouds and rotor</text><text class="s h" x="20" y="50">Stable air blowing across a ridge can set off a standing wave that reaches far downwind.</text><text class="s h" x="20" y="66.5">It can bring strong up and down drafts, and a rotor with severe turbulence, even in clear sky.</text><rect class="cl" x="20" y="85" width="690" height="290" rx="8"/><path d="M20 330L235 330L330 215L405 330L710 330L710 375L20 375Z" class="cl dk th"/><path d="M30 250C180 250 250 195 340 195S440 280 470 280S560 220 600 220S680 260 700 260" class="acc" style="stroke-width:2.5"/><path d="M30 205C180 205 250 150 340 150S440 235 470 235S560 175 600 175S680 215 700 215" class="acc" style="stroke-width:2.5"/><path d="M30 285L81 285" class="acc"/><path d="M90 285L81 289.5L81 280.5Z" class="ah"/><text class="s n b" x="30" y="275">Wind</text><ellipse cx="340" cy="150" rx="48" ry="8" class="lav dk th"/><ellipse cx="600" cy="175" rx="48" ry="8" class="lav dk th"/><text class="s k b m" x="340" y="125">Lenticular cloud at wave crest</text><text class="s k m" x="600" y="150">next wave crest</text><path d="M300 232Q330 196 360 232Z" class="cl dk th"/><text class="s k m" x="330" y="270">Cap cloud</text><circle cx="600" cy="298" r="24" class="rose dk th dsh"/><path d="M590 294a11 11 0 1 1 5 11" class="acc" style="stroke-width:3"/><text class="s k b m" x="600" y="352">Rotor: severe turbulence</text><text class="s k" x="480" y="318">rotor cloud may form</text><text class="s n b" x="110" y="232">Updraft</text><path d="M215 250L238.4 228.1" class="acc"/><path d="M245 222L241.5 231.4L235.4 224.9Z" class="ah"/><path d="M398 240L416 276.9" class="acc"/><path d="M420 285L412 278.9L420.1 274.9Z" class="ah"/><text class="s n b" x="425" y="252">Downdraft</text><text class="s k" x="540" y="352"></text><text class="s k m" x="330" y="352">Ridge</text><rect class="cl" x="20" y="385" width="335" height="112" rx="8"/><text class="t h" x="32" y="407">What it takes</text><text class="s n" x="32" y="426">Stable air and strong wind across the</text><text class="s n" x="32" y="443">ridge (not along it). Waves can reach</text><text class="s n" x="32" y="460">far above and many miles downwind.</text><text class="s n" x="32" y="477">Smooth air does not mean safe air.</text><rect class="cl" x="375" y="385" width="335" height="112" rx="8"/><text class="t h" x="387" y="407">What to do</text><text class="s n" x="387" y="426">Expect a strong downdraft on the lee</text><text class="s n" x="387" y="443">side: it can beat your climb rate.</text><text class="s n" x="387" y="460">Cross a ridge at a 45 degree angle</text><text class="s n" x="387" y="477">so you can turn away from it quickly.</text></svg>
