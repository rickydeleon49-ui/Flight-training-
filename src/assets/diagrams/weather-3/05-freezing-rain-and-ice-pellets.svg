<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 535" role="img" aria-labelledby="ti de"><title id="ti">Freezing rain and ice pellets: why they form</title><desc id="de">Two cross-sections. Freezing rain: a warm layer above freezing sits over a shallow layer below freezing; rain falls through the cold layer, stays liquid (supercooled) and freezes on contact with the airframe, making clear ice. Ice pellets: rain falls through a deep layer below freezing and refreezes into pellets before reaching the aircraft; pellets mean freezing rain may be above. Avoid it: climb to the warm layer, turn back, or descend into above-freezing air, and report to ATC.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.th{stroke-width:1.5}.dsh{stroke-dasharray:6 5}.f{fill:currentColor}.b{font-weight:600;opacity:1}.q3{fill:var(--palette-berry,#A84C6B)}.n{font-size:12.5px}.k{font-size:11.5px}.h{font-size:13px}.q0{stroke:currentColor;stroke-width:2.5;opacity:.75}</style><text class="t" style="font-size:15px" x="20" y="28">Freezing rain and ice pellets: why they form</text><text class="s h" x="20" y="50">Rain that falls through air below freezing can reach the aircraft as freezing rain or ice pellets.</text><text class="s h" x="20" y="66.5">Both come from a warm layer above a cold one. Check the freezing level and the temperatures aloft.</text><rect class="cl" x="20" y="85" width="335" height="330" rx="8"/><text class="t h" x="32" y="107">Freezing rain</text><rect class="rose" x="35" y="115" width="305" height="110"/><rect class="sky" x="35" y="225" width="305" height="85"/><rect class="cl" x="35" y="310" width="305" height="12"/><text class="s k b" x="42" y="135">Warm layer:</text><text class="s k b" x="42" y="149">above 0°C (32°F)</text><text class="s k b" x="42" y="245">Shallow cold</text><text class="s k b" x="42" y="259">layer: below 0°C</text><path d="M170 150L166 300" class="dk th q0"/><path d="M196 150L192 300" class="dk th q0"/><path d="M222 150L218 300" class="dk th q0"/><path d="M248 150L244 300" class="dk th q0"/><path d="M274 150L270 300" class="dk th q0"/><path d="M300 150L296 300" class="dk th q0"/><path d="M255 262L295 262M275 248L275 276M266 274L284 274" class="dk"/><text class="s n" x="32" y="345">Rain falls through the cold layer, stays liquid</text><text class="s n" x="32" y="362">(supercooled) and freezes on contact with the</text><text class="s n" x="32" y="379">airframe: clear ice that builds fast. Severe.</text><rect class="cl" x="375" y="85" width="335" height="330" rx="8"/><text class="t h" x="387" y="107">Ice pellets</text><rect class="rose" x="390" y="115" width="305" height="70"/><rect class="sky" x="390" y="185" width="305" height="125"/><rect class="cl" x="390" y="310" width="305" height="12"/><text class="s k b" x="397" y="135">Warm layer:</text><text class="s k b" x="397" y="149">above 0°C (32°F)</text><text class="s k b" x="397" y="205">Deep cold</text><text class="s k b" x="397" y="219">layer: below 0°C</text><path d="M525 150L521 215" class="dk th q0"/><path d="M551 150L547 215" class="dk th q0"/><path d="M577 150L573 215" class="dk th q0"/><path d="M603 150L599 215" class="dk th q0"/><path d="M629 150L625 215" class="dk th q0"/><path d="M655 150L651 215" class="dk th q0"/><circle cx="525" cy="250" r="3.2" class="f"/><circle cx="551" cy="250" r="3.2" class="f"/><circle cx="577" cy="250" r="3.2" class="f"/><circle cx="603" cy="250" r="3.2" class="f"/><circle cx="629" cy="250" r="3.2" class="f"/><circle cx="655" cy="250" r="3.2" class="f"/><path d="M610 285L650 285M630 271L630 299M621 297L639 297" class="dk"/><text class="s n" x="387" y="345">Rain falls through deep cold air and freezes</text><text class="s n" x="387" y="362">into pellets before it gets to you. Pellets</text><text class="s n" x="387" y="379">mean freezing rain may be above you.</text><rect class="cl" x="20" y="425" width="690" height="100" rx="8"/><text class="t h" x="32" y="447">If you meet it</text><text class="s n" x="32" y="465">Freezing rain is a severe icing hazard: ice builds faster than a light airplane can cope with. Avoid it.</text><text class="s n" x="32" y="482">If you meet it, get out at once: climb to the warm layer if you know it is above, or turn</text><text class="s n" x="32" y="499">back, or descend if the air below is above freezing. Tell ATC and give a pilot report.</text></svg>
