<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 580" role="img" aria-labelledby="ti de"><title id="ti">Four ways air is lifted to form cloud</title><desc id="de">Four panels. Orographic lift: moist wind forced up a ridge. Frontal lift: warm, lighter air rides over cooler, denser air at a front. Convective lift: sun-heated ground makes thermals that build cumulus. Convergence: winds flowing toward each other force air upward. Rising air expands and cools to its dew point and cloud forms.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.th{stroke-width:1.5}.dsh{stroke-dasharray:6 5}.f{fill:currentColor}.b{font-weight:600;opacity:1}.q3{fill:var(--palette-berry,#A84C6B)}.n{font-size:12.5px}.k{font-size:11.5px}.h{font-size:13px}</style><text class="t" style="font-size:15px" x="20" y="28">Four ways air is lifted to form cloud</text><text class="s h" x="20" y="50">Air must rise to cool to its dew point and make cloud. It is lifted in four common ways.</text><text class="s h" x="20" y="66.5">Rising air expands and cools. When it cools to the dew point, cloud forms.</text><rect class="cl" x="20" y="90" width="335" height="230" rx="8"/><text class="t h" x="32" y="112">1. Orographic: forced up terrain</text><path d="M30 255L170 255L250 175L345 255L345 262L30 262Z" class="cl dk th"/><path d="M50 230L131.1 219.2" class="acc"/><path d="M140 218L131.7 223.6L130.5 214.7Z" class="ah"/><path d="M140 218Q195 195 225 162" class="acc"/><path d="M229.5 154.2L228.9 164.3L221.1 159.8Z" class="ah"/><path d="M224.4 148a10.8 10.8 0 0 1 3.6 -19.8a14.4 14.4 0 0 1 25.2 -7.2a12.6 12.6 0 0 1 23.4 5.4a9.9 9.9 0 0 1 5.4 21.6Z" class="lav dk th"/><text class="s n" x="32" y="282">Moist wind meets a ridge and climbs it. Cloud</text><text class="s n" x="32" y="298">forms on the upwind side and over the crest.</text><rect class="cl" x="375" y="90" width="335" height="230" rx="8"/><text class="t h" x="387" y="112">2. Frontal: over a wedge of air</text><path d="M385 255L700 255L700 210Q575 220 495 255Z" class="sky dk th"/><text class="s k m" x="625" y="240">cooler, denser air</text><text class="s k m" x="435" y="190">warmer</text><path d="M400 210L456.1 203.1" class="acc"/><path d="M465 202L456.6 207.6L455.5 198.6Z" class="ah"/><path d="M465 202Q535 190 610 172" class="acc"/><path d="M618.7 169.7L611.2 176.3L608.8 167.7Z" class="ah"/><path d="M597.8 152a9.6 9.6 0 0 1 3.2 -17.6a12.8 12.8 0 0 1 22.4 -6.4a11.2 11.2 0 0 1 20.8 4.8a8.8 8.8 0 0 1 4.8 19.2Z" class="lav dk th"/><text class="s n" x="387" y="282">Warm, light air rides up over cooler, denser</text><text class="s n" x="387" y="298">air at a front. Cloud and rain follow the slope.</text><rect class="cl" x="20" y="335" width="335" height="230" rx="8"/><text class="t h" x="32" y="357">3. Convective: heated ground</text><path d="M30 500L345 500L345 507L30 507Z" class="cl dk th"/><circle cx="310" cy="385" r="14" class="rose dk th"/><path d="M90 495Q102 465 90 435" class="acc"/><path d="M90 426L94.5 435L85.5 435Z" class="ah"/><path d="M150 495Q162 465 150 435" class="acc"/><path d="M150 426L154.5 435L145.5 435Z" class="ah"/><path d="M210 495Q222 465 210 435" class="acc"/><path d="M210 426L214.5 435L205.5 435Z" class="ah"/><path d="M119.4 407a10.8 10.8 0 0 1 3.6 -19.8a14.4 14.4 0 0 1 25.2 -7.2a12.6 12.6 0 0 1 23.4 5.4a9.9 9.9 0 0 1 5.4 21.6Z" class="lav dk th"/><text class="s n" x="32" y="527">Sun-heated ground warms the air above it.</text><text class="s n" x="32" y="543">Thermals rise and build puffy cumulus.</text><rect class="cl" x="375" y="335" width="335" height="230" rx="8"/><text class="t h" x="387" y="357">4. Convergence: air squeezed together</text><path d="M385 500L700 500L700 507L385 507Z" class="cl dk th"/><path d="M400 475L496 475" class="acc"/><path d="M505 475L496 479.5L496 470.5Z" class="ah"/><path d="M685 475L589 475" class="acc"/><path d="M580 475L589 470.5L589 479.5Z" class="ah"/><path d="M543 465L543 435" class="acc"/><path d="M543 426L547.5 435L538.5 435Z" class="ah"/><path d="M515.8 401a9.6 9.6 0 0 1 3.2 -17.6a12.8 12.8 0 0 1 22.4 -6.4a11.2 11.2 0 0 1 20.8 4.8a8.8 8.8 0 0 1 4.8 19.2Z" class="lav dk th"/><text class="s n" x="387" y="527">Winds flow toward each other (a trough, sea</text><text class="s n" x="387" y="543">breeze front) and the only way out is up.</text></svg>
