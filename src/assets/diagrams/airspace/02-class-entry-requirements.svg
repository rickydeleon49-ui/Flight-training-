<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 771.0" role="img" aria-labelledby="ti de"><title id="ti">Class entry requirements</title><desc id="de">Table for Classes A, B, C, D, E and G showing ATC clearance and radio, transponder and ADS-B Out, and pilot certificate requirements exactly as the PHAK text states them.  Only requirements the text states are shown.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style>
<text class="t" x="20" y="28" style="font-size:15px">Class entry requirements as PHAK states them</text>
<text class="s" x="20" y="50.0" style="font-size:13px">Shows what the handbook text states. The full rules are in 14 CFR part 91 (Figure 15-9); check them</text>
<text class="s" x="20" y="66.5" style="font-size:13px">with your instructor.</text>
<rect x="20" y="96" width="62" height="26" rx="10" class="cl" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="51.0" y="114" style="font-size:12px">Class</text>
<rect x="86" y="96" width="624" height="26" rx="10" class="cl" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="398.0" y="114" style="font-size:12px">What the text states</text>
<rect x="20" y="128" width="62" height="86.0" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="51.0" y="177.0" style="font-size:20px">A</text>
<rect class="cl" x="86" y="128" width="624" height="86.0" rx="8"/>
<circle cx="98" cy="143" r="2.2" class="ah"/>
<text class="s" x="107" y="147.0" style="font-size:11px">IFR only, and only under an ATC clearance received before entering.</text>
<circle cx="98" cy="160.5" r="2.2" class="ah"/>
<text class="s" x="107" y="164.5" style="font-size:11px">Two-way radio able to talk with ATC on a frequency assigned by ATC (unless otherwise authorized).</text>
<circle cx="98" cy="178.0" r="2.2" class="ah"/>
<text class="s" x="107" y="182.0" style="font-size:11px">Transponder as in 14 CFR 91.215 unless otherwise authorized by ATC.</text>
<circle cx="98" cy="195.5" r="2.2" class="ah"/>
<text class="s" x="107" y="199.5" style="font-size:11px">ADS-B Out (91.225 airspace) from January 1, 2020.</text>
<rect x="20" y="219.0" width="62" height="132.5" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="51.0" y="291.25" style="font-size:20px">B</text>
<rect class="cl" x="86" y="219.0" width="624" height="132.5" rx="8"/>
<circle cx="98" cy="234.0" r="2.2" class="ah"/>
<text class="s" x="107" y="238.0" style="font-size:11px">ATC clearance required for all aircraft.</text>
<circle cx="98" cy="251.5" r="2.2" class="ah"/>
<text class="s" x="107" y="255.5" style="font-size:11px">Operable two-way radio able to talk with ATC on the frequencies for that Class B area (unless</text>
<text class="s" x="107" y="270.0" style="font-size:11px">authorized otherwise).</text>
<circle cx="98" cy="283.5" r="2.2" class="ah"/>
<text class="s" x="107" y="287.5" style="font-size:11px">Transponder with automatic altitude reporting, 91.215(a), unless authorized by ATC.</text>
<circle cx="98" cy="301.0" r="2.2" class="ah"/>
<text class="s" x="107" y="305.0" style="font-size:11px">ADS-B Out (91.225 airspace) from January 1, 2020.</text>
<circle cx="98" cy="318.5" r="2.2" class="ah"/>
<text class="s" x="107" y="322.5" style="font-size:11px">Pilot certificate: To take off or land: private pilot certificate; or recreational (61.101(d)) or sport</text>
<text class="s" x="107" y="337.0" style="font-size:11px">(61.325) with their requirements; or a student meeting 61.94 (and 61.95 as applicable).</text>
<rect x="20" y="356.5" width="62" height="100.5" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="51.0" y="412.75" style="font-size:20px">C</text>
<rect class="cl" x="86" y="356.5" width="624" height="100.5" rx="8"/>
<circle cx="98" cy="371.5" r="2.2" class="ah"/>
<text class="s" x="107" y="375.5" style="font-size:11px">Two-way radio contact with ATC established before entering and kept up while inside.</text>
<circle cx="98" cy="389.0" r="2.2" class="ah"/>
<text class="s" x="107" y="393.0" style="font-size:11px">Departing a tower airport: contact the tower. Departing a satellite airport with no tower: contact ATC</text>
<text class="s" x="107" y="407.5" style="font-size:11px">as soon as practicable.</text>
<circle cx="98" cy="421.0" r="2.2" class="ah"/>
<text class="s" x="107" y="425.0" style="font-size:11px">Transponder, 91.215, unless authorized by ATC.</text>
<circle cx="98" cy="438.5" r="2.2" class="ah"/>
<text class="s" x="107" y="442.5" style="font-size:11px">ADS-B Out (91.225 airspace) from January 1, 2020.</text>
<rect x="20" y="462.0" width="62" height="65.5" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="51.0" y="500.75" style="font-size:20px">D</text>
<rect class="cl" x="86" y="462.0" width="624" height="65.5" rx="8"/>
<circle cx="98" cy="477.0" r="2.2" class="ah"/>
<text class="s" x="107" y="481.0" style="font-size:11px">Two-way radio contact with ATC established before entering and kept up while inside.</text>
<circle cx="98" cy="494.5" r="2.2" class="ah"/>
<text class="s" x="107" y="498.5" style="font-size:11px">Departing: same rule as Class C (tower, or ATC as soon as practicable from a satellite airport with no</text>
<text class="s" x="107" y="513.0" style="font-size:11px">tower).</text>
<rect x="20" y="532.5" width="62" height="97.5" rx="10" class="cl" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="51.0" y="587.25" style="font-size:20px">E</text>
<rect class="cl" x="86" y="532.5" width="624" height="97.5" rx="8"/>
<circle cx="98" cy="547.5" r="2.2" class="ah"/>
<text class="s" x="107" y="551.5" style="font-size:11px">No clearance or entry radio rule stated. Near an airport, follow the Class G requirements and any 14</text>
<text class="s" x="107" y="566.0" style="font-size:11px">CFR part 93 traffic pattern.</text>
<circle cx="98" cy="579.5" r="2.2" class="ah"/>
<text class="s" x="107" y="583.5" style="font-size:11px">Airport with an operating control tower: radio contact is needed within 4 NM of the airport, up to and</text>
<text class="s" x="107" y="598.0" style="font-size:11px">including 2,500 ft AGL.</text>
<circle cx="98" cy="611.5" r="2.2" class="ah"/>
<text class="s" x="107" y="615.5" style="font-size:11px">ADS-B Out (91.225 airspace) from January 1, 2020.</text>
<rect x="20" y="635.0" width="62" height="51.0" rx="10" class="cl" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="51.0" y="666.5" style="font-size:20px">G</text>
<rect class="cl" x="86" y="635.0" width="624" height="51.0" rx="8"/>
<circle cx="98" cy="650.0" r="2.2" class="ah"/>
<text class="s" x="107" y="654.0" style="font-size:11px">ATC has no authority or responsibility to control traffic here, so no clearance.</text>
<circle cx="98" cy="667.5" r="2.2" class="ah"/>
<text class="s" x="107" y="671.5" style="font-size:11px">VFR minimums apply.</text>
<rect class="cl" x="20" y="697.0" width="690" height="60" rx="8"/>
<text class="s" x="32" y="717.0" style="font-size:11.5px">Other lines in the text: in Class C and D, no one may take off or land at a satellite airport except in line</text>
<text class="s" x="32" y="732.0" style="font-size:11.5px">with FAA arrival and departure traffic patterns. Radio failure at a tower airport under VFR: land if weather is</text>
<text class="s" x="32" y="747.0" style="font-size:11.5px">at or above basic VFR minimums, visual contact with the tower is kept and a landing clearance is received.</text>
</svg>
