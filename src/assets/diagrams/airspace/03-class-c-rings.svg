<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="ti de"><title id="ti">Class C: two rings</title><desc id="de">Top view and side view of Class C. An inner core of 5 nautical miles reaches from the surface. An outer shelf out to 10 nautical miles starts at 1,200 feet. Both reach 4,000 feet above the airport.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.warn{fill:var(--status-overdue,#B0413C);fill-opacity:.35}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4}.ar{stroke:var(--palette-berry,#A84C6B)}.ah{fill:var(--palette-berry,#A84C6B)}</style><text class="t m" x="150" y="36">Top view</text><text class="t m" x="475" y="36">Side view</text><circle cx="150" cy="170" r="120" class="lav"/><circle cx="150" cy="170" r="60" class="sky"/><circle cx="150" cy="170" r="120" class="o"/><circle cx="150" cy="170" r="60" class="o"/><circle cx="150" cy="170" r="5" class="ah"/><text class="s m" x="150" y="145">5 NM</text><text class="s m" x="150" y="82">10 NM</text><path class="o" d="M350 360H620" style="stroke-width:5"/><path class="lav" d="M350 120h250v180H350z"/><path class="sky" d="M435 120h80v240h-80z"/><path class="o" d="M350 300V120H600V300H515V360H435V300Z"/><text class="s m" x="475" y="385">Airport</text><text class="s" x="40" y="320">Rings are 5 NM and 10 NM from the airport.</text><text class="s" x="40" y="344">(Top and side views are not to scale.)</text><text class="t" x="40" y="424">Core: surface to 4,000 ft above airport</text><text class="t" x="40" y="454">Shelf: 1,200 to 4,000 ft above airport</text></svg>
