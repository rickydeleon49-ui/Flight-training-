<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-labelledby="ti de"><title id="ti">Airspace layers, side view</title><desc id="de">Side view of stacked airspace. Class G from the surface up to the base of Class E. Class E up to 18,000 feet MSL. Class A from 18,000 feet MSL to FL600. Class E again above FL600.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.warn{fill:var(--status-overdue,#B0413C);fill-opacity:.35}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4}.ar{stroke:var(--palette-berry,#A84C6B)}.ah{fill:var(--palette-berry,#A84C6B)}</style>
<rect x="190" y="50" width="410" height="40" class="sky"/><rect x="190" y="90" width="410" height="110" class="lav"/><rect x="190" y="200" width="410" height="170" class="sky"/><rect x="190" y="370" width="410" height="50" class="mint"/>
<path class="o" d="M190 50H600M190 90H600M190 200H600M190 370H600"/><path class="o d" d="M190 300H600"/><path class="o" d="M150 420H620" style="stroke-width:5"/>
<text class="t m" x="395" y="77">Class E</text><text class="t m" x="395" y="152">Class A</text><text class="t m" x="395" y="292">Class E</text><text class="t m" x="395" y="402">Class G</text>
<text class="s e" x="180" y="96">FL600</text><text class="s e" x="180" y="206">18,000 ft MSL</text><text class="s e" x="180" y="306">14,500 ft MSL</text><text class="s e" x="180" y="376">700 or 1,200 ft AGL</text><text class="s e" x="180" y="438">Surface</text>
<text class="s" x="40" y="480">Class G: surface up to the base of Class E.</text>
<text class="s" x="40" y="504">Class E starts at 700 or 1,200 ft AGL, or 14,500 ft MSL.</text>
</svg>
