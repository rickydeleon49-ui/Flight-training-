<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="ti de"><title id="ti">Class D: tower airspace</title><desc id="de">Top view and side view of Class D, a single cylinder around an airport with a control tower. It reaches from the surface to 2,500 feet above airport elevation. Pilots need two-way radio contact before entering.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.warn{fill:var(--status-overdue,#B0413C);fill-opacity:.35}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4}.ar{stroke:var(--palette-berry,#A84C6B)}.ah{fill:var(--palette-berry,#A84C6B)}</style><text class="t m" x="150" y="36">Top view</text><text class="t m" x="475" y="36">Side view</text><circle cx="150" cy="170" r="100" class="sky"/><circle cx="150" cy="170" r="100" class="o d"/><circle cx="150" cy="170" r="5" class="ah"/><text class="s m" x="150" y="206">Airport</text><path class="o" d="M350 340H620" style="stroke-width:5"/><path class="sky" d="M380 90h190v250H380z"/><path class="o d" d="M380 340V90H570V340"/><path class="o" d="M380 90H570"/><path class="o" d="M470 340v-26M462 314h16v-14h-16z"/><text class="s m" x="475" y="366">Tower</text><text class="s m" x="475" y="80">2,500 ft</text><text class="t m" x="320" y="412">Surface to 2,500 ft above airport</text><text class="s m" x="320" y="440">Radius is set for each airport.</text><text class="s m" x="320" y="466">Two-way radio contact needed to enter.</text></svg>
