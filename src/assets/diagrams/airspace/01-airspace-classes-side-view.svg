<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 752" role="img" aria-labelledby="ti de"><title id="ti">Airspace classes in side view</title><desc id="de">Side profile of Class A, B, C, D, E and G with their floors and ceilings as PHAK states them. Class B is a stepped upside-down cake to 10,000 feet MSL, Class C reaches 4,000 feet above the airport with 5 and 10 nautical mile areas, Class D reaches 2,500 feet above the airport, Class E sits beneath Class A and above Class G, and Class A runs from 18,000 feet to FL 600. Schematic, not to scale.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><text class="t" x="20" y="28" style="font-size:15px">Airspace classes in side view: floors and ceilings</text><text class="s" x="20" y="50.0" style="font-size:13px">Schematic profile, not to scale. Floors and ceilings are the "generally" values PHAK gives. Class A is</text><text class="s" x="20" y="66.5" style="font-size:13px">above 18,000 ft MSL; all airspace above FL 600 is Class E.</text><rect x="84" y="92" width="626" height="28" class="cl"/><text class="s e" x="702" y="111" style="font-size:12px">Class E above FL 600</text><rect x="84" y="120" width="626" height="58" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="397.0" y="150" style="font-size:15px">Class A</text><text class="s m" x="397.0" y="168" style="font-size:12px">18,000 ft MSL up to and including FL 600</text><rect x="84" y="178" width="626" height="234" class="cl" style="stroke:currentColor;stroke-width:1.2"/><text class="s e" x="702" y="198" style="font-size:12px">Class E: the controlled airspace not A, B, C or D</text><text class="s e" x="702" y="214" style="font-size:12px">up to, but not including, 18,000 ft MSL</text><rect x="84" y="412" width="626" height="18" class="cl" style="stroke:currentColor;stroke-width:1.2;fill-opacity:.07"/><text class="s" x="668" y="426" style="font-size:10.5px">Class G</text><text class="s" x="94" y="426" style="font-size:10.5px">Class G</text><rect x="103" y="268" width="224" height="86" class="sky" style="stroke:currentColor;stroke-width:1.5"/><rect x="143" y="354" width="144" height="30" class="sky" style="stroke:currentColor;stroke-width:1.5"/><rect x="175" y="384" width="80" height="46" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="215" y="290" style="font-size:14px">Class B</text><text class="s m" x="215" y="306" style="font-size:11px">surface to 10,000 ft MSL</text><text class="s m" x="215" y="321" style="font-size:11px">two or more layers</text><rect x="345" y="354" width="170" height="58" class="lav" style="stroke:currentColor;stroke-width:1.5"/><rect x="385" y="354" width="90" height="76" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="430" y="332" style="font-size:14px">Class C</text><text class="s m" x="430" y="347" style="font-size:11px">surface to 4,000 ft above airport</text><text class="s m" x="365" y="376" style="font-size:10.5px">10 NM</text><text class="s m" x="495" y="376" style="font-size:10.5px">10 NM</text><text class="s m" x="430" y="376" style="font-size:10.5px">5 NM</text><rect x="560" y="384" width="90" height="46" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="605" y="362" style="font-size:14px">Class D</text><text class="s m" x="605" y="377" style="font-size:11px">surface to 2,500 ft above airport</text><path d="M201 430L229 430" class="dk" style="stroke-width:3"/><path d="M416 430L444 430" class="dk" style="stroke-width:3"/><path d="M591 430L619 430" class="dk" style="stroke-width:3"/><path d="M74 430L710 430" class="dk" style="stroke-width:3"/><path d="M79 430L84 430" class="dk" style="stroke-width:1.5"/><text class="s e" x="76" y="434" style="font-size:10.5px">Surface</text><path d="M79 268L84 268" class="dk" style="stroke-width:1.5"/><text class="s e" x="76" y="272" style="font-size:10.5px">10,000</text><path d="M79 178L84 178" class="dk" style="stroke-width:1.5"/><text class="s e" x="76" y="182" style="font-size:10.5px">18,000</text><path d="M79 120L84 120" class="dk" style="stroke-width:1.5"/><text class="s e" x="76" y="124" style="font-size:10.5px">FL 600</text><text class="s e" x="76" y="104" style="font-size:10.5px">ft MSL</text><rect x="20" y="460" width="84" height="40" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="62" y="484.0" style="font-size:13px">Class A</text><text class="s" x="116" y="477" style="font-size:11.5px">18,000 ft MSL up to and including FL 600, including airspace over waters within 12 NM of the</text><text class="s" x="116" y="492" style="font-size:11.5px">coast of the 48 states and Alaska.</text><rect x="20" y="506" width="84" height="40" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="62" y="530.0" style="font-size:13px">Class B</text><text class="s" x="116" y="523" style="font-size:11.5px">Surface to 10,000 ft MSL around the busiest airports; tailored, a surface area plus two or</text><text class="s" x="116" y="538" style="font-size:11.5px">more layers (upside-down wedding cake).</text><rect x="20" y="552" width="84" height="40" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="62" y="576.0" style="font-size:13px">Class C</text><text class="s" x="116" y="569" style="font-size:11.5px">Surface to 4,000 ft above airport elevation; usually a 5 NM radius surface area and a 10 NM</text><text class="s" x="116" y="584" style="font-size:11.5px">outer circle from 1,200 to 4,000 ft above the airport.</text><rect x="20" y="598" width="84" height="40" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="62" y="622.0" style="font-size:13px">Class D</text><text class="s" x="116" y="615" style="font-size:11.5px">Surface to 2,500 ft above airport elevation around airports with an operational control</text><text class="s" x="116" y="630" style="font-size:11.5px">tower; individually tailored.</text><rect x="20" y="644" width="84" height="40" rx="10" class="cl" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="62" y="668.0" style="font-size:13px">Class E</text><text class="s" x="116" y="661" style="font-size:11.5px">Usually base at 1,200 ft AGL, or 700 ft AGL or the surface in other areas; extends up to, not</text><text class="s" x="116" y="676" style="font-size:11.5px">including, 18,000 ft MSL; all above FL 600.</text><rect x="20" y="690" width="84" height="26" rx="10" class="cl" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="62" y="707.0" style="font-size:13px">Class G</text><text class="s" x="116" y="707" style="font-size:11.5px">Uncontrolled: from the surface to the base of the overlying Class E.</text><text class="s" x="20" y="736" style="font-size:11px">Heights for B, C and D are charted in MSL. The cake layers and wedge widths are schematic; only the quoted limits are from PHAK.</text></svg>
