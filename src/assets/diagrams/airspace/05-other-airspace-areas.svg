<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 1021.0" role="img" aria-labelledby="ti de"><title id="ti">Other airspace areas</title><desc id="de">Cards for local airport advisory, military training routes, temporary flight restrictions, parachute jump operations, published VFR routes, terminal radar service areas, national security areas and special VFR, plus a list of the other areas PHAK names such as the ADIZ, flight restricted zones, parks, tethered balloons, ultralights and unmanned balloons.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style>
<text class="t" x="20" y="28" style="font-size:15px">Other airspace areas</text>
<text class="s" x="20" y="50.0" style="font-size:13px">"Other airspace areas" is the general term for most of the remaining airspace. PHAK lists these and</text>
<text class="s" x="20" y="66.5" style="font-size:13px">describes the ones below.</text>
<rect class="cl" x="20.0" y="97.0" width="338.0" height="152.0" rx="8"/>
<rect x="20.0" y="97.0" width="338.0" height="26" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="30.0" y="115.0" style="font-size:13px">Local airport advisory (LAA)</text>
<circle cx="33.0" cy="133.0" r="2.2" class="ah"/>
<text class="s" x="42.0" y="137.0" style="font-size:11.5px">Advisory service from a Flight Service Station on</text>
<text class="s" x="42.0" y="152.0" style="font-size:11.5px">the landing airport, on a discrete ground-to-air</text>
<text class="s" x="42.0" y="167.0" style="font-size:11.5px">frequency or the tower frequency when the tower is</text>
<text class="s" x="42.0" y="182.0" style="font-size:11.5px">closed.</text>
<circle cx="33.0" cy="196.0" r="2.2" class="ah"/>
<text class="s" x="42.0" y="200.0" style="font-size:11.5px">Includes local advisories, automated weather with</text>
<text class="s" x="42.0" y="215.0" style="font-size:11.5px">voice broadcast, and ASOS/AWOS data.</text>
<rect class="cl" x="372.0" y="97.0" width="338.0" height="152.0" rx="8"/>
<rect x="372.0" y="97.0" width="338.0" height="26" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="382.0" y="115.0" style="font-size:13px">Military training routes (MTRs)</text>
<circle cx="385.0" cy="133.0" r="2.2" class="ah"/>
<text class="s" x="394.0" y="137.0" style="font-size:11.5px">Used by military aircraft for tactical flying,</text>
<text class="s" x="394.0" y="152.0" style="font-size:11.5px">usually below 10,000 ft MSL at over 250 knots.</text>
<circle cx="385.0" cy="166.0" r="2.2" class="ah"/>
<text class="s" x="394.0" y="170.0" style="font-size:11.5px">Named IR (IFR) or VR (VFR) plus a number. Four</text>
<text class="s" x="394.0" y="185.0" style="font-size:11.5px">digits: no segment above 1,500 ft AGL (IR1206,</text>
<text class="s" x="394.0" y="200.0" style="font-size:11.5px">VR1207). Three digits: at least one segment above</text>
<text class="s" x="394.0" y="215.0" style="font-size:11.5px">1,500 ft AGL (IR206, VR207).</text>
<circle cx="385.0" cy="229.0" r="2.2" class="ah"/>
<text class="s" x="394.0" y="233.0" style="font-size:11.5px">IR routes are flown under IFR in any weather.</text>
<rect class="cl" x="20.0" y="263.0" width="338.0" height="182.0" rx="8"/>
<rect x="20.0" y="263.0" width="338.0" height="26" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="30.0" y="281.0" style="font-size:13px">Temporary flight restrictions (TFR)</text>
<circle cx="33.0" cy="299.0" r="2.2" class="ah"/>
<text class="s" x="42.0" y="303.0" style="font-size:11.5px">Set by an FDC NOTAM starting "FLIGHT RESTRICTIONS":</text>
<text class="s" x="42.0" y="318.0" style="font-size:11.5px">location, time, area in statute miles, altitudes,</text>
<text class="s" x="42.0" y="333.0" style="font-size:11.5px">coordination facility, reason.</text>
<circle cx="33.0" cy="347.0" r="2.2" class="ah"/>
<text class="s" x="42.0" y="351.0" style="font-size:11.5px">Reasons include hazards, disaster relief,</text>
<text class="s" x="42.0" y="366.0" style="font-size:11.5px">sightseeing congestion, protecting the President or</text>
<text class="s" x="42.0" y="381.0" style="font-size:11.5px">public figures, space operations.</text>
<circle cx="33.0" cy="395.0" r="2.2" class="ah"/>
<text class="s" x="42.0" y="399.0" style="font-size:11.5px">Pilot must check NOTAMs in flight planning;</text>
<text class="s" x="42.0" y="414.0" style="font-size:11.5px">www.tfr.faa.gov. Incursions have led to security</text>
<text class="s" x="42.0" y="429.0" style="font-size:11.5px">investigations and certificate suspensions.</text>
<rect class="cl" x="372.0" y="263.0" width="338.0" height="182.0" rx="8"/>
<rect x="372.0" y="263.0" width="338.0" height="26" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="382.0" y="281.0" style="font-size:13px">Parachute jump aircraft operations</text>
<circle cx="385.0" cy="299.0" r="2.2" class="ah"/>
<text class="s" x="394.0" y="303.0" style="font-size:11.5px">Published in the Chart Supplement U.S.; frequently</text>
<text class="s" x="394.0" y="318.0" style="font-size:11.5px">used sites are shown on sectionals.</text>
<circle cx="385.0" cy="332.0" r="2.2" class="ah"/>
<text class="s" x="394.0" y="336.0" style="font-size:11.5px">No jump in or into Class A, B, C or D without ATC</text>
<text class="s" x="394.0" y="351.0" style="font-size:11.5px">authorization from the facility having jurisdiction</text>
<text class="s" x="394.0" y="366.0" style="font-size:11.5px">(14 CFR part 105).</text>
<rect class="cl" x="20.0" y="459.0" width="338.0" height="170.0" rx="8"/>
<rect x="20.0" y="459.0" width="338.0" height="26" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="30.0" y="477.0" style="font-size:13px">Published VFR routes</text>
<circle cx="33.0" cy="495.0" r="2.2" class="ah"/>
<text class="s" x="42.0" y="499.0" style="font-size:11.5px">For transitioning around, under or through complex</text>
<text class="s" x="42.0" y="514.0" style="font-size:11.5px">airspace.</text>
<circle cx="33.0" cy="528.0" r="2.2" class="ah"/>
<text class="s" x="42.0" y="532.0" style="font-size:11.5px">Called VFR flyway, VFR corridor, Class B VFR</text>
<text class="s" x="42.0" y="547.0" style="font-size:11.5px">transition route or terminal area VFR route.</text>
<circle cx="33.0" cy="561.0" r="2.2" class="ah"/>
<text class="s" x="42.0" y="565.0" style="font-size:11.5px">Generally found on VFR terminal area planning</text>
<text class="s" x="42.0" y="580.0" style="font-size:11.5px">charts.</text>
<rect class="cl" x="372.0" y="459.0" width="338.0" height="170.0" rx="8"/>
<rect x="372.0" y="459.0" width="338.0" height="26" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="382.0" y="477.0" style="font-size:13px">Terminal radar service areas (TRSAs)</text>
<circle cx="385.0" cy="495.0" r="2.2" class="ah"/>
<text class="s" x="394.0" y="499.0" style="font-size:11.5px">Participating pilots get added radar service that</text>
<text class="s" x="394.0" y="514.0" style="font-size:11.5px">separates all IFR from participating VFR aircraft.</text>
<circle cx="385.0" cy="528.0" r="2.2" class="ah"/>
<text class="s" x="394.0" y="532.0" style="font-size:11.5px">Primary airport becomes Class D; the rest overlies</text>
<text class="s" x="394.0" y="547.0" style="font-size:11.5px">mostly Class E starting at 700 or 1,200 ft.</text>
<circle cx="385.0" cy="561.0" r="2.2" class="ah"/>
<text class="s" x="394.0" y="565.0" style="font-size:11.5px">Charted with a solid black line and altitudes;</text>
<text class="s" x="394.0" y="580.0" style="font-size:11.5px">Class D part has a blue segmented line.</text>
<circle cx="385.0" cy="594.0" r="2.2" class="ah"/>
<text class="s" x="394.0" y="598.0" style="font-size:11.5px">Voluntary, but VFR pilots are encouraged to call</text>
<text class="s" x="394.0" y="613.0" style="font-size:11.5px">radar approach control.</text>
<rect class="cl" x="20.0" y="643.0" width="338.0" height="137.0" rx="8"/>
<rect x="20.0" y="643.0" width="338.0" height="26" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="30.0" y="661.0" style="font-size:13px">National security areas (NSAs)</text>
<circle cx="33.0" cy="679.0" r="2.2" class="ah"/>
<text class="s" x="42.0" y="683.0" style="font-size:11.5px">Defined airspace where ground facilities need more</text>
<text class="s" x="42.0" y="698.0" style="font-size:11.5px">security and safety.</text>
<circle cx="33.0" cy="712.0" r="2.2" class="ah"/>
<text class="s" x="42.0" y="716.0" style="font-size:11.5px">Flight may be temporarily prohibited under 14 CFR</text>
<text class="s" x="42.0" y="731.0" style="font-size:11.5px">part 99, by NOTAM.</text>
<circle cx="33.0" cy="745.0" r="2.2" class="ah"/>
<text class="s" x="42.0" y="749.0" style="font-size:11.5px">Pilots are asked to voluntarily avoid flying</text>
<text class="s" x="42.0" y="764.0" style="font-size:11.5px">through depicted areas.</text>
<rect class="cl" x="372.0" y="643.0" width="338.0" height="137.0" rx="8"/>
<rect x="372.0" y="643.0" width="338.0" height="26" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="382.0" y="661.0" style="font-size:13px">Special VFR</text>
<circle cx="385.0" cy="679.0" r="2.2" class="ah"/>
<text class="s" x="394.0" y="683.0" style="font-size:11.5px">14 CFR 91.157 is the exception to the rule that VFR</text>
<text class="s" x="394.0" y="698.0" style="font-size:11.5px">flight beneath a ceiling under 1,000 ft is not</text>
<text class="s" x="394.0" y="713.0" style="font-size:11.5px">allowed within controlled airspace designated to</text>
<text class="s" x="394.0" y="728.0" style="font-size:11.5px">the surface for an airport.</text>
<rect class="cl" x="20" y="794.0" width="690" height="213.0" rx="8"/>
<rect x="20" y="794.0" width="690" height="26" rx="10" class="cl" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="32" y="812.0" style="font-size:13px">Also in the list, and nearby rules</text>
<circle cx="35" cy="834.0" r="2.2" class="ah"/>
<text class="s" x="44" y="838.0" style="font-size:11.5px">ADIZ (land and water based): a Defense VFR (DVFR) flight plan is needed to fly VFR in it. Intercept</text>
<text class="s" x="44" y="853.0" style="font-size:11.5px">procedures: use 121.5 MHz if not already on ATC.</text>
<circle cx="35" cy="867.0" r="2.2" class="ah"/>
<text class="s" x="44" y="871.0" style="font-size:11.5px">Flight Restricted Zones near the Capitol and White House. Special awareness training (14 CFR 91.161) to fly</text>
<text class="s" x="44" y="886.0" style="font-size:11.5px">VFR within 60 NM of the Washington, DC VOR/DME.</text>
<circle cx="35" cy="900.0" r="2.2" class="ah"/>
<text class="s" x="44" y="904.0" style="font-size:11.5px">Wildlife, wilderness areas and national parks: request to stay above 2,000 ft AGL. NOAA marine areas off the</text>
<text class="s" x="44" y="919.0" style="font-size:11.5px">coast: above 2,000 ft AGL.</text>
<circle cx="35" cy="933.0" r="2.2" class="ah"/>
<text class="s" x="44" y="937.0" style="font-size:11.5px">Tethered balloons for observation and weather recording, on cables up to 60,000 (the text gives no unit).</text>
<circle cx="35" cy="951.0" r="2.2" class="ah"/>
<text class="s" x="44" y="955.0" style="font-size:11.5px">Ultralights (part 103) need prior ATC authorization in Class A to D and the surface area of airport Class E.</text>
<text class="s" x="44" y="970.0" style="font-size:11.5px">Unmanned free balloons below 2,000 ft above the surface need ATC authorization in B, C, D or airport Class E</text>
<text class="s" x="44" y="985.0" style="font-size:11.5px">(part 101).</text>
</svg>
