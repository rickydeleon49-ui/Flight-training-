<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 685" role="img" aria-labelledby="ti de"><title id="ti">Class G and Class E basics</title><desc id="de">Four columns show where Class E starts: 1,200 feet AGL in most areas, 700 feet AGL in many others, the surface at some airports, and 14,500 feet MSL where none is charted, with Class G beneath each base and Class A above 18,000 feet. Cards list what PHAK says about Class G, Class E and basic VFR weather.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11.5px}.q1{font-size:10px}.q2{font-size:10.5px}.q3{font-size:13px}.q4{stroke:currentColor;stroke-width:1.5}.q5{stroke:currentColor;stroke-width:1.4}.q6{font-size:11px}.q7{fill:none;stroke:currentColor;stroke-width:1.4;stroke-dasharray:4 3}</style><text class="t" x="20" y="28" style="font-size:15px">Class G and Class E basics</text><text class="s q3" x="20" y="50">Where each starts, and what PHAK says to do. The VFR minimum numbers are in its Figure 15-8, an image,</text><text class="s q3" x="20" y="66.5">so they are not repeated here.</text><rect class="cl" x="20" y="84" width="316" height="380" rx="8"/><rect x="54" y="110" width="272" height="30" class="rose q4"/><text class="t m q0" x="190" y="130">Class A from 18,000 ft MSL</text><rect x="54" y="140" width="62" height="240" class="cl q5"/><rect x="54" y="380" width="62" height="30" class="q7"/><text class="t m q0" x="85" y="250">Class E</text><text class="s m q2" x="85" y="264">base 1,200</text><text class="s m q2" x="85" y="277">ft AGL</text><text class="s m q1" x="85" y="426">Most</text><text class="s m q1" x="85" y="438">areas</text><text class="t m q6" x="85" y="402">Class G</text><rect x="122" y="140" width="62" height="252" class="cl q5"/><rect x="122" y="392" width="62" height="18" class="q7"/><text class="t m q0" x="153" y="256">Class E</text><text class="s m q2" x="153" y="270">base 700</text><text class="s m q2" x="153" y="283">ft AGL</text><text class="s m q1" x="153" y="426">Many</text><text class="s m q1" x="153" y="438">other</text><text class="t m q1" x="153" y="402">G</text><rect x="190" y="140" width="62" height="270" class="cl q5"/><text class="t m q0" x="221" y="265">Class E</text><text class="s m q2" x="221" y="279">base is</text><text class="s m q2" x="221" y="292">the surface</text><text class="s m q1" x="221" y="426">At</text><text class="s m q1" x="221" y="438">some airports</text><rect x="258" y="140" width="62" height="50" class="cl q5"/><rect x="258" y="190" width="62" height="220" class="q7"/><text class="t m q0" x="289" y="155">Class E</text><text class="s m q2" x="289" y="169">base 14,500</text><text class="s m q2" x="289" y="182">ft MSL</text><text class="s m q1" x="289" y="426">None</text><text class="s m q1" x="289" y="438">charted</text><text class="t m q6" x="289" y="396">Class G</text><path d="M54 410L328 410" class="dk" style="stroke-width:3"/><text class="s e q1" x="50" y="144">18,000</text><text class="s e q1" x="50" y="194">14,500</text><text class="s e q1" x="50" y="414">Sfc</text><text class="s m q6" x="178" y="460">Class G fills from the surface to each Class E base</text><text class="s m q6" x="178" y="476">Schematic, not to scale</text><rect class="cl" x="348" y="84" width="362" height="200" rx="8"/><rect x="348" y="84" width="362" height="26" rx="10" class="mint q4"/><text class="t q3" x="358" y="102">Class G (uncontrolled)</text><circle cx="361" cy="120" r="2.2" class="ah"/><text class="s q0" x="370" y="124">Airspace not designated A, B, C, D or E. It runs from</text><text class="s q0" x="370" y="139">the surface to the base of the overlying Class E.</text><circle cx="361" cy="153" r="2.2" class="ah"/><text class="s q0" x="370" y="157">ATC has no authority or responsibility to control</text><text class="s q0" x="370" y="172">traffic, but VFR minimums still apply.</text><circle cx="361" cy="186" r="2.2" class="ah"/><text class="s q0" x="370" y="190">Some Class G airports have a control tower (Lake City,</text><text class="s q0" x="370" y="205">FL, for example): check the Chart Supplement U.S.</text><circle cx="361" cy="219" r="2.2" class="ah"/><text class="s q0" x="370" y="223">Landing at an airport with no operating tower:</text><text class="s q0" x="370" y="238">airplanes turn left unless lights or markings say</text><text class="s q0" x="370" y="253">right; helicopters and powered parachutes avoid</text><text class="s q0" x="370" y="268">fixed-wing traffic flow.</text><rect class="cl" x="348" y="294" width="362" height="218" rx="8"/><rect x="348" y="294" width="362" height="26" rx="10" class="sky q4"/><text class="t q3" x="358" y="312">Class E (controlled)</text><circle cx="361" cy="330" r="2.2" class="ah"/><text class="s q0" x="370" y="334">Controlled airspace not A, B, C or D; a large amount of</text><text class="s q0" x="370" y="349">US airspace.</text><circle cx="361" cy="363" r="2.2" class="ah"/><text class="s q0" x="370" y="367">Sectionals chart every Class E base below 14,500 ft</text><text class="s q0" x="370" y="382">MSL; where none is charted, E begins at 14,500 ft MSL.</text><circle cx="361" cy="396" r="2.2" class="ah"/><text class="s q0" x="370" y="400">Base is usually 1,200 ft AGL, in many areas the surface</text><text class="s q0" x="370" y="415">or 700 ft AGL, and sometimes a charted MSL altitude.</text><circle cx="361" cy="429" r="2.2" class="ah"/><text class="s q0" x="370" y="433">Extends up to, but not including, 18,000 ft MSL; all</text><text class="s q0" x="370" y="448">airspace above FL 600 is Class E.</text><circle cx="361" cy="462" r="2.2" class="ah"/><text class="s q0" x="370" y="466">Near an airport: follow Class G requirements plus any</text><text class="s q0" x="370" y="481">part 93 traffic pattern. Operating tower: radio contact</text><text class="s q0" x="370" y="496">within 4 NM, up to and including 2,500 ft AGL.</text><rect class="cl" x="348" y="522" width="362" height="149" rx="8"/><rect x="348" y="522" width="362" height="26" rx="10" class="lav q4"/><text class="t q3" x="358" y="540">VFR weather in short</text><circle cx="361" cy="558" r="2.2" class="ah"/><text class="s q0" x="370" y="562">Basic VFR: flight visibility and distance from clouds</text><text class="s q0" x="370" y="577">must meet the minimums for the altitude and class (PHAK</text><text class="s q0" x="370" y="592">Figure 15-8).</text><circle cx="361" cy="606" r="2.2" class="ah"/><text class="s q0" x="370" y="610">Below a ceiling under 1,000 ft within controlled</text><text class="s q0" x="370" y="625">airspace designated to the surface for an airport, VFR</text><text class="s q0" x="370" y="640">operation is not allowed, except under Special VFR (14</text><text class="s q0" x="370" y="655">CFR 91.157). See 91.155(c).</text></svg>
