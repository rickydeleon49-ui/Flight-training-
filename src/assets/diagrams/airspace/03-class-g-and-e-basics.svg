<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 685.0" role="img" aria-labelledby="ti de"><title id="ti">Class G and Class E basics</title><desc id="de">Four columns show where Class E starts: 1,200 feet AGL in most areas, 700 feet AGL in many others, the surface at some airports, and 14,500 feet MSL where none is charted, with Class G beneath each base and Class A above 18,000 feet. Cards list what PHAK says about Class G, Class E and basic VFR weather.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style>
<text class="t" x="20" y="28" style="font-size:15px">Class G and Class E basics</text>
<text class="s" x="20" y="50.0" style="font-size:13px">Where each starts, and what PHAK says to do. The VFR minimum numbers are in its Figure 15-8, an image,</text>
<text class="s" x="20" y="66.5" style="font-size:13px">so they are not repeated here.</text>
<rect class="cl" x="20" y="84" width="316" height="380" rx="8"/>
<rect x="54" y="110" width="272" height="30" class="rose" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="190.0" y="130" style="font-size:11.5px">Class A from 18,000 ft MSL</text>
<rect x="54" y="140" width="62" height="240" class="cl" style="stroke:currentColor;stroke-width:1.4"/>
<rect x="54" y="380" width="62" height="30" style="fill:none;stroke:currentColor;stroke-width:1.4;stroke-dasharray:4 3"/>
<text class="t m" x="85.0" y="250.0" style="font-size:11.5px">Class E</text>
<text class="s m" x="85.0" y="264.0" style="font-size:10.5px">base 1,200</text>
<text class="s m" x="85.0" y="277.0" style="font-size:10.5px">ft AGL</text>
<text class="s m" x="85.0" y="426" style="font-size:10px">Most</text>
<text class="s m" x="85.0" y="438" style="font-size:10px">areas</text>
<text class="t m" x="85.0" y="402" style="font-size:11px">Class G</text>
<rect x="122" y="140" width="62" height="252" class="cl" style="stroke:currentColor;stroke-width:1.4"/>
<rect x="122" y="392" width="62" height="18" style="fill:none;stroke:currentColor;stroke-width:1.4;stroke-dasharray:4 3"/>
<text class="t m" x="153.0" y="256.0" style="font-size:11.5px">Class E</text>
<text class="s m" x="153.0" y="270.0" style="font-size:10.5px">base 700</text>
<text class="s m" x="153.0" y="283.0" style="font-size:10.5px">ft AGL</text>
<text class="s m" x="153.0" y="426" style="font-size:10px">Many</text>
<text class="s m" x="153.0" y="438" style="font-size:10px">other</text>
<text class="t m" x="153.0" y="402" style="font-size:10px">G</text>
<rect x="190" y="140" width="62" height="270" class="cl" style="stroke:currentColor;stroke-width:1.4"/>
<text class="t m" x="221.0" y="265.0" style="font-size:11.5px">Class E</text>
<text class="s m" x="221.0" y="279.0" style="font-size:10.5px">base is</text>
<text class="s m" x="221.0" y="292.0" style="font-size:10.5px">the surface</text>
<text class="s m" x="221.0" y="426" style="font-size:10px">At</text>
<text class="s m" x="221.0" y="438" style="font-size:10px">some airports</text>
<rect x="258" y="140" width="62" height="50" class="cl" style="stroke:currentColor;stroke-width:1.4"/>
<rect x="258" y="190" width="62" height="220" style="fill:none;stroke:currentColor;stroke-width:1.4;stroke-dasharray:4 3"/>
<text class="t m" x="289.0" y="155.0" style="font-size:11.5px">Class E</text>
<text class="s m" x="289.0" y="169.0" style="font-size:10.5px">base 14,500</text>
<text class="s m" x="289.0" y="182.0" style="font-size:10.5px">ft MSL</text>
<text class="s m" x="289.0" y="426" style="font-size:10px">None</text>
<text class="s m" x="289.0" y="438" style="font-size:10px">charted</text>
<text class="t m" x="289.0" y="396" style="font-size:11px">Class G</text>
<path d="M54 410L328 410" class="dk" style="stroke-width:3"/>
<text class="s e" x="50" y="144" style="font-size:10px">18,000</text>
<text class="s e" x="50" y="194" style="font-size:10px">14,500</text>
<text class="s e" x="50" y="414" style="font-size:10px">Sfc</text>
<text class="s m" x="178.0" y="460" style="font-size:11px">Class G fills from the surface to each Class E base</text>
<text class="s m" x="178.0" y="476" style="font-size:11px">Schematic, not to scale</text>
<rect class="cl" x="348" y="84" width="362" height="200.0" rx="8"/>
<rect x="348" y="84" width="362" height="26" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="358" y="102" style="font-size:13px">Class G (uncontrolled)</text>
<circle cx="361" cy="120" r="2.2" class="ah"/>
<text class="s" x="370" y="124.0" style="font-size:11.5px">Airspace not designated A, B, C, D or E. It runs from</text>
<text class="s" x="370" y="139.0" style="font-size:11.5px">the surface to the base of the overlying Class E.</text>
<circle cx="361" cy="153.0" r="2.2" class="ah"/>
<text class="s" x="370" y="157.0" style="font-size:11.5px">ATC has no authority or responsibility to control</text>
<text class="s" x="370" y="172.0" style="font-size:11.5px">traffic, but VFR minimums still apply.</text>
<circle cx="361" cy="186.0" r="2.2" class="ah"/>
<text class="s" x="370" y="190.0" style="font-size:11.5px">Some Class G airports have a control tower (Lake City,</text>
<text class="s" x="370" y="205.0" style="font-size:11.5px">FL, for example): check the Chart Supplement U.S.</text>
<circle cx="361" cy="219.0" r="2.2" class="ah"/>
<text class="s" x="370" y="223.0" style="font-size:11.5px">Landing at an airport with no operating tower:</text>
<text class="s" x="370" y="238.0" style="font-size:11.5px">airplanes turn left unless lights or markings say</text>
<text class="s" x="370" y="253.0" style="font-size:11.5px">right; helicopters and powered parachutes avoid</text>
<text class="s" x="370" y="268.0" style="font-size:11.5px">fixed-wing traffic flow.</text>
<rect class="cl" x="348" y="294.0" width="362" height="218.0" rx="8"/>
<rect x="348" y="294.0" width="362" height="26" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="358" y="312.0" style="font-size:13px">Class E (controlled)</text>
<circle cx="361" cy="330.0" r="2.2" class="ah"/>
<text class="s" x="370" y="334.0" style="font-size:11.5px">Controlled airspace not A, B, C or D; a large amount of</text>
<text class="s" x="370" y="349.0" style="font-size:11.5px">US airspace.</text>
<circle cx="361" cy="363.0" r="2.2" class="ah"/>
<text class="s" x="370" y="367.0" style="font-size:11.5px">Sectionals chart every Class E base below 14,500 ft</text>
<text class="s" x="370" y="382.0" style="font-size:11.5px">MSL; where none is charted, E begins at 14,500 ft MSL.</text>
<circle cx="361" cy="396.0" r="2.2" class="ah"/>
<text class="s" x="370" y="400.0" style="font-size:11.5px">Base is usually 1,200 ft AGL, in many areas the surface</text>
<text class="s" x="370" y="415.0" style="font-size:11.5px">or 700 ft AGL, and sometimes a charted MSL altitude.</text>
<circle cx="361" cy="429.0" r="2.2" class="ah"/>
<text class="s" x="370" y="433.0" style="font-size:11.5px">Extends up to, but not including, 18,000 ft MSL; all</text>
<text class="s" x="370" y="448.0" style="font-size:11.5px">airspace above FL 600 is Class E.</text>
<circle cx="361" cy="462.0" r="2.2" class="ah"/>
<text class="s" x="370" y="466.0" style="font-size:11.5px">Near an airport: follow Class G requirements plus any</text>
<text class="s" x="370" y="481.0" style="font-size:11.5px">part 93 traffic pattern. Operating tower: radio contact</text>
<text class="s" x="370" y="496.0" style="font-size:11.5px">within 4 NM, up to and including 2,500 ft AGL.</text>
<rect class="cl" x="348" y="522.0" width="362" height="149.0" rx="8"/>
<rect x="348" y="522.0" width="362" height="26" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="358" y="540.0" style="font-size:13px">VFR weather in short</text>
<circle cx="361" cy="558.0" r="2.2" class="ah"/>
<text class="s" x="370" y="562.0" style="font-size:11.5px">Basic VFR: flight visibility and distance from clouds</text>
<text class="s" x="370" y="577.0" style="font-size:11.5px">must meet the minimums for the altitude and class (PHAK</text>
<text class="s" x="370" y="592.0" style="font-size:11.5px">Figure 15-8).</text>
<circle cx="361" cy="606.0" r="2.2" class="ah"/>
<text class="s" x="370" y="610.0" style="font-size:11.5px">Below a ceiling under 1,000 ft within controlled</text>
<text class="s" x="370" y="625.0" style="font-size:11.5px">airspace designated to the surface for an airport, VFR</text>
<text class="s" x="370" y="640.0" style="font-size:11.5px">operation is not allowed, except under Special VFR (14</text>
<text class="s" x="370" y="655.0" style="font-size:11.5px">CFR 91.157). See 91.155(c).</text>
</svg>
