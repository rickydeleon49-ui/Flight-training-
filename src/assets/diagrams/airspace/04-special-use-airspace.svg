<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 746.5" role="img" aria-labelledby="ti de"><title id="ti">Special use airspace</title><desc id="de">Six cards for prohibited, restricted, warning, military operation, alert and controlled firing areas, with what each one is, how it is charted, and what the pilot or ATC does, using only the PHAK text.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style>
<text class="t" x="20" y="28" style="font-size:15px">Special use airspace: what it is and what the pilot does</text>
<text class="s" x="20" y="50.0" style="font-size:13px">Special use airspace is where certain activities must be confined, or where limits may be placed on</text>
<text class="s" x="20" y="66.5" style="font-size:13px">aircraft that are not part of those activities. Charts show area name or number, altitude, time and</text>
<text class="s" x="20" y="83.0" style="font-size:13px">weather conditions, controlling agency.</text>
<rect class="cl" x="20.0" y="113.5" width="338.0" height="193.0" rx="8"/>
<rect x="20.0" y="113.5" width="338.0" height="26" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="30.0" y="131.5" style="font-size:13px">Prohibited</text>
<text class="s e" x="348.0" y="131.5" style="font-size:11px">P-40</text>
<circle cx="33.0" cy="157.5" r="2.2" class="ah"/>
<text class="s" x="42.0" y="161.5" style="font-size:11.5px">Flight of aircraft is prohibited.</text>
<circle cx="33.0" cy="175.5" r="2.2" class="ah"/>
<text class="s" x="42.0" y="179.5" style="font-size:11.5px">Set up for security or other reasons tied to the</text>
<text class="s" x="42.0" y="194.5" style="font-size:11.5px">national welfare; published in the Federal</text>
<text class="s" x="42.0" y="209.5" style="font-size:11.5px">Register.</text>
<circle cx="33.0" cy="223.5" r="2.2" class="ah"/>
<text class="s" x="42.0" y="227.5" style="font-size:11.5px">Charted as "P" and a number, e.g. P-40 (Camp</text>
<text class="s" x="42.0" y="242.5" style="font-size:11.5px">David); also the National Mall in Washington, D.C.</text>
<rect class="cl" x="372.0" y="113.5" width="338.0" height="193.0" rx="8"/>
<rect x="372.0" y="113.5" width="338.0" height="26" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="382.0" y="131.5" style="font-size:13px">Restricted</text>
<text class="s e" x="700.0" y="131.5" style="font-size:11px">R-4401</text>
<circle cx="385.0" cy="157.5" r="2.2" class="ah"/>
<text class="s" x="394.0" y="161.5" style="font-size:11.5px">Not wholly prohibited but subject to restrictions:</text>
<text class="s" x="394.0" y="176.5" style="font-size:11.5px">often invisible hazards such as artillery firing,</text>
<text class="s" x="394.0" y="191.5" style="font-size:11.5px">aerial gunnery or guided missiles.</text>
<circle cx="385.0" cy="205.5" r="2.2" class="ah"/>
<text class="s" x="394.0" y="209.5" style="font-size:11.5px">Entering without authorization from the using or</text>
<text class="s" x="394.0" y="224.5" style="font-size:11.5px">controlling agency may be extremely hazardous.</text>
<circle cx="385.0" cy="238.5" r="2.2" class="ah"/>
<text class="s" x="394.0" y="242.5" style="font-size:11.5px">IFR flights may be cleared to transit. If active</text>
<text class="s" x="394.0" y="257.5" style="font-size:11.5px">and not released to the FAA, ATC clears IFR traffic</text>
<text class="s" x="394.0" y="272.5" style="font-size:11.5px">around it.</text>
<circle cx="385.0" cy="286.5" r="2.2" class="ah"/>
<text class="s" x="394.0" y="290.5" style="font-size:11.5px">Charted "R" and a number, e.g. R-4401.</text>
<rect class="cl" x="20.0" y="320.5" width="338.0" height="175.0" rx="8"/>
<rect x="20.0" y="320.5" width="338.0" height="26" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="30.0" y="338.5" style="font-size:13px">Warning</text>
<text class="s e" x="348.0" y="338.5" style="font-size:11px">W-237</text>
<circle cx="33.0" cy="364.5" r="2.2" class="ah"/>
<text class="s" x="42.0" y="368.5" style="font-size:11.5px">Like restricted, but the US government does not</text>
<text class="s" x="42.0" y="383.5" style="font-size:11.5px">have sole jurisdiction.</text>
<circle cx="33.0" cy="397.5" r="2.2" class="ah"/>
<text class="s" x="42.0" y="401.5" style="font-size:11.5px">Starts 3 NM out from the US coast; over domestic or</text>
<text class="s" x="42.0" y="416.5" style="font-size:11.5px">international waters or both.</text>
<circle cx="33.0" cy="430.5" r="2.2" class="ah"/>
<text class="s" x="42.0" y="434.5" style="font-size:11.5px">Purpose: warn non-participating pilots of potential</text>
<text class="s" x="42.0" y="449.5" style="font-size:11.5px">danger.</text>
<circle cx="33.0" cy="463.5" r="2.2" class="ah"/>
<text class="s" x="42.0" y="467.5" style="font-size:11.5px">Charted "W" and a number, e.g. W-237.</text>
<rect class="cl" x="372.0" y="320.5" width="338.0" height="175.0" rx="8"/>
<rect x="372.0" y="320.5" width="338.0" height="26" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="382.0" y="338.5" style="font-size:13px">Military operation area (MOA)</text>
<text class="s e" x="700.0" y="338.5" style="font-size:11px">named</text>
<circle cx="385.0" cy="364.5" r="2.2" class="ah"/>
<text class="s" x="394.0" y="368.5" style="font-size:11.5px">Separates certain military training from IFR</text>
<text class="s" x="394.0" y="383.5" style="font-size:11.5px">traffic.</text>
<circle cx="385.0" cy="397.5" r="2.2" class="ah"/>
<text class="s" x="394.0" y="401.5" style="font-size:11.5px">While in use, IFR traffic may be cleared through if</text>
<text class="s" x="394.0" y="416.5" style="font-size:11.5px">ATC can separate it; otherwise ATC reroutes or</text>
<text class="s" x="394.0" y="431.5" style="font-size:11.5px">restricts it.</text>
<circle cx="385.0" cy="445.5" r="2.2" class="ah"/>
<text class="s" x="394.0" y="449.5" style="font-size:11.5px">Not numbered, e.g. "Camden Ridge MOA". Times,</text>
<text class="s" x="394.0" y="464.5" style="font-size:11.5px">altitudes and controlling agency are on the back of</text>
<text class="s" x="394.0" y="479.5" style="font-size:11.5px">the sectional.</text>
<rect class="cl" x="20.0" y="509.5" width="338.0" height="175.0" rx="8"/>
<rect x="20.0" y="509.5" width="338.0" height="26" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="30.0" y="527.5" style="font-size:13px">Alert</text>
<text class="s e" x="348.0" y="527.5" style="font-size:11px">A-211</text>
<circle cx="33.0" cy="553.5" r="2.2" class="ah"/>
<text class="s" x="42.0" y="557.5" style="font-size:11.5px">Warns non-participating pilots of a high volume of</text>
<text class="s" x="42.0" y="572.5" style="font-size:11.5px">pilot training or unusual aerial activity.</text>
<circle cx="33.0" cy="586.5" r="2.2" class="ah"/>
<text class="s" x="42.0" y="590.5" style="font-size:11.5px">Pilots should exercise caution.</text>
<circle cx="33.0" cy="604.5" r="2.2" class="ah"/>
<text class="s" x="42.0" y="608.5" style="font-size:11.5px">Transiting pilots and participants are equally</text>
<text class="s" x="42.0" y="623.5" style="font-size:11.5px">responsible for collision avoidance.</text>
<circle cx="33.0" cy="637.5" r="2.2" class="ah"/>
<text class="s" x="42.0" y="641.5" style="font-size:11.5px">Charted "A" and a number, e.g. A-211.</text>
<rect class="cl" x="372.0" y="509.5" width="338.0" height="175.0" rx="8"/>
<rect x="372.0" y="509.5" width="338.0" height="26" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="382.0" y="527.5" style="font-size:13px">Controlled firing area (CFA)</text>
<text class="s e" x="700.0" y="527.5" style="font-size:11px">not charted</text>
<circle cx="385.0" cy="553.5" r="2.2" class="ah"/>
<text class="s" x="394.0" y="557.5" style="font-size:11.5px">Activities that could be hazardous to</text>
<text class="s" x="394.0" y="572.5" style="font-size:11.5px">non-participating aircraft if not done in a</text>
<text class="s" x="394.0" y="587.5" style="font-size:11.5px">controlled setting.</text>
<circle cx="385.0" cy="601.5" r="2.2" class="ah"/>
<text class="s" x="394.0" y="605.5" style="font-size:11.5px">Activities stop when a spotter aircraft, radar or</text>
<text class="s" x="394.0" y="620.5" style="font-size:11.5px">ground lookout shows an aircraft may be</text>
<text class="s" x="394.0" y="635.5" style="font-size:11.5px">approaching.</text>
<circle cx="385.0" cy="649.5" r="2.2" class="ah"/>
<text class="s" x="394.0" y="653.5" style="font-size:11.5px">Not charted, because they do not make an aircraft</text>
<text class="s" x="394.0" y="668.5" style="font-size:11.5px">change its flight path.</text>
<rect class="cl" x="20" y="698.5" width="690" height="34" rx="8"/>
<text class="s" x="32" y="719.5" style="font-size:12px">Special use airspace usually consists of these six types.</text>
</svg>
