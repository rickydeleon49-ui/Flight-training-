<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" role="img" aria-labelledby="ti de"><title id="ti">Special use airspace</title><desc id="de">Four tiles. Prohibited: flight not allowed. Restricted: needs authorization. MOA: nonregulatory, stay alert. Warning and alert areas: nonregulatory, use caution.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.warn{fill:var(--status-overdue,#B0413C);fill-opacity:.35}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4}.ar{stroke:var(--palette-berry,#A84C6B)}.ah{fill:var(--palette-berry,#A84C6B)}</style>
<g><rect x="40" y="20" width="260" height="130" rx="10" class="warn"/><rect x="40" y="20" width="260" height="130" rx="10" class="o"/><path class="o" d="M40 150L300 20"/><text class="t m" x="170" y="184">Prohibited</text><text class="s m" x="170" y="210">No flight allowed</text></g>
<g><rect x="340" y="20" width="260" height="130" rx="10" class="rose"/><rect x="340" y="20" width="260" height="130" rx="10" class="o"/><path class="o" d="M360 20l-0 0M350 70L400 20M350 120L450 20M370 150L500 20M430 150L560 20M490 150L600 60M550 150L600 110" style="stroke-width:2"/><text class="t m" x="470" y="184">Restricted</text><text class="s m" x="470" y="210">Needs authorization</text></g>
<g><rect x="40" y="270" width="260" height="130" rx="10" class="o" style="stroke-width:2"/><ellipse cx="170" cy="335" rx="100" ry="45" class="lav"/><ellipse cx="170" cy="335" rx="100" ry="45" class="o"/><circle cx="130" cy="335" r="4" class="ah"/><circle cx="170" cy="320" r="4" class="ah"/><circle cx="210" cy="340" r="4" class="ah"/><circle cx="165" cy="355" r="4" class="ah"/><text class="t m" x="170" y="434">MOA</text><text class="s m" x="170" y="460">Nonregulatory: stay alert</text></g>
<g><rect x="340" y="270" width="260" height="130" rx="10" class="o" style="stroke-width:2"/><path class="mint" d="M360 380V295L470 285L580 295V380Z"/><path class="o" d="M360 380V295L470 285L580 295V380Z"/><path class="o" d="M360 295L380 320M580 295L560 320M360 380L380 355M580 380L560 355" /><text class="t m" x="470" y="434">Warning / Alert</text><text class="s m" x="470" y="460">Nonregulatory: use caution</text></g>
</svg>
