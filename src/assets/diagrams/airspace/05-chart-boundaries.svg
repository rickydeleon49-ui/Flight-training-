<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 510" role="img" aria-labelledby="ti de"><title id="ti">Sectional chart boundary styles</title><desc id="de">Four small chart tiles with an airport at the center. Class B has a solid ring, Class C a solid ring, Class D a dashed ring. Class E has a shaded edge: magenta starts at 700 feet above ground, blue at 1,200 feet.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.warn{fill:var(--status-overdue,#B0413C);fill-opacity:.35}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4}.ar{stroke:var(--palette-berry,#A84C6B)}.ah{fill:var(--palette-berry,#A84C6B)}</style><g><rect x="30" y="20" width="280" height="210" rx="12" class="o" style="stroke-width:2"/><circle cx="170" cy="100" r="60" class="o" style="stroke:var(--palette-sky,#8EBFDA);stroke-width:6"/><circle cx="170" cy="100" r="5" class="ah"/><text class="t m" x="170" y="190">Class B</text><text class="s m" x="170" y="216">solid blue line</text></g><g><rect x="330" y="20" width="280" height="210" rx="12" class="o" style="stroke-width:2"/><circle cx="470" cy="100" r="60" class="o" style="stroke:var(--palette-berry,#A84C6B);stroke-width:6"/><circle cx="470" cy="100" r="5" class="ah"/><text class="t m" x="470" y="190">Class C</text><text class="s m" x="470" y="216">solid magenta line</text></g><g><rect x="30" y="260" width="280" height="210" rx="12" class="o" style="stroke-width:2"/><circle cx="170" cy="340" r="60" class="o d" style="stroke:var(--palette-sky,#8EBFDA);stroke-width:6"/><circle cx="170" cy="340" r="5" class="ah"/><text class="t m" x="170" y="430">Class D</text><text class="s m" x="170" y="456">dashed blue line</text></g><g><rect x="330" y="260" width="280" height="235" rx="12" class="o" style="stroke-width:2"/><circle cx="470" cy="340" r="60" fill="none" style="stroke:var(--palette-rose,#DFA7B8);stroke-width:26;stroke-opacity:.8"/><circle cx="470" cy="340" r="5" class="ah"/><text class="t m" x="470" y="430">Class E edge</text><text class="s m" x="470" y="456">magenta: from 700 ft</text><text class="s m" x="470" y="480">blue: from 1,200 ft</text></g></svg>
