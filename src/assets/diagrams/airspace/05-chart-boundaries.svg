<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 510" role="img" aria-labelledby="ti de"><title id="ti">Sectional chart boundary styles</title><desc id="de">Four small chart tiles with an airport at the center. Class B has a solid ring, Class C a solid ring, Class D a dashed ring. Class E has a shaded edge, drawn two ways: a magenta fade where Class E starts at 700 feet AGL, and a blue fade where it starts at 1,200 feet AGL.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:var(--diagram-text-opacity,.85)}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:var(--diagram-fill-opacity,.6)}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:var(--diagram-fill-opacity,.6)}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:var(--diagram-fill-opacity,.6)}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:var(--diagram-fill-opacity,.6)}.warn{fill:var(--diagram-overdue,#B0413C);fill-opacity:.35}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4}.ar{stroke:var(--palette-berry,#A84C6B)}.ah{fill:var(--palette-berry,#A84C6B)}.q0{stroke-width:2}.q1{stroke:#2a7fd0;stroke-width:6}</style><g><rect x="30" y="20" width="280" height="210" rx="12" class="o q0"/><circle cx="170" cy="100" r="60" class="o q1"/><circle cx="170" cy="100" r="5" class="ah"/><text class="t m" x="170" y="190">Class B</text><text class="s m" x="170" y="216">solid blue line</text></g><g><rect x="330" y="20" width="280" height="210" rx="12" class="o q0"/><circle cx="470" cy="100" r="60" class="o" style="stroke:#b8309f;stroke-width:6"/><circle cx="470" cy="100" r="5" class="ah"/><text class="t m" x="470" y="190">Class C</text><text class="s m" x="470" y="216">solid magenta line</text></g><g><rect x="30" y="260" width="280" height="210" rx="12" class="o q0"/><circle cx="170" cy="340" r="60" class="o d q1"/><circle cx="170" cy="340" r="5" class="ah"/><text class="t m" x="170" y="430">Class D</text><text class="s m" x="170" y="456">dashed blue line</text></g><g><rect x="330" y="260" width="280" height="235" rx="12" class="o q0"/><text class="t m" x="470" y="292">Class E edge</text><circle cx="400" cy="350" r="40" fill="none" style="stroke:#b8309f;stroke-width:3"/><circle cx="400" cy="350" r="33" fill="none" style="stroke:#b8309f;stroke-width:12;stroke-opacity:.35"/><circle cx="400" cy="350" r="4" class="ah"/><circle cx="540" cy="350" r="40" fill="none" style="stroke:#2a7fd0;stroke-width:3"/><circle cx="540" cy="350" r="47" fill="none" style="stroke:#2a7fd0;stroke-width:12;stroke-opacity:.35"/><circle cx="540" cy="350" r="4" class="ah"/><text class="t m" x="400" y="432" style="font-size:17px">Magenta fade</text><text class="s m" x="400" y="454" style="font-size:15px">Class E starts</text><text class="s m" x="400" y="474" style="font-size:15px">at 700 ft AGL</text><text class="t m" x="540" y="432" style="font-size:17px">Blue fade</text><text class="s m" x="540" y="454" style="font-size:15px">Class E starts</text><text class="s m" x="540" y="474" style="font-size:15px">at 1,200 ft AGL</text></g></svg>