<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 1284.0" role="img" aria-labelledby="ti de"><title id="ti">Air masses, stationary and occluded fronts</title><desc id="de">Air mass source regions and the effect of passing over warmer or colder surfaces, then the stationary front and the two kinds of occluded front, the weather before, during and after an occluded front, and a side by side comparison of warm, cold, stationary and occluded fronts using the PHAK text.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style>
<text class="t" x="20" y="28" style="font-size:15px">Air masses, stationary and occluded fronts</text>
<text class="s" x="20" y="50.0" style="font-size:13px">An air mass takes on the temperature and moisture of its source region. A front is the boundary</text>
<text class="s" x="20" y="66.5" style="font-size:13px">between two air masses; no two fronts are the same.</text>
<rect class="cl" x="20" y="89.0" width="300" height="134.0" rx="8"/>
<rect x="20" y="89.0" width="300" height="26" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="30" y="107.0" style="font-size:13px">Where air masses come from</text>
<circle cx="33" cy="125.0" r="2.2" class="ah"/>
<text class="s" x="42" y="129.0" style="font-size:11.5px">A source region is an area where air stays</text>
<text class="s" x="42" y="144.0" style="font-size:11.5px">relatively stagnant for days or longer, such</text>
<text class="s" x="42" y="159.0" style="font-size:11.5px">as polar regions, tropical oceans and dry</text>
<text class="s" x="42" y="174.0" style="font-size:11.5px">deserts.</text>
<circle cx="33" cy="188.0" r="2.2" class="ah"/>
<text class="s" x="42" y="192.0" style="font-size:11.5px">Named polar or tropical by temperature,</text>
<text class="s" x="42" y="207.0" style="font-size:11.5px">maritime or continental by moisture.</text>
<rect class="cl" x="331" y="89.0" width="184" height="134.0" rx="8"/>
<rect x="331" y="89.0" width="184" height="26" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="341" y="107.0" style="font-size:13px">Continental polar</text>
<circle cx="344" cy="125.0" r="2.2" class="ah"/>
<text class="s" x="353" y="129.0" style="font-size:11.5px">Forms over a polar</text>
<text class="s" x="353" y="144.0" style="font-size:11.5px">region.</text>
<circle cx="344" cy="158.0" r="2.2" class="ah"/>
<text class="s" x="353" y="162.0" style="font-size:11.5px">Brings cool, dry air.</text>
<rect class="cl" x="526" y="89.0" width="184" height="134.0" rx="8"/>
<rect x="526" y="89.0" width="184" height="26" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="536" y="107.0" style="font-size:13px">Maritime tropical</text>
<circle cx="539" cy="125.0" r="2.2" class="ah"/>
<text class="s" x="548" y="129.0" style="font-size:11.5px">Forms over warm tropical</text>
<text class="s" x="548" y="144.0" style="font-size:11.5px">waters like the Caribbean</text>
<text class="s" x="548" y="159.0" style="font-size:11.5px">Sea.</text>
<circle cx="539" cy="173.0" r="2.2" class="ah"/>
<text class="s" x="548" y="177.0" style="font-size:11.5px">Brings warm, moist air.</text>
<rect class="cl" x="20" y="235.0" width="337" height="190" rx="8"/>
<rect x="20" y="235.0" width="337" height="26" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="30" y="253.0" style="font-size:13px">Over a warmer surface</text>
<rect x="32" y="335.0" width="116" height="16" class="rose" style="stroke:currentColor;stroke-width:1.2"/>
<path d="M52 329.0L52.0 298.0" class="acc" style="stroke-width:2.5"/><path d="M52 289.0L56.0 298.0L48.0 298.0Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/>
<path d="M88 329.0L88.0 298.0" class="acc" style="stroke-width:2.5"/><path d="M88 289.0L92.0 298.0L84.0 298.0Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/>
<path d="M124 329.0L124.0 298.0" class="acc" style="stroke-width:2.5"/><path d="M124 289.0L128.1 298.0L120.0 298.0Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/>
<path d="M50 289.0A11.2 11.2 0 0 1 69.6 276.0A15.4 15.4 0 0 1 100.4 274.7A12.6 12.6 0 0 1 120 289.0Z" class="cl" style="stroke:currentColor;stroke-width:1.5;stroke-linejoin:round"/>
<circle cx="165" cy="277.0" r="2.2" class="ah"/>
<text class="s" x="174" y="281.0" style="font-size:11.5px">Warmed from below;</text>
<text class="s" x="174" y="296.0" style="font-size:11.5px">convective currents lift the</text>
<text class="s" x="174" y="311.0" style="font-size:11.5px">air: unstable, with good</text>
<text class="s" x="174" y="326.0" style="font-size:11.5px">surface visibility.</text>
<circle cx="165" cy="340.0" r="2.2" class="ah"/>
<text class="s" x="174" y="344.0" style="font-size:11.5px">Moist, unstable air gives</text>
<text class="s" x="174" y="359.0" style="font-size:11.5px">cumulus clouds, showers and</text>
<text class="s" x="174" y="374.0" style="font-size:11.5px">turbulence.</text>
<rect class="cl" x="373" y="235.0" width="337" height="190" rx="8"/>
<rect x="373" y="235.0" width="337" height="26" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="383" y="253.0" style="font-size:13px">Over a colder surface</text>
<rect x="385" y="335.0" width="116" height="16" class="sky" style="stroke:currentColor;stroke-width:1.2"/>
<circle cx="397" cy="327.0" r="2.2" class="ah"/>
<circle cx="419" cy="321.0" r="2.2" class="ah"/>
<circle cx="441" cy="327.0" r="2.2" class="ah"/>
<circle cx="463" cy="321.0" r="2.2" class="ah"/>
<circle cx="485" cy="327.0" r="2.2" class="ah"/>
<rect x="387" y="279.0" width="112" height="9" rx="4.5" class="cl" style="stroke:currentColor;stroke-width:1.2"/>
<rect x="395" y="295.0" width="96" height="9" rx="4.5" class="cl" style="stroke:currentColor;stroke-width:1.2"/>
<circle cx="518" cy="277.0" r="2.2" class="ah"/>
<text class="s" x="527" y="281.0" style="font-size:11.5px">No convective currents:</text>
<text class="s" x="527" y="296.0" style="font-size:11.5px">stable air with poor surface</text>
<text class="s" x="527" y="311.0" style="font-size:11.5px">visibility.</text>
<circle cx="518" cy="325.0" r="2.2" class="ah"/>
<text class="s" x="527" y="329.0" style="font-size:11.5px">Smoke, dust and other</text>
<text class="s" x="527" y="344.0" style="font-size:11.5px">particles stay trapped near</text>
<text class="s" x="527" y="359.0" style="font-size:11.5px">the surface.</text>
<circle cx="518" cy="373.0" r="2.2" class="ah"/>
<text class="s" x="527" y="377.0" style="font-size:11.5px">Can produce low stratus</text>
<text class="s" x="527" y="392.0" style="font-size:11.5px">clouds and fog.</text>
<text class="t" x="20" y="445.0" style="font-size:14px">Stationary front</text>
<rect class="cl" x="20" y="453.0" width="690" height="58" rx="8"/>
<text class="s" x="32" y="473.0" style="font-size:12px">When the forces of two air masses are relatively equal, the boundary between them stays put and affects</text>
<text class="s" x="32" y="488.5" style="font-size:12px">local weather for days. The weather is typically a mixture of what is found in both warm and cold fronts.</text>
<text class="t" x="20" y="531.0" style="font-size:14px">Occluded front</text>
<rect class="cl" x="20" y="539.0" width="690" height="48" rx="8"/>
<text class="s" x="32" y="558.0" style="font-size:12px">Occurs when a fast-moving cold front catches up with a slow-moving warm front. As it approaches, warm</text>
<text class="s" x="32" y="573.5" style="font-size:12px">front weather prevails, immediately followed by cold front weather.</text>
<rect class="cl" x="20.0" y="597.0" width="338.0" height="137.0" rx="8"/>
<rect x="20.0" y="597.0" width="338.0" height="26" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="30.0" y="615.0" style="font-size:13px">Cold front occlusion</text>
<circle cx="33.0" cy="633.0" r="2.2" class="ah"/>
<text class="s" x="42.0" y="637.0" style="font-size:11.5px">The cold front is colder than the air ahead of the</text>
<text class="s" x="42.0" y="652.0" style="font-size:11.5px">warm front.</text>
<circle cx="33.0" cy="666.0" r="2.2" class="ah"/>
<text class="s" x="42.0" y="670.0" style="font-size:11.5px">Cold air replaces the cool air and forces the warm</text>
<text class="s" x="42.0" y="685.0" style="font-size:11.5px">front aloft.</text>
<circle cx="33.0" cy="699.0" r="2.2" class="ah"/>
<text class="s" x="42.0" y="703.0" style="font-size:11.5px">Typically a mix of warm and cold front weather, if</text>
<text class="s" x="42.0" y="718.0" style="font-size:11.5px">the air is relatively stable.</text>
<rect class="cl" x="372.0" y="597.0" width="338.0" height="137.0" rx="8"/>
<rect x="372.0" y="597.0" width="338.0" height="26" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="382.0" y="615.0" style="font-size:13px">Warm front occlusion</text>
<circle cx="385.0" cy="633.0" r="2.2" class="ah"/>
<text class="s" x="394.0" y="637.0" style="font-size:11.5px">The air ahead of the warm front is colder than the</text>
<text class="s" x="394.0" y="652.0" style="font-size:11.5px">cold front air.</text>
<circle cx="385.0" cy="666.0" r="2.2" class="ah"/>
<text class="s" x="394.0" y="670.0" style="font-size:11.5px">The cold front rides up and over the warm front.</text>
<circle cx="385.0" cy="684.0" r="2.2" class="ah"/>
<text class="s" x="394.0" y="688.0" style="font-size:11.5px">If the air forced aloft is unstable, weather is</text>
<text class="s" x="394.0" y="703.0" style="font-size:11.5px">more severe than a cold front occlusion: embedded</text>
<text class="s" x="394.0" y="718.0" style="font-size:11.5px">thunderstorms, rain and fog likely.</text>
<text class="t" x="20" y="754.0" style="font-size:13px">Typical occluded front passage (cold front occlusion)</text>
<rect class="cl" x="20.0" y="762.0" width="220.66666666666666" height="140.0" rx="8"/>
<rect x="20.0" y="762.0" width="220.66666666666666" height="26" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="30.0" y="780.0" style="font-size:13px">Before</text>
<circle cx="33.0" cy="798.0" r="2.2" class="ah"/>
<text class="s" x="42.0" y="802.0" style="font-size:11.5px">Cirriform and stratiform</text>
<text class="s" x="42.0" y="817.0" style="font-size:11.5px">clouds.</text>
<circle cx="33.0" cy="831.0" r="2.2" class="ah"/>
<text class="s" x="42.0" y="835.0" style="font-size:11.5px">Light to heavy precipitation.</text>
<circle cx="33.0" cy="849.0" r="2.2" class="ah"/>
<text class="s" x="42.0" y="853.0" style="font-size:11.5px">Visibility poor.</text>
<circle cx="33.0" cy="867.0" r="2.2" class="ah"/>
<text class="s" x="42.0" y="871.0" style="font-size:11.5px">Dew point steady; barometric</text>
<text class="s" x="42.0" y="886.0" style="font-size:11.5px">pressure drops.</text>
<rect class="cl" x="254.66666666666666" y="762.0" width="220.66666666666666" height="140.0" rx="8"/>
<rect x="254.66666666666666" y="762.0" width="220.66666666666666" height="26" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="264.66666666666663" y="780.0" style="font-size:13px">During</text>
<circle cx="267.66666666666663" cy="798.0" r="2.2" class="ah"/>
<text class="s" x="276.66666666666663" y="802.0" style="font-size:11.5px">Nimbostratus and cumulonimbus;</text>
<text class="s" x="276.66666666666663" y="817.0" style="font-size:11.5px">towering cumulus may form.</text>
<circle cx="267.66666666666663" cy="831.0" r="2.2" class="ah"/>
<text class="s" x="276.66666666666663" y="835.0" style="font-size:11.5px">Light to heavy precipitation;</text>
<text class="s" x="276.66666666666663" y="850.0" style="font-size:11.5px">visibility poor.</text>
<circle cx="267.66666666666663" cy="864.0" r="2.2" class="ah"/>
<text class="s" x="276.66666666666663" y="868.0" style="font-size:11.5px">Winds variable.</text>
<circle cx="267.66666666666663" cy="882.0" r="2.2" class="ah"/>
<text class="s" x="276.66666666666663" y="886.0" style="font-size:11.5px">Barometric pressure levels off.</text>
<rect class="cl" x="489.3333333333333" y="762.0" width="220.66666666666666" height="140.0" rx="8"/>
<rect x="489.3333333333333" y="762.0" width="220.66666666666666" height="26" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="499.3333333333333" y="780.0" style="font-size:13px">After</text>
<circle cx="502.3333333333333" cy="798.0" r="2.2" class="ah"/>
<text class="s" x="511.3333333333333" y="802.0" style="font-size:11.5px">Nimbostratus and altostratus.</text>
<circle cx="502.3333333333333" cy="816.0" r="2.2" class="ah"/>
<text class="s" x="511.3333333333333" y="820.0" style="font-size:11.5px">Precipitation decreases.</text>
<circle cx="502.3333333333333" cy="834.0" r="2.2" class="ah"/>
<text class="s" x="511.3333333333333" y="838.0" style="font-size:11.5px">Visibility improves.</text>
<text class="t" x="20" y="922.0" style="font-size:14px">The four fronts side by side</text>
<rect x="20" y="930.0" width="84" height="83.0" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="62.0" y="976.5" style="font-size:13px">Warm</text>
<rect class="cl" x="108" y="930.0" width="602" height="83.0" rx="8"/>
<circle cx="120" cy="945.0" r="2.2" class="ah"/>
<text class="s" x="129" y="949.0" style="font-size:11.5px">Warm air advances and replaces colder air; moves 10 to 25 mph, with a gentler slope than a cold</text>
<text class="s" x="129" y="964.0" style="font-size:11.5px">front.</text>
<circle cx="120" cy="978.0" r="2.2" class="ah"/>
<text class="s" x="129" y="982.0" style="font-size:11.5px">Brings low ceilings, poor visibility and rain.</text>
<circle cx="120" cy="996.0" r="2.2" class="ah"/>
<text class="s" x="129" y="1000.0" style="font-size:11.5px">Gives advance warning of its approach and can take days to pass.</text>
<rect x="20" y="1018.0" width="84" height="113.0" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="62.0" y="1079.5" style="font-size:13px">Cold</text>
<rect class="cl" x="108" y="1018.0" width="602" height="113.0" rx="8"/>
<circle cx="120" cy="1033.0" r="2.2" class="ah"/>
<text class="s" x="129" y="1037.0" style="font-size:11.5px">Cold, dense, stable air replaces warmer air; moves 20 to 35 mph, with a steeper frontal slope.</text>
<circle cx="120" cy="1051.0" r="2.2" class="ah"/>
<text class="s" x="129" y="1055.0" style="font-size:11.5px">Brings sudden storms, gusty winds, turbulence, sometimes hail or tornadoes; the weather is</text>
<text class="s" x="129" y="1070.0" style="font-size:11.5px">usually along the boundary, not in advance. Summer squall lines can form as far as 200 miles</text>
<text class="s" x="129" y="1085.0" style="font-size:11.5px">ahead of a strong cold front.</text>
<circle cx="120" cy="1099.0" r="2.2" class="ah"/>
<text class="s" x="129" y="1103.0" style="font-size:11.5px">Approaches with little or no warning and changes the weather completely in a few hours. Clears</text>
<text class="s" x="129" y="1118.0" style="font-size:11.5px">rapidly after passage; drier air with unlimited visibility.</text>
<rect x="20" y="1136.0" width="84" height="65.0" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="62.0" y="1173.5" style="font-size:13px">Stationary</text>
<rect class="cl" x="108" y="1136.0" width="602" height="65.0" rx="8"/>
<circle cx="120" cy="1151.0" r="2.2" class="ah"/>
<text class="s" x="129" y="1155.0" style="font-size:11.5px">Two air masses of about equal force; the boundary stays in place and affects the weather for</text>
<text class="s" x="129" y="1170.0" style="font-size:11.5px">days.</text>
<circle cx="120" cy="1184.0" r="2.2" class="ah"/>
<text class="s" x="129" y="1188.0" style="font-size:11.5px">Weather is a mixture of warm and cold front weather.</text>
<rect x="20" y="1206.0" width="84" height="65.0" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="62.0" y="1243.5" style="font-size:13px">Occluded</text>
<rect class="cl" x="108" y="1206.0" width="602" height="65.0" rx="8"/>
<circle cx="120" cy="1221.0" r="2.2" class="ah"/>
<text class="s" x="129" y="1225.0" style="font-size:11.5px">A fast cold front catches a slow warm front: warm front weather, then cold front weather.</text>
<circle cx="120" cy="1239.0" r="2.2" class="ah"/>
<text class="s" x="129" y="1243.0" style="font-size:11.5px">A warm front occlusion with unstable air is more severe: embedded thunderstorms, rain and fog</text>
<text class="s" x="129" y="1258.0" style="font-size:11.5px">likely.</text>
</svg>
