<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 851.0" role="img" aria-labelledby="ti de"><title id="ti">Cloud types by height</title><desc id="de">Three stacked bands for high, middle and low clouds with the cloud names PHAK gives for each, a tall tower for clouds with vertical development from towering cumulus to cumulonimbus, and a list of word parts used in cloud names.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><text class="t" x="20" y="28" style="font-size:15px">Cloud types by height</text><text class="s" x="20" y="50.0" style="font-size:13px">PHAK classes clouds by the height of their bases: low, middle, high, and clouds with vertical</text><text class="s" x="20" y="66.5" style="font-size:13px">development. Band heights below are schematic.</text><rect x="20" y="89.0" width="470" height="150" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30" y="109.0" style="font-size:14px">High clouds</text><text class="s" x="30" y="126.0" style="font-size:11.5px">Above 20,000 ft AGL</text><path d="M34 155.0q28 -10 55 0t55 -6" class="dk" style="stroke-width:1.6;opacity:.8"/><path d="M34 169.0q28 -10 55 0t55 -6" class="dk" style="stroke-width:1.6;opacity:.8"/><path d="M34 183.0q28 -10 55 0t55 -6" class="dk" style="stroke-width:1.6;opacity:.8"/><text class="t" x="155" y="145.0" style="font-size:11.5px">Cirrus, cirrostratus, cirrocumulus</text><circle cx="158" cy="159.0" r="2.2" class="ah"/><text class="s" x="167" y="163.0" style="font-size:11px">Form usually only in stable air.</text><circle cx="158" cy="175.5" r="2.2" class="ah"/><text class="s" x="167" y="179.5" style="font-size:11px">Made up of ice crystals; no real threat of turbulence</text><text class="s" x="167" y="194.0" style="font-size:11px">or aircraft icing.</text><rect x="20" y="239.0" width="470" height="150" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30" y="259.0" style="font-size:14px">Middle clouds</text><text class="s" x="30" y="276.0" style="font-size:11.5px">About 6,500 to 20,000 ft AGL</text><rect x="34" y="309.0" width="110" height="11" rx="5.5" class="cl" style="stroke:currentColor;stroke-width:1.2"/><rect x="44" y="327.0" width="90" height="9" rx="4.5" class="cl" style="stroke:currentColor;stroke-width:1.2"/><path d="M40 373.0A6.4 6.4 0 0 1 51.2 365.0A8.8 8.8 0 0 1 68.8 364.2A7.2 7.2 0 0 1 80 373.0Z" class="cl" style="stroke:currentColor;stroke-width:1.5;stroke-linejoin:round"/><path d="M86 373.0A7.0 7.0 0 0 1 98.3 365.0A9.7 9.7 0 0 1 117.7 364.2A7.9 7.9 0 0 1 130 373.0Z" class="cl" style="stroke:currentColor;stroke-width:1.5;stroke-linejoin:round"/><text class="t" x="155" y="295.0" style="font-size:11.5px">Altostratus, altocumulus</text><circle cx="158" cy="309.0" r="2.2" class="ah"/><text class="s" x="167" y="313.0" style="font-size:11px">Water, ice crystals and supercooled water droplets.</text><circle cx="158" cy="325.5" r="2.2" class="ah"/><text class="s" x="167" y="329.5" style="font-size:11px">Altostratus can produce turbulence and may contain</text><text class="s" x="167" y="344.0" style="font-size:11px">moderate icing.</text><circle cx="158" cy="356.5" r="2.2" class="ah"/><text class="s" x="167" y="360.5" style="font-size:11px">Altocumulus usually forms as altostratus breaks</text><text class="s" x="167" y="375.0" style="font-size:11px">apart; may hold light turbulence and icing.</text><rect x="20" y="389.0" width="470" height="150" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30" y="409.0" style="font-size:14px">Low clouds</text><text class="s" x="30" y="426.0" style="font-size:11.5px">Surface up to about 6,500 ft AGL</text><rect x="34" y="455.0" width="110" height="9" rx="4.5" class="cl" style="stroke:currentColor;stroke-width:1.2"/><rect x="34" y="471.0" width="110" height="9" rx="4.5" class="cl" style="stroke:currentColor;stroke-width:1.2"/><rect x="34" y="487.0" width="110" height="9" rx="4.5" class="cl" style="stroke:currentColor;stroke-width:1.2"/><text class="t" x="155" y="445.0" style="font-size:11.5px">Stratus, stratocumulus, nimbostratus</text><circle cx="158" cy="459.0" r="2.2" class="ah"/><text class="s" x="167" y="463.0" style="font-size:11px">Mostly water droplets; can include supercooled</text><text class="s" x="167" y="477.5" style="font-size:11px">droplets that cause hazardous icing.</text><circle cx="158" cy="490.0" r="2.2" class="ah"/><text class="s" x="167" y="494.0" style="font-size:11px">Fog is also classed as a low cloud.</text><circle cx="158" cy="506.5" r="2.2" class="ah"/><text class="s" x="167" y="510.5" style="font-size:11px">Low ceilings, poor visibility, rapid change; can make</text><text class="s" x="167" y="525.0" style="font-size:11px">VFR flight impossible.</text><path d="M20 539.0L710 539.0" class="dk" style="stroke-width:3"/><rect class="cl" x="504" y="89.0" width="206" height="450" rx="8"/><rect x="504" y="89.0" width="206" height="26" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="514" y="107.0" style="font-size:13px">Vertical development</text><text class="s" x="514" y="135.0" style="font-size:10.5px">Bases in the low to middle</text><text class="s" x="514" y="148.0" style="font-size:10.5px">region; tops can reach</text><text class="s" x="514" y="161.0" style="font-size:10.5px">high levels</text><rect x="528" y="219.0" width="60" height="260.0" rx="22" class="cl" style="stroke:currentColor;stroke-width:1.5"/><ellipse cx="558" cy="223.0" rx="56" ry="12" class="cl" style="stroke:currentColor;stroke-width:1.5"/><ellipse cx="536" cy="505.0" rx="34" ry="26" class="cl" style="stroke:currentColor;stroke-width:1.5"/><ellipse cx="578" cy="509.0" rx="36" ry="24" class="cl" style="stroke:currentColor;stroke-width:1.5"/><ellipse cx="558" cy="519.0" rx="50" ry="14" class="cl" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="616" y="227.0" style="font-size:11px">Cumulonimbus</text><text class="s" x="616" y="369.0" style="font-size:10.5px">Towering</text><text class="s" x="616" y="382.0" style="font-size:10.5px">cumulus</text><text class="s" x="616" y="513.0" style="font-size:10.5px">Cumulus</text><rect class="cl" x="20" y="553.0" width="690" height="126.0" rx="8"/><circle cx="31" cy="567.0" r="2.2" class="ah"/><text class="s" x="40" y="571.0" style="font-size:11.5px">Towering cumulus shows instability; the air in and around it is turbulent, and it often develops into</text><text class="s" x="40" y="586.0" style="font-size:11.5px">cumulonimbus.</text><circle cx="31" cy="600.0" r="2.2" class="ah"/><text class="s" x="40" y="604.0" style="font-size:11.5px">Cumulonimbus holds large amounts of moisture and unstable air; usually brings lightning, hail, tornadoes,</text><text class="s" x="40" y="619.0" style="font-size:11.5px">gusty winds and wind shear.</text><circle cx="31" cy="633.0" r="2.2" class="ah"/><text class="s" x="40" y="637.0" style="font-size:11.5px">Can be hidden in other clouds: embedded thunderstorms.</text><circle cx="31" cy="651.0" r="2.2" class="ah"/><text class="s" x="40" y="655.0" style="font-size:11.5px">Updrafts and downdrafts in a thunderstorm can exceed 3,000 fpm.</text><text class="t" x="20" y="697.0" style="font-size:13px">Word parts in cloud names</text><rect x="20.0" y="705.0" width="100" height="28" rx="10" class="cl" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="70.0" y="724.0" style="font-size:12px">Cumulus</text><text class="s" x="128.0" y="718.0" style="font-size:11px">heaped or piled clouds</text><rect x="370.0" y="705.0" width="100" height="28" rx="10" class="cl" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="420.0" y="724.0" style="font-size:12px">Stratus</text><text class="s" x="478.0" y="718.0" style="font-size:11px">formed in layers</text><rect x="20.0" y="739.0" width="100" height="28" rx="10" class="cl" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="70.0" y="758.0" style="font-size:12px">Cirrus</text><text class="s" x="128.0" y="752.0" style="font-size:11px">ringlets, fibrous; also high level</text><text class="s" x="128.0" y="764.0" style="font-size:11px">clouds above 20,000 feet</text><rect x="370.0" y="739.0" width="100" height="28" rx="10" class="cl" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="420.0" y="758.0" style="font-size:12px">Nimbus</text><text class="s" x="478.0" y="752.0" style="font-size:11px">rain-bearing clouds</text><rect x="20.0" y="773.0" width="100" height="28" rx="10" class="cl" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="70.0" y="792.0" style="font-size:12px">Alto</text><text class="s" x="128.0" y="786.0" style="font-size:11px">middle level clouds</text><rect x="370.0" y="773.0" width="100" height="28" rx="10" class="cl" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="420.0" y="792.0" style="font-size:12px">Castellanus</text><text class="s" x="478.0" y="786.0" style="font-size:11px">common base with separate vertical</text><text class="s" x="478.0" y="798.0" style="font-size:11px">development, castle-like</text><rect x="20.0" y="807.0" width="100" height="28" rx="10" class="cl" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="70.0" y="826.0" style="font-size:12px">Lenticularus</text><text class="s" x="128.0" y="820.0" style="font-size:11px">lens-shaped, formed over mountains in</text><text class="s" x="128.0" y="832.0" style="font-size:11px">strong winds</text><rect x="370.0" y="807.0" width="100" height="28" rx="10" class="cl" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="420.0" y="826.0" style="font-size:12px">Fracto</text><text class="s" x="478.0" y="820.0" style="font-size:11px">ragged or broken</text></svg>
