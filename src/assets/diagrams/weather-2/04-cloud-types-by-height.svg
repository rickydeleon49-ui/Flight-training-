<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 851" role="img" aria-labelledby="ti de"><title id="ti">Cloud types by height</title><desc id="de">Three stacked bands for high, middle and low clouds with the cloud names PHAK gives for each, a tall tower for clouds with vertical development from towering cumulus to cumulonimbus, and a list of word parts used in cloud names.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11px}.q1{stroke:currentColor;stroke-width:1.5}.q2{font-size:11.5px}.q3{font-size:12px}.q4{font-size:10.5px}.q5{stroke:currentColor;stroke-width:1.2}.q6{font-size:13px}.q7{font-size:14px}.q8{stroke-width:1.6;opacity:.8}.q9{stroke:currentColor;stroke-width:1.5;stroke-linejoin:round}</style><text class="t" x="20" y="28" style="font-size:15px">Cloud types by height</text><text class="s q6" x="20" y="50">PHAK classes clouds by the height of their bases: low, middle, high, and clouds with vertical</text><text class="s q6" x="20" y="66.5">development. Band heights below are schematic.</text><rect x="20" y="89" width="470" height="150" class="mint q1"/><text class="t q7" x="30" y="109">High clouds</text><text class="s q2" x="30" y="126">Above 20,000 ft AGL</text><path d="M34 155q28 -10 55 0t55 -6" class="dk q8"/><path d="M34 169q28 -10 55 0t55 -6" class="dk q8"/><path d="M34 183q28 -10 55 0t55 -6" class="dk q8"/><text class="t q2" x="155" y="145">Cirrus, cirrostratus, cirrocumulus</text><circle cx="158" cy="159" r="2.2" class="ah"/><text class="s q0" x="167" y="163">Form usually only in stable air.</text><circle cx="158" cy="175.5" r="2.2" class="ah"/><text class="s q0" x="167" y="179.5">Made up of ice crystals; no real threat of turbulence</text><text class="s q0" x="167" y="194">or aircraft icing.</text><rect x="20" y="239" width="470" height="150" class="lav q1"/><text class="t q7" x="30" y="259">Middle clouds</text><text class="s q2" x="30" y="276">About 6,500 to 20,000 ft AGL</text><rect x="34" y="309" width="110" height="11" rx="5.5" class="cl q5"/><rect x="44" y="327" width="90" height="9" rx="4.5" class="cl q5"/><path d="M40 373A6.4 6.4 0 0 1 51.2 365A8.8 8.8 0 0 1 68.8 364.2A7.2 7.2 0 0 1 80 373Z" class="cl q9"/><path d="M86 373A7 7 0 0 1 98.3 365A9.7 9.7 0 0 1 117.7 364.2A7.9 7.9 0 0 1 130 373Z" class="cl q9"/><text class="t q2" x="155" y="295">Altostratus, altocumulus</text><circle cx="158" cy="309" r="2.2" class="ah"/><text class="s q0" x="167" y="313">Water, ice crystals and supercooled water droplets.</text><circle cx="158" cy="325.5" r="2.2" class="ah"/><text class="s q0" x="167" y="329.5">Altostratus can produce turbulence and may contain</text><text class="s q0" x="167" y="344">moderate icing.</text><circle cx="158" cy="356.5" r="2.2" class="ah"/><text class="s q0" x="167" y="360.5">Altocumulus usually forms as altostratus breaks</text><text class="s q0" x="167" y="375">apart; may hold light turbulence and icing.</text><rect x="20" y="389" width="470" height="150" class="sky q1"/><text class="t q7" x="30" y="409">Low clouds</text><text class="s q2" x="30" y="426">Surface up to about 6,500 ft AGL</text><rect x="34" y="455" width="110" height="9" rx="4.5" class="cl q5"/><rect x="34" y="471" width="110" height="9" rx="4.5" class="cl q5"/><rect x="34" y="487" width="110" height="9" rx="4.5" class="cl q5"/><text class="t q2" x="155" y="445">Stratus, stratocumulus, nimbostratus</text><circle cx="158" cy="459" r="2.2" class="ah"/><text class="s q0" x="167" y="463">Mostly water droplets; can include supercooled</text><text class="s q0" x="167" y="477.5">droplets that cause hazardous icing.</text><circle cx="158" cy="490" r="2.2" class="ah"/><text class="s q0" x="167" y="494">Fog is also classed as a low cloud.</text><circle cx="158" cy="506.5" r="2.2" class="ah"/><text class="s q0" x="167" y="510.5">Low ceilings, poor visibility, rapid change; can make</text><text class="s q0" x="167" y="525">VFR flight impossible.</text><path d="M20 539L710 539" class="dk" style="stroke-width:3"/><rect class="cl" x="504" y="89" width="206" height="450" rx="8"/><rect x="504" y="89" width="206" height="26" rx="10" class="rose q1"/><text class="t q6" x="514" y="107">Vertical development</text><text class="s q4" x="514" y="135">Bases in the low to middle</text><text class="s q4" x="514" y="148">region; tops can reach</text><text class="s q4" x="514" y="161">high levels</text><rect x="528" y="219" width="60" height="260" rx="22" class="cl q1"/><ellipse cx="558" cy="223" rx="56" ry="12" class="cl q1"/><ellipse cx="536" cy="505" rx="34" ry="26" class="cl q1"/><ellipse cx="578" cy="509" rx="36" ry="24" class="cl q1"/><ellipse cx="558" cy="519" rx="50" ry="14" class="cl q1"/><text class="t q0" x="616" y="227">Cumulonimbus</text><text class="s q4" x="616" y="369">Towering</text><text class="s q4" x="616" y="382">cumulus</text><text class="s q4" x="616" y="513">Cumulus</text><rect class="cl" x="20" y="553" width="690" height="126" rx="8"/><circle cx="31" cy="567" r="2.2" class="ah"/><text class="s q2" x="40" y="571">Towering cumulus shows instability; the air in and around it is turbulent, and it often develops into</text><text class="s q2" x="40" y="586">cumulonimbus.</text><circle cx="31" cy="600" r="2.2" class="ah"/><text class="s q2" x="40" y="604">Cumulonimbus holds large amounts of moisture and unstable air; usually brings lightning, hail, tornadoes,</text><text class="s q2" x="40" y="619">gusty winds and wind shear.</text><circle cx="31" cy="633" r="2.2" class="ah"/><text class="s q2" x="40" y="637">Can be hidden in other clouds: embedded thunderstorms.</text><circle cx="31" cy="651" r="2.2" class="ah"/><text class="s q2" x="40" y="655">Updrafts and downdrafts in a thunderstorm can exceed 3,000 fpm.</text><text class="t q6" x="20" y="697">Word parts in cloud names</text><rect x="20" y="705" width="100" height="28" rx="10" class="cl q1"/><text class="t m q3" x="70" y="724">Cumulus</text><text class="s q0" x="128" y="718">heaped or piled clouds</text><rect x="370" y="705" width="100" height="28" rx="10" class="cl q1"/><text class="t m q3" x="420" y="724">Stratus</text><text class="s q0" x="478" y="718">formed in layers</text><rect x="20" y="739" width="100" height="28" rx="10" class="cl q1"/><text class="t m q3" x="70" y="758">Cirrus</text><text class="s q0" x="128" y="752">ringlets, fibrous; also high level</text><text class="s q0" x="128" y="764">clouds above 20,000 feet</text><rect x="370" y="739" width="100" height="28" rx="10" class="cl q1"/><text class="t m q3" x="420" y="758">Nimbus</text><text class="s q0" x="478" y="752">rain-bearing clouds</text><rect x="20" y="773" width="100" height="28" rx="10" class="cl q1"/><text class="t m q3" x="70" y="792">Alto</text><text class="s q0" x="128" y="786">middle level clouds</text><rect x="370" y="773" width="100" height="28" rx="10" class="cl q1"/><text class="t m q3" x="420" y="792">Castellanus</text><text class="s q0" x="478" y="786">common base with separate vertical</text><text class="s q0" x="478" y="798">development, castle-like</text><rect x="20" y="807" width="100" height="28" rx="10" class="cl q1"/><text class="t m q3" x="70" y="826">Lenticularus</text><text class="s q0" x="128" y="820">lens-shaped, formed over mountains in</text><text class="s q0" x="128" y="832">strong winds</text><rect x="370" y="807" width="100" height="28" rx="10" class="cl q1"/><text class="t m q3" x="420" y="826">Fracto</text><text class="s q0" x="478" y="820">ragged or broken</text></svg>
