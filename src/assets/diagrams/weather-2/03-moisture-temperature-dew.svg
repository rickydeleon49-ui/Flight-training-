<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 822.5" role="img" aria-labelledby="ti de"><title id="ti">Moisture, temperature and dew</title><desc id="de">Bars showing that each 20 degree Fahrenheit rise doubles the moisture air can hold, a humidity example of 65 percent, four ways air reaches saturation, and how dew and frost form on a cool, clear, calm night.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11.5px}.q1{font-size:11px}.q2{font-size:13px}.q3{stroke:currentColor;stroke-width:1.5}.q4{font-size:12.5px}.q5{stroke-width:2}.q6{font-size:12px;fill:#fff}.q7{stroke-width:2.5}.q8{stroke:currentColor;stroke-width:1.4}.q9{font-size:10.5px}.q10{fill:var(--palette-berry,#A84C6B)}.q11{stroke:currentColor;stroke-width:1.2}</style><text class="t" x="20" y="28" style="font-size:15px">Moisture, temperature and dew</text><text class="s q2" x="20" y="50">How much water vapor the air can hold depends on its temperature. Cool it enough and the water becomes</text><text class="s q2" x="20" y="66.5">visible.</text><rect class="cl" x="20" y="93" width="337" height="206" rx="8"/><rect x="20" y="93" width="337" height="26" rx="10" class="sky q3"/><text class="t q2" x="30" y="111">Warmer air holds more moisture</text><rect x="50" y="215" width="70" height="24" class="sky q8"/><text class="t m q0" x="85" y="209">1 unit</text><text class="s m q1" x="85" y="255">Air at T</text><rect x="150" y="191" width="70" height="48" class="sky q8"/><text class="t m q0" x="185" y="185">2 units</text><text class="s m q1" x="185" y="255">T + 20 °F</text><rect x="250" y="151" width="70" height="88" class="sky q8"/><text class="t m q0" x="285" y="145">4 units</text><text class="s m q1" x="285" y="255">T + 40 °F</text><text class="s m q1" x="188.5" y="271">Example units. Each 20 °F rise doubles capacity;</text><text class="s m q1" x="188.5" y="285">each 20 °F fall halves it.</text><rect class="cl" x="373" y="93" width="337" height="206" rx="8"/><rect x="373" y="93" width="337" height="26" rx="10" class="lav q3"/><text class="t q2" x="383" y="111">Relative humidity and dew point</text><rect x="393" y="137" width="70" height="120" class="cl q3"/><rect x="393" y="179" width="70" height="78" class="sky q3"/><text class="t m" x="428" y="223" style="font-size:14px">65%</text><text class="s m q9" x="428" y="277">Example</text><text class="s q0" x="477" y="143">Relative humidity is the actual</text><text class="s q0" x="477" y="158">moisture in the air compared with the</text><text class="s q0" x="477" y="173">most it could hold at that</text><text class="s q0" x="477" y="188">temperature. At 65 percent, the air</text><text class="s q0" x="477" y="203">holds 65 percent of that total.</text><text class="s q0" x="477" y="225">The dew point is the temperature at</text><text class="s q0" x="477" y="240">which air can hold no more moisture.</text><text class="s q0" x="477" y="255">Cool the air to it and the air is</text><text class="s q0" x="477" y="270">saturated.</text><text class="t q2" x="20" y="323">Four ways air reaches saturation</text><rect class="cl" x="20" y="333" width="165" height="227.5" rx="8"/><circle cx="34" cy="349" r="10" class="ah"/><text class="t m q6" x="34" y="353">1</text><text class="t q4" x="50" y="353">Warm air over a</text><text class="t q4" x="50" y="368">cold surface</text><rect x="34" y="413" width="137" height="12" class="sky q11"/><path d="M42 399L154 399" class="acc q7"/><path d="M163 399L154 403.1L154 394.9Z" class="dh q10"/><text class="s q1" x="30" y="451">The air temperature drops</text><text class="s q1" x="30" y="465.5">and reaches the</text><text class="s q1" x="30" y="480">saturation point.</text><rect class="cl" x="195" y="333" width="165" height="227.5" rx="8"/><circle cx="209" cy="349" r="10" class="ah"/><text class="t m q6" x="209" y="353">2</text><text class="t q4" x="225" y="353">Cold and warm air</text><text class="t q4" x="225" y="368">mix</text><path d="M211 393L264.7 405" class="acc q7"/><path d="M273.5 407L263.8 409L265.6 401.1Z" class="dh q10"/><path d="M344 393L290.3 405" class="dk q7"/><path d="M281.5 407L289.4 401.1L291.2 409Z" class="dh" style=""/><text class="s m q9" x="277.5" y="429">warm + cold</text><text class="s q1" x="205" y="451">Mixing can bring the air</text><text class="s q1" x="205" y="465.5">to its saturation point.</text><rect class="cl" x="370" y="333" width="165" height="227.5" rx="8"/><circle cx="384" cy="349" r="10" class="ah"/><text class="t m q6" x="384" y="353">3</text><text class="t q4" x="400" y="353">Cooling at night</text><rect x="384" y="413" width="137" height="12" class="mint q11"/><path d="M422.5 389L422.5 398" class="dk q5"/><path d="M422.5 407L418.4 398L426.6 398Z" class="dh" style=""/><path d="M452.5 389L452.5 398" class="dk q5"/><path d="M452.5 407L448.4 398L456.6 398Z" class="dh" style=""/><path d="M482.5 389L482.5 398" class="dk q5"/><path d="M482.5 407L478.4 398L486.6 398Z" class="dh" style=""/><text class="s q1" x="380" y="451">Air in contact with the</text><text class="s q1" x="380" y="465.5">cooler ground cools to</text><text class="s q1" x="380" y="480">its saturation point.</text><rect class="cl" x="545" y="333" width="165" height="227.5" rx="8"/><circle cx="559" cy="349" r="10" class="ah"/><text class="t m q6" x="559" y="353">4</text><text class="t q4" x="575" y="353">Air is lifted</text><path d="M627.5 425L627.5 394" class="acc q7"/><path d="M627.5 385L631.5 394L623.5 394Z" class="dh q10"/><text class="s q9" x="635.5" y="407">rising</text><text class="s q1" x="555" y="451">Forced upward, the air</text><text class="s q1" x="555" y="465.5">expands and loses heat.</text><text class="s q1" x="555" y="480">Unsaturated air cools 3.0</text><text class="s q1" x="555" y="494.5">°C (5.4 °F) per 1,000</text><text class="s q1" x="555" y="509">feet; dew point falls 1</text><text class="s q1" x="555" y="523.5">°F per 1,000 feet, so</text><text class="s q1" x="555" y="538">they converge 4.4 °F.</text><text class="s q0" x="20" y="582.5">If saturation is reached while temperature and dew point are close together, fog, low clouds and precipitation are</text><text class="s q0" x="20" y="597.5">highly likely. Saturated air brings clouds, rain and other critical weather.</text><text class="t q2" x="20" y="630.5">Dew and frost on a cool, clear, calm night</text><rect x="20" y="640.5" width="690" height="48" rx="10" class="cl q3"/><text class="s" x="32" y="660.5" style="font-size:12px">Ground and surface objects cool the surrounding air below the dew point. The moisture condenses and</text><text class="s" x="32" y="676" style="font-size:12px">deposits itself on the ground, buildings, cars and aircraft.</text><path d="M200 690.5L200 697.5" class="dk q5"/><path d="M200 706.5L195.9 697.5L204.1 697.5Z" class="dh" style=""/><path d="M530 690.5L530 697.5" class="dk q5"/><path d="M530 706.5L526 697.5L534 697.5Z" class="dh" style=""/><rect class="cl" x="20" y="708.5" width="337" height="100" rx="8"/><rect x="20" y="708.5" width="337" height="26" rx="10" class="sky q3"/><text class="t q2" x="30" y="726.5">Above freezing: dew</text><text class="s q0" x="32" y="752.5">Dew is moisture on grass and other objects in the</text><text class="s q0" x="32" y="767.5">morning. It poses no threat to an aircraft.</text><rect class="cl" x="373" y="708.5" width="337" height="100" rx="8"/><rect x="373" y="708.5" width="337" height="26" rx="10" class="lav q3"/><text class="t q2" x="383" y="726.5">Below freezing: frost</text><text class="s q0" x="385" y="752.5">A definite flight safety hazard. Frost disrupts</text><text class="s q0" x="385" y="767.5">airflow over the wing, can drastically reduce lift,</text><text class="s q0" x="385" y="782.5">and increases drag, which can hurt takeoff. Clean it</text><text class="s q0" x="385" y="797.5">all off before flight.</text></svg>
