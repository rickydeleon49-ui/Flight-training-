<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 822.5" role="img" aria-labelledby="ti de"><title id="ti">Moisture, temperature and dew</title><desc id="de">Bars showing that each 20 degree Fahrenheit rise doubles the moisture air can hold, a humidity example of 65 percent, four ways air reaches saturation, and how dew and frost form on a cool, clear, calm night.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><text class="t" x="20" y="28" style="font-size:15px">Moisture, temperature and dew</text><text class="s" x="20" y="50.0" style="font-size:13px">How much water vapor the air can hold depends on its temperature. Cool it enough and the water becomes</text><text class="s" x="20" y="66.5" style="font-size:13px">visible.</text><rect class="cl" x="20" y="93.0" width="337" height="206" rx="8"/><rect x="20" y="93.0" width="337" height="26" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30" y="111.0" style="font-size:13px">Warmer air holds more moisture</text><rect x="50" y="215.0" width="70" height="24" class="sky" style="stroke:currentColor;stroke-width:1.4"/><text class="t m" x="85.0" y="209.0" style="font-size:11.5px">1 unit</text><text class="s m" x="85.0" y="255.0" style="font-size:11px">Air at T</text><rect x="150" y="191.0" width="70" height="48" class="sky" style="stroke:currentColor;stroke-width:1.4"/><text class="t m" x="185.0" y="185.0" style="font-size:11.5px">2 units</text><text class="s m" x="185.0" y="255.0" style="font-size:11px">T + 20 °F</text><rect x="250" y="151.0" width="70" height="88" class="sky" style="stroke:currentColor;stroke-width:1.4"/><text class="t m" x="285.0" y="145.0" style="font-size:11.5px">4 units</text><text class="s m" x="285.0" y="255.0" style="font-size:11px">T + 40 °F</text><text class="s m" x="188.5" y="271.0" style="font-size:11px">Example units. Each 20 °F rise doubles capacity;</text><text class="s m" x="188.5" y="285.0" style="font-size:11px">each 20 °F fall halves it.</text><rect class="cl" x="373" y="93.0" width="337" height="206" rx="8"/><rect x="373" y="93.0" width="337" height="26" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="383" y="111.0" style="font-size:13px">Relative humidity and dew point</text><rect x="393" y="137.0" width="70" height="120" class="cl" style="stroke:currentColor;stroke-width:1.5"/><rect x="393" y="179" width="70" height="78" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="428" y="223.0" style="font-size:14px">65%</text><text class="s m" x="428" y="277.0" style="font-size:10.5px">Example</text><text class="s" x="477" y="143.0" style="font-size:11.5px">Relative humidity is the actual</text><text class="s" x="477" y="158.0" style="font-size:11.5px">moisture in the air compared with the</text><text class="s" x="477" y="173.0" style="font-size:11.5px">most it could hold at that</text><text class="s" x="477" y="188.0" style="font-size:11.5px">temperature. At 65 percent, the air</text><text class="s" x="477" y="203.0" style="font-size:11.5px">holds 65 percent of that total.</text><text class="s" x="477" y="225.0" style="font-size:11.5px">The dew point is the temperature at</text><text class="s" x="477" y="240.0" style="font-size:11.5px">which air can hold no more moisture.</text><text class="s" x="477" y="255.0" style="font-size:11.5px">Cool the air to it and the air is</text><text class="s" x="477" y="270.0" style="font-size:11.5px">saturated.</text><text class="t" x="20" y="323.0" style="font-size:13px">Four ways air reaches saturation</text><rect class="cl" x="20.0" y="333.0" width="165.0" height="227.5" rx="8"/><circle cx="34.0" cy="349.0" r="10" class="ah"/><text class="t m" x="34.0" y="353.0" style="font-size:12px;fill:#fff">1</text><text class="t" x="50.0" y="353.0" style="font-size:12.5px">Warm air over a</text><text class="t" x="50.0" y="368.0" style="font-size:12.5px">cold surface</text><rect x="34.0" y="413.0" width="137.0" height="12" class="sky" style="stroke:currentColor;stroke-width:1.2"/><path d="M42.0 399.0L154.0 399.0" class="acc" style="stroke-width:2.5"/><path d="M163.0 399.0L154.0 403.1L154.0 394.9Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><text class="s" x="30.0" y="451.0" style="font-size:11px">The air temperature drops</text><text class="s" x="30.0" y="465.5" style="font-size:11px">and reaches the</text><text class="s" x="30.0" y="480.0" style="font-size:11px">saturation point.</text><rect class="cl" x="195.0" y="333.0" width="165.0" height="227.5" rx="8"/><circle cx="209.0" cy="349.0" r="10" class="ah"/><text class="t m" x="209.0" y="353.0" style="font-size:12px;fill:#fff">2</text><text class="t" x="225.0" y="353.0" style="font-size:12.5px">Cold and warm air</text><text class="t" x="225.0" y="368.0" style="font-size:12.5px">mix</text><path d="M211.0 393.0L264.7 405.0" class="acc" style="stroke-width:2.5"/><path d="M273.5 407.0L263.8 409.0L265.6 401.1Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><path d="M344.0 393.0L290.3 405.0" class="dk" style="stroke-width:2.5"/><path d="M281.5 407.0L289.4 401.1L291.2 409.0Z" class="dh" style=""/><text class="s m" x="277.5" y="429.0" style="font-size:10.5px">warm + cold</text><text class="s" x="205.0" y="451.0" style="font-size:11px">Mixing can bring the air</text><text class="s" x="205.0" y="465.5" style="font-size:11px">to its saturation point.</text><rect class="cl" x="370.0" y="333.0" width="165.0" height="227.5" rx="8"/><circle cx="384.0" cy="349.0" r="10" class="ah"/><text class="t m" x="384.0" y="353.0" style="font-size:12px;fill:#fff">3</text><text class="t" x="400.0" y="353.0" style="font-size:12.5px">Cooling at night</text><rect x="384.0" y="413.0" width="137.0" height="12" class="mint" style="stroke:currentColor;stroke-width:1.2"/><path d="M422.5 389.0L422.5 398.0" class="dk" style="stroke-width:2"/><path d="M422.5 407.0L418.4 398.0L426.6 398.0Z" class="dh" style=""/><path d="M452.5 389.0L452.5 398.0" class="dk" style="stroke-width:2"/><path d="M452.5 407.0L448.4 398.0L456.6 398.0Z" class="dh" style=""/><path d="M482.5 389.0L482.5 398.0" class="dk" style="stroke-width:2"/><path d="M482.5 407.0L478.4 398.0L486.6 398.0Z" class="dh" style=""/><text class="s" x="380.0" y="451.0" style="font-size:11px">Air in contact with the</text><text class="s" x="380.0" y="465.5" style="font-size:11px">cooler ground cools to</text><text class="s" x="380.0" y="480.0" style="font-size:11px">its saturation point.</text><rect class="cl" x="545.0" y="333.0" width="165.0" height="227.5" rx="8"/><circle cx="559.0" cy="349.0" r="10" class="ah"/><text class="t m" x="559.0" y="353.0" style="font-size:12px;fill:#fff">4</text><text class="t" x="575.0" y="353.0" style="font-size:12.5px">Air is lifted</text><path d="M627.5 425.0L627.5 394.0" class="acc" style="stroke-width:2.5"/><path d="M627.5 385.0L631.5 394.0L623.5 394.0Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><text class="s" x="635.5" y="407.0" style="font-size:10.5px">rising</text><text class="s" x="555.0" y="451.0" style="font-size:11px">Forced upward, the air</text><text class="s" x="555.0" y="465.5" style="font-size:11px">expands and loses heat.</text><text class="s" x="555.0" y="480.0" style="font-size:11px">Unsaturated air cools 3.0</text><text class="s" x="555.0" y="494.5" style="font-size:11px">°C (5.4 °F) per 1,000</text><text class="s" x="555.0" y="509.0" style="font-size:11px">feet; dew point falls 1</text><text class="s" x="555.0" y="523.5" style="font-size:11px">°F per 1,000 feet, so</text><text class="s" x="555.0" y="538.0" style="font-size:11px">they converge 4.4 °F.</text><text class="s" x="20" y="582.5" style="font-size:11.5px">If saturation is reached while temperature and dew point are close together, fog, low clouds and precipitation are</text><text class="s" x="20" y="597.5" style="font-size:11.5px">highly likely. Saturated air brings clouds, rain and other critical weather.</text><text class="t" x="20" y="630.5" style="font-size:13px">Dew and frost on a cool, clear, calm night</text><rect x="20" y="640.5" width="690" height="48" rx="10" class="cl" style="stroke:currentColor;stroke-width:1.5"/><text class="s" x="32" y="660.5" style="font-size:12px">Ground and surface objects cool the surrounding air below the dew point. The moisture condenses and</text><text class="s" x="32" y="676.0" style="font-size:12px">deposits itself on the ground, buildings, cars and aircraft.</text><path d="M200 690.5L200.0 697.5" class="dk" style="stroke-width:2"/><path d="M200 706.5L195.9 697.5L204.1 697.5Z" class="dh" style=""/><path d="M530 690.5L530.0 697.5" class="dk" style="stroke-width:2"/><path d="M530 706.5L526.0 697.5L534.0 697.5Z" class="dh" style=""/><rect class="cl" x="20" y="708.5" width="337" height="100" rx="8"/><rect x="20" y="708.5" width="337" height="26" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30" y="726.5" style="font-size:13px">Above freezing: dew</text><text class="s" x="32" y="752.5" style="font-size:11.5px">Dew is moisture on grass and other objects in the</text><text class="s" x="32" y="767.5" style="font-size:11.5px">morning. It poses no threat to an aircraft.</text><rect class="cl" x="373" y="708.5" width="337" height="100" rx="8"/><rect x="373" y="708.5" width="337" height="26" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="383" y="726.5" style="font-size:13px">Below freezing: frost</text><text class="s" x="385" y="752.5" style="font-size:11.5px">A definite flight safety hazard. Frost disrupts</text><text class="s" x="385" y="767.5" style="font-size:11.5px">airflow over the wing, can drastically reduce lift,</text><text class="s" x="385" y="782.5" style="font-size:11.5px">and increases drag, which can hurt takeoff. Clean it</text><text class="s" x="385" y="797.5" style="font-size:11.5px">all off before flight.</text></svg>
