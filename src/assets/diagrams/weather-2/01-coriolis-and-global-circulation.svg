<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 778" role="img" aria-labelledby="ti de"><title id="ti">Coriolis force and global circulation</title><desc id="de">Meridional cross section from the equator to the North Pole showing three circulation cells. In the first cell warm air rises at the equator, flows north aloft, sinks near 30 degrees latitude and returns south at the surface as the northeasterly trade winds. A wedge shows Coriolis deflection growing from zero at the equator to greatest at the poles. Cards give what PHAK says about Coriolis force and friction.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11.5px}.q1{font-size:13px}.q2{font-size:12px;fill:#fff}.q3{stroke-width:1.5}.q4{stroke-width:2.5}.q5{fill:var(--palette-berry,#A84C6B)}.q6{stroke:none}.q7{stroke:currentColor;stroke-width:1.5}</style><text class="t" x="20" y="28" style="font-size:15px">Coriolis force and global circulation (Northern Hemisphere)</text><text class="s q1" x="20" y="50">Uneven heating sets air moving; the rotation of the Earth bends the flow into three cells. Cell widths</text><text class="s q1" x="20" y="66.5">here are schematic, not to scale.</text><rect class="cl" x="20" y="96" width="690" height="262" rx="8"/><text class="s q0" x="40" y="118">Low pressure</text><text class="s e q0" x="706" y="118">High pressure</text><text class="t m" x="373" y="118" style="font-size:12.5px">Equator to North Pole</text><path d="M50 292L686 292" class="dk" style="stroke-width:3"/><path d="M70 292L70 298" class="dk q3"/><text class="s m q0" x="70" y="312">Equator 0°</text><path d="M285 292L285 298" class="dk q3"/><text class="s m q0" x="285" y="312">30°</text><path d="M490 292L490 298" class="dk q3"/><text class="s m q0" x="490" y="312">60°</text><path d="M676 292L676 298" class="dk q3"/><text class="s m q0" x="676" y="312">North Pole</text><rect x="78" y="158" width="199" height="112" rx="14" class="sky q6"/><path d="M86 262L86 189" class="acc q4"/><path d="M86 180L90 189L82 189Z" class="dh q5"/><path d="M104 168L246 168" class="acc q4"/><path d="M255 168L246 172.1L246 163.9Z" class="dh q5"/><path d="M269 180L269 253" class="acc q4"/><path d="M269 262L264.9 253L273.1 253Z" class="dh q5"/><path d="M251 266L113 266" class="acc q4"/><path d="M104 266L113 261.9L113 270.1Z" class="dh q5"/><circle cx="86" cy="214" r="10" class="ah"/><text class="t m q2" x="86" y="218">1</text><circle cx="177.5" cy="168" r="10" class="ah"/><text class="t m q2" x="177.5" y="172">2</text><circle cx="269" cy="214" r="10" class="ah"/><text class="t m q2" x="269" y="218">3</text><circle cx="177.5" cy="266" r="10" class="ah"/><text class="t m q2" x="177.5" y="270">4</text><text class="t m q1" x="177.5" y="218">Cell 1</text><rect x="293" y="158" width="189" height="112" rx="14" class="lav q6"/><text class="t m q1" x="387.5" y="212">Cell 2</text><text class="s m q0" x="387.5" y="228">30° to 60° latitude</text><rect x="498" y="158" width="170" height="112" rx="14" class="mint q6"/><text class="t m q1" x="583" y="212">Cell 3</text><text class="s m q0" x="583" y="228">60° to the pole</text><path d="M70 336L676 328L676 344Z" class="rose" style="stroke:currentColor;stroke-width:1.2"/><text class="s q0" x="70" y="354">Coriolis deflection: zero at the equator</text><text class="s e q0" x="686" y="354">greatest at the poles</text><circle cx="31" cy="382" r="10" class="ah"/><text class="t m q2" x="31" y="386">1</text><text class="s q0" x="48" y="386">Warm air at the equator rises from the surface.</text><circle cx="384" cy="382" r="10" class="ah"/><text class="t m q2" x="384" y="386">2</text><text class="s q0" x="401" y="386">It travels northward aloft and is deflected</text><text class="s q0" x="401" y="401">eastward by the rotation of the Earth. By one-third</text><text class="s q0" x="401" y="416">of the way to the pole it is moving eastward, not</text><text class="s q0" x="401" y="431">northward.</text><circle cx="31" cy="454" r="10" class="ah"/><text class="t m q2" x="31" y="458">3</text><text class="s q0" x="48" y="458">It cools and sinks in a belt at about 30° latitude,</text><text class="s q0" x="48" y="473">creating an area of high pressure.</text><circle cx="384" cy="454" r="10" class="ah"/><text class="t m q2" x="384" y="458">4</text><text class="s q0" x="401" y="458">At the surface it flows back toward the equator;</text><text class="s q0" x="401" y="473">Coriolis force bends it to the right, making the</text><text class="s q0" x="401" y="488">northeasterly trade winds that prevail from 30°</text><text class="s q0" x="401" y="503">latitude to the equator.</text><rect class="cl" x="20" y="522" width="220.67" height="242" rx="8"/><rect x="20" y="522" width="220.67" height="26" rx="10" class="sky q7"/><text class="t q1" x="30" y="540">Coriolis force</text><circle cx="33" cy="558" r="2.2" class="ah"/><text class="s q0" x="42" y="562">The force created by the</text><text class="s q0" x="42" y="577">rotation of the Earth; it</text><text class="s q0" x="42" y="592">deflects air to the right in</text><text class="s q0" x="42" y="607">the Northern Hemisphere, so air</text><text class="s q0" x="42" y="622">follows a curved path.</text><circle cx="33" cy="636" r="2.2" class="ah"/><text class="s q0" x="42" y="640">Greatest at the poles and zero</text><text class="s q0" x="42" y="655">at the equator; the greater the</text><text class="s q0" x="42" y="670">speed, the greater the</text><text class="s q0" x="42" y="685">deviation.</text><circle cx="33" cy="699" r="2.2" class="ah"/><text class="s q0" x="42" y="703">Not felt by people walking, but</text><text class="s q0" x="42" y="718">it significantly affects air</text><text class="s q0" x="42" y="733">masses and bodies of water over</text><text class="s q0" x="42" y="748">large distances.</text><rect class="cl" x="254.67" y="522" width="220.67" height="242" rx="8"/><rect x="254.67" y="522" width="220.67" height="26" rx="10" class="lav q7"/><text class="t q1" x="264.67" y="540">What it does to circulation</text><circle cx="267.67" cy="558" r="2.2" class="ah"/><text class="s q0" x="276.67" y="562">Breaks the general flow into</text><text class="s q0" x="276.67" y="577">three distinct cells in each</text><text class="s q0" x="276.67" y="592">hemisphere.</text><circle cx="267.67" cy="606" r="2.2" class="ah"/><text class="s q0" x="276.67" y="610">Similar forces make cells</text><text class="s q0" x="276.67" y="625">between 30° and 60° latitude</text><text class="s q0" x="276.67" y="640">and between 60° and the poles.</text><circle cx="267.67" cy="654" r="2.2" class="ah"/><text class="s q0" x="276.67" y="658">Result: the prevailing upper</text><text class="s q0" x="276.67" y="673">level westerly winds over the</text><text class="s q0" x="276.67" y="688">conterminous United States.</text><rect class="cl" x="489.33" y="522" width="220.67" height="242" rx="8"/><rect x="489.33" y="522" width="220.67" height="26" rx="10" class="mint q7"/><text class="t q1" x="499.33" y="540">Near the ground</text><circle cx="502.33" cy="558" r="2.2" class="ah"/><text class="s q0" x="511.33" y="562">Within 2,000 feet of the</text><text class="s q0" x="511.33" y="577">ground, friction slows the</text><text class="s q0" x="511.33" y="592">moving air and diverts it from</text><text class="s q0" x="511.33" y="607">its path.</text><circle cx="502.33" cy="621" r="2.2" class="ah"/><text class="s q0" x="511.33" y="625">So the surface wind direction</text><text class="s q0" x="511.33" y="640">differs somewhat from the wind</text><text class="s q0" x="511.33" y="655">a few thousand feet above.</text><circle cx="502.33" cy="669" r="2.2" class="ah"/><text class="s q0" x="511.33" y="673">Seasons, continents versus</text><text class="s q0" x="511.33" y="688">oceans, and topography</text><text class="s q0" x="511.33" y="703">complicate the pattern further.</text></svg>
