<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 1021" role="img" aria-labelledby="ti de"><title id="ti">Local winds and mountain flow</title><desc id="de">Sea breeze by day and land breeze by night with their directions, updrafts over pavement and bare ground and downdrafts over water and vegetation, and a mountain profile with smooth windward flow and turbulent leeward flow, plus what PHAK says about obstructions.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11.5px}.q1{font-size:11px}.q2{font-size:13px}.q3{stroke:currentColor;stroke-width:1.2}.q4{stroke-width:2.5}.q5{fill:var(--palette-berry,#A84C6B)}.q6{stroke:currentColor;stroke-width:1.5}.q7{stroke-width:3}.q8{font-size:10.5px}.q9{stroke-width:2.2}.q10{stroke-width:1.8;opacity:.85}</style><text class="t" x="20" y="28" style="font-size:15px">Local winds: breezes, convection and terrain</text><text class="s q2" x="20" y="50">Large-scale circulation theory does not account for local changes. Local conditions and geological</text><text class="s q2" x="20" y="66.5">features can change wind direction and speed close to the ground.</text><rect class="cl" x="20" y="91" width="337" height="250" rx="8"/><rect x="20" y="91" width="337" height="26" rx="10" class="sky q6"/><text class="t q2" x="30" y="109">Sea breeze (day)</text><rect x="30" y="229" width="158.5" height="26" class="sky q3"/><text class="s m q0" x="109.25" y="247">Water</text><rect x="188.5" y="229" width="158.5" height="26" class="rose q3"/><text class="s m q0" x="267.75" y="247">Land</text><path d="M272.75 219L272.8 160" class="acc q4"/><path d="M272.75 151L276.8 160L268.7 160Z" class="dh q5"/><text class="s m q1" x="272.75" y="143">Warm air rises</text><path d="M50 211L209.5 211" class="dk q7"/><path d="M218.5 211L209.5 215.1L209.5 206.9Z" class="dh" style=""/><text class="t m q0" x="134.25" y="203">Sea breeze (onshore)</text><text class="s q0" x="30" y="275">Land heats faster than water. Air over land becomes</text><text class="s q0" x="30" y="290">warmer and less dense, rises, and is replaced by</text><text class="s q0" x="30" y="305">cooler, denser air from over the water: an onshore</text><text class="s q0" x="30" y="320">wind.</text><rect class="cl" x="373" y="91" width="337" height="250" rx="8"/><rect x="373" y="91" width="337" height="26" rx="10" class="lav q6"/><text class="t q2" x="383" y="109">Land breeze (night)</text><rect x="383" y="229" width="158.5" height="26" class="sky q3"/><text class="s m q0" x="462.25" y="247">Water</text><rect x="541.5" y="229" width="158.5" height="26" class="rose q3"/><text class="s m q0" x="620.75" y="247">Land</text><path d="M457.25 219L457.2 160" class="acc q4"/><path d="M457.25 151L461.3 160L453.2 160Z" class="dh q5"/><text class="s m q1" x="457.25" y="143">Warm air rises</text><path d="M680 211L520.5 211" class="dk q7"/><path d="M511.5 211L520.5 206.9L520.5 215.1Z" class="dh" style=""/><text class="t m q0" x="595.75" y="203">Land breeze (offshore)</text><text class="s q0" x="383" y="275">Land cools faster than water, and so does the air</text><text class="s q0" x="383" y="290">above it. The warmer air over the water rises and is</text><text class="s q0" x="383" y="305">replaced by cooler, denser air from the land: an</text><text class="s q0" x="383" y="320">offshore wind.</text><text class="t q2" x="20" y="361">Convective currents: uneven heating of the ground</text><rect class="cl" x="20" y="371" width="690" height="196" rx="8"/><rect x="40" y="461" width="160" height="24" class="rose q3"/><text class="s m q8" x="120" y="478">Pavement or barren ground</text><path d="M120 455L120 402" class="acc q4"/><path d="M120 393L124 402L116 402Z" class="dh q5"/><text class="t m q1" x="120" y="387">Updraft</text><rect x="210" y="461" width="150" height="24" class="sky q3"/><text class="s m q8" x="285" y="478">Water</text><path d="M285 393L285 446" class="dk q4"/><path d="M285 455L280.9 446L289.1 446Z" class="dh" style=""/><text class="t m q1" x="285" y="387">Downdraft</text><rect x="370" y="461" width="150" height="24" class="mint q3"/><text class="s m q8" x="445" y="478">Trees and vegetation</text><path d="M445 393L445 446" class="dk q4"/><path d="M445 455L440.9 446L449.1 446Z" class="dh" style=""/><text class="t m q1" x="445" y="387">Downdraft</text><rect x="530" y="461" width="160" height="24" class="rose q3"/><text class="s m q8" x="610" y="478">Plowed ground, rocks, sand</text><path d="M610 455L610 402" class="acc q4"/><path d="M610 393L614 402L606 402Z" class="dh q5"/><text class="t m q1" x="610" y="387">Updraft</text><text class="s q0" x="32" y="505">Convective currents cause bumpy, turbulent air at low altitude in warm weather. These conditions can typically</text><text class="s q0" x="32" y="520">be avoided by flying higher, even above cumulus cloud layers. On final approach, rising air over bare terrain</text><text class="s q0" x="32" y="535">can balloon the aircraft past the landing spot; sinking air over water or thick vegetation can make an unwary</text><text class="s q0" x="32" y="550">pilot land short.</text><text class="t q2" x="20" y="593">Obstructions and mountains</text><rect class="cl" x="20" y="603" width="420" height="230" rx="8"/><path d="M30 803L240 713L430 803Z" class="rose" style="stroke:currentColor;stroke-width:1.6;stroke-linejoin:round"/><path d="M20 803L440 803" class="dk q7"/><path d="M34 781L234 693Q248 685 262 701" class="dk q9"/><path d="M34 767L234 679Q248 671 262 687" class="dk q9"/><path d="M34 753L234 665Q248 657 262 673" class="dk q9"/><path d="M120 704.43L161.7 686.5" class="dk q9"/><path d="M170 683L163.3 690.3L160.1 682.8Z" class="dh" style=""/><path d="M270 719q8 -8 16 0t16 0t16 0" class="dk q10"/><path d="M320 743q8 -8 16 0t16 0t16 0" class="dk q10"/><path d="M370 766q8 -8 16 0t16 0t16 0" class="dk q10"/><path d="M390 683L425.2 739.4" class="acc q7"/><path d="M430 747L421.8 741.5L428.7 737.2Z" class="dh q5"/><text class="s q1" x="32" y="645">Windward side: smooth flow;</text><text class="s q1" x="32" y="659">upward currents help carry an</text><text class="s q1" x="32" y="673">aircraft over the peak</text><text class="s q1" x="300" y="645">Leeward side: air follows</text><text class="s q1" x="300" y="659">the terrain and is</text><text class="s q1" x="300" y="673">increasingly turbulent</text><text class="s q1" x="32" y="823">Turbulence over terrain (schematic)</text><rect class="cl" x="452" y="603" width="258" height="218" rx="8"/><rect x="452" y="603" width="258" height="26" rx="10" class="lav q6"/><text class="t q2" x="462" y="621">Obstructions</text><circle cx="465" cy="639" r="2.2" class="ah"/><text class="s q0" x="474" y="643">Ground topography and large</text><text class="s q0" x="474" y="658">buildings, from hangars to mountains,</text><text class="s q0" x="474" y="673">bluffs and canyons, break up the wind</text><text class="s q0" x="474" y="688">into gusts that change rapidly in</text><text class="s q0" x="474" y="703">direction and speed.</text><circle cx="465" cy="717" r="2.2" class="ah"/><text class="s q0" x="474" y="721">Turbulence intensity depends on the</text><text class="s q0" x="474" y="736">size of the obstacle and the primary</text><text class="s q0" x="474" y="751">wind velocity.</text><circle cx="465" cy="765" r="2.2" class="ah"/><text class="s q0" x="474" y="769">On landing, an aircraft may "drop in"</text><text class="s q0" x="474" y="784">and be too low to clear obstacles on</text><text class="s q0" x="474" y="799">the approach.</text><rect class="cl" x="452" y="825" width="258" height="188" rx="8"/><rect x="452" y="825" width="258" height="26" rx="10" class="rose q6"/><text class="t q2" x="462" y="843">Mountains</text><circle cx="465" cy="861" r="2.2" class="ah"/><text class="s q0" x="474" y="865">Leeward side: the air follows the</text><text class="s q0" x="474" y="880">terrain contour and is increasingly</text><text class="s q0" x="474" y="895">turbulent, which tends to push an</text><text class="s q0" x="474" y="910">aircraft into the mountainside.</text><circle cx="465" cy="924" r="2.2" class="ah"/><text class="s q0" x="474" y="928">The stronger the wind, the greater</text><text class="s q0" x="474" y="943">the downward pressure and turbulence.</text><circle cx="465" cy="957" r="2.2" class="ah"/><text class="s q0" x="474" y="961">Downdrafts in valleys or canyons can</text><text class="s q0" x="474" y="976">be severe; get a checkout with a</text><text class="s q0" x="474" y="991">mountain-qualified flight instructor.</text></svg>
