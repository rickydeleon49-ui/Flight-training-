<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 1021.0" role="img" aria-labelledby="ti de"><title id="ti">Local winds and mountain flow</title><desc id="de">Sea breeze by day and land breeze by night with their directions, updrafts over pavement and bare ground and downdrafts over water and vegetation, and a mountain profile with smooth windward flow and turbulent leeward flow, plus what PHAK says about obstructions.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><text class="t" x="20" y="28" style="font-size:15px">Local winds: breezes, convection and terrain</text><text class="s" x="20" y="50.0" style="font-size:13px">Large-scale circulation theory does not account for local changes. Local conditions and geological</text><text class="s" x="20" y="66.5" style="font-size:13px">features can change wind direction and speed close to the ground.</text><rect class="cl" x="20" y="91.0" width="337" height="250" rx="8"/><rect x="20" y="91.0" width="337" height="26" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30" y="109.0" style="font-size:13px">Sea breeze (day)</text><rect x="30" y="229.0" width="158.5" height="26" class="sky" style="stroke:currentColor;stroke-width:1.2"/><text class="s m" x="109.25" y="247.0" style="font-size:11.5px">Water</text><rect x="188.5" y="229.0" width="158.5" height="26" class="rose" style="stroke:currentColor;stroke-width:1.2"/><text class="s m" x="267.75" y="247.0" style="font-size:11.5px">Land</text><path d="M272.75 219.0L272.8 160.0" class="acc" style="stroke-width:2.5"/><path d="M272.75 151.0L276.8 160.0L268.7 160.0Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><text class="s m" x="272.75" y="143.0" style="font-size:11px">Warm air rises</text><path d="M50 211.0L209.5 211.0" class="dk" style="stroke-width:3"/><path d="M218.5 211.0L209.5 215.1L209.5 206.9Z" class="dh" style=""/><text class="t m" x="134.25" y="203.0" style="font-size:11.5px">Sea breeze (onshore)</text><text class="s" x="30" y="275.0" style="font-size:11.5px">Land heats faster than water. Air over land becomes</text><text class="s" x="30" y="290.0" style="font-size:11.5px">warmer and less dense, rises, and is replaced by</text><text class="s" x="30" y="305.0" style="font-size:11.5px">cooler, denser air from over the water: an onshore</text><text class="s" x="30" y="320.0" style="font-size:11.5px">wind.</text><rect class="cl" x="373" y="91.0" width="337" height="250" rx="8"/><rect x="373" y="91.0" width="337" height="26" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="383" y="109.0" style="font-size:13px">Land breeze (night)</text><rect x="383" y="229.0" width="158.5" height="26" class="sky" style="stroke:currentColor;stroke-width:1.2"/><text class="s m" x="462.25" y="247.0" style="font-size:11.5px">Water</text><rect x="541.5" y="229.0" width="158.5" height="26" class="rose" style="stroke:currentColor;stroke-width:1.2"/><text class="s m" x="620.75" y="247.0" style="font-size:11.5px">Land</text><path d="M457.25 219.0L457.2 160.0" class="acc" style="stroke-width:2.5"/><path d="M457.25 151.0L461.3 160.0L453.2 160.0Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><text class="s m" x="457.25" y="143.0" style="font-size:11px">Warm air rises</text><path d="M680 211.0L520.5 211.0" class="dk" style="stroke-width:3"/><path d="M511.5 211.0L520.5 206.9L520.5 215.1Z" class="dh" style=""/><text class="t m" x="595.75" y="203.0" style="font-size:11.5px">Land breeze (offshore)</text><text class="s" x="383" y="275.0" style="font-size:11.5px">Land cools faster than water, and so does the air</text><text class="s" x="383" y="290.0" style="font-size:11.5px">above it. The warmer air over the water rises and is</text><text class="s" x="383" y="305.0" style="font-size:11.5px">replaced by cooler, denser air from the land: an</text><text class="s" x="383" y="320.0" style="font-size:11.5px">offshore wind.</text><text class="t" x="20" y="361.0" style="font-size:13px">Convective currents: uneven heating of the ground</text><rect class="cl" x="20" y="371.0" width="690" height="196" rx="8"/><rect x="40" y="461.0" width="160" height="24" class="rose" style="stroke:currentColor;stroke-width:1.2"/><text class="s m" x="120.0" y="478.0" style="font-size:10.5px">Pavement or barren ground</text><path d="M120.0 455.0L120.0 402.0" class="acc" style="stroke-width:2.5"/><path d="M120.0 393.0L124.0 402.0L116.0 402.0Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><text class="t m" x="120.0" y="387.0" style="font-size:11px">Updraft</text><rect x="210" y="461.0" width="150" height="24" class="sky" style="stroke:currentColor;stroke-width:1.2"/><text class="s m" x="285.0" y="478.0" style="font-size:10.5px">Water</text><path d="M285.0 393.0L285.0 446.0" class="dk" style="stroke-width:2.5"/><path d="M285.0 455.0L280.9 446.0L289.1 446.0Z" class="dh" style=""/><text class="t m" x="285.0" y="387.0" style="font-size:11px">Downdraft</text><rect x="370" y="461.0" width="150" height="24" class="mint" style="stroke:currentColor;stroke-width:1.2"/><text class="s m" x="445.0" y="478.0" style="font-size:10.5px">Trees and vegetation</text><path d="M445.0 393.0L445.0 446.0" class="dk" style="stroke-width:2.5"/><path d="M445.0 455.0L440.9 446.0L449.1 446.0Z" class="dh" style=""/><text class="t m" x="445.0" y="387.0" style="font-size:11px">Downdraft</text><rect x="530" y="461.0" width="160" height="24" class="rose" style="stroke:currentColor;stroke-width:1.2"/><text class="s m" x="610.0" y="478.0" style="font-size:10.5px">Plowed ground, rocks, sand</text><path d="M610.0 455.0L610.0 402.0" class="acc" style="stroke-width:2.5"/><path d="M610.0 393.0L614.0 402.0L606.0 402.0Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><text class="t m" x="610.0" y="387.0" style="font-size:11px">Updraft</text><text class="s" x="32" y="505.0" style="font-size:11.5px">Convective currents cause bumpy, turbulent air at low altitude in warm weather. These conditions can typically</text><text class="s" x="32" y="520.0" style="font-size:11.5px">be avoided by flying higher, even above cumulus cloud layers. On final approach, rising air over bare terrain</text><text class="s" x="32" y="535.0" style="font-size:11.5px">can balloon the aircraft past the landing spot; sinking air over water or thick vegetation can make an unwary</text><text class="s" x="32" y="550.0" style="font-size:11.5px">pilot land short.</text><text class="t" x="20" y="593.0" style="font-size:13px">Obstructions and mountains</text><rect class="cl" x="20" y="603.0" width="420" height="230" rx="8"/><path d="M30 803.0L240 713.0L430 803.0Z" class="rose" style="stroke:currentColor;stroke-width:1.6;stroke-linejoin:round"/><path d="M20 803.0L440 803.0" class="dk" style="stroke-width:3"/><path d="M34 781L234 693Q248 685 262 701" class="dk" style="stroke-width:2.2"/><path d="M34 767L234 679Q248 671 262 687" class="dk" style="stroke-width:2.2"/><path d="M34 753L234 665Q248 657 262 673" class="dk" style="stroke-width:2.2"/><path d="M120 704.43L161.7 686.5" class="dk" style="stroke-width:2.2"/><path d="M170 683.0L163.3 690.3L160.1 682.8Z" class="dh" style=""/><path d="M270 719q8 -8 16 0t16 0t16 0" class="dk" style="stroke-width:1.8;opacity:.85"/><path d="M320 743q8 -8 16 0t16 0t16 0" class="dk" style="stroke-width:1.8;opacity:.85"/><path d="M370 766q8 -8 16 0t16 0t16 0" class="dk" style="stroke-width:1.8;opacity:.85"/><path d="M390 683.0L425.2 739.4" class="acc" style="stroke-width:3"/><path d="M430 747.0L421.8 741.5L428.7 737.2Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><text class="s" x="32" y="645.0" style="font-size:11px">Windward side: smooth flow;</text><text class="s" x="32" y="659.0" style="font-size:11px">upward currents help carry an</text><text class="s" x="32" y="673.0" style="font-size:11px">aircraft over the peak</text><text class="s" x="300" y="645.0" style="font-size:11px">Leeward side: air follows</text><text class="s" x="300" y="659.0" style="font-size:11px">the terrain and is</text><text class="s" x="300" y="673.0" style="font-size:11px">increasingly turbulent</text><text class="s" x="32" y="823.0" style="font-size:11px">Turbulence over terrain (schematic)</text><rect class="cl" x="452" y="603.0" width="258" height="218.0" rx="8"/><rect x="452" y="603.0" width="258" height="26" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="462" y="621.0" style="font-size:13px">Obstructions</text><circle cx="465" cy="639.0" r="2.2" class="ah"/><text class="s" x="474" y="643.0" style="font-size:11.5px">Ground topography and large</text><text class="s" x="474" y="658.0" style="font-size:11.5px">buildings, from hangars to mountains,</text><text class="s" x="474" y="673.0" style="font-size:11.5px">bluffs and canyons, break up the wind</text><text class="s" x="474" y="688.0" style="font-size:11.5px">into gusts that change rapidly in</text><text class="s" x="474" y="703.0" style="font-size:11.5px">direction and speed.</text><circle cx="465" cy="717.0" r="2.2" class="ah"/><text class="s" x="474" y="721.0" style="font-size:11.5px">Turbulence intensity depends on the</text><text class="s" x="474" y="736.0" style="font-size:11.5px">size of the obstacle and the primary</text><text class="s" x="474" y="751.0" style="font-size:11.5px">wind velocity.</text><circle cx="465" cy="765.0" r="2.2" class="ah"/><text class="s" x="474" y="769.0" style="font-size:11.5px">On landing, an aircraft may "drop in"</text><text class="s" x="474" y="784.0" style="font-size:11.5px">and be too low to clear obstacles on</text><text class="s" x="474" y="799.0" style="font-size:11.5px">the approach.</text><rect class="cl" x="452" y="825.0" width="258" height="188.0" rx="8"/><rect x="452" y="825.0" width="258" height="26" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="462" y="843.0" style="font-size:13px">Mountains</text><circle cx="465" cy="861.0" r="2.2" class="ah"/><text class="s" x="474" y="865.0" style="font-size:11.5px">Leeward side: the air follows the</text><text class="s" x="474" y="880.0" style="font-size:11.5px">terrain contour and is increasingly</text><text class="s" x="474" y="895.0" style="font-size:11.5px">turbulent, which tends to push an</text><text class="s" x="474" y="910.0" style="font-size:11.5px">aircraft into the mountainside.</text><circle cx="465" cy="924.0" r="2.2" class="ah"/><text class="s" x="474" y="928.0" style="font-size:11.5px">The stronger the wind, the greater</text><text class="s" x="474" y="943.0" style="font-size:11.5px">the downward pressure and turbulence.</text><circle cx="465" cy="957.0" r="2.2" class="ah"/><text class="s" x="474" y="961.0" style="font-size:11.5px">Downdrafts in valleys or canyons can</text><text class="s" x="474" y="976.0" style="font-size:11.5px">be severe; get a checkout with a</text><text class="s" x="474" y="991.0" style="font-size:11.5px">mountain-qualified flight instructor.</text></svg>
