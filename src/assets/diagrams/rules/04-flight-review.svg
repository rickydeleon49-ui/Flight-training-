<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 544" role="img" aria-labelledby="ti de"><title id="ti">Flight review: every 24 calendar months, one hour on the ground and one in the air</title><desc id="de">14 CFR 61.56. To act as pilot in command you need a flight review given by an authorized instructor in an aircraft you are rated for, with a logbook endorsement, since the beginning of the 24th calendar month before the month of the flight. It is at least 1 hour of ground training and 1 hour of flight training, including a review of the current general operating and flight rules of part 91 and of maneuvers and procedures the instructor chooses. Example: acting as pilot in command in June 2026 needs a review dated June 1, 2024 or later. Passing certain practical tests or proficiency checks in the period replaces it.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:var(--diagram-text-opacity,.85)}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:var(--diagram-fill-opacity,.6)}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:var(--diagram-fill-opacity,.6)}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:var(--diagram-fill-opacity,.6)}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:var(--diagram-fill-opacity,.6)}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.h{font-size:15px}.c{font-size:17px}.n{font-size:14.5px}.sm{font-size:13.5px}.ln{stroke:currentColor;stroke-width:1.6;fill:none;stroke-linecap:round}.pl{stroke:currentColor;stroke-width:1.4;stroke-linejoin:round}.ds{stroke-dasharray:7 6}</style><text class="t" x="20" y="28" style="font-size:15px">Flight review (61.56)</text><text class="s sm" x="20" y="50">Needed to act as PIC. A student pilot in training with a current solo endorsement does not need one.</text><rect class="cl" x="20" y="64" width="690" height="128" rx="8"/><text class="t n" x="34" y="90">The window: back to the beginning of the 24th calendar month before this month</text><path d="M44 150L686 150" class="dk"/><path d="M44 138L44 162M686 138L686 162" class="ln"/><rect class="rose" x="44" y="142" width="642" height="16" rx="3"/><text class="s sm" x="44" y="128">Review on or after</text><text class="t n" x="44" y="184">June 1, 2024</text><text class="s sm" x="686" y="128" style="text-anchor:end">Flying as PIC in June 2026</text><text class="t n" x="686" y="184" style="text-anchor:end">June 2026</text><text class="s sm m" x="365" y="176">24 calendar months</text><rect class="sky" x="20" y="204" width="8" height="104" rx="3"/><rect class="cl" x="32" y="204" width="328" height="104" rx="6" style="fill-opacity:.12"/><rect class="lav" x="370" y="204" width="8" height="104" rx="3"/><rect class="cl" x="382" y="204" width="328" height="104" rx="6" style="fill-opacity:.12"/><text class="t n" x="44" y="228">At least 1 hour of ground training</text><text class="s n" x="44" y="250">Must include a review of the</text><text class="s n" x="44" y="269">current general operating and</text><text class="s n" x="44" y="288">flight rules of Part 91</text><text class="t n" x="394" y="228">At least 1 hour of flight training</text><text class="s n" x="394" y="250">And maneuvers and procedures</text><text class="s n" x="394" y="269">the reviewer decides you need</text><text class="s n" x="394" y="288">to show</text><rect class="mint" x="20" y="320" width="8" height="100" rx="3"/><rect class="cl" x="32" y="320" width="678" height="100" rx="6" style="fill-opacity:.12"/><text class="t n" x="44" y="344">Who and how</text><text class="s n" x="44" y="366">Given by an authorized instructor, in an aircraft you are rated for</text><text class="s n" x="44" y="385">The instructor endorses your logbook that you completed it satisfactorily</text><text class="s n" x="44" y="404">May be combined with other recent experience, at the instructor's choice (61.56(h))</text><rect class="rose" x="20" y="432" width="8" height="70" rx="3"/><rect class="cl" x="32" y="432" width="678" height="70" rx="6" style="fill-opacity:.12"/><text class="t n" x="44" y="454">Replaced if, within the same 24 months, you passed</text><text class="s sm" x="44" y="474">a pilot proficiency check or practical test for a certificate, rating or privilege (61.56(d)),</text><text class="s sm" x="44" y="492">or a phase of an FAA-sponsored pilot proficiency program (61.56(e))</text><text class="s sm" x="20" y="530">Source: 14 CFR 61.56</text></svg>