<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 622" role="img" aria-labelledby="ti de"><title id="ti">Aircraft speed limits: 250 knots below 10,000 feet and 200 knots near Class C and D airports and under Class B</title><desc id="de">Side view and table of 14 CFR 91.117, in indicated airspeed. Below 10,000 feet MSL: 250 knots maximum. At or below 2,500 feet above the surface within 4 nautical miles of the primary airport of a Class C or Class D area: 200 knots maximum. In the airspace under a Class B area or in a VFR corridor through it: 200 knots maximum. Inside Class B itself the 250 knot limit applies. If the minimum safe airspeed is higher than the limit, the aircraft may be operated at that minimum speed.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:var(--diagram-text-opacity,.85)}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:var(--diagram-fill-opacity,.6)}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:var(--diagram-fill-opacity,.6)}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:var(--diagram-fill-opacity,.6)}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:var(--diagram-fill-opacity,.6)}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.h{font-size:15px}.c{font-size:17px}.n{font-size:14.5px}.sm{font-size:13.5px}.ln{stroke:currentColor;stroke-width:1.6;fill:none;stroke-linecap:round}.pl{stroke:currentColor;stroke-width:1.4;stroke-linejoin:round}.ds{stroke-dasharray:7 6}</style><text class="t" x="20" y="28" style="font-size:15px">Speed limits (14 CFR 91.117)</text><text class="s sm" x="20" y="50">Maximum indicated airspeed in knots, as the rule states it. These are upper limits, not target speeds.</text><rect class="cl" x="20" y="64" width="690" height="206" rx="8"/><rect class="sky" x="30" y="100" width="670" height="140" style="fill-opacity:.3"/><path d="M30 100L700 100" class="ln ds"/><text class="s sm" x="34" y="92">10,000 ft MSL</text><text class="s sm" x="700" y="92" style="text-anchor:end">Above this line 91.117 sets no limit</text><text class="t c" x="36" y="136">250 knots maximum</text><text class="s sm" x="36" y="156">below 10,000 ft MSL</text><rect class="lav" x="250" y="176" width="230" height="64"/><text class="t c" x="365" y="198" style="text-anchor:middle">200 knots maximum</text><text class="s sm m" x="365" y="216">at or below 2,500 ft above the</text><text class="s sm m" x="365" y="232">surface, within 4 NM</text><rect class="rose" x="512" y="152" width="188" height="12" rx="3"/><text class="s sm m" x="606" y="146">Class B shelf</text><text class="t c" x="606" y="196" style="text-anchor:middle">200 knots maximum</text><text class="s sm m" x="606" y="216">in the airspace under it</text><path d="M30 240L700 240" class="dk"/><rect class="mint" x="30" y="240" width="670" height="10" rx="3"/><rect class="cl" x="345" y="238" width="40" height="6" rx="2"/><text class="s sm m" x="365" y="265">Primary airport of a Class C or D area</text><rect class="sky" x="20" y="284" width="8" height="60" rx="3"/><rect class="cl" x="32" y="284" width="678" height="60" rx="6" style="fill-opacity:.12"/><text class="t n" x="44" y="306">(a) Below 10,000 ft MSL</text><text class="s sm" x="44" y="324">Any airspace, Class B included, unless the Administrator authorizes otherwise</text><text class="t c" x="696" y="318" style="text-anchor:end">250 knots</text><rect class="lav" x="20" y="352" width="8" height="60" rx="3"/><rect class="cl" x="32" y="352" width="678" height="60" rx="6" style="fill-opacity:.12"/><text class="t n" x="44" y="374">(b) At or below 2,500 ft above the surface</text><text class="s sm" x="44" y="392">within 4 NM of the primary airport of Class C or D</text><text class="s sm" x="44" y="409">(unless ATC authorizes or requires otherwise)</text><text class="t c" x="696" y="386" style="text-anchor:end">200 knots</text><rect class="rose" x="20" y="420" width="8" height="60" rx="3"/><rect class="cl" x="32" y="420" width="678" height="60" rx="6" style="fill-opacity:.12"/><text class="t n" x="44" y="442">(c) In the airspace under a Class B area,</text><text class="s sm" x="44" y="460">or in a VFR corridor through a Class B area</text><text class="t c" x="696" y="454" style="text-anchor:end">200 knots</text><rect class="mint" x="20" y="488" width="8" height="60" rx="3"/><rect class="cl" x="32" y="488" width="678" height="60" rx="6" style="fill-opacity:.12"/><text class="t n" x="44" y="510">Inside a Class B area itself</text><text class="s sm" x="44" y="528">(b) does not apply there: the (a) limit is the rule</text><text class="t c" x="696" y="522" style="text-anchor:end">250 knots</text><text class="s sm" x="20" y="570">If the minimum safe airspeed for an operation is higher than a limit above, the rule lets the</text><text class="s sm" x="20" y="588">aircraft fly at that minimum speed (91.117(d)). 250 knots is 288 mph; 200 knots is 230 mph.</text><text class="s sm" x="20" y="610">Source: 14 CFR 91.117</text></svg>