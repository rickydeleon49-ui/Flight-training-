<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 552" role="img" aria-labelledby="ti de"><title id="ti">How long a medical certificate lasts for private pilot flying: 60 or 24 months</title><desc id="de">Duration of a first, second or third-class medical certificate for private, recreational or student pilot privileges, from 14 CFR 61.23(d). If you were under 40 on the date of the examination, it expires at the end of the last day of the 60th month after the month of the examination. If you were 40 or older, it expires at the end of the last day of the 24th month after the month of the examination. A bar chart compares 60 months and 24 months, with an example for an examination in March 2026.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:var(--diagram-text-opacity,.85)}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:var(--diagram-fill-opacity,.6)}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:var(--diagram-fill-opacity,.6)}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:var(--diagram-fill-opacity,.6)}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:var(--diagram-fill-opacity,.6)}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.h{font-size:15px}.c{font-size:17px}.n{font-size:14.5px}.sm{font-size:13.5px}.ln{stroke:currentColor;stroke-width:1.6;fill:none;stroke-linecap:round}.pl{stroke:currentColor;stroke-width:1.4;stroke-linejoin:round}.ds{stroke-dasharray:7 6}</style><text class="t" x="20" y="28" style="font-size:15px">How long a medical lasts for private pilot flying (61.23)</text><text class="s sm" x="20" y="50">At least a third-class medical is needed to use private pilot privileges. Age is your age on the exam date.</text><rect class="cl" x="20" y="64" width="690" height="232" rx="8"/><text class="t n" x="34" y="90">Months of validity, counted from the month of the exam</text><text class="t n" x="34" y="128">Under 40</text><rect class="sky" x="34" y="136" width="600" height="30" rx="4"/><text class="t c" x="44" y="157">60 months</text><text class="t n" x="34" y="200">Age 40 or older</text><rect class="lav" x="34" y="208" width="240" height="30" rx="4"/><text class="t c" x="44" y="229">24 months</text><path d="M34 252L634 252" class="ln"/><path d="M34 248L34 258" class="ln"/><text class="s sm" x="34" y="276" style="text-anchor:start">0</text><path d="M154 248L154 258" class="ln"/><text class="s sm" x="154" y="276" style="text-anchor:middle">12</text><path d="M274 248L274 258" class="ln"/><text class="s sm" x="274" y="276" style="text-anchor:middle">24</text><path d="M394 248L394 258" class="ln"/><text class="s sm" x="394" y="276" style="text-anchor:middle">36</text><path d="M514 248L514 258" class="ln"/><text class="s sm" x="514" y="276" style="text-anchor:middle">48</text><path d="M634 248L634 258" class="ln"/><text class="s sm" x="634" y="276" style="text-anchor:middle">60</text><text class="s sm" x="654" y="276" style="text-anchor:start">months</text><rect class="mint" x="20" y="308" width="8" height="100" rx="3"/><rect class="cl" x="32" y="308" width="678" height="100" rx="6" style="fill-opacity:.12"/><text class="t n" x="44" y="332">It expires at the end of the last day of the month</text><text class="s n" x="44" y="354">Under 40 on the exam date: the 60th month after the month of the exam</text><text class="s n" x="44" y="374">40 or older on the exam date: the 24th month after the month of the exam</text><text class="s sm" x="44" y="398">The same durations apply to a first, second or third-class certificate for these privileges.</text><rect class="rose" x="20" y="420" width="8" height="70" rx="3"/><rect class="cl" x="32" y="420" width="678" height="70" rx="6" style="fill-opacity:.12"/><text class="t n" x="44" y="444">Example: exam on any day in March 2026</text><text class="s n" x="44" y="468">Under 40: lasts to the end of March 31, 2031.   40 or older: lasts to the end of March 31, 2028.</text><text class="s sm" x="20" y="514">Commercial and airline privileges use shorter durations, and BasicMed has its own rules (61.113(i)); not shown.</text><text class="s sm" x="20" y="538">Source: 14 CFR 61.23(a)(3), (d)</text></svg>