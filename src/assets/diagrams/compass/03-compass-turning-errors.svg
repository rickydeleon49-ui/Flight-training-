<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 710" role="img" aria-labelledby="ti de"><title id="ti">Compass turning errors: northerly and southerly</title><desc id="de">Two compass dials with north at the top. Turning toward north, the compass float leads, so you stop the turn before the desired heading. Turning toward south, the float lags, so you let the heading pass before stopping. Rule of thumb: 15 degrees plus half the latitude, for example 15+20 = 35 degrees prior near 40 degrees latitude, and 15+15 = 30 degrees after passing near 30 degrees latitude. A card explains magnetic dip and why the errors grow near the magnetic poles.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11.5px}.q1{font-size:12px}.q2{font-size:13px}.q3{font-size:11px}.q4{font-size:10px}.q5{stroke:currentColor;stroke-width:1.5}.q6{stroke:currentColor;stroke-width:1.6}.q7{fill:var(--palette-berry,#A84C6B)}.q8{stroke-width:1.2;opacity:.7}</style><text class="t" x="20" y="28" style="font-size:15px">Compass turning errors: northerly and southerly</text><text class="s q2" x="20" y="50">The center of gravity of the float assembly is lower than the pivotal point. In a turn, the force from</text><text class="s q2" x="20" y="66.5">magnetic dip swings the float.</text><rect class="cl" x="20" y="91" width="335" height="248" rx="8"/><text class="t q2" x="32" y="113">Turning toward north</text><circle cx="187" cy="227" r="74" class="cl q6"/><text class="t m q1" x="187" y="144">N</text><text class="t m q1" x="274" y="231">E</text><text class="t m q1" x="187" y="318">S</text><text class="t m q1" x="100" y="231">W</text><path d="M237 227A50 50 0 0 0 213.5 184.6" class="acc" style="stroke-width:3"/><path d="M213.5 184.6L223.3 185.9L219 192.8Z" class="dh q7"/><path d="M213.5 184.6A50 50 0 0 0 187 177" class="dk" style="stroke-width:1.8;stroke-dasharray:5 4;opacity:.8"/><circle cx="187" cy="177" r="5" class="ah"/><text class="s m" x="175" y="219" style="font-size:10.5px">desired: N</text><path d="M237 218L241.6 232.5L232.4 232.5Z" class="dh"/><path d="M217.5 180.6L253 151" class="dk q8"/><text class="t q3" x="257" y="155">Stop the turn</text><text class="s q3" x="257" y="168">here, before it</text><text class="s q4" x="245" y="231"></text><rect class="cl" x="375" y="91" width="335" height="248" rx="8"/><text class="t q2" x="387" y="113">Turning toward south</text><circle cx="542" cy="227" r="74" class="cl q6"/><text class="t m q1" x="542" y="144">N</text><text class="t m q1" x="629" y="231">E</text><text class="t m q1" x="542" y="318">S</text><text class="t m q1" x="455" y="231">W</text><path d="M592 227A50 50 0 0 1 515.5 269.4" class="acc" style="stroke-width:3"/><path d="M515.5 269.4L525.3 270.7L521 277.6Z" class="dh q7"/><circle cx="542" cy="277" r="5" class="ah"/><text class="s m" x="530" y="241" style="font-size:10.5px">desired: S</text><path d="M592 236L587.4 221.5L596.6 221.5Z" class="dh"/><path d="M511.5 273.4L476 291" class="dk q8"/><text class="t e q3" x="472" y="295">Stop the turn here,</text><text class="s e q3" x="472" y="308">after passing it</text><text class="s q4" x="600" y="231"></text><text class="s m q4" x="190" y="333">Sketches are schematic: angles not to scale</text><rect x="20" y="353" width="335" height="24" rx="10" class="sky q5"/><text class="t q2" x="30" y="370">Northerly turning error</text><circle cx="31" cy="391" r="2.2" class="ah"/><text class="s q0" x="40" y="395">The float swings the same way the float turns: a</text><text class="s q0" x="40" y="410">false northerly turn indication, so the card leads</text><circle cx="31" cy="425" r="2.2" class="ah"/><text class="s q0" x="40" y="429">Stop a northerly turn before you arrive at the</text><text class="s q0" x="40" y="444">desired heading</text><circle cx="31" cy="459" r="2.2" class="ah"/><text class="s q0" x="40" y="463">Rule of thumb: stop the turn 15 degrees plus half</text><text class="s q0" x="40" y="478">of the latitude early. Near 40 degrees latitude:</text><text class="s q0" x="40" y="493">15+20 = 35 degrees prior</text><rect x="375" y="353" width="335" height="24" rx="10" class="rose q5"/><text class="t q2" x="385" y="370">Southerly turning error</text><circle cx="386" cy="391" r="2.2" class="ah"/><text class="s q0" x="395" y="395">Turning toward south, the float assembly lags</text><text class="s q0" x="395" y="410">rather than leads: a false southerly turn</text><text class="s q0" x="395" y="425">indication</text><circle cx="386" cy="440" r="2.2" class="ah"/><text class="s q0" x="395" y="444">Let the card pass the desired heading before you</text><text class="s q0" x="395" y="459">stop the turn</text><circle cx="386" cy="474" r="2.2" class="ah"/><text class="s q0" x="395" y="478">Same rule, 15 degrees plus half of the latitude.</text><text class="s q0" x="395" y="493">Near 30 degrees latitude: 15+15 = 30 degrees after</text><text class="s q0" x="395" y="508">passing the heading</text><rect x="20" y="533" width="690" height="24" rx="10" class="lav q5"/><text class="t q2" x="30" y="550">Why it happens: magnetic dip</text><circle cx="31" cy="571" r="2.2" class="ah"/><text class="s q0" x="40" y="575">The Earth's field runs parallel to its surface only at the Magnetic Equator; the dip angle grows toward the</text><text class="s q0" x="40" y="590">magnetic poles</text><circle cx="31" cy="605" r="2.2" class="ah"/><text class="s q0" x="40" y="609">The compass is made to rotate only in the horizontal plane by lowering its center of gravity below the pivot</text><text class="s q0" x="40" y="624">and making the assembly heavy</text><circle cx="31" cy="639" r="2.2" class="ah"/><text class="s q0" x="40" y="643">It indicates correctly only if the card is horizontal; once tilted, the vertical component of the Earth's</text><text class="s q0" x="40" y="658">field affects it</text><circle cx="31" cy="673" r="2.2" class="ah"/><text class="s q0" x="40" y="677">Both errors are amplified near either magnetic pole; close to the poles the compass is unusable for navigation</text></svg>
