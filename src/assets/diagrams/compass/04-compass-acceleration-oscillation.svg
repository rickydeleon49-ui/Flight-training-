<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 615" role="img" aria-labelledby="ti de"><title id="ti">Acceleration and oscillation errors</title><desc id="de">Two panels for an east or west heading. Accelerating tilts the aft end of the card up and the compass shows a turn toward north. Decelerating tilts it down and the compass shows a turn toward south. Mnemonic ANDS: Acceleration-North, Deceleration-South. Last panel: a wavy line shows the compass card swinging around an average line; use the average indication between the swings when setting the heading indicator.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11px}.q1{font-size:12px}.q2{font-size:11.5px}.q3{font-size:13px}.q4{font-size:10.5px}.q5{stroke-width:3}.q6{stroke-width:1.5;opacity:.7}.q7{stroke:currentColor;stroke-width:1.6}.q8{fill:var(--palette-berry,#A84C6B)}</style><text class="t" x="20" y="28" style="font-size:15px">Acceleration and oscillation errors</text><text class="s q3" x="20" y="50">The magnetic dip and the forces of inertia cause compass errors when you accelerate or decelerate on</text><text class="s q3" x="20" y="66.5">easterly and westerly headings.</text><rect class="cl" x="20" y="91" width="335" height="226" rx="8"/><text class="t q3" x="32" y="113">Accelerating</text><text class="s q0" x="32" y="128">on an east or west heading</text><path d="M40 189L170 217" class="dk" style="stroke-width:6"/><path d="M105 203L105 237" class="dk q6"/><text class="s q0" x="40" y="259">Card tilts: aft end</text><text class="s q0" x="40" y="272">up</text><text class="s q4" x="38" y="181">aft</text><text class="s e q4" x="170" y="209">front</text><path d="M50 153L112 153" class="dk q5"/><path d="M120 153L112 156.6L112 149.4Z" class="dh" style=""/><text class="s q0" x="130" y="157">speeds up</text><circle cx="282" cy="195" r="34" class="cl q7"/><text class="t m q1" x="282" y="152">N</text><text class="t m q1" x="329" y="199">E</text><text class="t m q1" x="282" y="246">S</text><text class="t m q1" x="235" y="199">W</text><path d="M306 188L309.6 199.3L302.4 199.3Z" class="dh"/><path d="M304 195A22 22 0 0 0 293 175.9" class="acc q5"/><path d="M293 175.9L302.8 176.9L298.8 184Z" class="dh q8"/><text class="t m q0" x="282" y="291">Compass shows a turn</text><text class="t m q0" x="282" y="305">toward north</text><rect class="cl" x="375" y="91" width="335" height="226" rx="8"/><text class="t q3" x="387" y="113">Decelerating</text><text class="s q0" x="387" y="128">on an east or west heading</text><path d="M395 217L525 189" class="dk" style="stroke-width:6"/><path d="M460 203L460 237" class="dk q6"/><text class="s q0" x="395" y="259">Card tilts: aft end</text><text class="s q0" x="395" y="272">down</text><text class="s q4" x="393" y="209">aft</text><text class="s e q4" x="525" y="181">front</text><path d="M475 153L413 153" class="dk q5"/><path d="M405 153L413 149.4L413 156.6Z" class="dh" style=""/><text class="s q0" x="485" y="157">slows down</text><circle cx="637" cy="195" r="34" class="cl q7"/><text class="t m q1" x="637" y="152">N</text><text class="t m q1" x="684" y="199">E</text><text class="t m q1" x="637" y="246">S</text><text class="t m q1" x="590" y="199">W</text><path d="M661 202L657.4 190.7L664.6 190.7Z" class="dh"/><path d="M659 195A22 22 0 0 1 648 214.1" class="acc q5"/><path d="M648 214.1L653.8 206L657.8 213.1Z" class="dh q8"/><text class="t m q0" x="637" y="291">Compass shows a turn</text><text class="t m q0" x="637" y="305">toward south</text><rect class="cl" x="20" y="329" width="690" height="70" rx="8"/><text class="t" x="40" y="373" style="font-size:30px;fill:var(--palette-berry,#A84C6B)">ANDS</text><text class="t" x="150" y="359" style="font-size:14px">Acceleration-North / Deceleration-South</text><text class="s q1" x="150" y="379">Acceleration causes an indication toward north; deceleration, toward south.</text><rect class="cl" x="20" y="411" width="690" height="190" rx="8"/><text class="t q3" x="32" y="433">Oscillation error</text><path d="M40 523L340 523" class="dk" style="stroke-width:1.5;opacity:.7;stroke-dasharray:6 5"/><path d="M40 523L43 529.3L46 535.2L49 540.6L52 545.3L55 549L58 551.8L61 553.5L64 554.1L67 553.6L70 552L73 549.4L76 546L79 541.8L82 537L85 531.9L88 526.6L91 521.2L94 516.1L97 511.3L100 507L103 503.3L106 500.5L109 498.5L112 497.4L115 497.2L118 497.9L121 499.5L124 501.9L127 505L130 508.6L133 512.7L136 517.1L139 521.5L142 525.9L145 530.1L148 534L151 537.4L154 540.2L157 542.4L160 543.8L163 544.5L166 544.4L169 543.5L172 542L175 539.8L178 537L181 533.9L184 530.4L187 526.7L190 523L193 519.4L196 515.9L199 512.8L202 510.1L205 508L208 506.4L211 505.4L214 505.1L217 505.4L220 506.3L223 507.8L226 509.8L229 512.2L232 514.9L235 517.9L238 520.9L241 524L244 527L247 529.8L250 532.3L253 534.4L256 536L259 537.2L262 537.8L265 537.9L268 537.5L271 536.6L274 535.2L277 533.4L280 531.3L283 528.9L286 526.4L289 523.9L292 521.3L295 518.9L298 516.6L301 514.7L304 513L307 511.8L310 511L313 510.6L316 510.7L319 511.2L322 512.1L325 513.3L328 514.9L331 516.7L334 518.7L337 520.9L340 523" class="acc" style="stroke-width:2.5"/><text class="t q2" x="40" y="471">Card swings back and forth</text><text class="s q0" x="40" y="583">Average indication between the swings</text><path d="M230 573L230 527" class="dk" style="stroke-width:1.2;opacity:.7"/><circle cx="373" cy="451" r="2.2" class="ah"/><text class="s q2" x="382" y="455">A combination of all the errors above: the card</text><text class="s q2" x="382" y="470">fluctuates in relation to the actual heading</text><circle cx="373" cy="484" r="2.2" class="ah"/><text class="s q2" x="382" y="488">Setting the gyroscopic heading indicator to agree</text><text class="s q2" x="382" y="503">with the compass: use the average indication between</text><text class="s q2" x="382" y="518">the swings</text><circle cx="373" cy="532" r="2.2" class="ah"/><text class="s q2" x="382" y="536">The compass fluid damps the oscillation of the float</text><text class="s q2" x="382" y="551">and card</text></svg>
