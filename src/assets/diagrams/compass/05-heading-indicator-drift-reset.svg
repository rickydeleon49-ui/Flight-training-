<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 732" role="img" aria-labelledby="ti de"><title id="ti">Heading indicator: why it drifts and how you reset it</title><desc id="de">Left: a compass card fixed to a rotor that stays rigid in space while the aircraft turns around it; headings use a 360 degree azimuth with the final zero omitted. Right: a graph of heading error over time, showing drift up to 15 degrees in 1 hour if never reset, and a sawtooth with resets about every 15 minutes. Three steps to reset: fly straight and level at constant speed, read the compass using the average of its swings, then use the adjustment knob. Cards cover free versus slaved gyros and the tumble limits of about 55 degrees pitch and bank.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style>
<text class="t" x="20" y="28" style="font-size:15px">Heading indicator: why it drifts and how you reset it</text>
<text class="s" x="20" y="50.0" style="font-size:13px">It is not affected by the forces that make the magnetic compass hard to interpret, but a free gyro</text>
<text class="s" x="20" y="66.5" style="font-size:13px">needs periodic adjustment.</text>
<rect class="cl" x="20" y="91.0" width="335" height="330" rx="8"/>
<text class="t" x="32" y="113.0" style="font-size:13px">How it works</text>
<circle cx="120" cy="203.0" r="52" class="sky" style="stroke:currentColor;stroke-width:1.8"/>
<path d="M172.0 203.0L167.0 203.0" class="dk" style="stroke-width:1;opacity:.6"/>
<path d="M171.2 212.0L166.3 211.2" class="dk" style="stroke-width:1;opacity:.6"/>
<path d="M168.9 220.8L164.2 219.1" class="dk" style="stroke-width:1;opacity:.6"/>
<path d="M165.0 229.0L160.7 226.5" class="dk" style="stroke-width:1;opacity:.6"/>
<path d="M159.8 236.4L156.0 233.2" class="dk" style="stroke-width:1;opacity:.6"/>
<path d="M153.4 242.8L150.2 239.0" class="dk" style="stroke-width:1;opacity:.6"/>
<path d="M146.0 248.0L143.5 243.7" class="dk" style="stroke-width:1;opacity:.6"/>
<path d="M137.8 251.9L136.1 247.2" class="dk" style="stroke-width:1;opacity:.6"/>
<path d="M129.0 254.2L128.2 249.3" class="dk" style="stroke-width:1;opacity:.6"/>
<path d="M120.0 255.0L120.0 250.0" class="dk" style="stroke-width:1;opacity:.6"/>
<path d="M111.0 254.2L111.8 249.3" class="dk" style="stroke-width:1;opacity:.6"/>
<path d="M102.2 251.9L103.9 247.2" class="dk" style="stroke-width:1;opacity:.6"/>
<path d="M94.0 248.0L96.5 243.7" class="dk" style="stroke-width:1;opacity:.6"/>
<path d="M86.6 242.8L89.8 239.0" class="dk" style="stroke-width:1;opacity:.6"/>
<path d="M80.2 236.4L84.0 233.2" class="dk" style="stroke-width:1;opacity:.6"/>
<path d="M75.0 229.0L79.3 226.5" class="dk" style="stroke-width:1;opacity:.6"/>
<path d="M71.1 220.8L75.8 219.1" class="dk" style="stroke-width:1;opacity:.6"/>
<path d="M68.8 212.0L73.7 211.2" class="dk" style="stroke-width:1;opacity:.6"/>
<path d="M68.0 203.0L73.0 203.0" class="dk" style="stroke-width:1;opacity:.6"/>
<path d="M68.8 194.0L73.7 194.8" class="dk" style="stroke-width:1;opacity:.6"/>
<path d="M71.1 185.2L75.8 186.9" class="dk" style="stroke-width:1;opacity:.6"/>
<path d="M75.0 177.0L79.3 179.5" class="dk" style="stroke-width:1;opacity:.6"/>
<path d="M80.2 169.6L84.0 172.8" class="dk" style="stroke-width:1;opacity:.6"/>
<path d="M86.6 163.2L89.8 167.0" class="dk" style="stroke-width:1;opacity:.6"/>
<path d="M94.0 158.0L96.5 162.3" class="dk" style="stroke-width:1;opacity:.6"/>
<path d="M102.2 154.1L103.9 158.8" class="dk" style="stroke-width:1;opacity:.6"/>
<path d="M111.0 151.8L111.8 156.7" class="dk" style="stroke-width:1;opacity:.6"/>
<path d="M120.0 151.0L120.0 156.0" class="dk" style="stroke-width:1;opacity:.6"/>
<path d="M129.0 151.8L128.2 156.7" class="dk" style="stroke-width:1;opacity:.6"/>
<path d="M137.8 154.1L136.1 158.8" class="dk" style="stroke-width:1;opacity:.6"/>
<path d="M146.0 158.0L143.5 162.3" class="dk" style="stroke-width:1;opacity:.6"/>
<path d="M153.4 163.2L150.2 167.0" class="dk" style="stroke-width:1;opacity:.6"/>
<path d="M159.8 169.6L156.0 172.8" class="dk" style="stroke-width:1;opacity:.6"/>
<path d="M165.0 177.0L160.7 179.5" class="dk" style="stroke-width:1;opacity:.6"/>
<path d="M168.9 185.2L164.2 186.9" class="dk" style="stroke-width:1;opacity:.6"/>
<path d="M171.2 194.0L166.3 194.8" class="dk" style="stroke-width:1;opacity:.6"/>
<text class="t m" x="151.1769145362398" y="189.0" style="font-size:12px">6</text>
<text class="t m" x="102.0" y="238.1769145362398" style="font-size:12px">21</text>
<path d="M128.0 188.0L122.8 216.3L107.4 208.1Z" class="ah"/>
<path d="M62.8 170.0A66 66 0 0 1 108.5 138.0" class="dk" style="stroke-width:2.5"/><path d="M108.5 138.0L100.4 143.6L99.0 135.6Z" class="dh" style=""/>
<text class="s m" x="120" y="289.0" style="font-size:11px">Rotor and card stay fixed in space;</text>
<text class="s m" x="120" y="302.0" style="font-size:11px">the aircraft turns around them</text>
<text class="t" x="240" y="151.0" style="font-size:11.5px">Card:</text>
<text class="s" x="240" y="165.0" style="font-size:11px">360° azimuth,</text>
<text class="s" x="240" y="178.0" style="font-size:11px">final zero omitted</text>
<text class="s" x="240" y="191.0" style="font-size:11px">6 = 060°</text>
<text class="s" x="240" y="204.0" style="font-size:11px">21 = 210°</text>
<circle cx="35" cy="319.0" r="2.2" class="ah"/>
<text class="s" x="44" y="323.0" style="font-size:11.5px">The rotor turns in a vertical plane with a</text>
<text class="s" x="44" y="338.0" style="font-size:11.5px">compass card fixed to it</text>
<circle cx="35" cy="352.0" r="2.2" class="ah"/>
<text class="s" x="44" y="356.0" style="font-size:11.5px">It works by rigidity in space: card points hold</text>
<text class="s" x="44" y="371.0" style="font-size:11.5px">the same position while the aircraft turns around</text>
<text class="s" x="44" y="386.0" style="font-size:11.5px">the gyro</text>
<rect class="cl" x="375" y="91.0" width="335" height="330" rx="8"/>
<text class="t" x="387" y="113.0" style="font-size:13px">Why it drifts</text>
<path d="M400 241.0L690 241.0M400 241.0L400 141.0" class="dk" style="stroke-width:1.6"/>
<text class="s" x="404" y="153.0" style="font-size:10.5px">Error</text>
<text class="s e" x="690" y="255.0" style="font-size:10.5px">Time</text>
<path d="M400 241.0L690 151.0" class="dk" style="stroke-width:1.6;opacity:.6;stroke-dasharray:6 5"/>
<path d="M400.0 241.0L472.5 218.5L472.5 241.0L545.0 218.5L545.0 241.0L617.5 218.5L617.5 241.0L690.0 218.5L690.0 241.0" class="acc" style="stroke-width:2.5"/>
<text class="s e" x="686" y="129.0" style="font-size:10.5px">up to 15° in 1 hour,</text>
<text class="s e" x="686" y="141.0" style="font-size:10.5px">if never reset</text>
<text class="t" x="472.5" y="269.0" style="font-size:11px">check about every 15 minutes: reset</text>
<path d="M472.5 241.0L472.5 247.0" class="dk" style="stroke-width:1.5"/>
<path d="M545.0 241.0L545.0 247.0" class="dk" style="stroke-width:1.5"/>
<path d="M617.5 241.0L617.5 247.0" class="dk" style="stroke-width:1.5"/>
<path d="M690.0 241.0L690.0 247.0" class="dk" style="stroke-width:1.5"/>
<text class="s" x="692" y="271.0" style="font-size:10px"></text>
<circle cx="390" cy="279.0" r="2.2" class="ah"/>
<text class="s" x="399" y="283.0" style="font-size:11.5px">Precession caused by friction makes it creep or</text>
<text class="s" x="399" y="298.0" style="font-size:11.5px">drift from its set position; worn, dirty, or</text>
<text class="s" x="399" y="313.0" style="font-size:11.5px">badly lubricated bearings make it worse</text>
<circle cx="390" cy="327.0" r="2.2" class="ah"/>
<text class="s" x="399" y="331.0" style="font-size:11.5px">The gyro is oriented in space and the Earth</text>
<text class="s" x="399" y="346.0" style="font-size:11.5px">rotates 15° in 1 hour: up to 15° of error per</text>
<text class="s" x="399" y="361.0" style="font-size:11.5px">hour</text>
<rect class="cl" x="20" y="435.0" width="690" height="150" rx="8"/>
<text class="t" x="32" y="457.0" style="font-size:13px">To reset it</text>
<rect x="32" y="475.0" width="210" height="96" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/>
<circle cx="52" cy="497.0" r="11" class="ah"/><text class="t m" x="52" y="501.3333333333333" style="font-size:13px;fill:#fff">1</text>
<text class="t" x="70" y="501.0" style="font-size:12.5px">Fly straight and level</text>
<text class="t" x="70" y="517.0" style="font-size:12.5px">at a constant speed</text>
<text class="s" x="46" y="539.0" style="font-size:11.5px">This avoids compass errors</text>
<rect x="260" y="475.0" width="210" height="96" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/>
<circle cx="280" cy="497.0" r="11" class="ah"/><text class="t m" x="280" y="501.3333333333333" style="font-size:13px;fill:#fff">2</text>
<text class="t" x="298" y="501.0" style="font-size:12.5px">Read the magnetic</text>
<text class="t" x="298" y="517.0" style="font-size:12.5px">compass</text>
<text class="s" x="274" y="539.0" style="font-size:11.5px">Use the average indication</text>
<text class="s" x="274" y="554.0" style="font-size:11.5px">between its swings</text>
<rect x="488" y="475.0" width="210" height="96" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/>
<circle cx="508" cy="497.0" r="11" class="ah"/><text class="t m" x="508" y="501.3333333333333" style="font-size:13px;fill:#fff">3</text>
<text class="t" x="526" y="501.0" style="font-size:12.5px">Use the adjustment knob</text>
<text class="s" x="502" y="539.0" style="font-size:11.5px">Align the heading indicator</text>
<text class="s" x="502" y="554.0" style="font-size:11.5px">with the compass</text>
<rect x="20" y="593.0" width="335" height="24" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="30" y="610.0" style="font-size:13px">Free gyro or slaved</text>
<circle cx="31" cy="631.0" r="2.2" class="ah"/>
<text class="s" x="40" y="635.0" style="font-size:11.5px">A heading indicator with no automatic north-seeking</text>
<text class="s" x="40" y="650.0" style="font-size:11.5px">is a "free" gyro and needs periodic adjustment</text>
<circle cx="31" cy="665.0" r="2.2" class="ah"/>
<text class="s" x="40" y="669.0" style="font-size:11.5px">Some, called HSIs, take a magnetic north reference</text>
<text class="s" x="40" y="684.0" style="font-size:11.5px">from a slaving transmitter and generally need no</text>
<text class="s" x="40" y="699.0" style="font-size:11.5px">adjustment</text>
<rect x="375" y="593.0" width="335" height="24" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="385" y="610.0" style="font-size:13px">Tumble limits</text>
<circle cx="386" cy="631.0" r="2.2" class="ah"/>
<text class="s" x="395" y="635.0" style="font-size:11.5px">On some light aircraft heading indicators the</text>
<text class="s" x="395" y="650.0" style="font-size:11.5px">limits are about 55° of pitch and 55° of bank</text>
<circle cx="386" cy="665.0" r="2.2" class="ah"/>
<text class="s" x="395" y="669.0" style="font-size:11.5px">Beyond them the instrument tumbles or spills and</text>
<text class="s" x="395" y="684.0" style="font-size:11.5px">gives wrong indications until reset; after</text>
<text class="s" x="395" y="699.0" style="font-size:11.5px">spilling, reset it with the caging knob</text>
</svg>
