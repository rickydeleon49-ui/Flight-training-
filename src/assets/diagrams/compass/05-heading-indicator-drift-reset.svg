<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 732" role="img" aria-labelledby="ti de"><title id="ti">Heading indicator: why it drifts and how you reset it</title><desc id="de">Left: a compass card fixed to a rotor that stays rigid in space while the aircraft turns around it; headings use a 360 degree azimuth with the final zero omitted. Right: a graph of heading error over time, showing drift up to 15 degrees in 1 hour if never reset, and a sawtooth with resets about every 15 minutes. Three steps to reset: fly straight and level at constant speed, read the compass using the average of its swings, then use the adjustment knob. Cards cover free versus slaved gyros and the tumble limits of about 55 degrees pitch and bank.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{stroke-width:1;opacity:.6}.q1{font-size:11.5px}.q2{font-size:13px}.q3{font-size:11px}.q4{stroke:currentColor;stroke-width:1.5}.q5{font-size:12.5px}.q6{font-size:10.5px}.q7{stroke-width:1.5}.q8{font-size:13px;fill:#fff}</style><text class="t" x="20" y="28" style="font-size:15px">Heading indicator: why it drifts and how you reset it</text><text class="s q2" x="20" y="50">It is not affected by the forces that make the magnetic compass hard to interpret, but a free gyro</text><text class="s q2" x="20" y="66.5">needs periodic adjustment.</text><rect class="cl" x="20" y="91" width="335" height="330" rx="8"/><text class="t q2" x="32" y="113">How it works</text><circle cx="120" cy="203" r="52" class="sky" style="stroke:currentColor;stroke-width:1.8"/><path d="M172 203L167 203" class="dk q0"/><path d="M171.2 212L166.3 211.2" class="dk q0"/><path d="M168.9 220.8L164.2 219.1" class="dk q0"/><path d="M165 229L160.7 226.5" class="dk q0"/><path d="M159.8 236.4L156 233.2" class="dk q0"/><path d="M153.4 242.8L150.2 239" class="dk q0"/><path d="M146 248L143.5 243.7" class="dk q0"/><path d="M137.8 251.9L136.1 247.2" class="dk q0"/><path d="M129 254.2L128.2 249.3" class="dk q0"/><path d="M120 255L120 250" class="dk q0"/><path d="M111 254.2L111.8 249.3" class="dk q0"/><path d="M102.2 251.9L103.9 247.2" class="dk q0"/><path d="M94 248L96.5 243.7" class="dk q0"/><path d="M86.6 242.8L89.8 239" class="dk q0"/><path d="M80.2 236.4L84 233.2" class="dk q0"/><path d="M75 229L79.3 226.5" class="dk q0"/><path d="M71.1 220.8L75.8 219.1" class="dk q0"/><path d="M68.8 212L73.7 211.2" class="dk q0"/><path d="M68 203L73 203" class="dk q0"/><path d="M68.8 194L73.7 194.8" class="dk q0"/><path d="M71.1 185.2L75.8 186.9" class="dk q0"/><path d="M75 177L79.3 179.5" class="dk q0"/><path d="M80.2 169.6L84 172.8" class="dk q0"/><path d="M86.6 163.2L89.8 167" class="dk q0"/><path d="M94 158L96.5 162.3" class="dk q0"/><path d="M102.2 154.1L103.9 158.8" class="dk q0"/><path d="M111 151.8L111.8 156.7" class="dk q0"/><path d="M120 151L120 156" class="dk q0"/><path d="M129 151.8L128.2 156.7" class="dk q0"/><path d="M137.8 154.1L136.1 158.8" class="dk q0"/><path d="M146 158L143.5 162.3" class="dk q0"/><path d="M153.4 163.2L150.2 167" class="dk q0"/><path d="M159.8 169.6L156 172.8" class="dk q0"/><path d="M165 177L160.7 179.5" class="dk q0"/><path d="M168.9 185.2L164.2 186.9" class="dk q0"/><path d="M171.2 194L166.3 194.8" class="dk q0"/><text class="t m" x="151.18" y="189" style="font-size:12px">6</text><text class="t m" x="102" y="238.18" style="font-size:12px">21</text><path d="M128 188L122.8 216.3L107.4 208.1Z" class="ah"/><path d="M62.8 170A66 66 0 0 1 108.5 138" class="dk" style="stroke-width:2.5"/><path d="M108.5 138L100.4 143.6L99 135.6Z" class="dh" style=""/><text class="s m q3" x="120" y="289">Rotor and card stay fixed in space;</text><text class="s m q3" x="120" y="302">the aircraft turns around them</text><text class="t q1" x="240" y="151">Card:</text><text class="s q3" x="240" y="165">360° azimuth,</text><text class="s q3" x="240" y="178">final zero omitted</text><text class="s q3" x="240" y="191">6 = 060°</text><text class="s q3" x="240" y="204">21 = 210°</text><circle cx="35" cy="319" r="2.2" class="ah"/><text class="s q1" x="44" y="323">The rotor turns in a vertical plane with a</text><text class="s q1" x="44" y="338">compass card fixed to it</text><circle cx="35" cy="352" r="2.2" class="ah"/><text class="s q1" x="44" y="356">It works by rigidity in space: card points hold</text><text class="s q1" x="44" y="371">the same position while the aircraft turns around</text><text class="s q1" x="44" y="386">the gyro</text><rect class="cl" x="375" y="91" width="335" height="330" rx="8"/><text class="t q2" x="387" y="113">Why it drifts</text><path d="M400 241L690 241M400 241L400 141" class="dk" style="stroke-width:1.6"/><text class="s q6" x="404" y="153">Error</text><text class="s e q6" x="690" y="255">Time</text><path d="M400 241L690 151" class="dk" style="stroke-width:1.6;opacity:.6;stroke-dasharray:6 5"/><path d="M400 241L472.5 218.5L472.5 241L545 218.5L545 241L617.5 218.5L617.5 241L690 218.5L690 241" class="acc" style="stroke-width:2.5"/><text class="s e q6" x="686" y="129">up to 15° in 1 hour,</text><text class="s e q6" x="686" y="141">if never reset</text><text class="t q3" x="472.5" y="269">check about every 15 minutes: reset</text><path d="M472.5 241L472.5 247" class="dk q7"/><path d="M545 241L545 247" class="dk q7"/><path d="M617.5 241L617.5 247" class="dk q7"/><path d="M690 241L690 247" class="dk q7"/><text class="s" x="692" y="271" style="font-size:10px"></text><circle cx="390" cy="279" r="2.2" class="ah"/><text class="s q1" x="399" y="283">Precession caused by friction makes it creep or</text><text class="s q1" x="399" y="298">drift from its set position; worn, dirty, or</text><text class="s q1" x="399" y="313">badly lubricated bearings make it worse</text><circle cx="390" cy="327" r="2.2" class="ah"/><text class="s q1" x="399" y="331">The gyro is oriented in space and the Earth</text><text class="s q1" x="399" y="346">rotates 15° in 1 hour: up to 15° of error per</text><text class="s q1" x="399" y="361">hour</text><rect class="cl" x="20" y="435" width="690" height="150" rx="8"/><text class="t q2" x="32" y="457">To reset it</text><rect x="32" y="475" width="210" height="96" rx="10" class="sky q4"/><circle cx="52" cy="497" r="11" class="ah"/><text class="t m q8" x="52" y="501.33">1</text><text class="t q5" x="70" y="501">Fly straight and level</text><text class="t q5" x="70" y="517">at a constant speed</text><text class="s q1" x="46" y="539">This avoids compass errors</text><rect x="260" y="475" width="210" height="96" rx="10" class="lav q4"/><circle cx="280" cy="497" r="11" class="ah"/><text class="t m q8" x="280" y="501.33">2</text><text class="t q5" x="298" y="501">Read the magnetic</text><text class="t q5" x="298" y="517">compass</text><text class="s q1" x="274" y="539">Use the average indication</text><text class="s q1" x="274" y="554">between its swings</text><rect x="488" y="475" width="210" height="96" rx="10" class="mint q4"/><circle cx="508" cy="497" r="11" class="ah"/><text class="t m q8" x="508" y="501.33">3</text><text class="t q5" x="526" y="501">Use the adjustment knob</text><text class="s q1" x="502" y="539">Align the heading indicator</text><text class="s q1" x="502" y="554">with the compass</text><rect x="20" y="593" width="335" height="24" rx="10" class="mint q4"/><text class="t q2" x="30" y="610">Free gyro or slaved</text><circle cx="31" cy="631" r="2.2" class="ah"/><text class="s q1" x="40" y="635">A heading indicator with no automatic north-seeking</text><text class="s q1" x="40" y="650">is a "free" gyro and needs periodic adjustment</text><circle cx="31" cy="665" r="2.2" class="ah"/><text class="s q1" x="40" y="669">Some, called HSIs, take a magnetic north reference</text><text class="s q1" x="40" y="684">from a slaving transmitter and generally need no</text><text class="s q1" x="40" y="699">adjustment</text><rect x="375" y="593" width="335" height="24" rx="10" class="rose q4"/><text class="t q2" x="385" y="610">Tumble limits</text><circle cx="386" cy="631" r="2.2" class="ah"/><text class="s q1" x="395" y="635">On some light aircraft heading indicators the</text><text class="s q1" x="395" y="650">limits are about 55° of pitch and 55° of bank</text><circle cx="386" cy="665" r="2.2" class="ah"/><text class="s q1" x="395" y="669">Beyond them the instrument tumbles or spills and</text><text class="s q1" x="395" y="684">gives wrong indications until reset; after</text><text class="s q1" x="395" y="699">spilling, reset it with the caging knob</text></svg>
