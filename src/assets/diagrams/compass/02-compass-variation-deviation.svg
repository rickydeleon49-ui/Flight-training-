<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 797" role="img" aria-labelledby="ti de"><title id="ti">Magnetic compass: parts, variation, and deviation</title><desc id="de">Side view of the compass: glass window with lubber line, bowl full of fluid, float with two small magnets and a graduated card, hardened steel pivot in a jewel cup, flexible diaphragm at the rear. Top view of the card as seen from the back, with N, E, W, S and the numbers 3, 6 and 33. Worked example: true course 180 plus variation 10 west gives magnetic course 190, then deviation of minus 2 from the correction card gives compass course 188. Cards explain variation and deviation.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{stroke-width:1;opacity:.6}.q1{font-size:11.5px}.q2{font-size:11px}.q3{font-size:12px}.q4{font-size:13px}.q5{stroke:currentColor;stroke-width:1.5}.q6{stroke-width:2.5}.q7{stroke-width:1.2;opacity:.7}.q8{font-size:10px}.q9{font-size:10.5px}.q10{stroke:currentColor;stroke-width:1.6}.q11{fill:var(--palette-berry,#A84C6B)}</style><text class="t" x="20" y="28" style="font-size:15px">Magnetic compass: parts, variation, and deviation</text><text class="s q4" x="20" y="50">The magnets align with the Earth's magnetic field and you read the direction on the scale opposite the</text><text class="s q4" x="20" y="66.5">lubber line.</text><rect class="cl" x="20" y="91" width="690" height="292" rx="8"/><text class="t q4" x="32" y="113">Inside the compass (side view)</text><text class="t q4" x="430" y="113">The card, seen from the back</text><rect x="60" y="151" width="270" height="150" rx="16" class="sky" style="stroke:currentColor;stroke-width:1.8;fill-opacity:.25"/><path d="M60 161L60 291" class="dk" style="stroke-width:5"/><path d="M330 181Q342 201 330 226Q318 251 330 271" class="dk q6"/><rect x="130" y="201" width="130" height="44" rx="8" class="lav q10"/><rect x="144" y="211" width="40" height="8" class="ah"/><rect x="144" y="227" width="40" height="8" class="ah"/><path d="M245 191L245 245" class="dk" style="stroke-width:3;opacity:.7"/><path d="M185 245L205 245L195 275Z" class="dh"/><path d="M176 267L182 281L208 281L214 267" class="dk q6"/><text class="s q2" x="60" y="139">Glass window and lubber line</text><path d="M62 143L62 157" class="dk q7"/><text class="s q2" x="150" y="167">Card wrapped around the float</text><path d="M245 171L245 191" class="dk q7"/><text class="s q2" x="70" y="187">Two magnets on a metal float</text><path d="M110 191L150 211" class="dk q7"/><text class="s q8" x="216" y="255">Hardened steel pivot</text><text class="s q8" x="216" y="268">in a spring-loaded</text><text class="s q8" x="216" y="281">jewel cup</text><path d="M190 269L212 269" class="dk q7"/><text class="s q2" x="60" y="319">Bowl full of compass fluid (similar to kerosene)</text><text class="s q2" x="60" y="334">Rear: flexible diaphragm or metal bellows</text><circle cx="560" cy="247" r="60" class="cl q10"/><text class="t m q3" x="560" y="208">N</text><text class="t m q3" x="538.5" y="213.76">3</text><text class="t m q3" x="522.76" y="229.5">6</text><text class="t m q3" x="517" y="251">E</text><text class="t m q3" x="603" y="251">W</text><text class="t m q3" x="581.5" y="213.76">33</text><text class="t m q3" x="560" y="294">S</text><path d="M620 247L613 247" class="dk q0"/><path d="M619.8 252.2L615.8 251.9" class="dk q0"/><path d="M619.1 257.4L612.2 256.2" class="dk q0"/><path d="M618 262.5L614.1 261.5" class="dk q0"/><path d="M616.4 267.5L609.8 265.1" class="dk q0"/><path d="M614.4 272.4L610.8 270.7" class="dk q0"/><path d="M612 277L605.9 273.5" class="dk q0"/><path d="M609.1 281.4L605.9 279.1" class="dk q0"/><path d="M606 285.6L600.6 281.1" class="dk q0"/><path d="M602.4 289.4L599.6 286.6" class="dk q0"/><path d="M598.6 293L594.1 287.6" class="dk q0"/><path d="M594.4 296.1L592.1 292.9" class="dk q0"/><path d="M590 299L586.5 292.9" class="dk q0"/><path d="M585.4 301.4L583.7 297.8" class="dk q0"/><path d="M580.5 303.4L578.1 296.8" class="dk q0"/><path d="M575.5 305L574.5 301.1" class="dk q0"/><path d="M570.4 306.1L569.2 299.2" class="dk q0"/><path d="M565.2 306.8L564.9 302.8" class="dk q0"/><path d="M560 307L560 300" class="dk q0"/><path d="M554.8 306.8L555.1 302.8" class="dk q0"/><path d="M549.6 306.1L550.8 299.2" class="dk q0"/><path d="M544.5 305L545.5 301.1" class="dk q0"/><path d="M539.5 303.4L541.9 296.8" class="dk q0"/><path d="M534.6 301.4L536.3 297.8" class="dk q0"/><path d="M530 299L533.5 292.9" class="dk q0"/><path d="M525.6 296.1L527.9 292.9" class="dk q0"/><path d="M521.4 293L525.9 287.6" class="dk q0"/><path d="M517.6 289.4L520.4 286.6" class="dk q0"/><path d="M514 285.6L519.4 281.1" class="dk q0"/><path d="M510.9 281.4L514.1 279.1" class="dk q0"/><path d="M508 277L514.1 273.5" class="dk q0"/><path d="M505.6 272.4L509.2 270.7" class="dk q0"/><path d="M503.6 267.5L510.2 265.1" class="dk q0"/><path d="M502 262.5L505.9 261.5" class="dk q0"/><path d="M500.9 257.4L507.8 256.2" class="dk q0"/><path d="M500.2 252.2L504.2 251.9" class="dk q0"/><path d="M500 247L507 247" class="dk q0"/><path d="M500.2 241.8L504.2 242.1" class="dk q0"/><path d="M500.9 236.6L507.8 237.8" class="dk q0"/><path d="M502 231.5L505.9 232.5" class="dk q0"/><path d="M503.6 226.5L510.2 228.9" class="dk q0"/><path d="M505.6 221.6L509.2 223.3" class="dk q0"/><path d="M508 217L514.1 220.5" class="dk q0"/><path d="M510.9 212.6L514.1 214.9" class="dk q0"/><path d="M514 208.4L519.4 212.9" class="dk q0"/><path d="M517.6 204.6L520.4 207.4" class="dk q0"/><path d="M521.4 201L525.9 206.4" class="dk q0"/><path d="M525.6 197.9L527.9 201.1" class="dk q0"/><path d="M530 195L533.5 201.1" class="dk q0"/><path d="M534.6 192.6L536.3 196.2" class="dk q0"/><path d="M539.5 190.6L541.9 197.2" class="dk q0"/><path d="M544.5 189L545.5 192.9" class="dk q0"/><path d="M549.6 187.9L550.8 194.8" class="dk q0"/><path d="M554.8 187.2L555.1 191.2" class="dk q0"/><path d="M560 187L560 194" class="dk q0"/><path d="M565.2 187.2L564.9 191.2" class="dk q0"/><path d="M570.4 187.9L569.2 194.8" class="dk q0"/><path d="M575.5 189L574.5 192.9" class="dk q0"/><path d="M580.5 190.6L578.1 197.2" class="dk q0"/><path d="M585.4 192.6L583.7 196.2" class="dk q0"/><path d="M590 195L586.5 201.1" class="dk q0"/><path d="M594.4 197.9L592.1 201.1" class="dk q0"/><path d="M598.6 201L594.1 206.4" class="dk q0"/><path d="M602.4 204.6L599.6 207.4" class="dk q0"/><path d="M606 208.4L600.6 212.9" class="dk q0"/><path d="M609.1 212.6L605.9 214.9" class="dk q0"/><path d="M612 217L605.9 220.5" class="dk q0"/><path d="M614.4 221.6L610.8 223.3" class="dk q0"/><path d="M616.4 226.5L609.8 228.9" class="dk q0"/><path d="M618 231.5L614.1 232.5" class="dk q0"/><path d="M619.1 236.6L612.2 237.8" class="dk q0"/><path d="M619.8 241.8L615.8 242.1" class="dk q0"/><path d="M560 173L560 195" class="acc" style="stroke-width:3"/><text class="t q2" x="568" y="179">Lubber line</text><text class="s q9" x="430" y="329">Flying north, "33" (330°) sits to the right of</text><text class="s q9" x="430" y="343">north: the card stays still while the housing and</text><text class="s q9" x="430" y="357">you rotate around it.</text><text class="s q2" x="430" y="133">Cardinal letters and a number each 30°,</text><text class="s q2" x="430" y="146">final 0 omitted: 3 = 30°, 6 = 60°, 33 = 330°</text><text class="s q2" x="430" y="159">Long mark 10°, short mark 5°</text><rect class="cl" x="20" y="397" width="690" height="170" rx="8"/><text class="t q4" x="32" y="419">From true course to compass course (worked example)</text><rect x="32" y="437" width="200" height="48" rx="10" class="sky q5"/><text class="t m q3" x="132" y="457">True course</text><text class="s m q3" x="132" y="474">180°</text><rect x="264" y="437" width="200" height="48" rx="10" class="lav q5"/><text class="t m q3" x="364" y="457">Magnetic course</text><text class="s m q3" x="364" y="474">190°</text><rect x="496" y="437" width="200" height="48" rx="10" class="mint q5"/><text class="t m q3" x="596" y="457">Compass course</text><text class="s m q3" x="596" y="474">188°</text><path d="M236 461L252 461" class="acc q6"/><path d="M260 461L252 464.6L252 457.4Z" class="dh q11"/><path d="M468 461L484 461" class="acc q6"/><path d="M492 461L484 464.6L484 457.4Z" class="dh q11"/><text class="t m q2" x="248" y="501">+ variation</text><text class="s m q2" x="248" y="514">(10° W)</text><text class="t m q2" x="480" y="501">+ deviation</text><text class="s m q2" x="480" y="514">(-2° on card)</text><text class="s q1" x="32" y="531">Washington, D.C.: variation 10° west, add it. Los Angeles: variation 14° east, subtract it (true 180° becomes</text><text class="s q1" x="32" y="546">magnetic 166°).</text><rect x="20" y="575" width="335" height="24" rx="10" class="sky q5"/><text class="t q4" x="30" y="592">Variation: true vs magnetic</text><circle cx="31" cy="613" r="2.2" class="ah"/><text class="s q1" x="40" y="617">True directions are measured from the geographic</text><text class="s q1" x="40" y="632">poles; magnetic directions from the magnetic poles,</text><text class="s q1" x="40" y="647">some 1,300 miles away</text><circle cx="31" cy="662" r="2.2" class="ah"/><text class="s q1" x="40" y="666">The difference is called variation (declination in</text><text class="s q1" x="40" y="681">surveying)</text><circle cx="31" cy="696" r="2.2" class="ah"/><text class="s q1" x="40" y="700">Isogonic lines show degrees of variation; on the</text><text class="s q1" x="40" y="715">agonic line near Chicago there is none</text><circle cx="31" cy="730" r="2.2" class="ah"/><text class="s q1" x="40" y="734">It does not change with the aircraft heading, and</text><text class="s q1" x="40" y="749">nobody can reduce it</text><rect x="375" y="575" width="335" height="24" rx="10" class="rose q5"/><text class="t q4" x="385" y="592">Deviation: aircraft magnetism</text><circle cx="386" cy="613" r="2.2" class="ah"/><text class="s q1" x="395" y="617">Caused by magnetic fields in the aircraft:</text><text class="s q1" x="395" y="632">electrical current, magnetized parts, conflict with</text><text class="s q1" x="395" y="647">the Earth's field</text><circle cx="386" cy="662" r="2.2" class="ah"/><text class="s q1" x="395" y="666">Unlike variation, it depends on the aircraft</text><text class="s q1" x="395" y="681">heading, not your geographic location</text><circle cx="386" cy="696" r="2.2" class="ah"/><text class="s q1" x="395" y="700">An AMT swings the compass at a compass rose and</text><text class="s q1" x="395" y="715">records what is left on the compass correction card</text><circle cx="386" cy="730" r="2.2" class="ah"/><text class="s q1" x="395" y="734">You fly compass headings using the card, and note</text><text class="s q1" x="395" y="749">equipment such as radios, deicing, pitot heat,</text><text class="s q1" x="395" y="764">radar, or magnetic cargo</text></svg>
