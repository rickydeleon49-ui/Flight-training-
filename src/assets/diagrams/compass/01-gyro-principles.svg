<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 731" role="img" aria-labelledby="ti de"><title id="ti">Gyroscopic principles: rigidity in space and precession</title><desc id="de">Left: a spinning rotor inside gimbal rings stays in the same plane when the rings are level or tilted. Right: a spinning wheel with a deflective force applied at the top; the reaction occurs 90 degrees later in the direction of rotation. Rate of precession is inversely proportional to rotor speed and proportional to the deflective force. Cards cover the bicycle example, instrument gyro design (great weight for its size, high speed, low friction bearings), freely and restricted mountings, and precession displacing the heading indicator.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11.5px}.q1{font-size:11px}.q2{font-size:13px}.q3{stroke:currentColor;stroke-width:1.6}.q4{stroke:currentColor;stroke-width:1.5}.q5{fill:var(--palette-berry,#A84C6B)}.q6{stroke-width:1.3;opacity:.6;stroke-dasharray:5 4}.q7{stroke-width:1.5;opacity:.6;stroke-dasharray:4 3}</style><text class="t" x="20" y="28" style="font-size:15px">Gyroscopic principles: rigidity in space and precession</text><text class="s q2" x="20" y="50">Any spinning object exhibits gyroscopic properties. A wheel or rotor designed and mounted to use them</text><text class="s q2" x="20" y="66.5">is called a gyroscope.</text><rect class="cl" x="20" y="91" width="335" height="300" rx="8"/><text class="t q2" x="32" y="113">Rigidity in space</text><ellipse cx="105" cy="211" rx="50" ry="50" class="cl q3"/><rect x="101" y="157" width="8" height="8" class="ah" transform="rotate(0 105 161)"/><ellipse cx="105" cy="211" rx="11" ry="34" class="sky q3"/><path d="M105 149L105 273" class="dk q6"/><ellipse cx="270" cy="211" rx="50" ry="50" class="cl q3"/><rect x="289.5" y="162.9" width="8" height="8" class="ah" transform="rotate(28 293.5 166.9)"/><ellipse cx="270" cy="211" rx="11" ry="34" class="sky q3"/><path d="M270 149L270 273" class="dk q6"/><text class="s m q1" x="105" y="289">Rings level</text><text class="s m q1" x="270" y="289">Rings tilted</text><text class="t m q1" x="187" y="213">same</text><path d="M165 219L203 219" class="acc" style="stroke-width:2"/><path d="M209 219L203 221.7L203 216.3Z" class="dh q5"/><text class="t m q1" x="187" y="231">plane</text><circle cx="35" cy="309" r="2.2" class="ah"/><text class="s q0" x="44" y="313">The gyro remains in a fixed position in the plane</text><text class="s q0" x="44" y="328">in which it is spinning</text><circle cx="35" cy="342" r="2.2" class="ah"/><text class="s q0" x="44" y="346">On gimbal rings it rotates freely in any</text><text class="s q0" x="44" y="361">direction: tilt, twist, or move the rings and it</text><text class="s q0" x="44" y="376">stays in its original plane</text><rect class="cl" x="375" y="91" width="335" height="300" rx="8"/><text class="t q2" x="387" y="113">Precession</text><ellipse cx="470" cy="231" rx="44" ry="44" class="sky" style="stroke:currentColor;stroke-width:1.8"/><path d="M483 208.5A26 26 0 1 1 447.5 244" class="acc" style="stroke-width:2.5"/><path d="M447.5 244L455.5 249.8L448.5 253.8Z" class="dh q5"/><text class="s m q1" x="470" y="235">spin</text><path d="M462 155L426 155" class="dk" style="stroke-width:3"/><path d="M418 155L426 151.4L426 158.6Z" class="dh" style=""/><path d="M462 155L462 187" class="dk q7"/><text class="t q1" x="430" y="149">Force applied at the top</text><path d="M532 223L496 223" class="acc" style="stroke-width:3"/><path d="M488 223L496 219.4L496 226.6Z" class="dh q5"/><path d="M532 223L514 223" class="dk" style="stroke-width:1.5;opacity:.6"/><path d="M500 171A62 62 0 0 1 532 223" class="dk q7"/><text class="t q0" x="538" y="205">90°</text><text class="t q1" x="538" y="235">Reaction here:</text><text class="s q1" x="538" y="248">90° later in the</text><text class="s q1" x="538" y="261">direction of rotation</text><circle cx="390" cy="309" r="2.2" class="ah"/><text class="s q0" x="399" y="313">Precession is the tilting or turning of a gyro in</text><text class="s q0" x="399" y="328">response to a deflective force</text><circle cx="390" cy="342" r="2.2" class="ah"/><text class="s q0" x="399" y="346">The rate of precession is inversely proportional</text><text class="s q0" x="399" y="361">to rotor speed and proportional to the deflective</text><text class="s q0" x="399" y="376">force</text><rect x="20" y="405" width="335" height="24" rx="10" class="sky q4"/><text class="t q2" x="30" y="422">Bicycle: rigidity</text><circle cx="31" cy="443" r="2.2" class="ah"/><text class="s q0" x="40" y="447">As the wheels increase speed they become more</text><text class="s q0" x="40" y="462">stable in their plane of rotation</text><circle cx="31" cy="477" r="2.2" class="ah"/><text class="s q0" x="40" y="481">So a bicycle is unstable and maneuverable at low</text><text class="s q0" x="40" y="496">speeds, stable and less maneuverable at higher</text><text class="s q0" x="40" y="511">speeds</text><rect x="375" y="405" width="335" height="24" rx="10" class="rose q4"/><text class="t q2" x="385" y="422">Bicycle: precession</text><circle cx="386" cy="443" r="2.2" class="ah"/><text class="s q0" x="395" y="447">At normal speed a rider simply leans the way to go;</text><text class="s q0" x="395" y="462">a lean left puts a force on the top of the wheel to</text><text class="s q0" x="395" y="477">the left</text><circle cx="386" cy="492" r="2.2" class="ah"/><text class="s q0" x="395" y="496">The force acts 90° in the direction of rotation, on</text><text class="s q0" x="395" y="511">the front of the tire, so the bicycle moves left</text><rect x="20" y="536" width="335" height="24" rx="10" class="mint q4"/><text class="t q2" x="30" y="553">Instrument gyro design</text><circle cx="31" cy="574" r="2.2" class="ah"/><text class="s q0" x="40" y="578">Great weight for its size (high density)</text><circle cx="31" cy="593" r="2.2" class="ah"/><text class="s q0" x="40" y="597">Rotation at high speed with low friction bearings</text><rect x="375" y="536" width="335" height="24" rx="10" class="lav q4"/><text class="t q2" x="385" y="553">Two kinds of mounting</text><circle cx="386" cy="574" r="2.2" class="ah"/><text class="s q0" x="395" y="578">Freely mounted: free to rotate in any direction</text><text class="s q0" x="395" y="593">about its center of gravity (three planes of</text><text class="s q0" x="395" y="608">freedom)</text><circle cx="386" cy="623" r="2.2" class="ah"/><text class="s q0" x="395" y="627">Restricted or semi-rigid: one plane of freedom is</text><text class="s q0" x="395" y="642">held fixed in relation to the base</text><rect class="cl" x="20" y="667" width="690" height="50" rx="8"/><text class="s" x="32" y="689" style="font-size:12px">Precession can displace a freely spinning gyro from its plane of rotation through bearing friction, so</text><text class="s" x="32" y="704.5" style="font-size:12px">some instruments, such as the heading indicator, need realignment in flight.</text></svg>
