<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 646" role="img" aria-labelledby="ti de"><title id="ti">Vx and Vy as altitude increases</title><desc id="de">Schematic with altitude on the vertical axis and airspeed on the horizontal axis. Vx, the best angle of climb speed, normally increases slightly with altitude and Vy, the best rate of climb speed, normally decreases slightly. The speeds for maximum rate of climb, maximum angle of climb, and maximum and minimum level flight airspeed all converge at the absolute ceiling. At the absolute ceiling there is no excess power, only one speed allows steady level flight, and rate of climb is zero. The service ceiling, lower down, is the altitude at which the aircraft cannot climb faster than 100 feet per minute. Weight, altitude, gear and flaps all reduce excess thrust and power.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style>
<text class="t" x="20" y="28" style="font-size:15px">Vx and Vy as altitude increases</text>
<text class="s" x="20" y="50.0" style="font-size:13px">Schematic only, no scale. Climb performance diminishes with altitude until the speeds converge at the</text>
<text class="s" x="20" y="66.5" style="font-size:13px">absolute ceiling.</text>
<rect class="cl" x="20" y="91.0" width="690" height="419.5" rx="8"/>
<text class="t" x="32" y="113.0" style="font-size:13px">Speeds against altitude</text>
<path d="M70.0 127.0L70.0 421.0L470.0 421.0" class="dk" style="stroke-width:2;opacity:0.8"/>
<text class="s" transform="translate(48 274.0) rotate(-90)" style="font-size:12px" text-anchor="middle">altitude</text>
<text class="s e" x="470" y="467.0" style="font-size:12px">airspeed</text>
<path d="M115.0 421.0L285.0 141.0" class="dk" style="stroke-width:2;opacity:0.55;stroke-dasharray:6 5"/>
<path d="M215.0 421.0L285.0 141.0" class="acc" style="stroke-width:3;opacity:1"/>
<path d="M375.0 421.0L285.0 141.0" class="acc" style="stroke-width:3;opacity:1"/>
<path d="M445.0 421.0L285.0 141.0" class="dk" style="stroke-width:2;opacity:0.55;stroke-dasharray:6 5"/>
<text class="s m" x="115" y="437.0" style="font-size:11.5px">minimum</text>
<text class="s m" x="115" y="450.0" style="font-size:11.5px">level flight</text>
<text class="t m" x="215" y="439.0" style="font-size:14px">Vx</text>
<text class="t m" x="375" y="439.0" style="font-size:14px">Vy</text>
<text class="s m" x="445" y="437.0" style="font-size:11.5px">maximum</text>
<text class="s m" x="445" y="450.0" style="font-size:11.5px">level flight</text>
<circle cx="285.0" cy="141.0" r="7" class="ah"/>
<text class="t" x="297" y="135.0" style="font-size:12.5px">Absolute ceiling</text>
<path d="M70 215.0L470 215.0" class="dk" style="stroke-width:1.5;opacity:.7;stroke-dasharray:6 5"/>
<text class="t" x="78" y="209.0" style="font-size:12.5px">Service ceiling</text>
<rect x="490" y="127.0" width="220" height="24" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="500" y="144.0" style="font-size:13px">As altitude increases</text>
<circle cx="501" cy="165.0" r="2.2" class="ah"/>
<text class="s" x="510" y="169.0" style="font-size:12px">Vx normally increases slightly</text>
<circle cx="501" cy="184.5" r="2.2" class="ah"/>
<text class="s" x="510" y="188.5" style="font-size:12px">Vy normally decreases slightly</text>
<circle cx="501" cy="204.0" r="2.2" class="ah"/>
<text class="s" x="510" y="208.0" style="font-size:12px">The speeds for maximum ROC,</text>
<text class="s" x="510" y="223.5" style="font-size:12px">maximum AOC and maximum and</text>
<text class="s" x="510" y="239.0" style="font-size:12px">minimum level flight all</text>
<text class="s" x="510" y="254.5" style="font-size:12px">converge</text>
<rect x="490" y="284.0" width="220" height="24" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="500" y="301.0" style="font-size:13px">Absolute ceiling</text>
<circle cx="501" cy="322.0" r="2.2" class="ah"/>
<text class="s" x="510" y="326.0" style="font-size:12px">No excess of power</text>
<circle cx="501" cy="341.5" r="2.2" class="ah"/>
<text class="s" x="510" y="345.5" style="font-size:12px">Only one speed allows steady,</text>
<text class="s" x="510" y="361.0" style="font-size:12px">level flight</text>
<circle cx="501" cy="376.5" r="2.2" class="ah"/>
<text class="s" x="510" y="380.5" style="font-size:12px">Rate of climb is zero</text>
<rect x="490" y="410.0" width="220" height="24" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="500" y="427.0" style="font-size:13px">Service ceiling</text>
<circle cx="501" cy="448.0" r="2.2" class="ah"/>
<text class="s" x="510" y="452.0" style="font-size:12px">The altitude at which the</text>
<text class="s" x="510" y="467.5" style="font-size:12px">aircraft cannot climb faster</text>
<text class="s" x="510" y="483.0" style="font-size:12px">than 100 feet per minute (fpm)</text>
<rect class="cl" x="20" y="524.5" width="690" height="108.0" rx="8"/>
<circle cx="35" cy="546.5" r="2.2" class="ah"/>
<text class="s" x="44" y="550.5" style="font-size:12px">Weight, altitude, landing gear and flaps each decrease both excess thrust and excess power, so maximum</text>
<text class="s" x="44" y="566.0" style="font-size:12px">AOC and maximum ROC decrease under any of them</text>
<circle cx="35" cy="581.5" r="2.2" class="ah"/>
<text class="s" x="44" y="585.5" style="font-size:12px">An increase in altitude raises the power required and lowers the power available</text>
<circle cx="35" cy="601.0" r="2.2" class="ah"/>
<text class="s" x="44" y="605.0" style="font-size:12px">More weight also means a higher climb speed to reach the smaller peak climb rate</text>
</svg>
