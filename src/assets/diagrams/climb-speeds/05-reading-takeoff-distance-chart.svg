<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 778" role="img" aria-labelledby="ti de"><title id="ti">Reading a takeoff distance table</title><desc id="de">Worked PHAK example of a short-field takeoff distance table. Find the takeoff weight of 2,400 pounds, read across to the pressure altitude 3,000 feet row and the 30 degrees C column: ground roll 1,325 feet and 2,480 feet total over a 50 foot obstacle. The table note says decrease distances by 10 percent for each 9 knots of headwind, so an 18 knot headwind cuts 20 percent: 1,060 feet ground roll and 1,984 feet total. A second example uses the combined takeoff graph in order: temperature 22 degrees C, pressure altitude 2,000 feet, weight 2,600 pounds, 6 knot headwind, 50 foot obstacle, giving a 700 foot ground roll and 1,400 feet over the obstacle. Round values to a more conservative figure and read every chart note.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style>
<text class="t" x="20" y="28" style="font-size:15px">Reading a takeoff distance table</text>
<text class="s" x="20" y="50.0" style="font-size:13px">PHAK sample problem: short-field takeoff, 2,400 pounds, 3,000 feet pressure altitude, 30 degrees C, 18</text>
<text class="s" x="20" y="66.5" style="font-size:13px">knot headwind.</text>
<rect class="cl" x="20" y="91.0" width="690" height="393.5" rx="8"/>
<text class="t" x="32" y="113.0" style="font-size:13px">Short-field takeoff distance table (PHAK Figure 11-24)</text>
<rect class="cl" x="32" y="129.0" width="118" height="30" style="stroke:currentColor;stroke-width:1.2"/>
<text class="t m" x="91.0" y="148.0" style="font-size:11.5px">Takeoff weight</text>
<rect class="cl" x="150" y="129.0" width="140" height="30" style="stroke:currentColor;stroke-width:1.2"/>
<text class="t m" x="220.0" y="148.0" style="font-size:11.5px">Takeoff speed</text>
<rect class="cl" x="290" y="129.0" width="130" height="30" style="stroke:currentColor;stroke-width:1.2"/>
<text class="t m" x="355.0" y="148.0" style="font-size:11.5px">Pressure altitude</text>
<rect class="cl" x="420" y="129.0" width="140" height="30" style="stroke:currentColor;stroke-width:1.2"/>
<text class="t m" x="490.0" y="148.0" style="font-size:11.5px">Ground roll at 30 °C</text>
<rect class="cl" x="560" y="129.0" width="138" height="30" style="stroke:currentColor;stroke-width:1.2"/>
<text class="t m" x="629.0" y="148.0" style="font-size:11.5px">Total, 50 ft obstacle</text>
<rect class="mint" x="32" y="159.0" width="118" height="34" style="stroke:currentColor;stroke-width:1.6"/>
<text class="t m" x="91.0" y="181.0" style="font-size:12.5px">2,400 lb</text>
<circle cx="91.0" cy="211.0" r="9" class="ah"/><text class="t m" x="91.0" y="214.66666666666666" style="font-size:11px;fill:#fff">1</text>
<rect class="sky" x="150" y="159.0" width="140" height="34" style="stroke:currentColor;stroke-width:1.6"/>
<text class="s m" x="220.0" y="181.0" style="font-size:11.5px">read the speed here</text>
<rect class="mint" x="290" y="159.0" width="130" height="34" style="stroke:currentColor;stroke-width:1.6"/>
<text class="t m" x="355.0" y="181.0" style="font-size:12.5px">3,000 ft</text>
<circle cx="355.0" cy="211.0" r="9" class="ah"/><text class="t m" x="355.0" y="214.66666666666666" style="font-size:11px;fill:#fff">3</text>
<rect class="mint" x="420" y="159.0" width="140" height="34" style="stroke:currentColor;stroke-width:1.6"/>
<text class="t m" x="490.0" y="181.0" style="font-size:12.5px">1,325 ft</text>
<circle cx="490.0" cy="211.0" r="9" class="ah"/><text class="t m" x="490.0" y="214.66666666666666" style="font-size:11px;fill:#fff">4</text>
<rect class="mint" x="560" y="159.0" width="138" height="34" style="stroke:currentColor;stroke-width:1.6"/>
<text class="t m" x="629.0" y="181.0" style="font-size:12.5px">2,480 ft</text>

<circle cx="220.0" cy="211.0" r="9" class="ah"/><text class="t m" x="220.0" y="214.66666666666666" style="font-size:11px;fill:#fff">2</text>
<circle cx="629.0" cy="211.0" r="9" class="ah"/><text class="t m" x="629.0" y="214.66666666666666" style="font-size:11px;fill:#fff">4</text>
<text class="s" x="32" y="241.0" style="font-size:12px">1 Find the takeoff weight. 2 Read across: the takeoff speed is in the second column. 3 In the pressure</text>
<text class="s" x="32" y="256.5" style="font-size:12px">altitude column, find 3,000 ft. 4 Follow that row to the 30 °C column: ground roll and total over a 50 ft</text>
<text class="s" x="32" y="272.0" style="font-size:12px">obstacle.</text>
<circle cx="40" cy="297.5" r="10" class="ah"/><text class="t m" x="40" y="301.5" style="font-size:12px;fill:#fff">5</text>
<text class="s" x="56" y="302.5" style="font-size:12.5px">Table note 2: decrease the distances by 10 percent for each 9 knots of headwind. An 18 knot</text>
<text class="s" x="56" y="318.5" style="font-size:12.5px">headwind is 20 percent. Do the same for both distances.</text>
<text class="t" x="32" y="364.5" style="font-size:12px">Ground roll</text>
<rect class="cl" x="170" y="348.5" width="252" height="20" style="stroke:currentColor;stroke-width:1.2"/>
<text class="t" x="178" y="363.5" style="font-size:12px">1,325 ft from the table</text>
<rect class="mint" x="170" y="372.5" width="201" height="20" style="stroke:currentColor;stroke-width:1.2"/>
<text class="t" x="178" y="387.5" style="font-size:12px">1,060 ft with 18 knot headwind</text>
<text class="t" x="32" y="422.5" style="font-size:12px">Total over 50 ft</text>
<rect class="cl" x="170" y="406.5" width="471" height="20" style="stroke:currentColor;stroke-width:1.2"/>
<text class="t" x="178" y="421.5" style="font-size:12px">2,480 ft from the table</text>
<rect class="mint" x="170" y="430.5" width="377" height="20" style="stroke:currentColor;stroke-width:1.2"/>
<text class="t" x="178" y="445.5" style="font-size:12px">1,984 ft with 18 knot headwind</text>
<text class="s" x="32" y="470.5" style="font-size:11.5px">Bar length is to scale.  Example for ground roll: 1,325 x .20 = 265;  1,325 - 265 = 1,060</text>
<rect class="cl" x="20" y="496.5" width="690" height="150" rx="8"/>
<text class="t" x="32" y="518.5" style="font-size:13px">Combined takeoff graph (PHAK Figure 11-23), worked in the order PHAK gives</text>
<rect x="32" y="532.5" width="150" height="60" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/>
<circle cx="46" cy="548.5" r="9" class="ah"/><text class="t m" x="46" y="552.1666666666666" style="font-size:11px;fill:#fff">1</text>
<text class="t" x="60" y="552.5" style="font-size:12.5px">Temperature</text>
<text class="s" x="40" y="570.5" style="font-size:11px">22 °C, up to the 2,000</text>
<text class="s" x="40" y="585.0" style="font-size:11px">ft line</text>
<path d="M183 562.5L188.0 562.5" class="dk" style="stroke-width:2"/><path d="M194 562.5L188.0 565.2L188.0 559.8Z" class="dh" style=""/>
<rect x="195" y="532.5" width="150" height="60" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/>
<circle cx="209" cy="548.5" r="9" class="ah"/><text class="t m" x="209" y="552.1666666666666" style="font-size:11px;fill:#fff">2</text>
<text class="t" x="223" y="552.5" style="font-size:12.5px">Weight</text>
<text class="s" x="203" y="570.5" style="font-size:11px">2,600 lb, after the</text>
<text class="s" x="203" y="585.0" style="font-size:11px">first reference line</text>
<path d="M346 562.5L351.0 562.5" class="dk" style="stroke-width:2"/><path d="M357 562.5L351.0 565.2L351.0 559.8Z" class="dh" style=""/>
<rect x="358" y="532.5" width="150" height="60" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/>
<circle cx="372" cy="548.5" r="9" class="ah"/><text class="t m" x="372" y="552.1666666666666" style="font-size:11px;fill:#fff">3</text>
<text class="t" x="386" y="552.5" style="font-size:12.5px">Wind</text>
<text class="s" x="366" y="570.5" style="font-size:11px">6 knot headwind, after</text>
<text class="s" x="366" y="585.0" style="font-size:11px">the second line</text>
<path d="M509 562.5L514.0 562.5" class="dk" style="stroke-width:2"/><path d="M520 562.5L514.0 565.2L514.0 559.8Z" class="dh" style=""/>
<rect x="521" y="532.5" width="150" height="60" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/>
<circle cx="535" cy="548.5" r="9" class="ah"/><text class="t m" x="535" y="552.1666666666666" style="font-size:11px;fill:#fff">4</text>
<text class="t" x="549" y="552.5" style="font-size:12.5px">Obstacle</text>
<text class="s" x="529" y="570.5" style="font-size:11px">50 ft, after the third</text>
<text class="s" x="529" y="585.0" style="font-size:11px">line</text>
<text class="s" x="32" y="614.5" style="font-size:12.5px">Result: 700 ft ground roll and 1,400 ft total over a 50 ft obstacle. Lift-off speed at 2,600 lb is 63</text>
<text class="s" x="32" y="630.5" style="font-size:12.5px">knots and 68 knots over the 50 ft obstacle, read from the table at the top of the chart.</text>
<rect class="cl" x="20" y="656.5" width="690" height="108.0" rx="8"/>
<circle cx="35" cy="678.5" r="2.2" class="ah"/>
<text class="s" x="44" y="682.5" style="font-size:12px">Round chart values to a slightly more adverse figure when interpolating; this gives a margin of safety</text>
<circle cx="35" cy="698.0" r="2.2" class="ah"/>
<text class="s" x="44" y="702.0" style="font-size:12px">Read the notes on every chart; a small error at the start becomes a large error at the end</text>
<circle cx="35" cy="717.5" r="2.2" class="ah"/>
<text class="s" x="44" y="721.5" style="font-size:12px">Chart data come from a new aircraft in good working order flown with average piloting skill; compute</text>
<text class="s" x="44" y="737.0" style="font-size:12px">performance before every flight</text>
</svg>
