<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 778" role="img" aria-labelledby="ti de"><title id="ti">Reading a takeoff distance table</title><desc id="de">Worked PHAK example of a short-field takeoff distance table. Find the takeoff weight of 2,400 pounds, read across to the pressure altitude 3,000 feet row and the 30 degrees C column: ground roll 1,325 feet and 2,480 feet total over a 50 foot obstacle. The table note says decrease distances by 10 percent for each 9 knots of headwind, so an 18 knot headwind cuts 20 percent: 1,060 feet ground roll and 1,984 feet total. A second example uses the combined takeoff graph in order: temperature 22 degrees C, pressure altitude 2,000 feet, weight 2,600 pounds, 6 knot headwind, 50 foot obstacle, giving a 700 foot ground roll and 1,400 feet over the obstacle. Round values to a more conservative figure and read every chart note.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:12px}.q1{font-size:12.5px}.q2{stroke:currentColor;stroke-width:1.2}.q3{font-size:11px;fill:#fff}.q4{font-size:11px}.q5{font-size:11.5px}.q6{stroke:currentColor;stroke-width:1.6}.q7{font-size:13px}.q8{stroke:currentColor;stroke-width:1.5}.q9{stroke-width:2}</style><text class="t" x="20" y="28" style="font-size:15px">Reading a takeoff distance table</text><text class="s q7" x="20" y="50">PHAK sample problem: short-field takeoff, 2,400 pounds, 3,000 feet pressure altitude, 30 degrees C, 18</text><text class="s q7" x="20" y="66.5">knot headwind.</text><rect class="cl" x="20" y="91" width="690" height="393.5" rx="8"/><text class="t q7" x="32" y="113">Short-field takeoff distance table (PHAK Figure 11-24)</text><rect class="cl q2" x="32" y="129" width="118" height="30"/><text class="t m q5" x="91" y="148">Takeoff weight</text><rect class="cl q2" x="150" y="129" width="140" height="30"/><text class="t m q5" x="220" y="148">Takeoff speed</text><rect class="cl q2" x="290" y="129" width="130" height="30"/><text class="t m q5" x="355" y="148">Pressure altitude</text><rect class="cl q2" x="420" y="129" width="140" height="30"/><text class="t m q5" x="490" y="148">Ground roll at 30 °C</text><rect class="cl q2" x="560" y="129" width="138" height="30"/><text class="t m q5" x="629" y="148">Total, 50 ft obstacle</text><rect class="mint q6" x="32" y="159" width="118" height="34"/><text class="t m q1" x="91" y="181">2,400 lb</text><circle cx="91" cy="211" r="9" class="ah"/><text class="t m q3" x="91" y="214.67">1</text><rect class="sky q6" x="150" y="159" width="140" height="34"/><text class="s m q5" x="220" y="181">read the speed here</text><rect class="mint q6" x="290" y="159" width="130" height="34"/><text class="t m q1" x="355" y="181">3,000 ft</text><circle cx="355" cy="211" r="9" class="ah"/><text class="t m q3" x="355" y="214.67">3</text><rect class="mint q6" x="420" y="159" width="140" height="34"/><text class="t m q1" x="490" y="181">1,325 ft</text><circle cx="490" cy="211" r="9" class="ah"/><text class="t m q3" x="490" y="214.67">4</text><rect class="mint q6" x="560" y="159" width="138" height="34"/><text class="t m q1" x="629" y="181">2,480 ft</text><circle cx="220" cy="211" r="9" class="ah"/><text class="t m q3" x="220" y="214.67">2</text><circle cx="629" cy="211" r="9" class="ah"/><text class="t m q3" x="629" y="214.67">4</text><text class="s q0" x="32" y="241">1 Find the takeoff weight. 2 Read across: the takeoff speed is in the second column. 3 In the pressure</text><text class="s q0" x="32" y="256.5">altitude column, find 3,000 ft. 4 Follow that row to the 30 °C column: ground roll and total over a 50 ft</text><text class="s q0" x="32" y="272">obstacle.</text><circle cx="40" cy="297.5" r="10" class="ah"/><text class="t m" x="40" y="301.5" style="font-size:12px;fill:#fff">5</text><text class="s q1" x="56" y="302.5">Table note 2: decrease the distances by 10 percent for each 9 knots of headwind. An 18 knot</text><text class="s q1" x="56" y="318.5">headwind is 20 percent. Do the same for both distances.</text><text class="t q0" x="32" y="364.5">Ground roll</text><rect class="cl q2" x="170" y="348.5" width="252" height="20"/><text class="t q0" x="178" y="363.5">1,325 ft from the table</text><rect class="mint q2" x="170" y="372.5" width="201" height="20"/><text class="t q0" x="178" y="387.5">1,060 ft with 18 knot headwind</text><text class="t q0" x="32" y="422.5">Total over 50 ft</text><rect class="cl q2" x="170" y="406.5" width="471" height="20"/><text class="t q0" x="178" y="421.5">2,480 ft from the table</text><rect class="mint q2" x="170" y="430.5" width="377" height="20"/><text class="t q0" x="178" y="445.5">1,984 ft with 18 knot headwind</text><text class="s q5" x="32" y="470.5">Bar length is to scale.  Example for ground roll: 1,325 x .20 = 265;  1,325 - 265 = 1,060</text><rect class="cl" x="20" y="496.5" width="690" height="150" rx="8"/><text class="t q7" x="32" y="518.5">Combined takeoff graph (PHAK Figure 11-23), worked in the order PHAK gives</text><rect x="32" y="532.5" width="150" height="60" rx="10" class="sky q8"/><circle cx="46" cy="548.5" r="9" class="ah"/><text class="t m q3" x="46" y="552.17">1</text><text class="t q1" x="60" y="552.5">Temperature</text><text class="s q4" x="40" y="570.5">22 °C, up to the 2,000</text><text class="s q4" x="40" y="585">ft line</text><path d="M183 562.5L188 562.5" class="dk q9"/><path d="M194 562.5L188 565.2L188 559.8Z" class="dh" style=""/><rect x="195" y="532.5" width="150" height="60" rx="10" class="lav q8"/><circle cx="209" cy="548.5" r="9" class="ah"/><text class="t m q3" x="209" y="552.17">2</text><text class="t q1" x="223" y="552.5">Weight</text><text class="s q4" x="203" y="570.5">2,600 lb, after the</text><text class="s q4" x="203" y="585">first reference line</text><path d="M346 562.5L351 562.5" class="dk q9"/><path d="M357 562.5L351 565.2L351 559.8Z" class="dh" style=""/><rect x="358" y="532.5" width="150" height="60" rx="10" class="mint q8"/><circle cx="372" cy="548.5" r="9" class="ah"/><text class="t m q3" x="372" y="552.17">3</text><text class="t q1" x="386" y="552.5">Wind</text><text class="s q4" x="366" y="570.5">6 knot headwind, after</text><text class="s q4" x="366" y="585">the second line</text><path d="M509 562.5L514 562.5" class="dk q9"/><path d="M520 562.5L514 565.2L514 559.8Z" class="dh" style=""/><rect x="521" y="532.5" width="150" height="60" rx="10" class="rose q8"/><circle cx="535" cy="548.5" r="9" class="ah"/><text class="t m q3" x="535" y="552.17">4</text><text class="t q1" x="549" y="552.5">Obstacle</text><text class="s q4" x="529" y="570.5">50 ft, after the third</text><text class="s q4" x="529" y="585">line</text><text class="s q1" x="32" y="614.5">Result: 700 ft ground roll and 1,400 ft total over a 50 ft obstacle. Lift-off speed at 2,600 lb is 63</text><text class="s q1" x="32" y="630.5">knots and 68 knots over the 50 ft obstacle, read from the table at the top of the chart.</text><rect class="cl" x="20" y="656.5" width="690" height="108" rx="8"/><circle cx="35" cy="678.5" r="2.2" class="ah"/><text class="s q0" x="44" y="682.5">Round chart values to a slightly more adverse figure when interpolating; this gives a margin of safety</text><circle cx="35" cy="698" r="2.2" class="ah"/><text class="s q0" x="44" y="702">Read the notes on every chart; a small error at the start becomes a large error at the end</text><circle cx="35" cy="717.5" r="2.2" class="ah"/><text class="s q0" x="44" y="721.5">Chart data come from a new aircraft in good working order flown with average piloting skill; compute</text><text class="s q0" x="44" y="737">performance before every flight</text></svg>
