<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 747" role="img" aria-labelledby="ti de"><title id="ti">Power available, power required and excess power</title><desc id="de">Schematic graph of power or thrust against airspeed for steady level flight. The power required curve is U shaped, with a lowest point at the best endurance airspeed; speeds below it are the region of reversed command and speeds above it the region of normal command. The maximum power available is a curved line above it. The gap between the two is excess power, which is what an aircraft uses to climb. Where the lines meet is the maximum level flight speed. Thrust is a force and power is the rate of work. Angle of climb depends on excess thrust and rate of climb on excess power. PHAK example: 200 horsepower available, 130 used for level flight, 70 left to climb. A 10 degree climb needs thrust equal to drag plus 17 percent of weight.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style>
<text class="t" x="20" y="28" style="font-size:15px">Power available, power required and excess power</text>
<text class="s" x="20" y="50.0" style="font-size:13px">Schematic curves, no numbers. Climb performance depends on how much power or thrust is left over after</text>
<text class="s" x="20" y="66.5" style="font-size:13px">level flight.</text>
<rect class="cl" x="20" y="91.0" width="690" height="501.0" rx="8"/>
<text class="t" x="32" y="113.0" style="font-size:13px">Steady, level flight at one altitude and weight</text>
