<text class="s" transform="translate(48 269.0) rotate(-90)" style="font-size:12px" text-anchor="middle">power or thrust</text>
<text class="s e" x="470" y="405.0" style="font-size:12px">airspeed</text>
<path d="M148.0 276.7L154.5 286.4L161.0 294.5L167.5 301.4L174.0 307.2L180.5 312.2L187.0 316.4L193.5 320.0L200.0 322.9L206.5 325.4L213.0 327.3L219.5 328.8L226.0 329.9L232.5 330.6L239.0 331.0L245.5 331.0L252.0 330.7L258.5 330.0L265.0 329.0L271.5 327.7L278.0 326.1L284.5 324.3L291.0 322.1L297.5 319.6L304.0 316.8L310.5 313.7L317.0 310.3L323.5 306.6L330.0 302.6L336.5 298.3L343.0 293.6L349.5 288.7L356.0 283.4L362.5 277.9L369.0 272.0L375.5 265.7L382.0 259.2L388.5 252.3L395.0 245.0L401.5 237.4L408.0 229.5L414.5 221.2L421.0 212.5L427.5 203.5L434.0 194.1L440.5 184.3L447.0 174.2L453.5 163.6L460.0 152.7" class="dk" style="stroke-width:3;opacity:1"/>
<path d="M148.0 229.9L154.5 229.6L161.0 229.2L167.5 228.8L174.0 228.5L180.5 228.1L187.0 227.7L193.5 227.4L200.0 227.0L206.5 226.6L213.0 226.3L219.5 225.9L226.0 225.5L232.5 225.2L239.0 224.8L245.5 224.4L252.0 224.1L258.5 223.7L265.0 223.3L271.5 223.0L278.0 222.6L284.5 222.2L291.0 221.8L297.5 221.5L304.0 221.1L310.5 220.7L317.0 220.4L323.5 220.0L330.0 219.6L336.5 219.3L343.0 218.9L349.5 218.5L356.0 218.2L362.5 217.8L369.0 217.4L375.5 217.1L382.0 216.7L388.5 216.3L395.0 216.0L401.5 215.6L408.0 215.2L414.5 214.9L421.0 214.5L427.5 214.1L434.0 213.8L440.5 213.4L447.0 213.0L453.5 212.6L460.0 212.3" class="acc" style="stroke-width:3;opacity:1"/>
<path d="M148.0 127.0L148.0 411.0" class="dk" style="stroke-width:1.4;opacity:.6;stroke-dasharray:5 4"/>
<text class="s" x="153.0" y="139.0" style="font-size:11.5px">stall or minimum</text>
<text class="s" x="153.0" y="152.0" style="font-size:11.5px">controllable speed</text>
<circle cx="242.4" cy="331.0" r="5" class="ah"/>
<text class="t m" x="242.38" y="365.03470876861394" style="font-size:11.5px">lowest point: best</text>
<text class="t m" x="242.38" y="378.03470876861394" style="font-size:11.5px">endurance airspeed</text>
<circle cx="421.0" cy="212.5" r="6" class="ah"/>
<text class="t e" x="466" y="274.54864" style="font-size:11.5px">maximum level</text>
<text class="t e" x="466" y="287.54864" style="font-size:11.5px">flight speed</text>
<path d="M429.0 262.54864L422.2 228.4" class="dk" style="stroke-width:1.6"/><path d="M421.0 222.54863999999998L424.8 227.9L419.5 229.0Z" class="dh" style=""/>
<path d="M311.8 310.0105526090323L311.8 230.7" class="dk" style="stroke-width:2"/><path d="M311.8 223.67039999999997L314.9 230.7L308.7 230.7Z" class="dh" style=""/>
<path d="M311.8 223.67039999999997L311.8 303.0" class="dk" style="stroke-width:2"/><path d="M311.8 310.0105526090323L308.7 303.0L314.9 303.0Z" class="dh" style=""/>
<text class="t e" x="303.8" y="266.84047630451613" style="font-size:12px">excess power</text>
<text class="s e" x="303.8" y="280.84047630451613" style="font-size:11.5px">(climb)</text>
<text class="t" x="163.6" y="215.0608" style="font-size:11.5px">power or thrust available (maximum)</text>
<text class="t e" x="422.8" y="195.66897407999997" style="font-size:11.5px">power or thrust required</text>
<text class="s m" x="195.19" y="427.0" style="font-size:11.5px">reversed</text>
<text class="s m" x="195.19" y="440.0" style="font-size:11.5px">command</text>
<text class="s m" x="351.19" y="427.0" style="font-size:11.5px">normal command</text>
<rect x="490" y="127.0" width="220" height="24" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="500" y="144.0" style="font-size:13px">Thrust is not power</text>
<circle cx="501" cy="165.0" r="2.2" class="ah"/>
<text class="s" x="510" y="169.0" style="font-size:12px">Thrust is a force, in pounds</text>
<text class="s" x="510" y="184.5" style="font-size:12px">or newtons</text>
<circle cx="501" cy="200.0" r="2.2" class="ah"/>
<text class="s" x="510" y="204.0" style="font-size:12px">Power is the rate of doing</text>
<text class="s" x="510" y="219.5" style="font-size:12px">work, in horsepower or</text>
<text class="s" x="510" y="235.0" style="font-size:12px">kilowatts</text>
<circle cx="501" cy="250.5" r="2.2" class="ah"/>
<text class="s" x="510" y="254.5" style="font-size:12px">Angle of climb depends on</text>
<text class="s" x="510" y="270.0" style="font-size:12px">excess thrust; rate of climb</text>
<text class="s" x="510" y="285.5" style="font-size:12px">depends on excess power</text>
<rect x="490" y="315.0" width="220" height="24" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="500" y="332.0" style="font-size:13px">Example from PHAK</text>
<circle cx="501" cy="353.0" r="2.2" class="ah"/>
<text class="s" x="510" y="357.0" style="font-size:12px">Engine makes 200 hp at a given</text>
<text class="s" x="510" y="372.5" style="font-size:12px">altitude</text>
<circle cx="501" cy="388.0" r="2.2" class="ah"/>
<text class="s" x="510" y="392.0" style="font-size:12px">Level flight there uses 130 hp</text>
<circle cx="501" cy="407.5" r="2.2" class="ah"/>
<text class="s" x="510" y="411.5" style="font-size:12px">That leaves 70 hp available to</text>
<text class="s" x="510" y="427.0" style="font-size:12px">climb</text>
<rect x="490" y="456.5" width="220" height="24" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="500" y="473.5" style="font-size:13px">Climb needs thrust</text>
<circle cx="501" cy="494.5" r="2.2" class="ah"/>
<text class="s" x="510" y="498.5" style="font-size:12px">A stabilized climb needs</text>
<text class="s" x="510" y="514.0" style="font-size:12px">thrust equal to drag plus a</text>
<text class="s" x="510" y="529.5" style="font-size:12px">share of weight</text>
<circle cx="501" cy="545.0" r="2.2" class="ah"/>
<text class="s" x="510" y="549.0" style="font-size:12px">A 10 degree climb: drag plus</text>
<text class="s" x="510" y="564.5" style="font-size:12px">17 percent of weight</text>
<rect class="cl" x="20" y="606.0" width="690" height="127.5" rx="8"/>
<circle cx="35" cy="628.0" r="2.2" class="ah"/>
<text class="s" x="44" y="632.0" style="font-size:12px">Maximum level flight speed is where the power or thrust required equals the maximum available</text>
<circle cx="35" cy="647.5" r="2.2" class="ah"/>
<text class="s" x="44" y="651.5" style="font-size:12px">Jet: maximum excess thrust is where thrust required is lowest, about L/DMAX. Propeller: below L/DMAX,</text>
<text class="s" x="44" y="667.0" style="font-size:12px">often just above stall speed</text>
<circle cx="35" cy="682.5" r="2.2" class="ah"/>
<text class="s" x="44" y="686.5" style="font-size:12px">Maximum ROC: jet above the L/DMAX airspeed; propeller closer to L/DMAX</text>
<circle cx="35" cy="702.0" r="2.2" class="ah"/>
<text class="s" x="44" y="706.0" style="font-size:12px">Climb performance is directly dependent on the ability to produce excess thrust or excess power</text>
</svg>
