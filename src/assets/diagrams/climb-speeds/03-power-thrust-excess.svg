<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 747" role="img" aria-labelledby="ti de"><title id="ti">Power available, power required and excess power</title><desc id="de">Schematic graph of power or thrust against airspeed for steady level flight. The power required curve is U shaped, with a lowest point at the best endurance airspeed; speeds below it are the region of reversed command and speeds above it the region of normal command. The maximum power available is a curved line above it. The gap between the two is excess power, which is what an aircraft uses to climb. Where the lines meet is the maximum level flight speed. Thrust is a force and power is the rate of work. Angle of climb depends on excess thrust and rate of climb on excess power. PHAK example: 200 horsepower available, 130 used for level flight, 70 left to climb. A 10 degree climb needs thrust equal to drag plus 17 percent of weight.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:12px}.q1{font-size:11.5px}.q2{font-size:13px}.q3{stroke:currentColor;stroke-width:1.5}.q4{stroke-width:3;opacity:1}</style><text class="t" x="20" y="28" style="font-size:15px">Power available, power required and excess power</text><text class="s q2" x="20" y="50">Schematic curves, no numbers. Climb performance depends on how much power or thrust is left over after</text><text class="s q2" x="20" y="66.5">level flight.</text><rect class="cl" x="20" y="91" width="690" height="501" rx="8"/><text class="t q2" x="32" y="113">Steady, level flight at one altitude and weight</text><path d="M148 229.9L153.7 229.6L159.4 229.3L165.1 229L170.8 228.7L176.4 228.3L182.1 228L187.8 227.7L193.5 227.4L199.2 227L204.9 226.7L210.6 226.4L216.2 226.1L221.9 225.8L227.6 225.4L233.3 225.1L239 224.8L244.7 224.5L250.4 224.1L256.1 223.8L261.8 223.5L267.4 223.2L273.1 222.9L278.8 222.5L284.5 222.2L290.2 221.9L295.9 221.6L301.6 221.2L307.2 220.9L312.9 220.6L318.6 220.3L324.3 220L330 219.6L335.7 219.3L341.4 219L347.1 218.7L352.8 218.4L358.4 218L364.1 217.7L369.8 217.4L375.5 217.1L381.2 216.7L386.9 216.4L392.6 216.1L398.2 215.8L403.9 215.5L409.6 215.1L415.3 214.8L421 214.5L421 212.5L415.3 220.1L409.6 227.5L403.9 234.5L398.2 241.3L392.6 247.8L386.9 254L381.2 260L375.5 265.7L369.8 271.2L364.1 276.4L358.4 281.4L352.8 286.1L347.1 290.6L341.4 294.8L335.7 298.8L330 302.6L324.3 306.1L318.6 309.4L312.9 312.4L307.2 315.3L301.6 317.8L295.9 320.2L290.2 322.3L284.5 324.3L278.8 325.9L273.1 327.4L267.4 328.6L261.8 329.6L256.1 330.3L250.4 330.8L244.7 331L239 331L233.3 330.7L227.6 330.1L221.9 329.3L216.2 328.1L210.6 326.6L204.9 324.8L199.2 322.6L193.5 320L187.8 316.9L182.1 313.3L176.4 309.2L170.8 304.4L165.1 298.9L159.4 292.6L153.7 285.2L148 276.7Z" class="mint" style="stroke:none"/><path d="M70 127L70 411L470 411" class="dk" style="stroke-width:2;opacity:0.8"/><text class="s q0" transform="translate(48 269) rotate(-90)" text-anchor="middle">power or thrust</text><text class="s e q0" x="470" y="405">airspeed</text><path d="M148 276.7L154.5 286.4L161 294.5L167.5 301.4L174 307.2L180.5 312.2L187 316.4L193.5 320L200 322.9L206.5 325.4L213 327.3L219.5 328.8L226 329.9L232.5 330.6L239 331L245.5 331L252 330.7L258.5 330L265 329L271.5 327.7L278 326.1L284.5 324.3L291 322.1L297.5 319.6L304 316.8L310.5 313.7L317 310.3L323.5 306.6L330 302.6L336.5 298.3L343 293.6L349.5 288.7L356 283.4L362.5 277.9L369 272L375.5 265.7L382 259.2L388.5 252.3L395 245L401.5 237.4L408 229.5L414.5 221.2L421 212.5L427.5 203.5L434 194.1L440.5 184.3L447 174.2L453.5 163.6L460 152.7" class="dk q4"/><path d="M148 229.9L154.5 229.6L161 229.2L167.5 228.8L174 228.5L180.5 228.1L187 227.7L193.5 227.4L200 227L206.5 226.6L213 226.3L219.5 225.9L226 225.5L232.5 225.2L239 224.8L245.5 224.4L252 224.1L258.5 223.7L265 223.3L271.5 223L278 222.6L284.5 222.2L291 221.8L297.5 221.5L304 221.1L310.5 220.7L317 220.4L323.5 220L330 219.6L336.5 219.3L343 218.9L349.5 218.5L356 218.2L362.5 217.8L369 217.4L375.5 217.1L382 216.7L388.5 216.3L395 216L401.5 215.6L408 215.2L414.5 214.9L421 214.5L427.5 214.1L434 213.8L440.5 213.4L447 213L453.5 212.6L460 212.3" class="acc q4"/><path d="M148 127L148 411" class="dk" style="stroke-width:1.4;opacity:.6;stroke-dasharray:5 4"/><text class="s q1" x="153" y="139">stall or minimum</text><text class="s q1" x="153" y="152">controllable speed</text><circle cx="242.4" cy="331" r="5" class="ah"/><text class="t m q1" x="242.38" y="365.03">lowest point: best</text><text class="t m q1" x="242.38" y="378.03">endurance airspeed</text><circle cx="421" cy="212.5" r="6" class="ah"/><text class="t e q1" x="466" y="274.55">maximum level</text><text class="t e q1" x="466" y="287.55">flight speed</text><path d="M429 262.55L422.2 228.4" class="dk" style="stroke-width:1.6"/><path d="M421 222.55L424.8 227.9L419.5 229Z" class="dh" style=""/><path d="M311.8 310.01L311.8 230.7" class="dk" style="stroke-width:2"/><path d="M311.8 223.67L314.9 230.7L308.7 230.7Z" class="dh" style=""/><path d="M311.8 223.67L311.8 303" class="dk" style="stroke-width:2"/><path d="M311.8 310.01L308.7 303L314.9 303Z" class="dh" style=""/><text class="t e q0" x="303.8" y="266.84">excess power</text><text class="s e q1" x="303.8" y="280.84">(climb)</text><text class="t q1" x="163.6" y="215.06">power or thrust available (maximum)</text><text class="t e q1" x="422.8" y="195.67">power or thrust required</text><text class="s m q1" x="195.19" y="427">reversed</text><text class="s m q1" x="195.19" y="440">command</text><text class="s m q1" x="351.19" y="427">normal command</text><rect x="490" y="127" width="220" height="24" rx="10" class="sky q3"/><text class="t q2" x="500" y="144">Thrust is not power</text><circle cx="501" cy="165" r="2.2" class="ah"/><text class="s q0" x="510" y="169">Thrust is a force, in pounds</text><text class="s q0" x="510" y="184.5">or newtons</text><circle cx="501" cy="200" r="2.2" class="ah"/><text class="s q0" x="510" y="204">Power is the rate of doing</text><text class="s q0" x="510" y="219.5">work, in horsepower or</text><text class="s q0" x="510" y="235">kilowatts</text><circle cx="501" cy="250.5" r="2.2" class="ah"/><text class="s q0" x="510" y="254.5">Angle of climb depends on</text><text class="s q0" x="510" y="270">excess thrust; rate of climb</text><text class="s q0" x="510" y="285.5">depends on excess power</text><rect x="490" y="315" width="220" height="24" rx="10" class="mint q3"/><text class="t q2" x="500" y="332">Example from PHAK</text><circle cx="501" cy="353" r="2.2" class="ah"/><text class="s q0" x="510" y="357">Engine makes 200 hp at a given</text><text class="s q0" x="510" y="372.5">altitude</text><circle cx="501" cy="388" r="2.2" class="ah"/><text class="s q0" x="510" y="392">Level flight there uses 130 hp</text><circle cx="501" cy="407.5" r="2.2" class="ah"/><text class="s q0" x="510" y="411.5">That leaves 70 hp available to</text><text class="s q0" x="510" y="427">climb</text><rect x="490" y="456.5" width="220" height="24" rx="10" class="lav q3"/><text class="t q2" x="500" y="473.5">Climb needs thrust</text><circle cx="501" cy="494.5" r="2.2" class="ah"/><text class="s q0" x="510" y="498.5">A stabilized climb needs</text><text class="s q0" x="510" y="514">thrust equal to drag plus a</text><text class="s q0" x="510" y="529.5">share of weight</text><circle cx="501" cy="545" r="2.2" class="ah"/><text class="s q0" x="510" y="549">A 10 degree climb: drag plus</text><text class="s q0" x="510" y="564.5">17 percent of weight</text><rect class="cl" x="20" y="606" width="690" height="127.5" rx="8"/><circle cx="35" cy="628" r="2.2" class="ah"/><text class="s q0" x="44" y="632">Maximum level flight speed is where the power or thrust required equals the maximum available</text><circle cx="35" cy="647.5" r="2.2" class="ah"/><text class="s q0" x="44" y="651.5">Jet: maximum excess thrust is where thrust required is lowest, about L/DMAX. Propeller: below L/DMAX,</text><text class="s q0" x="44" y="667">often just above stall speed</text><circle cx="35" cy="682.5" r="2.2" class="ah"/><text class="s q0" x="44" y="686.5">Maximum ROC: jet above the L/DMAX airspeed; propeller closer to L/DMAX</text><circle cx="35" cy="702" r="2.2" class="ah"/><text class="s q0" x="44" y="706">Climb performance is directly dependent on the ability to produce excess thrust or excess power</text></svg>
