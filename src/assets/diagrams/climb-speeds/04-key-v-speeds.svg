<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 658" role="img" aria-labelledby="ti de"><title id="ti">Key V-speeds, as PHAK defines them</title><desc id="de">Definitions of the V-speeds PHAK defines. Climb speeds: VX best angle of climb, which gains the most altitude in a given distance and is used to clear an obstacle on a short-field takeoff; VY best rate of climb, the most altitude in a given time; VYSE best rate of climb with one engine inoperative in a light twin. Stall speeds: VS0 in the landing configuration, the lower limit of the white arc; VS1 in a specified configuration, the lower limit of the green arc. Maximum speeds: VFE with flaps extended, upper limit of the white arc; VLE gear extended; VLO gear operating; VA design maneuvering speed; VNO maximum structural cruising speed, upper limit of the green arc; VNE never exceed speed, the red line.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:12px}.q1{font-size:13px}.q2{font-size:11px}.q3{stroke:currentColor;stroke-width:1.5}.q4{stroke:currentColor;stroke-width:1.4}</style><text class="t" x="20" y="28" style="font-size:15px">Key V-speeds, as PHAK defines them</text><text class="s q1" x="20" y="50">Only speeds that PHAK defines. The strip below is a schematic airspeed indicator with no scale.</text><rect class="cl" x="20" y="74.5" width="690" height="132" rx="8"/><text class="t q1" x="32" y="96.5">Where five of them sit on the airspeed indicator (schematic)</text><rect class="cl" x="60" y="134.5" width="610" height="34" rx="6" style="stroke:currentColor;stroke-width:1.2"/><rect x="110" y="138.5" width="190" height="10" class="cl q4"/><rect x="150" y="153.5" width="350" height="10" class="mint q4"/><path d="M570 134.5L570 168.5" class="acc" style="stroke-width:4"/><text class="t m q1" x="110" y="116.5">VS0</text><text class="s m q2" x="110" y="129.5">lower end of white arc</text><text class="t m q1" x="300" y="116.5">VFE</text><text class="s m q2" x="300" y="129.5">upper end of white arc</text><text class="t m q1" x="570" y="116.5">VNE</text><text class="s m q2" x="570" y="129.5">red line</text><text class="t m q1" x="150" y="184.5">VS1</text><text class="s m q2" x="150" y="198.5">lower end of green arc</text><text class="t m q1" x="500" y="184.5">VNO</text><text class="s m q2" x="500" y="198.5">upper end of green arc</text><rect x="20" y="220.5" width="337" height="24" rx="10" class="sky q3"/><text class="t q1" x="30" y="237.5">Climb speeds</text><text class="t q1" x="30" y="262.5">VX</text><text class="s q0" x="76" y="262.5">Best angle-of-climb speed: the greatest</text><text class="s q0" x="76" y="278">altitude gain in a given distance. Used in</text><text class="s q0" x="76" y="293.5">a short-field takeoff to clear an obstacle.</text><text class="s q0" x="76" y="309">Normally increases slightly with altitude.</text><text class="t q1" x="30" y="330.5">VY</text><text class="s q0" x="76" y="330.5">Best rate-of-climb speed: the most altitude</text><text class="s q0" x="76" y="346">gain in a given period of time. Normally</text><text class="s q0" x="76" y="361.5">decreases slightly with altitude.</text><text class="t q1" x="30" y="383">VYSE</text><text class="s q0" x="76" y="383">Best rate-of-climb speed with one engine</text><text class="s q0" x="76" y="398.5">inoperative, in a light, twin-engine</text><text class="s q0" x="76" y="414">airplane.</text><rect x="20" y="441.5" width="337" height="24" rx="10" class="mint q3"/><text class="t q1" x="30" y="458.5">Stall speeds</text><text class="t q1" x="30" y="483.5">VS0</text><text class="s q0" x="76" y="483.5">Calibrated power-off stall speed, or</text><text class="s q0" x="76" y="499">minimum steady flight speed at which the</text><text class="s q0" x="76" y="514.5">aircraft is controllable, in the landing</text><text class="s q0" x="76" y="530">configuration (gear and flaps down at</text><text class="s q0" x="76" y="545.5">maximum landing weight in small airplanes).</text><text class="s q0" x="76" y="561">Lower limit of the white arc.</text><text class="t q1" x="30" y="582.5">VS1</text><text class="s q0" x="76" y="582.5">Same, in a specified configuration. For</text><text class="s q0" x="76" y="598">most airplanes: maximum takeoff weight,</text><text class="s q0" x="76" y="613.5">clean (gear and flaps up). Lower limit of</text><text class="s q0" x="76" y="629">the green arc.</text><rect x="373" y="220.5" width="337" height="24" rx="10" class="lav q3"/><text class="t q1" x="383" y="237.5">Gear, flaps and structure</text><text class="t q1" x="383" y="262.5">VFE</text><text class="s q0" x="429" y="262.5">Highest speed permissible with the wing</text><text class="s q0" x="429" y="278">flaps in a prescribed extended position,</text><text class="s q0" x="429" y="293.5">because of air loads on the flaps. Upper</text><text class="s q0" x="429" y="309">limit of the white arc.</text><text class="t q1" x="383" y="330.5">VLE</text><text class="s q0" x="429" y="330.5">Maximum speed at which the aircraft can be</text><text class="s q0" x="429" y="346">safely flown with the landing gear extended</text><text class="s q0" x="429" y="361.5">(stability and controllability).</text><text class="t q1" x="383" y="383">VLO</text><text class="s q0" x="429" y="383">Maximum speed at which the landing gear can</text><text class="s q0" x="429" y="398.5">be safely extended or retracted (air loads</text><text class="s q0" x="429" y="414">on the mechanism).</text><text class="t q1" x="383" y="435.5">VA</text><text class="s q0" x="429" y="435.5">Calibrated design maneuvering speed: the</text><text class="s q0" x="429" y="451">maximum speed at which the limit load can</text><text class="s q0" x="429" y="466.5">be imposed, by gusts or full control</text><text class="s q0" x="429" y="482">deflection, without structural damage. At</text><text class="s q0" x="429" y="497.5">or below VA does not protect against</text><text class="s q0" x="429" y="513">multiple full inputs in one axis or full</text><text class="s q0" x="429" y="528.5">inputs in more than one axis at once.</text><text class="t q1" x="383" y="550">VNO</text><text class="s q0" x="429" y="550">Maximum structural cruising speed. Do not</text><text class="s q0" x="429" y="565.5">exceed it except in smooth air. Upper limit</text><text class="s q0" x="429" y="581">of the green arc.</text><text class="t q1" x="383" y="602.5">VNE</text><text class="s q0" x="429" y="602.5">Never-exceed speed. Above it, structural</text><text class="s q0" x="429" y="618">damage or failure may result. The red line.</text></svg>
