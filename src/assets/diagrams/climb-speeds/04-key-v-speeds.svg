<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 658" role="img" aria-labelledby="ti de"><title id="ti">Key V-speeds, as PHAK defines them</title><desc id="de">Definitions of the V-speeds PHAK defines. Climb speeds: VX best angle of climb, which gains the most altitude in a given distance and is used to clear an obstacle on a short-field takeoff; VY best rate of climb, the most altitude in a given time; VYSE best rate of climb with one engine inoperative in a light twin. Stall speeds: VS0 in the landing configuration, the lower limit of the white arc; VS1 in a specified configuration, the lower limit of the green arc. Maximum speeds: VFE with flaps extended, upper limit of the white arc; VLE gear extended; VLO gear operating; VA design maneuvering speed; VNO maximum structural cruising speed, upper limit of the green arc; VNE never exceed speed, the red line.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><text class="t" x="20" y="28" style="font-size:15px">Key V-speeds, as PHAK defines them</text><text class="s" x="20" y="50.0" style="font-size:13px">Only speeds that PHAK defines. The strip below is a schematic airspeed indicator with no scale.</text><rect class="cl" x="20" y="74.5" width="690" height="132" rx="8"/><text class="t" x="32" y="96.5" style="font-size:13px">Where five of them sit on the airspeed indicator (schematic)</text><rect class="cl" x="60" y="134.5" width="610" height="34" rx="6" style="stroke:currentColor;stroke-width:1.2"/><rect x="110" y="138.5" width="190" height="10" class="cl" style="stroke:currentColor;stroke-width:1.4"/><rect x="150" y="153.5" width="350" height="10" class="mint" style="stroke:currentColor;stroke-width:1.4"/><path d="M570 134.5L570 168.5" class="acc" style="stroke-width:4"/><text class="t m" x="110" y="116.5" style="font-size:13px">VS0</text><text class="s m" x="110" y="129.5" style="font-size:11px">lower end of white arc</text><text class="t m" x="300" y="116.5" style="font-size:13px">VFE</text><text class="s m" x="300" y="129.5" style="font-size:11px">upper end of white arc</text><text class="t m" x="570" y="116.5" style="font-size:13px">VNE</text><text class="s m" x="570" y="129.5" style="font-size:11px">red line</text><text class="t m" x="150" y="184.5" style="font-size:13px">VS1</text><text class="s m" x="150" y="198.5" style="font-size:11px">lower end of green arc</text><text class="t m" x="500" y="184.5" style="font-size:13px">VNO</text><text class="s m" x="500" y="198.5" style="font-size:11px">upper end of green arc</text><rect x="20" y="220.5" width="337" height="24" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30" y="237.5" style="font-size:13px">Climb speeds</text><text class="t" x="30" y="262.5" style="font-size:13px">VX</text><text class="s" x="76" y="262.5" style="font-size:12px">Best angle-of-climb speed: the greatest</text><text class="s" x="76" y="278.0" style="font-size:12px">altitude gain in a given distance. Used in</text><text class="s" x="76" y="293.5" style="font-size:12px">a short-field takeoff to clear an obstacle.</text><text class="s" x="76" y="309.0" style="font-size:12px">Normally increases slightly with altitude.</text><text class="t" x="30" y="330.5" style="font-size:13px">VY</text><text class="s" x="76" y="330.5" style="font-size:12px">Best rate-of-climb speed: the most altitude</text><text class="s" x="76" y="346.0" style="font-size:12px">gain in a given period of time. Normally</text><text class="s" x="76" y="361.5" style="font-size:12px">decreases slightly with altitude.</text><text class="t" x="30" y="383.0" style="font-size:13px">VYSE</text><text class="s" x="76" y="383.0" style="font-size:12px">Best rate-of-climb speed with one engine</text><text class="s" x="76" y="398.5" style="font-size:12px">inoperative, in a light, twin-engine</text><text class="s" x="76" y="414.0" style="font-size:12px">airplane.</text><rect x="20" y="441.5" width="337" height="24" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30" y="458.5" style="font-size:13px">Stall speeds</text><text class="t" x="30" y="483.5" style="font-size:13px">VS0</text><text class="s" x="76" y="483.5" style="font-size:12px">Calibrated power-off stall speed, or</text><text class="s" x="76" y="499.0" style="font-size:12px">minimum steady flight speed at which the</text><text class="s" x="76" y="514.5" style="font-size:12px">aircraft is controllable, in the landing</text><text class="s" x="76" y="530.0" style="font-size:12px">configuration (gear and flaps down at</text><text class="s" x="76" y="545.5" style="font-size:12px">maximum landing weight in small airplanes).</text><text class="s" x="76" y="561.0" style="font-size:12px">Lower limit of the white arc.</text><text class="t" x="30" y="582.5" style="font-size:13px">VS1</text><text class="s" x="76" y="582.5" style="font-size:12px">Same, in a specified configuration. For</text><text class="s" x="76" y="598.0" style="font-size:12px">most airplanes: maximum takeoff weight,</text><text class="s" x="76" y="613.5" style="font-size:12px">clean (gear and flaps up). Lower limit of</text><text class="s" x="76" y="629.0" style="font-size:12px">the green arc.</text><rect x="373" y="220.5" width="337" height="24" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="383" y="237.5" style="font-size:13px">Gear, flaps and structure</text><text class="t" x="383" y="262.5" style="font-size:13px">VFE</text><text class="s" x="429" y="262.5" style="font-size:12px">Highest speed permissible with the wing</text><text class="s" x="429" y="278.0" style="font-size:12px">flaps in a prescribed extended position,</text><text class="s" x="429" y="293.5" style="font-size:12px">because of air loads on the flaps. Upper</text><text class="s" x="429" y="309.0" style="font-size:12px">limit of the white arc.</text><text class="t" x="383" y="330.5" style="font-size:13px">VLE</text><text class="s" x="429" y="330.5" style="font-size:12px">Maximum speed at which the aircraft can be</text><text class="s" x="429" y="346.0" style="font-size:12px">safely flown with the landing gear extended</text><text class="s" x="429" y="361.5" style="font-size:12px">(stability and controllability).</text><text class="t" x="383" y="383.0" style="font-size:13px">VLO</text><text class="s" x="429" y="383.0" style="font-size:12px">Maximum speed at which the landing gear can</text><text class="s" x="429" y="398.5" style="font-size:12px">be safely extended or retracted (air loads</text><text class="s" x="429" y="414.0" style="font-size:12px">on the mechanism).</text><text class="t" x="383" y="435.5" style="font-size:13px">VA</text><text class="s" x="429" y="435.5" style="font-size:12px">Calibrated design maneuvering speed: the</text><text class="s" x="429" y="451.0" style="font-size:12px">maximum speed at which the limit load can</text><text class="s" x="429" y="466.5" style="font-size:12px">be imposed, by gusts or full control</text><text class="s" x="429" y="482.0" style="font-size:12px">deflection, without structural damage. At</text><text class="s" x="429" y="497.5" style="font-size:12px">or below VA does not protect against</text><text class="s" x="429" y="513.0" style="font-size:12px">multiple full inputs in one axis or full</text><text class="s" x="429" y="528.5" style="font-size:12px">inputs in more than one axis at once.</text><text class="t" x="383" y="550.0" style="font-size:13px">VNO</text><text class="s" x="429" y="550.0" style="font-size:12px">Maximum structural cruising speed. Do not</text><text class="s" x="429" y="565.5" style="font-size:12px">exceed it except in smooth air. Upper limit</text><text class="s" x="429" y="581.0" style="font-size:12px">of the green arc.</text><text class="t" x="383" y="602.5" style="font-size:13px">VNE</text><text class="s" x="429" y="602.5" style="font-size:12px">Never-exceed speed. Above it, structural</text><text class="s" x="429" y="618.0" style="font-size:12px">damage or failure may result. The red line.</text></svg>
