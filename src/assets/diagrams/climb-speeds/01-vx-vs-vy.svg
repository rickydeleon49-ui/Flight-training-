<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 612" role="img" aria-labelledby="ti de"><title id="ti">Best angle and best rate of climb: Vx and Vy</title><desc id="de">Side view schematic of two climb paths from a runway toward an obstacle such as trees or power lines. Vx, the best angle of climb speed, gives the steepest path and the highest altitude in a given horizontal distance, so it clears the obstacle; it is used for a short-field takeoff. Vy, the best rate of climb speed, gives the most altitude in a given time but a shallower path that may not clear the same obstacle. PHAK example: at maximum AOC an aircraft reaches 1,000 feet AGL in 30 seconds covering 3,000 feet over the ground; at maximum ROC it climbs 1,500 feet in 30 seconds covering 6,000 feet. Both use maximum throttle.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:12px}.q1{font-size:13px}.q2{font-size:15px}.q3{stroke-width:3.2;opacity:1}.q4{stroke:currentColor;stroke-width:1.5}</style><text class="t q2" x="20" y="28">Best angle and best rate of climb: Vx and Vy</text><text class="s q1" x="20" y="50">Schematic side view, not to scale. Both profiles use the maximum throttle setting; they differ in</text><text class="s q1" x="20" y="66.5">airspeed and angle of attack.</text><rect class="cl" x="20" y="91" width="690" height="290" rx="8"/><text class="t q1" x="32" y="113">Climbing away from the runway toward an obstacle</text><rect class="cl" x="32" y="353" width="666" height="12"/><path d="M32 353L698 353" class="dk" style="stroke-width:2;opacity:0.9"/><rect class="rose" x="330" y="261" width="24" height="92" style="stroke:currentColor;stroke-width:1.6"/><text class="s m q0" x="342" y="383">obstacle: trees or power lines</text><circle cx="70" cy="353" r="5" class="ah"/><path d="M70 353L560 147.2" class="acc q3"/><path d="M530 159.8L550.8 151.1" class="acc" style="stroke-width:3.2"/><path d="M560 147.2L552.5 155.2L549 146.9Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><text class="t q2" x="570" y="151.2">Vx</text><text class="t q1" x="60" y="169">Vx: best angle of climb (AOC)</text><text class="s q0" x="60" y="185">steepest path: clears the obstacle</text><path d="M70 353L328 301.4" class="dk q3"/><path d="M328 301.4L620 243" class="dk" style="stroke-width:3.2;opacity:0.7;stroke-dasharray:6 5"/><path d="M590 249L611.2 244.8" class="dk" style="stroke-width:3"/><path d="M620 243L612 248.7L610.4 240.8Z" class="dh" style=""/><text class="t q2" x="628" y="247">Vy</text><text class="t q1" x="380" y="323">Vy: best rate of climb (ROC)</text><text class="s q0" x="380" y="339">more height per minute, but may not clear it</text><text class="s m q0" x="70" y="383">takeoff</text><rect x="20" y="397" width="337" height="24" rx="10" class="sky q4"/><text class="t q1" x="30" y="414">Vx: best angle of climb</text><circle cx="31" cy="435" r="2.2" class="ah"/><text class="s q0" x="40" y="439">Highest altitude in a given horizontal distance</text><circle cx="31" cy="454.5" r="2.2" class="ah"/><text class="s q0" x="40" y="458.5">Maximum altitude gain with minimum travel over</text><text class="s q0" x="40" y="474">the ground</text><circle cx="31" cy="489.5" r="2.2" class="ah"/><text class="s q0" x="40" y="493.5">Use: short-field takeoff with trees or power</text><text class="s q0" x="40" y="509">lines ahead</text><circle cx="31" cy="524.5" r="2.2" class="ah"/><text class="s q0" x="40" y="528.5">Maximum AOC occurs at the airspeed and AOA that</text><text class="s q0" x="40" y="544">give maximum excess thrust</text><circle cx="31" cy="559.5" r="2.2" class="ah"/><text class="s q0" x="40" y="563.5">Example: 1,000 ft AGL in 30 seconds, covering</text><text class="s q0" x="40" y="579">only 3,000 ft over the ground</text><rect x="373" y="397" width="337" height="24" rx="10" class="mint q4"/><text class="t q1" x="383" y="414">Vy: best rate of climb</text><circle cx="384" cy="435" r="2.2" class="ah"/><text class="s q0" x="393" y="439">Most altitude gain in a given period of time</text><circle cx="384" cy="454.5" r="2.2" class="ah"/><text class="s q0" x="393" y="458.5">Gets to an assigned altitude sooner</text><circle cx="384" cy="474" r="2.2" class="ah"/><text class="s q0" x="393" y="478">Maximum ROC occurs at the airspeed and AOA that</text><text class="s q0" x="393" y="493.5">give maximum excess power</text><circle cx="384" cy="509" r="2.2" class="ah"/><text class="s q0" x="393" y="513">Example: 1,500 ft in 30 seconds, covering 6,000</text><text class="s q0" x="393" y="528.5">ft across the ground</text><circle cx="384" cy="544" r="2.2" class="ah"/><text class="s q0" x="393" y="548">Maximum ROC may not clear an obstacle that</text><text class="s q0" x="393" y="563.5">maximum AOC clears</text></svg>
