<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 587" role="img" aria-labelledby="ti de"><title id="ti">PAPI: the four lights beside the runway</title><desc id="de">Top view of a runway with a PAPI row of four light boxes beside it, a side view with five airplanes at different heights around a glide path, and five cards showing what the four lights look like: all white is too high, three white and one red is slightly high, two white and two red is on the glide path, one white and three red is slightly low, all red is too low. The red lights grow from the one nearest the runway.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><style>.LW,.LR,.LA,.LG{stroke:#0b0f1a;stroke-width:1.2}.LW{fill:#fff}.LR{fill:#e03131}.LA{fill:#f5a623}.LG{fill:#2fa84f}.PN{fill:#1c2230;stroke:#8b93a7;stroke-width:1.2}</style><defs><g id="pl"><g transform="translate(0 0) rotate(9) scale(0.8)"><ellipse cx="0" cy="0" rx="24" ry="5.5" class="sky" style="stroke:currentColor;stroke-width:1.4"/><path d="M-20 -2L-29 -13L-22 -13L-12 -3Z" class="sky" style="stroke:currentColor;stroke-width:1.4;stroke-linejoin:round"/><path d="M0 2L8 2L-4 11L-9 11Z" class="cl" style="stroke:currentColor;stroke-width:1.4;stroke-linejoin:round"/></g></g></defs><text class="t" x="20" y="28" style="font-size:15px">PAPI: the four lights beside the runway</text><text class="s" x="20" y="50.0" style="font-size:13px">A precision approach path indicator (PAPI) uses lights like the VASI, installed in a single row,</text><text class="s" x="20" y="66.5" style="font-size:13px">normally on the left side of the runway. Count the white and red lights to see where you are.</text><rect class="cl" x="20" y="89.0" width="320" height="232" rx="8"/><text class="t" x="30" y="109.0" style="font-size:13px">From above: the PAPI row</text><rect x="262" y="123.0" width="50" height="172.0" fill="#4b5563" stroke="#d1d5db" stroke-width="1.5"/><path d="M287.0 131.0L287.0 145.0" stroke="#fff" stroke-width="2.5"/><path d="M287.0 159.0L287.0 173.0" stroke="#fff" stroke-width="2.5"/><path d="M287.0 187.0L287.0 201.0" stroke="#fff" stroke-width="2.5"/><path d="M287.0 215.0L287.0 229.0" stroke="#fff" stroke-width="2.5"/><path d="M287.0 243.0L287.0 257.0" stroke="#fff" stroke-width="2.5"/><rect x="266" y="281.0" width="5" height="12" fill="#fff"/><rect x="275" y="281.0" width="5" height="12" fill="#fff"/><rect x="284" y="281.0" width="5" height="12" fill="#fff"/><rect x="293" y="281.0" width="5" height="12" fill="#fff"/><rect x="302" y="281.0" width="5" height="12" fill="#fff"/><rect x="130" y="215.0" width="112" height="34" rx="7" class="PN"/><circle cx="147.0" cy="232.0" r="9" class="LW"/><circle cx="173.0" cy="232.0" r="9" class="LW"/><circle cx="199.0" cy="232.0" r="9" class="LR"/><circle cx="225.0" cy="232.0" r="9" class="LR"/><text class="s" x="130" y="207.0" style="font-size:11px">Light boxes: one row</text><text class="s" x="130" y="267.0" style="font-size:10px">farthest</text><text class="s e" x="242" y="267.0" style="font-size:10px">nearest</text><text class="s e" x="254" y="139.0" style="font-size:11px">Runway</text><path d="M287.0 315.0L287.0 307.0" class="acc" style="stroke-width:2.5"/><path d="M287.0 299.0L290.6 307.0L283.4 307.0Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><text class="s e" x="254" y="315.0" style="font-size:10.5px">Approach</text><rect class="cl" x="350" y="89.0" width="360" height="232" rx="8"/><text class="t" x="360" y="109.0" style="font-size:13px">From the side: where you are on the path</text><path d="M360 285.0L700 285.0" class="o" style="stroke-width:1.5"/><rect x="634" y="285.0" width="66" height="8" fill="#4b5563" stroke="#d1d5db" stroke-width="1"/><text class="s e" x="700" y="307.0" style="font-size:10.5px">Runway</text><path d="M372 188L634 285.0" class="o d" style="stroke-width:1.8"/><text class="s" x="520" y="167.0" style="font-size:11px">Glide path, 3 degrees</text><text class="s" x="520" y="182.0" style="font-size:11px">(typical)</text><use href="#pl" x="450" y="131.0"/><circle cx="408" cy="131.0" r="10" class="ah"/><text class="t m" x="408" y="135.0" style="font-size:12px;fill:#fff">1</text><use href="#pl" x="450" y="173.0"/><circle cx="408" cy="173.0" r="10" class="ah"/><text class="t m" x="408" y="177.0" style="font-size:12px;fill:#fff">2</text><use href="#pl" x="450" y="217.0"/><circle cx="408" cy="217.0" r="10" class="ah"/><text class="t m" x="408" y="221.0" style="font-size:12px;fill:#fff">3</text><use href="#pl" x="450" y="245.0"/><circle cx="408" cy="245.0" r="10" class="ah"/><text class="t m" x="408" y="249.0" style="font-size:12px;fill:#fff">4</text><use href="#pl" x="450" y="269.0"/><circle cx="408" cy="269.0" r="10" class="ah"/><text class="t m" x="408" y="273.0" style="font-size:12px;fill:#fff">5</text><text class="t" x="20" y="341.0" style="font-size:14px">What you see, from too high to too low</text><text class="s" x="20" y="363.0" style="font-size:11.5px">Left light = farthest from the runway. Right light = nearest the runway.</text><rect class="cl" x="20.0" y="373.0" width="130.0" height="132" rx="8"/><rect x="20.0" y="373.0" width="130.0" height="26" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/><circle cx="34.0" cy="386.0" r="9" class="ah"/><text class="t m" x="34.0" y="389.6666666666667" style="font-size:11px;fill:#fff">1</text><text class="t" x="48.0" y="391.0" style="font-size:11.5px">Too high</text><rect x="30.0" y="409.0" width="112" height="34" rx="7" class="PN"/><circle cx="47.0" cy="426.0" r="9" class="LW"/><circle cx="73.0" cy="426.0" r="9" class="LW"/><circle cx="99.0" cy="426.0" r="9" class="LW"/><circle cx="125.0" cy="426.0" r="9" class="LW"/><text class="s" x="29.0" y="461.0" style="font-size:11px">All four white.</text><text class="s" x="29.0" y="475.5" style="font-size:11px">Well above the</text><text class="s" x="29.0" y="490.0" style="font-size:11px">glide path.</text><rect class="cl" x="160.0" y="373.0" width="130.0" height="132" rx="8"/><rect x="160.0" y="373.0" width="130.0" height="26" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><circle cx="174.0" cy="386.0" r="9" class="ah"/><text class="t m" x="174.0" y="389.6666666666667" style="font-size:11px;fill:#fff">2</text><text class="t" x="188.0" y="391.0" style="font-size:11.5px">Slightly high</text><rect x="170.0" y="409.0" width="112" height="34" rx="7" class="PN"/><circle cx="187.0" cy="426.0" r="9" class="LW"/><circle cx="213.0" cy="426.0" r="9" class="LW"/><circle cx="239.0" cy="426.0" r="9" class="LW"/><circle cx="265.0" cy="426.0" r="9" class="LR"/><text class="s" x="169.0" y="461.0" style="font-size:11px">Three white, one</text><text class="s" x="169.0" y="475.5" style="font-size:11px">red. A little above</text><text class="s" x="169.0" y="490.0" style="font-size:11px">the path.</text><rect class="cl" x="300.0" y="373.0" width="130.0" height="132" rx="8"/><rect x="300.0" y="373.0" width="130.0" height="26" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><circle cx="314.0" cy="386.0" r="9" class="ah"/><text class="t m" x="314.0" y="389.6666666666667" style="font-size:11px;fill:#fff">3</text><text class="t" x="328.0" y="391.0" style="font-size:11.5px">On glide path</text><rect x="310.0" y="409.0" width="112" height="34" rx="7" class="PN"/><circle cx="327.0" cy="426.0" r="9" class="LW"/><circle cx="353.0" cy="426.0" r="9" class="LW"/><circle cx="379.0" cy="426.0" r="9" class="LR"/><circle cx="405.0" cy="426.0" r="9" class="LR"/><text class="s" x="309.0" y="461.0" style="font-size:11px">Two white, two red.</text><text class="s" x="309.0" y="475.5" style="font-size:11px">You are on the</text><text class="s" x="309.0" y="490.0" style="font-size:11px">path.</text><rect class="cl" x="440.0" y="373.0" width="130.0" height="132" rx="8"/><rect x="440.0" y="373.0" width="130.0" height="26" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><circle cx="454.0" cy="386.0" r="9" class="ah"/><text class="t m" x="454.0" y="389.6666666666667" style="font-size:11px;fill:#fff">4</text><text class="t" x="468.0" y="391.0" style="font-size:11.5px">Slightly low</text><rect x="450.0" y="409.0" width="112" height="34" rx="7" class="PN"/><circle cx="467.0" cy="426.0" r="9" class="LW"/><circle cx="493.0" cy="426.0" r="9" class="LR"/><circle cx="519.0" cy="426.0" r="9" class="LR"/><circle cx="545.0" cy="426.0" r="9" class="LR"/><text class="s" x="449.0" y="461.0" style="font-size:11px">One white, three</text><text class="s" x="449.0" y="475.5" style="font-size:11px">red. A little below</text><text class="s" x="449.0" y="490.0" style="font-size:11px">the path.</text><rect class="cl" x="580.0" y="373.0" width="130.0" height="132" rx="8"/><rect x="580.0" y="373.0" width="130.0" height="26" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/><circle cx="594.0" cy="386.0" r="9" class="ah"/><text class="t m" x="594.0" y="389.6666666666667" style="font-size:11px;fill:#fff">5</text><text class="t" x="608.0" y="391.0" style="font-size:11.5px">Too low</text><rect x="590.0" y="409.0" width="112" height="34" rx="7" class="PN"/><circle cx="607.0" cy="426.0" r="9" class="LR"/><circle cx="633.0" cy="426.0" r="9" class="LR"/><circle cx="659.0" cy="426.0" r="9" class="LR"/><circle cx="685.0" cy="426.0" r="9" class="LR"/><text class="s" x="589.0" y="461.0" style="font-size:11px">All four red. Well</text><text class="s" x="589.0" y="475.5" style="font-size:11px">below the glide</text><text class="s" x="589.0" y="490.0" style="font-size:11px">path.</text><text class="s" x="20" y="525.0" style="font-size:12.5px">Why it works: as in the VASI, each light shows white in the upper part of its beam and red in the lower</text><text class="s" x="20" y="541.0" style="font-size:12.5px">part. The lower you are, the more lights look red, starting with the one nearest the runway.</text><text class="s" x="20" y="561.0" style="font-size:12.5px">Staying on the path gives obstacle clearance and a touchdown within the planned part of the runway.</text></svg>
