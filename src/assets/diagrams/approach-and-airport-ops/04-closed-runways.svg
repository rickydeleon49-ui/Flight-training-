<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 505" role="img" aria-labelledby="ti de"><title id="ti">Closed runways: permanent and temporary marks</title><desc id="de">Two top views of a runway. Permanently closed: yellow X marks at each end and every 1,000 feet, with no numbers. Temporarily closed: runway numbers still painted with a yellow X on or near them at each end. Two cards say a lighted X is preferable and to always check NOTAMs and ATIS.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><style>.LW,.LR,.LA,.LG{stroke:#0b0f1a;stroke-width:1.2}.LW{fill:#fff}.LR{fill:#e03131}.LA{fill:#f5a623}.LG{fill:#2fa84f}.PN{fill:#1c2230;stroke:#8b93a7;stroke-width:1.2}.q0{font-size:13px}.q1{stroke:currentColor;stroke-width:1.5}.q2{font-size:11.5px}.q3{font-size:11px}.q4{font-size:12px}</style><text class="t" x="20" y="28" style="font-size:15px">Closed runways: permanent and temporary marks</text><text class="s q0" x="20" y="50">A yellow X means the runway or taxiway is closed. What else you see depends on how long it is closed.</text><rect class="cl" x="20" y="72.5" width="690" height="160" rx="8"/><rect x="20" y="72.5" width="690" height="26" rx="10" class="rose q1"/><text class="t q0" x="30" y="90.5">Permanently closed</text><rect x="70" y="124.5" width="620" height="46" fill="#4b5563" stroke="#d1d5db" stroke-width="1.5"/><path d="M91 138.5L109 156.5M91 156.5L109 138.5" stroke="#f2c200" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M231 138.5L249 156.5M231 156.5L249 138.5" stroke="#f2c200" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M371 138.5L389 156.5M371 156.5L389 138.5" stroke="#f2c200" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M511 138.5L529 156.5M511 156.5L529 138.5" stroke="#f2c200" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M651 138.5L669 156.5M651 156.5L669 138.5" stroke="#f2c200" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M254 184.5L359 184.5" class="dk" style="stroke-width:2"/><path d="M366 184.5L359 187.7L359 181.3Z" class="dh"/><path d="M366 184.5L261 184.5" class="dk" style="stroke-width:2"/><path d="M254 184.5L261 181.3L261 187.7Z" class="dh"/><text class="s m q3" x="310" y="202.5">1,000 feet</text><text class="s m q3" x="380" y="116.5">X at each end and at 1,000-foot intervals</text><text class="s q4" x="30" y="224.5">Lighting circuits are disconnected. The threshold, designation and touchdown markings are obliterated.</text><rect class="cl" x="20" y="246.5" width="690" height="160" rx="8"/><rect x="20" y="246.5" width="690" height="26" rx="10" class="sky q1"/><text class="t q0" x="30" y="264.5">Temporarily closed</text><rect x="70" y="298.5" width="620" height="46" fill="#4b5563" stroke="#d1d5db" stroke-width="1.5"/><text x="116" y="327.5" fill="#fff" font-size="16" font-weight="700" font-family="system-ui,sans-serif" text-anchor="middle" transform="rotate(90 116 322.5)">36</text><text x="644" y="327.5" fill="#fff" font-size="16" font-weight="700" font-family="system-ui,sans-serif" text-anchor="middle" transform="rotate(-90 644 322.5)">18</text><path d="M145 312.5L163 330.5M145 330.5L163 312.5" stroke="#f2c200" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M597 312.5L615 330.5M597 330.5L615 312.5" stroke="#f2c200" stroke-width="4" stroke-linecap="round" fill="none"/><text class="s m q3" x="380" y="290.5">Lighted or flat X on or near the runway numbers at each end</text><text class="s q4" x="30" y="366.5">The X may be flat (held down with sand bags) or a raised lighted yellow X. Depending on the reason and</text><text class="s q4" x="30" y="382">length of the closure, a visual indication may not be present at all.</text><rect class="cl" x="20" y="420.5" width="338" height="71" rx="8"/><rect x="20" y="420.5" width="338" height="26" rx="10" class="mint q1"/><text class="t q0" x="30" y="438.5">Lighted X is preferable</text><circle cx="33" cy="456.5" r="2.2" class="ah"/><text class="s q2" x="42" y="460.5">It is much more discernible to approaching aircraft</text><text class="s q2" x="42" y="475.5">than flat material.</text><rect class="cl" x="372" y="420.5" width="338" height="71" rx="8"/><rect x="372" y="420.5" width="338" height="26" rx="10" class="lav q1"/><text class="t q0" x="382" y="438.5">Always check</text><circle cx="385" cy="456.5" r="2.2" class="ah"/><text class="s q2" x="394" y="460.5">Always check NOTAMs and ATIS for runway and taxiway</text><text class="s q2" x="394" y="475.5">closure information.</text></svg>
