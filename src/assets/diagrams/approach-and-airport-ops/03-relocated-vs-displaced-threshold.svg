<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 610" role="img" aria-labelledby="ti de"><title id="ti">Relocated versus displaced threshold</title><desc id="de">Two top views of a runway with a white bar across it. In the relocated threshold the part behind the bar is closed to takeoff and landing but open for taxi, with yellow arrow heads before the bar, and the runway in the opposite direction is shorter. In the displaced threshold white arrows run along the centerline behind the bar, that part is open for takeoffs either way and for landings from the opposite direction.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><style>.LW,.LR,.LA,.LG{stroke:#0b0f1a;stroke-width:1.2}.LW{fill:#fff}.LR{fill:#e03131}.LA{fill:#f5a623}.LG{fill:#2fa84f}.PN{fill:#1c2230;stroke:#8b93a7;stroke-width:1.2}.q0{font-size:11.5px}.q1{font-size:11px}.q2{font-size:13px}.q3{stroke:currentColor;stroke-width:1.5}.q4{stroke-width:2.5}.q5{fill:var(--palette-berry,#A84C6B)}</style><text class="t" x="20" y="28" style="font-size:15px">Relocated versus displaced threshold</text><text class="s q2" x="20" y="50">Both put a bar across the runway where landings begin. The difference is what is behind the bar.</text><rect class="cl" x="20" y="72.5" width="690" height="196" rx="8"/><rect x="20" y="72.5" width="690" height="26" rx="10" class="rose q3"/><text class="t q2" x="30" y="90.5">Relocated threshold: part of the runway is closed (construction or maintenance)</text><rect x="70" y="134.5" width="620" height="46" fill="#4b5563" stroke="#d1d5db" stroke-width="1.5"/><rect x="70" y="134.5" width="190" height="46" fill="#000" fill-opacity=".28"/><rect x="260" y="134.5" width="9" height="46" fill="#fff"/><path d="M216 143.5L226 157.5L216 171.5" fill="none" stroke="#f2c200" stroke-width="3.5" stroke-linejoin="round"/><path d="M228 143.5L238 157.5L228 171.5" fill="none" stroke="#f2c200" stroke-width="3.5" stroke-linejoin="round"/><path d="M240 143.5L250 157.5L240 171.5" fill="none" stroke="#f2c200" stroke-width="3.5" stroke-linejoin="round"/><path d="M290 157.5L670 157.5" stroke="#fff" stroke-width="2.5" stroke-dasharray="14 12"/><text class="s m q1" x="165" y="126.5">Closed: no takeoff or landing, taxi only</text><path d="M274 196.5L676 196.5" class="acc q4"/><path d="M684 196.5L676 200.1L676 192.9Z" class="dh q5"/><text class="s q1" x="274" y="214.5">Landing from the left starts at the bar</text><path d="M684 230.5L282 230.5" class="acc q4"/><path d="M274 230.5L282 226.9L282 234.1Z" class="dh q5"/><text class="s e q1" x="684" y="248.5">Landing from the right: shorter, it ends at the bar</text><text class="s" x="216" y="126.5" style="font-size:1px"></text><rect class="cl" x="20" y="282.5" width="690" height="196" rx="8"/><rect x="20" y="282.5" width="690" height="26" rx="10" class="sky q3"/><text class="t q2" x="30" y="300.5">Displaced threshold: runway is not moved, landings start further along</text><rect x="70" y="344.5" width="620" height="46" fill="#4b5563" stroke="#d1d5db" stroke-width="1.5"/><rect x="260" y="344.5" width="9" height="46" fill="#fff"/><path d="M216 353.5L226 367.5L216 381.5" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round"/><path d="M228 353.5L238 367.5L228 381.5" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round"/><path d="M240 353.5L250 367.5L240 381.5" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round"/><path d="M84 367.5L114 367.5M104 361.5L114 367.5L104 373.5" stroke="#fff" stroke-width="2.5" fill="none"/><path d="M128 367.5L158 367.5M148 361.5L158 367.5L148 373.5" stroke="#fff" stroke-width="2.5" fill="none"/><path d="M172 367.5L202 367.5M192 361.5L202 367.5L192 373.5" stroke="#fff" stroke-width="2.5" fill="none"/><path d="M290 367.5L670 367.5" stroke="#fff" stroke-width="2.5" stroke-dasharray="14 12"/><text class="s m q1" x="165" y="336.5">Open for takeoffs either way</text><path d="M274 406.5L676 406.5" class="acc q4"/><path d="M684 406.5L676 410.1L676 402.9Z" class="dh q5"/><text class="s q1" x="274" y="424.5">Landing from the left starts at the bar</text><path d="M684 440.5L84 440.5" class="acc q4"/><path d="M76 440.5L84 436.9L84 444.1Z" class="dh q5"/><text class="s e q1" x="684" y="458.5">Landing from the right can use all of the runway</text><rect class="cl" x="20" y="492.5" width="338" height="104" rx="8"/><rect x="20" y="492.5" width="338" height="26" rx="10" class="rose q3"/><text class="t q2" x="30" y="510.5">Relocated: look for</text><circle cx="33" cy="528.5" r="2.2" class="ah"/><text class="s q0" x="42" y="532.5">A ten foot wide white bar across the runway is a</text><text class="s q0" x="42" y="547.5">common marking.</text><circle cx="33" cy="561.5" r="2.2" class="ah"/><text class="s q0" x="42" y="565.5">Yellow arrow heads just before the bar.</text><rect class="cl" x="372" y="492.5" width="338" height="104" rx="8"/><rect x="372" y="492.5" width="338" height="26" rx="10" class="sky q3"/><text class="t q2" x="382" y="510.5">Displaced: look for</text><circle cx="385" cy="528.5" r="2.2" class="ah"/><text class="s q0" x="394" y="532.5">A ten foot wide white bar at the displaced</text><text class="s q0" x="394" y="547.5">threshold.</text><circle cx="385" cy="561.5" r="2.2" class="ah"/><text class="s q0" x="394" y="565.5">White arrows along the centerline behind it, and</text><text class="s q0" x="394" y="580.5">white arrow heads just before the bar.</text></svg>
