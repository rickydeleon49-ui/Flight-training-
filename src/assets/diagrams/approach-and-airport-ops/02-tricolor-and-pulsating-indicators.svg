<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 483" role="img" aria-labelledby="ti de"><title id="ti">Tri-color and pulsating approach indicators</title><desc id="de">Left, a single light unit sends out a fan of beams: amber on top for above the path, green for on the path, a thin dark amber band, then red for below the path, with an airplane in each. Right, four pulsating indicator readings: steady white on the path, steady red slightly below, pulsing red further below, pulsing white above, with the pulse rate rising the farther off the path.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><style>.LW,.LR,.LA,.LG{stroke:#0b0f1a;stroke-width:1.2}.LW{fill:#fff}.LR{fill:#e03131}.LA{fill:#f5a623}.LG{fill:#2fa84f}.PN{fill:#1c2230;stroke:#8b93a7;stroke-width:1.2}</style><text class="t" x="20" y="28" style="font-size:15px">Tri-color and pulsating approach indicators</text><text class="s" x="20" y="50.0" style="font-size:13px">Two single-light systems give glide path information by colour or by pulsing, instead of a row of</text><text class="s" x="20" y="66.5" style="font-size:13px">lights. Know what each color and pulse means.</text><rect class="cl" x="20" y="89.0" width="335" height="262" rx="8"/><rect x="20" y="89.0" width="335" height="26" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30" y="107.0" style="font-size:13px">Tri-color: one unit, three colors</text><path d="M330 231.0L150 135.0L150 191.0Z" fill="#f5a623" stroke="none"/><path d="M330 231.0L150 191.0L150 227.0Z" fill="#2fa84f" stroke="none"/><path d="M330 231.0L150 227.0L150 239.0Z" fill="#8a5a00" stroke="none"/><path d="M330 231.0L150 239.0L150 295.0Z" fill="#e03131" stroke="none"/><rect x="326" y="223.0" width="14" height="16" rx="3" fill="#1c2230" stroke="#8b93a7" stroke-width="1.2"/><g transform="translate(190 178.11) rotate(6) scale(0.7)"><ellipse cx="0" cy="0" rx="24" ry="5.5" class="sky" style="stroke:currentColor;stroke-width:1.4"/><path d="M-20 -2L-29 -13L-22 -13L-12 -3Z" class="sky" style="stroke:currentColor;stroke-width:1.4;stroke-linejoin:round"/><path d="M0 2L8 2L-4 11L-9 11Z" class="cl" style="stroke:currentColor;stroke-width:1.4;stroke-linejoin:round"/></g><text class="t" x="30" y="176.11111111111111" style="font-size:11.5px">Above the path</text><text class="s" x="30" y="191.11111111111111" style="font-size:11px">amber</text><g transform="translate(190 213.89) rotate(6) scale(0.7)"><ellipse cx="0" cy="0" rx="24" ry="5.5" class="sky" style="stroke:currentColor;stroke-width:1.4"/><path d="M-20 -2L-29 -13L-22 -13L-12 -3Z" class="sky" style="stroke:currentColor;stroke-width:1.4;stroke-linejoin:round"/><path d="M0 2L8 2L-4 11L-9 11Z" class="cl" style="stroke:currentColor;stroke-width:1.4;stroke-linejoin:round"/></g><text class="t" x="30" y="211.88888888888889" style="font-size:11.5px">On the path</text><text class="s" x="30" y="226.88888888888889" style="font-size:11px">green</text><g transform="translate(190 269.89) rotate(6) scale(0.7)"><ellipse cx="0" cy="0" rx="24" ry="5.5" class="sky" style="stroke:currentColor;stroke-width:1.4"/><path d="M-20 -2L-29 -13L-22 -13L-12 -3Z" class="sky" style="stroke:currentColor;stroke-width:1.4;stroke-linejoin:round"/><path d="M0 2L8 2L-4 11L-9 11Z" class="cl" style="stroke:currentColor;stroke-width:1.4;stroke-linejoin:round"/></g><text class="t" x="30" y="267.8888888888889" style="font-size:11.5px">Below the path</text><text class="s" x="30" y="282.8888888888889" style="font-size:11px">red</text><text class="s" x="30" y="244.0" style="font-size:10.5px">dark amber</text><path d="M92 236.0L150 234.0" class="o" style="stroke-width:1.3"/><rect class="cl" x="370" y="89.0" width="340" height="262" rx="8"/><rect x="370" y="89.0" width="340" height="26" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="380" y="107.0" style="font-size:13px">Pulsating: one unit, two colors</text><rect x="382" y="125.0" width="48" height="40" rx="7" class="PN"/><circle cx="406" cy="145.0" r="10" class="LW"/><text class="t" x="446" y="143.0" style="font-size:12.5px">On glide path</text><text class="s" x="446" y="159.0" style="font-size:11.5px">Steady white</text><rect x="382" y="169.0" width="48" height="40" rx="7" class="PN"/><circle cx="406" cy="189.0" r="10" class="LR"/><text class="t" x="446" y="187.0" style="font-size:12.5px">Slightly below</text><text class="s" x="446" y="203.0" style="font-size:11.5px">Steady red</text><rect x="382" y="213.0" width="48" height="40" rx="7" class="PN"/><circle cx="406" cy="233.0" r="16" fill="none" stroke="#e03131" stroke-width="2" stroke-dasharray="3 3"/><circle cx="406" cy="233.0" r="10" class="LR"/><text class="t" x="446" y="231.0" style="font-size:12.5px">Further below</text><text class="s" x="446" y="247.0" style="font-size:11.5px">Pulsating red</text><rect x="382" y="257.0" width="48" height="40" rx="7" class="PN"/><circle cx="406" cy="277.0" r="16" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="3 3"/><circle cx="406" cy="277.0" r="10" class="LW"/><text class="t" x="446" y="275.0" style="font-size:12.5px">Above the path</text><text class="s" x="446" y="291.0" style="font-size:11.5px">Pulsating white</text><text class="s" x="382" y="311.0" style="font-size:11.5px">The pulse rate increases the farther you get above</text><text class="s" x="382" y="326.0" style="font-size:11.5px">or below the path.</text><rect class="cl" x="20.0" y="365.0" width="338.0" height="104.0" rx="8"/><rect x="20.0" y="365.0" width="338.0" height="26" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30.0" y="383.0" style="font-size:13px">Tri-color</text><circle cx="33.0" cy="401.0" r="2.2" class="ah"/><text class="s" x="42.0" y="405.0" style="font-size:11.5px">Red below the path, green on it, amber above.</text><circle cx="33.0" cy="419.0" r="2.2" class="ah"/><text class="s" x="42.0" y="423.0" style="font-size:11.5px">Descending below the path there is a small area of</text><text class="s" x="42.0" y="438.0" style="font-size:11.5px">dark amber. Do not mistake it for an "above"</text><text class="s" x="42.0" y="453.0" style="font-size:11.5px">indication.</text><rect class="cl" x="372.0" y="365.0" width="338.0" height="104.0" rx="8"/><rect x="372.0" y="365.0" width="338.0" height="26" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="382.0" y="383.0" style="font-size:13px">Pulsating</text><circle cx="385.0" cy="401.0" r="2.2" class="ah"/><text class="s" x="394.0" y="405.0" style="font-size:11.5px">The on-path indication is a steady white light,</text><text class="s" x="394.0" y="420.0" style="font-size:11.5px">slightly below is steady red.</text><circle cx="385.0" cy="434.0" r="2.2" class="ah"/><text class="s" x="394.0" y="438.0" style="font-size:11.5px">Useful range is about four miles during the day and</text><text class="s" x="394.0" y="453.0" style="font-size:11.5px">up to ten miles at night.</text></svg>
