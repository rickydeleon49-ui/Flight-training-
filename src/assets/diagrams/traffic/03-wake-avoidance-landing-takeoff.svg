<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 769" role="img" aria-labelledby="ti de"><title id="ti">Avoiding wake behind a larger aircraft</title><desc id="de">Side views. Landing behind a larger aircraft on the same runway: stay at or above its approach path and land beyond its touchdown point. Departing behind a large aircraft: rotate prior to its rotation point and climb above its climb path until turning clear of the wake. Crossing runway: if its rotation point is past the intersection, land prior to the intersection; if it rotates before, avoid flight below its path and abandon the approach unless landing is ensured well before the intersection. A crosswind decreases the upwind vortex movement and increases the downwind vortex movement. Wait at least 2 minutes after a low approach, missed approach or touch-and-go. A light quartering tailwind is the worst case.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><text class="t" x="20" y="28" style="font-size:15px">Avoiding wake behind a larger aircraft</text><text class="s" x="20" y="50.0" style="font-size:13px">Stay at or above its flight path, and keep clear of its rotation point and touchdown point.</text><rect class="cl" x="20" y="74.5" width="335" height="202" rx="8"/><text class="t" x="32" y="96.5" style="font-size:13px">Landing behind a larger aircraft</text><text class="s" x="32" y="111.5" style="font-size:11px">Same runway. Blue = larger aircraft, green = you</text><path d="M30 244.5L345 244.5" class="dk" style="stroke-width:3"/><path d="M40 144.5L190 244.5" class="dk" style="stroke-width:2;opacity:0.8;stroke-dasharray:6 5"/><g transform="rotate(32 115 194.5)"><path d="M86.1 190.2L70.8 177.5L77.6 177.5L92.9 192.8Z" class="sky" style="stroke:currentColor;stroke-width:1.6;stroke-linejoin:round"/><ellipse cx="115" cy="194.5" rx="32.3" ry="7.6" class="sky" style="stroke:currentColor;stroke-width:1.6;stroke-linejoin:round"/><path d="M109.9 186.8L123.5 186.8" class="dk" style="stroke-width:3.0"/></g><text class="s" x="195" y="174.5" style="font-size:10.5px">Larger aircraft</text><text class="s" x="195" y="186.5" style="font-size:10.5px">approach path</text><path d="M65 136.5L275 244.5" class="acc" style="stroke-width:2.2;stroke-dasharray:7 5"/><g transform="rotate(27 72 142.5)"><path d="M51.6 139.5L40.8 130.5L45.6 130.5L56.4 141.3Z" class="mint" style="stroke:currentColor;stroke-width:1.6;stroke-linejoin:round"/><ellipse cx="72" cy="142.5" rx="22.8" ry="5.4" class="mint" style="stroke:currentColor;stroke-width:1.6;stroke-linejoin:round"/><path d="M68.4 137.1L78.0 137.1" class="dk" style="stroke-width:2.1"/></g><path d="M190 238.5L190 250.5" class="acc" style="stroke-width:3"/><text class="s e" x="190" y="263.5" style="font-size:10.5px">its touchdown</text><path d="M275 238.5L275 250.5" class="acc" style="stroke-width:3"/><text class="s m" x="275" y="263.5" style="font-size:10.5px">you land beyond</text><rect class="cl" x="375" y="74.5" width="335" height="202" rx="8"/><text class="t" x="387" y="96.5" style="font-size:13px">Departing behind a large aircraft</text><text class="s" x="387" y="111.5" style="font-size:11px">Same runway. Blue = larger aircraft, green = you</text><path d="M385 244.5L700 244.5" class="dk" style="stroke-width:3"/><path d="M535 244.5L695 164.5" class="dk" style="stroke-width:2;opacity:0.8;stroke-dasharray:6 5"/><g transform="rotate(-27 615 204.5)"><path d="M586.1 200.2L570.8 187.5L577.6 187.5L592.9 202.8Z" class="sky" style="stroke:currentColor;stroke-width:1.6;stroke-linejoin:round"/><ellipse cx="615" cy="204.5" rx="32.3" ry="7.6" class="sky" style="stroke:currentColor;stroke-width:1.6;stroke-linejoin:round"/><path d="M609.9 196.8L623.5 196.8" class="dk" style="stroke-width:3.0"/></g><path d="M470 244.5L590 134.5" class="acc" style="stroke-width:2.2;stroke-dasharray:7 5"/><g transform="rotate(-43 560 162.5)"><path d="M539.6 159.5L528.8 150.5L533.6 150.5L544.4 161.3Z" class="mint" style="stroke:currentColor;stroke-width:1.6;stroke-linejoin:round"/><ellipse cx="560" cy="162.5" rx="22.8" ry="5.4" class="mint" style="stroke:currentColor;stroke-width:1.6;stroke-linejoin:round"/><path d="M556.4 157.1L566.0 157.1" class="dk" style="stroke-width:2.1"/></g><path d="M470 238.5L470 250.5" class="acc" style="stroke-width:3"/><text class="s e" x="470" y="263.5" style="font-size:10.5px">you rotate first</text><path d="M535 238.5L535 250.5" class="acc" style="stroke-width:3"/><text class="s " x="535" y="263.5" style="font-size:10.5px">its rotation</text><text class="s e" x="698" y="142.5" style="font-size:10.5px">Climb above its path</text><text class="s e" x="698" y="154.5" style="font-size:10.5px">until turning clear</text><rect class="cl" x="20" y="288.5" width="335" height="202" rx="8"/><text class="t" x="32" y="310.5" style="font-size:13px">Landing behind a larger aircraft</text><text class="s" x="32" y="325.5" style="font-size:11px">on a crossing runway (top view)</text><rect x="34" y="348.5" width="144" height="14" class="cl"/><rect x="99" y="333.5" width="14" height="60" class="cl"/><text class="t m" x="106" y="412.5" style="font-size:11px">Rotates past it</text><path d="M150 342.5L150 368.5" class="acc" style="stroke-width:3"/><text class="s m" x="150" y="378.5" style="font-size:10px">rotation</text><g transform="rotate(0 54 355.5)"><path d="M38.7 353.2L30.6 346.5L34.2 346.5L42.3 354.6Z" class="sky" style="stroke:currentColor;stroke-width:1.6;stroke-linejoin:round"/><ellipse cx="54" cy="355.5" rx="17.1" ry="4.0" class="sky" style="stroke:currentColor;stroke-width:1.6;stroke-linejoin:round"/><path d="M51.3 351.4L58.5 351.4" class="dk" style="stroke-width:1.6"/></g><rect x="198" y="348.5" width="144" height="14" class="cl"/><rect x="263" y="333.5" width="14" height="60" class="cl"/><text class="t m" x="270" y="412.5" style="font-size:11px">Rotates before it</text><path d="M242 342.5L242 368.5" class="acc" style="stroke-width:3"/><text class="s m" x="242" y="378.5" style="font-size:10px">rotation</text><g transform="rotate(0 208 355.5)"><path d="M192.7 353.2L184.6 346.5L188.2 346.5L196.3 354.6Z" class="sky" style="stroke:currentColor;stroke-width:1.6;stroke-linejoin:round"/><ellipse cx="208" cy="355.5" rx="17.1" ry="4.0" class="sky" style="stroke:currentColor;stroke-width:1.6;stroke-linejoin:round"/><path d="M205.3 351.4L212.5 351.4" class="dk" style="stroke-width:1.6"/></g><path d="M106 330.5L106.0 338.5" class="acc" style="stroke-width:2.5"/><path d="M106 345.5L102.8 338.5L109.2 338.5Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><path d="M270 330.5L270.0 338.5" class="dk" style="stroke-width:2.5"/><path d="M270 345.5L266.9 338.5L273.1 338.5Z" class="dh" style=""/><text class="s" x="30" y="426.5" style="font-size:10.5px">Continue and land prior to</text><text class="s" x="30" y="440.5" style="font-size:10.5px">the intersection.</text><text class="s" x="194" y="426.5" style="font-size:10.5px">Avoid flight below its</text><text class="s" x="194" y="440.5" style="font-size:10.5px">path. Abandon the approach</text><text class="s" x="194" y="454.5" style="font-size:10.5px">unless a landing is ensured</text><text class="s" x="194" y="468.5" style="font-size:10.5px">well before the</text><text class="s" x="194" y="482.5" style="font-size:10.5px">intersection.</text><rect class="cl" x="375" y="288.5" width="335" height="202" rx="8"/><text class="t" x="387" y="310.5" style="font-size:13px">Crosswind near the ground</text><text class="s" x="387" y="325.5" style="font-size:11px">(vortices within 100 to 200 feet)</text><path d="M385 416.5L700 416.5" class="dk" style="stroke-width:3"/><rect x="495" y="411.5" width="95" height="5" class="ah" style="fill-opacity:.55"/><text class="s m" x="543" y="430.5" style="font-size:10.5px">runway</text><circle cx="505" cy="392.5" r="14" class="lav" style="stroke:currentColor;stroke-width:1.5;stroke-linejoin:round"/><path d="M509.8 379.3A14 14 0 1 1 491.2 390.1" class="acc" style="stroke-width:3"/><path d="M491.2 390.1L493.6 399.6L485.7 398.2Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><circle cx="585" cy="392.5" r="14" class="lav" style="stroke:currentColor;stroke-width:1.5;stroke-linejoin:round"/><path d="M580.2 379.3A14 14 0 1 0 598.8 390.1" class="acc" style="stroke-width:3"/><path d="M598.8 390.1L604.3 398.2L596.4 399.6Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><path d="M395 346.5L437.0 346.5" class="dk" style="stroke-width:3"/><path d="M445 346.5L437.0 350.1L437.0 342.9Z" class="dh" style=""/><text class="t" x="395" y="340.5" style="font-size:11px">Crosswind</text><path d="M489 392.5L477.0 392.5" class="dk" style="stroke-width:2.5"/><path d="M471 392.5L477.0 389.8L477.0 395.2Z" class="dh" style=""/><path d="M601 392.5L652.0 392.5" class="acc" style="stroke-width:3"/><path d="M660 392.5L652.0 396.1L652.0 388.9Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><text class="s m" x="471" y="370.5" style="font-size:10.5px">upwind: less</text><text class="s m" x="637" y="370.5" style="font-size:10.5px">downwind: more</text><text class="s" x="385" y="446.5" style="font-size:10.5px">Cross-runway wind of 1 to 5 knots could keep the upwind</text><text class="s" x="385" y="460.5" style="font-size:10.5px">vortex in the touchdown zone and hasten the downwind</text><text class="s" x="385" y="474.5" style="font-size:10.5px">vortex toward another runway.</text><rect x="20" y="502.5" width="335" height="24" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30" y="519.5" style="font-size:13px">More landing and takeoff rules</text><circle cx="31" cy="540.5" r="2.2" class="ah"/><text class="s" x="40" y="544.5" style="font-size:11.5px">Parallel runway closer than 2,500 feet: consider</text><text class="s" x="40" y="559.5" style="font-size:11.5px">drift, stay at or above the larger aircraft's final</text><text class="s" x="40" y="574.5" style="font-size:11.5px">approach path, note its touchdown point</text><circle cx="31" cy="589.5" r="2.2" class="ah"/><text class="s" x="40" y="593.5" style="font-size:11.5px">Crossing runway (landing): cross above the larger</text><text class="s" x="40" y="608.5" style="font-size:11.5px">aircraft's flight path</text><circle cx="31" cy="623.5" r="2.2" class="ah"/><text class="s" x="40" y="627.5" style="font-size:11.5px">Behind a departing aircraft on the same runway:</text><text class="s" x="40" y="642.5" style="font-size:11.5px">land prior to its rotating point</text><circle cx="31" cy="657.5" r="2.2" class="ah"/><text class="s" x="40" y="661.5" style="font-size:11.5px">Intersection takeoff: avoid headings that cross</text><text class="s" x="40" y="676.5" style="font-size:11.5px">below the larger aircraft's path</text><rect x="375" y="502.5" width="335" height="24" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="385" y="519.5" style="font-size:13px">Wait, and wind</text><circle cx="386" cy="540.5" r="2.2" class="ah"/><text class="s" x="395" y="544.5" style="font-size:11.5px">After a large aircraft's low approach, missed</text><text class="s" x="395" y="559.5" style="font-size:11.5px">approach, or touch-and-go: wait at least 2 minutes</text><text class="s" x="395" y="574.5" style="font-size:11.5px">before takeoff or landing</text><circle cx="386" cy="589.5" r="2.2" class="ah"/><text class="s" x="395" y="593.5" style="font-size:11.5px">A light quartering tailwind is the worst case:</text><text class="s" x="395" y="608.5" style="font-size:11.5px">vortices may lie along a significant part of the</text><text class="s" x="395" y="623.5" style="font-size:11.5px">final approach and extended centerline, not just</text><text class="s" x="395" y="638.5" style="font-size:11.5px">the touchdown zone</text><circle cx="386" cy="653.5" r="2.2" class="ah"/><text class="s" x="395" y="657.5" style="font-size:11.5px">A crosswind decreases the lateral movement of the</text><text class="s" x="395" y="672.5" style="font-size:11.5px">upwind vortex and increases that of the downwind</text><text class="s" x="395" y="687.5" style="font-size:11.5px">vortex</text><circle cx="386" cy="702.5" r="2.2" class="ah"/><text class="s" x="395" y="706.5" style="font-size:11.5px">En route: avoid a path below and behind a large</text><text class="s" x="395" y="721.5" style="font-size:11.5px">aircraft; if one is above on the same track, move</text><text class="s" x="395" y="736.5" style="font-size:11.5px">laterally, preferably upwind</text></svg>
