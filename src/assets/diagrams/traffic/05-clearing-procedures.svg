<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 557" role="img" aria-labelledby="ti de"><title id="ti">Clearing procedures</title><desc id="de">Climbs and descents: gentle banks left and right at a frequency that permits continuous visual scanning. Before a turn, a high-wing pilot momentarily raises the wing in the direction of the turn and looks; a low-wing pilot momentarily lowers it and looks. Before takeoff scan the approach area for landing traffic. Avoid entering traffic patterns while descending. Keep sustained vigilance near VORs and intersections. In training, clearing turns come before practice maneuvers and the student calls out clear left, right, above, and below.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style>
<text class="t" x="20" y="28" style="font-size:15px">Clearing procedures</text>
<text class="s" x="20" y="50.0" style="font-size:13px">Procedures and considerations that help pilots avoid collisions in various situations.</text>
<rect class="cl" x="20" y="74.5" width="335" height="180" rx="8"/>
<text class="t" x="32" y="96.5" style="font-size:13px">Climbs and descents</text>
<path d="M40 166.5C90 138.5 110 138.5 150 166.5S210 194.5 260 166.5S300 142.5 320 156.5" class="acc" style="stroke-dasharray:7 5;stroke-width:2.5"/>
<g transform="rotate(0 150 166.5)"><path d="M133.0 164.0L124.0 156.5L128.0 156.5L137.0 165.5Z" class="sky" style="stroke:currentColor;stroke-width:1.6;stroke-linejoin:round"/>
<ellipse cx="150" cy="166.5" rx="19.0" ry="4.5" class="sky" style="stroke:currentColor;stroke-width:1.6;stroke-linejoin:round"/>
<path d="M147.0 162.0L155.0 162.0" class="dk" style="stroke-width:1.8"/></g>
<text class="s" x="32" y="114.5" style="font-size:11.5px">Gentle banks left and right</text>
<text class="s m" x="187.5" y="222.5" style="font-size:11.5px">Fly gentle banks left and right, at a frequency that</text>
<text class="s m" x="187.5" y="237.5" style="font-size:11.5px">permits continuous visual scanning.</text>
<rect class="cl" x="375" y="74.5" width="335" height="180" rx="8"/>
<text class="t" x="387" y="96.5" style="font-size:13px">Before a turn: blind spots</text>
<g transform="rotate(10 450 166.5)">
<path d="M390 152.5L510 152.5" class="dk" style="stroke-width:5"/>
<ellipse cx="450" cy="166.5" rx="10" ry="15" class="sky" style="stroke:currentColor;stroke-width:1.6;stroke-linejoin:round"/>
<path d="M450 154.5L450 140.5M440 141.5L460 141.5" class="dk" style="stroke-width:4"/>
</g>
<g transform="rotate(-10 630 166.5)">
<path d="M570 178.5L690 178.5" class="dk" style="stroke-width:5"/>
<ellipse cx="630" cy="166.5" rx="10" ry="15" class="mint" style="stroke:currentColor;stroke-width:1.6;stroke-linejoin:round"/>
<path d="M630 154.5L630 140.5M620 141.5L640 141.5" class="dk" style="stroke-width:4"/>
</g>
<text class="t m" x="450" y="128.5" style="font-size:11.5px">High-wing</text>
<text class="t m" x="630" y="128.5" style="font-size:11.5px">Low-wing</text>
<path d="M396 190.5L396.0 173.5" class="acc" style="stroke-width:2.5"/><path d="M396 166.5L399.1 173.5L392.9 173.5Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/>
<path d="M576 194.5L576.0 209.5" class="acc" style="stroke-width:2.5"/><path d="M576 216.5L572.9 209.5L579.1 209.5Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/>
<text class="s m" x="450" y="202.5" style="font-size:11px">raise the wing</text>
<text class="s m" x="630" y="202.5" style="font-size:11px">lower the wing</text>
<text class="s m" x="450" y="216.5" style="font-size:11px">toward the turn,</text>
<text class="s m" x="630" y="216.5" style="font-size:11px">toward the turn,</text>
<text class="s m" x="450" y="230.5" style="font-size:11px">then look</text>
<text class="s m" x="630" y="230.5" style="font-size:11px">then look</text>
<rect x="20" y="268.5" width="335" height="24" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="30" y="285.5" style="font-size:13px">Before takeoff</text>
<circle cx="31" cy="306.5" r="2.2" class="ah"/>
<text class="s" x="40" y="310.5" style="font-size:11.5px">Before taxiing onto a runway or landing area, scan</text>
<text class="s" x="40" y="325.5" style="font-size:11.5px">the approach area for possible landing traffic</text>
<circle cx="31" cy="340.5" r="2.2" class="ah"/>
<text class="s" x="40" y="344.5" style="font-size:11.5px">Execute maneuvers that give a clear view of the</text>
<text class="s" x="40" y="359.5" style="font-size:11.5px">approach areas</text>
<rect x="375" y="268.5" width="335" height="24" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="385" y="285.5" style="font-size:13px">Traffic patterns and VORs</text>
<circle cx="386" cy="306.5" r="2.2" class="ah"/>
<text class="s" x="395" y="310.5" style="font-size:11.5px">Avoid entering traffic patterns while descending</text>
<circle cx="386" cy="325.5" r="2.2" class="ah"/>
<text class="s" x="395" y="329.5" style="font-size:11.5px">Converging traffic: keep sustained vigilance in the</text>
<text class="s" x="395" y="344.5" style="font-size:11.5px">vicinity of VORs and intersections</text>
<rect x="20" y="384.5" width="335" height="24" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="30" y="401.5" style="font-size:13px">Straight and level</text>
<circle cx="31" cy="422.5" r="2.2" class="ah"/>
<text class="s" x="40" y="426.5" style="font-size:11.5px">During sustained straight-and-level flight, execute</text>
<text class="s" x="40" y="441.5" style="font-size:11.5px">appropriate clearing procedures at periodic</text>
<text class="s" x="40" y="456.5" style="font-size:11.5px">intervals</text>
<rect x="375" y="384.5" width="335" height="24" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="385" y="401.5" style="font-size:13px">Training operations</text>
<circle cx="386" cy="422.5" r="2.2" class="ah"/>
<text class="s" x="395" y="426.5" style="font-size:11.5px">Keep vigilance and make clearing turns before a</text>
<text class="s" x="395" y="441.5" style="font-size:11.5px">practice maneuver</text>
<circle cx="386" cy="456.5" r="2.2" class="ah"/>
<text class="s" x="395" y="460.5" style="font-size:11.5px">Clearing should precede all turns, stalls, slow</text>
<text class="s" x="395" y="475.5" style="font-size:11.5px">flight, climbs, spins, and other combination</text>
<text class="s" x="395" y="490.5" style="font-size:11.5px">maneuvers</text>
<circle cx="386" cy="505.5" r="2.2" class="ah"/>
<text class="s" x="395" y="509.5" style="font-size:11.5px">Students call out "clear left, right, above, and</text>
<text class="s" x="395" y="524.5" style="font-size:11.5px">below"</text>
</svg>
