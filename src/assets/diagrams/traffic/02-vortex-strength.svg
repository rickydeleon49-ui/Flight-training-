<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 683" role="img" aria-labelledby="ti de"><title id="ti">Which aircraft make the strongest wake</title><desc id="de">Two rear-view sketches. Greatest vortex strength: heavy, slow and clean, with large vortices. Weaker wake: lighter, faster, or dirty (flaps or other devices extended), which hastens wake decay. Strength is directly proportional to weight and inversely proportional to wingspan and speed, with maximum strength during takeoff, climb and landing. En route events have occurred in excess of 30NM and 2000 feet lower than the generating aircraft. Avoid a hovering helicopter by at least three rotor disc diameters.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style>
<text class="t" x="20" y="28" style="font-size:15px">Which aircraft make the strongest wake</text>
<text class="s" x="20" y="50.0" style="font-size:13px">The basic factors are weight and speed. Strength increases proportionately with operating weight, or</text>
<text class="s" x="20" y="66.5" style="font-size:13px">with a decrease in speed.</text>
<rect class="cl" x="20" y="91.0" width="335" height="170" rx="8"/>
<text class="t" x="32" y="113.0" style="font-size:13px">Greatest strength</text>
<path d="M101.0 179.0L273.0 179.0" class="dk" style="stroke-width:5"/>
<ellipse cx="187" cy="179.0" rx="9" ry="12" class="sky" style="stroke:currentColor;stroke-width:1.6;stroke-linejoin:round"/>
<path d="M187 169.0L187 155.0" class="dk" style="stroke-width:4"/>
<path d="M177 156.0L197 156.0" class="dk" style="stroke-width:4"/>
<circle cx="101.0" cy="183.0" r="30" class="lav" style="stroke:currentColor;stroke-width:1.5;stroke-linejoin:round"/>
<path d="M111.3 154.8A30 30 0 1 1 71.5 177.8" class="acc" style="stroke-width:3"/><path d="M71.5 177.8L73.9 187.4L65.9 186.0Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/>
<circle cx="273.0" cy="183.0" r="30" class="lav" style="stroke:currentColor;stroke-width:1.5;stroke-linejoin:round"/>
<path d="M262.7 154.8A30 30 0 1 0 302.5 177.8" class="acc" style="stroke-width:3"/><path d="M302.5 177.8L308.1 186.0L300.1 187.4Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/>
<text class="s m" x="187.5" y="231.0" style="font-size:11.5px">Heavy, slow, and clean</text>
<rect class="cl" x="375" y="91.0" width="335" height="170" rx="8"/>
<text class="t" x="387" y="113.0" style="font-size:13px">Weaker wake</text>
<path d="M456.0 179.0L628.0 179.0" class="dk" style="stroke-width:5"/>
<ellipse cx="542" cy="179.0" rx="9" ry="12" class="mint" style="stroke:currentColor;stroke-width:1.6;stroke-linejoin:round"/>
<path d="M542 169.0L542 155.0" class="dk" style="stroke-width:4"/>
<path d="M532 156.0L552 156.0" class="dk" style="stroke-width:4"/>
<circle cx="456.0" cy="183.0" r="16" class="cl" style="stroke:currentColor;stroke-width:1.5;stroke-linejoin:round"/>
<path d="M461.5 168.0A16 16 0 1 1 440.2 180.2" class="dk" style="stroke-width:3"/><path d="M440.2 180.2L442.7 189.8L434.7 188.4Z" class="dh" style=""/>
<circle cx="628.0" cy="183.0" r="16" class="cl" style="stroke:currentColor;stroke-width:1.5;stroke-linejoin:round"/>
<path d="M622.5 168.0A16 16 0 1 0 643.8 180.2" class="dk" style="stroke-width:3"/><path d="M643.8 180.2L649.3 188.4L641.3 189.8Z" class="dh" style=""/>
<path d="M464.0 187.0L490.0 193.0M620.0 187.0L594.0 193.0" class="dk" style="stroke-width:3"/>
<text class="s m" x="542" y="205.0" style="font-size:10.5px">flaps out</text>
<text class="s m" x="542.5" y="231.0" style="font-size:11.5px">Lighter, faster, or "dirty" (flaps or other devices</text>
<text class="s m" x="542.5" y="246.0" style="font-size:11.5px">extended)</text>
<rect x="20" y="273.0" width="335" height="24" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="30" y="290.0" style="font-size:13px">What the text says</text>
<circle cx="31" cy="311.0" r="2.2" class="ah"/>
<text class="s" x="40" y="315.0" style="font-size:11.5px">The greatest vortex strength occurs when the</text>
<text class="s" x="40" y="330.0" style="font-size:11.5px">generating aircraft is heavy, slow, and clean</text>
<circle cx="31" cy="345.0" r="2.2" class="ah"/>
<text class="s" x="40" y="349.0" style="font-size:11.5px">The turbulence from a "dirty" aircraft</text>
<text class="s" x="40" y="364.0" style="font-size:11.5px">configuration hastens wake decay</text>
<circle cx="31" cy="379.0" r="2.2" class="ah"/>
<text class="s" x="40" y="383.0" style="font-size:11.5px">Strength is directly proportional to weight and</text>
<text class="s" x="40" y="398.0" style="font-size:11.5px">inversely proportional to wingspan and speed</text>
<circle cx="31" cy="413.0" r="2.2" class="ah"/>
<text class="s" x="40" y="417.0" style="font-size:11.5px">Maximum strength occurs during the takeoff, climb,</text>
<text class="s" x="40" y="432.0" style="font-size:11.5px">and landing phases, when the AOA is at the highest</text>
<circle cx="31" cy="447.0" r="2.2" class="ah"/>
<text class="s" x="40" y="451.0" style="font-size:11.5px">Flaps, other wing configuration devices, and speed</text>
<text class="s" x="40" y="466.0" style="font-size:11.5px">all change an aircraft's vortex characteristics</text>
<rect x="375" y="273.0" width="335" height="24" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="385" y="290.0" style="font-size:13px">Why it matters to you</text>
<circle cx="386" cy="311.0" r="2.2" class="ah"/>
<text class="s" x="395" y="315.0" style="font-size:11.5px">Vortices from larger aircraft can impose rolling</text>
<text class="s" x="395" y="330.0" style="font-size:11.5px">moments exceeding the roll-control authority of the</text>
<text class="s" x="395" y="345.0" style="font-size:11.5px">encountering aircraft</text>
<circle cx="386" cy="360.0" r="2.2" class="ah"/>
<text class="s" x="395" y="364.0" style="font-size:11.5px">Turbulence within the vortices can damage aircraft</text>
<text class="s" x="395" y="379.0" style="font-size:11.5px">components and equipment if encountered at close</text>
<text class="s" x="395" y="394.0" style="font-size:11.5px">range</text>
<circle cx="386" cy="409.0" r="2.2" class="ah"/>
<text class="s" x="395" y="413.0" style="font-size:11.5px">Pilots must envision the location of the vortex</text>
<text class="s" x="395" y="428.0" style="font-size:11.5px">wake and adjust the flight path accordingly</text>
<rect x="20" y="491.0" width="335" height="24" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="30" y="508.0" style="font-size:13px">En route</text>
<circle cx="31" cy="529.0" r="2.2" class="ah"/>
<text class="s" x="40" y="533.0" style="font-size:11.5px">More "Super" (A380) and "Heavy" (B-747, B-777,</text>
<text class="s" x="40" y="548.0" style="font-size:11.5px">A340, etc.) aircraft operate in the NAS</text>
<circle cx="31" cy="563.0" r="2.2" class="ah"/>
<text class="s" x="40" y="567.0" style="font-size:11.5px">Wake events have occurred in excess of 30NM and</text>
<text class="s" x="40" y="582.0" style="font-size:11.5px">2000 feet lower than the generating aircraft</text>
<circle cx="31" cy="597.0" r="2.2" class="ah"/>
<text class="s" x="40" y="601.0" style="font-size:11.5px">Reduced air density at altitude may give wake</text>
<text class="s" x="40" y="616.0" style="font-size:11.5px">strength comparable to the terminal area</text>
<circle cx="31" cy="631.0" r="2.2" class="ah"/>
<text class="s" x="40" y="635.0" style="font-size:11.5px">At cruise speed there is less time for the wake to</text>
<text class="s" x="40" y="650.0" style="font-size:11.5px">decay before a trailing aircraft meets it</text>
<rect x="375" y="491.0" width="335" height="24" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="385" y="508.0" style="font-size:13px">Not only airplanes</text>
<circle cx="386" cy="529.0" r="2.2" class="ah"/>
<text class="s" x="395" y="533.0" style="font-size:11.5px">Avoid a hovering helicopter by at least three rotor</text>
<text class="s" x="395" y="548.0" style="font-size:11.5px">disc diameters (its down wash is similar to an</text>
<text class="s" x="395" y="563.0" style="font-size:11.5px">airplane's vortices)</text>
<circle cx="386" cy="578.0" r="2.2" class="ah"/>
<text class="s" x="395" y="582.0" style="font-size:11.5px">In forward flight a helicopter makes a pair of</text>
<text class="s" x="395" y="597.0" style="font-size:11.5px">strong, high-speed trailing vortices; its slow</text>
<text class="s" x="395" y="612.0" style="font-size:11.5px">forward airspeeds can generate exceptionally strong</text>
<text class="s" x="395" y="627.0" style="font-size:11.5px">wake turbulence</text>
</svg>
