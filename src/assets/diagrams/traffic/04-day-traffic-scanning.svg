<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 618" role="img" aria-labelledby="ti de"><title id="ti">Scanning for traffic by day</title><desc id="de">Six scan stops left to right. Each eye movement should not exceed 10 degrees and each stop should be observed for at least 1 second to enable detection. Back and forth movement is preferred by most pilots, but each pilot should develop a comfortable pattern and stick to it. Limits: reduced scan frequency, blind spots, weather and sun, and the eye. Best practices: scan the entire sky, limit time on instruments, use ADS-B In in the scan, and yield even with right-of-way if another aircraft seems too close.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11.5px}.q1{font-size:12px}.q2{stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}.q3{font-size:11px}.q4{font-size:11px;fill:#fff}.q5{font-size:13px}.q6{stroke-width:2}.q7{fill:var(--palette-berry,#A84C6B)}.q8{stroke:currentColor;stroke-width:1.5}</style><text class="t" x="20" y="28" style="font-size:15px">Scanning for traffic by day</text><text class="s q5" x="20" y="50">The pilot can contribute to collision avoidance by being alert and scanning for other aircraft. This</text><text class="s q5" x="20" y="66.5">is particularly important in the vicinity of an airport.</text><rect class="cl" x="20" y="91" width="690" height="218" rx="8"/><text class="t q5" x="32" y="113">Short, regularly spaced eye movements</text><text class="s q1" x="32" y="129">Each movement brings a successive area of the sky into the central visual field.</text><rect x="44" y="161" width="104" height="62" rx="6" class="sky q2"/><text class="t m q1" x="96" y="187">10° max</text><text class="s m q3" x="96" y="207">1 second min</text><circle cx="96" cy="241" r="10" class="ah"/><text class="t m q4" x="96" y="244.67">1</text><path d="M108 241L182 241" class="acc q6"/><path d="M188 241L182 243.7L182 238.3Z" class="dh q7"/><rect x="150" y="161" width="104" height="62" rx="6" class="sky q2"/><text class="t m q1" x="202" y="187">10° max</text><text class="s m q3" x="202" y="207">1 second min</text><circle cx="202" cy="241" r="10" class="ah"/><text class="t m q4" x="202" y="244.67">2</text><path d="M214 241L288 241" class="acc q6"/><path d="M294 241L288 243.7L288 238.3Z" class="dh q7"/><rect x="256" y="161" width="104" height="62" rx="6" class="sky q2"/><text class="t m q1" x="308" y="187">10° max</text><text class="s m q3" x="308" y="207">1 second min</text><circle cx="308" cy="241" r="10" class="ah"/><text class="t m q4" x="308" y="244.67">3</text><path d="M320 241L394 241" class="acc q6"/><path d="M400 241L394 243.7L394 238.3Z" class="dh q7"/><rect x="362" y="161" width="104" height="62" rx="6" class="sky q2"/><text class="t m q1" x="414" y="187">10° max</text><text class="s m q3" x="414" y="207">1 second min</text><circle cx="414" cy="241" r="10" class="ah"/><text class="t m q4" x="414" y="244.67">4</text><path d="M426 241L500 241" class="acc q6"/><path d="M506 241L500 243.7L500 238.3Z" class="dh q7"/><rect x="468" y="161" width="104" height="62" rx="6" class="sky q2"/><text class="t m q1" x="520" y="187">10° max</text><text class="s m q3" x="520" y="207">1 second min</text><circle cx="520" cy="241" r="10" class="ah"/><text class="t m q4" x="520" y="244.67">5</text><path d="M532 241L606 241" class="acc q6"/><path d="M612 241L606 243.7L606 238.3Z" class="dh q7"/><rect x="574" y="161" width="104" height="62" rx="6" class="sky q2"/><text class="t m q1" x="626" y="187">10° max</text><text class="s m q3" x="626" y="207">1 second min</text><circle cx="626" cy="241" r="10" class="ah"/><text class="t m q4" x="626" y="244.67">6</text><text class="s q0" x="32" y="271">Each movement should not exceed 10°, and each should be observed for at least 1 second to enable detection.</text><text class="s q0" x="32" y="286">Back and forth eye movements seem preferred by most pilots; each pilot should develop a comfortable pattern and</text><text class="s q0" x="32" y="301">stick to it.</text><rect x="20" y="323" width="335" height="24" rx="10" class="rose q8"/><text class="t q5" x="30" y="340">Limits of the visual scan</text><circle cx="31" cy="361" r="2.2" class="ah"/><text class="s q0" x="40" y="365">Reduced scan frequency from concentrating on flight</text><text class="s q0" x="40" y="380">instruments or tablets, and distraction with</text><text class="s q0" x="40" y="395">passengers</text><circle cx="31" cy="410" r="2.2" class="ah"/><text class="s q0" x="40" y="414">Blind spots: high-wing and low-wing aircraft,</text><text class="s q0" x="40" y="429">windshield posts and sun visors, and the aircraft's</text><text class="s q0" x="40" y="444">attitude</text><circle cx="31" cy="459" r="2.2" class="ah"/><text class="s q0" x="40" y="463">Weather: reduced visibility and the position of the</text><text class="s q0" x="40" y="478">sun</text><circle cx="31" cy="493" r="2.2" class="ah"/><text class="s q0" x="40" y="497">The eye: time to refocus between near and far</text><text class="s q0" x="40" y="512">(instruments to horizon), empty field myopia,</text><text class="s q0" x="40" y="527">narrow field of vision, and atmospheric lighting</text><rect x="375" y="323" width="335" height="24" rx="10" class="mint q8"/><text class="t q5" x="385" y="340">Best practices to see and avoid</text><circle cx="386" cy="361" r="2.2" class="ah"/><text class="s q0" x="395" y="365">Develop a strategic approach: scan the entire sky</text><text class="s q0" x="395" y="380">and try not to focus straight ahead</text><circle cx="386" cy="395" r="2.2" class="ah"/><text class="s q0" x="395" y="399">Limit the time you focus on flight instruments or</text><text class="s q0" x="395" y="414">tablets</text><circle cx="386" cy="429" r="2.2" class="ah"/><text class="s q0" x="395" y="433">ADS-B In helps: use its traffic display in your</text><text class="s q0" x="395" y="448">normal scan; many units add visual or audio alerts</text><circle cx="386" cy="463" r="2.2" class="ah"/><text class="s q0" x="395" y="467">Not all aircraft are equipped with ADS-B Out or</text><text class="s q0" x="395" y="482">transponders, so they will not appear on your</text><text class="s q0" x="395" y="497">display</text><circle cx="386" cy="512" r="2.2" class="ah"/><text class="s q0" x="395" y="516">Even if entitled to the right-of-way, yield if</text><text class="s q0" x="395" y="531">another aircraft seems too close</text><rect class="cl" x="20" y="554" width="690" height="50" rx="8"/><text class="s q1" x="32" y="576">Title 14 CFR part 91 sets right-of-way rules, minimum safe altitudes, and VFR cruising altitudes to</text><text class="s q1" x="32" y="591.5">enhance flight safety.</text></svg>
