<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 618" role="img" aria-labelledby="ti de"><title id="ti">Scanning for traffic by day</title><desc id="de">Six scan stops left to right. Each eye movement should not exceed 10 degrees and each stop should be observed for at least 1 second to enable detection. Back and forth movement is preferred by most pilots, but each pilot should develop a comfortable pattern and stick to it. Limits: reduced scan frequency, blind spots, weather and sun, and the eye. Best practices: scan the entire sky, limit time on instruments, use ADS-B In in the scan, and yield even with right-of-way if another aircraft seems too close.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><text class="t" x="20" y="28" style="font-size:15px">Scanning for traffic by day</text><text class="s" x="20" y="50.0" style="font-size:13px">The pilot can contribute to collision avoidance by being alert and scanning for other aircraft. This</text><text class="s" x="20" y="66.5" style="font-size:13px">is particularly important in the vicinity of an airport.</text><rect class="cl" x="20" y="91.0" width="690" height="218" rx="8"/><text class="t" x="32" y="113.0" style="font-size:13px">Short, regularly spaced eye movements</text><text class="s" x="32" y="129.0" style="font-size:12px">Each movement brings a successive area of the sky into the central visual field.</text><rect x="44" y="161.0" width="104" height="62" rx="6" class="sky" style="stroke:currentColor;stroke-width:1.6;stroke-linejoin:round"/><text class="t m" x="96.0" y="187.0" style="font-size:12px">10° max</text><text class="s m" x="96.0" y="207.0" style="font-size:11px">1 second min</text><circle cx="96.0" cy="241.0" r="10" class="ah"/><text class="t m" x="96.0" y="244.66666666666666" style="font-size:11px;fill:#fff">1</text><path d="M108.0 241.0L182.0 241.0" class="acc" style="stroke-width:2"/><path d="M188.0 241.0L182.0 243.7L182.0 238.3Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><rect x="150" y="161.0" width="104" height="62" rx="6" class="sky" style="stroke:currentColor;stroke-width:1.6;stroke-linejoin:round"/><text class="t m" x="202.0" y="187.0" style="font-size:12px">10° max</text><text class="s m" x="202.0" y="207.0" style="font-size:11px">1 second min</text><circle cx="202.0" cy="241.0" r="10" class="ah"/><text class="t m" x="202.0" y="244.66666666666666" style="font-size:11px;fill:#fff">2</text><path d="M214.0 241.0L288.0 241.0" class="acc" style="stroke-width:2"/><path d="M294.0 241.0L288.0 243.7L288.0 238.3Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><rect x="256" y="161.0" width="104" height="62" rx="6" class="sky" style="stroke:currentColor;stroke-width:1.6;stroke-linejoin:round"/><text class="t m" x="308.0" y="187.0" style="font-size:12px">10° max</text><text class="s m" x="308.0" y="207.0" style="font-size:11px">1 second min</text><circle cx="308.0" cy="241.0" r="10" class="ah"/><text class="t m" x="308.0" y="244.66666666666666" style="font-size:11px;fill:#fff">3</text><path d="M320.0 241.0L394.0 241.0" class="acc" style="stroke-width:2"/><path d="M400.0 241.0L394.0 243.7L394.0 238.3Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><rect x="362" y="161.0" width="104" height="62" rx="6" class="sky" style="stroke:currentColor;stroke-width:1.6;stroke-linejoin:round"/><text class="t m" x="414.0" y="187.0" style="font-size:12px">10° max</text><text class="s m" x="414.0" y="207.0" style="font-size:11px">1 second min</text><circle cx="414.0" cy="241.0" r="10" class="ah"/><text class="t m" x="414.0" y="244.66666666666666" style="font-size:11px;fill:#fff">4</text><path d="M426.0 241.0L500.0 241.0" class="acc" style="stroke-width:2"/><path d="M506.0 241.0L500.0 243.7L500.0 238.3Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><rect x="468" y="161.0" width="104" height="62" rx="6" class="sky" style="stroke:currentColor;stroke-width:1.6;stroke-linejoin:round"/><text class="t m" x="520.0" y="187.0" style="font-size:12px">10° max</text><text class="s m" x="520.0" y="207.0" style="font-size:11px">1 second min</text><circle cx="520.0" cy="241.0" r="10" class="ah"/><text class="t m" x="520.0" y="244.66666666666666" style="font-size:11px;fill:#fff">5</text><path d="M532.0 241.0L606.0 241.0" class="acc" style="stroke-width:2"/><path d="M612.0 241.0L606.0 243.7L606.0 238.3Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><rect x="574" y="161.0" width="104" height="62" rx="6" class="sky" style="stroke:currentColor;stroke-width:1.6;stroke-linejoin:round"/><text class="t m" x="626.0" y="187.0" style="font-size:12px">10° max</text><text class="s m" x="626.0" y="207.0" style="font-size:11px">1 second min</text><circle cx="626.0" cy="241.0" r="10" class="ah"/><text class="t m" x="626.0" y="244.66666666666666" style="font-size:11px;fill:#fff">6</text><text class="s" x="32" y="271.0" style="font-size:11.5px">Each movement should not exceed 10°, and each should be observed for at least 1 second to enable detection.</text><text class="s" x="32" y="286.0" style="font-size:11.5px">Back and forth eye movements seem preferred by most pilots; each pilot should develop a comfortable pattern and</text><text class="s" x="32" y="301.0" style="font-size:11.5px">stick to it.</text><rect x="20" y="323.0" width="335" height="24" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30" y="340.0" style="font-size:13px">Limits of the visual scan</text><circle cx="31" cy="361.0" r="2.2" class="ah"/><text class="s" x="40" y="365.0" style="font-size:11.5px">Reduced scan frequency from concentrating on flight</text><text class="s" x="40" y="380.0" style="font-size:11.5px">instruments or tablets, and distraction with</text><text class="s" x="40" y="395.0" style="font-size:11.5px">passengers</text><circle cx="31" cy="410.0" r="2.2" class="ah"/><text class="s" x="40" y="414.0" style="font-size:11.5px">Blind spots: high-wing and low-wing aircraft,</text><text class="s" x="40" y="429.0" style="font-size:11.5px">windshield posts and sun visors, and the aircraft's</text><text class="s" x="40" y="444.0" style="font-size:11.5px">attitude</text><circle cx="31" cy="459.0" r="2.2" class="ah"/><text class="s" x="40" y="463.0" style="font-size:11.5px">Weather: reduced visibility and the position of the</text><text class="s" x="40" y="478.0" style="font-size:11.5px">sun</text><circle cx="31" cy="493.0" r="2.2" class="ah"/><text class="s" x="40" y="497.0" style="font-size:11.5px">The eye: time to refocus between near and far</text><text class="s" x="40" y="512.0" style="font-size:11.5px">(instruments to horizon), empty field myopia,</text><text class="s" x="40" y="527.0" style="font-size:11.5px">narrow field of vision, and atmospheric lighting</text><rect x="375" y="323.0" width="335" height="24" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="385" y="340.0" style="font-size:13px">Best practices to see and avoid</text><circle cx="386" cy="361.0" r="2.2" class="ah"/><text class="s" x="395" y="365.0" style="font-size:11.5px">Develop a strategic approach: scan the entire sky</text><text class="s" x="395" y="380.0" style="font-size:11.5px">and try not to focus straight ahead</text><circle cx="386" cy="395.0" r="2.2" class="ah"/><text class="s" x="395" y="399.0" style="font-size:11.5px">Limit the time you focus on flight instruments or</text><text class="s" x="395" y="414.0" style="font-size:11.5px">tablets</text><circle cx="386" cy="429.0" r="2.2" class="ah"/><text class="s" x="395" y="433.0" style="font-size:11.5px">ADS-B In helps: use its traffic display in your</text><text class="s" x="395" y="448.0" style="font-size:11.5px">normal scan; many units add visual or audio alerts</text><circle cx="386" cy="463.0" r="2.2" class="ah"/><text class="s" x="395" y="467.0" style="font-size:11.5px">Not all aircraft are equipped with ADS-B Out or</text><text class="s" x="395" y="482.0" style="font-size:11.5px">transponders, so they will not appear on your</text><text class="s" x="395" y="497.0" style="font-size:11.5px">display</text><circle cx="386" cy="512.0" r="2.2" class="ah"/><text class="s" x="395" y="516.0" style="font-size:11.5px">Even if entitled to the right-of-way, yield if</text><text class="s" x="395" y="531.0" style="font-size:11.5px">another aircraft seems too close</text><rect class="cl" x="20" y="554.0" width="690" height="50" rx="8"/><text class="s" x="32" y="576.0" style="font-size:12px">Title 14 CFR part 91 sets right-of-way rules, minimum safe altitudes, and VFR cruising altitudes to</text><text class="s" x="32" y="591.5" style="font-size:12px">enhance flight safety.</text></svg>
