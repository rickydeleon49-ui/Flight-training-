<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 607.0" role="img" aria-labelledby="ti de"><title id="ti">Wingtip vortices: how they form and where they go</title><desc id="de">Rear view of an airplane with a vortex at each wingtip, air circulating outward, upward and around the tip. Lowest pressure is over the upper wing surface and highest under the wing; the rollup leaves two counter rotating cylindrical vortices with most of the energy within a few feet of each core. Second panel: vortices stay a bit less than a wingspan apart, drift with the wind, and sink several hundred feet per minute. Within 100 to 200 feet of the ground they move sideways at 2-3 knots. A 10 knot wind drifts them about 1,000 feet in a minute.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><text class="t" x="20" y="28" style="font-size:15px">Wingtip vortices: how they form and where they go</text><text class="s" x="20" y="50.0" style="font-size:13px">All aircraft generate wake turbulence during flight. It is caused by a pair of counter-rotating</text><text class="s" x="20" y="66.5" style="font-size:13px">vortices trailing from the wingtips.</text><rect class="cl" x="20" y="91.0" width="690" height="196" rx="8"/><text class="t" x="32" y="113.0" style="font-size:13px">How they form</text><path d="M80.0 181.0L300.0 181.0" class="dk" style="stroke-width:5"/><ellipse cx="190" cy="181.0" rx="9" ry="12" class="sky" style="stroke:currentColor;stroke-width:1.6;stroke-linejoin:round"/><path d="M190 171.0L190 157.0" class="dk" style="stroke-width:4"/><path d="M180 158.0L200 158.0" class="dk" style="stroke-width:4"/><path d="M88.9 156.6A26 26 0 1 1 54.4 176.5" class="acc" style="stroke-width:3"/><path d="M54.4 176.5L56.8 186.1L48.8 184.6Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><path d="M291.1 156.6A26 26 0 1 0 325.6 176.5" class="acc" style="stroke-width:3"/><path d="M325.6 176.5L331.2 184.6L323.2 186.1Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><text class="t m" x="80.0" y="229.0" style="font-size:11.5px">Vortex</text><text class="t m" x="300.0" y="229.0" style="font-size:11.5px">Vortex</text><text class="s m" x="190" y="257.0" style="font-size:11px">Rear view: air circulates outward,</text><text class="s m" x="190" y="270.0" style="font-size:11px">upward, and around each wingtip</text><text class="s m" x="190" y="143.0" style="font-size:11px">Lowest pressure above the wing</text><text class="s m" x="190" y="215.0" style="font-size:11px">Highest pressure below</text><circle cx="348" cy="133.0" r="2.2" class="ah"/><text class="s" x="357" y="137.0" style="font-size:11.5px">Lift comes from a pressure differential: lowest pressure</text><text class="s" x="357" y="152.0" style="font-size:11.5px">over the upper wing surface, highest under the wing</text><circle cx="348" cy="166.0" r="2.2" class="ah"/><text class="s" x="357" y="170.0" style="font-size:11.5px">This triggers a rollup of the airflow aft of the wing:</text><text class="s" x="357" y="185.0" style="font-size:11.5px">swirling air masses trailing downstream of the wingtips</text><circle cx="348" cy="199.0" r="2.2" class="ah"/><text class="s" x="357" y="203.0" style="font-size:11.5px">After rollup the wake is two counter rotating</text><text class="s" x="357" y="218.0" style="font-size:11.5px">cylindrical vortices</text><circle cx="348" cy="232.0" r="2.2" class="ah"/><text class="s" x="357" y="236.0" style="font-size:11.5px">Most of the energy lies within a few feet of the center</text><text class="s" x="357" y="251.0" style="font-size:11.5px">of each vortex</text><circle cx="348" cy="265.0" r="2.2" class="ah"/><text class="s" x="357" y="269.0" style="font-size:11.5px">Generated from the moment the aircraft leaves the ground</text><text class="s" x="357" y="284.0" style="font-size:11.5px">until it touches down</text><rect class="cl" x="20" y="301.0" width="690" height="292" rx="8"/><text class="t" x="32" y="323.0" style="font-size:13px">Where they go</text><path d="M95.0 385.0L335.0 385.0" class="dk" style="stroke-width:5"/><ellipse cx="215" cy="385.0" rx="9" ry="12" class="sky" style="stroke:currentColor;stroke-width:1.6;stroke-linejoin:round"/><path d="M215 375.0L215 361.0" class="dk" style="stroke-width:4"/><path d="M205 362.0L225 362.0" class="dk" style="stroke-width:4"/><text class="s m" x="275" y="371.0" style="font-size:11px">Wingspan</text><circle cx="115" cy="415.0" r="15" class="cl" style="stroke:currentColor;stroke-width:1.4;stroke-linejoin:round"/><path d="M120.1 400.9A15 15 0 1 1 100.2 412.4" class="dk" style="stroke-width:3"/><path d="M100.2 412.4L102.7 422.0L94.7 420.6Z" class="dh" style=""/><path d="M115 433.0L115 473.0" class="dk" style="stroke-width:1.5;opacity:0.6;stroke-dasharray:6 5"/><circle cx="115" cy="495.0" r="20" class="lav" style="stroke:currentColor;stroke-width:1.6;stroke-linejoin:round"/><path d="M121.8 476.2A20 20 0 1 1 95.3 491.5" class="acc" style="stroke-width:3"/><path d="M95.3 491.5L97.7 501.1L89.8 499.7Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><circle cx="315" cy="415.0" r="15" class="cl" style="stroke:currentColor;stroke-width:1.4;stroke-linejoin:round"/><path d="M309.9 400.9A15 15 0 1 0 329.8 412.4" class="dk" style="stroke-width:3"/><path d="M329.8 412.4L335.3 420.6L327.3 422.0Z" class="dh" style=""/><path d="M315 433.0L315 473.0" class="dk" style="stroke-width:1.5;opacity:0.6;stroke-dasharray:6 5"/><circle cx="315" cy="495.0" r="20" class="lav" style="stroke:currentColor;stroke-width:1.6;stroke-linejoin:round"/><path d="M308.2 476.2A20 20 0 1 0 334.7 491.5" class="acc" style="stroke-width:3"/><path d="M334.7 491.5L340.2 499.7L332.3 501.1Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><path d="M115 437.0L115.0 463.0" class="acc" style="stroke-width:3"/><path d="M115 471.0L111.4 463.0L118.6 463.0Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><path d="M315 437.0L315.0 463.0" class="acc" style="stroke-width:3"/><path d="M315 471.0L311.4 463.0L318.6 463.0Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><path d="M115 553.0L315 553.0" class="dk" style="stroke-width:1.5;opacity:.75"/><path d="M115 547.0L115 559.0M315 547.0L315 559.0" class="dk" style="stroke-width:1.5;opacity:.75"/><text class="s m" x="215" y="575.0" style="font-size:11px">A bit less than a wingspan apart</text><path d="M30 581.0L370 581.0" class="dk" style="stroke-width:3"/><text class="s e" x="368" y="575.0" style="font-size:11px">Ground</text><path d="M91 495.0L53.0 495.0" class="dk" style="stroke-width:3"/><path d="M45 495.0L53.0 491.4L53.0 498.6Z" class="dh" style=""/><path d="M339 495.0L377.0 495.0" class="dk" style="stroke-width:3"/><path d="M385 495.0L377.0 498.6L377.0 491.4Z" class="dh" style=""/><text class="s m" x="67" y="517.0" style="font-size:11px">2-3 knots</text><text class="s m" x="363" y="517.0" style="font-size:11px">2-3 knots</text><text class="s m" x="67" y="530.0" style="font-size:11px">sideways</text><text class="s m" x="363" y="530.0" style="font-size:11px">sideways</text><path d="M30 379.0L84.0 379.0" class="dk" style="stroke-width:3"/><path d="M92 379.0L84.0 382.6L84.0 375.4Z" class="dh" style=""/><text class="t" x="30" y="373.0" style="font-size:11.5px">Wind</text><circle cx="398" cy="343.0" r="2.2" class="ah"/><text class="s" x="407" y="347.0" style="font-size:11.5px">In flight (higher than a wingspan above the</text><text class="s" x="407" y="362.0" style="font-size:11.5px">ground), vortices drift with the wind</text><circle cx="398" cy="376.0" r="2.2" class="ah"/><text class="s" x="407" y="380.0" style="font-size:11.5px">They sink at a rate of several hundred feet per</text><text class="s" x="407" y="395.0" style="font-size:11.5px">minute, slowing their descent and diminishing in</text><text class="s" x="407" y="410.0" style="font-size:11.5px">strength with time and distance behind the</text><text class="s" x="407" y="425.0" style="font-size:11.5px">aircraft</text><circle cx="398" cy="439.0" r="2.2" class="ah"/><text class="s" x="407" y="443.0" style="font-size:11.5px">Wind speed matters: 10 knots makes vortices</text><text class="s" x="407" y="458.0" style="font-size:11.5px">drift about 1,000 feet in a minute</text><circle cx="398" cy="472.0" r="2.2" class="ah"/><text class="s" x="407" y="476.0" style="font-size:11.5px">Within 100 to 200 feet of the ground, vortices</text><text class="s" x="407" y="491.0" style="font-size:11.5px">of larger aircraft tend to move laterally over</text><text class="s" x="407" y="506.0" style="font-size:11.5px">the ground at 2-3 knots</text></svg>
