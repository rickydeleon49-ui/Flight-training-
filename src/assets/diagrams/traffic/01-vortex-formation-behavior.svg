<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 607" role="img" aria-labelledby="ti de"><title id="ti">Wingtip vortices: how they form and where they go</title><desc id="de">Rear view of an airplane with a vortex at each wingtip, air circulating outward, upward and around the tip. Lowest pressure is over the upper wing surface and highest under the wing; the rollup leaves two counter rotating cylindrical vortices with most of the energy within a few feet of each core. Second panel: vortices stay a bit less than a wingspan apart, drift with the wind, and sink several hundred feet per minute. Within 100 to 200 feet of the ground they move sideways at 2-3 knots. A 10 knot wind drifts them about 1,000 feet in a minute.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11.5px}.q1{stroke-width:3}.q2{font-size:11px}.q3{fill:var(--palette-berry,#A84C6B)}.q4{font-size:13px}.q5{stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}.q6{stroke-width:4}.q7{stroke:currentColor;stroke-width:1.4;stroke-linejoin:round}.q8{stroke-width:1.5;opacity:0.6;stroke-dasharray:6 5}.q9{stroke-width:1.5;opacity:.75}</style><text class="t" x="20" y="28" style="font-size:15px">Wingtip vortices: how they form and where they go</text><text class="s q4" x="20" y="50">All aircraft generate wake turbulence during flight. It is caused by a pair of counter-rotating</text><text class="s q4" x="20" y="66.5">vortices trailing from the wingtips.</text><rect class="cl" x="20" y="91" width="690" height="196" rx="8"/><text class="t q4" x="32" y="113">How they form</text><path d="M80 181L300 181" class="dk" style="stroke-width:5"/><ellipse cx="190" cy="181" rx="9" ry="12" class="sky q5"/><path d="M190 171L190 157" class="dk q6"/><path d="M180 158L200 158" class="dk q6"/><path d="M88.9 156.6A26 26 0 1 1 54.4 176.5" class="acc q1"/><path d="M54.4 176.5L56.8 186.1L48.8 184.6Z" class="dh q3"/><path d="M291.1 156.6A26 26 0 1 0 325.6 176.5" class="acc q1"/><path d="M325.6 176.5L331.2 184.6L323.2 186.1Z" class="dh q3"/><text class="t m q0" x="80" y="229">Vortex</text><text class="t m q0" x="300" y="229">Vortex</text><text class="s m q2" x="190" y="257">Rear view: air circulates outward,</text><text class="s m q2" x="190" y="270">upward, and around each wingtip</text><text class="s m q2" x="190" y="143">Lowest pressure above the wing</text><text class="s m q2" x="190" y="215">Highest pressure below</text><circle cx="348" cy="133" r="2.2" class="ah"/><text class="s q0" x="357" y="137">Lift comes from a pressure differential: lowest pressure</text><text class="s q0" x="357" y="152">over the upper wing surface, highest under the wing</text><circle cx="348" cy="166" r="2.2" class="ah"/><text class="s q0" x="357" y="170">This triggers a rollup of the airflow aft of the wing:</text><text class="s q0" x="357" y="185">swirling air masses trailing downstream of the wingtips</text><circle cx="348" cy="199" r="2.2" class="ah"/><text class="s q0" x="357" y="203">After rollup the wake is two counter rotating</text><text class="s q0" x="357" y="218">cylindrical vortices</text><circle cx="348" cy="232" r="2.2" class="ah"/><text class="s q0" x="357" y="236">Most of the energy lies within a few feet of the center</text><text class="s q0" x="357" y="251">of each vortex</text><circle cx="348" cy="265" r="2.2" class="ah"/><text class="s q0" x="357" y="269">Generated from the moment the aircraft leaves the ground</text><text class="s q0" x="357" y="284">until it touches down</text><rect class="cl" x="20" y="301" width="690" height="292" rx="8"/><text class="t q4" x="32" y="323">Where they go</text><path d="M95 385L335 385" class="dk" style="stroke-width:5"/><ellipse cx="215" cy="385" rx="9" ry="12" class="sky q5"/><path d="M215 375L215 361" class="dk q6"/><path d="M205 362L225 362" class="dk q6"/><text class="s m q2" x="275" y="371">Wingspan</text><circle cx="115" cy="415" r="15" class="cl q7"/><path d="M120.1 400.9A15 15 0 1 1 100.2 412.4" class="dk q1"/><path d="M100.2 412.4L102.7 422L94.7 420.6Z" class="dh" style=""/><path d="M115 433L115 473" class="dk q8"/><circle cx="115" cy="495" r="20" class="lav q5"/><path d="M121.8 476.2A20 20 0 1 1 95.3 491.5" class="acc q1"/><path d="M95.3 491.5L97.7 501.1L89.8 499.7Z" class="dh q3"/><circle cx="315" cy="415" r="15" class="cl q7"/><path d="M309.9 400.9A15 15 0 1 0 329.8 412.4" class="dk q1"/><path d="M329.8 412.4L335.3 420.6L327.3 422Z" class="dh" style=""/><path d="M315 433L315 473" class="dk q8"/><circle cx="315" cy="495" r="20" class="lav q5"/><path d="M308.2 476.2A20 20 0 1 0 334.7 491.5" class="acc q1"/><path d="M334.7 491.5L340.2 499.7L332.3 501.1Z" class="dh q3"/><path d="M115 437L115 463" class="acc q1"/><path d="M115 471L111.4 463L118.6 463Z" class="dh q3"/><path d="M315 437L315 463" class="acc q1"/><path d="M315 471L311.4 463L318.6 463Z" class="dh q3"/><path d="M115 553L315 553" class="dk q9"/><path d="M115 547L115 559M315 547L315 559" class="dk q9"/><text class="s m q2" x="215" y="575">A bit less than a wingspan apart</text><path d="M30 581L370 581" class="dk q1"/><text class="s e q2" x="368" y="575">Ground</text><path d="M91 495L53 495" class="dk q1"/><path d="M45 495L53 491.4L53 498.6Z" class="dh" style=""/><path d="M339 495L377 495" class="dk q1"/><path d="M385 495L377 498.6L377 491.4Z" class="dh" style=""/><text class="s m q2" x="67" y="517">2-3 knots</text><text class="s m q2" x="363" y="517">2-3 knots</text><text class="s m q2" x="67" y="530">sideways</text><text class="s m q2" x="363" y="530">sideways</text><path d="M30 379L84 379" class="dk q1"/><path d="M92 379L84 382.6L84 375.4Z" class="dh" style=""/><text class="t q0" x="30" y="373">Wind</text><circle cx="398" cy="343" r="2.2" class="ah"/><text class="s q0" x="407" y="347">In flight (higher than a wingspan above the</text><text class="s q0" x="407" y="362">ground), vortices drift with the wind</text><circle cx="398" cy="376" r="2.2" class="ah"/><text class="s q0" x="407" y="380">They sink at a rate of several hundred feet per</text><text class="s q0" x="407" y="395">minute, slowing their descent and diminishing in</text><text class="s q0" x="407" y="410">strength with time and distance behind the</text><text class="s q0" x="407" y="425">aircraft</text><circle cx="398" cy="439" r="2.2" class="ah"/><text class="s q0" x="407" y="443">Wind speed matters: 10 knots makes vortices</text><text class="s q0" x="407" y="458">drift about 1,000 feet in a minute</text><circle cx="398" cy="472" r="2.2" class="ah"/><text class="s q0" x="407" y="476">Within 100 to 200 feet of the ground, vortices</text><text class="s q0" x="407" y="491">of larger aircraft tend to move laterally over</text><text class="s q0" x="407" y="506">the ground at 2-3 knots</text></svg>
