<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 748" role="img" aria-labelledby="ti de"><title id="ti">Optical illusions on approach</title><desc id="de">Two runway shapes, narrow and wide, then a table of landing illusions: runway width, runway and terrain slopes, featureless terrain or black hole approach, water refraction, haze, fog and ground lighting. Each row says how the scene seems and what the pilot tends to do, usually flying a lower approach when the scene looks too high. A list of ways to prevent landing errors.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:12px}.q1{font-size:12.5px}.q2{font-size:13px}.q3{stroke:currentColor;stroke-width:2.5;fill-opacity:.35}.q4{stroke-width:2;stroke-dasharray:7 6;opacity:.6}</style><text class="t" x="20" y="28" style="font-size:15px">Optical illusions on approach</text><rect class="cl" x="20" y="38" width="340" height="110" rx="8"/><polygon points="88,50 112,50 150,116 50,116" class="cl q3"/><path d="M100 54V112" class="dk q4"/><text class="s m q0" x="100" y="142">Narrower than usual</text><polygon points="244,50 296,50 345,116 195,116" class="cl q3"/><path d="M270 54V112" class="dk q4"/><text class="s m q0" x="270" y="142">Wider than usual</text><rect class="cl" x="370" y="38" width="340" height="110" rx="8"/><text class="s q1" x="382" y="60">Narrow, upslope, no ground features,</text><text class="s q1" x="382" y="76">rain on the windscreen: all feel HIGH.</text><text class="t q2" x="382" y="98">Risk: a low approach.</text><text class="s q1" x="382" y="120">Wide or downslope: the opposite.</text><text class="s q1" x="382" y="136">Risk: leveling high, hard landing, overshoot.</text><text class="t q2" x="30" y="176">Illusion</text><text class="t q2" x="180" y="176">What it seems like</text><text class="t q2" x="460" y="176">What the pilot tends to do</text><rect class="cl" x="20" y="186" width="690" height="72" rx="4"/><text class="t q0" x="30" y="202">Runway width</text><text class="s q0" x="180" y="202">Narrower runway: feels higher than actual</text><text class="s q0" x="180" y="217.5">(when length-to-width relationships are</text><text class="s q0" x="180" y="233">comparable).</text><text class="s q0" x="460" y="202">Flies a lower approach: may strike</text><text class="s q0" x="460" y="217.5">objects on the approach path or land</text><text class="s q0" x="460" y="233">short. Wider runway: opposite; levels out</text><text class="s q0" x="460" y="248.5">high, lands hard or overshoots.</text><text class="t q0" x="30" y="276">Runway and terrain</text><text class="t q0" x="30" y="291.5">slopes</text><text class="s q0" x="180" y="276">Upsloping runway and/or terrain: feels</text><text class="s q0" x="180" y="291.5">higher than actual.</text><text class="s q0" x="460" y="276">Flies a lower approach. Downsloping</text><text class="s q0" x="460" y="291.5">runway or terrain: opposite effect.</text><rect class="cl" x="20" y="303" width="690" height="56.5" rx="4"/><text class="t q0" x="30" y="319">Featureless terrain</text><text class="t q0" x="30" y="334.5">(black hole approach)</text><text class="s q0" x="180" y="319">Overwater approach over darkened areas, or</text><text class="s q0" x="180" y="334.5">terrain made featureless by snow: feels</text><text class="s q0" x="180" y="350">higher than actual.</text><text class="s q0" x="460" y="319">Flies a lower approach than desired.</text><text class="t q0" x="30" y="377.5">Water refraction</text><text class="s q0" x="180" y="377.5">Rain on the windscreen: horizon appears</text><text class="s q0" x="180" y="393">lower than it is, so feels higher.</text><text class="s q0" x="460" y="377.5">Flies a lower approach.</text><rect class="cl" x="20" y="404.5" width="690" height="56.5" rx="4"/><text class="t q0" x="30" y="420.5">Haze</text><text class="s q0" x="180" y="420.5">Feels farther away and higher from the</text><text class="s q0" x="180" y="436">runway.</text><text class="s q0" x="460" y="420.5">Tends to be low. Extremely clear air</text><text class="s q0" x="460" y="436">(bright, high airport) feels closer: a</text><text class="s q0" x="460" y="451.5">high approach, overshoot or go-around.</text><text class="t q0" x="30" y="479">Fog</text><text class="s q0" x="180" y="479">Flying into fog feels like pitching up.</text><text class="s q0" x="460" y="479">Often steepens the approach abruptly.</text><rect class="cl" x="20" y="490.5" width="690" height="72" rx="4"/><text class="t q0" x="30" y="506.5">Ground lighting</text><text class="s q0" x="180" y="506.5">Road lights or moving train lights look like</text><text class="s q0" x="180" y="522">runway lights. Bright runway lighting with</text><text class="s q0" x="180" y="537.5">few lights on surrounding terrain feels</text><text class="s q0" x="180" y="553">closer.</text><text class="s q0" x="460" y="506.5">Often flies a higher approach.</text><rect class="cl" x="20" y="572.5" width="690" height="162" rx="8"/><text class="t" x="32" y="594.5" style="font-size:14px">Prevent landing errors from illusions</text><circle cx="35" cy="610.5" r="2.2" class="ah"/><text class="s q0" x="44" y="614.5">Expect illusions at unfamiliar airports, especially</text><text class="s q0" x="44" y="630">at night or in bad weather. Check airport diagrams</text><text class="s q0" x="44" y="645.5">and the Chart Supplement for slope, terrain and</text><text class="s q0" x="44" y="661">lighting.</text><circle cx="35" cy="676.5" r="2.2" class="ah"/><text class="s q0" x="44" y="680.5">Refer to the altimeter often on all approaches.</text><circle cx="35" cy="696" r="2.2" class="ah"/><text class="s q0" x="44" y="700">If possible, inspect an unfamiliar airport from the</text><text class="s q0" x="44" y="715.5">air first.</text><circle cx="381" cy="610.5" r="2.2" class="ah"/><text class="s q0" x="390" y="614.5">Use VASI, PAPI or an electronic glideslope when</text><text class="s q0" x="390" y="630">available.</text><circle cx="381" cy="645.5" r="2.2" class="ah"/><text class="s q0" x="390" y="649.5">Use the visual descent point (VDP) on nonprecision</text><text class="s q0" x="390" y="665">approach charts.</text><circle cx="381" cy="680.5" r="2.2" class="ah"/><text class="s q0" x="390" y="684.5">Approach accident chances rise when an emergency or</text><text class="s q0" x="390" y="700">other activity distracts from usual procedures.</text><circle cx="381" cy="715.5" r="2.2" class="ah"/><text class="s q0" x="390" y="719.5">Keep landing procedures proficient.</text></svg>
