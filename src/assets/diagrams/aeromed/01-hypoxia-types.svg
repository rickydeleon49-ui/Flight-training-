<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 756" role="img" aria-labelledby="ti de"><title id="ti">Four types of hypoxia</title><desc id="de">The four types of hypoxia by cause. Hypoxic: insufficient oxygen available to the body, such as less oxygen pressure at altitude. Hypemic: blood cannot carry enough oxygen, most often carbon monoxide poisoning. Stagnant: blood is not moving to the tissues, as with excessive G forces. Histotoxic: cells cannot use oxygen, caused by alcohol and drugs. Also symptoms, treatment, and time of useful consciousness.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><text class="t" x="20" y="28" style="font-size:15px">Hypoxia: four types, by cause</text><rect class="cl" x="20" y="44" width="340" height="186" rx="8"/><rect x="32" y="56" width="130" height="28" rx="14" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="97" y="75" style="font-size:15px">Hypoxic</text><text class="t" x="32" y="104.0" style="font-size:13px">Not enough oxygen available to the body as a</text><text class="t" x="32" y="120.5" style="font-size:13px">whole.</text><circle cx="35" cy="143.0" r="2.2" class="ah"/><text class="s" x="44" y="147.0" style="font-size:12.5px">Example for pilots: partial pressure of oxygen</text><text class="s" x="44" y="163.0" style="font-size:12.5px">falls as altitude rises. The percentage of</text><text class="s" x="44" y="179.0" style="font-size:12.5px">oxygen stays the same, but fewer molecules pass</text><text class="s" x="44" y="195.0" style="font-size:12.5px">the membranes in the lungs.</text><circle cx="35" cy="211.0" r="2.2" class="ah"/><text class="s" x="44" y="215.0" style="font-size:12.5px">Also a blocked airway or drowning.</text><rect class="cl" x="370" y="44" width="340" height="186" rx="8"/><rect x="382" y="56" width="130" height="28" rx="14" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="447" y="75" style="font-size:15px">Hypemic</text><text class="t" x="382" y="104.0" style="font-size:13px">The blood cannot take up and carry enough oxygen</text><text class="t" x="382" y="120.5" style="font-size:13px">("not enough blood").</text><circle cx="385" cy="143.0" r="2.2" class="ah"/><text class="s" x="394" y="147.0" style="font-size:12.5px">Reduced blood volume (severe bleeding), anemia,</text><text class="s" x="394" y="163.0" style="font-size:12.5px">or blood donation (volume can take several weeks</text><text class="s" x="394" y="179.0" style="font-size:12.5px">to recover).</text><circle cx="385" cy="195.0" r="2.2" class="ah"/><text class="s" x="394" y="199.0" style="font-size:12.5px">Most common cause: carbon monoxide poisoning,</text><text class="s" x="394" y="215.0" style="font-size:12.5px">where hemoglobin cannot bind oxygen.</text><rect class="cl" x="20" y="240" width="340" height="186" rx="8"/><rect x="32" y="252" width="130" height="28" rx="14" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="97" y="271" style="font-size:15px">Stagnant</text><text class="t" x="32" y="300.0" style="font-size:13px">Oxygen-rich blood in the lungs is not moving to</text><text class="t" x="32" y="316.5" style="font-size:13px">the tissues that need it ("not flowing").</text><circle cx="35" cy="339.0" r="2.2" class="ah"/><text class="s" x="44" y="343.0" style="font-size:12.5px">An arm or leg "going to sleep", shock, heart</text><text class="s" x="44" y="359.0" style="font-size:12.5px">failing to pump, a constricted artery.</text><circle cx="35" cy="375.0" r="2.2" class="ah"/><text class="s" x="44" y="379.0" style="font-size:12.5px">In flight: excessive G forces. Cold can reduce</text><text class="s" x="44" y="395.0" style="font-size:12.5px">circulation to the extremities.</text><rect class="cl" x="370" y="240" width="340" height="186" rx="8"/><rect x="382" y="252" width="130" height="28" rx="14" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="447" y="271" style="font-size:15px">Histotoxic</text><text class="t" x="382" y="300.0" style="font-size:13px">Oxygen reaches the cells, but they cannot use it</text><text class="t" x="382" y="316.5" style="font-size:13px">("histo" = tissue, "toxic" = poison).</text><circle cx="385" cy="339.0" r="2.2" class="ah"/><text class="s" x="394" y="343.0" style="font-size:12.5px">Caused by alcohol and other drugs, such as</text><text class="s" x="394" y="359.0" style="font-size:12.5px">narcotics and poisons.</text><circle cx="385" cy="375.0" r="2.2" class="ah"/><text class="s" x="394" y="379.0" style="font-size:12.5px">One ounce of alcohol can equal an extra 2,000 ft</text><text class="s" x="394" y="395.0" style="font-size:12.5px">of physiological altitude.</text><rect class="cl" x="20" y="440" width="340" height="300" rx="8"/><text class="t" x="32" y="462" style="font-size:14px">Symptoms</text><circle cx="35" cy="478" r="2.2" class="ah"/><text class="s" x="44" y="482.0" style="font-size:12.5px">Cyanosis (blue fingernails and lips)</text><circle cx="35" cy="497.0" r="2.2" class="ah"/><text class="s" x="44" y="501.0" style="font-size:12.5px">Headache</text><circle cx="35" cy="516.0" r="2.2" class="ah"/><text class="s" x="44" y="520.0" style="font-size:12.5px">Decreased response to stimuli, increased</text><text class="s" x="44" y="536.0" style="font-size:12.5px">reaction time</text><circle cx="35" cy="551.0" r="2.2" class="ah"/><text class="s" x="44" y="555.0" style="font-size:12.5px">Impaired judgment</text><circle cx="35" cy="570.0" r="2.2" class="ah"/><text class="s" x="44" y="574.0" style="font-size:12.5px">Euphoria and a carefree feeling (can be the</text><text class="s" x="44" y="590.0" style="font-size:12.5px">first sign)</text><circle cx="35" cy="605.0" r="2.2" class="ah"/><text class="s" x="44" y="609.0" style="font-size:12.5px">Visual impairment; field of vision narrows as it</text><text class="s" x="44" y="625.0" style="font-size:12.5px">worsens</text><circle cx="35" cy="640.0" r="2.2" class="ah"/><text class="s" x="44" y="644.0" style="font-size:12.5px">Drowsiness</text><circle cx="35" cy="659.0" r="2.2" class="ah"/><text class="s" x="44" y="663.0" style="font-size:12.5px">Lightheaded or dizzy sensation</text><circle cx="35" cy="678.0" r="2.2" class="ah"/><text class="s" x="44" y="682.0" style="font-size:12.5px">Tingling in fingers and toes; numbness</text><text class="t" x="32" y="709.0" style="font-size:12.5px">The pilot can feel a false sense of security and</text><text class="t" x="32" y="725.0" style="font-size:12.5px">believe everything is normal.</text><rect class="cl" x="370" y="440" width="340" height="300" rx="8"/><text class="t" x="382" y="462" style="font-size:14px">Treatment and time</text><circle cx="385" cy="478" r="2.2" class="ah"/><text class="s" x="394" y="482.0" style="font-size:12.5px">Fly at a lower altitude and/or use supplemental</text><text class="s" x="394" y="498.0" style="font-size:12.5px">oxygen.</text><circle cx="385" cy="514.0" r="2.2" class="ah"/><text class="s" x="394" y="518.0" style="font-size:12.5px">All pilots are susceptible, regardless of</text><text class="s" x="394" y="534.0" style="font-size:12.5px">endurance or acclimatization.</text><circle cx="385" cy="550.0" r="2.2" class="ah"/><text class="s" x="394" y="554.0" style="font-size:12.5px">Time of useful consciousness: the maximum time</text><text class="s" x="394" y="570.0" style="font-size:12.5px">to make and carry out rational, life-saving</text><text class="s" x="394" y="586.0" style="font-size:12.5px">decisions at a given altitude without oxygen.</text><circle cx="385" cy="602.0" r="2.2" class="ah"/><text class="s" x="394" y="606.0" style="font-size:12.5px">Above 10,000 ft, symptoms get worse and that</text><text class="s" x="394" y="622.0" style="font-size:12.5px">time shrinks rapidly.</text><circle cx="385" cy="638.0" r="2.2" class="ah"/><text class="s" x="394" y="642.0" style="font-size:12.5px">An altitude chamber "flight" (FAA physiological</text><text class="s" x="394" y="658.0" style="font-size:12.5px">training, CAMI, Oklahoma City) helps pilots</text><text class="s" x="394" y="674.0" style="font-size:12.5px">recognize their own symptoms.</text></svg>
