<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 744" role="img" aria-labelledby="ti de"><title id="ti">Fit to fly: IMSAFE, alcohol, drugs and scuba diving</title><desc id="de">The IMSAFE checklist: Illness, Medication, Stress, Alcohol, Fatigue, Emotion. Alcohol rules: 8 hours from bottle to throttle and blood alcohol under .04 percent, about 3 hours to clear one drink, altitude multiplies effects. Drug and medication points: wait 48 hours after a first dose, five dosing intervals after a medication with side effects. Scuba diving wait times before flight: 12 hours for up to 8,000 feet after a dive without controlled ascent, 24 hours after a dive with controlled ascent, and 24 hours for any flight above 8,000 feet.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:12px}.q1{stroke:currentColor;stroke-width:1.5}.q2{font-size:26px}.q3{font-size:13px}.q4{font-size:14px}.q5{font-size:11.5px}</style><text class="t" x="20" y="28" style="font-size:15px">Fit to fly: IMSAFE, alcohol, drugs and diving</text><rect x="20" y="40" width="108" height="62" rx="10" class="sky q1"/><text class="t m q2" x="74" y="72">I</text><text class="s m q3" x="74" y="94">Illness</text><rect x="136" y="40" width="108" height="62" rx="10" class="lav q1"/><text class="t m q2" x="190" y="72">M</text><text class="s m q3" x="190" y="94">Medication</text><rect x="252" y="40" width="108" height="62" rx="10" class="mint q1"/><text class="t m q2" x="306" y="72">S</text><text class="s m q3" x="306" y="94">Stress</text><rect x="368" y="40" width="108" height="62" rx="10" class="rose q1"/><text class="t m q2" x="422" y="72">A</text><text class="s m q3" x="422" y="94">Alcohol</text><rect x="484" y="40" width="108" height="62" rx="10" class="sky q1"/><text class="t m q2" x="538" y="72">F</text><text class="s m q3" x="538" y="94">Fatigue</text><rect x="600" y="40" width="108" height="62" rx="10" class="lav q1"/><text class="t m q2" x="654" y="72">E</text><text class="s m q3" x="654" y="94">Emotion</text><text class="s" x="20" y="122" style="font-size:12.5px">Do this self-assessment before every flight.</text><rect class="cl" x="20" y="134" width="340" height="376" rx="8"/><text class="t q4" x="32" y="156">Alcohol</text><rect x="38" y="168" width="140" height="54" rx="10" class="rose q1"/><text class="t m" x="108" y="192" style="font-size:20px">8 hours</text><text class="s m q0" x="108" y="212">bottle to throttle</text><rect x="196" y="168" width="140" height="54" rx="10" class="sky q1"/><text class="t m" x="266" y="192" style="font-size:20px">under .04%</text><text class="s m q0" x="266" y="212">blood alcohol level</text><circle cx="35" cy="242" r="2.2" class="ah"/><text class="s q0" x="44" y="246">Both rules apply: 8 hours must pass AND blood</text><text class="s q0" x="44" y="261.5">alcohol must be below .04 percent. At .04 or more</text><text class="s q0" x="44" y="277">after 8 hours, wait until it falls below. Be more</text><text class="s q0" x="44" y="292.5">conservative than the regulation.</text><circle cx="35" cy="308" r="2.2" class="ah"/><text class="s q0" x="44" y="312">About 3 hours for the body to clear one beer or</text><text class="s q0" x="44" y="327.5">one mixed drink. Over 16 hours if considerable</text><text class="s q0" x="44" y="343">amounts. A hangover is still impairment.</text><circle cx="35" cy="358.5" r="2.2" class="ah"/><text class="s q0" x="44" y="362.5">Altitude multiplies the effect: two drinks may act</text><text class="s q0" x="44" y="378">like three or four. Alcohol causes histotoxic</text><text class="s q0" x="44" y="393.5">hypoxia.</text><circle cx="35" cy="409" r="2.2" class="ah"/><text class="s q0" x="44" y="413">As little as one ounce slows reflexes; even one</text><text class="s q0" x="44" y="428.5">drink can impair vision and hearing.</text><rect class="cl" x="370" y="134" width="340" height="376" rx="8"/><text class="t q4" x="382" y="156">Drugs and medication</text><circle cx="385" cy="172" r="2.2" class="ah"/><text class="s q0" x="394" y="176">The rules do not list specific drugs. 14 CFR</text><text class="s q0" x="394" y="191.5">61.53: no flying with a medical condition, or</text><text class="s q0" x="394" y="207">medication for one, that would fail the medical</text><text class="s q0" x="394" y="222.5">standard. 91.17: no drug that affects faculties</text><text class="s q0" x="394" y="238">contrary to safety.</text><circle cx="385" cy="252.5" r="2.2" class="ah"/><text class="s q0" x="394" y="256.5">Any medication that depresses the nervous system</text><text class="s q0" x="394" y="272">(sedative, tranquilizer, antihistamine) makes a</text><text class="s q0" x="394" y="287.5">pilot more susceptible to hypoxia.</text><circle cx="385" cy="302" r="2.2" class="ah"/><text class="s q0" x="394" y="306">Diphenhydramine (e.g., Benadryl) causes drowsiness</text><text class="s q0" x="394" y="321.5">and stays in the system long.</text><circle cx="385" cy="336" r="2.2" class="ah"/><text class="s q0" x="394" y="340">Flying is almost always precluded on prescription</text><text class="s q0" x="394" y="355.5">analgesics such as codeine. Aspirin, acetaminophen</text><text class="s q0" x="394" y="371">and ibuprofen usually do not restrict flying.</text><circle cx="385" cy="385.5" r="2.2" class="ah"/><text class="s q0" x="394" y="389.5">New medication (OTC or prescribed): wait at least</text><text class="s q0" x="394" y="405">48 hours after the first dose.</text><circle cx="385" cy="419.5" r="2.2" class="ah"/><text class="s q0" x="394" y="423.5">Wait five maximal dosing intervals after a</text><text class="s q0" x="394" y="439">medication with adverse effects (a 5 to 6 hour</text><text class="s q0" x="394" y="454.5">interval means 30 hours).</text><circle cx="385" cy="469" r="2.2" class="ah"/><text class="s q0" x="394" y="473">Never mix drugs with alcohol. If in doubt, ask an</text><text class="s q0" x="394" y="488.5">AME.</text><rect class="cl" x="20" y="524" width="690" height="206" rx="8"/><text class="t q4" x="32" y="546">Flying after scuba diving (wait times)</text><text class="s q0" x="32" y="568">Dive with no controlled ascent (no decompression stop)</text><text class="s q5" x="32" y="583">Flight up to 8,000 ft MSL</text><rect x="420" y="556" width="72" height="24" rx="6" class="sky q1"/><text class="t q4" x="500" y="574">12 hours</text><text class="s q0" x="32" y="612">Dive that needed a controlled ascent (decompression stop)</text><text class="s q5" x="32" y="627">Flight up to 8,000 ft MSL</text><rect x="420" y="600" width="144" height="24" rx="6" class="rose q1"/><text class="t q4" x="572" y="618">24 hours</text><text class="s q0" x="32" y="656">Any scuba dive</text><text class="s q5" x="32" y="671">Flight above 8,000 ft MSL</text><rect x="420" y="644" width="144" height="24" rx="6" class="rose q1"/><text class="t q4" x="572" y="662">24 hours</text><text class="s q5" x="32" y="700">Altitudes are actual flight altitudes MSL, not pressurized cabin altitudes. Scuba diving packs extra nitrogen into</text><text class="s q5" x="32" y="715">the body; lower pressure when flying can bring it out as bubbles (DCS).</text></svg>
