<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 744" role="img" aria-labelledby="ti de"><title id="ti">Fit to fly: IMSAFE, alcohol, drugs and scuba diving</title><desc id="de">The IMSAFE checklist: Illness, Medication, Stress, Alcohol, Fatigue, Emotion. Alcohol rules: 8 hours from bottle to throttle and blood alcohol under .04 percent, about 3 hours to clear one drink, altitude multiplies effects. Drug and medication points: wait 48 hours after a first dose, five dosing intervals after a medication with side effects. Scuba diving wait times before flight: 12 hours for up to 8,000 feet after a dive without controlled ascent, 24 hours after a dive with controlled ascent, and 24 hours for any flight above 8,000 feet.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><text class="t" x="20" y="28" style="font-size:15px">Fit to fly: IMSAFE, alcohol, drugs and diving</text><rect x="20" y="40" width="108" height="62" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="74" y="72" style="font-size:26px">I</text><text class="s m" x="74" y="94" style="font-size:13px">Illness</text><rect x="136" y="40" width="108" height="62" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="190" y="72" style="font-size:26px">M</text><text class="s m" x="190" y="94" style="font-size:13px">Medication</text><rect x="252" y="40" width="108" height="62" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="306" y="72" style="font-size:26px">S</text><text class="s m" x="306" y="94" style="font-size:13px">Stress</text><rect x="368" y="40" width="108" height="62" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="422" y="72" style="font-size:26px">A</text><text class="s m" x="422" y="94" style="font-size:13px">Alcohol</text><rect x="484" y="40" width="108" height="62" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="538" y="72" style="font-size:26px">F</text><text class="s m" x="538" y="94" style="font-size:13px">Fatigue</text><rect x="600" y="40" width="108" height="62" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="654" y="72" style="font-size:26px">E</text><text class="s m" x="654" y="94" style="font-size:13px">Emotion</text><text class="s" x="20" y="122" style="font-size:12.5px">Do this self-assessment before every flight.</text><rect class="cl" x="20" y="134" width="340" height="376" rx="8"/><text class="t" x="32" y="156" style="font-size:14px">Alcohol</text><rect x="38" y="168" width="140" height="54" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="108" y="192" style="font-size:20px">8 hours</text><text class="s m" x="108" y="212" style="font-size:12px">bottle to throttle</text><rect x="196" y="168" width="140" height="54" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="266" y="192" style="font-size:20px">under .04%</text><text class="s m" x="266" y="212" style="font-size:12px">blood alcohol level</text><circle cx="35" cy="242" r="2.2" class="ah"/><text class="s" x="44" y="246.0" style="font-size:12px">Both rules apply: 8 hours must pass AND blood</text><text class="s" x="44" y="261.5" style="font-size:12px">alcohol must be below .04 percent. At .04 or more</text><text class="s" x="44" y="277.0" style="font-size:12px">after 8 hours, wait until it falls below. Be more</text><text class="s" x="44" y="292.5" style="font-size:12px">conservative than the regulation.</text><circle cx="35" cy="308.0" r="2.2" class="ah"/><text class="s" x="44" y="312.0" style="font-size:12px">About 3 hours for the body to clear one beer or</text><text class="s" x="44" y="327.5" style="font-size:12px">one mixed drink. Over 16 hours if considerable</text><text class="s" x="44" y="343.0" style="font-size:12px">amounts. A hangover is still impairment.</text><circle cx="35" cy="358.5" r="2.2" class="ah"/><text class="s" x="44" y="362.5" style="font-size:12px">Altitude multiplies the effect: two drinks may act</text><text class="s" x="44" y="378.0" style="font-size:12px">like three or four. Alcohol causes histotoxic</text><text class="s" x="44" y="393.5" style="font-size:12px">hypoxia.</text><circle cx="35" cy="409.0" r="2.2" class="ah"/><text class="s" x="44" y="413.0" style="font-size:12px">As little as one ounce slows reflexes; even one</text><text class="s" x="44" y="428.5" style="font-size:12px">drink can impair vision and hearing.</text><rect class="cl" x="370" y="134" width="340" height="376" rx="8"/><text class="t" x="382" y="156" style="font-size:14px">Drugs and medication</text><circle cx="385" cy="172" r="2.2" class="ah"/><text class="s" x="394" y="176.0" style="font-size:12px">The rules do not list specific drugs. 14 CFR</text><text class="s" x="394" y="191.5" style="font-size:12px">61.53: no flying with a medical condition, or</text><text class="s" x="394" y="207.0" style="font-size:12px">medication for one, that would fail the medical</text><text class="s" x="394" y="222.5" style="font-size:12px">standard. 91.17: no drug that affects faculties</text><text class="s" x="394" y="238.0" style="font-size:12px">contrary to safety.</text><circle cx="385" cy="252.5" r="2.2" class="ah"/><text class="s" x="394" y="256.5" style="font-size:12px">Any medication that depresses the nervous system</text><text class="s" x="394" y="272.0" style="font-size:12px">(sedative, tranquilizer, antihistamine) makes a</text><text class="s" x="394" y="287.5" style="font-size:12px">pilot more susceptible to hypoxia.</text><circle cx="385" cy="302.0" r="2.2" class="ah"/><text class="s" x="394" y="306.0" style="font-size:12px">Diphenhydramine (e.g., Benadryl) causes drowsiness</text><text class="s" x="394" y="321.5" style="font-size:12px">and stays in the system long.</text><circle cx="385" cy="336.0" r="2.2" class="ah"/><text class="s" x="394" y="340.0" style="font-size:12px">Flying is almost always precluded on prescription</text><text class="s" x="394" y="355.5" style="font-size:12px">analgesics such as codeine. Aspirin, acetaminophen</text><text class="s" x="394" y="371.0" style="font-size:12px">and ibuprofen usually do not restrict flying.</text><circle cx="385" cy="385.5" r="2.2" class="ah"/><text class="s" x="394" y="389.5" style="font-size:12px">New medication (OTC or prescribed): wait at least</text><text class="s" x="394" y="405.0" style="font-size:12px">48 hours after the first dose.</text><circle cx="385" cy="419.5" r="2.2" class="ah"/><text class="s" x="394" y="423.5" style="font-size:12px">Wait five maximal dosing intervals after a</text><text class="s" x="394" y="439.0" style="font-size:12px">medication with adverse effects (a 5 to 6 hour</text><text class="s" x="394" y="454.5" style="font-size:12px">interval means 30 hours).</text><circle cx="385" cy="469.0" r="2.2" class="ah"/><text class="s" x="394" y="473.0" style="font-size:12px">Never mix drugs with alcohol. If in doubt, ask an</text><text class="s" x="394" y="488.5" style="font-size:12px">AME.</text><rect class="cl" x="20" y="524" width="690" height="206" rx="8"/><text class="t" x="32" y="546" style="font-size:14px">Flying after scuba diving (wait times)</text><text class="s" x="32" y="568" style="font-size:12px">Dive with no controlled ascent (no decompression stop)</text><text class="s" x="32" y="583" style="font-size:11.5px">Flight up to 8,000 ft MSL</text><rect x="420" y="556" width="72" height="24" rx="6" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="500" y="574" style="font-size:14px">12 hours</text><text class="s" x="32" y="612" style="font-size:12px">Dive that needed a controlled ascent (decompression stop)</text><text class="s" x="32" y="627" style="font-size:11.5px">Flight up to 8,000 ft MSL</text><rect x="420" y="600" width="144" height="24" rx="6" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="572" y="618" style="font-size:14px">24 hours</text><text class="s" x="32" y="656" style="font-size:12px">Any scuba dive</text><text class="s" x="32" y="671" style="font-size:11.5px">Flight above 8,000 ft MSL</text><rect x="420" y="644" width="144" height="24" rx="6" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="572" y="662" style="font-size:14px">24 hours</text><text class="s" x="32" y="700.0" style="font-size:11.5px">Altitudes are actual flight altitudes MSL, not pressurized cabin altitudes. Scuba diving packs extra nitrogen into</text><text class="s" x="32" y="715.0" style="font-size:11.5px">the body; lower pressure when flying can bring it out as bubbles (DCS).</text></svg>
