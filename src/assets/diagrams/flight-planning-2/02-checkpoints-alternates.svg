<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 480" role="img" aria-labelledby="ti de"><title id="ti">Good checkpoints, and an alternate airport</title><desc id="de">A route line with checkpoint dots spaced along it beside a lake, a town, a highway and a river, an alternate airport off to one side, and cards on choosing checkpoints and alternates.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q2{font-size:11.5px}.q3{font-size:13px}.q4{stroke:currentColor;stroke-width:1.5}.q5{stroke:currentColor;stroke-width:1.4;stroke-linejoin:round}.q6{font-size:11px;fill:#fff}</style><text class="t" x="20" y="28" style="font-size:15px">Good checkpoints, and an alternate airport</text><text class="s q3" x="20" y="50">Pick features you can spot easily. Always know where you would go instead.</text><rect class="cl" x="20" y="76" width="690" height="140" rx="8"/><path d="M50 160C200 120 380 150 520 112" class="acc" style="stroke-width:3"/><circle cx="50" cy="160" r="7" class="ah"/><circle cx="180" cy="138" r="7" class="ah"/><circle cx="310" cy="141" r="7" class="ah"/><circle cx="430" cy="132" r="7" class="ah"/><circle cx="520" cy="112" r="7" class="ah"/><ellipse cx="180" cy="180" rx="30" ry="12" class="sky q4"/><text class="s q2 m" x="180" y="203">Lake</text><rect x="286" y="172" width="9" height="9" class="cl q5"/><rect x="300" y="168" width="9" height="9" class="cl q5"/><rect x="308" y="178" width="9" height="9" class="cl q5"/><rect x="292" y="182" width="9" height="9" class="cl q5"/><text class="s q2 m" x="308" y="203">Town</text><path d="M395 190L470 168" class="dk" style="stroke-width:3"/><text class="s q2 m" x="432" y="203">Highway</text><path d="M505 90C490 70 520 66 505 86" class="o" style="stroke-width:0"/><path d="M520 140C535 150 505 165 520 180" class="sky q4" style="fill:none;stroke-width:3;stroke:var(--palette-sky,#8EBFDA)"/><text class="s q2 m" x="520" y="203">River</text><path d="M180 100L430 100" class="dk" style="stroke-width:1.5"/><path d="M180 95L180 105M430 95L430 105" class="dk" style="stroke-width:1.5"/><text class="s q2 m" x="305" y="94">spaced along the whole route</text><path d="M520 112L630 100" class="acc" style="stroke-width:2.5;stroke-dasharray:6 6"/><rect x="612" y="96" width="46" height="8" rx="2" class="mint q4" transform="rotate(-12 635 100)"/><text class="t q3 m" x="635" y="128">Alternate</text><rect class="cl" x="20" y="230" width="337" height="110" rx="8"/><rect x="20" y="230" width="337" height="26" rx="10" class="mint q4"/><text class="t q3" x="30" y="248">A good checkpoint</text><circle cx="33" cy="266" r="2.2" class="ah"/><text class="s q2" x="42" y="270">Easy to see from the air</text><circle cx="33" cy="284" r="2.2" class="ah"/><text class="s q2" x="42" y="288">Town, lake, highway, river</text><circle cx="33" cy="302" r="2.2" class="ah"/><text class="s q2" x="42" y="306">Close to your course</text><circle cx="33" cy="320" r="2.2" class="ah"/><text class="s q2" x="42" y="324">Unlike anything near it</text><rect class="cl" x="373" y="230" width="337" height="110" rx="8"/><rect x="373" y="230" width="337" height="26" rx="10" class="rose q4"/><text class="t q3" x="383" y="248">A poor checkpoint</text><circle cx="386" cy="266" r="2.2" class="ah"/><text class="s q2" x="395" y="270">Small or faint, hard to spot</text><circle cx="386" cy="284" r="2.2" class="ah"/><text class="s q2" x="395" y="288">One of many look-alike lakes</text><circle cx="386" cy="302" r="2.2" class="ah"/><text class="s q2" x="395" y="306">Far off to the side</text><rect class="cl" x="20" y="354" width="690" height="96" rx="8"/><rect x="20" y="354" width="690" height="26" rx="10" class="lav q4"/><text class="t q3" x="30" y="372">Why pick an alternate</text><circle cx="33" cy="390" r="2.2" class="ah"/><text class="s q2" x="42" y="394">Weather, a closed runway or low fuel can change the plan</text><circle cx="33" cy="408" r="2.2" class="ah"/><text class="s q2" x="42" y="412">Mark one on the chart ahead of time; know its heading, distance, radio</text><circle cx="33" cy="426" r="2.2" class="ah"/><text class="s q2" x="42" y="430">Check you have enough fuel to reach it</text><text class="s" x="20" y="462" style="font-size:11px">Source: PHAK ch. 16</text></svg>
