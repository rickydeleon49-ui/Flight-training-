<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 470" role="img" aria-labelledby="ti de"><title id="ti">The VFR navigation log: one leg at a time</title><desc id="de">A six box flow for one leg of a navigation log, from checkpoint to course, distance, groundspeed, time en route and fuel, and a card on actual time over each checkpoint.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q2{font-size:11.5px}.q3{font-size:13px}.q4{stroke:currentColor;stroke-width:1.5}.q5{stroke:currentColor;stroke-width:1.4;stroke-linejoin:round}.q6{font-size:11px;fill:#fff}.q0{stroke-width:3}</style><text class="t" x="20" y="28" style="font-size:15px">The VFR navigation log: one leg at a time</text><text class="s q3" x="20" y="50">Fill it in on the ground, leg by leg. Then use it in flight to see how you are doing.</text><rect class="cl" x="20" y="76" width="210" height="98" rx="8"/><rect x="20" y="76" width="210" height="26" rx="10" class="sky q4"/><text class="t q3" x="30" y="94">1  Checkpoint</text><text class="s q2" x="32" y="122">A landmark on the route</text><text class="s q2" x="32" y="140">Name it; mark it on the chart</text><path d="M233 125L248 125" class="acc q0"/><path d="M257 125L248 129.5L248 120.5Z" class="ah"/><rect class="cl" x="260" y="76" width="210" height="98" rx="8"/><rect x="260" y="76" width="210" height="26" rx="10" class="mint q4"/><text class="t q3" x="270" y="94">2  Course</text><text class="s q2" x="272" y="122">Measure it on the chart</text><text class="s q2" x="272" y="140">Heading comes after wind</text><path d="M473 125L488 125" class="acc q0"/><path d="M497 125L488 129.5L488 120.5Z" class="ah"/><rect class="cl" x="500" y="76" width="210" height="98" rx="8"/><rect x="500" y="76" width="210" height="26" rx="10" class="lav q4"/><text class="t q3" x="510" y="94">3  Distance</text><text class="s q2" x="512" y="122">Measure with a plotter</text><text class="s q2" x="512" y="140">In nautical miles, per leg</text><rect class="cl" x="20" y="188" width="210" height="98" rx="8"/><rect x="20" y="188" width="210" height="26" rx="10" class="rose q4"/><text class="t q3" x="30" y="206">4  Groundspeed</text><text class="s q2" x="32" y="234">Airspeed corrected for wind</text><text class="s q2" x="32" y="252">Winds aloft forecast</text><path d="M233 237L248 237" class="acc q0"/><path d="M257 237L248 241.5L248 232.5Z" class="ah"/><rect class="cl" x="260" y="188" width="210" height="98" rx="8"/><rect x="260" y="188" width="210" height="26" rx="10" class="sky q4"/><text class="t q3" x="270" y="206">5  ETE</text><text class="s q2" x="272" y="234">Time en route for the leg</text><text class="s q2" x="272" y="252">Distance ÷ groundspeed</text><path d="M473 237L488 237" class="acc q0"/><path d="M497 237L488 241.5L488 232.5Z" class="ah"/><rect class="cl" x="500" y="188" width="210" height="98" rx="8"/><rect x="500" y="188" width="210" height="26" rx="10" class="mint q4"/><text class="t q3" x="510" y="206">6  Fuel for leg</text><text class="s q2" x="512" y="234">Fuel you will burn on the leg</text><text class="s q2" x="512" y="252">Time × fuel burn rate</text><path d="M545 176L545 181L125 181L125 184" class="acc" style="stroke-width:3;stroke-dasharray:7 6"/><path d="M125 188L119 179L131 179Z" class="ah"/><rect class="cl" x="20" y="298" width="690" height="72" rx="8"/><rect x="20" y="298" width="690" height="26" rx="10" class="lav q4"/><text class="t q3" x="30" y="316">In flight: write the actual time (ATA)</text><circle cx="33" cy="334" r="2.2" class="ah"/><text class="s q2" x="42" y="338">Note the actual time over each checkpoint and compare it with your ETE</text><circle cx="33" cy="352" r="2.2" class="ah"/><text class="s q2" x="42" y="356">Early or late? Update groundspeed, arrival time and fuel</text><rect class="cl" x="20" y="384" width="690" height="64" rx="8"/><rect x="20" y="384" width="690" height="26" rx="10" class="rose q4"/><text class="t q3" x="30" y="402">Keep it simple</text><circle cx="33" cy="420" r="2.2" class="ah"/><text class="s q2" x="42" y="424">One row per leg. Add a total of time and fuel at the bottom</text><text class="s" x="20" y="452" style="font-size:11px">Source: PHAK ch. 16</text></svg>
