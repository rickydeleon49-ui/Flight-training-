<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 430" role="img" aria-labelledby="ti de"><title id="ti">Effects of forward and aft CG</title><desc id="de">Two columns. Forward CG: stalls at a higher speed, higher elevator control forces with more back elevator pressure needed, beyond the forward limit heavy nosewheel loads, higher stall speed, decreased performance and a tendency to nose over on tailwheel aircraft, and in extreme cases nose heaviness that makes it hard or impossible to flare. Aft CG: cruises faster because of reduced drag, less stable and less able to right itself, less controllable especially at slow speeds, harder stall recovery, and beyond the aft limit extreme control difficulty, violent stalls and very light control forces.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><rect class="o" x="20" y="14" width="340" height="402" rx="10" style="fill:none"/><rect class="o" x="370" y="14" width="340" height="402" rx="10" style="fill:none"/><path class="sky" d="M20 24a10 10 0 0 1 10-10H350a10 10 0 0 1 10 10V56H20z"/><path class="rose" d="M370 24a10 10 0 0 1 10-10H700a10 10 0 0 1 10 10V56H370z"/><text class="t m" x="190" y="44" style="font-size:22px">Forward CG</text><text class="t m" x="540" y="44" style="font-size:22px">Aft CG</text><circle class="dh" cx="40" cy="83" r="3.5"/><text class="s" x="52" y="88" style="font-size:18px">Stalls at a higher speed</text><circle class="dh" cx="40" cy="122" r="3.5"/><text class="s" x="52" y="127" style="font-size:18px">Higher elevator control forces,</text><text class="s" x="52" y="150" style="font-size:18px">more back elevator pressure</text><text class="s" x="52" y="173" style="font-size:18px">needed</text><circle class="dh" cx="40" cy="207" r="3.5"/><text class="s" x="52" y="212" style="font-size:18px">Beyond the limit: heavy</text><text class="s" x="52" y="235" style="font-size:18px">nosewheel loads, higher stall</text><text class="s" x="52" y="258" style="font-size:18px">speed, decreased performance,</text><text class="s" x="52" y="281" style="font-size:18px">tailwheel may nose over</text><circle class="dh" cx="40" cy="315" r="3.5"/><text class="s" x="52" y="320" style="font-size:18px">Extreme: nose heavy, hard or</text><text class="s" x="52" y="343" style="font-size:18px">impossible to flare to land</text><circle class="dh" cx="390" cy="83" r="3.5"/><text class="s" x="402" y="88" style="font-size:18px">Cruises faster, reduced drag</text><circle class="dh" cx="390" cy="122" r="3.5"/><text class="s" x="402" y="127" style="font-size:18px">Less stable; less able to right</text><text class="s" x="402" y="150" style="font-size:18px">itself after maneuvering or</text><text class="s" x="402" y="173" style="font-size:18px">turbulence</text><circle class="dh" cx="390" cy="207" r="3.5"/><text class="s" x="402" y="212" style="font-size:18px">Less controllable, especially at</text><text class="s" x="402" y="235" style="font-size:18px">slow speeds; stall recovery</text><text class="s" x="402" y="258" style="font-size:18px">gets harder</text><circle class="dh" cx="390" cy="292" r="3.5"/><text class="s" x="402" y="297" style="font-size:18px">Beyond the limit: extreme</text><text class="s" x="402" y="320" style="font-size:18px">control difficulty, violent stalls,</text><text class="s" x="402" y="343" style="font-size:18px">very light control forces</text></svg>
