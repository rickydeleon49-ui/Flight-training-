<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 430" role="img" aria-labelledby="ti de"><title id="ti">CG limits envelope</title><desc id="de">An example envelope graph with weight on the vertical axis and CG position on the horizontal axis, forward on the left and aft on the right. The filled shape is bounded by a forward limit, an aft limit and a maximum weight line. Example point A lies inside the envelope, within limits. Example point B lies beyond the aft limit, outside the envelope. This is an example, not any real aircraft.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><path class="dk" style="stroke-width:3" d="M50 370V40M50 370H450"/><path class="dh" d="M50 30L43 44H57z"/><path class="dh" d="M460 370L446 363V377z"/><path class="mint" d="M190 330V230L240 100H360V330z"/><path class="o" d="M190 330V230L240 100H360V330z"/><text class="s m" x="300" y="88" style="font-size:16px">Maximum weight</text><text class="s e" x="180" y="282" style="font-size:16px">Forward limit</text><text class="s" x="372" y="282" style="font-size:16px">Aft limit</text><circle class="dh" cx="285" cy="210" r="8"/><text class="t" x="300" y="200" style="font-size:20px">A</text><circle class="ah" cx="405" cy="210" r="8"/><text class="t" x="420" y="200" style="font-size:20px">B</text><g transform="rotate(-90 26 205)"><text class="s m" x="26" y="205" style="font-size:17px">Weight</text></g><text class="s" x="50" y="396" style="font-size:16px">Forward</text><text class="s e" x="450" y="396" style="font-size:16px">Aft</text><text class="s m" x="250" y="396" style="font-size:16px">CG position</text><text class="t" x="480" y="34" style="font-size:17px">Example, not a real aircraft</text><text class="s" x="480" y="74" style="font-size:17px">A (Example): inside the</text><text class="s" x="480" y="96" style="font-size:17px">envelope. Within limits.</text><text class="s" x="480" y="142" style="font-size:17px">B (Example): CG aft of the</text><text class="s" x="480" y="164" style="font-size:17px">aft limit. Outside the envelope.</text><text class="s" x="480" y="214" style="font-size:17px">Lines meet inside the envelope:</text><text class="s" x="480" y="236" style="font-size:17px">loaded within limits.</text><text class="s" x="480" y="282" style="font-size:17px">Outside the limits: relocate some</text><text class="s" x="480" y="304" style="font-size:17px">items before flight.</text><text class="s" x="480" y="350" style="font-size:17px">CG range: between the forward</text><text class="s" x="480" y="372" style="font-size:17px">and aft CG limits.</text></svg>
