<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 430" role="img" aria-labelledby="ti de"><title id="ti">Density altitude</title><desc id="de">Left: what raises density altitude: high elevation, low atmospheric pressure, high temperature and high humidity; the opposites mean low density altitude. Middle: thin air means high density altitude and the aircraft performs as though at that altitude. Right: performance decreases, with greater takeoff speed and decreased thrust, higher landing speed, about 3.5 percent more landing distance per 1,000 feet, and less performance in high humidity. Bottom: a PHAK example of a takeoff ground run of 790 feet at standard temperature against about 1,000 feet at 20 degrees C above standard.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:15px}.q1{font-size:17px}.q2{font-size:19px}.q3{font-size:14px}</style><rect class="rose" x="20" y="14" width="250" height="250" rx="10"/><rect class="o" x="20" y="14" width="250" height="250" rx="10" style="fill:none"/><text class="t m q2" x="145" y="42">Raises density altitude</text><circle class="dh" cx="40" cy="71" r="3.5"/><text class="s q1" x="52" y="76">High elevation</text><circle class="dh" cx="40" cy="101" r="3.5"/><text class="s q1" x="52" y="106">Low atmospheric</text><text class="s q1" x="52" y="128">pressure</text><circle class="dh" cx="40" cy="153" r="3.5"/><text class="s q1" x="52" y="158">High temperature</text><circle class="dh" cx="40" cy="183" r="3.5"/><text class="s q1" x="52" y="188">High humidity</text><text class="s q3" x="36" y="214">Opposite: low elevation, high</text><text class="s q3" x="36" y="231">pressure, cold, dry = low density</text><text class="s q3" x="36" y="248">altitude (dense air)</text><path class="acc" d="M274 120H296"/><path class="ah" d="M304 120L294 113V127z"/><path class="acc" d="M426 120H446"/><path class="ah" d="M454 120L444 113V127z"/><text class="t m" x="365" y="100" style="font-size:22px">Thin air</text><text class="t m q2" x="365" y="126">High density</text><text class="t m q2" x="365" y="150">altitude</text><text class="s m q0" x="365" y="182">Aircraft performs</text><text class="s m q0" x="365" y="201">as though at that</text><text class="s m q0" x="365" y="220">altitude</text><rect class="sky" x="460" y="14" width="250" height="250" rx="10"/><rect class="o" x="460" y="14" width="250" height="250" rx="10" style="fill:none"/><text class="t m q2" x="585" y="42">Performance drops</text><circle class="dh" cx="480" cy="71" r="3.5"/><text class="s q0" x="492" y="76">Takeoff: greater takeoff</text><text class="s q0" x="492" y="95">speed, decreased thrust</text><circle class="dh" cx="480" cy="118" r="3.5"/><text class="s q0" x="492" y="123">Landing: higher landing</text><text class="s q0" x="492" y="142">speed (true airspeed)</text><circle class="dh" cx="480" cy="165" r="3.5"/><text class="s q0" x="492" y="170">Landing distance: about 3.5</text><text class="s q0" x="492" y="189">percent more per 1,000 ft</text><circle class="dh" cx="480" cy="212" r="3.5"/><text class="s q0" x="492" y="217">Expect less performance in</text><text class="s q0" x="492" y="236">high humidity</text><text class="t" x="20" y="294" style="font-size:18px">Example (PHAK): takeoff ground run, pressure altitude 5,000 ft</text><rect class="mint" x="20" y="306" width="237" height="26"/><path class="o" style="stroke-width:2" d="M20 306H257V332H20z"/><text class="s q1" x="267" y="325">790 ft at standard temperature</text><rect class="rose" x="20" y="344" width="300" height="26"/><path class="o" style="stroke-width:2" d="M20 344H320V370H20z"/><text class="s q1" x="330" y="363">About 1,000 ft at 20 °C above standard</text><text class="s" x="20" y="400" style="font-size:16px">There the density level is above 7,000 ft</text></svg>
