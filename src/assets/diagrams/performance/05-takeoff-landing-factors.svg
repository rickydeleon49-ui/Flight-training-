<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 430" role="img" aria-labelledby="ti de"><title id="ti">Takeoff and landing distance factors</title><desc id="de">A table of factors that change takeoff and landing distance. Wind: a headwind shortens and a tailwind lengthens takeoff distance, and the effect on landing is identical. Runway slope: upslope lengthens takeoff and shortens landing, downslope does the opposite. Surface: surfaces that are not hard and smooth lengthen the takeoff ground roll, and water, ice, snow and soft ground reduce braking. Weight: 10 percent more weight means at least 21 percent more takeoff distance and 10 percent more landing distance. Density altitude also matters.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style>
<rect class="cl" x="20" y="14" width="690" height="30"/>
<text class="t" x="32" y="36" style="font-size:18px">Factor</text>
<text class="t" x="172" y="36" style="font-size:18px">Takeoff distance</text>
<text class="t" x="452" y="36" style="font-size:18px">Landing distance</text>
<rect class="sky" x="20" y="48" width="16" height="84"/>
<text class="t" x="46" y="78" style="font-size:18px">Wind</text>
<text class="s" x="172" y="70" style="font-size:15.5px">Headwind shortens the distance,</text>
<text class="s" x="172" y="90" style="font-size:15.5px">tailwind lengthens it. Wind of 10</text>
<text class="s" x="172" y="110" style="font-size:15.5px">percent of takeoff speed: about 19</text>
<text class="s" x="172" y="130" style="font-size:15.5px">percent shorter, 21 percent longer</text>
<text class="s" x="452" y="70" style="font-size:15.5px">Effect of wind on landing</text>
<text class="s" x="452" y="90" style="font-size:15.5px">distance is identical to its effect</text>
<text class="s" x="452" y="110" style="font-size:15.5px">on takeoff distance</text>
<path class="dk" style="stroke-width:1.5;opacity:.35" d="M20 136H710"/>
<rect class="lav" x="20" y="136" width="16" height="84"/>
<text class="t" x="46" y="166" style="font-size:17px">Runway slope</text>
<text class="s" x="172" y="158" style="font-size:15.5px">Upslope: longer ground run.</text>
<text class="s" x="172" y="178" style="font-size:15.5px">Downslope: shorter takeoff</text>
<text class="s" x="172" y="198" style="font-size:15.5px">distance</text>
<text class="s" x="452" y="158" style="font-size:15.5px">Upslope: shorter landing roll.</text>
<text class="s" x="452" y="178" style="font-size:15.5px">Downslope: longer landing</text>
<text class="s" x="452" y="198" style="font-size:15.5px">distance</text>
<path class="dk" style="stroke-width:1.5;opacity:.35" d="M20 224H710"/>
<rect class="mint" x="20" y="224" width="16" height="84"/>
<text class="t" x="46" y="254" style="font-size:18px">Surface</text>
<text class="s" x="172" y="246" style="font-size:15.5px">Any surface not hard and smooth</text>
<text class="s" x="172" y="266" style="font-size:15.5px">increases the ground roll. Mud, snow,</text>
<text class="s" x="172" y="286" style="font-size:15.5px">standing water slow acceleration</text>
<text class="s" x="452" y="246" style="font-size:15.5px">Water and ice reduce braking.</text>
<text class="s" x="452" y="266" style="font-size:15.5px">Snow, ice, soft ground: a</text>
<text class="s" x="452" y="286" style="font-size:15.5px">significant effect</text>
<path class="dk" style="stroke-width:1.5;opacity:.35" d="M20 312H710"/>
<rect class="rose" x="20" y="312" width="16" height="84"/>
<text class="t" x="46" y="342" style="font-size:18px">Weight</text>
<text class="s" x="172" y="334" style="font-size:15.5px">10 percent more weight: at least 21</text>
<text class="s" x="172" y="354" style="font-size:15.5px">percent more distance. Higher lift-off</text>
<text class="s" x="172" y="374" style="font-size:15.5px">speed, more mass, more drag</text>
<text class="s" x="452" y="334" style="font-size:15.5px">10 percent more weight: 10 percent</text>
<text class="s" x="452" y="354" style="font-size:15.5px">more distance, 5 percent faster</text>
<text class="s" x="452" y="374" style="font-size:15.5px">landing speed</text>
<path class="dk" style="stroke-width:1.5;opacity:.35" d="M20 400H710"/>
<text class="s" x="20" y="418" style="font-size:16px">Also: pressure altitude and temperature (density altitude) affect both.</text>
</svg>
