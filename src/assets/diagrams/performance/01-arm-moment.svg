<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 430" role="img" aria-labelledby="ti de"><title id="ti">Arm and moment</title><desc id="de">A side line along the aircraft with a vertical dashed datum. Arms are measured from the datum, plus aft and minus forward. Example only: a 40 pound item at an arm of 30 inches gives a moment of 1,200 inch-pounds and a 60 pound item at 80 inches gives 4,800. The total is 100 pounds and 6,000 inch-pounds, so the example CG is 60 inches from the datum. Weight times arm equals moment, and CG equals total moment divided by total weight.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><rect class="cl" x="20" y="144" width="680" height="12"/><path class="o" d="M20 144H700V156H20z"/><path class="dk" style="stroke-width:3" stroke-dasharray="10 8" d="M170 56V226"/><text class="t m" x="170" y="40" style="font-size:19px">Datum (arm 0)</text><text class="s e" x="150" y="76" style="font-size:16px">Forward: minus (–)</text><text class="s" x="190" y="76" style="font-size:16px">Aft: plus (+)</text><path class="dk" style="stroke-width:2;opacity:.6" d="M156 86H80"/><path class="dh" d="M72 86L84 80V92z"/><path class="dk" style="stroke-width:2;opacity:.6" d="M184 86H690"/><path class="dh" d="M698 86L686 80V92z"/><rect class="sky" x="296" y="100" width="48" height="44"/><path class="o" d="M296 144V100H344V144"/><rect class="mint" x="546" y="100" width="48" height="44"/><path class="o" d="M546 144V100H594V144"/><text class="t m" x="320" y="128" style="font-size:16px">40 lb</text><text class="t m" x="570" y="128" style="font-size:16px">60 lb</text><path class="dk" style="stroke-width:2;opacity:.6" d="M320 158V186"/><path class="dk" style="stroke-width:2;opacity:.6" d="M570 158V216"/><path class="dk" style="stroke-width:2" d="M170 186H320M170 178V194M320 178V194"/><text class="s m" x="245" y="176" style="font-size:16px">Arm 30 in</text><path class="dk" style="stroke-width:2" d="M170 216H570M170 208V224M570 208V224"/><text class="s m" x="370" y="206" style="font-size:16px">Arm 80 in</text><path class="ah" d="M470 160L459 178H481z"/><text class="t m" x="470" y="198" style="font-size:16px">CG 60 in</text><text class="s e" x="700" y="40" style="font-size:16px">Example: made-up numbers</text><text class="t" x="20" y="262" style="font-size:22px">Weight × arm = moment</text><text class="s" x="20" y="286" style="font-size:17px">Moment is in pound-inches (in-lb)</text><text class="s" x="20" y="330" style="font-size:17px">Example: 40 lb × 30 in = 1,200 in-lb</text><text class="s" x="20" y="358" style="font-size:17px">Example: 60 lb × 80 in = 4,800 in-lb</text><text class="s" x="20" y="386" style="font-size:17px">Example total: 100 lb, 6,000 in-lb</text><text class="t" x="400" y="262" style="font-size:20px">CG = total moment ÷ total weight</text><text class="s" x="400" y="286" style="font-size:17px">Example: 6,000 ÷ 100 = 60 in</text><text class="s" x="400" y="330" style="font-size:16px">Arm: distance from the datum to</text><text class="s" x="400" y="352" style="font-size:16px">the CG of the item, in inches.</text><text class="s" x="400" y="374" style="font-size:16px">Aft of the datum is plus, forward</text><text class="s" x="400" y="396" style="font-size:16px">of the datum is minus.</text></svg>
