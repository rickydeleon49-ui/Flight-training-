<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 430" role="img" aria-labelledby="ti de"><title id="ti">Airfoil terms</title><desc id="de">Side view of a wing section. The rounded end facing forward is the leading edge and the narrow tapered end is the trailing edge. A dashed chord line joins them. The upper surface has more camber than the lower. Relative wind arrives horizontally from the left. Angle of attack is the angle between the chord line and the relative wind.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.q0{stroke-width:2}</style><g transform="rotate(18 100 215)"><path class="o sky" d="M100 215C110 153 290 143 480 215C300 229 130 229 100 215z"/><path class="o d" d="M30 215L500 215" style="stroke:var(--palette-berry,#A84C6B)"/></g><path d="M12 215L92 215" class="acc"/><path class="ah" d="M92 215L76 223L76 207z"/><path class="o q0" d="M10 215A90 90 0 0 1 14 187"/><text class="t" x="14" y="140">Angle of attack</text><path class="o q0" d="M40 150L14 203"/><text class="s" x="6" y="246" style="font-size:17px">Relative wind</text><text class="t" x="250" y="350">Leading edge</text><path class="o q0" d="M258 334L114 228"/><text class="t" x="477.4" y="362.43">Trailing edge</text><path class="o q0" d="M483 346L463 334"/><text class="t" x="540" y="270">Chord line</text><path class="o q0" d="M580 278L414 317"/><text class="t" x="300" y="95">Camber</text><text class="s" x="300" y="119" style="font-size:17px">(curved upper and lower surfaces)</text><path class="o q0" d="M300 128L270 210"/></svg>
