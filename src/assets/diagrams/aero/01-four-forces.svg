<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 430" role="img" aria-labelledby="ti de"><title id="ti">Four forces in straight-and-level flight</title><desc id="de">Side view of an airplane. Lift acts upward from the center of lift, weight acts downward from the center of gravity, thrust acts forward and drag acts rearward. In steady flight opposing forces are equal and cancel.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}</style><path class="o sky" d="M100 215Q105 195 150 192L310 192Q355 196 365 215Q355 232 310 236L150 236Q105 236 100 215z"/><path class="o sky" d="M100 215L76 168L108 168L150 205z"/><path class="o lav" d="M205 214L265 214L245 232L195 232z"/><circle cx="232" cy="214" r="5" class="ah"/><path class="acc" d="M232 214L232 66"/><path class="ah" d="M232 52L240 68L224 68z"/><path class="acc" d="M232 214L232 362"/><path class="ah" d="M232 376L224 360L240 360z"/><path class="acc" d="M366 214L444 214"/><path class="ah" d="M458 214L442 222L442 206z"/><path class="acc" d="M98 214L36 214"/><path class="ah" d="M22 214L38 206L38 222z"/><text class="t" x="244" y="62">Lift</text><text class="t" x="244" y="382">Weight</text><text class="t" x="372" y="200">Thrust</text><text class="t" x="22" y="200">Drag</text><text class="s" x="520" y="62">Straight-and-level,</text><text class="s" x="520" y="86">unaccelerated flight</text><text class="t" x="520" y="140" style="font-size:19px">Lift opposes weight</text><text class="t" x="520" y="166" style="font-size:19px">Thrust opposes drag</text><text class="s" x="520" y="220">Opposing forces are</text><text class="s" x="520" y="244">equal and cancel.</text></svg>
