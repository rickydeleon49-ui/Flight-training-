<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 430" role="img" aria-labelledby="ti de"><title id="ti">Angle of attack versus pitch attitude</title><desc id="de">Side view of an airplane in a climb. The horizon is level. The flight path rises above the horizon and the relative wind is parallel to and opposite the flight path. The nose points higher than the flight path. Pitch attitude is the angle from the horizon to the nose. Angle of attack is the smaller angle from the flight path to the chord line. The two angles differ.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.q0{stroke-width:2}</style><path class="o d q0" d="M30 300L690 300"/><text class="s" x="690" y="324" style="text-anchor:end">Horizon</text><g transform="translate(-2 86) rotate(-26 232 214)"><path class="o sky" d="M100 215Q105 195 150 192L310 192Q355 196 365 215Q355 232 310 236L150 236Q105 236 100 215z"/><path class="o sky" d="M100 215L76 168L108 168L150 205z"/><path class="o lav" d="M205 214L265 214L245 232L195 232z"/></g><path class="acc" d="M210 300L535 243"/><path class="ah" d="M535 243L521 253L518 238z"/><text class="t" x="514.99" y="278.7">Flight path</text><path class="o d q0" d="M210 300L421 197"/><path class="o q0" d="M600 176L484 197"/><path class="ah" d="M472 199L486 188L489 204z"/><text class="s" x="600" y="154" style="text-anchor:end">Relative wind</text><path class="o q0" d="M360 300A150 150 0 0 0 345 234"/><path class="o q0" d="M417 264A210 210 0 0 0 399 208"/><text class="t" x="296.16" y="344">Pitch attitude</text><text class="s" x="296.16" y="366" style="font-size:17px">(nose to horizon)</text><path class="o q0" d="M356 310L356 268"/><text class="t" x="250" y="150">Angle of attack</text><path class="o q0" d="M340 160L395 202"/><text class="s" x="30" y="60">Climb: the flight path is not horizontal.</text><text class="s" x="30" y="86">Angle of attack is measured from the relative wind, not the horizon.</text></svg>
