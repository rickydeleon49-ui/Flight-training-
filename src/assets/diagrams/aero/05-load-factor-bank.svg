<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 430" role="img" aria-labelledby="ti de"><title id="ti">Load factor in a banked turn</title><desc id="de">Horizontal bars for load factor. Straight flight is 1 G. A level coordinated turn at 60 degrees of bank is 2 G. At 80 degrees of bank it is 5.76 G. A dashed line at 6 G marks the acrobatic category limit load factor, which is exceeded at slightly more than 80 degrees of bank.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}</style><path class="o" style="stroke-width:2" d="M200 90L200 330"/><text class="t e" x="186" y="137">Straight flight</text><rect x="200" y="110" width="80" height="38" rx="4" class="mint" style="stroke:currentColor;stroke-width:3"/><text class="t" x="292" y="137">1 G</text><text class="t e" x="186" y="217">60° bank</text><rect x="200" y="190" width="160" height="38" rx="4" class="sky" style="stroke:currentColor;stroke-width:3"/><text class="t" x="372" y="217">2 G</text><text class="t e" x="186" y="297">80° bank</text><rect x="200" y="270" width="461" height="38" rx="4" class="rose" style="stroke:currentColor;stroke-width:3"/><text class="t e" x="648.8" y="297">5.76 G</text><path class="o d" style="stroke:var(--status-overdue,#B0413C)" d="M680 84L680 350"/><text class="t m" x="680" y="72" style="fill:var(--status-overdue,#B0413C)">6 G</text><text class="s" x="200" y="392" style="font-size:17px">6 G is the acrobatic limit load factor. At slightly</text><text class="s" x="200" y="414" style="font-size:17px">more than 80° bank the load factor exceeds it.</text><text class="t" x="30" y="36">Load factor in a coordinated, level turn</text></svg>
