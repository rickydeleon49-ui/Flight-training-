<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 430" role="img" aria-labelledby="ti de"><title id="ti">Forces in a turn</title><desc id="de">Front view of an airplane banked to the left in a level turn. Lift acts perpendicular to the wings, inward and upward. It splits into a vertical component that opposes weight and a horizontal component toward the center of the turn, also called centripetal force. Centrifugal force acts equal and opposite to the horizontal component.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}</style><path class="o" style="stroke-width:9" d="M227 290L453 160"/><ellipse cx="340" cy="225" rx="16" ry="24" class="o sky"/><path class="acc" d="M340 225L272 107"/><path class="ah" d="M265 95L280 105L266 113z"/><path class="acc" d="M340 225L340 109"/><path class="ah" d="M340 95L348 111L332 111z"/><path class="acc" d="M340 225L279 225"/><path class="ah" d="M265 225L281 217L281 233z"/><path class="acc" d="M340 225L340 341"/><path class="ah" d="M340 355L332 339L348 339z"/><path class="acc" d="M340 225L401 225"/><path class="ah" d="M415 225L399 233L399 217z"/><path class="o d" style="stroke-width:2" d="M265 95L340 95M265 95L265 225"/><text class="t" x="253.0" y="89.0961894323342" style="text-anchor:end">Lift</text><text class="t" x="352" y="101.0961894323342" style="font-size:17px">Vertical component of lift</text><text class="t" x="257.0" y="213" style="font-size:17px;text-anchor:end">Horizontal component</text><text class="t" x="257.0" y="233" style="font-size:17px;text-anchor:end">of lift (centripetal force)</text><text class="t" x="427.0" y="231" style="font-size:17px">Centrifugal force</text><text class="t" x="352" y="362.9038105676658">Weight</text><text class="s" x="30" y="380">Front view, bank to the left.</text><text class="s" x="30" y="404">Center of turn is to the left.</text></svg>
