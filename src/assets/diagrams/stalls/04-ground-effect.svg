<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 682" role="img" aria-labelledby="ti de"><title id="ti">Ground effect: wingtip vortices and induced drag near the surface</title><desc id="de">Left: a wing in free air with full downwash and wingtip vortices, and a wing near the surface with upwash, downwash and vortices reduced. Right: reduction in induced drag at constant lift coefficient: 1.4 percent when the wing height equals its span, 23.5 percent at one fourth of the span, 47.6 percent at one tenth. Cards cover being in ground effect, leaving it on takeoff, entering it on landing, and what the pilot does.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11.5px}.q1{font-size:13px}.q2{font-size:10.5px}.q3{stroke:currentColor;stroke-width:1.5}.q4{stroke-width:2.5}.q5{stroke-width:2}.q6{font-size:12px}.q7{font-size:12.5px}.q8{stroke:currentColor;stroke-width:1.6}.q9{stroke-dasharray:3 3}</style><text class="t" x="20" y="28" style="font-size:15px">Ground effect: wingtip vortices and induced drag near the surface</text><text class="s q1" x="20" y="50">When the aircraft is within several feet of the ground or water, the surface restricts the vertical</text><text class="s q1" x="20" y="66.5">component of the airflow around the wing, as if there were an air cushion.</text><rect class="cl" x="20" y="91" width="335" height="250" rx="8"/><text class="t q1" x="32" y="113">Wing in free air and near the ground</text><path d="M40 161C50 152,80 151,160 161C100 165,60 165,40 161Z" class="sky q8"/><path d="M70 171L70 201" class="dk q4"/><path d="M70 209L66.4 201L73.6 201Z" class="dh" style=""/><path d="M100 171L100 215" class="dk q4"/><path d="M100 223L96.4 215L103.6 215Z" class="dh" style=""/><path d="M130 171L130 201" class="dk q4"/><path d="M130 209L126.4 201L133.6 201Z" class="dh" style=""/><circle cx="172" cy="163" r="14" class="acc q9"/><text class="s q2" x="205" y="155">Free air:</text><text class="s q2" x="205" y="169">full downwash and</text><text class="s q2" x="205" y="183">full wingtip vortices</text><path d="M40 261C50 252,80 251,160 261C100 265,60 265,40 261Z" class="sky q8"/><path d="M74 269L74 277" class="dk q5"/><path d="M74 283L71.3 277L76.7 277Z" class="dh" style=""/><path d="M100 269L100 277" class="dk q5"/><path d="M100 283L97.3 277L102.7 277Z" class="dh" style=""/><path d="M126 269L126 277" class="dk q5"/><path d="M126 283L123.3 277L128.7 277Z" class="dh" style=""/><circle cx="168" cy="262" r="6" class="acc q9"/><rect x="30" y="291" width="170" height="14" class="cl" style="stroke:currentColor;stroke-width:1.4"/><text class="s q2" x="205" y="255">Near the surface:</text><text class="s q2" x="205" y="269">upwash, downwash and</text><text class="s q2" x="205" y="283">vortices all reduced</text><text class="s q2" x="32" y="327">Schematic side view; sizes not to scale.</text><rect class="cl" x="375" y="91" width="335" height="250" rx="8"/><text class="t q1" x="387" y="113">Reduction in induced drag by wing height</text><text class="t q6" x="387" y="165">Height = span</text><rect x="480" y="143" width="3.6" height="32" rx="6" class="sky q3"/><text class="t q7" x="491.64" y="165">1.4 percent</text><text class="t q6" x="387" y="215">1/4 span</text><rect x="480" y="193" width="61.1" height="32" rx="6" class="lav q3"/><text class="t q7" x="549.1" y="215">23.5 percent</text><text class="t q6" x="387" y="265">1/10 span</text><rect x="480" y="243" width="123.8" height="32" rx="6" class="rose q3"/><text class="t q7" x="611.76" y="265">47.6 percent</text><text class="s" x="387" y="293" style="font-size:11px">At constant CL. A large reduction takes place only</text><text class="s" x="387" y="307" style="font-size:11px">when the wing is very close to the ground.</text><text class="s q2" x="387" y="325">Bar lengths are drawn to the percentages shown.</text><rect x="20" y="355" width="335" height="24" rx="10" class="mint q3"/><text class="t q1" x="30" y="372">In ground effect, at constant AOA</text><circle cx="31" cy="393" r="2.2" class="ah"/><text class="s q0" x="40" y="397">Reduced upwash, downwash and wingtip vortices</text><circle cx="31" cy="412" r="2.2" class="ah"/><text class="s q0" x="40" y="416">Reduced induced AOA and induced drag; CL increases</text><circle cx="31" cy="431" r="2.2" class="ah"/><text class="s q0" x="40" y="435">The wing needs a lower AOA for the same CL</text><circle cx="31" cy="450" r="2.2" class="ah"/><text class="s q0" x="40" y="454">Significant reduction in thrust required at low</text><text class="s q0" x="40" y="469">speeds</text><rect x="375" y="355" width="335" height="24" rx="10" class="rose q3"/><text class="t q1" x="385" y="372">Takeoff: leaving ground effect</text><circle cx="386" cy="393" r="2.2" class="ah"/><text class="s q0" x="395" y="397">Requires an increase in AOA to maintain the same CL</text><circle cx="386" cy="412" r="2.2" class="ah"/><text class="s q0" x="395" y="416">Induced drag and thrust required increase</text><circle cx="386" cy="431" r="2.2" class="ah"/><text class="s q0" x="395" y="435">Decrease in stability and a nose-up change in</text><text class="s q0" x="395" y="450">moment</text><circle cx="386" cy="465" r="2.2" class="ah"/><text class="s q0" x="395" y="469">Aircraft may seem able to fly below the recommended</text><text class="s q0" x="395" y="484">speed, then settle back to the runway</text><rect x="20" y="509" width="335" height="24" rx="10" class="sky q3"/><text class="t q1" x="30" y="526">Landing: entering ground effect</text><circle cx="31" cy="547" r="2.2" class="ah"/><text class="s q0" x="40" y="551">Constant AOA: CL increases and thrust required</text><text class="s q0" x="40" y="566">falls, so the aircraft may "float"</text><circle cx="31" cy="581" r="2.2" class="ah"/><text class="s q0" x="40" y="585">Excess speed at the flare can mean a considerable</text><text class="s q0" x="40" y="600">float distance</text><circle cx="31" cy="615" r="2.2" class="ah"/><text class="s q0" x="40" y="619">Ground effect is most realized at altitudes less</text><text class="s q0" x="40" y="634">than the wingspan</text><rect x="375" y="509" width="335" height="24" rx="10" class="lav q3"/><text class="t q1" x="385" y="526">What you do</text><circle cx="386" cy="547" r="2.2" class="ah"/><text class="s q0" x="395" y="551">Do not force the aircraft airborne with a</text><text class="s q0" x="395" y="566">deficiency of speed; use the recommended takeoff</text><text class="s q0" x="395" y="581">speed</text><circle cx="386" cy="596" r="2.2" class="ah"/><text class="s q0" x="395" y="600">Never retract landing gear or flaps before a</text><text class="s q0" x="395" y="615">positive rate of climb at a safe altitude</text><circle cx="386" cy="630" r="2.2" class="ah"/><text class="s q0" x="395" y="634">On final, reduce power to offset the added lift, or</text><text class="s q0" x="395" y="649">the aircraft tends to climb above the glidepath</text></svg>
