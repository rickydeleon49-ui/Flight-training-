<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 682" role="img" aria-labelledby="ti de"><title id="ti">Ground effect: wingtip vortices and induced drag near the surface</title><desc id="de">Left: a wing in free air with full downwash and wingtip vortices, and a wing near the surface with upwash, downwash and vortices reduced. Right: reduction in induced drag at constant lift coefficient: 1.4 percent when the wing height equals its span, 23.5 percent at one fourth of the span, 47.6 percent at one tenth. Cards cover being in ground effect, leaving it on takeoff, entering it on landing, and what the pilot does.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style>
<text class="t" x="20" y="28" style="font-size:15px">Ground effect: wingtip vortices and induced drag near the surface</text>
<text class="s" x="20" y="50.0" style="font-size:13px">When the aircraft is within several feet of the ground or water, the surface restricts the vertical</text>
<text class="s" x="20" y="66.5" style="font-size:13px">component of the airflow around the wing, as if there were an air cushion.</text>
<rect class="cl" x="20" y="91.0" width="335" height="250" rx="8"/>
<text class="t" x="32" y="113.0" style="font-size:13px">Wing in free air and near the ground</text>
<path d="M40 161.0C50 152.0,80 151.0,160 161.0C100 165.0,60 165.0,40 161.0Z" class="sky" style="stroke:currentColor;stroke-width:1.6"/>
<path d="M70 171.0L70.0 201.0" class="dk" style="stroke-width:2.5"/><path d="M70 209.0L66.4 201.0L73.6 201.0Z" class="dh" style=""/>
<path d="M100 171.0L100.0 215.0" class="dk" style="stroke-width:2.5"/><path d="M100 223.0L96.4 215.0L103.6 215.0Z" class="dh" style=""/>
<path d="M130 171.0L130.0 201.0" class="dk" style="stroke-width:2.5"/><path d="M130 209.0L126.4 201.0L133.6 201.0Z" class="dh" style=""/>
<circle cx="172" cy="163.0" r="14" class="acc" style="stroke-dasharray:3 3"/>
<text class="s" x="205" y="155.0" style="font-size:10.5px">Free air:</text>
<text class="s" x="205" y="169.0" style="font-size:10.5px">full downwash and</text>
<text class="s" x="205" y="183.0" style="font-size:10.5px">full wingtip vortices</text>
<path d="M40 261.0C50 252.0,80 251.0,160 261.0C100 265.0,60 265.0,40 261.0Z" class="sky" style="stroke:currentColor;stroke-width:1.6"/>
<path d="M74 269.0L74.0 277.0" class="dk" style="stroke-width:2"/><path d="M74 283.0L71.3 277.0L76.7 277.0Z" class="dh" style=""/>
<path d="M100 269.0L100.0 277.0" class="dk" style="stroke-width:2"/><path d="M100 283.0L97.3 277.0L102.7 277.0Z" class="dh" style=""/>
<path d="M126 269.0L126.0 277.0" class="dk" style="stroke-width:2"/><path d="M126 283.0L123.3 277.0L128.7 277.0Z" class="dh" style=""/>
<circle cx="168" cy="262.0" r="6" class="acc" style="stroke-dasharray:3 3"/>
<rect x="30" y="291.0" width="170" height="14" class="cl" style="stroke:currentColor;stroke-width:1.4"/>
<text class="s" x="205" y="255.0" style="font-size:10.5px">Near the surface:</text>
<text class="s" x="205" y="269.0" style="font-size:10.5px">upwash, downwash and</text>
<text class="s" x="205" y="283.0" style="font-size:10.5px">vortices all reduced</text>
<text class="s" x="32" y="327.0" style="font-size:10.5px">Schematic side view; sizes not to scale.</text>
<rect class="cl" x="375" y="91.0" width="335" height="250" rx="8"/>
<text class="t" x="387" y="113.0" style="font-size:13px">Reduction in induced drag by wing height</text>
<text class="t" x="387" y="165.0" style="font-size:12px">Height = span</text>
<rect x="480" y="143.0" width="3.6" height="32" rx="6" class="sky" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="491.64" y="165.0" style="font-size:12.5px">1.4 percent</text>
<text class="t" x="387" y="215.0" style="font-size:12px">1/4 span</text>
<rect x="480" y="193.0" width="61.1" height="32" rx="6" class="lav" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="549.1" y="215.0" style="font-size:12.5px">23.5 percent</text>
<text class="t" x="387" y="265.0" style="font-size:12px">1/10 span</text>
<rect x="480" y="243.0" width="123.8" height="32" rx="6" class="rose" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="611.76" y="265.0" style="font-size:12.5px">47.6 percent</text>
<text class="s" x="387" y="293.0" style="font-size:11px">At constant CL. A large reduction takes place only</text>
<text class="s" x="387" y="307.0" style="font-size:11px">when the wing is very close to the ground.</text>
<text class="s" x="387" y="325.0" style="font-size:10.5px">Bar lengths are drawn to the percentages shown.</text>
<rect x="20" y="355.0" width="335" height="24" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="30" y="372.0" style="font-size:13px">In ground effect, at constant AOA</text>
<circle cx="31" cy="393.0" r="2.2" class="ah"/>
<text class="s" x="40" y="397.0" style="font-size:11.5px">Reduced upwash, downwash and wingtip vortices</text>
<circle cx="31" cy="412.0" r="2.2" class="ah"/>
<text class="s" x="40" y="416.0" style="font-size:11.5px">Reduced induced AOA and induced drag; CL increases</text>
<circle cx="31" cy="431.0" r="2.2" class="ah"/>
<text class="s" x="40" y="435.0" style="font-size:11.5px">The wing needs a lower AOA for the same CL</text>
<circle cx="31" cy="450.0" r="2.2" class="ah"/>
<text class="s" x="40" y="454.0" style="font-size:11.5px">Significant reduction in thrust required at low</text>
<text class="s" x="40" y="469.0" style="font-size:11.5px">speeds</text>
<rect x="375" y="355.0" width="335" height="24" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="385" y="372.0" style="font-size:13px">Takeoff: leaving ground effect</text>
<circle cx="386" cy="393.0" r="2.2" class="ah"/>
<text class="s" x="395" y="397.0" style="font-size:11.5px">Requires an increase in AOA to maintain the same CL</text>
<circle cx="386" cy="412.0" r="2.2" class="ah"/>
<text class="s" x="395" y="416.0" style="font-size:11.5px">Induced drag and thrust required increase</text>
<circle cx="386" cy="431.0" r="2.2" class="ah"/>
<text class="s" x="395" y="435.0" style="font-size:11.5px">Decrease in stability and a nose-up change in</text>
<text class="s" x="395" y="450.0" style="font-size:11.5px">moment</text>
<circle cx="386" cy="465.0" r="2.2" class="ah"/>
<text class="s" x="395" y="469.0" style="font-size:11.5px">Aircraft may seem able to fly below the recommended</text>
<text class="s" x="395" y="484.0" style="font-size:11.5px">speed, then settle back to the runway</text>
<rect x="20" y="509.0" width="335" height="24" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="30" y="526.0" style="font-size:13px">Landing: entering ground effect</text>
<circle cx="31" cy="547.0" r="2.2" class="ah"/>
<text class="s" x="40" y="551.0" style="font-size:11.5px">Constant AOA: CL increases and thrust required</text>
<text class="s" x="40" y="566.0" style="font-size:11.5px">falls, so the aircraft may "float"</text>
<circle cx="31" cy="581.0" r="2.2" class="ah"/>
<text class="s" x="40" y="585.0" style="font-size:11.5px">Excess speed at the flare can mean a considerable</text>
<text class="s" x="40" y="600.0" style="font-size:11.5px">float distance</text>
<circle cx="31" cy="615.0" r="2.2" class="ah"/>
<text class="s" x="40" y="619.0" style="font-size:11.5px">Ground effect is most realized at altitudes less</text>
<text class="s" x="40" y="634.0" style="font-size:11.5px">than the wingspan</text>
<rect x="375" y="509.0" width="335" height="24" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="385" y="526.0" style="font-size:13px">What you do</text>
<circle cx="386" cy="547.0" r="2.2" class="ah"/>
<text class="s" x="395" y="551.0" style="font-size:11.5px">Do not force the aircraft airborne with a</text>
<text class="s" x="395" y="566.0" style="font-size:11.5px">deficiency of speed; use the recommended takeoff</text>
<text class="s" x="395" y="581.0" style="font-size:11.5px">speed</text>
<circle cx="386" cy="596.0" r="2.2" class="ah"/>
<text class="s" x="395" y="600.0" style="font-size:11.5px">Never retract landing gear or flaps before a</text>
<text class="s" x="395" y="615.0" style="font-size:11.5px">positive rate of climb at a safe altitude</text>
<circle cx="386" cy="630.0" r="2.2" class="ah"/>
<text class="s" x="395" y="634.0" style="font-size:11.5px">On final, reduce power to offset the added lift, or</text>
<text class="s" x="395" y="649.0" style="font-size:11.5px">the aircraft tends to climb above the glidepath</text>
</svg>
