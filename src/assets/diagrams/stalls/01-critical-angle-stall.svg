<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 702" role="img" aria-labelledby="ti de"><title id="ti">Critical angle of attack: airflow separation and the stall</title><desc id="de">Left: a lift coefficient curve that rises with angle of attack to a peak labeled CL-MAX at the critical angle of attack, then drops rapidly. The critical angle varies from approximately 16 to 20 degrees depending on the aircraft design. Right: an airfoil below the critical angle with smooth airflow along the surface, and above it with the airflow separated from the upper surface. Cards: a stall can occur at any pitch attitude or airspeed; low speed, high speed and turning are the three common situations; the wing does not stop producing lift totally.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11.5px}.q1{font-size:13px}.q2{font-size:10.5px}.q3{stroke-width:1.6;opacity:0.85}.q4{font-size:11px}.q5{stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}.q6{stroke-width:1;opacity:.5;stroke-dasharray:4 3}.q7{stroke-width:1.6;opacity:0.8}.q8{stroke-width:1.6;opacity:0.5}.q9{fill:var(--palette-berry,#A84C6B)}.q10{stroke:currentColor;stroke-width:1.5}</style><text class="t" x="20" y="28" style="font-size:15px">Critical angle of attack: airflow separation and the stall</text><text class="s q1" x="20" y="50">A stall is a rapid decrease in lift caused by the separation of airflow from the wing's surface,</text><text class="s q1" x="20" y="66.5">brought on by exceeding the critical AOA.</text><rect class="cl" x="20" y="91" width="335" height="372" rx="8"/><text class="t q1" x="32" y="113">Lift (CL) against angle of attack</text><path d="M52 353L332 353M52 353L52 163" class="dk" style="stroke-width:1.6"/><text class="s e q2" x="332" y="369">Angle of attack</text><text class="s q2" x="58" y="171">CL</text><path d="M52 333C132 293,202 221,237 213C267 207,274 233,297 283" class="acc" style="stroke-width:3"/><path d="M237 213L237 353" class="dk" style="stroke-width:1.3;opacity:.6;stroke-dasharray:5 4"/><circle cx="237" cy="213" r="5" class="ah"/><text class="t e q0" x="229" y="203">CL-MAX</text><text class="t m q0" x="237" y="383">Critical AOA</text><text class="s q4" x="112" y="261">Lift increases with AOA</text><text class="s q4" x="245" y="323">Lift drops</text><text class="s q4" x="245" y="336">rapidly: stall</text><circle cx="35" cy="425" r="2.2" class="ah"/><text class="s q0" x="44" y="429">This critical AOA varies from approximately 16°</text><text class="s q0" x="44" y="444">to 20° depending on the aircraft's design</text><rect class="cl" x="375" y="91" width="335" height="372" rx="8"/><text class="t q1" x="387" y="113">What happens at the wing</text><text class="s q0" x="387" y="137">Below the critical AOA</text><g transform="translate(460 215) rotate(-6)"><path d="M0 0C10 -26 60 -30 150 0C80 9 20 9 0 0Z" class="sky q5"/><path d="M0 0L150 0" class="dk q6"/></g><path d="M430 171C521 161,599 161,690 171" class="dk q7"/><path d="M430 157C521 147,599 147,690 157" class="dk q8"/><path d="M430 237C521 249,599 249,690 237" class="dk" style="stroke-width:1.6;opacity:0.6"/><path d="M385 205L417 205" class="acc" style="stroke-width:2"/><path d="M424 205L417 208.2L417 201.8Z" class="dh q9"/><text class="s" x="385" y="223" style="font-size:9.5px">relative wind</text><text class="s m q2" x="530" y="269">Smooth flow follows the surface</text><text class="s q0" x="387" y="281">Above the critical AOA</text><g transform="translate(460 383) rotate(-19)"><path d="M0 0C10 -26 60 -30 150 0C80 9 20 9 0 0Z" class="sky q5"/><path d="M0 0L150 0" class="dk q6"/></g><path d="M430 323C462.9 317,491.1 317,524 323" class="dk q7"/><path d="M524 322C580 317,630 343,690 353" class="dk" style="stroke-width:1.6;opacity:.8"/><path d="M430 303C521 293,599 293,690 303" class="dk q8"/><path d="M430 397C520 401,610 397,690 391" class="dk" style="stroke-width:1.6;opacity:.6"/><path d="M538 353c9 -12 22 -4 14 8s-16 5 -8 -6" class="acc q3"/><path d="M572 357c9.9 -13.2 24.2 -4.4 15.4 8.8s-17.6 5.5 -8.8 -6.6" class="acc q3"/><path d="M610 367c9 -12 22 -4 14 8s-16 5 -8 -6" class="acc q3"/><path d="M650 373c9.9 -13.2 24.2 -4.4 15.4 8.8s-17.6 5.5 -8.8 -6.6" class="acc q3"/><path d="M385 353L417.1 359.6" class="acc" style="stroke-width:2"/><path d="M424 361L416.5 362.7L417.8 356.5Z" class="dh q9"/><text class="s" x="385" y="375" style="font-size:9.5px">relative wind</text><text class="s m q2" x="570" y="445">Airflow separates: lift falls, drag rises</text><rect x="20" y="477" width="335" height="24" rx="10" class="sky q10"/><text class="t q1" x="30" y="494">It can happen at any speed</text><circle cx="31" cy="515" r="2.2" class="ah"/><text class="s q0" x="40" y="519">A stall can occur at any pitch attitude or airspeed</text><circle cx="31" cy="534" r="2.2" class="ah"/><text class="s q0" x="40" y="538">A wing stalls at the same AOA regardless of</text><text class="s q0" x="40" y="553">airspeed, weight, load factor or density altitude</text><rect x="375" y="477" width="335" height="24" rx="10" class="lav q10"/><text class="t q1" x="385" y="494">Three common situations</text><circle cx="386" cy="515" r="2.2" class="ah"/><text class="s q0" x="395" y="519">Low speed: as airspeed falls the AOA must rise to</text><text class="s q0" x="395" y="534">hold altitude, until it exceeds the critical AOA</text><circle cx="386" cy="549" r="2.2" class="ah"/><text class="s q0" x="395" y="553">High speed: pulling back sharply in a 100-knot dive</text><text class="s q0" x="395" y="568">raises the AOA abruptly</text><circle cx="386" cy="583" r="2.2" class="ah"/><text class="s q0" x="395" y="587">Turning: the AOA must increase as the bank</text><text class="s q0" x="395" y="602">increases, and if it gets excessive the aircraft</text><text class="s q0" x="395" y="617">stalls</text><rect class="cl" x="20" y="642" width="690" height="46" rx="8"/><text class="s" x="32" y="662" style="font-size:12px">In a stall the wing does not totally stop producing lift; it cannot generate adequate lift to sustain</text><text class="s" x="32" y="677.5" style="font-size:12px">level flight. Speed by itself is not a reliable way to avoid a stall.</text></svg>
