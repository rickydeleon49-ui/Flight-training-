<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 675" role="img" aria-labelledby="ti de"><title id="ti">Wing design and how a stall progresses</title><desc id="de">Top view of a straight wing where the stall begins at the wing root and moves outward toward the wingtip, so the ailerons near the tips stay effective. Two design methods: twisting the wing to a higher angle of attack at the root, and stall strips on the first 20 to 25 percent of the leading edge. Four steps of a stall: lift falls, nose drops, angle of attack falls, smooth flow returns. Cards on wing shapes and on center of gravity and ice.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><text class="t" x="20" y="28" style="font-size:15px">Wing design and how a stall progresses</text><text class="s" x="20" y="50.0" style="font-size:13px">In most straight-wing aircraft the wing is designed to stall at the wing root first, so aileron</text><text class="s" x="20" y="66.5" style="font-size:13px">effectiveness is maintained at the wingtips.</text><rect class="cl" x="20" y="91.0" width="335" height="250" rx="8"/><text class="t" x="32" y="113.0" style="font-size:13px">Root stalls first, then the stall moves outward</text><rect x="160" y="151.0" width="40" height="150" rx="16" class="cl" style="stroke:currentColor;stroke-width:1.5"/><path d="M160 201.0L30 201.0L30 247.0L160 247.0Z" class="sky" style="stroke:currentColor;stroke-width:1.6"/><rect x="110" y="201.0" width="50" height="46" class="rose" style="stroke:currentColor;stroke-width:0;fill-opacity:.9"/><rect x="30" y="229.0" width="50" height="18" class="mint" style="stroke:currentColor;stroke-width:1.2"/><path d="M108 187.0L69.0 187.0" class="acc" style="stroke-width:2"/><path d="M62 187.0L69.0 183.8L69.0 190.2Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><path d="M200 201.0L330 201.0L330 247.0L200 247.0Z" class="sky" style="stroke:currentColor;stroke-width:1.6"/><rect x="200" y="201.0" width="50" height="46" class="rose" style="stroke:currentColor;stroke-width:0;fill-opacity:.9"/><rect x="280" y="229.0" width="50" height="18" class="mint" style="stroke:currentColor;stroke-width:1.2"/><path d="M252 187.0L291.0 187.0" class="acc" style="stroke-width:2"/><path d="M298 187.0L291.0 190.2L291.0 183.8Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><text class="t" x="30" y="269.0" style="font-size:11px">Stalled wing root</text><text class="s" x="32" y="283.0" style="font-size:10.5px">(critical AOA first)</text><text class="t e" x="332" y="269.0" style="font-size:11px">Aileron</text><text class="s e" x="332" y="282.0" style="font-size:10.5px">stays effective</text><text class="s m" x="180" y="325.0" style="font-size:10.5px">Top view, schematic</text><rect class="cl" x="375" y="91.0" width="335" height="250" rx="8"/><text class="t" x="387" y="113.0" style="font-size:13px">Two ways to make the root stall first</text><rect x="387" y="129.0" width="311" height="86" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><circle cx="407" cy="151.0" r="11" class="ah"/><text class="t m" x="407" y="155.33333333333334" style="font-size:13px;fill:#fff">1</text><text class="t" x="426" y="156.0" style="font-size:12.5px">Twist the wing</text><text class="s" x="399" y="177.0" style="font-size:11.5px">The wing is "twisted" to a higher AOA at the</text><text class="s" x="399" y="192.0" style="font-size:11.5px">wing root, so the root reaches its critical AOA</text><text class="s" x="399" y="207.0" style="font-size:11.5px">first.</text><rect x="387" y="225.0" width="311" height="100" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><circle cx="407" cy="247.0" r="11" class="ah"/><text class="t m" x="407" y="251.33333333333334" style="font-size:13px;fill:#fff">2</text><text class="t" x="426" y="252.0" style="font-size:12.5px">Install stall strips</text><text class="s" x="399" y="273.0" style="font-size:11.5px">Stall strips on the first 20 to 25 percent of</text><text class="s" x="399" y="288.0" style="font-size:11.5px">the wing's leading edge introduce a stall</text><text class="s" x="399" y="303.0" style="font-size:11.5px">prematurely.</text><rect class="cl" x="20" y="355.0" width="690" height="128" rx="8"/><text class="t" x="32" y="377.0" style="font-size:13px">What the stall does to the aircraft</text><circle cx="43" cy="401.0" r="11" class="ah"/><text class="t m" x="43" y="405.3333333333333" style="font-size:13px;fill:#fff">1</text><text class="t" x="60" y="406.0" style="font-size:12.5px">Lift falls</text><text class="s" x="32" y="423.0" style="font-size:10.5px">Lift drops below what</text><text class="s" x="32" y="437.0" style="font-size:10.5px">sustained flight needs and</text><text class="s" x="32" y="451.0" style="font-size:10.5px">the tail force becomes</text><text class="s" x="32" y="465.0" style="font-size:10.5px">ineffective</text><circle cx="214" cy="401.0" r="11" class="ah"/><text class="t m" x="214" y="405.3333333333333" style="font-size:13px;fill:#fff">2</text><text class="t" x="231" y="406.0" style="font-size:12.5px">Nose drops</text><text class="s" x="203" y="423.0" style="font-size:10.5px">An unbalanced condition</text><text class="s" x="203" y="437.0" style="font-size:10.5px">pitches the aircraft down</text><text class="s" x="203" y="451.0" style="font-size:10.5px">abruptly about its CG</text><circle cx="385" cy="401.0" r="11" class="ah"/><text class="t m" x="385" y="405.3333333333333" style="font-size:13px;fill:#fff">3</text><text class="t" x="402" y="406.0" style="font-size:12.5px">AOA falls</text><text class="s" x="374" y="423.0" style="font-size:10.5px">The AOA decreases and the</text><text class="s" x="374" y="437.0" style="font-size:10.5px">airspeed increases</text><circle cx="556" cy="401.0" r="11" class="ah"/><text class="t m" x="556" y="405.3333333333333" style="font-size:13px;fill:#fff">4</text><text class="t" x="573" y="406.0" style="font-size:12.5px">Flow returns</text><text class="s" x="545" y="423.0" style="font-size:10.5px">Smooth flow and lift return</text><text class="s" x="545" y="437.0" style="font-size:10.5px">and the aircraft flies again;</text><text class="s" x="545" y="451.0" style="font-size:10.5px">considerable altitude may be</text><text class="s" x="545" y="465.0" style="font-size:10.5px">lost</text><rect x="20" y="491.0" width="335" height="24" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30" y="508.0" style="font-size:13px">Wing shape matters</text><circle cx="31" cy="529.0" r="2.2" class="ah"/><text class="s" x="40" y="533.0" style="font-size:11px">Rectangular wing: tends to stall first at the root,</text><text class="s" x="40" y="547.5" style="font-size:11px">gives adequate stall warning and aileron</text><text class="s" x="40" y="562.0" style="font-size:11px">effectiveness, and is usually quite stable</text><circle cx="31" cy="576.5" r="2.2" class="ah"/><text class="s" x="40" y="580.5" style="font-size:11px">Elliptical wing: stall characteristics in some</text><text class="s" x="40" y="595.0" style="font-size:11px">respects inferior; gives little advance warning of a</text><text class="s" x="40" y="609.5" style="font-size:11px">complete stall and poor aileron effectiveness</text><rect x="375" y="491.0" width="335" height="24" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="385" y="508.0" style="font-size:13px">Why the nose drops, and what spoils it</text><circle cx="386" cy="529.0" r="2.2" class="ah"/><text class="s" x="395" y="533.0" style="font-size:11px">The CL is normally aft of the CG, so most training</text><text class="s" x="395" y="547.5" style="font-size:11px">aircraft pitch down in a stall, reducing the AOA and</text><text class="s" x="395" y="562.0" style="font-size:11px">"unstalling" the wing</text><circle cx="386" cy="576.5" r="2.2" class="ah"/><text class="s" x="395" y="580.5" style="font-size:11px">A CG beyond the rear limit may leave too little</text><text class="s" x="395" y="595.0" style="font-size:11px">elevator force to reduce the AOA</text><circle cx="386" cy="609.5" r="2.2" class="ah"/><text class="s" x="395" y="613.5" style="font-size:11px">Ice, snow or frost can separate the boundary layer</text><text class="s" x="395" y="628.0" style="font-size:11px">below the critical AOA; 0.8 millimeter of ice on the</text><text class="s" x="395" y="642.5" style="font-size:11px">upper wing surface cuts lift by 25 percent</text></svg>
