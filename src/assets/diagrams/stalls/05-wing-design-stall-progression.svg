<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 675" role="img" aria-labelledby="ti de"><title id="ti">Wing design and how a stall progresses</title><desc id="de">Top view of a straight wing where the stall begins at the wing root and moves outward toward the wingtip, so the ailerons near the tips stay effective. Two design methods: twisting the wing to a higher angle of attack at the root, and stall strips on the first 20 to 25 percent of the leading edge. Four steps of a stall: lift falls, nose drops, angle of attack falls, smooth flow returns. Cards on wing shapes and on center of gravity and ice.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11px}.q1{font-size:10.5px}.q2{font-size:13px}.q3{font-size:13px;fill:#fff}.q4{font-size:12.5px}.q5{font-size:11.5px}.q6{stroke:currentColor;stroke-width:1.5}.q7{stroke:currentColor;stroke-width:1.6}.q8{stroke:currentColor;stroke-width:0;fill-opacity:.9}.q9{stroke:currentColor;stroke-width:1.2}.q10{fill:var(--palette-berry,#A84C6B)}</style><text class="t" x="20" y="28" style="font-size:15px">Wing design and how a stall progresses</text><text class="s q2" x="20" y="50">In most straight-wing aircraft the wing is designed to stall at the wing root first, so aileron</text><text class="s q2" x="20" y="66.5">effectiveness is maintained at the wingtips.</text><rect class="cl" x="20" y="91" width="335" height="250" rx="8"/><text class="t q2" x="32" y="113">Root stalls first, then the stall moves outward</text><rect x="160" y="151" width="40" height="150" rx="16" class="cl q6"/><path d="M160 201L30 201L30 247L160 247Z" class="sky q7"/><rect x="110" y="201" width="50" height="46" class="rose q8"/><rect x="30" y="229" width="50" height="18" class="mint q9"/><path d="M108 187L69 187" class="acc" style="stroke-width:2"/><path d="M62 187L69 183.8L69 190.2Z" class="dh q10"/><path d="M200 201L330 201L330 247L200 247Z" class="sky q7"/><rect x="200" y="201" width="50" height="46" class="rose q8"/><rect x="280" y="229" width="50" height="18" class="mint q9"/><path d="M252 187L291 187" class="acc" style="stroke-width:2"/><path d="M298 187L291 190.2L291 183.8Z" class="dh q10"/><text class="t q0" x="30" y="269">Stalled wing root</text><text class="s q1" x="32" y="283">(critical AOA first)</text><text class="t e q0" x="332" y="269">Aileron</text><text class="s e q1" x="332" y="282">stays effective</text><text class="s m q1" x="180" y="325">Top view, schematic</text><rect class="cl" x="375" y="91" width="335" height="250" rx="8"/><text class="t q2" x="387" y="113">Two ways to make the root stall first</text><rect x="387" y="129" width="311" height="86" rx="10" class="lav q6"/><circle cx="407" cy="151" r="11" class="ah"/><text class="t m q3" x="407" y="155.33">1</text><text class="t q4" x="426" y="156">Twist the wing</text><text class="s q5" x="399" y="177">The wing is "twisted" to a higher AOA at the</text><text class="s q5" x="399" y="192">wing root, so the root reaches its critical AOA</text><text class="s q5" x="399" y="207">first.</text><rect x="387" y="225" width="311" height="100" rx="10" class="mint q6"/><circle cx="407" cy="247" r="11" class="ah"/><text class="t m q3" x="407" y="251.33">2</text><text class="t q4" x="426" y="252">Install stall strips</text><text class="s q5" x="399" y="273">Stall strips on the first 20 to 25 percent of</text><text class="s q5" x="399" y="288">the wing's leading edge introduce a stall</text><text class="s q5" x="399" y="303">prematurely.</text><rect class="cl" x="20" y="355" width="690" height="128" rx="8"/><text class="t q2" x="32" y="377">What the stall does to the aircraft</text><circle cx="43" cy="401" r="11" class="ah"/><text class="t m q3" x="43" y="405.33">1</text><text class="t q4" x="60" y="406">Lift falls</text><text class="s q1" x="32" y="423">Lift drops below what</text><text class="s q1" x="32" y="437">sustained flight needs and</text><text class="s q1" x="32" y="451">the tail force becomes</text><text class="s q1" x="32" y="465">ineffective</text><circle cx="214" cy="401" r="11" class="ah"/><text class="t m q3" x="214" y="405.33">2</text><text class="t q4" x="231" y="406">Nose drops</text><text class="s q1" x="203" y="423">An unbalanced condition</text><text class="s q1" x="203" y="437">pitches the aircraft down</text><text class="s q1" x="203" y="451">abruptly about its CG</text><circle cx="385" cy="401" r="11" class="ah"/><text class="t m q3" x="385" y="405.33">3</text><text class="t q4" x="402" y="406">AOA falls</text><text class="s q1" x="374" y="423">The AOA decreases and the</text><text class="s q1" x="374" y="437">airspeed increases</text><circle cx="556" cy="401" r="11" class="ah"/><text class="t m q3" x="556" y="405.33">4</text><text class="t q4" x="573" y="406">Flow returns</text><text class="s q1" x="545" y="423">Smooth flow and lift return</text><text class="s q1" x="545" y="437">and the aircraft flies again;</text><text class="s q1" x="545" y="451">considerable altitude may be</text><text class="s q1" x="545" y="465">lost</text><rect x="20" y="491" width="335" height="24" rx="10" class="sky q6"/><text class="t q2" x="30" y="508">Wing shape matters</text><circle cx="31" cy="529" r="2.2" class="ah"/><text class="s q0" x="40" y="533">Rectangular wing: tends to stall first at the root,</text><text class="s q0" x="40" y="547.5">gives adequate stall warning and aileron</text><text class="s q0" x="40" y="562">effectiveness, and is usually quite stable</text><circle cx="31" cy="576.5" r="2.2" class="ah"/><text class="s q0" x="40" y="580.5">Elliptical wing: stall characteristics in some</text><text class="s q0" x="40" y="595">respects inferior; gives little advance warning of a</text><text class="s q0" x="40" y="609.5">complete stall and poor aileron effectiveness</text><rect x="375" y="491" width="335" height="24" rx="10" class="rose q6"/><text class="t q2" x="385" y="508">Why the nose drops, and what spoils it</text><circle cx="386" cy="529" r="2.2" class="ah"/><text class="s q0" x="395" y="533">The CL is normally aft of the CG, so most training</text><text class="s q0" x="395" y="547.5">aircraft pitch down in a stall, reducing the AOA and</text><text class="s q0" x="395" y="562">"unstalling" the wing</text><circle cx="386" cy="576.5" r="2.2" class="ah"/><text class="s q0" x="395" y="580.5">A CG beyond the rear limit may leave too little</text><text class="s q0" x="395" y="595">elevator force to reduce the AOA</text><circle cx="386" cy="609.5" r="2.2" class="ah"/><text class="s q0" x="395" y="613.5">Ice, snow or frost can separate the boundary layer</text><text class="s q0" x="395" y="628">below the critical AOA; 0.8 millimeter of ice on the</text><text class="s q0" x="395" y="642.5">upper wing surface cuts lift by 25 percent</text></svg>
