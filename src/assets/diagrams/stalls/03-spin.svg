<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 565" role="img" aria-labelledby="ti de"><title id="ti">Spin: an aggravated stall with rotation</title><desc id="de">Left: a helical corkscrew path descending. Right: a stall compared with a stabilized spin. A spin is not different from a stall in any element other than rotation; airspeed is usually within 2 knots of the unaccelerated stalling speeds, the aircraft pivots rather than turns, the load factor is usually slightly above 1 G, and a proper recovery is usually about 2.5 Gs. Cards: recovery gets harder as the center of gravity moves aft, and a flat spin develops when it is too far back; half of maneuvering phase fatal accidents involve stall or spin scenarios.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style>
<text class="t" x="20" y="28" style="font-size:15px">Spin: an aggravated stall with rotation</text>
<text class="s" x="20" y="50.0" style="font-size:13px">A spin is an aggravated stall that results in an airplane descending in a helical, or corkscrew, path.</text>
<rect class="cl" x="20" y="74.5" width="250" height="282" rx="8"/>
<text class="t" x="32" y="96.5" style="font-size:13px">Corkscrew path</text>
<path d="M187.0 124.5L186.8 126.9L186.1 129.2L184.9 131.5L183.4 133.8L181.4 136.0L179.0 138.1L176.2 140.1L173.1 142.0L169.7 143.8L166.0 145.5L162.1 147.1L158.0 148.5L153.7 149.8L149.4 150.9L145.0 151.9L140.6 152.7L136.3 153.3L132.0 153.8L127.9 154.2L124.0 154.4L120.3 154.5L116.9 154.5L113.8 154.3L111.0 154.1L108.6 153.8L106.6 153.3L105.1 152.9L103.9 152.3L103.2 151.8L103.0 151.2L103.2 150.6L103.9 150.1L105.1 149.5L106.6 149.1L108.6 148.7L111.0 148.3L113.8 148.1L116.9 147.9L120.3 147.9L124.0 148.0L127.9 148.2L132.0 148.6L136.3 149.1L140.6 149.7L145.0 150.6L149.4 151.5L153.7 152.6L158.0 153.9L162.1 155.3L166.0 156.9L169.7 158.6L173.1 160.4L176.2 162.3L179.0 164.3L181.4 166.5L183.4 168.7L184.9 170.9L186.1 173.2L186.8 175.6L187.0 177.9L186.8 180.3L186.1 182.6L184.9 184.9L183.4 187.2L181.4 189.4L179.0 191.5L176.2 193.5L173.1 195.4L169.7 197.2L166.0 198.9L162.1 200.5L158.0 201.9L153.7 203.2L149.4 204.3L145.0 205.3L140.6 206.1L136.3 206.7L132.0 207.2L127.9 207.6L124.0 207.8L120.3 207.9L116.9 207.9L113.8 207.7L111.0 207.5L108.6 207.2L106.6 206.7L105.1 206.3L103.9 205.7L103.2 205.2L103.0 204.6L103.2 204.0L103.9 203.5L105.1 203.0L106.6 202.5L108.6 202.1L111.0 201.7L113.8 201.5L116.9 201.3L120.3 201.3L124.0 201.4L127.9 201.6L132.0 202.0L136.3 202.5L140.6 203.1L145.0 204.0L149.4 204.9L153.7 206.0L158.0 207.3L162.1 208.7L166.0 210.3L169.7 212.0L173.1 213.8L176.2 215.7L179.0 217.7L181.4 219.9L183.4 222.1L184.9 224.3L186.1 226.6L186.8 229.0L187.0 231.3L186.8 233.7L186.1 236.0L184.9 238.3L183.4 240.6L181.4 242.8L179.0 244.9L176.2 246.9L173.1 248.8L169.7 250.7L166.0 252.3L162.1 253.9L158.0 255.3L153.7 256.6L149.4 257.7L145.0 258.7L140.6 259.5L136.3 260.1L132.0 260.7L127.9 261.0L124.0 261.2L120.3 261.3L116.9 261.3L113.8 261.2L111.0 260.9L108.6 260.6L106.6 260.2L105.1 259.7L103.9 259.1L103.2 258.6L103.0 258.0L103.2 257.4L103.9 256.9L105.1 256.4L106.6 255.9L108.6 255.5L111.0 255.1L113.8 254.9L116.9 254.7L120.3 254.7L124.0 254.8L127.9 255.0L132.0 255.4L136.3 255.9L140.6 256.6L145.0 257.4L149.4 258.3L153.7 259.5L158.0 260.7L162.1 262.1L166.0 263.7L169.7 265.4L173.1 267.2L176.2 269.1L179.0 271.2L181.4 273.3L183.4 275.5L184.9 277.7L186.1 280.0L186.8 282.4L187.0 284.7" class="acc" style="stroke-width:2.5"/>
<path d="M187.0 284.7l-7 -8l14 0z" class="ah" transform="rotate(180 187.0 284.7) translate(0 -4)"/>
<path d="M145 110.5L145 314.7212253330795" class="dk" style="stroke-width:1.2;opacity:.5;stroke-dasharray:5 4"/>
<text class="s" x="32" y="328.5" style="font-size:11px">Airspeed very low, nose well down</text>
<text class="s" x="32" y="342.5" style="font-size:11px">The aircraft pivots rather than turns</text>
<rect class="cl" x="290" y="74.5" width="420" height="282" rx="8"/>
<text class="t" x="302" y="96.5" style="font-size:13px">Stall and spin compared</text>
<text class="t" x="302" y="122.5" style="font-size:12.5px">Stall</text>
<text class="t" x="500" y="122.5" style="font-size:12.5px">Stabilized spin</text>
<circle cx="305" cy="134.5" r="2.2" class="ah"/>
<text class="s" x="314" y="138.5" style="font-size:11.5px">Airflow separates when the</text>
<text class="s" x="314" y="153.5" style="font-size:11.5px">critical AOA is exceeded</text>
<circle cx="305" cy="168.5" r="2.2" class="ah"/>
<text class="s" x="314" y="172.5" style="font-size:11.5px">Lift drops rapidly</text>
<circle cx="305" cy="187.5" r="2.2" class="ah"/>
<text class="s" x="314" y="191.5" style="font-size:11.5px">Normal stall from level</text>
<text class="s" x="314" y="206.5" style="font-size:11.5px">flight: load factor stays at</text>
<text class="s" x="314" y="221.5" style="font-size:11.5px">1 G, then may fall toward</text>
<text class="s" x="314" y="236.5" style="font-size:11.5px">zero</text>
<circle cx="503" cy="134.5" r="2.2" class="ah"/>
<text class="s" x="512" y="138.5" style="font-size:11.5px">Not different from a stall in</text>
<text class="s" x="512" y="153.5" style="font-size:11.5px">any element other than rotation</text>
<circle cx="503" cy="168.5" r="2.2" class="ah"/>
<text class="s" x="512" y="172.5" style="font-size:11.5px">Airspeed usually within 2 knots</text>
<text class="s" x="512" y="187.5" style="font-size:11.5px">of the unaccelerated stalling</text>
<text class="s" x="512" y="202.5" style="font-size:11.5px">speeds</text>
<circle cx="503" cy="217.5" r="2.2" class="ah"/>
<text class="s" x="512" y="221.5" style="font-size:11.5px">Load factor usually slightly</text>
<text class="s" x="512" y="236.5" style="font-size:11.5px">above 1 G</text>
<path d="M495 108.5L495 262.5" class="dk" style="stroke-width:1;opacity:.4"/>
<rect x="302" y="272.5" width="396" height="68" rx="8" class="mint" style="stroke:currentColor;stroke-width:1.4"/>
<text class="s" x="314" y="294.5" style="font-size:12px">Spin recovery is usually made with the nose much lower than</text>
<text class="s" x="314" y="310.0" style="font-size:12px">in a stall recovery, so expect higher airspeeds and higher</text>
<text class="s" x="314" y="325.5" style="font-size:12px">load factors: usually about 2.5 Gs in a proper recovery.</text>
<rect x="20" y="370.5" width="335" height="24" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="30" y="387.5" style="font-size:13px">Aft CG makes recovery harder</text>
<circle cx="31" cy="408.5" r="2.2" class="ah"/>
<text class="s" x="40" y="412.5" style="font-size:11.5px">Recovery from a stall becomes progressively more</text>
<text class="s" x="40" y="427.5" style="font-size:11.5px">difficult as the CG moves aft</text>
<circle cx="31" cy="442.5" r="2.2" class="ah"/>
<text class="s" x="40" y="446.5" style="font-size:11.5px">This is particularly important in spin recovery</text>
<circle cx="31" cy="461.5" r="2.2" class="ah"/>
<text class="s" x="40" y="465.5" style="font-size:11.5px">At some point in rearward loading a "flat" spin</text>
<text class="s" x="40" y="480.5" style="font-size:11.5px">develops</text>
<rect x="375" y="370.5" width="335" height="24" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="385" y="387.5" style="font-size:13px">Flat spin</text>
<circle cx="386" cy="408.5" r="2.2" class="ah"/>
<text class="s" x="395" y="412.5" style="font-size:11.5px">Centrifugal force acting through a CG well to the</text>
<text class="s" x="395" y="427.5" style="font-size:11.5px">rear pulls the tail out away from the axis of the</text>
<text class="s" x="395" y="442.5" style="font-size:11.5px">spin</text>
<circle cx="386" cy="457.5" r="2.2" class="ah"/>
<text class="s" x="395" y="461.5" style="font-size:11.5px">That makes it impossible to get the nose down and</text>
<text class="s" x="395" y="476.5" style="font-size:11.5px">recover</text>
<rect class="cl" x="20" y="505.5" width="690" height="46" rx="8"/>
<text class="s" x="32" y="525.5" style="font-size:12px">Of general aviation fatal accidents in the maneuvering phase of flight, half involve stall/spin scenarios.</text>
<text class="s" x="32" y="541.0" style="font-size:12px">Prevent the spin by preventing the stall.</text>
</svg>
