<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 790" role="img" aria-labelledby="ti de"><title id="ti">The FAA: rules, places and who you deal with</title><desc id="de">The FAA writes safety standards under Title 14 of the Code of Federal Regulations: part 61 for pilot certification, part 91 for flight rules, part 43 for maintenance. Headquarters is in Washington, DC with nine regions, the Mike Monroney Aeronautical Center and the William J. Hughes Technical Center. Flight Standards Service works with the public through about 80 FSDOs staffed by about 3,700 Aviation Safety Inspectors. Help is available at 1-866-TELL-FAA and www.faa.gov.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:12px}.q1{font-size:13px}.q2{stroke:currentColor;stroke-width:1.5}</style><text class="t" x="20" y="28" style="font-size:15px">The FAA: rules, places and who you deal with</text><text class="s q1" x="20" y="50">How PHAK Chapter 1 describes the rules the FAA works under, where it is, and the office a pilot</text><text class="s q1" x="20" y="66.5">actually contacts.</text><rect x="20" y="91" width="220" height="24" rx="10" class="lav q2"/><text class="t q1" x="30" y="108">The rules</text><circle cx="31" cy="129" r="2.2" class="ah"/><text class="s q0" x="40" y="133">FAA regulations promote</text><text class="s q0" x="40" y="148.5">aviation safety and set safety</text><text class="s q0" x="40" y="164">standards for civil aviation</text><circle cx="31" cy="179.5" r="2.2" class="ah"/><text class="s q0" x="40" y="183.5">They sit in the Code of</text><text class="s q0" x="40" y="199">Federal Regulations, 50</text><text class="s q0" x="40" y="214.5">Titles; Title 14 is</text><text class="s q0" x="40" y="230">"Aeronautics and Space"</text><circle cx="31" cy="245.5" r="2.2" class="ah"/><text class="s q0" x="40" y="249.5">Part 61: certification of</text><text class="s q0" x="40" y="265">pilots, flight instructors and</text><text class="s q0" x="40" y="280.5">ground instructors</text><circle cx="31" cy="296" r="2.2" class="ah"/><text class="s q0" x="40" y="300">Part 91: general flight rules,</text><text class="s q0" x="40" y="315.5">VFR and IFR</text><circle cx="31" cy="331" r="2.2" class="ah"/><text class="s q0" x="40" y="335">Part 43: maintenance,</text><text class="s q0" x="40" y="350.5">preventive maintenance,</text><text class="s q0" x="40" y="366">rebuilding and alterations</text><rect x="255" y="91" width="220" height="24" rx="10" class="sky q2"/><text class="t q1" x="265" y="108">The places</text><circle cx="266" cy="129" r="2.2" class="ah"/><text class="s q0" x="275" y="133">Headquarters in Washington,</text><text class="s q0" x="275" y="148.5">DC, and nine regional offices</text><circle cx="266" cy="164" r="2.2" class="ah"/><text class="s q0" x="275" y="168">Mike Monroney Aeronautical</text><text class="s q0" x="275" y="183.5">Center, Oklahoma City:</text><text class="s q0" x="275" y="199">training and logistics</text><text class="s q0" x="275" y="214.5">services</text><circle cx="266" cy="230" r="2.2" class="ah"/><text class="s q0" x="275" y="234">William J. Hughes Technical</text><text class="s q0" x="275" y="249.5">Center, Atlantic City:</text><text class="s q0" x="275" y="265">research, development, test</text><text class="s q0" x="275" y="280.5">and evaluation</text><circle cx="266" cy="296" r="2.2" class="ah"/><text class="s q0" x="275" y="300">Each of the nine regions has a</text><text class="s q0" x="275" y="315.5">Regional FAASTeam Office</text><rect x="490" y="91" width="220" height="24" rx="10" class="mint q2"/><text class="t q1" x="500" y="108">Getting help</text><circle cx="501" cy="129" r="2.2" class="ah"/><text class="s q0" x="510" y="133">Toll free, 24 hours a day:</text><text class="s q0" x="510" y="148.5">1-866-TELL-FAA</text><text class="s q0" x="510" y="164">(1-866-835-5322)</text><circle cx="501" cy="179.5" r="2.2" class="ah"/><text class="s q0" x="510" y="183.5">Website: www.faa.gov</text><circle cx="501" cy="199" r="2.2" class="ah"/><text class="s q0" x="510" y="203">E-mail a local FSDO through</text><text class="s q0" x="510" y="218.5">the Contact FAA link on the</text><text class="s q0" x="510" y="234">home page</text><circle cx="501" cy="249.5" r="2.2" class="ah"/><text class="s q0" x="510" y="253.5">Mail: 800 Independence Ave,</text><text class="s q0" x="510" y="269">SW, Washington, DC 20591</text><text class="t" x="20" y="403.5" style="font-size:13.5px">Who a pilot deals with, from the top down</text><rect x="20" y="417.5" width="690" height="71" rx="10" class="sky q2"/><text class="t m q1" x="365" y="439.5">Flight Standards Service</text><text class="s m q0" x="365" y="457.5">Sets the standards for certification and oversight of airmen, air operators, air agencies and designees;</text><text class="s m q0" x="365" y="473">also manages registration of civil aircraft and all airmen records</text><path d="M365 488.5L365 495.5" class="dk" style="stroke-width:2"/><path d="M365 502.5L361.9 495.5L368.1 495.5Z" class="dh" style=""/><rect x="20" y="502.5" width="690" height="71" rx="10" class="lav q2"/><text class="t m q1" x="365" y="524.5">Flight Standards District Office (FSDO), about 80 of them</text><text class="s m q0" x="365" y="542.5">The focus of contact with the public; handles accident investigation, enforcement, and certification and</text><text class="s m q0" x="365" y="558">surveillance of flight schools and airmen</text><path d="M365 573.5L365 580.5" class="dk" style="stroke-width:2"/><path d="M365 587.5L361.9 580.5L368.1 580.5Z" class="dh" style=""/><rect x="20" y="587.5" width="690" height="71" rx="10" class="mint q2"/><text class="t m q1" x="365" y="609.5">Aviation Safety Inspectors (ASIs), about 3,700</text><text class="s m q0" x="365" y="627.5">Trained at the FAA Academy in Oklahoma City; administer and enforce safety standards, inspect, and give</text><text class="s m q0" x="365" y="643">practical tests. All questions on pilot certification go to the local FSDO</text><rect class="cl" x="20" y="672.5" width="690" height="104" rx="8"/><circle cx="35" cy="694.5" r="2.2" class="ah"/><text class="s q0" x="44" y="698.5">FAA Safety Team (FAASTeam): works with individuals and industry to reduce accidents; courses and joining</text><text class="s q0" x="44" y="714">at www.faasafety.gov</text><circle cx="35" cy="729.5" r="2.2" class="ah"/><text class="s q0" x="44" y="733.5">Other FAA material: Aeronautical Information Manual (AIM), Advisory Circulars (not regulations) and</text><text class="s q0" x="44" y="749">handbooks</text></svg>
