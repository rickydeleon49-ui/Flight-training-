<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 919" role="img" aria-labelledby="ti de"><title id="ti">From student pilot to the practical test</title><desc id="de">Seven steps: choose an aircraft type, get a medical certificate, get a Student Pilot Certificate (age 16, or 14 for glider or balloon), train with a CFI, fly solo with a logbook endorsement, pass the computer knowledge test, then the practical test given by an ASI or DPE. The applicant brings Form 8710-1, the knowledge test report, medical, student certificate, logbook endorsements and the aircraft documents.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><text class="t" x="20" y="28" style="font-size:15px">From student pilot to the practical test</text><text class="s" x="20" y="50.0" style="font-size:13px">The path PHAK Chapter 1 lays out, in order. The CFI is the one who decides when the student is ready</text><text class="s" x="20" y="66.5" style="font-size:13px">for each test.</text><rect x="20" y="91.0" width="690" height="63.0" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><circle cx="42" cy="113.0" r="11" class="ah"/><text class="t m" x="42" y="117.33333333333333" style="font-size:13px;fill:#fff">1</text><text class="t" x="62" y="113.0" style="font-size:13px">Choose a type of aircraft</text><text class="s" x="62" y="131.0" style="font-size:12px">Airplanes, gyroplanes, weight-shift, helicopters, powered parachutes, gliders, balloons or airships;</text><text class="s" x="62" y="146.5" style="font-size:12px">the FAA rules differ by type. No certificate is needed to fly ultralight vehicles.</text><path d="M365 154.0L365.0 161.0" class="dk" style="stroke-width:2"/><path d="M365 168.0L361.9 161.0L368.1 161.0Z" class="dh" style=""/><rect x="20" y="168.0" width="690" height="63.0" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><circle cx="42" cy="190.0" r="11" class="ah"/><text class="t m" x="42" y="194.33333333333334" style="font-size:13px;fill:#fff">2</text><text class="t" x="62" y="190.0" style="font-size:13px">Get a medical certificate (airplane, helicopter, gyroplane, airship)</text><text class="s" x="62" y="208.0" style="font-size:12px">Passed with an FAA-authorized AME; the FAA suggests getting it before training starts. Sport pilots</text><text class="s" x="62" y="223.5" style="font-size:12px">may use a driver license. Balloon and glider pilots write a no-defect statement.</text><path d="M365 231.0L365.0 238.0" class="dk" style="stroke-width:2"/><path d="M365 245.0L361.9 238.0L368.1 238.0Z" class="dh" style=""/><rect x="20" y="245.0" width="690" height="78.5" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><circle cx="42" cy="267.0" r="11" class="ah"/><text class="t m" x="42" y="271.3333333333333" style="font-size:13px;fill:#fff">3</text><text class="t" x="62" y="267.0" style="font-size:13px">Student Pilot Certificate</text><text class="s" x="62" y="285.0" style="font-size:12px">Applicant is at least 16 (14 for glider or balloon) and reads, speaks, writes and understands</text><text class="s" x="62" y="300.5" style="font-size:12px">English. Processed by an FAA inspector or technician, a DPE, a CFI or an ACR; sent in through IACRA.</text><text class="s" x="62" y="316.0" style="font-size:12px">A plastic card with no expiration date; only needed to exercise solo privileges.</text><path d="M365 323.5L365.0 330.5" class="dk" style="stroke-width:2"/><path d="M365 337.5L361.9 330.5L368.1 330.5Z" class="dh" style=""/><rect x="20" y="337.5" width="690" height="78.5" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><circle cx="42" cy="359.5" r="11" class="ah"/><text class="t m" x="42" y="363.8333333333333" style="font-size:13px;fill:#fff">4</text><text class="t" x="62" y="359.5" style="font-size:13px">Ground and flight training</text><text class="s" x="62" y="377.5" style="font-size:12px">Knowledge from FAA handbooks, textbooks and other sources. Each maneuver has four steps: the CFI</text><text class="s" x="62" y="393.0" style="font-size:12px">demonstrates it, talks the student through it, the student practices under supervision, then the CFI</text><text class="s" x="62" y="408.5" style="font-size:12px">authorizes solo practice.</text><path d="M365 416.0L365.0 423.0" class="dk" style="stroke-width:2"/><path d="M365 430.0L361.9 423.0L368.1 423.0Z" class="dh" style=""/><rect x="20" y="430.0" width="690" height="63.0" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/><circle cx="42" cy="452.0" r="11" class="ah"/><text class="t m" x="42" y="456.3333333333333" style="font-size:13px;fill:#fff">5</text><text class="t" x="62" y="452.0" style="font-size:13px">Solo flight</text><text class="s" x="62" y="470.0" style="font-size:12px">A CFI endorses the student logbook for limited solo flight in a specific make and model. No</text><text class="s" x="62" y="485.5" style="font-size:12px">passengers, no flight in furtherance of a business, and nothing outside the endorsements.</text><path d="M365 493.0L365.0 500.0" class="dk" style="stroke-width:2"/><path d="M365 507.0L361.9 500.0L368.1 500.0Z" class="dh" style=""/><rect x="20" y="507.0" width="690" height="63.0" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><circle cx="42" cy="529.0" r="11" class="ah"/><text class="t m" x="42" y="533.3333333333334" style="font-size:13px;fill:#fff">6</text><text class="t" x="62" y="529.0" style="font-size:13px">Knowledge test</text><text class="s" x="62" y="547.0" style="font-size:12px">Computer-based, objective multiple choice. The FAA recommends taking it after a solo cross-country</text><text class="s" x="62" y="562.5" style="font-size:12px">flight, and the CFI decides when the student is ready.</text><path d="M365 570.0L365.0 577.0" class="dk" style="stroke-width:2"/><path d="M365 584.0L361.9 577.0L368.1 577.0Z" class="dh" style=""/><rect x="20" y="584.0" width="690" height="94.0" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><circle cx="42" cy="606.0" r="11" class="ah"/><text class="t m" x="42" y="610.3333333333334" style="font-size:13px;fill:#fff">7</text><text class="t" x="62" y="606.0" style="font-size:13px">Practical test (PTS, moving to ACS)</text><text class="s" x="62" y="624.0" style="font-size:12px">After proficiency and the required hours, the CFI endorses the logbook for the knowledge and</text><text class="s" x="62" y="639.5" style="font-size:12px">practical tests. Given by an FAA ASI or a DPE; a DPE may charge a reasonable fee, an FAA inspector</text><text class="s" x="62" y="655.0" style="font-size:12px">does not. All tasks in the areas of operation must be shown, from preflight preparation to</text><text class="s" x="62" y="670.5" style="font-size:12px">postflight procedures.</text><rect x="20" y="692.0" width="337" height="24" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30" y="709.0" style="font-size:13px">Applicant brings</text><circle cx="31" cy="730.0" r="2.2" class="ah"/><text class="s" x="40" y="734.0" style="font-size:12px">FAA Form 8710-1 (8710.11 for sport pilot) with</text><text class="s" x="40" y="749.5" style="font-size:12px">the instructor recommendation</text><circle cx="31" cy="765.0" r="2.2" class="ah"/><text class="s" x="40" y="769.0" style="font-size:12px">Airman Knowledge Test Report with a satisfactory</text><text class="s" x="40" y="784.5" style="font-size:12px">grade</text><circle cx="31" cy="800.0" r="2.2" class="ah"/><text class="s" x="40" y="804.0" style="font-size:12px">Medical certificate (not for glider or balloon),</text><text class="s" x="40" y="819.5" style="font-size:12px">Student Pilot Certificate, and logbook endorsed</text><text class="s" x="40" y="835.0" style="font-size:12px">for solo, solo cross-country and the make and</text><text class="s" x="40" y="850.5" style="font-size:12px">model</text><circle cx="31" cy="866.0" r="2.2" class="ah"/><text class="s" x="40" y="870.0" style="font-size:12px">Graduation certificate from an FAA-approved</text><text class="s" x="40" y="885.5" style="font-size:12px">school, if applicable</text><rect x="373" y="692.0" width="337" height="24" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="383" y="709.0" style="font-size:13px">And for the aircraft</text><circle cx="384" cy="730.0" r="2.2" class="ah"/><text class="s" x="393" y="734.0" style="font-size:12px">An airworthy aircraft with equipment for the test</text><circle cx="384" cy="749.5" r="2.2" class="ah"/><text class="s" x="393" y="753.5" style="font-size:12px">Registration certificate and airworthiness</text><text class="s" x="393" y="769.0" style="font-size:12px">certificate</text><circle cx="384" cy="784.5" r="2.2" class="ah"/><text class="s" x="393" y="788.5" style="font-size:12px">Operating limitations or approved flight manual</text><circle cx="384" cy="804.0" r="2.2" class="ah"/><text class="s" x="393" y="808.0" style="font-size:12px">Equipment list, weight and balance data,</text><text class="s" x="393" y="823.5" style="font-size:12px">maintenance records and applicable ADs</text></svg>
