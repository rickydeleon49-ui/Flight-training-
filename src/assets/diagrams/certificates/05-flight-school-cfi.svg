<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 647" role="img" aria-labelledby="ti de"><title id="ti">Finding a flight school and a CFI</title><desc id="de">Flight training is done under 14 CFR part 142 training centers, part 141 certificated pilot schools, or part 61 noncertificated schools and individual instructors. Part 141 minimum for a private certificate is 35 hours against 40 under part 61. To find a program, contact the local FSDO, use the FAA Pilot School Search database, visit schools and make a checklist of questions. A CFI should understand learning, teaching and communication; the student should change instructors if it is not working.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style>
<text class="t" x="20" y="28" style="font-size:15px">Finding a flight school and a CFI</text>
<text class="s" x="20" y="50.0" style="font-size:13px">Three kinds of training provider, and the checks PHAK suggests before committing. All flight training</text>
<text class="s" x="20" y="66.5" style="font-size:13px">runs under 14 CFR parts 142, 141 or 61.</text>
<rect x="20" y="91.0" width="220" height="24" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="30" y="108.0" style="font-size:13px">Part 142 training center</text>
<circle cx="31" cy="129.0" r="2.2" class="ah"/>
<text class="s" x="40" y="133.0" style="font-size:12px">Also called a flight academy;</text>
<text class="s" x="40" y="148.5" style="font-size:12px">certificated by the FAA;</text>
<text class="s" x="40" y="164.0" style="font-size:12px">applying is voluntary</text>
<circle cx="31" cy="179.5" r="2.2" class="ah"/>
<text class="s" x="40" y="183.5" style="font-size:12px">Strict requirements for</text>
<text class="s" x="40" y="199.0" style="font-size:12px">people, equipment, maintenance</text>
<text class="s" x="40" y="214.5" style="font-size:12px">and facilities; FAA-approved</text>
<text class="s" x="40" y="230.0" style="font-size:12px">curriculum</text>
<circle cx="31" cy="245.5" r="2.2" class="ah"/>
<text class="s" x="40" y="249.5" style="font-size:12px">Uses flight simulation</text>
<text class="s" x="40" y="265.0" style="font-size:12px">training devices</text>
<circle cx="31" cy="280.5" r="2.2" class="ah"/>
<text class="s" x="40" y="284.5" style="font-size:12px">Mostly under contract to</text>
<text class="s" x="40" y="300.0" style="font-size:12px">airlines in transport or</text>
<text class="s" x="40" y="315.5" style="font-size:12px">turbine aircraft; many also</text>
<text class="s" x="40" y="331.0" style="font-size:12px">train private, commercial,</text>
<text class="s" x="40" y="346.5" style="font-size:12px">instrument and ATP</text>
<rect x="255" y="91.0" width="220" height="24" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="265" y="108.0" style="font-size:13px">Part 141 pilot school</text>
<circle cx="266" cy="129.0" r="2.2" class="ah"/>
<text class="s" x="275" y="133.0" style="font-size:12px">Certificated by the FAA;</text>
<text class="s" x="275" y="148.5" style="font-size:12px">voluntary; established</text>
<text class="s" x="275" y="164.0" style="font-size:12px">curriculum with an</text>
<text class="s" x="275" y="179.5" style="font-size:12px">FAA-approved training course</text>
<text class="s" x="275" y="195.0" style="font-size:12px">outline</text>
<circle cx="266" cy="210.5" r="2.2" class="ah"/>
<text class="s" x="275" y="214.5" style="font-size:12px">May hold ground and flight</text>
<text class="s" x="275" y="230.0" style="font-size:12px">school ratings and may give</text>
<text class="s" x="275" y="245.5" style="font-size:12px">practical and knowledge tests</text>
<circle cx="266" cy="261.0" r="2.2" class="ah"/>
<text class="s" x="275" y="265.0" style="font-size:12px">Structured and documented, so</text>
<text class="s" x="275" y="280.5" style="font-size:12px">certificates can take fewer</text>
<text class="s" x="275" y="296.0" style="font-size:12px">hours</text>
<circle cx="266" cy="311.5" r="2.2" class="ah"/>
<text class="s" x="275" y="315.5" style="font-size:12px">Private pilot minimum: 35 h at</text>
<text class="s" x="275" y="331.0" style="font-size:12px">part 141, 40 h at part 61;</text>
<text class="s" x="275" y="346.5" style="font-size:12px">national average 60 to 75 h</text>
<rect x="490" y="91.0" width="220" height="24" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="500" y="108.0" style="font-size:13px">Part 61 school or CFI</text>
<circle cx="501" cy="129.0" r="2.2" class="ah"/>
<text class="s" x="510" y="133.0" style="font-size:12px">Noncertificated schools and</text>
<text class="s" x="510" y="148.5" style="font-size:12px">individual instructors</text>
<circle cx="501" cy="164.0" r="2.2" class="ah"/>
<text class="s" x="510" y="168.0" style="font-size:12px">Part 61 sets the minimum</text>
<text class="s" x="510" y="183.5" style="font-size:12px">experience and knowledge; it</text>
<text class="s" x="510" y="199.0" style="font-size:12px">does not say how to organise</text>
<text class="s" x="510" y="214.5" style="font-size:12px">it</text>
<circle cx="501" cy="230.0" r="2.2" class="ah"/>
<text class="s" x="510" y="234.0" style="font-size:12px">Flexible: lessons fit the</text>
<text class="s" x="510" y="249.5" style="font-size:12px">student</text>
<circle cx="501" cy="265.0" r="2.2" class="ah"/>
<text class="s" x="510" y="269.0" style="font-size:12px">Risk: a poorly organised</text>
<text class="s" x="510" y="284.5" style="font-size:12px">instructor can cost time and</text>
<text class="s" x="510" y="300.0" style="font-size:12px">money; ask for a</text>
<text class="s" x="510" y="315.5" style="font-size:12px">well-documented training</text>
<text class="s" x="510" y="331.0" style="font-size:12px">syllabus</text>
<rect x="20" y="370.0" width="337" height="24" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="30" y="387.0" style="font-size:13px">How to find a reputable program</text>
<circle cx="31" cy="408.0" r="2.2" class="ah"/>
<text class="s" x="40" y="412.0" style="font-size:12px">Contact the local FSDO; it keeps a current file</text>
<text class="s" x="40" y="427.5" style="font-size:12px">on every school in its district</text>
<circle cx="31" cy="443.0" r="2.2" class="ah"/>
<text class="s" x="40" y="447.0" style="font-size:12px">The FAA Pilot School Search database lists</text>
<text class="s" x="40" y="462.5" style="font-size:12px">certificated ground and flight schools and their</text>
<text class="s" x="40" y="478.0" style="font-size:12px">courses</text>
<circle cx="31" cy="493.5" r="2.2" class="ah"/>
<text class="s" x="40" y="497.5" style="font-size:12px">Decide by certificate sought, sport or career,</text>
<text class="s" x="40" y="513.0" style="font-size:12px">and time available; train regularly and often</text>
<circle cx="31" cy="528.5" r="2.2" class="ah"/>
<text class="s" x="40" y="532.5" style="font-size:12px">Do not decide on cost alone; visit, talk with</text>
<text class="s" x="40" y="548.0" style="font-size:12px">management, instructors and students; ask for a</text>
<text class="s" x="40" y="563.5" style="font-size:12px">tour</text>
<circle cx="31" cy="579.0" r="2.2" class="ah"/>
<text class="s" x="40" y="583.0" style="font-size:12px">Make a question checklist: aircraft reliability,</text>
<text class="s" x="40" y="598.5" style="font-size:12px">maintenance, available aircraft, hours,</text>
<text class="s" x="40" y="614.0" style="font-size:12px">classrooms, private briefing rooms</text>
<rect x="373" y="370.0" width="337" height="24" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="383" y="387.0" style="font-size:13px">How to choose a CFI</text>
<circle cx="384" cy="408.0" r="2.2" class="ah"/>
<text class="s" x="393" y="412.0" style="font-size:12px">The CFI is the key to an effective program and</text>
<text class="s" x="393" y="427.5" style="font-size:12px">takes total responsibility for training to</text>
<text class="s" x="393" y="443.0" style="font-size:12px">certification standards</text>
<circle cx="384" cy="458.5" r="2.2" class="ah"/>
<text class="s" x="393" y="462.5" style="font-size:12px">Should understand how people learn, know the</text>
<text class="s" x="393" y="478.0" style="font-size:12px">fundamentals of teaching and communicate well</text>
<circle cx="384" cy="493.5" r="2.2" class="ah"/>
<text class="s" x="393" y="497.5" style="font-size:12px">Duties: orient the student to scenario-based</text>
<text class="s" x="393" y="513.0" style="font-size:12px">training; build a confident planner and inflight</text>
<text class="s" x="393" y="528.5" style="font-size:12px">manager; tie knowledge to real use; diagnose</text>
<text class="s" x="393" y="544.0" style="font-size:12px">learning difficulties; evaluate progress and keep</text>
<text class="s" x="393" y="559.5" style="font-size:12px">records; review continuously</text>
<circle cx="384" cy="575.0" r="2.2" class="ah"/>
<text class="s" x="393" y="579.0" style="font-size:12px">If the teaching or the schedule does not fit,</text>
<text class="s" x="393" y="594.5" style="font-size:12px">find another CFI</text>
</svg>
