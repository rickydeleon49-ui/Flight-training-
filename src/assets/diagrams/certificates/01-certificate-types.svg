<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 742" role="img" aria-labelledby="ti de"><title id="ti">Pilot certificates: what each one allows</title><desc id="de">Sport pilot: light-sport aircraft, daytime VFR, shared expenses, no business or hire. Recreational pilot: at most one passenger, 50 NM cross-country, no night, no ATC airspace, 30 hours minimum. Private pilot: noncommercial and business flight but no pay, 40 hours minimum. Commercial pilot: may be paid, no IMC without an instrument rating, complex airplane. Airline transport pilot: highest level, 1,500 hours, age 23. Medical classes: first for ATP, second for commercial, third for student, recreational and private.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:12px}.q1{font-size:13px}.q2{stroke:currentColor;stroke-width:1.5}</style><text class="t" x="20" y="28" style="font-size:15px">Pilot certificates: what each one allows</text><text class="s q1" x="20" y="50">Each certificate has privileges and limitations; the FAA may add limitations if a skill was not shown</text><text class="s q1" x="20" y="66.5">in training or on the practical test. Details as PHAK Chapter 1 gives them.</text><rect x="20" y="89" width="220" height="24" rx="10" class="sky q2"/><text class="t q1" x="30" y="106">Sport pilot</text><circle cx="31" cy="127" r="2.2" class="ah"/><text class="s q0" x="40" y="131">Student at 16 (14 for glider</text><text class="s q0" x="40" y="146.5">or balloon); test at 17 (16</text><text class="s q0" x="40" y="162">glider or balloon)</text><circle cx="31" cy="177.5" r="2.2" class="ah"/><text class="s q0" x="40" y="181.5">Driver license is proof of</text><text class="s q0" x="40" y="197">medical eligibility</text><circle cx="31" cy="212.5" r="2.2" class="ah"/><text class="s q0" x="40" y="216.5">Minimum flown: airplane 20 h,</text><text class="s q0" x="40" y="232">glider 10 h, balloon 7 h</text><circle cx="31" cy="247.5" r="2.2" class="ah"/><text class="s q0" x="40" y="251.5">Pilot in command of a</text><text class="s q0" x="40" y="267">light-sport aircraft; carry a</text><text class="s q0" x="40" y="282.5">passenger and share expenses</text><circle cx="31" cy="298" r="2.2" class="ah"/><text class="s q0" x="40" y="302">Daytime VFR, 3 SM visibility</text><text class="s q0" x="40" y="317.5">and visual contact with the</text><text class="s q0" x="40" y="333">ground</text><circle cx="31" cy="348.5" r="2.2" class="ah"/><text class="s q0" x="40" y="352.5">No Class A; Class B, C, D only</text><text class="s q0" x="40" y="368">after training and</text><text class="s q0" x="40" y="383.5">endorsement; no towing; no</text><text class="s q0" x="40" y="399">compensation or hire; no</text><text class="s q0" x="40" y="414.5">business</text><rect x="255" y="89" width="220" height="24" rx="10" class="mint q2"/><text class="t q1" x="265" y="106">Recreational pilot</text><circle cx="266" cy="127" r="2.2" class="ah"/><text class="s q0" x="275" y="131">At least 17 years old;</text><text class="s q0" x="275" y="146.5">third-class medical</text><circle cx="266" cy="162" r="2.2" class="ah"/><text class="s q0" x="275" y="166">30 hours: 15 dual, 2 en route,</text><text class="s q0" x="275" y="181.5">3 for the practical test, 3</text><text class="s q0" x="275" y="197">solo</text><circle cx="266" cy="212.5" r="2.2" class="ah"/><text class="s q0" x="275" y="216.5">One passenger at most; pro</text><text class="s q0" x="275" y="232">rata share of fuel, oil,</text><text class="s q0" x="275" y="247.5">airport and rental costs</text><circle cx="266" cy="263" r="2.2" class="ah"/><text class="s q0" x="275" y="267">Not PIC of an aircraft</text><text class="s q0" x="275" y="282.5">certificated for more than</text><text class="s q0" x="275" y="298">four occupants or with more</text><text class="s q0" x="275" y="313.5">than one powerplant</text><circle cx="266" cy="329" r="2.2" class="ah"/><text class="s q0" x="275" y="333">Cross-country limited to 50 NM</text><text class="s q0" x="275" y="348.5">from the departure airport</text><text class="s q0" x="275" y="364">unless more training</text><circle cx="266" cy="379.5" r="2.2" class="ah"/><text class="s q0" x="275" y="383.5">No night; no airspace where</text><text class="s q0" x="275" y="399">ATC communication is required</text><rect x="490" y="89" width="220" height="24" rx="10" class="lav q2"/><text class="t q1" x="500" y="106">Private pilot</text><circle cx="501" cy="127" r="2.2" class="ah"/><text class="s q0" x="510" y="131">Flies for pleasure or personal</text><text class="s q0" x="510" y="146.5">business; the certificate held</text><text class="s q0" x="510" y="162">by most active pilots</text><circle cx="501" cy="177.5" r="2.2" class="ah"/><text class="s q0" x="510" y="181.5">Command of any aircraft</text><text class="s q0" x="510" y="197">(subject to ratings) for any</text><text class="s q0" x="510" y="212.5">noncommercial purpose</text><circle cx="501" cy="228" r="2.2" class="ah"/><text class="s q0" x="510" y="232">Almost unlimited VFR authority</text><circle cx="501" cy="247.5" r="2.2" class="ah"/><text class="s q0" x="510" y="251.5">Passengers may be carried;</text><text class="s q0" x="510" y="267">business flight allowed, but</text><text class="s q0" x="510" y="282.5">no pay as pilot</text><circle cx="501" cy="298" r="2.2" class="ah"/><text class="s q0" x="510" y="302">Passengers may pay a pro rata</text><text class="s q0" x="510" y="317.5">share, such as fuel or rental</text><circle cx="501" cy="333" r="2.2" class="ah"/><text class="s q0" x="510" y="337">Part 61 training: at least 40</text><text class="s q0" x="510" y="352.5">h, with 20 h with an</text><text class="s q0" x="510" y="368">instructor and 10 h solo</text><rect x="20" y="438" width="220" height="24" rx="10" class="rose q2"/><text class="t q1" x="30" y="455">Commercial pilot</text><circle cx="31" cy="476" r="2.2" class="ah"/><text class="s q0" x="40" y="480">May be compensated for flying</text><circle cx="31" cy="495.5" r="2.2" class="ah"/><text class="s q0" x="40" y="499.5">Training focuses on aircraft</text><text class="s q0" x="40" y="515">systems and a higher standard</text><text class="s q0" x="40" y="530.5">of airmanship</text><circle cx="31" cy="546" r="2.2" class="ah"/><text class="s q0" x="40" y="550">The certificate itself does</text><text class="s q0" x="40" y="565.5">not allow flight in IMC</text><circle cx="31" cy="581" r="2.2" class="ah"/><text class="s q0" x="40" y="585">Without an instrument rating:</text><text class="s q0" x="40" y="600.5">daytime only, within 50 NM,</text><text class="s q0" x="40" y="616">when flying for hire</text><circle cx="31" cy="631.5" r="2.2" class="ah"/><text class="s q0" x="40" y="635.5">Airplane pilots need a complex</text><text class="s q0" x="40" y="651">airplane: retractable gear,</text><text class="s q0" x="40" y="666.5">movable flaps and a</text><text class="s q0" x="40" y="682">controllable-pitch propeller</text><rect x="255" y="438" width="220" height="24" rx="10" class="sky q2"/><text class="t q1" x="265" y="455">Airline transport pilot (ATP)</text><circle cx="266" cy="476" r="2.2" class="ah"/><text class="s q0" x="275" y="480">Tested to the highest level of</text><text class="s q0" x="275" y="495.5">piloting ability</text><circle cx="266" cy="511" r="2.2" class="ah"/><text class="s q0" x="275" y="515">Prerequisite for PIC and SIC</text><text class="s q0" x="275" y="530.5">in scheduled airline</text><text class="s q0" x="275" y="546">operations, and PIC in select</text><text class="s q0" x="275" y="561.5">charter and fractional</text><text class="s q0" x="275" y="577">operations</text><circle cx="266" cy="592.5" r="2.2" class="ah"/><text class="s q0" x="275" y="596.5">At least 23 years old; 1,500</text><text class="s q0" x="275" y="612">hours of flight time; reads,</text><text class="s q0" x="275" y="627.5">writes, speaks, understands</text><text class="s q0" x="275" y="643">English; "of good moral</text><text class="s q0" x="275" y="658.5">standing"</text><circle cx="266" cy="674" r="2.2" class="ah"/><text class="s q0" x="275" y="678">Restricted ATP: SIC only in</text><text class="s q0" x="275" y="693.5">scheduled airline operations;</text><text class="s q0" x="275" y="709">fewer hours; minimum age 21</text><rect x="490" y="438" width="220" height="24" rx="10" class="mint q2"/><text class="t q1" x="500" y="455">Medical class (generally)</text><circle cx="501" cy="476" r="2.2" class="ah"/><text class="s q0" x="510" y="480">First class: airline transport</text><text class="s q0" x="510" y="495.5">pilot</text><circle cx="501" cy="511" r="2.2" class="ah"/><text class="s q0" x="510" y="515">Second class: commercial pilot</text><circle cx="501" cy="530.5" r="2.2" class="ah"/><text class="s q0" x="510" y="534.5">Third class: student,</text><text class="s q0" x="510" y="550">recreational and private pilot</text><circle cx="501" cy="565.5" r="2.2" class="ah"/><text class="s q0" x="510" y="569.5">Balloon and glider pilots</text><text class="s q0" x="510" y="585">write a statement that no</text><text class="s q0" x="510" y="600.5">medical defect exists</text><circle cx="501" cy="616" r="2.2" class="ah"/><text class="s q0" x="510" y="620">A medical comes from an</text><text class="s q0" x="510" y="635.5">FAA-authorized AME</text></svg>
