<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 742" role="img" aria-labelledby="ti de"><title id="ti">Pilot certificates: what each one allows</title><desc id="de">Sport pilot: light-sport aircraft, daytime VFR, shared expenses, no business or hire. Recreational pilot: at most one passenger, 50 NM cross-country, no night, no ATC airspace, 30 hours minimum. Private pilot: noncommercial and business flight but no pay, 40 hours minimum. Commercial pilot: may be paid, no IMC without an instrument rating, complex airplane. Airline transport pilot: highest level, 1,500 hours, age 23. Medical classes: first for ATP, second for commercial, third for student, recreational and private.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><text class="t" x="20" y="28" style="font-size:15px">Pilot certificates: what each one allows</text><text class="s" x="20" y="50.0" style="font-size:13px">Each certificate has privileges and limitations; the FAA may add limitations if a skill was not shown</text><text class="s" x="20" y="66.5" style="font-size:13px">in training or on the practical test. Details as PHAK Chapter 1 gives them.</text><rect x="20" y="89.0" width="220" height="24" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30" y="106.0" style="font-size:13px">Sport pilot</text><circle cx="31" cy="127.0" r="2.2" class="ah"/><text class="s" x="40" y="131.0" style="font-size:12px">Student at 16 (14 for glider</text><text class="s" x="40" y="146.5" style="font-size:12px">or balloon); test at 17 (16</text><text class="s" x="40" y="162.0" style="font-size:12px">glider or balloon)</text><circle cx="31" cy="177.5" r="2.2" class="ah"/><text class="s" x="40" y="181.5" style="font-size:12px">Driver license is proof of</text><text class="s" x="40" y="197.0" style="font-size:12px">medical eligibility</text><circle cx="31" cy="212.5" r="2.2" class="ah"/><text class="s" x="40" y="216.5" style="font-size:12px">Minimum flown: airplane 20 h,</text><text class="s" x="40" y="232.0" style="font-size:12px">glider 10 h, balloon 7 h</text><circle cx="31" cy="247.5" r="2.2" class="ah"/><text class="s" x="40" y="251.5" style="font-size:12px">Pilot in command of a</text><text class="s" x="40" y="267.0" style="font-size:12px">light-sport aircraft; carry a</text><text class="s" x="40" y="282.5" style="font-size:12px">passenger and share expenses</text><circle cx="31" cy="298.0" r="2.2" class="ah"/><text class="s" x="40" y="302.0" style="font-size:12px">Daytime VFR, 3 SM visibility</text><text class="s" x="40" y="317.5" style="font-size:12px">and visual contact with the</text><text class="s" x="40" y="333.0" style="font-size:12px">ground</text><circle cx="31" cy="348.5" r="2.2" class="ah"/><text class="s" x="40" y="352.5" style="font-size:12px">No Class A; Class B, C, D only</text><text class="s" x="40" y="368.0" style="font-size:12px">after training and</text><text class="s" x="40" y="383.5" style="font-size:12px">endorsement; no towing; no</text><text class="s" x="40" y="399.0" style="font-size:12px">compensation or hire; no</text><text class="s" x="40" y="414.5" style="font-size:12px">business</text><rect x="255" y="89.0" width="220" height="24" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="265" y="106.0" style="font-size:13px">Recreational pilot</text><circle cx="266" cy="127.0" r="2.2" class="ah"/><text class="s" x="275" y="131.0" style="font-size:12px">At least 17 years old;</text><text class="s" x="275" y="146.5" style="font-size:12px">third-class medical</text><circle cx="266" cy="162.0" r="2.2" class="ah"/><text class="s" x="275" y="166.0" style="font-size:12px">30 hours: 15 dual, 2 en route,</text><text class="s" x="275" y="181.5" style="font-size:12px">3 for the practical test, 3</text><text class="s" x="275" y="197.0" style="font-size:12px">solo</text><circle cx="266" cy="212.5" r="2.2" class="ah"/><text class="s" x="275" y="216.5" style="font-size:12px">One passenger at most; pro</text><text class="s" x="275" y="232.0" style="font-size:12px">rata share of fuel, oil,</text><text class="s" x="275" y="247.5" style="font-size:12px">airport and rental costs</text><circle cx="266" cy="263.0" r="2.2" class="ah"/><text class="s" x="275" y="267.0" style="font-size:12px">Not PIC of an aircraft</text><text class="s" x="275" y="282.5" style="font-size:12px">certificated for more than</text><text class="s" x="275" y="298.0" style="font-size:12px">four occupants or with more</text><text class="s" x="275" y="313.5" style="font-size:12px">than one powerplant</text><circle cx="266" cy="329.0" r="2.2" class="ah"/><text class="s" x="275" y="333.0" style="font-size:12px">Cross-country limited to 50 NM</text><text class="s" x="275" y="348.5" style="font-size:12px">from the departure airport</text><text class="s" x="275" y="364.0" style="font-size:12px">unless more training</text><circle cx="266" cy="379.5" r="2.2" class="ah"/><text class="s" x="275" y="383.5" style="font-size:12px">No night; no airspace where</text><text class="s" x="275" y="399.0" style="font-size:12px">ATC communication is required</text><rect x="490" y="89.0" width="220" height="24" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="500" y="106.0" style="font-size:13px">Private pilot</text><circle cx="501" cy="127.0" r="2.2" class="ah"/><text class="s" x="510" y="131.0" style="font-size:12px">Flies for pleasure or personal</text><text class="s" x="510" y="146.5" style="font-size:12px">business; the certificate held</text><text class="s" x="510" y="162.0" style="font-size:12px">by most active pilots</text><circle cx="501" cy="177.5" r="2.2" class="ah"/><text class="s" x="510" y="181.5" style="font-size:12px">Command of any aircraft</text><text class="s" x="510" y="197.0" style="font-size:12px">(subject to ratings) for any</text><text class="s" x="510" y="212.5" style="font-size:12px">noncommercial purpose</text><circle cx="501" cy="228.0" r="2.2" class="ah"/><text class="s" x="510" y="232.0" style="font-size:12px">Almost unlimited VFR authority</text><circle cx="501" cy="247.5" r="2.2" class="ah"/><text class="s" x="510" y="251.5" style="font-size:12px">Passengers may be carried;</text><text class="s" x="510" y="267.0" style="font-size:12px">business flight allowed, but</text><text class="s" x="510" y="282.5" style="font-size:12px">no pay as pilot</text><circle cx="501" cy="298.0" r="2.2" class="ah"/><text class="s" x="510" y="302.0" style="font-size:12px">Passengers may pay a pro rata</text><text class="s" x="510" y="317.5" style="font-size:12px">share, such as fuel or rental</text><circle cx="501" cy="333.0" r="2.2" class="ah"/><text class="s" x="510" y="337.0" style="font-size:12px">Part 61 training: at least 40</text><text class="s" x="510" y="352.5" style="font-size:12px">h, with 20 h with an</text><text class="s" x="510" y="368.0" style="font-size:12px">instructor and 10 h solo</text><rect x="20" y="438.0" width="220" height="24" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30" y="455.0" style="font-size:13px">Commercial pilot</text><circle cx="31" cy="476.0" r="2.2" class="ah"/><text class="s" x="40" y="480.0" style="font-size:12px">May be compensated for flying</text><circle cx="31" cy="495.5" r="2.2" class="ah"/><text class="s" x="40" y="499.5" style="font-size:12px">Training focuses on aircraft</text><text class="s" x="40" y="515.0" style="font-size:12px">systems and a higher standard</text><text class="s" x="40" y="530.5" style="font-size:12px">of airmanship</text><circle cx="31" cy="546.0" r="2.2" class="ah"/><text class="s" x="40" y="550.0" style="font-size:12px">The certificate itself does</text><text class="s" x="40" y="565.5" style="font-size:12px">not allow flight in IMC</text><circle cx="31" cy="581.0" r="2.2" class="ah"/><text class="s" x="40" y="585.0" style="font-size:12px">Without an instrument rating:</text><text class="s" x="40" y="600.5" style="font-size:12px">daytime only, within 50 NM,</text><text class="s" x="40" y="616.0" style="font-size:12px">when flying for hire</text><circle cx="31" cy="631.5" r="2.2" class="ah"/><text class="s" x="40" y="635.5" style="font-size:12px">Airplane pilots need a complex</text><text class="s" x="40" y="651.0" style="font-size:12px">airplane: retractable gear,</text><text class="s" x="40" y="666.5" style="font-size:12px">movable flaps and a</text><text class="s" x="40" y="682.0" style="font-size:12px">controllable-pitch propeller</text><rect x="255" y="438.0" width="220" height="24" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="265" y="455.0" style="font-size:13px">Airline transport pilot (ATP)</text><circle cx="266" cy="476.0" r="2.2" class="ah"/><text class="s" x="275" y="480.0" style="font-size:12px">Tested to the highest level of</text><text class="s" x="275" y="495.5" style="font-size:12px">piloting ability</text><circle cx="266" cy="511.0" r="2.2" class="ah"/><text class="s" x="275" y="515.0" style="font-size:12px">Prerequisite for PIC and SIC</text><text class="s" x="275" y="530.5" style="font-size:12px">in scheduled airline</text><text class="s" x="275" y="546.0" style="font-size:12px">operations, and PIC in select</text><text class="s" x="275" y="561.5" style="font-size:12px">charter and fractional</text><text class="s" x="275" y="577.0" style="font-size:12px">operations</text><circle cx="266" cy="592.5" r="2.2" class="ah"/><text class="s" x="275" y="596.5" style="font-size:12px">At least 23 years old; 1,500</text><text class="s" x="275" y="612.0" style="font-size:12px">hours of flight time; reads,</text><text class="s" x="275" y="627.5" style="font-size:12px">writes, speaks, understands</text><text class="s" x="275" y="643.0" style="font-size:12px">English; "of good moral</text><text class="s" x="275" y="658.5" style="font-size:12px">standing"</text><circle cx="266" cy="674.0" r="2.2" class="ah"/><text class="s" x="275" y="678.0" style="font-size:12px">Restricted ATP: SIC only in</text><text class="s" x="275" y="693.5" style="font-size:12px">scheduled airline operations;</text><text class="s" x="275" y="709.0" style="font-size:12px">fewer hours; minimum age 21</text><rect x="490" y="438.0" width="220" height="24" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="500" y="455.0" style="font-size:13px">Medical class (generally)</text><circle cx="501" cy="476.0" r="2.2" class="ah"/><text class="s" x="510" y="480.0" style="font-size:12px">First class: airline transport</text><text class="s" x="510" y="495.5" style="font-size:12px">pilot</text><circle cx="501" cy="511.0" r="2.2" class="ah"/><text class="s" x="510" y="515.0" style="font-size:12px">Second class: commercial pilot</text><circle cx="501" cy="530.5" r="2.2" class="ah"/><text class="s" x="510" y="534.5" style="font-size:12px">Third class: student,</text><text class="s" x="510" y="550.0" style="font-size:12px">recreational and private pilot</text><circle cx="501" cy="565.5" r="2.2" class="ah"/><text class="s" x="510" y="569.5" style="font-size:12px">Balloon and glider pilots</text><text class="s" x="510" y="585.0" style="font-size:12px">write a statement that no</text><text class="s" x="510" y="600.5" style="font-size:12px">medical defect exists</text><circle cx="501" cy="616.0" r="2.2" class="ah"/><text class="s" x="510" y="620.0" style="font-size:12px">A medical comes from an</text><text class="s" x="510" y="635.5" style="font-size:12px">FAA-authorized AME</text></svg>
