<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 647" role="img" aria-labelledby="ti de"><title id="ti">Aircraft types and groupings as PHAK describes them</title><desc id="de">The FAA groups aircraft as airplane, glider, lighter-than-air (airship and balloon), rotorcraft (gyroplane and helicopter), powered-lift, powered parachute, weight-shift-control and rocket. By size, large aircraft are more than 12,500 pounds and small aircraft 12,500 pounds or less; light-sport aircraft are a separate definition. Ultralight vehicles weigh under 254 pounds powered or 155 pounds unpowered and follow part 103. Category, class and type are used for airman certificates and for aircraft certification.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style>
<text class="t" x="20" y="28" style="font-size:15px">Aircraft types and groupings as PHAK describes them</text>
<text class="s" x="20" y="50.0" style="font-size:13px">The FAA groups aircraft by characteristics and by size, and uses category, class and type for</text>
<text class="s" x="20" y="66.5" style="font-size:13px">certificates. Definitions are from 14 CFR 1.1 as quoted in PHAK.</text>
<text class="t" x="20" y="97.0" style="font-size:13.5px">Groupings by characteristics</text>
<rect x="20" y="107.0" width="165" height="60" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="102" y="126.0" style="font-size:12.5px">Airplane</text>
<text class="s m" x="102" y="143.0" style="font-size:11px">Engine-driven fixed-wing,</text>
<text class="s m" x="102" y="157.0" style="font-size:11px">supported by its wings</text>
<rect x="195" y="107.0" width="165" height="60" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="277" y="126.0" style="font-size:12.5px">Glider</text>
<text class="s m" x="277" y="143.0" style="font-size:11px">Free flight does not</text>
<text class="s m" x="277" y="157.0" style="font-size:11px">depend mainly on an engine</text>
<rect x="370" y="107.0" width="165" height="60" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="452" y="126.0" style="font-size:12.5px">Lighter-than-air</text>
<text class="s m" x="452" y="143.0" style="font-size:11px">Airship: engine, steered</text>
<text class="s m" x="452" y="157.0" style="font-size:11px">Balloon: no engine</text>
<rect x="545" y="107.0" width="165" height="60" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="627" y="126.0" style="font-size:12.5px">Rotorcraft</text>
<text class="s m" x="627" y="143.0" style="font-size:11px">Lift from one or more rotors</text>
<text class="s m" x="627" y="157.0" style="font-size:11px">Gyroplane; helicopter</text>
<rect x="20" y="177.0" width="165" height="60" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="102" y="196.0" style="font-size:12.5px">Powered-lift</text>
<text class="s m" x="102" y="213.0" style="font-size:11px">Vertical takeoff and landing;</text>
<text class="s m" x="102" y="227.0" style="font-size:11px">wings for level flight</text>
<rect x="195" y="177.0" width="165" height="60" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="277" y="196.0" style="font-size:12.5px">Powered parachute</text>
<text class="s m" x="277" y="213.0" style="font-size:11px">Flexible or semi-rigid wing;</text>
<text class="s m" x="277" y="227.0" style="font-size:11px">engine in the fuselage</text>
<rect x="370" y="177.0" width="165" height="60" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="452" y="196.0" style="font-size:12.5px">Weight-shift-control</text>
<text class="s m" x="452" y="213.0" style="font-size:11px">Framed pivoting wing;</text>
<text class="s m" x="452" y="227.0" style="font-size:11px">steered by shifting weight</text>
<rect x="545" y="177.0" width="165" height="60" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="627" y="196.0" style="font-size:12.5px">Rocket</text>
<text class="s m" x="627" y="213.0" style="font-size:11px">Propelled by ejected gases</text>
<text class="s m" x="627" y="227.0" style="font-size:11px">from its own propellants</text>
<rect x="20" y="255.0" width="337" height="24" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="30" y="272.0" style="font-size:13px">Grouped by size and weight</text>
<circle cx="31" cy="293.0" r="2.2" class="ah"/>
<text class="s" x="40" y="297.0" style="font-size:12px">Large aircraft: more than 12,500 pounds maximum</text>
<text class="s" x="40" y="312.5" style="font-size:12px">certificated takeoff weight</text>
<circle cx="31" cy="328.0" r="2.2" class="ah"/>
<text class="s" x="40" y="332.0" style="font-size:12px">Small aircraft: 12,500 pounds or less</text>
<circle cx="31" cy="347.5" r="2.2" class="ah"/>
<text class="s" x="40" y="351.5" style="font-size:12px">Light-sport aircraft (LSA): meets the 14 CFR 1.1</text>
<text class="s" x="40" y="367.0" style="font-size:12px">definition; can be airplanes, airships, balloons,</text>
<text class="s" x="40" y="382.5" style="font-size:12px">gliders, gyroplanes, powered parachutes and</text>
<text class="s" x="40" y="398.0" style="font-size:12px">weight-shift-control</text>
<rect x="373" y="255.0" width="337" height="24" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="383" y="272.0" style="font-size:13px">Not aircraft: ultralight vehicles</text>
<circle cx="384" cy="293.0" r="2.2" class="ah"/>
<text class="s" x="393" y="297.0" style="font-size:12px">Defined in 14 CFR 103; rules differ significantly</text>
<text class="s" x="393" y="312.5" style="font-size:12px">from aircraft rules</text>
<circle cx="384" cy="328.0" r="2.2" class="ah"/>
<text class="s" x="393" y="332.0" style="font-size:12px">Powered: less than 254 pounds empty weight</text>
<circle cx="384" cy="347.5" r="2.2" class="ah"/>
<text class="s" x="393" y="351.5" style="font-size:12px">Unpowered: less than 155 pounds</text>
<circle cx="384" cy="367.0" r="2.2" class="ah"/>
<text class="s" x="393" y="371.0" style="font-size:12px">A pilot does not need a certificate to fly one</text>
<text class="t" x="20" y="433.5" style="font-size:13.5px">Category, class and type</text>
<rect x="20" y="443.5" width="220" height="24" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="30" y="460.5" style="font-size:13px">Category</text>
<circle cx="31" cy="481.5" r="2.2" class="ah"/>
<text class="s" x="40" y="485.5" style="font-size:12px">Airmen: a broad</text>
<text class="s" x="40" y="501.0" style="font-size:12px">classification, e.g. airplane,</text>
<text class="s" x="40" y="516.5" style="font-size:12px">rotorcraft, glider,</text>
<text class="s" x="40" y="532.0" style="font-size:12px">lighter-than-air</text>
<circle cx="31" cy="547.5" r="2.2" class="ah"/>
<text class="s" x="40" y="551.5" style="font-size:12px">Aircraft: grouped by intended</text>
<text class="s" x="40" y="567.0" style="font-size:12px">use or limits, e.g. transport,</text>
<text class="s" x="40" y="582.5" style="font-size:12px">normal, utility, acrobatic,</text>
<text class="s" x="40" y="598.0" style="font-size:12px">limited, restricted,</text>
<text class="s" x="40" y="613.5" style="font-size:12px">provisional</text>
<rect x="255" y="443.5" width="220" height="24" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="265" y="460.5" style="font-size:13px">Class</text>
<circle cx="266" cy="481.5" r="2.2" class="ah"/>
<text class="s" x="275" y="485.5" style="font-size:12px">Airmen: within a category,</text>
<text class="s" x="275" y="501.0" style="font-size:12px">similar operating</text>
<text class="s" x="275" y="516.5" style="font-size:12px">characteristics, e.g. single</text>
<text class="s" x="275" y="532.0" style="font-size:12px">engine, multiengine, land,</text>
<text class="s" x="275" y="547.5" style="font-size:12px">water</text>
<circle cx="266" cy="563.0" r="2.2" class="ah"/>
<text class="s" x="275" y="567.0" style="font-size:12px">Aircraft: similar propulsion,</text>
<text class="s" x="275" y="582.5" style="font-size:12px">flight or landing, e.g.</text>
<text class="s" x="275" y="598.0" style="font-size:12px">airplane, rotorcraft, balloon,</text>
<text class="s" x="275" y="613.5" style="font-size:12px">landplane, seaplane</text>
<rect x="490" y="443.5" width="220" height="24" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="500" y="460.5" style="font-size:13px">Type</text>
<circle cx="501" cy="481.5" r="2.2" class="ah"/>
<text class="s" x="510" y="485.5" style="font-size:12px">Airmen: a specific make and</text>
<text class="s" x="510" y="501.0" style="font-size:12px">basic model, e.g. 737-700,</text>
<text class="s" x="510" y="516.5" style="font-size:12px">G-IV, 1900</text>
<circle cx="501" cy="532.0" r="2.2" class="ah"/>
<text class="s" x="510" y="536.0" style="font-size:12px">Aircraft: similar in design,</text>
<text class="s" x="510" y="551.5" style="font-size:12px">e.g. 737-700 and 737-700C</text>
</svg>
