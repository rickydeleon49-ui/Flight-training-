<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 560" role="img" aria-labelledby="ti de"><title id="ti">Time, speed, distance and fuel</title><desc id="de">Time equals distance divided by groundspeed. Fuel equals time times fuel burn per hour. Example: 60 nautical miles at 120 knots groundspeed is 30 minutes, and 30 minutes at 8 gallons per hour is 4 gallons. Plan the reserve the rules require: 30 minutes for VFR day, 45 minutes for VFR night.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:12px}.q1{font-size:11px}.q2{stroke:currentColor;stroke-width:1.5}.q3{font-size:13px}.q4{stroke-width:1.2;opacity:0.7}.q5{font-size:12.5px}.q6{stroke-width:1.4;opacity:0.8}.x1{font-size:12.5px}.x2{font-size:13px}.x3{stroke:currentColor;stroke-width:1.5}.th{fill:currentColor;fill-opacity:.12}.big{font-size:20px}</style><text class="t" style="font-size:15px" x="20" y="28">Time, speed, distance and fuel</text><text class="s x2" x="20" y="50">Two formulas. The numbers in the Example are only to show the steps.</text><rect x="20" y="70" width="340" height="100" rx="10" class="sky x3"/><text class="t x2 m" x="190" y="94">Time</text><text class="t m" style="font-size:17px" x="190" y="125">time = distance ÷ groundspeed</text><text class="s x1 m" x="190" y="152">Use groundspeed, not airspeed.</text><rect x="370" y="70" width="340" height="100" rx="10" class="mint x3"/><text class="t x2 m" x="540" y="94">Fuel</text><text class="t m" style="font-size:17px" x="540" y="125">fuel = time × fuel burn per hour</text><text class="s x1 m" x="540" y="152">Fuel burn is in gallons per hour.</text><rect x="20" y="186" width="690" height="170" rx="10" class="lav x3"/><text class="t x2" x="36" y="210">Example (round numbers only)</text><rect x="36" y="224" width="300" height="110" rx="8" class="cl"/><text class="t x1 m" x="186" y="246">Time</text><text class="s x2 m" x="186" y="268">60 NM ÷ 120 knots</text><text class="s x2 m" x="186" y="290">= 0.5 hour</text><text class="s x2 m" x="186" y="312">= 30 minutes</text><rect x="394" y="224" width="300" height="110" rx="8" class="cl"/><text class="t x1 m" x="544" y="246">Fuel</text><text class="s x2 m" x="544" y="268">0.5 hour × 8 gallons per hour</text><text class="s x2 m" x="544" y="290">= 4 gallons</text><text class="s x2 m" x="544" y="312">for the 30-minute leg</text><path d="M340 279L388 279" class="acc"/><path d="M392 279L382 273L382 285Z" class="ah"/><rect x="20" y="372" width="690" height="150" rx="10" class="rose x3"/><text class="t x2" x="36" y="396">Then plan the reserve the rules require (14 CFR 91.151)</text><rect x="36" y="410" width="320" height="92" rx="8" class="cl"/><text class="t x2 m" x="196" y="434">VFR day</text><text class="t m" style="font-size:22px" style="font-size:22px" x="196" y="466">30 minutes</text><rect x="374" y="410" width="320" height="92" rx="8" class="cl"/><text class="t x2 m" x="534" y="434">VFR night</text><text class="t m m" x="534" y="466">45 minutes</text><text class="s x1 m" x="196" y="490">at normal cruising speed</text><text class="s x1 m" x="534" y="490">at normal cruising speed</text><text class="s x1" x="20" y="542">Add the reserve to the trip fuel: it is extra fuel left after you reach your first planned landing point.</text></svg>
