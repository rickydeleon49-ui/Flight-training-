<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 500" role="img" aria-labelledby="ti de"><title id="ti">VFR cruising altitudes: odd or even plus 500</title><desc id="de">In level cruise more than 3,000 feet above the surface, below 18,000 feet MSL, magnetic course 0 to 179 degrees uses odd thousands plus 500 feet, such as 3,500 and 5,500. Magnetic course 180 to 359 degrees uses even thousands plus 500 feet, such as 4,500 and 6,500. It goes by magnetic course, not heading.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:12px}.q1{font-size:11px}.q2{stroke:currentColor;stroke-width:1.5}.q3{font-size:13px}.q4{stroke-width:1.2;opacity:0.7}.q5{font-size:12.5px}.q6{stroke-width:1.4;opacity:0.8}.x1{font-size:12.5px}.x2{font-size:13px}.x3{stroke:currentColor;stroke-width:1.5}.th{fill:currentColor;fill-opacity:.12}.big{font-size:20px}</style><text class="t" style="font-size:15px" x="20" y="28">VFR cruising altitudes: odd or even plus 500</text><text class="s x2" x="20" y="50">14 CFR 91.159. In level cruise more than 3,000 feet above the surface, below 18,000 feet MSL.</text><rect x="20" y="70" width="340" height="250" rx="10" class="sky x3"/><text class="t x2 m" x="190" y="96">Magnetic course 0 to 179</text><text class="t m m" x="190" y="124">Odd thousands + 500</text><text class="t m" x="190" y="170">3,500</text><text class="t m" x="190" y="206">5,500</text><text class="t m" x="190" y="242">7,500</text><text class="t m" x="190" y="278">and so on</text><rect x="370" y="70" width="340" height="250" rx="10" class="mint x3"/><text class="t x2 m" x="540" y="96">Magnetic course 180 to 359</text><text class="t m m" x="540" y="124">Even thousands + 500</text><text class="t m m" x="540" y="170">4,500</text><text class="t m m" x="540" y="206">6,500</text><text class="t m m" x="540" y="242">8,500</text><text class="t m m" x="540" y="278">and so on</text><rect class="cl" x="20" y="336" width="690" height="150" rx="8"/><circle cx="35" cy="360" r="2.2" class="ah"/><text class="s x2" x="44" y="364">It goes by magnetic COURSE, not heading. Wind can make your heading differ from your course.</text><circle cx="35" cy="392" r="2.2" class="ah"/><text class="s x2" x="44" y="396">Course is the path you plan over the ground. Pick the altitude from the course of the leg.</text><circle cx="35" cy="424" r="2.2" class="ah"/><text class="s x2" x="44" y="428">Odd or even is the thousands digit. The 500 feet is added to it.</text><circle cx="35" cy="456" r="2.2" class="ah"/><text class="s x2" x="44" y="460">Rule applies in level cruise more than 3,000 feet above the surface (AGL).</text></svg>
