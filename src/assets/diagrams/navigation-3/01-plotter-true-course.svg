<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 520" role="img" aria-labelledby="ti de"><title id="ti">Measuring true course with a plotter</title><desc id="de">A course line is drawn on the chart. The plotter center hole is set on a meridian near the middle of the route and the edge is lined up with the course line. True course is read where the meridian crosses the protractor scale. The distance scale must match the chart, such as a sectional. Schematic drawing.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:12px}.q1{font-size:11px}.q2{stroke:currentColor;stroke-width:1.5}.q3{font-size:13px}.q4{stroke-width:1.2;opacity:0.7}.q5{font-size:12.5px}.q6{stroke-width:1.4;opacity:0.8}.x1{font-size:12.5px}.x2{font-size:13px}.x3{stroke:currentColor;stroke-width:1.5}.th{fill:currentColor;fill-opacity:.12}.big{font-size:20px}.q7{stroke-width:1.8;opacity:.6}</style><text class="t" style="font-size:15px" x="20" y="28">Measuring true course with a plotter</text><text class="s x2" x="20" y="50">Draw the course line, then read true course from the plotter. The drawing is schematic.</text><rect x="20" y="70" width="340" height="360" rx="10" class="sky x3"/><path d="M110 105L110 410" class="o d q7"/><path d="M190 105L190 410" class="o d q7"/><path d="M270 105L270 410" class="o d q7"/><text class="s x1 m" x="190" y="98">Meridian near the middle</text><path d="M50 380L330 150" class="acc"/><circle cx="50" cy="380" r="5" class="dh"/><circle cx="330" cy="150" r="5" class="dh"/><text class="t x1" x="50" y="402">Start</text><text class="t x1" x="316" y="138">End</text><g transform="rotate(-39.4 190 265)"><rect x="90" y="240" width="200" height="50" rx="6" class="th x3"/><circle cx="190" cy="265" r="6" class="cl x3"/><path d="M130 240v8M160 240v8M190 240v8M220 240v8M250 240v8" class="o" style="stroke-width:1.5"/></g><circle cx="190" cy="265" r="4" class="ah"/><text class="t x1" x="335" y="345" style="text-anchor:end">Plotter</text><text class="s x1 m" x="190" y="424">Center hole sits on the meridian</text><rect x="375" y="70" width="335" height="82" rx="10" class="mint x3"/><text class="t x2" x="390" y="92">1. Draw the course line</text><text class="s x1" x="390" y="112">Draw a line from the start to the</text><text class="s x1" x="390" y="128">end point on the chart.</text><rect x="375" y="162" width="335" height="82" rx="10" class="sky x3"/><text class="t x2" x="390" y="184">2. Line up the plotter</text><text class="s x1" x="390" y="204">Put the plotter edge on the course line.</text><text class="s x1" x="390" y="220">Set the center hole on a meridian near</text><text class="s x1" x="390" y="236">the middle of the route.</text><rect x="375" y="254" width="335" height="82" rx="10" class="lav x3"/><text class="t x2" x="390" y="276">3. Read true course</text><text class="s x1" x="390" y="296">Read the true course where the meridian</text><text class="s x1" x="390" y="312">crosses the protractor scale.</text><rect x="375" y="346" width="335" height="82" rx="10" class="rose x3"/><text class="t x2" x="390" y="368">4. Check the distance scale</text><text class="s x1" x="390" y="388">Use the distance scale that matches the</text><text class="s x1" x="390" y="404">chart. A sectional needs the sectional scale.</text><rect class="cl" x="20" y="446" width="690" height="62" rx="8"/><circle cx="35" cy="468" r="2.2" class="ah"/><text class="s x2" x="44" y="472">The scale you read is true course, measured from true north along the meridian.</text><circle cx="35" cy="492" r="2.2" class="ah"/><text class="s x2" x="44" y="496">Use the distance scale for the chart you are using, so the miles you read are right.</text></svg>
