<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 492" role="img" aria-labelledby="ti de"><title id="ti">S-turns across a road</title><desc id="de">Top view of an S-shaped track made of two equal semicircles on opposite sides of a straight road, with the wind blowing across the road, steepest bank on the downwind side and shallowest on the upwind side.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:17px}.q1{stroke-width:2;opacity:.6}.q2{font-size:11.5px}.q3{font-size:13px}.q4{font-size:12px}.q5{stroke:currentColor;stroke-width:1.5}.q6{stroke-width:2;stroke-dasharray:7 6}.q8{stroke:currentColor;stroke-width:1.4;stroke-linejoin:round}</style><text class="t" x="20" y="28" style="font-size:15px">S-turns across a road</text><text class="s q3" x="20" y="50">Half circles of the same size, one on each side of a road.</text><text class="s q3" x="20" y="66.5">The wind blows across the road.</text><rect class="cl" x="20" y="91" width="690" height="235" rx="8"/><path d="M330 103L330 322" class="dk q1" style="stroke-width:6;opacity:.35"/><text class="t" x="340" y="112" style="font-size:12px">Road</text><path d="M400 130L330 130A40 40 0 0 0 330 210A40 40 0 0 1 330 290L260 290" class="acc" style="stroke-width:3"/><path d="M-6 -5L7 0L-6 5Z" class="ah" transform="translate(365 130) rotate(180)"/><path d="M-6 -5L7 0L-6 5Z" class="ah" transform="translate(290 170) rotate(90)"/><path d="M-6 -5L7 0L-6 5Z" class="ah" transform="translate(370 250) rotate(90)"/><path d="M-6 -5L7 0L-6 5Z" class="ah" transform="translate(290 290) rotate(180)"/><g transform="translate(330 130) rotate(180) scale(1)"><ellipse cx="0" cy="0" rx="17" ry="3.8" class="sky q8"/><path d="M2 -3L-4 -17L1 -17L8 -3Z" class="sky q8"/><path d="M2 3L-4 17L1 17L8 3Z" class="sky q8"/><path d="M-13 -2L-17 -8L-13 -8L-9 -2Z" class="sky q8"/><path d="M-13 2L-17 8L-13 8L-9 2Z" class="sky q8"/></g><g transform="translate(330 210) rotate(0) scale(1)"><ellipse cx="0" cy="0" rx="17" ry="3.8" class="sky q8"/><path d="M2 -3L-4 -17L1 -17L8 -3Z" class="sky q8"/><path d="M2 3L-4 17L1 17L8 3Z" class="sky q8"/><path d="M-13 -2L-17 -8L-13 -8L-9 -2Z" class="sky q8"/><path d="M-13 2L-17 8L-13 8L-9 2Z" class="sky q8"/></g><g transform="translate(330 290) rotate(180) scale(1)"><ellipse cx="0" cy="0" rx="17" ry="3.8" class="sky q8"/><path d="M2 -3L-4 -17L1 -17L8 -3Z" class="sky q8"/><path d="M2 3L-4 17L1 17L8 3Z" class="sky q8"/><path d="M-13 -2L-17 -8L-13 -8L-9 -2Z" class="sky q8"/><path d="M-13 2L-17 8L-13 8L-9 2Z" class="sky q8"/></g><text class="t" x="30" y="150" style="font-size:12px">Steepest bank</text><text class="s q2" x="30" y="165">just after crossing the road</text><text class="s q2" x="30" y="180">downwind</text><text class="t" x="395" y="205" style="font-size:12px">Shallowest bank</text><text class="s q2" x="395" y="220">as you cross the road upwind</text><text class="s q2" x="345" y="309">Cross the road wings level</text><path d="M640 125L520 125" class="acc"/><path d="M-6 -5L7 0L-6 5Z" class="ah" transform="translate(520 125) rotate(180)"/><text class="t m" x="580" y="150" style="font-size:12px">Wind</text><text class="s q2" x="520" y="170">Wind is at right angles</text><text class="s q2" x="520" y="185">to the road</text><rect class="cl" x="20" y="338" width="220.7" height="133" rx="8"/><rect x="20" y="338" width="220.7" height="26" rx="10" class="sky q4"/><text class="t q3" x="30" y="356">Set up</text><circle cx="33" cy="374" r="2.2" class="ah"/><text class="s q2" x="42" y="378">Pick a straight road at right</text><text class="s q2" x="42" y="393">angles to the wind</text><circle cx="33" cy="407" r="2.2" class="ah"/><text class="s q2" x="42" y="411">Fly 600 to 1,000 feet AGL</text><rect class="cl" x="254.7" y="338" width="220.7" height="133" rx="8"/><rect x="254.7" y="338" width="220.7" height="26" rx="10" class="rose q4"/><text class="t q3" x="264.7" y="356">Fly it</text><circle cx="267.7" cy="374" r="2.2" class="ah"/><text class="s q2" x="276.7" y="378">Cross the road wings level</text><circle cx="267.7" cy="392" r="2.2" class="ah"/><text class="s q2" x="276.7" y="396">Make each half circle the same</text><text class="s q2" x="276.7" y="411">size</text><circle cx="267.7" cy="425" r="2.2" class="ah"/><text class="s q2" x="276.7" y="429">Bank steepest while flying</text><text class="s q2" x="276.7" y="444">downwind, shallowest while</text><text class="s q2" x="276.7" y="459">flying upwind</text><rect class="cl" x="489.3" y="338" width="220.7" height="133" rx="8"/><rect x="489.3" y="338" width="220.7" height="26" rx="10" class="mint q4"/><text class="t q3" x="499.3" y="356">Why</text><circle cx="502.3" cy="374" r="2.2" class="ah"/><text class="s q2" x="511.3" y="378">Teaches you to correct for</text><text class="s q2" x="511.3" y="393">wind drift</text><circle cx="502.3" cy="407" r="2.2" class="ah"/><text class="s q2" x="511.3" y="411">Practice at dividing your</text><text class="s q2" x="511.3" y="426">attention</text><text class="s" x="20" y="485" style="font-size:11px">Source: Airplane Flying Handbook ch. 7</text></svg>