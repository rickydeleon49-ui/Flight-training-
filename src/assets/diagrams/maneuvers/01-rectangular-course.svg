<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 484" role="img" aria-labelledby="ti de"><title id="ti">Rectangular course around a field</title><desc id="de">Top view of a rectangular flight path around a field with the wind blowing from lower left to upper right, a crab angle into the wind on each leg, steepest bank at the turn after the downwind leg and shallowest on the upwind leg.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:17px}.q1{stroke-width:2;opacity:.6}.q2{font-size:11.5px}.q3{font-size:13px}.q4{font-size:12px}.q5{stroke:currentColor;stroke-width:1.5}.q6{stroke-width:2;stroke-dasharray:7 6}.q8{stroke:currentColor;stroke-width:1.4;stroke-linejoin:round}</style><text class="t" x="20" y="28" style="font-size:15px">Rectangular course around a field</text><text class="s q3" x="20" y="50">A ground track a set distance from all four sides of a field.</text><text class="s q3" x="20" y="66.5">Crab into the wind on each leg to stay on the track.</text><rect class="cl" x="20" y="91" width="690" height="245" rx="8"/><rect x="200" y="175" width="180" height="70" rx="4" class="mint"/><text class="t m" x="290" y="215" style="font-size:12px">Field</text><path d="M150 130L430 130L430 290L150 290Z" class="acc" style="stroke-width:3;stroke-dasharray:7 6"/><path d="M-6 -5L7 0L-6 5Z" class="ah" transform="translate(290 290) rotate(0)"/><path d="M-6 -5L7 0L-6 5Z" class="ah" transform="translate(430 210) rotate(-90)"/><path d="M-6 -5L7 0L-6 5Z" class="ah" transform="translate(290 130) rotate(180)"/><path d="M-6 -5L7 0L-6 5Z" class="ah" transform="translate(150 210) rotate(90)"/><g transform="translate(235 290) rotate(15) scale(1)"><ellipse cx="0" cy="0" rx="17" ry="3.8" class="sky q8"/><path d="M2 -3L-4 -17L1 -17L8 -3Z" class="sky q8"/><path d="M2 3L-4 17L1 17L8 3Z" class="sky q8"/><path d="M-13 -2L-17 -8L-13 -8L-9 -2Z" class="sky q8"/><path d="M-13 2L-17 8L-13 8L-9 2Z" class="sky q8"/></g><g transform="translate(430 250) rotate(-105) scale(1)"><ellipse cx="0" cy="0" rx="17" ry="3.8" class="sky q8"/><path d="M2 -3L-4 -17L1 -17L8 -3Z" class="sky q8"/><path d="M2 3L-4 17L1 17L8 3Z" class="sky q8"/><path d="M-13 -2L-17 -8L-13 -8L-9 -2Z" class="sky q8"/><path d="M-13 2L-17 8L-13 8L-9 2Z" class="sky q8"/></g><g transform="translate(345 130) rotate(165) scale(1)"><ellipse cx="0" cy="0" rx="17" ry="3.8" class="sky q8"/><path d="M2 -3L-4 -17L1 -17L8 -3Z" class="sky q8"/><path d="M2 3L-4 17L1 17L8 3Z" class="sky q8"/><path d="M-13 -2L-17 -8L-13 -8L-9 -2Z" class="sky q8"/><path d="M-13 2L-17 8L-13 8L-9 2Z" class="sky q8"/></g><g transform="translate(150 250) rotate(105) scale(1)"><ellipse cx="0" cy="0" rx="17" ry="3.8" class="sky q8"/><path d="M2 -3L-4 -17L1 -17L8 -3Z" class="sky q8"/><path d="M2 3L-4 17L1 17L8 3Z" class="sky q8"/><path d="M-13 -2L-17 -8L-13 -8L-9 -2Z" class="sky q8"/><path d="M-13 2L-17 8L-13 8L-9 2Z" class="sky q8"/></g><text class="t m" x="300" y="309" style="font-size:12px">Downwind leg</text><text class="t m" x="300" y="120" style="font-size:12px">Upwind leg</text><text class="t" x="444" y="296" style="font-size:12px">Steepest bank</text><text class="s q2" x="444" y="310">after the downwind leg</text><text class="t e" x="140" y="118" style="font-size:12px">Shallowest bank</text><text class="s q2 e" x="140" y="132">on the upwind leg</text><path d="M150 207L200 207" class="dk q1" style="stroke-width:2"/><text class="s q2 m" x="175" y="200">¼ to ½ mile</text><path d="M500 175L640 135" class="acc"/><path d="M-6 -5L7 0L-6 5Z" class="ah" transform="translate(640 135) rotate(-15.9)"/><text class="t m" x="570" y="200" style="font-size:12px">Wind</text><text class="s q2" x="500" y="230">Nose points into the wind</text><text class="s q2" x="500" y="245">on every leg (crab angle)</text><rect class="cl" x="20" y="348" width="220.7" height="115" rx="8"/><rect x="20" y="348" width="220.7" height="26" rx="10" class="sky q4"/><text class="t q3" x="30" y="366">Set up</text><circle cx="33" cy="384" r="2.2" class="ah"/><text class="s q2" x="42" y="388">Fly 600 to 1,000 feet AGL</text><circle cx="33" cy="402" r="2.2" class="ah"/><text class="s q2" x="42" y="406">Stay about ¼ to ½ mile from</text><text class="s q2" x="42" y="421">the field boundaries</text><rect class="cl" x="254.7" y="348" width="220.7" height="115" rx="8"/><rect x="254.7" y="348" width="220.7" height="26" rx="10" class="rose q4"/><text class="t q3" x="264.7" y="366">Wind</text><circle cx="267.7" cy="384" r="2.2" class="ah"/><text class="s q2" x="276.7" y="388">Crab into the wind on each leg</text><text class="s q2" x="276.7" y="403">to hold the track</text><circle cx="267.7" cy="417" r="2.2" class="ah"/><text class="s q2" x="276.7" y="421">Bank steepest where</text><text class="s q2" x="276.7" y="436">groundspeed is highest,</text><text class="s q2" x="276.7" y="451">shallowest where it is lowest</text><rect class="cl" x="489.3" y="348" width="220.7" height="115" rx="8"/><rect x="489.3" y="348" width="220.7" height="26" rx="10" class="mint q4"/><text class="t q3" x="499.3" y="366">Why</text><circle cx="502.3" cy="384" r="2.2" class="ah"/><text class="s q2" x="511.3" y="388">Practice for the traffic</text><text class="s q2" x="511.3" y="403">pattern</text><circle cx="502.3" cy="417" r="2.2" class="ah"/><text class="s q2" x="511.3" y="421">Teaches you to see and correct</text><text class="s q2" x="511.3" y="436">wind drift</text><text class="s" x="20" y="477" style="font-size:11px">Source: Airplane Flying Handbook ch. 7</text></svg>