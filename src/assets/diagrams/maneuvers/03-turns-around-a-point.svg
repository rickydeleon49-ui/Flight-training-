<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 467" role="img" aria-labelledby="ti de"><title id="ti">Turns around a point</title><desc id="de">Top view of a circle flown around a point with the wind blowing from left to right, steepest bank on the downwind side and shallowest bank on the upwind side, with the same radius all the way round.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:17px}.q1{stroke-width:2;opacity:.6}.q2{font-size:11.5px}.q3{font-size:13px}.q4{font-size:12px}.q5{stroke:currentColor;stroke-width:1.5}.q6{stroke-width:2;stroke-dasharray:7 6}.q8{stroke:currentColor;stroke-width:1.4;stroke-linejoin:round}</style><text class="t" x="20" y="28" style="font-size:15px">Turns around a point</text><text class="s q3" x="20" y="50">Circle a point on the ground at the same distance all the way round.</text><text class="s q3" x="20" y="66.5">Enter downwind and keep the radius the same.</text><rect class="cl" x="20" y="91" width="690" height="240" rx="8"/><circle cx="300" cy="211" r="75" class="acc" style="stroke-width:3"/><circle cx="300" cy="211" r="5" class="ah"/><text class="s q2" x="310" y="229">Point</text><path d="M300 211L353 158" class="dk q6" style="stroke-width:2"/><text class="s q2" x="240" y="185">Same radius</text><path d="M-6 -5L7 0L-6 5Z" class="ah" transform="translate(330 286) rotate(0)"/><path d="M-6 -5L7 0L-6 5Z" class="ah" transform="translate(270 136) rotate(180)"/><path d="M-6 -5L7 0L-6 5Z" class="ah" transform="translate(375 191) rotate(-90)"/><path d="M-6 -5L7 0L-6 5Z" class="ah" transform="translate(225 231) rotate(90)"/><g transform="translate(300 286) rotate(0) scale(1)"><ellipse cx="0" cy="0" rx="17" ry="3.8" class="sky q8"/><path d="M2 -3L-4 -17L1 -17L8 -3Z" class="sky q8"/><path d="M2 3L-4 17L1 17L8 3Z" class="sky q8"/><path d="M-13 -2L-17 -8L-13 -8L-9 -2Z" class="sky q8"/><path d="M-13 2L-17 8L-13 8L-9 2Z" class="sky q8"/></g><g transform="translate(300 136) rotate(180) scale(1)"><ellipse cx="0" cy="0" rx="17" ry="3.8" class="sky q8"/><path d="M2 -3L-4 -17L1 -17L8 -3Z" class="sky q8"/><path d="M2 3L-4 17L1 17L8 3Z" class="sky q8"/><path d="M-13 -2L-17 -8L-13 -8L-9 -2Z" class="sky q8"/><path d="M-13 2L-17 8L-13 8L-9 2Z" class="sky q8"/></g><text class="t m" x="300" y="320" style="font-size:12px">Downwind: steepest bank</text><text class="t m" x="300" y="110" style="font-size:12px">Upwind: shallowest bank</text><path d="M520 190L650 190" class="acc"/><path d="M-6 -5L7 0L-6 5Z" class="ah" transform="translate(650 190) rotate(0)"/><text class="t m" x="585" y="215" style="font-size:12px">Wind</text><text class="s q2" x="520" y="250">Nose points into the wind</text><text class="s q2" x="520" y="265">to hold the circle</text><rect class="cl" x="20" y="343" width="220.7" height="103" rx="8"/><rect x="20" y="343" width="220.7" height="26" rx="10" class="sky q4"/><text class="t q3" x="30" y="361">Set up</text><circle cx="33" cy="379" r="2.2" class="ah"/><text class="s q2" x="42" y="383">Pick a point, such as a road</text><text class="s q2" x="42" y="398">crossing</text><circle cx="33" cy="412" r="2.2" class="ah"/><text class="s q2" x="42" y="416">Fly 600 to 1,000 feet AGL</text><circle cx="33" cy="430" r="2.2" class="ah"/><text class="s q2" x="42" y="434">Enter downwind</text><rect class="cl" x="254.7" y="343" width="220.7" height="103" rx="8"/><rect x="254.7" y="343" width="220.7" height="26" rx="10" class="rose q4"/><text class="t q3" x="264.7" y="361">Fly it</text><circle cx="267.7" cy="379" r="2.2" class="ah"/><text class="s q2" x="276.7" y="383">Hold the same radius from the</text><text class="s q2" x="276.7" y="398">point</text><circle cx="267.7" cy="412" r="2.2" class="ah"/><text class="s q2" x="276.7" y="416">Bank steepest downwind,</text><text class="s q2" x="276.7" y="431">shallowest upwind</text><rect class="cl" x="489.3" y="343" width="220.7" height="103" rx="8"/><rect x="489.3" y="343" width="220.7" height="26" rx="10" class="mint q4"/><text class="t q3" x="499.3" y="361">Why</text><circle cx="502.3" cy="379" r="2.2" class="ah"/><text class="s q2" x="511.3" y="383">Teaches you to correct for</text><text class="s q2" x="511.3" y="398">wind drift while turning</text><circle cx="502.3" cy="412" r="2.2" class="ah"/><text class="s q2" x="511.3" y="416">Practice at dividing your</text><text class="s q2" x="511.3" y="431">attention</text><text class="s" x="20" y="460" style="font-size:11px">Source: Airplane Flying Handbook ch. 7</text></svg>