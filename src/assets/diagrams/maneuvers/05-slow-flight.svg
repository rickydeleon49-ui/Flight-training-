<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 457" role="img" aria-labelledby="ti de"><title id="ti">Slow flight</title><desc id="de">Side view of an airplane flying level at a high pitch attitude and a high angle of attack, with a note that any further increase in angle of attack, increase in load factor or reduction in power would bring a stall warning.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:17px}.q1{stroke-width:2;opacity:.6}.q2{font-size:11.5px}.q3{font-size:13px}.q4{font-size:12px}.q5{stroke:currentColor;stroke-width:1.5}.q6{stroke-width:2;stroke-dasharray:7 6}.q8{stroke:currentColor;stroke-width:1.4;stroke-linejoin:round}</style><text class="t" x="20" y="28" style="font-size:15px">Slow flight</text><text class="s q3" x="20" y="50">Fly at the slowest speed that is just short of a stall warning.</text><text class="s q3" x="20" y="66.5">Level, coordinated, and ready to recover.</text><rect class="cl" x="20" y="91" width="690" height="215" rx="8"/><path d="M30 200L420 200" class="dk q6" style="stroke-width:2;stroke-dasharray:7 6"/><path d="M-6 -5L7 0L-6 5Z" class="dh" transform="translate(420 200) rotate(0)"/><text class="s q2" x="34" y="194">Level flight path</text><g transform="translate(220 200) rotate(-12) scale(1.6)"><ellipse cx="0" cy="0" rx="24" ry="5.5" class="sky q8"/><path d="M-20 -2L-29 -13L-22 -13L-12 -3Z" class="sky q8"/><path d="M0 2L8 2L-4 11L-9 11Z" class="cl q8"/></g><text class="s q2" x="110" y="252">Power added to hold altitude</text><text class="t" x="110" y="150" style="font-size:12px">High pitch, high angle of attack</text><text class="t" x="470" y="112" style="font-size:12px">Warning, not a stall</text><rect x="470" y="125" width="220" height="86" rx="8" class="rose q4"/><text class="s q2" x="480" y="147">Any more angle of attack,</text><text class="s q2" x="480" y="162">more load factor or less power</text><text class="s q2" x="480" y="177">would bring a stall warning</text><text class="s q2" x="480" y="198">(buffet, stall horn)</text><rect class="cl" x="20" y="318" width="220.7" height="118" rx="8"/><rect x="20" y="318" width="220.7" height="26" rx="10" class="sky q4"/><text class="t q3" x="30" y="336">Fly it</text><circle cx="33" cy="354" r="2.2" class="ah"/><text class="s q2" x="42" y="358">Clear the area first</text><circle cx="33" cy="372" r="2.2" class="ah"/><text class="s q2" x="42" y="376">Slow down, raise the nose, add</text><text class="s q2" x="42" y="391">power to hold altitude</text><circle cx="33" cy="405" r="2.2" class="ah"/><text class="s q2" x="42" y="409">Keep the airplane coordinated</text><rect class="cl" x="254.7" y="318" width="220.7" height="118" rx="8"/><rect x="254.7" y="318" width="220.7" height="26" rx="10" class="rose q4"/><text class="t q3" x="264.7" y="336">Remember</text><circle cx="267.7" cy="354" r="2.2" class="ah"/><text class="s q2" x="276.7" y="358">Control response is soft</text><circle cx="267.7" cy="372" r="2.2" class="ah"/><text class="s q2" x="276.7" y="376">Stay just short of the stall</text><text class="s q2" x="276.7" y="391">warning</text><rect class="cl" x="489.3" y="318" width="220.7" height="118" rx="8"/><rect x="489.3" y="318" width="220.7" height="26" rx="10" class="mint q4"/><text class="t q3" x="499.3" y="336">Recover</text><circle cx="502.3" cy="354" r="2.2" class="ah"/><text class="s q2" x="511.3" y="358">Lower the nose to reduce the</text><text class="s q2" x="511.3" y="373">angle of attack</text><circle cx="502.3" cy="387" r="2.2" class="ah"/><text class="s q2" x="511.3" y="391">Add power</text><circle cx="502.3" cy="405" r="2.2" class="ah"/><text class="s q2" x="511.3" y="409">Return to the set speed and</text><text class="s q2" x="511.3" y="424">altitude</text><text class="s" x="20" y="450" style="font-size:11px">Source: Airplane Flying Handbook ch. 5 and the Private Pilot ACS (FAA-S-ACS-6C)</text></svg>