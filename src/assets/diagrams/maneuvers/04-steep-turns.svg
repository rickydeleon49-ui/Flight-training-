<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 487" role="img" aria-labelledby="ti de"><title id="ti">Steep turns</title><desc id="de">Front view of an airplane banked 45 degrees, with the Private Pilot ACS tolerances for a steep turn: altitude plus or minus 100 feet, airspeed plus or minus 10 knots, bank 45 degrees plus or minus 5, and rollout within 10 degrees of the entry heading.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:17px}.q1{stroke-width:2;opacity:.6}.q2{font-size:11.5px}.q3{font-size:13px}.q4{font-size:12px}.q5{stroke:currentColor;stroke-width:1.5}.q6{stroke-width:2;stroke-dasharray:7 6}.q8{stroke:currentColor;stroke-width:1.4;stroke-linejoin:round}</style><text class="t" x="20" y="28" style="font-size:15px">Steep turns</text><text class="s q3" x="20" y="50">A turn of 360 degrees at about 45 degrees of bank.</text><text class="s q3" x="20" y="66.5">Hold altitude and airspeed all the way round.</text><rect class="cl" x="20" y="91" width="690" height="245" rx="8"/><path d="M30 190L330 190" class="dk q6" style="stroke-width:2;stroke-dasharray:7 6"/><text class="s q2" x="34" y="184">Horizon</text><g transform="translate(180 190) rotate(-45)"><path d="M-95 -3L95 -3L95 3L-95 3Z" class="sky q8"/><ellipse cx="0" cy="0" rx="14" ry="11" class="sky q8"/></g><path d="M270 190A90 90 0 0 0 243.6 126.4" class="acc" style="stroke-width:2.5"/><text class="t" x="278" y="160" style="font-size:12px">45° bank</text><text class="s q2" x="40" y="300">Front view, banked 45°</text><text class="t" x="380" y="112" style="font-size:12px">Private pilot ACS limits</text><rect x="380" y="125" width="310" height="30" rx="8" class="sky q4"/><text class="t" x="392" y="145" style="font-size:12px">Altitude</text><text class="t e" x="678" y="145" style="font-size:12px">±100 ft</text><rect x="380" y="163" width="310" height="30" rx="8" class="lav q4"/><text class="t" x="392" y="183" style="font-size:12px">Airspeed</text><text class="t e" x="678" y="183" style="font-size:12px">±10 kt</text><rect x="380" y="201" width="310" height="30" rx="8" class="mint q4"/><text class="t" x="392" y="221" style="font-size:12px">Bank angle</text><text class="t e" x="678" y="221" style="font-size:12px">45° ±5°</text><rect x="380" y="239" width="310" height="30" rx="8" class="rose q4"/><text class="t" x="392" y="259" style="font-size:12px">Roll out on entry heading</text><text class="t e" x="678" y="259" style="font-size:12px">±10°</text><rect class="cl" x="20" y="348" width="220.7" height="118" rx="8"/><rect x="20" y="348" width="220.7" height="26" rx="10" class="sky q4"/><text class="t q3" x="30" y="366">Roll in</text><circle cx="33" cy="384" r="2.2" class="ah"/><text class="s q2" x="42" y="388">Clear the area first</text><circle cx="33" cy="402" r="2.2" class="ah"/><text class="s q2" x="42" y="406">Set the manufacturer's</text><text class="s q2" x="42" y="421">recommended airspeed, or a</text><text class="s q2" x="42" y="436">safe speed not above VA</text><circle cx="33" cy="450" r="2.2" class="ah"/><text class="s q2" x="42" y="454">Roll smoothly into 45° of bank</text><rect class="cl" x="254.7" y="348" width="220.7" height="118" rx="8"/><rect x="254.7" y="348" width="220.7" height="26" rx="10" class="rose q4"/><text class="t q3" x="264.7" y="366">Hold it</text><circle cx="267.7" cy="384" r="2.2" class="ah"/><text class="s q2" x="276.7" y="388">Add back pressure to hold</text><text class="s q2" x="276.7" y="403">altitude</text><circle cx="267.7" cy="417" r="2.2" class="ah"/><text class="s q2" x="276.7" y="421">Add power to hold airspeed</text><circle cx="267.7" cy="435" r="2.2" class="ah"/><text class="s q2" x="276.7" y="439">Keep the bank at 45°</text><rect class="cl" x="489.3" y="348" width="220.7" height="118" rx="8"/><rect x="489.3" y="348" width="220.7" height="26" rx="10" class="mint q4"/><text class="t q3" x="499.3" y="366">Roll out</text><circle cx="502.3" cy="384" r="2.2" class="ah"/><text class="s q2" x="511.3" y="388">Roll out on the entry heading</text><circle cx="502.3" cy="402" r="2.2" class="ah"/><text class="s q2" x="511.3" y="406">Relax the back pressure as the</text><text class="s q2" x="511.3" y="421">wings level</text><text class="s" x="20" y="480" style="font-size:11px">Source: Airplane Flying Handbook ch. 10 and the Private Pilot ACS (FAA-S-ACS-6C)</text></svg>