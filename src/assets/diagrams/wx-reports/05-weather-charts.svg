<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 520" role="img" aria-labelledby="ti de"><title id="ti">Weather charts and flight categories</title><desc id="de">Flight categories on a weather depiction chart: IFR is a hatched area with a smooth outline for ceilings less than 1,000 feet and visibility less than 3 miles; MVFR is a nonhatched outlined area for ceilings 1,000 to 3,000 feet and visibility 3 to 5 miles; VFR is not outlined. Summary cards for the surface analysis chart, the weather depiction chart, and the low-level significant weather prognostic chart.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style>
<text class="t" x="20" y="28" style="font-size:15px">Flight categories on a weather depiction chart</text>
<rect x="20" y="40" width="214" height="52" rx="22" style="fill:var(--palette-berry,#A84C6B);fill-opacity:.18;stroke:var(--palette-berry,#A84C6B);stroke-width:3"/>
<path d="M32 50H222" style="stroke:var(--palette-berry,#A84C6B);stroke-width:1.6;opacity:.7"/><path d="M32 57H222" style="stroke:var(--palette-berry,#A84C6B);stroke-width:1.6;opacity:.7"/><path d="M32 64H222" style="stroke:var(--palette-berry,#A84C6B);stroke-width:1.6;opacity:.7"/><path d="M32 71H222" style="stroke:var(--palette-berry,#A84C6B);stroke-width:1.6;opacity:.7"/><path d="M32 78H222" style="stroke:var(--palette-berry,#A84C6B);stroke-width:1.6;opacity:.7"/><path d="M32 85H222" style="stroke:var(--palette-berry,#A84C6B);stroke-width:1.6;opacity:.7"/>
<text class="t m" x="127" y="72" style="font-size:17px;paint-order:stroke;stroke:var(--bg,transparent)">IFR</text>
<text class="t" x="20" y="112" style="font-size:13px">Hatched area, smooth outline.</text>
<text class="s" x="20" y="128.0" style="font-size:12.5px">Ceilings less than 1,000 ft and</text>
<text class="s" x="20" y="144.0" style="font-size:12.5px">visibility less than 3 miles.</text>
<rect x="258" y="40" width="214" height="52" rx="22" style="fill:var(--palette-sky,#8EBFDA);fill-opacity:.18;stroke:var(--palette-sky,#8EBFDA);stroke-width:3"/>
<text class="t m" x="365" y="72" style="font-size:17px;paint-order:stroke;stroke:var(--bg,transparent)">MVFR</text>
<text class="t" x="258" y="112" style="font-size:13px">Nonhatched area, smooth outline.</text>
<text class="s" x="258" y="128.0" style="font-size:12.5px">Ceilings 1,000 to 3,000 ft,</text>
<text class="s" x="258" y="144.0" style="font-size:12.5px">visibility 3 to 5 miles.</text>
<rect x="496" y="40" width="214" height="52" rx="22" style="fill:none;stroke:currentColor;stroke-width:1.2;stroke-dasharray:2 5;opacity:.5"/>
<text class="t m" x="603" y="72" style="font-size:17px;paint-order:stroke;stroke:var(--bg,transparent)">VFR</text>
<text class="t" x="496" y="112" style="font-size:13px">Not outlined.</text>
<text class="s" x="496" y="128.0" style="font-size:12.5px">No ceiling or ceiling greater than</text>
<text class="s" x="496" y="144.0" style="font-size:12.5px">3,000 ft, and visibility greater</text>
<text class="s" x="496" y="160.0" style="font-size:12.5px">than 5 miles.</text>
<rect class="cl" x="20" y="176" width="214" height="330" rx="8"/>
<text class="t" x="32" y="198" style="font-size:14px">Surface analysis</text>
<text class="s" x="32" y="219.0" style="font-size:12.5px">Current surface weather.</text>
<text class="s" x="32" y="239.5" style="font-size:12.5px">Sent every 3 hours.</text>
<text class="s" x="32" y="260.0" style="font-size:12.5px">Covers the contiguous 48</text>
<text class="s" x="32" y="275.5" style="font-size:12.5px">states and adjacent areas.</text>
<text class="s" x="32" y="296.0" style="font-size:12.5px">Shows highs and lows, fronts,</text>
<text class="s" x="32" y="311.5" style="font-size:12.5px">temperatures, dew points,</text>
<text class="s" x="32" y="327.0" style="font-size:12.5px">wind, local weather and visual</text>
<text class="s" x="32" y="342.5" style="font-size:12.5px">obstructions.</text>
<text class="s" x="32" y="363.0" style="font-size:12.5px">Each reporting point is a</text>
<text class="s" x="32" y="378.5" style="font-size:12.5px">station model.</text>
<rect class="cl" x="258" y="176" width="214" height="330" rx="8"/>
<text class="t" x="270" y="198" style="font-size:14px">Weather depiction</text>
<text class="s" x="270" y="219.0" style="font-size:12.5px">Surface conditions from METAR</text>
<text class="s" x="270" y="234.5" style="font-size:12.5px">and other surface</text>
<text class="s" x="270" y="250.0" style="font-size:12.5px">observations.</text>
<text class="s" x="270" y="270.5" style="font-size:12.5px">Made by computer every 3</text>
<text class="s" x="270" y="286.0" style="font-size:12.5px">hours, beginning at 0100Z.</text>
<text class="s" x="270" y="306.5" style="font-size:12.5px">Shows IFR, MVFR and VFR areas,</text>
<text class="s" x="270" y="322.0" style="font-size:12.5px">plus fronts, troughs and</text>
<text class="s" x="270" y="337.5" style="font-size:12.5px">squall lines from the previous</text>
<text class="s" x="270" y="353.0" style="font-size:12.5px">hour's surface analysis.</text>
<text class="s" x="270" y="373.5" style="font-size:12.5px">Modified station model: total</text>
<text class="s" x="270" y="389.0" style="font-size:12.5px">sky cover, ceiling height,</text>
<text class="s" x="270" y="404.5" style="font-size:12.5px">weather, obstructions to</text>
<text class="s" x="270" y="420.0" style="font-size:12.5px">visibility. No wind or</text>
<text class="s" x="270" y="435.5" style="font-size:12.5px">pressure.</text>
<text class="s" x="270" y="456.0" style="font-size:12.5px">A bracket ] to the right of</text>
<text class="s" x="270" y="471.5" style="font-size:12.5px">the station = automated</text>
<text class="s" x="270" y="487.0" style="font-size:12.5px">station.</text>
<rect class="cl" x="496" y="176" width="214" height="330" rx="8"/>
<text class="t" x="508" y="198" style="font-size:14px">Low-level significant</text>
<text class="t" x="508" y="215" style="font-size:14px">weather prog</text>
<text class="s" x="508" y="236.0" style="font-size:12.5px">Forecast of aviation weather</text>
<text class="s" x="508" y="251.5" style="font-size:12.5px">hazards, surface to FL240</text>
<text class="s" x="508" y="267.0" style="font-size:12.5px">(24,000 ft), for briefing a</text>
<text class="s" x="508" y="282.5" style="font-size:12.5px">VFR pilot.</text>
<text class="s" x="508" y="303.0" style="font-size:12.5px">Covers the 48 states, southern</text>
<text class="s" x="508" y="318.5" style="font-size:12.5px">Canada and coastal waters.</text>
<text class="s" x="508" y="339.0" style="font-size:12.5px">Issued four times daily, valid</text>
<text class="s" x="508" y="354.5" style="font-size:12.5px">0000, 0600, 1200 and 1800 UTC.</text>
<text class="s" x="508" y="375.0" style="font-size:12.5px">Left and right sides are 12</text>
<text class="s" x="508" y="390.5" style="font-size:12.5px">and 24 hour forecasts.</text>
<text class="s" x="508" y="411.0" style="font-size:12.5px">Two panels: freezing levels,</text>
<text class="s" x="508" y="426.5" style="font-size:12.5px">turbulence, and MVFR and IFR</text>
<text class="s" x="508" y="442.0" style="font-size:12.5px">contoured areas.</text>
</svg>
