<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 520" role="img" aria-labelledby="ti de"><title id="ti">Weather charts and flight categories</title><desc id="de">Flight categories on a weather depiction chart: IFR is a hatched area with a smooth outline for ceilings less than 1,000 feet and visibility less than 3 miles; MVFR is a nonhatched outlined area for ceilings 1,000 to 3,000 feet and visibility 3 to 5 miles; VFR is not outlined. Summary cards for the surface analysis chart, the weather depiction chart, and the low-level significant weather prognostic chart.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:12.5px}.q1{stroke:var(--palette-berry,#A84C6B);stroke-width:1.6;opacity:.7}.q2{font-size:14px}.q3{font-size:17px;paint-order:stroke;stroke:var(--bg,transparent)}.q4{font-size:13px}</style><text class="t" x="20" y="28" style="font-size:15px">Flight categories on a weather depiction chart</text><rect x="20" y="40" width="214" height="52" rx="22" style="fill:var(--palette-berry,#A84C6B);fill-opacity:.18;stroke:var(--palette-berry,#A84C6B);stroke-width:3"/><path d="M32 50H222" class="q1"/><path d="M32 57H222" class="q1"/><path d="M32 64H222" class="q1"/><path d="M32 71H222" class="q1"/><path d="M32 78H222" class="q1"/><path d="M32 85H222" class="q1"/><text class="t m q3" x="127" y="72">IFR</text><text class="t q4" x="20" y="112">Hatched area, smooth outline.</text><text class="s q0" x="20" y="128">Ceilings less than 1,000 ft and</text><text class="s q0" x="20" y="144">visibility less than 3 miles.</text><rect x="258" y="40" width="214" height="52" rx="22" style="fill:var(--palette-sky,#8EBFDA);fill-opacity:.18;stroke:var(--palette-sky,#8EBFDA);stroke-width:3"/><text class="t m q3" x="365" y="72">MVFR</text><text class="t q4" x="258" y="112">Nonhatched area, smooth outline.</text><text class="s q0" x="258" y="128">Ceilings 1,000 to 3,000 ft,</text><text class="s q0" x="258" y="144">visibility 3 to 5 miles.</text><rect x="496" y="40" width="214" height="52" rx="22" style="fill:none;stroke:currentColor;stroke-width:1.2;stroke-dasharray:2 5;opacity:.5"/><text class="t m q3" x="603" y="72">VFR</text><text class="t q4" x="496" y="112">Not outlined.</text><text class="s q0" x="496" y="128">No ceiling or ceiling greater than</text><text class="s q0" x="496" y="144">3,000 ft, and visibility greater</text><text class="s q0" x="496" y="160">than 5 miles.</text><rect class="cl" x="20" y="176" width="214" height="330" rx="8"/><text class="t q2" x="32" y="198">Surface analysis</text><text class="s q0" x="32" y="219">Current surface weather.</text><text class="s q0" x="32" y="239.5">Sent every 3 hours.</text><text class="s q0" x="32" y="260">Covers the contiguous 48</text><text class="s q0" x="32" y="275.5">states and adjacent areas.</text><text class="s q0" x="32" y="296">Shows highs and lows, fronts,</text><text class="s q0" x="32" y="311.5">temperatures, dew points,</text><text class="s q0" x="32" y="327">wind, local weather and visual</text><text class="s q0" x="32" y="342.5">obstructions.</text><text class="s q0" x="32" y="363">Each reporting point is a</text><text class="s q0" x="32" y="378.5">station model.</text><rect class="cl" x="258" y="176" width="214" height="330" rx="8"/><text class="t q2" x="270" y="198">Weather depiction</text><text class="s q0" x="270" y="219">Surface conditions from METAR</text><text class="s q0" x="270" y="234.5">and other surface</text><text class="s q0" x="270" y="250">observations.</text><text class="s q0" x="270" y="270.5">Made by computer every 3</text><text class="s q0" x="270" y="286">hours, beginning at 0100Z.</text><text class="s q0" x="270" y="306.5">Shows IFR, MVFR and VFR areas,</text><text class="s q0" x="270" y="322">plus fronts, troughs and</text><text class="s q0" x="270" y="337.5">squall lines from the previous</text><text class="s q0" x="270" y="353">hour's surface analysis.</text><text class="s q0" x="270" y="373.5">Modified station model: total</text><text class="s q0" x="270" y="389">sky cover, ceiling height,</text><text class="s q0" x="270" y="404.5">weather, obstructions to</text><text class="s q0" x="270" y="420">visibility. No wind or</text><text class="s q0" x="270" y="435.5">pressure.</text><text class="s q0" x="270" y="456">A bracket ] to the right of</text><text class="s q0" x="270" y="471.5">the station = automated</text><text class="s q0" x="270" y="487">station.</text><rect class="cl" x="496" y="176" width="214" height="330" rx="8"/><text class="t q2" x="508" y="198">Low-level significant</text><text class="t q2" x="508" y="215">weather prog</text><text class="s q0" x="508" y="236">Forecast of aviation weather</text><text class="s q0" x="508" y="251.5">hazards, surface to FL240</text><text class="s q0" x="508" y="267">(24,000 ft), for briefing a</text><text class="s q0" x="508" y="282.5">VFR pilot.</text><text class="s q0" x="508" y="303">Covers the 48 states, southern</text><text class="s q0" x="508" y="318.5">Canada and coastal waters.</text><text class="s q0" x="508" y="339">Issued four times daily, valid</text><text class="s q0" x="508" y="354.5">0000, 0600, 1200 and 1800 UTC.</text><text class="s q0" x="508" y="375">Left and right sides are 12</text><text class="s q0" x="508" y="390.5">and 24 hour forecasts.</text><text class="s q0" x="508" y="411">Two panels: freezing levels,</text><text class="s q0" x="508" y="426.5">turbulence, and MVFR and IFR</text><text class="s q0" x="508" y="442">contoured areas.</text></svg>
