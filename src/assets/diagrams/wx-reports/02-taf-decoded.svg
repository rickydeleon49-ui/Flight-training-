<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 479" role="img" aria-labelledby="ti de"><title id="ti">TAF decoded with change groups</title><desc id="de">An example terminal aerodrome forecast adapted from the PHAK example: KPIR 111130Z 1112/1212, then TEMPO, FM, and PROB30 change groups. FM means a rapid significant change, TEMPO means a temporary fluctuation lasting less than an hour, and PROB30 gives a 30 percent probability of thunderstorms and precipitation and is not used in the first 6 hours.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:12.5px}.q1{font-size:14px;font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:600}.q2{font-size:13.5px;font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:600}</style><text class="t" x="20" y="28" style="font-size:15px">Example TAF (adapted from the PHAK example)</text><rect class="sky" x="20" y="38" width="350" height="176" rx="8"/><text class="t q1" x="32" y="62">TAF</text><text class="t q1" x="32" y="83">KPIR 111130Z 1112/1212</text><text class="t q1" x="32" y="104">TEMPO 1112/1114 5SM BR</text><text class="t q1" x="32" y="125">FM111500 16015G25KT P6SM SCT040 BKN250</text><text class="t q1" x="32" y="146">FM120000 14012KT P6SM BKN080 OVC150</text><text class="t q1" x="32" y="167">PROB30 1200/1204 3SM TSRA BKN030CB</text><text class="t q1" x="32" y="188">FM120400 14008KT P6SM SCT040 OVC080</text><text class="t q1" x="32" y="209">TEMPO 1204/1208 3SM TSRA OVC030CB</text><rect class="cl" x="20" y="226" width="350" height="190" rx="8"/><text class="t" x="32" y="248" style="font-size:14px">About the TAF</text><text class="s q0" x="32" y="266">Covers a five statute mile radius around an airport,</text><text class="s q0" x="32" y="282">usually larger airports.</text><text class="s q0" x="32" y="303">Valid 24 or 30 hours; updated four times a day at</text><text class="s q0" x="32" y="319">0000, 0600, 1200 and 1800Z.</text><text class="s q0" x="32" y="340">Routine (TAF) or amended (TAF AMD). Same descriptors</text><text class="s q0" x="32" y="356">and abbreviations as a METAR.</text><text class="s q0" x="32" y="377">Only cumulonimbus (CB) is forecast in sky condition,</text><text class="s q0" x="32" y="393">not towering cumulus.</text><text class="t q2" x="388" y="51.5">KPIR 111130Z</text><text class="s q0" x="388" y="68.5">Station and origin: Pierre, South Dakota, on the</text><text class="s q0" x="388" y="84.5">11th at 1130Z (UTC).</text><text class="t q2" x="388" y="121">1112/1212</text><text class="s q0" x="388" y="138">Valid period: starts the 11th at 12Z, ends the 12th</text><text class="s q0" x="388" y="154">at 12Z. Midnight start is 00; midnight end is 24 (a</text><text class="s q0" x="388" y="170">00Z TAF issued on the 9th: 0900/0924).</text><text class="t q2" x="388" y="206.5">FM111500 16015G25KT P6SM</text><text class="s q0" x="388" y="223.5">FROM: rapid, significant change, usually within an</text><text class="s q0" x="388" y="239.5">hour. From the 11th at 1500Z wind from 160 degrees</text><text class="s q0" x="388" y="255.5">true, 15 knots gusting 25; P6SM = visibility</text><text class="s q0" x="388" y="271.5">greater than 6 SM.</text><text class="t q2" x="388" y="308">TEMPO 1112/1114 5SM BR</text><text class="s q0" x="388" y="325">TEMPORARY fluctuations expected to last less than 1</text><text class="s q0" x="388" y="341">hour. Between 1200Z and 1400Z, visibility 5 SM in</text><text class="s q0" x="388" y="357">mist.</text><text class="t q2" x="388" y="393.5">PROB30 1200/1204 3SM TSRA</text><text class="s q0" x="388" y="410.5">A percentage chance (30) of thunderstorms and</text><text class="s q0" x="388" y="426.5">precipitation. Not used for the first 6 hours of</text><text class="s q0" x="388" y="442.5">the 24-hour forecast.</text></svg>
