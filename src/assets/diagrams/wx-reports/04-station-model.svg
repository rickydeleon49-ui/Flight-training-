<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 500" role="img" aria-labelledby="ti de"><title id="ti">Surface analysis station model</title><desc id="de">An example station model with made-up values: a station circle for total sky cover, temperature 72 and dew point 65 in degrees Fahrenheit on the left, sea level pressure 132 and a 3-hour pressure change of 12 tenths of a millibar on the right, and a wind pointer with a pennant, long barb and short barb. Barb key: short barb 5 knots, long barb 10 knots, pennant 50 knots. Pressure code: three digits with 10 or 9 in front.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:12.5px}.q1{font-size:13px}.q2{font-size:15px}.q3{stroke:currentColor;stroke-width:1.2;opacity:.5}.q4{stroke:currentColor;stroke-width:3;stroke-linecap:round;fill:none}.q5{font-size:14px}.q6{stroke:currentColor;stroke-width:3;stroke-linecap:round}.q7{fill:var(--palette-berry,#A84C6B)}</style><text class="t q2" x="20" y="28">Station model (example values)</text><circle cx="365" cy="108" r="20" class="sky" style="stroke:currentColor;stroke-width:2.5"/><path d="M365 128V196" class="q6"/><polygon points="365,196 365,183 383,196" class="ah q7"/><path d="M365 176L385 168M365 166L375 161" class="q4"/><text class="t e q2" x="337" y="102">72</text><text class="t e q2" x="337" y="128">65</text><text class="t q2" x="393" y="102">132</text><text class="t q2" x="393" y="128">12</text><path d="M298 97L307 97" class="q3"/><text class="s e q1" x="292" y="102">Temperature (F)</text><path d="M298 123L307 123" class="q3"/><text class="s e q1" x="292" y="128">Dew point (F)</text><path d="M427 97L437 97" class="q3"/><text class="s q1" x="443" y="102">Sea level pressure</text><path d="M405 123L437 123" class="q3"/><text class="s q1" x="443" y="128">3-hour pressure change</text><text class="s m q1" x="365" y="74">Station circle: total sky cover</text><text class="s q1" x="397" y="174">Wind pointer: true direction the wind blows from.</text><text class="s q1" x="397" y="190">Pennant 50 + long barb 10 + short barb 5 = 65 kt</text><text class="s q0" x="20" y="52">Plus present weather (over 100</text><text class="s q0" x="20" y="68">standard symbols), not drawn here.</text><rect class="cl" x="20" y="214" width="340" height="270" rx="8"/><text class="t q5" x="32" y="238">Wind barbs</text><path d="M60 270V300M60 270L76 264" class="q4"/><text class="s q1" x="94" y="290">Short barb = 5 knots</text><path d="M60 320V350M60 320L82 312" class="q4"/><text class="s q1" x="94" y="340">Long barb = 10 knots</text><path d="M60 370V400" class="q6"/><polygon points="60,370 60,384 80,377" class="ah q7"/><text class="s q1" x="94" y="390">Pennant = 50 knots</text><text class="s q0" x="32" y="432">The pointer line shows true direction.</text><text class="s q0" x="32" y="448">Wind is blowing from that direction.</text><rect class="cl" x="370" y="214" width="340" height="270" rx="8"/><text class="t q5" x="382" y="238">Sea level pressure code</text><text class="s q0" x="382" y="258">Three digits, to the nearest tenth of a millibar.</text><text class="s q0" x="382" y="274">Pressure of 1,000 mb or more: put 10 in front.</text><text class="s q0" x="382" y="290">Less than 1,000 mb: put 9 in front.</text><text class="s q0" x="382" y="310">Example: 132 reads 1013.2 mb. Example: 987 reads</text><text class="s q0" x="382" y="326">998.7 mb.</text><text class="t q5" x="382" y="366">Surface analysis chart</text><text class="s q0" x="382" y="384">Current surface weather, sent every 3 hours, for</text><text class="s q0" x="382" y="400">the contiguous 48 states and adjacent areas.</text><text class="s q0" x="382" y="420">Shows highs and lows, fronts, temperatures, dew</text><text class="s q0" x="382" y="436">points, wind, local weather and visual</text><text class="s q0" x="382" y="452">obstructions. Each reporting point is a station</text><text class="s q0" x="382" y="468">model.</text></svg>
