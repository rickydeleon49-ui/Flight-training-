<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 628" role="img" aria-labelledby="ti de"><title id="ti">PIREP format decoded</title><desc id="de">An example pilot weather report with made-up values: UA/OV GGG 090025/TM 1450/FL 060/TP C182/SK 080 OVC/WX FV04SM RA/TA 05/WV 270030KT/TB LGT/RM HVY RAIN. Decoded: routine report, 25 nautical miles out on the 090 radial from the Gregg County VOR, 1450 Zulu, 6,000 feet, Cessna 182, 8,000 overcast, 4 miles in rain, 5 degrees Celsius, wind 270 at 30 knots, light turbulence, no icing reported, rain is heavy.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style>
<text class="t" x="20" y="28" style="font-size:15px">Example PIREP (made-up values)</text>
<rect class="sky" x="20" y="38" width="690" height="50" rx="8"/>
<text class="t" x="32" y="59" style="font-size:14px;font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:600">UA/OV GGG 090025/TM 1450/FL 060/TP C182/SK 080 OVC/WX FV04SM RA/</text>
<text class="t" x="32" y="79" style="font-size:14px;font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:600">TA 05/WV 270030KT/TB LGT/RM HVY RAIN</text>
<rect class="cl" x="20" y="101" width="690" height="25" rx="4"/>
<text class="t" x="30" y="118" style="font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:600">UA</text>
<text class="s" x="210" y="118" style="font-size:13px">Type</text>
<text class="s" x="350" y="118" style="font-size:13px">Routine pilot report</text>
<text class="t" x="30" y="144" style="font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:600">OV GGG 090025</text>
<text class="s" x="210" y="144" style="font-size:13px">Location</text>
<text class="s" x="350" y="144" style="font-size:13px">25 NM out on the 090 degree radial, Gregg County VOR</text>
<rect class="cl" x="20" y="153" width="690" height="25" rx="4"/>
<text class="t" x="30" y="170" style="font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:600">TM 1450</text>
<text class="s" x="210" y="170" style="font-size:13px">Time</text>
<text class="s" x="350" y="170" style="font-size:13px">1450 Zulu</text>
<text class="t" x="30" y="196" style="font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:600">FL 060</text>
<text class="s" x="210" y="196" style="font-size:13px">Altitude</text>
<text class="s" x="350" y="196" style="font-size:13px">6,000 feet</text>
<rect class="cl" x="20" y="205" width="690" height="25" rx="4"/>
<text class="t" x="30" y="222" style="font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:600">TP C182</text>
<text class="s" x="210" y="222" style="font-size:13px">Aircraft type</text>
<text class="s" x="350" y="222" style="font-size:13px">Cessna 182</text>
<text class="t" x="30" y="248" style="font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:600">SK 080 OVC</text>
<text class="s" x="210" y="248" style="font-size:13px">Sky cover</text>
<text class="s" x="350" y="248" style="font-size:13px">8,000 feet overcast</text>
<rect class="cl" x="20" y="257" width="690" height="25" rx="4"/>
<text class="t" x="30" y="274" style="font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:600">WX FV04SM RA</text>
<text class="s" x="210" y="274" style="font-size:13px">Visibility/weather</text>
<text class="s" x="350" y="274" style="font-size:13px">4 miles in rain</text>
<text class="t" x="30" y="300" style="font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:600">TA 05</text>
<text class="s" x="210" y="300" style="font-size:13px">Temperature</text>
<text class="s" x="350" y="300" style="font-size:13px">5 degrees Celsius</text>
<rect class="cl" x="20" y="309" width="690" height="25" rx="4"/>
<text class="t" x="30" y="326" style="font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:600">WV 270030KT</text>
<text class="s" x="210" y="326" style="font-size:13px">Wind</text>
<text class="s" x="350" y="326" style="font-size:13px">270 degrees at 30 knots</text>
<text class="t" x="30" y="352" style="font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:600">TB LGT</text>
<text class="s" x="210" y="352" style="font-size:13px">Turbulence</text>
<text class="s" x="350" y="352" style="font-size:13px">Light</text>
<rect class="cl" x="20" y="361" width="690" height="25" rx="4"/>
<text class="t" x="30" y="378" style="font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:600">(no icing group)</text>
<text class="s" x="210" y="378" style="font-size:13px">Icing</text>
<text class="s" x="350" y="378" style="font-size:13px">None reported</text>
<text class="t" x="30" y="404" style="font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:600">RM HVY RAIN</text>
<text class="s" x="210" y="404" style="font-size:13px">Remarks</text>
<text class="s" x="350" y="404" style="font-size:13px">Rain is heavy</text>
<rect class="cl" x="20" y="432" width="690" height="176" rx="8"/>
<text class="t" x="32" y="454" style="font-size:14px">Why file a PIREP</text>
<text class="s" x="32" y="474.0" style="font-size:12.5px">PIREPs give conditions as they actually exist in</text>
<text class="s" x="32" y="490.0" style="font-size:12.5px">the air, which cannot be gathered from any other</text>
<text class="s" x="32" y="506.0" style="font-size:12.5px">source. Pilots can confirm heights of cloud bases</text>
<text class="s" x="32" y="522.0" style="font-size:12.5px">and tops, wind shear, turbulence and icing</text>
<text class="s" x="32" y="538.0" style="font-size:12.5px">locations.</text>
<text class="s" x="32" y="560.0" style="font-size:12.5px">Report unexpected weather to an FSS or ATC; they</text>
<text class="s" x="32" y="576.0" style="font-size:12.5px">add it to the system to brief other pilots.</text>
<text class="t" x="378" y="454" style="font-size:14px">Rules and form</text>
<text class="s" x="378" y="474.0" style="font-size:12.5px">ATC must ask pilots for reports if the ceiling is</text>
<text class="s" x="378" y="490.0" style="font-size:12.5px">below 5,000 ft or visibility is at or below 5</text>
<text class="s" x="378" y="506.0" style="font-size:12.5px">miles.</text>
<text class="s" x="378" y="528.0" style="font-size:12.5px">Items 1 to 5 of the form are required, plus at</text>
<text class="s" x="378" y="544.0" style="font-size:12.5px">least one weather phenomenon encountered. A PIREP</text>
<text class="s" x="378" y="560.0" style="font-size:12.5px">may be appended to a surface report.</text>
</svg>
