<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 628" role="img" aria-labelledby="ti de"><title id="ti">PIREP format decoded</title><desc id="de">An example pilot weather report with made-up values: UA/OV GGG 090025/TM 1450/FL 060/TP C182/SK 080 OVC/WX FV04SM RA/TA 05/WV 270030KT/TB LGT/RM HVY RAIN. Decoded: routine report, 25 nautical miles out on the 090 radial from the Gregg County VOR, 1450 Zulu, 6,000 feet, Cessna 182, 8,000 overcast, 4 miles in rain, 5 degrees Celsius, wind 270 at 30 knots, light turbulence, no icing reported, rain is heavy.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:13px}.q1{font-size:12.5px}.q2{font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:600}.q3{font-size:14px;font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:600}</style><text class="t" x="20" y="28" style="font-size:15px">Example PIREP (made-up values)</text><rect class="sky" x="20" y="38" width="690" height="50" rx="8"/><text class="t q3" x="32" y="59">UA/OV GGG 090025/TM 1450/FL 060/TP C182/SK 080 OVC/WX FV04SM RA/</text><text class="t q3" x="32" y="79">TA 05/WV 270030KT/TB LGT/RM HVY RAIN</text><rect class="cl" x="20" y="101" width="690" height="25" rx="4"/><text class="t q2" x="30" y="118">UA</text><text class="s q0" x="210" y="118">Type</text><text class="s q0" x="350" y="118">Routine pilot report</text><text class="t q2" x="30" y="144">OV GGG 090025</text><text class="s q0" x="210" y="144">Location</text><text class="s q0" x="350" y="144">25 NM out on the 090 degree radial, Gregg County VOR</text><rect class="cl" x="20" y="153" width="690" height="25" rx="4"/><text class="t q2" x="30" y="170">TM 1450</text><text class="s q0" x="210" y="170">Time</text><text class="s q0" x="350" y="170">1450 Zulu</text><text class="t q2" x="30" y="196">FL 060</text><text class="s q0" x="210" y="196">Altitude</text><text class="s q0" x="350" y="196">6,000 feet</text><rect class="cl" x="20" y="205" width="690" height="25" rx="4"/><text class="t q2" x="30" y="222">TP C182</text><text class="s q0" x="210" y="222">Aircraft type</text><text class="s q0" x="350" y="222">Cessna 182</text><text class="t q2" x="30" y="248">SK 080 OVC</text><text class="s q0" x="210" y="248">Sky cover</text><text class="s q0" x="350" y="248">8,000 feet overcast</text><rect class="cl" x="20" y="257" width="690" height="25" rx="4"/><text class="t q2" x="30" y="274">WX FV04SM RA</text><text class="s q0" x="210" y="274">Visibility/weather</text><text class="s q0" x="350" y="274">4 miles in rain</text><text class="t q2" x="30" y="300">TA 05</text><text class="s q0" x="210" y="300">Temperature</text><text class="s q0" x="350" y="300">5 degrees Celsius</text><rect class="cl" x="20" y="309" width="690" height="25" rx="4"/><text class="t q2" x="30" y="326">WV 270030KT</text><text class="s q0" x="210" y="326">Wind</text><text class="s q0" x="350" y="326">270 degrees at 30 knots</text><text class="t q2" x="30" y="352">TB LGT</text><text class="s q0" x="210" y="352">Turbulence</text><text class="s q0" x="350" y="352">Light</text><rect class="cl" x="20" y="361" width="690" height="25" rx="4"/><text class="t q2" x="30" y="378">(no icing group)</text><text class="s q0" x="210" y="378">Icing</text><text class="s q0" x="350" y="378">None reported</text><text class="t q2" x="30" y="404">RM HVY RAIN</text><text class="s q0" x="210" y="404">Remarks</text><text class="s q0" x="350" y="404">Rain is heavy</text><rect class="cl" x="20" y="432" width="690" height="176" rx="8"/><text class="t" x="32" y="454" style="font-size:14px">Why file a PIREP</text><text class="s q1" x="32" y="474">PIREPs give conditions as they actually exist in</text><text class="s q1" x="32" y="490">the air, which cannot be gathered from any other</text><text class="s q1" x="32" y="506">source. Pilots can confirm heights of cloud bases</text><text class="s q1" x="32" y="522">and tops, wind shear, turbulence and icing</text><text class="s q1" x="32" y="538">locations.</text><text class="s q1" x="32" y="560">Report unexpected weather to an FSS or ATC; they</text><text class="s q1" x="32" y="576">add it to the system to brief other pilots.</text><text class="t" x="378" y="454" style="font-size:14px">Rules and form</text><text class="s q1" x="378" y="474">ATC must ask pilots for reports if the ceiling is</text><text class="s q1" x="378" y="490">below 5,000 ft or visibility is at or below 5</text><text class="s q1" x="378" y="506">miles.</text><text class="s q1" x="378" y="528">Items 1 to 5 of the form are required, plus at</text><text class="s q1" x="378" y="544">least one weather phenomenon encountered. A PIREP</text><text class="s q1" x="378" y="560">may be appended to a surface report.</text></svg>
