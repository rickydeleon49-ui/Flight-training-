<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 582" role="img" aria-labelledby="ti de"><title id="ti">Anti-ice versus deice: what is protected and how</title><desc id="de">A top view of an airplane with five numbered places that ice protection covers: wing leading edge, tail leading edge, windscreen, propeller, and the pitot and static ports with fuel vents and stall-warning sensors. Four cards cover deicing boots, thermal and weeping wing systems, windscreen and propeller, and the limits of the equipment.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><text class="t" x="20" y="28" style="font-size:15px">Anti-ice versus deice: what is protected and how</text><text class="s" x="20" y="50.0" style="font-size:13px">Anti-ice prevents ice from forming. Deice removes ice after it has formed. Most light airplanes have</text><text class="s" x="20" y="66.5" style="font-size:13px">only a heated pitot tube and are not certified for flight in icing.</text><ellipse cx="190" cy="189.0" rx="95" ry="16" class="sky" style="stroke:currentColor;stroke-width:2"/><path d="M172 177.0L200 97.0L230 97.0L220 177.0Z" class="sky" style="stroke:currentColor;stroke-width:2;stroke-linejoin:round"/><path d="M172 201.0L200 281.0L230 281.0L220 201.0Z" class="sky" style="stroke:currentColor;stroke-width:2;stroke-linejoin:round"/><path d="M260 184.0L274 149.0L288 149.0L282 184.0Z" class="sky" style="stroke:currentColor;stroke-width:2;stroke-linejoin:round"/><path d="M260 194.0L274 229.0L288 229.0L282 194.0Z" class="sky" style="stroke:currentColor;stroke-width:2;stroke-linejoin:round"/><path d="M172 177.0L200 97.0M172 201.0L200 281.0M260 184.0L274 149.0M260 194.0L274 229.0" class="acc" style="stroke-width:5"/><path d="M98 175.0L98 203.0" class="o" style="stroke-width:3"/><path d="M118 181.0L132 181.0L132 197.0L118 197.0Z" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="s" x="60" y="127.0" style="font-size:10.5px">Flying left</text><path d="M60 137.0L28.0 137.0" class="dk" style="stroke-width:2.5"/><path d="M20 137.0L28.0 133.4L28.0 140.6Z" class="dh"/><circle cx="218" cy="89.0" r="10" class="ah"/><text class="t m" x="218" y="93.0" style="font-size:12px;fill:#fff">1</text><circle cx="302" cy="155.0" r="10" class="ah"/><text class="t m" x="302" y="159.0" style="font-size:12px;fill:#fff">2</text><circle cx="125" cy="163.0" r="10" class="ah"/><text class="t m" x="125" y="167.0" style="font-size:12px;fill:#fff">3</text><circle cx="86" cy="215.0" r="10" class="ah"/><text class="t m" x="86" y="219.0" style="font-size:12px;fill:#fff">4</text><circle cx="150" cy="215.0" r="10" class="ah"/><text class="t m" x="150" y="219.0" style="font-size:12px;fill:#fff">5</text><circle cx="390" cy="107.0" r="10" class="ah"/><text class="t m" x="390" y="111.0" style="font-size:12px;fill:#fff">1</text><text class="t" x="408" y="111.0" style="font-size:12px">Leading edges of the wings</text><text class="s" x="408" y="126.0" style="font-size:11px">Boots, hot air, electric foil or weeping wing</text><circle cx="390" cy="145.0" r="10" class="ah"/><text class="t m" x="390" y="149.0" style="font-size:12px;fill:#fff">2</text><text class="t" x="408" y="149.0" style="font-size:12px">Horizontal stabilizer leading edge</text><text class="s" x="408" y="164.0" style="font-size:11px">Same kinds of protection as the wing</text><circle cx="390" cy="183.0" r="10" class="ah"/><text class="t m" x="390" y="187.0" style="font-size:12px;fill:#fff">3</text><text class="t" x="408" y="187.0" style="font-size:12px">Windscreen</text><text class="s" x="408" y="202.0" style="font-size:11px">Alcohol flow or embedded electric wires</text><circle cx="390" cy="221.0" r="10" class="ah"/><text class="t m" x="390" y="225.0" style="font-size:12px;fill:#fff">4</text><text class="t" x="408" y="225.0" style="font-size:12px">Propeller blades</text><text class="s" x="408" y="240.0" style="font-size:11px">Alcohol or electric heating elements</text><circle cx="390" cy="259.0" r="10" class="ah"/><text class="t m" x="390" y="263.0" style="font-size:12px;fill:#fff">5</text><text class="t" x="408" y="263.0" style="font-size:12px">Pitot and static ports, vents, sensors</text><text class="s" x="408" y="278.0" style="font-size:11px">Fuel vents and stall-warning sensors: electric heat</text><rect class="cl" x="20.0" y="301.0" width="338.0" height="134.0" rx="8"/><rect x="20.0" y="301.0" width="338.0" height="26" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30.0" y="319.0" style="font-size:13px">Deicing boots (deice)</text><circle cx="33.0" cy="337.0" r="2.2" class="ah"/><text class="s" x="42.0" y="341.0" style="font-size:11.5px">A rubber sheet on the leading edge. A pneumatic</text><text class="s" x="42.0" y="356.0" style="font-size:11.5px">pump inflates it, which cracks the ice so it should</text><text class="s" x="42.0" y="371.0" style="font-size:11.5px">fall off.</text><circle cx="33.0" cy="385.0" r="2.2" class="ah"/><text class="s" x="42.0" y="389.0" style="font-size:11.5px">Modern boots do not suffer ice "bridging": cycle as</text><text class="s" x="42.0" y="404.0" style="font-size:11.5px">soon as ice is seen.</text><rect class="cl" x="372.0" y="301.0" width="338.0" height="134.0" rx="8"/><rect x="372.0" y="301.0" width="338.0" height="26" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="382.0" y="319.0" style="font-size:13px">Thermal and weeping wing</text><circle cx="385.0" cy="337.0" r="2.2" class="ah"/><text class="s" x="394.0" y="341.0" style="font-size:11.5px">Hot air from the engine compressor, or an</text><text class="s" x="394.0" y="356.0" style="font-size:11.5px">electrically heated foil, prevents ice. Switch it</text><text class="s" x="394.0" y="371.0" style="font-size:11.5px">on before entering icing.</text><circle cx="385.0" cy="385.0" r="2.2" class="ah"/><text class="s" x="394.0" y="389.0" style="font-size:11.5px">Weeping wing: antifreeze seeps from small holes. It</text><text class="s" x="394.0" y="404.0" style="font-size:11.5px">prevents ice and can break the bond of ice already</text><text class="s" x="394.0" y="419.0" style="font-size:11.5px">there.</text><rect class="cl" x="20.0" y="449.0" width="338.0" height="119.0" rx="8"/><rect x="20.0" y="449.0" width="338.0" height="26" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30.0" y="467.0" style="font-size:13px">Windscreen and propeller</text><circle cx="33.0" cy="485.0" r="2.2" class="ah"/><text class="s" x="42.0" y="489.0" style="font-size:11.5px">Heated windscreen: use in flight only, not on the</text><text class="s" x="42.0" y="504.0" style="font-size:11.5px">ground. Its current can shift the compass by as</text><text class="s" x="42.0" y="519.0" style="font-size:11.5px">much as 40 degrees.</text><circle cx="33.0" cy="533.0" r="2.2" class="ah"/><text class="s" x="42.0" y="537.0" style="font-size:11.5px">If a propeller boot fails to heat one blade, severe</text><text class="s" x="42.0" y="552.0" style="font-size:11.5px">vibration can result.</text><rect class="cl" x="372.0" y="449.0" width="338.0" height="119.0" rx="8"/><rect x="372.0" y="449.0" width="338.0" height="26" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="382.0" y="467.0" style="font-size:13px">Know the limits</text><circle cx="385.0" cy="485.0" r="2.2" class="ah"/><text class="s" x="394.0" y="489.0" style="font-size:11.5px">Check anti-ice and deice systems before entering</text><text class="s" x="394.0" y="504.0" style="font-size:11.5px">icing conditions.</text><circle cx="385.0" cy="518.0" r="2.2" class="ah"/><text class="s" x="394.0" y="522.0" style="font-size:11.5px">They are not meant to sustain long flight in icing.</text><text class="s" x="394.0" y="537.0" style="font-size:11.5px">An airplane not certified for icing must leave</text><text class="s" x="394.0" y="552.0" style="font-size:11.5px">icing conditions immediately.</text></svg>
