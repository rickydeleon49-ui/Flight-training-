<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 582" role="img" aria-labelledby="ti de"><title id="ti">Anti-ice versus deice: what is protected and how</title><desc id="de">A top view of an airplane with five numbered places that ice protection covers: wing leading edge, tail leading edge, windscreen, propeller, and the pitot and static ports with fuel vents and stall-warning sensors. Four cards cover deicing boots, thermal and weeping wing systems, windscreen and propeller, and the limits of the equipment.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11.5px}.q1{font-size:12px;fill:#fff}.q2{font-size:13px}.q3{stroke:currentColor;stroke-width:1.5}.q4{font-size:12px}.q5{font-size:11px}.q6{stroke:currentColor;stroke-width:2;stroke-linejoin:round}</style><text class="t" x="20" y="28" style="font-size:15px">Anti-ice versus deice: what is protected and how</text><text class="s q2" x="20" y="50">Anti-ice prevents ice from forming. Deice removes ice after it has formed. Most light airplanes have</text><text class="s q2" x="20" y="66.5">only a heated pitot tube and are not certified for flight in icing.</text><ellipse cx="190" cy="189" rx="95" ry="16" class="sky" style="stroke:currentColor;stroke-width:2"/><path d="M172 177L200 97L230 97L220 177Z" class="sky q6"/><path d="M172 201L200 281L230 281L220 201Z" class="sky q6"/><path d="M260 184L274 149L288 149L282 184Z" class="sky q6"/><path d="M260 194L274 229L288 229L282 194Z" class="sky q6"/><path d="M172 177L200 97M172 201L200 281M260 184L274 149M260 194L274 229" class="acc" style="stroke-width:5"/><path d="M98 175L98 203" class="o" style="stroke-width:3"/><path d="M118 181L132 181L132 197L118 197Z" class="mint q3"/><text class="s" x="60" y="127" style="font-size:10.5px">Flying left</text><path d="M60 137L28 137" class="dk" style="stroke-width:2.5"/><path d="M20 137L28 133.4L28 140.6Z" class="dh"/><circle cx="218" cy="89" r="10" class="ah"/><text class="t m q1" x="218" y="93">1</text><circle cx="302" cy="155" r="10" class="ah"/><text class="t m q1" x="302" y="159">2</text><circle cx="125" cy="163" r="10" class="ah"/><text class="t m q1" x="125" y="167">3</text><circle cx="86" cy="215" r="10" class="ah"/><text class="t m q1" x="86" y="219">4</text><circle cx="150" cy="215" r="10" class="ah"/><text class="t m q1" x="150" y="219">5</text><circle cx="390" cy="107" r="10" class="ah"/><text class="t m q1" x="390" y="111">1</text><text class="t q4" x="408" y="111">Leading edges of the wings</text><text class="s q5" x="408" y="126">Boots, hot air, electric foil or weeping wing</text><circle cx="390" cy="145" r="10" class="ah"/><text class="t m q1" x="390" y="149">2</text><text class="t q4" x="408" y="149">Horizontal stabilizer leading edge</text><text class="s q5" x="408" y="164">Same kinds of protection as the wing</text><circle cx="390" cy="183" r="10" class="ah"/><text class="t m q1" x="390" y="187">3</text><text class="t q4" x="408" y="187">Windscreen</text><text class="s q5" x="408" y="202">Alcohol flow or embedded electric wires</text><circle cx="390" cy="221" r="10" class="ah"/><text class="t m q1" x="390" y="225">4</text><text class="t q4" x="408" y="225">Propeller blades</text><text class="s q5" x="408" y="240">Alcohol or electric heating elements</text><circle cx="390" cy="259" r="10" class="ah"/><text class="t m q1" x="390" y="263">5</text><text class="t q4" x="408" y="263">Pitot and static ports, vents, sensors</text><text class="s q5" x="408" y="278">Fuel vents and stall-warning sensors: electric heat</text><rect class="cl" x="20" y="301" width="338" height="134" rx="8"/><rect x="20" y="301" width="338" height="26" rx="10" class="sky q3"/><text class="t q2" x="30" y="319">Deicing boots (deice)</text><circle cx="33" cy="337" r="2.2" class="ah"/><text class="s q0" x="42" y="341">A rubber sheet on the leading edge. A pneumatic</text><text class="s q0" x="42" y="356">pump inflates it, which cracks the ice so it should</text><text class="s q0" x="42" y="371">fall off.</text><circle cx="33" cy="385" r="2.2" class="ah"/><text class="s q0" x="42" y="389">Modern boots do not suffer ice "bridging": cycle as</text><text class="s q0" x="42" y="404">soon as ice is seen.</text><rect class="cl" x="372" y="301" width="338" height="134" rx="8"/><rect x="372" y="301" width="338" height="26" rx="10" class="lav q3"/><text class="t q2" x="382" y="319">Thermal and weeping wing</text><circle cx="385" cy="337" r="2.2" class="ah"/><text class="s q0" x="394" y="341">Hot air from the engine compressor, or an</text><text class="s q0" x="394" y="356">electrically heated foil, prevents ice. Switch it</text><text class="s q0" x="394" y="371">on before entering icing.</text><circle cx="385" cy="385" r="2.2" class="ah"/><text class="s q0" x="394" y="389">Weeping wing: antifreeze seeps from small holes. It</text><text class="s q0" x="394" y="404">prevents ice and can break the bond of ice already</text><text class="s q0" x="394" y="419">there.</text><rect class="cl" x="20" y="449" width="338" height="119" rx="8"/><rect x="20" y="449" width="338" height="26" rx="10" class="mint q3"/><text class="t q2" x="30" y="467">Windscreen and propeller</text><circle cx="33" cy="485" r="2.2" class="ah"/><text class="s q0" x="42" y="489">Heated windscreen: use in flight only, not on the</text><text class="s q0" x="42" y="504">ground. Its current can shift the compass by as</text><text class="s q0" x="42" y="519">much as 40 degrees.</text><circle cx="33" cy="533" r="2.2" class="ah"/><text class="s q0" x="42" y="537">If a propeller boot fails to heat one blade, severe</text><text class="s q0" x="42" y="552">vibration can result.</text><rect class="cl" x="372" y="449" width="338" height="119" rx="8"/><rect x="372" y="449" width="338" height="26" rx="10" class="rose q3"/><text class="t q2" x="382" y="467">Know the limits</text><circle cx="385" cy="485" r="2.2" class="ah"/><text class="s q0" x="394" y="489">Check anti-ice and deice systems before entering</text><text class="s q0" x="394" y="504">icing conditions.</text><circle cx="385" cy="518" r="2.2" class="ah"/><text class="s q0" x="394" y="522">They are not meant to sustain long flight in icing.</text><text class="s q0" x="394" y="537">An airplane not certified for icing must leave</text><text class="s q0" x="394" y="552">icing conditions immediately.</text></svg>
