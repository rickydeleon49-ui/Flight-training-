<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 490" role="img" aria-labelledby="ti de"><title id="ti">Fuel injection: how fuel reaches the cylinders</title><desc id="de">Four steps from the engine-driven fuel pump to the control unit, the fuel manifold valve and the discharge nozzles in each cylinder head, with an arrow from the auxiliary fuel pump into the control unit. Three cards list the advantages, the disadvantages, and air intake and icing.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11.5px}.q1{font-size:13px}.q2{stroke:currentColor;stroke-width:1.5}.q3{stroke-width:2.5}.q4{fill:var(--palette-berry,#A84C6B)}</style><text class="t" x="20" y="28" style="font-size:15px">Fuel injection: how fuel reaches the cylinders</text><text class="s q1" x="20" y="50">A fuel injection system puts fuel directly into the cylinders, or just ahead of the intake valve. The</text><text class="s q1" x="20" y="66.5">control unit takes the place of the carburetor.</text><rect class="cl" x="20" y="89" width="156" height="116" rx="8"/><rect x="20" y="89" width="156" height="26" rx="10" class="sky q2"/><text class="t q1" x="30" y="107">1 Engine-driven pump</text><circle cx="33" cy="125" r="2.2" class="ah"/><text class="s q0" x="42" y="129">After starting, it</text><text class="s q0" x="42" y="144">sends fuel under</text><text class="s q0" x="42" y="159">pressure from the</text><text class="s q0" x="42" y="174">fuel tank to the</text><text class="s q0" x="42" y="189">control unit.</text><path d="M179 147L187 147" class="acc q3"/><path d="M195 147L187 150.6L187 143.4Z" class="dh q4"/><rect class="cl" x="198" y="89" width="156" height="116" rx="8"/><rect x="198" y="89" width="156" height="26" rx="10" class="lav q2"/><text class="t q1" x="208" y="107">2 Fuel-air control unit</text><circle cx="211" cy="125" r="2.2" class="ah"/><text class="s q0" x="220" y="129">Essentially replaces</text><text class="s q0" x="220" y="144">the carburetor. It</text><text class="s q0" x="220" y="159">meters fuel by the</text><text class="s q0" x="220" y="174">mixture control</text><text class="s q0" x="220" y="189">setting.</text><path d="M357 147L365 147" class="acc q3"/><path d="M373 147L365 150.6L365 143.4Z" class="dh q4"/><rect class="cl" x="376" y="89" width="156" height="116" rx="8"/><rect x="376" y="89" width="156" height="26" rx="10" class="mint q2"/><text class="t q1" x="386" y="107">3 Fuel manifold valve</text><circle cx="389" cy="125" r="2.2" class="ah"/><text class="s q0" x="398" y="129">Gets fuel at a rate</text><text class="s q0" x="398" y="144">set by the throttle,</text><text class="s q0" x="398" y="159">then shares it out</text><text class="s q0" x="398" y="174">to each cylinder.</text><path d="M535 147L543 147" class="acc q3"/><path d="M551 147L543 150.6L543 143.4Z" class="dh q4"/><rect class="cl" x="554" y="89" width="156" height="116" rx="8"/><rect x="554" y="89" width="156" height="26" rx="10" class="rose q2"/><text class="t q1" x="564" y="107">4 Discharge nozzles</text><circle cx="567" cy="125" r="2.2" class="ah"/><text class="s q0" x="576" y="129">One in each cylinder</text><text class="s q0" x="576" y="144">head. They inject</text><text class="s q0" x="576" y="159">into each cylinder</text><text class="s q0" x="576" y="174">intake port.</text><path d="M276 239L276 217" class="acc q3"/><path d="M276 209L279.6 217L272.4 217Z" class="dh q4"/><rect class="cl" x="198" y="239" width="334" height="44" rx="8"/><text class="t m" x="365" y="258" style="font-size:12.5px">Auxiliary fuel pump</text><text class="s m" x="365" y="274" style="font-size:10.5px">Fuel under pressure to the control unit for starting and emergency use</text><rect class="cl" x="20" y="297" width="220.67" height="179" rx="8"/><rect x="20" y="297" width="220.67" height="26" rx="10" class="mint q2"/><text class="t q1" x="30" y="315">Advantages</text><circle cx="33" cy="333" r="2.2" class="ah"/><text class="s q0" x="42" y="337">Reduction in evaporative icing</text><circle cx="33" cy="351" r="2.2" class="ah"/><text class="s q0" x="42" y="355">Better fuel flow</text><circle cx="33" cy="369" r="2.2" class="ah"/><text class="s q0" x="42" y="373">Faster throttle response</text><circle cx="33" cy="387" r="2.2" class="ah"/><text class="s q0" x="42" y="391">Precise control of mixture</text><circle cx="33" cy="405" r="2.2" class="ah"/><text class="s q0" x="42" y="409">Better fuel distribution</text><circle cx="33" cy="423" r="2.2" class="ah"/><text class="s q0" x="42" y="427">Easier cold weather starts</text><rect class="cl" x="254.67" y="297" width="220.67" height="179" rx="8"/><rect x="254.67" y="297" width="220.67" height="26" rx="10" class="rose q2"/><text class="t q1" x="264.67" y="315">Disadvantages</text><circle cx="267.67" cy="333" r="2.2" class="ah"/><text class="s q0" x="276.67" y="337">Difficulty in starting a hot</text><text class="s q0" x="276.67" y="352">engine</text><circle cx="267.67" cy="366" r="2.2" class="ah"/><text class="s q0" x="276.67" y="370">Vapor locks during ground</text><text class="s q0" x="276.67" y="385">operations on hot days</text><circle cx="267.67" cy="399" r="2.2" class="ah"/><text class="s q0" x="276.67" y="403">Problems with restarting an</text><text class="s q0" x="276.67" y="418">engine that quits because of</text><text class="s q0" x="276.67" y="433">fuel starvation</text><rect class="cl" x="489.33" y="297" width="220.67" height="179" rx="8"/><rect x="489.33" y="297" width="220.67" height="26" rx="10" class="sky q2"/><text class="t q1" x="499.33" y="315">Air intake and icing</text><circle cx="502.33" cy="333" r="2.2" class="ah"/><text class="s q0" x="511.33" y="337">The intake is like a carburetor</text><text class="s q0" x="511.33" y="352">system, with an alternate air</text><text class="s q0" x="511.33" y="367">source inside the engine</text><text class="s q0" x="511.33" y="382">cowling for when the outside</text><text class="s q0" x="511.33" y="397">source is blocked.</text><circle cx="502.33" cy="411" r="2.2" class="ah"/><text class="s q0" x="511.33" y="415">Less susceptible to icing than</text><text class="s q0" x="511.33" y="430">a carburetor, but impact icing</text><text class="s q0" x="511.33" y="445">on the air intake is still</text><text class="s q0" x="511.33" y="460">possible.</text></svg>
