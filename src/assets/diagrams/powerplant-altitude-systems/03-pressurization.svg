<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 518" role="img" aria-labelledby="ti de"><title id="ti">Pressurization: cabin altitude and differential pressure</title><desc id="de">A sealed fuselage with air flowing in and out through an outflow valve, next to a sketch graph of cabin altitude against aircraft altitude. It is flat in the isobaric range, then rises in the differential range to about 8,000 feet at maximum cruising altitude. Three cards cover the controlling parts, the instruments and decompression.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11.5px}.q1{font-size:11px}.q2{font-size:13px}.q3{font-size:12px}.q4{stroke-width:3.5}.q5{stroke:currentColor;stroke-width:1.5}</style><text class="t" x="20" y="28" style="font-size:15px">Pressurization: cabin altitude and differential pressure</text><text class="s q2" x="20" y="50">A pressurized cabin is a sealed unit that holds air at a higher pressure than the air outside. Cabin</text><text class="s q2" x="20" y="66.5">altitude is the cabin pressure expressed as an equivalent height above sea level.</text><path d="M60 119L300 119C354 119 354 215 300 215L60 215C14 215 14 119 60 119Z" class="sky" style="stroke:currentColor;stroke-width:2.5"/><text class="t m" x="179" y="157" style="font-size:12.5px">Cabin, flight compartment</text><text class="t m" x="179" y="173" style="font-size:12.5px">and baggage in one sealed unit</text><text class="s m q0" x="179" y="195">Higher pressure than outside</text><path d="M28 249L28 221" class="acc q4"/><path d="M28 211L32.5 221L23.5 221Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><text class="t q3" x="40" y="245">Air in</text><path d="M288 123L288 103" class="dk q4"/><path d="M288 93L292.5 103L283.5 103Z" class="dh"/><text class="t" x="278" y="107" style="font-size:12px;text-anchor:end">Air out: outflow valve</text><text class="s q1" x="80" y="237">Turbine aircraft: bleed air from the engine</text><text class="s q1" x="80" y="251.5">compressor. Piston aircraft: turbocharger air</text><text class="s q1" x="80" y="266">through a sonic venturi (flow limiter).</text><path d="M410 103L410 293L700 293" class="o" style="stroke-width:2"/><text class="s m q3" x="555" y="311">Aircraft altitude (climbing)</text><text class="s" x="398" y="198" style="font-size:12px;text-anchor:middle" transform="rotate(-90 398 198)">Cabin altitude</text><path d="M410 279L540 279L684 137" class="acc q4"/><path d="M540 293L540 279" class="o d" style="stroke-width:1.5;opacity:.6"/><text class="t q3" x="418" y="269">Isobaric range</text><text class="s q1" x="418" y="231">Cabin altitude held at</text><text class="s q1" x="418" y="244">the selected value</text><text class="t q3" x="418" y="163">Differential range:</text><text class="s q1" x="418" y="178">cabin altitude rises</text><text class="s q1" x="418" y="191">as the aircraft climbs</text><circle cx="684" cy="137" r="5" class="ah"/><text class="s" x="674" y="125" style="font-size:10.5px;text-anchor:end">About 8,000 ft at max cruising altitude</text><text class="s" x="696" y="327" style="font-size:10px;text-anchor:end">Shape only, not to scale</text><rect class="cl" x="20" y="337" width="220.67" height="167" rx="8"/><rect x="20" y="337" width="220.67" height="26" rx="10" class="lav q5"/><text class="t q2" x="30" y="355">Parts that control it</text><circle cx="33" cy="373" r="2.2" class="ah"/><text class="s q0" x="42" y="377">Cabin pressure regulator: holds</text><text class="s q0" x="42" y="392">the selected cabin pressure and</text><text class="s q0" x="42" y="407">limits the differential.</text><circle cx="33" cy="421" r="2.2" class="ah"/><text class="s q0" x="42" y="425">Outflow valve: sets how fast</text><text class="s q0" x="42" y="440">air leaves.</text><circle cx="33" cy="454" r="2.2" class="ah"/><text class="s q0" x="42" y="458">Safety valve: pressure relief,</text><text class="s q0" x="42" y="473">vacuum relief and dump.</text><rect class="cl" x="254.67" y="337" width="220.67" height="167" rx="8"/><rect x="254.67" y="337" width="220.67" height="26" rx="10" class="mint q5"/><text class="t q2" x="264.67" y="355">Instruments</text><circle cx="267.67" cy="373" r="2.2" class="ah"/><text class="s q0" x="276.67" y="377">Cabin differential pressure</text><text class="s q0" x="276.67" y="392">gauge: keep it under the</text><text class="s q0" x="276.67" y="407">maximum for the fuselage.</text><circle cx="267.67" cy="421" r="2.2" class="ah"/><text class="s q0" x="276.67" y="425">Cabin altimeter: checks the</text><text class="s q0" x="276.67" y="440">system.</text><circle cx="267.67" cy="454" r="2.2" class="ah"/><text class="s q0" x="276.67" y="458">Cabin rate of climb or descent.</text><rect class="cl" x="489.33" y="337" width="220.67" height="167" rx="8"/><rect x="489.33" y="337" width="220.67" height="26" rx="10" class="rose q5"/><text class="t q2" x="499.33" y="355">Decompression</text><circle cx="502.33" cy="373" r="2.2" class="ah"/><text class="s q0" x="511.33" y="377">Explosive: faster than the</text><text class="s q0" x="511.33" y="392">lungs can empty. Under 0.5</text><text class="s q0" x="511.33" y="407">seconds counts as explosive.</text><circle cx="502.33" cy="421" r="2.2" class="ah"/><text class="s q0" x="511.33" y="425">Useful consciousness shrinks to</text><text class="s q0" x="511.33" y="440">one-third to one-fourth of</text><text class="s q0" x="511.33" y="455">normal.</text><circle cx="502.33" cy="469" r="2.2" class="ah"/><text class="s q0" x="511.33" y="473">Danger is hypoxia. Use oxygen</text><text class="s q0" x="511.33" y="488">and descend rapidly.</text></svg>
