<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 518" role="img" aria-labelledby="ti de"><title id="ti">Pressurization: cabin altitude and differential pressure</title><desc id="de">A sealed fuselage with air flowing in and out through an outflow valve, next to a sketch graph of cabin altitude against aircraft altitude. It is flat in the isobaric range, then rises in the differential range to about 8,000 feet at maximum cruising altitude. Three cards cover the controlling parts, the instruments and decompression.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><text class="t" x="20" y="28" style="font-size:15px">Pressurization: cabin altitude and differential pressure</text><text class="s" x="20" y="50.0" style="font-size:13px">A pressurized cabin is a sealed unit that holds air at a higher pressure than the air outside. Cabin</text><text class="s" x="20" y="66.5" style="font-size:13px">altitude is the cabin pressure expressed as an equivalent height above sea level.</text><path d="M60 119.0L300 119.0C354 119.0 354 215.0 300 215.0L60 215.0C14 215.0 14 119.0 60 119.0Z" class="sky" style="stroke:currentColor;stroke-width:2.5"/><text class="t m" x="179.0" y="157.0" style="font-size:12.5px">Cabin, flight compartment</text><text class="t m" x="179.0" y="173.0" style="font-size:12.5px">and baggage in one sealed unit</text><text class="s m" x="179.0" y="195.0" style="font-size:11.5px">Higher pressure than outside</text><path d="M28 249.0L28.0 221.0" class="acc" style="stroke-width:3.5"/><path d="M28 211.0L32.5 221.0L23.5 221.0Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><text class="t" x="40" y="245.0" style="font-size:12px">Air in</text><path d="M288 123.0L288.0 103.0" class="dk" style="stroke-width:3.5"/><path d="M288 93.0L292.5 103.0L283.5 103.0Z" class="dh"/><text class="t" x="278" y="107.0" style="font-size:12px;text-anchor:end">Air out: outflow valve</text><text class="s" x="80" y="237.0" style="font-size:11px">Turbine aircraft: bleed air from the engine</text><text class="s" x="80" y="251.5" style="font-size:11px">compressor. Piston aircraft: turbocharger air</text><text class="s" x="80" y="266.0" style="font-size:11px">through a sonic venturi (flow limiter).</text><path d="M410 103.0L410 293.0L700 293.0" class="o" style="stroke-width:2"/><text class="s m" x="555.0" y="311.0" style="font-size:12px">Aircraft altitude (climbing)</text><text class="s" x="398" y="198.0" style="font-size:12px;text-anchor:middle" transform="rotate(-90 398 198.0)">Cabin altitude</text><path d="M410 279.0L540 279.0L684 137.0" class="acc" style="stroke-width:3.5"/><path d="M540 293.0L540 279.0" class="o d" style="stroke-width:1.5;opacity:.6"/><text class="t" x="418" y="269.0" style="font-size:12px">Isobaric range</text><text class="s" x="418" y="231.0" style="font-size:11px">Cabin altitude held at</text><text class="s" x="418" y="244.0" style="font-size:11px">the selected value</text><text class="t" x="418" y="163.0" style="font-size:12px">Differential range:</text><text class="s" x="418" y="178.0" style="font-size:11px">cabin altitude rises</text><text class="s" x="418" y="191.0" style="font-size:11px">as the aircraft climbs</text><circle cx="684" cy="137.0" r="5" class="ah"/><text class="s" x="674" y="125.0" style="font-size:10.5px;text-anchor:end">About 8,000 ft at max cruising altitude</text><text class="s" x="696" y="327.0" style="font-size:10px;text-anchor:end">Shape only, not to scale</text><rect class="cl" x="20.0" y="337.0" width="220.66666666666666" height="167.0" rx="8"/><rect x="20.0" y="337.0" width="220.66666666666666" height="26" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30.0" y="355.0" style="font-size:13px">Parts that control it</text><circle cx="33.0" cy="373.0" r="2.2" class="ah"/><text class="s" x="42.0" y="377.0" style="font-size:11.5px">Cabin pressure regulator: holds</text><text class="s" x="42.0" y="392.0" style="font-size:11.5px">the selected cabin pressure and</text><text class="s" x="42.0" y="407.0" style="font-size:11.5px">limits the differential.</text><circle cx="33.0" cy="421.0" r="2.2" class="ah"/><text class="s" x="42.0" y="425.0" style="font-size:11.5px">Outflow valve: sets how fast</text><text class="s" x="42.0" y="440.0" style="font-size:11.5px">air leaves.</text><circle cx="33.0" cy="454.0" r="2.2" class="ah"/><text class="s" x="42.0" y="458.0" style="font-size:11.5px">Safety valve: pressure relief,</text><text class="s" x="42.0" y="473.0" style="font-size:11.5px">vacuum relief and dump.</text><rect class="cl" x="254.66666666666666" y="337.0" width="220.66666666666666" height="167.0" rx="8"/><rect x="254.66666666666666" y="337.0" width="220.66666666666666" height="26" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="264.66666666666663" y="355.0" style="font-size:13px">Instruments</text><circle cx="267.66666666666663" cy="373.0" r="2.2" class="ah"/><text class="s" x="276.66666666666663" y="377.0" style="font-size:11.5px">Cabin differential pressure</text><text class="s" x="276.66666666666663" y="392.0" style="font-size:11.5px">gauge: keep it under the</text><text class="s" x="276.66666666666663" y="407.0" style="font-size:11.5px">maximum for the fuselage.</text><circle cx="267.66666666666663" cy="421.0" r="2.2" class="ah"/><text class="s" x="276.66666666666663" y="425.0" style="font-size:11.5px">Cabin altimeter: checks the</text><text class="s" x="276.66666666666663" y="440.0" style="font-size:11.5px">system.</text><circle cx="267.66666666666663" cy="454.0" r="2.2" class="ah"/><text class="s" x="276.66666666666663" y="458.0" style="font-size:11.5px">Cabin rate of climb or descent.</text><rect class="cl" x="489.3333333333333" y="337.0" width="220.66666666666666" height="167.0" rx="8"/><rect x="489.3333333333333" y="337.0" width="220.66666666666666" height="26" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="499.3333333333333" y="355.0" style="font-size:13px">Decompression</text><circle cx="502.3333333333333" cy="373.0" r="2.2" class="ah"/><text class="s" x="511.3333333333333" y="377.0" style="font-size:11.5px">Explosive: faster than the</text><text class="s" x="511.3333333333333" y="392.0" style="font-size:11.5px">lungs can empty. Under 0.5</text><text class="s" x="511.3333333333333" y="407.0" style="font-size:11.5px">seconds counts as explosive.</text><circle cx="502.3333333333333" cy="421.0" r="2.2" class="ah"/><text class="s" x="511.3333333333333" y="425.0" style="font-size:11.5px">Useful consciousness shrinks to</text><text class="s" x="511.3333333333333" y="440.0" style="font-size:11.5px">one-third to one-fourth of</text><text class="s" x="511.3333333333333" y="455.0" style="font-size:11.5px">normal.</text><circle cx="502.3333333333333" cy="469.0" r="2.2" class="ah"/><text class="s" x="511.3333333333333" y="473.0" style="font-size:11.5px">Danger is hypoxia. Use oxygen</text><text class="s" x="511.3333333333333" y="488.0" style="font-size:11.5px">and descend rapidly.</text></svg>
