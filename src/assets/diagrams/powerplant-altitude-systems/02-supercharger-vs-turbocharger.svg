<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 607" role="img" aria-labelledby="ti de"><title id="ti">Superchargers and turbochargers: where the boost comes from</title><desc id="de">Two schematics. A supercharger sits between the fuel metering device and the intake manifold and is driven by the engine through a gear train. A turbocharger turbine is driven by exhaust gas and a drive shaft turns its compressor, with a waste gate that lets exhaust bypass the turbine and an intercooler. A bar chart compares 22 and 25 inches of manifold pressure at 8,000 feet, and three cards cover why to boost, critical altitude and care.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11.5px}.q1{stroke:currentColor;stroke-width:1.5}.q2{font-size:13px}.q3{font-size:10.5px}.q4{stroke-width:2.5}.q5{fill:var(--palette-berry,#A84C6B)}</style><text class="t" x="20" y="28" style="font-size:15px">Superchargers and turbochargers: where the boost comes from</text><text class="s q2" x="20" y="50">Both compress the intake air to make it denser. The difference is the power supply: a supercharger</text><text class="s q2" x="20" y="66.5">takes it from the engine, a turbocharger takes it from the exhaust.</text><rect class="cl" x="20" y="87" width="335" height="232" rx="8"/><rect x="20" y="87" width="335" height="26" rx="10" class="sky q1"/><text class="t q2" x="30" y="105">Supercharger: engine-driven pump</text><rect class="cl" x="375" y="87" width="335" height="232" rx="8"/><rect x="375" y="87" width="335" height="26" rx="10" class="lav q1"/><text class="t q2" x="385" y="105">Turbocharger: exhaust-driven</text><rect x="32" y="137" width="90" height="46" rx="8" class="cl q1"/><text class="t m q0" x="77" y="157.08">Fuel</text><text class="s m q3" x="77" y="170.58">metering</text><rect x="142.5" y="137" width="90" height="46" rx="8" class="sky q1"/><text class="t m q0" x="187.5" y="157.08">Super-</text><text class="s m q3" x="187.5" y="170.58">charger</text><rect x="253" y="137" width="90" height="46" rx="8" class="cl q1"/><text class="t m q0" x="298" y="157.08">Intake</text><text class="s m q3" x="298" y="170.58">manifold</text><path d="M124 160L132.5 160" class="acc q4"/><path d="M140.5 160L132.5 163.6L132.5 156.4Z" class="dh q5"/><path d="M234.5 160L243 160" class="acc q4"/><path d="M251 160L243 163.6L243 156.4Z" class="dh q5"/><rect x="142.5" y="221" width="90" height="46" rx="8" class="lav q1"/><text class="t m q0" x="187.5" y="241.08">Engine</text><text class="s m q3" x="187.5" y="254.58">gear train</text><path d="M187.5 219L187.5 193" class="acc q4"/><path d="M187.5 185L191.1 193L183.9 193Z" class="dh q5"/><text class="s q0" x="32" y="285">Raises manifold pressure and forces the fuel-air</text><text class="s q0" x="32" y="300">mixture into the cylinders.</text><rect x="387" y="149" width="90" height="40" rx="8" class="cl q1"/><text class="t m q0" x="432" y="166.08">Exhaust</text><text class="s m q3" x="432" y="179.58">gas</text><rect x="497.5" y="149" width="90" height="40" rx="8" class="lav q1"/><text class="t m q0" x="542.5" y="172.83">Turbine</text><rect x="608" y="149" width="90" height="40" rx="8" class="cl q1"/><text class="t m q0" x="653" y="166.08">Out the</text><text class="s m q3" x="653" y="179.58">exhaust pipe</text><path d="M479 169L487.5 169" class="acc q4"/><path d="M495.5 169L487.5 172.6L487.5 165.4Z" class="dh q5"/><path d="M589.5 169L598 169" class="acc q4"/><path d="M606 169L598 172.6L598 165.4Z" class="dh q5"/><path d="M432 146L432 135L653 135" class="o d" style="stroke-width:1.8"/><path d="M653 135L653 139" class="dk" style="stroke-width:1.8"/><path d="M653 146L649.9 139L656.1 139Z" class="dh"/><text class="s m" x="542.5" y="132" style="font-size:10px">Waste gate open: exhaust bypasses the turbine</text><rect x="497.5" y="233" width="90" height="40" rx="8" class="sky q1"/><text class="t m q0" x="542.5" y="256.83">Compressor</text><path d="M542.5 191L542.5 231" class="o" style="stroke-width:5"/><text class="s q3" x="550.5" y="215">drive shaft</text><rect x="608" y="233" width="90" height="40" rx="8" class="cl q1"/><text class="t m q0" x="653" y="250.08">Outside</text><text class="s m q3" x="653" y="263.58">air</text><rect x="387" y="233" width="90" height="40" rx="8" class="mint q1"/><text class="t m q0" x="432" y="256.83">Intercooler</text><path d="M606 253L597.5 253" class="acc q4"/><path d="M589.5 253L597.5 249.4L597.5 256.6Z" class="dh q5"/><path d="M495.5 253L487 253" class="acc q4"/><path d="M479 253L487 249.4L487 256.6Z" class="dh q5"/><text class="s q0" x="387" y="287">The cooled, dense air then goes on to the fuel</text><text class="s q0" x="387" y="302">metering device.</text><text class="t q2" x="20" y="343">Manifold pressure at 8,000 feet, PHAK example (inches of mercury)</text><text class="s" x="20" y="376" style="font-size:12.5px">No supercharger</text><rect x="170" y="357" width="308" height="26" rx="4" class="rose q1"/><text class="t q2" x="486" y="376">22 "Hg</text><text class="s" x="20" y="410" style="font-size:12.5px">With supercharger</text><rect x="170" y="391" width="350" height="26" rx="4" class="mint q1"/><text class="t q2" x="528" y="410">25 "Hg</text><rect class="cl" x="20" y="429" width="220.67" height="164" rx="8"/><rect x="20" y="429" width="220.67" height="26" rx="10" class="sky q1"/><text class="t q2" x="30" y="447">Why boost the air</text><circle cx="33" cy="465" r="2.2" class="ah"/><text class="s q0" x="42" y="469">A normally aspirated engine</text><text class="s q0" x="42" y="484">reaches an altitude where</text><text class="s q0" x="42" y="499">manifold pressure is too low</text><text class="s q0" x="42" y="514">for a normal climb. That is the</text><text class="s q0" x="42" y="529">service ceiling.</text><circle cx="33" cy="543" r="2.2" class="ah"/><text class="s q0" x="42" y="547">Boosted air raises it, giving</text><text class="s q0" x="42" y="562">higher true airspeed and better</text><text class="s q0" x="42" y="577">ways around weather.</text><rect class="cl" x="254.67" y="429" width="220.67" height="164" rx="8"/><rect x="254.67" y="429" width="220.67" height="26" rx="10" class="mint q1"/><text class="t q2" x="264.67" y="447">Critical altitude</text><circle cx="267.67" cy="465" r="2.2" class="ah"/><text class="s q0" x="276.67" y="469">The highest altitude at which a</text><text class="s q0" x="276.67" y="484">turbocharged engine still makes</text><text class="s q0" x="276.67" y="499">its rated horsepower. The waste</text><text class="s q0" x="276.67" y="514">gate is fully closed there.</text><circle cx="267.67" cy="528" r="2.2" class="ah"/><text class="s q0" x="276.67" y="532">Above it, power falls as in a</text><text class="s q0" x="276.67" y="547">normally aspirated engine.</text><rect class="cl" x="489.33" y="429" width="220.67" height="164" rx="8"/><rect x="489.33" y="429" width="220.67" height="26" rx="10" class="rose q1"/><text class="t q2" x="499.33" y="447">Pilot care with a turbo</text><circle cx="502.33" cy="465" r="2.2" class="ah"/><text class="s q0" x="511.33" y="469">Open the throttle cautiously,</text><text class="s q0" x="511.33" y="484">and only with the oil</text><text class="s q0" x="511.33" y="499">temperature in its normal</text><text class="s q0" x="511.33" y="514">range, to avoid overboost.</text><circle cx="502.33" cy="528" r="2.2" class="ah"/><text class="s q0" x="511.33" y="532">Let the turbine slow and cool</text><text class="s q0" x="511.33" y="547">before shutdown, or oil in the</text><text class="s q0" x="511.33" y="562">bearings boils and leaves</text><text class="s q0" x="511.33" y="577">carbon.</text></svg>
