<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 607" role="img" aria-labelledby="ti de"><title id="ti">Superchargers and turbochargers: where the boost comes from</title><desc id="de">Two schematics. A supercharger sits between the fuel metering device and the intake manifold and is driven by the engine through a gear train. A turbocharger turbine is driven by exhaust gas and a drive shaft turns its compressor, with a waste gate that lets exhaust bypass the turbine and an intercooler. A bar chart compares 22 and 25 inches of manifold pressure at 8,000 feet, and three cards cover why to boost, critical altitude and care.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><text class="t" x="20" y="28" style="font-size:15px">Superchargers and turbochargers: where the boost comes from</text><text class="s" x="20" y="50.0" style="font-size:13px">Both compress the intake air to make it denser. The difference is the power supply: a supercharger</text><text class="s" x="20" y="66.5" style="font-size:13px">takes it from the engine, a turbocharger takes it from the exhaust.</text><rect class="cl" x="20" y="87.0" width="335" height="232" rx="8"/><rect x="20" y="87.0" width="335" height="26" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30" y="105.0" style="font-size:13px">Supercharger: engine-driven pump</text><rect class="cl" x="375" y="87.0" width="335" height="232" rx="8"/><rect x="375" y="87.0" width="335" height="26" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="385" y="105.0" style="font-size:13px">Turbocharger: exhaust-driven</text><rect x="32" y="137.0" width="90" height="46" rx="8" class="cl" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="77.0" y="157.08333333333334" style="font-size:11.5px">Fuel</text><text class="s m" x="77.0" y="170.58333333333334" style="font-size:10.5px">metering</text><rect x="142.5" y="137.0" width="90" height="46" rx="8" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="187.5" y="157.08333333333334" style="font-size:11.5px">Super-</text><text class="s m" x="187.5" y="170.58333333333334" style="font-size:10.5px">charger</text><rect x="253.0" y="137.0" width="90" height="46" rx="8" class="cl" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="298.0" y="157.08333333333334" style="font-size:11.5px">Intake</text><text class="s m" x="298.0" y="170.58333333333334" style="font-size:10.5px">manifold</text><path d="M124 160.0L132.5 160.0" class="acc" style="stroke-width:2.5"/><path d="M140.5 160.0L132.5 163.6L132.5 156.4Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><path d="M234.5 160.0L243.0 160.0" class="acc" style="stroke-width:2.5"/><path d="M251.0 160.0L243.0 163.6L243.0 156.4Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><rect x="142.5" y="221.0" width="90" height="46" rx="8" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="187.5" y="241.08333333333334" style="font-size:11.5px">Engine</text><text class="s m" x="187.5" y="254.58333333333334" style="font-size:10.5px">gear train</text><path d="M187.5 219.0L187.5 193.0" class="acc" style="stroke-width:2.5"/><path d="M187.5 185.0L191.1 193.0L183.9 193.0Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><text class="s" x="32" y="285.0" style="font-size:11.5px">Raises manifold pressure and forces the fuel-air</text><text class="s" x="32" y="300.0" style="font-size:11.5px">mixture into the cylinders.</text><rect x="387" y="149.0" width="90" height="40" rx="8" class="cl" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="432.0" y="166.08333333333334" style="font-size:11.5px">Exhaust</text><text class="s m" x="432.0" y="179.58333333333334" style="font-size:10.5px">gas</text><rect x="497.5" y="149.0" width="90" height="40" rx="8" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="542.5" y="172.83333333333334" style="font-size:11.5px">Turbine</text><rect x="608.0" y="149.0" width="90" height="40" rx="8" class="cl" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="653.0" y="166.08333333333334" style="font-size:11.5px">Out the</text><text class="s m" x="653.0" y="179.58333333333334" style="font-size:10.5px">exhaust pipe</text><path d="M479 169.0L487.5 169.0" class="acc" style="stroke-width:2.5"/><path d="M495.5 169.0L487.5 172.6L487.5 165.4Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><path d="M589.5 169.0L598.0 169.0" class="acc" style="stroke-width:2.5"/><path d="M606.0 169.0L598.0 172.6L598.0 165.4Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><path d="M432.0 146.0L432.0 135.0L653.0 135.0" class="o d" style="stroke-width:1.8"/><path d="M653.0 135.0L653.0 139.0" class="dk" style="stroke-width:1.8"/><path d="M653.0 146.0L649.9 139.0L656.1 139.0Z" class="dh"/><text class="s m" x="542.5" y="132.0" style="font-size:10px">Waste gate open: exhaust bypasses the turbine</text><rect x="497.5" y="233.0" width="90" height="40" rx="8" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="542.5" y="256.8333333333333" style="font-size:11.5px">Compressor</text><path d="M542.5 191.0L542.5 231.0" class="o" style="stroke-width:5"/><text class="s" x="550.5" y="215.0" style="font-size:10.5px">drive shaft</text><rect x="608.0" y="233.0" width="90" height="40" rx="8" class="cl" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="653.0" y="250.08333333333334" style="font-size:11.5px">Outside</text><text class="s m" x="653.0" y="263.58333333333337" style="font-size:10.5px">air</text><rect x="387" y="233.0" width="90" height="40" rx="8" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="432.0" y="256.8333333333333" style="font-size:11.5px">Intercooler</text><path d="M606.0 253.0L597.5 253.0" class="acc" style="stroke-width:2.5"/><path d="M589.5 253.0L597.5 249.4L597.5 256.6Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><path d="M495.5 253.0L487.0 253.0" class="acc" style="stroke-width:2.5"/><path d="M479 253.0L487.0 249.4L487.0 256.6Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><text class="s" x="387" y="287.0" style="font-size:11.5px">The cooled, dense air then goes on to the fuel</text><text class="s" x="387" y="302.0" style="font-size:11.5px">metering device.</text><text class="t" x="20" y="343.0" style="font-size:13px">Manifold pressure at 8,000 feet, PHAK example (inches of mercury)</text><text class="s" x="20" y="376.0" style="font-size:12.5px">No supercharger</text><rect x="170" y="357.0" width="308" height="26" rx="4" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="486" y="376.0" style="font-size:13px">22 "Hg</text><text class="s" x="20" y="410.0" style="font-size:12.5px">With supercharger</text><rect x="170" y="391.0" width="350" height="26" rx="4" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="528" y="410.0" style="font-size:13px">25 "Hg</text><rect class="cl" x="20.0" y="429.0" width="220.66666666666666" height="164.0" rx="8"/><rect x="20.0" y="429.0" width="220.66666666666666" height="26" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30.0" y="447.0" style="font-size:13px">Why boost the air</text><circle cx="33.0" cy="465.0" r="2.2" class="ah"/><text class="s" x="42.0" y="469.0" style="font-size:11.5px">A normally aspirated engine</text><text class="s" x="42.0" y="484.0" style="font-size:11.5px">reaches an altitude where</text><text class="s" x="42.0" y="499.0" style="font-size:11.5px">manifold pressure is too low</text><text class="s" x="42.0" y="514.0" style="font-size:11.5px">for a normal climb. That is the</text><text class="s" x="42.0" y="529.0" style="font-size:11.5px">service ceiling.</text><circle cx="33.0" cy="543.0" r="2.2" class="ah"/><text class="s" x="42.0" y="547.0" style="font-size:11.5px">Boosted air raises it, giving</text><text class="s" x="42.0" y="562.0" style="font-size:11.5px">higher true airspeed and better</text><text class="s" x="42.0" y="577.0" style="font-size:11.5px">ways around weather.</text><rect class="cl" x="254.66666666666666" y="429.0" width="220.66666666666666" height="164.0" rx="8"/><rect x="254.66666666666666" y="429.0" width="220.66666666666666" height="26" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="264.66666666666663" y="447.0" style="font-size:13px">Critical altitude</text><circle cx="267.66666666666663" cy="465.0" r="2.2" class="ah"/><text class="s" x="276.66666666666663" y="469.0" style="font-size:11.5px">The highest altitude at which a</text><text class="s" x="276.66666666666663" y="484.0" style="font-size:11.5px">turbocharged engine still makes</text><text class="s" x="276.66666666666663" y="499.0" style="font-size:11.5px">its rated horsepower. The waste</text><text class="s" x="276.66666666666663" y="514.0" style="font-size:11.5px">gate is fully closed there.</text><circle cx="267.66666666666663" cy="528.0" r="2.2" class="ah"/><text class="s" x="276.66666666666663" y="532.0" style="font-size:11.5px">Above it, power falls as in a</text><text class="s" x="276.66666666666663" y="547.0" style="font-size:11.5px">normally aspirated engine.</text><rect class="cl" x="489.3333333333333" y="429.0" width="220.66666666666666" height="164.0" rx="8"/><rect x="489.3333333333333" y="429.0" width="220.66666666666666" height="26" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="499.3333333333333" y="447.0" style="font-size:13px">Pilot care with a turbo</text><circle cx="502.3333333333333" cy="465.0" r="2.2" class="ah"/><text class="s" x="511.3333333333333" y="469.0" style="font-size:11.5px">Open the throttle cautiously,</text><text class="s" x="511.3333333333333" y="484.0" style="font-size:11.5px">and only with the oil</text><text class="s" x="511.3333333333333" y="499.0" style="font-size:11.5px">temperature in its normal</text><text class="s" x="511.3333333333333" y="514.0" style="font-size:11.5px">range, to avoid overboost.</text><circle cx="502.3333333333333" cy="528.0" r="2.2" class="ah"/><text class="s" x="511.3333333333333" y="532.0" style="font-size:11.5px">Let the turbine slow and cool</text><text class="s" x="511.3333333333333" y="547.0" style="font-size:11.5px">before shutdown, or oil in the</text><text class="s" x="511.3333333333333" y="562.0" style="font-size:11.5px">bearings boils and leaves</text><text class="s" x="511.3333333333333" y="577.0" style="font-size:11.5px">carbon.</text></svg>
