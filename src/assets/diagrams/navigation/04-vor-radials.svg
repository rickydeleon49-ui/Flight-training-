<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 430" role="img" aria-labelledby="ti de"><title id="ti">VOR radials and the CDI</title><desc id="de">Top view of a VOR station with radials like spokes of a wheel, referenced to magnetic north and numbered from 001 through 360. An aircraft sits on the 090 radial. A course deviation indicator has an omnibearing selector, a needle and a TO/FROM flag. With the needle centered the selector shows the radial from the station or its reciprocal to the station. TO means the course shown leads to the station, FROM means it leads away. The VOR transmits at 108.0 to 117.95 MHz, line of sight, about 40 to 45 miles at 1,000 feet above ground.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:13px}.q1{stroke-width:2;opacity:0.5}.q2{font-size:13.5px}.q3{stroke-width:2.5}.q4{font-size:12.5px}</style><circle class="sky" cx="270" cy="190" r="100"/><circle class="o q3" cx="270" cy="190" r="100"/><path class="o q1" d="M270 190L270 90"/><text class="s m q0" x="270" y="73">360</text><path class="o q1" d="M270 190L320 103.4"/><text class="s m q0" x="331" y="89">030</text><path class="o q1" d="M270 190L356.6 140"/><text class="s m q0" x="376" y="134">060</text><path class="acc" d="M270 190L370 190"/><text class="t m q0" x="392" y="195">090</text><path class="o q1" d="M270 190L356.6 240"/><text class="s m q0" x="376" y="256">120</text><path class="o q1" d="M270 190L320 276.6"/><text class="s m q0" x="331" y="301">150</text><path class="o q1" d="M270 190L270 290"/><text class="s m q0" x="270" y="317">180</text><path class="o q1" d="M270 190L220 276.6"/><text class="s m q0" x="209" y="301">210</text><path class="o q1" d="M270 190L183.4 240"/><text class="s m q0" x="164" y="256">240</text><path class="o q1" d="M270 190L170 190"/><text class="s m q0" x="148" y="195">270</text><path class="o q1" d="M270 190L183.4 140"/><text class="s m q0" x="164" y="134">300</text><path class="o q1" d="M270 190L220 103.4"/><text class="s m q0" x="209" y="89">330</text><circle class="mint" cx="270" cy="190" r="14"/><circle class="o q3" cx="270" cy="190" r="14"/><text class="t m" x="270" y="195" style="font-size:11px">VOR</text><text class="s" x="280" y="66"></text><text class="t m" x="270" y="48" style="font-size:14px">MN</text><circle class="ah" cx="342" cy="190" r="6"/><text class="s m q4" x="322" y="214">aircraft</text><text class="s q0" x="20" y="52">Top view: radials</text><text class="s q0" x="20" y="69">are like spokes</text><text class="s q0" x="20" y="86">of a wheel.</text><text class="s q0" x="20" y="103">Highlighted: 090</text><text class="s q0" x="20" y="120">radial (Example).</text><circle class="lav" cx="595" cy="108" r="58"/><circle class="o q3" cx="595" cy="108" r="58"/><path class="dk" style="stroke-width:4" d="M595 62V154"/><circle class="dh" cx="565" cy="108" r="2.5"/><circle class="dh" cx="580" cy="108" r="2.5"/><circle class="dh" cx="610" cy="108" r="2.5"/><circle class="dh" cx="625" cy="108" r="2.5"/><rect class="cl" x="601" y="120" width="34" height="18" rx="3"/><text class="t m" x="618" y="134" style="font-size:12px">TO</text><text class="s m q4" x="595" y="184">CDI: OBS dial, needle, TO/FROM flag</text><text class="s q2" x="470" y="208">Needle centered: the OBS shows the</text><text class="s q2" x="470" y="225">radial (course FROM the station) or</text><text class="s q2" x="470" y="242">its reciprocal (course TO the station).</text><text class="s q2" x="470" y="259">Needle moves left or right if the</text><text class="s q2" x="470" y="276">aircraft drifts from the selected radial.</text><text class="s q2" x="470" y="306">TO: fly the course shown to the station.</text><text class="s q2" x="470" y="323">FROM: flying it takes you away.</text><rect class="cl" x="20" y="332" width="690" height="88" rx="8"/><text class="s q2" x="32" y="354">A radial is a line of magnetic bearing outward from the station, numbered 001 (1° east of MN) to 360.</text><text class="s q2" x="32" y="374">VHF, 108.0–117.95 MHz, line of sight: about 40 to 45 miles at 1,000 ft AGL, more with altitude.</text><text class="s q2" x="32" y="394">Radial accuracy is generally within ±1°. One degree is 1 NM wide at 60 NM from the station.</text><text class="s q4" x="32" y="412">Drawings are schematic. The CDI is the left-right needle of the VOR indicator.</text></svg>
