<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 430" role="img" aria-labelledby="ti de"><title id="ti">True heading to compass heading</title><desc id="de">A chain of three boxes: true heading, corrected by variation to magnetic heading, corrected by deviation to compass heading, so true heading plus or minus variation equals magnetic heading, plus or minus deviation equals compass heading. A sketch shows magnetic north east of true north for east variation. Example: true heading 060, variation 9 degrees east subtract gives magnetic heading 051, deviation plus 2 gives compass heading 053. If variation is west add, if east subtract: east is least, west is best.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style>
<rect class="sky" x="20" y="24" width="190" height="52" rx="8"/><rect class="o" style="stroke-width:2.5" x="20" y="24" width="190" height="52" rx="8"/>
<text class="t m" x="115" y="48" style="font-size:16px">True heading</text>
<text class="t m" x="115" y="67" style="font-size:14px">(TH)</text>
<rect class="mint" x="270" y="24" width="190" height="52" rx="8"/><rect class="o" style="stroke-width:2.5" x="270" y="24" width="190" height="52" rx="8"/>
<text class="t m" x="365" y="48" style="font-size:16px">Magnetic heading</text>
<text class="t m" x="365" y="67" style="font-size:14px">(MH)</text>
<rect class="lav" x="520" y="24" width="190" height="52" rx="8"/><rect class="o" style="stroke-width:2.5" x="520" y="24" width="190" height="52" rx="8"/>
<text class="t m" x="615" y="48" style="font-size:16px">Compass heading</text>
<text class="t m" x="615" y="67" style="font-size:14px">(CH)</text>
<path class="dk" style="stroke-width:3" d="M212 50H262"/><path class="dh" d="M268.0 50.0L256.0 56.0L256.0 44.0z"/>
<text class="t m" x="240" y="40" style="font-size:15px">± V</text>
<path class="dk" style="stroke-width:3" d="M462 50H512"/><path class="dh" d="M518.0 50.0L506.0 56.0L506.0 44.0z"/>
<text class="t m" x="490" y="40" style="font-size:15px">± D</text>
<text class="s" x="20" y="100" style="font-size:14px">Direction the nose points,</text>
<text class="s" x="20" y="117" style="font-size:14px">clockwise from true north</text>
<text class="s" x="20" y="134" style="font-size:14px">(TN). It is the true course</text>
<text class="s" x="20" y="151" style="font-size:14px">with wind correction applied.</text>
<text class="t" x="270" y="100" style="font-size:13px">TH corrected for variation (V)</text>
<text class="s" x="270" y="119" style="font-size:14px">Variation: angle between TN and</text>
<text class="s" x="270" y="136" style="font-size:14px">magnetic north (MN), east or west.</text>
<text class="s" x="270" y="153" style="font-size:14px">Read from the nearest isogonic</text>
<text class="s" x="270" y="170" style="font-size:14px">line on the chart.</text>
<text class="t" x="520" y="100" style="font-size:13px">MH corrected for deviation (D)</text>
<text class="s" x="520" y="119" style="font-size:14px">Deviation: compass error from</text>
<text class="s" x="520" y="136" style="font-size:14px">magnetism inside the aircraft.</text>
<text class="s" x="520" y="153" style="font-size:14px">Read from the deviation card</text>
<text class="s" x="520" y="170" style="font-size:14px">near the compass.</text>
<path class="dk" style="stroke-width:3" d="M100 300V196"/><path class="dh" transform="rotate(180 100 184)" d="M100.0 184.0L94.0 172.0L106.0 172.0z"/>
<path class="acc" d="M100 300L134.6 193.5"/><path class="ah" d="M134.6 193.5L136.6 206.7L125.2 203.0z"/>
<text class="t e" x="92" y="190" style="font-size:14px">TN</text>
<text class="t" x="142.6099033699941" y="197.4816701749428" style="font-size:14px">MN</text>
<path class="o" style="stroke-width:2" d="M100 242A58 58 0 0 1 117.9 244.8"/>
<text class="t e" x="90" y="236" style="font-size:13px">V</text>
<text class="s" x="20" y="324" style="font-size:13.5px">East variation: MN is east of TN.</text>
<text class="s" x="20" y="340" style="font-size:13.5px">Example: "9° E" means MN is</text>
<text class="s" x="20" y="356" style="font-size:13.5px">9° east of TN. Sketch not to scale.</text>
<rect class="cl" x="270" y="200" width="440" height="122" rx="8"/>
<text class="t" x="282" y="224" style="font-size:15px">Example: TH 060°, variation 9° E, deviation +2°</text>
<text class="s" x="282" y="248" style="font-size:14.5px">TH 060° – 9° (variation east: subtract) = MH 051°</text>
<text class="s" x="282" y="270" style="font-size:14.5px">MH 051° + 2° (from the deviation card) = CH 053°</text>
<text class="s" x="282" y="306" style="font-size:14px">Sequence: TH ± V = MH ± D = CH</text>
<rect class="rose" x="270" y="336" width="440" height="84" rx="8"/><rect class="o" style="stroke-width:2.5" x="270" y="336" width="440" height="84" rx="8"/>
<text class="t" x="282" y="362" style="font-size:15px">If variation is west, add; if east, subtract.</text>
<text class="s" x="282" y="386" style="font-size:14px">Memory phrase: "east is least (subtract) and west is best (add)."</text>
<text class="s" x="282" y="408" style="font-size:12.5px">US west coast: needle points east of TN; east coast: west.</text>
</svg>
