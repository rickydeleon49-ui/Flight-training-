<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 623" role="img" aria-labelledby="ti de"><title id="ti">PAVE and the 3P model</title><desc id="de">The Perceive, Process, Perform model for aeronautical decision-making. Perceive hazards with PAVE: Pilot, Aircraft, enVironment, External pressures. Process them with CARE: Consequences, Alternatives, Reality, External factors. Perform with TEAM: Transfer, Eliminate, Accept, Mitigate. The cycle repeats after each decision.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11.5px}.q1{font-size:12px}.q2{font-size:13px;fill:#fff}.q3{font-size:13px}.q4{font-size:12.5px}.q5{stroke:currentColor;stroke-width:1.5}.q6{font-size:16px}</style><text class="t" x="20" y="28" style="font-size:15px">The 3P model: Perceive, Process, Perform</text><text class="s q3" x="20" y="50">A continuous model for every aeronautical decision. After the pilot selects a course of action, the</text><text class="s q3" x="20" y="66.5">circumstances have changed, and the cycle begins again.</text><rect x="20" y="91" width="226" height="44" rx="10" class="sky q5"/><text class="t m q6" x="133" y="111">Perceive</text><text class="s m q1" x="133" y="127">Identify hazards</text><text class="t q3" x="24" y="157">PAVE checklist</text><rect class="cl" x="20" y="169" width="226" height="78" rx="6"/><circle cx="37" cy="208" r="11" class="ah"/><text class="t m q2" x="37" y="213">P</text><text class="t q1" x="54" y="182">Pilot in command</text><text class="s q0" x="54" y="195">Am I ready for this trip?</text><text class="s q0" x="54" y="210">Experience, recency, currency,</text><text class="s q0" x="54" y="225">physical and emotional</text><text class="s q0" x="54" y="240">condition (IMSAFE).</text><rect class="cl" x="20" y="251" width="226" height="78" rx="6"/><circle cx="37" cy="290" r="11" class="ah"/><text class="t m q2" x="37" y="295">A</text><text class="t q1" x="54" y="264">Aircraft</text><text class="s q0" x="54" y="277">Right aircraft, equipped,</text><text class="s q0" x="54" y="292">current in it, enough runway,</text><text class="s q0" x="54" y="307">load, altitude and fuel with</text><text class="s q0" x="54" y="322">reserves.</text><rect class="cl" x="20" y="333" width="226" height="48" rx="6"/><circle cx="37" cy="357" r="11" class="ah"/><text class="t m q2" x="37" y="362">V</text><text class="t q1" x="54" y="346">enVironment</text><text class="s q0" x="54" y="359">Weather, terrain, airport,</text><text class="s q0" x="54" y="374">airspace, nighttime.</text><rect class="cl" x="20" y="385" width="226" height="78" rx="6"/><circle cx="37" cy="424" r="11" class="ah"/><text class="t m q2" x="37" y="429">E</text><text class="t q1" x="54" y="398">External pressures</text><text class="s q0" x="54" y="411">Influences outside the flight</text><text class="s q0" x="54" y="426">that push the pilot to complete</text><text class="s q0" x="54" y="441">it, often at the expense of</text><text class="s q0" x="54" y="456">safety.</text><rect x="252" y="91" width="226" height="44" rx="10" class="lav q5"/><text class="t m q6" x="365" y="111">Process</text><text class="s m q1" x="365" y="127">Evaluate the risk</text><text class="t q3" x="256" y="157">CARE checklist</text><rect class="cl" x="252" y="169" width="226" height="48" rx="6"/><circle cx="269" cy="193" r="11" class="ah"/><text class="t m q2" x="269" y="198">C</text><text class="t q1" x="286" y="182">Consequences</text><text class="s q0" x="286" y="195">Night flight after a full</text><text class="s q0" x="286" y="210">workday: fatigue and pressure.</text><rect class="cl" x="252" y="221" width="226" height="48" rx="6"/><circle cx="269" cy="245" r="11" class="ah"/><text class="t m q2" x="269" y="250">A</text><text class="t q1" x="286" y="234">Alternatives</text><text class="s q0" x="286" y="247">Delay until morning,</text><text class="s q0" x="286" y="262">reschedule, or drive.</text><rect class="cl" x="252" y="273" width="226" height="48" rx="6"/><circle cx="269" cy="297" r="11" class="ah"/><text class="t m q2" x="269" y="302">R</text><text class="t q1" x="286" y="286">Reality</text><text class="s q0" x="286" y="299">Fatigue and distraction could</text><text class="s q0" x="286" y="314">lead to an accident.</text><rect class="cl" x="252" y="325" width="226" height="48" rx="6"/><circle cx="269" cy="349" r="11" class="ah"/><text class="t m q2" x="269" y="354">E</text><text class="t q1" x="286" y="338">External factors</text><text class="s q0" x="286" y="351">The business meeting might</text><text class="s q0" x="286" y="366">influence me.</text><rect x="484" y="91" width="226" height="44" rx="10" class="mint q5"/><text class="t m q6" x="597" y="111">Perform</text><text class="s m q1" x="597" y="127">Take action</text><text class="t q3" x="488" y="157">TEAM choice list</text><rect class="cl" x="484" y="169" width="226" height="63" rx="6"/><circle cx="501" cy="200.5" r="11" class="ah"/><text class="t m q2" x="501" y="205.5">T</text><text class="t q1" x="518" y="182">Transfer</text><text class="s q0" x="518" y="195">Should this decision go to</text><text class="s q0" x="518" y="210">someone else, such as the chief</text><text class="s q0" x="518" y="225">flight instructor?</text><rect class="cl" x="484" y="236" width="226" height="48" rx="6"/><circle cx="501" cy="260" r="11" class="ah"/><text class="t m q2" x="501" y="265">E</text><text class="t q1" x="518" y="249">Eliminate</text><text class="s q0" x="518" y="262">Is there a way to eliminate the</text><text class="s q0" x="518" y="277">hazard?</text><rect class="cl" x="484" y="288" width="226" height="48" rx="6"/><circle cx="501" cy="312" r="11" class="ah"/><text class="t m q2" x="501" y="317">A</text><text class="t q1" x="518" y="301">Accept</text><text class="s q0" x="518" y="314">Do the benefits of accepting</text><text class="s q0" x="518" y="329">the risk outweigh the costs?</text><rect class="cl" x="484" y="340" width="226" height="48" rx="6"/><circle cx="501" cy="364" r="11" class="ah"/><text class="t m q2" x="501" y="369">M</text><text class="t q1" x="518" y="353">Mitigate</text><text class="s q0" x="518" y="366">What can you do to reduce the</text><text class="s q0" x="518" y="381">risk?</text><rect class="cl" x="20" y="473" width="690" height="128" rx="8"/><text class="t" x="32" y="495" style="font-size:14px">Habits the text recommends</text><circle cx="35" cy="511" r="2.2" class="ah"/><text class="s q4" x="44" y="515">Rule of thumb for processing: if you catch yourself saying it will "probably" be okay, it is time</text><text class="s q4" x="44" y="531">for a solid reality check.</text><circle cx="35" cy="547" r="2.2" class="ah"/><text class="s q4" x="44" y="551">Use a personal minimums checklist, built on the ground with no pressure to make a specific trip, for</text><text class="s q4" x="44" y="567">go/no-go decisions.</text><circle cx="35" cy="583" r="2.2" class="ah"/><text class="s q4" x="44" y="587">Do a post-flight analysis: recognize, analyze and learn from mistakes before the next flight.</text></svg>
