<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 623" role="img" aria-labelledby="ti de"><title id="ti">PAVE and the 3P model</title><desc id="de">The Perceive, Process, Perform model for aeronautical decision-making. Perceive hazards with PAVE: Pilot, Aircraft, enVironment, External pressures. Process them with CARE: Consequences, Alternatives, Reality, External factors. Perform with TEAM: Transfer, Eliminate, Accept, Mitigate. The cycle repeats after each decision.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style>
<text class="t" x="20" y="28" style="font-size:15px">The 3P model: Perceive, Process, Perform</text>
<text class="s" x="20" y="50.0" style="font-size:13px">A continuous model for every aeronautical decision. After the pilot selects a course of action, the</text>
<text class="s" x="20" y="66.5" style="font-size:13px">circumstances have changed, and the cycle begins again.</text>
<rect x="20" y="91.0" width="226" height="44" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="133" y="111.0" style="font-size:16px">Perceive</text>
<text class="s m" x="133" y="127.0" style="font-size:12px">Identify hazards</text>
<text class="t" x="24" y="157.0" style="font-size:13px">PAVE checklist</text>
<rect class="cl" x="20" y="169.0" width="226" height="78.0" rx="6"/>
<circle cx="37" cy="208.0" r="11" class="ah"/><text class="t m" x="37" y="213.0" style="font-size:13px;fill:#fff">P</text>
<text class="t" x="54" y="182.0" style="font-size:12px">Pilot in command</text>
<text class="s" x="54" y="195.0" style="font-size:11.5px">Am I ready for this trip?</text>
<text class="s" x="54" y="210.0" style="font-size:11.5px">Experience, recency, currency,</text>
<text class="s" x="54" y="225.0" style="font-size:11.5px">physical and emotional</text>
<text class="s" x="54" y="240.0" style="font-size:11.5px">condition (IMSAFE).</text>
<rect class="cl" x="20" y="251.0" width="226" height="78.0" rx="6"/>
<circle cx="37" cy="290.0" r="11" class="ah"/><text class="t m" x="37" y="295.0" style="font-size:13px;fill:#fff">A</text>
<text class="t" x="54" y="264.0" style="font-size:12px">Aircraft</text>
<text class="s" x="54" y="277.0" style="font-size:11.5px">Right aircraft, equipped,</text>
<text class="s" x="54" y="292.0" style="font-size:11.5px">current in it, enough runway,</text>
<text class="s" x="54" y="307.0" style="font-size:11.5px">load, altitude and fuel with</text>
<text class="s" x="54" y="322.0" style="font-size:11.5px">reserves.</text>
<rect class="cl" x="20" y="333.0" width="226" height="48.0" rx="6"/>
<circle cx="37" cy="357.0" r="11" class="ah"/><text class="t m" x="37" y="362.0" style="font-size:13px;fill:#fff">V</text>
<text class="t" x="54" y="346.0" style="font-size:12px">enVironment</text>
<text class="s" x="54" y="359.0" style="font-size:11.5px">Weather, terrain, airport,</text>
<text class="s" x="54" y="374.0" style="font-size:11.5px">airspace, nighttime.</text>
<rect class="cl" x="20" y="385.0" width="226" height="78.0" rx="6"/>
<circle cx="37" cy="424.0" r="11" class="ah"/><text class="t m" x="37" y="429.0" style="font-size:13px;fill:#fff">E</text>
<text class="t" x="54" y="398.0" style="font-size:12px">External pressures</text>
<text class="s" x="54" y="411.0" style="font-size:11.5px">Influences outside the flight</text>
<text class="s" x="54" y="426.0" style="font-size:11.5px">that push the pilot to complete</text>
<text class="s" x="54" y="441.0" style="font-size:11.5px">it, often at the expense of</text>
<text class="s" x="54" y="456.0" style="font-size:11.5px">safety.</text>
<rect x="252" y="91.0" width="226" height="44" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="365" y="111.0" style="font-size:16px">Process</text>
<text class="s m" x="365" y="127.0" style="font-size:12px">Evaluate the risk</text>
<text class="t" x="256" y="157.0" style="font-size:13px">CARE checklist</text>
<rect class="cl" x="252" y="169.0" width="226" height="48.0" rx="6"/>
<circle cx="269" cy="193.0" r="11" class="ah"/><text class="t m" x="269" y="198.0" style="font-size:13px;fill:#fff">C</text>
<text class="t" x="286" y="182.0" style="font-size:12px">Consequences</text>
<text class="s" x="286" y="195.0" style="font-size:11.5px">Night flight after a full</text>
<text class="s" x="286" y="210.0" style="font-size:11.5px">workday: fatigue and pressure.</text>
<rect class="cl" x="252" y="221.0" width="226" height="48.0" rx="6"/>
<circle cx="269" cy="245.0" r="11" class="ah"/><text class="t m" x="269" y="250.0" style="font-size:13px;fill:#fff">A</text>
<text class="t" x="286" y="234.0" style="font-size:12px">Alternatives</text>
<text class="s" x="286" y="247.0" style="font-size:11.5px">Delay until morning,</text>
<text class="s" x="286" y="262.0" style="font-size:11.5px">reschedule, or drive.</text>
<rect class="cl" x="252" y="273.0" width="226" height="48.0" rx="6"/>
<circle cx="269" cy="297.0" r="11" class="ah"/><text class="t m" x="269" y="302.0" style="font-size:13px;fill:#fff">R</text>
<text class="t" x="286" y="286.0" style="font-size:12px">Reality</text>
<text class="s" x="286" y="299.0" style="font-size:11.5px">Fatigue and distraction could</text>
<text class="s" x="286" y="314.0" style="font-size:11.5px">lead to an accident.</text>
<rect class="cl" x="252" y="325.0" width="226" height="48.0" rx="6"/>
<circle cx="269" cy="349.0" r="11" class="ah"/><text class="t m" x="269" y="354.0" style="font-size:13px;fill:#fff">E</text>
<text class="t" x="286" y="338.0" style="font-size:12px">External factors</text>
<text class="s" x="286" y="351.0" style="font-size:11.5px">The business meeting might</text>
<text class="s" x="286" y="366.0" style="font-size:11.5px">influence me.</text>
<rect x="484" y="91.0" width="226" height="44" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="597" y="111.0" style="font-size:16px">Perform</text>
<text class="s m" x="597" y="127.0" style="font-size:12px">Take action</text>
<text class="t" x="488" y="157.0" style="font-size:13px">TEAM choice list</text>
<rect class="cl" x="484" y="169.0" width="226" height="63.0" rx="6"/>
<circle cx="501" cy="200.5" r="11" class="ah"/><text class="t m" x="501" y="205.5" style="font-size:13px;fill:#fff">T</text>
<text class="t" x="518" y="182.0" style="font-size:12px">Transfer</text>
<text class="s" x="518" y="195.0" style="font-size:11.5px">Should this decision go to</text>
<text class="s" x="518" y="210.0" style="font-size:11.5px">someone else, such as the chief</text>
<text class="s" x="518" y="225.0" style="font-size:11.5px">flight instructor?</text>
<rect class="cl" x="484" y="236.0" width="226" height="48.0" rx="6"/>
<circle cx="501" cy="260.0" r="11" class="ah"/><text class="t m" x="501" y="265.0" style="font-size:13px;fill:#fff">E</text>
<text class="t" x="518" y="249.0" style="font-size:12px">Eliminate</text>
<text class="s" x="518" y="262.0" style="font-size:11.5px">Is there a way to eliminate the</text>
<text class="s" x="518" y="277.0" style="font-size:11.5px">hazard?</text>
<rect class="cl" x="484" y="288.0" width="226" height="48.0" rx="6"/>
<circle cx="501" cy="312.0" r="11" class="ah"/><text class="t m" x="501" y="317.0" style="font-size:13px;fill:#fff">A</text>
<text class="t" x="518" y="301.0" style="font-size:12px">Accept</text>
<text class="s" x="518" y="314.0" style="font-size:11.5px">Do the benefits of accepting</text>
<text class="s" x="518" y="329.0" style="font-size:11.5px">the risk outweigh the costs?</text>
<rect class="cl" x="484" y="340.0" width="226" height="48.0" rx="6"/>
<circle cx="501" cy="364.0" r="11" class="ah"/><text class="t m" x="501" y="369.0" style="font-size:13px;fill:#fff">M</text>
<text class="t" x="518" y="353.0" style="font-size:12px">Mitigate</text>
<text class="s" x="518" y="366.0" style="font-size:11.5px">What can you do to reduce the</text>
<text class="s" x="518" y="381.0" style="font-size:11.5px">risk?</text>
<rect class="cl" x="20" y="473.0" width="690" height="128" rx="8"/>
<text class="t" x="32" y="495.0" style="font-size:14px">Habits the text recommends</text>
<circle cx="35" cy="511.0" r="2.2" class="ah"/>
<text class="s" x="44" y="515.0" style="font-size:12.5px">Rule of thumb for processing: if you catch yourself saying it will "probably" be okay, it is time</text>
<text class="s" x="44" y="531.0" style="font-size:12.5px">for a solid reality check.</text>
<circle cx="35" cy="547.0" r="2.2" class="ah"/>
<text class="s" x="44" y="551.0" style="font-size:12.5px">Use a personal minimums checklist, built on the ground with no pressure to make a specific trip, for</text>
<text class="s" x="44" y="567.0" style="font-size:12.5px">go/no-go decisions.</text>
<circle cx="35" cy="583.0" r="2.2" class="ah"/>
<text class="s" x="44" y="587.0" style="font-size:12.5px">Do a post-flight analysis: recognize, analyze and learn from mistakes before the next flight.</text>
</svg>
