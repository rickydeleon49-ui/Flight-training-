<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 585.0" role="img" aria-labelledby="ti de"><title id="ti">Risk assessment: the likelihood and severity matrix</title><desc id="de">The basic risk matrix rates likelihood (probable, occasional, remote, improbable) against severity (catastrophic, critical, marginal, negligible). The text example, occasional likelihood with catastrophic severity, falls in the high risk area. Ways to mitigate risk, and the IMSAFE checklist: Illness, Medication, Stress, Alcohol, Fatigue, Emotion.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style>
<text class="t" x="20" y="28" style="font-size:15px">Assessing risk: likelihood and severity</text>
<text class="s" x="20" y="50.0" style="font-size:13px">The most basic tool is the risk matrix. It rates two items: the likelihood of an event and the</text>
<text class="s" x="20" y="66.5" style="font-size:13px">severity (consequence) of that event.</text>
<text class="t" x="20" y="107.0" style="font-size:13px">Likelihood</text>
<text class="t m" x="236" y="107.0" style="font-size:13px">Severity</text>
<text class="s m" x="143.0" y="127.0" style="font-size:9px">Catastrophic</text>
<text class="s m" x="205.0" y="127.0" style="font-size:9px">Critical</text>
<text class="s m" x="267.0" y="127.0" style="font-size:9px">Marginal</text>
<text class="s m" x="329.0" y="127.0" style="font-size:9px">Negligible</text>
<text class="t e" x="104" y="159.0" style="font-size:12px">Probable</text>
<rect x="112" y="137.0" width="62" height="36" class="cl" style="stroke:currentColor;stroke-width:1.2"/>
<rect x="174" y="137.0" width="62" height="36" class="cl" style="stroke:currentColor;stroke-width:1.2"/>
<rect x="236" y="137.0" width="62" height="36" class="cl" style="stroke:currentColor;stroke-width:1.2"/>
<rect x="298" y="137.0" width="62" height="36" class="cl" style="stroke:currentColor;stroke-width:1.2"/>
<text class="t e" x="104" y="195.0" style="font-size:12px">Occasional</text>
<rect x="112" y="173.0" width="62" height="36" class="cl" style="stroke:currentColor;stroke-width:1.2"/>
<rect x="114" y="175.0" width="58" height="32" rx="4" class="acc"/><text class="t m" x="143.0" y="195.0" style="font-size:11px;fill:var(--palette-berry,#A84C6B)">HIGH</text>
<rect x="174" y="173.0" width="62" height="36" class="cl" style="stroke:currentColor;stroke-width:1.2"/>
<rect x="236" y="173.0" width="62" height="36" class="cl" style="stroke:currentColor;stroke-width:1.2"/>
<rect x="298" y="173.0" width="62" height="36" class="cl" style="stroke:currentColor;stroke-width:1.2"/>
<text class="t e" x="104" y="231.0" style="font-size:12px">Remote</text>
<rect x="112" y="209.0" width="62" height="36" class="cl" style="stroke:currentColor;stroke-width:1.2"/>
<rect x="174" y="209.0" width="62" height="36" class="cl" style="stroke:currentColor;stroke-width:1.2"/>
<rect x="236" y="209.0" width="62" height="36" class="cl" style="stroke:currentColor;stroke-width:1.2"/>
<rect x="298" y="209.0" width="62" height="36" class="cl" style="stroke:currentColor;stroke-width:1.2"/>
<text class="t e" x="104" y="267.0" style="font-size:12px">Improbable</text>
<rect x="112" y="245.0" width="62" height="36" class="cl" style="stroke:currentColor;stroke-width:1.2"/>
<rect x="174" y="245.0" width="62" height="36" class="cl" style="stroke:currentColor;stroke-width:1.2"/>
<rect x="236" y="245.0" width="62" height="36" class="cl" style="stroke:currentColor;stroke-width:1.2"/>
<rect x="298" y="245.0" width="62" height="36" class="cl" style="stroke:currentColor;stroke-width:1.2"/>
<text class="s" x="20" y="303.0" style="font-size:12px">Example from the text: the pilot rated likelihood</text>
<text class="s" x="20" y="318.5" style="font-size:12px">"occasional" (MVFR flight, possible inadvertent IMC)</text>
<text class="s" x="20" y="334.0" style="font-size:12px">and severity "catastrophic" (not instrument rated).</text>
<text class="s" x="20" y="349.5" style="font-size:12px">That cell falls in the high risk area: do not fly,</text>
<text class="s" x="20" y="365.0" style="font-size:12px">or fly only after finding ways to mitigate,</text>
<text class="s" x="20" y="380.5" style="font-size:12px">eliminate or control the risk.</text>
<text class="s" x="20" y="402.0" style="font-size:11px">The colors of the other cells are in Figure 2-5, a picture,</text>
<text class="s" x="20" y="416.5" style="font-size:11px">so they are not drawn here.</text>
<rect class="cl" x="372" y="93.0" width="338" height="164" rx="8"/>
<text class="t" x="384" y="115.0" style="font-size:13px">Likelihood guidelines</text>
<text class="t" x="384" y="135.0" style="font-size:12px">Probable</text>
<text class="s" x="472" y="135.0" style="font-size:12px">will occur several times</text>
<text class="t" x="384" y="157.0" style="font-size:12px">Occasional</text>
<text class="s" x="472" y="157.0" style="font-size:12px">will probably occur sometime</text>
<text class="t" x="384" y="179.0" style="font-size:12px">Remote</text>
<text class="s" x="472" y="179.0" style="font-size:12px">unlikely, but possible</text>
<text class="t" x="384" y="201.0" style="font-size:12px">Improbable</text>
<text class="s" x="472" y="201.0" style="font-size:12px">highly unlikely</text>
<text class="s" x="384" y="227.0" style="font-size:11px;opacity:.75">Rated probable, occasional, remote or improbable.</text>
<rect class="cl" x="372" y="267.0" width="338" height="176" rx="8"/>
<text class="t" x="384" y="289.0" style="font-size:13px">Severity guidelines</text>
<text class="t" x="384" y="309.0" style="font-size:12px">Catastrophic</text>
<text class="s" x="472" y="309.0" style="font-size:12px">fatalities, total loss</text>
<text class="t" x="384" y="331.0" style="font-size:12px">Critical</text>
<text class="s" x="472" y="331.0" style="font-size:12px">severe injury, major damage</text>
<text class="t" x="384" y="353.0" style="font-size:12px">Marginal</text>
<text class="s" x="472" y="353.0" style="font-size:12px">minor injury, minor damage</text>
<text class="t" x="384" y="375.0" style="font-size:12px">Negligible</text>
<text class="s" x="472" y="375.0" style="font-size:12px">less than minor injury or system</text>
<text class="s" x="472" y="390.5" style="font-size:12px">damage</text>
<rect class="cl" x="20" y="451.0" width="690" height="118" rx="8"/>
<text class="t" x="32" y="473.0" style="font-size:14px">Mitigating risk (text example: A to B, 50 miles, MVFR)</text>
<text class="s" x="32" y="495.0" style="font-size:12.5px">Wait for good VFR weather  |  Take an instrument-rated pilot  |  Delay  |  Cancel  |  Drive</text>
<text class="t" x="32" y="521.0" style="font-size:13px">Single-pilot check: IMSAFE</text>
<rect x="32" y="529.0" width="102" height="30" rx="8" class="sky" style="stroke:currentColor;stroke-width:1.2"/><text class="t m" x="83" y="549.0" style="font-size:12px">I  Illness</text>
<rect x="142" y="529.0" width="102" height="30" rx="8" class="lav" style="stroke:currentColor;stroke-width:1.2"/><text class="t m" x="193" y="549.0" style="font-size:12px">M  Medication</text>
<rect x="252" y="529.0" width="102" height="30" rx="8" class="mint" style="stroke:currentColor;stroke-width:1.2"/><text class="t m" x="303" y="549.0" style="font-size:12px">S  Stress</text>
<rect x="362" y="529.0" width="102" height="30" rx="8" class="rose" style="stroke:currentColor;stroke-width:1.2"/><text class="t m" x="413" y="549.0" style="font-size:12px">A  Alcohol</text>
<rect x="472" y="529.0" width="102" height="30" rx="8" class="sky" style="stroke:currentColor;stroke-width:1.2"/><text class="t m" x="523" y="549.0" style="font-size:12px">F  Fatigue</text>
<rect x="582" y="529.0" width="102" height="30" rx="8" class="lav" style="stroke:currentColor;stroke-width:1.2"/><text class="t m" x="633" y="549.0" style="font-size:12px">E  Emotion</text>
</svg>
