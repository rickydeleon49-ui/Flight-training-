<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 635" role="img" aria-labelledby="ti de"><title id="ti">Single-pilot resource management: the 5 Ps</title><desc id="de">The 5 Ps checklist for single-pilot resource management: Plan, Plane, Pilot, Passengers, Programming. Reviewed at five decision points: preflight, pretakeoff, hourly or midpoint, pre-descent, and just before the final approach fix or traffic pattern. Managing external pressures, such as get-there-itis, with personal standard operating procedures.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11px}.q1{font-size:12px}.q2{font-size:13px}.q3{stroke:currentColor;stroke-width:1.5}.q4{font-size:12px;fill:#fff}.q5{stroke-width:2}</style><text class="t" x="20" y="28" style="font-size:15px">Single-pilot resource management: the 5 Ps</text><text class="s q2" x="20" y="50">SRM is about how to gather information, analyze it, and make decisions. There is no one right answer</text><text class="s q2" x="20" y="66.5">in ADM: each pilot analyzes each situation in light of experience, personal minimums, and current</text><text class="s q2" x="20" y="83">physical and mental readiness.</text><rect class="cl" x="20" y="107.5" width="130" height="170" rx="8"/><rect x="28" y="115.5" width="114" height="30" rx="10" class="sky q3"/><text class="t m q2" x="85" y="135.5">Plan</text><text class="s q0" x="28" y="163.5">The mission or</text><text class="s q0" x="28" y="178">task: weather,</text><text class="s q0" x="28" y="192.5">route, fuel,</text><text class="s q0" x="28" y="207">publications</text><text class="s q0" x="28" y="221.5">currency. Reviewed</text><text class="s q0" x="28" y="236">and updated several</text><text class="s q0" x="28" y="250.5">times in the</text><text class="s q0" x="28" y="265">flight.</text><rect class="cl" x="158" y="107.5" width="130" height="170" rx="8"/><rect x="166" y="115.5" width="114" height="30" rx="10" class="lav q3"/><text class="t m q2" x="223" y="135.5">Plane</text><text class="s q0" x="166" y="163.5">Mechanical and</text><text class="s q0" x="166" y="178">cosmetic issues,</text><text class="s q0" x="166" y="192.5">plus database</text><text class="s q0" x="166" y="207">currency,</text><text class="s q0" x="166" y="221.5">automation status</text><text class="s q0" x="166" y="236">and backup systems.</text><rect class="cl" x="296" y="107.5" width="130" height="170" rx="8"/><rect x="304" y="115.5" width="114" height="30" rx="10" class="mint q3"/><text class="t m q2" x="361" y="135.5">Pilot</text><text class="s q0" x="304" y="163.5">Check IMSAFE. Late</text><text class="s q0" x="304" y="178">nights, fatigue and</text><text class="s q0" x="304" y="192.5">long flights make</text><text class="s q0" x="304" y="207">pilots less</text><text class="s q0" x="304" y="221.5">critical and more</text><text class="s q0" x="304" y="236">accepting.</text><rect class="cl" x="434" y="107.5" width="130" height="170" rx="8"/><rect x="442" y="115.5" width="114" height="30" rx="10" class="rose q3"/><text class="t m q2" x="499" y="135.5">Passengers</text><text class="s q0" x="442" y="163.5">Involve them in the</text><text class="s q0" x="442" y="178">decision. A rental</text><text class="s q0" x="442" y="192.5">car or airline</text><text class="s q0" x="442" y="207">ticket can remove</text><text class="s q0" x="442" y="221.5">the pressure to</text><text class="s q0" x="442" y="236">continue.</text><rect class="cl" x="572" y="107.5" width="130" height="170" rx="8"/><rect x="580" y="115.5" width="114" height="30" rx="10" class="sky q3"/><text class="t m q2" x="637" y="135.5">Programming</text><text class="s q0" x="580" y="163.5">Avionics can hold</text><text class="s q0" x="580" y="178">attention for long</text><text class="s q0" x="580" y="192.5">periods. Plan in</text><text class="s q0" x="580" y="207">advance when to</text><text class="s q0" x="580" y="221.5">program, and when</text><text class="s q0" x="580" y="236">not to.</text><rect class="cl" x="20" y="293.5" width="690" height="146" rx="8"/><text class="t" x="32" y="315.5" style="font-size:14px">When to review the 5 Ps (the five decision points)</text><circle cx="44" cy="343.5" r="11" class="ah"/><text class="t m q4" x="44" y="348.5">1</text><text class="t q1" x="32" y="371.5">Preflight</text><path d="M60 343.5L150 343.5" class="dk q5"/><circle cx="178" cy="343.5" r="11" class="ah"/><text class="t m q4" x="178" y="348.5">2</text><text class="t q1" x="166" y="371.5">Pretakeoff</text><path d="M194 343.5L284 343.5" class="dk q5"/><circle cx="312" cy="343.5" r="11" class="ah"/><text class="t m q4" x="312" y="348.5">3</text><text class="t q1" x="300" y="371.5">Hourly or midpoint</text><path d="M328 343.5L418 343.5" class="dk q5"/><circle cx="446" cy="343.5" r="11" class="ah"/><text class="t m q4" x="446" y="348.5">4</text><text class="t q1" x="434" y="371.5">Pre-descent</text><path d="M462 343.5L552 343.5" class="dk q5"/><circle cx="580" cy="343.5" r="11" class="ah"/><text class="t m q4" x="580" y="348.5">5</text><text class="t q1" x="568" y="371.5">Final approach fix</text><text class="t q1" x="568" y="387">or pattern entry</text><text class="s q1" x="32" y="405.5">Preflight and pretakeoff are the two critical go/no-go points. If the flight is longer than 2 hours, check</text><text class="s q1" x="32" y="421">hourly. Even the decision to make no changes is made by considering all the risk factors.</text><rect class="cl" x="20" y="455.5" width="690" height="160" rx="8"/><text class="t" x="32" y="477.5" style="font-size:14px">External pressures: the one that can make a pilot ignore the rest</text><circle cx="35" cy="493.5" r="2.2" class="ah"/><text class="s q1" x="44" y="497.5">Examples: someone waiting at the airport, a</text><text class="s q1" x="44" y="513">passenger you do not want to disappoint, wanting</text><text class="s q1" x="44" y="528.5">to impress ("Watch this!"), get-home-itis,</text><text class="s q1" x="44" y="544">get-there-itis, let’s-go-itis, pride.</text><text class="t" x="372" y="497.5" style="font-size:12.5px">Personal SOPs the text suggests</text><circle cx="375" cy="511.5" r="2.2" class="ah"/><text class="s q1" x="384" y="515.5">Allow time for an extra fuel stop or weather</text><text class="s q1" x="384" y="531">landing.</text><circle cx="375" cy="545.5" r="2.2" class="ah"/><text class="s q1" x="384" y="549.5">Have backup plans for a late arrival.</text><circle cx="375" cy="564" r="2.2" class="ah"/><text class="s q1" x="384" y="568">Tell people waiting that arrival may be delayed.</text><circle cx="375" cy="582.5" r="2.2" class="ah"/><text class="s q1" x="384" y="586.5">Carry a small overnight kit.</text><text class="t" x="32" y="609" style="font-size:12.5px">The key is to be ready for and accept delays.</text></svg>
