<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 580" role="img" aria-labelledby="ti de"><title id="ti">The DECIDE model</title><desc id="de">The six-step DECIDE loop: Detect the problem, Estimate the need to react, Choose a course of action, Identify solutions, Do the necessary actions, Evaluate the effect of the action, then repeat. Also automatic or naturalistic decision-making for emergencies with no time: take the first workable option based on pattern recognition from training and experience.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><text class="t" x="20" y="28" style="font-size:15px">The DECIDE model: a six-step loop</text><text class="s" x="20" y="50.0" style="font-size:13px">A continuous-loop process that gives the pilot a logical way to make decisions.</text><rect class="cl" x="20" y="76.5" width="340" height="98" rx="8"/><rect x="30" y="86.5" width="50" height="50" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="55" y="120.5" style="font-size:26px">D</text><text class="t" x="92" y="104.5" style="font-size:15px">1. Detect</text><text class="s" x="92" y="122.5" style="font-size:12px">Notice that a change occurred, or that an</text><text class="s" x="92" y="138.0" style="font-size:12px">expected change did not. Incorrectly</text><text class="s" x="92" y="153.5" style="font-size:12px">detecting the problem is a critical</text><text class="s" x="92" y="169.0" style="font-size:12px">error. (Example: a yaw.)</text><rect class="cl" x="370" y="76.5" width="340" height="98" rx="8"/><rect x="380" y="86.5" width="50" height="50" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="405" y="120.5" style="font-size:26px">E</text><text class="t" x="442" y="104.5" style="font-size:15px">2. Estimate</text><text class="s" x="442" y="122.5" style="font-size:12px">Judge the need to react. The same problem</text><text class="s" x="442" y="138.0" style="font-size:12px">can rank higher or lower depending on the</text><text class="s" x="442" y="153.5" style="font-size:12px">task load and environment. Overreaction</text><text class="s" x="442" y="169.0" style="font-size:12px">and fixation exclude a safe outcome.</text><rect class="cl" x="20" y="184.5" width="340" height="98" rx="8"/><rect x="30" y="194.5" width="50" height="50" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="55" y="228.5" style="font-size:26px">C</text><text class="t" x="92" y="212.5" style="font-size:15px">3. Choose</text><text class="s" x="92" y="230.5" style="font-size:12px">Decide the desirable outcome, such as</text><text class="s" x="92" y="246.0" style="font-size:12px">safely landing the airplane.</text><rect class="cl" x="370" y="184.5" width="340" height="98" rx="8"/><rect x="380" y="194.5" width="50" height="50" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="405" y="228.5" style="font-size:26px">I</text><text class="t" x="442" y="212.5" style="font-size:15px">4. Identify</text><text class="s" x="442" y="230.5" style="font-size:12px">Form a plan to reach the objective, with</text><text class="s" x="442" y="246.0" style="font-size:12px">one or more solutions. Do not fixate on</text><text class="s" x="442" y="261.5" style="font-size:12px">the process to the exclusion of making a</text><text class="s" x="442" y="277.0" style="font-size:12px">decision.</text><rect class="cl" x="20" y="292.5" width="340" height="98" rx="8"/><rect x="30" y="302.5" width="50" height="50" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="55" y="336.5" style="font-size:26px">D</text><text class="t" x="92" y="320.5" style="font-size:15px">5. Do</text><text class="s" x="92" y="338.5" style="font-size:12px">Select the most suitable solution for the</text><text class="s" x="92" y="354.0" style="font-size:12px">situation and act on it.</text><rect class="cl" x="370" y="292.5" width="340" height="98" rx="8"/><rect x="380" y="302.5" width="50" height="50" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="405" y="336.5" style="font-size:26px">E</text><text class="t" x="442" y="320.5" style="font-size:15px">6. Evaluate</text><text class="s" x="442" y="338.5" style="font-size:12px">Check whether the decision was correct.</text><text class="s" x="442" y="354.0" style="font-size:12px">If the result is not what was wanted,</text><text class="s" x="442" y="369.5" style="font-size:12px">repeat the process.</text><text class="s m" x="365" y="408.5" style="font-size:12.5px">Evaluate leads back to Detect: after acting, look for what has changed.</text><rect class="cl" x="20" y="426.5" width="690" height="134" rx="8"/><text class="t" x="32" y="448.5" style="font-size:14px">When there is no time: automatic (naturalistic) decision-making</text><circle cx="35" cy="464.5" r="2.2" class="ah"/><text class="s" x="44" y="468.5" style="font-size:12.5px">In an emergency, a pilot may not survive rigorously applying analytical models to every decision.</text><circle cx="35" cy="484.5" r="2.2" class="ah"/><text class="s" x="44" y="488.5" style="font-size:12.5px">Pressed for time, experts first ask whether the situation looks familiar, picture how one or a few</text><text class="s" x="44" y="504.5" style="font-size:12.5px">courses of action would play out, and take the first workable option.</text><circle cx="35" cy="520.5" r="2.2" class="ah"/><text class="s" x="44" y="524.5" style="font-size:12.5px">It may not be the best choice, but often yields remarkably good results.</text><circle cx="35" cy="540.5" r="2.2" class="ah"/><text class="s" x="44" y="544.5" style="font-size:12.5px">It is reflexive, anchored in training and experience, and improves with both.</text></svg>
