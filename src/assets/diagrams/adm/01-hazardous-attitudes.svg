<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 601" role="img" aria-labelledby="ti de"><title id="ti">The five hazardous attitudes</title><desc id="de">The five hazardous attitudes from the FAA handbook: anti-authority, impulsivity, invulnerability, macho and resignation. To neutralize a hazardous thought, recognize it, label it as hazardous, then state the corresponding antidote, which should be memorized. Antidotes: anti-authority, follow the rules, they help prevent accidents; impulsivity, not so fast, think first; invulnerability, it could happen to me; macho, taking chances is foolish; resignation, I am not helpless, I can make a difference. An example of a pilot who flew into icing from past experience and a hurry.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style>
<text class="t" x="20" y="28" style="font-size:15px">Hazardous attitudes: five that damage judgment</text>
<text class="s" x="20" y="52.0" style="font-size:13px">Attitude is a motivational predisposition to respond to people, situations, or events in a given</text>
<text class="s" x="20" y="68.5" style="font-size:13px">manner. These five attitudes can interfere with the ability to make sound decisions and exercise</text>
<text class="s" x="20" y="85.0" style="font-size:13px">authority properly.</text>
<rect x="20" y="109.5" width="130" height="128" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="85" y="135.5" style="font-size:14px">Anti-authority</text>
<text class="s" x="30" y="159.5" style="font-size:11.5px;opacity:.8">Antidote:</text>
<text class="s" x="30" y="177.5" style="font-size:12.5px">Follow the rules.</text>
<text class="s" x="30" y="193.5" style="font-size:12.5px">They help prevent</text>
<text class="s" x="30" y="209.5" style="font-size:12.5px">accidents.</text>
<rect x="158" y="109.5" width="130" height="128" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="223" y="135.5" style="font-size:14px">Impulsivity</text>
<text class="s" x="168" y="159.5" style="font-size:11.5px;opacity:.8">Antidote:</text>
<text class="s" x="168" y="177.5" style="font-size:12.5px">Not so fast.</text>
<text class="s" x="168" y="193.5" style="font-size:12.5px">Think first.</text>
<rect x="296" y="109.5" width="130" height="128" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="361" y="135.5" style="font-size:14px">Invulnerability</text>
<text class="s" x="306" y="159.5" style="font-size:11.5px;opacity:.8">Antidote:</text>
<text class="s" x="306" y="177.5" style="font-size:12.5px">It could happen</text>
<text class="s" x="306" y="193.5" style="font-size:12.5px">to me.</text>
<rect x="434" y="109.5" width="130" height="128" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="499" y="135.5" style="font-size:14px">Macho</text>
<text class="s" x="444" y="159.5" style="font-size:11.5px;opacity:.8">Antidote:</text>
<text class="s" x="444" y="177.5" style="font-size:12.5px">Taking chances is</text>
<text class="s" x="444" y="193.5" style="font-size:12.5px">foolish.</text>
<rect x="572" y="109.5" width="130" height="128" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="637" y="135.5" style="font-size:14px">Resignation</text>
<text class="s" x="582" y="159.5" style="font-size:11.5px;opacity:.8">Antidote:</text>
<text class="s" x="582" y="177.5" style="font-size:12.5px">I'm not helpless.</text>
<text class="s" x="582" y="193.5" style="font-size:12.5px">I can make a</text>
<text class="s" x="582" y="209.5" style="font-size:12.5px">difference.</text>
<rect class="cl" x="20" y="257.5" width="690" height="196" rx="8"/>
<text class="t" x="32" y="281.5" style="font-size:14px">Neutralize a hazardous thought in three steps</text>
<rect x="32" y="297.5" width="206" height="100" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/>
<circle cx="54" cy="319.5" r="13" class="ah"/><text class="t m" x="54" y="324.5" style="font-size:14px;fill:#fff">1</text>
<text class="t" x="74" y="324.5" style="font-size:14px">Recognize</text>
<text class="s" x="44" y="349.5" style="font-size:12.5px">Recognition of hazardous</text>
<text class="s" x="44" y="365.5" style="font-size:12.5px">thoughts is the first step</text>
<text class="s" x="44" y="381.5" style="font-size:12.5px">in neutralizing them.</text>
<rect x="258" y="297.5" width="206" height="100" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/>
<circle cx="280" cy="319.5" r="13" class="ah"/><text class="t m" x="280" y="324.5" style="font-size:14px;fill:#fff">2</text>
<text class="t" x="300" y="324.5" style="font-size:14px">Label</text>
<text class="s" x="270" y="349.5" style="font-size:12.5px">Label the thought as</text>
<text class="s" x="270" y="365.5" style="font-size:12.5px">hazardous.</text>
<rect x="484" y="297.5" width="206" height="100" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/>
<circle cx="506" cy="319.5" r="13" class="ah"/><text class="t m" x="506" y="324.5" style="font-size:14px;fill:#fff">3</text>
<text class="t" x="526" y="324.5" style="font-size:14px">State the antidote</text>
<text class="s" x="496" y="349.5" style="font-size:12.5px">State the corresponding</text>
<text class="s" x="496" y="365.5" style="font-size:12.5px">antidote for that attitude.</text>
<text class="s" x="32" y="421.5" style="font-size:12.5px">Antidotes should be memorized for each attitude so they come to mind automatically when needed.</text>
<text class="s" x="32" y="437.5" style="font-size:12.5px">Attitude management is the willingness to modify hazardous attitudes with an antidote thought.</text>
<rect class="cl" x="20" y="469.5" width="690" height="98" rx="8"/>
<text class="t" x="32" y="491.5" style="font-size:14px">Example: the King Air pilot (text account)</text>
<text class="s" x="32" y="511.5" style="font-size:12.5px">The pilot deliberately flew into moderate to severe icing, because past experience seemed to say it</text>
<text class="s" x="32" y="527.5" style="font-size:12.5px">was fine. The icing was forecast from the surface this time, not 2,000 feet above it. In a hurry, he</text>
<text class="s" x="32" y="543.5" style="font-size:12.5px">assigned low risk to the hazard and took a chance. He and the passengers died.</text>
<text class="s" x="20" y="585" style="font-size:11.5px;opacity:.7">Antidote wording: Risk Management Handbook (FAA-H-8083-2A), Figure 3-2.</text>
</svg>
