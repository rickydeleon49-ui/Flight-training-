<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 430" role="img" aria-labelledby="ti de"><title id="ti">Runway holding position</title><desc id="de">A taxiway meets a runway at the top. Across the taxiway are four yellow lines: two dashed lines next to the runway and two solid lines on the taxiway side. An aircraft approaching the runway stops before the first solid line. Beside the taxiway is the red runway holding position sign with white characters outlined in black.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:17px}</style><rect class="cl" x="20" y="14" width="690" height="70"/><path class="o" d="M20 14H710V84H20z"/><text class="s m" x="500" y="56" style="font-size:19px">Runway</text><rect x="20" y="84" width="180" height="336" fill="#3a3f4a"/><path d="M20 104H200" stroke="#F2C200" stroke-width="5" stroke-dasharray="16 10"/><path d="M20 118H200" stroke="#F2C200" stroke-width="5" stroke-dasharray="16 10"/><path d="M20 144H200" stroke="#F2C200" stroke-width="5"/><path d="M20 158H200" stroke="#F2C200" stroke-width="5"/><path d="M110 200c6 0 9 10 9 26l36 22v8l-36-8 2 22 12 8v6l-23-4-23 4v-6l12-8 2-22-36 8v-8l36-22c0-16 3-26 9-26z" transform="translate(0,0)" fill="#e8ecf5"/><text class="t m" x="110" y="330" style="font-size:19px;fill:#e8ecf5">Hold here</text><rect x="212" y="190" width="104" height="52" rx="6" fill="#C8102E" stroke="#111" stroke-width="3"/><text x="264" y="225" text-anchor="middle" style="font:700 28px system-ui,-apple-system,sans-serif" fill="#fff" stroke="#111" stroke-width="4" paint-order="stroke">18-36</text><text class="s q0" x="340" y="121">Two dashed lines: runway side</text><text class="s q0" x="340" y="169">Two solid lines: taxiway side</text><text class="t" x="340" y="208" style="font-size:19px">Runway holding position sign</text><text class="s q0" x="340" y="230">White characters outlined in black on red,</text><text class="s q0" x="340" y="252">like a stop sign</text><text class="s q0" x="340" y="300">Stop before the first solid line; no part</text><text class="s q0" x="340" y="322">of the aircraft may touch it.</text><text class="s q0" x="340" y="344">Do not cross the double solid lines</text><text class="s q0" x="340" y="366">without an ATC clearance.</text><text class="s q0" x="340" y="388">Leaving the runway: clear once the whole</text><text class="s q0" x="340" y="410">aircraft is across the dashed and solid lines.</text></svg>
