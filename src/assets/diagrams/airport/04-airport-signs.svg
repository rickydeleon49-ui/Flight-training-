<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 430" role="img" aria-labelledby="ti de"><title id="ti">Airport signs</title><desc id="de">Four airport sign types drawn with fixed colors. A mandatory instruction sign is red with white characters. A location sign is black with yellow characters and a yellow border and no arrows. A direction sign is yellow with black characters and an arrow. A destination sign is yellow with black characters and arrows.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:17px}.q1{font:700 38px system-ui,-apple-system,sans-serif}.q2{font-size:19px}</style><rect x="20" y="14" width="300" height="64" rx="6" fill="#C8102E" stroke="#111" stroke-width="2"/><text x="170" y="60" text-anchor="middle" fill="#fff" class="q1">18-36</text><rect x="385" y="14" width="300" height="64" rx="6" fill="#111" stroke="#F2C200" stroke-width="6"/><text x="535" y="60" text-anchor="middle" fill="#F2C200" class="q1">A</text><rect x="20" y="170" width="300" height="64" rx="6" fill="#F2C200" stroke="#111" stroke-width="2"/><text x="120" y="216" text-anchor="middle" fill="#111" class="q1">B</text><path d="M200 202H244" stroke="#111" stroke-width="7" stroke-linecap="round"/><path d="M258 202L240 187V217z" fill="#111"/><rect x="385" y="170" width="300" height="64" rx="6" fill="#F2C200" stroke="#111" stroke-width="2"/><text x="500" y="216" text-anchor="middle" fill="#111" class="q1">Terminal</text><path d="M600 202H640" stroke="#111" stroke-width="7" stroke-linecap="round"/><path d="M660 202L642 187V217z" fill="#111"/><text class="t q2" x="20" y="102">Mandatory: red, white text</text><text class="s q0" x="20" y="124">Entrance to a runway, critical area,</text><text class="s q0" x="20" y="146">or prohibited area</text><text class="t q2" x="385" y="102">Location: black, yellow text</text><text class="s q0" x="385" y="124">Yellow border, no arrows. Identifies a</text><text class="s q0" x="385" y="146">taxiway or runway location</text><text class="t q2" x="20" y="258">Direction: yellow, black text</text><text class="s q0" x="20" y="280">Names the taxiway leading out of an</text><text class="s q0" x="20" y="302">intersection. Arrow shows the turn.</text><text class="t q2" x="385" y="258">Destination: yellow, black text</text><text class="s q0" x="385" y="280">With arrows. Shows where to find</text><text class="s q0" x="385" y="302">runways, terminals, cargo areas.</text><text class="s q0" x="20" y="366">Six types in all. Also: information signs (yellow,</text><text class="s q0" x="20" y="388">black text) and runway distance remaining signs</text><text class="s q0" x="20" y="410">(black, white numbers). Inscriptions here are examples.</text></svg>
