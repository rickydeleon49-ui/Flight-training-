<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 430" role="img" aria-labelledby="ti de"><title id="ti">Two-bar VASI</title><desc id="de">Two-bar visual approach slope indicator. A side view shows one light beam with a white segment above and a red segment below. Three panels show what the pilot sees: too high is both bars white, on the glidepath is red over white, and too low is both bars red.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:17px}.q1{font:400 15px system-ui,sans-serif}.q2{font-size:18px}</style><path d="M110 115L400 15V115z" fill="#f4f4f4" stroke="currentColor" stroke-width="2"/><path d="M110 115H400V215z" fill="#D8202B" stroke="currentColor" stroke-width="2"/><rect x="92" y="103" width="18" height="24" fill="#555" stroke="currentColor" stroke-width="2"/><text class="t" x="420" y="34">Two-bar VASI</text><text class="s q0" x="420" y="60">Near and far light bars</text><text class="s q0" x="420" y="82">One glidepath, normally 3 degrees</text><text class="s q0" x="420" y="104">Clear within 10 degrees of the</text><text class="s q0" x="420" y="126">centerline, up to 4 NM out</text><text class="s q0" x="420" y="160">Each light: white segment above,</text><text class="s q0" x="420" y="182">red segment below in its beam</text><text class="t" x="20" y="252">Too high</text><rect x="20" y="262" width="220" height="92" rx="10" fill="#1c2030"/><text x="32" y="295" fill="#c9cfdd" class="q1">Far</text><circle cx="120" cy="290" r="13" fill="#fff" stroke="#888" stroke-width="1.5"/><circle cx="160" cy="290" r="13" fill="#fff" stroke="#888" stroke-width="1.5"/><circle cx="200" cy="290" r="13" fill="#fff" stroke="#888" stroke-width="1.5"/><text x="32" y="335" fill="#c9cfdd" class="q1">Near</text><circle cx="120" cy="330" r="13" fill="#fff" stroke="#888" stroke-width="1.5"/><circle cx="160" cy="330" r="13" fill="#fff" stroke="#888" stroke-width="1.5"/><circle cx="200" cy="330" r="13" fill="#fff" stroke="#888" stroke-width="1.5"/><text class="s q2" x="20" y="380">Both bars white</text><text class="t" x="255" y="252">On glidepath</text><rect x="255" y="262" width="220" height="92" rx="10" fill="#1c2030"/><text x="267" y="295" fill="#c9cfdd" class="q1">Far</text><circle cx="355" cy="290" r="13" fill="#D8202B" stroke="#888" stroke-width="1.5"/><circle cx="395" cy="290" r="13" fill="#D8202B" stroke="#888" stroke-width="1.5"/><circle cx="435" cy="290" r="13" fill="#D8202B" stroke="#888" stroke-width="1.5"/><text x="267" y="335" fill="#c9cfdd" class="q1">Near</text><circle cx="355" cy="330" r="13" fill="#fff" stroke="#888" stroke-width="1.5"/><circle cx="395" cy="330" r="13" fill="#fff" stroke="#888" stroke-width="1.5"/><circle cx="435" cy="330" r="13" fill="#fff" stroke="#888" stroke-width="1.5"/><text class="s q2" x="255" y="380">Red over white</text><text class="s" x="255" y="402" style="font-size:16px">Far bar red, near bar white</text><text class="t" x="490" y="252">Too low</text><rect x="490" y="262" width="220" height="92" rx="10" fill="#1c2030"/><text x="502" y="295" fill="#c9cfdd" class="q1">Far</text><circle cx="590" cy="290" r="13" fill="#D8202B" stroke="#888" stroke-width="1.5"/><circle cx="630" cy="290" r="13" fill="#D8202B" stroke="#888" stroke-width="1.5"/><circle cx="670" cy="290" r="13" fill="#D8202B" stroke="#888" stroke-width="1.5"/><text x="502" y="335" fill="#c9cfdd" class="q1">Near</text><circle cx="590" cy="330" r="13" fill="#D8202B" stroke="#888" stroke-width="1.5"/><circle cx="630" cy="330" r="13" fill="#D8202B" stroke="#888" stroke-width="1.5"/><circle cx="670" cy="330" r="13" fill="#D8202B" stroke="#888" stroke-width="1.5"/><text class="s q2" x="490" y="380">Both bars red</text></svg>
