<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 430" role="img" aria-labelledby="ti de"><title id="ti">Left-hand traffic pattern</title><desc id="de">Top view of a runway with the standard left-hand traffic pattern. After takeoff the aircraft goes straight ahead past the departure end, turns left onto the crosswind leg, left again onto the downwind leg flying the opposite way to landing, then left onto a base turn and left onto final. A dashed line shows entry at 45 degrees to the downwind leg at midfield. A schematic wind arrow is drawn along the runway.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:17px}.q1{font-size:19px}</style><rect class="cl" x="280" y="238" width="200" height="24"/><path class="o" d="M280 238H480V262H280z"/><path class="dk" style="stroke-width:2" d="M290 250H470" stroke-dasharray="10 8"/><text class="s m q0" x="380" y="290">Runway</text><path class="acc" stroke-linejoin="round" d="M480 250H560V110H110V250H262"/><path class="ah" d="M268 250L254 259L254 241z"/><path class="ah" d="M556 250L542 259L542 241z"/><path class="ah" d="M560 185L569 199L551 199z"/><path class="ah" d="M300 110L314 101L314 119z"/><path class="ah" d="M110 190L101 176L119 176z"/><path class="dk" style="stroke-width:3" stroke-dasharray="10 8" d="M475 15L393 97"/><path class="dh" d="M385 105L389 89L401 101z"/><text class="s q0" x="492" y="32">Enter at 45 degrees to</text><text class="s q0" x="492" y="54">downwind, at midfield</text><text class="t q1" x="572" y="185">Crosswind</text><text class="t q1" x="130" y="97">Downwind</text><text class="t q1" x="122" y="190">Base</text><text class="t q1" x="130" y="238">Final</text><text class="s q0" x="490" y="282">Departure, then upwind:</text><text class="s q0" x="490" y="302">straight ahead after takeoff</text><path class="dk" d="M470 180H345"/><path class="dh" d="M335 180L349 171L349 189z"/><text class="t m q1" x="405" y="168">Wind (schematic)</text><text class="s q0" x="20" y="346">Left-hand pattern: all turns to the left</text><text class="s q0" x="20" y="368">Pattern altitude: 1,000 ft AGL recommended</text><text class="s q0" x="20" y="390">Turn to final at least 1/4 mile from the runway</text><text class="s q0" x="20" y="412">Crosswind turn beyond the departure end, within 300 ft of pattern altitude</text></svg>
