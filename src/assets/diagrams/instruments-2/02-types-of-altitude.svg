<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 789" role="img" aria-labelledby="ti de"><title id="ti">Five types of altitude</title><desc id="de">Indicated altitude is read off the altimeter on the current setting; true altitude is height above sea level; absolute altitude is height above the terrain; pressure altitude is height above the standard datum plane, shown with the window at 29.92; density altitude is pressure altitude corrected for nonstandard temperature. Example field elevation 5,048 feet gives 1,232 feet at minus 25 degrees Celsius and 7,855 feet at 30 degrees Celsius.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:12px}.q1{font-size:11px}.q2{stroke:currentColor;stroke-width:1.5}.q3{font-size:13px}.q4{font-size:12.5px}.q5{stroke-width:1.8}.q6{fill:var(--palette-berry,#A84C6B)}.q7{stroke:currentColor;stroke-width:1.6}.q8{stroke:currentColor;stroke-width:1.4;stroke-linejoin:round}</style><text class="t" x="20" y="28" style="font-size:15px">Five types of altitude</text><text class="s q3" x="20" y="50">Each type of altitude measures from a different reference level. The picture is a schematic, not to</text><text class="s q3" x="20" y="66.5">scale. The 5,048, 7,855 and 1,232 ft figures are from the PHAK density altitude example.</text><rect class="cl" x="20" y="91" width="690" height="290" rx="8"/><path d="M20 323L20 311L120 301L230 283L330 259L470 263L560 287L640 299L698 305L698 323Z" class="mint q7"/><path d="M20 323L698 323" class="dk" style="stroke-width:1.6;opacity:0.9"/><path d="M20 345L698 345" class="dk" style="stroke-width:1.5;opacity:0.8;stroke-dasharray:6 5"/><text class="s e q1" x="694" y="337">Sea level</text><text class="s e q1" x="694" y="359">Standard datum plane (29.92 "Hg), drawn below sea level here</text><text class="t" x="60" y="293" style="font-size:11.5px">Terrain</text><path d="M110 157L560 157" class="dk" style="stroke-width:1.2;opacity:0.6;stroke-dasharray:6 5"/><ellipse cx="470" cy="155" rx="26" ry="6" class="sky q7"/><path d="M466 153L454 135L462 135L480 153Z" class="sky q8"/><path d="M448 151L440 141L446 141L456 151Z" class="sky q8"/><path d="M150 345L150 167" class="acc q5"/><path d="M150 160L153.2 167L146.8 167Z" class="dh q6"/><text class="t m q4" x="150" y="127">Pressure</text><text class="s m q1" x="150" y="141">altitude</text><path d="M250 323L250 167" class="acc q5"/><path d="M250 160L253.2 167L246.8 167Z" class="dh q6"/><text class="t m q4" x="250" y="127">True</text><text class="s m q1" x="250" y="141">altitude</text><path d="M350 259L350 167" class="acc q5"/><path d="M350 160L353.1 167L346.9 167Z" class="dh q6"/><text class="t m q4" x="350" y="127">Absolute</text><text class="s m q1" x="350" y="141">altitude</text><rect x="560" y="125" width="138" height="56" rx="10" class="rose q2"/><text class="t m q1" x="629" y="142.67">Indicated</text><text class="t m q1" x="629" y="156.67">Altimeter read, set to</text><text class="t m q1" x="629" y="170.67">the current setting</text><rect x="560" y="191" width="138" height="66" rx="10" class="lav q2"/><text class="t m q1" x="629" y="206.67">Density</text><text class="t m q1" x="629" y="220.67">Pressure altitude</text><text class="t m q1" x="629" y="234.67">plus a temperature</text><text class="t m q1" x="629" y="248.67">correction</text><text class="s m q1" x="629" y="273">Hot: higher than pressure</text><text class="s m q1" x="629" y="286">Cold: lower than pressure</text><rect x="20" y="395" width="222" height="24" rx="10" class="rose q2"/><text class="t q3" x="30" y="412">1. Indicated</text><circle cx="31" cy="433" r="2.2" class="ah"/><text class="s q0" x="40" y="437">Read straight off the altimeter</text><circle cx="31" cy="452.5" r="2.2" class="ah"/><text class="s q0" x="40" y="456.5">Uncorrected, with the window on</text><text class="s q0" x="40" y="472">the current altimeter setting</text><rect x="254" y="395" width="222" height="24" rx="10" class="sky q2"/><text class="t q3" x="264" y="412">2. True</text><circle cx="265" cy="433" r="2.2" class="ah"/><text class="s q0" x="274" y="437">Actual height above sea level</text><text class="s q0" x="274" y="452.5">(MSL)</text><circle cx="265" cy="468" r="2.2" class="ah"/><text class="s q0" x="274" y="472">Airport, terrain and obstacle</text><text class="s q0" x="274" y="487.5">elevations on charts are true</text><text class="s q0" x="274" y="503">altitudes</text><rect x="488" y="395" width="222" height="24" rx="10" class="mint q2"/><text class="t q3" x="498" y="412">3. Absolute</text><circle cx="499" cy="433" r="2.2" class="ah"/><text class="s q0" x="508" y="437">Height above the terrain (AGL)</text><rect x="20" y="532.5" width="337" height="24" rx="10" class="lav q2"/><text class="t q3" x="30" y="549.5">4. Pressure</text><circle cx="31" cy="570.5" r="2.2" class="ah"/><text class="s q0" x="40" y="574.5">What shows with the window set to 29.92 "Hg</text><circle cx="31" cy="590" r="2.2" class="ah"/><text class="s q0" x="40" y="594">Measured from the standard datum plane</text><circle cx="31" cy="609.5" r="2.2" class="ah"/><text class="s q0" x="40" y="613.5">Basis for density altitude, true altitude, TAS</text><text class="s q0" x="40" y="629">and performance data</text><circle cx="31" cy="644.5" r="2.2" class="ah"/><text class="s q0" x="40" y="648.5">Flight levels at and above 18,000 ft use it</text><rect x="373" y="532.5" width="337" height="24" rx="10" class="rose q2"/><text class="t q3" x="383" y="549.5">5. Density</text><circle cx="384" cy="570.5" r="2.2" class="ah"/><text class="s q0" x="393" y="574.5">Pressure altitude corrected for nonstandard</text><text class="s q0" x="393" y="590">temperature</text><circle cx="384" cy="605.5" r="2.2" class="ah"/><text class="s q0" x="393" y="609.5">Standard day: equal to pressure altitude</text><circle cx="384" cy="625" r="2.2" class="ah"/><text class="s q0" x="393" y="629">Above-standard temperature: higher;</text><text class="s q0" x="393" y="644.5">below-standard: lower</text><circle cx="384" cy="660" r="2.2" class="ah"/><text class="s q0" x="393" y="664">The one tied directly to aircraft performance</text><text class="t q3" x="20" y="707.5">Density altitude example: field elevation 5,048 ft MSL</text><rect x="20" y="715.5" width="216.67" height="66" rx="10" class="sky q2"/><text class="t m q4" x="128.33" y="734.5">-25 C: 1,232 ft</text><text class="s m q1" x="128.33" y="751.5">Dense air; much better performance</text><path d="M238.67 748.5L247.7 748.5" class="dk" style="stroke-width:2"/><path d="M254.67 748.5L247.7 751.6L247.7 745.4Z" class="dh" style=""/><rect x="256.67" y="715.5" width="216.67" height="66" rx="10" class="mint q2"/><text class="t m q4" x="365" y="734.5">5 C (standard): 5,048 ft</text><text class="s m q1" x="365" y="751.5">Pressure and density altitude match</text><path d="M475.33 748.5L484.3 748.5" class="dk" style="stroke-width:2"/><path d="M491.33 748.5L484.3 751.6L484.3 745.4Z" class="dh" style=""/><rect x="493.33" y="715.5" width="216.67" height="66" rx="10" class="rose q2"/><text class="t m q4" x="601.67" y="734.5">30 C: 7,855 ft</text><text class="s m q1" x="601.67" y="751.5">Takeoff performs as if the field</text><text class="s m q1" x="601.67" y="766">were at 7,855 ft</text></svg>
