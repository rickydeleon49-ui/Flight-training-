<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 789" role="img" aria-labelledby="ti de"><title id="ti">Five types of altitude</title><desc id="de">Indicated altitude is read off the altimeter on the current setting; true altitude is height above sea level; absolute altitude is height above the terrain; pressure altitude is height above the standard datum plane, shown with the window at 29.92; density altitude is pressure altitude corrected for nonstandard temperature. Example field elevation 5,048 feet gives 1,232 feet at minus 25 degrees Celsius and 7,855 feet at 30 degrees Celsius.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><text class="t" x="20" y="28" style="font-size:15px">Five types of altitude</text><text class="s" x="20" y="50.0" style="font-size:13px">Each type of altitude measures from a different reference level. The picture is a schematic, not to</text><text class="s" x="20" y="66.5" style="font-size:13px">scale. The 5,048, 7,855 and 1,232 ft figures are from the PHAK density altitude example.</text><rect class="cl" x="20" y="91.0" width="690" height="290" rx="8"/><path d="M20 323.0L20 311.0L120 301.0L230 283.0L330 259.0L470 263.0L560 287.0L640 299.0L698 305.0L698 323.0Z" class="mint" style="stroke:currentColor;stroke-width:1.6"/><path d="M20 323.0L698 323.0" class="dk" style="stroke-width:1.6;opacity:0.9"/><path d="M20 345.0L698 345.0" class="dk" style="stroke-width:1.5;opacity:0.8;stroke-dasharray:6 5"/><text class="s e" x="694" y="337.0" style="font-size:11px">Sea level</text><text class="s e" x="694" y="359.0" style="font-size:11px">Standard datum plane (29.92 "Hg), drawn below sea level here</text><text class="t" x="60" y="293.0" style="font-size:11.5px">Terrain</text><path d="M110 157.0L560 157.0" class="dk" style="stroke-width:1.2;opacity:0.6;stroke-dasharray:6 5"/><ellipse cx="470" cy="155.0" rx="26" ry="6" class="sky" style="stroke:currentColor;stroke-width:1.6"/><path d="M466 153.0L454 135.0L462 135.0L480 153.0Z" class="sky" style="stroke:currentColor;stroke-width:1.4;stroke-linejoin:round"/><path d="M448 151.0L440 141.0L446 141.0L456 151.0Z" class="sky" style="stroke:currentColor;stroke-width:1.4;stroke-linejoin:round"/><path d="M150 345.0L150.0 167.0" class="acc" style="stroke-width:1.8"/><path d="M150 160.0L153.2 167.0L146.8 167.0Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><text class="t m" x="150" y="127.0" style="font-size:12.5px">Pressure</text><text class="s m" x="150" y="141.0" style="font-size:11px">altitude</text><path d="M250 323.0L250.0 167.0" class="acc" style="stroke-width:1.8"/><path d="M250 160.0L253.2 167.0L246.8 167.0Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><text class="t m" x="250" y="127.0" style="font-size:12.5px">True</text><text class="s m" x="250" y="141.0" style="font-size:11px">altitude</text><path d="M350 259.0L350.0 167.0" class="acc" style="stroke-width:1.8"/><path d="M350 160.0L353.1 167.0L346.9 167.0Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><text class="t m" x="350" y="127.0" style="font-size:12.5px">Absolute</text><text class="s m" x="350" y="141.0" style="font-size:11px">altitude</text><rect x="560" y="125.0" width="138" height="56" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="629.0" y="142.66666666666666" style="font-size:11px">Indicated</text><text class="t m" x="629.0" y="156.66666666666666" style="font-size:11px">Altimeter read, set to</text><text class="t m" x="629.0" y="170.66666666666666" style="font-size:11px">the current setting</text><rect x="560" y="191.0" width="138" height="66" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="629.0" y="206.66666666666666" style="font-size:11px">Density</text><text class="t m" x="629.0" y="220.66666666666666" style="font-size:11px">Pressure altitude</text><text class="t m" x="629.0" y="234.66666666666666" style="font-size:11px">plus a temperature</text><text class="t m" x="629.0" y="248.66666666666666" style="font-size:11px">correction</text><text class="s m" x="629" y="273.0" style="font-size:11px">Hot: higher than pressure</text><text class="s m" x="629" y="286.0" style="font-size:11px">Cold: lower than pressure</text><rect x="20" y="395.0" width="222" height="24" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30" y="412.0" style="font-size:13px">1. Indicated</text><circle cx="31" cy="433.0" r="2.2" class="ah"/><text class="s" x="40" y="437.0" style="font-size:12px">Read straight off the altimeter</text><circle cx="31" cy="452.5" r="2.2" class="ah"/><text class="s" x="40" y="456.5" style="font-size:12px">Uncorrected, with the window on</text><text class="s" x="40" y="472.0" style="font-size:12px">the current altimeter setting</text><rect x="254" y="395.0" width="222" height="24" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="264" y="412.0" style="font-size:13px">2. True</text><circle cx="265" cy="433.0" r="2.2" class="ah"/><text class="s" x="274" y="437.0" style="font-size:12px">Actual height above sea level</text><text class="s" x="274" y="452.5" style="font-size:12px">(MSL)</text><circle cx="265" cy="468.0" r="2.2" class="ah"/><text class="s" x="274" y="472.0" style="font-size:12px">Airport, terrain and obstacle</text><text class="s" x="274" y="487.5" style="font-size:12px">elevations on charts are true</text><text class="s" x="274" y="503.0" style="font-size:12px">altitudes</text><rect x="488" y="395.0" width="222" height="24" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="498" y="412.0" style="font-size:13px">3. Absolute</text><circle cx="499" cy="433.0" r="2.2" class="ah"/><text class="s" x="508" y="437.0" style="font-size:12px">Height above the terrain (AGL)</text><rect x="20" y="532.5" width="337" height="24" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30" y="549.5" style="font-size:13px">4. Pressure</text><circle cx="31" cy="570.5" r="2.2" class="ah"/><text class="s" x="40" y="574.5" style="font-size:12px">What shows with the window set to 29.92 "Hg</text><circle cx="31" cy="590.0" r="2.2" class="ah"/><text class="s" x="40" y="594.0" style="font-size:12px">Measured from the standard datum plane</text><circle cx="31" cy="609.5" r="2.2" class="ah"/><text class="s" x="40" y="613.5" style="font-size:12px">Basis for density altitude, true altitude, TAS</text><text class="s" x="40" y="629.0" style="font-size:12px">and performance data</text><circle cx="31" cy="644.5" r="2.2" class="ah"/><text class="s" x="40" y="648.5" style="font-size:12px">Flight levels at and above 18,000 ft use it</text><rect x="373" y="532.5" width="337" height="24" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="383" y="549.5" style="font-size:13px">5. Density</text><circle cx="384" cy="570.5" r="2.2" class="ah"/><text class="s" x="393" y="574.5" style="font-size:12px">Pressure altitude corrected for nonstandard</text><text class="s" x="393" y="590.0" style="font-size:12px">temperature</text><circle cx="384" cy="605.5" r="2.2" class="ah"/><text class="s" x="393" y="609.5" style="font-size:12px">Standard day: equal to pressure altitude</text><circle cx="384" cy="625.0" r="2.2" class="ah"/><text class="s" x="393" y="629.0" style="font-size:12px">Above-standard temperature: higher;</text><text class="s" x="393" y="644.5" style="font-size:12px">below-standard: lower</text><circle cx="384" cy="660.0" r="2.2" class="ah"/><text class="s" x="393" y="664.0" style="font-size:12px">The one tied directly to aircraft performance</text><text class="t" x="20" y="707.5" style="font-size:13px">Density altitude example: field elevation 5,048 ft MSL</text><rect x="20.0" y="715.5" width="216.66666666666666" height="66.0" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="128.33333333333331" y="734.5" style="font-size:12.5px">-25 C: 1,232 ft</text><text class="s m" x="128.33333333333331" y="751.5" style="font-size:11px">Dense air; much better performance</text><path d="M238.67 748.5L247.7 748.5" class="dk" style="stroke-width:2"/><path d="M254.67 748.5L247.7 751.6L247.7 745.4Z" class="dh" style=""/><rect x="256.66666666666663" y="715.5" width="216.66666666666666" height="66.0" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="364.99999999999994" y="734.5" style="font-size:12.5px">5 C (standard): 5,048 ft</text><text class="s m" x="364.99999999999994" y="751.5" style="font-size:11px">Pressure and density altitude match</text><path d="M475.33 748.5L484.3 748.5" class="dk" style="stroke-width:2"/><path d="M491.33 748.5L484.3 751.6L484.3 745.4Z" class="dh" style=""/><rect x="493.3333333333333" y="715.5" width="216.66666666666666" height="66.0" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="601.6666666666666" y="734.5" style="font-size:12.5px">30 C: 7,855 ft</text><text class="s m" x="601.6666666666666" y="751.5" style="font-size:11px">Takeoff performs as if the field</text><text class="s m" x="601.6666666666666" y="766.0" style="font-size:11px">were at 7,855 ft</text></svg>
