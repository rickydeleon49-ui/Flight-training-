<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 865" role="img" aria-labelledby="ti de"><title id="ti">How the vertical speed indicator works</title><desc id="de">The VSI operates from static pressure. Inside an airtight case, a diaphragm is connected directly to the static line, while the case receives static pressure through a restricted orifice, a calibrated leak. In a climb or descent the case pressure lags behind the diaphragm pressure, creating a differential that moves the needle: first a trend, then after about six to nine seconds a stable rate. An instantaneous VSI uses accelerometers to offset the lag.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11px}.q1{font-size:12px}.q2{font-size:11.5px}.q3{stroke:currentColor;stroke-width:1.5}.q4{font-size:13px}.q5{stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}.q6{font-size:12.5px}.q7{stroke-width:2.8;opacity:1}.q8{stroke-width:2;opacity:1}</style><text class="t" x="20" y="28" style="font-size:15px">How the vertical speed indicator works</text><text class="s q4" x="20" y="50">The VSI uses static pressure only, but it compares two air pressures: one that follows the static line</text><text class="s q4" x="20" y="66.5">at once and one that follows it late through a calibrated leak. The drawing is schematic.</text><rect class="cl" x="20" y="91" width="690" height="250" rx="8"/><text class="t" x="32" y="113" style="font-size:14px">Inside the VSI</text><rect x="210" y="141" width="300" height="168" class="cl q5"/><text class="t q2" x="222" y="159">Instrument case (airtight)</text><rect x="262" y="191" width="76" height="68" class="sky q5"/><text class="t m q2" x="300" y="229">Diaphragm</text><path d="M60 225L262 225" class="dk q7"/><text class="t q2" x="32" y="213">Static line</text><path d="M32 225L55 225" class="dk" style="stroke-width:2.2"/><path d="M62 225L55 228.2L55 221.8Z" class="dh" style=""/><path d="M110 225L110 287L210 287" class="dk q7"/><path d="M210 287l8 -8l8 16l8 -16l8 8" class="rose q5"/><path d="M242 287L266 287" class="dk" style="stroke-width:2.8"/><path d="M274 287L266 290.6L266 283.4Z" class="dh" style=""/><text class="t q2" x="32" y="313">Calibrated leak</text><text class="s q0" x="32" y="328">(restricted orifice)</text><text class="s q0" x="272" y="173">Inside: follows</text><text class="s q0" x="272" y="186">static at once</text><text class="s q0" x="350" y="279">Case around it: same</text><text class="s q0" x="350" y="293">pressure, but arrives late</text><path d="M338 225L540 225" class="dk" style="stroke-width:2.2;opacity:1"/><circle cx="612" cy="225" r="62" class="cl" style="stroke:currentColor;stroke-width:1.8"/><text class="t q1" x="556" y="229">0</text><text class="t m q2" x="612" y="179">Up</text><text class="t m q2" x="612" y="279">Down</text><path d="M612 225L572 225" class="dk" style="stroke-width:2.5;opacity:1"/><circle cx="612" cy="225" r="4" class="dh"/><text class="s m q0" x="612" y="303">Feet per minute</text><rect x="20" y="355" width="216.67" height="95" rx="10" class="mint q3"/><text class="t m q6" x="128.33" y="374">Level flight or parked</text><text class="s m q0" x="128.33" y="391">Pressures in the diaphragm and case</text><text class="s m q0" x="128.33" y="405.5">are equal, so the pointer sits at</text><text class="s m q0" x="128.33" y="420">zero</text><rect x="256.67" y="355" width="216.67" height="95" rx="10" class="sky q3"/><text class="t m q6" x="365" y="374">Climb</text><text class="s m q0" x="365" y="391">Diaphragm pressure drops at once;</text><text class="s m q0" x="365" y="405.5">case stays higher briefly, so the</text><text class="s m q0" x="365" y="420">diaphragm contracts and the pointer</text><text class="s m q0" x="365" y="434.5">shows a climb</text><rect x="493.33" y="355" width="216.67" height="95" rx="10" class="rose q3"/><text class="t m q6" x="601.67" y="374">Descent</text><text class="s m q0" x="601.67" y="391">Diaphragm pressure rises at once;</text><text class="s m q0" x="601.67" y="405.5">case stays lower briefly, so the</text><text class="s m q0" x="601.67" y="420">diaphragm expands and the pointer</text><text class="s m q0" x="601.67" y="434.5">shows a descent</text><rect class="cl" x="20" y="464" width="430" height="272" rx="8"/><text class="t" x="32" y="486" style="font-size:14px">Needle response to a pitch-up</text><path d="M70 660L70 508" class="dk q8"/><path d="M70 660L430 660" class="dk q8"/><text class="s q0" x="74" y="504">Needle (schematic)</text><text class="s e q0" x="430" y="676">Time</text><path d="M70 640L130 640L130 550L420 550" class="dk" style="stroke-width:1.5;opacity:0.55;stroke-dasharray:6 5"/><path d="M130 640L136 627.2L142 616.2L148 606.7L154 598.6L160 591.7L166 585.8L172 580.7L178 576.3L184 572.5L190 569.3L196 566.6L202 564.2L208 562.2L214 560.4L220 559L226 557.7L232 556.6L238 555.6L244 554.8L250 554.1L256 553.6L262 553.1L268 552.6L274 552.2L280 551.9L286 551.6L292 551.4L298 551.2L304 551L310 550.9L316 550.8L322 550.7L328 550.6L334 550.5L340 550.4L346 550.4L352 550.3L358 550.3L364 550.2L370 550.2L376 550.2L382 550.1L388 550.1L394 550.1L400 550.1L406 550.1L412 550.1" class="acc" style="stroke-width:3;opacity:1"/><text class="s q0" x="134" y="676">Pitch changes</text><path d="M130 640L130 664" class="dk" style="stroke-width:1.2;opacity:0.7"/><path d="M130 532L275 532" class="dk" style="stroke-width:1.8"/><path d="M282 532L275 535.1L275 528.9Z" class="dh" style=""/><path d="M282 532L137 532" class="dk" style="stroke-width:1.8"/><path d="M130 532L137 528.9L137 535.1Z" class="dh" style=""/><text class="t m q2" x="206" y="527">Lag (about 6-9 s)</text><path d="M140 630L159.9 596.9" class="acc" style="stroke-width:2"/><path d="M164 590L163 598.7L156.8 595Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><text class="t q0" x="170" y="624">Trend: needle moves at once</text><text class="t q0" x="300" y="570">Rate: steady reading</text><text class="s q0" x="300" y="584">of the climb</text><text class="s q0" x="70" y="724">Dashed: real change in climb rate. Solid: needle.</text><rect x="466" y="464" width="244" height="24" rx="10" class="sky q3"/><text class="t q4" x="476" y="481">Trend</text><circle cx="477" cy="502" r="2.2" class="ah"/><text class="s q1" x="486" y="506">The direction the needle moves,</text><text class="s q1" x="486" y="521.5">shown immediately</text><circle cx="477" cy="537" r="2.2" class="ah"/><text class="s q1" x="486" y="541">Pull back from level flight and</text><text class="s q1" x="486" y="556.5">the needle moves up</text><rect x="466" y="586" width="244" height="24" rx="10" class="mint q3"/><text class="t q4" x="476" y="603">Rate</text><circle cx="477" cy="624" r="2.2" class="ah"/><text class="s q1" x="486" y="628">The stabilized rate of change, in</text><text class="s q1" x="486" y="643.5">hundreds of fpm</text><circle cx="477" cy="659" r="2.2" class="ah"/><text class="s q1" x="486" y="663">Holds after the pitch is held</text><text class="s q1" x="486" y="678.5">steady</text><rect x="466" y="708" width="244" height="24" rx="10" class="rose q3"/><text class="t q4" x="476" y="725">Lag</text><circle cx="477" cy="746" r="2.2" class="ah"/><text class="s q1" x="486" y="750">Time from the change until the new</text><text class="s q1" x="486" y="765.5">rate shows</text><circle cx="477" cy="781" r="2.2" class="ah"/><text class="s q1" x="486" y="785">Rough technique and turbulence</text><text class="s q1" x="486" y="800.5">stretch it</text><circle cx="477" cy="816" r="2.2" class="ah"/><text class="s q1" x="486" y="820">An instantaneous VSI (IVSI) uses</text><text class="s q1" x="486" y="835.5">accelerometers to offset it</text></svg>
