<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 865" role="img" aria-labelledby="ti de"><title id="ti">How the vertical speed indicator works</title><desc id="de">The VSI operates from static pressure. Inside an airtight case, a diaphragm is connected directly to the static line, while the case receives static pressure through a restricted orifice, a calibrated leak. In a climb or descent the case pressure lags behind the diaphragm pressure, creating a differential that moves the needle: first a trend, then after about six to nine seconds a stable rate. An instantaneous VSI uses accelerometers to offset the lag.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style>
<text class="t" x="20" y="28" style="font-size:15px">How the vertical speed indicator works</text>
<text class="s" x="20" y="50.0" style="font-size:13px">The VSI uses static pressure only, but it compares two air pressures: one that follows the static line</text>
<text class="s" x="20" y="66.5" style="font-size:13px">at once and one that follows it late through a calibrated leak. The drawing is schematic.</text>
<rect class="cl" x="20" y="91.0" width="690" height="250" rx="8"/>
<text class="t" x="32" y="113.0" style="font-size:14px">Inside the VSI</text>
<rect x="210" y="141.0" width="300" height="168" class="cl" style="stroke:currentColor;stroke-width:1.8;stroke-linejoin:round"/>
<text class="t" x="222" y="159.0" style="font-size:11.5px">Instrument case (airtight)</text>
<rect x="262" y="191.0" width="76" height="68" class="sky" style="stroke:currentColor;stroke-width:1.8;stroke-linejoin:round"/>
<text class="t m" x="300" y="229.0" style="font-size:11.5px">Diaphragm</text>
<path d="M60 225.0L262 225.0" class="dk" style="stroke-width:2.8;opacity:1"/>
<text class="t" x="32" y="213.0" style="font-size:11.5px">Static line</text>
<path d="M32 225.0L55.0 225.0" class="dk" style="stroke-width:2.2"/><path d="M62 225.0L55.0 228.2L55.0 221.8Z" class="dh" style=""/>
<path d="M110.0 225.0L110.0 287.0L210.0 287.0" class="dk" style="stroke-width:2.8;opacity:1"/>
<path d="M210 287.0l8 -8l8 16l8 -16l8 8" class="rose" style="stroke:currentColor;stroke-width:1.8;stroke-linejoin:round"/>
<path d="M242 287.0L266.0 287.0" class="dk" style="stroke-width:2.8"/><path d="M274 287.0L266.0 290.6L266.0 283.4Z" class="dh" style=""/>
<text class="t" x="32" y="313.0" style="font-size:11.5px">Calibrated leak</text>
<text class="s" x="32" y="328.0" style="font-size:11px">(restricted orifice)</text>
<text class="s" x="272" y="173.0" style="font-size:11px">Inside: follows</text>
<text class="s" x="272" y="186.0" style="font-size:11px">static at once</text>
<text class="s" x="350" y="279.0" style="font-size:11px">Case around it: same</text>
<text class="s" x="350" y="293.0" style="font-size:11px">pressure, but arrives late</text>
<path d="M338 225.0L540 225.0" class="dk" style="stroke-width:2.2;opacity:1"/>
<circle cx="612" cy="225.0" r="62" class="cl" style="stroke:currentColor;stroke-width:1.8"/>
<text class="t" x="556" y="229.0" style="font-size:12px">0</text>
<text class="t m" x="612" y="179.0" style="font-size:11.5px">Up</text>
<text class="t m" x="612" y="279.0" style="font-size:11.5px">Down</text>
<path d="M612 225.0L572 225.0" class="dk" style="stroke-width:2.5;opacity:1"/>
<circle cx="612" cy="225.0" r="4" class="dh"/>
<text class="s m" x="612" y="303.0" style="font-size:11px">Feet per minute</text>
<rect x="20.0" y="355.0" width="216.66666666666666" height="95.0" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="128.33333333333331" y="374.0" style="font-size:12.5px">Level flight or parked</text>
<text class="s m" x="128.33333333333331" y="391.0" style="font-size:11px">Pressures in the diaphragm and case</text>
<text class="s m" x="128.33333333333331" y="405.5" style="font-size:11px">are equal, so the pointer sits at</text>
<text class="s m" x="128.33333333333331" y="420.0" style="font-size:11px">zero</text>
<rect x="256.66666666666663" y="355.0" width="216.66666666666666" height="95.0" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="364.99999999999994" y="374.0" style="font-size:12.5px">Climb</text>
<text class="s m" x="364.99999999999994" y="391.0" style="font-size:11px">Diaphragm pressure drops at once;</text>
<text class="s m" x="364.99999999999994" y="405.5" style="font-size:11px">case stays higher briefly, so the</text>
<text class="s m" x="364.99999999999994" y="420.0" style="font-size:11px">diaphragm contracts and the pointer</text>
<text class="s m" x="364.99999999999994" y="434.5" style="font-size:11px">shows a climb</text>
<rect x="493.3333333333333" y="355.0" width="216.66666666666666" height="95.0" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="601.6666666666666" y="374.0" style="font-size:12.5px">Descent</text>
<text class="s m" x="601.6666666666666" y="391.0" style="font-size:11px">Diaphragm pressure rises at once;</text>
<text class="s m" x="601.6666666666666" y="405.5" style="font-size:11px">case stays lower briefly, so the</text>
<text class="s m" x="601.6666666666666" y="420.0" style="font-size:11px">diaphragm expands and the pointer</text>
<text class="s m" x="601.6666666666666" y="434.5" style="font-size:11px">shows a descent</text>
<rect class="cl" x="20" y="464.0" width="430" height="272" rx="8"/>
<text class="t" x="32" y="486.0" style="font-size:14px">Needle response to a pitch-up</text>
<path d="M70 660.0L70 508.0" class="dk" style="stroke-width:2;opacity:1"/>
<path d="M70 660.0L430 660.0" class="dk" style="stroke-width:2;opacity:1"/>
<text class="s" x="74" y="504.0" style="font-size:11px">Needle (schematic)</text>
<text class="s e" x="430" y="676.0" style="font-size:11px">Time</text>
<path d="M70.0 640.0L130.0 640.0L130.0 550.0L420.0 550.0" class="dk" style="stroke-width:1.5;opacity:0.55;stroke-dasharray:6 5"/>
<path d="M130.0 640.0L136.0 627.2L142.0 616.2L148.0 606.7L154.0 598.6L160.0 591.7L166.0 585.8L172.0 580.7L178.0 576.3L184.0 572.5L190.0 569.3L196.0 566.6L202.0 564.2L208.0 562.2L214.0 560.4L220.0 559.0L226.0 557.7L232.0 556.6L238.0 555.6L244.0 554.8L250.0 554.1L256.0 553.6L262.0 553.1L268.0 552.6L274.0 552.2L280.0 551.9L286.0 551.6L292.0 551.4L298.0 551.2L304.0 551.0L310.0 550.9L316.0 550.8L322.0 550.7L328.0 550.6L334.0 550.5L340.0 550.4L346.0 550.4L352.0 550.3L358.0 550.3L364.0 550.2L370.0 550.2L376.0 550.2L382.0 550.1L388.0 550.1L394.0 550.1L400.0 550.1L406.0 550.1L412.0 550.1" class="acc" style="stroke-width:3;opacity:1"/>
<text class="s" x="134" y="676.0" style="font-size:11px">Pitch changes</text>
<path d="M130 640.0L130 664.0" class="dk" style="stroke-width:1.2;opacity:0.7"/>
<path d="M130 532.0L275.0 532.0" class="dk" style="stroke-width:1.8"/><path d="M282 532.0L275.0 535.1L275.0 528.9Z" class="dh" style=""/>
<path d="M282 532.0L137.0 532.0" class="dk" style="stroke-width:1.8"/><path d="M130 532.0L137.0 528.9L137.0 535.1Z" class="dh" style=""/>
<text class="t m" x="206.0" y="527.0" style="font-size:11.5px">Lag (about 6-9 s)</text>
<path d="M140 630.0L159.9 596.9" class="acc" style="stroke-width:2"/><path d="M164 590.0L163.0 598.7L156.8 595.0Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/>
<text class="t" x="170" y="624.0" style="font-size:11px">Trend: needle moves at once</text>
<text class="t" x="300" y="570.0" style="font-size:11px">Rate: steady reading</text>
<text class="s" x="300" y="584.0" style="font-size:11px">of the climb</text>
<text class="s" x="70" y="724.0" style="font-size:11px">Dashed: real change in climb rate. Solid: needle.</text>
<rect x="466" y="464.0" width="244" height="24" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="476" y="481.0" style="font-size:13px">Trend</text>
<circle cx="477" cy="502.0" r="2.2" class="ah"/>
<text class="s" x="486" y="506.0" style="font-size:12px">The direction the needle moves,</text>
<text class="s" x="486" y="521.5" style="font-size:12px">shown immediately</text>
<circle cx="477" cy="537.0" r="2.2" class="ah"/>
<text class="s" x="486" y="541.0" style="font-size:12px">Pull back from level flight and</text>
<text class="s" x="486" y="556.5" style="font-size:12px">the needle moves up</text>
<rect x="466" y="586.0" width="244" height="24" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="476" y="603.0" style="font-size:13px">Rate</text>
<circle cx="477" cy="624.0" r="2.2" class="ah"/>
<text class="s" x="486" y="628.0" style="font-size:12px">The stabilized rate of change, in</text>
<text class="s" x="486" y="643.5" style="font-size:12px">hundreds of fpm</text>
<circle cx="477" cy="659.0" r="2.2" class="ah"/>
<text class="s" x="486" y="663.0" style="font-size:12px">Holds after the pitch is held</text>
<text class="s" x="486" y="678.5" style="font-size:12px">steady</text>
<rect x="466" y="708.0" width="244" height="24" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="476" y="725.0" style="font-size:13px">Lag</text>
<circle cx="477" cy="746.0" r="2.2" class="ah"/>
<text class="s" x="486" y="750.0" style="font-size:12px">Time from the change until the new</text>
<text class="s" x="486" y="765.5" style="font-size:12px">rate shows</text>
<circle cx="477" cy="781.0" r="2.2" class="ah"/>
<text class="s" x="486" y="785.0" style="font-size:12px">Rough technique and turbulence</text>
<text class="s" x="486" y="800.5" style="font-size:12px">stretch it</text>
<circle cx="477" cy="816.0" r="2.2" class="ah"/>
<text class="s" x="486" y="820.0" style="font-size:12px">An instantaneous VSI (IVSI) uses</text>
<text class="s" x="486" y="835.5" style="font-size:12px">accelerometers to offset it</text>
</svg>
