<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 602" role="img" aria-labelledby="ti de"><title id="ti">Pitot and static blockage effects</title><desc id="de">A table of how the airspeed indicator, altimeter and vertical speed indicator behave when the pitot tube is blocked with the drain clear, when the pitot tube and drain are both blocked, when the static port is blocked, and when the alternate static source is opened. Also what to check before flight and what to do with no alternate source.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style>
<text class="t" x="20" y="28" style="font-size:15px">Pitot and static blockage: what each instrument does</text>
<text class="s" x="20" y="50.0" style="font-size:13px">Moisture (including ice), dirt or insects can block the pitot tube, the static port, or both. Read</text>
<text class="s" x="20" y="66.5" style="font-size:13px">down a column to see how each instrument reacts.</text>
<rect x="132.0" y="91.0" width="138.5" height="95.5" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="201.25" y="110.0" style="font-size:12.5px">Pitot blocked,</text>
<text class="t m" x="201.25" y="125.0" style="font-size:12.5px">drain clear</text>
<text class="s m" x="201.25" y="142.0" style="font-size:11px">Ram air cannot enter;</text>
<text class="s m" x="201.25" y="156.5" style="font-size:11px">the system vents out</text>
<text class="s m" x="201.25" y="171.0" style="font-size:11px">the drain</text>
<rect x="278.5" y="91.0" width="138.5" height="95.5" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="347.75" y="110.0" style="font-size:12.5px">Pitot and drain</text>
<text class="t m" x="347.75" y="125.0" style="font-size:12.5px">blocked</text>
<text class="s m" x="347.75" y="142.0" style="font-size:11px">Pressure is trapped</text>
<text class="s m" x="347.75" y="156.5" style="font-size:11px">in the pitot line</text>
<rect x="425.0" y="91.0" width="138.5" height="95.5" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="494.25" y="110.0" style="font-size:12.5px">Static port</text>
<text class="t m" x="494.25" y="125.0" style="font-size:12.5px">blocked</text>
<text class="s m" x="494.25" y="142.0" style="font-size:11px">Static pressure is</text>
<text class="s m" x="494.25" y="156.5" style="font-size:11px">trapped; pitot tube</text>
<text class="s m" x="494.25" y="171.0" style="font-size:11px">clear</text>
<rect x="571.5" y="91.0" width="138.5" height="95.5" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="640.75" y="110.0" style="font-size:12.5px">Alternate static</text>
<text class="t m" x="640.75" y="125.0" style="font-size:12.5px">open</text>
<text class="s m" x="640.75" y="142.0" style="font-size:11px">Flight deck pressure,</text>
<text class="s m" x="640.75" y="156.5" style="font-size:11px">lower than outside</text>
<text class="s m" x="640.75" y="171.0" style="font-size:11px">(venturi effect)</text>
<rect x="20" y="194.5" width="104" height="88.5" rx="10" class="cl" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="72.0" y="213.5" style="font-size:12.5px">Airspeed</text>
<text class="t m" x="72.0" y="228.5" style="font-size:12.5px">indicator</text>
<text class="s m" x="72.0" y="245.5" style="font-size:11px">Uses pitot and</text>
<text class="s m" x="72.0" y="260.0" style="font-size:11px">static</text>
<rect x="132.0" y="194.5" width="138.5" height="88.5" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/>
<text class="s m" x="201.25" y="220.66666666666666" style="font-size:11px">Drops to zero: it</text>
<text class="s m" x="201.25" y="235.16666666666666" style="font-size:11px">senses no difference</text>
<text class="s m" x="201.25" y="249.66666666666666" style="font-size:11px">between ram and</text>
<text class="s m" x="201.25" y="264.16666666666663" style="font-size:11px">static pressure</text>
<rect x="278.5" y="194.5" width="138.5" height="88.5" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/>
<text class="s m" x="347.75" y="213.41666666666666" style="font-size:11px">Ignores speed</text>
<text class="s m" x="347.75" y="227.91666666666666" style="font-size:11px">changes; climb makes</text>
<text class="s m" x="347.75" y="242.41666666666666" style="font-size:11px">it read higher,</text>
<text class="s m" x="347.75" y="256.91666666666663" style="font-size:11px">descent makes it read</text>
<text class="s m" x="347.75" y="271.41666666666663" style="font-size:11px">lower</text>
<rect x="425.0" y="194.5" width="138.5" height="88.5" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/>
<text class="s m" x="494.25" y="227.91666666666666" style="font-size:11px">Reads low above the</text>
<text class="s m" x="494.25" y="242.41666666666666" style="font-size:11px">blockage altitude,</text>
<text class="s m" x="494.25" y="256.91666666666663" style="font-size:11px">high below it</text>
<rect x="571.5" y="194.5" width="138.5" height="88.5" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/>
<text class="s m" x="640.75" y="235.16666666666666" style="font-size:11px">Reads higher than the</text>
<text class="s m" x="640.75" y="249.66666666666666" style="font-size:11px">true airspeed</text>
<rect x="20" y="291.0" width="104" height="59.5" rx="10" class="cl" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="72.0" y="310.0" style="font-size:12.5px">Altimeter</text>
<text class="s m" x="72.0" y="327.0" style="font-size:11px">Static only</text>
<rect x="132.0" y="291.0" width="285.0" height="59.5" rx="10" class="cl" style="stroke:currentColor;stroke-width:1.5"/>
<text class="s m" x="274.5" y="317.1666666666667" style="font-size:11px">Not affected: it reads static pressure and no</text>
<text class="s m" x="274.5" y="331.6666666666667" style="font-size:11px">pitot pressure</text>
<rect x="425.0" y="291.0" width="138.5" height="59.5" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/>
<text class="s m" x="494.25" y="309.9166666666667" style="font-size:11px">Freezes at the</text>
<text class="s m" x="494.25" y="324.4166666666667" style="font-size:11px">altitude where the</text>
<text class="s m" x="494.25" y="338.9166666666667" style="font-size:11px">blockage occurred</text>
<rect x="571.5" y="291.0" width="138.5" height="59.5" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/>
<text class="s m" x="640.75" y="309.9166666666667" style="font-size:11px">Reads slightly higher</text>
<text class="s m" x="640.75" y="324.4166666666667" style="font-size:11px">than the true</text>
<text class="s m" x="640.75" y="338.9166666666667" style="font-size:11px">altitude</text>
<rect x="20" y="358.5" width="104" height="59.5" rx="10" class="cl" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="72.0" y="377.5" style="font-size:12.5px">VSI</text>
<text class="s m" x="72.0" y="394.5" style="font-size:11px">Static only</text>
<rect x="132.0" y="358.5" width="285.0" height="59.5" rx="10" class="cl" style="stroke:currentColor;stroke-width:1.5"/>
<text class="s m" x="274.5" y="384.6666666666667" style="font-size:11px">Not affected: static is its only source, and</text>
<text class="s m" x="274.5" y="399.1666666666667" style="font-size:11px">that line is open</text>
<rect x="425.0" y="358.5" width="138.5" height="59.5" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/>
<text class="s m" x="494.25" y="384.6666666666667" style="font-size:11px">Shows zero all the</text>
<text class="s m" x="494.25" y="399.1666666666667" style="font-size:11px">time</text>
<rect x="571.5" y="358.5" width="138.5" height="59.5" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/>
<text class="s m" x="640.75" y="377.4166666666667" style="font-size:11px">Shows a brief climb,</text>
<text class="s m" x="640.75" y="391.9166666666667" style="font-size:11px">then settles if</text>
<text class="s m" x="640.75" y="406.4166666666667" style="font-size:11px">altitude is held</text>
<rect x="20" y="430.0" width="222" height="24" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="30" y="447.0" style="font-size:13px">Before flight</text>
<circle cx="31" cy="468.0" r="2.2" class="ah"/>
<text class="s" x="40" y="472.0" style="font-size:12px">Remove the pitot cover</text>
<circle cx="31" cy="487.5" r="2.2" class="ah"/>
<text class="s" x="40" y="491.5" style="font-size:12px">Check the pitot and static</text>
<text class="s" x="40" y="507.0" style="font-size:12px">openings, and both pitot</text>
<text class="s" x="40" y="522.5" style="font-size:12px">openings (front and drain)</text>
<circle cx="31" cy="538.0" r="2.2" class="ah"/>
<text class="s" x="40" y="542.0" style="font-size:12px">Pitot heat, where fitted, is</text>
<text class="s" x="40" y="557.5" style="font-size:12px">for visible moisture: follow</text>
<text class="s" x="40" y="573.0" style="font-size:12px">the AFM/POH</text>
<rect x="254" y="430.0" width="222" height="24" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="264" y="447.0" style="font-size:13px">Alternate static source</text>
<circle cx="265" cy="468.0" r="2.2" class="ah"/>
<text class="s" x="274" y="472.0" style="font-size:12px">Normally inside the flight</text>
<text class="s" x="274" y="487.5" style="font-size:12px">deck, where pressure is lower</text>
<circle cx="265" cy="503.0" r="2.2" class="ah"/>
<text class="s" x="274" y="507.0" style="font-size:12px">Opening it lets cabin static</text>
<text class="s" x="274" y="522.5" style="font-size:12px">pressure into the system</text>
<circle cx="265" cy="538.0" r="2.2" class="ah"/>
<text class="s" x="274" y="542.0" style="font-size:12px">The AFM/POH gives the error and</text>
<text class="s" x="274" y="557.5" style="font-size:12px">any airspeed corrections</text>
<rect x="488" y="430.0" width="222" height="24" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="498" y="447.0" style="font-size:13px">No alternate source?</text>
<circle cx="499" cy="468.0" r="2.2" class="ah"/>
<text class="s" x="508" y="472.0" style="font-size:12px">Break the glass face of the VSI</text>
<text class="s" x="508" y="487.5" style="font-size:12px">to let static pressure in</text>
<circle cx="499" cy="503.0" r="2.2" class="ah"/>
<text class="s" x="508" y="507.0" style="font-size:12px">This most likely ruins the VSI</text>
<circle cx="499" cy="522.5" r="2.2" class="ah"/>
<text class="s" x="508" y="526.5" style="font-size:12px">Chosen because it is the least</text>
<text class="s" x="508" y="542.0" style="font-size:12px">important static-source</text>
<text class="s" x="508" y="557.5" style="font-size:12px">instrument</text>
</svg>
