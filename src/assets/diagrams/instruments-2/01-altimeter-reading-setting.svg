<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 597" role="img" aria-labelledby="ti de"><title id="ti">Reading the three-pointer altimeter and the Kollsman window</title><desc id="de">The altimeter dial has three hands: a thin hand with a triangle for tens of thousands of feet, a short wide hand for thousands, and a long hand for hundreds. The Kollsman window and a knob set the altimeter setting, which must be updated at each station. Example reading 2,600 feet; example settings 29.85, 29.94 and 29.69 inches of mercury from the PHAK flight.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style>
<text class="t" x="20" y="28" style="font-size:15px">Reading the three-pointer altimeter and setting the Kollsman window</text>
<text class="s" x="20" y="50.0" style="font-size:13px">Three hands share one dial, and the window sets the pressure the altimeter measures from. The reading,</text>
<text class="s" x="20" y="66.5" style="font-size:13px">the station names and the 29.85, 29.94 and 29.69 settings are PHAK examples.</text>
<rect class="cl" x="20" y="91.0" width="336" height="304" rx="8"/>
<rect class="cl" x="374" y="91.0" width="336" height="304" rx="8"/>
<text class="t" x="32" y="113.0" style="font-size:14px">The three hands</text>
<text class="t" x="386" y="113.0" style="font-size:14px">Setting the window</text>
<circle cx="124" cy="249.0" r="92" class="cl" style="stroke:currentColor;stroke-width:1.8"/>
<path d="M124.0 159.0L124.0 166.0" class="dk" style="stroke-width:1.5;opacity:0.8"/>
<text class="t m" x="124.0" y="185.5" style="font-size:13px">0</text>
<path d="M176.90067270632258 176.18847050625473L172.78617594027526 181.85158946687937" class="dk" style="stroke-width:1.5;opacity:0.8"/>
<text class="t m" x="163.96939715588817" y="198.4868443825036" style="font-size:13px">1</text>
<path d="M209.59508646656383 221.18847050625473L202.93769085249772 223.35158946687937" class="dk" style="stroke-width:1.5;opacity:0.8"/>
<text class="t m" x="188.67184310807045" y="232.4868443825036" style="font-size:13px">2</text>
<path d="M209.59508646656383 276.81152949374524L202.93769085249772 274.6484105331206" class="dk" style="stroke-width:1.5;opacity:0.8"/>
<text class="t m" x="188.67184310807045" y="274.5131556174964" style="font-size:13px">3</text>
<path d="M176.90067270632258 321.8115294937453L172.78617594027526 316.1484105331206" class="dk" style="stroke-width:1.5;opacity:0.8"/>
<text class="t m" x="163.96939715588817" y="308.5131556174964" style="font-size:13px">4</text>
<path d="M124.0 339.0L124.0 332.0" class="dk" style="stroke-width:1.5;opacity:0.8"/>
<text class="t m" x="124.0" y="321.5" style="font-size:13px">5</text>
<path d="M71.09932729367742 321.8115294937453L75.21382405972474 316.1484105331206" class="dk" style="stroke-width:1.5;opacity:0.8"/>
<text class="t m" x="84.03060284411183" y="308.5131556174964" style="font-size:13px">6</text>
<path d="M38.404913533436186 276.8115294937453L45.06230914750226 274.6484105331206" class="dk" style="stroke-width:1.5;opacity:0.8"/>
<text class="t m" x="59.32815689192957" y="274.5131556174964" style="font-size:13px">7</text>
<path d="M38.40491353343617 221.18847050625476L45.06230914750225 223.35158946687937" class="dk" style="stroke-width:1.5;opacity:0.8"/>
<text class="t m" x="59.32815689192955" y="232.4868443825036" style="font-size:13px">8</text>
<path d="M71.0993272936774 176.18847050625476L75.21382405972471 181.85158946687937" class="dk" style="stroke-width:1.5;opacity:0.8"/>
<text class="t m" x="84.03060284411183" y="198.4868443825036" style="font-size:13px">9</text>
<path d="M124 249.0L91.08402587162152 294.30495168499704" class="dk" style="stroke-width:2.2;opacity:1"/>
<path d="M124 249.0L165.91712259398741 251.63720182023116" class="dk" style="stroke-width:7;opacity:1"/>
<path d="M124 249.0L137.98679620676 164.14500879812334" class="dk" style="stroke-width:1.6;opacity:1"/>
<path d="M135.9 177.0L134.2 165.2L141.3 166.4Z" class="ah"/>
<circle cx="124" cy="249.0" r="4" class="dh"/>
<text class="t" x="236" y="173.0" style="font-size:11.5px">Thin hand, triangle tip</text>
<text class="s" x="236" y="187.0" style="font-size:11px">Tens of thousands of feet</text>
<path d="M233 179.0L140.98679620676 163.14500879812334" class="dk" style="stroke-width:1.2;opacity:0.75"/>
<text class="t" x="236" y="229.0" style="font-size:11.5px">Short, wide hand</text>
<text class="s" x="236" y="243.0" style="font-size:11px">Thousands of feet</text>
<path d="M233 234.0L168.91712259398741 251.63720182023116" class="dk" style="stroke-width:1.2;opacity:0.75"/>
<text class="t" x="236" y="313.0" style="font-size:11.5px">Long hand</text>
<text class="s" x="236" y="327.0" style="font-size:11px">Hundreds of feet</text>
<path d="M233 318.0L94.08402587162152 294.30495168499704" class="dk" style="stroke-width:1.2;opacity:0.75"/>
<text class="s" x="32" y="365.0" style="font-size:11px">Example reading: 2,600 ft.</text>
<rect x="400" y="131.0" width="118" height="46" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="459" y="162.0" style="font-size:22px">29.69</text>
<text class="s" x="530" y="149.0" style="font-size:11px">Window shows the</text>
<text class="s" x="530" y="163.0" style="font-size:11px">setting in "Hg and/or mb</text>
<circle cx="430" cy="219.0" r="17" class="cl" style="stroke:currentColor;stroke-width:1.6"/>
<path d="M408.3 206.5A25 25 0 0 1 451.7 206.5" class="acc" style="stroke-width:2"/><path d="M451.7 206.5L443.6 200.7L450.7 196.7Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/>
<text class="s" x="462" y="215.0" style="font-size:11px">Knob at the bottom of the</text>
<text class="s" x="462" y="229.0" style="font-size:11px">case turns the scale</text>
<rect x="386.0" y="261.0" width="94.66666666666667" height="46" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="433.3333333333333" y="280.5833333333333" style="font-size:11.5px">Love Field</text>
<text class="t m" x="433.3333333333333" y="295.0833333333333" style="font-size:11.5px">29.85 "Hg</text>
<path d="M481.6666666666667 284.0L487.7 284.0" class="dk" style="stroke-width:2"/><path d="M493.6666666666667 284.0L487.7 286.7L487.7 281.3Z" class="dh" style=""/>
<rect x="494.6666666666667" y="261.0" width="94.66666666666667" height="46" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="542.0" y="280.5833333333333" style="font-size:11.5px">Mineral Wells</text>
<text class="t m" x="542.0" y="295.0833333333333" style="font-size:11.5px">29.94 "Hg</text>
<path d="M590.3333333333334 284.0L596.3 284.0" class="dk" style="stroke-width:2"/><path d="M602.3333333333334 284.0L596.3 286.7L596.3 281.3Z" class="dh" style=""/>
<rect x="603.3333333333334" y="261.0" width="94.66666666666667" height="46" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="650.6666666666667" y="280.5833333333333" style="font-size:11.5px">Abilene</text>
<text class="t m" x="650.6666666666667" y="295.0833333333333" style="font-size:11.5px">29.69 "Hg</text>
<text class="s" x="386" y="331.0" style="font-size:11px">Reset the setting at each station: it is accurate only</text>
<text class="s" x="386" y="345.5" style="font-size:11px">near the one reporting it.</text>
<text class="s" x="386" y="361.0" style="font-size:11px">Left at 29.94 in the Abilene pattern, a 2,600 ft</text>
<text class="s" x="386" y="375.5" style="font-size:11px">reading puts you about 250 ft low.</text>
<rect x="20" y="409.0" width="222" height="24" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="30" y="426.0" style="font-size:13px">How pressure moves the hands</text>
<circle cx="31" cy="447.0" r="2.2" class="ah"/>
<text class="s" x="40" y="451.0" style="font-size:12px">Falling pressure reads as a</text>
<text class="s" x="40" y="466.5" style="font-size:12px">climb; rising pressure reads as</text>
<text class="s" x="40" y="482.0" style="font-size:12px">a descent</text>
<circle cx="31" cy="497.5" r="2.2" class="ah"/>
<text class="s" x="40" y="501.5" style="font-size:12px">Parked overnight, 29.98 to</text>
<text class="s" x="40" y="517.0" style="font-size:12px">29.68 "Hg shows about 300 ft</text>
<text class="s" x="40" y="532.5" style="font-size:12px">more than field elevation</text>
<circle cx="31" cy="548.0" r="2.2" class="ah"/>
<text class="s" x="40" y="552.0" style="font-size:12px">Set 29.68 again and field</text>
<text class="s" x="40" y="567.5" style="font-size:12px">elevation returns</text>
<rect x="254" y="409.0" width="222" height="24" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="264" y="426.0" style="font-size:13px">Why it shows altitude</text>
<circle cx="265" cy="447.0" r="2.2" class="ah"/>
<text class="s" x="274" y="451.0" style="font-size:12px">Sealed wafers hold 29.92 "Hg</text>
<text class="s" x="274" y="466.5" style="font-size:12px">inside and sit in static</text>
<text class="s" x="274" y="482.0" style="font-size:12px">pressure</text>
<circle cx="265" cy="497.5" r="2.2" class="ah"/>
<text class="s" x="274" y="501.5" style="font-size:12px">Higher static pressure squeezes</text>
<text class="s" x="274" y="517.0" style="font-size:12px">them: lower altitude</text>
<circle cx="265" cy="532.5" r="2.2" class="ah"/>
<text class="s" x="274" y="536.5" style="font-size:12px">Lower static pressure lets them</text>
<text class="s" x="274" y="552.0" style="font-size:12px">expand: higher altitude</text>
<rect x="488" y="409.0" width="222" height="24" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="498" y="426.0" style="font-size:13px">Preflight check</text>
<circle cx="499" cy="447.0" r="2.2" class="ah"/>
<text class="s" x="508" y="451.0" style="font-size:12px">Set the current setting from</text>
<text class="s" x="508" y="466.5" style="font-size:12px">ATC, ATIS, AWOS or ASOS</text>
<circle cx="499" cy="482.0" r="2.2" class="ah"/>
<text class="s" x="508" y="486.0" style="font-size:12px">Pointers should show the</text>
<text class="s" x="508" y="501.5" style="font-size:12px">surveyed field elevation</text>
<circle cx="499" cy="517.0" r="2.2" class="ah"/>
<text class="s" x="508" y="521.0" style="font-size:12px">More than 75 ft off: send it to</text>
<text class="s" x="508" y="536.5" style="font-size:12px">a repair station</text>
</svg>
