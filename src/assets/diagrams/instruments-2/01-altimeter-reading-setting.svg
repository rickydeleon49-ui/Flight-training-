<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 597" role="img" aria-labelledby="ti de"><title id="ti">Reading the three-pointer altimeter and the Kollsman window</title><desc id="de">The altimeter dial has three hands: a thin hand with a triangle for tens of thousands of feet, a short wide hand for thousands, and a long hand for hundreds. The Kollsman window and a knob set the altimeter setting, which must be updated at each station. Example reading 2,600 feet; example settings 29.85, 29.94 and 29.69 inches of mercury from the PHAK flight.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:12px}.q1{font-size:13px}.q2{font-size:11px}.q3{stroke-width:1.5;opacity:0.8}.q4{font-size:11.5px}.q5{stroke:currentColor;stroke-width:1.5}.q6{stroke-width:1.2;opacity:0.75}.q7{stroke-width:2}</style><text class="t" x="20" y="28" style="font-size:15px">Reading the three-pointer altimeter and setting the Kollsman window</text><text class="s q1" x="20" y="50">Three hands share one dial, and the window sets the pressure the altimeter measures from. The reading,</text><text class="s q1" x="20" y="66.5">the station names and the 29.85, 29.94 and 29.69 settings are PHAK examples.</text><rect class="cl" x="20" y="91" width="336" height="304" rx="8"/><rect class="cl" x="374" y="91" width="336" height="304" rx="8"/><text class="t" x="32" y="113" style="font-size:14px">The three hands</text><text class="t" x="386" y="113" style="font-size:14px">Setting the window</text><circle cx="124" cy="249" r="92" class="cl" style="stroke:currentColor;stroke-width:1.8"/><path d="M124 159L124 166" class="dk q3"/><text class="t m q1" x="124" y="185.5">0</text><path d="M176.9 176.19L172.79 181.85" class="dk q3"/><text class="t m q1" x="163.97" y="198.49">1</text><path d="M209.6 221.19L202.94 223.35" class="dk q3"/><text class="t m q1" x="188.67" y="232.49">2</text><path d="M209.6 276.81L202.94 274.65" class="dk q3"/><text class="t m q1" x="188.67" y="274.51">3</text><path d="M176.9 321.81L172.79 316.15" class="dk q3"/><text class="t m q1" x="163.97" y="308.51">4</text><path d="M124 339L124 332" class="dk q3"/><text class="t m q1" x="124" y="321.5">5</text><path d="M71.1 321.81L75.21 316.15" class="dk q3"/><text class="t m q1" x="84.03" y="308.51">6</text><path d="M38.4 276.81L45.06 274.65" class="dk q3"/><text class="t m q1" x="59.33" y="274.51">7</text><path d="M38.4 221.19L45.06 223.35" class="dk q3"/><text class="t m q1" x="59.33" y="232.49">8</text><path d="M71.1 176.19L75.21 181.85" class="dk q3"/><text class="t m q1" x="84.03" y="198.49">9</text><path d="M124 249L91.08 294.3" class="dk" style="stroke-width:2.2;opacity:1"/><path d="M124 249L165.92 251.64" class="dk" style="stroke-width:7;opacity:1"/><path d="M124 249L137.99 164.15" class="dk" style="stroke-width:1.6;opacity:1"/><path d="M135.9 177L134.2 165.2L141.3 166.4Z" class="ah"/><circle cx="124" cy="249" r="4" class="dh"/><text class="t q4" x="236" y="173">Thin hand, triangle tip</text><text class="s q2" x="236" y="187">Tens of thousands of feet</text><path d="M233 179L140.99 163.15" class="dk q6"/><text class="t q4" x="236" y="229">Short, wide hand</text><text class="s q2" x="236" y="243">Thousands of feet</text><path d="M233 234L168.92 251.64" class="dk q6"/><text class="t q4" x="236" y="313">Long hand</text><text class="s q2" x="236" y="327">Hundreds of feet</text><path d="M233 318L94.08 294.3" class="dk q6"/><text class="s q2" x="32" y="365">Example reading: 2,600 ft.</text><rect x="400" y="131" width="118" height="46" rx="10" class="rose q5"/><text class="t m" x="459" y="162" style="font-size:22px">29.69</text><text class="s q2" x="530" y="149">Window shows the</text><text class="s q2" x="530" y="163">setting in "Hg and/or mb</text><circle cx="430" cy="219" r="17" class="cl" style="stroke:currentColor;stroke-width:1.6"/><path d="M408.3 206.5A25 25 0 0 1 451.7 206.5" class="acc q7"/><path d="M451.7 206.5L443.6 200.7L450.7 196.7Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><text class="s q2" x="462" y="215">Knob at the bottom of the</text><text class="s q2" x="462" y="229">case turns the scale</text><rect x="386" y="261" width="94.67" height="46" rx="10" class="sky q5"/><text class="t m q4" x="433.33" y="280.58">Love Field</text><text class="t m q4" x="433.33" y="295.08">29.85 "Hg</text><path d="M481.67 284L487.7 284" class="dk q7"/><path d="M493.67 284L487.7 286.7L487.7 281.3Z" class="dh" style=""/><rect x="494.67" y="261" width="94.67" height="46" rx="10" class="mint q5"/><text class="t m q4" x="542" y="280.58">Mineral Wells</text><text class="t m q4" x="542" y="295.08">29.94 "Hg</text><path d="M590.33 284L596.3 284" class="dk q7"/><path d="M602.33 284L596.3 286.7L596.3 281.3Z" class="dh" style=""/><rect x="603.33" y="261" width="94.67" height="46" rx="10" class="lav q5"/><text class="t m q4" x="650.67" y="280.58">Abilene</text><text class="t m q4" x="650.67" y="295.08">29.69 "Hg</text><text class="s q2" x="386" y="331">Reset the setting at each station: it is accurate only</text><text class="s q2" x="386" y="345.5">near the one reporting it.</text><text class="s q2" x="386" y="361">Left at 29.94 in the Abilene pattern, a 2,600 ft</text><text class="s q2" x="386" y="375.5">reading puts you about 250 ft low.</text><rect x="20" y="409" width="222" height="24" rx="10" class="sky q5"/><text class="t q1" x="30" y="426">How pressure moves the hands</text><circle cx="31" cy="447" r="2.2" class="ah"/><text class="s q0" x="40" y="451">Falling pressure reads as a</text><text class="s q0" x="40" y="466.5">climb; rising pressure reads as</text><text class="s q0" x="40" y="482">a descent</text><circle cx="31" cy="497.5" r="2.2" class="ah"/><text class="s q0" x="40" y="501.5">Parked overnight, 29.98 to</text><text class="s q0" x="40" y="517">29.68 "Hg shows about 300 ft</text><text class="s q0" x="40" y="532.5">more than field elevation</text><circle cx="31" cy="548" r="2.2" class="ah"/><text class="s q0" x="40" y="552">Set 29.68 again and field</text><text class="s q0" x="40" y="567.5">elevation returns</text><rect x="254" y="409" width="222" height="24" rx="10" class="mint q5"/><text class="t q1" x="264" y="426">Why it shows altitude</text><circle cx="265" cy="447" r="2.2" class="ah"/><text class="s q0" x="274" y="451">Sealed wafers hold 29.92 "Hg</text><text class="s q0" x="274" y="466.5">inside and sit in static</text><text class="s q0" x="274" y="482">pressure</text><circle cx="265" cy="497.5" r="2.2" class="ah"/><text class="s q0" x="274" y="501.5">Higher static pressure squeezes</text><text class="s q0" x="274" y="517">them: lower altitude</text><circle cx="265" cy="532.5" r="2.2" class="ah"/><text class="s q0" x="274" y="536.5">Lower static pressure lets them</text><text class="s q0" x="274" y="552">expand: higher altitude</text><rect x="488" y="409" width="222" height="24" rx="10" class="lav q5"/><text class="t q1" x="498" y="426">Preflight check</text><circle cx="499" cy="447" r="2.2" class="ah"/><text class="s q0" x="508" y="451">Set the current setting from</text><text class="s q0" x="508" y="466.5">ATC, ATIS, AWOS or ASOS</text><circle cx="499" cy="482" r="2.2" class="ah"/><text class="s q0" x="508" y="486">Pointers should show the</text><text class="s q0" x="508" y="501.5">surveyed field elevation</text><circle cx="499" cy="517" r="2.2" class="ah"/><text class="s q0" x="508" y="521">More than 75 ft off: send it to</text><text class="s q0" x="508" y="536.5">a repair station</text></svg>
