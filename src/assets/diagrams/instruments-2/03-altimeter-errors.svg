<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 784" role="img" aria-labelledby="ti de"><title id="ti">Altimeter errors from pressure and temperature</title><desc id="de">Flying from a high to a low pressure area without resetting the altimeter, the indication stays constant but the aircraft is lower than indicated: going from a high to a low, look out below. Flying into colder air also puts the aircraft lower than indicated: from hot to cold, look out below. A worked example uses one inch of pressure as about 1,000 feet.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><text class="t" x="20" y="28" style="font-size:15px">Altimeter errors: pressure and temperature</text><text class="s" x="20" y="50.0" style="font-size:13px">If the pressure setting or the air temperature changes and the altimeter is not corrected, a constant</text><text class="s" x="20" y="66.5" style="font-size:13px">indication hides a falling true height. The drawings are schematic.</text><rect class="cl" x="20" y="91.0" width="336" height="300" rx="8"/><text class="t" x="32" y="113.0" style="font-size:14px">Flying from high to low pressure</text><rect x="32" y="129.0" width="56" height="26" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="60.0" y="146.0" style="font-size:12px">High</text><rect x="288" y="129.0" width="56" height="26" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="316.0" y="146.0" style="font-size:12px">Low</text><path d="M50 187.0L296 187.0" class="dk" style="stroke-width:2.5;opacity:1"/><path d="M50.0 187.0L296.0 249.0" class="acc" style="stroke-width:2.5;opacity:1;stroke-dasharray:6 5"/><path d="M308.0 187.0L295.1 191.1L295.1 182.9Z" class="dh"/><text class="s" x="50" y="179.0" style="font-size:11px">Indicated altitude: unchanged</text><path d="M318 191.0L318.0 239.0" class="dk" style="stroke-width:1.8"/><path d="M318 246.0L314.9 239.0L321.1 239.0Z" class="dh" style=""/><path d="M318 246.0L318.0 198.0" class="dk" style="stroke-width:1.8"/><path d="M318 191.0L321.1 198.0L314.9 198.0Z" class="dh" style=""/><text class="s" x="326" y="222.0" style="font-size:11px">Gap</text><text class="t" x="130" y="251.0" style="font-size:11.5px">Actual height</text><path d="M32 305.0L344 305.0" class="dk" style="stroke-width:1.6;opacity:0.9"/><text class="s" x="34" y="318.0" style="font-size:11px">Terrain</text><path d="M236 305.0L270 263.0L304 305.0Z" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="s" x="32" y="343.0" style="font-size:11.5px">"Going from a high to a low, look out below." Same</text><text class="s" x="32" y="358.0" style="font-size:11.5px">indication, but the actual height above the ground</text><text class="s" x="32" y="373.0" style="font-size:11.5px">is lower.</text><rect class="cl" x="374" y="91.0" width="336" height="300" rx="8"/><text class="t" x="386" y="113.0" style="font-size:14px">Flying into colder air</text><rect x="386" y="129.0" width="56" height="26" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="414.0" y="146.0" style="font-size:12px">Warm</text><rect x="642" y="129.0" width="56" height="26" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="670.0" y="146.0" style="font-size:12px">Cold</text><path d="M404 187.0L650 187.0" class="dk" style="stroke-width:2.5;opacity:1"/><path d="M404.0 187.0L650.0 249.0" class="acc" style="stroke-width:2.5;opacity:1;stroke-dasharray:6 5"/><path d="M662.0 187.0L649.1 191.1L649.1 182.9Z" class="dh"/><text class="s" x="404" y="179.0" style="font-size:11px">Indicated altitude: unchanged</text><path d="M672 191.0L672.0 239.0" class="dk" style="stroke-width:1.8"/><path d="M672 246.0L668.9 239.0L675.1 239.0Z" class="dh" style=""/><path d="M672 246.0L672.0 198.0" class="dk" style="stroke-width:1.8"/><path d="M672 191.0L675.1 198.0L668.9 198.0Z" class="dh" style=""/><text class="s" x="680" y="222.0" style="font-size:11px">Gap</text><text class="t" x="484" y="251.0" style="font-size:11.5px">Actual height</text><path d="M386 305.0L698 305.0" class="dk" style="stroke-width:1.6;opacity:0.9"/><text class="s" x="388" y="318.0" style="font-size:11px">Terrain</text><path d="M590 305.0L624 263.0L658 305.0Z" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="s" x="386" y="343.0" style="font-size:11.5px">"From hot to cold, look out below." At a constant</text><text class="s" x="386" y="358.0" style="font-size:11.5px">indicated altitude the true altitude is lower in the</text><text class="s" x="386" y="373.0" style="font-size:11.5px">cooler air.</text><rect x="20" y="405.0" width="222" height="24" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30" y="422.0" style="font-size:13px">The reverse cases</text><circle cx="31" cy="443.0" r="2.2" class="ah"/><text class="s" x="40" y="447.0" style="font-size:12px">Low to high pressure, no reset:</text><text class="s" x="40" y="462.5" style="font-size:12px">actual altitude is higher than</text><text class="s" x="40" y="478.0" style="font-size:12px">indicated</text><circle cx="31" cy="493.5" r="2.2" class="ah"/><text class="s" x="40" y="497.5" style="font-size:12px">Warmer than standard: the</text><text class="s" x="40" y="513.0" style="font-size:12px">aircraft is higher than</text><text class="s" x="40" y="528.5" style="font-size:12px">indicated</text><circle cx="31" cy="544.0" r="2.2" class="ah"/><text class="s" x="40" y="548.0" style="font-size:12px">Cannot set above 31.00 "Hg:</text><text class="s" x="40" y="563.5" style="font-size:12px">actual altitude is higher than</text><text class="s" x="40" y="579.0" style="font-size:12px">indicated</text><rect x="254" y="405.0" width="222" height="24" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="264" y="422.0" style="font-size:13px">Pressure setting is not enough</text><circle cx="265" cy="443.0" r="2.2" class="ah"/><text class="s" x="274" y="447.0" style="font-size:12px">Setting the window for pressure</text><text class="s" x="274" y="462.5" style="font-size:12px">does not fix nonstandard</text><text class="s" x="274" y="478.0" style="font-size:12px">temperature</text><circle cx="265" cy="493.5" r="2.2" class="ah"/><text class="s" x="274" y="497.5" style="font-size:12px">Colder than standard: a higher</text><text class="s" x="274" y="513.0" style="font-size:12px">indicated altitude may be</text><text class="s" x="274" y="528.5" style="font-size:12px">needed over mountains</text><circle cx="265" cy="544.0" r="2.2" class="ah"/><text class="s" x="274" y="548.0" style="font-size:12px">Figure 8-4: at -10 C, 1,000 ft</text><text class="s" x="274" y="563.5" style="font-size:12px">above the airport, up to 100 ft</text><text class="s" x="274" y="579.0" style="font-size:12px">lower than indicated</text><rect x="488" y="405.0" width="222" height="24" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="498" y="422.0" style="font-size:13px">Margins</text><circle cx="499" cy="443.0" r="2.2" class="ah"/><text class="s" x="508" y="447.0" style="font-size:12px">Some conditions make it read</text><text class="s" x="508" y="462.5" style="font-size:12px">1,000 ft or more high over</text><text class="s" x="508" y="478.0" style="font-size:12px">mountains</text><circle cx="499" cy="493.5" r="2.2" class="ah"/><text class="s" x="508" y="497.5" style="font-size:12px">Allow a generous margin, plus</text><text class="s" x="508" y="513.0" style="font-size:12px">downdrafts in high wind</text><circle cx="499" cy="528.5" r="2.2" class="ah"/><text class="s" x="508" y="532.5" style="font-size:12px">Below 28.00 "Hg, aircraft</text><text class="s" x="508" y="548.0" style="font-size:12px">unable to set the setting</text><text class="s" x="508" y="563.5" style="font-size:12px">should not fly</text><text class="t" x="20" y="624.5" style="font-size:13px">Worked pressure error: about 1,000 ft for every 1 "Hg (PHAK Abilene flight)</text><rect x="20.0" y="632.5" width="216.66666666666666" height="66.0" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="128.33333333333331" y="651.5" style="font-size:12.5px">29.94 minus 29.69</text><text class="s m" x="128.33333333333331" y="668.5" style="font-size:11px">Difference 0.25 "Hg, kept the old</text><text class="s m" x="128.33333333333331" y="683.0" style="font-size:11px">setting</text><path d="M238.67 665.5L247.7 665.5" class="dk" style="stroke-width:2"/><path d="M254.67 665.5L247.7 668.6L247.7 662.4Z" class="dh" style=""/><rect x="256.66666666666663" y="632.5" width="216.66666666666666" height="66.0" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="364.99999999999994" y="651.5" style="font-size:12.5px">0.25 x 1,000 ft</text><text class="s m" x="364.99999999999994" y="668.5" style="font-size:11px">About 250 ft</text><path d="M475.33 665.5L484.3 665.5" class="dk" style="stroke-width:2"/><path d="M491.33 665.5L484.3 668.6L484.3 662.4Z" class="dh" style=""/><rect x="493.3333333333333" y="632.5" width="216.66666666666666" height="66.0" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="601.6666666666666" y="651.5" style="font-size:12.5px">2,600 - 250 = 2,350</text><text class="s m" x="601.6666666666666" y="668.5" style="font-size:11px">Aircraft lower than the 2,600 ft</text><text class="s m" x="601.6666666666666" y="683.0" style="font-size:11px">indicated</text><rect x="20.0" y="710.5" width="216.66666666666666" height="66.0" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="128.33333333333331" y="729.5" style="font-size:12.5px">29.94 minus 30.56</text><text class="s m" x="128.33333333333331" y="746.5" style="font-size:11px">Difference -0.62 "Hg, kept the old</text><text class="s m" x="128.33333333333331" y="761.0" style="font-size:11px">setting</text><path d="M238.67 743.5L247.7 743.5" class="dk" style="stroke-width:2"/><path d="M254.67 743.5L247.7 746.6L247.7 740.4Z" class="dh" style=""/><rect x="256.66666666666663" y="710.5" width="216.66666666666666" height="66.0" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="364.99999999999994" y="729.5" style="font-size:12.5px">0.62 x 1,000 ft</text><text class="s m" x="364.99999999999994" y="746.5" style="font-size:11px">About 620 ft</text><path d="M475.33 743.5L484.3 743.5" class="dk" style="stroke-width:2"/><path d="M491.33 743.5L484.3 746.6L484.3 740.4Z" class="dh" style=""/><rect x="493.3333333333333" y="710.5" width="216.66666666666666" height="66.0" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="601.6666666666666" y="729.5" style="font-size:12.5px">2,600 - (-620) = 3,220</text><text class="s m" x="601.6666666666666" y="746.5" style="font-size:11px">Aircraft 620 ft higher than</text><text class="s m" x="601.6666666666666" y="761.0" style="font-size:11px">indicated</text></svg>
