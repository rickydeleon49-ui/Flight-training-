<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 784" role="img" aria-labelledby="ti de"><title id="ti">Altimeter errors from pressure and temperature</title><desc id="de">Flying from a high to a low pressure area without resetting the altimeter, the indication stays constant but the aircraft is lower than indicated: going from a high to a low, look out below. Flying into colder air also puts the aircraft lower than indicated: from hot to cold, look out below. A worked example uses one inch of pressure as about 1,000 feet.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:12px}.q1{font-size:11px}.q2{stroke:currentColor;stroke-width:1.5}.q3{font-size:11.5px}.q4{font-size:13px}.q5{font-size:12.5px}.q6{stroke-width:1.8}.q7{stroke-width:2}.q8{stroke-width:2.5;opacity:1}.q9{stroke-width:2.5;opacity:1;stroke-dasharray:6 5}.q10{stroke-width:1.6;opacity:0.9}</style><text class="t" x="20" y="28" style="font-size:15px">Altimeter errors: pressure and temperature</text><text class="s q4" x="20" y="50">If the pressure setting or the air temperature changes and the altimeter is not corrected, a constant</text><text class="s q4" x="20" y="66.5">indication hides a falling true height. The drawings are schematic.</text><rect class="cl" x="20" y="91" width="336" height="300" rx="8"/><text class="t" x="32" y="113" style="font-size:14px">Flying from high to low pressure</text><rect x="32" y="129" width="56" height="26" rx="10" class="sky q2"/><text class="t m q0" x="60" y="146">High</text><rect x="288" y="129" width="56" height="26" rx="10" class="rose q2"/><text class="t m q0" x="316" y="146">Low</text><path d="M50 187L296 187" class="dk q8"/><path d="M50 187L296 249" class="acc q9"/><path d="M308 187L295.1 191.1L295.1 182.9Z" class="dh"/><text class="s q1" x="50" y="179">Indicated altitude: unchanged</text><path d="M318 191L318 239" class="dk q6"/><path d="M318 246L314.9 239L321.1 239Z" class="dh" style=""/><path d="M318 246L318 198" class="dk q6"/><path d="M318 191L321.1 198L314.9 198Z" class="dh" style=""/><text class="s q1" x="326" y="222">Gap</text><text class="t q3" x="130" y="251">Actual height</text><path d="M32 305L344 305" class="dk q10"/><text class="s q1" x="34" y="318">Terrain</text><path d="M236 305L270 263L304 305Z" class="mint q2"/><text class="s q3" x="32" y="343">"Going from a high to a low, look out below." Same</text><text class="s q3" x="32" y="358">indication, but the actual height above the ground</text><text class="s q3" x="32" y="373">is lower.</text><rect class="cl" x="374" y="91" width="336" height="300" rx="8"/><text class="t" x="386" y="113" style="font-size:14px">Flying into colder air</text><rect x="386" y="129" width="56" height="26" rx="10" class="sky q2"/><text class="t m q0" x="414" y="146">Warm</text><rect x="642" y="129" width="56" height="26" rx="10" class="rose q2"/><text class="t m q0" x="670" y="146">Cold</text><path d="M404 187L650 187" class="dk q8"/><path d="M404 187L650 249" class="acc q9"/><path d="M662 187L649.1 191.1L649.1 182.9Z" class="dh"/><text class="s q1" x="404" y="179">Indicated altitude: unchanged</text><path d="M672 191L672 239" class="dk q6"/><path d="M672 246L668.9 239L675.1 239Z" class="dh" style=""/><path d="M672 246L672 198" class="dk q6"/><path d="M672 191L675.1 198L668.9 198Z" class="dh" style=""/><text class="s q1" x="680" y="222">Gap</text><text class="t q3" x="484" y="251">Actual height</text><path d="M386 305L698 305" class="dk q10"/><text class="s q1" x="388" y="318">Terrain</text><path d="M590 305L624 263L658 305Z" class="mint q2"/><text class="s q3" x="386" y="343">"From hot to cold, look out below." At a constant</text><text class="s q3" x="386" y="358">indicated altitude the true altitude is lower in the</text><text class="s q3" x="386" y="373">cooler air.</text><rect x="20" y="405" width="222" height="24" rx="10" class="sky q2"/><text class="t q4" x="30" y="422">The reverse cases</text><circle cx="31" cy="443" r="2.2" class="ah"/><text class="s q0" x="40" y="447">Low to high pressure, no reset:</text><text class="s q0" x="40" y="462.5">actual altitude is higher than</text><text class="s q0" x="40" y="478">indicated</text><circle cx="31" cy="493.5" r="2.2" class="ah"/><text class="s q0" x="40" y="497.5">Warmer than standard: the</text><text class="s q0" x="40" y="513">aircraft is higher than</text><text class="s q0" x="40" y="528.5">indicated</text><circle cx="31" cy="544" r="2.2" class="ah"/><text class="s q0" x="40" y="548">Cannot set above 31.00 "Hg:</text><text class="s q0" x="40" y="563.5">actual altitude is higher than</text><text class="s q0" x="40" y="579">indicated</text><rect x="254" y="405" width="222" height="24" rx="10" class="lav q2"/><text class="t q4" x="264" y="422">Pressure setting is not enough</text><circle cx="265" cy="443" r="2.2" class="ah"/><text class="s q0" x="274" y="447">Setting the window for pressure</text><text class="s q0" x="274" y="462.5">does not fix nonstandard</text><text class="s q0" x="274" y="478">temperature</text><circle cx="265" cy="493.5" r="2.2" class="ah"/><text class="s q0" x="274" y="497.5">Colder than standard: a higher</text><text class="s q0" x="274" y="513">indicated altitude may be</text><text class="s q0" x="274" y="528.5">needed over mountains</text><circle cx="265" cy="544" r="2.2" class="ah"/><text class="s q0" x="274" y="548">Figure 8-4: at -10 C, 1,000 ft</text><text class="s q0" x="274" y="563.5">above the airport, up to 100 ft</text><text class="s q0" x="274" y="579">lower than indicated</text><rect x="488" y="405" width="222" height="24" rx="10" class="rose q2"/><text class="t q4" x="498" y="422">Margins</text><circle cx="499" cy="443" r="2.2" class="ah"/><text class="s q0" x="508" y="447">Some conditions make it read</text><text class="s q0" x="508" y="462.5">1,000 ft or more high over</text><text class="s q0" x="508" y="478">mountains</text><circle cx="499" cy="493.5" r="2.2" class="ah"/><text class="s q0" x="508" y="497.5">Allow a generous margin, plus</text><text class="s q0" x="508" y="513">downdrafts in high wind</text><circle cx="499" cy="528.5" r="2.2" class="ah"/><text class="s q0" x="508" y="532.5">Below 28.00 "Hg, aircraft</text><text class="s q0" x="508" y="548">unable to set the setting</text><text class="s q0" x="508" y="563.5">should not fly</text><text class="t q4" x="20" y="624.5">Worked pressure error: about 1,000 ft for every 1 "Hg (PHAK Abilene flight)</text><rect x="20" y="632.5" width="216.67" height="66" rx="10" class="sky q2"/><text class="t m q5" x="128.33" y="651.5">29.94 minus 29.69</text><text class="s m q1" x="128.33" y="668.5">Difference 0.25 "Hg, kept the old</text><text class="s m q1" x="128.33" y="683">setting</text><path d="M238.67 665.5L247.7 665.5" class="dk q7"/><path d="M254.67 665.5L247.7 668.6L247.7 662.4Z" class="dh" style=""/><rect x="256.67" y="632.5" width="216.67" height="66" rx="10" class="mint q2"/><text class="t m q5" x="365" y="651.5">0.25 x 1,000 ft</text><text class="s m q1" x="365" y="668.5">About 250 ft</text><path d="M475.33 665.5L484.3 665.5" class="dk q7"/><path d="M491.33 665.5L484.3 668.6L484.3 662.4Z" class="dh" style=""/><rect x="493.33" y="632.5" width="216.67" height="66" rx="10" class="rose q2"/><text class="t m q5" x="601.67" y="651.5">2,600 - 250 = 2,350</text><text class="s m q1" x="601.67" y="668.5">Aircraft lower than the 2,600 ft</text><text class="s m q1" x="601.67" y="683">indicated</text><rect x="20" y="710.5" width="216.67" height="66" rx="10" class="sky q2"/><text class="t m q5" x="128.33" y="729.5">29.94 minus 30.56</text><text class="s m q1" x="128.33" y="746.5">Difference -0.62 "Hg, kept the old</text><text class="s m q1" x="128.33" y="761">setting</text><path d="M238.67 743.5L247.7 743.5" class="dk q7"/><path d="M254.67 743.5L247.7 746.6L247.7 740.4Z" class="dh" style=""/><rect x="256.67" y="710.5" width="216.67" height="66" rx="10" class="mint q2"/><text class="t m q5" x="365" y="729.5">0.62 x 1,000 ft</text><text class="s m q1" x="365" y="746.5">About 620 ft</text><path d="M475.33 743.5L484.3 743.5" class="dk q7"/><path d="M491.33 743.5L484.3 746.6L484.3 740.4Z" class="dh" style=""/><rect x="493.33" y="710.5" width="216.67" height="66" rx="10" class="lav q2"/><text class="t m q5" x="601.67" y="729.5">2,600 - (-620) = 3,220</text><text class="s m q1" x="601.67" y="746.5">Aircraft 620 ft higher than</text><text class="s m q1" x="601.67" y="761">indicated</text></svg>
