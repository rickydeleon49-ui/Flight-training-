<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 430" role="img" aria-labelledby="ti de"><title id="ti">Four kinds of wing flaps</title><desc id="de">Plain flaps hinge down from the trailing edge. Split flaps drop only the lower surface. Slotted flaps hinge down and leave a slot that lets air flow from beneath the wing across the flap. Fowler flaps slide back and down on tracks, adding wing area and camber. All raise lift and drag, so the airplane can fly slower and descend steeply.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:12px}.q1{font-size:11px}.q2{stroke:currentColor;stroke-width:1.5}.q3{font-size:12.5px}.q4{font-size:13px}.q5{stroke-width:2}</style><text class="t" x="20" y="28" style="font-size:15px">Flap types: plain, split, slotted, Fowler</text><text class="s q4" x="20" y="50">Flaps change the wing's camber (and sometimes its area) to give more lift at lower speed. Most trainers</text><text class="s q4" x="20" y="66.5">use plain or slotted flaps; check your airplane.</text><rect class="cl" x="20" y="90" width="690" height="160" rx="8"/><path d="M38 150C48 124 108 122 143 144L143 153L38 154Z" class="lav q2"/><path d="M143 144L176 168L173 173L143 153Z" class="rose q2"/><text class="t q3" x="34" y="112">Plain</text><text class="s q1" x="34" y="205">Rear edge hinges down.</text><text class="s q1" x="34" y="219.5">Simplest.</text><path d="M209 150C219 124 279 122 314 144L314 153L209 154Z" class="lav q2"/><path d="M314 153L339 180L336 184L309 154Z" class="rose q2"/><path d="M314 144L347 149L341 152L314 153Z" class="lav q2"/><text class="t q3" x="205" y="112">Split</text><text class="s q1" x="205" y="205">Only the lower surface</text><text class="s q1" x="205" y="219.5">drops. Adds a lot of drag.</text><path d="M380 150C390 124 450 122 485 144L485 153L380 154Z" class="lav q2"/><path d="M492 146L522 170L518 175L490 156Z" class="rose q2"/><path d="M484 154L492 144" class="acc"/><text class="t q3" x="376" y="112">Slotted</text><text class="s q1" x="376" y="205">A slot passes air over the</text><text class="s q1" x="376" y="219.5">flap and keeps flow</text><text class="s q1" x="376" y="234.0">attached.</text><path d="M551 150C561 124 621 122 656 144L656 153L551 154Z" class="lav q2"/><path d="M669 148L707 172L703 177L665 158Z" class="rose q2"/><path d="M655 156L667 153" class="acc"/><text class="t q3" x="547" y="112">Fowler</text><text class="s q1" x="547" y="205">Slides back and down,</text><text class="s q1" x="547" y="219.5">adding area and camber.</text><rect x="20" y="282" width="222" height="24" rx="10" class="mint q2"/><text class="t q4" x="30" y="299">What flaps do</text><circle cx="31" cy="319" r="2.2" class="ah"/><text class="s q0" x="40" y="323">Raise lift at a given speed so you</text><text class="s q0" x="40" y="338.5">can fly slower</text><circle cx="31" cy="354.0" r="2.2" class="ah"/><text class="s q0" x="40" y="358.0">Lower the stall speed</text><circle cx="31" cy="373.5" r="2.2" class="ah"/><text class="s q0" x="40" y="377.5">Allow a steeper descent without</text><text class="s q0" x="40" y="393.0">picking up speed</text><rect x="254" y="282" width="222" height="24" rx="10" class="rose q2"/><text class="t q4" x="264" y="299">The cost</text><circle cx="265" cy="319" r="2.2" class="ah"/><text class="s q0" x="274" y="323">More drag, so a steeper glide and</text><text class="s q0" x="274" y="338.5">less climb</text><circle cx="265" cy="354.0" r="2.2" class="ah"/><text class="s q0" x="274" y="358.0">Large deflection adds more drag than</text><text class="s q0" x="274" y="373.5">lift</text><circle cx="265" cy="389.0" r="2.2" class="ah"/><text class="s q0" x="274" y="393.0">Nose attitude and pitch trim change</text><text class="s q0" x="274" y="408.5">when you move flaps</text><rect x="488" y="282" width="222" height="24" rx="10" class="sky q2"/><text class="t q4" x="498" y="299">Using them</text><circle cx="499" cy="319" r="2.2" class="ah"/><text class="s q0" x="508" y="323">Use the limits in your POH (VFE:</text><text class="s q0" x="508" y="338.5">top of the white arc)</text><circle cx="499" cy="354.0" r="2.2" class="ah"/><text class="s q0" x="508" y="358.0">Extend in steps; fully extended</text><text class="s q0" x="508" y="373.5">slows you most</text><circle cx="499" cy="389.0" r="2.2" class="ah"/><text class="s q0" x="508" y="393.0">Follow the POH flap setting for a</text><text class="s q0" x="508" y="408.5">go-around</text></svg>