<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 420" role="img" aria-labelledby="ti de"><title id="ti">Fuel pumps, selector and gauges</title><desc id="de">Fuel flows from the tanks through a selector valve and strainer, past an electric auxiliary pump to the engine-driven pump, then to the carburetor or fuel injector. The electric pump is used for start, tank changes, and as a backup. Fuel gauges are only required to be accurate when the tank is empty, so cross-check with time and a visual check.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:12px}.q1{font-size:11px}.q2{stroke:currentColor;stroke-width:1.5}.q3{font-size:12.5px}.q4{font-size:13px}.q5{stroke-width:2}</style><text class="t" x="20" y="28" style="font-size:15px">From tank to engine: pumps, selector, gauges</text><text class="s q4" x="20" y="50">Pump system shown (low-wing, injected). Many high-wing trainers are gravity-fed, no pumps. Schematic.</text><rect class="cl" x="20" y="90" width="690" height="150" rx="8"/><rect x="34" y="108" width="149" height="96" rx="10" class="sky q2"/><text class="t m q3" x="108.5" y="127">Tanks and selector</text><text class="t m q3" x="108.5" y="142">valve</text><text class="s m q1" x="108.5" y="159">LEFT, RIGHT or OFF</text><text class="s m q1" x="108.5" y="173.5">(BOTH on many high-wing).</text><path d="M185 156L194 156" class="dk q5"/><path d="M203 156L194 159.2L194 152.8Z" class="dh"/><rect x="205" y="108" width="149" height="96" rx="10" class="lav q2"/><text class="t m q3" x="279.5" y="127">Strainer</text><text class="s m q1" x="279.5" y="144">Catches dirt and water;</text><text class="s m q1" x="279.5" y="158.5">drain it on preflight.</text><path d="M356 156L365 156" class="dk q5"/><path d="M374 156L365 159.2L365 152.8Z" class="dh"/><rect x="376" y="108" width="149" height="96" rx="10" class="mint q2"/><text class="t m q3" x="450.5" y="127">Electric auxiliary</text><text class="t m q3" x="450.5" y="142">pump</text><text class="s m q1" x="450.5" y="159">Backup pump for start,</text><text class="s m q1" x="450.5" y="173.5">tank switch, vapor.</text><path d="M527 156L536 156" class="dk q5"/><path d="M545 156L536 159.2L536 152.8Z" class="dh"/><rect x="547" y="108" width="149" height="96" rx="10" class="rose q2"/><text class="t m q3" x="621.5" y="127">Engine-driven pump</text><text class="s m q1" x="621.5" y="144">Main pump, then to the</text><text class="s m q1" x="621.5" y="158.5">carburetor or injector.</text><text class="s q1" x="34" y="228">Check that the selector clicks into its detent and that you know which position the checklist wants.</text><rect x="20" y="272" width="222" height="24" rx="10" class="sky q2"/><text class="t q4" x="30" y="289">Fuel gauges</text><circle cx="31" cy="309" r="2.2" class="ah"/><text class="s q0" x="40" y="313">Required to be right only at empty</text><circle cx="31" cy="328.5" r="2.2" class="ah"/><text class="s q0" x="40" y="332.5">Between full and empty they can</text><text class="s q0" x="40" y="348.0">mislead</text><circle cx="31" cy="363.5" r="2.2" class="ah"/><text class="s q0" x="40" y="367.5">Plan fuel by time and a visual</text><text class="s q0" x="40" y="383.0">check, not the gauge alone</text><rect x="254" y="272" width="222" height="24" rx="10" class="mint q2"/><text class="t q4" x="264" y="289">Electric pump uses</text><circle cx="265" cy="309" r="2.2" class="ah"/><text class="s q0" x="274" y="313">On for engine start in some</text><text class="s q0" x="274" y="328.5">airplanes</text><circle cx="265" cy="344.0" r="2.2" class="ah"/><text class="s q0" x="274" y="348.0">On when changing tanks</text><circle cx="265" cy="363.5" r="2.2" class="ah"/><text class="s q0" x="274" y="367.5">On if engine fuel pressure drops,</text><text class="s q0" x="274" y="383.0">per your POH</text><rect x="488" y="272" width="222" height="24" rx="10" class="rose q2"/><text class="t q4" x="498" y="289">Fuel pressure</text><circle cx="499" cy="309" r="2.2" class="ah"/><text class="s q0" x="508" y="313">Gauge shows pressure in the line</text><circle cx="499" cy="328.5" r="2.2" class="ah"/><text class="s q0" x="508" y="332.5">Fluctuating or low pressure: turn on</text><text class="s q0" x="508" y="348.0">the aux pump and check the selector</text><text class="s q0" x="508" y="363.5">and tanks</text><circle cx="499" cy="379.0" r="2.2" class="ah"/><text class="s q0" x="508" y="383.0">Low pressure plus rough running</text><text class="s q0" x="508" y="398.5">means act at once</text></svg>