<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 499" role="img" aria-labelledby="ti de"><title id="ti">Ammeter versus loadmeter</title><desc id="de">An ammeter shows current flowing into or out of the battery: a plus reading means the battery is charging and a minus reading means it is discharging. A loadmeter shows how much load the alternator is carrying. Zero on a loadmeter means the alternator is not producing power. A low-voltage light can signal alternator trouble.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:12px}.q1{font-size:11px}.q2{stroke:currentColor;stroke-width:1.5}.q3{font-size:12.5px}.q4{font-size:13px}.q5{stroke-width:2}</style><text class="t" x="20" y="28" style="font-size:15px">Ammeter and loadmeter: reading the electrical gauge</text><text class="s q4" x="20" y="50">Airplanes show electrical health in one of two ways. Know which one is in your panel: the needle means</text><text class="s q4" x="20" y="66.5">different things.</text><rect class="cl" x="20" y="90" width="690" height="230" rx="8"/><text class="t q4" x="34" y="112">Ammeter (battery side)</text><path d="M50 230A100 100 0 0 1 250 230Z" class="sky q2"/><path d="M56.0 230.0L68.0 230.0" class="dk q5"/><text class="t m q3" x="84.0" y="218.0">-</text><path d="M150.0 136.0L150.0 148.0" class="dk q5"/><text class="t m q3" x="150.0" y="168.0">0</text><path d="M244.0 230.0L232.0 230.0" class="dk q5"/><text class="t m q3" x="216.0" y="218.0">+</text><path d="M150 230L178.5 159.5" class="acc"/><circle cx="150" cy="230" r="5" class="ah"/><text class="s m q1" x="150" y="256">Needle toward + : charging</text><text class="t q4" x="380" y="112">Loadmeter (alternator side)</text><path d="M400 230A100 100 0 0 1 600 230Z" class="sky q2"/><path d="M406.0 230.0L418.0 230.0" class="dk q5"/><text class="t m q3" x="434.0" y="218.0">0</text><path d="M594.0 230.0L582.0 230.0" class="dk q5"/><text class="t m q3" x="566.0" y="218.0">100%</text><path d="M500 230L538.0 164.2" class="acc"/><circle cx="500" cy="230" r="5" class="ah"/><text class="s m q1" x="500" y="256">Needle shows load on alternator</text><text class="s q1" x="34" y="296">Ammeter: + charging, 0 balanced, - discharging.</text><text class="s q1" x="380" y="296">Loadmeter: 0 means the alternator is not producing.</text><rect x="20" y="336" width="222" height="24" rx="10" class="mint q2"/><text class="t q4" x="30" y="353">Normal</text><circle cx="31" cy="373" r="2.2" class="ah"/><text class="s q0" x="40" y="377">Ammeter: positive after start while</text><text class="s q0" x="40" y="392.5">the battery recharges, then near</text><text class="s q0" x="40" y="408.0">zero</text><circle cx="31" cy="423.5" r="2.2" class="ah"/><text class="s q0" x="40" y="427.5">Loadmeter: reads the demand from</text><text class="s q0" x="40" y="443.0">lights, radios and pitot heat</text><circle cx="31" cy="458.5" r="2.2" class="ah"/><text class="s q0" x="40" y="462.5">Both move when you switch on a big</text><text class="s q0" x="40" y="478.0">load</text><rect x="254" y="336" width="222" height="24" rx="10" class="rose q2"/><text class="t q4" x="264" y="353">Trouble signs</text><circle cx="265" cy="373" r="2.2" class="ah"/><text class="s q0" x="274" y="377">Ammeter stays negative: battery is</text><text class="s q0" x="274" y="392.5">feeding the load</text><circle cx="265" cy="408.0" r="2.2" class="ah"/><text class="s q0" x="274" y="412.0">Loadmeter at zero: alternator is not</text><text class="s q0" x="274" y="427.5">producing</text><circle cx="265" cy="443.0" r="2.2" class="ah"/><text class="s q0" x="274" y="447.0">Low-voltage or ALT light on</text><rect x="488" y="336" width="222" height="24" rx="10" class="sky q2"/><text class="t q4" x="498" y="353">What to do</text><circle cx="499" cy="373" r="2.2" class="ah"/><text class="s q0" x="508" y="377">Turn off unneeded electrical</text><text class="s q0" x="508" y="392.5">equipment to save the battery</text><circle cx="499" cy="408.0" r="2.2" class="ah"/><text class="s q0" x="508" y="412.0">Check the alternator circuit breaker</text><text class="s q0" x="508" y="427.5">or switch, per the checklist</text><circle cx="499" cy="443.0" r="2.2" class="ah"/><text class="s q0" x="508" y="447.0">Land as soon as practical; the</text><text class="s q0" x="508" y="462.5">battery will not last long</text></svg>