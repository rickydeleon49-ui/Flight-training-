<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 380" role="img" aria-labelledby="ti de"><title id="ti">Engine instruments: what to watch</title><desc id="de">The tachometer shows engine speed in RPM, the oil pressure gauge shows oil pressure, the oil temperature gauge shows oil temperature, and cylinder head temperature shows engine heat. Manifold pressure in inches of mercury appears with constant-speed propellers. Needles in the green arc are normal. Oil pressure should rise soon after start.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:12px}.q1{font-size:11px}.q2{stroke:currentColor;stroke-width:1.5}.q3{font-size:12.5px}.q4{font-size:13px}.q5{stroke-width:2}</style><text class="t" x="20" y="28" style="font-size:15px">Engine instruments: what to watch</text><text class="s q4" x="20" y="50">Green arc = normal operating range; yellow = caution; red line = limit. Ranges come from the engine and</text><text class="s q4" x="20" y="66.5">your POH.</text><rect class="cl" x="20" y="90" width="690" height="118" rx="8"/><rect x="30" y="108" width="128" height="84" rx="10" class="sky q2"/><text class="t m q3" x="94.0" y="127">Tachometer</text><text class="s m q1" x="94.0" y="144">Engine RPM. On a</text><text class="s m q1" x="94.0" y="158.5">fixed-pitch prop it is</text><text class="s m q1" x="94.0" y="173.0">your power indicator.</text><rect x="165" y="108" width="128" height="84" rx="10" class="lav q2"/><text class="t m q3" x="229.0" y="127">Oil pressure</text><text class="s m q1" x="229.0" y="144">Should rise to the</text><text class="s m q1" x="229.0" y="158.5">green arc soon after</text><text class="s m q1" x="229.0" y="173.0">start.</text><rect x="300" y="108" width="128" height="84" rx="10" class="mint q2"/><text class="t m q3" x="364.0" y="127">Oil temperature</text><text class="s m q1" x="364.0" y="144">Rises slowly. High can</text><text class="s m q1" x="364.0" y="158.5">mean low oil or poor</text><text class="s m q1" x="364.0" y="173.0">cooling.</text><rect x="435" y="108" width="128" height="84" rx="10" class="rose q2"/><text class="t m q3" x="499.0" y="127">Cylinder head temp</text><text class="s m q1" x="499.0" y="144">Shows engine heat;</text><text class="s m q1" x="499.0" y="158.5">some airplanes also</text><text class="s m q1" x="499.0" y="173.0">have EGT.</text><rect x="570" y="108" width="128" height="84" rx="10" class="sky q2"/><text class="t m q3" x="634.0" y="127">Manifold pressure</text><text class="s m q1" x="634.0" y="144">Constant-speed props</text><text class="s m q1" x="634.0" y="158.5">only, in inches of Hg.</text><rect x="20" y="232" width="222" height="24" rx="10" class="mint q2"/><text class="t q4" x="30" y="249">After start</text><circle cx="31" cy="269" r="2.2" class="ah"/><text class="s q0" x="40" y="273">Oil pressure should rise promptly,</text><text class="s q0" x="40" y="288.5">within the time in your POH</text><circle cx="31" cy="304.0" r="2.2" class="ah"/><text class="s q0" x="40" y="308.0">If it does not, shut the engine down</text><text class="s q0" x="40" y="323.5">at once</text><circle cx="31" cy="339.0" r="2.2" class="ah"/><text class="s q0" x="40" y="343.0">Oil temperature will climb more</text><text class="s q0" x="40" y="358.5">slowly than pressure</text><rect x="254" y="232" width="222" height="24" rx="10" class="rose q2"/><text class="t q4" x="264" y="249">Warning signs</text><circle cx="265" cy="269" r="2.2" class="ah"/><text class="s q0" x="274" y="273">Oil pressure low or zero: possible</text><text class="s q0" x="274" y="288.5">oil loss or pump failure</text><circle cx="265" cy="304.0" r="2.2" class="ah"/><text class="s q0" x="274" y="308.0">Oil temperature high: low oil or a</text><text class="s q0" x="274" y="323.5">cooling problem</text><circle cx="265" cy="339.0" r="2.2" class="ah"/><text class="s q0" x="274" y="343.0">CHT or EGT rising far past normal:</text><text class="s q0" x="274" y="358.5">check mixture and power</text><rect x="488" y="232" width="222" height="24" rx="10" class="sky q2"/><text class="t q4" x="498" y="249">Good habits</text><circle cx="499" cy="269" r="2.2" class="ah"/><text class="s q0" x="508" y="273">Scan the engine gauges every few</text><text class="s q0" x="508" y="288.5">minutes</text><circle cx="499" cy="304.0" r="2.2" class="ah"/><text class="s q0" x="508" y="308.0">Know what normal looks like for your</text><text class="s q0" x="508" y="323.5">airplane</text><circle cx="499" cy="339.0" r="2.2" class="ah"/><text class="s q0" x="508" y="343.0">Manifold pressure with engine off</text><text class="s q0" x="508" y="358.5">reads about field pressure</text></svg>