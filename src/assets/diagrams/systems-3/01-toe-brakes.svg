<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 429" role="img" aria-labelledby="ti de"><title id="ti">Hydraulic toe brakes and the parking brake</title><desc id="de">Pressing the top of a rudder pedal pushes fluid from a master cylinder through a brake line to the main wheel, where pads squeeze a disc. Left and right brakes work independently. The parking brake traps pressure in the lines. A soft or sinking pedal means air or low fluid.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:12px}.q1{font-size:11px}.q2{stroke:currentColor;stroke-width:1.5}.q3{font-size:12.5px}.q4{font-size:13px}.q5{stroke-width:2}</style><text class="t" x="20" y="28" style="font-size:15px">Toe brakes: pedal to wheel</text><text class="s q4" x="20" y="50">Most trainers have hydraulic disc brakes on the main wheels only. The same pedals that steer with the</text><text class="s q4" x="20" y="66.5">rudder brake with the toes. Layout is schematic.</text><rect class="cl" x="20" y="90" width="690" height="150" rx="8"/><rect x="34" y="108" width="149" height="96" rx="10" class="sky q2"/><text class="t m q3" x="108.5" y="127">Toe pedal</text><text class="s m q1" x="108.5" y="144">Top of each rudder pedal;</text><text class="s m q1" x="108.5" y="158.5">push with your toes.</text><path d="M185 156L194 156" class="dk q5"/><path d="M203 156L194 159.2L194 152.8Z" class="dh"/><rect x="205" y="108" width="149" height="96" rx="10" class="lav q2"/><text class="t m q3" x="279.5" y="127">Master cylinder</text><text class="s m q1" x="279.5" y="144">Pressure on the pedal</text><text class="s m q1" x="279.5" y="158.5">pushes fluid into the</text><text class="s m q1" x="279.5" y="173.0">brake line.</text><path d="M356 156L365 156" class="dk q5"/><path d="M374 156L365 159.2L365 152.8Z" class="dh"/><rect x="376" y="108" width="149" height="96" rx="10" class="mint q2"/><text class="t m q3" x="450.5" y="127">Brake line</text><text class="s m q1" x="450.5" y="144">Fluid carries the pressure</text><text class="s m q1" x="450.5" y="158.5">to the wheel.</text><path d="M527 156L536 156" class="dk q5"/><path d="M545 156L536 159.2L536 152.8Z" class="dh"/><rect x="547" y="108" width="149" height="96" rx="10" class="rose q2"/><text class="t m q3" x="621.5" y="127">Pads and disc</text><text class="s m q1" x="621.5" y="144">Pads squeeze the disc and</text><text class="s m q1" x="621.5" y="158.5">slow the wheel.</text><text class="s q1" x="34" y="228">Left and right brakes are separate, so braking one side helps turn the airplane on the ground.</text><rect x="20" y="262" width="222" height="24" rx="10" class="rose q2"/><text class="t q4" x="30" y="279">Using the brakes</text><circle cx="31" cy="299" r="2.2" class="ah"/><text class="s q0" x="40" y="303">Heels on the floor, press only the</text><text class="s q0" x="40" y="318.5">top of the pedals</text><circle cx="31" cy="334.0" r="2.2" class="ah"/><text class="s q0" x="40" y="338.0">Squeeze smoothly; brake after the</text><text class="s q0" x="40" y="353.5">nose is down in the landing roll</text><circle cx="31" cy="369.0" r="2.2" class="ah"/><text class="s q0" x="40" y="373.0">Do not ride the brakes while</text><text class="s q0" x="40" y="388.5">taxiing: it heats them and wears</text><text class="s q0" x="40" y="404.0">them</text><rect x="254" y="262" width="222" height="24" rx="10" class="sky q2"/><text class="t q4" x="264" y="279">Parking brake</text><circle cx="265" cy="299" r="2.2" class="ah"/><text class="s q0" x="274" y="303">Push both pedals, then pull the</text><text class="s q0" x="274" y="318.5">parking brake knob</text><circle cx="265" cy="334.0" r="2.2" class="ah"/><text class="s q0" x="274" y="338.0">Release it the way your POH says</text><circle cx="265" cy="353.5" r="2.2" class="ah"/><text class="s q0" x="274" y="357.5">Do not set it when brakes are hot or</text><text class="s q0" x="274" y="373.0">in freezing, wet weather; use chocks</text><text class="s q0" x="274" y="388.5">or ties instead</text><rect x="488" y="262" width="222" height="24" rx="10" class="mint q2"/><text class="t q4" x="498" y="279">Pedal feel check</text><circle cx="499" cy="299" r="2.2" class="ah"/><text class="s q0" x="508" y="303">Test the brakes early in the taxi</text><text class="s q0" x="508" y="318.5">roll</text><circle cx="499" cy="334.0" r="2.2" class="ah"/><text class="s q0" x="508" y="338.0">Firm pedal = normal</text><circle cx="499" cy="353.5" r="2.2" class="ah"/><text class="s q0" x="508" y="357.5">A soft or sinking pedal suggests air</text><text class="s q0" x="508" y="373.0">or low fluid: do not fly</text><circle cx="499" cy="388.5" r="2.2" class="ah"/><text class="s q0" x="508" y="392.5">One brake weaker than the other</text><text class="s q0" x="508" y="408.0">pulls the airplane to one side</text></svg>