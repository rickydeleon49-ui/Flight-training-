<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 982" role="img" aria-labelledby="ti de"><title id="ti">Left-turning tendencies: four elements of torque</title><desc id="de">The left turning tendency of a single-engine airplane with a propeller turning clockwise as viewed from the pilot seat has four elements. Torque reaction (Newton third law) rolls the airplane about the longitudinal axis in flight and, on the takeoff roll, puts more weight and drag on the left main gear; it depends on engine size and horsepower, propeller size and rpm, airplane size and ground surface; rudder or rudder trim on the takeoff roll, aileron trim tabs at other speeds. The corkscrewing slipstream strikes the vertical fin, strongest at high propeller speed and low forward speed, with a rolling moment to the right. Gyroscopic action is precession, 90 degrees ahead in the direction of rotation, strongest when the tail is raised on the takeoff roll in tailwheel airplanes; elevator and rudder correct it. P-factor at a high angle of attack moves the center of thrust to the right of the disc and yaws the nose left. The pilot counteracts whichever force is most prominent.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11.5px}.q1{font-size:12.5px}.q2{stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}.q3{font-size:12px;fill:#fff}.q4{font-size:13px}</style><text class="t" x="20" y="28" style="font-size:15px">Left-turning tendencies: four elements of "torque"</text><text class="s q4" x="20" y="50">The left turning tendency of a single-engine airplane has four elements, each twisting it about at</text><text class="s q4" x="20" y="66.5">least one axis. Assumes the propeller turns clockwise as viewed from the pilot seat (most US-built</text><text class="s q4" x="20" y="83">engines).</text><rect class="cl" x="20" y="105.5" width="690" height="104" rx="8"/><path d="M85 129.5L85 193.5L90 199.5L95 193.5L95 129.5Q90 121.5 85 129.5Z" class="sky q2"/><path d="M85 149.5L46 157.5L46 167.5L85 171.5Z" class="lav q2"/><path d="M95 149.5L134 157.5L134 167.5L95 171.5Z" class="lav q2"/><path d="M85 187.5L72 191.5L72 196.5L85 195.5Z" class="mint q2"/><path d="M95 187.5L108 191.5L108 196.5L95 195.5Z" class="mint q2"/><path d="M82 118.2A46 46 0 0 0 50.2 140.5" class="acc" style="stroke-width:2.5"/><path d="M50.2 140.5L51.2 130.7L58.2 134.7Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><text class="t q0" x="106" y="121.5">nose yaws left</text><text class="s m" x="172" y="195.5" style="font-size:10.5px">top view (schematic)</text><text class="s q1" x="235" y="129.5">The four elements are torque reaction from the engine and propeller,</text><text class="s q1" x="235" y="145.5">the corkscrewing effect of the slipstream, gyroscopic action of the</text><text class="s q1" x="235" y="161.5">propeller, and asymmetric loading of the propeller (P-factor).</text><text class="t q1" x="235" y="185.5">The pilot must counteract whichever force is most prominent at the</text><text class="t q1" x="235" y="201.5">time, using the flight controls.</text><text class="t q1" x="24" y="231.5">Element</text><text class="t q1" x="162" y="231.5">What it does</text><text class="t q1" x="386" y="231.5">Strongest when</text><text class="t q1" x="556" y="231.5">Pilot answer</text><rect class="sky" x="20" y="239.5" width="690" height="157" rx="8"/><circle cx="36" cy="257.5" r="10" class="ah"/><text class="t m q3" x="36" y="261.5">1</text><text class="s q0" x="162" y="257.5">Newton's Third Law: the propeller</text><text class="s q0" x="162" y="272.5">turns one way, an equal force</text><text class="s q0" x="162" y="287.5">tries to roll the airplane the</text><text class="s q0" x="162" y="302.5">other way. Airborne: a roll</text><text class="s q0" x="162" y="317.5">tendency about the longitudinal</text><text class="s q0" x="162" y="332.5">axis. Takeoff roll: the left main</text><text class="s q0" x="162" y="347.5">gear carries more weight, more</text><text class="s q0" x="162" y="362.5">drag on the left tire, a further</text><text class="s q0" x="162" y="377.5">turn left about the vertical axis.</text><text class="s q0" x="386" y="257.5">Depends on engine size</text><text class="s q0" x="386" y="272.5">and horsepower, propeller</text><text class="s q0" x="386" y="287.5">size and rpm, airplane</text><text class="s q0" x="386" y="302.5">size and the ground</text><text class="s q0" x="386" y="317.5">surface condition.</text><text class="s q0" x="556" y="257.5">Rudder or rudder trim on</text><text class="s q0" x="556" y="272.5">the takeoff roll. Aileron</text><text class="s q0" x="556" y="287.5">trim tabs for other</text><text class="s q0" x="556" y="302.5">speeds (built-in</text><text class="s q0" x="556" y="317.5">compensation is set for</text><text class="s q0" x="556" y="332.5">cruise speed).</text><text class="t q1" x="56" y="261.5">Torque</text><text class="t q1" x="56" y="277.5">reaction</text><rect class="lav" x="20" y="404.5" width="690" height="142" rx="8"/><circle cx="36" cy="422.5" r="10" class="ah"/><text class="t m q3" x="36" y="426.5">2</text><text class="s q0" x="162" y="422.5">The propeller gives the slipstream</text><text class="s q0" x="162" y="437.5">a spiraling rotation that strikes</text><text class="s q0" x="162" y="452.5">the vertical fin: a yawing moment</text><text class="s q0" x="162" y="467.5">about the vertical axis, plus a</text><text class="s q0" x="162" y="482.5">rolling moment about the</text><text class="s q0" x="162" y="497.5">longitudinal axis to the right</text><text class="s q0" x="162" y="512.5">(torque reaction yaws left, so one</text><text class="s q0" x="162" y="527.5">may offset the other).</text><text class="s q0" x="386" y="422.5">High propeller speed and</text><text class="s q0" x="386" y="437.5">low forward speed, as in</text><text class="s q0" x="386" y="452.5">takeoffs and approaches</text><text class="s q0" x="386" y="467.5">to power-on stalls: the</text><text class="s q0" x="386" y="482.5">spiral is compact. It</text><text class="s q0" x="386" y="497.5">elongates and weakens as</text><text class="s q0" x="386" y="512.5">speed rises.</text><text class="s q0" x="556" y="422.5">Corrective action with</text><text class="s q0" x="556" y="437.5">the flight controls at</text><text class="s q0" x="556" y="452.5">all times; the forces</text><text class="s q0" x="556" y="467.5">vary greatly.</text><text class="t q1" x="56" y="426.5">Corkscrewing</text><text class="t q1" x="56" y="442.5">slipstream</text><rect class="mint" x="20" y="554.5" width="690" height="157" rx="8"/><circle cx="36" cy="572.5" r="10" class="ah"/><text class="t m q3" x="36" y="576.5">3</text><text class="s q0" x="162" y="572.5">Precession: a force on the rim of</text><text class="s q0" x="162" y="587.5">a spinning rotor takes effect 90</text><text class="s q0" x="162" y="602.5">degrees ahead, in the direction of</text><text class="s q0" x="162" y="617.5">rotation. Raising the tail pushes</text><text class="s q0" x="162" y="632.5">on the top of the propeller disc;</text><text class="s q0" x="162" y="647.5">the result acts 90 degrees ahead</text><text class="s q0" x="162" y="662.5">and yaws the nose left. Yaw gives</text><text class="s q0" x="162" y="677.5">a pitching moment; pitch gives a</text><text class="s q0" x="162" y="692.5">yawing moment.</text><text class="s q0" x="386" y="572.5">More prominent in</text><text class="s q0" x="386" y="587.5">tailwheel airplanes, most</text><text class="s q0" x="386" y="602.5">often as the tail is</text><text class="s q0" x="386" y="617.5">raised on the takeoff</text><text class="s q0" x="386" y="632.5">roll; depends on how</text><text class="s q0" x="386" y="647.5">abruptly the tail is</text><text class="s q0" x="386" y="662.5">raised.</text><text class="s q0" x="556" y="572.5">Proper use of elevator</text><text class="s q0" x="556" y="587.5">and rudder to prevent</text><text class="s q0" x="556" y="602.5">unwanted pitching and</text><text class="s q0" x="556" y="617.5">yawing.</text><text class="t q1" x="56" y="576.5">Gyroscopic</text><text class="t q1" x="56" y="592.5">action</text><rect class="rose" x="20" y="719.5" width="690" height="172" rx="8"/><circle cx="36" cy="737.5" r="10" class="ah"/><text class="t m q3" x="36" y="741.5">4</text><text class="s q0" x="162" y="737.5">The downward-moving blade takes a</text><text class="s q0" x="162" y="752.5">bigger "bite" than the</text><text class="s q0" x="162" y="767.5">upward-moving blade, so the center</text><text class="s q0" x="162" y="782.5">of thrust moves to the right of</text><text class="s q0" x="162" y="797.5">the prop disc and the nose yaws</text><text class="s q0" x="162" y="812.5">left about the vertical axis. The</text><text class="s q0" x="162" y="827.5">downswinging blade (right, seen</text><text class="s q0" x="162" y="842.5">from behind) meets a greater</text><text class="s q0" x="162" y="857.5">resultant velocity and gives more</text><text class="s q0" x="162" y="872.5">lift.</text><text class="s q0" x="386" y="737.5">Flying at a high angle of</text><text class="s q0" x="386" y="752.5">attack (positive AOA).</text><text class="s q0" x="556" y="737.5">Counter it with the</text><text class="s q0" x="556" y="752.5">flight controls like the</text><text class="s q0" x="556" y="767.5">other three; PHAK names</text><text class="s q0" x="556" y="782.5">no single control.</text><text class="t q1" x="56" y="741.5">P-factor</text><text class="t q1" x="56" y="757.5">(asymmetric</text><text class="t q1" x="56" y="773.5">loading)</text><rect class="cl" x="20" y="899.5" width="690" height="69" rx="8"/><circle cx="35" cy="921.5" r="2.2" class="ah"/><text class="s" x="44" y="925.5" style="font-size:12px">Torque reaction in flight is built out: some older airplanes are rigged for more lift on the wing forced</text><text class="s" x="44" y="941" style="font-size:12px">down, and more modern ones have the engine offset</text></svg>
