<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 903" role="img" aria-labelledby="ti de"><title id="ti">Longitudinal stability: tail force, speed and pitch oscillation</title><desc id="de">Schematic lever along the line CG, CL, T: the weight acts down at the CG, the lift acts up at the center of lift CL which is aft of the CG, and a much lesser downward force acts at the horizontal stabilizer T, which holds the tail down. Faster flight gives more downwash and more down force on the stabilizer. If speed decreases, the downwash and tail force decrease and the nose pitches down; the lower AOA and drag let airspeed increase, the tail force grows, the nose rises into a climb, and after several diminishing oscillations the airplane settles at a speed where the tail force exactly counters the dive tendency. Static longitudinal stability depends on the wing location relative to the CG, the tail location relative to the CG, and the tail area. A high thrust line above the CG offsets the nose-up effect of added power.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11.5px}.q1{font-size:12px}.q2{stroke:currentColor;stroke-width:1.5}.q3{font-size:12px;fill:#fff}.q4{font-size:12.5px}.q5{stroke-width:2}.q6{font-size:13px}</style><text class="t" x="20" y="28" style="font-size:15px">Longitudinal stability: tail force, speed and pitch oscillation</text><text class="s q6" x="20" y="50">Stability about the lateral axis (pitching). The wing CL is aft of the CG, which makes the airplane</text><text class="s q6" x="20" y="66.5">nose heavy; a tail-down force balances it. Schematic.</text><rect class="cl" x="20" y="89" width="690" height="158" rx="8"/><path d="M70 159L660 159" class="dk" style="stroke-width:3;opacity:0.9"/><text class="s q0" x="70" y="199">nose</text><text class="s e q0" x="660" y="199">tail</text><circle cx="190" cy="159" r="5" class="ah"/><circle cx="340" cy="159" r="5" class="ah"/><circle cx="590" cy="159" r="5" class="ah"/><path d="M190 113L190 147" class="dk" style="stroke-width:3.5"/><path d="M190 156L185.9 147L194.1 147Z" class="dh" style=""/><text class="t m q0" x="190" y="105">weight at CG (strong, down)</text><path d="M340 205L340 171" class="dk" style="stroke-width:3.5"/><path d="M340 162L344.1 171L335.9 171Z" class="dh" style=""/><text class="t m q0" x="340" y="221">lift at CL (up)</text><path d="M590 133L590 148" class="dk q5"/><path d="M590 156L586.4 148L593.6 148Z" class="dh" style=""/><text class="t m q0" x="590" y="125">tail-down force at T (much lesser)</text><text class="s q0" x="32" y="239">Like a lever: an upward force at CL, and two downward forces balancing it (line CG-CL-T, PHAK Figure 5-23).</text><text class="t" x="20" y="269" style="font-size:13.5px">What a speed change does to the balance</text><rect x="20" y="281" width="218" height="112" rx="10" class="sky q2"/><circle cx="36" cy="299" r="10" class="ah"/><text class="t m q3" x="36" y="303">1</text><text class="t q4" x="52" y="304">Speed decreases</text><text class="s q0" x="30" y="325">less airflow over the wing, so</text><text class="s q0" x="30" y="340">less downwash: a lesser downward</text><text class="s q0" x="30" y="355">force on the horizontal</text><text class="s q0" x="30" y="370">stabilizer</text><path d="M239 337L249 337" class="dk q5"/><path d="M255 337L249 339.7L249 334.3Z" class="dh" style=""/><rect x="256" y="281" width="218" height="112" rx="10" class="lav q2"/><circle cx="272" cy="299" r="10" class="ah"/><text class="t m q3" x="272" y="303">2</text><text class="t q4" x="288" y="304">Nose pitches down</text><text class="s q0" x="266" y="325">the characteristic nose heaviness</text><text class="s q0" x="266" y="340">is accentuated</text><path d="M475 337L485 337" class="dk q5"/><path d="M491 337L485 339.7L485 334.3Z" class="dh" style=""/><rect x="492" y="281" width="218" height="112" rx="10" class="mint q2"/><circle cx="508" cy="299" r="10" class="ah"/><text class="t m q3" x="508" y="303">3</text><text class="t q4" x="524" y="304">Nose low, speed returns</text><text class="s q0" x="502" y="325">lower AOA and drag, so the</text><text class="s q0" x="502" y="340">airspeed increases</text><rect x="20" y="407" width="218" height="112" rx="10" class="rose q2"/><circle cx="36" cy="425" r="10" class="ah"/><text class="t m q3" x="36" y="429">4</text><text class="t q4" x="52" y="430">Tail force grows again</text><text class="s q0" x="30" y="451">faster flow, more downwash: the</text><text class="s q0" x="30" y="466">tail is pushed down and the nose</text><text class="s q0" x="30" y="481">rises into a climb</text><path d="M239 463L249 463" class="dk q5"/><path d="M255 463L249 465.7L249 460.3Z" class="dh" style=""/><rect x="256" y="407" width="218" height="112" rx="10" class="sky q2"/><circle cx="272" cy="425" r="10" class="ah"/><text class="t m q3" x="272" y="429">5</text><text class="t q4" x="288" y="430">Climb slows it again</text><text class="s q0" x="266" y="451">airspeed decreases, tail force</text><text class="s q0" x="266" y="466">decreases, the nose lowers once</text><text class="s q0" x="266" y="481">more, but not as far (dynamically</text><text class="s q0" x="266" y="496">stable)</text><path d="M475 463L485 463" class="dk q5"/><path d="M491 463L485 465.7L485 460.3Z" class="dh" style=""/><rect x="492" y="407" width="218" height="112" rx="10" class="mint q2"/><circle cx="508" cy="425" r="10" class="ah"/><text class="t m q3" x="508" y="429">6</text><text class="t q4" x="524" y="430">Settles down</text><text class="s q0" x="502" y="451">after several diminishing</text><text class="s q0" x="502" y="466">oscillations: a speed where the</text><text class="s q0" x="502" y="481">tail force exactly counters the</text><text class="s q0" x="502" y="496">dive tendency; balanced flight</text><rect x="20" y="533" width="337" height="24" rx="10" class="sky q2"/><text class="t q6" x="30" y="550">Three factors for static longitudinal stability</text><circle cx="31" cy="571" r="2.2" class="ah"/><text class="s q1" x="40" y="575">Location of the wing with respect to the CG</text><circle cx="31" cy="590.5" r="2.2" class="ah"/><text class="s q1" x="40" y="594.5">Location of the horizontal tail surfaces with</text><text class="s q1" x="40" y="610">respect to the CG</text><circle cx="31" cy="625.5" r="2.2" class="ah"/><text class="s q1" x="40" y="629.5">Area or size of the tail surfaces</text><circle cx="31" cy="645" r="2.2" class="ah"/><text class="s q1" x="40" y="649">A body free to rotate always turns about its CG</text><rect x="373" y="533" width="337" height="24" rx="10" class="lav q2"/><text class="t q6" x="383" y="550">Power and thrust line</text><circle cx="384" cy="571" r="2.2" class="ah"/><text class="s q1" x="393" y="575">An increase of power may tend to make the nose</text><text class="s q1" x="393" y="590.5">rise</text><circle cx="384" cy="606" r="2.2" class="ah"/><text class="s q1" x="393" y="610">A "high thrust line" (line of thrust above the</text><text class="s q1" x="393" y="625.5">CG) offsets this: more thrust gives a moment</text><text class="s q1" x="393" y="641">against the down load on the tail</text><circle cx="384" cy="656.5" r="2.2" class="ah"/><text class="s q1" x="393" y="660.5">A very "low thrust line" would add to the nose-up</text><text class="s q1" x="393" y="676">effect of the horizontal tail</text><circle cx="384" cy="691.5" r="2.2" class="ah"/><text class="s q1" x="393" y="695.5">Closing the throttle reduces the wing downwash;</text><text class="s q1" x="393" y="711">the force at T cannot hold the stabilizer down</text><text class="s q1" x="393" y="726.5">and the nose drops</text><rect class="cl" x="20" y="750" width="690" height="139" rx="8"/><circle cx="35" cy="772" r="2.2" class="ah"/><text class="s q1" x="44" y="776">Wing CL moves forward with an increase in AOA and aft with a decrease; that tends to lift the leading</text><text class="s q1" x="44" y="791.5">edge still more, an inherent instability of the wing</text><circle cx="35" cy="807" r="2.2" class="ah"/><text class="s q1" x="44" y="811">A longitudinally unstable airplane tends to dive or climb progressively into a very steep dive or climb,</text><text class="s q1" x="44" y="826.5">or a stall</text><circle cx="35" cy="842" r="2.2" class="ah"/><text class="s q1" x="44" y="846">Conclusion (PHAK): with the CG forward of the CL and an aerodynamic tail-down force, the airplane</text><text class="s q1" x="44" y="861.5">usually tries to return to a safe flying attitude</text></svg>
