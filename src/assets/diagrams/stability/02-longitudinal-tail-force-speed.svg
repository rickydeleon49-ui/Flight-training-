<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 903" role="img" aria-labelledby="ti de"><title id="ti">Longitudinal stability: tail force, speed and pitch oscillation</title><desc id="de">Schematic lever along the line CG, CL, T: the weight acts down at the CG, the lift acts up at the center of lift CL which is aft of the CG, and a much lesser downward force acts at the horizontal stabilizer T, which holds the tail down. Faster flight gives more downwash and more down force on the stabilizer. If speed decreases, the downwash and tail force decrease and the nose pitches down; the lower AOA and drag let airspeed increase, the tail force grows, the nose rises into a climb, and after several diminishing oscillations the airplane settles at a speed where the tail force exactly counters the dive tendency. Static longitudinal stability depends on the wing location relative to the CG, the tail location relative to the CG, and the tail area. A high thrust line above the CG offsets the nose-up effect of added power.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style>
<text class="t" x="20" y="28" style="font-size:15px">Longitudinal stability: tail force, speed and pitch oscillation</text>
<text class="s" x="20" y="50.0" style="font-size:13px">Stability about the lateral axis (pitching). The wing CL is aft of the CG, which makes the airplane</text>
<text class="s" x="20" y="66.5" style="font-size:13px">nose heavy; a tail-down force balances it. Schematic.</text>
<rect class="cl" x="20" y="89.0" width="690" height="158" rx="8"/>
<path d="M70 159.0L660 159.0" class="dk" style="stroke-width:3;opacity:0.9"/>
<text class="s" x="70" y="199.0" style="font-size:11.5px">nose</text>
<text class="s e" x="660" y="199.0" style="font-size:11.5px">tail</text>
<circle cx="190" cy="159.0" r="5" class="ah"/>
<circle cx="340" cy="159.0" r="5" class="ah"/>
<circle cx="590" cy="159.0" r="5" class="ah"/>
<path d="M190 113.0L190.0 147.0" class="dk" style="stroke-width:3.5"/><path d="M190 156.0L185.9 147.0L194.1 147.0Z" class="dh" style=""/>
<text class="t m" x="190" y="105.0" style="font-size:11.5px">weight at CG (strong, down)</text>
<path d="M340 205.0L340.0 171.0" class="dk" style="stroke-width:3.5"/><path d="M340 162.0L344.1 171.0L335.9 171.0Z" class="dh" style=""/>
<text class="t m" x="340" y="221.0" style="font-size:11.5px">lift at CL (up)</text>
<path d="M590 133.0L590.0 148.0" class="dk" style="stroke-width:2"/><path d="M590 156.0L586.4 148.0L593.6 148.0Z" class="dh" style=""/>
<text class="t m" x="590" y="125.0" style="font-size:11.5px">tail-down force at T (much lesser)</text>
<text class="s" x="32" y="239.0" style="font-size:11.5px">Like a lever: an upward force at CL, and two downward forces balancing it (line CG-CL-T, PHAK Figure 5-23).</text>
<text class="t" x="20" y="269.0" style="font-size:13.5px">What a speed change does to the balance</text>
<rect x="20" y="281.0" width="218" height="112" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/>
<circle cx="36" cy="299.0" r="10" class="ah"/><text class="t m" x="36" y="303.0" style="font-size:12px;fill:#fff">1</text>
<text class="t" x="52" y="304.0" style="font-size:12.5px">Speed decreases</text>
<text class="s" x="30" y="325.0" style="font-size:11.5px">less airflow over the wing, so</text>
<text class="s" x="30" y="340.0" style="font-size:11.5px">less downwash: a lesser downward</text>
<text class="s" x="30" y="355.0" style="font-size:11.5px">force on the horizontal</text>
<text class="s" x="30" y="370.0" style="font-size:11.5px">stabilizer</text>
<path d="M239 337.0L249.0 337.0" class="dk" style="stroke-width:2"/><path d="M255 337.0L249.0 339.7L249.0 334.3Z" class="dh" style=""/>
<rect x="256" y="281.0" width="218" height="112" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/>
<circle cx="272" cy="299.0" r="10" class="ah"/><text class="t m" x="272" y="303.0" style="font-size:12px;fill:#fff">2</text>
<text class="t" x="288" y="304.0" style="font-size:12.5px">Nose pitches down</text>
<text class="s" x="266" y="325.0" style="font-size:11.5px">the characteristic nose heaviness</text>
<text class="s" x="266" y="340.0" style="font-size:11.5px">is accentuated</text>
<path d="M475 337.0L485.0 337.0" class="dk" style="stroke-width:2"/><path d="M491 337.0L485.0 339.7L485.0 334.3Z" class="dh" style=""/>
<rect x="492" y="281.0" width="218" height="112" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/>
<circle cx="508" cy="299.0" r="10" class="ah"/><text class="t m" x="508" y="303.0" style="font-size:12px;fill:#fff">3</text>
<text class="t" x="524" y="304.0" style="font-size:12.5px">Nose low, speed returns</text>
<text class="s" x="502" y="325.0" style="font-size:11.5px">lower AOA and drag, so the</text>
<text class="s" x="502" y="340.0" style="font-size:11.5px">airspeed increases</text>
<rect x="20" y="407.0" width="218" height="112" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/>
<circle cx="36" cy="425.0" r="10" class="ah"/><text class="t m" x="36" y="429.0" style="font-size:12px;fill:#fff">4</text>
<text class="t" x="52" y="430.0" style="font-size:12.5px">Tail force grows again</text>
<text class="s" x="30" y="451.0" style="font-size:11.5px">faster flow, more downwash: the</text>
<text class="s" x="30" y="466.0" style="font-size:11.5px">tail is pushed down and the nose</text>
<text class="s" x="30" y="481.0" style="font-size:11.5px">rises into a climb</text>
<path d="M239 463.0L249.0 463.0" class="dk" style="stroke-width:2"/><path d="M255 463.0L249.0 465.7L249.0 460.3Z" class="dh" style=""/>
<rect x="256" y="407.0" width="218" height="112" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/>
<circle cx="272" cy="425.0" r="10" class="ah"/><text class="t m" x="272" y="429.0" style="font-size:12px;fill:#fff">5</text>
<text class="t" x="288" y="430.0" style="font-size:12.5px">Climb slows it again</text>
<text class="s" x="266" y="451.0" style="font-size:11.5px">airspeed decreases, tail force</text>
<text class="s" x="266" y="466.0" style="font-size:11.5px">decreases, the nose lowers once</text>
<text class="s" x="266" y="481.0" style="font-size:11.5px">more, but not as far (dynamically</text>
<text class="s" x="266" y="496.0" style="font-size:11.5px">stable)</text>
<path d="M475 463.0L485.0 463.0" class="dk" style="stroke-width:2"/><path d="M491 463.0L485.0 465.7L485.0 460.3Z" class="dh" style=""/>
<rect x="492" y="407.0" width="218" height="112" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/>
<circle cx="508" cy="425.0" r="10" class="ah"/><text class="t m" x="508" y="429.0" style="font-size:12px;fill:#fff">6</text>
<text class="t" x="524" y="430.0" style="font-size:12.5px">Settles down</text>
<text class="s" x="502" y="451.0" style="font-size:11.5px">after several diminishing</text>
<text class="s" x="502" y="466.0" style="font-size:11.5px">oscillations: a speed where the</text>
<text class="s" x="502" y="481.0" style="font-size:11.5px">tail force exactly counters the</text>
<text class="s" x="502" y="496.0" style="font-size:11.5px">dive tendency; balanced flight</text>
<rect x="20" y="533.0" width="337" height="24" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="30" y="550.0" style="font-size:13px">Three factors for static longitudinal stability</text>
<circle cx="31" cy="571.0" r="2.2" class="ah"/>
<text class="s" x="40" y="575.0" style="font-size:12px">Location of the wing with respect to the CG</text>
<circle cx="31" cy="590.5" r="2.2" class="ah"/>
<text class="s" x="40" y="594.5" style="font-size:12px">Location of the horizontal tail surfaces with</text>
<text class="s" x="40" y="610.0" style="font-size:12px">respect to the CG</text>
<circle cx="31" cy="625.5" r="2.2" class="ah"/>
<text class="s" x="40" y="629.5" style="font-size:12px">Area or size of the tail surfaces</text>
<circle cx="31" cy="645.0" r="2.2" class="ah"/>
<text class="s" x="40" y="649.0" style="font-size:12px">A body free to rotate always turns about its CG</text>
<rect x="373" y="533.0" width="337" height="24" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="383" y="550.0" style="font-size:13px">Power and thrust line</text>
<circle cx="384" cy="571.0" r="2.2" class="ah"/>
<text class="s" x="393" y="575.0" style="font-size:12px">An increase of power may tend to make the nose</text>
<text class="s" x="393" y="590.5" style="font-size:12px">rise</text>
<circle cx="384" cy="606.0" r="2.2" class="ah"/>
<text class="s" x="393" y="610.0" style="font-size:12px">A "high thrust line" (line of thrust above the</text>
<text class="s" x="393" y="625.5" style="font-size:12px">CG) offsets this: more thrust gives a moment</text>
<text class="s" x="393" y="641.0" style="font-size:12px">against the down load on the tail</text>
<circle cx="384" cy="656.5" r="2.2" class="ah"/>
<text class="s" x="393" y="660.5" style="font-size:12px">A very "low thrust line" would add to the nose-up</text>
<text class="s" x="393" y="676.0" style="font-size:12px">effect of the horizontal tail</text>
<circle cx="384" cy="691.5" r="2.2" class="ah"/>
<text class="s" x="393" y="695.5" style="font-size:12px">Closing the throttle reduces the wing downwash;</text>
<text class="s" x="393" y="711.0" style="font-size:12px">the force at T cannot hold the stabilizer down</text>
<text class="s" x="393" y="726.5" style="font-size:12px">and the nose drops</text>
<rect class="cl" x="20" y="750.0" width="690" height="139.0" rx="8"/>
<circle cx="35" cy="772.0" r="2.2" class="ah"/>
<text class="s" x="44" y="776.0" style="font-size:12px">Wing CL moves forward with an increase in AOA and aft with a decrease; that tends to lift the leading</text>
<text class="s" x="44" y="791.5" style="font-size:12px">edge still more, an inherent instability of the wing</text>
<circle cx="35" cy="807.0" r="2.2" class="ah"/>
<text class="s" x="44" y="811.0" style="font-size:12px">A longitudinally unstable airplane tends to dive or climb progressively into a very steep dive or climb,</text>
<text class="s" x="44" y="826.5" style="font-size:12px">or a stall</text>
<circle cx="35" cy="842.0" r="2.2" class="ah"/>
<text class="s" x="44" y="846.0" style="font-size:12px">Conclusion (PHAK): with the CG forward of the CL and an aerodynamic tail-down force, the airplane</text>
<text class="s" x="44" y="861.5" style="font-size:12px">usually tries to return to a safe flying attitude</text>
</svg>
