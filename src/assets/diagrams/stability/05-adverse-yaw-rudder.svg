<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 742" role="img" aria-labelledby="ti de"><title id="ti">Adverse yaw and how the rudder corrects it</title><desc id="de">Adverse yaw: the downward deflected aileron produces more lift and more drag, the wing slows slightly and the airplane yaws toward the wing that had more lift and drag, opposite the direction of bank. Rudder pressure applied with the ailerons counters it, and is needed most at low airspeeds, high angles of attack and large aileron deflections. Coordinated turn: roll in with aileron and rudder plus elevator back pressure; relax aileron and rudder pressure when the bank is set and hold elevator back pressure; roll out with aileron and rudder toward the high wing and relax back pressure. Design aids that reduce but do not eliminate adverse yaw: differential ailerons, Frise-type ailerons, coupled ailerons and rudder, and flaperons. Centering the inclinometer ball gives a coordinated turn.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><text class="t" x="20" y="28" style="font-size:15px">Adverse yaw and how the rudder corrects it</text><text class="s" x="20" y="50.0" style="font-size:13px">The yaw is opposite the direction of bank. Rudder pressure with the ailerons, plus elevator back</text><text class="s" x="20" y="66.5" style="font-size:13px">pressure, makes a coordinated turn. Schematic.</text><rect class="cl" x="20" y="89.0" width="690" height="160" rx="8"/><text class="t" x="32" y="111.0" style="font-size:13px">Cause and cure</text><rect x="32" y="123.0" width="152" height="116" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><circle cx="46" cy="140.0" r="9" class="ah"/><text class="t m" x="46" y="143.66666666666666" style="font-size:11px;fill:#fff">1</text><text class="t" x="60" y="144.0" style="font-size:12.5px">Aileron down on</text><text class="t" x="60" y="160.0" style="font-size:12.5px">the rising wing</text><text class="s" x="42" y="182.0" style="font-size:11.5px">more lift (the wing</text><text class="s" x="42" y="197.0" style="font-size:11.5px">rises) and more drag</text><path d="M185 175.0L194.0 175.0" class="dk" style="stroke-width:2"/><path d="M200 175.0L194.0 177.7L194.0 172.3Z" class="dh" style=""/><rect x="201" y="123.0" width="152" height="116" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><circle cx="215" cy="140.0" r="9" class="ah"/><text class="t m" x="215" y="143.66666666666666" style="font-size:11px;fill:#fff">2</text><text class="t" x="229" y="144.0" style="font-size:12.5px">Drag pulls that</text><text class="t" x="229" y="160.0" style="font-size:12.5px">wing back</text><text class="s" x="211" y="182.0" style="font-size:11.5px">differential drag and</text><text class="s" x="211" y="197.0" style="font-size:11.5px">a slight difference in</text><text class="s" x="211" y="212.0" style="font-size:11.5px">velocity of the left</text><text class="s" x="211" y="227.0" style="font-size:11.5px">and right wings</text><path d="M354 175.0L363.0 175.0" class="dk" style="stroke-width:2"/><path d="M369 175.0L363.0 177.7L363.0 172.3Z" class="dh" style=""/><rect x="370" y="123.0" width="152" height="116" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/><circle cx="384" cy="140.0" r="9" class="ah"/><text class="t m" x="384" y="143.66666666666666" style="font-size:11px;fill:#fff">3</text><text class="t" x="398" y="144.0" style="font-size:12.5px">Nose yaws toward</text><text class="t" x="398" y="160.0" style="font-size:12.5px">the rising wing</text><text class="s" x="380" y="182.0" style="font-size:11.5px">opposite the bank:</text><text class="s" x="380" y="197.0" style="font-size:11.5px">this is adverse yaw</text><path d="M523 175.0L532.0 175.0" class="dk" style="stroke-width:2"/><path d="M538 175.0L532.0 177.7L532.0 172.3Z" class="dh" style=""/><rect x="539" y="123.0" width="152" height="116" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><circle cx="553" cy="140.0" r="9" class="ah"/><text class="t m" x="553" y="143.66666666666666" style="font-size:11px;fill:#fff">4</text><text class="t" x="567" y="144.0" style="font-size:12.5px">Rudder pressure</text><text class="s" x="549" y="166.0" style="font-size:11.5px">applied at the same</text><text class="s" x="549" y="181.0" style="font-size:11.5px">time as the ailerons</text><text class="s" x="549" y="196.0" style="font-size:11.5px">counters the yaw</text><text class="t" x="20" y="271.0" style="font-size:13.5px">Controls through a coordinated turn</text><rect x="20" y="281.0" width="218" height="24" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30" y="298.0" style="font-size:13px">Roll in</text><circle cx="31" cy="319.0" r="2.2" class="ah"/><text class="s" x="40" y="323.0" style="font-size:11.5px">Aileron pressure sets the angle</text><text class="s" x="40" y="338.0" style="font-size:11.5px">of bank</text><circle cx="31" cy="353.0" r="2.2" class="ah"/><text class="s" x="40" y="357.0" style="font-size:11.5px">Simultaneous rudder pressure</text><text class="s" x="40" y="372.0" style="font-size:11.5px">counters the adverse yaw</text><circle cx="31" cy="387.0" r="2.2" class="ah"/><text class="s" x="40" y="391.0" style="font-size:11.5px">Elevator back pressure raises</text><text class="s" x="40" y="406.0" style="font-size:11.5px">the AOA for the extra lift</text><text class="s" x="40" y="421.0" style="font-size:11.5px">needed; steeper turn, more back</text><text class="s" x="40" y="436.0" style="font-size:11.5px">pressure</text><path d="M239 293.0L249.0 293.0" class="dk" style="stroke-width:2"/><path d="M255 293.0L249.0 295.7L249.0 290.3Z" class="dh" style=""/><rect x="256" y="281.0" width="218" height="24" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="266" y="298.0" style="font-size:13px">Hold the bank</text><circle cx="267" cy="319.0" r="2.2" class="ah"/><text class="s" x="276" y="323.0" style="font-size:11.5px">Relax aileron and rudder</text><text class="s" x="276" y="338.0" style="font-size:11.5px">pressure: the surfaces are</text><text class="s" x="276" y="353.0" style="font-size:11.5px">neutral and streamlined and the</text><text class="s" x="276" y="368.0" style="font-size:11.5px">bank stops increasing</text><circle cx="267" cy="383.0" r="2.2" class="ah"/><text class="s" x="276" y="387.0" style="font-size:11.5px">Hold elevator back pressure</text><text class="s" x="276" y="402.0" style="font-size:11.5px">constant to maintain altitude</text><path d="M475 293.0L485.0 293.0" class="dk" style="stroke-width:2"/><path d="M491 293.0L485.0 295.7L485.0 290.3Z" class="dh" style=""/><rect x="492" y="281.0" width="218" height="24" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="502" y="298.0" style="font-size:13px">Roll out</text><circle cx="503" cy="319.0" r="2.2" class="ah"/><text class="s" x="512" y="323.0" style="font-size:11.5px">Opposite to the roll-in:</text><text class="s" x="512" y="338.0" style="font-size:11.5px">aileron and rudder toward the</text><text class="s" x="512" y="353.0" style="font-size:11.5px">high wing</text><circle cx="503" cy="368.0" r="2.2" class="ah"/><text class="s" x="512" y="372.0" style="font-size:11.5px">As the bank decreases, relax</text><text class="s" x="512" y="387.0" style="font-size:11.5px">elevator back pressure as</text><text class="s" x="512" y="402.0" style="font-size:11.5px">needed to maintain altitude</text><rect class="cl" x="20" y="459.0" width="690" height="66" rx="8"/><text class="t" x="32" y="479.0" style="font-size:13px">Rudder is needed most at</text><text class="s" x="32" y="499.0" style="font-size:12px">low airspeeds  |  high angles of attack  |  large aileron deflections  |  long wing spans make the yaw more evident</text><text class="s" x="32" y="517.0" style="font-size:12px">Rudder and fin are less effective at lower airspeeds, which magnifies the problem.</text><rect x="20" y="535.0" width="337" height="24" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30" y="552.0" style="font-size:13px">Design aids: reduce, do not eliminate</text><circle cx="31" cy="573.0" r="2.2" class="ah"/><text class="s" x="40" y="577.0" style="font-size:12px">Differential ailerons: the up aileron on the</text><text class="s" x="40" y="592.5" style="font-size:12px">descending wing goes up farther than the down</text><text class="s" x="40" y="608.0" style="font-size:12px">aileron goes down, adding drag on the descending</text><text class="s" x="40" y="623.5" style="font-size:12px">wing</text><circle cx="31" cy="639.0" r="2.2" class="ah"/><text class="s" x="40" y="643.0" style="font-size:12px">Frise-type: the raised aileron pivots on an</text><text class="s" x="40" y="658.5" style="font-size:12px">offset hinge, its leading edge projects into the</text><text class="s" x="40" y="674.0" style="font-size:12px">airflow and creates drag to equalize the lowered</text><text class="s" x="40" y="689.5" style="font-size:12px">one; it also forms a slot</text><rect x="373" y="535.0" width="337" height="24" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="383" y="552.0" style="font-size:13px">More aids, and the check</text><circle cx="384" cy="573.0" r="2.2" class="ah"/><text class="s" x="393" y="577.0" style="font-size:12px">Coupled ailerons and rudder: interconnect springs</text><text class="s" x="393" y="592.5" style="font-size:12px">deflect the rudder with the ailerons; the pilot</text><text class="s" x="393" y="608.0" style="font-size:12px">can override them to slip the airplane</text><circle cx="384" cy="623.5" r="2.2" class="ah"/><text class="s" x="393" y="627.5" style="font-size:12px">Flaperons: combine flaps and ailerons through a</text><text class="s" x="393" y="643.0" style="font-size:12px">mixer</text><circle cx="384" cy="658.5" r="2.2" class="ah"/><text class="s" x="393" y="662.5" style="font-size:12px">Coordinated rudder is still needed with ailerons.</text><text class="s" x="393" y="678.0" style="font-size:12px">If inadequate rudder is applied in a turn, a slip</text><text class="s" x="393" y="693.5" style="font-size:12px">results; too much, a skid; centering the ball</text><text class="s" x="393" y="709.0" style="font-size:12px">gives a coordinated turn</text></svg>
