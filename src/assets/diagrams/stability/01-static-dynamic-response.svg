<text class="t m" x="136.0" y="281.0" style="font-size:12.5px">Positive dynamic stability</text>
<text class="s m" x="136.0" y="297.0" style="font-size:11.5px">amplitude decreases; returns</text>
<text class="s m" x="136.0" y="312.0" style="font-size:11.5px">toward equilibrium</text>
<rect class="sky" x="254" y="125.0" width="208" height="134" rx="8" style="stroke:currentColor;stroke-width:1.2"/>
<path d="M262 193.0L454 193.0" class="dk" style="stroke-width:1.2;opacity:0.6;stroke-dasharray:6 5"/>
<path d="M262 131.0L262 253.0" class="dk" style="stroke-width:1.2;opacity:0.6"/>
<text class="s" x="268" y="141.0" style="font-size:10.5px">displacement</text>
<text class="s e" x="452" y="207.0" style="font-size:10.5px">time</text>
<path d="M268.0 193.0L270.2 187.3L272.4 181.7L274.7 176.6L276.9 172.0L279.1 168.1L281.4 165.2L283.6 163.1L285.8 162.1L288.0 162.2L290.2 163.3L292.5 165.4L294.7 168.5L296.9 172.5L299.1 177.1L301.4 182.3L303.6 187.9L305.8 193.6L308.1 199.4L310.3 204.9L312.5 209.9L314.7 214.5L316.9 218.2L319.2 221.1L321.4 223.0L323.6 223.9L325.9 223.8L328.1 222.5L330.3 220.3L332.5 217.1L334.8 213.0L337.0 208.3L339.2 203.1L341.4 197.5L343.6 191.7L345.9 186.0L348.1 180.6L350.3 175.5L352.6 171.1L354.8 167.4L357.0 164.6L359.2 162.8L361.4 162.0L363.7 162.3L365.9 163.7L368.1 166.0L370.4 169.3L372.6 173.4L374.8 178.2L377.0 183.5L379.2 189.1L381.5 194.9L383.7 200.6L385.9 206.0L388.1 211.0L390.4 215.4L392.6 218.9L394.8 221.6L397.1 223.3L399.3 224.0L401.5 223.6L403.7 222.1L405.9 219.6L408.2 216.3L410.4 212.1L412.6 207.2L414.9 201.9L417.1 196.2L419.3 190.5L421.5 184.8L423.8 179.4L426.0 174.5L428.2 170.2L430.4 166.7L432.6 164.1L434.9 162.5L437.1 162.0L439.3 162.5L441.6 164.1L443.8 166.7L446.0 170.2" class="acc" style="stroke-width:2.4;opacity:1"/>
<text class="t m" x="358.0" y="281.0" style="font-size:12.5px">Neutral dynamic stability</text>
<text class="s m" x="358.0" y="297.0" style="font-size:11.5px">amplitude neither decreases nor</text>
<text class="s m" x="358.0" y="312.0" style="font-size:11.5px">increases</text>
<rect class="rose" x="476" y="125.0" width="208" height="134" rx="8" style="stroke:currentColor;stroke-width:1.2"/>
<path d="M484 193.0L676 193.0" class="dk" style="stroke-width:1.2;opacity:0.6;stroke-dasharray:6 5"/>
<path d="M484 131.0L484 253.0" class="dk" style="stroke-width:1.2;opacity:0.6"/>
<text class="s" x="490" y="141.0" style="font-size:10.5px">displacement</text>
<text class="s e" x="674" y="207.0" style="font-size:10.5px">time</text>
<path d="M490.0 193.0L492.2 190.2L494.4 187.4L496.7 184.7L498.9 182.2L501.1 180.0L503.4 178.2L505.6 176.9L507.8 176.1L510.0 175.8L512.2 176.2L514.5 177.2L516.7 178.7L518.9 180.9L521.1 183.5L523.4 186.5L525.6 189.8L527.8 193.4L530.0 197.1L532.3 200.7L534.5 204.2L536.7 207.4L539.0 210.2L541.2 212.4L543.4 214.1L545.6 215.1L547.9 215.3L550.1 214.7L552.3 213.4L554.5 211.3L556.8 208.4L559.0 205.0L561.2 201.0L563.4 196.6L565.6 192.0L567.9 187.2L570.1 182.5L572.3 178.0L574.5 173.9L576.8 170.3L579.0 167.5L581.2 165.4L583.5 164.3L585.7 164.1L587.9 164.9L590.1 166.8L592.4 169.6L594.6 173.4L596.8 178.0L599.0 183.2L601.2 188.9L603.5 195.0L605.7 201.2L607.9 207.3L610.1 213.1L612.4 218.4L614.6 222.9L616.8 226.5L619.0 229.1L621.3 230.4L623.5 230.5L625.7 229.3L628.0 226.7L630.2 222.9L632.4 217.9L634.6 211.8L636.9 204.9L639.1 197.4L641.3 189.5L643.5 181.4L645.8 173.5L648.0 166.1L650.2 159.3L652.4 153.6L654.6 149.0L656.9 145.9L659.1 144.3L661.3 144.4L663.5 146.2L665.8 149.7L668.0 154.8" class="acc" style="stroke-width:2.4;opacity:1"/>
<text class="t m" x="580.0" y="281.0" style="font-size:12.5px">Negative dynamic stability</text>
<text class="s m" x="580.0" y="297.0" style="font-size:11.5px">amplitude increases; more</text>
<text class="s m" x="580.0" y="312.0" style="font-size:11.5px">divergent</text>
<text class="s" x="32" y="331.0" style="font-size:11.5px">Initial tendency (static) and overall tendency (dynamic) can differ, so the two are told apart.</text>
<rect x="20" y="349.0" width="337" height="24" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="30" y="366.0" style="font-size:13px">Hands-off check from PHAK</text>
<circle cx="31" cy="387.0" r="2.2" class="ah"/>
<text class="s" x="40" y="391.0" style="font-size:12px">Trim for hands-off level flight, then momentarily</text>
<text class="s" x="40" y="406.5" style="font-size:12px">push the nose down</text>
<circle cx="31" cy="422.0" r="2.2" class="ah"/>
<text class="s" x="40" y="426.0" style="font-size:12px">If the nose rises toward the original position</text>
<text class="s" x="40" y="441.5" style="font-size:12px">within a brief period, the airplane is statically</text>
<text class="s" x="40" y="457.0" style="font-size:12px">stable</text>
<circle cx="31" cy="472.5" r="2.2" class="ah"/>
<text class="s" x="40" y="476.5" style="font-size:12px">Usually the nose passes the original position and</text>
<text class="s" x="40" y="492.0" style="font-size:12px">slow pitching oscillations follow</text>
<circle cx="31" cy="507.5" r="2.2" class="ah"/>
<text class="s" x="40" y="511.5" style="font-size:12px">Oscillations gradually cease: positive stability.</text>
<text class="s" x="40" y="527.0" style="font-size:12px">Continue unevenly: neutral stability. Increase:</text>
<text class="s" x="40" y="542.5" style="font-size:12px">unstable</text>
<rect x="373" y="349.0" width="337" height="24" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="383" y="366.0" style="font-size:13px">Why stability matters</text>
<circle cx="384" cy="387.0" r="2.2" class="ah"/>
<text class="s" x="393" y="391.0" style="font-size:12px">Stability is the quality that makes the airplane</text>
<text class="s" x="393" y="406.5" style="font-size:12px">correct for conditions that disturb its</text>
<text class="s" x="393" y="422.0" style="font-size:12px">equilibrium</text>
<circle cx="384" cy="437.5" r="2.2" class="ah"/>
<text class="s" x="393" y="441.5" style="font-size:12px">Maneuverability: the quality that permits easy</text>
<text class="s" x="393" y="457.0" style="font-size:12px">maneuvering and withstanding maneuver stresses;</text>
<text class="s" x="393" y="472.5" style="font-size:12px">governed by weight, inertia, size and location of</text>
<text class="s" x="393" y="488.0" style="font-size:12px">controls, structural strength and powerplant</text>
<circle cx="384" cy="503.5" r="2.2" class="ah"/>
<text class="s" x="393" y="507.5" style="font-size:12px">Controllability: the capability to respond to the</text>
<text class="s" x="393" y="523.0" style="font-size:12px">pilot's control, regardless of its stability</text>
<text class="s" x="393" y="538.5" style="font-size:12px">characteristics</text>
<rect x="20" y="566.0" width="337" height="24" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="30" y="583.0" style="font-size:13px">Dutch roll (coupled lateral and directional)</text>
<circle cx="31" cy="604.0" r="2.2" class="ah"/>
<text class="s" x="40" y="608.0" style="font-size:12px">A right wing pushed down: the sideslip corrects</text>
<text class="s" x="40" y="623.5" style="font-size:12px">the wing before the nose is realigned with the</text>
<text class="s" x="40" y="639.0" style="font-size:12px">relative wind</text>
<circle cx="31" cy="654.5" r="2.2" class="ah"/>
<text class="s" x="40" y="658.5" style="font-size:12px">The nose makes a figure eight on the horizon:</text>
<text class="s" x="40" y="674.0" style="font-size:12px">roll and yaw oscillate about equally, out of</text>
<text class="s" x="40" y="689.5" style="font-size:12px">phase</text>
<circle cx="31" cy="705.0" r="2.2" class="ah"/>
<text class="s" x="40" y="709.0" style="font-size:12px">Usually dynamically stable but unsafe because of</text>
<text class="s" x="40" y="724.5" style="font-size:12px">the oscillation; in most modern aircraft except</text>
<text class="s" x="40" y="740.0" style="font-size:12px">high-speed swept wing designs it dies out in few</text>
<text class="s" x="40" y="755.5" style="font-size:12px">cycles</text>
<circle cx="31" cy="771.0" r="2.2" class="ah"/>
<text class="s" x="40" y="775.0" style="font-size:12px">Continuing Dutch roll: gyro-stabilized yaw</text>
<text class="s" x="40" y="790.5" style="font-size:12px">dampers</text>
<rect x="373" y="566.0" width="337" height="24" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="383" y="583.0" style="font-size:13px">Spiral instability</text>
<circle cx="384" cy="604.0" r="2.2" class="ah"/>
<text class="s" x="393" y="608.0" style="font-size:12px">Exists when static directional stability is very</text>
<text class="s" x="393" y="623.5" style="font-size:12px">strong compared with the dihedral effect</text>
<circle cx="384" cy="639.0" r="2.2" class="ah"/>
<text class="s" x="393" y="643.0" style="font-size:12px">After a gust and sideslip, the strong directional</text>
<text class="s" x="393" y="658.5" style="font-size:12px">stability yaws the nose into the relative wind</text>
<text class="s" x="393" y="674.0" style="font-size:12px">while the weak dihedral lags</text>
<circle cx="384" cy="689.5" r="2.2" class="ah"/>
<text class="s" x="393" y="693.5" style="font-size:12px">The outside wing travels faster, gains lift, and</text>
<text class="s" x="393" y="709.0" style="font-size:12px">the bank steepens; the nose goes lower: a slow</text>
<text class="s" x="393" y="724.5" style="font-size:12px">spiral that can become a steep spiral dive</text>
<circle cx="384" cy="740.0" r="2.2" class="ah"/>
<text class="s" x="393" y="744.0" style="font-size:12px">Divergence is usually so gradual the pilot</text>
<text class="s" x="393" y="759.5" style="font-size:12px">controls it easily; why an airplane cannot be</text>
<text class="s" x="393" y="775.0" style="font-size:12px">flown "hands off" indefinitely</text>
<rect class="cl" x="20" y="814.0" width="690" height="53.5" rx="8"/>
<circle cx="35" cy="836.0" r="2.2" class="ah"/>
<text class="s" x="44" y="840.0" style="font-size:12px">Most aircraft are designed with spiral instability, because Dutch roll tendencies are less desirable</text>
</svg>
