<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 881" role="img" aria-labelledby="ti de"><title id="ti">Static and dynamic stability: how a disturbed airplane responds</title><desc id="de">Schematic plots of displacement from equilibrium over time. Positive dynamic stability: the motion decreases in amplitude over time and returns toward equilibrium. Neutral dynamic stability: the displaced object neither decreases nor increases in amplitude, as with a worn automobile shock absorber. Negative dynamic stability: the motion increases and becomes more divergent. Static stability is the initial tendency to return to equilibrium; dynamic stability is the response over time. Hands-off check: trim for level flight, push the nose down; if the nose rises, the airplane is statically stable; oscillations that gradually cease mean positive stability, continuing unevenly neutral, increasing unstable. Dutch roll is a coupled roll and yaw oscillation that makes a figure eight with the nose; spiral instability is a slow divergent steepening bank when directional stability is strong compared with dihedral effect.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style>
<text class="t" x="20" y="28" style="font-size:15px">Static and dynamic stability: how a disturbed airplane responds</text>
<text class="s" x="20" y="50.0" style="font-size:13px">Static stability is the initial tendency after a disturbance; dynamic stability is the response over</text>
<text class="s" x="20" y="66.5" style="font-size:13px">time. Plots are schematic (PHAK Figure 5-22 is a picture; only the text definitions are used).</text>
<rect class="cl" x="20" y="89.0" width="690" height="250" rx="8"/>
<text class="t" x="32" y="111.0" style="font-size:13px">Displacement from equilibrium over time after a disturbance (schematic)</text>
<rect class="mint" x="32" y="125.0" width="208" height="134" rx="8" style="stroke:currentColor;stroke-width:1.2"/>
<path d="M40 193.0L232 193.0" class="dk" style="stroke-width:1.2;opacity:0.6;stroke-dasharray:6 5"/>
<path d="M40 131.0L40 253.0" class="dk" style="stroke-width:1.2;opacity:0.6"/>
<text class="s" x="46" y="141.0" style="font-size:10.5px">displacement</text>
<text class="s e" x="230" y="207.0" style="font-size:10.5px">time</text>
