<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 881" role="img" aria-labelledby="ti de"><title id="ti">Static and dynamic stability: how a disturbed airplane responds</title><desc id="de">Schematic plots of displacement from equilibrium over time. Positive dynamic stability: the motion decreases in amplitude over time and returns toward equilibrium. Neutral dynamic stability: the displaced object neither decreases nor increases in amplitude, as with a worn automobile shock absorber. Negative dynamic stability: the motion increases and becomes more divergent. Static stability is the initial tendency to return to equilibrium; dynamic stability is the response over time. Hands-off check: trim for level flight, push the nose down; if the nose rises, the airplane is statically stable; oscillations that gradually cease mean positive stability, continuing unevenly neutral, increasing unstable. Dutch roll is a coupled roll and yaw oscillation that makes a figure eight with the nose; spiral instability is a slow divergent steepening bank when directional stability is strong compared with dihedral effect.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:12px}.q1{font-size:13px}.q2{font-size:11.5px}.q3{font-size:10.5px}.q4{stroke:currentColor;stroke-width:1.5}.q5{stroke:currentColor;stroke-width:1.2}.q6{stroke-width:1.2;opacity:0.6;stroke-dasharray:6 5}.q7{stroke-width:1.2;opacity:0.6}.q8{stroke-width:2.4;opacity:1}.q9{font-size:12.5px}</style><text class="t" x="20" y="28" style="font-size:15px">Static and dynamic stability: how a disturbed airplane responds</text><text class="s q1" x="20" y="50">Static stability is the initial tendency after a disturbance; dynamic stability is the response over</text><text class="s q1" x="20" y="66.5">time. Plots are schematic (PHAK Figure 5-22 is a picture; only the text definitions are used).</text><rect class="cl" x="20" y="89" width="690" height="250" rx="8"/><text class="t q1" x="32" y="111">Displacement from equilibrium over time after a disturbance (schematic)</text><rect class="mint q5" x="32" y="125" width="208" height="134" rx="8"/><path d="M40 193L232 193" class="dk q6"/><path d="M40 131L40 253" class="dk q7"/><text class="s q3" x="46" y="141">displacement</text><text class="s e q3" x="230" y="207">time</text><path d="M46 193L48.2 184.1L50.5 176.2L52.7 169.4L54.9 164L57.1 160L59.4 157.4L61.6 156.2L63.8 156.5L66 157.9L68.2 160.5L70.5 164L72.7 168.2L74.9 173L77.2 178.1L79.4 183.4L81.6 188.6L83.8 193.5L86 198.1L88.3 202.2L90.5 205.6L92.7 208.3L95 210.3L97.2 211.6L99.4 212.1L101.6 211.9L103.8 211.1L106.1 209.7L108.3 207.9L110.5 205.6L112.8 203.1L115 200.4L117.2 197.7L119.4 195L121.7 192.5L123.9 190.1L126.1 188L128.3 186.3L130.6 184.9L132.8 183.9L135 183.3L137.2 183.1L139.4 183.2L141.7 183.7L143.9 184.4L146.1 185.4L148.3 186.6L150.6 187.9L152.8 189.3L155 190.7L157.2 192.1L159.5 193.4L161.7 194.6L163.9 195.7L166.2 196.6L168.4 197.3L170.6 197.8L172.8 198.1L175.1 198.2L177.3 198.1L179.5 197.8L181.7 197.4L183.9 196.9L186.2 196.3L188.4 195.6L190.6 194.8L192.8 194.1L195.1 193.4L197.3 192.7L199.5 192.1L201.8 191.5L204 191.1L206.2 190.7L208.4 190.5L210.7 190.4L212.9 190.3L215.1 190.4L217.3 190.5L219.6 190.7L221.8 191L224 191.3" class="acc q8"/><text class="t m q9" x="136" y="281">Positive dynamic stability</text><text class="s m q2" x="136" y="297">amplitude decreases; returns</text><text class="s m q2" x="136" y="312">toward equilibrium</text><rect class="sky q5" x="254" y="125" width="208" height="134" rx="8"/><path d="M262 193L454 193" class="dk q6"/><path d="M262 131L262 253" class="dk q7"/><text class="s q3" x="268" y="141">displacement</text><text class="s e q3" x="452" y="207">time</text><path d="M268 193L270.2 187.3L272.4 181.7L274.7 176.6L276.9 172L279.1 168.1L281.4 165.2L283.6 163.1L285.8 162.1L288 162.2L290.2 163.3L292.5 165.4L294.7 168.5L296.9 172.5L299.1 177.1L301.4 182.3L303.6 187.9L305.8 193.6L308.1 199.4L310.3 204.9L312.5 209.9L314.7 214.5L316.9 218.2L319.2 221.1L321.4 223L323.6 223.9L325.9 223.8L328.1 222.5L330.3 220.3L332.5 217.1L334.8 213L337 208.3L339.2 203.1L341.4 197.5L343.6 191.7L345.9 186L348.1 180.6L350.3 175.5L352.6 171.1L354.8 167.4L357 164.6L359.2 162.8L361.4 162L363.7 162.3L365.9 163.7L368.1 166L370.4 169.3L372.6 173.4L374.8 178.2L377 183.5L379.2 189.1L381.5 194.9L383.7 200.6L385.9 206L388.1 211L390.4 215.4L392.6 218.9L394.8 221.6L397.1 223.3L399.3 224L401.5 223.6L403.7 222.1L405.9 219.6L408.2 216.3L410.4 212.1L412.6 207.2L414.9 201.9L417.1 196.2L419.3 190.5L421.5 184.8L423.8 179.4L426 174.5L428.2 170.2L430.4 166.7L432.6 164.1L434.9 162.5L437.1 162L439.3 162.5L441.6 164.1L443.8 166.7L446 170.2" class="acc q8"/><text class="t m q9" x="358" y="281">Neutral dynamic stability</text><text class="s m q2" x="358" y="297">amplitude neither decreases nor</text><text class="s m q2" x="358" y="312">increases</text><rect class="rose q5" x="476" y="125" width="208" height="134" rx="8"/><path d="M484 193L676 193" class="dk q6"/><path d="M484 131L484 253" class="dk q7"/><text class="s q3" x="490" y="141">displacement</text><text class="s e q3" x="674" y="207">time</text><path d="M490 193L492.2 190.2L494.4 187.4L496.7 184.7L498.9 182.2L501.1 180L503.4 178.2L505.6 176.9L507.8 176.1L510 175.8L512.2 176.2L514.5 177.2L516.7 178.7L518.9 180.9L521.1 183.5L523.4 186.5L525.6 189.8L527.8 193.4L530 197.1L532.3 200.7L534.5 204.2L536.7 207.4L539 210.2L541.2 212.4L543.4 214.1L545.6 215.1L547.9 215.3L550.1 214.7L552.3 213.4L554.5 211.3L556.8 208.4L559 205L561.2 201L563.4 196.6L565.6 192L567.9 187.2L570.1 182.5L572.3 178L574.5 173.9L576.8 170.3L579 167.5L581.2 165.4L583.5 164.3L585.7 164.1L587.9 164.9L590.1 166.8L592.4 169.6L594.6 173.4L596.8 178L599 183.2L601.2 188.9L603.5 195L605.7 201.2L607.9 207.3L610.1 213.1L612.4 218.4L614.6 222.9L616.8 226.5L619 229.1L621.3 230.4L623.5 230.5L625.7 229.3L628 226.7L630.2 222.9L632.4 217.9L634.6 211.8L636.9 204.9L639.1 197.4L641.3 189.5L643.5 181.4L645.8 173.5L648 166.1L650.2 159.3L652.4 153.6L654.6 149L656.9 145.9L659.1 144.3L661.3 144.4L663.5 146.2L665.8 149.7L668 154.8" class="acc q8"/><text class="t m q9" x="580" y="281">Negative dynamic stability</text><text class="s m q2" x="580" y="297">amplitude increases; more</text><text class="s m q2" x="580" y="312">divergent</text><text class="s q2" x="32" y="331">Initial tendency (static) and overall tendency (dynamic) can differ, so the two are told apart.</text><rect x="20" y="349" width="337" height="24" rx="10" class="sky q4"/><text class="t q1" x="30" y="366">Hands-off check from PHAK</text><circle cx="31" cy="387" r="2.2" class="ah"/><text class="s q0" x="40" y="391">Trim for hands-off level flight, then momentarily</text><text class="s q0" x="40" y="406.5">push the nose down</text><circle cx="31" cy="422" r="2.2" class="ah"/><text class="s q0" x="40" y="426">If the nose rises toward the original position</text><text class="s q0" x="40" y="441.5">within a brief period, the airplane is statically</text><text class="s q0" x="40" y="457">stable</text><circle cx="31" cy="472.5" r="2.2" class="ah"/><text class="s q0" x="40" y="476.5">Usually the nose passes the original position and</text><text class="s q0" x="40" y="492">slow pitching oscillations follow</text><circle cx="31" cy="507.5" r="2.2" class="ah"/><text class="s q0" x="40" y="511.5">Oscillations gradually cease: positive stability.</text><text class="s q0" x="40" y="527">Continue unevenly: neutral stability. Increase:</text><text class="s q0" x="40" y="542.5">unstable</text><rect x="373" y="349" width="337" height="24" rx="10" class="lav q4"/><text class="t q1" x="383" y="366">Why stability matters</text><circle cx="384" cy="387" r="2.2" class="ah"/><text class="s q0" x="393" y="391">Stability is the quality that makes the airplane</text><text class="s q0" x="393" y="406.5">correct for conditions that disturb its</text><text class="s q0" x="393" y="422">equilibrium</text><circle cx="384" cy="437.5" r="2.2" class="ah"/><text class="s q0" x="393" y="441.5">Maneuverability: the quality that permits easy</text><text class="s q0" x="393" y="457">maneuvering and withstanding maneuver stresses;</text><text class="s q0" x="393" y="472.5">governed by weight, inertia, size and location of</text><text class="s q0" x="393" y="488">controls, structural strength and powerplant</text><circle cx="384" cy="503.5" r="2.2" class="ah"/><text class="s q0" x="393" y="507.5">Controllability: the capability to respond to the</text><text class="s q0" x="393" y="523">pilot's control, regardless of its stability</text><text class="s q0" x="393" y="538.5">characteristics</text><rect x="20" y="566" width="337" height="24" rx="10" class="mint q4"/><text class="t q1" x="30" y="583">Dutch roll (coupled lateral and directional)</text><circle cx="31" cy="604" r="2.2" class="ah"/><text class="s q0" x="40" y="608">A right wing pushed down: the sideslip corrects</text><text class="s q0" x="40" y="623.5">the wing before the nose is realigned with the</text><text class="s q0" x="40" y="639">relative wind</text><circle cx="31" cy="654.5" r="2.2" class="ah"/><text class="s q0" x="40" y="658.5">The nose makes a figure eight on the horizon:</text><text class="s q0" x="40" y="674">roll and yaw oscillate about equally, out of</text><text class="s q0" x="40" y="689.5">phase</text><circle cx="31" cy="705" r="2.2" class="ah"/><text class="s q0" x="40" y="709">Usually dynamically stable but unsafe because of</text><text class="s q0" x="40" y="724.5">the oscillation; in most modern aircraft except</text><text class="s q0" x="40" y="740">high-speed swept wing designs it dies out in few</text><text class="s q0" x="40" y="755.5">cycles</text><circle cx="31" cy="771" r="2.2" class="ah"/><text class="s q0" x="40" y="775">Continuing Dutch roll: gyro-stabilized yaw</text><text class="s q0" x="40" y="790.5">dampers</text><rect x="373" y="566" width="337" height="24" rx="10" class="rose q4"/><text class="t q1" x="383" y="583">Spiral instability</text><circle cx="384" cy="604" r="2.2" class="ah"/><text class="s q0" x="393" y="608">Exists when static directional stability is very</text><text class="s q0" x="393" y="623.5">strong compared with the dihedral effect</text><circle cx="384" cy="639" r="2.2" class="ah"/><text class="s q0" x="393" y="643">After a gust and sideslip, the strong directional</text><text class="s q0" x="393" y="658.5">stability yaws the nose into the relative wind</text><text class="s q0" x="393" y="674">while the weak dihedral lags</text><circle cx="384" cy="689.5" r="2.2" class="ah"/><text class="s q0" x="393" y="693.5">The outside wing travels faster, gains lift, and</text><text class="s q0" x="393" y="709">the bank steepens; the nose goes lower: a slow</text><text class="s q0" x="393" y="724.5">spiral that can become a steep spiral dive</text><circle cx="384" cy="740" r="2.2" class="ah"/><text class="s q0" x="393" y="744">Divergence is usually so gradual the pilot</text><text class="s q0" x="393" y="759.5">controls it easily; why an airplane cannot be</text><text class="s q0" x="393" y="775">flown "hands off" indefinitely</text><rect class="cl" x="20" y="814" width="690" height="53.5" rx="8"/><circle cx="35" cy="836" r="2.2" class="ah"/><text class="s q0" x="44" y="840">Most aircraft are designed with spiral instability, because Dutch roll tendencies are less desirable</text></svg>
