<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 688" role="img" aria-labelledby="ti de"><title id="ti">Crosswind and headwind component chart: how to read it</title><desc id="de">Find the angle between the runway heading and the wind direction, follow that angle line out to the wind speed, then draw a line straight across to read the headwind component and straight down to read the crosswind component. PHAK sample problem: runway 17, wind 140 degrees at 25 knots gives a 30 degree angle, 22 knots headwind and 13 knots crosswind. An invented Example is also shown. Certification tests use crosswinds up to 0.2 times the power-off, gear and flaps down stall speed; the maximum demonstrated crosswind is in the AFM/POH.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style>
<text class="t" x="20" y="28" style="font-size:15px">Crosswind and headwind component chart: how to read it</text>
<text class="s" x="20" y="50.0" style="font-size:13px">The chart turns a reported wind into two numbers: the part that blows along the runway (headwind) and</text>
<text class="s" x="20" y="66.5" style="font-size:13px">the part that blows across it (crosswind). The layout below is a schematic of that idea; the chart in</text>
<text class="s" x="20" y="83.0" style="font-size:13px">your AFM/POH may be arranged differently.</text>
<rect class="cl" x="20" y="107.5" width="372" height="392.5" rx="8"/>
<path d="M64 334A90 90 0 0 1 154 424" class="dk" style="stroke-width:1.3;opacity:.55"/>
<text class="s e" x="58" y="338" style="font-size:11px">10</text>
<text class="s m" x="154" y="439" style="font-size:11px">10</text>
<path d="M64 244A180 180 0 0 1 244 424" class="dk" style="stroke-width:1.3;opacity:.55"/>
<text class="s e" x="58" y="248" style="font-size:11px">20</text>
<text class="s m" x="244" y="439" style="font-size:11px">20</text>
<path d="M64 154A270 270 0 0 1 334 424" class="dk" style="stroke-width:1.3;opacity:.55"/>
<text class="s e" x="58" y="158" style="font-size:11px">30</text>
<text class="s m" x="334" y="439" style="font-size:11px">30</text>
<path d="M64 424L133.8811421776806 163.20002690195156" class="dk" style="stroke-width:1.2;opacity:0.6"/>
<text class="t m" x="137.5046088091159" y="153.67706533390458" style="font-size:11px">15°</text>
<path d="M64 424L198.99999999999997 190.17314097820156" class="dk" style="stroke-width:1.2;opacity:0.6"/>
<text class="t m" x="205.99999999999997" y="182.0487853252194" style="font-size:11px">30°</text>
<path d="M64 424L254.9188309203678 233.08116907963216" class="dk" style="stroke-width:1.2;opacity:0.6"/>
<text class="t m" x="264.81832585697947" y="227.1816741430205" style="font-size:11px">45°</text>
<path d="M64 424L297.82685902179844 289.0" class="dk" style="stroke-width:1.2;opacity:0.6"/>
<text class="t m" x="309.95121467478054" y="286.0" style="font-size:11px">60°</text>
<path d="M64 424L324.79997309804844 354.1188578223194" class="dk" style="stroke-width:1.2;opacity:0.6"/>
<text class="t m" x="338.3229346660954" y="354.4953911908841" style="font-size:11px">75°</text>
<path d="M64 424L64 154" class="dk" style="stroke-width:2.5;opacity:1"/>
<path d="M64 424L334 424" class="dk" style="stroke-width:2.5;opacity:1"/>
<text class="t" x="70" y="123.5" style="font-size:11.5px">Headwind component (kt)</text>
<text class="t e" x="330" y="456" style="font-size:11.5px">Crosswind component (kt)</text>
<text class="s" x="32" y="478" style="font-size:11px">Thin radial lines are wind angles from the runway.</text>
<path d="M64 229.1442841485013L176.5 229.1442841485013" class="dk" style="stroke-width:1.6;opacity:0.9;stroke-dasharray:6 5"/>
<path d="M176.5 229.1442841485013L176.5 424" class="dk" style="stroke-width:1.6;opacity:0.9;stroke-dasharray:6 5"/>
<circle cx="176.5" cy="229.1" r="6" class="ah"/>
<text class="t" x="68" y="223.1442841485013" style="font-size:12px">22</text>
<text class="t" x="180.5" y="416" style="font-size:12px">13</text>
<path d="M64 308.2982302564229L201.88799976141604 308.2982302564229" class="dk" style="stroke-width:1.4;opacity:0.7;stroke-dasharray:6 5"/>
<path d="M201.88799976141604 308.2982302564229L201.88799976141604 424" class="dk" style="stroke-width:1.4;opacity:0.7;stroke-dasharray:6 5"/>
<circle cx="201.9" cy="308.3" r="5.5" class="cl" style="stroke:currentColor;stroke-width:2"/>
<text class="t" x="68" y="302.2982302564229" style="font-size:12px">13</text>
<text class="t" x="205.88799976141604" y="416" style="font-size:12px">15</text>
<rect x="408" y="107.5" width="302" height="24" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="418" y="124.5" style="font-size:13px">1. Find the angle</text>
<circle cx="419" cy="145.5" r="2.2" class="ah"/>
<text class="s" x="428" y="149.5" style="font-size:12px">Runway 17 means a heading of 170°</text>
<circle cx="419" cy="165.0" r="2.2" class="ah"/>
<text class="s" x="428" y="169.0" style="font-size:12px">Subtract the wind direction (140°): 30° is</text>
<text class="s" x="428" y="184.5" style="font-size:12px">the wind angle</text>
<rect x="408" y="212.0" width="302" height="24" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="418" y="229.0" style="font-size:13px">2. Follow that line out to the speed</text>
<circle cx="419" cy="250.0" r="2.2" class="ah"/>
<text class="s" x="428" y="254.0" style="font-size:12px">Locate the angle mark and draw a line from</text>
<text class="s" x="428" y="269.5" style="font-size:12px">there until it meets the wind velocity (25</text>
<text class="s" x="428" y="285.0" style="font-size:12px">knots)</text>
<rect x="408" y="312.5" width="302" height="24" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="418" y="329.5" style="font-size:13px">3. Read both components</text>
<circle cx="419" cy="350.5" r="2.2" class="ah"/>
<text class="s" x="428" y="354.5" style="font-size:12px">From that point draw a line straight across</text>
<text class="s" x="428" y="370.0" style="font-size:12px">and one straight down</text>
<circle cx="419" cy="385.5" r="2.2" class="ah"/>
<text class="s" x="428" y="389.5" style="font-size:12px">Headwind component 22 knots and crosswind</text>
<text class="s" x="428" y="405.0" style="font-size:12px">component 13 knots (PHAK sample problem 10)</text>
<rect x="408" y="432.5" width="302" height="24" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="418" y="449.5" style="font-size:13px">Example (invented, not a real aircraft)</text>
<circle cx="419" cy="470.5" r="2.2" class="ah"/>
<text class="s" x="428" y="474.5" style="font-size:12px">Runway 27, wind 220° at 20 knots</text>
<circle cx="419" cy="490.0" r="2.2" class="ah"/>
<text class="s" x="428" y="494.0" style="font-size:12px">Angle 50° gives about 13 knots of headwind</text>
<text class="s" x="428" y="509.5" style="font-size:12px">and 15 knots of crosswind</text>
<text class="s" x="32" y="492" style="font-size:11px">Solid dot: PHAK, 30°, 25 kt. Open dot: Example, 50°, 20 kt</text>
<rect class="cl" x="20" y="539.0" width="690" height="139.0" rx="8"/>
<circle cx="35" cy="561.0" r="2.2" class="ah"/>
<text class="s" x="44" y="565.0" style="font-size:12px">Why it matters: to pick the right runway when there is more than one, and so the airplane is not pushed</text>
<text class="s" x="44" y="580.5" style="font-size:12px">beyond its tested limits</text>
<circle cx="35" cy="596.0" r="2.2" class="ah"/>
<text class="s" x="44" y="600.0" style="font-size:12px">Tested limit: certification tests use a 90° crosswind up to 0.2 VS0 (stall speed power off, gear and</text>
<text class="s" x="44" y="615.5" style="font-size:12px">flaps down). With a 45-knot stall speed that is a 9-knot crosswind</text>
<circle cx="35" cy="631.0" r="2.2" class="ah"/>
<text class="s" x="44" y="635.0" style="font-size:12px">The maximum demonstrated crosswind component is published in the AFM/POH. It is a tested value, not a</text>
<text class="s" x="44" y="650.5" style="font-size:12px">legal limit</text>
</svg>
