<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 688" role="img" aria-labelledby="ti de"><title id="ti">Crosswind and headwind component chart: how to read it</title><desc id="de">Find the angle between the runway heading and the wind direction, follow that angle line out to the wind speed, then draw a line straight across to read the headwind component and straight down to read the crosswind component. PHAK sample problem: runway 17, wind 140 degrees at 25 knots gives a 30 degree angle, 22 knots headwind and 13 knots crosswind. An invented Example is also shown. Certification tests use crosswinds up to 0.2 times the power-off, gear and flaps down stall speed; the maximum demonstrated crosswind is in the AFM/POH.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:12px}.q1{font-size:11px}.q2{font-size:13px}.q3{stroke-width:1.2;opacity:0.6}.q4{stroke:currentColor;stroke-width:1.5}.q5{stroke-width:1.3;opacity:.55}.q6{stroke-width:2.5;opacity:1}.q7{stroke-width:1.6;opacity:0.9;stroke-dasharray:6 5}.q8{stroke-width:1.4;opacity:0.7;stroke-dasharray:6 5}</style><text class="t" x="20" y="28" style="font-size:15px">Crosswind and headwind component chart: how to read it</text><text class="s q2" x="20" y="50">The chart turns a reported wind into two numbers: the part that blows along the runway (headwind) and</text><text class="s q2" x="20" y="66.5">the part that blows across it (crosswind). The layout below is a schematic of that idea; the chart in</text><text class="s q2" x="20" y="83">your AFM/POH may be arranged differently.</text><rect class="cl" x="20" y="107.5" width="372" height="392.5" rx="8"/><path d="M64 334A90 90 0 0 1 154 424" class="dk q5"/><text class="s e q1" x="58" y="338">10</text><text class="s m q1" x="154" y="439">10</text><path d="M64 244A180 180 0 0 1 244 424" class="dk q5"/><text class="s e q1" x="58" y="248">20</text><text class="s m q1" x="244" y="439">20</text><path d="M64 154A270 270 0 0 1 334 424" class="dk q5"/><text class="s e q1" x="58" y="158">30</text><text class="s m q1" x="334" y="439">30</text><path d="M64 424L133.88 163.2" class="dk q3"/><text class="t m q1" x="137.5" y="153.68">15°</text><path d="M64 424L199 190.17" class="dk q3"/><text class="t m q1" x="206" y="182.05">30°</text><path d="M64 424L254.92 233.08" class="dk q3"/><text class="t m q1" x="264.82" y="227.18">45°</text><path d="M64 424L297.83 289" class="dk q3"/><text class="t m q1" x="309.95" y="286">60°</text><path d="M64 424L324.8 354.12" class="dk q3"/><text class="t m q1" x="338.32" y="354.5">75°</text><path d="M64 424L64 154" class="dk q6"/><path d="M64 424L334 424" class="dk q6"/><text class="t" x="70" y="123.5" style="font-size:11.5px">Headwind component (kt)</text><text class="t e" x="330" y="456" style="font-size:11.5px">Crosswind component (kt)</text><text class="s q1" x="32" y="478">Thin radial lines are wind angles from the runway.</text><path d="M64 229.14L176.5 229.14" class="dk q7"/><path d="M176.5 229.14L176.5 424" class="dk q7"/><circle cx="176.5" cy="229.1" r="6" class="ah"/><text class="t q0" x="68" y="223.14">22</text><text class="t q0" x="180.5" y="416">13</text><path d="M64 308.3L201.89 308.3" class="dk q8"/><path d="M201.89 308.3L201.89 424" class="dk q8"/><circle cx="201.9" cy="308.3" r="5.5" class="cl" style="stroke:currentColor;stroke-width:2"/><text class="t q0" x="68" y="302.3">13</text><text class="t q0" x="205.89" y="416">15</text><rect x="408" y="107.5" width="302" height="24" rx="10" class="sky q4"/><text class="t q2" x="418" y="124.5">1. Find the angle</text><circle cx="419" cy="145.5" r="2.2" class="ah"/><text class="s q0" x="428" y="149.5">Runway 17 means a heading of 170°</text><circle cx="419" cy="165" r="2.2" class="ah"/><text class="s q0" x="428" y="169">Subtract the wind direction (140°): 30° is</text><text class="s q0" x="428" y="184.5">the wind angle</text><rect x="408" y="212" width="302" height="24" rx="10" class="mint q4"/><text class="t q2" x="418" y="229">2. Follow that line out to the speed</text><circle cx="419" cy="250" r="2.2" class="ah"/><text class="s q0" x="428" y="254">Locate the angle mark and draw a line from</text><text class="s q0" x="428" y="269.5">there until it meets the wind velocity (25</text><text class="s q0" x="428" y="285">knots)</text><rect x="408" y="312.5" width="302" height="24" rx="10" class="lav q4"/><text class="t q2" x="418" y="329.5">3. Read both components</text><circle cx="419" cy="350.5" r="2.2" class="ah"/><text class="s q0" x="428" y="354.5">From that point draw a line straight across</text><text class="s q0" x="428" y="370">and one straight down</text><circle cx="419" cy="385.5" r="2.2" class="ah"/><text class="s q0" x="428" y="389.5">Headwind component 22 knots and crosswind</text><text class="s q0" x="428" y="405">component 13 knots (PHAK sample problem 10)</text><rect x="408" y="432.5" width="302" height="24" rx="10" class="rose q4"/><text class="t q2" x="418" y="449.5">Example (invented, not a real aircraft)</text><circle cx="419" cy="470.5" r="2.2" class="ah"/><text class="s q0" x="428" y="474.5">Runway 27, wind 220° at 20 knots</text><circle cx="419" cy="490" r="2.2" class="ah"/><text class="s q0" x="428" y="494">Angle 50° gives about 13 knots of headwind</text><text class="s q0" x="428" y="509.5">and 15 knots of crosswind</text><text class="s q1" x="32" y="492">Solid dot: PHAK, 30°, 25 kt. Open dot: Example, 50°, 20 kt</text><rect class="cl" x="20" y="539" width="690" height="139" rx="8"/><circle cx="35" cy="561" r="2.2" class="ah"/><text class="s q0" x="44" y="565">Why it matters: to pick the right runway when there is more than one, and so the airplane is not pushed</text><text class="s q0" x="44" y="580.5">beyond its tested limits</text><circle cx="35" cy="596" r="2.2" class="ah"/><text class="s q0" x="44" y="600">Tested limit: certification tests use a 90° crosswind up to 0.2 VS0 (stall speed power off, gear and</text><text class="s q0" x="44" y="615.5">flaps down). With a 45-knot stall speed that is a 9-knot crosswind</text><circle cx="35" cy="631" r="2.2" class="ah"/><text class="s q0" x="44" y="635">The maximum demonstrated crosswind component is published in the AFM/POH. It is a tested value, not a</text><text class="s q0" x="44" y="650.5">legal limit</text></svg>
