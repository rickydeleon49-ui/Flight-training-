<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 667" role="img" aria-labelledby="ti de"><title id="ti">Reading a takeoff distance chart: ground roll and 50-foot obstacle</title><desc id="de">A takeoff chart gives the ground roll and the total distance to clear a 50-foot obstacle. PHAK sample problem 2: 2,000 feet pressure altitude, 22 degrees C, 2,600 pounds, 6 knot headwind gives a 700 foot ground roll and 1,400 feet over a 50-foot obstacle, with 63 knots at lift-off and 68 knots over the obstacle. Sample problem 3 uses the short-field table: 1,325 feet and 2,480 feet, minus 10 percent for each 9 knots of headwind, gives 1,060 and 1,984 feet.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style>
<text class="t" x="20" y="28" style="font-size:15px">Reading a takeoff distance chart: ground roll and 50-foot obstacle</text>
<text class="s" x="20" y="50.0" style="font-size:13px">Takeoff charts give the ground roll and the total distance needed to clear a 50-foot obstacle, for</text>
<text class="s" x="20" y="66.5" style="font-size:13px">different weights, altitudes, temperatures and winds. Profile below is schematic (height not to</text>
<text class="s" x="20" y="83.0" style="font-size:13px">scale); numbers are from the PHAK sample problems.</text>
<rect class="cl" x="20" y="105.5" width="690" height="214" rx="8"/>
<path d="M30 255.5L700 255.5" class="dk" style="stroke-width:2.5;opacity:1"/>
<path d="M30 256.5L20 263.5" class="dk" style="stroke-width:1;opacity:0.4"/>
<path d="M126 256.5L116 263.5" class="dk" style="stroke-width:1;opacity:0.4"/>
<path d="M222 256.5L212 263.5" class="dk" style="stroke-width:1;opacity:0.4"/>
<path d="M318 256.5L308 263.5" class="dk" style="stroke-width:1;opacity:0.4"/>
<path d="M414 256.5L404 263.5" class="dk" style="stroke-width:1;opacity:0.4"/>
<path d="M510 256.5L500 263.5" class="dk" style="stroke-width:1;opacity:0.4"/>
<path d="M606 256.5L596 263.5" class="dk" style="stroke-width:1;opacity:0.4"/>
<path d="M702 256.5L692 263.5" class="dk" style="stroke-width:1;opacity:0.4"/>
<path d="M68.0 245.5L51.9 250.6L51.9 240.4Z" class="ah"/>
<text class="s" x="52" y="233.5" style="font-size:11px">Start</text>
<path d="M72 245.5L330.0 245.5" class="dk" style="stroke-width:2.5;opacity:0.9"/>
<circle cx="330.0" cy="245.5" r="5" class="ah"/>
<path d="M330.0 245.5L610.0 185.5" class="acc" style="stroke-width:3;opacity:1"/>
<path d="M610.0 255.5L610.0 187.5" class="dk" style="stroke-width:3;opacity:1"/>
<path d="M610.0 187.5L634.0 193.5L610.0 201.5Z" class="ah"/>
<text class="t m" x="330.0" y="231.5" style="font-size:12px">Lift-off: 63 kt</text>
<text class="t e" x="604.0" y="175.5" style="font-size:12px">50-ft obstacle: 68 kt</text>
<text class="t" x="644.0" y="199.5" style="font-size:12px">50 ft</text>
<path d="M50 281.5L323.0 281.5" class="dk" style="stroke-width:1.8"/><path d="M330.0 281.5L323.0 284.6L323.0 278.4Z" class="dh" style=""/>
<path d="M330.0 281.5L57.0 281.5" class="dk" style="stroke-width:1.8"/><path d="M50 281.5L57.0 278.4L57.0 284.6Z" class="dh" style=""/>
<text class="t m" x="190.0" y="276.5" style="font-size:12px">Ground roll 700 ft</text>
<path d="M330.0 251.5L330.0 277.5" class="dk" style="stroke-width:1;opacity:0.5;stroke-dasharray:6 5"/>
<path d="M50 309.5L603.0 309.5" class="dk" style="stroke-width:1.8"/><path d="M610.0 309.5L603.0 312.6L603.0 306.4Z" class="dh" style=""/>
<path d="M610.0 309.5L57.0 309.5" class="dk" style="stroke-width:1.8"/><path d="M50 309.5L57.0 306.4L57.0 312.6Z" class="dh" style=""/>
<text class="t m" x="330.0" y="304.5" style="font-size:12px">Total distance over a 50-ft obstacle: 1,400 ft</text>
<path d="M610.0 259.5L610.0 305.5" class="dk" style="stroke-width:1;opacity:0.5;stroke-dasharray:6 5"/>
<text class="s" x="24" y="125.5" style="font-size:11.5px">PHAK sample problem 2: 2,000 ft pressure altitude, 22 °C, 2,600 lb, 6 kt headwind</text>
<text class="t" x="20" y="337.5" style="font-size:13px">Combined graph (Figure 11-23): the path your pencil takes</text>
<rect x="20.0" y="345.5" width="120.4" height="44" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="80.2" y="364.0833333333333" style="font-size:11.5px">Temperature</text>
<text class="t m" x="80.2" y="378.5833333333333" style="font-size:11.5px">22 °C</text>
<path d="M142.4 367.5L153.4 367.5" class="dk" style="stroke-width:2"/><path d="M160.4 367.5L153.4 370.6L153.4 364.4Z" class="dh" style=""/>
<rect x="162.4" y="345.5" width="120.4" height="44" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="222.60000000000002" y="364.0833333333333" style="font-size:11.5px">Pressure alt.</text>
<text class="t m" x="222.60000000000002" y="378.5833333333333" style="font-size:11.5px">2,000 ft</text>
<path d="M284.8 367.5L295.8 367.5" class="dk" style="stroke-width:2"/><path d="M302.8 367.5L295.8 370.6L295.8 364.4Z" class="dh" style=""/>
<rect x="304.8" y="345.5" width="120.4" height="44" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="365.0" y="364.0833333333333" style="font-size:11.5px">Weight</text>
<text class="t m" x="365.0" y="378.5833333333333" style="font-size:11.5px">2,600 lb</text>
<path d="M427.20000000000005 367.5L438.2 367.5" class="dk" style="stroke-width:2"/><path d="M445.20000000000005 367.5L438.2 370.6L438.2 364.4Z" class="dh" style=""/>
<rect x="447.20000000000005" y="345.5" width="120.4" height="44" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="507.40000000000003" y="364.0833333333333" style="font-size:11.5px">Headwind</text>
<text class="t m" x="507.40000000000003" y="378.5833333333333" style="font-size:11.5px">6 kt</text>
<path d="M569.6 367.5L580.6 367.5" class="dk" style="stroke-width:2"/><path d="M587.6 367.5L580.6 370.6L580.6 364.4Z" class="dh" style=""/>
<rect x="589.6" y="345.5" width="120.4" height="44" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="649.8000000000001" y="364.0833333333333" style="font-size:11.5px">Ground roll 700 ft</text>
<text class="t m" x="649.8000000000001" y="378.5833333333333" style="font-size:11.5px">Over 50 ft: 1,400 ft</text>
<rect x="20" y="401.5" width="337" height="24" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="30" y="418.5" style="font-size:13px">Combined graph steps</text>
<circle cx="31" cy="439.5" r="2.2" class="ah"/>
<text class="s" x="40" y="443.5" style="font-size:12px">Start at the temperature on the bottom left; go</text>
<text class="s" x="40" y="459.0" style="font-size:12px">straight up to the pressure altitude line</text>
<circle cx="31" cy="474.5" r="2.2" class="ah"/>
<text class="s" x="40" y="478.5" style="font-size:12px">Go straight across to the first dark reference</text>
<text class="s" x="40" y="494.0" style="font-size:12px">line, then follow the diagonals to the weight</text>
<text class="s" x="40" y="509.5" style="font-size:12px">line</text>
<circle cx="31" cy="525.0" r="2.2" class="ah"/>
<text class="s" x="40" y="529.0" style="font-size:12px">Straight across to the second reference line,</text>
<text class="s" x="40" y="544.5" style="font-size:12px">then diagonally to the wind mark</text>
<circle cx="31" cy="560.0" r="2.2" class="ah"/>
<text class="s" x="40" y="564.0" style="font-size:12px">Straight across to the third reference line, then</text>
<text class="s" x="40" y="579.5" style="font-size:12px">split: straight across for ground roll, diagonal</text>
<text class="s" x="40" y="595.0" style="font-size:12px">to the obstacle height for the total</text>
<circle cx="31" cy="610.5" r="2.2" class="ah"/>
<text class="s" x="40" y="614.5" style="font-size:12px">Table at the top gives speeds: lift-off 63 kt,</text>
<text class="s" x="40" y="630.0" style="font-size:12px">over the obstacle 68 kt</text>
<rect x="373" y="401.5" width="337" height="24" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="383" y="418.5" style="font-size:13px">Short-field table (Figure 11-24)</text>
<circle cx="384" cy="439.5" r="2.2" class="ah"/>
<text class="s" x="393" y="443.5" style="font-size:12px">Find the weight (2,400 lb), read across to the</text>
<text class="s" x="393" y="459.0" style="font-size:12px">takeoff speed, then the pressure altitude (3,000</text>
<text class="s" x="393" y="474.5" style="font-size:12px">ft) under the temperature column (30 °C)</text>
<circle cx="384" cy="490.0" r="2.2" class="ah"/>
<text class="s" x="393" y="494.0" style="font-size:12px">Table reads: ground roll 1,325 ft, over a 50-ft</text>
<text class="s" x="393" y="509.5" style="font-size:12px">obstacle 2,480 ft</text>
<circle cx="384" cy="525.0" r="2.2" class="ah"/>
<text class="s" x="393" y="529.0" style="font-size:12px">Note: decrease the distances by 10 percent for</text>
<text class="s" x="393" y="544.5" style="font-size:12px">each 9 knots of headwind. With 18 knots, take 20</text>
<text class="s" x="393" y="560.0" style="font-size:12px">percent off</text>
<circle cx="384" cy="575.5" r="2.2" class="ah"/>
<text class="s" x="393" y="579.5" style="font-size:12px">1,325 - 265 = 1,060 ft ground roll; the total</text>
<text class="s" x="393" y="595.0" style="font-size:12px">becomes 1,984 ft</text>
</svg>
