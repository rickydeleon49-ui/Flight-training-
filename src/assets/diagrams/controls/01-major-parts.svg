<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 603" role="img" aria-labelledby="ti de"><title id="ti">Major airplane parts</title><desc id="de">Side view of a high-wing airplane with tricycle landing gear, labeled with the five major components: fuselage, wings, empennage, landing gear and powerplant. Fuselage: central body for crew, passengers and cargo, connecting wings and tail. Wings: main lifting surfaces with spars, ribs and stringers, ailerons and flaps. Empennage: vertical and horizontal stabilizers, rudder, elevator and trim tabs. Landing gear: wheels, floats or skis. Powerplant: engine and propeller.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11.5px}.q1{font-size:13px}.q2{stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}.q3{stroke-width:1.5;opacity:0.7}.q4{stroke:currentColor;stroke-width:1.5}.q5{stroke-width:4;opacity:1}</style><text class="t" x="20" y="28" style="font-size:15px">Major airplane parts: five components</text><text class="s q1" x="20" y="50">Most airplane structures include a fuselage, wings, an empennage, landing gear, and a powerplant. The</text><text class="s q1" x="20" y="66.5">overall characteristics are largely determined by the original design objectives. Side view of a</text><text class="s q1" x="20" y="83">high-wing airplane with tricycle gear.</text><g transform="translate(0,55.5)"><path d="M40 272L700 272" class="dk" style="stroke-width:2;opacity:0.5"/><rect x="150" y="118" width="9" height="100" rx="4" class="cl q2"/><path d="M159 158L172 164L172 190L159 196Z" class="cl q2"/><rect x="172" y="152" width="66" height="52" rx="12" class="cl q2"/><path d="M238 152L352 142L580 168L580 188L352 214L238 204Z" class="sky q2"/><path d="M268 160L318 156L318 176L268 178Z" class="cl" style="stroke:currentColor;stroke-width:1.2;stroke-linejoin:round"/><path d="M285 132L420 132Q432 139 420 146L285 146Q272 139 285 132Z" class="lav q2"/><path d="M335 214L350 146" class="dk" style="stroke-width:3;opacity:1"/><path d="M262 204L262 248" class="dk q5"/><circle cx="262" cy="258" r="14" class="rose q2"/><path d="M382 210L386 248" class="dk q5"/><circle cx="386" cy="258" r="14" class="rose q2"/><path d="M508 168L544 98L578 98L584 170Z" class="mint q2"/><path d="M508 172L596 172L596 182L508 182Z" class="mint q2"/><rect x="578" y="172" width="26" height="10" class="mint q2"/><text class="t q1" x="70" y="96">Powerplant</text><text class="s q0" x="70" y="111">(engine + propeller)</text><path d="M130 116L166 160" class="dk q3"/><text class="t q1" x="300" y="92">Wings</text><path d="M335 96L345 130" class="dk q3"/><text class="t q1" x="430" y="238">Fuselage</text><path d="M455 224L455 200" class="dk q3"/><text class="t q1" x="470" y="84">Empennage</text><text class="s q0" x="470" y="99">(tail group)</text><path d="M525 106L535 128" class="dk q3"/><text class="t m q1" x="324" y="304">Landing gear (tricycle)</text><path d="M270 276L296 292" class="dk q3"/><path d="M380 276L352 292" class="dk q3"/><text class="s m q0" x="324" y="318">two main wheels and a nosewheel</text></g><rect x="20" y="395.5" width="130" height="26" rx="10" class="sky q4"/><text class="t m q1" x="85" y="413.5">Fuselage</text><text class="s q0" x="24" y="439.5">Central body: holds</text><text class="s q0" x="24" y="454.5">the crew, passengers</text><text class="s q0" x="24" y="469.5">and cargo, and is</text><text class="s q0" x="24" y="484.5">the structural</text><text class="s q0" x="24" y="499.5">connection for the</text><text class="s q0" x="24" y="514.5">wings and tail.</text><text class="s q0" x="24" y="529.5">Older: open truss.</text><text class="s q0" x="24" y="544.5">Today: monocoque</text><text class="s q0" x="24" y="559.5">(single shell) or</text><text class="s q0" x="24" y="574.5">semimonocoque.</text><rect x="158" y="395.5" width="130" height="26" rx="10" class="lav q4"/><text class="t m q1" x="223" y="413.5">Wings</text><text class="s q0" x="162" y="439.5">Airfoils on each</text><text class="s q0" x="162" y="454.5">side of the</text><text class="s q0" x="162" y="469.5">fuselage; the main</text><text class="s q0" x="162" y="484.5">lifting surfaces.</text><text class="s q0" x="162" y="499.5">High-, mid- or</text><text class="s q0" x="162" y="514.5">low-wing. Parts:</text><text class="s q0" x="162" y="529.5">spars, ribs,</text><text class="s q0" x="162" y="544.5">stringers. Ailerons</text><text class="s q0" x="162" y="559.5">and flaps on the</text><text class="s q0" x="162" y="574.5">trailing edge.</text><rect x="296" y="395.5" width="130" height="26" rx="10" class="mint q4"/><text class="t m q1" x="361" y="413.5">Empennage</text><text class="s q0" x="300" y="439.5">The entire tail</text><text class="s q0" x="300" y="454.5">group. Fixed:</text><text class="s q0" x="300" y="469.5">vertical stabilizer,</text><text class="s q0" x="300" y="484.5">horizontal</text><text class="s q0" x="300" y="499.5">stabilizer. Movable:</text><text class="s q0" x="300" y="514.5">rudder, elevator,</text><text class="s q0" x="300" y="529.5">one or more trim</text><text class="s q0" x="300" y="544.5">tabs.</text><rect x="434" y="395.5" width="130" height="26" rx="10" class="rose q4"/><text class="t m q1" x="499" y="413.5">Landing gear</text><text class="s q0" x="438" y="439.5">Principal support</text><text class="s q0" x="438" y="454.5">when parked,</text><text class="s q0" x="438" y="469.5">taxiing, taking off</text><text class="s q0" x="438" y="484.5">or landing. Wheels,</text><text class="s q0" x="438" y="499.5">floats or skis.</text><text class="s q0" x="438" y="514.5">Third wheel on the</text><text class="s q0" x="438" y="529.5">nose = tricycle</text><text class="s q0" x="438" y="544.5">gear; at the rear =</text><text class="s q0" x="438" y="559.5">conventional</text><text class="s q0" x="438" y="574.5">(tailwheel).</text><rect x="572" y="395.5" width="130" height="26" rx="10" class="cl q4"/><text class="t m q1" x="637" y="413.5">Powerplant</text><text class="s q0" x="576" y="439.5">Usually the engine</text><text class="s q0" x="576" y="454.5">and the propeller.</text><text class="s q0" x="576" y="469.5">The engine turns the</text><text class="s q0" x="576" y="484.5">propeller; the</text><text class="s q0" x="576" y="499.5">propeller turns that</text><text class="s q0" x="576" y="514.5">into thrust. The</text><text class="s q0" x="576" y="529.5">cowling streamlines</text><text class="s q0" x="576" y="544.5">the air and helps</text><text class="s q0" x="576" y="559.5">cool the engine.</text></svg>
