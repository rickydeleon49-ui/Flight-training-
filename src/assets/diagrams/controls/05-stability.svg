<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 794" role="img" aria-labelledby="ti de"><title id="ti">Stability: static, dynamic, longitudinal and dihedral</title><desc id="de">Static stability is the initial tendency after a disturbance: positive returns toward equilibrium, neutral stays in the new condition, negative moves away. Dynamic stability is the response over time: positive oscillations shrink, neutral stay the same, negative grow. Longitudinal stability: the wing center of lift is behind the center of gravity, balanced by a small downward force on the horizontal stabilizer. Dihedral, the upward angle of the wings, gives a stable roll due to sideslip. Directional stability comes from the vertical fin, like a weather vane.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style>
<text class="t" x="20" y="28" style="font-size:15px">Stability: static, dynamic, longitudinal, lateral</text>
<text class="s" x="20" y="50.0" style="font-size:13px">Stability is the inherent quality of an airplane to correct for conditions that disturb its</text>
<text class="s" x="20" y="66.5" style="font-size:13px">equilibrium and to return to or continue on the original flight path. The two types are static and</text>
<text class="s" x="20" y="83.0" style="font-size:13px">dynamic. It is primarily a design characteristic.</text>
<text class="t" x="20" y="117.5" style="font-size:13.5px">Static: the initial tendency after a disturbance</text>
<rect class="cl" x="20" y="127.5" width="226" height="128" rx="8"/>
<text class="t m" x="133" y="147.5" style="font-size:12.5px">Positive static stability</text>
<path d="M26 161.5 Q76 221.5 126 161.5" class="o" style="opacity:.8"/><circle cx="56" cy="189.5" r="7" class="ah"/><path d="M64 201.5L68.0 201.5" class="dk" style="stroke-width:2"/><path d="M74 201.5L68.0 204.2L68.0 198.8Z" class="dh" style=""/>
<text class="s" x="130" y="171.5" style="font-size:11px">The initial</text>
<text class="s" x="130" y="186.0" style="font-size:11px">tendency to return</text>
<text class="s" x="130" y="200.5" style="font-size:11px">to the original</text>
<text class="s" x="130" y="215.0" style="font-size:11px">equilibrium after</text>
<text class="s" x="130" y="229.5" style="font-size:11px">being disturbed.</text>
<rect class="cl" x="252" y="127.5" width="226" height="128" rx="8"/>
<text class="t m" x="365" y="147.5" style="font-size:12.5px">Neutral static stability</text>
<path d="M258 191.5 L358 191.5" class="o" style="opacity:.8"/><circle cx="308" cy="183.5" r="7" class="ah"/>
<text class="s" x="362" y="171.5" style="font-size:11px">The initial</text>
<text class="s" x="362" y="186.0" style="font-size:11px">tendency to remain</text>
<text class="s" x="362" y="200.5" style="font-size:11px">in the new</text>
<text class="s" x="362" y="215.0" style="font-size:11px">condition after</text>
<text class="s" x="362" y="229.5" style="font-size:11px">the disturbance.</text>
<rect class="cl" x="484" y="127.5" width="226" height="128" rx="8"/>
<text class="t m" x="597" y="147.5" style="font-size:12.5px">Negative static stability</text>
<path d="M490 211.5 Q540 149.5 590 211.5" class="o" style="opacity:.8"/><circle cx="556" cy="185.5" r="7" class="ah"/><path d="M562 183.5L571.8 193.3" class="dk" style="stroke-width:2"/><path d="M576 197.5L569.8 195.2L573.7 191.3Z" class="dh" style=""/>
<text class="s" x="594" y="171.5" style="font-size:11px">The initial</text>
<text class="s" x="594" y="186.0" style="font-size:11px">tendency to</text>
<text class="s" x="594" y="200.5" style="font-size:11px">continue away from</text>
<text class="s" x="594" y="215.0" style="font-size:11px">the original</text>
<text class="s" x="594" y="229.5" style="font-size:11px">equilibrium.</text>
<text class="t" x="20" y="279.5" style="font-size:13.5px">Dynamic: the response over time</text>
<rect class="cl" x="20" y="289.5" width="226" height="128" rx="8"/>
<text class="t m" x="133" y="309.5" style="font-size:12.5px">Positive dynamic stability</text>
<path d="M28.0 347.5L28.9 345.1L29.8 342.8L30.8 340.8L31.7 339.0L32.6 337.5L33.5 336.4L34.4 335.5L35.3 335.0L36.2 334.9L37.2 335.0L38.1 335.5L39.0 336.2L39.9 337.2L40.8 338.4L41.8 339.7L42.7 341.2L43.6 342.8L44.5 344.3L45.4 345.9L46.3 347.5L47.2 349.0L48.2 350.4L49.1 351.6L50.0 352.7L50.9 353.6L51.8 354.3L52.8 354.8L53.7 355.1L54.6 355.2L55.5 355.1L56.4 354.8L57.3 354.3L58.2 353.7L59.2 353.0L60.1 352.2L61.0 351.3L61.9 350.4L62.8 349.4L63.8 348.4L64.7 347.5L65.6 346.6L66.5 345.8L67.4 345.0L68.3 344.4L69.2 343.8L70.2 343.4L71.1 343.1L72.0 342.9L72.9 342.9L73.8 342.9L74.8 343.1L75.7 343.4L76.6 343.7L77.5 344.1L78.4 344.6L79.3 345.2L80.2 345.8L81.2 346.3L82.1 346.9L83.0 347.5L83.9 348.0L84.8 348.5L85.8 349.0L86.7 349.4L87.6 349.7L88.5 350.0L89.4 350.2L90.3 350.3L91.2 350.3L92.2 350.3L93.1 350.2L94.0 350.0L94.9 349.8L95.8 349.5L96.8 349.2L97.7 348.9L98.6 348.6L99.5 348.2L100.4 347.8L101.3 347.5L102.2 347.2L103.2 346.9L104.1 346.6L105.0 346.3L105.9 346.1L106.8 346.0L107.8 345.9L108.7 345.8L109.6 345.8L110.5 345.8L111.4 345.9L112.3 346.0L113.2 346.1L114.2 346.3L115.1 346.4L116.0 346.6L116.9 346.9L117.8 347.1L118.8 347.3L119.7 347.5L120.6 347.7L121.5 347.9L122.4 348.1L123.3 348.2L124.2 348.3L125.2 348.4L126.1 348.5L127.0 348.5L127.9 348.5L128.8 348.5L129.8 348.5L130.7 348.4L131.6 348.3L132.5 348.2L133.4 348.1L134.3 348.0L135.2 347.9L136.2 347.8L137.1 347.6L138.0 347.5" class="dk" style="stroke-width:2.2"/><path d="M28 347.5L140 347.5" class="dk" style="stroke-width:1;opacity:0.4;stroke-dasharray:6 5"/>
<text class="s" x="28" y="375.5" style="font-size:11px">The motion decreases in amplitude</text>
<text class="s" x="28" y="390.0" style="font-size:11px">over time and returns toward</text>
<text class="s" x="28" y="404.5" style="font-size:11px">equilibrium.</text>
<rect class="cl" x="252" y="289.5" width="226" height="128" rx="8"/>
<text class="t m" x="365" y="309.5" style="font-size:12.5px">Neutral dynamic stability</text>
<path d="M260.0 347.5L260.9 345.6L261.8 343.8L262.8 342.1L263.7 340.4L264.6 339.0L265.5 337.8L266.4 336.8L267.3 336.1L268.2 335.6L269.2 335.5L270.1 335.6L271.0 336.1L271.9 336.8L272.8 337.8L273.8 339.0L274.7 340.4L275.6 342.1L276.5 343.8L277.4 345.6L278.3 347.5L279.2 349.4L280.2 351.2L281.1 352.9L282.0 354.6L282.9 356.0L283.8 357.2L284.8 358.2L285.7 358.9L286.6 359.4L287.5 359.5L288.4 359.4L289.3 358.9L290.2 358.2L291.2 357.2L292.1 356.0L293.0 354.6L293.9 352.9L294.8 351.2L295.8 349.4L296.7 347.5L297.6 345.6L298.5 343.8L299.4 342.1L300.3 340.4L301.2 339.0L302.2 337.8L303.1 336.8L304.0 336.1L304.9 335.6L305.8 335.5L306.8 335.6L307.7 336.1L308.6 336.8L309.5 337.8L310.4 339.0L311.3 340.4L312.2 342.1L313.2 343.8L314.1 345.6L315.0 347.5L315.9 349.4L316.8 351.2L317.8 352.9L318.7 354.6L319.6 356.0L320.5 357.2L321.4 358.2L322.3 358.9L323.2 359.4L324.2 359.5L325.1 359.4L326.0 358.9L326.9 358.2L327.8 357.2L328.8 356.0L329.7 354.6L330.6 352.9L331.5 351.2L332.4 349.4L333.3 347.5L334.2 345.6L335.2 343.8L336.1 342.1L337.0 340.4L337.9 339.0L338.8 337.8L339.8 336.8L340.7 336.1L341.6 335.6L342.5 335.5L343.4 335.6L344.3 336.1L345.2 336.8L346.2 337.8L347.1 339.0L348.0 340.4L348.9 342.1L349.8 343.8L350.8 345.6L351.7 347.5L352.6 349.4L353.5 351.2L354.4 352.9L355.3 354.6L356.2 356.0L357.2 357.2L358.1 358.2L359.0 358.9L359.9 359.4L360.8 359.5L361.8 359.4L362.7 358.9L363.6 358.2L364.5 357.2L365.4 356.0L366.3 354.6L367.2 352.9L368.2 351.2L369.1 349.4L370.0 347.5" class="dk" style="stroke-width:2.2"/><path d="M260 347.5L372 347.5" class="dk" style="stroke-width:1;opacity:0.4;stroke-dasharray:6 5"/>
<text class="s" x="260" y="375.5" style="font-size:11px">Neither decreases nor increases in</text>
<text class="s" x="260" y="390.0" style="font-size:11px">amplitude. A worn automobile shock</text>
<text class="s" x="260" y="404.5" style="font-size:11px">absorber does this.</text>
<rect class="cl" x="484" y="289.5" width="226" height="128" rx="8"/>
<text class="t m" x="597" y="309.5" style="font-size:12.5px">Negative dynamic stability</text>
<path d="M492.0 347.5L492.9 347.0L493.8 346.5L494.8 346.0L495.7 345.5L496.6 345.0L497.5 344.5L498.4 344.1L499.3 343.8L500.2 343.5L501.2 343.3L502.1 343.3L503.0 343.3L503.9 343.5L504.8 343.8L505.8 344.1L506.7 344.6L507.6 345.2L508.5 345.9L509.4 346.7L510.3 347.5L511.2 348.4L512.2 349.2L513.1 350.1L514.0 350.9L514.9 351.7L515.8 352.4L516.8 353.0L517.7 353.5L518.6 353.8L519.5 354.0L520.4 354.0L521.3 353.9L522.2 353.6L523.2 353.1L524.1 352.5L525.0 351.7L525.9 350.8L526.8 349.8L527.8 348.7L528.7 347.5L529.6 346.3L530.5 345.1L531.4 343.9L532.3 342.7L533.2 341.7L534.2 340.7L535.1 339.9L536.0 339.3L536.9 338.9L537.8 338.7L538.8 338.7L539.7 338.9L540.6 339.3L541.5 340.0L542.4 340.8L543.3 341.9L544.2 343.1L545.2 344.5L546.1 346.0L547.0 347.5L547.9 349.1L548.8 350.7L549.8 352.2L550.7 353.7L551.6 355.0L552.5 356.2L553.4 357.1L554.3 357.9L555.2 358.4L556.2 358.7L557.1 358.6L558.0 358.3L558.9 357.8L559.8 356.9L560.8 355.8L561.7 354.5L562.6 352.9L563.5 351.2L564.4 349.4L565.3 347.5L566.2 345.6L567.2 343.6L568.1 341.7L569.0 340.0L569.9 338.4L570.8 337.0L571.8 335.8L572.7 334.9L573.6 334.3L574.5 334.0L575.4 334.1L576.3 334.4L577.2 335.2L578.2 336.2L579.1 337.5L580.0 339.2L580.9 341.0L581.8 343.0L582.8 345.2L583.7 347.5L584.6 349.8L585.5 352.1L586.4 354.3L587.3 356.4L588.2 358.3L589.2 359.9L590.1 361.3L591.0 362.3L591.9 363.0L592.8 363.3L593.8 363.3L594.7 362.8L595.6 361.9L596.5 360.7L597.4 359.1L598.3 357.2L599.2 355.1L600.2 352.7L601.1 350.1L602.0 347.5" class="dk" style="stroke-width:2.2"/><path d="M492 347.5L604 347.5" class="dk" style="stroke-width:1;opacity:0.4;stroke-dasharray:6 5"/>
<text class="s" x="492" y="375.5" style="font-size:11px">Over time the motion increases and</text>
<text class="s" x="492" y="390.0" style="font-size:11px">becomes more divergent.</text>
<rect class="cl" x="20" y="431.5" width="340" height="264" rx="8"/>
<text class="t" x="32" y="453.5" style="font-size:13px">Longitudinal stability (pitching)</text>
<path d="M50 535.5L330 535.5" class="dk" style="stroke-width:3;opacity:0.9"/>
<circle cx="140" cy="535.5" r="6" class="ah"/><circle cx="180" cy="535.5" r="6" class="dh"/><circle cx="300" cy="535.5" r="6" class="dh"/>
<text class="t m" x="140" y="561.5" style="font-size:12px">CG</text>
<text class="t m" x="180" y="561.5" style="font-size:12px">CL</text>
<text class="t m" x="300" y="561.5" style="font-size:12px">T</text>
<path d="M140 489.5L140.0 516.5" class="acc" style="stroke-width:3"/><path d="M140 525.5L135.9 516.5L144.1 516.5Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/>
<text class="s m" x="140" y="483.5" style="font-size:10.5px">weight at CG</text>
<path d="M180 545.5L180.0 514.5" class="dk" style="stroke-width:3"/><path d="M180 505.5L184.1 514.5L175.9 514.5Z" class="dh" style=""/>
<text class="s" x="190" y="499.5" style="font-size:10.5px">lift at CL</text>
<path d="M300 501.5L300.0 516.5" class="dk" style="stroke-width:3"/><path d="M300 525.5L295.9 516.5L304.1 516.5Z" class="dh" style=""/>
<text class="s m" x="300" y="493.5" style="font-size:10.5px">small tail-down force</text>
<text class="s" x="32" y="589.5" style="font-size:11px">Most airplanes: the wing's center of lift (CL) is to</text>
<text class="s" x="32" y="604.0" style="font-size:11px">the rear of the CG, which makes the nose heavy. A</text>
<text class="s" x="32" y="618.5" style="font-size:11px">slight downward force on the horizontal stabilizer, set</text>
<text class="s" x="32" y="633.0" style="font-size:11px">at a slight negative AOA, balances it, like a lever. CG</text>
<text class="s" x="32" y="647.5" style="font-size:11px">forward of CL plus the tail-down force means the</text>
<text class="s" x="32" y="662.0" style="font-size:11px">airplane tries to return to a safe attitude. Moving the</text>
<text class="s" x="32" y="676.5" style="font-size:11px">CG rearward makes it more unstable.</text>
<rect class="cl" x="370" y="431.5" width="340" height="264" rx="8"/>
<text class="t" x="382" y="453.5" style="font-size:13px">Lateral stability: dihedral</text>
<path d="M540 551.5L420 525.5L420 533.5L540 559.5Z" class="lav" style="stroke:currentColor;stroke-width:1.8;stroke-linejoin:round"/>
<path d="M540 551.5L660 525.5L660 533.5L540 559.5Z" class="lav" style="stroke:currentColor;stroke-width:1.8;stroke-linejoin:round"/>
<rect x="529" y="525.5" width="22" height="34" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.8;stroke-linejoin:round"/>
<text class="s" x="382" y="475.5" style="font-size:10.5px">A gust rolls the airplane; the sideslip puts the</text>
<text class="s" x="382" y="488.5" style="font-size:10.5px">relative wind on one side (arrow, rear view).</text>
<path d="M386 537.5L411.0 537.5" class="acc" style="stroke-width:3"/><path d="M420 537.5L411.0 541.5L411.0 533.5Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/>
<text class="s" x="386" y="515.5" style="font-size:10px">relative</text>
<text class="s" x="386" y="526.5" style="font-size:10px">wind</text>

<text class="t" x="420" y="581.5" style="font-size:10.5px">windward wing:</text>
<text class="s" x="420" y="594.5" style="font-size:10.5px">more AOA, more lift</text>
<text class="t" x="660" y="581.5" style="font-size:10.5px;text-anchor:end">other wing:</text>
<text class="s" x="660" y="594.5" style="font-size:10.5px;text-anchor:end">less AOA, less lift</text>
<text class="s" x="382" y="621.5" style="font-size:11px">Dihedral is the upward angle of the wings: outer tips</text>
<text class="s" x="382" y="636.0" style="font-size:11px">higher than the wing roots. The changes in lift produce</text>
<text class="s" x="382" y="650.5" style="font-size:11px">a rolling moment that raises the windward wing, a</text>
<text class="s" x="382" y="665.0" style="font-size:11px">stable roll due to sideslip. Other lateral factors:</text>
<text class="s" x="382" y="679.5" style="font-size:11px">sweepback, keel effect, weight distribution.</text>
<rect class="cl" x="20" y="709.5" width="690" height="60" rx="8"/>
<text class="s" x="32" y="731.5" style="font-size:12px">Directional stability (yaw): the vertical fin and the sides of the fuselage aft of the CG make the</text>
<text class="s" x="32" y="747.0" style="font-size:12px">airplane act like a weather vane, pointing its nose into the relative wind. It is the most easily achieved</text>
<text class="s" x="32" y="762.5" style="font-size:12px">stability in design.</text>
</svg>
