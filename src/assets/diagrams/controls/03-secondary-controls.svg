<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 670" role="img" aria-labelledby="ti de"><title id="ti">Secondary controls: flaps and tabs</title><desc id="de">The four common trailing edge flap types: plain, split, slotted and Fowler, each with how it changes lift and drag. Elevator trim tabs move opposite to the elevator: nose-down trim has the tab up and the elevator down, nose-up trim has the tab down and the elevator up. An antiservo tab on a stabilator moves in the same direction as the stabilator trailing edge, making it less sensitive. Balance tabs and servo tabs are also named.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11.5px}.q1{stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}.q2{font-size:13px}.q3{stroke-width:2}.q4{font-size:12px}.q5{font-size:10.5px}.q6{fill:var(--palette-berry,#A84C6B)}</style><text class="t" x="20" y="28" style="font-size:15px">Secondary controls: flaps and tabs</text><text class="s q2" x="20" y="50">Wing flaps, leading edge devices, spoilers and trim systems make up the secondary control system. They</text><text class="s q2" x="20" y="66.5">improve the performance of the airplane or relieve the pilot of excessive control forces.</text><text class="t" x="20" y="101" style="font-size:13.5px">Four common trailing edge flaps (side view of the wing)</text><rect class="cl" x="20" y="113" width="168" height="214" rx="8"/><text class="t m q2" x="104" y="135">Plain flap</text><path d="M36 179Q46 165 76 165L108 171L108 183L76 187Q46 187 36 179Z" class="lav q1"/><g transform="translate(108,177) rotate(28)"><rect x="0" y="-5" width="28" height="9" class="rose q1"/></g><text class="s q0" x="28" y="227">Simplest. Increases</text><text class="s q0" x="28" y="242">camber and lift at a</text><text class="s q0" x="28" y="257">given AOA, greatly</text><text class="s q0" x="28" y="272">increases drag, and moves</text><text class="s q0" x="28" y="287">the center of pressure</text><text class="s q0" x="28" y="302">aft: a nose-down pitching</text><text class="s q0" x="28" y="317">moment.</text><rect class="cl" x="194" y="113" width="168" height="214" rx="8"/><text class="t m q2" x="278" y="135">Split flap</text><path d="M210 179Q220 165 250 165L310 177L310 181L250 187Q220 187 210 179Z" class="lav q1"/><g transform="translate(282,183) rotate(48)"><rect x="0" y="-1" width="28" height="4" class="rose q1"/></g><text class="s q0" x="202" y="227">Deflected from the lower</text><text class="s q0" x="202" y="242">surface only. Slightly</text><text class="s q0" x="202" y="257">more lift than plain,</text><text class="s q0" x="202" y="272">more drag from the</text><text class="s q0" x="202" y="287">turbulent air behind.</text><rect class="cl" x="368" y="113" width="168" height="214" rx="8"/><text class="t m q2" x="452" y="135">Slotted flap</text><path d="M384 179Q394 165 424 165L452 171L452 183L424 187Q394 187 384 179Z" class="lav q1"/><g transform="translate(458,183) rotate(26)"><rect x="0" y="-5" width="28" height="9" class="rose q1"/></g><path d="M434 197L453.3 191.1" class="acc q3"/><path d="M460 189L454.2 194.1L452.4 188Z" class="dh q6"/><text class="s q0" x="376" y="227">Most popular. A duct</text><text class="s q0" x="376" y="242">passes high energy air</text><text class="s q0" x="376" y="257">from below to the flap</text><text class="s q0" x="376" y="272">top, delays separation</text><text class="s q0" x="376" y="287">and gives a much higher</text><text class="s q0" x="376" y="302">lift coefficient.</text><rect class="cl" x="542" y="113" width="168" height="214" rx="8"/><text class="t m q2" x="626" y="135">Fowler flap</text><path d="M558 179Q568 165 598 165L626 171L626 183L598 187Q568 187 558 179Z" class="lav q1"/><g transform="translate(642,185) rotate(22)"><rect x="0" y="-5" width="34" height="9" class="rose q1"/></g><path d="M628 159L647 159" class="acc q3"/><path d="M654 159L647 162.2L647 155.8Z" class="dh q6"/><text class="s q0" x="550" y="227">A type of slotted flap.</text><text class="s q0" x="550" y="242">Slides back on tracks,</text><text class="s q0" x="550" y="257">adding area and camber:</text><text class="s q0" x="550" y="272">lift up a lot early, drag</text><text class="s q0" x="550" y="287">only later as it deflects</text><text class="s q0" x="550" y="302">down.</text><text class="t" x="20" y="351" style="font-size:13.5px">Tabs on the trailing edge of a control surface</text><rect class="cl" x="20" y="363" width="226" height="150" rx="8"/><text class="t m q2" x="133" y="385">Nose-down trim</text><path d="M30 419L53 419" class="dk q3"/><path d="M60 419L53 422.1L53 415.9Z" class="dh" style=""/><text class="s q5" x="34" y="409">airflow</text><rect x="46" y="423" width="70" height="9" class="mint q1"/><g transform="translate(116,427) rotate(12)"><rect x="0" y="-4" width="52" height="9" class="lav q1"/><g transform="translate(52,0) rotate(-32)"><rect x="0" y="-2.5" width="20" height="5" class="rose q1"/></g></g><circle cx="116" cy="427" r="2.5" class="dh"/><text class="s q0" x="28" y="459">Trim tab up, elevator trailing edge</text><text class="s q0" x="28" y="474">down: tail up, nose down.</text><rect class="cl" x="252" y="363" width="226" height="150" rx="8"/><text class="t m q2" x="365" y="385">Nose-up trim</text><path d="M262 419L285 419" class="dk q3"/><path d="M292 419L285 422.1L285 415.9Z" class="dh" style=""/><text class="s q5" x="266" y="409">airflow</text><rect x="278" y="423" width="70" height="9" class="mint q1"/><g transform="translate(348,427) rotate(-12)"><rect x="0" y="-4" width="52" height="9" class="lav q1"/><g transform="translate(52,0) rotate(34)"><rect x="0" y="-2.5" width="20" height="5" class="rose q1"/></g></g><circle cx="348" cy="427" r="2.5" class="dh"/><text class="s q0" x="260" y="459">Trim tab down, elevator trailing</text><text class="s q0" x="260" y="474">edge up: tail down, nose up.</text><rect class="cl" x="484" y="363" width="226" height="150" rx="8"/><text class="t m q2" x="597" y="385">Antiservo tab (stabilator)</text><path d="M494 419L517 419" class="dk q3"/><path d="M524 419L517 422.1L517 415.9Z" class="dh" style=""/><text class="s q5" x="498" y="409">airflow</text><g transform="translate(550,427) rotate(-12)"><rect x="-30" y="-4" width="100" height="9" class="mint q1"/><g transform="translate(70,0) rotate(-16)"><rect x="0" y="-2.5" width="20" height="5" class="rose q1"/></g></g><circle cx="550" cy="427" r="2.5" class="dh"/><text class="s q0" x="492" y="459">Moves the same way as the</text><text class="s q0" x="492" y="474">stabilator trailing edge: less</text><text class="s q0" x="492" y="489">sensitive stabilator, and it also</text><text class="s q0" x="492" y="504">trims.</text><rect class="cl" x="20" y="527" width="690" height="118" rx="8"/><text class="t q2" x="32" y="549">Trim tabs, balance tabs, servo tabs</text><circle cx="35" cy="565" r="2.2" class="ah"/><text class="s q4" x="44" y="569">Trim tab (most common on small airplanes: on the elevator): relieves control pressure. If you must hold</text><text class="s q4" x="44" y="584.5">constant back pressure, the need for nose-up trim is indicated. Elevator trim moves opposite to the</text><text class="s q4" x="44" y="600">elevator.</text><circle cx="35" cy="615.5" r="2.2" class="ah"/><text class="s q4" x="44" y="619.5">Balance tab: coupled to the control rod, it moves opposite to the surface to lighten control forces.</text><text class="s q4" x="44" y="635">Servo tab: moves with pilot input and the airflow moves the surface; used mainly on large aircraft.</text></svg>
