<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 511" role="img" aria-labelledby="ti de"><title id="ti">Three axes and the primary controls</title><desc id="de">Top view of an airplane with its three axes. Longitudinal axis, nose to tail: ailerons control roll. Lateral axis, wingtip to wingtip: the elevator controls pitch. Vertical axis, through the center of gravity: the rudder controls yaw. Roll goes with lateral stability, pitch with longitudinal stability, yaw with directional stability.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><text class="t" x="20" y="28" style="font-size:15px">Three axes and the primary controls</text><text class="s" x="20" y="50.0" style="font-size:13px">The ailerons, elevator (or stabilator) and rudder are the primary controls. Each one rotates the</text><text class="s" x="20" y="66.5" style="font-size:13px">airplane about one of three axes, and each axis ties to a type of stability. Top view shown.</text><rect class="cl" x="20" y="89.0" width="330" height="310" rx="8"/><rect x="174" y="143.0" width="22" height="190" rx="11" class="sky" style="stroke:currentColor;stroke-width:1.8;stroke-linejoin:round"/><path d="M174 211.0L38 221.0L38 255.0L174 261.0Z" class="lav" style="stroke:currentColor;stroke-width:1.8;stroke-linejoin:round"/><path d="M196 211.0L332 221.0L332 255.0L196 261.0Z" class="lav" style="stroke:currentColor;stroke-width:1.8;stroke-linejoin:round"/><path d="M174 301.0L132 307.0L132 323.0L174 323.0Z" class="mint" style="stroke:currentColor;stroke-width:1.8;stroke-linejoin:round"/><path d="M196 301.0L238 307.0L238 323.0L196 323.0Z" class="mint" style="stroke:currentColor;stroke-width:1.8;stroke-linejoin:round"/><rect x="38" y="243.0" width="64" height="12" class="rose" style="stroke:currentColor;stroke-width:1.8;stroke-linejoin:round"/><rect x="268" y="243.0" width="64" height="12" class="rose" style="stroke:currentColor;stroke-width:1.8;stroke-linejoin:round"/><rect x="132" y="323.0" width="42" height="9" class="rose" style="stroke:currentColor;stroke-width:1.8;stroke-linejoin:round"/><rect x="196" y="323.0" width="42" height="9" class="rose" style="stroke:currentColor;stroke-width:1.8;stroke-linejoin:round"/><rect x="181" y="333.0" width="8" height="18" class="rose" style="stroke:currentColor;stroke-width:1.8;stroke-linejoin:round"/><path d="M185 123.0L185 371.0" class="dk" style="stroke-width:2;opacity:0.8;stroke-dasharray:6 5"/><path d="M28 236.0L342 236.0" class="dk" style="stroke-width:2;opacity:0.8;stroke-dasharray:6 5"/><circle cx="185" cy="236.0" r="8" class="ah"/><circle cx="185" cy="236.0" r="3" style="fill:#fff"/><circle cx="185" cy="111.0" r="11" class="ah"/><text class="t m" x="185" y="115.33333333333333" style="font-size:13px;fill:#fff">1</text><text class="t" x="201" y="116.0" style="font-size:12px">Longitudinal axis</text><circle cx="50" cy="193.0" r="9" class="ah"/><text class="t m" x="50" y="196.66666666666666" style="font-size:11px;fill:#fff">2</text><text class="t" x="64" y="193.0" style="font-size:11.5px">Lateral axis</text><text class="s" x="40" y="209.0" style="font-size:10.5px">(wingtip to wingtip)</text><text class="t" x="199" y="230.0" style="font-size:11.5px">CG</text><circle cx="219" cy="277.0" r="9" class="ah"/><text class="t m" x="219" y="280.6666666666667" style="font-size:11px;fill:#fff">3</text><text class="t" x="233" y="281.0" style="font-size:11.5px">Vertical axis</text><text class="s" x="211" y="295.0" style="font-size:10.5px">(through the CG)</text><text class="t" x="40" y="285.0" style="font-size:11.5px">Ailerons</text><text class="s" x="32" y="385.0" style="font-size:10.5px">Rose = control surfaces</text><path d="M70 274.0L70 257.0" class="dk" style="stroke-width:1;opacity:0.6"/><text class="t" x="60" y="339.0" style="font-size:11.5px">Elevator</text><path d="M120 335.0L150 327.0" class="dk" style="stroke-width:1;opacity:0.6"/><text class="t" x="224" y="345.0" style="font-size:11.5px">Rudder (on the fin)</text><path d="M222 341.0L191 343.0" class="dk" style="stroke-width:1;opacity:0.6"/><rect x="366" y="89.0" width="344" height="98" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><circle cx="384" cy="109.0" r="11" class="ah"/><text class="t m" x="384" y="113.33333333333333" style="font-size:13px;fill:#fff">1</text><text class="t" x="402" y="114.0" style="font-size:14px">Ailerons: roll</text><text class="s" x="378" y="131.0" style="font-size:11.5px">Roll about the longitudinal axis (nose to tail).</text><text class="s" x="378" y="146.0" style="font-size:11.5px">Control wheel or stick right: right aileron up, left</text><text class="s" x="378" y="161.0" style="font-size:11.5px">aileron down, so the airplane rolls right.</text><text class="s" x="378" y="180.0" style="font-size:11px;opacity:.95">Stability type about this axis: Lateral stability (rolling)</text><rect x="366" y="193.0" width="344" height="98" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><circle cx="384" cy="213.0" r="11" class="ah"/><text class="t m" x="384" y="217.33333333333334" style="font-size:13px;fill:#fff">2</text><text class="t" x="402" y="218.0" style="font-size:14px">Elevator: pitch</text><text class="s" x="378" y="235.0" style="font-size:11.5px">Controls pitch about the lateral axis. Pull the</text><text class="s" x="378" y="250.0" style="font-size:11.5px">control column aft: the elevator trailing edge goes</text><text class="s" x="378" y="265.0" style="font-size:11.5px">up, the tail moves down, the nose pitches up.</text><text class="s" x="378" y="284.0" style="font-size:11px;opacity:.95">Stability type about this axis: Longitudinal stability (pitching)</text><rect x="366" y="297.0" width="344" height="98" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><circle cx="384" cy="317.0" r="11" class="ah"/><text class="t m" x="384" y="321.3333333333333" style="font-size:13px;fill:#fff">3</text><text class="t" x="402" y="322.0" style="font-size:14px">Rudder: yaw</text><text class="s" x="378" y="339.0" style="font-size:11.5px">Controls movement about the vertical axis (the yaw</text><text class="s" x="378" y="354.0" style="font-size:11.5px">axis). Push the left pedal: the rudder moves left, the</text><text class="s" x="378" y="369.0" style="font-size:11.5px">tail moves right, the nose yaws left.</text><text class="s" x="378" y="388.0" style="font-size:11px;opacity:.95">Stability type about this axis: Directional stability (yawing)</text><rect class="cl" x="20" y="411.0" width="690" height="74" rx="8"/><text class="s" x="32" y="433.0" style="font-size:12px">Moving any primary surface changes the airflow and pressure distribution over and around the airfoil. That</text><text class="s" x="32" y="448.5" style="font-size:12px">changes the lift and drag of the surface, and lets the pilot control the airplane about its three axes. At</text><text class="s" x="32" y="464.0" style="font-size:12px">low airspeeds the controls feel soft and sluggish; at higher airspeeds they feel firmer and the airplane</text><text class="s" x="32" y="479.5" style="font-size:12px">responds faster.</text></svg>
