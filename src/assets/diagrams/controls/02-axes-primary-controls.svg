<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 511" role="img" aria-labelledby="ti de"><title id="ti">Three axes and the primary controls</title><desc id="de">Top view of an airplane with its three axes. Longitudinal axis, nose to tail: ailerons control roll. Lateral axis, wingtip to wingtip: the elevator controls pitch. Vertical axis, through the center of gravity: the rudder controls yaw. Roll goes with lateral stability, pitch with longitudinal stability, yaw with directional stability.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11.5px}.q1{stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}.q2{font-size:12px}.q3{font-size:13px;fill:#fff}.q4{font-size:10.5px}.q5{stroke-width:1;opacity:0.6}.q6{stroke:currentColor;stroke-width:1.5}.q7{font-size:14px}.q8{font-size:11px;opacity:.95}.q9{stroke-width:2;opacity:0.8;stroke-dasharray:6 5}.q10{font-size:11px;fill:#fff}</style><text class="t" x="20" y="28" style="font-size:15px">Three axes and the primary controls</text><text class="s" x="20" y="50" style="font-size:13px">The ailerons, elevator (or stabilator) and rudder are the primary controls. Each one rotates the</text><text class="s" x="20" y="66.5" style="font-size:13px">airplane about one of three axes, and each axis ties to a type of stability. Top view shown.</text><rect class="cl" x="20" y="89" width="330" height="310" rx="8"/><rect x="174" y="143" width="22" height="190" rx="11" class="sky q1"/><path d="M174 211L38 221L38 255L174 261Z" class="lav q1"/><path d="M196 211L332 221L332 255L196 261Z" class="lav q1"/><path d="M174 301L132 307L132 323L174 323Z" class="mint q1"/><path d="M196 301L238 307L238 323L196 323Z" class="mint q1"/><rect x="38" y="243" width="64" height="12" class="rose q1"/><rect x="268" y="243" width="64" height="12" class="rose q1"/><rect x="132" y="323" width="42" height="9" class="rose q1"/><rect x="196" y="323" width="42" height="9" class="rose q1"/><rect x="181" y="333" width="8" height="18" class="rose q1"/><path d="M185 123L185 371" class="dk q9"/><path d="M28 236L342 236" class="dk q9"/><circle cx="185" cy="236" r="8" class="ah"/><circle cx="185" cy="236" r="3" style="fill:#fff"/><circle cx="185" cy="111" r="11" class="ah"/><text class="t m q3" x="185" y="115.33">1</text><text class="t q2" x="201" y="116">Longitudinal axis</text><circle cx="50" cy="193" r="9" class="ah"/><text class="t m q10" x="50" y="196.67">2</text><text class="t q0" x="64" y="193">Lateral axis</text><text class="s q4" x="40" y="209">(wingtip to wingtip)</text><text class="t q0" x="199" y="230">CG</text><circle cx="219" cy="277" r="9" class="ah"/><text class="t m q10" x="219" y="280.67">3</text><text class="t q0" x="233" y="281">Vertical axis</text><text class="s q4" x="211" y="295">(through the CG)</text><text class="t q0" x="40" y="285">Ailerons</text><text class="s q4" x="32" y="385">Rose = control surfaces</text><path d="M70 274L70 257" class="dk q5"/><text class="t q0" x="60" y="339">Elevator</text><path d="M120 335L150 327" class="dk q5"/><text class="t q0" x="224" y="345">Rudder (on the fin)</text><path d="M222 341L191 343" class="dk q5"/><rect x="366" y="89" width="344" height="98" rx="10" class="sky q6"/><circle cx="384" cy="109" r="11" class="ah"/><text class="t m q3" x="384" y="113.33">1</text><text class="t q7" x="402" y="114">Ailerons: roll</text><text class="s q0" x="378" y="131">Roll about the longitudinal axis (nose to tail).</text><text class="s q0" x="378" y="146">Control wheel or stick right: right aileron up, left</text><text class="s q0" x="378" y="161">aileron down, so the airplane rolls right.</text><text class="s q8" x="378" y="180">Stability type about this axis: Lateral stability (rolling)</text><rect x="366" y="193" width="344" height="98" rx="10" class="lav q6"/><circle cx="384" cy="213" r="11" class="ah"/><text class="t m q3" x="384" y="217.33">2</text><text class="t q7" x="402" y="218">Elevator: pitch</text><text class="s q0" x="378" y="235">Controls pitch about the lateral axis. Pull the</text><text class="s q0" x="378" y="250">control column aft: the elevator trailing edge goes</text><text class="s q0" x="378" y="265">up, the tail moves down, the nose pitches up.</text><text class="s q8" x="378" y="284">Stability type about this axis: Longitudinal stability (pitching)</text><rect x="366" y="297" width="344" height="98" rx="10" class="mint q6"/><circle cx="384" cy="317" r="11" class="ah"/><text class="t m q3" x="384" y="321.33">3</text><text class="t q7" x="402" y="322">Rudder: yaw</text><text class="s q0" x="378" y="339">Controls movement about the vertical axis (the yaw</text><text class="s q0" x="378" y="354">axis). Push the left pedal: the rudder moves left, the</text><text class="s q0" x="378" y="369">tail moves right, the nose yaws left.</text><text class="s q8" x="378" y="388">Stability type about this axis: Directional stability (yawing)</text><rect class="cl" x="20" y="411" width="690" height="74" rx="8"/><text class="s q2" x="32" y="433">Moving any primary surface changes the airflow and pressure distribution over and around the airfoil. That</text><text class="s q2" x="32" y="448.5">changes the lift and drag of the surface, and lets the pilot control the airplane about its three axes. At</text><text class="s q2" x="32" y="464">low airspeeds the controls feel soft and sluggish; at higher airspeeds they feel firmer and the airplane</text><text class="s q2" x="32" y="479.5">responds faster.</text></svg>
