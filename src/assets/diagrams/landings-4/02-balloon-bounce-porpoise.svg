<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 323" role="img" aria-labelledby="ti de"><title id="ti">Ballooning, bouncing and porpoising: what to do</title><desc id="de">Three cards on ballooning, bouncing and porpoising, each with its cause and recovery, and a reminder to go around when in doubt.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:17px}.q1{stroke-width:2;opacity:.6}.q2{font-size:11.5px}.q3{font-size:13px}.q4{font-size:12px}.q5{stroke:currentColor;stroke-width:1.5}.q6{stroke-width:2;stroke-dasharray:7 6}.q8{stroke:currentColor;stroke-width:1.4;stroke-linejoin:round}</style><text class="t" x="20" y="28" style="font-size:15px">Ballooning, bouncing and porpoising: what to do</text><text class="s q3" x="20" y="50">Each starts with a small error that grows.</text><text class="s q3" x="20" y="66.5">Fix it early, or go around.</text><rect class="cl" x="20" y="91" width="220.67" height="165" rx="8"/><rect x="20" y="91" width="220.67" height="26" rx="10" class="sky q4"/><text class="t q3" x="30" y="109">Balloon</text><circle cx="33" cy="127" r="2.2" class="ah"/><text class="s q2" x="42" y="131">Cause: flare too fast or</text><text class="s q2" x="42" y="146">too much back pressure,</text><text class="s q2" x="42" y="161">or approach too fast</text><circle cx="33" cy="175" r="2.2" class="ah"/><text class="s q2" x="42" y="179">Fix: hold the landing</text><text class="s q2" x="42" y="194">attitude and level the wings</text><circle cx="33" cy="208" r="2.2" class="ah"/><text class="s q2" x="42" y="212">Add power if needed to</text><text class="s q2" x="42" y="227">cushion the descent</text><circle cx="33" cy="241" r="2.2" class="ah"/><text class="s q2" x="42" y="245">Severe? Go around</text><rect class="cl" x="254.67" y="91" width="220.67" height="165" rx="8"/><rect x="254.67" y="91" width="220.67" height="26" rx="10" class="mint q4"/><text class="t q3" x="264.67" y="109">Bounce</text><circle cx="267.67" cy="127" r="2.2" class="ah"/><text class="s q2" x="276.67" y="131">Cause: touching down too</text><text class="s q2" x="276.67" y="146">fast, or with a high sink</text><text class="s q2" x="276.67" y="161">rate or the wrong pitch</text><circle cx="267.67" cy="175" r="2.2" class="ah"/><text class="s q2" x="276.67" y="179">Slight bounce: hold</text><text class="s q2" x="276.67" y="194">attitude, add a little power</text><text class="s q2" x="276.67" y="209">to soften the next touchdown</text><circle cx="267.67" cy="223" r="2.2" class="ah"/><text class="s q2" x="276.67" y="227">Hard bounce? Go around</text><rect class="cl" x="489.33" y="91" width="220.67" height="165" rx="8"/><rect x="489.33" y="91" width="220.67" height="26" rx="10" class="rose q4"/><text class="t q3" x="499.33" y="109">Porpoise</text><circle cx="502.33" cy="127" r="2.2" class="ah"/><text class="s q2" x="511.33" y="131">Cause: wrong pitch,</text><text class="s q2" x="511.33" y="146">trim or speed control</text><text class="s q2" x="511.33" y="161">(for example nose wheel</text><text class="s q2" x="511.33" y="176">touching first)</text><circle cx="502.33" cy="190" r="2.2" class="ah"/><text class="s q2" x="511.33" y="194">Slight: add power to</text><text class="s q2" x="511.33" y="209">cushion, set landing attitude</text><circle cx="502.33" cy="223" r="2.2" class="ah"/><text class="s q2" x="511.33" y="227">Severe? Go around at once</text><text class="t q3" x="20" y="284">In doubt? Go around. Full power, set the climb attitude, climb away.</text><text class="s" x="20" y="307" style="font-size:11px">Source: Airplane Flying Handbook ch. 9</text></svg>
