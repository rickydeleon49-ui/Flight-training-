<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 343" role="img" aria-labelledby="ti de"><title id="ti">The round-out and touchdown</title><desc id="de">Side view of an airplane in approach attitude, rounding out to the landing attitude and touching down on the main wheels, with cards on the round-out, where to look, and the touchdown.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:17px}.q1{stroke-width:2;opacity:.6}.q2{font-size:11.5px}.q3{font-size:13px}.q4{font-size:12px}.q5{stroke:currentColor;stroke-width:1.5}.q6{stroke-width:2;stroke-dasharray:7 6}.q8{stroke:currentColor;stroke-width:1.4;stroke-linejoin:round}.q7{font-size:12px}</style><text class="t" x="20" y="28" style="font-size:15px">The round-out and touchdown</text><text class="s q3" x="20" y="50">The round-out changes the airplane from the approach attitude to the landing attitude.</text><text class="s q3" x="20" y="66.5">Do it slowly and smoothly.</text><rect class="cl" x="20" y="91" width="690" height="110" rx="8"/><path d="M30 185L700 185" class="dk" style="stroke-width:2.5"/><path d="M40 105L250 160" class="acc" style="stroke-width:2.5;stroke-dasharray:7 6"/><path d="M250 160C330 172 380 178 450 180L640 180" class="acc"/><g transform="translate(110 112) rotate(14) scale(0.9)"><ellipse cx="0" cy="0" rx="24" ry="5.5" class="sky q8"/><path d="M-20 -2L-29 -13L-22 -13L-12 -3Z" class="sky q8"/><path d="M0 2L8 2L-4 11L-9 11Z" class="cl q8"/></g><g transform="translate(330 152) rotate(5) scale(0.9)"><ellipse cx="0" cy="0" rx="24" ry="5.5" class="sky q8"/><path d="M-20 -2L-29 -13L-22 -13L-12 -3Z" class="sky q8"/><path d="M0 2L8 2L-4 11L-9 11Z" class="cl q8"/></g><g transform="translate(560 170) rotate(-4) scale(0.9)"><ellipse cx="0" cy="0" rx="24" ry="5.5" class="sky q8"/><path d="M-20 -2L-29 -13L-22 -13L-12 -3Z" class="sky q8"/><path d="M0 2L8 2L-4 11L-9 11Z" class="cl q8"/></g><text class="t q7" x="50" y="150">Approach attitude</text><text class="t q7" x="270" y="138">Round-out</text><text class="t q7" x="520" y="140">Landing attitude</text><text class="s q2" x="520" y="156">touch down on the main wheels</text><rect class="cl" x="20" y="213" width="218" height="100" rx="8"/><rect x="20" y="213" width="218" height="26" rx="10" class="rose q4"/><text class="t q3" x="30" y="231">Round-out</text><circle cx="33" cy="249" r="2.2" class="ah"/><text class="s q2" x="42" y="253">Slow, smooth change from</text><text class="s q2" x="42" y="268">approach to landing attitude</text><circle cx="33" cy="282" r="2.2" class="ah"/><text class="s q2" x="42" y="286">Add back pressure slowly</text><text class="s q2" x="42" y="301">as the airplane sinks</text><rect class="cl" x="256" y="213" width="218" height="100" rx="8"/><rect x="256" y="213" width="218" height="26" rx="10" class="sky q4"/><text class="t q3" x="266" y="231">Eyes far ahead</text><circle cx="269" cy="249" r="2.2" class="ah"/><text class="s q2" x="278" y="253">Look well down the runway,</text><text class="s q2" x="278" y="268">not at the ground just ahead</text><circle cx="269" cy="282" r="2.2" class="ah"/><text class="s q2" x="278" y="286">That helps you judge height</text><text class="s q2" x="278" y="301">and keep the nose straight</text><rect class="cl" x="492" y="213" width="218" height="100" rx="8"/><rect x="492" y="213" width="218" height="26" rx="10" class="mint q4"/><text class="t q3" x="502" y="231">Touchdown</text><circle cx="505" cy="249" r="2.2" class="ah"/><text class="s q2" x="514" y="253">Main wheels first at minimum</text><text class="s q2" x="514" y="268">controllable speed</text><circle cx="505" cy="282" r="2.2" class="ah"/><text class="s q2" x="514" y="286">Hold the nose wheel off</text><text class="s q2" x="514" y="301">as long as you can</text><text class="s" x="20" y="327" style="font-size:11px">Source: Airplane Flying Handbook ch. 9</text></svg>
