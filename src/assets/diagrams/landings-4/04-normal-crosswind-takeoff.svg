<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 276" role="img" aria-labelledby="ti de"><title id="ti">Normal and crosswind takeoff</title><desc id="de">Two cards comparing a normal takeoff with a crosswind takeoff: full aileron into the wind at the start, easing it off as speed builds, then lift off and crab.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:17px}.q1{stroke-width:2;opacity:.6}.q2{font-size:11.5px}.q3{font-size:13px}.q4{font-size:12px}.q5{stroke:currentColor;stroke-width:1.5}.q6{stroke-width:2;stroke-dasharray:7 6}.q8{stroke:currentColor;stroke-width:1.4;stroke-linejoin:round}</style><text class="t" x="20" y="28" style="font-size:15px">Normal and crosswind takeoff</text><text class="s q3" x="20" y="50">Same power and rudder work.</text><text class="s q3" x="20" y="66.5">The crosswind adds aileron into the wind.</text><rect class="cl" x="20" y="91" width="338" height="128" rx="8"/><rect x="20" y="91" width="338" height="26" rx="10" class="mint q4"/><text class="t q3" x="30" y="109">Normal takeoff</text><circle cx="33" cy="127" r="2.2" class="ah"/><text class="s q2" x="42" y="131">Line up, then smoothly add full</text><text class="s q2" x="42" y="146">power</text><circle cx="33" cy="160" r="2.2" class="ah"/><text class="s q2" x="42" y="164">Rudder keeps the nose straight</text><text class="s q2" x="42" y="179">(right rudder for the pull to the left)</text><circle cx="33" cy="193" r="2.2" class="ah"/><text class="s q2" x="42" y="197">Rotate at the POH speed and</text><text class="s q2" x="42" y="212">climb at the book speed</text><rect class="cl" x="372" y="91" width="338" height="128" rx="8"/><rect x="372" y="91" width="338" height="26" rx="10" class="rose q4"/><text class="t q3" x="382" y="109">Crosswind takeoff</text><circle cx="385" cy="127" r="2.2" class="ah"/><text class="s q2" x="394" y="131">Start: full aileron into the wind</text><circle cx="385" cy="145" r="2.2" class="ah"/><text class="s q2" x="394" y="149">Ease it off as speed builds and</text><text class="s q2" x="394" y="164">the ailerons work better</text><circle cx="385" cy="178" r="2.2" class="ah"/><text class="s q2" x="394" y="182">Lift off, then crab into the</text><text class="s q2" x="394" y="197">wind to hold the runway line</text><text class="t q3" x="20" y="242">Rudder holds the runway line the whole way.</text><text class="s" x="20" y="260" style="font-size:11px">Source: Airplane Flying Handbook ch. 6</text></svg>
