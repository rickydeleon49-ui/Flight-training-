<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 388" role="img" aria-labelledby="ti de"><title id="ti">The forward slip to lose altitude</title><desc id="de">Side view of a steeper path in a forward slip compared with a normal path, with cards on how to fly the slip and what to check.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:17px}.q1{stroke-width:2;opacity:.6}.q2{font-size:11.5px}.q3{font-size:13px}.q4{font-size:12px}.q5{stroke:currentColor;stroke-width:1.5}.q6{stroke-width:2;stroke-dasharray:7 6}.q8{stroke:currentColor;stroke-width:1.4;stroke-linejoin:round}</style><text class="t" x="20" y="28" style="font-size:15px">The forward slip to lose altitude</text><text class="s q3" x="20" y="50">A forward slip loses height without gaining speed.</text><text class="s q3" x="20" y="66.5">Aileron one way, opposite rudder.</text><rect class="cl" x="20" y="91" width="690" height="110" rx="8"/><path d="M30 185L700 185" class="dk" style="stroke-width:2.5"/><path d="M40 105L560 185" class="acc" style="stroke-width:3"/><path d="M40 125L560 185" class="dk q6" style="stroke-width:2;stroke-dasharray:7 6"/><g transform="translate(300 150) rotate(8) scale(1)"><ellipse cx="0" cy="0" rx="24" ry="5.5" class="sky q8"/><path d="M-20 -2L-29 -13L-22 -13L-12 -3Z" class="sky q8"/><path d="M0 2L8 2L-4 11L-9 11Z" class="cl q8"/></g><text class="t" x="420" y="112" style="font-size:12px">Track stays on the path</text><text class="s q2" x="46" y="165">Without a slip: shallow</text><text class="s q2" x="46" y="180">Slip: steeper, same speed</text><rect class="cl" x="20" y="213" width="338" height="135" rx="8"/><rect x="20" y="213" width="338" height="26" rx="10" class="sky q4"/><text class="t q3" x="30" y="231">How</text><circle cx="33" cy="249" r="2.2" class="ah"/><text class="s q2" x="42" y="253">Lower one wing with aileron</text><circle cx="33" cy="267" r="2.2" class="ah"/><text class="s q2" x="42" y="271">Add opposite rudder: the nose</text><text class="s q2" x="42" y="286">yaws aside, the track stays the same</text><circle cx="33" cy="300" r="2.2" class="ah"/><text class="s q2" x="42" y="304">Adjust pitch to keep airspeed</text><rect class="cl" x="372" y="213" width="338" height="135" rx="8"/><rect x="372" y="213" width="338" height="26" rx="10" class="rose q4"/><text class="t q3" x="382" y="231">Check</text><circle cx="385" cy="249" r="2.2" class="ah"/><text class="s q2" x="394" y="253">Flap limits on slips: look in the</text><text class="s q2" x="394" y="268">POH</text><circle cx="385" cy="282" r="2.2" class="ah"/><text class="s q2" x="394" y="286">Recover: level the wings, release</text><text class="s q2" x="394" y="301">the rudder, then set pitch</text><circle cx="385" cy="315" r="2.2" class="ah"/><text class="s q2" x="394" y="319">The airspeed indicator may read</text><text class="s q2" x="394" y="334">wrong in a slip</text><text class="s" x="20" y="372" style="font-size:11px">Source: Airplane Flying Handbook ch. 9</text></svg>
