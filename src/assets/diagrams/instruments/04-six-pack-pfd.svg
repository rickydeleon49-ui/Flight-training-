<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" role="img" aria-labelledby="ti de"><title id="ti">Six-pack on a glass panel</title><desc id="de">Layout of a primary flight display. Airspeed tape on the left, attitude indicator in the middle, altimeter on the right with the vertical speed indicator beside it, heading indicator below the attitude indicator. The tachometer is on the multi-function display.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4}.ar{stroke:var(--palette-berry,#A84C6B)}.ah{fill:var(--palette-berry,#A84C6B)}.k{fill:none;stroke-linecap:butt}.q0{font-size:19px}</style><rect x="20" y="20" width="450" height="360" rx="12" class="o"/><text class="s" x="34" y="46">Primary flight display (PFD)</text><rect x="34" y="62" width="82" height="230" rx="8" class="rose"/><text class="t m" x="75" y="170" style="font-size:16px">Airspeed</text><text class="s m" x="75" y="194">tape (ASI)</text><rect x="124" y="62" width="190" height="230" rx="8" class="sky"/><text class="t m q0" x="219" y="170">Attitude</text><text class="s m" x="219" y="194">indicator</text><text class="s m" x="219" y="224">slip/skid bar inside</text><rect x="322" y="62" width="86" height="230" rx="8" class="mint"/><text class="t m" x="365" y="178" style="font-size:17px">Altimeter</text><rect x="414" y="62" width="42" height="230" rx="8" class="lav"/><text class="t" transform="translate(440 176) rotate(-90)" style="font-size:16px" text-anchor="middle">VSI</text><rect x="124" y="302" width="190" height="68" rx="8" class="lav"/><text class="t m q0" x="219" y="332">Heading indicator</text><text class="s m" x="219" y="356">turn rate above</text><rect x="500" y="130" width="120" height="140" rx="12" class="o"/><text class="s m" x="560" y="156">MFD</text><text class="t m q0" x="560" y="206">Tachometer</text><text class="s m" x="560" y="232">not on PFD</text><text class="s" x="20" y="410">ASI left, altimeter right, VSI beside the altimeter,</text><text class="s" x="20" y="434">heading indicator below the attitude indicator.</text></svg>
