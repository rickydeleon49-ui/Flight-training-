<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-labelledby="ti de"><title id="ti">Turn coordinator versus turn-and-slip</title><desc id="de">Two instrument faces. The turn-and-slip uses a needle and shows only rate of turn. The turn coordinator has a miniature aircraft and a canted gyro, so it senses roll rate first and then rate of turn. Both have an inclinometer ball. A standard-rate turn is 3 degrees per second.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4}.ar{stroke:var(--palette-berry,#A84C6B)}.ah{fill:var(--palette-berry,#A84C6B)}.k{fill:none;stroke-linecap:butt}.q0{stroke-width:3}</style><circle cx="160" cy="130" r="95" class="o" style="stroke-width:3.5"/><path class="o q0" d="M65 130h12M255 130h-12"/><path class="o q0" d="M82 100l-9 -9M238 100l9 -9M100 70l-8 -10M220 70l8 -10"/><path class="acc" d="M160 160L194 82" style="stroke-width:5"/><circle cx="160" cy="160" r="6" class="ah"/><path class="o" d="M115 212Q160 224 205 212" style="stroke-width:2.5"/><circle cx="146" cy="212" r="6" class="ah"/><circle cx="480" cy="130" r="95" class="o" style="stroke-width:3.5"/><path class="o q0" d="M385 130h12M575 130h-12"/><path class="o q0" d="M394 140h22M566 140h-22M408 112l18 6M552 112l-18 6"/><g transform="rotate(-12 480 150)"><path class="acc" d="M428 150H532M480 150V128M468 128H492" style="stroke-width:5"/><circle cx="480" cy="150" r="8" class="ah"/></g><path class="o" d="M435 212Q480 224 525 212" style="stroke-width:2.5"/><circle cx="466" cy="212" r="6" class="ah"/><text class="t m" x="160" y="278">Turn-and-slip</text><text class="s m" x="160" y="304">needle shows rate of turn only</text><text class="s m" x="160" y="328">gyro not canted</text><text class="t m" x="480" y="278">Turn coordinator</text><text class="s m" x="480" y="304">canted gyro: roll rate first,</text><text class="s m" x="480" y="328">then rate of turn</text><text class="s m" x="320" y="376">Both: inclinometer ball (below each face).</text><text class="s m" x="320" y="402">Centered ball = coordinated. Step on the ball.</text><text class="s m" x="320" y="428">Standard-rate turn = 3 degrees per second.</text></svg>
