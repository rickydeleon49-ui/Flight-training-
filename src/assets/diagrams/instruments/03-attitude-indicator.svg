<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 490" role="img" aria-labelledby="ti de"><title id="ti">Attitude indicator read-out</title><desc id="de">Attitude indicator face. A horizon bar splits blue sky from ground. A fixed miniature aircraft sits on it. A bank scale arcs across the top. An adjustment knob sits below. The aircraft-to-horizon picture matches the real aircraft to the real horizon.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4}.ar{stroke:var(--palette-berry,#A84C6B)}.ah{fill:var(--palette-berry,#A84C6B)}.k{fill:none;stroke-linecap:butt}.q0{stroke-width:2.5}</style><defs><clipPath id="c"><circle cx="200" cy="200" r="140"/></clipPath></defs><g clip-path="url(#c)"><rect x="60" y="60" width="280" height="140" class="sky"/><rect x="60" y="200" width="280" height="140" class="lav"/></g><path class="o" d="M60 200H340" style="stroke-width:5"/><circle cx="200" cy="200" r="140" class="o" style="stroke-width:4"/><path class="o q0" d="M79 130L93 138"/><path class="o q0" d="M101 101L107 107"/><path class="o q0" d="M130 79L138 93"/><path class="o q0" d="M152 68L155 77"/><path class="o q0" d="M176 62L177 71"/><path class="o q0" d="M200 60L200 76"/><path class="o q0" d="M224 62L223 71"/><path class="o q0" d="M248 68L245 77"/><path class="o q0" d="M270 79L262 93"/><path class="o q0" d="M299 101L293 107"/><path class="o q0" d="M321 130L307 138"/><path class="acc" d="M140 200H182V210M260 200H218V210" style="stroke-width:7"/><circle cx="200" cy="200" r="6" class="ah"/><path d="M191 82L209 82L200 66Z" class="ah"/><rect x="182" y="346" width="36" height="16" rx="5" class="o" style="stroke-width:2"/><text class="t " x="364" y="92">Horizon bar</text><text class="s " x="364" y="116">= the true horizon</text><text class="t " x="364" y="196">Miniature aircraft</text><text class="s " x="364" y="220">stands for the real aircraft</text><text class="t " x="364" y="296">Bank scale</text><text class="s " x="364" y="320">degree of bank only</text><text class="s m" x="200" y="386">Adjustment knob</text><path class="o" d="M280 90L350 88M260 200L350 192M264 100L350 292" style="stroke-width:1.5;opacity:.6"/><text class="s " x="20" y="450">Aircraft to horizon bar looks like the real aircraft to the real horizon.</text><text class="s " x="20" y="476">Read direction of bank from the miniature aircraft, not the scale.</text></svg>
