<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="ti de"><title id="ti">Pitot-static system: what uses what</title><desc id="de">Pitot tube feeds the airspeed indicator only. The static port feeds the airspeed indicator, the altimeter and the vertical speed indicator.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4}.ar{stroke:var(--palette-berry,#A84C6B)}.ah{fill:var(--palette-berry,#A84C6B)}.k{fill:none;stroke-linecap:butt}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="currentColor"/></marker></defs><rect x="20" y="50" width="170" height="70" rx="12" class="o"/><text class="t m" x="105" y="92">Pitot tube</text><rect x="20" y="250" width="170" height="70" rx="12" class="o"/><text class="t m" x="105" y="292">Static port</text><rect x="400" y="50" width="220" height="70" rx="12" class="rose"/><rect x="400" y="50" width="220" height="70" rx="12" class="o"/><text class="t m" x="510" y="80" style="font-size:19px">Airspeed indicator</text><text class="s m" x="510" y="106">pitot + static</text><rect x="400" y="180" width="220" height="70" rx="12" class="sky"/><rect x="400" y="180" width="220" height="70" rx="12" class="o"/><text class="t m" x="510" y="210" style="font-size:19px">Altimeter</text><text class="s m" x="510" y="236">static only</text><rect x="400" y="300" width="220" height="70" rx="12" class="sky"/><rect x="400" y="300" width="220" height="70" rx="12" class="o"/><text class="t m" x="510" y="330" style="font-size:19px">Vertical speed indicator</text><text class="s m" x="510" y="356">static only</text><path class="acc" d="M190 70H400" marker-end="url(#a)"/><path class="o d" d="M190 285H290M290 100V335"/><path class="o d" d="M290 100H400M290 215H400M290 335H400" marker-end="url(#a)"/><path class="acc" d="M30 385H90" /><text class="s" x="100" y="392">pitot (impact) pressure</text><path class="o d" d="M330 385H390"/><text class="s" x="400" y="392">static pressure</text></svg>
