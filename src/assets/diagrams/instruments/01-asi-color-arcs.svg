<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 430" role="img" aria-labelledby="ti de"><title id="ti">Airspeed indicator color arcs</title><desc id="de">Airspeed indicator dial. A white arc from VS0 to VFE marks the flap operating range. A green arc from VS1 to VNO is the normal range. A yellow arc from VNO to VNE is the caution range. A red line at VNE is never exceed speed.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4}.ar{stroke:var(--palette-berry,#A84C6B)}.ah{fill:var(--palette-berry,#A84C6B)}.k{fill:none;stroke-linecap:butt}</style><circle cx="215" cy="215" r="150" class="o" style="stroke-width:2"/><path class="k" d="M93.2 207.3A122 122 0 0 1 313.7 143.3" style="stroke:var(--palette-mint,#AAD4C4);stroke-width:18"/><path class="k" d="M313.7 143.3A122 122 0 0 1 336.0 230.3" style="stroke:var(--status-due-today,#9A6212);stroke-width:18;stroke-opacity:.85"/><path class="k" d="M121.8 245.3A98 98 0 0 1 178.9 123.9" style="stroke:currentColor;stroke-width:12;stroke-opacity:.3"/><path class="o" d="M127.5 243.4A92 92 0 0 1 181.1 129.5" style="stroke-width:3"/><path class="o" d="M116.1 247.1A104 104 0 0 1 176.7 118.3" style="stroke-width:3"/><path d="M322.1 228.5L349.9 232.0" style="stroke:var(--status-overdue,#B0413C);stroke-width:6"/><text class="s m" x="215" y="207">AIRSPEED</text><circle cx="215" cy="235" r="6" class="ah"/><text class="t e" x="57" y="272" style="font-size:17px">VS0</text><text class="t e" x="49" y="211" style="font-size:17px">VS1</text><text class="t e" x="154" y="67" style="font-size:17px">VFE</text><text class="t" x="349" y="123" style="font-size:17px">VNO</text><text class="t" x="380" y="242" style="font-size:17px">VNE</text><rect x="440" y="46" width="34" height="14" rx="3" fill="currentColor" fill-opacity=".3" stroke="currentColor" stroke-width="3"/><text class="t" x="486" y="60">White arc</text><text class="s" x="486" y="86">flap operating range</text><text class="s" x="486" y="110" style="font-weight:600">VS0 to VFE</text><rect x="440" y="138" width="34" height="14" rx="3" class="mint"/><text class="t" x="486" y="152">Green arc</text><text class="s" x="486" y="178">normal operating range</text><text class="s" x="486" y="202" style="font-weight:600">VS1 to VNO</text><rect x="440" y="230" width="34" height="14" rx="3" style="fill:var(--status-due-today,#9A6212);fill-opacity:.85"/><text class="t" x="486" y="244">Yellow arc</text><text class="s" x="486" y="270">caution: smooth air only</text><text class="s" x="486" y="294" style="font-weight:600">VNO to VNE</text><rect x="440" y="319" width="34" height="6" style="fill:var(--status-overdue,#B0413C)"/><text class="t" x="486" y="336">Red line</text><text class="s" x="486" y="362">never exceed speed</text><text class="s" x="486" y="386" style="font-weight:600">VNE</text></svg>
