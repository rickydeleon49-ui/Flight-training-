<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 530" role="img" aria-labelledby="ti de"><title id="ti">Draining the sumps: what you should see</title><desc id="de">Three sample jars showing clear fuel, cloudy fuel and a water layer under coloured fuel, four steps for draining and checking, and two cards on why water is dangerous and why to drain both the strainer and the tank sumps.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11.5px}.q1{font-size:12px}.q2{font-size:13px}.q3{fill-opacity:.55}.q4{stroke-width:2.5}.q5{stroke:currentColor;stroke-width:1.5}.q6{fill:var(--palette-berry,#A84C6B)}</style><text class="t" x="20" y="28" style="font-size:15px">Draining the sumps: what you should see</text><text class="s q2" x="20" y="50">Drain the fuel strainer and every tank sump before each flight, into a transparent container, and look</text><text class="s q2" x="20" y="66.5">at the sample. Water is the principal contaminant.</text><path d="M48 93H112M40 105V183Q40 193 50 193H110Q120 193 120 183V105" class="o q4"/><path d="M43 121H117V182Q117 190 109 190H51Q43 190 43 182Z" class="sky"/><text class="t q2" x="136" y="123">Clear fuel</text><text class="s q1" x="136" y="141">Only coloured</text><text class="s q1" x="136" y="156.5">fuel. This is</text><text class="s q1" x="136" y="172">what you want.</text><path d="M278 93H342M270 105V183Q270 193 280 193H340Q350 193 350 183V105" class="o q4"/><path d="M273 121H347V182Q347 190 339 190H281Q273 190 273 182Z" class="sky"/><circle cx="284" cy="138" r="2.6" class="cl q3"/><circle cx="300" cy="153" r="2.6" class="cl q3"/><circle cx="318" cy="135" r="2.6" class="cl q3"/><circle cx="330" cy="163" r="2.6" class="cl q3"/><circle cx="294" cy="173" r="2.6" class="cl q3"/><circle cx="322" cy="181" r="2.6" class="cl q3"/><circle cx="336" cy="145" r="2.6" class="cl q3"/><circle cx="308" cy="167" r="2.6" class="cl q3"/><text class="t q2" x="366" y="123">Cloudy fuel</text><text class="s q1" x="366" y="141">Suspended water</text><text class="s q1" x="366" y="156.5">droplets make</text><text class="s q1" x="366" y="172">the fuel look</text><text class="s q1" x="366" y="187.5">cloudy.</text><path d="M508 93H572M500 105V183Q500 193 510 193H570Q580 193 580 183V105" class="o q4"/><path d="M503 121H577V182Q577 190 569 190H511Q503 190 503 182Z" class="sky"/><path d="M503 161H577V182Q577 190 569 190H511Q503 190 503 182Z" class="mint"/><path d="M503 161H577" class="dk" style="stroke-width:1.6"/><text class="t q2" x="596" y="123">Water layer</text><text class="s q1" x="596" y="141">Water separates</text><text class="s q1" x="596" y="156.5">clearly from the</text><text class="s q1" x="596" y="172">coloured fuel</text><text class="s q1" x="596" y="187.5">and settles to</text><text class="s q1" x="596" y="203">the bottom.</text><text class="t" x="20" y="239" style="font-size:14px">Steps</text><rect class="cl" x="20" y="249" width="156" height="116" rx="8"/><rect x="20" y="249" width="156" height="26" rx="10" class="sky q5"/><text class="t q2" x="30" y="267">1 Drain</text><circle cx="33" cy="285" r="2.2" class="ah"/><text class="s q0" x="42" y="289">Drain the strainer</text><text class="s q0" x="42" y="304">quick drain and each</text><text class="s q0" x="42" y="319">tank sump into a</text><text class="s q0" x="42" y="334">transparent</text><text class="s q0" x="42" y="349">container.</text><path d="M179 307L187 307" class="acc q4"/><path d="M195 307L187 310.6L187 303.4Z" class="dh q6"/><rect class="cl" x="198" y="249" width="156" height="116" rx="8"/><rect x="198" y="249" width="156" height="26" rx="10" class="lav q5"/><text class="t q2" x="208" y="267">2 Look</text><circle cx="211" cy="285" r="2.2" class="ah"/><text class="s q0" x="220" y="289">Check each sample</text><text class="s q0" x="220" y="304">for dirt and water.</text><path d="M357 307L365 307" class="acc q4"/><path d="M373 307L365 310.6L365 303.4Z" class="dh q6"/><rect class="cl" x="376" y="249" width="156" height="116" rx="8"/><rect x="376" y="249" width="156" height="26" rx="10" class="mint q5"/><text class="t q2" x="386" y="267">3 Repeat</text><circle cx="389" cy="285" r="2.2" class="ah"/><text class="s q0" x="398" y="289">Water or dirt in the</text><text class="s q0" x="398" y="304">first sample? Drain</text><text class="s q0" x="398" y="319">more samples until</text><text class="s q0" x="398" y="334">no trace appears.</text><path d="M535 307L543 307" class="acc q4"/><path d="M551 307L543 310.6L543 303.4Z" class="dh q6"/><rect class="cl" x="554" y="249" width="156" height="116" rx="8"/><rect x="554" y="249" width="156" height="26" rx="10" class="rose q5"/><text class="t q2" x="564" y="267">4 Fly</text><circle cx="567" cy="285" r="2.2" class="ah"/><text class="s q0" x="576" y="289">Never take off until</text><text class="s q0" x="576" y="304">all water and</text><text class="s q0" x="576" y="319">contaminants are out</text><text class="s q0" x="576" y="334">of the engine fuel</text><text class="s q0" x="576" y="349">system.</text><rect class="cl" x="20" y="379" width="338" height="137" rx="8"/><rect x="20" y="379" width="338" height="26" rx="10" class="rose q5"/><text class="t q2" x="30" y="397">Why water is dangerous</text><circle cx="33" cy="415" r="2.2" class="ah"/><text class="s q0" x="42" y="419">In cold weather it can freeze and block fuel lines.</text><circle cx="33" cy="433" r="2.2" class="ah"/><text class="s q0" x="42" y="437">In warm weather it can flow into the carburetor and</text><text class="s q0" x="42" y="452">stop the engine.</text><circle cx="33" cy="466" r="2.2" class="ah"/><text class="s q0" x="42" y="470">Water in the sump means more water in the tanks is</text><text class="s q0" x="42" y="485">probable. Drain them until there is no sign of</text><text class="s q0" x="42" y="500">water.</text><rect class="cl" x="372" y="379" width="338" height="137" rx="8"/><rect x="372" y="379" width="338" height="26" rx="10" class="sky q5"/><text class="t q2" x="382" y="397">Drain enough, from both places</text><circle cx="385" cy="415" r="2.2" class="ah"/><text class="s q0" x="394" y="419">At the strainer, water in the tank may not show</text><text class="s q0" x="394" y="434">until the fuel in the lines to the tank has been</text><text class="s q0" x="394" y="449">drained. Drain enough to be sure fuel is coming</text><text class="s q0" x="394" y="464">from the tank.</text><circle cx="385" cy="478" r="2.2" class="ah"/><text class="s q0" x="394" y="482">Water can stay in a tank after the strainer shows</text><text class="s q0" x="394" y="497">none. Only the tank sump drains remove it.</text></svg>
