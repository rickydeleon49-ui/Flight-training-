<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 530" role="img" aria-labelledby="ti de"><title id="ti">Draining the sumps: what you should see</title><desc id="de">Three sample jars showing clear fuel, cloudy fuel and a water layer under coloured fuel, four steps for draining and checking, and two cards on why water is dangerous and why to drain both the strainer and the tank sumps.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><text class="t" x="20" y="28" style="font-size:15px">Draining the sumps: what you should see</text><text class="s" x="20" y="50.0" style="font-size:13px">Drain the fuel strainer and every tank sump before each flight, into a transparent container, and look</text><text class="s" x="20" y="66.5" style="font-size:13px">at the sample. Water is the principal contaminant.</text><path d="M48.0 93.0H112.0M40.0 105.0V183.0Q40.0 193.0 50.0 193.0H110.0Q120.0 193.0 120.0 183.0V105.0" class="o" style="stroke-width:2.5"/><path d="M43.0 121.0H117.0V182.0Q117.0 190.0 109.0 190.0H51.0Q43.0 190.0 43.0 182.0Z" class="sky"/><text class="t" x="136.0" y="123.0" style="font-size:13px">Clear fuel</text><text class="s" x="136.0" y="141.0" style="font-size:12px">Only coloured</text><text class="s" x="136.0" y="156.5" style="font-size:12px">fuel. This is</text><text class="s" x="136.0" y="172.0" style="font-size:12px">what you want.</text><path d="M278.0 93.0H342.0M270.0 105.0V183.0Q270.0 193.0 280.0 193.0H340.0Q350.0 193.0 350.0 183.0V105.0" class="o" style="stroke-width:2.5"/><path d="M273.0 121.0H347.0V182.0Q347.0 190.0 339.0 190.0H281.0Q273.0 190.0 273.0 182.0Z" class="sky"/><circle cx="284.0" cy="138.0" r="2.6" class="cl" style="fill-opacity:.55"/><circle cx="300.0" cy="153.0" r="2.6" class="cl" style="fill-opacity:.55"/><circle cx="318.0" cy="135.0" r="2.6" class="cl" style="fill-opacity:.55"/><circle cx="330.0" cy="163.0" r="2.6" class="cl" style="fill-opacity:.55"/><circle cx="294.0" cy="173.0" r="2.6" class="cl" style="fill-opacity:.55"/><circle cx="322.0" cy="181.0" r="2.6" class="cl" style="fill-opacity:.55"/><circle cx="336.0" cy="145.0" r="2.6" class="cl" style="fill-opacity:.55"/><circle cx="308.0" cy="167.0" r="2.6" class="cl" style="fill-opacity:.55"/><text class="t" x="366.0" y="123.0" style="font-size:13px">Cloudy fuel</text><text class="s" x="366.0" y="141.0" style="font-size:12px">Suspended water</text><text class="s" x="366.0" y="156.5" style="font-size:12px">droplets make</text><text class="s" x="366.0" y="172.0" style="font-size:12px">the fuel look</text><text class="s" x="366.0" y="187.5" style="font-size:12px">cloudy.</text><path d="M508.0 93.0H572.0M500.0 105.0V183.0Q500.0 193.0 510.0 193.0H570.0Q580.0 193.0 580.0 183.0V105.0" class="o" style="stroke-width:2.5"/><path d="M503.0 121.0H577.0V182.0Q577.0 190.0 569.0 190.0H511.0Q503.0 190.0 503.0 182.0Z" class="sky"/><path d="M503.0 161.0H577.0V182.0Q577.0 190.0 569.0 190.0H511.0Q503.0 190.0 503.0 182.0Z" class="mint"/><path d="M503.0 161.0H577.0" class="dk" style="stroke-width:1.6"/><text class="t" x="596.0" y="123.0" style="font-size:13px">Water layer</text><text class="s" x="596.0" y="141.0" style="font-size:12px">Water separates</text><text class="s" x="596.0" y="156.5" style="font-size:12px">clearly from the</text><text class="s" x="596.0" y="172.0" style="font-size:12px">coloured fuel</text><text class="s" x="596.0" y="187.5" style="font-size:12px">and settles to</text><text class="s" x="596.0" y="203.0" style="font-size:12px">the bottom.</text><text class="t" x="20" y="239.0" style="font-size:14px">Steps</text><rect class="cl" x="20.0" y="249.0" width="156.0" height="116.0" rx="8"/><rect x="20.0" y="249.0" width="156.0" height="26" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30.0" y="267.0" style="font-size:13px">1 Drain</text><circle cx="33.0" cy="285.0" r="2.2" class="ah"/><text class="s" x="42.0" y="289.0" style="font-size:11.5px">Drain the strainer</text><text class="s" x="42.0" y="304.0" style="font-size:11.5px">quick drain and each</text><text class="s" x="42.0" y="319.0" style="font-size:11.5px">tank sump into a</text><text class="s" x="42.0" y="334.0" style="font-size:11.5px">transparent</text><text class="s" x="42.0" y="349.0" style="font-size:11.5px">container.</text><path d="M179.0 307.0L187.0 307.0" class="acc" style="stroke-width:2.5"/><path d="M195.0 307.0L187.0 310.6L187.0 303.4Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><rect class="cl" x="198.0" y="249.0" width="156.0" height="116.0" rx="8"/><rect x="198.0" y="249.0" width="156.0" height="26" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="208.0" y="267.0" style="font-size:13px">2 Look</text><circle cx="211.0" cy="285.0" r="2.2" class="ah"/><text class="s" x="220.0" y="289.0" style="font-size:11.5px">Check each sample</text><text class="s" x="220.0" y="304.0" style="font-size:11.5px">for dirt and water.</text><path d="M357.0 307.0L365.0 307.0" class="acc" style="stroke-width:2.5"/><path d="M373.0 307.0L365.0 310.6L365.0 303.4Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><rect class="cl" x="376.0" y="249.0" width="156.0" height="116.0" rx="8"/><rect x="376.0" y="249.0" width="156.0" height="26" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="386.0" y="267.0" style="font-size:13px">3 Repeat</text><circle cx="389.0" cy="285.0" r="2.2" class="ah"/><text class="s" x="398.0" y="289.0" style="font-size:11.5px">Water or dirt in the</text><text class="s" x="398.0" y="304.0" style="font-size:11.5px">first sample? Drain</text><text class="s" x="398.0" y="319.0" style="font-size:11.5px">more samples until</text><text class="s" x="398.0" y="334.0" style="font-size:11.5px">no trace appears.</text><path d="M535.0 307.0L543.0 307.0" class="acc" style="stroke-width:2.5"/><path d="M551.0 307.0L543.0 310.6L543.0 303.4Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><rect class="cl" x="554.0" y="249.0" width="156.0" height="116.0" rx="8"/><rect x="554.0" y="249.0" width="156.0" height="26" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="564.0" y="267.0" style="font-size:13px">4 Fly</text><circle cx="567.0" cy="285.0" r="2.2" class="ah"/><text class="s" x="576.0" y="289.0" style="font-size:11.5px">Never take off until</text><text class="s" x="576.0" y="304.0" style="font-size:11.5px">all water and</text><text class="s" x="576.0" y="319.0" style="font-size:11.5px">contaminants are out</text><text class="s" x="576.0" y="334.0" style="font-size:11.5px">of the engine fuel</text><text class="s" x="576.0" y="349.0" style="font-size:11.5px">system.</text><rect class="cl" x="20.0" y="379.0" width="338.0" height="137.0" rx="8"/><rect x="20.0" y="379.0" width="338.0" height="26" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30.0" y="397.0" style="font-size:13px">Why water is dangerous</text><circle cx="33.0" cy="415.0" r="2.2" class="ah"/><text class="s" x="42.0" y="419.0" style="font-size:11.5px">In cold weather it can freeze and block fuel lines.</text><circle cx="33.0" cy="433.0" r="2.2" class="ah"/><text class="s" x="42.0" y="437.0" style="font-size:11.5px">In warm weather it can flow into the carburetor and</text><text class="s" x="42.0" y="452.0" style="font-size:11.5px">stop the engine.</text><circle cx="33.0" cy="466.0" r="2.2" class="ah"/><text class="s" x="42.0" y="470.0" style="font-size:11.5px">Water in the sump means more water in the tanks is</text><text class="s" x="42.0" y="485.0" style="font-size:11.5px">probable. Drain them until there is no sign of</text><text class="s" x="42.0" y="500.0" style="font-size:11.5px">water.</text><rect class="cl" x="372.0" y="379.0" width="338.0" height="137.0" rx="8"/><rect x="372.0" y="379.0" width="338.0" height="26" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="382.0" y="397.0" style="font-size:13px">Drain enough, from both places</text><circle cx="385.0" cy="415.0" r="2.2" class="ah"/><text class="s" x="394.0" y="419.0" style="font-size:11.5px">At the strainer, water in the tank may not show</text><text class="s" x="394.0" y="434.0" style="font-size:11.5px">until the fuel in the lines to the tank has been</text><text class="s" x="394.0" y="449.0" style="font-size:11.5px">drained. Drain enough to be sure fuel is coming</text><text class="s" x="394.0" y="464.0" style="font-size:11.5px">from the tank.</text><circle cx="385.0" cy="478.0" r="2.2" class="ah"/><text class="s" x="394.0" y="482.0" style="font-size:11.5px">Water can stay in a tank after the strainer shows</text><text class="s" x="394.0" y="497.0" style="font-size:11.5px">none. Only the tank sump drains remove it.</text></svg>
