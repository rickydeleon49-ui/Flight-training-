<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 510" role="img" aria-labelledby="ti de"><title id="ti">Water in the fuel: where it hides</title><desc id="de">A side view of a fuel tank showing dissolved water, entrained droplets and a free water layer above the sump drain, with cards on ice in the fuel system and keeping water out.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11.5px}.q1{fill-opacity:.6}.q2{font-size:13px}.q3{stroke-width:1.3;opacity:.6}.q4{stroke:currentColor;stroke-width:1.5}</style><text class="t" x="20" y="28" style="font-size:15px">Water in the fuel: where it hides</text><text class="s q2" x="20" y="50">Ice in the fuel system comes from water in the fuel. That water can be free, entrained or dissolved,</text><text class="s q2" x="20" y="66.5">and each form behaves differently.</text><rect x="30" y="97" width="300" height="120" rx="12" class="cl" style="stroke:currentColor;stroke-width:2.5"/><path d="M33 105H327V204Q327 214 317 214H43Q33 214 33 204Z" class="sky"/><path d="M33 185H327V204Q327 214 317 214H43Q33 214 33 204Z" class="mint"/><path d="M33 185H327" class="dk" style="stroke-width:1.6"/><circle cx="70" cy="127" r="2.4" class="cl q1"/><circle cx="120" cy="149" r="2.4" class="cl q1"/><circle cx="180" cy="123" r="2.4" class="cl q1"/><circle cx="230" cy="159" r="2.4" class="cl q1"/><circle cx="280" cy="135" r="2.4" class="cl q1"/><circle cx="150" cy="171" r="2.4" class="cl q1"/><circle cx="300" cy="167" r="2.4" class="cl q1"/><circle cx="90" cy="163" r="2.4" class="cl q1"/><rect x="260" y="217" width="14" height="16" class="cl" style="stroke:currentColor;stroke-width:2"/><text class="s m q0" x="267" y="249">Sump drain</text><text class="s q0" x="30" y="269">Side view of a fuel tank</text><path d="M320 117L364 111" class="dk q3"/><text class="t q2" x="372" y="113">Dissolved</text><text class="s q0" x="372" y="129">Water in solution. It cannot be removed unless the</text><text class="s q0" x="372" y="144">temperature is reduced to turn it into entrained, then</text><text class="s q0" x="372" y="159">free water.</text><path d="M230 159L364 189" class="dk q3"/><text class="t q2" x="372" y="191">Entrained</text><text class="s q0" x="372" y="207">Minute droplets suspended in the fuel, usually too small</text><text class="s q0" x="372" y="222">to see. It may cause slight haziness. It settles out in</text><text class="s q0" x="372" y="237">time, but not all of it can be separated in the field.</text><path d="M320 202L364 259" class="dk q3"/><text class="t q2" x="372" y="261">Free water</text><text class="s q0" x="372" y="277">Settles at the bottom, with a continuous line between it</text><text class="s q0" x="372" y="292">and the fuel above. Drain it at the sump drains.</text><rect class="cl" x="20" y="311" width="338" height="185" rx="8"/><rect x="20" y="311" width="338" height="26" rx="10" class="lav q4"/><text class="t q2" x="30" y="329">Ice</text><circle cx="33" cy="347" r="2.2" class="ah"/><text class="s q0" x="42" y="351">Ice crystals can block fuel screens, strainers and</text><text class="s q0" x="42" y="366">filters.</text><circle cx="33" cy="380" r="2.2" class="ah"/><text class="s q0" x="42" y="384">Water cooled further in the carburetor air passages</text><text class="s q0" x="42" y="399">can cause carburetor icing.</text><circle cx="33" cy="413" r="2.2" class="ah"/><text class="s q0" x="42" y="417">Frozen free water in a tank can make the drains</text><text class="s q0" x="42" y="432">useless, then melt and stop the engine. Move the</text><text class="s q0" x="42" y="447">aircraft to a warm hangar, then activate and check</text><text class="s q0" x="42" y="462">all sumps and drains before flight.</text><rect class="cl" x="372" y="311" width="338" height="185" rx="8"/><rect x="372" y="311" width="338" height="26" rx="10" class="mint q4"/><text class="t q2" x="382" y="329">Keeping water out</text><circle cx="385" cy="347" r="2.2" class="ah"/><text class="s q0" x="394" y="351">Fill the tanks after each flight, or after the last</text><text class="s q0" x="394" y="366">flight of the day, to stop moisture condensing in</text><text class="s q0" x="394" y="381">the tank.</text><circle cx="385" cy="395" r="2.2" class="ah"/><text class="s q0" x="394" y="399">Avoid refueling from cans and drums.</text><circle cx="385" cy="413" r="2.2" class="ah"/><text class="s q0" x="394" y="417">A chamois does not always give clean fuel. A</text><text class="s q0" x="394" y="432">worn-out or damp chamois does not filter water.</text><circle cx="385" cy="446" r="2.2" class="ah"/><text class="s q0" x="394" y="450">Anti-icing additives, where approved, are no</text><text class="s q0" x="394" y="465">substitute for carburetor heat. Too little or too</text><text class="s q0" x="394" y="480">much additive reduces how well they work.</text></svg>
