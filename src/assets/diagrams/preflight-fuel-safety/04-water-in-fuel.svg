<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 510" role="img" aria-labelledby="ti de"><title id="ti">Water in the fuel: where it hides</title><desc id="de">A side view of a fuel tank showing dissolved water, entrained droplets and a free water layer above the sump drain, with cards on ice in the fuel system and keeping water out.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><text class="t" x="20" y="28" style="font-size:15px">Water in the fuel: where it hides</text><text class="s" x="20" y="50.0" style="font-size:13px">Ice in the fuel system comes from water in the fuel. That water can be free, entrained or dissolved,</text><text class="s" x="20" y="66.5" style="font-size:13px">and each form behaves differently.</text><rect x="30" y="97.0" width="300" height="120" rx="12" class="cl" style="stroke:currentColor;stroke-width:2.5"/><path d="M33 105.0H327V204.0Q327 214.0 317 214.0H43Q33 214.0 33 204.0Z" class="sky"/><path d="M33 185.0H327V204.0Q327 214.0 317 214.0H43Q33 214.0 33 204.0Z" class="mint"/><path d="M33 185.0H327" class="dk" style="stroke-width:1.6"/><circle cx="70" cy="127.0" r="2.4" class="cl" style="fill-opacity:.6"/><circle cx="120" cy="149.0" r="2.4" class="cl" style="fill-opacity:.6"/><circle cx="180" cy="123.0" r="2.4" class="cl" style="fill-opacity:.6"/><circle cx="230" cy="159.0" r="2.4" class="cl" style="fill-opacity:.6"/><circle cx="280" cy="135.0" r="2.4" class="cl" style="fill-opacity:.6"/><circle cx="150" cy="171.0" r="2.4" class="cl" style="fill-opacity:.6"/><circle cx="300" cy="167.0" r="2.4" class="cl" style="fill-opacity:.6"/><circle cx="90" cy="163.0" r="2.4" class="cl" style="fill-opacity:.6"/><rect x="260" y="217.0" width="14" height="16" class="cl" style="stroke:currentColor;stroke-width:2"/><text class="s m" x="267" y="249.0" style="font-size:11.5px">Sump drain</text><text class="s" x="30" y="269.0" style="font-size:11.5px">Side view of a fuel tank</text><path d="M320 117.0L364 111.0" class="dk" style="stroke-width:1.3;opacity:.6"/><text class="t" x="372" y="113.0" style="font-size:13px">Dissolved</text><text class="s" x="372" y="129.0" style="font-size:11.5px">Water in solution. It cannot be removed unless the</text><text class="s" x="372" y="144.0" style="font-size:11.5px">temperature is reduced to turn it into entrained, then</text><text class="s" x="372" y="159.0" style="font-size:11.5px">free water.</text><path d="M230 159.0L364 189.0" class="dk" style="stroke-width:1.3;opacity:.6"/><text class="t" x="372" y="191.0" style="font-size:13px">Entrained</text><text class="s" x="372" y="207.0" style="font-size:11.5px">Minute droplets suspended in the fuel, usually too small</text><text class="s" x="372" y="222.0" style="font-size:11.5px">to see. It may cause slight haziness. It settles out in</text><text class="s" x="372" y="237.0" style="font-size:11.5px">time, but not all of it can be separated in the field.</text><path d="M320 202.0L364 259.0" class="dk" style="stroke-width:1.3;opacity:.6"/><text class="t" x="372" y="261.0" style="font-size:13px">Free water</text><text class="s" x="372" y="277.0" style="font-size:11.5px">Settles at the bottom, with a continuous line between it</text><text class="s" x="372" y="292.0" style="font-size:11.5px">and the fuel above. Drain it at the sump drains.</text><rect class="cl" x="20.0" y="311.0" width="338.0" height="185.0" rx="8"/><rect x="20.0" y="311.0" width="338.0" height="26" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30.0" y="329.0" style="font-size:13px">Ice</text><circle cx="33.0" cy="347.0" r="2.2" class="ah"/><text class="s" x="42.0" y="351.0" style="font-size:11.5px">Ice crystals can block fuel screens, strainers and</text><text class="s" x="42.0" y="366.0" style="font-size:11.5px">filters.</text><circle cx="33.0" cy="380.0" r="2.2" class="ah"/><text class="s" x="42.0" y="384.0" style="font-size:11.5px">Water cooled further in the carburetor air passages</text><text class="s" x="42.0" y="399.0" style="font-size:11.5px">can cause carburetor icing.</text><circle cx="33.0" cy="413.0" r="2.2" class="ah"/><text class="s" x="42.0" y="417.0" style="font-size:11.5px">Frozen free water in a tank can make the drains</text><text class="s" x="42.0" y="432.0" style="font-size:11.5px">useless, then melt and stop the engine. Move the</text><text class="s" x="42.0" y="447.0" style="font-size:11.5px">aircraft to a warm hangar, then activate and check</text><text class="s" x="42.0" y="462.0" style="font-size:11.5px">all sumps and drains before flight.</text><rect class="cl" x="372.0" y="311.0" width="338.0" height="185.0" rx="8"/><rect x="372.0" y="311.0" width="338.0" height="26" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="382.0" y="329.0" style="font-size:13px">Keeping water out</text><circle cx="385.0" cy="347.0" r="2.2" class="ah"/><text class="s" x="394.0" y="351.0" style="font-size:11.5px">Fill the tanks after each flight, or after the last</text><text class="s" x="394.0" y="366.0" style="font-size:11.5px">flight of the day, to stop moisture condensing in</text><text class="s" x="394.0" y="381.0" style="font-size:11.5px">the tank.</text><circle cx="385.0" cy="395.0" r="2.2" class="ah"/><text class="s" x="394.0" y="399.0" style="font-size:11.5px">Avoid refueling from cans and drums.</text><circle cx="385.0" cy="413.0" r="2.2" class="ah"/><text class="s" x="394.0" y="417.0" style="font-size:11.5px">A chamois does not always give clean fuel. A</text><text class="s" x="394.0" y="432.0" style="font-size:11.5px">worn-out or damp chamois does not filter water.</text><circle cx="385.0" cy="446.0" r="2.2" class="ah"/><text class="s" x="394.0" y="450.0" style="font-size:11.5px">Anti-icing additives, where approved, are no</text><text class="s" x="394.0" y="465.0" style="font-size:11.5px">substitute for carburetor heat. Too little or too</text><text class="s" x="394.0" y="480.0" style="font-size:11.5px">much additive reduces how well they work.</text></svg>
