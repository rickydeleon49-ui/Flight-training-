<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 554" role="img" aria-labelledby="ti de"><title id="ti">Refueling: ground and bond first</title><desc id="de">A drum, a ground post and an aircraft joined by numbered wires showing the connection order, and three cards on ground wire and bonding, fuel trucks and using a chamois.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11.5px}.q1{font-size:13px}.q2{font-size:12.5px}.q3{font-size:13px;fill:#fff}.q4{font-size:12px;fill:#fff}.q5{stroke:currentColor;stroke-width:1.5}.q6{stroke:currentColor;stroke-width:2}.q7{stroke:currentColor;stroke-width:1.4;stroke-linejoin:round}</style><text class="t" x="20" y="28" style="font-size:15px">Refueling: ground and bond first</text><text class="s q1" x="20" y="50">Static electricity builds from air over the aircraft in flight and from fuel flowing through the hose</text><text class="s q1" x="20" y="66.5">and nozzle. Ground wires and bonding guard against it igniting fuel fumes.</text><text class="t" x="20" y="97" style="font-size:14px">Refueling from a drum or can: connect in this order</text><rect x="50" y="145" width="64" height="76" rx="10" class="sky q6"/><path d="M50 161H114M50 203H114" class="o" style="stroke-width:1.5"/><text class="t m q1" x="82" y="239">Drum</text><rect x="318" y="145" width="14" height="60" class="cl q6"/><path d="M305 205H345M311 212H339M317 219H333" class="dk" style="stroke-width:2.5"/><text class="t m q1" x="325" y="239">Ground</text><g transform="translate(590 173) rotate(0) scale(1.9)"><ellipse cx="0" cy="0" rx="24" ry="5.5" class="sky" style="stroke:currentColor;stroke-width:1.4"/><path d="M-20 -2L-29 -13L-22 -13L-12 -3Z" class="sky q7"/><path d="M0 2L8 2L-4 11L-9 11Z" class="cl q7"/></g><text class="t m q1" x="590" y="239">Aircraft</text><path d="M114 179H318" class="acc"/><circle cx="216" cy="179" r="12" class="ah"/><text class="t m q3" x="216" y="183.33">1</text><path d="M332 179H555" class="acc"/><circle cx="444" cy="179" r="12" class="ah"/><text class="t m q3" x="444" y="183.33">2</text><path d="M98 145V127H600V165" class="acc d" style="stroke-dasharray:10 8"/><circle cx="350" cy="127" r="12" class="ah"/><text class="t m q3" x="350" y="131.33">3</text><circle cx="30" cy="253" r="10" class="ah"/><text class="t m q4" x="30" y="257">1</text><text class="s q2" x="50" y="257">Drum to ground</text><circle cx="30" cy="275" r="10" class="ah"/><text class="t m q4" x="30" y="279">2</text><text class="s q2" x="50" y="279">Ground to aircraft</text><circle cx="30" cy="297" r="10" class="ah"/><text class="t m q4" x="30" y="301">3</text><text class="s q2" x="50" y="301">Drum to aircraft, or nozzle to aircraft, before removing the fuel cap</text><text class="t q2" x="30" y="323">When disconnecting, reverse the order.</text><rect class="cl" x="20" y="343" width="220.67" height="197" rx="8"/><rect x="20" y="343" width="220.67" height="26" rx="10" class="sky q5"/><text class="t q1" x="30" y="361">Ground wire and bonding</text><circle cx="33" cy="379" r="2.2" class="ah"/><text class="s q0" x="42" y="383">Attach a ground wire to the</text><text class="s q0" x="42" y="398">aircraft before the fuel cap</text><text class="s q0" x="42" y="413">comes off.</text><circle cx="33" cy="427" r="2.2" class="ah"/><text class="s q0" x="42" y="431">The aircraft and refueler hold</text><text class="s q0" x="42" y="446">different charges. Bonding them</text><text class="s q0" x="42" y="461">to each other equalizes the</text><text class="s q0" x="42" y="476">charge.</text><circle cx="33" cy="490" r="2.2" class="ah"/><text class="s q0" x="42" y="494">Bond the nozzle to the aircraft</text><text class="s q0" x="42" y="509">before refueling and keep it</text><text class="s q0" x="42" y="524">bonded the whole time.</text><rect class="cl" x="254.67" y="343" width="220.67" height="197" rx="8"/><rect x="254.67" y="343" width="220.67" height="26" rx="10" class="lav q5"/><text class="t q1" x="264.67" y="361">Fuel truck</text><circle cx="267.67" cy="379" r="2.2" class="ah"/><text class="s q0" x="276.67" y="383">Ground the truck before the</text><text class="s q0" x="276.67" y="398">fuel nozzle touches the</text><text class="s q0" x="276.67" y="413">aircraft.</text><circle cx="267.67" cy="427" r="2.2" class="ah"/><text class="s q0" x="276.67" y="431">Nylon, Dacron or wool clothing</text><text class="s q0" x="276.67" y="446">readily builds up and</text><text class="s q0" x="276.67" y="461">discharges static from the</text><text class="s q0" x="276.67" y="476">person to the funnel or nozzle.</text><rect class="cl" x="489.33" y="343" width="220.67" height="197" rx="8"/><rect x="489.33" y="343" width="220.67" height="26" rx="10" class="rose q5"/><text class="t q1" x="499.33" y="361">Using a chamois</text><circle cx="502.33" cy="379" r="2.2" class="ah"/><text class="s q0" x="511.33" y="383">Fuel passing through a chamois</text><text class="s q0" x="511.33" y="398">adds to the static charge and</text><text class="s q0" x="511.33" y="413">the danger of sparks.</text><circle cx="502.33" cy="427" r="2.2" class="ah"/><text class="s q0" x="511.33" y="431">Ground the aircraft. Bond the</text><text class="s q0" x="511.33" y="446">nozzle, chamois filter and</text><text class="s q0" x="511.33" y="461">funnel to it. Connect a can to</text><text class="s q0" x="511.33" y="476">the grounding post or the</text><text class="s q0" x="511.33" y="491">funnel.</text><circle cx="502.33" cy="505" r="2.2" class="ah"/><text class="s q0" x="511.33" y="509">Never use a plastic bucket or</text><text class="s q0" x="511.33" y="524">other nonconductive container.</text></svg>
