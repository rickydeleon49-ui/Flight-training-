<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 554" role="img" aria-labelledby="ti de"><title id="ti">Refueling: ground and bond first</title><desc id="de">A drum, a ground post and an aircraft joined by numbered wires showing the connection order, and three cards on ground wire and bonding, fuel trucks and using a chamois.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><text class="t" x="20" y="28" style="font-size:15px">Refueling: ground and bond first</text><text class="s" x="20" y="50.0" style="font-size:13px">Static electricity builds from air over the aircraft in flight and from fuel flowing through the hose</text><text class="s" x="20" y="66.5" style="font-size:13px">and nozzle. Ground wires and bonding guard against it igniting fuel fumes.</text><text class="t" x="20" y="97.0" style="font-size:14px">Refueling from a drum or can: connect in this order</text><rect x="50" y="145.0" width="64" height="76" rx="10" class="sky" style="stroke:currentColor;stroke-width:2"/><path d="M50 161.0H114M50 203.0H114" class="o" style="stroke-width:1.5"/><text class="t m" x="82" y="239.0" style="font-size:13px">Drum</text><rect x="318" y="145.0" width="14" height="60" class="cl" style="stroke:currentColor;stroke-width:2"/><path d="M305 205.0H345M311 212.0H339M317 219.0H333" class="dk" style="stroke-width:2.5"/><text class="t m" x="325" y="239.0" style="font-size:13px">Ground</text><g transform="translate(590 173.0) rotate(0) scale(1.9)"><ellipse cx="0" cy="0" rx="24" ry="5.5" class="sky" style="stroke:currentColor;stroke-width:1.4"/><path d="M-20 -2L-29 -13L-22 -13L-12 -3Z" class="sky" style="stroke:currentColor;stroke-width:1.4;stroke-linejoin:round"/><path d="M0 2L8 2L-4 11L-9 11Z" class="cl" style="stroke:currentColor;stroke-width:1.4;stroke-linejoin:round"/></g><text class="t m" x="590" y="239.0" style="font-size:13px">Aircraft</text><path d="M114 179.0H318" class="acc"/><circle cx="216" cy="179.0" r="12" class="ah"/><text class="t m" x="216" y="183.33333333333334" style="font-size:13px;fill:#fff">1</text><path d="M332 179.0H555" class="acc"/><circle cx="444" cy="179.0" r="12" class="ah"/><text class="t m" x="444" y="183.33333333333334" style="font-size:13px;fill:#fff">2</text><path d="M98 145.0V127.0H600V165.0" class="acc d" style="stroke-dasharray:10 8"/><circle cx="350" cy="127.0" r="12" class="ah"/><text class="t m" x="350" y="131.33333333333334" style="font-size:13px;fill:#fff">3</text><circle cx="30" cy="253.0" r="10" class="ah"/><text class="t m" x="30" y="257.0" style="font-size:12px;fill:#fff">1</text><text class="s" x="50" y="257.0" style="font-size:12.5px">Drum to ground</text><circle cx="30" cy="275.0" r="10" class="ah"/><text class="t m" x="30" y="279.0" style="font-size:12px;fill:#fff">2</text><text class="s" x="50" y="279.0" style="font-size:12.5px">Ground to aircraft</text><circle cx="30" cy="297.0" r="10" class="ah"/><text class="t m" x="30" y="301.0" style="font-size:12px;fill:#fff">3</text><text class="s" x="50" y="301.0" style="font-size:12.5px">Drum to aircraft, or nozzle to aircraft, before removing the fuel cap</text><text class="t" x="30" y="323.0" style="font-size:12.5px">When disconnecting, reverse the order.</text><rect class="cl" x="20.0" y="343.0" width="220.66666666666666" height="197.0" rx="8"/><rect x="20.0" y="343.0" width="220.66666666666666" height="26" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30.0" y="361.0" style="font-size:13px">Ground wire and bonding</text><circle cx="33.0" cy="379.0" r="2.2" class="ah"/><text class="s" x="42.0" y="383.0" style="font-size:11.5px">Attach a ground wire to the</text><text class="s" x="42.0" y="398.0" style="font-size:11.5px">aircraft before the fuel cap</text><text class="s" x="42.0" y="413.0" style="font-size:11.5px">comes off.</text><circle cx="33.0" cy="427.0" r="2.2" class="ah"/><text class="s" x="42.0" y="431.0" style="font-size:11.5px">The aircraft and refueler hold</text><text class="s" x="42.0" y="446.0" style="font-size:11.5px">different charges. Bonding them</text><text class="s" x="42.0" y="461.0" style="font-size:11.5px">to each other equalizes the</text><text class="s" x="42.0" y="476.0" style="font-size:11.5px">charge.</text><circle cx="33.0" cy="490.0" r="2.2" class="ah"/><text class="s" x="42.0" y="494.0" style="font-size:11.5px">Bond the nozzle to the aircraft</text><text class="s" x="42.0" y="509.0" style="font-size:11.5px">before refueling and keep it</text><text class="s" x="42.0" y="524.0" style="font-size:11.5px">bonded the whole time.</text><rect class="cl" x="254.66666666666666" y="343.0" width="220.66666666666666" height="197.0" rx="8"/><rect x="254.66666666666666" y="343.0" width="220.66666666666666" height="26" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="264.66666666666663" y="361.0" style="font-size:13px">Fuel truck</text><circle cx="267.66666666666663" cy="379.0" r="2.2" class="ah"/><text class="s" x="276.66666666666663" y="383.0" style="font-size:11.5px">Ground the truck before the</text><text class="s" x="276.66666666666663" y="398.0" style="font-size:11.5px">fuel nozzle touches the</text><text class="s" x="276.66666666666663" y="413.0" style="font-size:11.5px">aircraft.</text><circle cx="267.66666666666663" cy="427.0" r="2.2" class="ah"/><text class="s" x="276.66666666666663" y="431.0" style="font-size:11.5px">Nylon, Dacron or wool clothing</text><text class="s" x="276.66666666666663" y="446.0" style="font-size:11.5px">readily builds up and</text><text class="s" x="276.66666666666663" y="461.0" style="font-size:11.5px">discharges static from the</text><text class="s" x="276.66666666666663" y="476.0" style="font-size:11.5px">person to the funnel or nozzle.</text><rect class="cl" x="489.3333333333333" y="343.0" width="220.66666666666666" height="197.0" rx="8"/><rect x="489.3333333333333" y="343.0" width="220.66666666666666" height="26" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="499.3333333333333" y="361.0" style="font-size:13px">Using a chamois</text><circle cx="502.3333333333333" cy="379.0" r="2.2" class="ah"/><text class="s" x="511.3333333333333" y="383.0" style="font-size:11.5px">Fuel passing through a chamois</text><text class="s" x="511.3333333333333" y="398.0" style="font-size:11.5px">adds to the static charge and</text><text class="s" x="511.3333333333333" y="413.0" style="font-size:11.5px">the danger of sparks.</text><circle cx="502.3333333333333" cy="427.0" r="2.2" class="ah"/><text class="s" x="511.3333333333333" y="431.0" style="font-size:11.5px">Ground the aircraft. Bond the</text><text class="s" x="511.3333333333333" y="446.0" style="font-size:11.5px">nozzle, chamois filter and</text><text class="s" x="511.3333333333333" y="461.0" style="font-size:11.5px">funnel to it. Connect a can to</text><text class="s" x="511.3333333333333" y="476.0" style="font-size:11.5px">the grounding post or the</text><text class="s" x="511.3333333333333" y="491.0" style="font-size:11.5px">funnel.</text><circle cx="502.3333333333333" cy="505.0" r="2.2" class="ah"/><text class="s" x="511.3333333333333" y="509.0" style="font-size:11.5px">Never use a plastic bucket or</text><text class="s" x="511.3333333333333" y="524.0" style="font-size:11.5px">other nonconductive container.</text></svg>
