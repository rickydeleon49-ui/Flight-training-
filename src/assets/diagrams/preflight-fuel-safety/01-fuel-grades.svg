<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 533" role="img" aria-labelledby="ti de"><title id="ti">Fuel grades: use the right one</title><desc id="de">Cards on AVGAS grades and jet fuel types, two decal swatches (AVGAS white on red, turbine fuel white on black), and three cards on where to find your grade, what to do if it is not available and what never to use.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><text class="t" x="20" y="28" style="font-size:15px">Fuel grades: use the right one</text><text class="s" x="20" y="50.0" style="font-size:13px">Aviation gasoline (AVGAS) is named by an octane or performance number (grade). Using the correct fuel</text><text class="s" x="20" y="66.5" style="font-size:13px">is critical, so dyes, names and decals help you identify the type and grade.</text><rect class="cl" x="20.0" y="89.0" width="338.0" height="185.0" rx="8"/><rect x="20.0" y="89.0" width="338.0" height="26" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30.0" y="107.0" style="font-size:13px">AVGAS (piston engines)</text><circle cx="33.0" cy="125.0" r="2.2" class="ah"/><text class="s" x="42.0" y="129.0" style="font-size:11.5px">Grades 80, 100 and 100LL. The grade is the</text><text class="s" x="42.0" y="144.0" style="font-size:11.5px">antiknock value: the higher the grade, the more</text><text class="s" x="42.0" y="159.0" style="font-size:11.5px">pressure the fuel withstands without detonating.</text><circle cx="33.0" cy="173.0" r="2.2" class="ah"/><text class="s" x="42.0" y="177.0" style="font-size:11.5px">100LL performs the same as 100. The LL means low</text><text class="s" x="42.0" y="192.0" style="font-size:11.5px">lead content.</text><circle cx="33.0" cy="206.0" r="2.2" class="ah"/><text class="s" x="42.0" y="210.0" style="font-size:11.5px">100VLL is also acceptable. It is blue like 100LL</text><text class="s" x="42.0" y="225.0" style="font-size:11.5px">and nearly impossible to tell apart.</text><circle cx="33.0" cy="239.0" r="2.2" class="ah"/><text class="s" x="42.0" y="243.0" style="font-size:11.5px">Dyes tell the grades apart. See the fuel colour</text><text class="s" x="42.0" y="258.0" style="font-size:11.5px">chart for each colour.</text><rect class="cl" x="372.0" y="89.0" width="338.0" height="185.0" rx="8"/><rect x="372.0" y="89.0" width="338.0" height="26" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="382.0" y="107.0" style="font-size:13px">Jet fuel (turbine engines)</text><circle cx="385.0" cy="125.0" r="2.2" class="ah"/><text class="s" x="394.0" y="129.0" style="font-size:11.5px">JET A, JET A-1 and JET B.</text><circle cx="385.0" cy="143.0" r="2.2" class="ah"/><text class="s" x="394.0" y="147.0" style="font-size:11.5px">Jet fuel is basically kerosene and has a</text><text class="s" x="394.0" y="162.0" style="font-size:11.5px">distinctive kerosene smell.</text><text class="t" x="20" y="294.0" style="font-size:14px">Decals and fuel equipment</text><rect x="20" y="304.0" width="130" height="46" rx="6" style="fill:#B23A48;stroke:currentColor;stroke-width:1.5"/><text class="t m" x="85" y="334.0" style="font-size:20px;fill:#fff">AVGAS</text><text class="s" x="164" y="324.0" style="font-size:12px">White letters on a red</text><text class="s" x="164" y="339.5" style="font-size:12px">background</text><rect x="370" y="304.0" width="130" height="46" rx="6" style="fill:#1A1A1A;stroke:currentColor;stroke-width:1.5"/><text class="t m" x="435" y="334.0" style="font-size:20px;fill:#fff">JET A</text><text class="s" x="514" y="324.0" style="font-size:12px">White letters on a black</text><text class="s" x="514" y="339.5" style="font-size:12px">background</text><rect class="cl" x="20.0" y="370.0" width="220.66666666666666" height="149.0" rx="8"/><rect x="20.0" y="370.0" width="220.66666666666666" height="26" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30.0" y="388.0" style="font-size:13px">Where to find your grade</text><circle cx="33.0" cy="406.0" r="2.2" class="ah"/><text class="s" x="42.0" y="410.0" style="font-size:11.5px">The AFM/POH.</text><circle cx="33.0" cy="424.0" r="2.2" class="ah"/><text class="s" x="42.0" y="428.0" style="font-size:11.5px">Placards in the flight deck.</text><circle cx="33.0" cy="442.0" r="2.2" class="ah"/><text class="s" x="42.0" y="446.0" style="font-size:11.5px">Next to the filler caps.</text><rect class="cl" x="254.66666666666666" y="370.0" width="220.66666666666666" height="149.0" rx="8"/><rect x="254.66666666666666" y="370.0" width="220.66666666666666" height="26" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="264.66666666666663" y="388.0" style="font-size:13px">If your grade is not there</text><circle cx="267.66666666666663" cy="406.0" r="2.2" class="ah"/><text class="s" x="276.66666666666663" y="410.0" style="font-size:11.5px">Use the next higher grade as a</text><text class="s" x="276.66666666666663" y="425.0" style="font-size:11.5px">substitute.</text><circle cx="267.66666666666663" cy="439.0" r="2.2" class="ah"/><text class="s" x="276.66666666666663" y="443.0" style="font-size:11.5px">Never use a lower grade than</text><text class="s" x="276.66666666666663" y="458.0" style="font-size:11.5px">recommended: cylinder head and</text><text class="s" x="276.66666666666663" y="473.0" style="font-size:11.5px">oil temperatures can exceed</text><text class="s" x="276.66666666666663" y="488.0" style="font-size:11.5px">normal ranges and cause</text><text class="s" x="276.66666666666663" y="503.0" style="font-size:11.5px">detonation.</text><rect class="cl" x="489.3333333333333" y="370.0" width="220.66666666666666" height="149.0" rx="8"/><rect x="489.3333333333333" y="370.0" width="220.66666666666666" height="26" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="499.3333333333333" y="388.0" style="font-size:13px">Never</text><circle cx="502.3333333333333" cy="406.0" r="2.2" class="ah"/><text class="s" x="511.3333333333333" y="410.0" style="font-size:11.5px">Never use automobile gas in an</text><text class="s" x="511.3333333333333" y="425.0" style="font-size:11.5px">aircraft engine unless the</text><text class="s" x="511.3333333333333" y="440.0" style="font-size:11.5px">aircraft has an STC from the</text><text class="s" x="511.3333333333333" y="455.0" style="font-size:11.5px">FAA for it.</text></svg>
