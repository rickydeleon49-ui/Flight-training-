<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 432" role="img" aria-labelledby="ti de"><title id="ti">Fire in flight: follow your POH checklist</title><desc id="de">Two columns for an engine fire and an electrical fire, under a banner that says follow your POH checklist, with a card on landing as soon as possible.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q2{font-size:11.5px}.q3{font-size:13px}.q4{stroke:currentColor;stroke-width:1.5}.q5{stroke:currentColor;stroke-width:1.4;stroke-linejoin:round}.q6{font-size:11px;fill:#fff}</style><text class="t" x="20" y="28" style="font-size:15px">Fire in flight: follow your POH checklist</text><text class="s q3" x="20" y="50">The cause decides the first moves. The airplane's POH checklist is always the guide.</text><rect x="20" y="76" width="690" height="52" rx="10" class="cl" style="stroke:var(--palette-berry,#A84C6B);stroke-width:3;fill-opacity:.25"/><text class="t m" x="365" y="100" style="font-size:19px">Follow your POH checklist</text><text class="s q2 m" x="365" y="118">Know the memory items before you fly. Fly the airplane first.</text><rect class="cl" x="20" y="142" width="337" height="140" rx="8"/><rect x="20" y="142" width="337" height="26" rx="10" class="rose q4"/><text class="t q3" x="30" y="160">Engine fire</text><text class="s q2" x="32" y="186">Flames or smoke from the cowl, high engine heat</text><circle cx="33" cy="204" r="2.2" class="ah"/><text class="s q2" x="42" y="208">Fuel selector OFF</text><circle cx="33" cy="222" r="2.2" class="ah"/><text class="s q2" x="42" y="226">Mixture to idle cutoff</text><circle cx="33" cy="240" r="2.2" class="ah"/><text class="s q2" x="42" y="244">Cabin heat OFF; vents open</text><circle cx="33" cy="258" r="2.2" class="ah"/><text class="s q2" x="42" y="262">Do not restart the engine</text><rect class="cl" x="373" y="142" width="337" height="140" rx="8"/><rect x="373" y="142" width="337" height="26" rx="10" class="lav q4"/><text class="t q3" x="383" y="160">Electrical fire</text><text class="s q2" x="385" y="186">Smell of hot insulation, or smoke from the panel</text><circle cx="386" cy="204" r="2.2" class="ah"/><text class="s q2" x="395" y="208">Master switch OFF</text><circle cx="386" cy="222" r="2.2" class="ah"/><text class="s q2" x="395" y="226">All electrical switches OFF</text><circle cx="386" cy="240" r="2.2" class="ah"/><text class="s q2" x="395" y="244">Open vents to clear smoke</text><circle cx="386" cy="258" r="2.2" class="ah"/><text class="s q2" x="395" y="262">Only turn on what you must have</text><rect class="cl" x="20" y="296" width="690" height="96" rx="8"/><rect x="20" y="296" width="690" height="26" rx="10" class="sky q4"/><text class="t q3" x="30" y="314">Then, for either fire</text><circle cx="33" cy="332" r="2.2" class="ah"/><text class="s q2" x="42" y="336">Land as soon as possible: head for the nearest landing area now</text><circle cx="33" cy="350" r="2.2" class="ah"/><text class="s q2" x="42" y="354">Tell ATC if you can (121.5, squawk 7700), but fly first</text><circle cx="33" cy="368" r="2.2" class="ah"/><text class="s q2" x="42" y="372">Once the fire is out, do not turn the system back on</text><text class="s" x="20" y="414" style="font-size:11px">Source: Airplane Flying Handbook ch. 18</text></svg>
