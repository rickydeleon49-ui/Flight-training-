<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 480" role="img" aria-labelledby="ti de"><title id="ti">Rough engine: check, and head for a landing area</title><desc id="de">A side view of an airplane turning toward a field, four cards for carburetor heat, mixture, fuel and magnetos, and a card on what to do if it does not clear.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q2{font-size:11.5px}.q3{font-size:13px}.q4{stroke:currentColor;stroke-width:1.5}.q5{stroke:currentColor;stroke-width:1.4;stroke-linejoin:round}.q6{font-size:11px;fill:#fff}</style><text class="t" x="20" y="28" style="font-size:15px">Rough engine: check, and head for a landing area</text><text class="s q3" x="20" y="50">The engine may quit or lose power. Turn toward a landing area while you check.</text><rect class="cl" x="20" y="76" width="690" height="100" rx="8"/><path d="M30 160L700 160" class="dk" style="stroke-width:2.5"/><rect x="470" y="154" width="200" height="12" rx="3" class="mint q4"/><text class="t q3 m" x="570" y="138">Landing area</text><g transform="translate(130 100) rotate(0) scale(0.9)"><ellipse cx="0" cy="0" rx="24" ry="5.5" class="sky" style="stroke:currentColor;stroke-width:1.4"/><path d="M-20 -2L-29 -13L-22 -13L-12 -3Z" class="sky q5"/><path d="M0 2L8 2L-4 11L-9 11Z" class="cl q5"/></g><path d="M165 105C300 105 400 110 500 122" class="acc" style="stroke-width:3"/><path d="M510 124L496 127L498 116Z" class="ah"/><text class="s q2" x="210" y="92">Turn toward it while you work the checklist</text><rect class="cl" x="20" y="190" width="337" height="88" rx="8"/><rect x="20" y="190" width="337" height="26" rx="10" class="sky q4"/><text class="t q3" x="30" y="208">1  Carb heat</text><circle cx="33" cy="226" r="2.2" class="ah"/><text class="s q2" x="42" y="230">Carb heat ON (ice is a common cause)</text><circle cx="33" cy="244" r="2.2" class="ah"/><text class="s q2" x="42" y="248">It may run rougher first, then clear</text><rect class="cl" x="373" y="190" width="337" height="88" rx="8"/><rect x="373" y="190" width="337" height="26" rx="10" class="mint q4"/><text class="t q3" x="383" y="208">2  Mixture</text><circle cx="386" cy="226" r="2.2" class="ah"/><text class="s q2" x="395" y="230">Move toward RICH and see if it smooths</text><circle cx="386" cy="244" r="2.2" class="ah"/><text class="s q2" x="395" y="248">Check the knob is where you expect</text><rect class="cl" x="20" y="290" width="337" height="88" rx="8"/><rect x="20" y="290" width="337" height="26" rx="10" class="rose q4"/><text class="t q3" x="30" y="308">3  Fuel</text><circle cx="33" cy="326" r="2.2" class="ah"/><text class="s q2" x="42" y="330">Selector on a tank with fuel</text><circle cx="33" cy="344" r="2.2" class="ah"/><text class="s q2" x="42" y="348">Boost pump ON if fitted</text><rect class="cl" x="373" y="290" width="337" height="88" rx="8"/><rect x="373" y="290" width="337" height="26" rx="10" class="lav q4"/><text class="t q3" x="383" y="308">4  Magnetos</text><circle cx="386" cy="326" r="2.2" class="ah"/><text class="s q2" x="395" y="330">Try LEFT, then RIGHT, then BOTH</text><circle cx="386" cy="344" r="2.2" class="ah"/><text class="s q2" x="395" y="348">If one is bad, fly on the good one</text><rect class="cl" x="20" y="392" width="690" height="60" rx="8"/><rect x="20" y="392" width="690" height="26" rx="10" class="sky q4"/><text class="t q3" x="30" y="410">Not fixed?</text><circle cx="33" cy="428" r="2.2" class="ah"/><text class="s q2" x="42" y="432">Treat it as an engine failure: pick a field and land, even at partial power</text><text class="s" x="20" y="462" style="font-size:11px">Source: Airplane Flying Handbook ch. 18</text></svg>
