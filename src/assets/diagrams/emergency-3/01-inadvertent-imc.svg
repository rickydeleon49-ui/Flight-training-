<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 530" role="img" aria-labelledby="ti de"><title id="ti">Flew into cloud by mistake: trust the instruments</title><desc id="de">A side view of an airplane flying toward a cloud, with a dashed arrow making a 180 degree turn back out, four numbered step rows and a card on how to prevent it.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q2{font-size:11.5px}.q3{font-size:13px}.q4{stroke:currentColor;stroke-width:1.5}.q5{stroke:currentColor;stroke-width:1.4;stroke-linejoin:round}.q6{font-size:11px;fill:#fff}.q0{fill:#fff;fill-opacity:.85}</style><text class="t" x="20" y="28" style="font-size:15px">Flew into cloud by mistake: trust the instruments</text><text class="s q3" x="20" y="50">VFR pilots get into trouble in cloud. Fly the instruments, turn around, and ask for help.</text><rect class="cl" x="20" y="76" width="690" height="100" rx="8"/><path d="M30 155L700 155" class="dk" style="stroke-width:2.5"/><circle cx="470" cy="120" r="26" class="q0"/><circle cx="505" cy="104" r="32" class="q0"/><circle cx="545" cy="118" r="30" class="q0"/><circle cx="580" cy="128" r="22" class="q0"/><circle cx="500" cy="138" r="26" class="q0"/><circle cx="540" cy="140" r="24" class="q0"/><text class="t q3" x="522" y="132" style="font-size:13px;fill:#17233c">Cloud</text><g transform="translate(110 100) rotate(0) scale(0.9)"><ellipse cx="0" cy="0" rx="24" ry="5.5" class="sky" style="stroke:currentColor;stroke-width:1.4"/><path d="M-20 -2L-29 -13L-22 -13L-12 -3Z" class="sky q5"/><path d="M0 2L8 2L-4 11L-9 11Z" class="cl q5"/></g><text class="t q3" x="40" y="92">VFR</text><path d="M140 100L450 100" class="acc" style="stroke-width:3"/><path d="M450 100L450 100" class="acc"/><path d="M450 100C492 100 492 148 450 148L170 148" class="acc" style="stroke-width:3;stroke-dasharray:7 6"/><path d="M152 148L168 142L168 154Z" class="ah"/><text class="s q2" x="210" y="142">Gentle turn about 180° back to clear air</text><rect class="cl" x="20" y="188" width="690" height="48" rx="8"/><rect x="20" y="188" width="190" height="48" rx="10" class="rose q4"/><circle cx="40" cy="212" r="10" class="ah"/><text class="t m q6" x="40" y="216">1</text><text class="t q3" x="58" y="216.5">Trust instruments</text><text class="s q2" x="222" y="208.5">Your body will lie to you in cloud. Fly by the attitude indicator</text><text class="s q2" x="222" y="223.5">and other instruments. Look inside, not outside.</text><rect class="cl" x="20" y="244" width="690" height="48" rx="8"/><rect x="20" y="244" width="190" height="48" rx="10" class="sky q4"/><circle cx="40" cy="268" r="10" class="ah"/><text class="t m q6" x="40" y="272">2</text><text class="t q3" x="58" y="272.5">Wings level</text><text class="s q2" x="222" y="264.5">Level the wings and hold the pitch. Use small, smooth control</text><text class="s q2" x="222" y="279.5">inputs. Fly the airplane first; talk second.</text><rect class="cl" x="20" y="300" width="690" height="48" rx="8"/><rect x="20" y="300" width="190" height="48" rx="10" class="mint q4"/><circle cx="40" cy="324" r="10" class="ah"/><text class="t m q6" x="40" y="328">3</text><text class="t q3" x="58" y="328.5">Turn back 180°</text><text class="s q2" x="222" y="320.5">Make a gentle turn (standard rate or less) about 180° back to</text><text class="s q2" x="222" y="335.5">where it was clear. Watch the heading indicator.</text><rect class="cl" x="20" y="356" width="690" height="48" rx="8"/><rect x="20" y="356" width="190" height="48" rx="10" class="lav q4"/><circle cx="40" cy="380" r="10" class="ah"/><text class="t m q6" x="40" y="384">4</text><text class="t q3" x="58" y="384.5">Ask ATC for help</text><text class="s q2" x="222" y="376.5">Call ATC: say you are a VFR pilot in cloud and ask for help.</text><text class="s q2" x="222" y="391.5">Use 121.5 if you have no contact. Do not wait.</text><rect class="cl" x="20" y="418" width="690" height="70" rx="8"/><rect x="20" y="418" width="690" height="26" rx="10" class="mint q4"/><text class="t q3" x="30" y="436">Prevention comes first</text><circle cx="33" cy="454" r="2.2" class="ah"/><text class="s q2" x="42" y="458">Get a weather briefing and set personal minimums before you go</text><circle cx="33" cy="472" r="2.2" class="ah"/><text class="s q2" x="42" y="476">Decide early to turn back or land, while you can still see</text><text class="s" x="20" y="512" style="font-size:11px">Source: Airplane Flying Handbook ch. 18</text></svg>
