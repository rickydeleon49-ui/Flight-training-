<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 470" role="img" aria-labelledby="ti de"><title id="ti">Emergency descent: down fast, under control</title><desc id="de">A banked airplane in a steep descent, four steps for power, configuration, bank and speed, and cards on why you might need it and what to watch for.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q2{font-size:11.5px}.q3{font-size:13px}.q4{stroke:currentColor;stroke-width:1.5}.q5{stroke:currentColor;stroke-width:1.4;stroke-linejoin:round}.q6{font-size:11px;fill:#fff}.q0{stroke:currentColor;stroke-width:1.4}</style><text class="t" x="20" y="28" style="font-size:15px">Emergency descent: down fast, under control</text><text class="s q3" x="20" y="50">Used when you must get down quickly, such as smoke or fire in the cabin.</text><rect class="cl" x="20" y="76" width="690" height="120" rx="8"/><path d="M70 100L330 168" class="acc" style="stroke-width:3"/><path d="M340 171L325 173L329 161Z" class="ah"/><g transform="translate(76 92) rotate(14.5) scale(0.9)"><ellipse cx="0" cy="0" rx="24" ry="5.5" class="sky q0"/><path d="M-20 -2L-29 -13L-22 -13L-12 -3Z" class="sky q5"/><path d="M0 2L8 2L-4 11L-9 11Z" class="cl q5"/></g><text class="s q2" x="60" y="184">Steep, controlled descent</text><g transform="translate(540 140)"><path d="M-120 0L120 0" class="dk" style="stroke-width:2;stroke-dasharray:7 6;opacity:.6"/><g transform="rotate(-35)"><path d="M-62 0L62 0" class="dk" style="stroke-width:5"/><ellipse cx="0" cy="0" rx="9" ry="14" class="sky q0"/></g><path d="M75 0A75 75 0 0 0 61.4 -43" class="acc" style="stroke-width:2"/></g><text class="t q3" x="440" y="186">Bank about 30°–45°</text><text class="s q2 m" x="668" y="160">Horizon</text><rect class="cl" x="20" y="208" width="337" height="112" rx="8"/><rect x="20" y="208" width="337" height="26" rx="10" class="rose q4"/><text class="t q3" x="30" y="226">Why you might need one</text><circle cx="33" cy="244" r="2.2" class="ah"/><text class="s q2" x="42" y="248">Fire in flight</text><circle cx="33" cy="262" r="2.2" class="ah"/><text class="s q2" x="42" y="266">Smoke or fumes in the cabin</text><circle cx="33" cy="280" r="2.2" class="ah"/><text class="s q2" x="42" y="284">Any time you must be on the ground fast</text><rect class="cl" x="373" y="208" width="337" height="112" rx="8"/><rect x="373" y="208" width="337" height="26" rx="10" class="sky q4"/><text class="t q3" x="383" y="226">Steps (as in your POH)</text><circle cx="386" cy="244" r="2.2" class="ah"/><text class="s q2" x="395" y="248">1  Power to idle</text><circle cx="386" cy="262" r="2.2" class="ah"/><text class="s q2" x="395" y="266">2  Configure: flaps and gear per POH</text><circle cx="386" cy="280" r="2.2" class="ah"/><text class="s q2" x="395" y="284">3  Bank about 30°–45°</text><circle cx="386" cy="298" r="2.2" class="ah"/><text class="s q2" x="395" y="302">4  Hold speed below POH limits</text><rect class="cl" x="20" y="334" width="690" height="92" rx="8"/><rect x="20" y="334" width="690" height="26" rx="10" class="mint q4"/><text class="t q3" x="30" y="352">Watch for</text><circle cx="33" cy="370" r="2.2" class="ah"/><text class="s q2" x="42" y="374">The bank keeps the load factor positive and lets you look for traffic below</text><circle cx="33" cy="388" r="2.2" class="ah"/><text class="s q2" x="42" y="392">Do not exceed the speed limits in the POH; ease out smoothly</text><circle cx="33" cy="406" r="2.2" class="ah"/><text class="s q2" x="42" y="410">Start the recovery well above the ground</text><text class="s" x="20" y="452" style="font-size:11px">Source: Airplane Flying Handbook ch. 18</text></svg>
