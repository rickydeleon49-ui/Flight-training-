<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 512" role="img" aria-labelledby="ti de"><title id="ti">Readbacks: what to read back</title><desc id="de">Six cards for what to read back, runway, hold short, altitude, heading, frequency and transponder code, with an example phrase for each, four cards on say again, unable, wilco and roger, and two cards on what to always read back and what to do if unsure.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:17px}.q1{stroke-width:2;opacity:.6}.q2{font-size:11.5px}.q3{font-size:13px}.q4{stroke:currentColor;stroke-width:1.5}</style><text class="t" x="20" y="28" style="font-size:15px">Read it back: prove you heard it right</text><text class="s q3" x="20" y="50">A readback lets the controller hear a mistake before it matters. Say it back, then add your call sign.</text><rect class="cl" x="20" y="70.5" width="220.67" height="62" rx="8"/><rect x="20" y="70.5" width="220.67" height="24" rx="10" class="sky q4"/><text class="t q3" x="30" y="87.5">Runway</text><text class="s q2" x="30" y="110.5">"Runway two seven"</text><rect class="cl" x="254.67" y="70.5" width="220.67" height="62" rx="8"/><rect x="254.67" y="70.5" width="220.67" height="24" rx="10" class="rose q4"/><text class="t q3" x="264.67" y="87.5">Hold short</text><text class="s q2" x="264.67" y="110.5">"Hold short of runway one eight"</text><rect class="cl" x="489.33" y="70.5" width="220.67" height="62" rx="8"/><rect x="489.33" y="70.5" width="220.67" height="24" rx="10" class="mint q4"/><text class="t q3" x="499.33" y="87.5">Altitude</text><text class="s q2" x="499.33" y="110.5">"Climb and maintain four thousand</text><text class="s q2" x="499.33" y="125.5">five hundred"</text><rect class="cl" x="20" y="144.5" width="220.67" height="62" rx="8"/><rect x="20" y="144.5" width="220.67" height="24" rx="10" class="lav q4"/><text class="t q3" x="30" y="161.5">Heading</text><text class="s q2" x="30" y="184.5">"Turn left heading two one zero"</text><rect class="cl" x="254.67" y="144.5" width="220.67" height="62" rx="8"/><rect x="254.67" y="144.5" width="220.67" height="24" rx="10" class="sky q4"/><text class="t q3" x="264.67" y="161.5">Frequency</text><text class="s q2" x="264.67" y="184.5">"Contact departure one two zero</text><text class="s q2" x="264.67" y="199.5">point five (example)"</text><rect class="cl" x="489.33" y="144.5" width="220.67" height="62" rx="8"/><rect x="489.33" y="144.5" width="220.67" height="24" rx="10" class="mint q4"/><text class="t q3" x="499.33" y="161.5">Transponder code</text><text class="s q2" x="499.33" y="184.5">"Squawk four two one five"</text><text class="t" x="20" y="228.5" style="font-size:14px">The short words</text><rect class="cl" x="20" y="238.5" width="162" height="116" rx="8"/><rect x="20" y="238.5" width="162" height="26" rx="10" class="sky q4"/><text class="t q3" x="30" y="256.5">Say again</text><circle cx="33" cy="274.5" r="2.2" class="ah"/><text class="s q2" x="42" y="278.5">You did not hear it</text><text class="s q2" x="42" y="293.5">clearly. Ask for it</text><text class="s q2" x="42" y="308.5">again; guessing is</text><text class="s q2" x="42" y="323.5">worse.</text><rect class="cl" x="196" y="238.5" width="162" height="116" rx="8"/><rect x="196" y="238.5" width="162" height="26" rx="10" class="rose q4"/><text class="t q3" x="206" y="256.5">Unable</text><circle cx="209" cy="274.5" r="2.2" class="ah"/><text class="s q2" x="218" y="278.5">You cannot do it, for</text><text class="s q2" x="218" y="293.5">safety or because you</text><text class="s q2" x="218" y="308.5">are not able. Say it,</text><text class="s q2" x="218" y="323.5">and say why if you</text><text class="s q2" x="218" y="338.5">can.</text><rect class="cl" x="372" y="238.5" width="162" height="116" rx="8"/><rect x="372" y="238.5" width="162" height="26" rx="10" class="mint q4"/><text class="t q3" x="382" y="256.5">Wilco</text><circle cx="385" cy="274.5" r="2.2" class="ah"/><text class="s q2" x="394" y="278.5">You understood and</text><text class="s q2" x="394" y="293.5">will comply. It is</text><text class="s q2" x="394" y="308.5">not a readback by</text><text class="s q2" x="394" y="323.5">itself.</text><rect class="cl" x="548" y="238.5" width="162" height="116" rx="8"/><rect x="548" y="238.5" width="162" height="26" rx="10" class="lav q4"/><text class="t q3" x="558" y="256.5">Roger</text><circle cx="561" cy="274.5" r="2.2" class="ah"/><text class="s q2" x="570" y="278.5">Message received. It</text><text class="s q2" x="570" y="293.5">does not say yes and</text><text class="s q2" x="570" y="308.5">it does not read back</text><text class="s q2" x="570" y="323.5">a hold-short.</text><rect class="cl" x="20" y="368.5" width="338" height="104" rx="8"/><rect x="20" y="368.5" width="338" height="26" rx="10" class="rose q4"/><text class="t q3" x="30" y="386.5">Always read back</text><circle cx="33" cy="404.5" r="2.2" class="ah"/><text class="s q2" x="42" y="408.5">Hold-short and runway crossing instructions, word</text><text class="s q2" x="42" y="423.5">for word</text><circle cx="33" cy="437.5" r="2.2" class="ah"/><text class="s q2" x="42" y="441.5">Runway assignments, altitudes, headings, altimeter</text><text class="s q2" x="42" y="456.5">settings, and anything ATC asks you to read back</text><rect class="cl" x="372" y="368.5" width="338" height="104" rx="8"/><rect x="372" y="368.5" width="338" height="26" rx="10" class="sky q4"/><text class="t q3" x="382" y="386.5">Not sure?</text><circle cx="385" cy="404.5" r="2.2" class="ah"/><text class="s q2" x="394" y="408.5">Ask. "Say again" costs seconds; a wrong runway or</text><text class="s q2" x="394" y="423.5">altitude can cost much more</text><circle cx="385" cy="437.5" r="2.2" class="ah"/><text class="s q2" x="394" y="441.5">You are the pilot in command. If an instruction is</text><text class="s q2" x="394" y="456.5">unsafe, say "unable"</text><text class="s" x="20" y="494.5" style="font-size:11px">Source: Aeronautical Information Manual ch. 4</text></svg>
