<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 562" role="img" aria-labelledby="ti de"><title id="ti">Class B, C and D: the radio rules</title><desc id="de">Three cards for Class B, C and D showing the radio rule for entering each one, with a one line summary that Class B needs a clearance and Class C and D need two-way communication, shown when ATC says your call sign, plus cards on what to prepare and mistakes to avoid.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:17px}.q1{stroke-width:2;opacity:.6}.q2{font-size:11.5px}.q3{font-size:13px}.q4{stroke:currentColor;stroke-width:1.5}.q5{font-size:17px}</style><text class="t" x="20" y="28" style="font-size:15px">Class B, C and D: what you must do on the radio</text><text class="s q3" x="20" y="50">The rules differ by class. In all three, call before you enter, and do not enter until the rule for</text><text class="s q3" x="20" y="66.5">that class is met.</text><rect class="cl" x="20" y="87" width="220.67" height="208" rx="8"/><rect x="20" y="87" width="220.67" height="32" rx="10" class="sky q4"/><text class="t q5" x="30" y="109">Class B</text><circle cx="33" cy="135" r="2.2" class="ah"/><text class="s q2" x="42" y="139">You need an ATC clearance</text><text class="s q2" x="42" y="154">before you enter</text><circle cx="33" cy="168" r="2.2" class="ah"/><text class="s q2" x="42" y="172">The words to hear: "cleared to</text><text class="s q2" x="42" y="187">enter Class Bravo airspace"</text><circle cx="33" cy="201" r="2.2" class="ah"/><text class="s q2" x="42" y="205">"Radar contact" or "standby" is</text><text class="s q2" x="42" y="220">not a clearance: stay out</text><circle cx="33" cy="234" r="2.2" class="ah"/><text class="s q2" x="42" y="238">Hear "remain clear of Bravo"?</text><text class="s q2" x="42" y="253">Stay out</text><rect class="cl" x="254.67" y="87" width="220.67" height="208" rx="8"/><rect x="254.67" y="87" width="220.67" height="32" rx="10" class="mint q4"/><text class="t q5" x="264.67" y="109">Class C</text><circle cx="267.67" cy="135" r="2.2" class="ah"/><text class="s q2" x="276.67" y="139">Establish two-way radio</text><text class="s q2" x="276.67" y="154">communication before you enter,</text><text class="s q2" x="276.67" y="169">and keep it while you are</text><text class="s q2" x="276.67" y="184">inside</text><circle cx="267.67" cy="198" r="2.2" class="ah"/><text class="s q2" x="276.67" y="202">Established means ATC calls you</text><text class="s q2" x="276.67" y="217">by your call sign</text><circle cx="267.67" cy="231" r="2.2" class="ah"/><text class="s q2" x="276.67" y="235">"Aircraft calling Sample</text><text class="s q2" x="276.67" y="250">Approach, standby" is not</text><text class="s q2" x="276.67" y="265">established: stay out</text><circle cx="267.67" cy="279" r="2.2" class="ah"/><text class="s q2" x="276.67" y="283">Told to remain clear? Stay out</text><rect class="cl" x="489.33" y="87" width="220.67" height="208" rx="8"/><rect x="489.33" y="87" width="220.67" height="32" rx="10" class="lav q4"/><text class="t q5" x="499.33" y="109">Class D</text><circle cx="502.33" cy="135" r="2.2" class="ah"/><text class="s q2" x="511.33" y="139">Same rule as Class C: two-way</text><text class="s q2" x="511.33" y="154">radio communication before you</text><text class="s q2" x="511.33" y="169">enter, kept while inside</text><circle cx="502.33" cy="183" r="2.2" class="ah"/><text class="s q2" x="511.33" y="187">ATC says your call sign and you</text><text class="s q2" x="511.33" y="202">are in</text><circle cx="502.33" cy="216" r="2.2" class="ah"/><text class="s q2" x="511.33" y="220">No call sign back: stay out</text><circle cx="502.33" cy="234" r="2.2" class="ah"/><text class="s q2" x="511.33" y="238">Tower may tell you to remain</text><text class="s q2" x="511.33" y="253">outside</text><text class="t" x="20" y="315" style="font-size:14px">The key difference, in one line</text><rect class="cl" x="20" y="323" width="690" height="48" rx="8"/><text class="s q3" x="32" y="343">Class B: "cleared" is the permission.</text><text class="s q3" x="32" y="361">Class C and D: your call sign said back to you is the permission.</text><rect class="cl" x="20" y="385" width="338" height="137" rx="8"/><rect x="20" y="385" width="338" height="26" rx="10" class="sky q4"/><text class="t q3" x="30" y="403">Before you call</text><circle cx="33" cy="421" r="2.2" class="ah"/><text class="s q2" x="42" y="425">Know your position, altitude, the ATIS letter and</text><text class="s q2" x="42" y="440">what you want</text><circle cx="33" cy="454" r="2.2" class="ah"/><text class="s q2" x="42" y="458">Call early enough to get an answer before the</text><text class="s q2" x="42" y="473">boundary</text><circle cx="33" cy="487" r="2.2" class="ah"/><text class="s q2" x="42" y="491">Do not enter on a hope; circle outside if you have</text><text class="s q2" x="42" y="506">not heard back</text><rect class="cl" x="372" y="385" width="338" height="137" rx="8"/><rect x="372" y="385" width="338" height="26" rx="10" class="rose q4"/><text class="t q3" x="382" y="403">Mistakes to avoid</text><circle cx="385" cy="421" r="2.2" class="ah"/><text class="s q2" x="394" y="425">"Standby" alone is not permission in Class B</text><circle cx="385" cy="439" r="2.2" class="ah"/><text class="s q2" x="394" y="443">Hearing someone else answered is not an answer to</text><text class="s q2" x="394" y="458">you</text><circle cx="385" cy="472" r="2.2" class="ah"/><text class="s q2" x="394" y="476">Class B pilots: a clearance can come with limits,</text><text class="s q2" x="394" y="491">so read it back</text><text class="s" x="20" y="544" style="font-size:11px">Source: Aeronautical Information Manual ch. 3</text></svg>
