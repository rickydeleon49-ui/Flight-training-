<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 527" role="img" aria-labelledby="ti de"><title id="ti">The first call-up: who, who, where, what</title><desc id="de">Four step cards for a first radio call: who you are calling, who you are, where you are and what you want, followed by an example call to a tower, the tower reply and the pilot readback, and cards on listening first and on being told to standby.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:17px}.q1{stroke-width:2;opacity:.6}.q2{font-size:11.5px}.q3{font-size:13px}.q4{font-size:12.5px}.q5{stroke:currentColor;stroke-width:1.5}.q6{stroke-width:2.5}.q7{fill:var(--palette-berry,#A84C6B)}</style><text class="t" x="20" y="28" style="font-size:15px">Your first call: who, who, where, what</text><text class="s q3" x="20" y="50">Listen first so you do not step on someone else. Then say it once, short and in order. ATC answers</text><text class="s q3" x="20" y="66.5">with your call sign, then you give the details.</text><rect class="cl" x="20" y="87" width="162" height="116" rx="8"/><rect x="20" y="87" width="162" height="26" rx="10" class="sky q5"/><text class="t q3" x="30" y="105">1  Who you call</text><circle cx="33" cy="123" r="2.2" class="ah"/><text class="s q2" x="42" y="127">Name the station you</text><text class="s q2" x="42" y="142">want, such as the</text><text class="s q2" x="42" y="157">tower, approach or</text><text class="s q2" x="42" y="172">Flight Service.</text><path d="M185 145L185 145" class="acc q6"/><path d="M193 145L185 148.6L185 141.4Z" class="dh q7"/><rect class="cl" x="196" y="87" width="162" height="116" rx="8"/><rect x="196" y="87" width="162" height="26" rx="10" class="mint q5"/><text class="t q3" x="206" y="105">2  Who you are</text><circle cx="209" cy="123" r="2.2" class="ah"/><text class="s q2" x="218" y="127">Your full call sign,</text><text class="s q2" x="218" y="142">with the aircraft</text><text class="s q2" x="218" y="157">type if you like.</text><path d="M361 145L361 145" class="acc q6"/><path d="M369 145L361 148.6L361 141.4Z" class="dh q7"/><rect class="cl" x="372" y="87" width="162" height="116" rx="8"/><rect x="372" y="87" width="162" height="26" rx="10" class="lav q5"/><text class="t q3" x="382" y="105">3  Where you are</text><circle cx="385" cy="123" r="2.2" class="ah"/><text class="s q2" x="394" y="127">Position and</text><text class="s q2" x="394" y="142">altitude, or "at the</text><text class="s q2" x="394" y="157">ramp", plus the ATIS</text><text class="s q2" x="394" y="172">letter if there is</text><text class="s q2" x="394" y="187">one.</text><path d="M537 145L537 145" class="acc q6"/><path d="M545 145L537 148.6L537 141.4Z" class="dh q7"/><rect class="cl" x="548" y="87" width="162" height="116" rx="8"/><rect x="548" y="87" width="162" height="26" rx="10" class="rose q5"/><text class="t q3" x="558" y="105">4  What you want</text><circle cx="561" cy="123" r="2.2" class="ah"/><text class="s q2" x="570" y="127">Say your request:</text><text class="s q2" x="570" y="142">landing, flight</text><text class="s q2" x="570" y="157">following, taxi.</text><text class="t" x="20" y="223" style="font-size:14px">Example: calling a tower from 5 miles out (made-up names)</text><rect class="cl" x="20" y="233" width="690" height="118" rx="8"/><text class="t q4" x="32" y="255">Pilot (call)</text><text class="s q4" x="160" y="255">"Sample Tower, Cessna One Two Tree Four Zulu, five miles south, two thousand five</text><text class="s q4" x="160" y="271">hundred, with information Bravo, inbound to land."</text><text class="t q4" x="32" y="303">Tower (answer)</text><text class="s q4" x="160" y="303">"Cessna Three Four Zulu, Sample Tower, enter left downwind, runway two seven."</text><text class="t q4" x="32" y="335">Pilot (readback)</text><text class="s q4" x="160" y="335">"Left downwind, runway two seven, Three Four Zulu."</text><rect class="cl" x="20" y="365" width="338" height="122" rx="8"/><rect x="20" y="365" width="338" height="26" rx="10" class="sky q5"/><text class="t q3" x="30" y="383">Before you key the mic</text><circle cx="33" cy="401" r="2.2" class="ah"/><text class="s q2" x="42" y="405">Listen for a moment: is the frequency busy?</text><circle cx="33" cy="419" r="2.2" class="ah"/><text class="s q2" x="42" y="423">Know what you are going to say; a short call frees</text><text class="s q2" x="42" y="438">the frequency for everyone</text><circle cx="33" cy="452" r="2.2" class="ah"/><text class="s q2" x="42" y="456">Have the ATIS, the airport name and your request</text><text class="s q2" x="42" y="471">ready</text><rect class="cl" x="372" y="365" width="338" height="122" rx="8"/><rect x="372" y="365" width="338" height="26" rx="10" class="mint q5"/><text class="t q3" x="382" y="383">If ATC says "standby"</text><circle cx="385" cy="401" r="2.2" class="ah"/><text class="s q2" x="394" y="405">Wait. ATC knows you called and will come back to</text><text class="s q2" x="394" y="420">you</text><circle cx="385" cy="434" r="2.2" class="ah"/><text class="s q2" x="394" y="438">Do not repeat the call right away</text><circle cx="385" cy="452" r="2.2" class="ah"/><text class="s q2" x="394" y="456">Fly the airplane while you wait</text><text class="s" x="20" y="509" style="font-size:11px">Source: Aeronautical Information Manual ch. 4</text></svg>
