<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 556" role="img" aria-labelledby="ti de"><title id="ti">CTAF: self-announce at a non-towered airport</title><desc id="de">A plan view of a traffic pattern with numbered markers for the call about ten miles out, downwind, base and final, plus cards on when to call, how to word the call and where to find the CTAF frequency.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:17px}.q1{stroke-width:2;opacity:.6}.q2{font-size:11.5px}.q3{font-size:13px}.q4{stroke-width:2.5}.q5{font-size:12px;fill:#fff}.q6{font-size:11px}.q7{font-size:12px}.q8{stroke:currentColor;stroke-width:1.5}.q9{stroke:currentColor;stroke-width:1.4;stroke-linejoin:round}</style><text class="t" x="20" y="28" style="font-size:15px">Non-towered airport: you self-announce</text><text class="s q3" x="20" y="50">No one controls the traffic, so everyone announces on the same frequency. This is the CTAF (common</text><text class="s q3" x="20" y="66.5">traffic advisory frequency). Your calls are advice, not clearances.</text><rect class="cl" x="20" y="91" width="690" height="206" rx="8"/><rect x="300" y="261" width="220" height="16" rx="3" class="cl" style="stroke:currentColor;stroke-width:1.2"/><text class="s m q6" x="385" y="273">Runway</text><path d="M580 269L580 197" class="dk q4"/><path d="M580 189L583.6 197L576.4 197Z" class="dh"/><path d="M580 187L180 187" class="dk q4"/><path d="M172 187L180 183.4L180 190.6Z" class="dh"/><path d="M170 187L170 259" class="dk q4"/><path d="M170 267L166.4 259L173.6 259Z" class="dh"/><path d="M170 269L290 269" class="dk q4"/><path d="M298 269L290 272.6L290 265.4Z" class="dh"/><text class="s m q7" x="385" y="179">Downwind</text><text class="s e q7" x="572" y="228">Crosswind</text><circle cx="220" cy="125" r="10" class="ah"/><text class="t m q5" x="220" y="129">1</text><text class="t q7" x="236" y="129">About 10 miles out, inbound</text><g transform="translate(60 125) rotate(0) scale(0.9)"><ellipse cx="0" cy="0" rx="24" ry="5.5" class="sky" style="stroke:currentColor;stroke-width:1.4"/><path d="M-20 -2L-29 -13L-22 -13L-12 -3Z" class="sky q9"/><path d="M0 2L8 2L-4 11L-9 11Z" class="cl q9"/></g><circle cx="610" cy="175" r="10" class="ah"/><text class="t m q5" x="610" y="179">2</text><text class="s q2" x="626" y="179">Downwind</text><circle cx="186" cy="224" r="10" class="ah"/><text class="t m q5" x="186" y="228">3</text><text class="s q2" x="202" y="228">Base</text><circle cx="200" cy="247" r="10" class="ah"/><text class="t m q5" x="200" y="251">4</text><text class="s q2" x="216" y="251">Final</text><text class="s q6" x="570" y="289">Left-hand pattern shown</text><rect class="cl" x="20" y="309" width="220.67" height="185" rx="8"/><rect x="20" y="309" width="220.67" height="26" rx="10" class="sky q8"/><text class="t q3" x="30" y="327">When to call</text><circle cx="33" cy="345" r="2.2" class="ah"/><text class="s q2" x="42" y="349">About 10 miles out, inbound;</text><text class="s q2" x="42" y="364">again when you enter the</text><text class="s q2" x="42" y="379">pattern</text><circle cx="33" cy="393" r="2.2" class="ah"/><text class="s q2" x="42" y="397">Entering downwind, then base,</text><text class="s q2" x="42" y="412">then final</text><circle cx="33" cy="426" r="2.2" class="ah"/><text class="s q2" x="42" y="430">Leaving the runway</text><circle cx="33" cy="444" r="2.2" class="ah"/><text class="s q2" x="42" y="448">Before you taxi, and before you</text><text class="s q2" x="42" y="463">enter the runway (on the</text><text class="s q2" x="42" y="478">departure side)</text><rect class="cl" x="254.67" y="309" width="220.67" height="185" rx="8"/><rect x="254.67" y="309" width="220.67" height="26" rx="10" class="mint q8"/><text class="t q3" x="264.67" y="327">How to say it</text><circle cx="267.67" cy="345" r="2.2" class="ah"/><text class="s q2" x="276.67" y="349">Start and end with the airport</text><text class="s q2" x="276.67" y="364">name: "Sample traffic, Cessna</text><text class="s q2" x="276.67" y="379">One Two Tree Four Zulu, ten</text><text class="s q2" x="276.67" y="394">miles north, inbound to land,</text><text class="s q2" x="276.67" y="409">Sample"</text><circle cx="267.67" cy="423" r="2.2" class="ah"/><text class="s q2" x="276.67" y="427">Say who and where, then what</text><text class="s q2" x="276.67" y="442">you will do</text><circle cx="267.67" cy="456" r="2.2" class="ah"/><text class="s q2" x="276.67" y="460">Listen for others; keep it</text><text class="s q2" x="276.67" y="475">short</text><rect class="cl" x="489.33" y="309" width="220.67" height="185" rx="8"/><rect x="489.33" y="309" width="220.67" height="26" rx="10" class="lav q8"/><text class="t q3" x="499.33" y="327">Which frequency</text><circle cx="502.33" cy="345" r="2.2" class="ah"/><text class="s q2" x="511.33" y="349">Find the CTAF on the sectional</text><text class="s q2" x="511.33" y="364">chart airport data and in the</text><text class="s q2" x="511.33" y="379">Chart Supplement</text><circle cx="502.33" cy="393" r="2.2" class="ah"/><text class="s q2" x="511.33" y="397">Often a UNICOM or MULTICOM</text><text class="s q2" x="511.33" y="412">frequency such as 122.8</text><text class="s q2" x="511.33" y="427">(example)</text><circle cx="502.33" cy="441" r="2.2" class="ah"/><text class="s q2" x="511.33" y="445">Set it before you are close to</text><text class="s q2" x="511.33" y="460">the airport</text><text class="t q3" x="20" y="514">No tower? You still give way. Look outside; do not trust the radio alone.</text><text class="s q6" x="20" y="538">Source: Aeronautical Information Manual ch. 4</text></svg>
