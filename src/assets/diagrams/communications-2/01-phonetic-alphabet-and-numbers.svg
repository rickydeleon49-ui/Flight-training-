<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 511" role="img" aria-labelledby="ti de"><title id="ti">Phonetic alphabet and numbers</title><desc id="de">The 26 phonetic alphabet words in a grid and the ten radio number words from zero to niner, with cards on how to say altitudes, headings and frequencies and how to say and shorten an aircraft call sign.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:17px}.q1{stroke-width:2;opacity:.6}.q2{font-size:14px}.q3{font-size:13.5px}.q4{font-size:11.5px}.q5{font-size:16px}.q6{font-size:12.5px}.q7{font-size:13px}.q8{stroke:currentColor;stroke-width:1.5}</style><text class="t" x="20" y="28" style="font-size:15px">Say it the standard way: letters and numbers</text><text class="s q7" x="20" y="50">Standard words make each character clear over a noisy radio. Use them for call signs, taxiway names,</text><text class="s q7" x="20" y="66.5">altimeter settings, headings, altitudes and frequencies.</text><rect class="cl" x="20" y="89" width="690" height="144" rx="8"/><text class="t q2" x="28" y="114">A</text><text class="s q3" x="52" y="114">Alfa</text><text class="t q2" x="143" y="114">B</text><text class="s q3" x="167" y="114">Bravo</text><text class="t q2" x="258" y="114">C</text><text class="s q3" x="282" y="114">Charlie</text><text class="t q2" x="373" y="114">D</text><text class="s q3" x="397" y="114">Delta</text><text class="t q2" x="488" y="114">E</text><text class="s q3" x="512" y="114">Echo</text><text class="t q2" x="603" y="114">F</text><text class="s q3" x="627" y="114">Foxtrot</text><text class="t q2" x="28" y="140">G</text><text class="s q3" x="52" y="140">Golf</text><text class="t q2" x="143" y="140">H</text><text class="s q3" x="167" y="140">Hotel</text><text class="t q2" x="258" y="140">I</text><text class="s q3" x="282" y="140">India</text><text class="t q2" x="373" y="140">J</text><text class="s q3" x="397" y="140">Juliett</text><text class="t q2" x="488" y="140">K</text><text class="s q3" x="512" y="140">Kilo</text><text class="t q2" x="603" y="140">L</text><text class="s q3" x="627" y="140">Lima</text><text class="t q2" x="28" y="166">M</text><text class="s q3" x="52" y="166">Mike</text><text class="t q2" x="143" y="166">N</text><text class="s q3" x="167" y="166">November</text><text class="t q2" x="258" y="166">O</text><text class="s q3" x="282" y="166">Oscar</text><text class="t q2" x="373" y="166">P</text><text class="s q3" x="397" y="166">Papa</text><text class="t q2" x="488" y="166">Q</text><text class="s q3" x="512" y="166">Quebec</text><text class="t q2" x="603" y="166">R</text><text class="s q3" x="627" y="166">Romeo</text><text class="t q2" x="28" y="192">S</text><text class="s q3" x="52" y="192">Sierra</text><text class="t q2" x="143" y="192">T</text><text class="s q3" x="167" y="192">Tango</text><text class="t q2" x="258" y="192">U</text><text class="s q3" x="282" y="192">Uniform</text><text class="t q2" x="373" y="192">V</text><text class="s q3" x="397" y="192">Victor</text><text class="t q2" x="488" y="192">W</text><text class="s q3" x="512" y="192">Whiskey</text><text class="t q2" x="603" y="192">X</text><text class="s q3" x="627" y="192">Xray</text><text class="t q2" x="28" y="218">Y</text><text class="s q3" x="52" y="218">Yankee</text><text class="t q2" x="143" y="218">Z</text><text class="s q3" x="167" y="218">Zulu</text><text class="t q2" x="20" y="253">Numbers</text><rect class="cl" x="20" y="261" width="690" height="44" rx="8"/><text class="t m q5" x="54.5" y="280">0</text><text class="s m q6" x="54.5" y="297">Zero</text><text class="t m q5" x="123.5" y="280">1</text><text class="s m q6" x="123.5" y="297">Wun</text><text class="t m q5" x="192.5" y="280">2</text><text class="s m q6" x="192.5" y="297">Too</text><text class="t m q5" x="261.5" y="280">3</text><text class="s m q6" x="261.5" y="297">Tree</text><text class="t m q5" x="330.5" y="280">4</text><text class="s m q6" x="330.5" y="297">Fower</text><text class="t m q5" x="399.5" y="280">5</text><text class="s m q6" x="399.5" y="297">Fife</text><text class="t m q5" x="468.5" y="280">6</text><text class="s m q6" x="468.5" y="297">Six</text><text class="t m q5" x="537.5" y="280">7</text><text class="s m q6" x="537.5" y="297">Seven</text><text class="t m q5" x="606.5" y="280">8</text><text class="s m q6" x="606.5" y="297">Ait</text><text class="t m q5" x="675.5" y="280">9</text><text class="s m q6" x="675.5" y="297">Niner</text><rect class="cl" x="20" y="319" width="338" height="152" rx="8"/><rect x="20" y="319" width="338" height="26" rx="10" class="sky q8"/><text class="t q7" x="30" y="337">Altitudes and headings</text><circle cx="33" cy="355" r="2.2" class="ah"/><text class="s q4" x="42" y="359">Altitudes: say the thousands and hundreds. 4,500 is</text><text class="s q4" x="42" y="374">"four thousand five hundred" and 10,000 is "one</text><text class="s q4" x="42" y="389">zero thousand"</text><circle cx="33" cy="403" r="2.2" class="ah"/><text class="s q4" x="42" y="407">Headings: say each digit. 090 is "zero niner zero",</text><text class="s q4" x="42" y="422">270 is "two seven zero"</text><circle cx="33" cy="436" r="2.2" class="ah"/><text class="s q4" x="42" y="440">Frequencies: each digit, with "point" for the</text><text class="s q4" x="42" y="455">decimal. 122.8 is "one two two point eight"</text><rect class="cl" x="372" y="319" width="338" height="152" rx="8"/><rect x="372" y="319" width="338" height="26" rx="10" class="mint q8"/><text class="t q7" x="382" y="337">Your call sign</text><circle cx="385" cy="355" r="2.2" class="ah"/><text class="s q4" x="394" y="359">Use the full call sign on your first call:</text><text class="s q4" x="394" y="374">"November One Two Tree Four Zulu" (made-up call</text><text class="s q4" x="394" y="389">sign)</text><circle cx="385" cy="403" r="2.2" class="ah"/><text class="s q4" x="394" y="407">An airplane type may go in front: "Cessna One Two</text><text class="s q4" x="394" y="422">Tree Four Zulu"</text><circle cx="385" cy="436" r="2.2" class="ah"/><text class="s q4" x="394" y="440">Shorten to the last three characters only after ATC</text><text class="s q4" x="394" y="455">has done it first</text><text class="s" x="20" y="493" style="font-size:11px">Source: Aeronautical Information Manual ch. 4</text></svg>
