<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 872" role="img" aria-labelledby="ti de"><title id="ti">Fog types and the conditions that form each</title><desc id="de">Four panels. Radiation fog: clear nights with little or no wind, the ground cools and the air reaches its dew point, forms in low-lying areas like mountain valleys, burns off as the sun rises; under 20 feet thick it is ground fog. Advection fog: warm moist air over a cold surface, needs wind up to 15 knots, common in coastal areas, can persist. Upslope fog: moist stable air forced up sloping land, needs wind, can persist for days. Steam fog or sea smoke: cold dry air over warm water, with low-level turbulence and icing. A card describes ice fog at -25 degrees F or colder.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11.5px}.q1{font-size:10px}.q2{font-size:13px}.q3{fill:var(--palette-berry,#A84C6B)}.q4{stroke-width:2}.q5{stroke-width:2;opacity:.8}.q6{stroke:currentColor;stroke-width:1.5}.q7{font-size:10.5px}.q8{stroke:currentColor;stroke-width:1.3}.q9{stroke:currentColor;stroke-width:1.2;fill-opacity:.9}</style><text class="t" x="20" y="28" style="font-size:15px">Fog types and the conditions that form each</text><text class="s q2" x="20" y="50">Fog is a cloud that is on the surface. It typically occurs when the temperature of air near the ground</text><text class="s q2" x="20" y="66.5">is cooled to the air's dew point, and it is classified by the manner in which it forms.</text><rect class="cl" x="20" y="91" width="335" height="307" rx="8"/><text class="t q2" x="32" y="113">Radiation fog</text><path d="M30 155L90 155L130 209L240 209L282 155L345 155L345 225L30 225Z" class="cl q6"/><path d="M124 199L246 199L240 209L130 209Z" class="sky" style="stroke:currentColor;stroke-width:1.2"/><path d="M50 153L50 139" class="acc q4"/><path d="M50 133L52.7 139L47.3 139Z" class="dh q3"/><path d="M150 205L150 183" class="acc q4"/><path d="M150 177L152.7 183L147.3 183Z" class="dh q3"/><path d="M200 205L200 183" class="acc q4"/><path d="M200 177L202.7 183L197.3 183Z" class="dh q3"/><path d="M310 153L310 139" class="acc q4"/><path d="M310 133L312.7 139L307.3 139Z" class="dh q3"/><text class="s q1" x="78" y="139">Ground cools by</text><text class="s q1" x="78" y="151">terrestrial radiation</text><text class="t m q7" x="185" y="193">fog</text><circle cx="35" cy="237" r="2.2" class="ah"/><text class="s q0" x="44" y="241">On clear nights with relatively little to no wind</text><circle cx="35" cy="255" r="2.2" class="ah"/><text class="s q0" x="44" y="259">The ground cools rapidly and the surrounding air</text><text class="s q0" x="44" y="274">reaches its dew point</text><circle cx="35" cy="288" r="2.2" class="ah"/><text class="s q0" x="44" y="292">Usually forms in low-lying areas like mountain</text><text class="s q0" x="44" y="307">valleys</text><circle cx="35" cy="321" r="2.2" class="ah"/><text class="s q0" x="44" y="325">Lifts and burns off as the sun rises; more wind</text><text class="s q0" x="44" y="340">speeds dissipation</text><circle cx="35" cy="354" r="2.2" class="ah"/><text class="s q0" x="44" y="358">Less than 20 feet thick: ground fog</text><rect class="cl" x="375" y="91" width="335" height="307" rx="8"/><text class="t q2" x="387" y="113">Advection fog</text><rect x="385" y="195" width="150" height="30" class="sky q8"/><rect x="535" y="195" width="165" height="30" class="cl q8"/><rect x="545" y="171" width="150" height="24" rx="10" class="sky q9"/><path d="M405 159L516 159" class="acc" style="stroke-width:3"/><path d="M525 159L516 163.1L516 154.9Z" class="dh q3"/><text class="s q1" x="405" y="147">Warm, moist air, wind up to 15 knots</text><text class="t m q7" x="620" y="187">fog</text><text class="s m q1" x="460" y="215">cold surface</text><text class="s m q1" x="617" y="215">cold surface</text><circle cx="390" cy="237" r="2.2" class="ah"/><text class="s q0" x="399" y="241">A layer of warm, moist air moves over a cold</text><text class="s q0" x="399" y="256">surface</text><circle cx="390" cy="270" r="2.2" class="ah"/><text class="s q0" x="399" y="274">Wind is required: up to 15 knots forms and</text><text class="s q0" x="399" y="289">intensifies it; above 15 knots the fog usually</text><text class="s q0" x="399" y="304">lifts into low stratus</text><circle cx="390" cy="318" r="2.2" class="ah"/><text class="s q0" x="399" y="322">Common in coastal areas where sea breezes blow</text><text class="s q0" x="399" y="337">the air over cooler landmasses</text><circle cx="390" cy="351" r="2.2" class="ah"/><text class="s q0" x="399" y="355">May not burn off with the morning sun; can</text><text class="s q0" x="399" y="370">persist for days</text><rect class="cl" x="20" y="410" width="335" height="307" rx="8"/><text class="t q2" x="32" y="432">Upslope fog</text><path d="M30 544L345 544L345 458L200 484L30 544Z" class="cl q6"/><path d="M140 506L270 480L270 498L170 520Z" class="sky q9"/><path d="M50 530L141.4 500.7" class="acc" style="stroke-width:3"/><path d="M150 498L142.7 504.6L140.2 496.9Z" class="dh q3"/><text class="s q1" x="40" y="474">Moist, stable air forced up</text><text class="s q1" x="40" y="487">a sloping land feature</text><text class="t m q7" x="270" y="524">fog</text><circle cx="35" cy="556" r="2.2" class="ah"/><text class="s q0" x="44" y="560">Moist, stable air is forced up sloping land</text><text class="s q0" x="44" y="575">features like a mountain range</text><circle cx="35" cy="589" r="2.2" class="ah"/><text class="s q0" x="44" y="593">Wind is required to form it and keep it going</text><circle cx="35" cy="607" r="2.2" class="ah"/><text class="s q0" x="44" y="611">May not burn off with the morning sun and can</text><text class="s q0" x="44" y="626">persist for days</text><circle cx="35" cy="640" r="2.2" class="ah"/><text class="s q0" x="44" y="644">Can extend to greater heights than radiation fog</text><rect class="cl" x="375" y="410" width="335" height="307" rx="8"/><text class="t q2" x="387" y="432">Steam fog (sea smoke)</text><rect x="385" y="520" width="315" height="24" class="sky q8"/><path d="M565 520c8 -14 -8 -24 0 -38s-8 -20 0 -30" class="acc q5"/><path d="M600 520c8 -14 -8 -24 0 -38s-8 -20 0 -30" class="acc q5"/><path d="M635 520c8 -14 -8 -24 0 -38s-8 -20 0 -30" class="acc q5"/><path d="M670 520c8 -14 -8 -24 0 -38s-8 -20 0 -30" class="acc q5"/><path d="M385 458L447 458" class="dk" style="stroke-width:2.5"/><path d="M455 458L447 461.6L447 454.4Z" class="dh" style=""/><text class="s q1" x="463" y="462">Cold, dry air</text><text class="s e q1" x="693" y="536">warm water</text><text class="s q1" x="395" y="504">Evaporates, rises like smoke</text><circle cx="390" cy="556" r="2.2" class="ah"/><text class="s q0" x="399" y="560">Cold, dry air moves over warm water</text><circle cx="390" cy="574" r="2.2" class="ah"/><text class="s q0" x="399" y="578">As the water evaporates it rises and resembles</text><text class="s q0" x="399" y="593">smoke</text><circle cx="390" cy="607" r="2.2" class="ah"/><text class="s q0" x="399" y="611">Common over bodies of water during the coldest</text><text class="s q0" x="399" y="626">times of the year</text><circle cx="390" cy="640" r="2.2" class="ah"/><text class="s q0" x="399" y="644">Low-level turbulence and icing are commonly</text><text class="s q0" x="399" y="659">associated with it</text><rect x="20" y="729" width="690" height="24" rx="10" class="lav q6"/><text class="t q2" x="30" y="746">Ice fog</text><circle cx="31" cy="767" r="2.2" class="ah"/><text class="s q0" x="40" y="771">Occurs in cold weather when the temperature is much below freezing and water vapor forms directly into ice</text><text class="s q0" x="40" y="786">crystals</text><circle cx="31" cy="801" r="2.2" class="ah"/><text class="s q0" x="40" y="805">Conditions favorable for its formation are the same as for radiation fog except for cold temperature, usually</text><text class="s q0" x="40" y="820">-25 °F or colder</text><circle cx="31" cy="835" r="2.2" class="ah"/><text class="s q0" x="40" y="839">Occurs mostly in the arctic regions but is not unknown in middle latitudes during the cold season</text></svg>
