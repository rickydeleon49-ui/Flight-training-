<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 872" role="img" aria-labelledby="ti de"><title id="ti">Fog types and the conditions that form each</title><desc id="de">Four panels. Radiation fog: clear nights with little or no wind, the ground cools and the air reaches its dew point, forms in low-lying areas like mountain valleys, burns off as the sun rises; under 20 feet thick it is ground fog. Advection fog: warm moist air over a cold surface, needs wind up to 15 knots, common in coastal areas, can persist. Upslope fog: moist stable air forced up sloping land, needs wind, can persist for days. Steam fog or sea smoke: cold dry air over warm water, with low-level turbulence and icing. A card describes ice fog at -25 degrees F or colder.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style>
<text class="t" x="20" y="28" style="font-size:15px">Fog types and the conditions that form each</text>
<text class="s" x="20" y="50.0" style="font-size:13px">Fog is a cloud that is on the surface. It typically occurs when the temperature of air near the ground</text>
<text class="s" x="20" y="66.5" style="font-size:13px">is cooled to the air's dew point, and it is classified by the manner in which it forms.</text>
<rect class="cl" x="20" y="91.0" width="335" height="307" rx="8"/>
<text class="t" x="32" y="113.0" style="font-size:13px">Radiation fog</text>
<path d="M30 155.0L90 155.0L130 209.0L240 209.0L282 155.0L345 155.0L345 225.0L30 225.0Z" class="cl" style="stroke:currentColor;stroke-width:1.5"/>
<path d="M124 199.0L246 199.0L240 209.0L130 209.0Z" class="sky" style="stroke:currentColor;stroke-width:1.2"/>
<path d="M50 153.0L50.0 139.0" class="acc" style="stroke-width:2"/><path d="M50 133.0L52.7 139.0L47.3 139.0Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/>
<path d="M150 205.0L150.0 183.0" class="acc" style="stroke-width:2"/><path d="M150 177.0L152.7 183.0L147.3 183.0Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/>
<path d="M200 205.0L200.0 183.0" class="acc" style="stroke-width:2"/><path d="M200 177.0L202.7 183.0L197.3 183.0Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/>
<path d="M310 153.0L310.0 139.0" class="acc" style="stroke-width:2"/><path d="M310 133.0L312.7 139.0L307.3 139.0Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/>
<text class="s" x="78" y="139.0" style="font-size:10px">Ground cools by</text>
<text class="s" x="78" y="151.0" style="font-size:10px">terrestrial radiation</text>
<text class="t m" x="185" y="193.0" style="font-size:10.5px">fog</text>
<circle cx="35" cy="237.0" r="2.2" class="ah"/>
<text class="s" x="44" y="241.0" style="font-size:11.5px">On clear nights with relatively little to no wind</text>
<circle cx="35" cy="255.0" r="2.2" class="ah"/>
<text class="s" x="44" y="259.0" style="font-size:11.5px">The ground cools rapidly and the surrounding air</text>
<text class="s" x="44" y="274.0" style="font-size:11.5px">reaches its dew point</text>
<circle cx="35" cy="288.0" r="2.2" class="ah"/>
<text class="s" x="44" y="292.0" style="font-size:11.5px">Usually forms in low-lying areas like mountain</text>
<text class="s" x="44" y="307.0" style="font-size:11.5px">valleys</text>
<circle cx="35" cy="321.0" r="2.2" class="ah"/>
<text class="s" x="44" y="325.0" style="font-size:11.5px">Lifts and burns off as the sun rises; more wind</text>
<text class="s" x="44" y="340.0" style="font-size:11.5px">speeds dissipation</text>
<circle cx="35" cy="354.0" r="2.2" class="ah"/>
<text class="s" x="44" y="358.0" style="font-size:11.5px">Less than 20 feet thick: ground fog</text>
<rect class="cl" x="375" y="91.0" width="335" height="307" rx="8"/>
<text class="t" x="387" y="113.0" style="font-size:13px">Advection fog</text>
<rect x="385" y="195.0" width="150" height="30" class="sky" style="stroke:currentColor;stroke-width:1.3"/>
<rect x="535" y="195.0" width="165" height="30" class="cl" style="stroke:currentColor;stroke-width:1.3"/>
<rect x="545" y="171.0" width="150" height="24" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.2;fill-opacity:.9"/>
<path d="M405 159.0L516.0 159.0" class="acc" style="stroke-width:3"/><path d="M525 159.0L516.0 163.1L516.0 154.9Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/>
<text class="s" x="405" y="147.0" style="font-size:10px">Warm, moist air, wind up to 15 knots</text>
<text class="t m" x="620" y="187.0" style="font-size:10.5px">fog</text>
<text class="s m" x="460" y="215.0" style="font-size:10px">cold surface</text>
<text class="s m" x="617" y="215.0" style="font-size:10px">cold surface</text>
<circle cx="390" cy="237.0" r="2.2" class="ah"/>
<text class="s" x="399" y="241.0" style="font-size:11.5px">A layer of warm, moist air moves over a cold</text>
<text class="s" x="399" y="256.0" style="font-size:11.5px">surface</text>
<circle cx="390" cy="270.0" r="2.2" class="ah"/>
<text class="s" x="399" y="274.0" style="font-size:11.5px">Wind is required: up to 15 knots forms and</text>
<text class="s" x="399" y="289.0" style="font-size:11.5px">intensifies it; above 15 knots the fog usually</text>
<text class="s" x="399" y="304.0" style="font-size:11.5px">lifts into low stratus</text>
<circle cx="390" cy="318.0" r="2.2" class="ah"/>
<text class="s" x="399" y="322.0" style="font-size:11.5px">Common in coastal areas where sea breezes blow</text>
<text class="s" x="399" y="337.0" style="font-size:11.5px">the air over cooler landmasses</text>
<circle cx="390" cy="351.0" r="2.2" class="ah"/>
<text class="s" x="399" y="355.0" style="font-size:11.5px">May not burn off with the morning sun; can</text>
<text class="s" x="399" y="370.0" style="font-size:11.5px">persist for days</text>
<rect class="cl" x="20" y="410.0" width="335" height="307" rx="8"/>
<text class="t" x="32" y="432.0" style="font-size:13px">Upslope fog</text>
<path d="M30 544.0L345 544.0L345 458.0L200 484.0L30 544.0Z" class="cl" style="stroke:currentColor;stroke-width:1.5"/>
<path d="M140 506.0L270 480.0L270 498.0L170 520.0Z" class="sky" style="stroke:currentColor;stroke-width:1.2;fill-opacity:.9"/>
<path d="M50 530.0L141.4 500.7" class="acc" style="stroke-width:3"/><path d="M150 498.0L142.7 504.6L140.2 496.9Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/>
<text class="s" x="40" y="474.0" style="font-size:10px">Moist, stable air forced up</text>
<text class="s" x="40" y="487.0" style="font-size:10px">a sloping land feature</text>
<text class="t m" x="270" y="524.0" style="font-size:10.5px">fog</text>
<circle cx="35" cy="556.0" r="2.2" class="ah"/>
<text class="s" x="44" y="560.0" style="font-size:11.5px">Moist, stable air is forced up sloping land</text>
<text class="s" x="44" y="575.0" style="font-size:11.5px">features like a mountain range</text>
<circle cx="35" cy="589.0" r="2.2" class="ah"/>
<text class="s" x="44" y="593.0" style="font-size:11.5px">Wind is required to form it and keep it going</text>
<circle cx="35" cy="607.0" r="2.2" class="ah"/>
<text class="s" x="44" y="611.0" style="font-size:11.5px">May not burn off with the morning sun and can</text>
<text class="s" x="44" y="626.0" style="font-size:11.5px">persist for days</text>
<circle cx="35" cy="640.0" r="2.2" class="ah"/>
<text class="s" x="44" y="644.0" style="font-size:11.5px">Can extend to greater heights than radiation fog</text>
<rect class="cl" x="375" y="410.0" width="335" height="307" rx="8"/>
<text class="t" x="387" y="432.0" style="font-size:13px">Steam fog (sea smoke)</text>
<rect x="385" y="520.0" width="315" height="24" class="sky" style="stroke:currentColor;stroke-width:1.3"/>
<path d="M565 520.0c8 -14 -8 -24 0 -38s-8 -20 0 -30" class="acc" style="stroke-width:2;opacity:.8"/>
<path d="M600 520.0c8 -14 -8 -24 0 -38s-8 -20 0 -30" class="acc" style="stroke-width:2;opacity:.8"/>
<path d="M635 520.0c8 -14 -8 -24 0 -38s-8 -20 0 -30" class="acc" style="stroke-width:2;opacity:.8"/>
<path d="M670 520.0c8 -14 -8 -24 0 -38s-8 -20 0 -30" class="acc" style="stroke-width:2;opacity:.8"/>
<path d="M385 458.0L447.0 458.0" class="dk" style="stroke-width:2.5"/><path d="M455 458.0L447.0 461.6L447.0 454.4Z" class="dh" style=""/>
<text class="s" x="463" y="462.0" style="font-size:10px">Cold, dry air</text>
<text class="s e" x="693" y="536.0" style="font-size:10px">warm water</text>
<text class="s" x="395" y="504.0" style="font-size:10px">Evaporates, rises like smoke</text>
<circle cx="390" cy="556.0" r="2.2" class="ah"/>
<text class="s" x="399" y="560.0" style="font-size:11.5px">Cold, dry air moves over warm water</text>
<circle cx="390" cy="574.0" r="2.2" class="ah"/>
<text class="s" x="399" y="578.0" style="font-size:11.5px">As the water evaporates it rises and resembles</text>
<text class="s" x="399" y="593.0" style="font-size:11.5px">smoke</text>
<circle cx="390" cy="607.0" r="2.2" class="ah"/>
<text class="s" x="399" y="611.0" style="font-size:11.5px">Common over bodies of water during the coldest</text>
<text class="s" x="399" y="626.0" style="font-size:11.5px">times of the year</text>
<circle cx="390" cy="640.0" r="2.2" class="ah"/>
<text class="s" x="399" y="644.0" style="font-size:11.5px">Low-level turbulence and icing are commonly</text>
<text class="s" x="399" y="659.0" style="font-size:11.5px">associated with it</text>
<rect x="20" y="729.0" width="690" height="24" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="30" y="746.0" style="font-size:13px">Ice fog</text>
<circle cx="31" cy="767.0" r="2.2" class="ah"/>
<text class="s" x="40" y="771.0" style="font-size:11.5px">Occurs in cold weather when the temperature is much below freezing and water vapor forms directly into ice</text>
<text class="s" x="40" y="786.0" style="font-size:11.5px">crystals</text>
<circle cx="31" cy="801.0" r="2.2" class="ah"/>
<text class="s" x="40" y="805.0" style="font-size:11.5px">Conditions favorable for its formation are the same as for radiation fog except for cold temperature, usually</text>
<text class="s" x="40" y="820.0" style="font-size:11.5px">-25 °F or colder</text>
<circle cx="31" cy="835.0" r="2.2" class="ah"/>
<text class="s" x="40" y="839.0" style="font-size:11.5px">Occurs mostly in the arctic regions but is not unknown in middle latitudes during the cold season</text>
</svg>
