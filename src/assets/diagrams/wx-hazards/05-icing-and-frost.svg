<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 783" role="img" aria-labelledby="ti de"><title id="ti">Structural icing and frost on the wing</title><desc id="de">Left: an airfoil with supercooled droplets striking the leading edge and ice building there. Icing can occur in clouds any time the temperature drops below freezing and supercooled droplets, still liquid below 32 degrees F or 0 degrees C, build up on the aircraft and freeze. Right: an airfoil covered by frost after a cool, clear, calm night; moisture deposits as dew above freezing and as frost below freezing, and frost is a flight safety hazard. Cards: ice and frost reduce lift (0.8 millimeter of ice cuts lift by 25 percent), who is at risk, cleaning before flight, anti-ice and deice equipment.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><text class="t" x="20" y="28" style="font-size:15px">Structural icing and frost on the wing</text><text class="s" x="20" y="50.0" style="font-size:13px">Aircraft that have ice, snow, or frost on their surfaces must be carefully cleaned prior to beginning</text><text class="s" x="20" y="66.5" style="font-size:13px">a flight because of the possible airflow disruption and loss of lift.</text><rect class="cl" x="20" y="91.0" width="335" height="340" rx="8"/><text class="t" x="32" y="113.0" style="font-size:13px">Icing in flight</text><path d="M130 195.0C140.0 161.0,220.0 157.0,320.0 195.0C230.0 205.0,150.0 205.0,130 195.0Z" class="sky" style="stroke:currentColor;stroke-width:1.8;stroke-linejoin:round"/><path d="M122 193.0C126 165.0,144 157.0,152 165.0C144 175.0,140 201.0,130 203.0Z" class="ah" style="stroke:currentColor;stroke-width:1.2;fill-opacity:.55"/><circle cx="60" cy="173.0" r="4" class="sky" style="stroke:currentColor;stroke-width:1.2"/><circle cx="34" cy="191.0" r="4" class="sky" style="stroke:currentColor;stroke-width:1.2"/><circle cx="70" cy="201.0" r="4" class="sky" style="stroke:currentColor;stroke-width:1.2"/><circle cx="44" cy="217.0" r="4" class="sky" style="stroke:currentColor;stroke-width:1.2"/><circle cx="82" cy="155.0" r="4" class="sky" style="stroke:currentColor;stroke-width:1.2"/><path d="M20 165.0L39.0 165.0" class="acc" style="stroke-width:2"/><path d="M46 165.0L39.0 168.2L39.0 161.8Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><text class="s" x="32" y="141.0" style="font-size:10.5px">Supercooled droplets in cloud</text><text class="s" x="150" y="229.0" style="font-size:10.5px">ice builds on the leading edge</text><circle cx="44" cy="255.0" r="11" class="ah"/><text class="t m" x="44" y="259.3333333333333" style="font-size:13px;fill:#fff">1</text><text class="t" x="62" y="260.0" style="font-size:12px">In clouds</text><text class="s" x="62" y="277.0" style="font-size:11px">Icing can occur in clouds any time the</text><text class="s" x="62" y="291.5" style="font-size:11px">temperature drops below freezing</text><circle cx="44" cy="322.0" r="11" class="ah"/><text class="t m" x="44" y="326.3333333333333" style="font-size:13px;fill:#fff">2</text><text class="t" x="62" y="327.0" style="font-size:12px">Below freezing</text><text class="s" x="62" y="344.0" style="font-size:11px">Temperature below 32 °F (0 °C)</text><circle cx="44" cy="374.5" r="11" class="ah"/><text class="t m" x="44" y="378.8333333333333" style="font-size:13px;fill:#fff">3</text><text class="t" x="62" y="379.5" style="font-size:12px">Supercooled droplets</text><text class="s" x="62" y="396.5" style="font-size:11px">Still liquid even though the temperature is below</text><text class="s" x="62" y="411.0" style="font-size:11px">freezing; they build up on the aircraft and</text><text class="s" x="62" y="425.5" style="font-size:11px">freeze</text><rect class="cl" x="375" y="91.0" width="335" height="340" rx="8"/><text class="t" x="387" y="113.0" style="font-size:13px">Dew and frost on a calm night</text><path d="M388 229.0L700 229.0" class="dk" style="stroke-width:1.5;opacity:.6"/><path d="M450 195.0C460.0 161.0,540.0 157.0,640.0 195.0C550.0 205.0,470.0 205.0,450 195.0Z" class="sky" style="stroke:currentColor;stroke-width:1.8;stroke-linejoin:round"/><path d="M464 177.7l-3 -6M464 177.7l3 -6M464 177.7l0 -7" class="dk" style="stroke-width:1.3"/><path d="M477 174.5l-3 -6M477 174.5l3 -6M477 174.5l0 -7" class="dk" style="stroke-width:1.3"/><path d="M490 171.9l-3 -6M490 171.9l3 -6M490 171.9l0 -7" class="dk" style="stroke-width:1.3"/><path d="M503 170.0l-3 -6M503 170.0l3 -6M503 170.0l0 -7" class="dk" style="stroke-width:1.3"/><path d="M516 168.7l-3 -6M516 168.7l3 -6M516 168.7l0 -7" class="dk" style="stroke-width:1.3"/><path d="M529 168.1l-3 -6M529 168.1l3 -6M529 168.1l0 -7" class="dk" style="stroke-width:1.3"/><path d="M542 168.1l-3 -6M542 168.1l3 -6M542 168.1l0 -7" class="dk" style="stroke-width:1.3"/><path d="M555 168.7l-3 -6M555 168.7l3 -6M555 168.7l0 -7" class="dk" style="stroke-width:1.3"/><path d="M568 170.0l-3 -6M568 170.0l3 -6M568 170.0l0 -7" class="dk" style="stroke-width:1.3"/><path d="M581 171.9l-3 -6M581 171.9l3 -6M581 171.9l0 -7" class="dk" style="stroke-width:1.3"/><path d="M594 174.5l-3 -6M594 174.5l3 -6M594 174.5l0 -7" class="dk" style="stroke-width:1.3"/><path d="M607 177.7l-3 -6M607 177.7l3 -6M607 177.7l0 -7" class="dk" style="stroke-width:1.3"/><path d="M620 184.7l-3 -6M620 184.7l3 -6M620 184.7l0 -7" class="dk" style="stroke-width:1.3"/><text class="t" x="640" y="165.0" style="font-size:11px">frost</text><text class="s" x="640" y="178.0" style="font-size:10.5px">on the wing</text><text class="s" x="387" y="141.0" style="font-size:10.5px">Ground cools the air</text><text class="s" x="387" y="154.0" style="font-size:10.5px">below the dew point</text><circle cx="399" cy="255.0" r="11" class="ah"/><text class="t m" x="399" y="259.3333333333333" style="font-size:13px;fill:#fff">1</text><text class="t" x="417" y="260.0" style="font-size:12px">Above freezing</text><text class="s" x="417" y="277.0" style="font-size:11px">Moisture condenses as dew: no threat to an</text><text class="s" x="417" y="291.5" style="font-size:11px">aircraft</text><circle cx="399" cy="322.0" r="11" class="ah"/><text class="t m" x="399" y="326.3333333333333" style="font-size:13px;fill:#fff">2</text><text class="t" x="417" y="327.0" style="font-size:12px">Below freezing</text><text class="s" x="417" y="344.0" style="font-size:11px">Moisture is deposited as frost: a definite flight</text><text class="s" x="417" y="358.5" style="font-size:11px">safety hazard</text><text class="s" x="387" y="385.0" style="font-size:11px">Frost: ice crystal deposits formed by sublimation when</text><text class="s" x="387" y="399.5" style="font-size:11px">temperature and dew point are below freezing.</text><rect x="20" y="445.0" width="335" height="24" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30" y="462.0" style="font-size:13px">What ice and frost do to lift</text><circle cx="31" cy="483.0" r="2.2" class="ah"/><text class="s" x="40" y="487.0" style="font-size:11.5px">Frost disrupts the flow of air over the wing, can</text><text class="s" x="40" y="502.0" style="font-size:11.5px">drastically reduce lift and increases drag, which</text><text class="s" x="40" y="517.0" style="font-size:11.5px">can adversely affect the ability to take off</text><circle cx="31" cy="532.0" r="2.2" class="ah"/><text class="s" x="40" y="536.0" style="font-size:11.5px">Ice, snow and frost make the boundary layer</text><text class="s" x="40" y="551.0" style="font-size:11.5px">separate at an AOA lower than the critical angle</text><circle cx="31" cy="566.0" r="2.2" class="ah"/><text class="s" x="40" y="570.0" style="font-size:11.5px">As little as 0.8 millimeter of ice on the upper</text><text class="s" x="40" y="585.0" style="font-size:11.5px">wing surface increases drag and reduces lift by 25</text><text class="s" x="40" y="600.0" style="font-size:11.5px">percent</text><circle cx="31" cy="615.0" r="2.2" class="ah"/><text class="s" x="40" y="619.0" style="font-size:11.5px">Ice in flight adds weight while the ability to</text><text class="s" x="40" y="634.0" style="font-size:11.5px">generate lift decreases</text><rect x="375" y="445.0" width="335" height="24" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="385" y="462.0" style="font-size:13px">Who is at risk</text><circle cx="386" cy="483.0" r="2.2" class="ah"/><text class="s" x="395" y="487.0" style="font-size:11.5px">Icing can be met in any season, anywhere in the</text><text class="s" x="395" y="502.0" style="font-size:11.5px">country, at altitudes of up to 18,000 feet and</text><text class="s" x="395" y="517.0" style="font-size:11.5px">sometimes higher</text><circle cx="386" cy="532.0" r="2.2" class="ah"/><text class="s" x="395" y="536.0" style="font-size:11.5px">Small aircraft are most vulnerable: they fly lower</text><text class="s" x="395" y="551.0" style="font-size:11.5px">where ice is more prevalent, and lack heated wing</text><text class="s" x="395" y="566.0" style="font-size:11.5px">leading edges</text><circle cx="386" cy="581.0" r="2.2" class="ah"/><text class="s" x="395" y="585.0" style="font-size:11.5px">Most light aircraft have only a heated pitot tube</text><text class="s" x="395" y="600.0" style="font-size:11.5px">and are not certified for flight in icing;</text><text class="s" x="395" y="615.0" style="font-size:11.5px">noncertificated aircraft must exit icing conditions</text><text class="s" x="395" y="630.0" style="font-size:11.5px">immediately</text><rect x="20" y="659.0" width="335" height="24" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30" y="676.0" style="font-size:13px">Before flight</text><circle cx="31" cy="697.0" r="2.2" class="ah"/><text class="s" x="40" y="701.0" style="font-size:11.5px">An aircraft must be thoroughly cleaned and free of</text><text class="s" x="40" y="716.0" style="font-size:11.5px">frost prior to beginning a flight</text><rect x="375" y="659.0" width="335" height="24" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="385" y="676.0" style="font-size:13px">Anti-ice and deice</text><circle cx="386" cy="697.0" r="2.2" class="ah"/><text class="s" x="395" y="701.0" style="font-size:11.5px">Anti-icing equipment prevents the formation of ice;</text><text class="s" x="395" y="716.0" style="font-size:11.5px">deicing equipment removes ice once it has formed</text><circle cx="386" cy="731.0" r="2.2" class="ah"/><text class="s" x="395" y="735.0" style="font-size:11.5px">Ice pellets indicate a temperature inversion, with</text><text class="s" x="395" y="750.0" style="font-size:11.5px">freezing rain at a higher altitude</text></svg>
