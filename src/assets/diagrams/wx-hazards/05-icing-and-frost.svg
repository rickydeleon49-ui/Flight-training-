<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 783" role="img" aria-labelledby="ti de"><title id="ti">Structural icing and frost on the wing</title><desc id="de">Left: an airfoil with supercooled droplets striking the leading edge and ice building there. Icing can occur in clouds any time the temperature drops below freezing and supercooled droplets, still liquid below 32 degrees F or 0 degrees C, build up on the aircraft and freeze. Right: an airfoil covered by frost after a cool, clear, calm night; moisture deposits as dew above freezing and as frost below freezing, and frost is a flight safety hazard. Cards: ice and frost reduce lift (0.8 millimeter of ice cuts lift by 25 percent), who is at risk, cleaning before flight, anti-ice and deice equipment.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11.5px}.q1{font-size:11px}.q2{stroke-width:1.3}.q3{font-size:13px}.q4{stroke:currentColor;stroke-width:1.2}.q5{font-size:10.5px}.q6{font-size:13px;fill:#fff}.q7{font-size:12px}.q8{stroke:currentColor;stroke-width:1.5}.q9{stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}</style><text class="t" x="20" y="28" style="font-size:15px">Structural icing and frost on the wing</text><text class="s q3" x="20" y="50">Aircraft that have ice, snow, or frost on their surfaces must be carefully cleaned prior to beginning</text><text class="s q3" x="20" y="66.5">a flight because of the possible airflow disruption and loss of lift.</text><rect class="cl" x="20" y="91" width="335" height="340" rx="8"/><text class="t q3" x="32" y="113">Icing in flight</text><path d="M130 195C140 161,220 157,320 195C230 205,150 205,130 195Z" class="sky q9"/><path d="M122 193C126 165,144 157,152 165C144 175,140 201,130 203Z" class="ah" style="stroke:currentColor;stroke-width:1.2;fill-opacity:.55"/><circle cx="60" cy="173" r="4" class="sky q4"/><circle cx="34" cy="191" r="4" class="sky q4"/><circle cx="70" cy="201" r="4" class="sky q4"/><circle cx="44" cy="217" r="4" class="sky q4"/><circle cx="82" cy="155" r="4" class="sky q4"/><path d="M20 165L39 165" class="acc" style="stroke-width:2"/><path d="M46 165L39 168.2L39 161.8Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><text class="s q5" x="32" y="141">Supercooled droplets in cloud</text><text class="s q5" x="150" y="229">ice builds on the leading edge</text><circle cx="44" cy="255" r="11" class="ah"/><text class="t m q6" x="44" y="259.33">1</text><text class="t q7" x="62" y="260">In clouds</text><text class="s q1" x="62" y="277">Icing can occur in clouds any time the</text><text class="s q1" x="62" y="291.5">temperature drops below freezing</text><circle cx="44" cy="322" r="11" class="ah"/><text class="t m q6" x="44" y="326.33">2</text><text class="t q7" x="62" y="327">Below freezing</text><text class="s q1" x="62" y="344">Temperature below 32 °F (0 °C)</text><circle cx="44" cy="374.5" r="11" class="ah"/><text class="t m q6" x="44" y="378.83">3</text><text class="t q7" x="62" y="379.5">Supercooled droplets</text><text class="s q1" x="62" y="396.5">Still liquid even though the temperature is below</text><text class="s q1" x="62" y="411">freezing; they build up on the aircraft and</text><text class="s q1" x="62" y="425.5">freeze</text><rect class="cl" x="375" y="91" width="335" height="340" rx="8"/><text class="t q3" x="387" y="113">Dew and frost on a calm night</text><path d="M388 229L700 229" class="dk" style="stroke-width:1.5;opacity:.6"/><path d="M450 195C460 161,540 157,640 195C550 205,470 205,450 195Z" class="sky q9"/><path d="M464 177.7l-3 -6M464 177.7l3 -6M464 177.7l0 -7" class="dk q2"/><path d="M477 174.5l-3 -6M477 174.5l3 -6M477 174.5l0 -7" class="dk q2"/><path d="M490 171.9l-3 -6M490 171.9l3 -6M490 171.9l0 -7" class="dk q2"/><path d="M503 170l-3 -6M503 170l3 -6M503 170l0 -7" class="dk q2"/><path d="M516 168.7l-3 -6M516 168.7l3 -6M516 168.7l0 -7" class="dk q2"/><path d="M529 168.1l-3 -6M529 168.1l3 -6M529 168.1l0 -7" class="dk q2"/><path d="M542 168.1l-3 -6M542 168.1l3 -6M542 168.1l0 -7" class="dk q2"/><path d="M555 168.7l-3 -6M555 168.7l3 -6M555 168.7l0 -7" class="dk q2"/><path d="M568 170l-3 -6M568 170l3 -6M568 170l0 -7" class="dk q2"/><path d="M581 171.9l-3 -6M581 171.9l3 -6M581 171.9l0 -7" class="dk q2"/><path d="M594 174.5l-3 -6M594 174.5l3 -6M594 174.5l0 -7" class="dk q2"/><path d="M607 177.7l-3 -6M607 177.7l3 -6M607 177.7l0 -7" class="dk q2"/><path d="M620 184.7l-3 -6M620 184.7l3 -6M620 184.7l0 -7" class="dk q2"/><text class="t q1" x="640" y="165">frost</text><text class="s q5" x="640" y="178">on the wing</text><text class="s q5" x="387" y="141">Ground cools the air</text><text class="s q5" x="387" y="154">below the dew point</text><circle cx="399" cy="255" r="11" class="ah"/><text class="t m q6" x="399" y="259.33">1</text><text class="t q7" x="417" y="260">Above freezing</text><text class="s q1" x="417" y="277">Moisture condenses as dew: no threat to an</text><text class="s q1" x="417" y="291.5">aircraft</text><circle cx="399" cy="322" r="11" class="ah"/><text class="t m q6" x="399" y="326.33">2</text><text class="t q7" x="417" y="327">Below freezing</text><text class="s q1" x="417" y="344">Moisture is deposited as frost: a definite flight</text><text class="s q1" x="417" y="358.5">safety hazard</text><text class="s q1" x="387" y="385">Frost: ice crystal deposits formed by sublimation when</text><text class="s q1" x="387" y="399.5">temperature and dew point are below freezing.</text><rect x="20" y="445" width="335" height="24" rx="10" class="rose q8"/><text class="t q3" x="30" y="462">What ice and frost do to lift</text><circle cx="31" cy="483" r="2.2" class="ah"/><text class="s q0" x="40" y="487">Frost disrupts the flow of air over the wing, can</text><text class="s q0" x="40" y="502">drastically reduce lift and increases drag, which</text><text class="s q0" x="40" y="517">can adversely affect the ability to take off</text><circle cx="31" cy="532" r="2.2" class="ah"/><text class="s q0" x="40" y="536">Ice, snow and frost make the boundary layer</text><text class="s q0" x="40" y="551">separate at an AOA lower than the critical angle</text><circle cx="31" cy="566" r="2.2" class="ah"/><text class="s q0" x="40" y="570">As little as 0.8 millimeter of ice on the upper</text><text class="s q0" x="40" y="585">wing surface increases drag and reduces lift by 25</text><text class="s q0" x="40" y="600">percent</text><circle cx="31" cy="615" r="2.2" class="ah"/><text class="s q0" x="40" y="619">Ice in flight adds weight while the ability to</text><text class="s q0" x="40" y="634">generate lift decreases</text><rect x="375" y="445" width="335" height="24" rx="10" class="lav q8"/><text class="t q3" x="385" y="462">Who is at risk</text><circle cx="386" cy="483" r="2.2" class="ah"/><text class="s q0" x="395" y="487">Icing can be met in any season, anywhere in the</text><text class="s q0" x="395" y="502">country, at altitudes of up to 18,000 feet and</text><text class="s q0" x="395" y="517">sometimes higher</text><circle cx="386" cy="532" r="2.2" class="ah"/><text class="s q0" x="395" y="536">Small aircraft are most vulnerable: they fly lower</text><text class="s q0" x="395" y="551">where ice is more prevalent, and lack heated wing</text><text class="s q0" x="395" y="566">leading edges</text><circle cx="386" cy="581" r="2.2" class="ah"/><text class="s q0" x="395" y="585">Most light aircraft have only a heated pitot tube</text><text class="s q0" x="395" y="600">and are not certified for flight in icing;</text><text class="s q0" x="395" y="615">noncertificated aircraft must exit icing conditions</text><text class="s q0" x="395" y="630">immediately</text><rect x="20" y="659" width="335" height="24" rx="10" class="mint q8"/><text class="t q3" x="30" y="676">Before flight</text><circle cx="31" cy="697" r="2.2" class="ah"/><text class="s q0" x="40" y="701">An aircraft must be thoroughly cleaned and free of</text><text class="s q0" x="40" y="716">frost prior to beginning a flight</text><rect x="375" y="659" width="335" height="24" rx="10" class="sky q8"/><text class="t q3" x="385" y="676">Anti-ice and deice</text><circle cx="386" cy="697" r="2.2" class="ah"/><text class="s q0" x="395" y="701">Anti-icing equipment prevents the formation of ice;</text><text class="s q0" x="395" y="716">deicing equipment removes ice once it has formed</text><circle cx="386" cy="731" r="2.2" class="ah"/><text class="s q0" x="395" y="735">Ice pellets indicate a temperature inversion, with</text><text class="s q0" x="395" y="750">freezing rain at a higher altitude</text></svg>
