<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 784" role="img" aria-labelledby="ti de"><title id="ti">Microburst: low-level wind shear on approach</title><desc id="de">Side view of an approach through a microburst: a downdraft falls from the cloud base and spreads outward along the ground. The aircraft first meets a performance-increasing headwind (1), then performance-decreasing downdrafts (2), then a rapidly increasing tailwind (3), which can leave it dangerously close to the ground or short of the runway (4). Stated figures: horizontal diameter 1 to 2 miles, nominal depth 1,000 feet, lifespan 5 to 15 minutes, downdrafts up to 6,000 feet per minute, headwind losses of 30 to 90 knots. Cards cover wind shear and awareness.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><text class="t" x="20" y="28" style="font-size:15px">Microburst: low-level wind shear on approach</text><text class="s" x="20" y="50.0" style="font-size:13px">Wind shear is a sudden, drastic change in wind speed and/or direction over a very small area. The most</text><text class="s" x="20" y="66.5" style="font-size:13px">severe type of low-level wind shear, a microburst, is associated with convective precipitation into</text><text class="s" x="20" y="83.0" style="font-size:13px">dry air at cloud base.</text><rect class="cl" x="20" y="107.5" width="690" height="290" rx="8"/><text class="t" x="32" y="129.5" style="font-size:13px">Approach through a microburst (side view, schematic)</text><path d="M30 339.5L700 339.5" class="dk" style="stroke-width:2"/><rect x="590" y="337.5" width="100" height="8" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="640" y="361.5" style="font-size:11px">Runway</text><rect x="210" y="147.5" width="240" height="22" rx="11" class="cl" style="stroke:currentColor;stroke-width:1.6"/><text class="s m" x="330" y="162.5" style="font-size:10.5px">Cloud base</text><path d="M304 179.5L304.0 316.5" class="acc" style="stroke-width:3.2"/><path d="M304 325.5L299.9 316.5L308.1 316.5Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><path d="M330 179.5L330.0 316.5" class="acc" style="stroke-width:3.2"/><path d="M330 325.5L325.9 316.5L334.1 316.5Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><path d="M356 179.5L356.0 316.5" class="acc" style="stroke-width:3.2"/><path d="M356 325.5L351.9 316.5L360.1 316.5Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><text class="t" x="374" y="227.5" style="font-size:11.5px">Downdraft</text><text class="s" x="374" y="241.5" style="font-size:10px">intense rain shaft; virga at</text><text class="s" x="374" y="254.5" style="font-size:10px">cloud base</text><path d="M310 321.5L273.0 321.5" class="dk" style="stroke-width:2.4"/><path d="M266 321.5L273.0 318.4L273.0 324.6Z" class="dh" style=""/><path d="M350 321.5L387.0 321.5" class="dk" style="stroke-width:2.4"/><path d="M394 321.5L387.0 324.6L387.0 318.4Z" class="dh" style=""/><path d="M256 318.5L219.0 318.5" class="dk" style="stroke-width:2.4"/><path d="M212 318.5L219.0 315.4L219.0 321.6Z" class="dh" style=""/><path d="M404 318.5L441.0 318.5" class="dk" style="stroke-width:2.4"/><path d="M448 318.5L441.0 321.6L441.0 315.4Z" class="dh" style=""/><path d="M202 315.5L165.0 315.5" class="dk" style="stroke-width:2.4"/><path d="M158 315.5L165.0 312.4L165.0 318.6Z" class="dh" style=""/><path d="M458 315.5L495.0 315.5" class="dk" style="stroke-width:2.4"/><path d="M502 315.5L495.0 318.6L495.0 312.4Z" class="dh" style=""/><text class="s m" x="330" y="361.5" style="font-size:10.5px">ring of blowing dust: often the only visible clue</text><path d="M40 215.5L590 337.5" class="dk" style="stroke-width:1.4;opacity:.5;stroke-dasharray:6 5"/><text class="s" x="40" y="203.5" style="font-size:10.5px">Intended glidepath</text><path d="M60 219.5C140 225.5,210 241.5,262 265.5S330 297.5,400 313.5S480 329.5,520 331.5" class="acc" style="stroke-width:3"/><circle cx="150" cy="211.5" r="11" class="ah"/><text class="t m" x="150" y="215.83333333333334" style="font-size:13px;fill:#fff">1</text><circle cx="300" cy="263.5" r="11" class="ah"/><text class="t m" x="300" y="267.8333333333333" style="font-size:13px;fill:#fff">2</text><circle cx="425" cy="295.5" r="11" class="ah"/><text class="t m" x="425" y="299.8333333333333" style="font-size:13px;fill:#fff">3</text><circle cx="535" cy="311.5" r="11" class="ah"/><text class="t m" x="535" y="315.8333333333333" style="font-size:13px;fill:#fff">4</text><path d="M71.8 221.6L51.7 224.3L53.8 212.1Z" class="ah"/><rect class="cl" x="20" y="409.5" width="690" height="92" rx="8"/><circle cx="43" cy="431.5" r="11" class="ah"/><text class="t m" x="43" y="435.8333333333333" style="font-size:13px;fill:#fff">1</text><text class="t" x="60" y="436.5" style="font-size:12.5px">Headwind</text><text class="s" x="32" y="455.5" style="font-size:10.5px">Performance-increasing</text><text class="s" x="32" y="469.5" style="font-size:10.5px">headwind</text><circle cx="214" cy="431.5" r="11" class="ah"/><text class="t m" x="214" y="435.8333333333333" style="font-size:13px;fill:#fff">2</text><text class="t" x="231" y="436.5" style="font-size:12.5px">Downdrafts</text><text class="s" x="203" y="455.5" style="font-size:10.5px">Performance-decreasing</text><text class="s" x="203" y="469.5" style="font-size:10.5px">downdrafts</text><circle cx="385" cy="431.5" r="11" class="ah"/><text class="t m" x="385" y="435.8333333333333" style="font-size:13px;fill:#fff">3</text><text class="t" x="402" y="436.5" style="font-size:12.5px">Tailwind</text><text class="s" x="374" y="455.5" style="font-size:10.5px">Rapidly increasing tailwind</text><circle cx="556" cy="431.5" r="11" class="ah"/><text class="t m" x="556" y="435.8333333333333" style="font-size:13px;fill:#fff">4</text><text class="t" x="573" y="436.5" style="font-size:12.5px">Near the ground</text><text class="s" x="545" y="455.5" style="font-size:10.5px">Terrain impact, or flight</text><text class="s" x="545" y="469.5" style="font-size:10.5px">dangerously close to the</text><text class="s" x="545" y="483.5" style="font-size:10.5px">ground</text><rect x="20" y="513.5" width="132" height="56" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="86" y="536.5" style="font-size:13px">1-2 miles</text><text class="s m" x="86.0" y="553.5" style="font-size:10.5px">horizontal diameter</text><rect x="159" y="513.5" width="132" height="56" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="225" y="536.5" style="font-size:13px">1,000 feet</text><text class="s m" x="225.0" y="553.5" style="font-size:10.5px">nominal depth</text><rect x="298" y="513.5" width="132" height="56" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="364" y="536.5" style="font-size:13px">5-15 minutes</text><text class="s m" x="364.0" y="553.5" style="font-size:10.5px">lifespan</text><rect x="437" y="513.5" width="132" height="56" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="503" y="536.5" style="font-size:13px">up to 6,000 fpm</text><text class="s m" x="503.0" y="553.5" style="font-size:10.5px">downdrafts</text><rect x="576" y="513.5" width="132" height="56" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="642" y="536.5" style="font-size:13px">30-90 knots</text><text class="s m" x="642.0" y="553.5" style="font-size:10.5px">headwind losses</text><rect x="20" y="581.5" width="335" height="24" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30" y="598.5" style="font-size:13px">Wind shear</text><circle cx="31" cy="619.5" r="2.2" class="ah"/><text class="s" x="40" y="623.5" style="font-size:11.5px">Can subject an aircraft to violent updrafts and</text><text class="s" x="40" y="638.5" style="font-size:11.5px">downdrafts and abrupt changes to its horizontal</text><text class="s" x="40" y="653.5" style="font-size:11.5px">movement</text><circle cx="31" cy="668.5" r="2.2" class="ah"/><text class="s" x="40" y="672.5" style="font-size:11.5px">Commonly associated with passing frontal systems,</text><text class="s" x="40" y="687.5" style="font-size:11.5px">thunderstorms, temperature inversions and strong</text><text class="s" x="40" y="702.5" style="font-size:11.5px">upper level winds (greater than 25 knots)</text><circle cx="31" cy="717.5" r="2.2" class="ah"/><text class="s" x="40" y="721.5" style="font-size:11.5px">A tailwind quickly changing to a headwind increases</text><text class="s" x="40" y="736.5" style="font-size:11.5px">airspeed and performance; a headwind changing to a</text><text class="s" x="40" y="751.5" style="font-size:11.5px">tailwind decreases both</text><rect x="375" y="581.5" width="335" height="24" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="385" y="598.5" style="font-size:13px">Awareness</text><circle cx="386" cy="619.5" r="2.2" class="ah"/><text class="s" x="395" y="623.5" style="font-size:11.5px">An encounter during approach involves the same</text><text class="s" x="395" y="638.5" style="font-size:11.5px">sequence of wind changes and could force the plane</text><text class="s" x="395" y="653.5" style="font-size:11.5px">to the ground short of the runway</text><circle cx="386" cy="668.5" r="2.2" class="ah"/><text class="s" x="395" y="672.5" style="font-size:11.5px">Many airports lack microburst alert equipment: see</text><text class="s" x="395" y="687.5" style="font-size:11.5px">AC 00-54, FAA Pilot Wind Shear Guide, for how to</text><text class="s" x="395" y="702.5" style="font-size:11.5px">recognize the risk, avoid an encounter and escape</text><circle cx="386" cy="717.5" r="2.2" class="ah"/><text class="s" x="395" y="721.5" style="font-size:11.5px">Always be alert, especially in and around</text><text class="s" x="395" y="736.5" style="font-size:11.5px">thunderstorms and frontal systems</text></svg>
