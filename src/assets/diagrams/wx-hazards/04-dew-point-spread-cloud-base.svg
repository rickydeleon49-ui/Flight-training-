<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 698" role="img" aria-labelledby="ti de"><title id="ti">Temperature, dew point and the height of the cloud base</title><desc id="de">A graph of altitude in feet above ground against temperature in degrees F. Lifted unsaturated air cools 5.4 degrees F per 1,000 feet while the dew point falls 1 degree F per 1,000 feet, so they converge at 4.4 degrees F per 1,000 feet. Starting at a temperature of 85 and a dew point of 71 at the surface, the spread of 14 divided by 4.4 is 3.18, giving a cloud base of 3,180 feet AGL. Cards: a small spread makes fog, low clouds and precipitation likely; four ways air reaches saturation; warm air holds more moisture.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11.5px}.q1{font-size:10px}.q2{stroke-width:1.2;opacity:0.8}.q3{font-size:11px}.q4{stroke:currentColor;stroke-width:1.5}.q5{font-size:13px}.q6{font-size:10.5px}.q7{font-size:12.5px}.q8{stroke-width:0.8;opacity:0.2;stroke-dasharray:6 5}</style><text class="t" x="20" y="28" style="font-size:15px">Temperature, dew point and the height of the cloud base</text><text class="s q5" x="20" y="50">When the temperature of the air is reduced to the dew point, the air is completely saturated and</text><text class="s q5" x="20" y="66.5">moisture begins to condense out of the air as fog, dew, frost, clouds, rain, or snow.</text><rect class="cl" x="20" y="91" width="430" height="330" rx="8"/><text class="t q5" x="32" y="113">Lifted unsaturated air: temperature meets dew point</text><path d="M84 381L432 381M84 381L84 141" class="dk" style="stroke-width:1.6"/><path d="M84 381L84 386" class="dk q2"/><text class="s m q1" x="84" y="399">64</text><path d="M142 381L142 386" class="dk q2"/><text class="s m q1" x="142" y="399">68</text><path d="M200 381L200 386" class="dk q2"/><text class="s m q1" x="200" y="399">72</text><path d="M258 381L258 386" class="dk q2"/><text class="s m q1" x="258" y="399">76</text><path d="M316 381L316 386" class="dk q2"/><text class="s m q1" x="316" y="399">80</text><path d="M374 381L374 386" class="dk q2"/><text class="s m q1" x="374" y="399">84</text><path d="M432 381L432 386" class="dk q2"/><text class="s m q1" x="432" y="399">88</text><text class="s e q6" x="432" y="413">Temperature (°F)</text><path d="M79 381L84 381" class="dk q2"/><text class="s e q1" x="76" y="385">0</text><path d="M79 323.5L84 323.5" class="dk q2"/><text class="s e q1" x="76" y="327.5">1,000</text><path d="M84 323.5L432 323.5" class="dk q8"/><path d="M79 266L84 266" class="dk q2"/><text class="s e q1" x="76" y="270">2,000</text><path d="M84 266L432 266" class="dk q8"/><path d="M79 208.5L84 208.5" class="dk q2"/><text class="s e q1" x="76" y="212.5">3,000</text><path d="M84 208.5L432 208.5" class="dk q8"/><path d="M79 151L84 151" class="dk q2"/><text class="s e q1" x="76" y="155">4,000</text><path d="M84 151L432 151" class="dk q8"/><text class="s q6" x="32" y="137">Feet AGL</text><path d="M388.5 381L139.5 198.2" class="acc" style="stroke-width:3"/><path d="M185.5 381L139.5 198.2" class="dk" style="stroke-width:3"/><path d="M185.5 365L388.5 365" class="dk" style="stroke-width:1.6"/><text class="t m q3" x="287" y="359">spread 14 °F</text><text class="t q3" x="394.5" y="351">T 85 °F</text><text class="t e q3" x="169.5" y="375">DP 71 °F</text><text class="s q6" x="258" y="233.25">Temperature falls</text><text class="s q6" x="258" y="246.25">5.4 °F per 1,000 ft</text><text class="s q6" x="179.7" y="294.75">Dew point falls</text><text class="s q6" x="179.7" y="307.75">1 °F per 1,000 ft</text><circle cx="105.5" cy="180.2" r="15" class="cl q4"/><circle cx="129.5" cy="168.2" r="20" class="cl q4"/><circle cx="155.5" cy="172.2" r="18" class="cl q4"/><circle cx="175.5" cy="182.2" r="13" class="cl q4"/><circle cx="139.5" cy="198.2" r="5" class="ah"/><text class="t q3" x="187.51" y="214.15">Cloud base 3,180 ft AGL</text><text class="s q1" x="32" y="415">Lines drawn to the stated rates; schematic.</text><rect class="cl" x="470" y="91" width="240" height="330" rx="8"/><text class="t q5" x="482" y="113">Worked example</text><text class="s q3" x="482" y="137">Given</text><text class="t q7" x="482" y="153">T = 85 °F, DP = 71 °F</text><text class="s q3" x="482" y="181">Convergence rate</text><text class="t q7" x="482" y="197">5.4 - 1 = 4.4 °F per 1,000 ft</text><text class="s q3" x="482" y="225">Spread (TDS)</text><text class="t q7" x="482" y="241">85 - 71 = 14 °F</text><text class="s q3" x="482" y="269">TDS ÷ rate</text><text class="t q7" x="482" y="285">14 ÷ 4.4 = 3.18</text><text class="s q3" x="482" y="313">x 1,000 feet</text><text class="t q7" x="482" y="329">3.18 x 1,000 = 3,180 ft AGL</text><rect x="482" y="351" width="216" height="50" rx="10" class="mint q4"/><text class="t" x="490" y="369" style="font-size:12px">The height of the cloud base is</text><text class="t" x="490" y="384.5" style="font-size:12px">3,180 feet AGL.</text><rect x="20" y="435" width="335" height="24" rx="10" class="rose q4"/><text class="t q5" x="30" y="452">When the spread is small</text><circle cx="31" cy="473" r="2.2" class="ah"/><text class="s q0" x="40" y="477">If air reaches the saturation point while</text><text class="s q0" x="40" y="492">temperature and dew point are close together, fog,</text><text class="s q0" x="40" y="507">low clouds and precipitation are highly likely</text><circle cx="31" cy="522" r="2.2" class="ah"/><text class="s q0" x="40" y="526">Saturated air brings clouds, rain and other</text><text class="s q0" x="40" y="541">critical weather situations</text><rect x="375" y="435" width="335" height="24" rx="10" class="sky q4"/><text class="t q5" x="385" y="452">Four ways air reaches saturation</text><circle cx="386" cy="473" r="2.2" class="ah"/><text class="s q0" x="395" y="477">Warm air moves over a cold surface, so the air</text><text class="s q0" x="395" y="492">temperature drops</text><circle cx="386" cy="507" r="2.2" class="ah"/><text class="s q0" x="395" y="511">Cold air and warm air mix</text><circle cx="386" cy="526" r="2.2" class="ah"/><text class="s q0" x="395" y="530">Air cools at night through contact with the cooler</text><text class="s q0" x="395" y="545">ground</text><circle cx="386" cy="560" r="2.2" class="ah"/><text class="s q0" x="395" y="564">Air is lifted or forced upward in the atmosphere</text><rect x="20" y="589" width="690" height="24" rx="10" class="lav q4"/><text class="t q5" x="30" y="606">Moisture and temperature</text><circle cx="31" cy="627" r="2.2" class="ah"/><text class="s q0" x="40" y="631">The amount of moisture air can hold depends on its temperature: every 20 °F increase doubles it, and a</text><text class="s q0" x="40" y="646">decrease of 20 °F cuts the capacity in half</text><circle cx="31" cy="661" r="2.2" class="ah"/><text class="s q0" x="40" y="665">Dew point: the temperature at which the air can hold no more moisture</text></svg>
