<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 698" role="img" aria-labelledby="ti de"><title id="ti">Temperature, dew point and the height of the cloud base</title><desc id="de">A graph of altitude in feet above ground against temperature in degrees F. Lifted unsaturated air cools 5.4 degrees F per 1,000 feet while the dew point falls 1 degree F per 1,000 feet, so they converge at 4.4 degrees F per 1,000 feet. Starting at a temperature of 85 and a dew point of 71 at the surface, the spread of 14 divided by 4.4 is 3.18, giving a cloud base of 3,180 feet AGL. Cards: a small spread makes fog, low clouds and precipitation likely; four ways air reaches saturation; warm air holds more moisture.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style>
<text class="t" x="20" y="28" style="font-size:15px">Temperature, dew point and the height of the cloud base</text>
<text class="s" x="20" y="50.0" style="font-size:13px">When the temperature of the air is reduced to the dew point, the air is completely saturated and</text>
<text class="s" x="20" y="66.5" style="font-size:13px">moisture begins to condense out of the air as fog, dew, frost, clouds, rain, or snow.</text>
<rect class="cl" x="20" y="91.0" width="430" height="330" rx="8"/>
<text class="t" x="32" y="113.0" style="font-size:13px">Lifted unsaturated air: temperature meets dew point</text>
<path d="M84 381.0L432 381.0M84 381.0L84 141.0" class="dk" style="stroke-width:1.6"/>
<path d="M84.0 381.0L84.0 386.0" class="dk" style="stroke-width:1.2;opacity:0.8"/>
<text class="s m" x="84.0" y="399.0" style="font-size:10px">64</text>
<path d="M142.0 381.0L142.0 386.0" class="dk" style="stroke-width:1.2;opacity:0.8"/>
<text class="s m" x="142.0" y="399.0" style="font-size:10px">68</text>
<path d="M200.0 381.0L200.0 386.0" class="dk" style="stroke-width:1.2;opacity:0.8"/>
<text class="s m" x="200.0" y="399.0" style="font-size:10px">72</text>
<path d="M258.0 381.0L258.0 386.0" class="dk" style="stroke-width:1.2;opacity:0.8"/>
<text class="s m" x="258.0" y="399.0" style="font-size:10px">76</text>
<path d="M316.0 381.0L316.0 386.0" class="dk" style="stroke-width:1.2;opacity:0.8"/>
<text class="s m" x="316.0" y="399.0" style="font-size:10px">80</text>
<path d="M374.0 381.0L374.0 386.0" class="dk" style="stroke-width:1.2;opacity:0.8"/>
<text class="s m" x="374.0" y="399.0" style="font-size:10px">84</text>
<path d="M432.0 381.0L432.0 386.0" class="dk" style="stroke-width:1.2;opacity:0.8"/>
<text class="s m" x="432.0" y="399.0" style="font-size:10px">88</text>
<text class="s e" x="432" y="413.0" style="font-size:10.5px">Temperature (°F)</text>
<path d="M79 381.0L84 381.0" class="dk" style="stroke-width:1.2;opacity:0.8"/>
<text class="s e" x="76" y="385.0" style="font-size:10px">0</text>
<path d="M79 323.5L84 323.5" class="dk" style="stroke-width:1.2;opacity:0.8"/>
<text class="s e" x="76" y="327.5" style="font-size:10px">1,000</text>
<path d="M84 323.5L432 323.5" class="dk" style="stroke-width:0.8;opacity:0.2;stroke-dasharray:6 5"/>
<path d="M79 266.0L84 266.0" class="dk" style="stroke-width:1.2;opacity:0.8"/>
<text class="s e" x="76" y="270.0" style="font-size:10px">2,000</text>
<path d="M84 266.0L432 266.0" class="dk" style="stroke-width:0.8;opacity:0.2;stroke-dasharray:6 5"/>
<path d="M79 208.5L84 208.5" class="dk" style="stroke-width:1.2;opacity:0.8"/>
<text class="s e" x="76" y="212.5" style="font-size:10px">3,000</text>
<path d="M84 208.5L432 208.5" class="dk" style="stroke-width:0.8;opacity:0.2;stroke-dasharray:6 5"/>
<path d="M79 151.0L84 151.0" class="dk" style="stroke-width:1.2;opacity:0.8"/>
<text class="s e" x="76" y="155.0" style="font-size:10px">4,000</text>
<path d="M84 151.0L432 151.0" class="dk" style="stroke-width:0.8;opacity:0.2;stroke-dasharray:6 5"/>
<text class="s" x="32" y="137.0" style="font-size:10.5px">Feet AGL</text>
<path d="M388.5 381.0L139.5 198.2" class="acc" style="stroke-width:3"/>
<path d="M185.5 381.0L139.5 198.2" class="dk" style="stroke-width:3"/>
<path d="M185.5 365.0L388.5 365.0" class="dk" style="stroke-width:1.6"/>
<text class="t m" x="287.0" y="359.0" style="font-size:11px">spread 14 °F</text>
<text class="t" x="394.5" y="351.0" style="font-size:11px">T 85 °F</text>
<text class="t e" x="169.5" y="375.0" style="font-size:11px">DP 71 °F</text>
<text class="s" x="258.0" y="233.25" style="font-size:10.5px">Temperature falls</text>
<text class="s" x="258.0" y="246.25" style="font-size:10.5px">5.4 °F per 1,000 ft</text>
<text class="s" x="179.69999999999993" y="294.75" style="font-size:10.5px">Dew point falls</text>
<text class="s" x="179.69999999999993" y="307.75" style="font-size:10.5px">1 °F per 1,000 ft</text>
<circle cx="105.5" cy="180.2" r="15" class="cl" style="stroke:currentColor;stroke-width:1.5"/>
<circle cx="129.5" cy="168.2" r="20" class="cl" style="stroke:currentColor;stroke-width:1.5"/>
<circle cx="155.5" cy="172.2" r="18" class="cl" style="stroke:currentColor;stroke-width:1.5"/>
<circle cx="175.5" cy="182.2" r="13" class="cl" style="stroke:currentColor;stroke-width:1.5"/>
<circle cx="139.5" cy="198.2" r="5" class="ah"/>
<text class="t" x="187.50600000000006" y="214.15" style="font-size:11px">Cloud base 3,180 ft AGL</text>
<text class="s" x="32" y="415.0" style="font-size:10px">Lines drawn to the stated rates; schematic.</text>
<rect class="cl" x="470" y="91.0" width="240" height="330" rx="8"/>
<text class="t" x="482" y="113.0" style="font-size:13px">Worked example</text>
<text class="s" x="482" y="137.0" style="font-size:11px">Given</text>
<text class="t" x="482" y="153.0" style="font-size:12.5px">T = 85 °F, DP = 71 °F</text>
<text class="s" x="482" y="181.0" style="font-size:11px">Convergence rate</text>
<text class="t" x="482" y="197.0" style="font-size:12.5px">5.4 - 1 = 4.4 °F per 1,000 ft</text>
<text class="s" x="482" y="225.0" style="font-size:11px">Spread (TDS)</text>
<text class="t" x="482" y="241.0" style="font-size:12.5px">85 - 71 = 14 °F</text>
<text class="s" x="482" y="269.0" style="font-size:11px">TDS ÷ rate</text>
<text class="t" x="482" y="285.0" style="font-size:12.5px">14 ÷ 4.4 = 3.18</text>
<text class="s" x="482" y="313.0" style="font-size:11px">x 1,000 feet</text>
<text class="t" x="482" y="329.0" style="font-size:12.5px">3.18 x 1,000 = 3,180 ft AGL</text>
<rect x="482" y="351.0" width="216" height="50" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="490" y="369.0" style="font-size:12px">The height of the cloud base is</text>
<text class="t" x="490" y="384.5" style="font-size:12px">3,180 feet AGL.</text>
<rect x="20" y="435.0" width="335" height="24" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="30" y="452.0" style="font-size:13px">When the spread is small</text>
<circle cx="31" cy="473.0" r="2.2" class="ah"/>
<text class="s" x="40" y="477.0" style="font-size:11.5px">If air reaches the saturation point while</text>
<text class="s" x="40" y="492.0" style="font-size:11.5px">temperature and dew point are close together, fog,</text>
<text class="s" x="40" y="507.0" style="font-size:11.5px">low clouds and precipitation are highly likely</text>
<circle cx="31" cy="522.0" r="2.2" class="ah"/>
<text class="s" x="40" y="526.0" style="font-size:11.5px">Saturated air brings clouds, rain and other</text>
<text class="s" x="40" y="541.0" style="font-size:11.5px">critical weather situations</text>
<rect x="375" y="435.0" width="335" height="24" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="385" y="452.0" style="font-size:13px">Four ways air reaches saturation</text>
<circle cx="386" cy="473.0" r="2.2" class="ah"/>
<text class="s" x="395" y="477.0" style="font-size:11.5px">Warm air moves over a cold surface, so the air</text>
<text class="s" x="395" y="492.0" style="font-size:11.5px">temperature drops</text>
<circle cx="386" cy="507.0" r="2.2" class="ah"/>
<text class="s" x="395" y="511.0" style="font-size:11.5px">Cold air and warm air mix</text>
<circle cx="386" cy="526.0" r="2.2" class="ah"/>
<text class="s" x="395" y="530.0" style="font-size:11.5px">Air cools at night through contact with the cooler</text>
<text class="s" x="395" y="545.0" style="font-size:11.5px">ground</text>
<circle cx="386" cy="560.0" r="2.2" class="ah"/>
<text class="s" x="395" y="564.0" style="font-size:11.5px">Air is lifted or forced upward in the atmosphere</text>
<rect x="20" y="589.0" width="690" height="24" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="30" y="606.0" style="font-size:13px">Moisture and temperature</text>
<circle cx="31" cy="627.0" r="2.2" class="ah"/>
<text class="s" x="40" y="631.0" style="font-size:11.5px">The amount of moisture air can hold depends on its temperature: every 20 °F increase doubles it, and a</text>
<text class="s" x="40" y="646.0" style="font-size:11.5px">decrease of 20 °F cuts the capacity in half</text>
<circle cx="31" cy="661.0" r="2.2" class="ah"/>
<text class="s" x="40" y="665.0" style="font-size:11.5px">Dew point: the temperature at which the air can hold no more moisture</text>
</svg>
