<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 687" role="img" aria-labelledby="ti de"><title id="ti">The propeller: blade angle and twist</title><desc id="de">Blade angle is the angle between the chord of the blade and the plane of rotation. The propeller is twisted so the blade angle changes from hub to tip: the highest pitch is at the hub and the smallest at the tip. The tip travels a greater distance than the hub in the same time, so it moves faster. The twist produces uniform lift along the blade. A blade with the same angle everywhere would have a negative angle of attack near the hub and a stalled tip as airspeed increases.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><text class="t" x="20" y="28" style="font-size:15px">The propeller: blade angle and twist</text><text class="s" x="20" y="50.0" style="font-size:13px">The propeller is a rotating airfoil. It turns engine power into thrust in much the same way a wing</text><text class="s" x="20" y="66.5" style="font-size:13px">produces lift.</text><rect class="cl" x="20" y="91.0" width="335" height="322" rx="8"/><text class="t" x="32" y="113.0" style="font-size:13px">Blade angle</text><path d="M50 263.0L330 263.0" class="dk" style="stroke-width:1.6;opacity:.7;stroke-dasharray:6 5"/><text class="s e" x="330" y="281.0" style="font-size:11.5px">plane of rotation</text><path d="M60.0 263.0C59.5 235.1 153.7 201.4 245.4 188.1L60.0 263.0Z" class="sky" style="stroke:currentColor;stroke-width:1.8;stroke-linejoin:round"/><path d="M60 263.0L268.6 178.7" class="dk" style="stroke-width:1.3;opacity:.6"/><text class="s" x="208.61636727752716" y="170.7135164814198" style="font-size:11.5px">chord</text><path d="M143.4 229.3A90 90 0 0 1 150.0 263.0" class="acc" style="stroke-width:3.5"/><text class="t" x="158" y="257.0" style="font-size:12px">blade angle</text><circle cx="35" cy="303.0" r="2.2" class="ah"/><text class="s" x="44" y="307.0" style="font-size:11.5px">The angle between the chord of the blade and the</text><text class="s" x="44" y="322.0" style="font-size:11.5px">plane of rotation, measured at one point along</text><text class="s" x="44" y="337.0" style="font-size:11.5px">the blade</text><circle cx="35" cy="352.0" r="2.2" class="ah"/><text class="s" x="44" y="356.0" style="font-size:11.5px">Pitch is not blade angle, but pitch is largely</text><text class="s" x="44" y="371.0" style="font-size:11.5px">determined by it, so the terms are used</text><text class="s" x="44" y="386.0" style="font-size:11.5px">interchangeably</text><rect class="cl" x="375" y="91.0" width="335" height="322" rx="8"/><text class="t" x="387" y="113.0" style="font-size:13px">Twist from hub to tip</text><path d="M398 137.0L684.0 137.0" class="dk" style="stroke-width:1.6"/><path d="M690 137.0L684.0 139.7L684.0 134.3Z" class="dh" style=""/><text class="s m" x="544" y="131.0" style="font-size:11.5px">travels faster toward the tip</text><text class="t" x="398" y="171.0" style="font-size:12px">hub</text><text class="t e" x="690" y="171.0" style="font-size:12px">tip</text><path d="M398 179.0L690 185.0L690 199.0L398 209.0Z" class="lav" style="stroke:currentColor;stroke-width:1.6;stroke-linejoin:round"/><path d="M390 275.0L470 275.0" class="dk" style="stroke-width:1.2;opacity:.5;stroke-dasharray:4 3"/><path d="M403.2 295.9L408.1 279.4L435.5 259.3L456.8 254.1L444.1 270.3L417.3 291.3Z" class="sky" style="stroke:currentColor;stroke-width:1.5;stroke-linejoin:round"/><path d="M505 275.0L585 275.0" class="dk" style="stroke-width:1.2;opacity:.5;stroke-dasharray:4 3"/><path d="M513.9 288.8L522.7 274.0L554.1 261.1L576.1 261.2L559.8 273.9L528.8 287.7Z" class="sky" style="stroke:currentColor;stroke-width:1.5;stroke-linejoin:round"/><path d="M620 275.0L700 275.0" class="dk" style="stroke-width:1.2;opacity:.5;stroke-dasharray:4 3"/><path d="M626.4 280.3L638.7 268.3L672.4 263.9L693.6 269.7L674.6 277.7L641.0 283.1Z" class="sky" style="stroke:currentColor;stroke-width:1.5;stroke-linejoin:round"/><text class="t m" x="430" y="311.0" style="font-size:11.5px">greatest angle</text><text class="t m" x="660" y="311.0" style="font-size:11.5px">smallest angle</text><text class="s m" x="545" y="331.0" style="font-size:11.5px">Blade angle changes from hub to tip</text><circle cx="390" cy="355.0" r="2.2" class="ah"/><text class="s" x="399" y="359.0" style="font-size:11.5px">Highest pitch (angle of incidence) at the hub,</text><text class="s" x="399" y="374.0" style="font-size:11.5px">smallest at the tip</text><rect class="cl" x="20" y="427.0" width="690" height="246" rx="8"/><text class="t" x="32" y="449.0" style="font-size:13px">Why the blade is twisted</text><circle cx="130" cy="587.0" r="64" class="cl" style="stroke:currentColor;stroke-width:1.4"/><circle cx="130" cy="587.0" r="28" class="cl" style="stroke:currentColor;stroke-width:1.2;stroke-dasharray:4 3"/><path d="M130 587.0L194 587.0" class="dk" style="stroke-width:5"/><circle cx="130" cy="587.0" r="4" class="ah"/><path d="M148.0 565.6A28 28 0 0 1 157.6 591.9" class="acc" style="stroke-width:2"/><path d="M171.1 538.0A64 64 0 0 1 193.0 598.1" class="acc" style="stroke-width:2.5"/><text class="s m" x="130" y="481.0" style="font-size:11.5px">Same time, same turn:</text><text class="s m" x="130" y="495.0" style="font-size:11.5px">the tip travels the greater distance</text><circle cx="253" cy="471.0" r="2.2" class="ah"/><text class="s" x="262" y="475.0" style="font-size:11.5px">The tip of the blade travels faster than the part near the hub, because</text><text class="s" x="262" y="490.0" style="font-size:11.5px">the tip travels a greater distance in the same time</text><circle cx="253" cy="506.0" r="2.2" class="ah"/><text class="s" x="262" y="510.0" style="font-size:11.5px">Changing the angle from hub to tip to match the speed produces uniform</text><text class="s" x="262" y="525.0" style="font-size:11.5px">lift along the blade</text><circle cx="253" cy="541.0" r="2.2" class="ah"/><text class="s" x="262" y="545.0" style="font-size:11.5px">Same angle all along the blade would be inefficient: as airspeed</text><text class="s" x="262" y="560.0" style="font-size:11.5px">increases, the part near the hub would have a negative AOA while the tip</text><text class="s" x="262" y="575.0" style="font-size:11.5px">would be stalled</text><circle cx="253" cy="591.0" r="2.2" class="ah"/><text class="s" x="262" y="595.0" style="font-size:11.5px">Twisting lets the propeller operate with a relatively constant AOA along</text><text class="s" x="262" y="610.0" style="font-size:11.5px">its length in cruising flight; the most efficient AOA is small, usually</text><text class="s" x="262" y="625.0" style="font-size:11.5px">1° to 4°</text></svg>
