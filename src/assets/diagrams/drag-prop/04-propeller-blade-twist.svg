<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 687" role="img" aria-labelledby="ti de"><title id="ti">The propeller: blade angle and twist</title><desc id="de">Blade angle is the angle between the chord of the blade and the plane of rotation. The propeller is twisted so the blade angle changes from hub to tip: the highest pitch is at the hub and the smallest at the tip. The tip travels a greater distance than the hub in the same time, so it moves faster. The twist produces uniform lift along the blade. A blade with the same angle everywhere would have a negative angle of attack near the hub and a stalled tip as airspeed increases.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11.5px}.q1{font-size:13px}.q2{font-size:12px}.q3{stroke-width:1.2;opacity:.5;stroke-dasharray:4 3}.q4{stroke:currentColor;stroke-width:1.5;stroke-linejoin:round}</style><text class="t" x="20" y="28" style="font-size:15px">The propeller: blade angle and twist</text><text class="s q1" x="20" y="50">The propeller is a rotating airfoil. It turns engine power into thrust in much the same way a wing</text><text class="s q1" x="20" y="66.5">produces lift.</text><rect class="cl" x="20" y="91" width="335" height="322" rx="8"/><text class="t q1" x="32" y="113">Blade angle</text><path d="M50 263L330 263" class="dk" style="stroke-width:1.6;opacity:.7;stroke-dasharray:6 5"/><text class="s e q0" x="330" y="281">plane of rotation</text><path d="M60 263C59.5 235.1 153.7 201.4 245.4 188.1L60 263Z" class="sky" style="stroke:currentColor;stroke-width:1.8;stroke-linejoin:round"/><path d="M60 263L268.6 178.7" class="dk" style="stroke-width:1.3;opacity:.6"/><text class="s q0" x="208.62" y="170.71">chord</text><path d="M143.4 229.3A90 90 0 0 1 150 263" class="acc" style="stroke-width:3.5"/><text class="t q2" x="158" y="257">blade angle</text><circle cx="35" cy="303" r="2.2" class="ah"/><text class="s q0" x="44" y="307">The angle between the chord of the blade and the</text><text class="s q0" x="44" y="322">plane of rotation, measured at one point along</text><text class="s q0" x="44" y="337">the blade</text><circle cx="35" cy="352" r="2.2" class="ah"/><text class="s q0" x="44" y="356">Pitch is not blade angle, but pitch is largely</text><text class="s q0" x="44" y="371">determined by it, so the terms are used</text><text class="s q0" x="44" y="386">interchangeably</text><rect class="cl" x="375" y="91" width="335" height="322" rx="8"/><text class="t q1" x="387" y="113">Twist from hub to tip</text><path d="M398 137L684 137" class="dk" style="stroke-width:1.6"/><path d="M690 137L684 139.7L684 134.3Z" class="dh" style=""/><text class="s m q0" x="544" y="131">travels faster toward the tip</text><text class="t q2" x="398" y="171">hub</text><text class="t e q2" x="690" y="171">tip</text><path d="M398 179L690 185L690 199L398 209Z" class="lav" style="stroke:currentColor;stroke-width:1.6;stroke-linejoin:round"/><path d="M390 275L470 275" class="dk q3"/><path d="M403.2 295.9L408.1 279.4L435.5 259.3L456.8 254.1L444.1 270.3L417.3 291.3Z" class="sky q4"/><path d="M505 275L585 275" class="dk q3"/><path d="M513.9 288.8L522.7 274L554.1 261.1L576.1 261.2L559.8 273.9L528.8 287.7Z" class="sky q4"/><path d="M620 275L700 275" class="dk q3"/><path d="M626.4 280.3L638.7 268.3L672.4 263.9L693.6 269.7L674.6 277.7L641 283.1Z" class="sky q4"/><text class="t m q0" x="430" y="311">greatest angle</text><text class="t m q0" x="660" y="311">smallest angle</text><text class="s m q0" x="545" y="331">Blade angle changes from hub to tip</text><circle cx="390" cy="355" r="2.2" class="ah"/><text class="s q0" x="399" y="359">Highest pitch (angle of incidence) at the hub,</text><text class="s q0" x="399" y="374">smallest at the tip</text><rect class="cl" x="20" y="427" width="690" height="246" rx="8"/><text class="t q1" x="32" y="449">Why the blade is twisted</text><circle cx="130" cy="587" r="64" class="cl" style="stroke:currentColor;stroke-width:1.4"/><circle cx="130" cy="587" r="28" class="cl" style="stroke:currentColor;stroke-width:1.2;stroke-dasharray:4 3"/><path d="M130 587L194 587" class="dk" style="stroke-width:5"/><circle cx="130" cy="587" r="4" class="ah"/><path d="M148 565.6A28 28 0 0 1 157.6 591.9" class="acc" style="stroke-width:2"/><path d="M171.1 538A64 64 0 0 1 193 598.1" class="acc" style="stroke-width:2.5"/><text class="s m q0" x="130" y="481">Same time, same turn:</text><text class="s m q0" x="130" y="495">the tip travels the greater distance</text><circle cx="253" cy="471" r="2.2" class="ah"/><text class="s q0" x="262" y="475">The tip of the blade travels faster than the part near the hub, because</text><text class="s q0" x="262" y="490">the tip travels a greater distance in the same time</text><circle cx="253" cy="506" r="2.2" class="ah"/><text class="s q0" x="262" y="510">Changing the angle from hub to tip to match the speed produces uniform</text><text class="s q0" x="262" y="525">lift along the blade</text><circle cx="253" cy="541" r="2.2" class="ah"/><text class="s q0" x="262" y="545">Same angle all along the blade would be inefficient: as airspeed</text><text class="s q0" x="262" y="560">increases, the part near the hub would have a negative AOA while the tip</text><text class="s q0" x="262" y="575">would be stalled</text><circle cx="253" cy="591" r="2.2" class="ah"/><text class="s q0" x="262" y="595">Twisting lets the propeller operate with a relatively constant AOA along</text><text class="s q0" x="262" y="610">its length in cruising flight; the most efficient AOA is small, usually</text><text class="s q0" x="262" y="625">1° to 4°</text></svg>
