<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 797" role="img" aria-labelledby="ti de"><title id="ti">Types of drag: parasite and induced</title><desc id="de">Parasite drag is the drag not associated with lift and has three types. Form drag comes from the shape of the aircraft and the airflow around it, and is the easiest to reduce by streamlining. Interference drag comes from the intersection of airstreams, such as at the wing root, and is greatest where surfaces meet at perpendicular angles; fairings reduce it. Skin friction drag comes from moving air contacting the surface, through the boundary layer; flush rivets and a clean, waxed surface reduce it. Induced drag is the penalty of producing lift: wingtip vortices and downwash tilt the lift vector rearward. Induced drag increases with angle of attack and varies inversely with the square of airspeed; parasite drag increases as the square of airspeed.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style>
<text class="t" x="20" y="28" style="font-size:15px">Types of drag: parasite and induced</text>
<text class="s" x="20" y="50.0" style="font-size:13px">Drag is the force that resists movement of an aircraft through the air. Parasite drag in no way</text>
<text class="s" x="20" y="66.5" style="font-size:13px">functions to aid flight; induced drag is a result of an airfoil developing lift.</text>
<rect class="cl" x="20" y="91.0" width="690" height="28" rx="8"/>
<text class="t" x="32" y="110.0" style="font-size:13px">Parasite drag: the drag not associated with the production of lift</text>
<rect class="cl" x="20" y="129.0" width="220" height="300" rx="8"/>
<text class="t" x="32" y="151.0" style="font-size:13px">Form drag</text>
<rect class="cl" x="255" y="129.0" width="220" height="300" rx="8"/>
<text class="t" x="267" y="151.0" style="font-size:13px">Interference drag</text>
<rect class="cl" x="490" y="129.0" width="220" height="300" rx="8"/>
<text class="t" x="502" y="151.0" style="font-size:13px">Skin friction drag</text>
<rect x="125" y="179.0" width="10" height="72" rx="2" class="sky" style="stroke:currentColor;stroke-width:1.6"/>
