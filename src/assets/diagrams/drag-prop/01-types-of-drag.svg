<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 797" role="img" aria-labelledby="ti de"><title id="ti">Types of drag: parasite and induced</title><desc id="de">Parasite drag is the drag not associated with lift and has three types. Form drag comes from the shape of the aircraft and the airflow around it, and is the easiest to reduce by streamlining. Interference drag comes from the intersection of airstreams, such as at the wing root, and is greatest where surfaces meet at perpendicular angles; fairings reduce it. Skin friction drag comes from moving air contacting the surface, through the boundary layer; flush rivets and a clean, waxed surface reduce it. Induced drag is the penalty of producing lift: wingtip vortices and downwash tilt the lift vector rearward. Induced drag increases with angle of attack and varies inversely with the square of airspeed; parasite drag increases as the square of airspeed.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11.5px}.q1{stroke-width:1.6}.q2{stroke-width:1.6;opacity:0.85}.q3{font-size:13px}.q4{stroke-width:2.5}.q5{font-size:11px}.q6{fill:var(--palette-berry,#A84C6B)}.q7{stroke-width:2.2}.q8{stroke:currentColor;stroke-width:1.6}.q9{stroke-width:1.5;opacity:.6}</style><text class="t" x="20" y="28" style="font-size:15px">Types of drag: parasite and induced</text><text class="s q3" x="20" y="50">Drag is the force that resists movement of an aircraft through the air. Parasite drag in no way</text><text class="s q3" x="20" y="66.5">functions to aid flight; induced drag is a result of an airfoil developing lift.</text><rect class="cl" x="20" y="91" width="690" height="28" rx="8"/><text class="t q3" x="32" y="110">Parasite drag: the drag not associated with the production of lift</text><rect class="cl" x="20" y="129" width="220" height="300" rx="8"/><text class="t q3" x="32" y="151">Form drag</text><rect class="cl" x="255" y="129" width="220" height="300" rx="8"/><text class="t q3" x="267" y="151">Interference drag</text><rect class="cl" x="490" y="129" width="220" height="300" rx="8"/><text class="t q3" x="502" y="151">Skin friction drag</text><rect x="125" y="179" width="10" height="72" rx="2" class="sky q8"/><path d="M40 203L112 203" class="dk q1"/><path d="M118 203L112 205.7L112 200.3Z" class="dh" style=""/><path d="M40 223L112 223" class="dk q1"/><path d="M118 223L112 225.7L112 220.3Z" class="dh" style=""/><path d="M40 243L112 243" class="dk q1"/><path d="M118 243L112 245.7L112 240.3Z" class="dh" style=""/><path d="M40 183C80 167,170 167,210 183" class="dk q9"/><path d="M40 255C80 271,170 271,210 255" class="dk q9"/><path d="M144 187c7.2 -9.6 17.6 -3.2 11.2 6.4s-12.8 4 -6.4 -4.8" class="acc q2"/><path d="M144 213c7.2 -9.6 17.6 -3.2 11.2 6.4s-12.8 4 -6.4 -4.8" class="acc q2"/><path d="M144 237c7.2 -9.6 17.6 -3.2 11.2 6.4s-12.8 4 -6.4 -4.8" class="acc q2"/><path d="M172 201c7.2 -9.6 17.6 -3.2 11.2 6.4s-12.8 4 -6.4 -4.8" class="acc q2"/><path d="M172 227c7.2 -9.6 17.6 -3.2 11.2 6.4s-12.8 4 -6.4 -4.8" class="acc q2"/><text class="s m q0" x="134" y="289">Air swirls past the edges, then rejoins</text><circle cx="35" cy="311" r="2.2" class="ah"/><text class="s q0" x="44" y="315">Drag from the shape of the</text><text class="s q0" x="44" y="330">aircraft and the airflow</text><text class="s q0" x="44" y="345">around it, such as cowlings</text><text class="s q0" x="44" y="360">and antennas</text><circle cx="35" cy="375" r="2.2" class="ah"/><text class="s q0" x="44" y="379">The easiest to reduce:</text><text class="s q0" x="44" y="394">streamline as many parts as</text><text class="s q0" x="44" y="409">possible</text><rect x="275" y="171" width="64" height="104" rx="6" class="sky q8"/><path d="M339 207L460 207L460 237L339 237Z" class="lav" style="stroke:currentColor;stroke-width:1.6;stroke-linejoin:round"/><text class="t m q5" x="307" y="227">fuselage</text><text class="t m q5" x="405" y="227">wing</text><path d="M343 195c7.2 -9.6 17.6 -3.2 11.2 6.4s-12.8 4 -6.4 -4.8" class="acc q2"/><path d="M343 253c7.2 -9.6 17.6 -3.2 11.2 6.4s-12.8 4 -6.4 -4.8" class="acc q2"/><path d="M367 189c7.2 -9.6 17.6 -3.2 11.2 6.4s-12.8 4 -6.4 -4.8" class="acc q2"/><text class="s m q0" x="365" y="289">Airstreams meet at the wing root</text><circle cx="270" cy="311" r="2.2" class="ah"/><text class="s q0" x="279" y="315">Comes from the intersection of</text><text class="s q0" x="279" y="330">airstreams that creates eddy</text><text class="s q0" x="279" y="345">currents and turbulence</text><circle cx="270" cy="360" r="2.2" class="ah"/><text class="s q0" x="279" y="364">Greatest where two surfaces</text><text class="s q0" x="279" y="379">meet at perpendicular angles</text><circle cx="270" cy="394" r="2.2" class="ah"/><text class="s q0" x="279" y="398">Fairings and spacing reduce it</text><path d="M514 263L686 263" class="dk q4"/><circle cx="530" cy="259" r="2.4" class="ah"/><path d="M530 249L538 249" class="dk q1"/><path d="M544 249L538 251.7L538 246.3Z" class="dh" style=""/><path d="M530 235L552 235" class="dk q1"/><path d="M558 235L552 237.7L552 232.3Z" class="dh" style=""/><path d="M530 221L568 221" class="dk q1"/><path d="M574 221L568 223.7L568 218.3Z" class="dh" style=""/><path d="M530 207L588 207" class="dk q1"/><path d="M594 207L588 209.7L588 204.3Z" class="dh" style=""/><path d="M530 193L614 193" class="dk q1"/><path d="M620 193L614 195.7L614 190.3Z" class="dh" style=""/><path d="M530 193L666 193" class="dk" style="stroke-width:1.2;opacity:.5;stroke-dasharray:5 4"/><text class="s m q0" x="600" y="185">free-stream velocity</text><path d="M524 263L524 193" class="dk" style="stroke-width:1.2;opacity:.7"/><text class="s m q5" x="670" y="239">boundary</text><text class="s m q5" x="670" y="252">layer</text><text class="s m q0" x="600" y="289">Virtually motionless at the surface</text><circle cx="505" cy="311" r="2.2" class="ah"/><text class="s q0" x="514" y="315">Resistance from moving air</text><text class="s q0" x="514" y="330">touching the aircraft surface,</text><text class="s q0" x="514" y="345">however smooth it looks</text><circle cx="505" cy="360" r="2.2" class="ah"/><text class="s q0" x="514" y="364">Depends on the wing shape, air</text><text class="s q0" x="514" y="379">viscosity and compressibility</text><circle cx="505" cy="394" r="2.2" class="ah"/><text class="s q0" x="514" y="398">Reduced by flush rivets and a</text><text class="s q0" x="514" y="413">clean, waxed, glossy surface</text><rect class="cl" x="20" y="443" width="690" height="336" rx="8"/><text class="t q3" x="32" y="465">Induced drag: the penalty paid for lift, always present when lift is produced</text><text class="s q0" x="32" y="489">Seen from the tail</text><path d="M80 583L300 583" class="dk" style="stroke-width:7;opacity:.9"/><path d="M90 531.7A20 20 0 1 1 62.7 559" class="acc q4"/><path d="M62.7 559L70.7 564.8L63.7 568.8Z" class="dh q6"/><path d="M290 531.7A20 20 0 1 0 317.3 559" class="acc q4"/><path d="M317.3 559L316.3 568.8L309.3 564.8Z" class="dh q6"/><path d="M150 597L150 622" class="dk q7"/><path d="M150 629L146.8 622L153.2 622Z" class="dh" style=""/><path d="M190 597L190 622" class="dk q7"/><path d="M190 629L186.8 622L193.2 622Z" class="dh" style=""/><path d="M230 597L230 622" class="dk q7"/><path d="M230 629L226.8 622L233.2 622Z" class="dh" style=""/><text class="s m q0" x="190" y="649">downwash behind the wing</text><text class="s m q0" x="80" y="517">vortex</text><text class="s m q0" x="300" y="517">vortex</text><text class="s m q0" x="540" y="489">Downwash tilts the lift vector back</text><path d="M458.01 587.79L551.7 625.6" class="dk q4"/><path d="M560 629L550.1 629.4L553.2 621.9Z" class="dh" style=""/><text class="s q0" x="385" y="567">relative wind</text><path d="M560 629L590.3 553.9" class="acc" style="stroke-width:3"/><path d="M593.71 545.55L594.1 555.4L586.6 552.4Z" class="dh q6"/><text class="t" x="594" y="595.28" style="font-size:12px">lift</text><path d="M560 629L560 545.55L593.7 545.6" class="dk" style="stroke-width:1.2;opacity:.5;stroke-dasharray:4 3"/><path d="M560 545.55L593.7 545.6" class="acc q4"/><text class="t q0" x="500" y="521.55">rearward component</text><text class="t q0" x="500" y="535.55">= induced drag</text><path d="M570 659L486 659" class="dk q1"/><path d="M480 659L486 656.3L486 661.7Z" class="dh" style=""/><text class="s q0" x="578" y="663">flight direction</text><circle cx="35" cy="677" r="2.2" class="ah"/><text class="s q0" x="44" y="681">Lower pressure above the wing and higher pressure below make air flow outward around the tips, creating</text><text class="s q0" x="44" y="696">trailing vortices and an induced downwash</text><circle cx="35" cy="711" r="2.2" class="ah"/><text class="s q0" x="44" y="715">As AOA increases, induced drag increases proportionally; the lower the airspeed, the greater the AOA needed</text><text class="s q0" x="44" y="730">for lift equal to weight</text><circle cx="35" cy="745" r="2.2" class="ah"/><text class="s q0" x="44" y="749">Induced drag varies inversely with the square of the airspeed; parasite drag increases as the square of the</text><text class="s q0" x="44" y="764">airspeed</text></svg>
