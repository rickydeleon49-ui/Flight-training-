<path d="M172 227.0c7.2 -9.600000000000001 17.6 -3.2 11.200000000000001 6.4s-12.8 4.0 -6.4 -4.800000000000001" class="acc" style="stroke-width:1.6;opacity:0.85"/>
<text class="s m" x="134" y="289.0" style="font-size:11.5px">Air swirls past the edges, then rejoins</text>
<circle cx="35" cy="311.0" r="2.2" class="ah"/>
<text class="s" x="44" y="315.0" style="font-size:11.5px">Drag from the shape of the</text>
<text class="s" x="44" y="330.0" style="font-size:11.5px">aircraft and the airflow</text>
<text class="s" x="44" y="345.0" style="font-size:11.5px">around it, such as cowlings</text>
<text class="s" x="44" y="360.0" style="font-size:11.5px">and antennas</text>
<circle cx="35" cy="375.0" r="2.2" class="ah"/>
<text class="s" x="44" y="379.0" style="font-size:11.5px">The easiest to reduce:</text>
<text class="s" x="44" y="394.0" style="font-size:11.5px">streamline as many parts as</text>
<text class="s" x="44" y="409.0" style="font-size:11.5px">possible</text>
<rect x="275" y="171.0" width="64" height="104" rx="6" class="sky" style="stroke:currentColor;stroke-width:1.6"/>
<path d="M339 207.0L460 207.0L460 237.0L339 237.0Z" class="lav" style="stroke:currentColor;stroke-width:1.6;stroke-linejoin:round"/>
<text class="t m" x="307" y="227.0" style="font-size:11px">fuselage</text>
<text class="t m" x="405" y="227.0" style="font-size:11px">wing</text>
<path d="M343 195.0c7.2 -9.600000000000001 17.6 -3.2 11.200000000000001 6.4s-12.8 4.0 -6.4 -4.800000000000001" class="acc" style="stroke-width:1.6;opacity:0.85"/>
<path d="M343 253.0c7.2 -9.600000000000001 17.6 -3.2 11.200000000000001 6.4s-12.8 4.0 -6.4 -4.800000000000001" class="acc" style="stroke-width:1.6;opacity:0.85"/>
<path d="M367 189.0c7.2 -9.600000000000001 17.6 -3.2 11.200000000000001 6.4s-12.8 4.0 -6.4 -4.800000000000001" class="acc" style="stroke-width:1.6;opacity:0.85"/>
<text class="s m" x="365" y="289.0" style="font-size:11.5px">Airstreams meet at the wing root</text>
<circle cx="270" cy="311.0" r="2.2" class="ah"/>
<text class="s" x="279" y="315.0" style="font-size:11.5px">Comes from the intersection of</text>
<text class="s" x="279" y="330.0" style="font-size:11.5px">airstreams that creates eddy</text>
<text class="s" x="279" y="345.0" style="font-size:11.5px">currents and turbulence</text>
<circle cx="270" cy="360.0" r="2.2" class="ah"/>
<text class="s" x="279" y="364.0" style="font-size:11.5px">Greatest where two surfaces</text>
<text class="s" x="279" y="379.0" style="font-size:11.5px">meet at perpendicular angles</text>
<circle cx="270" cy="394.0" r="2.2" class="ah"/>
<text class="s" x="279" y="398.0" style="font-size:11.5px">Fairings and spacing reduce it</text>
<path d="M514 263.0L686 263.0" class="dk" style="stroke-width:2.5"/>
<circle cx="530" cy="259.0" r="2.4" class="ah"/>
<path d="M530 249.0L538.0 249.0" class="dk" style="stroke-width:1.6"/><path d="M544 249.0L538.0 251.7L538.0 246.3Z" class="dh" style=""/>
<path d="M530 235.0L552.0 235.0" class="dk" style="stroke-width:1.6"/><path d="M558 235.0L552.0 237.7L552.0 232.3Z" class="dh" style=""/>
<path d="M530 221.0L568.0 221.0" class="dk" style="stroke-width:1.6"/><path d="M574 221.0L568.0 223.7L568.0 218.3Z" class="dh" style=""/>
<path d="M530 207.0L588.0 207.0" class="dk" style="stroke-width:1.6"/><path d="M594 207.0L588.0 209.7L588.0 204.3Z" class="dh" style=""/>
<path d="M530 193.0L614.0 193.0" class="dk" style="stroke-width:1.6"/><path d="M620 193.0L614.0 195.7L614.0 190.3Z" class="dh" style=""/>
<path d="M530 193.0L666 193.0" class="dk" style="stroke-width:1.2;opacity:.5;stroke-dasharray:5 4"/>
<text class="s m" x="600" y="185.0" style="font-size:11.5px">free-stream velocity</text>
<path d="M524 263.0L524 193.0" class="dk" style="stroke-width:1.2;opacity:.7"/>
<text class="s m" x="670" y="239.0" style="font-size:11px">boundary</text>
<text class="s m" x="670" y="252.0" style="font-size:11px">layer</text>
<text class="s m" x="600" y="289.0" style="font-size:11.5px">Virtually motionless at the surface</text>
<circle cx="505" cy="311.0" r="2.2" class="ah"/>
<text class="s" x="514" y="315.0" style="font-size:11.5px">Resistance from moving air</text>
<text class="s" x="514" y="330.0" style="font-size:11.5px">touching the aircraft surface,</text>
<text class="s" x="514" y="345.0" style="font-size:11.5px">however smooth it looks</text>
<circle cx="505" cy="360.0" r="2.2" class="ah"/>
<text class="s" x="514" y="364.0" style="font-size:11.5px">Depends on the wing shape, air</text>
<text class="s" x="514" y="379.0" style="font-size:11.5px">viscosity and compressibility</text>
<circle cx="505" cy="394.0" r="2.2" class="ah"/>
<text class="s" x="514" y="398.0" style="font-size:11.5px">Reduced by flush rivets and a</text>
<text class="s" x="514" y="413.0" style="font-size:11.5px">clean, waxed, glossy surface</text>
<rect class="cl" x="20" y="443.0" width="690" height="336" rx="8"/>
<text class="t" x="32" y="465.0" style="font-size:13px">Induced drag: the penalty paid for lift, always present when lift is produced</text>
<text class="s" x="32" y="489.0" style="font-size:11.5px">Seen from the tail</text>
<path d="M80 583.0L300 583.0" class="dk" style="stroke-width:7;opacity:.9"/>
<path d="M90.0 531.7A20 20 0 1 1 62.7 559.0" class="acc" style="stroke-width:2.5"/><path d="M62.7 559.0L70.7 564.8L63.7 568.8Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/>
<path d="M290.0 531.7A20 20 0 1 0 317.3 559.0" class="acc" style="stroke-width:2.5"/><path d="M317.3 559.0L316.3 568.8L309.3 564.8Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/>
<path d="M150 597.0L150.0 622.0" class="dk" style="stroke-width:2.2"/><path d="M150 629.0L146.8 622.0L153.2 622.0Z" class="dh" style=""/>
<path d="M190 597.0L190.0 622.0" class="dk" style="stroke-width:2.2"/><path d="M190 629.0L186.8 622.0L193.2 622.0Z" class="dh" style=""/>
<path d="M230 597.0L230.0 622.0" class="dk" style="stroke-width:2.2"/><path d="M230 629.0L226.8 622.0L233.2 622.0Z" class="dh" style=""/>
<text class="s m" x="190" y="649.0" style="font-size:11.5px">downwash behind the wing</text>
<text class="s m" x="80" y="517.0" style="font-size:11.5px">vortex</text>
<text class="s m" x="300" y="517.0" style="font-size:11.5px">vortex</text>

<text class="s m" x="540" y="489.0" style="font-size:11.5px">Downwash tilts the lift vector back</text>
<path d="M458.0097759976534 587.7932747242497L551.7 625.6" class="dk" style="stroke-width:2.5"/><path d="M560 629.0L550.1 629.4L553.2 621.9Z" class="dh" style=""/>
<text class="s" x="385" y="567.0" style="font-size:11.5px">relative wind</text>
<path d="M560 629.0L590.3 553.9" class="acc" style="stroke-width:3"/><path d="M593.7145934074321 545.5534530889892L594.1 555.4L586.6 552.4Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/>
<text class="t" x="594" y="595.2767265444945" style="font-size:12px">lift</text>
<path d="M560 629.0L560 545.5534530889892L593.7 545.6" class="dk" style="stroke-width:1.2;opacity:.5;stroke-dasharray:4 3"/>
<path d="M560 545.5534530889892L593.7 545.6" class="acc" style="stroke-width:2.5"/>

<text class="t" x="500" y="521.5534530889892" style="font-size:11.5px">rearward component</text><text class="t" x="500" y="535.5534530889892" style="font-size:11.5px">= induced drag</text>
<path d="M570 659.0L486.0 659.0" class="dk" style="stroke-width:1.6"/><path d="M480 659.0L486.0 656.3L486.0 661.7Z" class="dh" style=""/>
<text class="s" x="578" y="663.0" style="font-size:11.5px">flight direction</text>
<circle cx="35" cy="677.0" r="2.2" class="ah"/>
<text class="s" x="44" y="681.0" style="font-size:11.5px">Lower pressure above the wing and higher pressure below make air flow outward around the tips, creating</text>
<text class="s" x="44" y="696.0" style="font-size:11.5px">trailing vortices and an induced downwash</text>
<circle cx="35" cy="711.0" r="2.2" class="ah"/>
<text class="s" x="44" y="715.0" style="font-size:11.5px">As AOA increases, induced drag increases proportionally; the lower the airspeed, the greater the AOA needed</text>
<text class="s" x="44" y="730.0" style="font-size:11.5px">for lift equal to weight</text>
<circle cx="35" cy="745.0" r="2.2" class="ah"/>
<text class="s" x="44" y="749.0" style="font-size:11.5px">Induced drag varies inversely with the square of the airspeed; parasite drag increases as the square of the</text>
<text class="s" x="44" y="764.0" style="font-size:11.5px">airspeed</text>
</svg>
