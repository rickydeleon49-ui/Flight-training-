<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 653" role="img" aria-labelledby="ti de"><title id="ti">L/DMAX: best range and best glide speed</title><desc id="de">The L over D ratio is lift divided by drag. It reaches a maximum at one specific angle of attack and lift coefficient, where total drag in steady flight is at a minimum; any lower or higher angle reduces L over D and increases total drag. Weight and altitude do not change that angle or lift coefficient, but a change in weight alters the airspeed and power required to reach it. For headwind or tailwind there is no rule of thumb for maximum range. The best glide speed is published in the pilot operating handbook; in one PHAK case the published 110 knots did not reach the airport, and a lower speed would have given more thrust.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style>
<text class="t" x="20" y="28" style="font-size:15px">L/DMAX: best range and best glide speed</text>
<text class="s" x="20" y="50.0" style="font-size:13px">The L/D ratio is lift divided by drag (CL divided by CD). The most lift for the least drag is obtained</text>
<text class="s" x="20" y="66.5" style="font-size:13px">at L/DMAX.</text>
<rect class="cl" x="20" y="91.0" width="335" height="330" rx="8"/>
<text class="t" x="32" y="113.0" style="font-size:13px">L/DMAX is one angle of attack</text>
<path d="M56.0 141.0L56.0 281.0L330.0 281.0" class="dk" style="stroke-width:2;opacity:0.8"/>
<path d="M56.0 281.0L62.4 256.0L68.7 235.0L75.0 217.5L81.4 203.1L87.8 191.4L94.1 182.1L100.4 174.8L106.8 169.4L113.2 165.4L119.5 162.9L125.9 161.4L132.2 161.0L138.6 161.4L144.9 162.5L151.2 164.2L157.6 166.4L163.9 168.9L170.3 171.8L176.6 175.0L183.0 178.3L189.3 181.8L195.7 185.4L202.0 189.0L208.4 192.7L214.8 196.4L221.1 200.0L227.5 203.6L233.8 207.2L240.2 210.7L246.5 214.1L252.8 217.4L259.2 220.6L265.5 223.7L271.9 226.6L278.2 229.5L284.6 232.3L291.0 234.9L297.3 237.5L303.6 239.9L310.0 242.2" class="acc" style="stroke-width:3.5;opacity:1"/>
<path d="M132.2 161.0L132.2 281.0" class="dk" style="stroke-width:1.4;opacity:.6;stroke-dasharray:4 4"/>
<circle cx="132.2" cy="161.0" r="6" class="ah"/>
<text class="t" x="144.2" y="157.0" style="font-size:12px">L/DMAX</text>
<text class="t e" x="50" y="137.0" style="font-size:12px">L/D</text>
<text class="t e" x="330" y="301.0" style="font-size:12px">Angle of attack (AOA)</text>
<text class="s" x="32" y="317.0" style="font-size:11.5px">Schematic of the L/D curve for a wing section</text>
<circle cx="35" cy="339.0" r="2.2" class="ah"/>
<text class="s" x="44" y="343.0" style="font-size:11.5px">Steady flight at L/DMAX gives minimum total drag</text>
<circle cx="35" cy="358.0" r="2.2" class="ah"/>
<text class="s" x="44" y="362.0" style="font-size:11.5px">Any AOA lower or higher reduces L/D and increases</text>
<text class="s" x="44" y="377.0" style="font-size:11.5px">total drag</text>
<circle cx="35" cy="392.0" r="2.2" class="ah"/>
<text class="s" x="44" y="396.0" style="font-size:11.5px">For the PHAK example wing section, L/D reaches</text>
<text class="s" x="44" y="411.0" style="font-size:11.5px">its maximum at 6° AOA</text>
<rect class="cl" x="375" y="91.0" width="335" height="330" rx="8"/>
<text class="t" x="387" y="113.0" style="font-size:13px">What changes it, as PHAK states</text>
<rect x="387" y="129.0" width="311" height="24" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="397" y="146.0" style="font-size:13px">Weight</text>
<circle cx="398" cy="167.0" r="2.2" class="ah"/>
<text class="s" x="407" y="171.0" style="font-size:11.5px">L/DMAX occurs at a particular AOA and lift</text>
<text class="s" x="407" y="186.0" style="font-size:11.5px">coefficient, unaffected by weight or altitude</text>
<circle cx="398" cy="201.0" r="2.2" class="ah"/>
<text class="s" x="407" y="205.0" style="font-size:11.5px">A variation in weight alters the airspeed and</text>
<text class="s" x="407" y="220.0" style="font-size:11.5px">power required to obtain L/DMAX</text>
<rect x="387" y="249.0" width="311" height="24" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="397" y="266.0" style="font-size:13px">Headwind or tailwind</text>
<circle cx="398" cy="287.0" r="2.2" class="ah"/>
<text class="s" x="407" y="291.0" style="font-size:11.5px">Many say speed up in a headwind or slow down in</text>
<text class="s" x="407" y="306.0" style="font-size:11.5px">a tailwind for max range; it is not always true</text>
<circle cx="398" cy="321.0" r="2.2" class="ah"/>
<text class="s" x="407" y="325.0" style="font-size:11.5px">Each aircraft configuration is different, and</text>
<text class="s" x="407" y="340.0" style="font-size:11.5px">no rule of thumb covers all of them</text>
<rect class="cl" x="20" y="435.0" width="690" height="204" rx="8"/>
<text class="t" x="32" y="457.0" style="font-size:13px">Best glide speed</text>
<path d="M40 595.0L330 595.0" class="dk" style="stroke-width:2.5"/>
<path d="M83.6 537.3L58.4 534.1L64.9 520.1Z" class="ah"/>
<path d="M80 535.0L300 593.0" class="dk" style="stroke-width:1.6;opacity:.8;stroke-dasharray:6 5"/>
<path d="M80 615.0L294.0 615.0" class="dk" style="stroke-width:1.6"/><path d="M300 615.0L294.0 617.7L294.0 612.3Z" class="dh" style=""/>
<text class="s m" x="190" y="633.0" style="font-size:11.5px">distance covered</text>
<text class="t" x="32" y="483.0" style="font-size:11.5px">The best glide speed is published in the POH</text>
<circle cx="378" cy="473.0" r="2.2" class="ah"/>
<text class="s" x="387" y="477.0" style="font-size:11.5px">One PHAK case: a pilot with a failed propeller pitch</text>
<text class="s" x="387" y="492.0" style="font-size:11.5px">mechanism flew the published best glide speed, 110</text>
<text class="s" x="387" y="507.0" style="font-size:11.5px">knots, and could not reach the airport</text>
<circle cx="378" cy="522.0" r="2.2" class="ah"/>
<text class="s" x="387" y="526.0" style="font-size:11.5px">The bulletin found that a speed below best glide</text>
<text class="s" x="387" y="541.0" style="font-size:11.5px">would have given more thrust to hold level flight</text>
<circle cx="378" cy="556.0" r="2.2" class="ah"/>
<text class="s" x="387" y="560.0" style="font-size:11.5px">With variable pitch propellers, the speed to</text>
<text class="s" x="387" y="575.0" style="font-size:11.5px">maintain level flight may differ from the engine-out</text>
<text class="s" x="387" y="590.0" style="font-size:11.5px">best glide speed</text>
</svg>
