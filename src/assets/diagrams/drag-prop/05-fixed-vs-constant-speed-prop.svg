<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 1067" role="img" aria-labelledby="ti de"><title id="ti">Fixed-pitch and constant-speed propellers</title><desc id="de">A fixed-pitch propeller has blade angles that cannot change. A climb propeller has lower pitch, less drag and higher rpm, which helps takeoff and climb; a cruise propeller has higher pitch, more drag and lower rpm, which helps cruise. A constant-speed propeller has two controls: the throttle sets power output, shown on the manifold pressure gauge, and the propeller control sets rpm, shown on the tachometer. A governor adjusts blade angle to hold the selected rpm. Takeoff uses a low blade angle and high rpm; after liftoff and in cruise the blade angle increases and rpm decreases. When decreasing power, reduce manifold pressure before rpm; when increasing power, increase rpm first, then manifold pressure.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11.5px}.q1{font-size:13px}.q2{stroke:currentColor;stroke-width:1.5}.q3{stroke-width:1.2;opacity:.5;stroke-dasharray:4 3}.q4{stroke:currentColor;stroke-width:1.5;stroke-linejoin:round}.q5{font-size:12.5px}.q6{stroke:currentColor;stroke-width:1.6}.q7{fill:none;stroke:var(--palette-mint,#6FB39A);stroke-width:5}</style><text class="t" x="20" y="28" style="font-size:15px">Fixed-pitch and constant-speed propellers</text><text class="s q1" x="20" y="50">Small aircraft are equipped with either a fixed-pitch or an adjustable-pitch propeller. The</text><text class="s q1" x="20" y="66.5">constant-speed propeller is the most common type of adjustable-pitch propeller.</text><rect class="cl" x="20" y="91" width="335" height="492" rx="8"/><text class="t q1" x="32" y="113">Fixed-pitch: blade angles never change</text><text class="s q0" x="32" y="135">The pitch is set by the manufacturer and cannot be</text><text class="s q0" x="32" y="150">changed. It achieves best efficiency only at one</text><text class="s q0" x="32" y="165">combination of airspeed and rpm, so it is ideal for</text><text class="s q0" x="32" y="180">neither cruise nor climb. It is used when low</text><text class="s q0" x="32" y="195">weight, simplicity and low cost are needed.</text><rect x="32" y="220" width="311" height="24" rx="10" class="sky q2"/><text class="t q1" x="42" y="237">Climb propeller</text><path d="M42 298L118 298" class="dk q3"/><path d="M48.7 304.7L54.7 294.2L94 286.8L111.3 291.3L96.5 298.6L57.4 306.9Z" class="sky q4"/><circle cx="141" cy="262" r="2.2" class="ah"/><text class="s q0" x="150" y="266">Lower pitch, so less drag</text><circle cx="141" cy="280" r="2.2" class="ah"/><text class="s q0" x="150" y="284">Higher rpm and more horsepower</text><text class="s q0" x="150" y="299">capability</text><circle cx="141" cy="313" r="2.2" class="ah"/><text class="s q0" x="150" y="317">Better takeoffs and climbs,</text><text class="s q0" x="150" y="332">worse cruise</text><rect x="32" y="360" width="311" height="24" rx="10" class="lav q2"/><text class="t q1" x="42" y="377">Cruise propeller</text><path d="M42 438L118 438" class="dk q3"/><path d="M52.3 454L54.7 442.2L89.9 423.1L107.7 422L95.9 433.5L61.2 453.5Z" class="sky q4"/><circle cx="141" cy="402" r="2.2" class="ah"/><text class="s q0" x="150" y="406">Higher pitch, so more drag</text><circle cx="141" cy="420" r="2.2" class="ah"/><text class="s q0" x="150" y="424">Lower rpm and less horsepower</text><text class="s q0" x="150" y="439">capability</text><circle cx="141" cy="453" r="2.2" class="ah"/><text class="s q0" x="150" y="457">Better cruise efficiency, worse</text><text class="s q0" x="150" y="472">takeoffs and climbs</text><text class="t q0" x="32" y="510">Tachometer: the power indicator for fixed pitch</text><text class="s q0" x="32" y="528">Rpm is regulated by the throttle. At a given</text><text class="s q0" x="32" y="543">altitude, the higher the tachometer reading, the</text><text class="s q0" x="32" y="558">higher the engine power output.</text><rect class="cl" x="375" y="91" width="335" height="492" rx="8"/><text class="t q1" x="387" y="113">Constant-speed: two controls</text><text class="s q0" x="387" y="135">A governor automatically varies the blade angle in</text><text class="s q0" x="387" y="150">flight to maintain constant rpm despite varying air</text><text class="s q0" x="387" y="165">loads.</text><rect x="387" y="196" width="120" height="34" rx="10" class="rose q2"/><text class="t m q1" x="447" y="218">Throttle</text><path d="M509 213L525 213" class="dk" style="stroke-width:1.6"/><path d="M531 213L525 215.7L525 210.3Z" class="dh" style=""/><circle cx="580" cy="226" r="34" class="cl q6"/><path d="M554.6 216.8A27 27 0 0 1 603.4 212.5" class="q7"/><path d="M599.9 216.7L610.8 211.6" class="acc" style="stroke-width:3"/><path d="M580 226L592 205.2" class="dk" style="stroke-width:2.5"/><circle cx="580" cy="226" r="3.5" class="dh"/><text class="t m q0" x="580" y="280">Manifold pressure</text><text class="s m q0" x="580" y="294">gauge: power output</text><rect x="387" y="324" width="120" height="34" rx="10" class="lav q2"/><text class="t m" x="447" y="346" style="font-size:12px">Propeller control</text><path d="M509 341L525 341" class="dk" style="stroke-width:1.6"/><path d="M531 341L525 343.7L525 338.3Z" class="dh" style=""/><circle cx="580" cy="354" r="34" class="cl q6"/><path d="M554.6 344.8A27 27 0 0 1 603.4 340.5" class="q7"/><path d="M580 354L580 330" class="dk" style="stroke-width:2.5"/><circle cx="580" cy="354" r="3.5" class="dh"/><text class="t m q0" x="580" y="408">Tachometer: rpm</text><text class="s m q0" x="580" y="422">(propeller rpm)</text><circle cx="390" cy="444" r="2.2" class="ah"/><text class="s q0" x="399" y="448">Once an rpm is selected, the governor adjusts the</text><text class="s q0" x="399" y="463">blade angle to hold it</text><circle cx="390" cy="478" r="2.2" class="ah"/><text class="s q0" x="399" y="482">Within the constant-speed range (between the low</text><text class="s q0" x="399" y="497">and high pitch stops) rpm stays constant; against</text><text class="s q0" x="399" y="512">a stop, rpm changes with airspeed and load, as</text><text class="s q0" x="399" y="527">with a fixed pitch</text><rect class="cl" x="20" y="597" width="690" height="246" rx="8"/><text class="t q1" x="32" y="619">Constant-speed propeller through the flight</text><text class="t q5" x="32" y="647">Takeoff</text><path d="M46 687L128 687" class="dk q3"/><path d="M52.5 693.1L58.8 682.8L102.8 676.1L121.5 680.9L104.9 687.9L61.1 695.6Z" class="sky q4"/><text class="s q0" x="32" y="721">Low blade angle: the AOA stays</text><text class="s q0" x="32" y="736">small and efficient. The propeller</text><text class="s q0" x="32" y="751">handles a smaller mass of air per</text><text class="s q0" x="32" y="766">revolution, so the engine turns at</text><text class="s q0" x="32" y="781">high rpm for maximum thrust.</text><text class="t q5" x="258" y="647">After liftoff and climb</text><path d="M272 687L354 687" class="dk q3"/><path d="M280.5 700.1L284.6 688.8L326.2 673L345.5 673.9L330.7 684.2L289.5 700.8Z" class="sky q4"/><text class="s q0" x="258" y="721">As speed increases, the blade angle</text><text class="s q0" x="258" y="736">goes higher automatically; the AOA</text><text class="s q0" x="258" y="751">stays small. More air per</text><text class="s q0" x="258" y="766">revolution means lower rpm, less</text><text class="s q0" x="258" y="781">fuel use and wear. At climb power:</text><text class="s q0" x="258" y="796">reduce manifold pressure first,</text><text class="s q0" x="258" y="811">then increase blade angle to lower</text><text class="s q0" x="258" y="826">the rpm.</text><text class="t q5" x="484" y="647">Cruise</text><path d="M498 687L580 687" class="dk q3"/><path d="M510 706.6L511.6 694.6L549 670.6L568 667.4L555.7 680.5L518.9 705.4Z" class="sky q4"/><text class="s q0" x="484" y="721">Less power is needed, so again</text><text class="s q0" x="484" y="736">reduce manifold pressure, then</text><text class="s q0" x="484" y="751">increase blade angle to decrease</text><text class="s q0" x="484" y="766">the rpm. The AOA is still small</text><text class="s q0" x="484" y="781">because the blade angle has</text><text class="s q0" x="484" y="796">increased with airspeed.</text><rect class="cl" x="20" y="857" width="690" height="196" rx="8"/><text class="t q1" x="32" y="879">Changing both manifold pressure and rpm: the order matters</text><rect x="32" y="893" width="335" height="24" rx="10" class="sky q2"/><text class="t q1" x="42" y="910">Decreasing power</text><text class="s q0" x="40" y="937">Reduce manifold pressure before reducing rpm. If rpm</text><text class="s q0" x="40" y="952">is reduced first, manifold pressure automatically</text><text class="s q0" x="40" y="967">increases, possibly exceeding the manufacturer</text><text class="s q0" x="40" y="982">tolerances.</text><rect x="375" y="893" width="323" height="24" rx="10" class="mint q2"/><text class="t q1" x="385" y="910">Increasing power</text><text class="s q0" x="383" y="937">Reverse the order: increase rpm first, then</text><text class="s q0" x="383" y="952">manifold pressure.</text><text class="s q0" x="32" y="1009">For any given rpm there is a manifold pressure that should not be exceeded; excessive manifold pressure</text><text class="s q0" x="32" y="1024">stresses the cylinders and can eventually cause engine failure.</text></svg>
