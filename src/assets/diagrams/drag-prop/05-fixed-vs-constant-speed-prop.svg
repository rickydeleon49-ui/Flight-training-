<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 1067" role="img" aria-labelledby="ti de"><title id="ti">Fixed-pitch and constant-speed propellers</title><desc id="de">A fixed-pitch propeller has blade angles that cannot change. A climb propeller has lower pitch, less drag and higher rpm, which helps takeoff and climb; a cruise propeller has higher pitch, more drag and lower rpm, which helps cruise. A constant-speed propeller has two controls: the throttle sets power output, shown on the manifold pressure gauge, and the propeller control sets rpm, shown on the tachometer. A governor adjusts blade angle to hold the selected rpm. Takeoff uses a low blade angle and high rpm; after liftoff and in cruise the blade angle increases and rpm decreases. When decreasing power, reduce manifold pressure before rpm; when increasing power, increase rpm first, then manifold pressure.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style>
<text class="t" x="20" y="28" style="font-size:15px">Fixed-pitch and constant-speed propellers</text>
<text class="s" x="20" y="50.0" style="font-size:13px">Small aircraft are equipped with either a fixed-pitch or an adjustable-pitch propeller. The</text>
<text class="s" x="20" y="66.5" style="font-size:13px">constant-speed propeller is the most common type of adjustable-pitch propeller.</text>
<rect class="cl" x="20" y="91.0" width="335" height="492" rx="8"/>
<text class="t" x="32" y="113.0" style="font-size:13px">Fixed-pitch: blade angles never change</text>
<text class="s" x="32" y="135.0" style="font-size:11.5px">The pitch is set by the manufacturer and cannot be</text>
<text class="s" x="32" y="150.0" style="font-size:11.5px">changed. It achieves best efficiency only at one</text>
<text class="s" x="32" y="165.0" style="font-size:11.5px">combination of airspeed and rpm, so it is ideal for</text>
<text class="s" x="32" y="180.0" style="font-size:11.5px">neither cruise nor climb. It is used when low</text>
<text class="s" x="32" y="195.0" style="font-size:11.5px">weight, simplicity and low cost are needed.</text>
<rect x="32" y="220.0" width="311" height="24" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="42" y="237.0" style="font-size:13px">Climb propeller</text>
<path d="M42.0 298.0L118.0 298.0" class="dk" style="stroke-width:1.2;opacity:.5;stroke-dasharray:4 3"/><path d="M48.7 304.7L54.7 294.2L94.0 286.8L111.3 291.3L96.5 298.6L57.4 306.9Z" class="sky" style="stroke:currentColor;stroke-width:1.5;stroke-linejoin:round"/>
<circle cx="141" cy="262.0" r="2.2" class="ah"/>
<text class="s" x="150" y="266.0" style="font-size:11.5px">Lower pitch, so less drag</text>
<circle cx="141" cy="280.0" r="2.2" class="ah"/>
<text class="s" x="150" y="284.0" style="font-size:11.5px">Higher rpm and more horsepower</text>
<text class="s" x="150" y="299.0" style="font-size:11.5px">capability</text>
<circle cx="141" cy="313.0" r="2.2" class="ah"/>
<text class="s" x="150" y="317.0" style="font-size:11.5px">Better takeoffs and climbs,</text>
<text class="s" x="150" y="332.0" style="font-size:11.5px">worse cruise</text>
<rect x="32" y="360.0" width="311" height="24" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="42" y="377.0" style="font-size:13px">Cruise propeller</text>
<path d="M42.0 438.0L118.0 438.0" class="dk" style="stroke-width:1.2;opacity:.5;stroke-dasharray:4 3"/><path d="M52.3 454.0L54.7 442.2L89.9 423.1L107.7 422.0L95.9 433.5L61.2 453.5Z" class="sky" style="stroke:currentColor;stroke-width:1.5;stroke-linejoin:round"/>
<circle cx="141" cy="402.0" r="2.2" class="ah"/>
<text class="s" x="150" y="406.0" style="font-size:11.5px">Higher pitch, so more drag</text>
<circle cx="141" cy="420.0" r="2.2" class="ah"/>
<text class="s" x="150" y="424.0" style="font-size:11.5px">Lower rpm and less horsepower</text>
<text class="s" x="150" y="439.0" style="font-size:11.5px">capability</text>
<circle cx="141" cy="453.0" r="2.2" class="ah"/>
<text class="s" x="150" y="457.0" style="font-size:11.5px">Better cruise efficiency, worse</text>
<text class="s" x="150" y="472.0" style="font-size:11.5px">takeoffs and climbs</text>
<text class="t" x="32" y="510.0" style="font-size:11.5px">Tachometer: the power indicator for fixed pitch</text>
<text class="s" x="32" y="528.0" style="font-size:11.5px">Rpm is regulated by the throttle. At a given</text>
<text class="s" x="32" y="543.0" style="font-size:11.5px">altitude, the higher the tachometer reading, the</text>
<text class="s" x="32" y="558.0" style="font-size:11.5px">higher the engine power output.</text>
<rect class="cl" x="375" y="91.0" width="335" height="492" rx="8"/>
<text class="t" x="387" y="113.0" style="font-size:13px">Constant-speed: two controls</text>
<text class="s" x="387" y="135.0" style="font-size:11.5px">A governor automatically varies the blade angle in</text>
<text class="s" x="387" y="150.0" style="font-size:11.5px">flight to maintain constant rpm despite varying air</text>
<text class="s" x="387" y="165.0" style="font-size:11.5px">loads.</text>
<rect x="387" y="196.0" width="120" height="34" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="447" y="218.0" style="font-size:13px">Throttle</text>
<path d="M509 213.0L525.0 213.0" class="dk" style="stroke-width:1.6"/><path d="M531 213.0L525.0 215.7L525.0 210.3Z" class="dh" style=""/>
<circle cx="580" cy="226.0" r="34" class="cl" style="stroke:currentColor;stroke-width:1.6"/>
<path d="M554.6 216.8A27 27 0 0 1 603.4 212.5" style="fill:none;stroke:var(--palette-mint,#6FB39A);stroke-width:5"/>
<path d="M599.9 216.7L610.8 211.6" class="acc" style="stroke-width:3"/>
<path d="M580 226.0L592.0 205.2" class="dk" style="stroke-width:2.5"/><circle cx="580" cy="226.0" r="3.5" class="dh"/>
<text class="t m" x="580" y="280.0" style="font-size:11.5px">Manifold pressure</text>
<text class="s m" x="580" y="294.0" style="font-size:11.5px">gauge: power output</text>
<rect x="387" y="324.0" width="120" height="34" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t m" x="447" y="346.0" style="font-size:12px">Propeller control</text>
<path d="M509 341.0L525.0 341.0" class="dk" style="stroke-width:1.6"/><path d="M531 341.0L525.0 343.7L525.0 338.3Z" class="dh" style=""/>
<circle cx="580" cy="354.0" r="34" class="cl" style="stroke:currentColor;stroke-width:1.6"/>
<path d="M554.6 344.8A27 27 0 0 1 603.4 340.5" style="fill:none;stroke:var(--palette-mint,#6FB39A);stroke-width:5"/>
<path d="M580 354.0L580.0 330.0" class="dk" style="stroke-width:2.5"/><circle cx="580" cy="354.0" r="3.5" class="dh"/>
<text class="t m" x="580" y="408.0" style="font-size:11.5px">Tachometer: rpm</text>
<text class="s m" x="580" y="422.0" style="font-size:11.5px">(propeller rpm)</text>
<circle cx="390" cy="444.0" r="2.2" class="ah"/>
<text class="s" x="399" y="448.0" style="font-size:11.5px">Once an rpm is selected, the governor adjusts the</text>
<text class="s" x="399" y="463.0" style="font-size:11.5px">blade angle to hold it</text>
<circle cx="390" cy="478.0" r="2.2" class="ah"/>
<text class="s" x="399" y="482.0" style="font-size:11.5px">Within the constant-speed range (between the low</text>
<text class="s" x="399" y="497.0" style="font-size:11.5px">and high pitch stops) rpm stays constant; against</text>
<text class="s" x="399" y="512.0" style="font-size:11.5px">a stop, rpm changes with airspeed and load, as</text>
<text class="s" x="399" y="527.0" style="font-size:11.5px">with a fixed pitch</text>
<rect class="cl" x="20" y="597.0" width="690" height="246" rx="8"/>
<text class="t" x="32" y="619.0" style="font-size:13px">Constant-speed propeller through the flight</text>
<text class="t" x="32" y="647.0" style="font-size:12.5px">Takeoff</text>
<path d="M46.0 687.0L128.0 687.0" class="dk" style="stroke-width:1.2;opacity:.5;stroke-dasharray:4 3"/><path d="M52.5 693.1L58.8 682.8L102.8 676.1L121.5 680.9L104.9 687.9L61.1 695.6Z" class="sky" style="stroke:currentColor;stroke-width:1.5;stroke-linejoin:round"/>
<text class="s" x="32" y="721.0" style="font-size:11.5px">Low blade angle: the AOA stays</text>
<text class="s" x="32" y="736.0" style="font-size:11.5px">small and efficient. The propeller</text>
<text class="s" x="32" y="751.0" style="font-size:11.5px">handles a smaller mass of air per</text>
<text class="s" x="32" y="766.0" style="font-size:11.5px">revolution, so the engine turns at</text>
<text class="s" x="32" y="781.0" style="font-size:11.5px">high rpm for maximum thrust.</text>
<text class="t" x="258" y="647.0" style="font-size:12.5px">After liftoff and climb</text>
<path d="M272.0 687.0L354.0 687.0" class="dk" style="stroke-width:1.2;opacity:.5;stroke-dasharray:4 3"/><path d="M280.5 700.1L284.6 688.8L326.2 673.0L345.5 673.9L330.7 684.2L289.5 700.8Z" class="sky" style="stroke:currentColor;stroke-width:1.5;stroke-linejoin:round"/>
<text class="s" x="258" y="721.0" style="font-size:11.5px">As speed increases, the blade angle</text>
<text class="s" x="258" y="736.0" style="font-size:11.5px">goes higher automatically; the AOA</text>
<text class="s" x="258" y="751.0" style="font-size:11.5px">stays small. More air per</text>
<text class="s" x="258" y="766.0" style="font-size:11.5px">revolution means lower rpm, less</text>
<text class="s" x="258" y="781.0" style="font-size:11.5px">fuel use and wear. At climb power:</text>
<text class="s" x="258" y="796.0" style="font-size:11.5px">reduce manifold pressure first,</text>
<text class="s" x="258" y="811.0" style="font-size:11.5px">then increase blade angle to lower</text>
<text class="s" x="258" y="826.0" style="font-size:11.5px">the rpm.</text>
<text class="t" x="484" y="647.0" style="font-size:12.5px">Cruise</text>
<path d="M498.0 687.0L580.0 687.0" class="dk" style="stroke-width:1.2;opacity:.5;stroke-dasharray:4 3"/><path d="M510.0 706.6L511.6 694.6L549.0 670.6L568.0 667.4L555.7 680.5L518.9 705.4Z" class="sky" style="stroke:currentColor;stroke-width:1.5;stroke-linejoin:round"/>
<text class="s" x="484" y="721.0" style="font-size:11.5px">Less power is needed, so again</text>
<text class="s" x="484" y="736.0" style="font-size:11.5px">reduce manifold pressure, then</text>
<text class="s" x="484" y="751.0" style="font-size:11.5px">increase blade angle to decrease</text>
<text class="s" x="484" y="766.0" style="font-size:11.5px">the rpm. The AOA is still small</text>
<text class="s" x="484" y="781.0" style="font-size:11.5px">because the blade angle has</text>
<text class="s" x="484" y="796.0" style="font-size:11.5px">increased with airspeed.</text>
<rect class="cl" x="20" y="857.0" width="690" height="196" rx="8"/>
<text class="t" x="32" y="879.0" style="font-size:13px">Changing both manifold pressure and rpm: the order matters</text>
<rect x="32" y="893.0" width="335" height="24" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="42" y="910.0" style="font-size:13px">Decreasing power</text>
<text class="s" x="40" y="937.0" style="font-size:11.5px">Reduce manifold pressure before reducing rpm. If rpm</text>
<text class="s" x="40" y="952.0" style="font-size:11.5px">is reduced first, manifold pressure automatically</text>
<text class="s" x="40" y="967.0" style="font-size:11.5px">increases, possibly exceeding the manufacturer</text>
<text class="s" x="40" y="982.0" style="font-size:11.5px">tolerances.</text>
<rect x="375" y="893.0" width="323" height="24" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/>
<text class="t" x="385" y="910.0" style="font-size:13px">Increasing power</text>
<text class="s" x="383" y="937.0" style="font-size:11.5px">Reverse the order: increase rpm first, then</text>
<text class="s" x="383" y="952.0" style="font-size:11.5px">manifold pressure.</text>
<text class="s" x="32" y="1009.0" style="font-size:11.5px">For any given rpm there is a manifold pressure that should not be exceeded; excessive manifold pressure</text>
<text class="s" x="32" y="1024.0" style="font-size:11.5px">stresses the cylinders and can eventually cause engine failure.</text>
</svg>
