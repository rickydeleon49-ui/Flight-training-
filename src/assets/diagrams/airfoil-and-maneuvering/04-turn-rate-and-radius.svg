<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 475" role="img" aria-labelledby="ti de"><title id="ti">Turn rate and turn radius</title><desc id="de">Two circles drawn to scale for turns at 30 degrees of bank, a small one at 120 knots and one with four times the radius at 240 knots. A table gives rate of turn, time for a full circle and radius, with the two formulas and three cards on bank and speed.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11.5px}.q1{font-size:12.5px}.q2{font-size:13px}.q3{stroke:currentColor;stroke-width:1.5}.q4{stroke:currentColor;stroke-width:2}.q5{font-size:12px;font-family:ui-monospace,Menlo,monospace}</style><text class="t" x="20" y="28" style="font-size:15px">Turn rate and turn radius</text><text class="s q2" x="20" y="50">Bank angle and airspeed set how fast the airplane turns and how big the circle is. All speeds here are</text><text class="s q2" x="20" y="66.5">true airspeed (TAS).</text><circle cx="120" cy="185" r="88" class="lav q4"/><circle cx="120" cy="251" r="22" class="sky q4"/><text class="t m q1" x="120" y="175">240 knots</text><text class="s m q0" x="120" y="191">4 times the radius</text><text class="t m" x="120" y="255" style="font-size:10.5px">120 kt</text><text class="s m q0" x="120" y="293">Both turns at 30 degrees of bank,</text><text class="s m q0" x="120" y="308">drawn to scale</text><text class="t q2" x="250" y="103">30 degrees of bank</text><text class="t m q1" x="480" y="125">120 knots</text><text class="t m q1" x="625" y="125">240 knots</text><rect class="cl" x="250" y="137" width="460" height="28" rx="6"/><text class="s q1" x="260" y="156">Rate of turn</text><text class="t m q1" x="480" y="156">5.25 deg/s</text><text class="t m q1" x="625" y="156">2.63 deg/s</text><rect class="cl" x="250" y="171" width="460" height="28" rx="6"/><text class="s q1" x="260" y="190">Time for 360 degrees</text><text class="t m q1" x="480" y="190">68.6 s</text><text class="t m q1" x="625" y="190">about 137 s</text><rect class="cl" x="250" y="205" width="460" height="28" rx="6"/><text class="s q1" x="260" y="224">Radius</text><text class="t m q1" x="480" y="224">2,214 ft</text><text class="t m q1" x="625" y="224">4 times as large</text><text class="t q5" x="250" y="253">Rate of turn (deg/s) = 1,091 x tan(bank) / speed (knots)</text><text class="t q5" x="250" y="275">Radius (ft) = V squared / (11.26 x tan(bank)), V in knots</text><text class="s q0" x="250" y="297">Check: 120 kt x 1.69 = 202.8 fps; 202.8 x 68.6 s = 13,912 ft around.</text><rect class="cl" x="20" y="327" width="220.67" height="134" rx="8"/><rect x="20" y="327" width="220.67" height="26" rx="10" class="sky q3"/><text class="t q2" x="30" y="345">More bank</text><circle cx="33" cy="363" r="2.2" class="ah"/><text class="s q0" x="42" y="367">At the same speed, more bank</text><text class="s q0" x="42" y="382">gives a faster rate of turn.</text><rect class="cl" x="254.67" y="327" width="220.67" height="134" rx="8"/><rect x="254.67" y="327" width="220.67" height="26" rx="10" class="lav q3"/><text class="t q2" x="264.67" y="345">More speed</text><circle cx="267.67" cy="363" r="2.2" class="ah"/><text class="s q0" x="276.67" y="367">At the same bank, more speed</text><text class="s q0" x="276.67" y="382">gives a slower rate, a longer</text><text class="s q0" x="276.67" y="397">time around and a larger</text><text class="s q0" x="276.67" y="412">circle.</text><circle cx="267.67" cy="426" r="2.2" class="ah"/><text class="s q0" x="276.67" y="430">Double the speed and the radius</text><text class="s q0" x="276.67" y="445">is four times larger.</text><rect class="cl" x="489.33" y="327" width="220.67" height="134" rx="8"/><rect x="489.33" y="327" width="220.67" height="26" rx="10" class="mint q3"/><text class="t q2" x="499.33" y="345">Keeping the same rate</text><circle cx="502.33" cy="363" r="2.2" class="ah"/><text class="s q0" x="511.33" y="367">If airspeed goes up and you</text><text class="s q0" x="511.33" y="382">want the same rate of turn, the</text><text class="s q0" x="511.33" y="397">bank angle must go up.</text></svg>
