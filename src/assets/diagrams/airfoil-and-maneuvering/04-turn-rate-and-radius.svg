<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 475" role="img" aria-labelledby="ti de"><title id="ti">Turn rate and turn radius</title><desc id="de">Two circles drawn to scale for turns at 30 degrees of bank, a small one at 120 knots and one with four times the radius at 240 knots. A table gives rate of turn, time for a full circle and radius, with the two formulas and three cards on bank and speed.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><text class="t" x="20" y="28" style="font-size:15px">Turn rate and turn radius</text><text class="s" x="20" y="50.0" style="font-size:13px">Bank angle and airspeed set how fast the airplane turns and how big the circle is. All speeds here are</text><text class="s" x="20" y="66.5" style="font-size:13px">true airspeed (TAS).</text><circle cx="120" cy="185.0" r="88" class="lav" style="stroke:currentColor;stroke-width:2"/><circle cx="120" cy="251.0" r="22" class="sky" style="stroke:currentColor;stroke-width:2"/><text class="t m" x="120" y="175.0" style="font-size:12.5px">240 knots</text><text class="s m" x="120" y="191.0" style="font-size:11.5px">4 times the radius</text><text class="t m" x="120" y="255.0" style="font-size:10.5px">120 kt</text><text class="s m" x="120.0" y="293.0" style="font-size:11.5px">Both turns at 30 degrees of bank,</text><text class="s m" x="120.0" y="308.0" style="font-size:11.5px">drawn to scale</text><text class="t" x="250" y="103.0" style="font-size:13px">30 degrees of bank</text><text class="t m" x="480" y="125.0" style="font-size:12.5px">120 knots</text><text class="t m" x="625" y="125.0" style="font-size:12.5px">240 knots</text><rect class="cl" x="250" y="137.0" width="460" height="28" rx="6"/><text class="s" x="260" y="156.0" style="font-size:12.5px">Rate of turn</text><text class="t m" x="480" y="156.0" style="font-size:12.5px">5.25 deg/s</text><text class="t m" x="625" y="156.0" style="font-size:12.5px">2.63 deg/s</text><rect class="cl" x="250" y="171.0" width="460" height="28" rx="6"/><text class="s" x="260" y="190.0" style="font-size:12.5px">Time for 360 degrees</text><text class="t m" x="480" y="190.0" style="font-size:12.5px">68.6 s</text><text class="t m" x="625" y="190.0" style="font-size:12.5px">about 137 s</text><rect class="cl" x="250" y="205.0" width="460" height="28" rx="6"/><text class="s" x="260" y="224.0" style="font-size:12.5px">Radius</text><text class="t m" x="480" y="224.0" style="font-size:12.5px">2,214 ft</text><text class="t m" x="625" y="224.0" style="font-size:12.5px">4 times as large</text><text class="t" x="250" y="253.0" style="font-size:12px;font-family:ui-monospace,Menlo,monospace">Rate of turn (deg/s) = 1,091 x tan(bank) / speed (knots)</text><text class="t" x="250" y="275.0" style="font-size:12px;font-family:ui-monospace,Menlo,monospace">Radius (ft) = V squared / (11.26 x tan(bank)), V in knots</text><text class="s" x="250" y="297.0" style="font-size:11.5px">Check: 120 kt x 1.69 = 202.8 fps; 202.8 x 68.6 s = 13,912 ft around.</text><rect class="cl" x="20.0" y="327.0" width="220.66666666666666" height="134.0" rx="8"/><rect x="20.0" y="327.0" width="220.66666666666666" height="26" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30.0" y="345.0" style="font-size:13px">More bank</text><circle cx="33.0" cy="363.0" r="2.2" class="ah"/><text class="s" x="42.0" y="367.0" style="font-size:11.5px">At the same speed, more bank</text><text class="s" x="42.0" y="382.0" style="font-size:11.5px">gives a faster rate of turn.</text><rect class="cl" x="254.66666666666666" y="327.0" width="220.66666666666666" height="134.0" rx="8"/><rect x="254.66666666666666" y="327.0" width="220.66666666666666" height="26" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="264.66666666666663" y="345.0" style="font-size:13px">More speed</text><circle cx="267.66666666666663" cy="363.0" r="2.2" class="ah"/><text class="s" x="276.66666666666663" y="367.0" style="font-size:11.5px">At the same bank, more speed</text><text class="s" x="276.66666666666663" y="382.0" style="font-size:11.5px">gives a slower rate, a longer</text><text class="s" x="276.66666666666663" y="397.0" style="font-size:11.5px">time around and a larger</text><text class="s" x="276.66666666666663" y="412.0" style="font-size:11.5px">circle.</text><circle cx="267.66666666666663" cy="426.0" r="2.2" class="ah"/><text class="s" x="276.66666666666663" y="430.0" style="font-size:11.5px">Double the speed and the radius</text><text class="s" x="276.66666666666663" y="445.0" style="font-size:11.5px">is four times larger.</text><rect class="cl" x="489.3333333333333" y="327.0" width="220.66666666666666" height="134.0" rx="8"/><rect x="489.3333333333333" y="327.0" width="220.66666666666666" height="26" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="499.3333333333333" y="345.0" style="font-size:13px">Keeping the same rate</text><circle cx="502.3333333333333" cy="363.0" r="2.2" class="ah"/><text class="s" x="511.3333333333333" y="367.0" style="font-size:11.5px">If airspeed goes up and you</text><text class="s" x="511.3333333333333" y="382.0" style="font-size:11.5px">want the same rate of turn, the</text><text class="s" x="511.3333333333333" y="397.0" style="font-size:11.5px">bank angle must go up.</text></svg>
