<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 646" role="img" aria-labelledby="ti de"><title id="ti">Forces in a steady climb</title><desc id="de">A climbing airplane with arrows for lift, weight, thrust and drag, plus the part of the weight that acts backward along the flight path. Three steps describe climb entry and settling, and two cards give the thrust needed in a climb and the absolute ceiling.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11.5px}.q1{font-size:13px}.q2{font-size:12px}.q3{stroke:currentColor;stroke-width:1.5}.q4{stroke-width:4}.q5{fill:var(--palette-berry,#A84C6B)}.q6{stroke:currentColor;stroke-width:1.4;stroke-linejoin:round}.q7{font-size:13px;text-anchor:end}</style><text class="t" x="20" y="28" style="font-size:15px">Forces in a steady climb</text><text class="s q1" x="20" y="50">In a steady climb the wing makes about the same lift as in level flight. What changes is that part of</text><text class="s q1" x="20" y="66.5">the weight now pulls backward along the flight path.</text><path d="M30 321L550 228" class="o d" style="stroke-width:2;opacity:.5"/><text class="s q2" x="562" y="235">Flight path</text><g transform="translate(250 233) rotate(-12) scale(2.3)"><ellipse cx="0" cy="0" rx="24" ry="5.5" class="sky" style="stroke:currentColor;stroke-width:1.4"/><path d="M-20 -2L-29 -13L-22 -13L-12 -3Z" class="sky q6"/><path d="M0 2L8 2L-4 11L-9 11Z" class="cl q6"/></g><path d="M250 233L230.5 141.1" class="acc q4"/><path d="M228.17 130.29L235.3 140L225.6 142.1Z" class="dh q5"/><text class="t q7" x="220.17" y="122.29">Lift</text><path d="M250 233L250 317" class="dk q4"/><path d="M250 328L245.1 317L254.9 317Z" class="dh"/><text class="t q1" x="258" y="343">Weight</text><path d="M283.26 225.93L355.6 210.5" class="acc q4"/><path d="M366.4 208.26L356.7 215.4L354.6 205.7Z" class="dh q5"/><text class="t q1" x="374.4" y="224.26">Thrust</text><path d="M216.74 240.07L149.3 254.4" class="dk q4"/><path d="M138.49 256.7L148.2 249.6L150.3 259.3Z" class="dh"/><text class="t q7" x="134.49" y="286.7">Drag</text><path d="M250 328L212.4 336" class="dk" style="stroke-width:3"/><path d="M203.63 337.86L211.6 332L213.3 339.9Z" class="dh"/><text class="s" x="195.63" y="353.86" style="font-size:11.5px;text-anchor:end">Part of weight along the path</text><text class="s q2" x="480" y="105">The part of the weight that acts</text><text class="s q2" x="480" y="120.5">rearward along the flight path adds</text><text class="s q2" x="480" y="136">to drag. The more the nose is</text><text class="s q2" x="480" y="151.5">raised, the larger this part.</text><rect class="cl" x="20" y="383" width="215.33" height="116" rx="8"/><rect x="20" y="383" width="215.33" height="26" rx="10" class="sky q3"/><text class="t q1" x="30" y="401">1 Entry</text><circle cx="33" cy="419" r="2.2" class="ah"/><text class="s q0" x="42" y="423">Back pressure raises the nose</text><text class="s q0" x="42" y="438">and the angle of attack (AOA).</text><text class="s q0" x="42" y="453">Lift briefly exceeds weight,</text><text class="s q0" x="42" y="468">so the airplane starts to</text><text class="s q0" x="42" y="483">climb.</text><path d="M238.33 441L246.3 441" class="acc" style="stroke-width:2.5"/><path d="M254.33 441L246.3 444.6L246.3 437.4Z" class="dh q5"/><rect class="cl" x="257.33" y="383" width="215.33" height="116" rx="8"/><rect x="257.33" y="383" width="215.33" height="26" rx="10" class="lav q3"/><text class="t q1" x="267.33" y="401">2 Steady</text><circle cx="270.33" cy="419" r="2.2" class="ah"/><text class="s q0" x="279.33" y="423">The flight path settles. AOA</text><text class="s q0" x="279.33" y="438">and lift return to about the</text><text class="s q0" x="279.33" y="453">level-flight values.</text><path d="M475.67 441L483.7 441" class="acc" style="stroke-width:2.5"/><path d="M491.67 441L483.7 444.6L483.7 437.4Z" class="dh q5"/><rect class="cl" x="494.67" y="383" width="215.33" height="116" rx="8"/><rect x="494.67" y="383" width="215.33" height="26" rx="10" class="mint q3"/><text class="t q1" x="504.67" y="401">3 Same power</text><circle cx="507.67" cy="419" r="2.2" class="ah"/><text class="s q0" x="516.67" y="423">Thrust that held level speed</text><text class="s q0" x="516.67" y="438">is not enough. Airspeed falls</text><text class="s q0" x="516.67" y="453">until drag plus the weight</text><text class="s q0" x="516.67" y="468">part equals thrust.</text><rect class="cl" x="20" y="513" width="338" height="119" rx="8"/><rect x="20" y="513" width="338" height="26" rx="10" class="rose q3"/><text class="t q1" x="30" y="531">Thrust needed in a climb</text><circle cx="33" cy="549" r="2.2" class="ah"/><text class="s q0" x="42" y="553">Thrust = drag plus a part of the weight. A 10</text><text class="s q0" x="42" y="568">degree climb needs thrust equal to drag plus 17</text><text class="s q0" x="42" y="583">percent of weight.</text><circle cx="33" cy="597" r="2.2" class="ah"/><text class="s q0" x="42" y="601">Straight up needs thrust equal to all of the weight</text><text class="s q0" x="42" y="616">plus drag.</text><rect class="cl" x="372" y="513" width="338" height="119" rx="8"/><rect x="372" y="513" width="338" height="26" rx="10" class="sky q3"/><text class="t q1" x="382" y="531">When excess thrust runs out</text><circle cx="385" cy="549" r="2.2" class="ah"/><text class="s q0" x="394" y="553">The climb angle depends on the excess thrust left</text><text class="s q0" x="394" y="568">to carry a part of the weight.</text><circle cx="385" cy="582" r="2.2" class="ah"/><text class="s q0" x="394" y="586">With no excess thrust the aircraft can no longer</text><text class="s q0" x="394" y="601">climb. That is the absolute ceiling.</text></svg>
