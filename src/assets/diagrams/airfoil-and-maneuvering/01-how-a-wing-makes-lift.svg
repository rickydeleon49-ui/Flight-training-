<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 608" role="img" aria-labelledby="ti de"><title id="ti">How a wing makes lift</title><desc id="de">Side view of a wing section in moving air. Streamlines run faster over the top with lower pressure and slower underneath with higher pressure, and the wing turns air downward as downwash while lift acts upward. Four cards explain low pressure above, high pressure below, downwash and why a pressure difference alone is not the whole story.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11.5px}.q1{font-size:13px}.q2{font-size:12px}.q3{stroke-width:1.8;opacity:.45}.q4{stroke:currentColor;stroke-width:1.5}.q5{fill:var(--palette-berry,#A84C6B)}</style><text class="t" x="20" y="28" style="font-size:15px">How a wing makes lift</text><text class="s q1" x="20" y="50">Lift comes from the air pressure above and below the wing and from the way the wing turns air</text><text class="s q1" x="20" y="66.5">downward. Newton's laws and Bernoulli's principle both work at the same time.</text><text class="s q2" x="30" y="99">Relative wind</text><path d="M30 111L116 111" class="dk" style="stroke-width:3"/><path d="M125 111L116 115L116 107Z" class="dh"/><path d="M30 135 C220 135 290 131 370 141 S560 177 700 203" class="o q3"/><path d="M30 195 C180 195 230 155 330 155 S520 193 700 251" class="o q3"/><path d="M30 247 C200 247 280 273 370 273 S560 273 700 279" class="o q3"/><path d="M30 329 C300 329 450 329 700 337" class="o q3"/><g transform="translate(365 217) rotate(8)"><path class="o sky" d="M-110 0C-104 -40 70 -50 150 0C60 12 -80 14 -110 0z"/></g><path d="M365 171L365 128" class="acc" style="stroke-width:4"/><path d="M365 117L369.9 128L360.1 128Z" class="dh q5"/><text class="t q1" x="378" y="115">Lift</text><path d="M518 239L545.9 275.1" class="acc" style="stroke-width:4"/><path d="M552 283L542.3 277.8L549.4 272.3Z" class="dh q5"/><text class="t" x="560" y="307" style="font-size:12.5px">Downwash</text><text class="s q2" x="30" y="159">Faster air above:</text><text class="s q2" x="30" y="174">lower pressure</text><text class="s q2" x="30" y="283">Slower air below:</text><text class="s q2" x="30" y="298">higher pressure</text><rect class="cl" x="20" y="357" width="338" height="119" rx="8"/><rect x="20" y="357" width="338" height="26" rx="10" class="sky q4"/><text class="t q1" x="30" y="375">Low pressure above</text><circle cx="33" cy="393" r="2.2" class="ah"/><text class="s q0" x="42" y="397">A wing is inclined into the airstream, so the air</text><text class="s q0" x="42" y="412">over the top is forced to move faster than the air</text><text class="s q0" x="42" y="427">along the bottom.</text><circle cx="33" cy="441" r="2.2" class="ah"/><text class="s q0" x="42" y="445">Faster air means lower pressure (Bernoulli). The</text><text class="s q0" x="42" y="460">lowered pressure is part of total lift.</text><rect class="cl" x="372" y="357" width="338" height="119" rx="8"/><rect x="372" y="357" width="338" height="26" rx="10" class="mint q4"/><text class="t q1" x="382" y="375">High pressure below</text><circle cx="385" cy="393" r="2.2" class="ah"/><text class="s q0" x="394" y="397">Near the leading edge the air below is nearly</text><text class="s q0" x="394" y="412">stopped (stagnation point), then speeds up again.</text><circle cx="385" cy="426" r="2.2" class="ah"/><text class="s q0" x="394" y="430">Where the air is slowed, pressure rises. A positive</text><text class="s q0" x="394" y="445">pressure below the wing adds to lift, mostly at</text><text class="s q0" x="394" y="460">higher angles of attack.</text><rect class="cl" x="20" y="490" width="338" height="104" rx="8"/><rect x="20" y="490" width="338" height="26" rx="10" class="lav q4"/><text class="t q1" x="30" y="508">Downwash (Newton)</text><circle cx="33" cy="526" r="2.2" class="ah"/><text class="s q0" x="42" y="530">The airfoil forces air downward, and the equal and</text><text class="s q0" x="42" y="545">opposite reaction forces the airfoil upward.</text><circle cx="33" cy="559" r="2.2" class="ah"/><text class="s q0" x="42" y="563">Air from the top and bottom meets at the trailing</text><text class="s q0" x="42" y="578">edge as downwash.</text><rect class="cl" x="372" y="490" width="338" height="104" rx="8"/><rect x="372" y="490" width="338" height="26" rx="10" class="rose q4"/><text class="t q1" x="382" y="508">Not only a pressure difference</text><circle cx="385" cy="526" r="2.2" class="ah"/><text class="s q0" x="394" y="530">Many airfoils have no longer top surface.</text><text class="s q0" x="394" y="545">Symmetrical wings, and even a flat paper airplane,</text><text class="s q0" x="394" y="560">still make lift when tilted to the airflow.</text><circle cx="385" cy="574" r="2.2" class="ah"/><text class="s q0" x="394" y="578">Flow turning is partly or fully responsible.</text></svg>
