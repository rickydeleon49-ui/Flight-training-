<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 568" role="img" aria-labelledby="ti de"><title id="ti">Vg diagram: the safe envelope</title><desc id="de">A graph of load factor against airspeed for PHAK's example aircraft. A curved maximum lift line passes 1 G at 64 mph, 2 G at 92 mph, 3 G at 112 mph and 4.4 G at 137 mph. A flat limit load factor line at 4.4 G and a vertical redline at 225 mph close the safe envelope. Four numbered callouts and three cards explain it.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11.5px}.q1{font-size:13px}.q2{font-size:12px;fill:#fff}.q3{stroke-width:1.5}.q4{font-size:11px}.q5{stroke:currentColor;stroke-width:1.5}</style><text class="t" x="20" y="28" style="font-size:15px">Vg diagram: the safe envelope</text><text class="s q1" x="20" y="50">A Vg diagram plots airspeed against load factor (G). It shows which combinations are safe for one</text><text class="s q1" x="20" y="66.5">aircraft at a certain weight and altitude. The numbers here are PHAK's example aircraft.</text><path d="M70 93V348M66 287H445" class="o" style="stroke-width:1.8"/><text class="s e q0" x="62" y="253">1</text><path d="M67 249H73" class="o q3"/><text class="s e q0" x="62" y="215">2</text><path d="M67 211H73" class="o q3"/><text class="s e q0" x="62" y="177">3</text><path d="M67 173H73" class="o q3"/><text class="s e q0" x="62" y="139">4</text><path d="M67 135H73" class="o q3"/><text class="s e q0" x="62" y="101">5</text><path d="M67 97H73" class="o q3"/><text class="s e q0" x="62" y="291">0</text><text class="s q0" x="68" y="85">Load factor (G)</text><text class="s m q0" x="145" y="303">50</text><text class="s m q0" x="220" y="303">100</text><text class="s m q0" x="295" y="303">150</text><text class="s m q0" x="370" y="303">200</text><text class="s m q0" x="445" y="303">250</text><text class="s e q0" x="445" y="366">Airspeed (mph)</text><path d="M70 287C86 280.7 143 261.7 166 249C189 236.3 196 223.7 208 211C220 198.3 226.8 188.2 238 173C249.2 157.8 269.2 128.7 275.5 119.8L407.5 119.8L407.5 344L295 344C288.8 340.8 275 331.3 257.5 325C240 318.7 221.2 312.3 190 306C158.8 299.7 90 290.2 70 287Z" class="mint" style="stroke:currentColor;stroke-width:2"/><path d="M275.5 119.8H407.5" class="o" style="stroke-width:2.5"/><path d="M407.5 119.8V344" class="o" style="stroke-width:2.5"/><circle cx="166" cy="249" r="3.5" class="dh"/><circle cx="208" cy="211" r="3.5" class="dh"/><circle cx="238" cy="173" r="3.5" class="dh"/><circle cx="275.5" cy="119.8" r="3.5" class="dh"/><text class="s e q4" x="157" y="253">1 G at 64 mph</text><text class="s e q4" x="199" y="215">2 G at 92 mph</text><text class="s e q4" x="229" y="177">3 G at 112 mph</text><text class="s e q4" x="266.5" y="135.8">4.4 G at 137 mph</text><text class="t m q1" x="347.5" y="195.8">Safe envelope</text><text class="s m q4" x="212.5" y="345">Negative side: shape only</text><circle cx="252" cy="187" r="10" class="ah"/><text class="t m q2" x="252" y="191">1</text><circle cx="340" cy="105.8" r="10" class="ah"/><text class="t m q2" x="340" y="109.8">2</text><circle cx="275.5" cy="105.8" r="10" class="ah"/><text class="t m q2" x="275.5" y="109.8">3</text><circle cx="421.5" cy="211" r="10" class="ah"/><text class="t m q2" x="421.5" y="215">4</text><circle cx="492" cy="105" r="10" class="ah"/><text class="t m q2" x="492" y="109">1</text><text class="t q1" x="510" y="110">Maximum lift curve</text><text class="s q0" x="510" y="127">No more than 1 G at 64 mph, the</text><text class="s q0" x="510" y="142">wing-level stall speed. Above the</text><text class="s q0" x="510" y="157">curve the wing stalls.</text><circle cx="492" cy="184" r="10" class="ah"/><text class="t m q2" x="492" y="188">2</text><text class="t q1" x="510" y="189">Limit load factor</text><text class="s q0" x="510" y="206">4.4 G here. Above it, structural</text><text class="s q0" x="510" y="221">damage is possible.</text><circle cx="492" cy="248" r="10" class="ah"/><text class="t m q2" x="492" y="252">3</text><text class="t q1" x="510" y="253">Maneuvering speed</text><text class="s q0" x="510" y="270">Where the limit load factor meets</text><text class="s q0" x="510" y="285">the lift curve. Below it, the</text><text class="s q0" x="510" y="300">wing stalls before the limit load</text><text class="s q0" x="510" y="315">is reached.</text><circle cx="492" cy="342" r="10" class="ah"/><text class="t m q2" x="492" y="346">4</text><text class="t q1" x="510" y="347">Redline</text><text class="s q0" x="510" y="364">225 mph here. Beyond it,</text><text class="s q0" x="510" y="379">structural damage or failure may</text><text class="s q0" x="510" y="394">result.</text><rect class="cl" x="20" y="423" width="220.67" height="131" rx="8"/><rect x="20" y="423" width="220.67" height="26" rx="10" class="sky q5"/><text class="t q1" x="30" y="441">Rough air</text><circle cx="33" cy="459" r="2.2" class="ah"/><text class="s q0" x="42" y="463">In extremely rough air, as in</text><text class="s q0" x="42" y="478">thunderstorms or frontal</text><text class="s q0" x="42" y="493">conditions, reduce speed to the</text><text class="s q0" x="42" y="508">design maneuvering speed.</text><rect class="cl" x="254.67" y="423" width="220.67" height="131" rx="8"/><rect x="254.67" y="423" width="220.67" height="26" rx="10" class="mint q5"/><text class="t q1" x="264.67" y="441">Stay inside the envelope</text><circle cx="267.67" cy="459" r="2.2" class="ah"/><text class="s q0" x="276.67" y="463">Below the redline, below the</text><text class="s q0" x="276.67" y="478">limit load factor and below the</text><text class="s q0" x="276.67" y="493">lift curve. A maneuver, gust,</text><text class="s q0" x="276.67" y="508">or both outside it can cause</text><text class="s q0" x="276.67" y="523">damage.</text><rect class="cl" x="489.33" y="423" width="220.67" height="131" rx="8"/><rect x="489.33" y="423" width="220.67" height="26" rx="10" class="rose q5"/><text class="t q1" x="499.33" y="441">What it does not cover</text><circle cx="502.33" cy="459" r="2.2" class="ah"/><text class="s q0" x="511.33" y="463">At or below maneuvering speed</text><text class="s q0" x="511.33" y="478">there is no structural</text><text class="s q0" x="511.33" y="493">protection against several full</text><text class="s q0" x="511.33" y="508">control inputs in one axis, or</text><text class="s q0" x="511.33" y="523">full inputs in more than one</text><text class="s q0" x="511.33" y="538">axis at once.</text></svg>
