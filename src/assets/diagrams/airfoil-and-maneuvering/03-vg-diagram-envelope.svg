<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 568" role="img" aria-labelledby="ti de"><title id="ti">Vg diagram: the safe envelope</title><desc id="de">A graph of load factor against airspeed for PHAK's example aircraft. A curved maximum lift line passes 1 G at 64 mph, 2 G at 92 mph, 3 G at 112 mph and 4.4 G at 137 mph. A flat limit load factor line at 4.4 G and a vertical redline at 225 mph close the safe envelope. Four numbered callouts and three cards explain it.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><text class="t" x="20" y="28" style="font-size:15px">Vg diagram: the safe envelope</text><text class="s" x="20" y="50.0" style="font-size:13px">A Vg diagram plots airspeed against load factor (G). It shows which combinations are safe for one</text><text class="s" x="20" y="66.5" style="font-size:13px">aircraft at a certain weight and altitude. The numbers here are PHAK's example aircraft.</text><path d="M70 93.0V348.0M66 287.0H445.0" class="o" style="stroke-width:1.8"/><text class="s e" x="62" y="253.0" style="font-size:11.5px">1</text><path d="M67 249.0H73" class="o" style="stroke-width:1.5"/><text class="s e" x="62" y="215.0" style="font-size:11.5px">2</text><path d="M67 211.0H73" class="o" style="stroke-width:1.5"/><text class="s e" x="62" y="177.0" style="font-size:11.5px">3</text><path d="M67 173.0H73" class="o" style="stroke-width:1.5"/><text class="s e" x="62" y="139.0" style="font-size:11.5px">4</text><path d="M67 135.0H73" class="o" style="stroke-width:1.5"/><text class="s e" x="62" y="101.0" style="font-size:11.5px">5</text><path d="M67 97.0H73" class="o" style="stroke-width:1.5"/><text class="s e" x="62" y="291.0" style="font-size:11.5px">0</text><text class="s" x="68" y="85.0" style="font-size:11.5px">Load factor (G)</text><text class="s m" x="145.0" y="303.0" style="font-size:11.5px">50</text><text class="s m" x="220.0" y="303.0" style="font-size:11.5px">100</text><text class="s m" x="295.0" y="303.0" style="font-size:11.5px">150</text><text class="s m" x="370.0" y="303.0" style="font-size:11.5px">200</text><text class="s m" x="445.0" y="303.0" style="font-size:11.5px">250</text><text class="s e" x="445.0" y="366.0" style="font-size:11.5px">Airspeed (mph)</text><path d="M70.0 287.0C86.0 280.7 143.0 261.7 166.0 249.0C189.0 236.3 196.0 223.7 208.0 211.0C220.0 198.3 226.8 188.2 238.0 173.0C249.2 157.8 269.2 128.7 275.5 119.8L407.5 119.8L407.5 344.0L295.0 344.0C288.8 340.8 275.0 331.3 257.5 325.0C240.0 318.7 221.2 312.3 190.0 306.0C158.8 299.7 90.0 290.2 70.0 287.0Z" class="mint" style="stroke:currentColor;stroke-width:2"/><path d="M275.5 119.8H407.5" class="o" style="stroke-width:2.5"/><path d="M407.5 119.8V344.0" class="o" style="stroke-width:2.5"/><circle cx="166.0" cy="249.0" r="3.5" class="dh"/><circle cx="208.0" cy="211.0" r="3.5" class="dh"/><circle cx="238.0" cy="173.0" r="3.5" class="dh"/><circle cx="275.5" cy="119.79999999999998" r="3.5" class="dh"/><text class="s e" x="157.0" y="253.0" style="font-size:11px">1 G at 64 mph</text><text class="s e" x="199.0" y="215.0" style="font-size:11px">2 G at 92 mph</text><text class="s e" x="229.0" y="177.0" style="font-size:11px">3 G at 112 mph</text><text class="s e" x="266.5" y="135.79999999999998" style="font-size:11px">4.4 G at 137 mph</text><text class="t m" x="347.5" y="195.8" style="font-size:13px">Safe envelope</text><text class="s m" x="212.5" y="345.0" style="font-size:11px">Negative side: shape only</text><circle cx="252.0" cy="187.0" r="10" class="ah"/><text class="t m" x="252.0" y="191.0" style="font-size:12px;fill:#fff">1</text><circle cx="340.0" cy="105.79999999999998" r="10" class="ah"/><text class="t m" x="340.0" y="109.79999999999998" style="font-size:12px;fill:#fff">2</text><circle cx="275.5" cy="105.79999999999998" r="10" class="ah"/><text class="t m" x="275.5" y="109.79999999999998" style="font-size:12px;fill:#fff">3</text><circle cx="421.5" cy="211.0" r="10" class="ah"/><text class="t m" x="421.5" y="215.0" style="font-size:12px;fill:#fff">4</text><circle cx="492" cy="105.0" r="10" class="ah"/><text class="t m" x="492" y="109.0" style="font-size:12px;fill:#fff">1</text><text class="t" x="510" y="110.0" style="font-size:13px">Maximum lift curve</text><text class="s" x="510" y="127.0" style="font-size:11.5px">No more than 1 G at 64 mph, the</text><text class="s" x="510" y="142.0" style="font-size:11.5px">wing-level stall speed. Above the</text><text class="s" x="510" y="157.0" style="font-size:11.5px">curve the wing stalls.</text><circle cx="492" cy="184.0" r="10" class="ah"/><text class="t m" x="492" y="188.0" style="font-size:12px;fill:#fff">2</text><text class="t" x="510" y="189.0" style="font-size:13px">Limit load factor</text><text class="s" x="510" y="206.0" style="font-size:11.5px">4.4 G here. Above it, structural</text><text class="s" x="510" y="221.0" style="font-size:11.5px">damage is possible.</text><circle cx="492" cy="248.0" r="10" class="ah"/><text class="t m" x="492" y="252.0" style="font-size:12px;fill:#fff">3</text><text class="t" x="510" y="253.0" style="font-size:13px">Maneuvering speed</text><text class="s" x="510" y="270.0" style="font-size:11.5px">Where the limit load factor meets</text><text class="s" x="510" y="285.0" style="font-size:11.5px">the lift curve. Below it, the</text><text class="s" x="510" y="300.0" style="font-size:11.5px">wing stalls before the limit load</text><text class="s" x="510" y="315.0" style="font-size:11.5px">is reached.</text><circle cx="492" cy="342.0" r="10" class="ah"/><text class="t m" x="492" y="346.0" style="font-size:12px;fill:#fff">4</text><text class="t" x="510" y="347.0" style="font-size:13px">Redline</text><text class="s" x="510" y="364.0" style="font-size:11.5px">225 mph here. Beyond it,</text><text class="s" x="510" y="379.0" style="font-size:11.5px">structural damage or failure may</text><text class="s" x="510" y="394.0" style="font-size:11.5px">result.</text><rect class="cl" x="20.0" y="423.0" width="220.66666666666666" height="131.0" rx="8"/><rect x="20.0" y="423.0" width="220.66666666666666" height="26" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30.0" y="441.0" style="font-size:13px">Rough air</text><circle cx="33.0" cy="459.0" r="2.2" class="ah"/><text class="s" x="42.0" y="463.0" style="font-size:11.5px">In extremely rough air, as in</text><text class="s" x="42.0" y="478.0" style="font-size:11.5px">thunderstorms or frontal</text><text class="s" x="42.0" y="493.0" style="font-size:11.5px">conditions, reduce speed to the</text><text class="s" x="42.0" y="508.0" style="font-size:11.5px">design maneuvering speed.</text><rect class="cl" x="254.66666666666666" y="423.0" width="220.66666666666666" height="131.0" rx="8"/><rect x="254.66666666666666" y="423.0" width="220.66666666666666" height="26" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="264.66666666666663" y="441.0" style="font-size:13px">Stay inside the envelope</text><circle cx="267.66666666666663" cy="459.0" r="2.2" class="ah"/><text class="s" x="276.66666666666663" y="463.0" style="font-size:11.5px">Below the redline, below the</text><text class="s" x="276.66666666666663" y="478.0" style="font-size:11.5px">limit load factor and below the</text><text class="s" x="276.66666666666663" y="493.0" style="font-size:11.5px">lift curve. A maneuver, gust,</text><text class="s" x="276.66666666666663" y="508.0" style="font-size:11.5px">or both outside it can cause</text><text class="s" x="276.66666666666663" y="523.0" style="font-size:11.5px">damage.</text><rect class="cl" x="489.3333333333333" y="423.0" width="220.66666666666666" height="131.0" rx="8"/><rect x="489.3333333333333" y="423.0" width="220.66666666666666" height="26" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="499.3333333333333" y="441.0" style="font-size:13px">What it does not cover</text><circle cx="502.3333333333333" cy="459.0" r="2.2" class="ah"/><text class="s" x="511.3333333333333" y="463.0" style="font-size:11.5px">At or below maneuvering speed</text><text class="s" x="511.3333333333333" y="478.0" style="font-size:11.5px">there is no structural</text><text class="s" x="511.3333333333333" y="493.0" style="font-size:11.5px">protection against several full</text><text class="s" x="511.3333333333333" y="508.0" style="font-size:11.5px">control inputs in one axis, or</text><text class="s" x="511.3333333333333" y="523.0" style="font-size:11.5px">full inputs in more than one</text><text class="s" x="511.3333333333333" y="538.0" style="font-size:11.5px">axis at once.</text></svg>
