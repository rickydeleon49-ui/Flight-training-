<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 509" role="img" aria-labelledby="ti de"><title id="ti">Too high or too low on final</title><desc id="de">Side view with a desired glide path to an aiming point and two dashed paths above and below it, with arrows showing the power and pitch change for each, and cards on what to do and what not to do.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:17px}.q1{stroke-width:2;opacity:.6}.q2{font-size:11.5px}.q3{font-size:13px}.q4{font-size:12px}.q5{stroke:currentColor;stroke-width:1.5}.q6{stroke-width:2;stroke-dasharray:7 6}</style><text class="t" x="20" y="28" style="font-size:15px">Too high or too low on final: the right fix</text><text class="s q3" x="20" y="50">The aiming point is where the glide path would hit the ground if you did not flare. Detect a deviation</text><text class="s q3" x="20" y="66.5">early and correct it with power and pitch together.</text><rect class="cl" x="20" y="91" width="690" height="170" rx="8"/><path d="M30 239L700 239" class="dk" style="stroke-width:2.5"/><rect x="560" y="238" width="140" height="8" rx="2" class="cl" style="stroke:currentColor;stroke-width:1.2"/><path d="M40 151L560 239" class="acc" style="stroke-width:3"/><text class="s q4" x="46" y="171">Desired path</text><path d="M40 121L560 239" class="dk q6"/><text class="t q4" x="46" y="111">Too high: less power, nose down</text><path d="M40 203L560 239" class="dk q6"/><text class="t q4" x="46" y="223">Too low: more power, nose up</text><circle cx="560" cy="239" r="5" class="ah"/><text class="s m q2" x="560" y="261">aiming point</text><rect class="cl" x="20" y="273" width="220.67" height="182" rx="8"/><rect x="20" y="273" width="220.67" height="26" rx="10" class="sky q5"/><text class="t q3" x="30" y="291">Too high</text><circle cx="33" cy="309" r="2.2" class="ah"/><text class="s q2" x="42" y="313">Reduce power and lower the nose</text><text class="s q2" x="42" y="328">to hold approach airspeed</text><circle cx="33" cy="342" r="2.2" class="ah"/><text class="s q2" x="42" y="346">Add flaps if available and not</text><text class="s q2" x="42" y="361">fully extended</text><circle cx="33" cy="375" r="2.2" class="ah"/><text class="s q2" x="42" y="379">Or use a forward slip to</text><text class="s q2" x="42" y="394">steepen the descent at the same</text><text class="s q2" x="42" y="409">speed</text><rect class="cl" x="254.67" y="273" width="220.67" height="182" rx="8"/><rect x="254.67" y="273" width="220.67" height="26" rx="10" class="mint q5"/><text class="t q3" x="264.67" y="291">Too low</text><circle cx="267.67" cy="309" r="2.2" class="ah"/><text class="s q2" x="276.67" y="313">Add power and raise the pitch</text><text class="s q2" x="276.67" y="328">to stop the descent and hold</text><text class="s q2" x="276.67" y="343">airspeed</text><circle cx="267.67" cy="357" r="2.2" class="ah"/><text class="s q2" x="276.67" y="361">Level off to intercept the</text><text class="s q2" x="276.67" y="376">path, then reduce power and</text><text class="s q2" x="276.67" y="391">pitch down to stay on it</text><rect class="cl" x="489.33" y="273" width="220.67" height="182" rx="8"/><rect x="489.33" y="273" width="220.67" height="26" rx="10" class="rose q5"/><text class="t q3" x="499.33" y="291">Do not</text><circle cx="502.33" cy="309" r="2.2" class="ah"/><text class="s q2" x="511.33" y="313">Dive at the aiming point: a</text><text class="s q2" x="511.33" y="328">sink rate over 800 to 1,000 fpm</text><text class="s q2" x="511.33" y="343">is excessive</text><circle cx="502.33" cy="357" r="2.2" class="ah"/><text class="s q2" x="511.33" y="361">Retract flaps to stretch a low</text><text class="s q2" x="511.33" y="376">approach: sudden loss of lift</text><text class="s q2" x="511.33" y="391">and a faster sink</text><circle cx="502.33" cy="405" r="2.2" class="ah"/><text class="s q2" x="511.33" y="409">Raise the nose without adding</text><text class="s q2" x="511.33" y="424">power: the airplane slows</text><text class="s q2" x="511.33" y="439">toward a stall</text><text class="t q3" x="20" y="475">Cannot get stabilized? Go around.</text><text class="s" x="20" y="491" style="font-size:11px">Source: Airplane Flying Handbook ch. 9</text></svg>
