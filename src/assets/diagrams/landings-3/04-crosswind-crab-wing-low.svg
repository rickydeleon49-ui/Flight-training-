<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 529" role="img" aria-labelledby="ti de"><title id="ti">Crosswind landing: crab or wing-low</title><desc id="de">Two plan views of an airplane on final with wind from the side: a crab with the nose pointed into the wind, and a wing-low approach with the nose lined up with the runway, plus cards on each method and the crosswind limit.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:17px}.q1{stroke-width:2;opacity:.6}.q2{font-size:11.5px}.q3{font-size:11px}.q4{font-size:13px}.q5{stroke-width:2}.q6{stroke:currentColor;stroke-width:1.4;stroke-linejoin:round}.q7{stroke:currentColor;stroke-width:1.5}.q8{stroke:currentColor;stroke-width:1.2}.q9{stroke-width:1.5;stroke-dasharray:7 6}.q10{stroke:currentColor;stroke-width:1.4}</style><text class="t" x="20" y="28" style="font-size:15px">Crosswind landing: crab or wing-low</text><text class="s q4" x="20" y="50">Both methods work from any crosswind angle. The wing-low method is recommended in most cases, and</text><text class="s q4" x="20" y="66.5">pilots should learn both.</text><rect class="cl" x="20" y="91" width="335" height="204" rx="8"/><text class="t q4" x="30" y="111">Crab method</text><rect x="116" y="125" width="28" height="160" rx="2" class="cl q8"/><path d="M130 127L130 283" class="dk q9"/><path d="M34 161L72 161" class="dk q5"/><path d="M80 161L72 164.6L72 157.4Z" class="dh"/><path d="M34 201L72 201" class="dk q5"/><path d="M80 201L72 204.6L72 197.4Z" class="dh"/><path d="M34 241L72 241" class="dk q5"/><path d="M80 241L72 244.6L72 237.4Z" class="dh"/><text class="s q3" x="32" y="151">wind</text><g transform="translate(130 201) rotate(-105) scale(1.4)"><ellipse cx="0" cy="0" rx="24" ry="5.5" class="sky q10"/><path d="M-20 -2L-29 -13L-22 -13L-12 -3Z" class="sky q6"/><path d="M0 2L8 2L-4 11L-9 11Z" class="cl q6"/></g><text class="s q3" x="205" y="171">Nose points into the wind,</text><text class="s q3" x="205" y="184">ground track follows the</text><text class="s q3" x="205" y="197">centerline</text><text class="s q3" x="205" y="241">Just before touchdown,</text><text class="s q3" x="205" y="254">rudder lines the nose up</text><text class="s q3" x="205" y="267">with the runway</text><rect class="cl" x="375" y="91" width="335" height="204" rx="8"/><text class="t q4" x="385" y="111">Wing-low (sideslip) method</text><rect x="471" y="125" width="28" height="160" rx="2" class="cl q8"/><path d="M485 127L485 283" class="dk q9"/><path d="M389 161L427 161" class="dk q5"/><path d="M435 161L427 164.6L427 157.4Z" class="dh"/><path d="M389 201L427 201" class="dk q5"/><path d="M435 201L427 204.6L427 197.4Z" class="dh"/><path d="M389 241L427 241" class="dk q5"/><path d="M435 241L427 244.6L427 237.4Z" class="dh"/><text class="s q3" x="387" y="151">wind</text><g transform="translate(485 201) rotate(-90) scale(1.4)"><ellipse cx="0" cy="0" rx="24" ry="5.5" class="sky q10"/><path d="M-20 -2L-29 -13L-22 -13L-12 -3Z" class="sky q6"/><path d="M0 2L8 2L-4 11L-9 11Z" class="cl q6"/></g><text class="s q3" x="560" y="161">Nose lined up with the</text><text class="s q3" x="560" y="174">runway with rudder; upwind</text><text class="s q3" x="560" y="187">wing lowered with aileron</text><text class="s q3" x="560" y="200">to stop the drift</text><text class="s q3" x="560" y="241">Upwind main wheel touches</text><text class="s q3" x="560" y="254">first, then the other settles</text><rect class="cl" x="20" y="307" width="220.67" height="182" rx="8"/><rect x="20" y="307" width="220.67" height="26" rx="10" class="sky q7"/><text class="t q4" x="30" y="325">Crab</text><circle cx="33" cy="343" r="2.2" class="ah"/><text class="s q2" x="42" y="347">Easier on final, but needs</text><text class="s q2" x="42" y="362">judgment and precise timing to</text><text class="s q2" x="42" y="377">remove the crab</text><circle cx="33" cy="391" r="2.2" class="ah"/><text class="s q2" x="42" y="395">Removing it too early or too</text><text class="s q2" x="42" y="410">late puts a side load on the</text><text class="s q2" x="42" y="425">gear</text><rect class="cl" x="254.67" y="307" width="220.67" height="182" rx="8"/><rect x="254.67" y="307" width="220.67" height="26" rx="10" class="mint q7"/><text class="t q4" x="264.67" y="325">Wing-low</text><circle cx="267.67" cy="343" r="2.2" class="ah"/><text class="s q2" x="276.67" y="347">Rudder holds the heading;</text><text class="s q2" x="276.67" y="362">aileron holds the track</text><circle cx="267.67" cy="376" r="2.2" class="ah"/><text class="s q2" x="276.67" y="380">Keep the upwind wing down</text><text class="s q2" x="276.67" y="395">through the round out, and add</text><text class="s q2" x="276.67" y="410">more rudder and aileron as</text><text class="s q2" x="276.67" y="425">speed falls</text><circle cx="267.67" cy="439" r="2.2" class="ah"/><text class="s q2" x="276.67" y="443">Long final? Crab first, then</text><text class="s q2" x="276.67" y="458">change to wing-low before the</text><text class="s q2" x="276.67" y="473">round out</text><rect class="cl" x="489.33" y="307" width="220.67" height="182" rx="8"/><rect x="489.33" y="307" width="220.67" height="26" rx="10" class="rose q7"/><text class="t q4" x="499.33" y="325">Know your limit</text><circle cx="502.33" cy="343" r="2.2" class="ah"/><text class="s q2" x="511.33" y="347">A stronger crosswind needs more</text><text class="s q2" x="511.33" y="362">bank and more opposite rudder</text><circle cx="502.33" cy="376" r="2.2" class="ah"/><text class="s q2" x="511.33" y="380">If full opposite rudder cannot</text><text class="s q2" x="511.33" y="395">stop the turn, the wind is too</text><text class="s q2" x="511.33" y="410">strong for that runway: use</text><text class="s q2" x="511.33" y="425">another runway or airport</text><text class="s q3" x="20" y="511">Source: Airplane Flying Handbook ch. 9</text></svg>
