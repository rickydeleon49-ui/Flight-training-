<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 562" role="img" aria-labelledby="ti de"><title id="ti">Entering the pattern at 45 degrees</title><desc id="de">Plan view of a left-hand traffic pattern with a runway and the five legs, and an arrow showing an aircraft joining the downwind leg at 45 degrees toward the runway midpoint, plus cards on entry, downwind and base.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:17px}.q1{stroke-width:2;opacity:.6}.q2{font-size:11.5px}.q3{font-size:12px}.q4{font-size:13px}.q5{font-size:11px}.q6{stroke-width:2.5}.q7{stroke:currentColor;stroke-width:1.4;stroke-linejoin:round}.q8{stroke:currentColor;stroke-width:1.5}</style><text class="t" x="20" y="28" style="font-size:15px">Entering the traffic pattern: 45 degrees to downwind</text><text class="s q4" x="20" y="50">Join the pattern on the downwind leg without cutting across anyone. Left turns are standard unless the</text><text class="s q4" x="20" y="66.5">airport says otherwise, so check its pattern notes before you arrive.</text><rect class="cl" x="20" y="89" width="690" height="236" rx="8"/><rect x="250" y="289" width="270" height="18" rx="3" class="cl" style="stroke:currentColor;stroke-width:1.2"/><text class="s m q5" x="385" y="302">Runway</text><path d="M550 298L550 223" class="dk q6"/><path d="M550 215L553.6 223L546.4 223Z" class="dh"/><path d="M550 213L180 213" class="dk q6"/><path d="M172 213L180 209.4L180 216.6Z" class="dh"/><path d="M170 213L170 288" class="dk q6"/><path d="M170 296L166.4 288L173.6 288Z" class="dh"/><path d="M170 298L240 298" class="dk q6"/><path d="M248 298L240 301.6L240 294.4Z" class="dh"/><path d="M520 298L550 298" class="dk" style="stroke-width:2"/><text class="s q3" x="560" y="255">Crosswind</text><text class="s m q3" x="300" y="205">Downwind (opposite to landing direction)</text><text class="s e q3" x="160" y="255">Base</text><text class="s q3" x="178" y="283">Final</text><text class="s e q3" x="544" y="319">Upwind</text><path d="M455 141L395 202.8" class="acc" style="stroke-width:3"/><path d="M388 210L391.7 199.7L398.2 206Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><g transform="translate(463 133) rotate(135) scale(0.9)"><ellipse cx="0" cy="0" rx="24" ry="5.5" class="sky" style="stroke:currentColor;stroke-width:1.4"/><path d="M-20 -2L-29 -13L-22 -13L-12 -3Z" class="sky q7"/><path d="M0 2L8 2L-4 11L-9 11Z" class="cl q7"/></g><path d="M385 213L385 289" class="dk" style="stroke-width:1.5;stroke-dasharray:7 6"/><text class="s q5" x="391" y="247">point abeam the</text><text class="s q5" x="391" y="260">runway midpoint</text><circle cx="503" cy="135" r="11" class="ah"/><text class="t m" x="503" y="139.33" style="font-size:13px;fill:#fff">1</text><text class="t q3" x="521" y="139">Enter at 45 degrees</text><text class="s q2" x="521" y="154">to the downwind leg</text><text class="s q2" x="40" y="119">Left-hand pattern shown</text><rect class="cl" x="20" y="337" width="338" height="185" rx="8"/><rect x="20" y="337" width="338" height="26" rx="10" class="sky q8"/><text class="t q4" x="30" y="355">Before and on entry</text><circle cx="33" cy="373" r="2.2" class="ah"/><text class="s q2" x="42" y="377">Know the pattern altitude before you enter, and</text><text class="s q2" x="42" y="392">stay clear of the flow until you are on the entry</text><text class="s q2" x="42" y="407">leg</text><circle cx="33" cy="421" r="2.2" class="ah"/><text class="s q2" x="42" y="425">Enter at 45 degrees to the downwind leg, heading</text><text class="s q2" x="42" y="440">for a point abeam the runway midpoint</text><circle cx="33" cy="454" r="2.2" class="ah"/><text class="s q2" x="42" y="458">Make the entry leg long enough to see the whole</text><text class="s q2" x="42" y="473">pattern</text><circle cx="33" cy="487" r="2.2" class="ah"/><text class="s q2" x="42" y="491">Avoid entering while descending: it creates</text><text class="s q2" x="42" y="506">collision hazards</text><rect class="cl" x="372" y="337" width="338" height="185" rx="8"/><rect x="372" y="337" width="338" height="26" rx="10" class="mint q8"/><text class="t q4" x="382" y="355">Downwind and base</text><circle cx="385" cy="373" r="2.2" class="ah"/><text class="s q2" x="394" y="377">Downwind is flown about 1/2 to 1 mile out, at</text><text class="s q2" x="394" y="392">pattern altitude</text><circle cx="385" cy="406" r="2.2" class="ah"/><text class="s q2" x="394" y="410">Finish the before-landing checks on downwind</text><circle cx="385" cy="424" r="2.2" class="ah"/><text class="s q2" x="394" y="428">Start down abeam the approach end, then turn base</text><text class="s q2" x="394" y="443">about 45 degrees past it</text><circle cx="385" cy="457" r="2.2" class="ah"/><text class="s q2" x="394" y="461">Lower aircraft has right of way, but never cut in</text><text class="s q2" x="394" y="476">front of one on final; if the turn to final looks</text><text class="s q2" x="394" y="491">tight, go around</text><text class="s q5" x="20" y="544">Source: Airplane Flying Handbook ch. 8</text></svg>
