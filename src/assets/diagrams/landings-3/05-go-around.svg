<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 494" role="img" aria-labelledby="ti de"><title id="ti">The go-around: power, attitude, configuration</title><desc id="de">A side view of an approach turning into a climb, three step cards for power, attitude and configuration in order, and cards on gear and flap order and on reasons to go around.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:17px}.q1{stroke-width:2;opacity:.6}.q2{font-size:11.5px}.q3{font-size:13px}.q4{stroke:currentColor;stroke-width:1.5}.q5{stroke-width:2.5}.q6{stroke:currentColor;stroke-width:1.4;stroke-linejoin:round}.q7{fill:var(--palette-berry,#A84C6B)}</style><text class="t" x="20" y="28" style="font-size:15px">Go-around: power, attitude, configuration</text><text class="s q3" x="20" y="50">A go-around is a normal maneuver, not a failure. It becomes dangerous only when it is delayed or done</text><text class="s q3" x="20" y="66.5">badly. Decide early.</text><rect class="cl" x="20" y="91" width="690" height="96" rx="8"/><path d="M30 171L700 171" class="dk q5"/><rect x="120" y="170" width="330" height="8" rx="2" class="cl" style="stroke:currentColor;stroke-width:1.2"/><path d="M40 111L300 163" class="acc" style="stroke-width:2.5;stroke-dasharray:7 6"/><path d="M300 163C330 163 345 157 400 131L520 105" class="acc"/><g transform="translate(300 149) rotate(-5) scale(0.9)"><ellipse cx="0" cy="0" rx="24" ry="5.5" class="sky" style="stroke:currentColor;stroke-width:1.4"/><path d="M-20 -2L-29 -13L-22 -13L-12 -3Z" class="sky q6"/><path d="M0 2L8 2L-4 11L-9 11Z" class="cl q6"/></g><text class="t" x="250" y="141" style="font-size:12px">Decide early</text><text class="s" x="560" y="117" style="font-size:12px">Climb away</text><text class="s q2" x="560" y="133">then fly the upwind leg</text><rect class="cl" x="20" y="199" width="218" height="101" rx="8"/><rect x="20" y="199" width="218" height="26" rx="10" class="rose q4"/><text class="t q3" x="30" y="217">1  Power</text><circle cx="33" cy="235" r="2.2" class="ah"/><text class="s q2" x="42" y="239">Smoothly apply full or maximum</text><text class="s q2" x="42" y="254">allowable takeoff power and</text><text class="s q2" x="42" y="269">hold it. Carb heat off if</text><text class="s q2" x="42" y="284">fitted.</text><path d="M241 249.5L245 249.5" class="acc q5"/><path d="M253 249.5L245 253.1L245 245.9Z" class="dh q7"/><rect class="cl" x="256" y="199" width="218" height="101" rx="8"/><rect x="256" y="199" width="218" height="26" rx="10" class="sky q4"/><text class="t q3" x="266" y="217">2  Attitude</text><circle cx="269" cy="235" r="2.2" class="ah"/><text class="s q2" x="278" y="239">Do not pitch up for a climb</text><text class="s q2" x="278" y="254">without speed. Expect to push</text><text class="s q2" x="278" y="269">forward and add right rudder,</text><text class="s q2" x="278" y="284">then rough trim.</text><path d="M477 249.5L481 249.5" class="acc q5"/><path d="M489 249.5L481 253.1L481 245.9Z" class="dh q7"/><rect class="cl" x="492" y="199" width="218" height="101" rx="8"/><rect x="492" y="199" width="218" height="26" rx="10" class="mint q4"/><text class="t q3" x="502" y="217">3  Configuration</text><circle cx="505" cy="235" r="2.2" class="ah"/><text class="s q2" x="514" y="239">Once the descent has stopped,</text><text class="s q2" x="514" y="254">retract flaps in small steps to</text><text class="s q2" x="514" y="269">the takeoff position, as in</text><text class="s q2" x="514" y="284">your POH.</text><rect class="cl" x="20" y="314" width="338" height="140" rx="8"/><rect x="20" y="314" width="338" height="26" rx="10" class="lav q4"/><text class="t q3" x="30" y="332">Then</text><circle cx="33" cy="350" r="2.2" class="ah"/><text class="s q2" x="42" y="354">Gear (if retractable) only after a positive rate of</text><text class="s q2" x="42" y="369">climb and rough trim</text><circle cx="33" cy="383" r="2.2" class="ah"/><text class="s q2" x="42" y="387">Flaps before gear: full flaps cost more drag, and</text><text class="s q2" x="42" y="402">gear down is safer if you touch down</text><circle cx="33" cy="416" r="2.2" class="ah"/><text class="s q2" x="42" y="420">Close to the ground? Ground effect is borrowed</text><text class="s q2" x="42" y="435">performance. Do not climb too early</text><rect class="cl" x="372" y="314" width="338" height="140" rx="8"/><rect x="372" y="314" width="338" height="26" rx="10" class="sky q4"/><text class="t q3" x="382" y="332">Why go around</text><circle cx="385" cy="350" r="2.2" class="ah"/><text class="s q2" x="394" y="354">Runway hazard or ATC request</text><circle cx="385" cy="368" r="2.2" class="ah"/><text class="s q2" x="394" y="372">Overtaking another airplane, wind shear, wake</text><text class="s q2" x="394" y="387">turbulence</text><circle cx="385" cy="401" r="2.2" class="ah"/><text class="s q2" x="394" y="405">Unstable approach</text><circle cx="385" cy="419" r="2.2" class="ah"/><text class="s q2" x="394" y="423">Do not delay out of expectancy ("it will be fine")</text><text class="s q2" x="394" y="438">or pride</text><text class="s" x="20" y="476" style="font-size:11px">Source: Airplane Flying Handbook ch. 9</text></svg>
