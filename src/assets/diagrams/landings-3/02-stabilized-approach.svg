<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 533" role="img" aria-labelledby="ti de"><title id="ti">The stabilized approach</title><desc id="de">Side view of an approach path toward the runway with markers at 500 ft and 300 ft above the ground, and two cards listing the typical stabilized approach criteria from the handbook.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:17px}.q1{stroke-width:2;opacity:.6}.q2{font-size:11.5px}.q3{font-size:13px}.q4{stroke:currentColor;stroke-width:1.4;stroke-linejoin:round}.q5{stroke-width:1.5;stroke-dasharray:7 6}.q6{font-size:11px;fill:#fff}.q7{stroke:currentColor;stroke-width:1.5}</style><text class="t" x="20" y="28" style="font-size:15px">The stabilized approach: what "stabilized" means</text><text class="s q3" x="20" y="50">A stable approach makes the round out and touchdown much easier. Fix deviations early, while the</text><text class="s q3" x="20" y="66.5">corrections are still small.</text><rect class="cl" x="20" y="91" width="690" height="190" rx="8"/><path d="M30 255L700 255" class="dk" style="stroke-width:2.5"/><rect x="470" y="254" width="230" height="8" rx="2" class="cl" style="stroke:currentColor;stroke-width:1.2"/><text class="s m q2" x="585" y="277">Touchdown zone</text><path d="M40 151L500 255" class="acc" style="stroke-width:3;stroke-dasharray:7 6"/><g transform="translate(110 163) rotate(13) scale(0.9)"><ellipse cx="0" cy="0" rx="24" ry="5.5" class="sky" style="stroke:currentColor;stroke-width:1.4"/><path d="M-20 -2L-29 -13L-22 -13L-12 -3Z" class="sky q4"/><path d="M0 2L8 2L-4 11L-9 11Z" class="cl q4"/></g><path d="M214.8 190.52L214.8 255" class="dk q5"/><circle cx="214.8" cy="174.52" r="9" class="ah"/><text class="t m q6" x="214.8" y="178.19">1</text><path d="M398.8 232.12L398.8 255" class="dk q5"/><circle cx="398.8" cy="216.12" r="9" class="ah"/><text class="t m q6" x="398.8" y="219.79">2</text><text class="s q2" x="300" y="117">1  500 ft AGL (VMC): be stabilized by this point</text><text class="s q2" x="300" y="135">2  300 ft AGL: unstabilized below this, go around now</text><text class="s" x="40" y="113" style="font-size:11px">Schematic, not to scale</text><rect class="cl" x="20" y="293" width="338" height="200" rx="8"/><rect x="20" y="293" width="338" height="26" rx="10" class="sky q7"/><text class="t q3" x="30" y="311">Fly this</text><circle cx="33" cy="329" r="2.2" class="ah"/><text class="s q2" x="42" y="333">Glide path: typically a constant 3 degrees to the</text><text class="s q2" x="42" y="348">touchdown zone</text><circle cx="33" cy="362" r="2.2" class="ah"/><text class="s q2" x="42" y="366">Heading: track the centerline, with only minor</text><text class="s q2" x="42" y="381">corrections; bank normally 15 degrees or less on</text><text class="s q2" x="42" y="396">final</text><circle cx="33" cy="410" r="2.2" class="ah"/><text class="s q2" x="42" y="414">Airspeed: within +10/-5 kt of the recommended</text><text class="s q2" x="42" y="429">landing speed</text><circle cx="33" cy="443" r="2.2" class="ah"/><text class="s q2" x="42" y="447">Descent rate: generally 500 to 1,000 fpm in a light</text><text class="s q2" x="42" y="462">airplane; if above 500 fpm, reduce it before 300 ft</text><text class="s q2" x="42" y="477">AGL</text><rect class="cl" x="372" y="293" width="338" height="200" rx="8"/><rect x="372" y="293" width="338" height="26" rx="10" class="mint q7"/><text class="t q3" x="382" y="311">Set up for it</text><circle cx="385" cy="329" r="2.2" class="ah"/><text class="s q2" x="394" y="333">Landing configuration: flaps as required, gear down</text><text class="s q2" x="394" y="348">if retractable, and trimmed</text><circle cx="385" cy="362" r="2.2" class="ah"/><text class="s q2" x="394" y="366">Power appropriate for the configuration, and not</text><text class="s q2" x="394" y="381">below the minimum approach power in the AFM</text><circle cx="385" cy="395" r="2.2" class="ah"/><text class="s q2" x="394" y="399">Briefings and checklists done before the approach,</text><text class="s q2" x="394" y="414">except the landing checklist</text><circle cx="385" cy="428" r="2.2" class="ah"/><text class="s q2" x="394" y="432">No stable approach? The approach is very high or</text><text class="s q2" x="394" y="447">low? Go around.</text><text class="s" x="20" y="515" style="font-size:11px">Source: Airplane Flying Handbook ch. 9</text></svg>
