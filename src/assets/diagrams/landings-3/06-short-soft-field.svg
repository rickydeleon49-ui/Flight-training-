<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 463" role="img" aria-labelledby="ti de"><title id="ti">Short-field and soft-field landings</title><desc id="de">Two side views, one of a stabilized approach over an obstacle for a short field, and one of a power-on level-off a foot or two above the surface for a soft field, with cards on the main points of each.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:17px}.q1{stroke-width:2;opacity:.6}.q2{font-size:11.5px}.q3{font-size:11px}.q4{font-size:13px}.q5{stroke:currentColor;stroke-width:1.4;stroke-linejoin:round}.q6{stroke:currentColor;stroke-width:1.4}.q7{stroke:currentColor;stroke-width:1.5}</style><text class="t" x="20" y="28" style="font-size:15px">Short-field and soft-field landings</text><text class="s q4" x="20" y="50">Both are slow, precise landings, but they aim at different things. Use the procedures and speeds in</text><text class="s q4" x="20" y="66.5">your POH.</text><rect class="cl" x="20" y="91" width="335" height="150" rx="8"/><text class="t q4" x="30" y="111">Short field</text><path d="M30 221L345 221" class="dk" style="stroke-width:2.5"/><path d="M40 141L260 217" class="acc" style="stroke-width:2.5;stroke-dasharray:7 6"/><circle cx="140" cy="211" r="9" class="mint" style="stroke:currentColor;stroke-width:1.2"/><text class="s m q3" x="140" y="237">obstacle</text><g transform="translate(110 163) rotate(18) scale(0.8)"><ellipse cx="0" cy="0" rx="24" ry="5.5" class="sky q6"/><path d="M-20 -2L-29 -13L-22 -13L-12 -3Z" class="sky q5"/><path d="M0 2L8 2L-4 11L-9 11Z" class="cl q5"/></g><text class="s q3" x="195" y="131">Stabilized: the aiming point</text><text class="s q3" x="195" y="144">stays still in the windshield</text><rect class="cl" x="375" y="91" width="335" height="150" rx="8"/><text class="t q4" x="385" y="111">Soft field</text><path d="M385 221L700 221" class="dk" style="stroke-width:2.5"/><path d="M395 141C495 175 565 203 695 211" class="acc"/><g transform="translate(565 195) rotate(3) scale(0.8)"><ellipse cx="0" cy="0" rx="24" ry="5.5" class="sky q6"/><path d="M-20 -2L-29 -13L-22 -13L-12 -3Z" class="sky q5"/><path d="M0 2L8 2L-4 11L-9 11Z" class="cl q5"/></g><text class="s q3" x="587" y="151">power on, 1 to 2 ft up in</text><text class="s q3" x="587" y="164">ground effect, wheels</text><text class="s q3" x="587" y="177">kiss the surface</text><rect class="cl" x="20" y="253" width="338" height="170" rx="8"/><rect x="20" y="253" width="338" height="26" rx="10" class="sky q7"/><text class="t q4" x="30" y="271">Short field</text><circle cx="33" cy="289" r="2.2" class="ah"/><text class="s q2" x="42" y="293">Needs precise control of descent rate and airspeed,</text><text class="s q2" x="42" y="308">with little or no floating</text><circle cx="33" cy="322" r="2.2" class="ah"/><text class="s q2" x="42" y="326">Fly the POH speed; with none, no more than 1.3 VSO</text><text class="s q2" x="42" y="341">(add no more than half the gust factor)</text><circle cx="33" cy="355" r="2.2" class="ah"/><text class="s q2" x="42" y="359">A slightly steeper path over an obstacle puts</text><text class="s q2" x="42" y="374">touchdown closer to it and leaves more room to stop</text><circle cx="33" cy="388" r="2.2" class="ah"/><text class="s q2" x="42" y="392">Excess speed means touching down too far down the</text><text class="s q2" x="42" y="407">runway</text><rect class="cl" x="372" y="253" width="338" height="170" rx="8"/><rect x="372" y="253" width="338" height="26" rx="10" class="mint q7"/><text class="t q4" x="382" y="271">Soft field</text><circle cx="385" cy="289" r="2.2" class="ah"/><text class="s q2" x="394" y="293">Goal: touch down as smoothly and slowly as</text><text class="s q2" x="394" y="308">possible, so the wings carry the weight as long as</text><text class="s q2" x="394" y="323">practical</text><circle cx="385" cy="337" r="2.2" class="ah"/><text class="s q2" x="394" y="341">Keep some power through the level-off and touchdown</text><circle cx="385" cy="355" r="2.2" class="ah"/><text class="s q2" x="394" y="359">Flaps help; do not retract them in the roll, since</text><text class="s q2" x="394" y="374">control comes first</text><text class="s q3" x="20" y="445">Source: Airplane Flying Handbook ch. 9</text></svg>
