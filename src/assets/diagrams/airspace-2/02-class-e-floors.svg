<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 524" role="img" aria-labelledby="ti de"><title id="ti">Class E floors: surface, 700, 1,200 and 14,500</title><desc id="de">Four side-view columns showing where controlled Class E airspace begins. Surface: Class E surface area, magenta dashed line on the chart. 700 feet AGL: magenta shaded edge, used for transition areas at airports with instrument approaches. 1,200 feet AGL: the usual Class E floor away from airports, such as along Victor airways, with Class G below. 14,500 feet MSL: Class E begins where nothing lower is designated, except at and below 1,500 feet AGL. Class G day weather minimum below 1,200 feet is 1 mile and clear of clouds, while Class E needs 3 miles with 500, 1,000 and 2,000 feet. Schematic, not to scale.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.warn{fill:var(--status-overdue,#B0413C);fill-opacity:.35}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.q0{stroke:currentColor;stroke-width:1.5}.h{font-size:15px}.b{font-size:12.5px}.n{font-size:13px}.q1{text-anchor:middle}.q2{stroke-width:1.5}</style><text class="t h" x="20" y="28">Where Class E starts: surface, 700, 1,200 and 14,500</text><text class="s n" x="20" y="48">Class E is controlled airspace; its floor decides your weather minimums. Schematic, not to scale.</text><rect x="20" y="64" width="165" height="352" rx="10" class="o q2"/><text class="t n q1" x="102.5" y="86">Surface</text><text class="s b q1" x="102.5" y="102">Magenta dashed line</text><rect x="30" y="340" width="145" height="14" class="cl"/><rect x="30" y="120" width="145" height="220" class="sky"/><text class="t n q1" x="102.5" y="234">Class E</text><line x1="30" y1="340" x2="175" y2="340" class="acc" style="stroke-width:2.5"/><text class="s b q1" x="102.5" y="372">floor: surface</text><text class="s b q1" x="102.5" y="392">Class E surface area;</text><text class="s b q1" x="102.5" y="407">no Class G below.</text><rect x="195" y="64" width="165" height="352" rx="10" class="o q2"/><text class="t n q1" x="277.5" y="86">700 ft AGL</text><text class="s b q1" x="277.5" y="102">Magenta shaded edge</text><rect x="205" y="340" width="145" height="14" class="cl"/><rect x="205" y="120" width="145" height="196" class="sky"/><text class="t n q1" x="277.5" y="222">Class E</text><rect x="205" y="316" width="145" height="24" class="rose"/><text class="t b q1" x="277.5" y="333">Class G</text><line x1="205" y1="316" x2="350" y2="316" class="acc" style="stroke-width:2.5"/><text class="s b q1" x="277.5" y="372">floor: 700 ft AGL</text><text class="s b q1" x="277.5" y="392">Transition area for</text><text class="s b q1" x="277.5" y="407">instrument approaches.</text><rect x="370" y="64" width="165" height="352" rx="10" class="o q2"/><text class="t n q1" x="452.5" y="86">1,200 ft AGL</text><text class="s b q1" x="452.5" y="102">Usual floor, e.g. airways</text><rect x="380" y="340" width="145" height="14" class="cl"/><rect x="380" y="120" width="145" height="170" class="sky"/><text class="t n q1" x="452.5" y="209">Class E</text><rect x="380" y="290" width="145" height="50" class="rose"/><text class="t b q1" x="452.5" y="320">Class G</text><line x1="380" y1="290" x2="525" y2="290" class="acc" style="stroke-width:2.5"/><text class="s b q1" x="452.5" y="372">floor: 1,200 ft AGL</text><text class="s b q1" x="452.5" y="392">Away from airports.</text><text class="s b q1" x="452.5" y="407">Class G below.</text><rect x="545" y="64" width="165" height="352" rx="10" class="o q2"/><text class="t n q1" x="627.5" y="86">14,500 ft MSL</text><text class="s b q1" x="627.5" y="102">Where none lower is set</text><rect x="555" y="340" width="145" height="14" class="cl"/><rect x="555" y="120" width="145" height="30" class="sky"/><text class="t n q1" x="627.5" y="139">Class E</text><rect x="555" y="150" width="145" height="190" class="rose"/><text class="t b q1" x="627.5" y="245">Class G</text><text class="s b q1" x="627.5" y="261">up to 14,500 ft MSL</text><line x1="555" y1="150" x2="700" y2="150" class="acc" style="stroke-width:2.5"/><text class="s b q1" x="627.5" y="372">floor: 14,500 ft MSL</text><text class="s b q1" x="627.5" y="392">Class E above 14,500 MSL,</text><text class="s b q1" x="627.5" y="407">not at/below 1,500 AGL.</text><text class="t n" x="20" y="446">Why it matters on a VFR flight:</text><text class="s b" x="20" y="464">Class E below 10,000 ft MSL: 3 SM, 500 ft below, 1,000 ft above, 2,000 ft horizontal.</text><text class="s b" x="20" y="480">Class G at or below 1,200 ft AGL by day: 1 SM and clear of clouds. Know which airspace you are in.</text><text class="s b" x="20" y="496">Source: 14 CFR 91.155; AIM 3-2-6; PHAK ch. 15; Aeronautical Chart User's Guide.</text></svg>
