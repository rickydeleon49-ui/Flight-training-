<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 612" role="img" aria-labelledby="ti de"><title id="ti">ATC radar and storms: what it shows and what it cannot</title><desc id="de">A storm cell with a dashed 20 mile ring and an airplane outside it, the four intensity words ATC uses with the two-level and unknown cases, and cards on what radar cannot tell, asking ATC for help and NEXRAD update times.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11.5px}.q1{font-size:13px}.q2{stroke:currentColor;stroke-width:1.2}.q3{stroke:currentColor;stroke-width:1.3}.q4{stroke:currentColor;stroke-width:1.5}.q5{stroke:currentColor;stroke-width:1.4;stroke-linejoin:round}</style><text class="t" x="20" y="28" style="font-size:15px">ATC radar and storms: what it shows and what it cannot</text><text class="s q1" x="20" y="50">ATC can often tell how intense an area of precipitation is. It cannot tell you about turbulence, and</text><text class="s q1" x="20" y="66.5">the picture can be a few minutes old.</text><rect class="cl" x="20" y="89" width="340" height="268" rx="8"/><text class="t" x="32" y="111" style="font-size:12.5px">Within 20 miles of a thunderstorm: great caution</text><circle cx="120" cy="199" r="62" class="acc" style="stroke-width:2;stroke-dasharray:7 5"/><circle cx="108" cy="204" r="17" class="sky q2"/><circle cx="130" cy="193" r="18" class="sky q2"/><circle cx="134" cy="210" r="15" class="sky q2"/><circle cx="117" cy="187" r="14" class="sky q2"/><circle cx="124" cy="201" r="10" class="rose q2"/><text class="s m" x="120" y="275" style="font-size:11px">Thunderstorm</text><path d="M120 199L182 199" class="dk" style="stroke-width:1.5"/><text class="s m" x="166" y="194" style="font-size:11px">20 mi</text><g transform="translate(300 169) rotate(0) scale(0.9)"><ellipse cx="0" cy="0" rx="24" ry="5.5" class="sky" style="stroke:currentColor;stroke-width:1.4"/><path d="M-20 -2L-29 -13L-22 -13L-12 -3Z" class="sky q5"/><path d="M0 2L8 2L-4 11L-9 11Z" class="cl q5"/></g><text class="s m q0" x="300" y="201">Stay clear</text><text class="s q0" x="32" y="303">Turbulence can be much greater than the</text><text class="s q0" x="32" y="318">precipitation intensity suggests, and can occur even</text><text class="s q0" x="32" y="333">in clear air near convective activity.</text><rect class="cl" x="376" y="89" width="334" height="268" rx="8"/><text class="t" x="388" y="111" style="font-size:12.5px">How ATC describes intensity</text><rect x="388" y="123" width="72" height="26" rx="6" class="mint q3"/><text class="t m q0" x="424" y="141">Light</text><rect x="466" y="123" width="72" height="26" rx="6" class="sky q3"/><text class="t m q0" x="502" y="141">Moderate</text><rect x="544" y="123" width="72" height="26" rx="6" class="lav q3"/><text class="t m q0" x="580" y="141">Heavy</text><rect x="622" y="123" width="72" height="26" rx="6" class="rose q3"/><text class="t m q0" x="658" y="141">Extreme</text><text class="s q0" x="388" y="173">Radar with the weather processor (WARP, at ARTCC</text><text class="s q0" x="388" y="188">facilities) uses these four levels. Without it, the</text><text class="s q0" x="388" y="203">narrowband radar shows two: MODERATE and HEAVY TO</text><text class="s q0" x="388" y="218">EXTREME.</text><rect x="388" y="239" width="310" height="26" rx="6" class="cl q3"/><text class="t m q0" x="543" y="257">INTENSITY UNKNOWN</text><text class="s q0" x="388" y="281">Said when equipment cannot show intensity. The</text><text class="s q0" x="388" y="296">controller then gives the position of the</text><text class="s q0" x="388" y="311">precipitation instead.</text><rect class="cl" x="20" y="371" width="220.67" height="227" rx="8"/><rect x="20" y="371" width="220.67" height="26" rx="10" class="rose q4"/><text class="t q1" x="30" y="389">What the radar cannot tell</text><circle cx="33" cy="407" r="2.2" class="ah"/><text class="s q0" x="42" y="411">It cannot tell snow, rain, hail</text><text class="s q0" x="42" y="426">or virga, so ATC calls</text><text class="s q0" x="42" y="441">everything a weather area</text><text class="s q0" x="42" y="456">displays "precipitation".</text><circle cx="33" cy="470" r="2.2" class="ah"/><text class="s q0" x="42" y="474">It cannot detect turbulence.</text><text class="s q0" x="42" y="489">Generally, more intense</text><text class="s q0" x="42" y="504">precipitation means more severe</text><text class="s q0" x="42" y="519">turbulence.</text><circle cx="33" cy="533" r="2.2" class="ah"/><text class="s q0" x="42" y="537">The ARTCC display can be up to</text><text class="s q0" x="42" y="552">6 minutes old.</text><rect class="cl" x="254.67" y="371" width="220.67" height="227" rx="8"/><rect x="254.67" y="371" width="220.67" height="26" rx="10" class="mint q4"/><text class="t q1" x="264.67" y="389">Ask ATC for help</text><circle cx="267.67" cy="407" r="2.2" class="ah"/><text class="s q0" x="276.67" y="411">When ATC advises you of</text><text class="s q0" x="276.67" y="426">weather, acknowledge it, or</text><text class="s q0" x="276.67" y="441">acknowledge it and ask for</text><text class="s q0" x="276.67" y="456">another course of action.</text><circle cx="267.67" cy="470" r="2.2" class="ah"/><text class="s q0" x="276.67" y="474">Ask to deviate: say how many</text><text class="s q0" x="276.67" y="489">miles and which direction. Or</text><text class="s q0" x="276.67" y="504">ask for a new route, a change</text><text class="s q0" x="276.67" y="519">of altitude, or radar vectors</text><text class="s q0" x="276.67" y="534">around the area.</text><circle cx="267.67" cy="548" r="2.2" class="ah"/><text class="s q0" x="276.67" y="552">Separating aircraft comes</text><text class="s q0" x="276.67" y="567">first, so help with weather is</text><text class="s q0" x="276.67" y="582">limited by workload.</text><rect class="cl" x="489.33" y="371" width="220.67" height="227" rx="8"/><rect x="489.33" y="371" width="220.67" height="26" rx="10" class="sky q4"/><text class="t q1" x="499.33" y="389">NEXRAD (Doppler)</text><circle cx="502.33" cy="407" r="2.2" class="ah"/><text class="s q0" x="511.33" y="411">Intensity is measured in dBZ</text><text class="s q0" x="511.33" y="426">and shown in color; the colors</text><text class="s q0" x="511.33" y="441">match ATC intensity terms.</text><circle cx="502.33" cy="455" r="2.2" class="ah"/><text class="s q0" x="511.33" y="459">Clear air mode updates about</text><text class="s q0" x="511.33" y="474">every 10 minutes. Precipitation</text><text class="s q0" x="511.33" y="489">mode, about every 4 to 6</text><text class="s q0" x="511.33" y="504">minutes.</text></svg>
