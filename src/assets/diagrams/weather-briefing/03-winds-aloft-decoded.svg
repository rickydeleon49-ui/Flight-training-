<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 631" role="img" aria-labelledby="ti de"><title id="ti">Winds and temperatures aloft (FB): how to decode a group</title><desc id="de">Five coded wind groups from PHAK decoded step by step, from 2714 to 9900, with cards on the forecast heading, altitudes and the blank spots near the station elevation.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11.5px}.q1{stroke:currentColor;stroke-width:1.4}.q2{font-size:16px;font-family:ui-monospace,Menlo,monospace;font-weight:600}.q3{font-size:10.5px}.q4{font-size:12px}.q5{font-size:13px}.q6{stroke-width:2}.q7{fill:var(--palette-berry,#A84C6B)}.q8{stroke:currentColor;stroke-width:1.5}</style><text class="t" x="20" y="28" style="font-size:15px">Winds and temperatures aloft (FB): how to decode a group</text><text class="s q5" x="20" y="50">The forecast gives wind and temperature at set altitudes for specific places. It is made twice a day</text><text class="s q5" x="20" y="66.5">from the 0000Z and 1200Z upper air observations.</text><text class="t" x="20" y="95" style="font-size:14px">Decoding the groups PHAK shows</text><rect x="26" y="109" width="50" height="30" rx="5" class="sky q1"/><text class="t m q2" x="51" y="130">27</text><text class="s m q3" x="51" y="153">from 270°</text><rect x="80" y="109" width="50" height="30" rx="5" class="mint q1"/><text class="t m q2" x="105" y="130">14</text><text class="s m q3" x="105" y="153">14 knots</text><path d="M144 124L163 124" class="acc q6"/><path d="M170 124L163 127.2L163 120.8Z" class="dh q7"/><text class="s q4" x="180" y="121">Amarillo (AMA) at 6,000 feet: wind from 270° at 14 knots. Four digits are wind only.</text><rect x="26" y="165" width="50" height="30" rx="5" class="sky q1"/><text class="t m q2" x="51" y="186">23</text><text class="s m q3" x="51" y="209">from 230°</text><rect x="80" y="165" width="50" height="30" rx="5" class="mint q1"/><text class="t m q2" x="105" y="186">21</text><text class="s m q3" x="105" y="209">21 knots</text><rect x="134" y="165" width="58" height="30" rx="5" class="rose q1"/><text class="t m q2" x="163" y="186">-04</text><text class="s m q3" x="163" y="209">-4 °C</text><path d="M206 180L225 180" class="acc q6"/><path d="M232 180L225 183.2L225 176.8Z" class="dh q7"/><text class="s q4" x="242" y="177">Denver (DEN) at 9,000 feet: wind from 230° at 21 knots, temperature -4 °C.</text><text class="s q4" x="242" y="192.5">Six digits add the temperature.</text><rect x="26" y="221" width="92" height="30" rx="5" class="sky q1"/><text class="t m q2" x="72" y="242">73</text><text class="s m q3" x="72" y="265">73 - 50 = 23</text><rect x="122" y="221" width="100" height="30" rx="5" class="mint q1"/><text class="t m q2" x="172" y="242">19</text><text class="s m q3" x="172" y="265">19 + 100 = 119</text><rect x="226" y="221" width="58" height="30" rx="5" class="rose q1"/><text class="t m q2" x="255" y="242">60</text><text class="s m q3" x="255" y="265">-60 °C</text><path d="M298 236L317 236" class="acc q6"/><path d="M324 236L317 239.2L317 232.8Z" class="dh q7"/><text class="s q4" x="334" y="233">Speed over 99 knots: the computer adds 50 to the direction</text><text class="s q4" x="334" y="248.5">and subtracts 100 from the speed. Reverse it: 230° at 119</text><text class="s q4" x="334" y="264">knots, -60 °C.</text><rect x="26" y="287.5" width="92" height="30" rx="5" class="sky q1"/><text class="t m q2" x="72" y="308.5">77</text><text class="s m q3" x="72" y="331.5">77 - 50 = 27</text><rect x="122" y="287.5" width="100" height="30" rx="5" class="mint q1"/><text class="t m q2" x="172" y="308.5">99</text><text class="s m q3" x="172" y="331.5">99 + 100 = 199</text><path d="M236 302.5L255 302.5" class="acc q6"/><path d="M262 302.5L255 305.6L255 299.4Z" class="dh q7"/><text class="s q4" x="272" y="299.5">Wind of 200 knots or more is coded as 99: 270° at 199 knots or</text><text class="s q4" x="272" y="315">greater.</text><rect x="26" y="343.5" width="150" height="30" rx="5" class="lav q1"/><text class="t m q2" x="101" y="364.5">9900</text><text class="s m q3" x="101" y="387.5">light and variable</text><path d="M190 358.5L209 358.5" class="acc q6"/><path d="M216 358.5L209 361.6L209 355.4Z" class="dh q7"/><text class="s q4" x="226" y="355.5">Calm, or less than 5 knots: coded 9900, light and variable.</text><rect class="cl" x="20" y="405.5" width="220.67" height="212" rx="8"/><rect x="20" y="405.5" width="220.67" height="26" rx="10" class="sky q8"/><text class="t q5" x="30" y="423.5">Reading the heading</text><circle cx="33" cy="441.5" r="2.2" class="ah"/><text class="s q0" x="42" y="445.5">Wind direction is always from</text><text class="s q0" x="42" y="460.5">true north, speed in knots,</text><text class="s q0" x="42" y="475.5">temperature in degrees Celsius.</text><circle cx="33" cy="489.5" r="2.2" class="ah"/><text class="s q0" x="42" y="493.5">PHAK Figure 13-9: sent on the</text><text class="s q0" x="42" y="508.5">15th at 1640Z, based on 1200Z</text><text class="s q0" x="42" y="523.5">data, valid 1800Z, to be used</text><text class="s q0" x="42" y="538.5">between 1400Z and 2100Z.</text><circle cx="33" cy="552.5" r="2.2" class="ah"/><text class="s q0" x="42" y="556.5">That heading says temperatures</text><text class="s q0" x="42" y="571.5">above FL240 are negative, so</text><text class="s q0" x="42" y="586.5">the minus sign is left off</text><text class="s q0" x="42" y="601.5">them.</text><rect class="cl" x="254.67" y="405.5" width="220.67" height="212" rx="8"/><rect x="254.67" y="405.5" width="220.67" height="26" rx="10" class="lav q8"/><text class="t q5" x="264.67" y="423.5">Altitudes</text><circle cx="267.67" cy="441.5" r="2.2" class="ah"/><text class="s q0" x="276.67" y="445.5">Altitudes through 12,000 feet</text><text class="s q0" x="276.67" y="460.5">are true altitudes.</text><circle cx="267.67" cy="474.5" r="2.2" class="ah"/><text class="s q0" x="276.67" y="478.5">From 18,000 feet up they are</text><text class="s q0" x="276.67" y="493.5">flight levels.</text><rect class="cl" x="489.33" y="405.5" width="220.67" height="212" rx="8"/><rect x="489.33" y="405.5" width="220.67" height="26" rx="10" class="rose q8"/><text class="t q5" x="499.33" y="423.5">Blank spots</text><circle cx="502.33" cy="441.5" r="2.2" class="ah"/><text class="s q0" x="511.33" y="445.5">No wind is forecast for a level</text><text class="s q0" x="511.33" y="460.5">within 1,500 feet of the</text><text class="s q0" x="511.33" y="475.5">station elevation.</text><circle cx="502.33" cy="489.5" r="2.2" class="ah"/><text class="s q0" x="511.33" y="493.5">No temperature is forecast</text><text class="s q0" x="511.33" y="508.5">within 2,500 feet of the</text><text class="s q0" x="511.33" y="523.5">station elevation.</text><circle cx="502.33" cy="537.5" r="2.2" class="ah"/><text class="s q0" x="511.33" y="541.5">So Amarillo (3,605 ft) starts</text><text class="s q0" x="511.33" y="556.5">at 6,000 feet and Denver (5,431</text><text class="s q0" x="511.33" y="571.5">ft) at 9,000 feet.</text></svg>
