<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 631" role="img" aria-labelledby="ti de"><title id="ti">Winds and temperatures aloft (FB): how to decode a group</title><desc id="de">Five coded wind groups from PHAK decoded step by step, from 2714 to 9900, with cards on the forecast heading, altitudes and the blank spots near the station elevation.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><text class="t" x="20" y="28" style="font-size:15px">Winds and temperatures aloft (FB): how to decode a group</text><text class="s" x="20" y="50.0" style="font-size:13px">The forecast gives wind and temperature at set altitudes for specific places. It is made twice a day</text><text class="s" x="20" y="66.5" style="font-size:13px">from the 0000Z and 1200Z upper air observations.</text><text class="t" x="20" y="95.0" style="font-size:14px">Decoding the groups PHAK shows</text><rect x="26" y="109.0" width="50" height="30" rx="5" class="sky" style="stroke:currentColor;stroke-width:1.4"/><text class="t m" x="51.0" y="130.0" style="font-size:16px;font-family:ui-monospace,Menlo,monospace;font-weight:600">27</text><text class="s m" x="51.0" y="153.0" style="font-size:10.5px">from 270°</text><rect x="80" y="109.0" width="50" height="30" rx="5" class="mint" style="stroke:currentColor;stroke-width:1.4"/><text class="t m" x="105.0" y="130.0" style="font-size:16px;font-family:ui-monospace,Menlo,monospace;font-weight:600">14</text><text class="s m" x="105.0" y="153.0" style="font-size:10.5px">14 knots</text><path d="M144 124.0L163.0 124.0" class="acc" style="stroke-width:2"/><path d="M170 124.0L163.0 127.2L163.0 120.8Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><text class="s" x="180" y="121.0" style="font-size:12px">Amarillo (AMA) at 6,000 feet: wind from 270° at 14 knots. Four digits are wind only.</text><rect x="26" y="165.0" width="50" height="30" rx="5" class="sky" style="stroke:currentColor;stroke-width:1.4"/><text class="t m" x="51.0" y="186.0" style="font-size:16px;font-family:ui-monospace,Menlo,monospace;font-weight:600">23</text><text class="s m" x="51.0" y="209.0" style="font-size:10.5px">from 230°</text><rect x="80" y="165.0" width="50" height="30" rx="5" class="mint" style="stroke:currentColor;stroke-width:1.4"/><text class="t m" x="105.0" y="186.0" style="font-size:16px;font-family:ui-monospace,Menlo,monospace;font-weight:600">21</text><text class="s m" x="105.0" y="209.0" style="font-size:10.5px">21 knots</text><rect x="134" y="165.0" width="58" height="30" rx="5" class="rose" style="stroke:currentColor;stroke-width:1.4"/><text class="t m" x="163.0" y="186.0" style="font-size:16px;font-family:ui-monospace,Menlo,monospace;font-weight:600">-04</text><text class="s m" x="163.0" y="209.0" style="font-size:10.5px">-4 °C</text><path d="M206 180.0L225.0 180.0" class="acc" style="stroke-width:2"/><path d="M232 180.0L225.0 183.2L225.0 176.8Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><text class="s" x="242" y="177.0" style="font-size:12px">Denver (DEN) at 9,000 feet: wind from 230° at 21 knots, temperature -4 °C.</text><text class="s" x="242" y="192.5" style="font-size:12px">Six digits add the temperature.</text><rect x="26" y="221.0" width="92" height="30" rx="5" class="sky" style="stroke:currentColor;stroke-width:1.4"/><text class="t m" x="72.0" y="242.0" style="font-size:16px;font-family:ui-monospace,Menlo,monospace;font-weight:600">73</text><text class="s m" x="72.0" y="265.0" style="font-size:10.5px">73 - 50 = 23</text><rect x="122" y="221.0" width="100" height="30" rx="5" class="mint" style="stroke:currentColor;stroke-width:1.4"/><text class="t m" x="172.0" y="242.0" style="font-size:16px;font-family:ui-monospace,Menlo,monospace;font-weight:600">19</text><text class="s m" x="172.0" y="265.0" style="font-size:10.5px">19 + 100 = 119</text><rect x="226" y="221.0" width="58" height="30" rx="5" class="rose" style="stroke:currentColor;stroke-width:1.4"/><text class="t m" x="255.0" y="242.0" style="font-size:16px;font-family:ui-monospace,Menlo,monospace;font-weight:600">60</text><text class="s m" x="255.0" y="265.0" style="font-size:10.5px">-60 °C</text><path d="M298 236.0L317.0 236.0" class="acc" style="stroke-width:2"/><path d="M324 236.0L317.0 239.2L317.0 232.8Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><text class="s" x="334" y="233.0" style="font-size:12px">Speed over 99 knots: the computer adds 50 to the direction</text><text class="s" x="334" y="248.5" style="font-size:12px">and subtracts 100 from the speed. Reverse it: 230° at 119</text><text class="s" x="334" y="264.0" style="font-size:12px">knots, -60 °C.</text><rect x="26" y="287.5" width="92" height="30" rx="5" class="sky" style="stroke:currentColor;stroke-width:1.4"/><text class="t m" x="72.0" y="308.5" style="font-size:16px;font-family:ui-monospace,Menlo,monospace;font-weight:600">77</text><text class="s m" x="72.0" y="331.5" style="font-size:10.5px">77 - 50 = 27</text><rect x="122" y="287.5" width="100" height="30" rx="5" class="mint" style="stroke:currentColor;stroke-width:1.4"/><text class="t m" x="172.0" y="308.5" style="font-size:16px;font-family:ui-monospace,Menlo,monospace;font-weight:600">99</text><text class="s m" x="172.0" y="331.5" style="font-size:10.5px">99 + 100 = 199</text><path d="M236 302.5L255.0 302.5" class="acc" style="stroke-width:2"/><path d="M262 302.5L255.0 305.6L255.0 299.4Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><text class="s" x="272" y="299.5" style="font-size:12px">Wind of 200 knots or more is coded as 99: 270° at 199 knots or</text><text class="s" x="272" y="315.0" style="font-size:12px">greater.</text><rect x="26" y="343.5" width="150" height="30" rx="5" class="lav" style="stroke:currentColor;stroke-width:1.4"/><text class="t m" x="101.0" y="364.5" style="font-size:16px;font-family:ui-monospace,Menlo,monospace;font-weight:600">9900</text><text class="s m" x="101.0" y="387.5" style="font-size:10.5px">light and variable</text><path d="M190 358.5L209.0 358.5" class="acc" style="stroke-width:2"/><path d="M216 358.5L209.0 361.6L209.0 355.4Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><text class="s" x="226" y="355.5" style="font-size:12px">Calm, or less than 5 knots: coded 9900, light and variable.</text><rect class="cl" x="20.0" y="405.5" width="220.66666666666666" height="212.0" rx="8"/><rect x="20.0" y="405.5" width="220.66666666666666" height="26" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30.0" y="423.5" style="font-size:13px">Reading the heading</text><circle cx="33.0" cy="441.5" r="2.2" class="ah"/><text class="s" x="42.0" y="445.5" style="font-size:11.5px">Wind direction is always from</text><text class="s" x="42.0" y="460.5" style="font-size:11.5px">true north, speed in knots,</text><text class="s" x="42.0" y="475.5" style="font-size:11.5px">temperature in degrees Celsius.</text><circle cx="33.0" cy="489.5" r="2.2" class="ah"/><text class="s" x="42.0" y="493.5" style="font-size:11.5px">PHAK Figure 13-9: sent on the</text><text class="s" x="42.0" y="508.5" style="font-size:11.5px">15th at 1640Z, based on 1200Z</text><text class="s" x="42.0" y="523.5" style="font-size:11.5px">data, valid 1800Z, to be used</text><text class="s" x="42.0" y="538.5" style="font-size:11.5px">between 1400Z and 2100Z.</text><circle cx="33.0" cy="552.5" r="2.2" class="ah"/><text class="s" x="42.0" y="556.5" style="font-size:11.5px">That heading says temperatures</text><text class="s" x="42.0" y="571.5" style="font-size:11.5px">above FL240 are negative, so</text><text class="s" x="42.0" y="586.5" style="font-size:11.5px">the minus sign is left off</text><text class="s" x="42.0" y="601.5" style="font-size:11.5px">them.</text><rect class="cl" x="254.66666666666666" y="405.5" width="220.66666666666666" height="212.0" rx="8"/><rect x="254.66666666666666" y="405.5" width="220.66666666666666" height="26" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="264.66666666666663" y="423.5" style="font-size:13px">Altitudes</text><circle cx="267.66666666666663" cy="441.5" r="2.2" class="ah"/><text class="s" x="276.66666666666663" y="445.5" style="font-size:11.5px">Altitudes through 12,000 feet</text><text class="s" x="276.66666666666663" y="460.5" style="font-size:11.5px">are true altitudes.</text><circle cx="267.66666666666663" cy="474.5" r="2.2" class="ah"/><text class="s" x="276.66666666666663" y="478.5" style="font-size:11.5px">From 18,000 feet up they are</text><text class="s" x="276.66666666666663" y="493.5" style="font-size:11.5px">flight levels.</text><rect class="cl" x="489.3333333333333" y="405.5" width="220.66666666666666" height="212.0" rx="8"/><rect x="489.3333333333333" y="405.5" width="220.66666666666666" height="26" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="499.3333333333333" y="423.5" style="font-size:13px">Blank spots</text><circle cx="502.3333333333333" cy="441.5" r="2.2" class="ah"/><text class="s" x="511.3333333333333" y="445.5" style="font-size:11.5px">No wind is forecast for a level</text><text class="s" x="511.3333333333333" y="460.5" style="font-size:11.5px">within 1,500 feet of the</text><text class="s" x="511.3333333333333" y="475.5" style="font-size:11.5px">station elevation.</text><circle cx="502.3333333333333" cy="489.5" r="2.2" class="ah"/><text class="s" x="511.3333333333333" y="493.5" style="font-size:11.5px">No temperature is forecast</text><text class="s" x="511.3333333333333" y="508.5" style="font-size:11.5px">within 2,500 feet of the</text><text class="s" x="511.3333333333333" y="523.5" style="font-size:11.5px">station elevation.</text><circle cx="502.3333333333333" cy="537.5" r="2.2" class="ah"/><text class="s" x="511.3333333333333" y="541.5" style="font-size:11.5px">So Amarillo (3,605 ft) starts</text><text class="s" x="511.3333333333333" y="556.5" style="font-size:11.5px">at 6,000 feet and Denver (5,431</text><text class="s" x="511.3333333333333" y="571.5" style="font-size:11.5px">ft) at 9,000 feet.</text></svg>
