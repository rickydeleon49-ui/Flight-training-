<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 669" role="img" aria-labelledby="ti de"><title id="ti">Inflight advisories: AIRMET, SIGMET and convective SIGMET</title><desc id="de">Three cards comparing what an AIRMET, a SIGMET and a convective SIGMET warn of, the three AIRMET letters Sierra, Tango and Zulu, and the first lines of one PHAK example of each decoded.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><text class="t" x="20" y="28" style="font-size:15px">Inflight advisories: AIRMET, SIGMET and convective SIGMET</text><text class="s" x="20" y="50.0" style="font-size:13px">Inflight weather advisories are forecasts of potentially hazardous weather. They are given to aircraft</text><text class="s" x="20" y="66.5" style="font-size:13px">en route and are also available before departure for planning.</text><rect class="cl" x="20.0" y="89.0" width="220.66666666666666" height="257.0" rx="8"/><rect x="20.0" y="89.0" width="220.66666666666666" height="26" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30.0" y="107.0" style="font-size:13px">AIRMET (WA)</text><circle cx="33.0" cy="125.0" r="2.2" class="ah"/><text class="s" x="42.0" y="129.0" style="font-size:11.5px">Of interest to all aircraft,</text><text class="s" x="42.0" y="144.0" style="font-size:11.5px">but it covers weather hazardous</text><text class="s" x="42.0" y="159.0" style="font-size:11.5px">to light aircraft and aircraft</text><text class="s" x="42.0" y="174.0" style="font-size:11.5px">with limited capability.</text><circle cx="33.0" cy="188.0" r="2.2" class="ah"/><text class="s" x="42.0" y="192.0" style="font-size:11.5px">Moderate icing, moderate</text><text class="s" x="42.0" y="207.0" style="font-size:11.5px">turbulence, sustained surface</text><text class="s" x="42.0" y="222.0" style="font-size:11.5px">winds of 30 knots or more,</text><text class="s" x="42.0" y="237.0" style="font-size:11.5px">widespread ceilings below 1,000</text><text class="s" x="42.0" y="252.0" style="font-size:11.5px">feet and/or visibility below 3</text><text class="s" x="42.0" y="267.0" style="font-size:11.5px">miles, extensive mountain</text><text class="s" x="42.0" y="282.0" style="font-size:11.5px">obscuration.</text><circle cx="33.0" cy="296.0" r="2.2" class="ah"/><text class="s" x="42.0" y="300.0" style="font-size:11.5px">Issued every 6 hours, with</text><text class="s" x="42.0" y="315.0" style="font-size:11.5px">updates as needed.</text><rect class="cl" x="254.66666666666666" y="89.0" width="220.66666666666666" height="257.0" rx="8"/><rect x="254.66666666666666" y="89.0" width="220.66666666666666" height="26" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="264.66666666666663" y="107.0" style="font-size:13px">SIGMET (WS)</text><circle cx="267.66666666666663" cy="125.0" r="2.2" class="ah"/><text class="s" x="276.66666666666663" y="129.0" style="font-size:11.5px">Non-convective weather that is</text><text class="s" x="276.66666666666663" y="144.0" style="font-size:11.5px">potentially hazardous to all</text><text class="s" x="276.66666666666663" y="159.0" style="font-size:11.5px">aircraft.</text><circle cx="267.66666666666663" cy="173.0" r="2.2" class="ah"/><text class="s" x="276.66666666666663" y="177.0" style="font-size:11.5px">Severe icing and severe or</text><text class="s" x="276.66666666666663" y="192.0" style="font-size:11.5px">extreme turbulence (CAT) not</text><text class="s" x="276.66666666666663" y="207.0" style="font-size:11.5px">tied to thunderstorms, dust or</text><text class="s" x="276.66666666666663" y="222.0" style="font-size:11.5px">sandstorms cutting visibility</text><text class="s" x="276.66666666666663" y="237.0" style="font-size:11.5px">below 3 miles, volcanic ash.</text><circle cx="267.66666666666663" cy="251.0" r="2.2" class="ah"/><text class="s" x="276.66666666666663" y="255.0" style="font-size:11.5px">Unscheduled. Valid 4 hours, or</text><text class="s" x="276.66666666666663" y="270.0" style="font-size:11.5px">6 for a hurricane. Identifiers</text><text class="s" x="276.66666666666663" y="285.0" style="font-size:11.5px">run November through Yankee;</text><text class="s" x="276.66666666666663" y="300.0" style="font-size:11.5px">the first issuance is an Urgent</text><text class="s" x="276.66666666666663" y="315.0" style="font-size:11.5px">Weather SIGMET.</text><rect class="cl" x="489.3333333333333" y="89.0" width="220.66666666666666" height="257.0" rx="8"/><rect x="489.3333333333333" y="89.0" width="220.66666666666666" height="26" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="499.3333333333333" y="107.0" style="font-size:13px">Convective SIGMET (WST)</text><circle cx="502.3333333333333" cy="125.0" r="2.2" class="ah"/><text class="s" x="511.3333333333333" y="129.0" style="font-size:11.5px">Hazardous convective weather</text><text class="s" x="511.3333333333333" y="144.0" style="font-size:11.5px">that affects the safety of</text><text class="s" x="511.3333333333333" y="159.0" style="font-size:11.5px">every flight.</text><circle cx="502.3333333333333" cy="173.0" r="2.2" class="ah"/><text class="s" x="511.3333333333333" y="177.0" style="font-size:11.5px">Severe thunderstorms (surface</text><text class="s" x="511.3333333333333" y="192.0" style="font-size:11.5px">winds over 50 knots, hail 3/4</text><text class="s" x="511.3333333333333" y="207.0" style="font-size:11.5px">inch or larger, tornadoes), and</text><text class="s" x="511.3333333333333" y="222.0" style="font-size:11.5px">embedded or lined-up</text><text class="s" x="511.3333333333333" y="237.0" style="font-size:11.5px">thunderstorms or heavy</text><text class="s" x="511.3333333333333" y="252.0" style="font-size:11.5px">precipitation covering 40</text><text class="s" x="511.3333333333333" y="267.0" style="font-size:11.5px">percent or more of a 3,000</text><text class="s" x="511.3333333333333" y="282.0" style="font-size:11.5px">square mile region.</text><circle cx="502.3333333333333" cy="296.0" r="2.2" class="ah"/><text class="s" x="511.3333333333333" y="300.0" style="font-size:11.5px">Issued for the East, West and</text><text class="s" x="511.3333333333333" y="315.0" style="font-size:11.5px">Central US, at 55 minutes past</text><text class="s" x="511.3333333333333" y="330.0" style="font-size:11.5px">each hour. Valid 2 hours.</text><text class="t" x="20" y="366.0" style="font-size:14px">The three AIRMET letters</text><rect x="20.0" y="376.0" width="220.66666666666666" height="62" rx="8" class="sky" style="stroke:currentColor;stroke-width:1.4"/><text class="t" x="32.0" y="396.0" style="font-size:14px">Sierra</text><text class="s" x="32.0" y="413.0" style="font-size:11.5px">IFR and mountain obscuration</text><rect x="254.66666666666666" y="376.0" width="220.66666666666666" height="62" rx="8" class="lav" style="stroke:currentColor;stroke-width:1.4"/><text class="t" x="266.66666666666663" y="396.0" style="font-size:14px">Tango</text><text class="s" x="266.66666666666663" y="413.0" style="font-size:11.5px">Turbulence, strong surface winds</text><text class="s" x="266.66666666666663" y="428.0" style="font-size:11.5px">and low-level wind shear</text><rect x="489.3333333333333" y="376.0" width="220.66666666666666" height="62" rx="8" class="mint" style="stroke:currentColor;stroke-width:1.4"/><text class="t" x="501.3333333333333" y="396.0" style="font-size:14px">Zulu</text><text class="s" x="501.3333333333333" y="413.0" style="font-size:11.5px">Icing and freezing levels</text><text class="t" x="20" y="460.0" style="font-size:14px">Reading the first lines (PHAK examples)</text><rect class="cl" x="20.0" y="470.0" width="220.66666666666666" height="187.0" rx="8"/><rect x="20.0" y="470.0" width="220.66666666666666" height="26" rx="10" class="cl" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30.0" y="488.0" style="font-size:13px">AIRMET</text><text class="t" x="30.0" y="510.0" style="font-size:10.5px;font-family:ui-monospace,Menlo,monospace;font-weight:600">BOSS WA 211945</text><text class="t" x="30.0" y="525.0" style="font-size:10.5px;font-family:ui-monospace,Menlo,monospace;font-weight:600">AIRMET SIERRA UPDT 3</text><text class="t" x="30.0" y="540.0" style="font-size:10.5px;font-family:ui-monospace,Menlo,monospace;font-weight:600">FOR IFR AND MTN OBSCN</text><text class="t" x="30.0" y="555.0" style="font-size:10.5px;font-family:ui-monospace,Menlo,monospace;font-weight:600">VALID UNTIL 220200</text><text class="s" x="30.0" y="578.0" style="font-size:11.5px">Boston area, issued on the 21st</text><text class="s" x="30.0" y="593.0" style="font-size:11.5px">at 1945Z. Sierra: IFR and</text><text class="s" x="30.0" y="608.0" style="font-size:11.5px">mountain obscuration, third</text><text class="s" x="30.0" y="623.0" style="font-size:11.5px">update. Valid until 0200Z on the</text><text class="s" x="30.0" y="638.0" style="font-size:11.5px">22nd.</text><rect class="cl" x="254.66666666666666" y="470.0" width="220.66666666666666" height="187.0" rx="8"/><rect x="254.66666666666666" y="470.0" width="220.66666666666666" height="26" rx="10" class="cl" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="264.66666666666663" y="488.0" style="font-size:13px">SIGMET</text><text class="t" x="264.66666666666663" y="510.0" style="font-size:10.5px;font-family:ui-monospace,Menlo,monospace;font-weight:600">SFOR WS 100130</text><text class="t" x="264.66666666666663" y="525.0" style="font-size:10.5px;font-family:ui-monospace,Menlo,monospace;font-weight:600">SIGMET ROME02</text><text class="t" x="264.66666666666663" y="540.0" style="font-size:10.5px;font-family:ui-monospace,Menlo,monospace;font-weight:600">VALID UNTIL 100530</text><text class="t" x="264.66666666666663" y="555.0" style="font-size:10.5px;font-family:ui-monospace,Menlo,monospace;font-weight:600">OCNL SEV CAT BTN FL280 AND FL350</text><text class="s" x="264.66666666666663" y="578.0" style="font-size:11.5px">Romeo 2, the second issuance for</text><text class="s" x="264.66666666666663" y="593.0" style="font-size:11.5px">this weather. Valid until 0530Z</text><text class="s" x="264.66666666666663" y="608.0" style="font-size:11.5px">on the 10th. Occasional severe</text><text class="s" x="264.66666666666663" y="623.0" style="font-size:11.5px">clear air turbulence between</text><text class="s" x="264.66666666666663" y="638.0" style="font-size:11.5px">FL280 and FL350 expected.</text><rect class="cl" x="489.3333333333333" y="470.0" width="220.66666666666666" height="187.0" rx="8"/><rect x="489.3333333333333" y="470.0" width="220.66666666666666" height="26" rx="10" class="cl" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="499.3333333333333" y="488.0" style="font-size:13px">Convective SIGMET</text><text class="t" x="499.3333333333333" y="510.0" style="font-size:10.5px;font-family:ui-monospace,Menlo,monospace;font-weight:600">MKCC WST 221855</text><text class="t" x="499.3333333333333" y="525.0" style="font-size:10.5px;font-family:ui-monospace,Menlo,monospace;font-weight:600">CONVECTIVE SIGMET 20C</text><text class="t" x="499.3333333333333" y="540.0" style="font-size:10.5px;font-family:ui-monospace,Menlo,monospace;font-weight:600">VALID UNTIL 2055Z</text><text class="s" x="499.3333333333333" y="563.0" style="font-size:11.5px">Central US, issued on the 22nd at</text><text class="s" x="499.3333333333333" y="578.0" style="font-size:11.5px">1855Z. The 20th convective SIGMET</text><text class="s" x="499.3333333333333" y="593.0" style="font-size:11.5px">of the day for the central US.</text><text class="s" x="499.3333333333333" y="608.0" style="font-size:11.5px">Valid until 2055Z.</text></svg>
