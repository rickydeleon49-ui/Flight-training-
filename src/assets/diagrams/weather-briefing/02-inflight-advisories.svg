<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 669" role="img" aria-labelledby="ti de"><title id="ti">Inflight advisories: AIRMET, SIGMET and convective SIGMET</title><desc id="de">Three cards comparing what an AIRMET, a SIGMET and a convective SIGMET warn of, the three AIRMET letters Sierra, Tango and Zulu, and the first lines of one PHAK example of each decoded.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11.5px}.q1{font-size:10.5px;font-family:ui-monospace,Menlo,monospace;font-weight:600}.q2{font-size:13px}.q3{stroke:currentColor;stroke-width:1.5}.q4{font-size:14px}.q5{stroke:currentColor;stroke-width:1.4}</style><text class="t" x="20" y="28" style="font-size:15px">Inflight advisories: AIRMET, SIGMET and convective SIGMET</text><text class="s q2" x="20" y="50">Inflight weather advisories are forecasts of potentially hazardous weather. They are given to aircraft</text><text class="s q2" x="20" y="66.5">en route and are also available before departure for planning.</text><rect class="cl" x="20" y="89" width="220.67" height="257" rx="8"/><rect x="20" y="89" width="220.67" height="26" rx="10" class="sky q3"/><text class="t q2" x="30" y="107">AIRMET (WA)</text><circle cx="33" cy="125" r="2.2" class="ah"/><text class="s q0" x="42" y="129">Of interest to all aircraft,</text><text class="s q0" x="42" y="144">but it covers weather hazardous</text><text class="s q0" x="42" y="159">to light aircraft and aircraft</text><text class="s q0" x="42" y="174">with limited capability.</text><circle cx="33" cy="188" r="2.2" class="ah"/><text class="s q0" x="42" y="192">Moderate icing, moderate</text><text class="s q0" x="42" y="207">turbulence, sustained surface</text><text class="s q0" x="42" y="222">winds of 30 knots or more,</text><text class="s q0" x="42" y="237">widespread ceilings below 1,000</text><text class="s q0" x="42" y="252">feet and/or visibility below 3</text><text class="s q0" x="42" y="267">miles, extensive mountain</text><text class="s q0" x="42" y="282">obscuration.</text><circle cx="33" cy="296" r="2.2" class="ah"/><text class="s q0" x="42" y="300">Issued every 6 hours, with</text><text class="s q0" x="42" y="315">updates as needed.</text><rect class="cl" x="254.67" y="89" width="220.67" height="257" rx="8"/><rect x="254.67" y="89" width="220.67" height="26" rx="10" class="lav q3"/><text class="t q2" x="264.67" y="107">SIGMET (WS)</text><circle cx="267.67" cy="125" r="2.2" class="ah"/><text class="s q0" x="276.67" y="129">Non-convective weather that is</text><text class="s q0" x="276.67" y="144">potentially hazardous to all</text><text class="s q0" x="276.67" y="159">aircraft.</text><circle cx="267.67" cy="173" r="2.2" class="ah"/><text class="s q0" x="276.67" y="177">Severe icing and severe or</text><text class="s q0" x="276.67" y="192">extreme turbulence (CAT) not</text><text class="s q0" x="276.67" y="207">tied to thunderstorms, dust or</text><text class="s q0" x="276.67" y="222">sandstorms cutting visibility</text><text class="s q0" x="276.67" y="237">below 3 miles, volcanic ash.</text><circle cx="267.67" cy="251" r="2.2" class="ah"/><text class="s q0" x="276.67" y="255">Unscheduled. Valid 4 hours, or</text><text class="s q0" x="276.67" y="270">6 for a hurricane. Identifiers</text><text class="s q0" x="276.67" y="285">run November through Yankee;</text><text class="s q0" x="276.67" y="300">the first issuance is an Urgent</text><text class="s q0" x="276.67" y="315">Weather SIGMET.</text><rect class="cl" x="489.33" y="89" width="220.67" height="257" rx="8"/><rect x="489.33" y="89" width="220.67" height="26" rx="10" class="rose q3"/><text class="t q2" x="499.33" y="107">Convective SIGMET (WST)</text><circle cx="502.33" cy="125" r="2.2" class="ah"/><text class="s q0" x="511.33" y="129">Hazardous convective weather</text><text class="s q0" x="511.33" y="144">that affects the safety of</text><text class="s q0" x="511.33" y="159">every flight.</text><circle cx="502.33" cy="173" r="2.2" class="ah"/><text class="s q0" x="511.33" y="177">Severe thunderstorms (surface</text><text class="s q0" x="511.33" y="192">winds over 50 knots, hail 3/4</text><text class="s q0" x="511.33" y="207">inch or larger, tornadoes), and</text><text class="s q0" x="511.33" y="222">embedded or lined-up</text><text class="s q0" x="511.33" y="237">thunderstorms or heavy</text><text class="s q0" x="511.33" y="252">precipitation covering 40</text><text class="s q0" x="511.33" y="267">percent or more of a 3,000</text><text class="s q0" x="511.33" y="282">square mile region.</text><circle cx="502.33" cy="296" r="2.2" class="ah"/><text class="s q0" x="511.33" y="300">Issued for the East, West and</text><text class="s q0" x="511.33" y="315">Central US, at 55 minutes past</text><text class="s q0" x="511.33" y="330">each hour. Valid 2 hours.</text><text class="t q4" x="20" y="366">The three AIRMET letters</text><rect x="20" y="376" width="220.67" height="62" rx="8" class="sky q5"/><text class="t q4" x="32" y="396">Sierra</text><text class="s q0" x="32" y="413">IFR and mountain obscuration</text><rect x="254.67" y="376" width="220.67" height="62" rx="8" class="lav q5"/><text class="t q4" x="266.67" y="396">Tango</text><text class="s q0" x="266.67" y="413">Turbulence, strong surface winds</text><text class="s q0" x="266.67" y="428">and low-level wind shear</text><rect x="489.33" y="376" width="220.67" height="62" rx="8" class="mint q5"/><text class="t q4" x="501.33" y="396">Zulu</text><text class="s q0" x="501.33" y="413">Icing and freezing levels</text><text class="t q4" x="20" y="460">Reading the first lines (PHAK examples)</text><rect class="cl" x="20" y="470" width="220.67" height="187" rx="8"/><rect x="20" y="470" width="220.67" height="26" rx="10" class="cl q3"/><text class="t q2" x="30" y="488">AIRMET</text><text class="t q1" x="30" y="510">BOSS WA 211945</text><text class="t q1" x="30" y="525">AIRMET SIERRA UPDT 3</text><text class="t q1" x="30" y="540">FOR IFR AND MTN OBSCN</text><text class="t q1" x="30" y="555">VALID UNTIL 220200</text><text class="s q0" x="30" y="578">Boston area, issued on the 21st</text><text class="s q0" x="30" y="593">at 1945Z. Sierra: IFR and</text><text class="s q0" x="30" y="608">mountain obscuration, third</text><text class="s q0" x="30" y="623">update. Valid until 0200Z on the</text><text class="s q0" x="30" y="638">22nd.</text><rect class="cl" x="254.67" y="470" width="220.67" height="187" rx="8"/><rect x="254.67" y="470" width="220.67" height="26" rx="10" class="cl q3"/><text class="t q2" x="264.67" y="488">SIGMET</text><text class="t q1" x="264.67" y="510">SFOR WS 100130</text><text class="t q1" x="264.67" y="525">SIGMET ROME02</text><text class="t q1" x="264.67" y="540">VALID UNTIL 100530</text><text class="t q1" x="264.67" y="555">OCNL SEV CAT BTN FL280 AND FL350</text><text class="s q0" x="264.67" y="578">Romeo 2, the second issuance for</text><text class="s q0" x="264.67" y="593">this weather. Valid until 0530Z</text><text class="s q0" x="264.67" y="608">on the 10th. Occasional severe</text><text class="s q0" x="264.67" y="623">clear air turbulence between</text><text class="s q0" x="264.67" y="638">FL280 and FL350 expected.</text><rect class="cl" x="489.33" y="470" width="220.67" height="187" rx="8"/><rect x="489.33" y="470" width="220.67" height="26" rx="10" class="cl q3"/><text class="t q2" x="499.33" y="488">Convective SIGMET</text><text class="t q1" x="499.33" y="510">MKCC WST 221855</text><text class="t q1" x="499.33" y="525">CONVECTIVE SIGMET 20C</text><text class="t q1" x="499.33" y="540">VALID UNTIL 2055Z</text><text class="s q0" x="499.33" y="563">Central US, issued on the 22nd at</text><text class="s q0" x="499.33" y="578">1855Z. The 20th convective SIGMET</text><text class="s q0" x="499.33" y="593">of the day for the central US.</text><text class="s q0" x="499.33" y="608">Valid until 2055Z.</text></svg>
