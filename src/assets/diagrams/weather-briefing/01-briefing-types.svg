<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 765" role="img" aria-labelledby="ti de"><title id="ti">Weather briefings: which one to ask for</title><desc id="de">Three cards for outlook, standard and abbreviated briefings and when to ask for each, a numbered list of the ten items in a standard briefing in order, and a card on what to tell the specialist.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:11.5px}.q1{font-size:12px}.q2{font-size:12px;fill:#fff}.q3{font-size:12.5px}.q4{font-size:13px}.q5{stroke:currentColor;stroke-width:1.5}</style><text class="t" x="20" y="28" style="font-size:15px">Weather briefings: which one to ask for</text><text class="s q4" x="20" y="50">Before every flight, get a weather briefing from a specialist at flight service (FSS). Tell the</text><text class="s q4" x="20" y="66.5">specialist which of the three types you need: standard, abbreviated or outlook.</text><text class="t" x="20" y="95" style="font-size:14px">Pick the briefing by when you are leaving</text><rect class="cl" x="20" y="105" width="220.67" height="227" rx="8"/><rect x="20" y="105" width="220.67" height="26" rx="10" class="lav q5"/><text class="t q4" x="30" y="123">Outlook briefing</text><circle cx="33" cy="141" r="2.2" class="ah"/><text class="s q0" x="42" y="145">Ask for it when the planned</text><text class="s q0" x="42" y="160">departure is 6 hours or more</text><text class="s q0" x="42" y="175">away.</text><circle cx="33" cy="189" r="2.2" class="ah"/><text class="s q0" x="42" y="193">Initial forecast information,</text><text class="s q0" x="42" y="208">limited in scope: it rests on</text><text class="s q0" x="42" y="223">weather trends and existing</text><text class="s q0" x="42" y="238">weather near the departure</text><text class="s q0" x="42" y="253">airport.</text><circle cx="33" cy="267" r="2.2" class="ah"/><text class="s q0" x="42" y="271">Good for deciding route,</text><text class="s q0" x="42" y="286">altitude and the go/no-go. Ask</text><text class="s q0" x="42" y="301">for a follow-up briefing before</text><text class="s q0" x="42" y="316">you leave.</text><rect class="cl" x="254.67" y="105" width="220.67" height="227" rx="8"/><rect x="254.67" y="105" width="220.67" height="26" rx="10" class="sky q5"/><text class="t q4" x="264.67" y="123">Standard briefing</text><circle cx="267.67" cy="141" r="2.2" class="ah"/><text class="s q0" x="276.67" y="145">Get one before the departure of</text><text class="s q0" x="276.67" y="160">any flight, and use it in</text><text class="s q0" x="276.67" y="175">flight planning.</text><circle cx="267.67" cy="189" r="2.2" class="ah"/><text class="s q0" x="276.67" y="193">The most complete information</text><text class="s q0" x="276.67" y="208">and weather picture.</text><circle cx="267.67" cy="222" r="2.2" class="ah"/><text class="s q0" x="276.67" y="226">Getting it near departure time</text><text class="s q0" x="276.67" y="241">means you have the latest</text><text class="s q0" x="276.67" y="256">information.</text><rect class="cl" x="489.33" y="105" width="220.67" height="227" rx="8"/><rect x="489.33" y="105" width="220.67" height="26" rx="10" class="mint q5"/><text class="t q4" x="499.33" y="123">Abbreviated briefing</text><circle cx="502.33" cy="141" r="2.2" class="ah"/><text class="s q0" x="511.33" y="145">A shortened version of the</text><text class="s q0" x="511.33" y="160">standard briefing.</text><circle cx="502.33" cy="174" r="2.2" class="ah"/><text class="s q0" x="511.33" y="178">Ask for it when departure has</text><text class="s q0" x="511.33" y="193">been delayed, or to update a</text><text class="s q0" x="511.33" y="208">previous briefing.</text><circle cx="502.33" cy="222" r="2.2" class="ah"/><text class="s q0" x="511.33" y="226">Tell the specialist the time</text><text class="s q0" x="511.33" y="241">and source of your last</text><text class="s q0" x="511.33" y="256">briefing so nothing is left</text><text class="s q0" x="511.33" y="271">out.</text><text class="t" x="20" y="352" style="font-size:14px">A standard briefing, in order (when it applies to your route)</text><circle cx="35" cy="376" r="11" class="ah"/><text class="t m q2" x="35" y="380">1</text><text class="t q3" x="54" y="380">Adverse conditions</text><text class="s q1" x="54" y="396">Significant weather such as thunderstorms or</text><text class="s q1" x="54" y="411.5">icing, or items like airport closings.</text><circle cx="35" cy="433" r="11" class="ah"/><text class="t m q2" x="35" y="437">2</text><text class="t q3" x="54" y="437">VFR flight not recommended</text><text class="s q1" x="54" y="453">Said when weather is below VFR minimums or the</text><text class="s q1" x="54" y="468.5">flight is doubtful under VFR. The decision stays</text><text class="s q1" x="54" y="484">yours, but weigh the advice carefully.</text><circle cx="35" cy="505.5" r="11" class="ah"/><text class="t m q2" x="35" y="509.5">3</text><text class="t q3" x="54" y="509.5">Synopsis</text><text class="s q1" x="54" y="525.5">The larger weather picture: fronts and major</text><text class="s q1" x="54" y="541">weather systems in your area.</text><circle cx="35" cy="562.5" r="11" class="ah"/><text class="t m q2" x="35" y="566.5">4</text><text class="t q3" x="54" y="566.5">Current conditions</text><text class="s q1" x="54" y="582.5">Ceilings, visibility, winds and temperatures.</text><text class="s q1" x="54" y="598">Left out if departure is more than 2 hours away.</text><circle cx="35" cy="619.5" r="11" class="ah"/><text class="t m q2" x="35" y="623.5">5</text><text class="t q3" x="54" y="623.5">En route forecast</text><text class="s q1" x="54" y="639.5">A summary of the forecast for your route.</text><circle cx="387" cy="376" r="11" class="ah"/><text class="t m q2" x="387" y="380">6</text><text class="t q3" x="406" y="380">Destination forecast</text><text class="s q1" x="406" y="396">The expected weather at the airport for your</text><text class="s q1" x="406" y="411.5">estimated time of arrival.</text><circle cx="387" cy="433" r="11" class="ah"/><text class="t m q2" x="387" y="437">7</text><text class="t q3" x="406" y="437">Winds and temperatures aloft</text><text class="s q1" x="406" y="453">Winds at specific altitudes along the route.</text><text class="s q1" x="406" y="468.5">Temperatures only on request.</text><circle cx="387" cy="490" r="11" class="ah"/><text class="t m q2" x="387" y="494">8</text><text class="t q3" x="406" y="494">NOTAMs</text><text class="s q1" x="406" y="510">Route items not yet in the NOTAM publication.</text><text class="s q1" x="406" y="525.5">Published NOTAMs only when you ask.</text><circle cx="387" cy="547" r="11" class="ah"/><text class="t m q2" x="387" y="551">9</text><text class="t q3" x="406" y="551">ATC delays</text><text class="s q1" x="406" y="567">Any known delay that may affect the flight.</text><circle cx="387" cy="588.5" r="11" class="ah"/><text class="t m q2" x="387" y="592.5">10</text><text class="t q3" x="406" y="592.5">Other information</text><text class="s q1" x="406" y="608.5">Frequencies to open a flight plan and to reach</text><text class="s q1" x="406" y="624">EFAS, plus anything else you ask for.</text><rect class="cl" x="20" y="667" width="690" height="92.5" rx="8"/><rect x="20" y="667" width="690" height="26" rx="10" class="rose q5"/><text class="t q4" x="30" y="685">Have this ready when you call</text><text class="s q1" x="30" y="711">Whether the flight is VFR or IFR, aircraft identification and type, departure point, estimated time of</text><text class="s q1" x="30" y="726.5">departure (ETD), altitude, route, destination and estimated time en route (ETE). It is recorded with a note</text><text class="s q1" x="30" y="742">of the briefing you got, and used if you change the plan or are overdue.</text></svg>
