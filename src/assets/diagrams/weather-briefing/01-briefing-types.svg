<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 765" role="img" aria-labelledby="ti de"><title id="ti">Weather briefings: which one to ask for</title><desc id="de">Three cards for outlook, standard and abbreviated briefings and when to ask for each, a numbered list of the ten items in a standard briefing in order, and a card on what to tell the specialist.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><text class="t" x="20" y="28" style="font-size:15px">Weather briefings: which one to ask for</text><text class="s" x="20" y="50.0" style="font-size:13px">Before every flight, get a weather briefing from a specialist at flight service (FSS). Tell the</text><text class="s" x="20" y="66.5" style="font-size:13px">specialist which of the three types you need: standard, abbreviated or outlook.</text><text class="t" x="20" y="95.0" style="font-size:14px">Pick the briefing by when you are leaving</text><rect class="cl" x="20.0" y="105.0" width="220.66666666666666" height="227.0" rx="8"/><rect x="20.0" y="105.0" width="220.66666666666666" height="26" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30.0" y="123.0" style="font-size:13px">Outlook briefing</text><circle cx="33.0" cy="141.0" r="2.2" class="ah"/><text class="s" x="42.0" y="145.0" style="font-size:11.5px">Ask for it when the planned</text><text class="s" x="42.0" y="160.0" style="font-size:11.5px">departure is 6 hours or more</text><text class="s" x="42.0" y="175.0" style="font-size:11.5px">away.</text><circle cx="33.0" cy="189.0" r="2.2" class="ah"/><text class="s" x="42.0" y="193.0" style="font-size:11.5px">Initial forecast information,</text><text class="s" x="42.0" y="208.0" style="font-size:11.5px">limited in scope: it rests on</text><text class="s" x="42.0" y="223.0" style="font-size:11.5px">weather trends and existing</text><text class="s" x="42.0" y="238.0" style="font-size:11.5px">weather near the departure</text><text class="s" x="42.0" y="253.0" style="font-size:11.5px">airport.</text><circle cx="33.0" cy="267.0" r="2.2" class="ah"/><text class="s" x="42.0" y="271.0" style="font-size:11.5px">Good for deciding route,</text><text class="s" x="42.0" y="286.0" style="font-size:11.5px">altitude and the go/no-go. Ask</text><text class="s" x="42.0" y="301.0" style="font-size:11.5px">for a follow-up briefing before</text><text class="s" x="42.0" y="316.0" style="font-size:11.5px">you leave.</text><rect class="cl" x="254.66666666666666" y="105.0" width="220.66666666666666" height="227.0" rx="8"/><rect x="254.66666666666666" y="105.0" width="220.66666666666666" height="26" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="264.66666666666663" y="123.0" style="font-size:13px">Standard briefing</text><circle cx="267.66666666666663" cy="141.0" r="2.2" class="ah"/><text class="s" x="276.66666666666663" y="145.0" style="font-size:11.5px">Get one before the departure of</text><text class="s" x="276.66666666666663" y="160.0" style="font-size:11.5px">any flight, and use it in</text><text class="s" x="276.66666666666663" y="175.0" style="font-size:11.5px">flight planning.</text><circle cx="267.66666666666663" cy="189.0" r="2.2" class="ah"/><text class="s" x="276.66666666666663" y="193.0" style="font-size:11.5px">The most complete information</text><text class="s" x="276.66666666666663" y="208.0" style="font-size:11.5px">and weather picture.</text><circle cx="267.66666666666663" cy="222.0" r="2.2" class="ah"/><text class="s" x="276.66666666666663" y="226.0" style="font-size:11.5px">Getting it near departure time</text><text class="s" x="276.66666666666663" y="241.0" style="font-size:11.5px">means you have the latest</text><text class="s" x="276.66666666666663" y="256.0" style="font-size:11.5px">information.</text><rect class="cl" x="489.3333333333333" y="105.0" width="220.66666666666666" height="227.0" rx="8"/><rect x="489.3333333333333" y="105.0" width="220.66666666666666" height="26" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="499.3333333333333" y="123.0" style="font-size:13px">Abbreviated briefing</text><circle cx="502.3333333333333" cy="141.0" r="2.2" class="ah"/><text class="s" x="511.3333333333333" y="145.0" style="font-size:11.5px">A shortened version of the</text><text class="s" x="511.3333333333333" y="160.0" style="font-size:11.5px">standard briefing.</text><circle cx="502.3333333333333" cy="174.0" r="2.2" class="ah"/><text class="s" x="511.3333333333333" y="178.0" style="font-size:11.5px">Ask for it when departure has</text><text class="s" x="511.3333333333333" y="193.0" style="font-size:11.5px">been delayed, or to update a</text><text class="s" x="511.3333333333333" y="208.0" style="font-size:11.5px">previous briefing.</text><circle cx="502.3333333333333" cy="222.0" r="2.2" class="ah"/><text class="s" x="511.3333333333333" y="226.0" style="font-size:11.5px">Tell the specialist the time</text><text class="s" x="511.3333333333333" y="241.0" style="font-size:11.5px">and source of your last</text><text class="s" x="511.3333333333333" y="256.0" style="font-size:11.5px">briefing so nothing is left</text><text class="s" x="511.3333333333333" y="271.0" style="font-size:11.5px">out.</text><text class="t" x="20" y="352.0" style="font-size:14px">A standard briefing, in order (when it applies to your route)</text><circle cx="35" cy="376.0" r="11" class="ah"/><text class="t m" x="35" y="380.0" style="font-size:12px;fill:#fff">1</text><text class="t" x="54" y="380.0" style="font-size:12.5px">Adverse conditions</text><text class="s" x="54" y="396.0" style="font-size:12px">Significant weather such as thunderstorms or</text><text class="s" x="54" y="411.5" style="font-size:12px">icing, or items like airport closings.</text><circle cx="35" cy="433.0" r="11" class="ah"/><text class="t m" x="35" y="437.0" style="font-size:12px;fill:#fff">2</text><text class="t" x="54" y="437.0" style="font-size:12.5px">VFR flight not recommended</text><text class="s" x="54" y="453.0" style="font-size:12px">Said when weather is below VFR minimums or the</text><text class="s" x="54" y="468.5" style="font-size:12px">flight is doubtful under VFR. The decision stays</text><text class="s" x="54" y="484.0" style="font-size:12px">yours, but weigh the advice carefully.</text><circle cx="35" cy="505.5" r="11" class="ah"/><text class="t m" x="35" y="509.5" style="font-size:12px;fill:#fff">3</text><text class="t" x="54" y="509.5" style="font-size:12.5px">Synopsis</text><text class="s" x="54" y="525.5" style="font-size:12px">The larger weather picture: fronts and major</text><text class="s" x="54" y="541.0" style="font-size:12px">weather systems in your area.</text><circle cx="35" cy="562.5" r="11" class="ah"/><text class="t m" x="35" y="566.5" style="font-size:12px;fill:#fff">4</text><text class="t" x="54" y="566.5" style="font-size:12.5px">Current conditions</text><text class="s" x="54" y="582.5" style="font-size:12px">Ceilings, visibility, winds and temperatures.</text><text class="s" x="54" y="598.0" style="font-size:12px">Left out if departure is more than 2 hours away.</text><circle cx="35" cy="619.5" r="11" class="ah"/><text class="t m" x="35" y="623.5" style="font-size:12px;fill:#fff">5</text><text class="t" x="54" y="623.5" style="font-size:12.5px">En route forecast</text><text class="s" x="54" y="639.5" style="font-size:12px">A summary of the forecast for your route.</text><circle cx="387" cy="376.0" r="11" class="ah"/><text class="t m" x="387" y="380.0" style="font-size:12px;fill:#fff">6</text><text class="t" x="406" y="380.0" style="font-size:12.5px">Destination forecast</text><text class="s" x="406" y="396.0" style="font-size:12px">The expected weather at the airport for your</text><text class="s" x="406" y="411.5" style="font-size:12px">estimated time of arrival.</text><circle cx="387" cy="433.0" r="11" class="ah"/><text class="t m" x="387" y="437.0" style="font-size:12px;fill:#fff">7</text><text class="t" x="406" y="437.0" style="font-size:12.5px">Winds and temperatures aloft</text><text class="s" x="406" y="453.0" style="font-size:12px">Winds at specific altitudes along the route.</text><text class="s" x="406" y="468.5" style="font-size:12px">Temperatures only on request.</text><circle cx="387" cy="490.0" r="11" class="ah"/><text class="t m" x="387" y="494.0" style="font-size:12px;fill:#fff">8</text><text class="t" x="406" y="494.0" style="font-size:12.5px">NOTAMs</text><text class="s" x="406" y="510.0" style="font-size:12px">Route items not yet in the NOTAM publication.</text><text class="s" x="406" y="525.5" style="font-size:12px">Published NOTAMs only when you ask.</text><circle cx="387" cy="547.0" r="11" class="ah"/><text class="t m" x="387" y="551.0" style="font-size:12px;fill:#fff">9</text><text class="t" x="406" y="551.0" style="font-size:12.5px">ATC delays</text><text class="s" x="406" y="567.0" style="font-size:12px">Any known delay that may affect the flight.</text><circle cx="387" cy="588.5" r="11" class="ah"/><text class="t m" x="387" y="592.5" style="font-size:12px;fill:#fff">10</text><text class="t" x="406" y="592.5" style="font-size:12.5px">Other information</text><text class="s" x="406" y="608.5" style="font-size:12px">Frequencies to open a flight plan and to reach</text><text class="s" x="406" y="624.0" style="font-size:12px">EFAS, plus anything else you ask for.</text><rect class="cl" x="20" y="667.0" width="690" height="92.5" rx="8"/><rect x="20" y="667.0" width="690" height="26" rx="10" class="rose" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30" y="685.0" style="font-size:13px">Have this ready when you call</text><text class="s" x="30" y="711.0" style="font-size:12px">Whether the flight is VFR or IFR, aircraft identification and type, departure point, estimated time of</text><text class="s" x="30" y="726.5" style="font-size:12px">departure (ETD), altitude, route, destination and estimated time en route (ETE). It is recorded with a note</text><text class="s" x="30" y="742.0" style="font-size:12px">of the briefing you got, and used if you change the plan or are overdue.</text></svg>
