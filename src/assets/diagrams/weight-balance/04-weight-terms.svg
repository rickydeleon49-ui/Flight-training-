<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 623" role="img" aria-labelledby="ti de"><title id="ti">Weight terms: empty weight, useful load, payload, ramp, takeoff, landing</title><desc id="de">Basic empty weight (standard empty weight plus installed optional and special equipment) plus useful load makes up the maximum allowable gross weight. Useful load is the weight of pilot, copilot, passengers, baggage, usable fuel and drainable oil; payload is occupants, cargo and baggage. Maximum ramp weight, also called taxi weight, includes all fuel and is greater than takeoff weight because of fuel burned during taxi and run-up. Maximum takeoff weight is the maximum allowable for takeoff, maximum landing weight is the greatest normally allowed at landing, and maximum zero fuel weight is the maximum weight exclusive of usable fuel. Standard weights per US gallon: gasoline 6 pounds, Jet A and Jet A-1 6.8, Jet B 6.5, oil 7.5, water 8.35.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:12px}.q1{font-size:11.5px}.q2{stroke:currentColor;stroke-width:1.5}.q3{font-size:12.5px}.q4{font-size:13px}</style><text class="t" x="20" y="28" style="font-size:15px">Weight terms: empty weight, useful load, payload, ramp, takeoff, landing</text><text class="s q4" x="20" y="50">Definitions as PHAK gives them. Bar lengths are schematic, not to scale.</text><rect class="cl" x="20" y="72.5" width="690" height="262" rx="8"/><text class="t q4" x="32" y="94.5">Building up to the maximum weight</text><rect x="40" y="108.5" width="210" height="44" rx="10" class="sky q2"/><text class="t m q3" x="145" y="134.67">Basic empty weight</text><rect x="250" y="108.5" width="440" height="44" rx="10" class="mint q2"/><text class="t m q3" x="470" y="134.67">Useful load</text><text class="t m q3" x="365" y="172.5">Basic empty weight + useful load = maximum allowable gross weight</text><rect x="250" y="190.5" width="250" height="40" rx="10" class="lav q2"/><text class="t m q3" x="375" y="214.67">Payload</text><rect x="500" y="190.5" width="190" height="40" rx="10" class="rose q2"/><text class="t m q0" x="595" y="207">Usable fuel,</text><text class="t m q0" x="595" y="222">drainable oil</text><text class="s m q1" x="375" y="246.5">occupants, cargo, baggage</text><text class="s q1" x="254" y="268.5">Useful load: pilot, copilot, passengers, baggage, usable fuel and</text><text class="s q1" x="254" y="283.5">drainable oil. It is the basic empty weight subtracted from the maximum</text><text class="s q1" x="254" y="298.5">allowable gross weight (GA aircraft only).</text><text class="s q1" x="40" y="198.5">Basic empty weight: standard</text><text class="s q1" x="40" y="213.5">empty weight plus installed</text><text class="s q1" x="40" y="228.5">optional and special equipment.</text><text class="s q1" x="40" y="251.5">Standard empty weight: airframe,</text><text class="s q1" x="40" y="266.5">engines, permanently installed</text><text class="s q1" x="40" y="281.5">fixed-location equipment, fixed</text><text class="s q1" x="40" y="296.5">ballast, hydraulic fluid,</text><text class="s q1" x="40" y="311.5">unusable fuel, full engine oil.</text><rect x="20" y="344.5" width="337" height="24" rx="10" class="sky q2"/><text class="t q4" x="30" y="361.5">Maximum weights</text><circle cx="31" cy="382.5" r="2.2" class="ah"/><text class="s q0" x="40" y="386.5">Maximum ramp weight (taxi weight): the total</text><text class="s q0" x="40" y="402">weight of the loaded aircraft including all fuel;</text><text class="s q0" x="40" y="417.5">greater than takeoff weight because of fuel</text><text class="s q0" x="40" y="433">burned during taxi and run-up</text><circle cx="31" cy="448.5" r="2.2" class="ah"/><text class="s q0" x="40" y="452.5">Maximum takeoff weight: the maximum allowable</text><text class="s q0" x="40" y="468">weight for takeoff</text><circle cx="31" cy="483.5" r="2.2" class="ah"/><text class="s q0" x="40" y="487.5">Maximum landing weight: the greatest weight</text><text class="s q0" x="40" y="503">normally allowed at landing</text><circle cx="31" cy="518.5" r="2.2" class="ah"/><text class="s q0" x="40" y="522.5">Maximum zero fuel weight: the maximum weight</text><text class="s q0" x="40" y="538">exclusive of usable fuel</text><rect x="373" y="344.5" width="337" height="24" rx="10" class="lav q2"/><text class="t q4" x="383" y="361.5">Other things on the weight sheet</text><circle cx="384" cy="382.5" r="2.2" class="ah"/><text class="s q0" x="393" y="386.5">Fuel load: only usable fuel, not fuel to fill the</text><text class="s q0" x="393" y="402">lines or trapped in the tank sumps</text><circle cx="384" cy="417.5" r="2.2" class="ah"/><text class="s q0" x="393" y="421.5">Licensed empty weight: airframe, engines,</text><text class="s q0" x="393" y="437">unusable fuel, undrainable oil, equipment on the</text><text class="s q0" x="393" y="452.5">equipment list; an older term used before GAMA</text><text class="s q0" x="393" y="468">standardization</text><circle cx="384" cy="483.5" r="2.2" class="ah"/><text class="s q0" x="393" y="487.5">Standard weights: do not use them if actual</text><text class="s q0" x="393" y="503">weights are available</text><rect class="cl" x="20" y="561.5" width="690" height="52" rx="8"/><text class="t q3" x="32" y="581.5">Standard weights per US gallon</text><text class="s q0" x="32" y="601.5">Gasoline: 6 lb</text><text class="s q0" x="168" y="601.5">Jet A, Jet A-1: 6.8 lb</text><text class="s q0" x="304" y="601.5">Jet B: 6.5 lb</text><text class="s q0" x="440" y="601.5">Oil: 7.5 lb</text><text class="s q0" x="576" y="601.5">Water: 8.35 lb</text></svg>
