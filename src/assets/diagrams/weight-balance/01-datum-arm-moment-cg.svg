<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 577" role="img" aria-labelledby="ti de"><title id="ti">Weight and balance terms: datum, arm, moment, CG</title><desc id="de">A board balances about the datum. A 50 pound weight at station 100 inches gives a moment of 5,000 inch-pounds (50 times 100). A 100 pound weight at 25 inches and a 50 pound weight at 50 inches on the other side give 2,500 plus 2,500, which is also 5,000 inch-pounds, so the board balances. Definitions: the datum is an imaginary vertical plane or line from which all arms are measured, set by the manufacturer. Arm is the horizontal distance in inches from the datum to the CG of an item, plus aft of the datum and minus forward. A station is a location named by its distance in inches from the datum, and the datum is station zero. Moment is weight times arm in inch-pounds. The center of gravity is the point about which the aircraft would balance, where the entire weight is assumed concentrated; it may be given in inches from the datum or percent of MAC.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}</style><text class="t" x="20" y="28" style="font-size:15px">Weight and balance terms: datum, arm, moment, CG</text><text class="s" x="20" y="50.0" style="font-size:13px">PHAK board example (Figures 10-3 and 10-4). Distances are measured from the datum. Schematic, not to</text><text class="s" x="20" y="66.5" style="font-size:13px">scale.</text><rect class="cl" x="20" y="89.0" width="690" height="292" rx="8"/><rect class="cl" x="150" y="259.0" width="510" height="12" style="stroke:currentColor;stroke-width:1.6"/><path d="M330 271.0L315 299.0L345 299.0Z" class="ah"/><text class="t m" x="330" y="335.0" style="font-size:12.5px">datum: station 0 (balance point)</text><rect x="599.0" y="189.0" width="62" height="34" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="630.0" y="210.33333333333334" style="font-size:13px">50 lb</text><path d="M630.0 223.0L630.0 252.0" class="dk" style="stroke-width:2"/><path d="M630.0 258.0L627.3 252.0L632.7 252.0Z" class="dh" style=""/><rect x="224.0" y="189.0" width="62" height="34" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="255.0" y="210.33333333333334" style="font-size:13px">100 lb</text><path d="M255.0 223.0L255.0 252.0" class="dk" style="stroke-width:2"/><path d="M255.0 258.0L252.3 252.0L257.7 252.0Z" class="dh" style=""/><rect x="149.0" y="189.0" width="62" height="34" rx="10" class="mint" style="stroke:currentColor;stroke-width:1.5"/><text class="t m" x="180.0" y="210.33333333333334" style="font-size:13px">50 lb</text><path d="M180.0 223.0L180.0 252.0" class="dk" style="stroke-width:2"/><path d="M180.0 258.0L177.3 252.0L182.7 252.0Z" class="dh" style=""/><path d="M330 287.0L624.0 287.0" class="dk" style="stroke-width:1.8"/><path d="M630.0 287.0L624.0 289.7L624.0 284.3Z" class="dh" style=""/><text class="s m" x="480.0" y="305.0" style="font-size:12px">arm 100 in (station 100)</text><path d="M330 287.0L261.0 287.0" class="dk" style="stroke-width:1.8"/><path d="M255.0 287.0L261.0 284.3L261.0 289.7Z" class="dh" style=""/><text class="s e" x="247.0" y="291.0" style="font-size:11.5px">25 in</text><path d="M330 309.0L186.0 309.0" class="dk" style="stroke-width:1.8"/><path d="M180.0 309.0L186.0 306.3L186.0 311.7Z" class="dh" style=""/><text class="s e" x="172.0" y="313.0" style="font-size:11.5px">50 in</text><path d="M255.0 271.0L255.0 289.0" class="dk" style="stroke-width:1;opacity:0.5;stroke-dasharray:6 5"/><path d="M180.0 271.0L180.0 311.0" class="dk" style="stroke-width:1;opacity:0.5;stroke-dasharray:6 5"/><path d="M630.0 271.0L630.0 289.0" class="dk" style="stroke-width:1;opacity:0.5;stroke-dasharray:6 5"/><text class="t m" x="630.0" y="139.0" style="font-size:13px">50 lb x 100 in</text><text class="t m" x="630.0" y="157.0" style="font-size:13px">= 5,000 in-lb</text><text class="t m" x="216.0" y="139.0" style="font-size:13px">100 lb x 25 in + 50 lb x 50 in</text><text class="t m" x="216.0" y="157.0" style="font-size:13px">= 2,500 + 2,500 = 5,000 in-lb</text><text class="t m" x="330" y="113.0" style="font-size:13px">Equal moments on both sides: the board balances</text><text class="s" x="32" y="367.0" style="font-size:12px">Any weight and distance whose product is 5,000 in-lb balances the board.</text><rect x="20" y="391.0" width="337" height="24" rx="10" class="sky" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="30" y="408.0" style="font-size:13px">Datum and arm</text><circle cx="31" cy="429.0" r="2.2" class="ah"/><text class="s" x="40" y="433.0" style="font-size:12px">Datum: an imaginary vertical plane or line from</text><text class="s" x="40" y="448.5" style="font-size:12px">which all arm measurements are taken; the</text><text class="s" x="40" y="464.0" style="font-size:12px">manufacturer establishes it</text><circle cx="31" cy="479.5" r="2.2" class="ah"/><text class="s" x="40" y="483.5" style="font-size:12px">Arm: the horizontal distance in inches from the</text><text class="s" x="40" y="499.0" style="font-size:12px">datum to the CG of an item; plus (+) aft of the</text><text class="s" x="40" y="514.5" style="font-size:12px">datum, minus (-) forward</text><circle cx="31" cy="530.0" r="2.2" class="ah"/><text class="s" x="40" y="534.0" style="font-size:12px">Station: a location named by its distance in</text><text class="s" x="40" y="549.5" style="font-size:12px">inches from the datum; the datum is station zero</text><rect x="373" y="391.0" width="337" height="24" rx="10" class="lav" style="stroke:currentColor;stroke-width:1.5"/><text class="t" x="383" y="408.0" style="font-size:13px">Moment and center of gravity</text><circle cx="384" cy="429.0" r="2.2" class="ah"/><text class="s" x="393" y="433.0" style="font-size:12px">Moment: weight x arm, in pound-inches (in-lb);</text><text class="s" x="393" y="448.5" style="font-size:12px">the tendency of a weight to rotate about a point</text><circle cx="384" cy="464.0" r="2.2" class="ah"/><text class="s" x="393" y="468.0" style="font-size:12px">Center of gravity (CG): the point about which the</text><text class="s" x="393" y="483.5" style="font-size:12px">aircraft would balance if suspended there; the</text><text class="s" x="393" y="499.0" style="font-size:12px">theoretical point where the entire weight is</text><text class="s" x="393" y="514.5" style="font-size:12px">concentrated</text><circle cx="384" cy="530.0" r="2.2" class="ah"/><text class="s" x="393" y="534.0" style="font-size:12px">CG may be given in inches from the datum or in</text><text class="s" x="393" y="549.5" style="font-size:12px">percent of MAC</text></svg>
