<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 594" role="img" aria-labelledby="ti de"><title id="ti">Computing the loaded weight and CG</title><desc id="de">PHAK computational method example. Aircraft allowances: maximum gross weight 3,400 pounds, CG range 78 to 86 inches. Load: front seat occupants 340 pounds, rear seat occupants 350 pounds, 75 gallons of fuel at 6 pounds per gallon is 450 pounds, and 80 pounds of baggage in area 1. With the empty aircraft the total weight is 3,320 pounds, derived here as 2,100 pounds empty. Steps: list the weights, enter the moment of each item as weight times arm, find total weight and total moment, then divide total moment by total weight to get the CG. The CG is 84.8 inches, inside the 78 to 86 inch range, and 3,320 pounds is under 3,400, so the aircraft is loaded within limits.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:12.5px}.q1{font-size:11.5px}.q2{stroke-width:1.2;opacity:0.7}.q3{font-size:13px}.q4{stroke:currentColor;stroke-width:1.5}.q5{font-size:12px;fill:#fff}.q6{stroke-width:2}.q7{font-size:12px}</style><text class="t" x="20" y="28" style="font-size:15px">Computing the loaded weight and CG</text><text class="s q3" x="20" y="50">PHAK computational method, worked example. Check the total weight and the CG against the aircraft</text><text class="s q3" x="20" y="66.5">limits.</text><rect class="cl" x="20" y="89" width="690" height="150" rx="8"/><text class="t q3" x="32" y="111">Aircraft allowances and the load given</text><text class="s q0" x="32" y="133">Maximum gross weight: 3,400 lb</text><text class="s q0" x="32" y="151">CG range: 78 to 86 inches</text><text class="s q0" x="300" y="133">Front seat occupants</text><text class="t e q0" x="630" y="133">340 lb</text><text class="s q0" x="300" y="151">Rear seat occupants</text><text class="t e q0" x="630" y="151">350 lb</text><text class="s q0" x="300" y="169">Fuel: 75 gal x 6 lb per gal (AVGAS)</text><text class="t e q0" x="630" y="169">450 lb</text><text class="s q0" x="300" y="187">Baggage, area 1</text><text class="t e q0" x="630" y="187">80 lb</text><text class="s q0" x="300" y="205">Empty aircraft (derived)</text><text class="t e q0" x="630" y="205">2,100 lb</text><path d="M300 213L630 213" class="dk" style="stroke-width:1.2;opacity:0.6"/><text class="t q0" x="300" y="227">Total weight</text><text class="t e q0" x="630" y="227">3,320 lb</text><rect x="20" y="249" width="165" height="70" rx="10" class="sky q4"/><circle cx="36" cy="267" r="10" class="ah"/><text class="t m q5" x="36" y="271">1</text><text class="t q0" x="52" y="272">List the weights</text><text class="s q1" x="30" y="293">aircraft, occupants,</text><text class="s q1" x="30" y="308">fuel, baggage</text><path d="M186 284L188 284" class="dk q6"/><path d="M194 284L188 286.7L188 281.3Z" class="dh" style=""/><rect x="195" y="249" width="165" height="70" rx="10" class="lav q4"/><circle cx="211" cy="267" r="10" class="ah"/><text class="t m q5" x="211" y="271">2</text><text class="t q0" x="227" y="272">Find each moment</text><text class="s q1" x="205" y="293">weight x arm = moment</text><path d="M361 284L363 284" class="dk q6"/><path d="M369 284L363 286.7L363 281.3Z" class="dh" style=""/><rect x="370" y="249" width="165" height="70" rx="10" class="mint q4"/><circle cx="386" cy="267" r="10" class="ah"/><text class="t m q5" x="386" y="271">3</text><text class="t q0" x="402" y="272">Add them up</text><text class="s q1" x="380" y="293">total weight and total</text><text class="s q1" x="380" y="308">moment</text><path d="M536 284L538 284" class="dk q6"/><path d="M544 284L538 286.7L538 281.3Z" class="dh" style=""/><rect x="545" y="249" width="165" height="70" rx="10" class="rose q4"/><circle cx="561" cy="267" r="10" class="ah"/><text class="t m q5" x="561" y="271">4</text><text class="t q0" x="577" y="272">Divide</text><text class="s q1" x="555" y="293">CG = total moment /</text><text class="s q1" x="555" y="308">total weight</text><rect class="cl" x="20" y="331" width="690" height="166" rx="8"/><text class="t q3" x="32" y="353">Result: is the load within limits?</text><rect class="mint" x="187" y="406" width="363" height="18" style="stroke:currentColor;stroke-width:1.6"/><path d="M96 424L640 424" class="dk" style="stroke-width:1.4;opacity:0.6"/><path d="M96 424L96 430" class="dk q2"/><text class="s m q1" x="96" y="444">76</text><path d="M186.67 424L186.67 430" class="dk q2"/><text class="s m q1" x="186.67" y="444">78</text><path d="M277.33 424L277.33 430" class="dk q2"/><text class="s m q1" x="277.33" y="444">80</text><path d="M368 424L368 430" class="dk q2"/><text class="s m q1" x="368" y="444">82</text><path d="M458.67 424L458.67 430" class="dk q2"/><text class="s m q1" x="458.67" y="444">84</text><path d="M549.33 424L549.33 430" class="dk q2"/><text class="s m q1" x="549.33" y="444">86</text><path d="M640 424L640 430" class="dk q2"/><text class="s m q1" x="640" y="444">88</text><text class="s m q1" x="368" y="461">inches from the datum</text><path d="M494.9 403L486.9 387L502.9 387Z" class="ah"/><text class="t m q0" x="494.93" y="381">CG 84.8 in</text><text class="s m q1" x="186.67" y="401">forward limit 78</text><text class="s q1" x="553.33" y="401">aft limit 86</text><text class="t q7" x="32" y="485">3,320 lb is under the 3,400 lb maximum, and the CG of 84.8 is inside 78 to 86 inches: loaded within limits.</text><rect class="cl" x="20" y="507" width="690" height="73" rx="8"/><circle cx="35" cy="529" r="2.2" class="ah"/><text class="s q7" x="44" y="533">The aircraft weight and balance records give the empty weight, its moment and the arm of each location</text><circle cx="35" cy="548.5" r="2.2" class="ah"/><text class="s q7" x="44" y="552.5">The CG is a position in inches from the datum, found by dividing total moment by total weight</text></svg>
