<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 607" role="img" aria-labelledby="ti de"><title id="ti">Shifting, adding and removing weight</title><desc id="de">PHAK example: 100 pounds is shifted from station 30 to station 150. The moment at station 150 is 15,000 inch-pounds and at station 30 is 3,000, so the moment change is 12,000 inch-pounds. The total moment becomes 616,000 plus 12,000, which is 628,000 inch-pounds. Divided by the unchanged 8,000 pound weight, the new CG is 78.5 inches. Weight moved forward decreases total moments and weight moved aft increases them, in proportion to the amount moved. For adding or removing weight, calculate the new CG from total moments and check it against the limits; if the CG shifts aft, add the change to the old CG, if forward, subtract it. The old CG of 77 inches is derived from 616,000 divided by 8,000.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:12px}.q1{font-size:13px}.q2{font-size:11.5px}.q3{stroke:currentColor;stroke-width:1.5}.q4{stroke-width:1;opacity:0.5;stroke-dasharray:6 5}</style><text class="t" x="20" y="28" style="font-size:15px">Shifting, adding and removing weight</text><text class="s q1" x="20" y="50">PHAK example: 100 pounds shifted from station 30 to station 150 in an 8,000 pound aircraft. Schematic,</text><text class="s q1" x="20" y="66.5">not to scale.</text><rect class="cl" x="20" y="89" width="690" height="204" rx="8"/><path d="M60 199L670 199" class="dk" style="stroke-width:2;opacity:0.8"/><path d="M60 193L60 205" class="dk" style="stroke-width:2"/><text class="t m q0" x="60" y="229">datum</text><text class="s m q2" x="60" y="245">station 0</text><rect class="cl" x="144" y="155" width="60" height="30" rx="6" style="stroke:currentColor;stroke-width:1.5;stroke-dasharray:5 4;fill-opacity:.1"/><text class="s m q0" x="174.38" y="175">100 lb</text><path d="M174.38 185L174.38 199" class="dk" style="stroke-width:1.4;opacity:0.6;stroke-dasharray:6 5"/><rect x="601.88" y="155" width="60" height="30" rx="10" class="sky q3"/><text class="t m" x="631.88" y="174.17" style="font-size:12.5px">100 lb</text><path d="M631.88 185L631.9 192" class="dk" style="stroke-width:2"/><path d="M631.88 198L629.2 192L634.6 192Z" class="dh" style=""/><path d="M208.38 137L587.9 137" class="acc" style="stroke-width:2.5"/><path d="M597.88 137L587.9 141.5L587.9 132.5Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><text class="t m" x="403.13" y="129" style="font-size:12.5px">shifted aft</text><text class="s m q0" x="174.38" y="243">station 30</text><text class="s m q0" x="631.88" y="243">station 150</text><path d="M353.6 209L345.6 225L361.6 225Z" class="cl" style="stroke:currentColor;stroke-width:1.5;fill-opacity:.35"/><path d="M368.3 209L360.3 225L376.3 225Z" class="ah"/><text class="s e q2" x="347.56" y="247">old CG 77 (derived)</text><text class="t q2" x="381.28" y="247">new CG 78.5</text><path d="M353.56 225L353.56 237" class="dk q4"/><path d="M368.28 225L368.28 237" class="dk q4"/><text class="s q0" x="32" y="283">Total weight is unchanged at 8,000 lb; only the total moment changes.</text><rect x="20" y="303" width="337" height="24" rx="10" class="sky q3"/><text class="t q1" x="30" y="320">Worked example</text><circle cx="31" cy="341" r="2.2" class="ah"/><text class="s q0" x="40" y="345">Moment at station 150: 100 lb x 150 in = 15,000</text><text class="s q0" x="40" y="360.5">in-lb</text><circle cx="31" cy="376" r="2.2" class="ah"/><text class="s q0" x="40" y="380">Moment at station 30: 100 lb x 30 in = 3,000</text><text class="s q0" x="40" y="395.5">in-lb</text><circle cx="31" cy="411" r="2.2" class="ah"/><text class="s q0" x="40" y="415">Moment change: 15,000 - 3,000 = 12,000 in-lb</text><circle cx="31" cy="430.5" r="2.2" class="ah"/><text class="s q0" x="40" y="434.5">Total moment: 616,000 + 12,000 = 628,000 in-lb</text><circle cx="31" cy="450" r="2.2" class="ah"/><text class="s q0" x="40" y="454">CG = 628,000 in-lb / 8,000 lb = 78.5 in</text><rect x="373" y="303" width="337" height="24" rx="10" class="mint q3"/><text class="t q1" x="383" y="320">Rules of thumb from PHAK</text><circle cx="384" cy="341" r="2.2" class="ah"/><text class="s q0" x="393" y="345">Weight moved forward: total moments decrease.</text><text class="s q0" x="393" y="360.5">Weight moved aft: total moments increase</text><circle cx="384" cy="376" r="2.2" class="ah"/><text class="s q0" x="393" y="380">The moment change is proportional to the amount</text><text class="s q0" x="393" y="395.5">of weight moved</text><circle cx="384" cy="411" r="2.2" class="ah"/><text class="s q0" x="393" y="415">Adding or removing weight: calculate the new CG</text><text class="s q0" x="393" y="430.5">with total moments and check it against the</text><text class="s q0" x="393" y="446">limits</text><circle cx="384" cy="461.5" r="2.2" class="ah"/><text class="s q0" x="393" y="465.5">CG shifting aft: add delta CG to the old CG.</text><text class="s q0" x="393" y="481">Shifting forward: subtract it</text><rect class="cl" x="20" y="504.5" width="690" height="88.5" rx="8"/><circle cx="35" cy="526.5" r="2.2" class="ah"/><text class="s q0" x="44" y="530.5">Fuel tanks in most small aircraft sit close to the CG, so burning fuel does not affect the CG much</text><circle cx="35" cy="546" r="2.2" class="ah"/><text class="s q0" x="44" y="550">If the load is within the weight limit but the CG is out, the most satisfactory fix is to shift baggage,</text><text class="s q0" x="44" y="565.5">passengers or both</text></svg>
