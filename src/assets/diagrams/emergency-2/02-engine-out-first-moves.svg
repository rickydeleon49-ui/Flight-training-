<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 380" role="img" aria-labelledby="ti de"><title id="ti">Engine out: fly, choose, check, call</title><desc id="de">Four step cards in order for an engine failure: fly at best glide speed and trim, choose a field and the wind, run the engine checks, and call for help on the radio and transponder, plus cards on the critical engine checks and on keeping a steady glide speed.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:17px}.q1{stroke-width:2;opacity:.6}.q2{font-size:11.5px}.q3{font-size:13px}.q4{stroke:currentColor;stroke-width:1.5}.q5{stroke-width:2.5}.q6{fill:var(--palette-berry,#A84C6B)}</style><text class="t" x="20" y="28" style="font-size:15px">Engine out in flight: first moves</text><text class="s q3" x="20" y="50">Fly the airplane first. The checklist and the radio come while you are gliding toward your field.</text><rect class="cl" x="20" y="70.5" width="162" height="116" rx="8"/><rect x="20" y="70.5" width="162" height="26" rx="10" class="rose q4"/><text class="t q3" x="30" y="88.5">1  Fly</text><circle cx="33" cy="106.5" r="2.2" class="ah"/><text class="s q2" x="42" y="110.5">Lower the nose to</text><text class="s q2" x="42" y="125.5">best glide speed</text><text class="s q2" x="42" y="140.5">(your POH number) and</text><text class="s q2" x="42" y="155.5">trim. Hold it steady.</text><path d="M185 128.5L185 128.5" class="acc q5"/><path d="M193 128.5L185 132.1L185 124.9Z" class="dh q6"/><rect class="cl" x="196" y="70.5" width="162" height="116" rx="8"/><rect x="196" y="70.5" width="162" height="26" rx="10" class="sky q4"/><text class="t q3" x="206" y="88.5">2  Choose</text><circle cx="209" cy="106.5" r="2.2" class="ah"/><text class="s q2" x="218" y="110.5">Pick a field and find</text><text class="s q2" x="218" y="125.5">the wind (windsock,</text><text class="s q2" x="218" y="140.5">smoke, water). Change</text><text class="s q2" x="218" y="155.5">your mind at most</text><text class="s q2" x="218" y="170.5">once.</text><path d="M361 128.5L361 128.5" class="acc q5"/><path d="M369 128.5L361 132.1L361 124.9Z" class="dh q6"/><rect class="cl" x="372" y="70.5" width="162" height="116" rx="8"/><rect x="372" y="70.5" width="162" height="26" rx="10" class="mint q4"/><text class="t q3" x="382" y="88.5">3  Check</text><circle cx="385" cy="106.5" r="2.2" class="ah"/><text class="s q2" x="394" y="110.5">Run the engine checks</text><text class="s q2" x="394" y="125.5">while you glide.</text><path d="M537 128.5L537 128.5" class="acc q5"/><path d="M545 128.5L537 132.1L537 124.9Z" class="dh q6"/><rect class="cl" x="548" y="70.5" width="162" height="116" rx="8"/><rect x="548" y="70.5" width="162" height="26" rx="10" class="lav q4"/><text class="t q3" x="558" y="88.5">4  Call</text><circle cx="561" cy="106.5" r="2.2" class="ah"/><text class="s q2" x="570" y="110.5">MAYDAY on the ATC</text><text class="s q2" x="570" y="125.5">frequency, or 121.5.</text><text class="s q2" x="570" y="140.5">Squawk 7700.</text><rect class="cl" x="20" y="200.5" width="338" height="140" rx="8"/><rect x="20" y="200.5" width="338" height="26" rx="10" class="mint q4"/><text class="t q3" x="30" y="218.5">Checks that might restart it</text><circle cx="33" cy="236.5" r="2.2" class="ah"/><text class="s q2" x="42" y="240.5">Fuel tank selector position: many forced landings</text><text class="s q2" x="42" y="255.5">were a selector on an empty tank. Try the other</text><text class="s q2" x="42" y="270.5">tank even if the gauges show fuel</text><circle cx="33" cy="284.5" r="2.2" class="ah"/><text class="s q2" x="42" y="288.5">Fuel quantity in the selected tank</text><circle cx="33" cy="302.5" r="2.2" class="ah"/><text class="s q2" x="42" y="306.5">Fuel pressure: is the electric pump needed?</text><circle cx="33" cy="320.5" r="2.2" class="ah"/><text class="s q2" x="42" y="324.5">Mixture, magneto switch, carburetor heat</text><rect class="cl" x="372" y="200.5" width="338" height="140" rx="8"/><rect x="372" y="200.5" width="338" height="26" rx="10" class="sky q4"/><text class="t q3" x="382" y="218.5">Why a steady glide speed</text><circle cx="385" cy="236.5" r="2.2" class="ah"/><text class="s q2" x="394" y="240.5">A constant speed makes it far easier to judge how</text><text class="s q2" x="394" y="255.5">far you will glide and where you will land</text><circle cx="385" cy="269.5" r="2.2" class="ah"/><text class="s q2" x="394" y="273.5">Do not dive at the field: too much speed causes</text><text class="s q2" x="394" y="288.5">floating and overshooting</text><circle cx="385" cy="302.5" r="2.2" class="ah"/><text class="s q2" x="394" y="306.5">Flaps and gear: use what suits the situation, per</text><text class="s q2" x="394" y="321.5">your POH</text><text class="s" x="20" y="362.5" style="font-size:11px">Source: Airplane Flying Handbook ch. 18</text></svg>
