<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 453" role="img" aria-labelledby="ti de"><title id="ti">Emergency squawk codes</title><desc id="de">Three cards for transponder codes 7700 emergency, 7600 lost radio and 7500 hijack, with what each means and what to do, plus cards on the MAYDAY and PAN-PAN calls and on changing codes safely.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:17px}.q1{stroke-width:2;opacity:.6}.q2{font-size:11.5px}.q3{stroke:currentColor;stroke-width:1.5}.q4{font-size:13px}.q5{font-size:22px}.q6{font-size:12.5px}</style><text class="t" x="20" y="28" style="font-size:15px">Squawk codes and the emergency call</text><text class="s q4" x="20" y="50">Set the code, then talk to someone. These three codes trigger alarms at radar facilities.</text><rect class="cl" x="20" y="66.5" width="220.67" height="211" rx="8"/><rect x="20" y="66.5" width="220.67" height="38" rx="10" class="sky q3"/><text class="t q5" x="32" y="93.5">7700</text><text class="t e q6" x="230.67" y="91.5">Emergency</text><circle cx="33" cy="122.5" r="2.2" class="ah"/><text class="s q2" x="42" y="126.5">Distress or urgency: fire,</text><text class="s q2" x="42" y="141.5">mechanical failure, doubt about</text><text class="s q2" x="42" y="156.5">fuel or position</text><circle cx="33" cy="170.5" r="2.2" class="ah"/><text class="s q2" x="42" y="174.5">Squawk it with altitude</text><text class="s q2" x="42" y="189.5">reporting, then call ATC at</text><text class="s q2" x="42" y="204.5">once</text><circle cx="33" cy="218.5" r="2.2" class="ah"/><text class="s q2" x="42" y="222.5">Keep squawking even if you are</text><text class="s q2" x="42" y="237.5">out of radar range</text><rect class="cl" x="254.67" y="66.5" width="220.67" height="211" rx="8"/><rect x="254.67" y="66.5" width="220.67" height="38" rx="10" class="mint q3"/><text class="t q5" x="266.67" y="93.5">7600</text><text class="t e q6" x="465.33" y="91.5">Radio failure</text><circle cx="267.67" cy="122.5" r="2.2" class="ah"/><text class="s q2" x="276.67" y="126.5">Lost two-way radio</text><circle cx="267.67" cy="140.5" r="2.2" class="ah"/><text class="s q2" x="276.67" y="144.5">Squawk 7600 and try to</text><text class="s q2" x="276.67" y="159.5">reestablish contact</text><circle cx="267.67" cy="173.5" r="2.2" class="ah"/><text class="s q2" x="276.67" y="177.5">You may not be in radar</text><text class="s q2" x="276.67" y="192.5">coverage</text><rect class="cl" x="489.33" y="66.5" width="220.67" height="211" rx="8"/><rect x="489.33" y="66.5" width="220.67" height="38" rx="10" class="rose q3"/><text class="t q5" x="501.33" y="93.5">7500</text><text class="t e q6" x="700" y="91.5">Hijack</text><circle cx="502.33" cy="122.5" r="2.2" class="ah"/><text class="s q2" x="511.33" y="126.5">Unlawful interference or being</text><text class="s q2" x="511.33" y="141.5">forced to a new destination</text><circle cx="502.33" cy="155.5" r="2.2" class="ah"/><text class="s q2" x="511.33" y="159.5">ATC never assigns 7500 without</text><text class="s q2" x="511.33" y="174.5">your report; if given it,</text><text class="s q2" x="511.33" y="189.5">refuse and say so</text><rect class="cl" x="20" y="291.5" width="338" height="122" rx="8"/><rect x="20" y="291.5" width="338" height="26" rx="10" class="lav q3"/><text class="t q4" x="30" y="309.5">Say it</text><circle cx="33" cy="327.5" r="2.2" class="ah"/><text class="s q2" x="42" y="331.5">MAYDAY (distress), ideally said three times, then</text><text class="s q2" x="42" y="346.5">PAN-PAN for urgency</text><circle cx="33" cy="360.5" r="2.2" class="ah"/><text class="s q2" x="42" y="364.5">Ask early: a doubtful position, fuel, or weather is</text><text class="s q2" x="42" y="379.5">already an urgency. Delay costs lives</text><circle cx="33" cy="393.5" r="2.2" class="ah"/><text class="s q2" x="42" y="397.5">Use the ATC frequency in use, or 121.5 MHz</text><rect class="cl" x="372" y="291.5" width="338" height="122" rx="8"/><rect x="372" y="291.5" width="338" height="26" rx="10" class="sky q3"/><text class="t q4" x="382" y="309.5">Changing codes</text><circle cx="385" cy="327.5" r="2.2" class="ah"/><text class="s q2" x="394" y="331.5">Do not dial through 7500, 7600 or 7700 on a routine</text><text class="s q2" x="394" y="346.5">change: it sets off false alarms</text><circle cx="385" cy="360.5" r="2.2" class="ah"/><text class="s q2" x="394" y="364.5">Example: go 2700 to 2200 first, then 7200</text><text class="s" x="20" y="435.5" style="font-size:11px">Source: Aeronautical Information Manual ch. 6</text></svg>
