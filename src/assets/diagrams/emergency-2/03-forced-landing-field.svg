<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 543" role="img" aria-labelledby="ti de"><title id="ti">Choosing a forced-landing field</title><desc id="de">A plan view of a chosen field with an arrow showing the approach path over a pair of trees and a wind arrow, plus cards on how to pick the field, how to touch down and what to do before touchdown.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:17px}.q1{stroke-width:2;opacity:.6}.q2{font-size:11.5px}.q3{font-size:13px}.q4{stroke:currentColor;stroke-width:1.5}.q5{font-size:11px}.q6{stroke:currentColor;stroke-width:1.2}.q7{stroke:currentColor;stroke-width:1.4;stroke-linejoin:round}</style><text class="t" x="20" y="28" style="font-size:15px">Choosing a field and flying the approach</text><text class="s q3" x="20" y="50">You cannot always get a perfect field. Pick the one that leaves you some margin for error.</text><rect class="cl" x="20" y="74.5" width="690" height="190" rx="8"/><rect x="300" y="98.5" width="290" height="140" rx="6" class="mint q4"/><text class="s m" x="445" y="168.5" style="font-size:12px">Chosen field</text><circle cx="240" cy="128.5" r="9" class="mint q6"/><circle cx="260" cy="168.5" r="9" class="mint q6"/><text class="s q5" x="214" y="208.5">obstacles on</text><text class="s q5" x="214" y="221.5">the approach</text><path d="M60 108.5L102 108.5" class="dk" style="stroke-width:2"/><path d="M110 108.5L102 112.1L102 104.9Z" class="dh"/><text class="s q2" x="60" y="126.5">wind</text><path d="M80 188.5L320 169.3" class="acc" style="stroke-width:3"/><path d="M330 168.5L320.4 173.8L319.7 164.8Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><g transform="translate(120 180.5) rotate(-8) scale(0.8)"><ellipse cx="0" cy="0" rx="24" ry="5.5" class="sky" style="stroke:currentColor;stroke-width:1.4"/><path d="M-20 -2L-29 -13L-22 -13L-12 -3Z" class="sky q7"/><path d="M0 2L8 2L-4 11L-9 11Z" class="cl q7"/></g><rect class="cl" x="20" y="276.5" width="220.67" height="227" rx="8"/><rect x="20" y="276.5" width="220.67" height="26" rx="10" class="sky q4"/><text class="t q3" x="30" y="294.5">Pick</text><circle cx="33" cy="312.5" r="2.2" class="ah"/><text class="s q2" x="42" y="316.5">Plan around wind, field size</text><text class="s q2" x="42" y="331.5">and slope, and obstacles on</text><text class="s q2" x="42" y="346.5">approach; these seldom agree,</text><text class="s q2" x="42" y="361.5">so leave margin</text><circle cx="33" cy="375.5" r="2.2" class="ah"/><text class="s q2" x="42" y="379.5">If you may have overestimated</text><text class="s q2" x="42" y="394.5">your glide, prefer an</text><text class="s q2" x="42" y="409.5">unobstructed approach even if</text><text class="s q2" x="42" y="424.5">it is not into the wind</text><circle cx="33" cy="438.5" r="2.2" class="ah"/><text class="s q2" x="42" y="442.5">Reaching an obstacle at the end</text><text class="s q2" x="42" y="457.5">of a roll is less hazardous</text><text class="s q2" x="42" y="472.5">than striking one at flying</text><text class="s q2" x="42" y="487.5">speed before touchdown</text><rect class="cl" x="254.67" y="276.5" width="220.67" height="227" rx="8"/><rect x="254.67" y="276.5" width="220.67" height="26" rx="10" class="mint q4"/><text class="t q3" x="264.67" y="294.5">Touch down</text><circle cx="267.67" cy="312.5" r="2.2" class="ah"/><text class="s q2" x="276.67" y="316.5">Touch down at the lowest</text><text class="s q2" x="276.67" y="331.5">controllable airspeed: doubling</text><text class="s q2" x="276.67" y="346.5">groundspeed quadruples the</text><text class="s q2" x="276.67" y="361.5">destructive energy</text><circle cx="267.67" cy="375.5" r="2.2" class="ah"/><text class="s q2" x="276.67" y="379.5">Control attitude and sink rate:</text><text class="s q2" x="276.67" y="394.5">avoid a nose-low touchdown,</text><text class="s q2" x="276.67" y="409.5">steep banks, and a hard, high</text><text class="s q2" x="276.67" y="424.5">sink rate</text><circle cx="267.67" cy="438.5" r="2.2" class="ah"/><text class="s q2" x="276.67" y="442.5">Standing crops, brush and small</text><text class="s q2" x="276.67" y="457.5">trees can cushion and slow an</text><text class="s q2" x="276.67" y="472.5">airplane</text><rect class="cl" x="489.33" y="276.5" width="220.67" height="227" rx="8"/><rect x="489.33" y="276.5" width="220.67" height="26" rx="10" class="lav q4"/><text class="t q3" x="499.33" y="294.5">Before touchdown</text><circle cx="502.33" cy="312.5" r="2.2" class="ah"/><text class="s q2" x="511.33" y="316.5">Flaps lower stall speed, but</text><text class="s q2" x="511.33" y="331.5">too early costs glide distance</text><circle cx="502.33" cy="345.5" r="2.2" class="ah"/><text class="s q2" x="511.33" y="349.5">Gear up or down: follow your</text><text class="s q2" x="511.33" y="364.5">POH</text><circle cx="502.33" cy="378.5" r="2.2" class="ah"/><text class="s q2" x="511.33" y="382.5">Per your POH, engine and fuel</text><text class="s q2" x="511.33" y="397.5">off and electrical off just</text><text class="s q2" x="511.33" y="412.5">before touchdown cut fire risk;</text><text class="s q2" x="511.33" y="427.5">keep what you need until then</text><circle cx="502.33" cy="441.5" r="2.2" class="ah"/><text class="s q2" x="511.33" y="445.5">Keep control. It beats every</text><text class="s q2" x="511.33" y="460.5">checklist task</text><text class="s q5" x="20" y="525.5">Source: Airplane Flying Handbook ch. 18</text></svg>
