<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 525" role="img" aria-labelledby="ti de"><title id="ti">Engine failure after takeoff: land ahead</title><desc id="de">A side view of a climb after takeoff where the engine quits, with a solid arrow gliding ahead and a faded dashed path showing the risky turn back, and cards on the first actions, landing ahead and why turning back is dangerous.</desc><style>.t{fill:currentColor;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:currentColor;font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.o{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:10 8}.m{text-anchor:middle}.e{text-anchor:end}.sky{fill:var(--palette-sky,#8EBFDA);fill-opacity:.6}.lav{fill:var(--palette-lavender,#B9ADDF);fill-opacity:.6}.mint{fill:var(--palette-mint,#AAD4C4);fill-opacity:.6}.rose{fill:var(--palette-rose,#DFA7B8);fill-opacity:.6}.acc{stroke:var(--palette-berry,#A84C6B);fill:none;stroke-width:4;stroke-linecap:round}.ah{fill:var(--palette-berry,#A84C6B)}.cl{fill:currentColor;fill-opacity:.2}.dk{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round}.dh{fill:currentColor}.q0{font-size:17px}.q1{stroke-width:2;opacity:.6}.q2{font-size:11.5px}.q3{font-size:13px}.q4{stroke:currentColor;stroke-width:1.5}.q5{stroke:currentColor;stroke-width:1.4;stroke-linejoin:round}.q6{font-size:11px;fill:#fff}</style><text class="t" x="20" y="28" style="font-size:15px">Engine fails after takeoff: land ahead</text><text class="s q3" x="20" y="50">When the engine quits in the initial climb, the airplane is low and slow. The safest answer is usually</text><text class="s q3" x="20" y="66.5">the simplest one.</text><rect class="cl" x="20" y="91" width="690" height="170" rx="8"/><path d="M30 241L700 241" class="dk" style="stroke-width:2.5"/><rect x="60" y="240" width="200" height="8" rx="2" class="cl" style="stroke:currentColor;stroke-width:1.2"/><text class="s m q2" x="160" y="263">Runway</text><path d="M250 239L400 151" class="dk" style="stroke-width:2.5"/><g transform="translate(400 151) rotate(-20) scale(0.9)"><ellipse cx="0" cy="0" rx="24" ry="5.5" class="sky" style="stroke:currentColor;stroke-width:1.4"/><path d="M-20 -2L-29 -13L-22 -13L-12 -3Z" class="sky q5"/><path d="M0 2L8 2L-4 11L-9 11Z" class="cl q5"/></g><circle cx="412" cy="127" r="9" class="ah"/><text class="t m q6" x="412" y="130.67">1</text><text class="t" x="430" y="131" style="font-size:12px">Engine quits</text><path d="M418 157L600.5 219.7" class="acc" style="stroke-width:3"/><path d="M610 223L599.1 224L602 215.5Z" class="dh" style="fill:var(--palette-berry,#A84C6B)"/><circle cx="520" cy="171" r="9" class="ah"/><text class="t m q6" x="520" y="174.67">2</text><text class="t" x="535" y="169" style="font-size:12px">Nose down, glide</text><text class="s q2" x="535" y="184">straight ahead or slightly aside</text><path d="M400 157L330 191" class="dk" style="stroke-width:2;stroke-dasharray:7 6"/><path d="M395 159C300 111 190 161 160 201" class="o d" style="stroke-width:2;opacity:.7"/><text class="s q2" x="120" y="121">Turn back: the "impossible turn"</text><rect class="cl" x="20" y="273" width="220.67" height="212" rx="8"/><rect x="20" y="273" width="220.67" height="26" rx="10" class="rose q4"/><text class="t q3" x="30" y="291">First</text><circle cx="33" cy="309" r="2.2" class="ah"/><text class="s q2" x="42" y="313">Lower the nose and establish</text><text class="s q2" x="42" y="328">the glide attitude</text><circle cx="33" cy="342" r="2.2" class="ah"/><text class="s q2" x="42" y="346">Then pick the best place ahead,</text><text class="s q2" x="42" y="361">or slightly to either side of</text><text class="s q2" x="42" y="376">the takeoff path</text><rect class="cl" x="254.67" y="273" width="220.67" height="212" rx="8"/><rect x="254.67" y="273" width="220.67" height="26" rx="10" class="mint q4"/><text class="t q3" x="264.67" y="291">Land ahead</text><circle cx="267.67" cy="309" r="2.2" class="ah"/><text class="s q2" x="276.67" y="313">The landing is under control</text><text class="s q2" x="276.67" y="328">and as slow as possible, into</text><text class="s q2" x="276.67" y="343">the headwind you took off in</text><circle cx="267.67" cy="357" r="2.2" class="ah"/><text class="s q2" x="276.67" y="361">Usually the option with the</text><text class="s q2" x="276.67" y="376">lowest risk</text><rect class="cl" x="489.33" y="273" width="220.67" height="212" rx="8"/><rect x="489.33" y="273" width="220.67" height="26" rx="10" class="lav q4"/><text class="t q3" x="499.33" y="291">Turn back?</text><circle cx="502.33" cy="309" r="2.2" class="ah"/><text class="s q2" x="511.33" y="313">Needs more than a standard-rate</text><text class="s q2" x="511.33" y="328">turn; a shallow turn uses too</text><text class="s q2" x="511.33" y="343">much time and distance</text><circle cx="502.33" cy="357" r="2.2" class="ah"/><text class="s q2" x="511.33" y="361">Risks: an accelerated stall, a</text><text class="s q2" x="511.33" y="376">steep turn near the ground, a</text><text class="s q2" x="511.33" y="391">downwind landing at higher</text><text class="s q2" x="511.33" y="406">groundspeed</text><circle cx="502.33" cy="420" r="2.2" class="ah"/><text class="s q2" x="511.33" y="424">Only with training in your make</text><text class="s q2" x="511.33" y="439">and model, and only if sure you</text><text class="s q2" x="511.33" y="454">can reach the field. Not for</text><text class="s q2" x="511.33" y="469">student or low-time pilots</text><text class="s" x="20" y="507" style="font-size:11px">Source: Airplane Flying Handbook ch. 18</text></svg>
