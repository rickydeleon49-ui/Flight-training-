[package]
name = "her-flight-deck"
version = "0.5.7"
description = "A personal flight-training companion"
authors = ["Her Flight Deck"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "her_flight_deck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
base64 = "0.22"
keyring = "3.6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Only for the pauses between retries; Tauri already builds on this runtime.
tokio = { version = "1", features = ["time"] }
lopdf = { version = "0.42.0", default-features = false }
# Strict content-stream decoding for OFFLINE-01 extraction (owner-approved
# 19 October 2026). Already locked as a lopdf dependency; same version.
flate2 = "1.1.10"
sha2 = "0.10"
hex = "0.4"
rusqlite = { version = "0.32", features = ["backup"] }
unicode-normalization = "=0.1.25"

[dev-dependencies]
# Tests only: a test-only SQL function holds a running statement for the
# OFFLINE-02 deadline tests. `functions` adds no crate; release builds keep
# the feature set above.
rusqlite = { version = "0.32", features = ["backup", "functions"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
