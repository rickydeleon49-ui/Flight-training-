# Builds the macOS application and leaves a .dmg you can download.
#
# Manual trigger only. macOS runners bill at ten times the Linux rate, so
# this never fires on a push — start it from the Actions tab when you
# actually want a build.
name: Build macOS app

on:
  workflow_dispatch:
    inputs:
      universal:
        description: "Build a universal binary (Intel + Apple Silicon)"
        type: boolean
        default: false

jobs:
  build:
    # macos-14 and later are Apple Silicon runners.
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Add the Intel target for a universal build
        if: ${{ inputs.universal }}
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # The suite is fast and catches far more than the build does.
      - run: npm test

      - name: Build
        run: |
          if [ "${{ inputs.universal }}" = "true" ]; then
            npm run tauri build -- --target universal-apple-darwin
          else
            npm run tauri build
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: her-flight-deck-macos
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
