# Test builds, for checking a change compiles and packages on both platforms
# without publishing anything.
#
# To give someone an installer, push a version tag instead — see release.yml,
# which puts the files on the Releases page with instructions for her.
#
# Manual trigger only. macOS runners bill at ten times the Linux rate and
# Windows at twice, so this never fires on a push.
name: Build desktop app (test)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Which to build"
        type: choice
        options: [both, macos, windows]
        default: both

jobs:
  build-macos:
    name: macOS
    runs-on: macos-15
    timeout-minutes: 45
    if: inputs.platform == 'both' || inputs.platform == 'macos'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri
        timeout-minutes: 10
        continue-on-error: true
      - run: npm ci
      - run: npm test
      # The backup and restore guards live in Rust, so they have to run too.
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build
        run: npm run tauri build -- --bundles dmg
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: her-flight-deck-macOS
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  build-windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 60
    if: inputs.platform == 'both' || inputs.platform == 'windows'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri
        timeout-minutes: 10
        continue-on-error: true
      - run: npm ci
      - run: npm test
      # The backup and restore guards live in Rust, so they have to run too.
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build
        run: npm run tauri build -- --bundles nsis
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: her-flight-deck-Windows
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
