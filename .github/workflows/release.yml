# Publishes installers she can download and run.
#
# Two ways to start it:
#
#   From the browser  Actions -> Release -> Run workflow, and type the
#                     version. Nothing needs to be installed anywhere. The
#                     tag is created for you.
#
#   From a clone      scripts/release.sh 0.2.0, then push the tag.
#
# Either way it builds the macOS and Windows installers and attaches them to
# a GitHub Release with first-run instructions written for her.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.0 (must match the version in the repository)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The application backs her database up when it sees the version has
      # changed since the last run. A release whose built version disagrees
      # with the tag would skip that copy, so refuse to ship one.
      - name: Work out the version, and check everything agrees
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::Browser releases must be run from the main branch, not $GITHUB_REF_NAME."
            exit 1
          fi

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The selected commit is not part of main. Merge it before releasing."
            exit 1
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$VERSION' is not a version like 0.2.0"
            exit 1
          fi

          PKG=$(node -p "require('./package.json').version")
          LOCK=$(node -p "require('./package-lock.json').version")
          CONF=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CARGO=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "releasing=$VERSION package.json=$PKG package-lock.json=$LOCK tauri.conf.json=$CONF Cargo.toml=$CARGO"

          if [ "$VERSION" != "$PKG" ] || [ "$VERSION" != "$LOCK" ] || [ "$VERSION" != "$CONF" ] || [ "$VERSION" != "$CARGO" ]; then
            echo "::error::The repository is at $PKG but you asked for $VERSION. Bump it first with scripts/release.sh, or release $PKG."
            exit 1
          fi

          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::v$VERSION has already been released. Bump the version first."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm test

  build:
    name: ${{ matrix.name }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15          # Apple Silicon
            name: macOS
            bundles: dmg
            pattern: src-tauri/target/release/bundle/dmg/*.dmg
          - os: windows-latest
            name: Windows
            bundles: nsis
            pattern: src-tauri/target/release/bundle/nsis/*-setup.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      # Nothing gets published without the backup and restore guards passing.
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri build -- --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error

  publish:
    name: Publish
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: What we are shipping
        run: ls -lh installers

      - name: Write the release notes
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          {
            echo "## Her Flight Deck $VERSION"
            echo
            echo "Download the file for your computer and open it."
            echo
            echo "| Computer | File |"
            echo "| --- | --- |"
            echo "| Mac with Apple silicon | the \`.dmg\` |"
            echo "| Windows | the \`.exe\` |"
            echo
            echo "### The first time you open it"
            echo
            echo "The application is not signed with a paid certificate, so each"
            echo "system asks once whether you meant to open it. Nothing is wrong."
            echo
            echo "**On an Apple silicon Mac** — open the \`.dmg\`, drag Her Flight Deck to"
            echo "Applications, then open it from Applications. If it says the"
            echo "developer cannot be verified, go to **System Settings → Privacy &"
            echo "Security**, scroll down, and choose **Open Anyway**. You only do"
            echo "this once."
            echo
            echo "**On Windows** — run the \`.exe\`. If a blue \"Windows protected"
            echo "your PC\" box appears, choose **More info → Run anyway**. You only"
            echo "do this once."
            echo
            echo "### Updating"
            echo
            echo "Download the newer file and open it as before. Your goals,"
            echo "lessons, study materials, journal, questions and finances stay"
            echo "exactly as they were — and a safety copy of your database is"
            echo "taken automatically before a new version runs for the first time."
            echo
            echo "### Checksums"
            echo
            echo '```'
            ( cd installers && sha256sum * )
            echo '```'
          } > notes.md
          cat notes.md

      # --target creates the tag when it does not exist yet, which is what
      # makes releasing from the browser possible.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check.outputs.tag }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          gh release create "$TAG" \
            --title "Her Flight Deck $VERSION" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" \
            installers/*
          echo "Published: $(gh release view "$TAG" --json url --jq .url)"
