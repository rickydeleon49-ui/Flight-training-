# Builds installers and prepares them for release review.
#
# Two ways to start it:
#
#   From the browser  Actions -> Release -> Run workflow, and type the
#                     version. Nothing needs to be installed anywhere. The
#                     tag and an unpublished draft are created for you.
#
#   From a clone      scripts/release.sh 0.2.0, then push the tag.
#
# Either way it builds the macOS and Windows installers and attaches them to
# a private GitHub Release draft. The draft must be reviewed before anybody
# can download its installers.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to prepare as a private release draft, e.g. 0.1.0 (must match the version in the repository)"
        required: true
        type: string

permissions: {}

jobs:
  check:
    permissions:
      contents: read
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The application backs her database up when it sees the version has
      # changed since the last run. A release whose built version disagrees
      # with the tag would skip that copy, so refuse to ship one.
      - name: Work out the version, and check everything agrees
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::Browser releases must be run from the main branch, not $GITHUB_REF_NAME."
            exit 1
          fi

          MAIN_SHA=$(git rev-parse origin/main)
          if [ "$GITHUB_SHA" != "$MAIN_SHA" ]; then
            echo "::error::Release commit $GITHUB_SHA is not the current main head $MAIN_SHA."
            exit 1
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          node scripts/check-release-version.mjs "$VERSION"

          PKG=$(node -p "require('./package.json').version")
          LOCK=$(node -p "require('./package-lock.json').version")
          CONF=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CARGO=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "releasing=$VERSION package.json=$PKG package-lock.json=$LOCK tauri.conf.json=$CONF Cargo.toml=$CARGO"

          if [ "$VERSION" != "$PKG" ] || [ "$VERSION" != "$LOCK" ] || [ "$VERSION" != "$CONF" ] || [ "$VERSION" != "$CARGO" ]; then
            echo "::error::The repository is at $PKG but you asked for $VERSION. Bump it first with scripts/release.sh, or release $PKG."
            exit 1
          fi

          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::v$VERSION has already been released. Bump the version first."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm test

  build:
    permissions:
      contents: read
    name: ${{ matrix.name }}
    needs: check
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15          # Apple Silicon
            name: macOS
            bundles: dmg
            pattern: src-tauri/target/release/bundle/dmg/*.dmg
          - os: windows-latest
            name: Windows
            bundles: nsis
            pattern: src-tauri/target/release/bundle/nsis/*-setup.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri
        timeout-minutes: 10
        continue-on-error: true

      - run: npm ci
      # Nothing gets published without the backup and restore guards passing.
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri build -- --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: installer-${{ matrix.name }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error

  publish:
    permissions:
      contents: write
    name: Prepare release draft
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: installers
          merge-multiple: true

      - name: What we are shipping
        run: ls -lh installers

      - name: Write the release notes and checksums
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          {
            echo "## Her Flight Deck $VERSION"
            echo
            echo "Download the file for your computer and open it."
            echo
            echo "| Computer | File |"
            echo "| --- | --- |"
            echo "| Mac with Apple silicon | the \`.dmg\` |"
            echo "| Windows | the \`.exe\` |"
            echo
            echo "### Before publishing this draft"
            echo
            echo "Download and test the exact draft installers before publishing."
            echo "Confirm the Windows file is not detected by Microsoft Defender and"
            echo "confirm the Mac file installs and opens normally on an Apple silicon Mac."
            echo
            echo "Do not publish a release that asks people to disable or bypass platform"
            echo "security protections."
            echo
            echo "### Updating"
            echo
            echo "Download the newer file and open it as before. Your goals,"
            echo "lessons, study materials, journal, questions and finances stay"
            echo "exactly as they were — and a safety copy of your database is"
            echo "taken automatically before a new version runs for the first time."
            echo
            echo "### Checksums"
            echo
            echo '```'
            ( cd installers && sha256sum * )
            echo '```'
          } > notes.md
          ( cd installers && sha256sum * > SHA256SUMS.txt )
          cat notes.md

      # --target creates the tag when it does not exist yet, which is what
      # makes preparing a release from the browser possible. --draft means
      # the installers remain private until an owner explicitly publishes it
      # after reviewing the exact files.
      - name: Create a private release draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check.outputs.tag }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          gh release create "$TAG" \
            --draft \
            --title "Her Flight Deck $VERSION" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" \
            installers/*
          echo "Draft ready for review: $(gh release view "$TAG" --json url --jq .url)"
