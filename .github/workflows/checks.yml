# Every change gets checked before it reaches main.
#
# Linux only, and deliberately one job: the packaging workflows already build
# the real installers on macOS and Windows, and those runners bill at ten and
# two times the Linux rate. This is the cheap gate that catches a broken test,
# a type error, or a backup and restore guard that no longer holds.
#
# The TypeScript checks run first so an ordinary mistake fails in about a
# minute, before the slower Rust toolchain is set up at all.
#
# The Rust side is also formatted and linted here. There is no equivalent gate
# on the TypeScript yet — see the note in STATUS.md.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

# A newer push makes an older run pointless. Cancelling it keeps the minutes
# for changes that still matter.
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests, types, and the data-safety guards
    runs-on: ubuntu-latest
    # This job takes two minutes warm and about fifteen cold. The default is
    # six hours, which is how long a stuck run sat here before anyone noticed.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      # `npm run build` typechecks first, then produces the real frontend
      # bundle — which is also what the Rust side compiles against.
      - run: npm run build

      # Her backup and restore guards are Rust tests, and they need the same
      # system libraries a desktop build does.
      - name: Linux desktop libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libxdo-dev

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      # A cache is an optimization, and it must never be able to hold the build
      # up. GitHub's cache service stalled this step for forty-five minutes
      # without restoring anything or failing, so it is bounded and allowed to
      # lose: a cold compile is slow, a hung run tells you nothing at all.
      - uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri
        timeout-minutes: 10
        continue-on-error: true

      # Formatting and lint before the tests: both are seconds once the crate
      # is built, and both are the kind of drift nobody notices by reading.
      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Rust lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - run: cargo test --manifest-path src-tauri/Cargo.toml
