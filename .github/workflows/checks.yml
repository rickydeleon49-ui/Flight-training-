# Every change gets checked before it reaches main.
#
# Linux only: the packaging workflows already build the real installers on
# macOS and Windows, and those runners bill at ten and two times the Linux
# rate. This is the cheap gate that catches a broken test, a type error, or a
# backup and restore guard that no longer holds.
#
# The app (TypeScript) side and the Rust side run as two parallel jobs, so a
# full run takes as long as the slower one (Rust) instead of both added up.
# Every code change runs both sides in full; only a documentation-only pull
# request skips them. The final job keeps the old check name, so it is the
# one result to wait on.
#
# The Rust side is also formatted and linted here. There is no equivalent gate
# on the TypeScript yet.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

# A newer push makes an older run pointless. Cancelling it keeps the minutes
# for changes that still matter.
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only token: these jobs only check out, cache and upload artifacts.
permissions:
  contents: read

jobs:
  scope:
    name: Change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.filter.outputs.web }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      # Runs on every change, Markdown included: no local paths, account
      # names or personal email addresses may enter the public tree.
      - name: Public repository hygiene
        run: bash scripts/public-hygiene.sh

      # A documentation-only pull request skips both test jobs. Every other
      # change runs both sides in full.
      - name: Detect change scope
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          heavy=true
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$BASE_REF" --depth=1
            CHANGED=$(git diff --name-only "origin/$BASE_REF...HEAD")
            echo "Changed files in PR:"
            echo "$CHANGED"
            NON_DOCS=$(echo "$CHANGED" | grep -v -E '^(\.agents/|\.gemini/|docs/|.*\.md$|LICENSE(\.txt)?$)' || true)
            if [ -z "$NON_DOCS" ]; then
              echo "Only documentation/markdown changed. Skipping the test jobs."
              heavy=false
            fi
          fi
          echo "web=$heavy" >> "$GITHUB_OUTPUT"
          echo "rust=$heavy" >> "$GITHUB_OUTPUT"

  web:
    name: App tests and build
    needs: scope
    if: needs.scope.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Public users install this app, so a known high or critical advisory in
      # a package that ships in the bundle stops the change (PUB-R7).
      - name: npm dependency advisories (shipped packages)
        run: npm audit --omit=dev --audit-level=high

      - run: npm test

      # The 1,000-card Study Library tier (src/perf) runs alone, after the unit
      # suite, so its long renders never compete with it for the runner's cores.
      - name: Study Library perf tier
        run: npm run test:perf
        timeout-minutes: 10

      - name: Signed Mac build script refusals
        run: node --test scripts/build-signed-mac.test.mjs

      - name: Third-party notices generator regressions
        run: node --test scripts/third-party-notices.test.mjs

      # `npm run build` typechecks first, then produces the real frontend
      # bundle — which is also what the Rust side compiles against.
      - run: npm run build


  rust:
    name: Rust tests and the data-safety guards
    needs: scope
    if: needs.scope.outputs.rust == 'true'
    runs-on: ubuntu-latest
    # The Rust tests are most of a full run (about 25 minutes cold).
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # The Rust crate compiles against the built frontend (frontendDist), and
      # the lockfile and notices checks below are npm scripts.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # Her backup and restore guards are Rust tests, and they need the same
      # system libraries a desktop build does.
      - name: Linux desktop libraries
        # Usually under a minute; a slow mirror once took 29 and ate the job
        # limit. Give each try five minutes and retry instead of hanging.
        run: |
          for try in 1 2 3; do
            if timeout 300 sudo apt-get -o Acquire::Retries=3 update &&
               timeout 300 sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
                 libwebkit2gtk-4.1-dev \
                 libgtk-3-dev \
                 libayatana-appindicator3-dev \
                 librsvg2-dev \
                 libsoup-3.0-dev \
                 libxdo-dev; then
              exit 0
            fi
            echo "apt try $try failed or timed out; retrying"
          done
          exit 1

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      # A cache is an optimization, and it must never be able to hold the build
      # up. GitHub's cache service stalled this step for forty-five minutes
      # without restoring anything or failing, so it is bounded and allowed to
      # lose: a cold compile is slow, a hung run tells you nothing at all.
      - uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri
        timeout-minutes: 10
        continue-on-error: true

      # Formatting and lint before the tests: both are seconds once the crate
      # is built, and both are the kind of drift nobody notices by reading.
      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Rust lint
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Cargo lockfile synchronization check
        run: npm run test:cargo-lock

      # Regenerates public/THIRD_PARTY_NOTICES.txt from package-lock.json and
      # `cargo metadata` and fails if the committed file differs, so a new or
      # upgraded dependency cannot ship without its license notice.
      - name: Third-party notices are complete and current
        run: node scripts/third-party-notices.mjs --check

      # RustSec advisories for every crate in Cargo.lock (PUB-R7). The tool is
      # built from crates.io with its own lockfile; rust-cache keeps the binary
      # in ~/.cargo/bin, so warm runs skip the install.
      - name: Rust dependency advisories
        run: |
          cargo audit --version || cargo install cargo-audit --locked
          cargo audit --file src-tauri/Cargo.lock

  # The one result to wait on. Passes when every side that had to run passed;
  # a side skipped by the scope check counts as passed.
  checks:
    name: Tests, types, and the data-safety guards
    needs: [scope, web, rust]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All required sides passed
        env:
          RESULTS: ${{ needs.scope.result }} ${{ needs.web.result }} ${{ needs.rust.result }}
        run: |
          echo "scope web rust: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done
          test "${{ needs.scope.result }}" = success
